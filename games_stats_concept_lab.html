<script>
(function () {
'use strict';

let toastTid = null;
function showToast(msg, type) {
  const el = document.getElementById('scl-toast');
  if (!el) return;
  el.textContent = msg;
  el.className = 'scl-toast show' + (type ? ' ' + type : '');
  if (toastTid) clearTimeout(toastTid);
  toastTid = setTimeout(() => { el.className = 'scl-toast'; }, 2500);
}

function randn() {
  let u = 0, v = 0;
  while (u === 0) u = Math.random();
  while (v === 0) v = Math.random();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function normPdf(x, mu, s) {
  return Math.exp(-0.5 * Math.pow((x - mu) / s, 2)) / (s * Math.sqrt(2 * Math.PI));
}
function stdCdf(z) {
  const t = 1 / (1 + 0.2316419 * Math.abs(z));
  const d = 0.3989422804014327 * Math.exp(-z * z / 2);
  const p = d * t * (0.319381530 + t * (-0.356563782 + t * (1.781477937 + t * (-1.821255978 + t * 1.330274429))));
  return z >= 0 ? 1 - p : p;
}
const ZCONF = { 90: 1.645, 95: 1.96, 99: 2.576 };
let LOGF = null;
function logFact(n) {
  if (!LOGF) { LOGF = [0]; for (let i = 1; i <= 500; i++) LOGF[i] = LOGF[i - 1] + Math.log(i); }
  return LOGF[n];
}
function binomPmf(n, k, p) {
  if (k < 0 || k > n) return 0;
  if (p <= 0) return k === 0 ? 1 : 0;
  if (p >= 1) return k === n ? 1 : 0;
  return Math.exp(logFact(n) - logFact(k) - logFact(n - k) + k * Math.log(p) + (n - k) * Math.log(1 - p));
}
function binomCdf(n, k, p) {
  let s = 0;
  for (let i = 0; i <= k; i++) s += binomPmf(n, i, p);
  return Math.min(1, s);
}

const TABS = [
  { id: 'std', label: '① 표준화' },
  { id: 'binom', label: '② 이항분포의 정규근사' },
  { id: 'clt', label: '③ 표본평균의 분포' },
  { id: 'nvar', label: '④ 표본분산과 n−1' },
  { id: 'est', label: '⑤ 모평균·모비율의 추정' }
];

const StatsLab = {
  container: null,
  tab: 'std',
  state: {
    std: { mu: 60, sigma: 10, x: 75 },
    binom: { n: 30, p: 0.3, k: 10 },
    clt: { mu: 50, sigma: 12, n: 16, means: null },
    nvar: { n: 5, result: null },
    est: { mode: 'mean', n: 100, conf: 95, sim: null }
  },

  mount(container) {
    let host = null;
    if (typeof container === 'string') { try { host = document.querySelector(container); } catch (e) {} }
    else if (container instanceof HTMLElement) host = container;
    if (!host || !(host instanceof HTMLElement)) host = document.getElementById('mathlab-view') || document.getElementById('new-root');
    if (!host || !(host instanceof HTMLElement) || host === document.body) {
      let fh = document.getElementById('stats-concept-lab-force-host');
      if (!fh) { fh = document.createElement('div'); fh.id = 'stats-concept-lab-force-host'; document.body.appendChild(fh); }
      host = fh;
    }
    const footerEl = document.querySelector('footer, #footer, .app-footer');
    if (footerEl && footerEl.parentNode && typeof host.compareDocumentPosition === 'function' && (host.compareDocumentPosition(footerEl) & Node.DOCUMENT_POSITION_PRECEDING)) {
      footerEl.parentNode.insertBefore(host, footerEl);
    }
    host.style.display = '';
    host.style.visibility = 'visible';
    host.style.opacity = '1';
    host.style.minHeight = host.style.minHeight || '60vh';
    let parent = host.parentElement;
    while (parent && parent !== document.body && parent !== document.documentElement) {
      if (parent.style && parent.style.display === 'none') parent.style.display = 'block';
      if (parent.style && parent.style.visibility === 'hidden') parent.style.visibility = 'visible';
      parent = parent.parentElement;
    }
    this.container = host;
    this.render();
    this.bindEvents();
    this.showTab('std');
  },

  render() {
    this.container.innerHTML = `
      <div class="app-stats-concept-lab" id="scl-root">
        <div class="scl-header">
          <div class="scl-title">📈 통계 개념 탐구실</div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button class="scl-btn" id="scl-guide">📖 사용 방법</button>
            <button class="scl-btn" id="scl-home">🏠 홈</button>
          </div>
        </div>
        <div class="scl-tabs">
          ${TABS.map(t => '<button class="scl-tab-btn" data-tab="' + t.id + '">' + t.label + '</button>').join('')}
        </div>
        ${TABS.map(t => this.panelHtml(t.id)).join('')}
      </div>
      <div class="scl-modal" id="scl-guide-modal">
        <div class="scl-modal-box">
          <div class="scl-modal-title">📖 사용 방법</div>
          <div class="scl-guide-body">
            <p>이 앱은 통계 단원의 핵심 개념 5가지를 시뮬레이션으로 직접 확인하는 교과 개념 탐구 앱입니다.</p>
            <ul style="padding-left:18px;margin:8px 0">
              <li><strong>① 표준화</strong>: μ, σ, X를 조절하며 N(μ, σ²)이 N(0, 1)로 변환되는 과정과 확률 보존을 확인합니다.</li>
              <li><strong>② 이항분포의 정규근사</strong>: n, p를 조절하며 B(n, p)가 정규분포 곡선에 가까워지는 모습과 연속성 보정의 효과를 비교합니다.</li>
              <li><strong>③ 표본평균의 분포</strong>: 표본평균 1000개를 직접 추출해 X̄가 N(μ, σ²/n)을 따르는지 히스토그램으로 검증합니다.</li>
              <li><strong>④ 표본분산과 n−1</strong>: 반복 실험으로 n으로 나누면 모분산을 과소평가하고, n−1로 나누면 평균적으로 일치함을 확인합니다.</li>
              <li><strong>⑤ 모평균·모비율의 추정</strong>: 신뢰구간 100개를 만들어 신뢰도와 오차율의 의미를 시각적으로 이해합니다.</li>
            </ul>
            <p>각 탭 아래의 <strong>탐구 포인트</strong>에 답해보고, <strong>나의 정리 노트</strong>에 학습 내용을 기록·저장하세요. (노트는 이 기기에 저장됩니다)</p>
          </div>
          <div class="scl-modal-btns">
            <button class="scl-btn scl-btn-primary" id="scl-guide-close">닫기</button>
          </div>
        </div>
      </div>
      <div class="scl-toast" id="scl-toast"></div>`;
  },

  showTab(id) {
    this.tab = id;
    const root = document.getElementById('scl-root');
    if (!root) return;
    root.querySelectorAll('.scl-tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === id));
    root.querySelectorAll('.scl-panel').forEach(p => p.classList.toggle('show', p.id === 'scl-panel-' + id));
    this.sizeCanvas(id);
    this.loadNote(id);
    this.refresh(id);
  },

  sizeCanvas(id) {
    const cv = document.getElementById('scl-cv-' + id);
    if (!cv) return;
    const wrap = cv.parentElement;
    const w = Math.min(Math.max((wrap.clientWidth || 600) - 16, 320), 860);
    const h = Math.round(w * 0.46);
    if (cv.width !== w) { cv.width = w; cv.height = h; }
  },

  refresh(id) {
    if (id === 'std') this.refreshStd();
    else if (id === 'binom') this.refreshBinom();
    else if (id === 'clt') this.refreshClt();
    else if (id === 'nvar') this.refreshNvar();
    else if (id === 'est') this.refreshEst();
  },

  sliderHtml(tab, key, label, min, max, step, val, fmt) {
    const shown = fmt === 'p' ? Number(val).toFixed(2) : String(val);
    return '<label class="scl-slider">' + label + ' <span class="scl-val" id="scl-v-' + tab + '-' + key + '">' + shown + '</span>' +
      '<input type="range" class="scl-range" id="scl-range-' + tab + '-' + key + '" data-tab="' + tab + '" data-key="' + key + '" min="' + min + '" max="' + max + '" step="' + step + '" value="' + val + '"></label>';
  },

  noteHtml(id) {
    return '<div class="scl-note"><h4>📝 나의 정리 노트</h4>' +
      '<textarea id="scl-note-' + id + '" placeholder="이 개념에서 알게 된 것, 헷갈리는 것을 정리해보세요."></textarea>' +
      '<div class="scl-note-foot"><button class="scl-btn scl-btn-green scl-note-save" data-tab="' + id + '">💾 노트 저장</button></div></div>';
  },

  panelHtml(id) {
    if (id === 'std') {
      return `
      <div class="scl-panel" id="scl-panel-std">
        <div class="scl-concept">
          <h4>📐 표준화: N(μ, σ²) → N(0, 1)</h4>
          확률변수 X가 정규분포 N(μ, σ²)를 따를 때, 아래와 같이 변환한 Z는 표준정규분포 N(0, 1)을 따릅니다.
          <span class="scl-formula">Z = (X − μ) / σ</span>
          z는 "X가 평균에서 표준편차의 몇 배만큼 떨어져 있는가"를 뜻하며, 변환 전후에 넓이(확률)는 그대로 보존됩니다: <strong>P(X ≤ x) = P(Z ≤ z)</strong>. 덕분에 어떤 정규분포의 확률도 표준정규분포표 하나로 구할 수 있습니다.
        </div>
        <div class="scl-controls">
          ${this.sliderHtml('std', 'mu', 'μ (평균)', 0, 100, 5, 60)}
          ${this.sliderHtml('std', 'sigma', 'σ (표준편차)', 4, 20, 1, 10)}
          ${this.sliderHtml('std', 'x', 'X (관측값)', 0, 140, 1, 75)}
        </div>
        <div class="scl-readout" id="scl-read-std"></div>
        <div class="scl-canvas-wrap"><canvas id="scl-cv-std"></canvas></div>
        <div class="scl-quest"><h4>🔎 탐구 포인트</h4><ul>
          <li>X를 고정하고 σ를 키우면 z는 어떻게 변할까? 그 이유는?</li>
          <li>평균과 단위가 다른 두 시험 점수를 표준화하면 서로 비교할 수 있는 이유는 무엇일까?</li>
          <li>P(Z ≤ 1.96) ≈ 0.975가 되는 X의 값을 μ와 σ로 표현해보자.</li>
        </ul></div>
        ${this.noteHtml('std')}
      </div>`;
    }
    if (id === 'binom') {
      return `
      <div class="scl-panel" id="scl-panel-binom">
        <div class="scl-concept">
          <h4>🎲 이항분포 B(n, p)의 정규근사</h4>
          X ~ B(n, p)일 때 E(X) = np, V(X) = np(1−p)입니다. n이 충분히 클 때(np ≥ 5, n(1−p) ≥ 5) 이항분포는 정규분포로 근사됩니다.
          <span class="scl-formula">B(n, p) ≈ N(np, np(1−p))</span>
          이산확률(막대)을 연속확률(곡선 아래 넓이)로 바꿀 때는 막대 폭의 절반(0.5)을 더해주는 <strong>연속성 보정</strong>을 사용하면 더 정확합니다: P(X ≤ k) ≈ P(Z ≤ (k + 0.5 − np)/√(np(1−p))).
        </div>
        <div class="scl-controls">
          ${this.sliderHtml('binom', 'n', 'n (시행 횟수)', 10, 200, 5, 30)}
          ${this.sliderHtml('binom', 'p', 'p (성공 확률)', 0.05, 0.95, 0.05, 0.3, 'p')}
          ${this.sliderHtml('binom', 'k', 'k (P(X ≤ k)의 k)', 0, 30, 1, 10)}
        </div>
        <div class="scl-readout" id="scl-read-binom"></div>
        <div class="scl-canvas-wrap"><canvas id="scl-cv-binom"></canvas></div>
        <div class="scl-quest"><h4>🔎 탐구 포인트</h4><ul>
          <li>n을 점점 크게 하면 막대의 모양은 어떻게 변하는가?</li>
          <li>p = 0.5일 때와 p = 0.1일 때의 대칭성을 비교해보자. 어느 쪽이 더 작은 n에서도 잘 맞을까?</li>
          <li>연속성 보정(+0.5)을 뺀 값과 넣은 값의 오차를 비교해보자. 언제 차이가 크게 나는가?</li>
        </ul></div>
        ${this.noteHtml('binom')}
      </div>`;
    }
    if (id === 'clt') {
      return `
      <div class="scl-panel" id="scl-panel-clt">
        <div class="scl-concept">
          <h4>📊 표본평균 X̄의 분포</h4>
          모집단이 N(μ, σ²)를 따를 때, 크기 n인 표본을 뽑아 만든 표본평균 X̄도 정규분포를 따릅니다.
          <span class="scl-formula">X̄ ~ N(μ, σ²/n),   σ(X̄) = σ/√n (표준오차)</span>
          표본평균은 여러 값의 평균이므로 극단값이 서로 상쇄되어, n이 커질수록 μ 주위에 좁게 몰립니다. 아래에서 표본평균 1000개를 직접 뽑아 이론 곡선 N(μ, σ²/n)과 비교해보세요.
        </div>
        <div class="scl-controls">
          ${this.sliderHtml('clt', 'mu', 'μ (모평균)', 30, 70, 1, 50)}
          ${this.sliderHtml('clt', 'sigma', 'σ (모표준편차)', 5, 20, 1, 12)}
          ${this.sliderHtml('clt', 'n', 'n (표본의 크기)', 1, 100, 1, 16)}
          <button class="scl-btn scl-btn-primary" id="scl-clt-run">🎲 표본평균 1000개 추출</button>
        </div>
        <div class="scl-readout" id="scl-read-clt"></div>
        <div class="scl-canvas-wrap"><canvas id="scl-cv-clt"></canvas></div>
        <div class="scl-quest"><h4>🔎 탐구 포인트</h4><ul>
          <li>n을 4배로 늘리면 분포의 폭(표준오차)은 몇 배가 될까? 직접 확인해보자.</li>
          <li>표본평균의 분포가 모집단 분포보다 좁은 이유는 무엇일까?</li>
          <li>n = 1일 때 표본평균의 분포는 무엇과 같아질까?</li>
        </ul></div>
        ${this.noteHtml('clt')}
      </div>`;
    }
    if (id === 'nvar') {
      return `
      <div class="scl-panel" id="scl-panel-nvar">
        <div class="scl-concept">
          <h4>➗ 표본분산은 왜 n−1로 나눌까?</h4>
          표본분산은 편차를 모평균 μ가 아니라 표본평균 X̄로 재기 때문에, 편차제곱합 SS = Σ(Xᵢ − X̄)²이 실제보다 작게 측정되는 경향이 있습니다. (X̄는 자료들 한가운데로 끌려가 있기 때문)
          <span class="scl-formula">E[Σ(Xᵢ − X̄)²] = (n − 1)σ²  →  S² = SS / (n − 1) 이어야 E[S²] = σ²</span>
          즉 SS를 n으로 나누면 모분산을 평균적으로 (n−1)/n배만큼 과소평가하고, n−1로 나누면 평균적으로 정확히 σ²이 되는 <strong>불편추정량</strong>이 됩니다. 아래 실험으로 직접 확인해보세요. (모집단: N(50, 10²), σ² = 100)
        </div>
        <div class="scl-controls">
          ${this.sliderHtml('nvar', 'n', 'n (표본의 크기)', 2, 20, 1, 5)}
          <button class="scl-btn scl-btn-primary" id="scl-nvar-run">🔁 5000회 반복 실험</button>
        </div>
        <div class="scl-readout" id="scl-read-nvar"></div>
        <div class="scl-canvas-wrap"><canvas id="scl-cv-nvar"></canvas></div>
        <div class="scl-quest"><h4>🔎 탐구 포인트</h4><ul>
          <li>SS/n의 평균(빨간 막대)은 σ² = 100보다 항상 작게 나오는가? 이론값 100(n−1)/n과 비교해보자.</li>
          <li>n이 커질수록 두 방법의 차이는 어떻게 변하는가? 그 이유는?</li>
          <li>편차를 μ로 재면 n으로 나눠도 될까? 자유도의 관점에서 생각해보자.</li>
        </ul></div>
        ${this.noteHtml('nvar')}
      </div>`;
    }
    return `
      <div class="scl-panel" id="scl-panel-est">
        <div class="scl-concept">
          <h4>🎯 모평균·모비율의 추정</h4>
          모집단 전체를 조사할 수 없을 때, 표본으로부터 모수(모평균 m, 모비율 p)를 구간으로 추정합니다.
          <span class="scl-formula">모평균 (σ를 알 때): x̄ − z·σ/√n ≤ m ≤ x̄ + z·σ/√n</span>
          <span class="scl-formula">모비율: p̂ − z·√(p̂(1−p̂)/n) ≤ p ≤ p̂ + z·√(p̂(1−p̂)/n)  (p̂ = X/n)</span>
          신뢰도 95%의 뜻: <strong>같은 방법으로 신뢰구간을 반복해서 만들면 그중 약 95%가 참값을 포함</strong>한다는 의미입니다. 빗나가는 비율(약 5%)이 오차율이고, z·σ/√n을 오차한계라고 합니다. (z: 90% → 1.645, 95% → 1.96, 99% → 2.576)
        </div>
        <div class="scl-controls">
          <div class="scl-slider" style="flex:0 0 auto;min-width:150px">추정 대상
            <div style="display:flex;gap:6px;margin-top:2px">
              <button class="scl-btn scl-btn-primary" id="scl-est-mean">모평균</button>
              <button class="scl-btn" id="scl-est-prop">모비율</button>
            </div>
          </div>
          ${this.sliderHtml('est', 'n', 'n (표본의 크기)', 10, 400, 10, 100)}
          <label class="scl-slider" style="flex:0 0 auto;min-width:120px">신뢰도
            <select class="scl-select" id="scl-est-conf">
              <option value="90">90%</option>
              <option value="95" selected>95%</option>
              <option value="99">99%</option>
            </select>
          </label>
          <button class="scl-btn scl-btn-primary" id="scl-est-run">📏 신뢰구간 100개 만들기</button>
        </div>
        <div class="scl-readout" id="scl-read-est"></div>
        <div class="scl-canvas-wrap"><canvas id="scl-cv-est"></canvas></div>
        <div class="scl-quest"><h4>🔎 탐구 포인트</h4><ul>
          <li>n을 4배로 키우면 구간의 길이는 어떻게 변하는가? (오차한계는 √n에 반비례)</li>
          <li>신뢰도를 99%로 올리면 구간의 길이와 빗나간 개수는 각각 어떻게 달라지는가?</li>
          <li>"이 구간이 m을 포함할 확률이 95%"라는 표현이 왜 조심스러운지 시뮬레이션 결과로 설명해보자.</li>
        </ul></div>
        ${this.noteHtml('est')}
      </div>`;
  },

  refreshStd() {
    const s = this.state.std;
    const z = (s.x - s.mu) / s.sigma;
    const pr = stdCdf(z);
    const el = document.getElementById('scl-read-std');
    if (el) el.innerHTML = 'z = (X − μ) / σ = (' + s.x + ' − ' + s.mu + ') / ' + s.sigma + ' = <strong>' + z.toFixed(2) + '</strong>' +
      ' &nbsp;|&nbsp; X는 평균보다 ' + Math.abs(z).toFixed(2) + 'σ만큼 ' + (z >= 0 ? '큽니다' : '작습니다') +
      '<br>P(X ≤ ' + s.x + ') = P(Z ≤ ' + z.toFixed(2) + ') = <strong>' + (pr * 100).toFixed(1) + '%</strong> — 두 그래프의 색칠된 넓이가 같습니다.';
    this.drawStd();
  },

  drawStd() {
    const cv = document.getElementById('scl-cv-std');
    if (!cv) return;
    const ctx = cv.getContext('2d');
    const W = cv.width; const H = cv.height;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H);
    const s = this.state.std;
    const z = (s.x - s.mu) / s.sigma;
    const baseY = H - 30; const peakH = H - 78;
    const half = (W - 60) / 2;
    const drawOne = (x0, mu, sigma, marker, title, color, name) => {
      const lo = mu - 4 * sigma; const hi = mu + 4 * sigma;
      const toPx = x => x0 + ((x - lo) / (hi - lo)) * half;
      const pdfY = x => baseY - (normPdf(x, mu, sigma) / normPdf(mu, mu, sigma)) * peakH;
      const mk = Math.max(lo, Math.min(hi, marker));
      ctx.beginPath(); ctx.moveTo(toPx(lo), baseY);
      for (let i = 0; i <= 200; i++) { const x = lo + (i / 200) * (mk - lo); ctx.lineTo(toPx(x), pdfY(x)); }
      ctx.lineTo(toPx(mk), baseY); ctx.closePath();
      ctx.fillStyle = 'rgba(2, 132, 199, 0.18)'; ctx.fill();
      ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(x0 - 4, baseY); ctx.lineTo(x0 + half + 4, baseY); ctx.stroke();
      ctx.beginPath();
      for (let i = 0; i <= 240; i++) {
        const x = lo + (i / 240) * (hi - lo);
        const px = toPx(x); const py = pdfY(x);
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.strokeStyle = color; ctx.lineWidth = 2.5; ctx.stroke();
      ctx.font = '11px sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#64748b';
      [-2, 0, 2].forEach(kk => {
        const x = mu + kk * sigma; const px = toPx(x);
        ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(px, baseY); ctx.lineTo(px, baseY + 4); ctx.stroke();
        ctx.fillText(String(Math.round(x * 100) / 100), px, baseY + 16);
      });
      ctx.setLineDash([5, 4]); ctx.strokeStyle = '#d97706'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(toPx(mk), baseY); ctx.lineTo(toPx(mk), baseY - peakH - 6); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = '#b45309'; ctx.font = 'bold 11px sans-serif';
      ctx.fillText(title, toPx(mk), baseY - peakH - 12);
      ctx.fillStyle = '#334155'; ctx.font = 'bold 12px sans-serif';
      ctx.fillText(name, x0 + half / 2, 16);
    };
    drawOne(20, s.mu, s.sigma, s.x, 'X = ' + s.x, '#0284c7', 'N(' + s.mu + ', ' + s.sigma + '²)');
    drawOne(40 + half, 0, 1, z, 'z = ' + z.toFixed(2), '#7c3aed', 'N(0, 1)');
    ctx.fillStyle = '#7c3aed'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('➜', W / 2, H / 2);
    ctx.font = '10px sans-serif';
    ctx.fillText('표준화', W / 2, H / 2 + 14);
  },

  refreshBinom() {
    const s = this.state.binom;
    const m = s.n * s.p; const v = s.n * s.p * (1 - s.p); const sd = Math.sqrt(v);
    const exact = binomCdf(s.n, s.k, s.p);
    const apCC = stdCdf((s.k + 0.5 - m) / sd);
    const apNo = stdCdf((s.k - m) / sd);
    const okNp = m >= 5; const okNq = s.n * (1 - s.p) >= 5;
    const el = document.getElementById('scl-read-binom');
    if (el) el.innerHTML =
      'E(X) = np = <strong>' + m.toFixed(1) + '</strong>, V(X) = np(1−p) = <strong>' + v.toFixed(1) + '</strong> (√V = ' + sd.toFixed(2) + ') &nbsp;' +
      '<span class="scl-badge ' + (okNp ? 'ok' : 'warn') + '">np = ' + m.toFixed(1) + (okNp ? ' ≥ 5' : ' < 5') + '</span> ' +
      '<span class="scl-badge ' + (okNq ? 'ok' : 'warn') + '">n(1−p) = ' + (s.n * (1 - s.p)).toFixed(1) + (okNq ? ' ≥ 5' : ' < 5') + '</span>' +
      '<br>P(X ≤ ' + s.k + ') 이항분포 정확값 = <strong>' + exact.toFixed(4) + '</strong>' +
      ' | 정규근사(보정 O) = <strong>' + apCC.toFixed(4) + '</strong> (오차 ' + Math.abs(exact - apCC).toFixed(4) + ')' +
      ' | 정규근사(보정 X) = ' + apNo.toFixed(4) + ' (오차 ' + Math.abs(exact - apNo).toFixed(4) + ')';
    this.drawBinom();
  },

  drawBinom() {
    const cv = document.getElementById('scl-cv-binom');
    if (!cv) return;
    const ctx = cv.getContext('2d');
    const W = cv.width; const H = cv.height;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H);
    const s = this.state.binom;
    const m = s.n * s.p; const sd = Math.sqrt(s.n * s.p * (1 - s.p));
    const lo = Math.max(0, Math.floor(m - 4 * sd));
    const hi = Math.min(s.n, Math.ceil(m + 4 * sd));
    const count = hi - lo + 1;
    const padL = 34; const padR = 16; const baseY = H - 30; const peakH = H - 66;
    const plotW = W - padL - padR;
    const bw = plotW / count;
    let maxP = 0;
    const pmf = [];
    for (let k = lo; k <= hi; k++) { const q = binomPmf(s.n, k, s.p); pmf.push(q); if (q > maxP) maxP = q; }
    if (maxP <= 0) maxP = 1;
    for (let i = 0; i < count; i++) {
      const k = lo + i;
      const h = (pmf[i] / maxP) * peakH;
      ctx.fillStyle = k <= s.k ? 'rgba(2, 132, 199, 0.75)' : 'rgba(148, 163, 184, 0.45)';
      ctx.fillRect(padL + i * bw + 0.5, baseY - h, Math.max(1, bw - 1), h);
    }
    ctx.beginPath();
    for (let i = 0; i <= 260; i++) {
      const x = (lo - 0.5) + (i / 260) * count;
      const y = baseY - (normPdf(x, m, sd) / maxP) * peakH;
      const px = padL + ((x - (lo - 0.5)) / count) * plotW;
      if (i === 0) ctx.moveTo(px, y); else ctx.lineTo(px, y);
    }
    ctx.strokeStyle = '#7c3aed'; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(padL - 6, baseY); ctx.lineTo(W - padR + 6, baseY); ctx.stroke();
    ctx.font = '11px sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#64748b';
    const stepT = Math.max(1, Math.round(count / 6));
    for (let k = lo; k <= hi; k += stepT) {
      ctx.fillText(String(k), padL + (k - lo + 0.5) * bw, baseY + 16);
    }
    ctx.textAlign = 'left'; ctx.fillStyle = '#334155'; ctx.font = 'bold 12px sans-serif';
    ctx.fillText('막대: B(' + s.n + ', ' + s.p.toFixed(2) + ')  /  곡선: N(' + m.toFixed(1) + ', ' + (sd * sd).toFixed(1) + ')  /  진한 막대: X ≤ ' + s.k, padL, 16);
  },

  refreshClt() {
    const s = this.state.clt;
    const se = s.sigma / Math.sqrt(s.n);
    const el = document.getElementById('scl-read-clt');
    let html = '이론: X̄ ~ N(' + s.mu + ', (' + s.sigma + '/√' + s.n + ')²) → E(X̄) = <strong>' + s.mu + '</strong>, 표준오차 σ/√n = <strong>' + se.toFixed(3) + '</strong>';
    if (s.means) {
      const N = s.means.length;
      const mean = s.means.reduce((a, b) => a + b, 0) / N;
      const sdv = Math.sqrt(s.means.reduce((a, b) => a + (b - mean) * (b - mean), 0) / (N - 1));
      html += '<br>시뮬레이션(1000개): 평균 = <strong>' + mean.toFixed(3) + '</strong>, 표준편차 = <strong>' + sdv.toFixed(3) + '</strong> — 이론값과 비교해보세요.';
    } else {
      html += '<br>아직 표본을 뽑지 않았습니다. <strong>🎲 표본평균 1000개 추출</strong> 버튼을 눌러보세요.';
    }
    if (el) el.innerHTML = html;
    this.drawClt();
  },

  drawClt() {
    const cv = document.getElementById('scl-cv-clt');
    if (!cv) return;
    const ctx = cv.getContext('2d');
    const W = cv.width; const H = cv.height;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H);
    const s = this.state.clt;
    const se = s.sigma / Math.sqrt(s.n);
    const lo = s.mu - 4.2 * se; const hi = s.mu + 4.2 * se;
    const padL = 34; const padR = 16; const baseY = H - 30; const peakH = H - 66;
    const plotW = W - padL - padR;
    const toPx = x => padL + ((x - lo) / (hi - lo)) * plotW;
    const theoryMax = normPdf(s.mu, s.mu, se);
    let scaleMax = theoryMax;
    let bars = null; let binW = 0;
    if (s.means) {
      const B = 36;
      binW = (hi - lo) / B;
      const cnt = new Array(B).fill(0);
      s.means.forEach(v0 => { const bi = Math.floor((v0 - lo) / binW); if (bi >= 0 && bi < B) cnt[bi]++; });
      bars = cnt.map(c => c / (s.means.length * binW));
      const bMax = Math.max.apply(null, bars);
      if (bMax > scaleMax) scaleMax = bMax;
    }
    const yOf = d => baseY - (d / scaleMax) * peakH;
    if (bars) {
      ctx.fillStyle = 'rgba(2, 132, 199, 0.4)';
      bars.forEach((d, i) => {
        const x1 = toPx(lo + i * binW); const x2 = toPx(lo + (i + 1) * binW);
        ctx.fillRect(x1 + 0.5, yOf(d), Math.max(1, x2 - x1 - 1), baseY - yOf(d));
      });
    }
    ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(padL - 6, baseY); ctx.lineTo(W - padR + 6, baseY); ctx.stroke();
    ctx.beginPath();
    for (let i = 0; i <= 260; i++) {
      const x = lo + (i / 260) * (hi - lo);
      const px = toPx(x); const py = yOf(normPdf(x, s.mu, se));
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.strokeStyle = '#7c3aed'; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.setLineDash([5, 4]); ctx.strokeStyle = '#d97706'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(toPx(s.mu), baseY); ctx.lineTo(toPx(s.mu), baseY - peakH - 4); ctx.stroke();
    ctx.setLineDash([]);
    ctx.font = '11px sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#64748b';
    [-4, -2, 0, 2, 4].forEach(kk => {
      const x = s.mu + kk * se;
      ctx.fillText((Math.round(x * 100) / 100).toFixed(2), toPx(x), baseY + 16);
    });
    ctx.textAlign = 'left'; ctx.fillStyle = '#334155'; ctx.font = 'bold 12px sans-serif';
    ctx.fillText((bars ? '히스토그램: 표본평균 1000개  /  ' : '') + '곡선: 이론 N(' + s.mu + ', (' + s.sigma + '/√' + s.n + ')²)', padL, 16);
  },

  refreshNvar() {
    const s = this.state.nvar;
    const theory = 100 * (s.n - 1) / s.n;
    const el = document.getElementById('scl-read-nvar');
    let html = '모집단: N(50, 10²) → σ² = <strong>100</strong> | n = ' + s.n +
      ' | 이론 예측: E[SS/n] = σ²(n−1)/n = <strong>' + theory.toFixed(1) + '</strong>, E[SS/(n−1)] = <strong>100</strong>';
    if (s.result) {
      html += '<br>실험 결과(5000회 평균): SS/n = <strong>' + s.result.biased.toFixed(2) + '</strong> (σ²를 약 ' + (100 - s.result.biased).toFixed(1) + '만큼 과소평가), SS/(n−1) = <strong>' + s.result.unbiased.toFixed(2) + '</strong> (≈ 100)';
    } else {
      html += '<br>아직 실험 전입니다. <strong>🔁 5000회 반복 실험</strong> 버튼을 눌러 직접 확인해보세요.';
    }
    if (el) el.innerHTML = html;
    this.drawNvar();
  },

  drawNvar() {
    const cv = document.getElementById('scl-cv-nvar');
    if (!cv) return;
    const ctx = cv.getContext('2d');
    const W = cv.width; const H = cv.height;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H);
    const s = this.state.nvar;
    const r = s.result;
    const theory = 100 * (s.n - 1) / s.n;
    const items = [
      { label: '모분산 σ²', val: 100, color: '#64748b', solid: true },
      { label: 'SS/n 평균' + (r ? '' : ' (이론 예측)'), val: r ? r.biased : theory, color: '#dc2626', solid: !!r },
      { label: 'SS/(n−1) 평균' + (r ? '' : ' (이론 예측)'), val: r ? r.unbiased : 100, color: '#059669', solid: !!r }
    ];
    const padL = 40; const baseY = H - 44; const peakH = H - 84;
    const yMax = 120;
    const colW = (W - padL - 20) / 3;
    const bw = Math.min(120, colW - 30);
    items.forEach((it, i) => {
      const cx = padL + (i + 0.5) * colW;
      const h = (it.val / yMax) * peakH;
      ctx.globalAlpha = it.solid ? 1 : 0.35;
      ctx.fillStyle = it.color;
      ctx.fillRect(cx - bw / 2, baseY - h, bw, h);
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#0f172a'; ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(it.val.toFixed(1), cx, baseY - h - 8);
      ctx.fillStyle = '#475569'; ctx.font = '11px sans-serif';
      ctx.fillText(it.label, cx, baseY + 18);
    });
    const yS = baseY - (100 / yMax) * peakH;
    ctx.setLineDash([6, 4]); ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(padL - 24, yS); ctx.lineTo(W - 12, yS); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#0f172a'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'left';
    ctx.fillText('σ² = 100', padL - 24, yS - 6);
    ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(padL - 28, baseY); ctx.lineTo(W - 10, baseY); ctx.stroke();
  },

  refreshEst() {
    const s = this.state.est;
    const z = ZCONF[s.conf];
    const el = document.getElementById('scl-read-est');
    let html;
    if (s.mode === 'mean') {
      const half = z * 10 / Math.sqrt(s.n);
      html = '모집단: N(50, 10²), σ = 10을 아는 상황 | z = ' + z + ' | 오차한계 z·σ/√n = <strong>' + half.toFixed(3) + '</strong> → 구간의 길이 ' + (2 * half).toFixed(3);
    } else {
      const half = z * Math.sqrt(0.4 * 0.6 / s.n);
      html = '모집단 비율 p = 0.4 | z = ' + z + ' | 오차한계 z·√(p̂(1−p̂)/n) ≈ <strong>' + half.toFixed(4) + '</strong> → 구간의 길이 ≈ ' + (2 * half).toFixed(4);
    }
    if (s.sim) {
      html += '<br>결과: 100개 중 <strong>' + (100 - s.sim.miss) + '개</strong>가 참값을 포함, <strong>' + s.sim.miss + '개</strong>가 빗나감 → 실제 오차율 <strong>' + s.sim.miss + '%</strong> (이론 오차율 ' + (100 - s.conf) + '%)';
    } else {
      html += '<br>버튼을 눌러 신뢰구간 100개를 만들어보세요. 신뢰도 ' + s.conf + '% → 약 ' + (100 - s.conf) + '개 정도가 빗나갈 것으로 예상됩니다.';
    }
    if (el) el.innerHTML = html;
    this.drawEst();
  },

  drawEst() {
    const cv = document.getElementById('scl-cv-est');
    if (!cv) return;
    const ctx = cv.getContext('2d');
    const W = cv.width; const H = cv.height;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H);
    const sim = this.state.est.sim;
    if (!sim) {
      ctx.fillStyle = '#94a3b8'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('📏 신뢰구간 100개 만들기 버튼을 눌러 시뮬레이션을 시작하세요', W / 2, H / 2);
      return;
    }
    let ylo = Infinity; let yhi = -Infinity;
    sim.cis.forEach(c => { if (c.lo < ylo) ylo = c.lo; if (c.hi > yhi) yhi = c.hi; });
    const margin = (yhi - ylo) * 0.1 || 1;
    ylo -= margin; yhi += margin;
    const padL = 46; const padR = 12; const padT = 26; const padB = 18;
    const toY = v0 => padT + (1 - (v0 - ylo) / (yhi - ylo)) * (H - padT - padB);
    const stepX = (W - padL - padR) / sim.cis.length;
    sim.cis.forEach((c, i) => {
      const x = padL + (i + 0.5) * stepX;
      ctx.strokeStyle = c.hit ? 'rgba(2, 132, 199, 0.75)' : '#dc2626';
      ctx.lineWidth = c.hit ? 2 : 2.5;
      ctx.beginPath(); ctx.moveTo(x, toY(c.lo)); ctx.lineTo(x, toY(c.hi)); ctx.stroke();
    });
    const ty = toY(sim.truth);
    ctx.setLineDash([6, 4]); ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(padL - 34, ty); ctx.lineTo(W - padR, ty); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#0f172a'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'left';
    ctx.fillText('참값 ' + sim.truth, 6, ty - 5);
    ctx.fillStyle = '#334155'; ctx.font = 'bold 12px sans-serif';
    ctx.fillText('파란 구간: 참값 포함  /  빨간 구간: 빗나감 (' + sim.miss + '개)', padL, 15);
  },

  runClt() {
    const s = this.state.clt;
    const N = 1000;
    const means = new Array(N);
    for (let i = 0; i < N; i++) {
      let sum = 0;
      for (let j = 0; j < s.n; j++) sum += s.mu + s.sigma * randn();
      means[i] = sum / s.n;
    }
    s.means = means;
    this.refresh('clt');
    showToast('🎲 표본평균 1000개 추출 완료', 'ok');
  },

  runNvar() {
    const s = this.state.nvar;
    const R = 5000;
    let sb = 0; let su = 0;
    for (let r = 0; r < R; r++) {
      let sum = 0;
      const xs = new Array(s.n);
      for (let j = 0; j < s.n; j++) { xs[j] = 50 + 10 * randn(); sum += xs[j]; }
      const mean = sum / s.n;
      let ss = 0;
      for (let j = 0; j < s.n; j++) ss += (xs[j] - mean) * (xs[j] - mean);
      sb += ss / s.n;
      su += ss / (s.n - 1);
    }
    s.result = { biased: sb / R, unbiased: su / R };
    this.refresh('nvar');
    showToast('🔁 5000회 실험 완료', 'ok');
  },

  runEst() {
    const s = this.state.est;
    const z = ZCONF[s.conf];
    const cis = [];
    let miss = 0;
    let truth;
    if (s.mode === 'mean') {
      truth = 50;
      for (let i = 0; i < 100; i++) {
        let sum = 0;
        for (let j = 0; j < s.n; j++) sum += 50 + 10 * randn();
        const xb = sum / s.n;
        const half = z * 10 / Math.sqrt(s.n);
        const c = { lo: xb - half, hi: xb + half };
        c.hit = c.lo <= truth && truth <= c.hi;
        if (!c.hit) miss++;
        cis.push(c);
      }
    } else {
      truth = 0.4;
      for (let i = 0; i < 100; i++) {
        let cnt = 0;
        for (let j = 0; j < s.n; j++) if (Math.random() < 0.4) cnt++;
        const ph = cnt / s.n;
        const half = z * Math.sqrt(Math.max(ph * (1 - ph), 0.0001) / s.n);
        const c = { lo: ph - half, hi: ph + half };
        c.hit = c.lo <= truth && truth <= c.hi;
        if (!c.hit) miss++;
        cis.push(c);
      }
    }
    s.sim = { cis: cis, truth: truth, miss: miss };
    this.refresh('est');
    showToast('📏 신뢰구간 100개 생성 — ' + (100 - miss) + '개가 참값을 포함', 'ok');
  },

  noteKey(id) { return 'scl_note_' + id; },

  loadNote(id) {
    const ta = document.getElementById('scl-note-' + id);
    if (!ta) return;
    try { ta.value = localStorage.getItem(this.noteKey(id)) || ''; } catch (e) {}
  },

  saveNote(id) {
    const ta = document.getElementById('scl-note-' + id);
    if (!ta) return;
    try {
      localStorage.setItem(this.noteKey(id), ta.value);
      showToast('💾 정리 노트 저장 완료', 'ok');
    } catch (e) {
      showToast('⚠️ 노트 저장에 실패했습니다', 'err');
    }
  },

  bindEvents() {
    const root = document.getElementById('scl-root');
    if (!root || root.dataset.sclBound === '1') return;
    root.dataset.sclBound = '1';
    root.querySelectorAll('.scl-tab-btn').forEach(btn => {
      btn.addEventListener('click', () => this.showTab(btn.dataset.tab));
    });
    root.querySelectorAll('.scl-range').forEach(inp => {
      inp.addEventListener('input', () => {
        const tab = inp.dataset.tab; const key = inp.dataset.key;
        const v0 = parseFloat(inp.value);
        this.state[tab][key] = v0;
        const vs = document.getElementById('scl-v-' + tab + '-' + key);
        if (vs) vs.textContent = key === 'p' ? v0.toFixed(2) : String(v0);
        if (tab === 'binom' && key === 'n') {
          const ks = document.getElementById('scl-range-binom-k');
          if (ks) {
            ks.max = String(v0);
            if (this.state.binom.k > v0) {
              this.state.binom.k = v0;
              ks.value = String(v0);
              const kv = document.getElementById('scl-v-binom-k');
              if (kv) kv.textContent = String(v0);
            }
          }
        }
        if (tab === 'clt') this.state.clt.means = null;
        if (tab === 'nvar') this.state.nvar.result = null;
        if (tab === 'est') this.state.est.sim = null;
        this.refresh(tab);
      });
    });
    const on = (id, fn) => { const el = document.getElementById(id); if (el) el.addEventListener('click', fn); };
    on('scl-clt-run', () => this.runClt());
    on('scl-nvar-run', () => this.runNvar());
    on('scl-est-run', () => this.runEst());
    const setMode = m => {
      this.state.est.mode = m;
      this.state.est.sim = null;
      const bm = document.getElementById('scl-est-mean');
      const bp = document.getElementById('scl-est-prop');
      if (bm) bm.classList.toggle('scl-btn-primary', m === 'mean');
      if (bp) bp.classList.toggle('scl-btn-primary', m === 'prop');
      this.refresh('est');
    };
    on('scl-est-mean', () => setMode('mean'));
    on('scl-est-prop', () => setMode('prop'));
    const conf = document.getElementById('scl-est-conf');
    if (conf) conf.addEventListener('change', () => {
      this.state.est.conf = parseInt(conf.value, 10);
      this.state.est.sim = null;
      this.refresh('est');
    });
    root.querySelectorAll('.scl-note-save').forEach(btn => {
      btn.addEventListener('click', () => this.saveNote(btn.dataset.tab));
    });
    on('scl-guide', () => { const m = document.getElementById('scl-guide-modal'); if (m) m.classList.add('show'); });
    on('scl-guide-close', () => { const m = document.getElementById('scl-guide-modal'); if (m) m.classList.remove('show'); });
    on('scl-home', () => this.goHome());
    window.addEventListener('resize', () => { this.sizeCanvas(this.tab); this.refresh(this.tab); });
  },

  resetAll() {
    this.state = {
      std: { mu: 60, sigma: 10, x: 75 },
      binom: { n: 30, p: 0.3, k: 10 },
      clt: { mu: 50, sigma: 12, n: 16, means: null },
      nvar: { n: 5, result: null },
      est: { mode: 'mean', n: 100, conf: 95, sim: null }
    };
    if (this.container) {
      this.render();
      this.bindEvents();
      this.showTab('std');
    }
  },

  goHome() {
    const mv = document.getElementById('mathlab-view');
    if (mv) { mv.style.display = 'none'; mv.innerHTML = ''; }
    const fh = document.getElementById('stats-concept-lab-force-host');
    if (fh) { fh.style.display = 'none'; fh.innerHTML = ''; }
    try {
      
    } catch (e) {}
    const ag = document.querySelector('.app-grid');
    if (ag) ag.style.display = '';
    const ds = document.getElementById('dashboard-screen');
    if (ds) ds.style.display = '';
    if (typeof window.goHome === 'function') window.goHome();
  },

  destroy() {
    if (this.container) this.container.innerHTML = '';
  }
};

function registerStatsConceptLab() {
  if (typeof window.MathLabGames === 'undefined' || typeof window.MathLabGames.register !== 'function') return;
  try {
    if (typeof window.MathLabGames.get === 'function' && window.MathLabGames.get('stats-concept-lab')) return;
    window.MathLabGames.register({
      id: 'stats-concept-lab',
      title: '통계 개념 탐구실',
      icon: '📈',
      sourceType: 'new',
      mount(container, context) { StatsLab.mount(container, context); },
      reset() { StatsLab.resetAll(); },
      destroy() { StatsLab.destroy(); },
      goHome() { StatsLab.goHome(); }
    });
  } catch (e) { console.warn('[StatsLab] register 방어:', e); }
}
registerStatsConceptLab();
window.addEventListener('DOMContentLoaded', registerStatsConceptLab);
setTimeout(registerStatsConceptLab, 100);
setTimeout(registerStatsConceptLab, 500);

window.StatsConceptLab = StatsLab;
window.initStatsConceptLabGame = function () {
  registerStatsConceptLab();
  try {
    if (window.LegacyBridge && typeof window.LegacyBridge.hideAllLegacySections === 'function') {
      window.LegacyBridge.hideAllLegacySections();
      if (typeof window.LegacyBridge.showNewRoot === 'function') window.LegacyBridge.showNewRoot();
    }
  } catch (e) {}
  if (typeof window.MathLabGames !== 'undefined' && typeof window.MathLabGames.mount === 'function') {
    try { window.MathLabGames.mount('stats-concept-lab'); return; } catch (e) {}
  }
  StatsLab.mount(document.getElementById('mathlab-view'));
};
window.launchStatsConceptLabGame = window.initStatsConceptLabGame;
})();
</script>
