        reason: "ENTJ는 주변의 수많은 변수와 인력들을 체계적으로 통제하여, 조직의 최적화된 결과(최댓값)를 도출해내는 탁월한 지휘관이기 때문입니다.",
        strength: "수많은 변수가 얽힌 복잡한 상황에서도 빠르게 편미분하여 최적의 방향(그래디언트)을 찾아내는 통솔력",
        weakness: "변수를 통제하려는 의지가 너무 강해, 통제 불가능한 변수(타인의 감정)를 마주하면 스트레스를 받음",
        advice: "가끔은 통제할 수 없는 '랜덤 변수'가 만들어내는 의외의 결과도 즐겁게 받아들여 보세요."
      },
      "ENTP": { 
        mbti: "ENTP", title: "바이어슈트라스", emoji: "⚡", 
        desc: "연속이지만 미분 불가능한 바이어슈트라스 함수처럼 예측 불가능한 아이디어를 냅니다.",
        mathDesc: {
          elem: "모든 선이 이어져 있지만, 너무 뾰족뾰족해서 절대 예측할 수 없는 번개 같은 괴물 그래프예요!",
          mid: "수학자들을 충격에 빠뜨렸던 함수로, 선이 뚝 끊기지 않고 이어져 있는데도 너무나 뾰족해서 기울기를 예측할 수 없는 함수입니다.",
          high: "바이어슈트라스 함수는 '모든 점에서 연속이지만, 모든 점에서 미분 불가능한' 수학계의 상식을 깨부순 혁명적인 함수입니다."
        },
        reason: "ENTP는 끊임없이 아이디어를 내며 이어가지만(연속), 도무지 어디로 튈지 예측(미분)할 수 없는 혁명가이기 때문입니다.",
        strength: "기존의 뻔하고 미분 가능한 상식을 산산조각 내는 천재적이고 기발한 독창성",
        weakness: "너무 뾰족하게 여기저기 찌르고 다녀서 주변 사람들이 따라가기 벅차고 피곤할 수 있음",
        advice: "때로는 미분이 가능할 정도로 부드러운 다항함수처럼, 주변 사람들과 부드럽게 타협하는 법도 필요합니다."
      }
    },

    mount(container) {
      this.host = (typeof container === 'string') ? document.querySelector(container) : container;
      if (!this.host) {
        this.host = document.getElementById('mathlab-view') || document.getElementById('new-root') || document.body;
      }
      
      this.host.style.display = '';
      this.host.style.visibility = 'visible';
      this.host.style.opacity = '1';
      let parent = this.host.parentElement;
      while (parent && parent !== document.body && parent !== document.documentElement) {
        if (parent.style && parent.style.display === 'none') parent.style.display = 'block';
        if (parent.style && parent.style.visibility === 'hidden') parent.style.visibility = 'visible';
        parent = parent.parentElement;
      }
      
      this.render();
    },

    goHome() {
      this.destroy();
      if (typeof window.LegacyBridge !== 'undefined' && typeof window.LegacyBridge.backHome === 'function') {
        try { window.LegacyBridge.backHome(); return; } catch (e) {}
      }
      if (typeof window.MathLabUtils !== 'undefined' && typeof window.MathLabUtils.goHome === 'function') {
        window.MathLabUtils.goHome();
      } else {
        location.reload();
      }
    },

    destroy() {
      if (this.host) {
        this.host.innerHTML = '';
        this.host.style.display = 'none';
      }
    },

    showMbtiScreen(screenId) {
      if (!this.host) return;
      this.host.querySelectorAll('.mbti-screen').forEach(el => el.classList.remove('active'));
      const screen = this.host.querySelector(`#${screenId}`);
      if (screen) screen.classList.add('active');
    },

    startMbtiWithLevel(level) {
      this.mbtiCurrentLevel = level;
      this.mbtiScores = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };
      this.mbtiQuestionIdx = 0;
      this.showMbtiScreen('question-screen');
      this.renderMbtiQuestion();
    },

    clearMbtiTouchState() {
      if (!this.host) return;
      this.host.querySelectorAll('#option-a, #option-b').forEach(el => {
        el.classList.remove('active', 'selected', 'pressed', 'hover');
        el.blur && el.blur();
      });
      if (document.activeElement && typeof document.activeElement.blur === 'function') {
        document.activeElement.blur();
      }
    },

    applyMbtiMobileTouchFix(button) {
      if (!button) return;
      button.style.webkitTapHighlightColor = 'transparent';
      button.style.touchAction = 'manipulation';
      button.style.userSelect = 'none';
    },

    renderMbtiQuestion() {
      if (!this.host) return;
      this.clearMbtiTouchState();
      const selectedQuestions = this.mbtiQuestions[this.mbtiCurrentLevel];
      
      if (this.mbtiQuestionIdx >= selectedQuestions.length) {
        this.calculateMbtiResult();
        return;
      }
      
      const q = selectedQuestions[this.mbtiQuestionIdx];
      this.host.querySelector('#question-text').innerText = `Q${this.mbtiQuestionIdx + 1}. ${q.text}`;

      const optA = this.host.querySelector('#option-a');
      const optB = this.host.querySelector('#option-b');
      
      const newA = optA.cloneNode(true);
      const newB = optB.cloneNode(true);
      
      newA.innerText = q.options[0].text;
      newB.innerText = q.options[1].text;

      newA.classList.remove('active', 'selected', 'pressed', 'hover');
      newB.classList.remove('active', 'selected', 'pressed', 'hover');
      this.applyMbtiMobileTouchFix(newA);
      this.applyMbtiMobileTouchFix(newB);
      
      newA.onclick = (event) => this.selectMbtiOption('A', event);
      newB.onclick = (event) => this.selectMbtiOption('B', event);
      
      optA.parentNode.replaceChild(newA, optA);
      optB.parentNode.replaceChild(newB, optB);

      this.host.querySelector('#progress').style.width = `${(this.mbtiQuestionIdx / selectedQuestions.length) * 100}%`;
    },

    selectMbtiOption(choice, event) {
      if (event) {
        event.preventDefault();
        if (event.currentTarget && typeof event.currentTarget.blur === 'function') {
          event.currentTarget.blur();
        }
      }
      this.clearMbtiTouchState();

      const q = this.mbtiQuestions[this.mbtiCurrentLevel][this.mbtiQuestionIdx];
      let type = choice === 'A' ? q.options[0].type : q.options[1].type;
      this.mbtiScores[type]++;
      this.mbtiQuestionIdx++;
      this.renderMbtiQuestion();
    },

    calculateMbtiResult() {
      let mbti = (this.mbtiScores.E > this.mbtiScores.I ? "E" : "I") + 
                 (this.mbtiScores.S > this.mbtiScores.N ? "S" : "N") + 
                 (this.mbtiScores.T > this.mbtiScores.F ? "T" : "F") + 
                 (this.mbtiScores.J > this.mbtiScores.P ? "J" : "P");
                 
      const rData = this.mbtiResults[mbti];
      
      this.host.querySelector('#result-mbti').innerText = rData.mbti;
      this.host.querySelector('#result-emoji').innerText = rData.emoji;
      this.host.querySelector('#result-title').innerText = rData.title;
      this.host.querySelector('#result-desc').innerText = rData.desc;
      
      this.host.querySelector('#result-math-desc').innerText = rData.mathDesc[this.mbtiCurrentLevel];
      this.host.querySelector('#result-reason').innerText = rData.reason;
      this.host.querySelector('#result-strength').innerHTML = `<strong>[강점]</strong> ${rData.strength}`;
      this.host.querySelector('#result-weakness').innerHTML = `<strong>[약점]</strong> ${rData.weakness}`;
      this.host.querySelector('#result-advice').innerHTML = `<strong>[보완점]</strong> ${rData.advice}`;
      
      this.showMbtiScreen('loading-screen');
      setTimeout(() => { this.showMbtiScreen('result-screen'); }, 1500);
    },

    restartTest() { 
      this.showMbtiScreen('start-screen'); 
    },

    saveImage() {
      if (typeof html2canvas === 'undefined') {
        alert('화면 캡처 라이브러리를 불러오는 중입니다. 잠시 후 다시 시도해주세요.');
        return;
      }
      html2canvas(this.host.querySelector('#capture-area'), { scale: 2, useCORS: true }).then(canvas => {
        const link = document.createElement('a');
        link.download = `수학MBTI_결과.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    },

      h += '  .mbti-result-section h3 { font-size: 1.05rem; color: #0984e3; margin: 0 0 8px 0; font-weight: 800; border-bottom: 2px solid #e0f2fe; padding-bottom: 5px; }';
      h += '  .mbti-result-section p { font-size: 0.95rem; color: #475569; line-height: 1.5; margin: 0; word-break: keep-all; }';
      h += '  .mbti-result-bullet { font-size: 0.95rem; color: #475569; line-height: 1.6; text-align: left; background: #fff; padding: 12px; border-radius: 10px; border: 1px dashed #cbd5e1; margin-bottom: 10px; }';
      h += '  .mbti-result-bullet strong { color: #2c3e50; }';
      h += '  .mbti-watermark { margin-top: 25px; font-size: 0.8rem; color: #cbd5e1; font-weight: 700; text-align: center; }';
      h += '  .mbti-action-btns { display: flex; gap: 10px; width: 100%; margin-top: 20px; }';

      h += '</style>';

      h += '    <h1 style="font-size:2.2rem; color:#2c3e50; font-weight:900; margin-bottom:15px;">나와 닮은 함수는? &#128208;</h1>';

      h += '      </div>';
      h += '      <div class="mbti-result-bullet" id="result-strength"></div>';
      h += '      <div class="mbti-result-bullet" id="result-weakness"></div>';
      h += '      <div class="mbti-result-bullet" id="result-advice"></div>';

  };

  window.MbtiConceptApp = MbtiConceptApp;

  function registerMyApp() {
    if (typeof window.MathLabGames !== 'undefined' && typeof window.MathLabGames.register === 'function') {
      window.MathLabGames.register({
        id: 'mbti-concept',
        title: '나와 닮은 함수는?',
        icon: '🧪',
        appType: 'concept',
        topApp: '수학 개념',
        sourceType: 'new',
        mount(container) { MbtiConceptApp.mount(container); },
        reset() { MbtiConceptApp.restartTest(); },
        destroy() { MbtiConceptApp.destroy(); },
        goHome() { MbtiConceptApp.goHome(); }
      });
    }
  }

  registerMyApp();
  window.addEventListener('DOMContentLoaded', registerMyApp);


})();
</script>
