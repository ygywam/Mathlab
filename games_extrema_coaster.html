<script>

  {
    title: '🎢 극대·극소(Extrema)와 도함수의 부호 판정',

          '<ul>' +
          '  <li><b>극댓값:</b> <span class="math-tex" data-tex="f\'(x)"></span> 의 부호가 <b>양(+)에서 음(-)</b>으로 변화 (봉우리)</li>' +
          '  <li><b>극솟값:</b> <span class="math-tex" data-tex="f\'(x)"></span> 의 부호가 <b>음(-)에서 양(+)</b>으로 변화 (골짜기)</li>' +
          '</ul>'
  },
  {
    title: '📐 변곡점(Inflection Point)과 롤러코스터 곡률',

  e: 0.00,

function $(id) { return document.getElementById(id); }

function renderMath(latex, container, displayMode) {
  if (typeof katex !== 'undefined' && container) {
    try {
      katex.render(latex, container, { throwOnError: false, displayMode: !!displayMode });
      return;
    } catch(e){}
  }
  if (container) container.textContent = latex;
}

function updateMathElements() {
  document.querySelectorAll('.math-tex').forEach(function(el) {
    var tex = el.getAttribute('data-tex');
    var isDisplay = el.getAttribute('data-display') === 'true';
    if (tex) renderMath(tex, el, isDisplay);
  });
}

function fx(x) {
  if (S.course === 'cubic') return S.a * x * x * x + S.b * x * x + S.c * x + S.d;
  if (S.course === 'quartic') return S.a * Math.pow(x, 4) + S.b * x * x * x + S.c * x * x + S.d * x + S.e;
  return 0;
}

function fprime(x) {
  if (S.course === 'cubic') return 3 * S.a * x * x + 2 * S.b * x + S.c;
  if (S.course === 'quartic') return 4 * S.a * x * x * x + 3 * S.b * x * x + 2 * S.c * x + S.d;
  return 0;
}

function fdoubleprime(x) {
  if (S.course === 'cubic') return 6 * S.a * x + 2 * S.b;
  if (S.course === 'quartic') return 12 * S.a * x * x + 6 * S.b * x + 2 * S.c;
  return 0;
}

function calcCurvature(x) {
  var fp = fprime(x);
  var fpp = fdoubleprime(x);
  return Math.abs(fpp) / Math.pow(1 + fp * fp, 1.5);
}

function findExtrema() {
  var res = [];
  var step = 0.02;
  for (var x = -BOUND_X; x <= BOUND_X; x += step) {
    var dy1 = fprime(x), dy2 = fprime(x + step);
    if (dy1 * dy2 <= 0) {
      var root = x - dy1 * step / (dy2 - dy1);
      var leftP = fprime(root - 0.05), rightP = fprime(root + 0.05);
      var kind = null;
      if (leftP > 0 && rightP < 0) kind = 'max';
      else if (leftP < 0 && rightP > 0) kind = 'min';

      if (kind && !res.some(function(r){ return Math.abs(r.x - root) < 0.1; })) {
        res.push({ x: root, y: fx(root), kind: kind });
      }
    }
  }
  return res;
}

function findInflections() {
  var res = [];
  var step = 0.02;
  for (var x = -BOUND_X; x <= BOUND_X; x += step) {
    var ddy1 = fdoubleprime(x), ddy2 = fdoubleprime(x + step);
    if (ddy1 * ddy2 <= 0) {
      var root = x - ddy1 * step / (ddy2 - ddy1);
      if (!res.some(function(r){ return Math.abs(r - root) < 0.1; })) {
        res.push(root);
      }
    }
  }
  return res;
}

    }
    
    host.style.display = ''; host.style.visibility = 'visible'; host.style.opacity = '1';

  bindEvents: function() {
    var _this = this;
    var root = S.host.querySelector('#ec-app-root');

    /* Tabs */

      btn.onclick = function() {
        root.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
        this.classList.add('active');
        S.activeTab = this.getAttribute('data-tab');

        root.querySelector('#tab-sec-sim').style.display = (S.activeTab === 'sim') ? 'block' : 'none';
        root.querySelector('#tab-sec-math').style.display = (S.activeTab === 'math') ? 'block' : 'none';
        root.querySelector('#tab-sec-prob').style.display = (S.activeTab === 'prob') ? 'block' : 'none';

        updateMathElements();
      };
    });

    /* Course Selection Buttons */
    root.querySelectorAll('.btn-course').forEach(function(btn) {
      btn.onclick = function() {
        root.querySelectorAll('.btn-course').forEach(function(b){ b.className = 'btn btn-course'; });
        this.className = 'btn p btn-course';
        S.course = this.getAttribute('data-course');
        _this.updateHUD();
        _this.drawCanvas();
      };
    });

    /* Sliders */
    var rngA = root.querySelector('#rng-a');
    var rngB = root.querySelector('#rng-b');
    var rngC = root.querySelector('#rng-c');
    var rngX0 = root.querySelector('#rng-x0');

    function updateVal(key, val, rngEl) {
      S[key] = Math.round(parseFloat(val) * 100) / 100;
      if (rngEl) rngEl.value = S[key];
      _this.updateHUD();
      _this.drawCanvas();
    }

    rngA.oninput = function() { updateVal('a', this.value, rngA); };
    rngB.oninput = function() { updateVal('b', this.value, rngB); };
    rngC.oninput = function() { updateVal('c', this.value, rngC); };
    rngX0.oninput = function() { updateVal('x0', this.value, rngX0); };

    function bindWheel(el, key) {
      el.onwheel = function(e) {
        e.preventDefault();
        var delta = e.deltaY < 0 ? 0.01 : -0.01;
        var minV = parseFloat(el.min), maxV = parseFloat(el.max);
        var nVal = Math.min(maxV, Math.max(minV, S[key] + delta));
        updateVal(key, nVal, el);
      };
    }
    bindWheel(rngA, 'a');
    bindWheel(rngB, 'b');
    bindWheel(rngC, 'c');
    bindWheel(rngX0, 'x0');

    /* Canvas Mousemove */
    var cv = root.querySelector('#ec-cv');
    cv.onmousemove = function(e) {
      var rect = cv.getBoundingClientRect();
      var mouseX = e.clientX - rect.left;
      var pad = 40;
      var xVal = -BOUND_X + (mouseX - pad) / (CW - pad * 2) * (2 * BOUND_X);
      xVal = Math.min(BOUND_X - 0.1, Math.max(-BOUND_X + 0.1, xVal));
      updateVal('x0', xVal, rngX0);
    };

    /* Actions */
    root.querySelector('#btn-preset-1').onclick = function() {
      S.course = 'cubic';
      updateVal('a', 0.50, rngA);
      updateVal('b', 0.00, rngB);
      updateVal('c', -3.00, rngC);
      updateVal('x0', 1.00, rngX0);
    };
    root.querySelector('#btn-preset-2').onclick = function() {
      S.course = 'quartic';
      updateVal('a', 0.25, rngA);
      updateVal('b', 0.00, rngB);
      updateVal('c', -2.00, rngC);
      updateVal('x0', 1.00, rngX0);
    };

    /* Quiz */
    root.querySelector('#btn-submit-quiz').onclick = function() {
      var val = (root.querySelector('#inp-quiz-ans').value || '').trim();
      var msgEl = root.querySelector('#lbl-quiz-msg');
      if (val === '극대') {
        msgEl.innerHTML = '✅ <b>정답입니다!</b> 2계도함수가 음수(위로 볼록)이므로 극댓값입니다.';
        msgEl.style.color = '#059669';
      } else {
        msgEl.innerHTML = '❌ 오답입니다. (힌트: 위로 볼록한 봉우리 형태인 극대 입니다)';
        msgEl.style.color = '#ef4444';
      }
    };

    /* Solutions Toggle */
    root.querySelectorAll('.btn-show-sol').forEach(function(btn) {
      btn.onclick = function() {
        var idx = this.getAttribute('data-idx');
        var solEl = root.querySelector('#sol-' + idx);
        if (solEl) {
          var isShown = solEl.style.display === 'block';
          solEl.style.display = isShown ? 'none' : 'block';
          this.textContent = isShown ? '💡 수학적 해설 보기' : '🙈 해설 닫기';
          updateMathElements();
        }
      };
    });

    /* Modal Open & Render Slide */
    root.querySelector('#btn-open-guide').onclick = function() {
      S.guidePage = 0;
      _this.renderSlideGuide();
      root.querySelector('#ec-modal').classList.add('on');
    };
  },

  updateHUD: function() {
    var root = S.host.querySelector('#ec-app-root');
    if (!root) return;

    var ext = findExtrema();
    var slope = fprime(S.x0);
    var fpp = fdoubleprime(S.x0);
    var curv = calcCurvature(S.x0);

    root.querySelector('#lbl-ext-count').textContent = ext.length + '개';
    root.querySelector('#lbl-slope-val').textContent = slope.toFixed(2);
    root.querySelector('#lbl-curv-val').textContent = curv.toFixed(2);
    root.querySelector('#lbl-concave-val').textContent = fpp > 0.01 ? '아래로 볼록' : (fpp < -0.01 ? '위로 볼록' : '변곡점 근방');

    root.querySelector('#lbl-a-slider').textContent = S.a.toFixed(2);
    root.querySelector('#lbl-b-slider').textContent = S.b.toFixed(2);
    root.querySelector('#lbl-c-slider').textContent = S.c.toFixed(2);
    root.querySelector('#lbl-x0-slider').textContent = S.x0.toFixed(2);

    var fxTex = '', fpTex = '', fppTex = '';
    if (S.course === 'cubic') {
      fxTex = 'f(x) = ' + S.a.toFixed(2) + 'x^3 ' + (S.b >= 0 ? '+ ' + S.b.toFixed(2) : '- ' + Math.abs(S.b).toFixed(2)) + 'x^2 ' + (S.c >= 0 ? '+ ' + S.c.toFixed(2) : '- ' + Math.abs(S.c).toFixed(2)) + 'x';
      fpTex = 'f\'(x) = ' + (3 * S.a).toFixed(2) + 'x^2 ' + (2 * S.b >= 0 ? '+ ' + (2 * S.b).toFixed(2) : '- ' + Math.abs(2 * S.b).toFixed(2)) + 'x ' + (S.c >= 0 ? '+ ' + S.c.toFixed(2) : '- ' + Math.abs(S.c).toFixed(2));
      fppTex = 'f\'\'(x) = ' + (6 * S.a).toFixed(2) + 'x ' + (2 * S.b >= 0 ? '+ ' + (2 * S.b).toFixed(2) : '- ' + Math.abs(2 * S.b).toFixed(2));
    } else {
      fxTex = 'f(x) = ' + S.a.toFixed(2) + 'x^4 ' + (S.b >= 0 ? '+ ' + S.b.toFixed(2) : '- ' + Math.abs(S.b).toFixed(2)) + 'x^3 ' + (S.c >= 0 ? '+ ' + S.c.toFixed(2) : '- ' + Math.abs(S.c).toFixed(2)) + 'x^2';
      fpTex = 'f\'(x) = ' + (4 * S.a).toFixed(2) + 'x^3 ' + (3 * S.b >= 0 ? '+ ' + (3 * S.b).toFixed(2) : '- ' + Math.abs(3 * S.b).toFixed(2)) + 'x^2 ' + (2 * S.c >= 0 ? '+ ' + (2 * S.c).toFixed(2) : '- ' + Math.abs(2 * S.c).toFixed(2)) + 'x';
      fppTex = 'f\'\'(x) = ' + (12 * S.a).toFixed(2) + 'x^2 ' + (6 * S.b >= 0 ? '+ ' + (6 * S.b).toFixed(2) : '- ' + Math.abs(6 * S.b).toFixed(2)) + 'x ' + (2 * S.c >= 0 ? '+ ' + (2 * S.c).toFixed(2) : '- ' + Math.abs(2 * S.c).toFixed(2));
    }

    var elFx = root.querySelector('#lbl-math-fx');
    var elFp = root.querySelector('#lbl-math-fp');
    var elFpp = root.querySelector('#lbl-math-fpp');

    if (elFx) { elFx.setAttribute('data-tex', fxTex); renderMath(fxTex, elFx, false); }
    if (elFp) { elFp.setAttribute('data-tex', fpTex); renderMath(fpTex, elFp, false); }
    if (elFpp) { elFpp.setAttribute('data-tex', fppTex); renderMath(fppTex, elFpp, false); }
  },

  worldToPx: function(x, y) {
    var pad = 40;
    return {
      X: pad + (x + BOUND_X) / (2 * BOUND_X) * (CW - pad * 2),
      Y: CH / 2 - (y / BOUND_Y) * (CH / 2 - 20)
    };
  },

  drawCanvas: function() {
    var root = S.host.querySelector('#ec-app-root');
    if (!root) return;
    var cv = root.querySelector('#ec-cv');
    if (!cv) return;
    var ctx = cv.getContext('2d');

    ctx.clearRect(0, 0, CW, CH);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, CW, CH);

    var _this = this;
    var pad = 40;

    // Grid & Axes
    var o = _this.worldToPx(0, 0);
    ctx.strokeStyle = '#e2e8f0';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(pad, o.Y); ctx.lineTo(CW - pad, o.Y);
    ctx.moveTo(o.X, 20); ctx.lineTo(o.X, CH - 20);
    ctx.stroke();

    // Coaster Track f(x) (Purple / Blue)
    ctx.strokeStyle = '#6366f1';
    ctx.lineWidth = 3.5;
    ctx.beginPath();
    var started = false;
    for (var i = 0; i <= 260; i++) {
      var x = -BOUND_X + i * (2 * BOUND_X) / 260;
      var y = fx(x);
      if (isNaN(y) || y > BOUND_Y + 2 || y < -BOUND_Y - 2) { started = false; continue; }
      var p = _this.worldToPx(x, y);
      if (!started) { ctx.moveTo(p.X, p.Y); started = true; }
      else ctx.lineTo(p.X, p.Y);
    }
    ctx.stroke();

    // Extrema Points (Max: Red, Min: Blue)
    var extrema = findExtrema();
    extrema.forEach(function(e) {
      if (Math.abs(e.x) <= BOUND_X) {
        var pt = _this.worldToPx(e.x, e.y);
        ctx.fillStyle = e.kind === 'max' ? '#dc2626' : '#0284c7';
        ctx.beginPath();
        ctx.arc(pt.X, pt.Y, 6, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#334155';
        ctx.font = 'bold 11px Pretendard';
        ctx.fillText(e.kind === 'max' ? '극대' : '극소', pt.X + 8, pt.Y - 6);
      }
    });

    // Inflection Points (Orange)
    var inflections = findInflections();
    inflections.forEach(function(ix) {
      if (Math.abs(ix) <= BOUND_X) {
        var iy = fx(ix);
        var ipt = _this.worldToPx(ix, iy);
        ctx.fillStyle = '#d97706';
        ctx.beginPath();
        ctx.arc(ipt.X, ipt.Y, 5, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#d97706';
        ctx.font = 'bold 11px Pretendard';
        ctx.fillText('변곡점', ipt.X + 8, ipt.Y + 14);
      }
    });

    // Coaster Car at x0
    var y0 = fx(S.x0);
    var p0 = _this.worldToPx(S.x0, y0);

    // Tangent Line at x0
    var slope = fprime(S.x0);
    ctx.strokeStyle = '#f59e0b';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (var t = -1.0; t <= 1.0; t += 1.0) {
      var tx = S.x0 + t;
      var ty = slope * t + y0;
      var tp = _this.worldToPx(tx, ty);
      if (t === -1.0) ctx.moveTo(tp.X, tp.Y);
      else ctx.lineTo(tp.X, tp.Y);
    }
    ctx.stroke();

    // Car Body (Yellow)
    ctx.fillStyle = '#f59e0b';
    ctx.beginPath();
    ctx.arc(p0.X, p0.Y, 9, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = '#0f172a';
    ctx.font = 'bold 12px Pretendard';
    ctx.fillText('🎢 카트 x0 = ' + S.x0.toFixed(2), p0.X + 12, p0.Y - 10);
  },

  renderSlideGuide: function() {
    var _this = this;
    var root = S.host.querySelector('#ec-app-root');
    var mBox = root.querySelector('#ec-modal-box');
    if (!mBox) return;

    var pg = SLIDE_GUIDE[S.guidePage] || SLIDE_GUIDE[0];
    var dots = SLIDE_GUIDE.map(function(_, i) {
      return '<span class="dot' + (i === S.guidePage ? ' on' : '') + '"></span>';
    }).join('');
    var isLast = S.guidePage >= SLIDE_GUIDE.length - 1;

    var h = '';
    h += '<div style="font-size:.8rem; font-weight:800; color:#0284c7; margin-bottom:4px;">온보딩 슬라이드 탐구 ' + (S.guidePage + 1) + ' / ' + SLIDE_GUIDE.length + '</div>';
    h += '<h3 style="margin:0 0 12px; color:#0f172a; font-weight:900;">' + pg.title + '</h3>';
    h += '<div style="line-height:1.65; color:#334155; font-size:0.95rem;">' + pg.html + '</div>';
    h += '<div class="dots">' + dots + '</div>';

    h += '<div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px;">';
    h += '  <button type="button" class="btn" id="btn-slide-prev"' + (S.guidePage === 0 ? ' disabled' : '') + '>← 이전</button>';
    h += '  <button type="button" class="btn p" id="btn-slide-next">' + (isLast ? '탐구 시작하기 🚀' : '다음 →') + '</button>';
    h += '</div>';

    mBox.innerHTML = h;
    updateMathElements();

    var prevBtn = mBox.querySelector('#btn-slide-prev');
    var nextBtn = mBox.querySelector('#btn-slide-next');

    if (prevBtn) {
      prevBtn.onclick = function() {
        if (S.guidePage > 0) {
          S.guidePage--;
          _this.renderSlideGuide();
        }
      };
    }
    if (nextBtn) {
      nextBtn.onclick = function() {
        if (isLast) {
          root.querySelector('#ec-modal').classList.remove('on');
        } else {
          S.guidePage++;
          _this.renderSlideGuide();
        }
      };
    }
  },

  destroy: function() {
    if (S.host) S.host.innerHTML = '';
    S.host = null;
  }
};

function goHome() {
  if (S.host) S.host.innerHTML = '';
  if (typeof window.LegacyBridge !== 'undefined' && typeof window.LegacyBridge.backHome === 'function') {
    window.LegacyBridge.backHome();
  } else if (typeof window.MathLabGames !== 'undefined' && window.MathLabGames.goHome) {
    window.MathLabGames.goHome();
  } else {
    window.location.reload();
  }
}

function reg() {
  if (typeof window.MathLabGames === 'undefined' || typeof window.MathLabGames.register !== 'function') return;
  try {
    if (window.MathLabGames.get && window.MathLabGames.get(APP_ID)) return;
    window.MathLabGames.register({
      id: APP_ID,
      title: APP_TITLE,
      icon: ICON,
      sourceType: 'new',
      players: '1인',
      isMultiplayer: false,
      mount: function(c, x) { ExtremaCoasterApp.mount(c, x); },
      reset: function() { ExtremaCoasterApp.updateHUD(); ExtremaCoasterApp.drawCanvas(); },
      destroy: function() { ExtremaCoasterApp.destroy(); },
      goHome: function() { goHome(); }
    });
  } catch (e) {
    console.warn(APP_ID + ' reg', e);
  }
}

reg();
window.addEventListener('DOMContentLoaded', reg);
setTimeout(reg, 100);

window.initExtremaCoaster = function() {

  try {
