<script>
/* ===== 극한값 타겟 슈팅 (limit-shooting) : Gen-3 표준 모듈 ===== */
(function () {
  'use strict';

  var APP_ID = 'limit-shooting';
  var APP_TITLE = '극한값 타겟 슈팅';
  var BOTTOM_BOARD_ID = 'board-limit-shooting-bottom';
  var LS_KEY = 'mathlab_lb_limit_shooting';
  var TOTAL_ROUNDS = 5;
  var TERM_COUNT = 12;
  var SVG_W = 520;
  var SVG_H = 380;
  var PLOT_L = 46;
  var PLOT_R = 96;
  var PLOT_T = 24;
  var PLOT_B = 30;

  var DIFF_RULE = {
    easy:   { label: '쉬움', eps: 0.15, shots: 0, timeLimit: 0,  types: ['R', 'R', 'R', 'R', 'R'],  lockPreview: false },
    normal: { label: '보통', eps: 0.08, shots: 3, timeLimit: 0,  types: ['R', 'G', 'R', 'G', 'R'],  lockPreview: false },
    hard:   { label: '도전', eps: 0.04, shots: 3, timeLimit: 60, types: ['R', 'D', 'G', 'D', 'R'],  lockPreview: true }
  };

  var state = {
    mounted: false,
    host: null,
    difficulty: 'easy',
    round: 1,
    score: 0,
    hits: 0,
    finished: false,
    busy: false,
    previewLocked: false,
    problem: null,
    coeffs: {},
    shotsUsed: 0,
    roundStart: 0,
    timerInterval: null,
    fireTimeouts: []
  };

  /* ---------- 공통 유틸 ---------- */
  function byId(id) { return document.getElementById(id); }
  function setText(id, v) { var el = byId(id); if (el) el.textContent = String(v); }
  function escapeHTML(str) {
    return String(str == null ? '' : str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function fmtNum(v) {
    if (v === null) return '발산';
    var r = Math.round(v * 100) / 100;
    return String(r);
  }

  var toastTimer = null;
  function showToast(msg, type) {
    var t = byId('lst-toast');
    if (!t) {
      t = document.createElement('div');
      t.id = 'lst-toast';
      document.body.appendChild(t);
    }
    t.className = 'lst-toast' + (type ? ' ' + type : '');
    t.textContent = msg;
    void t.offsetWidth;
    t.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2300);
  }

  function closeModal() {
    var ov = byId('lst-modal-overlay');
    if (ov && ov.parentNode) ov.parentNode.removeChild(ov);
  }
  function openModal(innerHTML) {
    closeModal();
    var ov = document.createElement('div');
    ov.id = 'lst-modal-overlay';
    ov.className = 'lst-modal-overlay';
    ov.innerHTML = '<div class="lst-modal">' + innerHTML + '</div>';
    document.body.appendChild(ov);
    ov.addEventListener('click', function (ev) { if (ev.target === ov) closeModal(); });
  }

  /* ---------- 수열 극한 엔진 ---------- */
  function randInt(min, max) { return min + Math.floor(Math.random() * (max - min + 1)); }
  function termValue(type, c, n) {
    if (type === 'R') return (c.p * n + c.q) / (c.r * n + c.s);
    if (type === 'G') return c.A + c.B * Math.pow(c.k, n);
    return (n * n + c.q) / (c.r * n + c.s);
  }
  function limitValue(type, c) {
    if (type === 'R') return c.r !== 0 ? c.p / c.r : null;
    if (type === 'G') return Math.abs(c.k) < 1 ? c.A : null;
    return null;
  }
  function formulaHTML(type, c) {
    if (type === 'R') {
      return 'aₙ = (' + fmtNum(c.p) + 'n ' + (c.q >= 0 ? '+ ' + fmtNum(c.q) : '- ' + fmtNum(-c.q)) + ') / (' + fmtNum(c.r) + 'n ' + (c.s >= 0 ? '+ ' + fmtNum(c.s) : '- ' + fmtNum(-c.s)) + ')';
    }
    if (type === 'G') {
      return 'aₙ = ' + fmtNum(c.A) + ' + ' + fmtNum(c.B) + ' · (' + fmtNum(c.k) + ')ⁿ';
    }
    return 'aₙ = (n² ' + (c.q >= 0 ? '+ ' + fmtNum(c.q) : '- ' + fmtNum(-c.q)) + ') / (' + fmtNum(c.r) + 'n ' + (c.s >= 0 ? '+ ' + fmtNum(c.s) : '- ' + fmtNum(-c.s)) + ')';
  }

  var TARGET_POOL = [
    { txt: '2/3', v: 2 / 3 }, { txt: '3/2', v: 1.5 }, { txt: '1/2', v: 0.5 },
    { txt: '5/4', v: 1.25 }, { txt: '2', v: 2 }, { txt: '3', v: 3 },
    { txt: '4/3', v: 4 / 3 }, { txt: '1', v: 1 }, { txt: '5/2', v: 2.5 }
  ];

  function buildRound() {
    var rule = DIFF_RULE[state.difficulty];
    var type = rule.types[state.round - 1] || 'R';
    var target = TARGET_POOL[randInt(0, TARGET_POOL.length - 1)];
    var problem = { type: type, target: target, sliders: [] };
    if (type === 'R') {
      state.coeffs = { p: randInt(1, 4), q: randInt(-3, 3), r: randInt(1, 4), s: randInt(1, 4) };
      problem.sliders = [
        { key: 'p', min: 0, max: 8, step: 1 },
        { key: 'q', min: -5, max: 5, step: 1 },
        { key: 'r', min: 1, max: 6, step: 1 },
        { key: 's', min: -5, max: 5, step: 1 }
      ];
      problem.mission = '분자·분모의 계수를 조정해 극한값을 과녁 ' + target.txt + '에 명중시키세요! (최고차항 계수 비 p/r)';
    } else if (type === 'G') {
      state.coeffs = { A: randInt(0, 4), B: randInt(1, 3), k: 0.5 };
      problem.sliders = [
        { key: 'A', min: 0, max: 5, step: 0.25 },
        { key: 'B', min: 1, max: 4, step: 0.5 },
        { key: 'k', min: -1.5, max: 1.5, step: 0.1 }
      ];
      problem.mission = '등비 항 rⁿ은 |r|<1일 때 0으로 수렴! 극한값을 과녁 ' + target.txt + '에 명중시키세요. |k| ≥ 1이면 발산합니다!';
    } else {
      state.coeffs = { q: randInt(1, 5), r: randInt(1, 4), s: randInt(1, 4) };
      problem.sliders = [];
      problem.mission = '⚠️ 발산 함정 라운드! 이 수열이 수렴하는지 판별하세요. 발산이라면 발사 대신 \ud83d\udeab 발산 판정을 누르세요!';
    }
    state.problem = problem;
    state.shotsUsed = 0;
    state.busy = false;
    state.roundStart = Date.now();
  }

  /* ---------- SVG 좌표 변환 ---------- */
  function yCenter() { return state.problem ? state.problem.target.v : 0; }
  function yToS(y) {
    var c = yCenter();
    var span = 3;
    var clamped = Math.max(c - span, Math.min(c + span, y));
    var h = SVG_H - PLOT_T - PLOT_B;
    return PLOT_T + (c + span - clamped) / (2 * span) * h;
  }
  function nToS(n) {
    var w = SVG_W - PLOT_L - PLOT_R;
    return PLOT_L + (n - 1) / (TERM_COUNT - 1) * w;
  }

  /* ---------- SVG 렌더링 ---------- */
  function renderBoard() {
    var wrap = byId('lst-svg-wrap');
    if (!wrap || !state.problem) return;
    var rule = DIFF_RULE[state.difficulty];
    var eps = rule.eps;
    var T = state.problem.target.v;
    var cx = SVG_W - PLOT_R + 44;
    var parts = [];
    parts.push('<svg id="lst-svg" viewBox="0 0 ' + SVG_W + ' ' + SVG_H + '" xmlns="http://www.w3.org/2000/svg">');
    var i;
    for (i = -3; i <= 3; i++) {
      var gy = yToS(T + i);
      parts.push('<line x1="' + PLOT_L + '" y1="' + gy + '" x2="' + (SVG_W - PLOT_R) + '" y2="' + gy + '" stroke="#eef2f7" stroke-width="1"/>');
      parts.push('<text x="' + (PLOT_L - 6) + '" y="' + (gy + 4) + '" font-size="10" fill="#94a3b8" text-anchor="end">' + fmtNum(T + i) + '</text>');
    }
    for (i = 1; i <= TERM_COUNT; i++) {
      parts.push('<line x1="' + nToS(i) + '" y1="' + PLOT_T + '" x2="' + nToS(i) + '" y2="' + (SVG_H - PLOT_B) + '" stroke="#f1f5f9" stroke-width="1"/>');
      if (i % 2 === 1) parts.push('<text x="' + nToS(i) + '" y="' + (SVG_H - PLOT_B + 14) + '" font-size="10" fill="#94a3b8" text-anchor="middle">' + i + '</text>');
    }
    parts.push('<text x="' + (SVG_W - PLOT_R) + '" y="' + (SVG_H - 6) + '" font-size="11" fill="#64748b" text-anchor="end">n → ∞</text>');
    var ty = yToS(T);
    var ringDefs = [
      { r: eps, sy: Math.abs(yToS(T + eps) - ty), color: '#fca5a5', fill: 'rgba(254, 226, 226, 0.5)', label: '+10' },
      { r: eps * 2 / 3, sy: Math.abs(yToS(T + eps * 2 / 3) - ty), color: '#fcd34d', fill: 'rgba(254, 243, 199, 0.6)', label: '+20' },
      { r: eps / 3, sy: Math.abs(yToS(T + eps / 3) - ty), color: '#86efac', fill: 'rgba(220, 252, 231, 0.7)', label: '+30' }
    ];
    parts.push('<line x1="' + PLOT_L + '" y1="' + ty + '" x2="' + cx + '" y2="' + ty + '" stroke="#d97706" stroke-width="1.5" stroke-dasharray="7 5"/>');
    parts.push('<text x="' + (PLOT_L + 4) + '" y="' + (ty - 6) + '" font-size="11" fill="#b45309" font-weight="bold">목표 극한값 ' + escapeHTML(state.problem.target.txt) + '</text>');
    ringDefs.forEach(function (ring) {
      parts.push('<ellipse cx="' + cx + '" cy="' + ty + '" rx="' + Math.max(12, ring.sy) + '" ry="' + Math.max(8, ring.sy) + '" fill="' + ring.fill + '" stroke="' + ring.color + '" stroke-width="1.5"/>');
    });
    parts.push('<circle cx="' + cx + '" cy="' + ty + '" r="3.5" fill="#d97706"/>');
    parts.push('<text x="' + cx + '" y="' + (PLOT_T + 4) + '" font-size="16" text-anchor="middle">\ud83c\udff9</text>');
    parts.push('<polyline id="lst-limit-line" points="" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4 4" visibility="hidden"/>');
    parts.push('<g id="lst-dots"></g>');
    parts.push('</svg>');
    wrap.innerHTML = parts.join('');
  }

  /* ---------- 발사 애니메이션 ---------- */
  function clearFireTimeouts() {
    if (state.fireTimeouts && state.fireTimeouts.length) {
      state.fireTimeouts.forEach(function (tid) { clearTimeout(tid); });
    }
    state.fireTimeouts = [];
  }
  function fire() {
    if (state.finished || state.busy || !state.mounted || !state.problem) return;
    var rule = DIFF_RULE[state.difficulty];
    var type = state.problem.type;
    if (rule.shots > 0 && state.shotsUsed >= rule.shots) {
      showToast('발사 횟수를 모두 썼습니다!', 'warn');
      return;
    }
    state.busy = true;
    state.shotsUsed += 1;
    updateStatus();
    var dotsG = byId('lst-dots');
    if (dotsG) dotsG.innerHTML = '';
    var L = limitValue(type, state.coeffs);
    var lim = byId('lst-limit-line');
    if (lim) {
      if (L !== null) {
        lim.setAttribute('points', PLOT_L + ',' + yToS(L) + ' ' + (SVG_W - PLOT_R) + ',' + yToS(L));
        lim.setAttribute('visibility', 'visible');
      } else {
        lim.setAttribute('visibility', 'hidden');
      }
    }
    clearFireTimeouts();
    var n;
    for (n = 1; n <= TERM_COUNT; n++) {
      (function (idx) {
        var tid = setTimeout(function () {
          if (!state.mounted) return;
          var g = byId('lst-dots');
          if (!g) return;
          var val = termValue(type, state.coeffs, idx);
          var dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          dot.setAttribute('cx', String(nToS(idx)));
          dot.setAttribute('cy', String(yToS(val)));
          dot.setAttribute('r', idx === TERM_COUNT ? '6' : '4');
          dot.setAttribute('fill', idx === TERM_COUNT ? '#0284c7' : '#7dd3fc');
          dot.setAttribute('stroke', '#ffffff');
          dot.setAttribute('stroke-width', '1.5');
          g.appendChild(dot);
          if (idx === TERM_COUNT) judgeShot(L);
        }, 110 * idx);
        state.fireTimeouts.push(tid);
      })(n);
    }
  }
  function judgeShot(L) {
    var rule = DIFF_RULE[state.difficulty];
    var eps = rule.eps;
    var T = state.problem.target.v;
    if (L === null) {
      showToast('\ud83d\udca8 수열이 발산합니다! 극한선이 없어 과녁을 맞출 수 없어요.', 'error');
      afterShot(false);
      return;
    }
    var diff = Math.abs(L - T);
    var gain = 0;
    var ringName = '';
    if (diff <= eps / 3) { gain = 30; ringName = '\ud83c\udfaf 중심 명중!'; }
    else if (diff <= eps * 2 / 3) { gain = 20; ringName = '🥈 중간 링 명중!'; }
    else if (diff <= eps) { gain = 10; ringName = '🥉 외곽 링 명중!'; }
    if (gain > 0) {
      var bonus = 0;
      if (gain === 30 && state.shotsUsed === 1) bonus += 15;
      var elapsed = Math.floor((Date.now() - state.roundStart) / 1000);
      if (elapsed <= 25) bonus += 5;
      state.score += gain + bonus;
      state.hits += 1;
      updateStatus();
      showToast(ringName + ' +' + (gain + bonus) + '점' + (bonus >= 15 ? ' (정밀 조준 보너스!)' : ''), 'success');
      state.busy = true;
      var tid = setTimeout(nextRound, 1500);
      state.fireTimeouts.push(tid);
    } else {
      showToast('극한값 ' + fmtNum(L) + ' — 과녁(' + escapeHTML(state.problem.target.txt) + ')을 빗나갔습니다! 오차 ' + fmtNum(Math.abs(L - T)), 'warn');
      afterShot(true);
    }
  }
  function afterShot(allowRetry) {
    var rule = DIFF_RULE[state.difficulty];
    if (allowRetry && (rule.shots === 0 || state.shotsUsed < rule.shots)) {
      state.busy = false;
      return;
    }
    if (rule.shots > 0 && state.shotsUsed >= rule.shots) {
      showToast('발사 기회 소진! 다음 라운드로 넘어갑니다.', 'error');
      state.busy = true;
      var tid = setTimeout(nextRound, 1400);
      state.fireTimeouts.push(tid);
    } else {
      state.busy = false;
    }
  }
  function declareDivergence() {
    if (state.finished || state.busy || !state.mounted || !state.problem) return;
    state.busy = true;
    var L = limitValue(state.problem.type, state.coeffs);
    if (L === null) {
      state.score += 5;
      state.hits += 1;
      updateStatus();
      showToast('✅ 정확한 판별! 이 수열은 발산합니다. 발산 회피 보너스 +5점', 'success');
    } else {
      showToast('❌ 이 수열은 극한값 ' + fmtNum(L) + '로 수렴합니다! 판별 실패.', 'error');
    }
    var tid = setTimeout(nextRound, 1500);
    state.fireTimeouts.push(tid);
  }
  function nextRound() {
    if (!state.mounted) return;
    if (state.round >= TOTAL_ROUNDS) { finishGame(); return; }
    state.round += 1;
    buildRound();
    renderRound();
  }
  function finishGame() {
    state.finished = true;
    state.busy = true;
    stopTimer();
    var timeChip = byId('lst-time');
    if (timeChip) timeChip.textContent = '-';
    showToast('\ud83c\udfc1 모든 라운드 종료! 최종 점수 ' + state.score + '점', 'success');
    setTimeout(function () { if (state.mounted) showRankingModal(true); }, 900);
  }

  /* ---------- 상태 표시 ---------- */
  function updateStatus() {
    setText('lst-round', state.round);
    setText('lst-score', state.score);
    setText('lst-shots', state.shotsUsed);
    var rule = DIFF_RULE[state.difficulty];
    var lim = byId('lst-shot-limit');
    if (lim) lim.textContent = rule.shots > 0 ? ' / ' + rule.shots : '';
    updatePreview();
  }
  function updatePreview() {
    var el = byId('lst-preview-val');
    if (!el || !state.problem) return;
    if (state.previewLocked) {
      el.textContent = '\ud83d\udd12 잠김 (직접 계산해보세요!)';
      return;
    }
    var L = limitValue(state.problem.type, state.coeffs);
    el.textContent = L === null ? '발산 (극한값 없음)' : 'lim aₙ = ' + fmtNum(L);
  }

  /* ---------- 타이머 ---------- */
  function startTimer() {
    stopTimer();
    state.timerInterval = setInterval(function () {
      if (!state.mounted || state.finished) return;
      var el = byId('lst-time');
      if (!el) return;
      var elapsed = Math.floor((Date.now() - state.roundStart) / 1000);
      var rule = DIFF_RULE[state.difficulty];
      if (rule.timeLimit > 0) {
        var remain = rule.timeLimit - elapsed;
        el.textContent = String(Math.max(0, remain));
        if (remain <= 0 && !state.busy) {
          state.busy = true;
          showToast('\u23f0 제한 시간 초과! 다음 라운드로 넘어갑니다.', 'error');
          var tid = setTimeout(nextRound, 1400);
          state.fireTimeouts.push(tid);
        }
      } else {
        el.textContent = String(elapsed);
      }
    }, 500);
  }
  function stopTimer() {
    if (typeof state.timerInterval !== 'undefined' && state.timerInterval) {
      clearInterval(state.timerInterval);
      state.timerInterval = null;
    }
  }

  /* ---------- 라운드 UI 렌더링 ---------- */
  function renderRound() {
    var p = state.problem;
    if (!p) return;
    var missionEl = byId('lst-mission');
    if (missionEl) missionEl.innerHTML = '<b>라운드 ' + state.round + '</b> · ' + escapeHTML(p.mission);
    var formulaEl = byId('lst-formula');
    if (formulaEl) formulaEl.textContent = formulaHTML(p.type, state.coeffs);

          '<span class="lst-val" id="lst-val-' + sl.key + '">' + fmtNum(state.coeffs[sl.key]) + '</span></div>';
      }).join('');
      Array.prototype.forEach.call(slidersEl.querySelectorAll('input[type="range"]'), function (input) {
        input.addEventListener('input', function () {
          var key = input.getAttribute('data-key');
          state.coeffs[key] = parseFloat(input.value);
          var valEl = byId('lst-val-' + key);
          if (valEl) valEl.textContent = fmtNum(state.coeffs[key]);
          var formulaEl2 = byId('lst-formula');
          if (formulaEl2) formulaEl2.textContent = formulaHTML(state.problem.type, state.coeffs);
          updatePreview();
        });
      });
    }
    var divergeBtn = byId('lst-diverge-btn');
    if (divergeBtn) divergeBtn.style.display = p.type === 'D' ? '' : 'none';
    renderBoard();
    updateStatus();
  }

  function saveScore(nickname) {
    var name = (nickname || '').trim().slice(0, 12) || '익명의 명사수';
    var list = [];
    try { list = JSON.parse(localStorage.getItem(LS_KEY) || '[]'); } catch (e) { list = []; }
    list.push({ nickname: name, score: state.score, date: new Date().toISOString().slice(0, 10) });
    list.sort(function (a, b) { return b.score - a.score; });
    list = list.slice(0, 20);
    try { localStorage.setItem(LS_KEY, JSON.stringify(list)); } catch (e) {}

    try {
      if (typeof window.submitRanking === 'function') {
        window.submitRanking(APP_ID, state.score, true, name, BOTTOM_BOARD_ID);
        sent = true;
      }

    showToast(sent ? '\ud83c\udfc6 명예의 전당에 기록을 전송했습니다!' : '\ud83d\udcbe 이 기기에 기록을 저장했습니다!', 'success');

      '<li>난이도: \ud83c\udf31 쉬움(유리식·넓은 과녁·무제한) / \ud83c\udf3f 보통(등비 포함·발사 3회) / \ud83d\udd25 도전(발산 함정·좁은 과녁·라운드당 60초·미리보기 잠김)</li>' +

  /* ---------- 이벤트 바인딩 ---------- */
  function refreshModeBar() {
    var bar = byId('lst-mode-bar');
    if (!bar) return;
    Array.prototype.forEach.call(bar.querySelectorAll('.lst-mode-btn'), function (btn) {
      if (btn.getAttribute('data-diff') === state.difficulty) btn.classList.add('active');
      else btn.classList.remove('active');
    });
  }
  function refreshLockBtn() {
    var btn = byId('lst-lock-btn');
    if (btn) btn.textContent = state.previewLocked ? '\ud83d\udd13 미리보기 해제' : '\ud83d\udd12 미리보기 잠금';
  }
  function bindEvents() {
    var guideBtn = byId('lst-guide-btn');
    if (guideBtn) guideBtn.addEventListener('click', showGuideModal);
    var rankBtn = byId('lst-rank-btn');
    if (rankBtn) rankBtn.addEventListener('click', function () { showRankingModal(state.finished && state.score > 0); });
    var homeBtn = byId('lst-home-btn');
    if (homeBtn) homeBtn.addEventListener('click', goHomeSafe);
    var fireBtn = byId('lst-fire-btn');
    if (fireBtn) fireBtn.addEventListener('click', fire);
    var divergeBtn = byId('lst-diverge-btn');
    if (divergeBtn) divergeBtn.addEventListener('click', declareDivergence);
    var lockBtn = byId('lst-lock-btn');
    if (lockBtn) lockBtn.addEventListener('click', function () {
      state.previewLocked = !state.previewLocked;
      refreshLockBtn();
      updatePreview();
      showToast(state.previewLocked ? '\ud83d\udd12 극한값 미리보기를 잠걔습니다. 직접 계산해보세요!' : '\ud83d\udd13 극한값 미리보기를 켰습니다.', '');
    });
    var restartBtn = byId('lst-restart-btn');
    if (restartBtn) restartBtn.addEventListener('click', function () {
      restartGame();
      showToast('새 게임을 시작합니다! 극한값을 과녁에 명중시켜보세요.', '');
    });
    var bar = byId('lst-mode-bar');
    if (bar) {
      bar.addEventListener('click', function (ev) {
        var btn = ev.target && ev.target.closest ? ev.target.closest('.lst-mode-btn') : null;
        if (!btn) return;
        var diff = btn.getAttribute('data-diff');
        if (diff && diff !== state.difficulty && DIFF_RULE[diff]) {
          state.difficulty = diff;
          refreshModeBar();
          restartGame();
          showToast(DIFF_RULE[diff].label + ' 난이도로 새 게임을 시작합니다!', '');
        }
      });
    }
  }
  function restartGame() {
    state.round = 1;
    state.score = 0;
    state.hits = 0;
    state.finished = false;
    state.busy = false;
    state.previewLocked = DIFF_RULE[state.difficulty].lockPreview;
    clearFireTimeouts();
    closeModal();
    buildRound();
    renderRound();
    refreshLockBtn();
    startTimer();
  }

  /* ---------- 안전 마운트 (Gen-3 표준 템플릿 A) ---------- */
  function mount(container, context) {
    var host = null;
    if (typeof container === 'string') {
      try { host = document.querySelector(container); } catch (e) { host = null; }
    } else if (container instanceof HTMLElement) {
      host = container;
    }
    if (!host && window.MathLabUtils && typeof window.MathLabUtils.getMountContainer === 'function') {
      try { host = window.MathLabUtils.getMountContainer(container); } catch (e) { host = null; }
    }
    if (!host || !(host instanceof HTMLElement)) {
      host = document.getElementById('mathlab-view') || document.getElementById('new-root') || document.getElementById('game-container');
    }
    if (!host || !(host instanceof HTMLElement) || host === document.body) {
      var createdHost = document.getElementById('limit-shooting-force-host');
      if (!createdHost) {
        createdHost = document.createElement('div');
        createdHost.id = 'limit-shooting-force-host';
        document.body.appendChild(createdHost);
      }
      host = createdHost;
    }
    var footerEl = document.querySelector('footer, #footer, .app-footer');
    if (footerEl && host && typeof host.compareDocumentPosition === 'function' && (host.compareDocumentPosition(footerEl) & Node.DOCUMENT_POSITION_PRECEDING)) {
      try { footerEl.parentNode.insertBefore(host, footerEl); } catch (e) {}
    }
    host.style.display = '';
    host.style.visibility = 'visible';
    host.style.opacity = '1';
    var parent = host.parentElement;
    while (parent && parent !== document.body && parent !== document.documentElement) {
      if (parent.style && parent.style.display === 'none') parent.style.display = 'block';
      if (parent.style && parent.style.visibility === 'hidden') parent.style.visibility = 'visible';
      parent = parent.parentElement;
    }
    document.querySelectorAll('header, .navbar, #app-header, .top-bar, #floating-home-btn, .floating-home').forEach(function (el) {
      if (el && el.style && el.style.display === 'none') el.style.display = '';
    });
    state.host = host;
    state.mounted = true;
    host.innerHTML = buildHTML();
    bindEvents();
    refreshModeBar();
    restartGame();
    renderBottomLeaderboard();
  }

  /* ---------- 정리·홈 복귀 ---------- */
  function destroy() {
    stopTimer();
    clearFireTimeouts();
    closeModal();
    state.mounted = false;
    if (state.host) {
      try { state.host.innerHTML = ''; } catch (e) {}
    }
    state.host = null;
  }
  function goHomeSafe() {
    stopTimer();
    clearFireTimeouts();
    closeModal();
    destroy();
    try {
      
    } catch (e) { console.warn('limit-shooting backHome 방어:', e); }
    var forced = document.getElementById('limit-shooting-force-host');
    if (forced) {
      forced.style.display = 'none';
      forced.innerHTML = '';
    }
    if (typeof window.goHome === 'function') {
      try { window.goHome(); } catch (e) { console.warn('limit-shooting goHome 방어:', e); }
    }
  }

  var LimitShooting = {
    mount: mount,
    resetGame: restartGame,
    destroy: destroy,
    goHome: goHomeSafe
  };

  /* ---------- 3중 자율 등록 & 상호 실행 브리지 (Gen-3 표준 템플릿 B) ---------- */
  function registerLimitShooting() {
    if (typeof window.MathLabGames !== 'undefined' && typeof window.MathLabGames.register === 'function') {
      var exists = false;
      try { exists = typeof window.MathLabGames.get === 'function' && !!window.MathLabGames.get(APP_ID); } catch (e) { exists = false; }
      if (!exists) {
        try {
          window.MathLabGames.register({
            id: APP_ID,
            title: APP_TITLE,
            icon: '\ud83c\udff9',
            sourceType: 'new',
            players: '1인',
            isMultiplayer: false,
            mount: function (container, context) { LimitShooting.mount(container, context); },
            reset: function () { LimitShooting.resetGame(); },
            destroy: function () { LimitShooting.destroy(); },
            goHome: function () { LimitShooting.goHome(); }
          });
        } catch (e) { console.warn('limit-shooting 안전 등록 방어:', e); }
      }
    }
  }

  registerLimitShooting();
  window.addEventListener('DOMContentLoaded', registerLimitShooting);
  setTimeout(registerLimitShooting, 100);
  setTimeout(registerLimitShooting, 500);

  window.LimitShooting = LimitShooting;

  window.initLimitShootingGame = function () {
    registerLimitShooting();
    if (window.LegacyBridge && typeof window.LegacyBridge.hideAllLegacySections === 'function') {
      window.LegacyBridge.hideAllLegacySections();
      if (typeof window.LegacyBridge.showNewRoot === 'function') window.LegacyBridge.showNewRoot();
    }
    if (typeof window.MathLabGames !== 'undefined' && typeof window.MathLabGames.mount === 'function') {
      try { window.MathLabGames.mount(APP_ID); return; } catch (e) { console.warn('limit-shooting 범용 마운트 방어:', e); }
    }
    var targetEl = document.getElementById('mathlab-view') || document.getElementById('new-root');
    LimitShooting.mount(targetEl);
  };

  window.launchLimitShootingGame = function () {
    window.initLimitShootingGame();
  };
})();
</script>
