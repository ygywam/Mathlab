<style>
  .game-kenken {
    width: 100%;
    min-height: 100%;
    padding: 20px;
    box-sizing: border-box;
    background: #0f172a;
    font-family: 'Pretendard', -apple-system, system-ui, sans-serif;
    color: #f8fafc !important;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .game-kenken .home-btn {
    align-self: flex-start;
    background: #334155;
    color: #f8fafc;
    border: 1px solid #475569;
    padding: 10px 18px;
    border-radius: 12px;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .game-kenken .home-btn:hover { background: #475569; transform: translateY(-1px); }

  .game-kenken .kk-header {
    width: 100%;
    max-width: 600px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    background: #1e293b;
    padding: 18px 22px;
    border-radius: 20px;
    border: 1px solid #334155;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
  }

  .game-kenken .kk-title h1 {
    margin: 0;
    font-size: 1.6rem;
    font-weight: 800;
    color: #f8fafc;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  
  .game-kenken .kk-diff-badge {
    background: #3b82f6;
    color: white;
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 0.85rem;
    font-weight: 700;
    margin-top: 6px;
    display: inline-block;
  }

  .game-kenken .kk-stats {
    text-align: right;
  }
  .game-kenken .kk-stats div {
    font-size: 0.95rem;
    font-weight: 600;
    color: #94a3b8;
    margin-bottom: 4px;
  }
  .game-kenken .kk-stats strong {
    color: #38bdf8;
    font-size: 1.2rem;
  }

  /* 난이도 선택 탭 */
  .game-kenken .mission-tabs {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    width: 100%;
    max-width: 600px;
    margin-bottom: 20px;
  }
  .game-kenken .tab-btn {
    padding: 12px;
    border-radius: 14px;
    border: 2px solid #334155;
    background: #1e293b;
    color: #94a3b8;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
  }
  .game-kenken .tab-btn.active {
    border-color: #38bdf8;
    background: #0ea5e9;
    color: #ffffff;
    box-shadow: 0 4px 12px rgba(14,165,233,0.3);
  }

  /* 안내 박스 */
  .game-kenken .kk-guide-box {
    width: 100%;
    max-width: 600px;
    background: #1e293b;
    border: 1px solid #334155;
    padding: 18px;
    border-radius: 16px;
    margin-bottom: 24px;
    font-size: 0.95rem;
    line-height: 1.6;
    color: #cbd5e1;
    text-align: left;
  }
  .game-kenken .kk-guide-box strong.title {
    display: block;
    margin-bottom: 10px;
    font-size: 1.05rem;
    color: #38bdf8;
  }
  .game-kenken .kk-guide-example {
    background: #0f172a;
    padding: 12px;
    border-radius: 10px;
    margin-top: 10px;
    font-size: 0.88rem;
    color: #e2e8f0;
    border: 1px dashed #475569;
  }

  /* Grid Layout */
  .game-kenken .kk-board-container {
    width: 100%;
    max-width: 520px;
    background: #1e293b;
    padding: 20px;
    border-radius: 20px;
    border: 1px solid #334155;
    box-shadow: 0 15px 35px rgba(0,0,0,0.4);
    margin-bottom: 24px;
    position: relative;
  }

  .game-kenken .kk-grid {
    display: grid;
    gap: 0;
    width: 100%;
    aspect-ratio: 1/1;
    border: 3px solid #f8fafc;
    background: #0f172a;
    border-radius: 8px;
    overflow: hidden;
  }
  
  .game-kenken .kk-cell {
    background: #1e293b;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.2rem;
    font-weight: 800;
    color: #ffffff;
    cursor: pointer;
    user-select: none;
    border: 1px dashed #475569;
    transition: background 0.15s, box-shadow 0.15s;
  }
  
  .game-kenken .kk-cell.selected {
    background: #1d4ed8;
    box-shadow: inset 0 0 0 3px #60a5fa;
  }
  
  .game-kenken .kk-cell.error {
    background: #7f1d1d;
    color: #f87171;
  }
  
  .game-kenken .kk-cell.hint {
    color: #34d399;
  }

  /* Thick borders for cages */
  .game-kenken .kk-cell.border-t { border-top: 3px solid #f8fafc; }
  .game-kenken .kk-cell.border-b { border-bottom: 3px solid #f8fafc; }
  .game-kenken .kk-cell.border-l { border-left: 3px solid #f8fafc; }
  .game-kenken .kk-cell.border-r { border-right: 3px solid #f8fafc; }

  /* Cage Label */
  .game-kenken .kk-cage-label {
    position: absolute;
    top: 4px;
    left: 6px;
    font-size: 0.95rem;
    font-weight: 800;
    color: #facc15;
    pointer-events: none;
  }

  /* Keypad */
  .game-kenken .kk-keypad {
    width: 100%;
    max-width: 520px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-bottom: 24px;
  }
  
  .game-kenken .kk-key {
    flex: 1 1 calc(20% - 8px);
    min-width: 48px;
    height: 54px;
    border-radius: 14px;
    border: 1px solid #334155;
    background: #1e293b;
    color: #ffffff;
    font-size: 1.5rem;
    font-weight: 800;
    box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    cursor: pointer;
    transition: all 0.1s;
  }
  .game-kenken .kk-key:hover { background: #334155; }
  .game-kenken .kk-key:active { transform: scale(0.95); background: #0ea5e9; }
  
  .game-kenken .kk-key.action-clear {
    background: #ef4444;
    color: white;
    border-color: #dc2626;
  }

  /* Controls */
  .game-kenken .kk-controls {
    width: 100%;
    max-width: 520px;
    display: flex;
    gap: 12px;
    margin-bottom: 30px;
  }
  .game-kenken .btn-ctrl {
    flex: 1;
    padding: 16px;
    border-radius: 14px;
    border: none;
    font-weight: 800;
    font-size: 1.05rem;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    transition: transform 0.1s, background 0.2s;
  }
  .game-kenken .btn-ctrl:active { transform: scale(0.98); }
  
  .game-kenken .btn-check { background: #3b82f6; color: white; }
  .game-kenken .btn-check:hover { background: #2563eb; }
  .game-kenken .btn-hint { background: #10b981; color: white; }
  .game-kenken .btn-hint:hover { background: #059669; }
  .game-kenken .btn-reset { background: #64748b; color: white; }

  /* Overlay */
  .game-kenken .kk-overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(15, 23, 42, 0.94);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
    border-radius: 20px;
    backdrop-filter: blur(6px);
    padding: 20px;
    text-align: center;
  }
  .game-kenken .btn-primary {
    background: #3b82f6; color: white; padding: 14px 28px;
    border-radius: 12px; border: none; font-size: 1.15rem;
    font-weight: 800; cursor: pointer; margin-top: 15px;
  }

  /* 명예의 전당 */
  .game-kenken .kk-leaderboard-card {
    width: 100%;
    max-width: 600px;
    background: #1e293b;
    border: 1px solid #334155;
    padding: 22px;
    border-radius: 20px;
    margin-bottom: 30px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
  }

  @media (max-width: 500px) {
    .game-kenken .kk-cell { font-size: 1.6rem; }
    .game-kenken .kk-cage-label { font-size: 0.8rem; }
    .game-kenken .kk-title h1 { font-size: 1.3rem; }
  }

  /* Gen-3 토스트창 */
  .game-kenken .kk-toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #334155;
    color: #fff;
    padding: 12px 24px;
    border-radius: 12px;
    font-weight: bold;
    box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    z-index: 999999;
    opacity: 0;
    transition: opacity 0.3s, bottom 0.3s;
    pointer-events: none;
  }
  .game-kenken .kk-toast.error { background: #dc2626; }
  .game-kenken .kk-toast.show { opacity: 1; bottom: 40px; }
</style>

      toast.className = 'kk-toast' + (isError ? ' error' : '');

      this.container.appendChild(toast);

      this.timers.forEach(clearTimeout);
      if (this.timerInterval) clearInterval(this.timerInterval);
      // 빈화면 오류 방지: 컴포넌트 해제 시 무조건 화면을 날리지 않도록 처리
      // if (this.container) this.container.innerHTML = '';
    },

    startTimer() {
      this.state.startTime = Date.now() - this.state.timeElapsed * 1000;
      this.timerInterval = setInterval(() => {
        if (this.state.isGameOver) return;
        this.state.timeElapsed = Math.floor((Date.now() - this.state.startTime) / 1000);
        this.updateStats();
      }, 1000);
    },

    updateStats() {
      const timeEl = this.container.querySelector('#kk-time');
      const scoreEl = this.container.querySelector('#kk-score');
      const hintsEl = this.container.querySelector('#kk-hints');
      
      if (timeEl) {
        const m = Math.floor(this.state.timeElapsed / 60);
        const s = this.state.timeElapsed % 60;
        timeEl.textContent = `${m}:${s.toString().padStart(2, '0')}`;
      }
      if (scoreEl) scoreEl.textContent = this.state.score;
      if (hintsEl) hintsEl.textContent = this.state.hintsLeft;
    },

    render() {
      let html = `
        <div class="game-kenken">
          <button class="home-btn" id="kk-go-home" style="background: #ef4444; color: #fff; border: none;">🏠 홈으로</button>

          <div class="kk-header">
            <div class="kk-title">
              <h1>${this.icon} ${this.title}</h1>
              <div class="kk-diff-badge">${this.state.size}x${this.state.size} ${this.state.difficulty}</div>
            </div>
            <div class="kk-stats">
              <div>점수: <strong id="kk-score">${this.state.score}</strong></div>
              <div>시간: <strong id="kk-time">0:00</strong></div>
              <div style="font-size:0.85rem; color:#94a3b8;">힌트: <span id="kk-hints">${this.state.hintsLeft}</span>/3</div>
            </div>
          </div>
          
          <div class="mission-tabs">
            <button class="tab-btn ${this.state.difficulty === '쉬움' ? 'active' : ''}" id="kk-tab-easy">4×4 쉬움</button>
            <button class="tab-btn ${this.state.difficulty === '보통' ? 'active' : ''}" id="kk-tab-normal">4×4 보통</button>
            <button class="tab-btn ${this.state.difficulty === '어려움' ? 'active' : ''}" id="kk-tab-hard">5×5 어려움</button>
          </div>

          <div class="kk-guide-box">
            <strong class="title">📖 켄켄 퍼즐 게임 규칙</strong>
            1. <strong>가로줄(행)</strong>과 <strong>세로줄(열)</strong>에는 1부터 ${this.state.size}까지의 숫자가 <strong>중복 없이 딱 한 번씩만</strong> 들어가야 합니다.<br>
            2. 굵은 선으로 묶인 영역(케이지)의 좌측 상단에는 <strong>[목표값과 연산기호]</strong>가 적혀 있습니다.<br>
            3. 영역 안의 숫자들을 해당 연산(+, -, ×, ÷)으로 계산했을 때 그 목표값이 나와야 합니다.<br>
          </div>
          
          <div class="kk-board-container">
            <div class="kk-grid" style="grid-template-columns: repeat(${this.state.size}, 1fr);">
              ${this.generateGridHTML()}
            </div>
          </div>
          
          <div class="kk-keypad">
            ${Array.from({length: this.state.size}, (_, i) => 
              `<button class="kk-key" data-val="${i+1}">${i+1}</button>`
            ).join('')}
            <button class="kk-key action-clear" data-val="clear">지우기</button>
          </div>
          
          <div class="kk-controls">
            <button class="btn-ctrl btn-check" id="kk-btn-check">검사하기 (정답 제출)</button>
            <button class="btn-ctrl btn-hint" id="kk-btn-hint">힌트 사용 (-50점)</button>
          </div>
          
          <div class="kk-leaderboard-card">
            <h3 style="margin:0 0 14px 0; font-size:1.15rem; color:#f8fafc; text-align: center;">🏆 명예의 전당 (최고 점수)</h3>
            <div id="board-kenken">
              <p style="color:#94a3b8; font-size:0.9rem; text-align:center;">로딩 중...</p>
            </div>
          </div>
        </div>
      `;
      
      this.container.innerHTML = html;
      this.bindEvents();
      this.updateStats();
      this.loadLeaderboard();
    },

    loadLeaderboard() {
      try {
        if (typeof window.loadGameLeaderboard === 'function') {
          window.loadGameLeaderboard('켄켄 퍼즐', true, 'board-kenken');
          return;
        }
        this.renderLocalLeaderboard();
      } catch (e) {
        this.renderLocalLeaderboard();
      }
    },

    renderLocalLeaderboard() {
      const lbContainer = this.container.querySelector('#board-kenken');
      if (!lbContainer) return;
      
      let list = [];
      try {
        list = JSON.parse(localStorage.getItem('mathlab_lb_kenken') || '[]');
      } catch(e) {}

      if (list.length === 0) {
        lbContainer.innerHTML = '<p style="color:#64748b; font-size:0.9rem; text-align:center; padding:15px 0;">아직 등록된 명예의 전당 기록이 없습니다.</p>';
        return;
      }

      let html = `<table style="width:100%; border-collapse:collapse; font-size:0.9rem; color:#e2e8f0;">
        <thead>
          <tr style="border-bottom:1px solid #334155; color:#38bdf8;">
            <th style="padding:8px 4px; width:15%;">순위</th>
            <th style="padding:8px 4px; text-align:left;">닉네임</th>
            <th style="padding:8px 4px; width:25%;">점수</th>
            <th style="padding:8px 4px; width:20%;">날짜</th>
          </tr>
        </thead><tbody>`;
      
      list.slice(0, 5).forEach((item, idx) => {
        const medal = idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : `${idx + 1}위`;
        html += `
          <tr style="border-bottom:1px solid #1e293b; text-align:center;">
            <td style="padding:8px 4px; font-weight:bold;">${medal}</td>
            <td style="padding:8px 4px; text-align:left; font-weight:700; color:#f8fafc;">${item.nickname}</td>
            <td style="padding:8px 4px; font-weight:800; color:#38bdf8;">${item.score}점</td>
            <td style="padding:8px 4px; color:#64748b; font-size:0.8rem;">${item.date}</td>
          </tr>`;
      });
      html += `</tbody></table>`;
      lbContainer.innerHTML = html;
    },

    generateGridHTML() {
      let html = '';
      const cageMap = {};
      this.state.puzzle.cages.forEach(cage => {
        cage.cells.forEach(([r, c]) => {
          cageMap[`${r},${c}`] = cage;
        });
      });

      for (let r = 0; r < this.state.size; r++) {
        for (let c = 0; c < this.state.size; c++) {
          const cage = cageMap[`${r},${c}`];
          let classes = ['kk-cell'];
          if (r === 0 || cageMap[`${r-1},${c}`] !== cage) classes.push('border-t');
          if (r === this.state.size-1 || cageMap[`${r+1},${c}`] !== cage) classes.push('border-b');
          if (c === 0 || cageMap[`${r},${c-1}`] !== cage) classes.push('border-l');
          if (c === this.state.size-1 || cageMap[`${r},${c+1}`] !== cage) classes.push('border-r');
          
          if (this.state.selectedCell && this.state.selectedCell[0] === r && this.state.selectedCell[1] === c) {
            classes.push('selected');
          }
          if (this.state.cellErrors[r][c]) classes.push('error');
          if (this.state.cellHints[r][c]) classes.push('hint');
          
          let isLabelCell = false;
          cage.cells.sort((a, b) => a[0] === b[0] ? a[1] - b[1] : a[0] - b[0]);
          if (cage.cells[0][0] === r && cage.cells[0][1] === c) {
            isLabelCell = true;
          }

          const val = this.state.grid[r][c] || '';
          const label = isLabelCell ? `${cage.target}${cage.op}` : '';

          html += `
            <div class="${classes.join(' ')}" data-r="${r}" data-c="${c}">
              ${label ? `<div class="kk-cage-label">${label}</div>` : ''}
              ${val}
            </div>
          `;
        }
      }
      return html;
    },

    // ✨ 누락되었던 바인딩 및 클릭 핸들러 복원
    bindEvents() {
      this.container.querySelector('#kk-go-home')?.addEventListener('click', () => this.goHome());
      
      this.container.querySelector('#kk-tab-easy')?.addEventListener('click', () => this.switchLevel('쉬움'));
      this.container.querySelector('#kk-tab-normal')?.addEventListener('click', () => this.switchLevel('보통'));
      this.container.querySelector('#kk-tab-hard')?.addEventListener('click', () => this.switchLevel('어려움'));

      const grid = this.container.querySelector('.kk-grid');
      grid.addEventListener('mousedown', (e) => this.handleCellClick(e));
      grid.addEventListener('touchstart', (e) => this.handleCellClick(e), {passive: false});
      
      const keypad = this.container.querySelector('.kk-keypad');
      keypad.addEventListener('click', (e) => {
        const key = e.target.closest('.kk-key');
        if (key) this.handleKeyPress(key.dataset.val);
      });
      
      this.container.querySelector('#kk-btn-check')?.addEventListener('click', () => this.checkPuzzle());
      this.container.querySelector('#kk-btn-hint')?.addEventListener('click', () => this.useHint());
    },

    handleCellClick(e) {
      const cell = e.target.closest('.kk-cell');
      if (!cell) return;
      const r = parseInt(cell.dataset.r);
      const c = parseInt(cell.dataset.c);
      this.state.selectedCell = [r, c];
      
      this.container.querySelectorAll('.kk-cell').forEach(el => el.classList.remove('selected'));
      cell.classList.add('selected');
    },

    handleKeyPress(val) {
      if (!this.state.selectedCell || this.state.isGameOver) return;
      const [r, c] = this.state.selectedCell;
      
      if (val === 'clear') {
        this.state.grid[r][c] = '';
      } else {
        this.state.grid[r][c] = parseInt(val);
      }
      
      this.state.cellErrors[r][c] = false;
      this.state.cellHints[r][c] = false;
      this.renderBoardOnly();
    },

    useHint() {
      if (this.state.hintsLeft <= 0) {
        this.showToast('힌트를 모두 사용했습니다!', true);
        return;
      }
      this.showToast('힌트 기능이 임시 비활성화 되어있습니다.');
      // 힌트 구현부 (생략)
    },

    checkPuzzle() {
      this.showToast('임시 제출완료 (검증 로직 생략됨)', false);
    },

    renderBoardOnly() {
      const grid = this.container.querySelector('.kk-grid');
      if (grid) grid.innerHTML = this.generateGridHTML();
    }
  };

  // 애플리케이션 초기화 및 등록
  if (typeof window.MathLabGames !== 'undefined' && typeof window.MathLabGames.register === 'function') {
    window.MathLabGames.register(KenKenGame);
  }
  window.KenKenGame = KenKenGame;

})();
</script>
