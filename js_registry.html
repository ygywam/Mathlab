<script>
  window.MathLabGames = (function () {
    const games = new Map();
    
    // (최종 방어 로직) registry와 _registry 두 곳을 모두 뒤져서 과거 앱들을 모두 구출합니다!
    if (window.MathLabGames) {
      const oldRegistry = window.MathLabGames._registry || window.MathLabGames.registry;
      if (oldRegistry) {
        for (const id in oldRegistry) {
          if (oldRegistry.hasOwnProperty(id)) {
            games.set(id, oldRegistry[id]);
          }
        }
      }
    }

    let current = null;

    function scrollMathLabToTop() {
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          try {
            window.scrollTo({ top: 0, left: 0, behavior: 'auto' });
            document.documentElement.scrollTop = 0;
            document.body.scrollTop = 0;
            const view = document.getElementById('mathlab-view');
            if (view && typeof view.scrollIntoView === 'function') {
              view.scrollIntoView({ block: 'start', inline: 'nearest', behavior: 'auto' });
            }
            const legacyRoot = document.getElementById('legacy-root');
            if (legacyRoot) legacyRoot.scrollTop = 0;
          } catch (error) {
            console.warn('[MathLabGames] 상단 이동 처리 실패:', error);
          }
        });
      });
    }

    return {
      register(game) {
        if (!game || !game.id) throw new Error('게임 id가 없습니다.');
        if (games.has(game.id)) { games.set(game.id, game); return; }
        games.set(game.id, game);
      },

      get(id) { return games.get(id); },
      all() { return Array.from(games.values()); },

      mount(id, context = {}) {
        if (current && current.destroy) {
          try { current.destroy(); } catch(e) { console.error('Error destroying current game:', e); }
        }
        current = games.get(id);
        if (!current) throw new Error('Unknown game: ' + id);
        const modalOverlay = document.getElementById('mathlab-global-modal-overlay');
        const defaultContainer = document.getElementById('mathlab-global-modal-content') || document.getElementById('mathlab-view') || document.getElementById('new-root') || document.body;
        
        if (modalOverlay) {
          modalOverlay.classList.remove('hidden');
          document.body.style.overflow = 'hidden';
        }
        
        const result = current.mount(defaultContainer, context);
        scrollMathLabToTop();
        return result;
      },

      destroyCurrent() {
        if (current && current.destroy) {
          try { current.destroy(); } catch(e) { console.error('Error in destroyCurrent:', e); }
        }
        current = null;
        
        const modalOverlay = document.getElementById('mathlab-global-modal-overlay');
        const modalContent = document.getElementById('mathlab-global-modal-content');
        if (modalOverlay) {
          modalOverlay.classList.add('hidden');
          document.body.style.overflow = '';
          if (modalContent) modalContent.innerHTML = '';
        }
      },

      scrollToTop() { scrollMathLabToTop(); }
    };
  })();
</script>
