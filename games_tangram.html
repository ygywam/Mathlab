      { name: '신비의 피라미드 (Pyramid)', desc: '거대한 이집트 피라미드 실루엣을 제한시간 내 완성하세요!', targets: [

        { type: 'M', x: 250, y: 154, angle: 180, flip: false },
        { type: 'S', x: 154, y: 238, angle: 90, flip: false },
        { type: 'S', x: 346, y: 238, angle: 270, flip: false },
        { type: 'SQ', x: 250, y: 126, angle: 45, flip: false },
        { type: 'PARA', x: 250, y: 266, angle: 0, flip: true }
      ]},
      { name: '왕의 왕관 (Crown)', desc: '황금빛 뾰족한 장식으로 빛나는 영광의 왕관!', targets: [
        { type: 'L', x: 210, y: 200, angle: 180, flip: false },
        { type: 'L', x: 290, y: 200, angle: 180, flip: false },
        { type: 'M', x: 250, y: 200, angle: 0, flip: false },
        { type: 'S', x: 154, y: 172, angle: 270, flip: false },
        { type: 'S', x: 346, y: 172, angle: 90, flip: false },
        { type: 'SQ', x: 250, y: 144, angle: 45, flip: false },
        { type: 'PARA', x: 250, y: 256, angle: 0, flip: false }
      ]}
    ]
  };

  const Tangram = {
    id: 'tangram',
    container: null,
    state: {
      difficulty: 'easy',
      roundIdx: 0,
      maxRounds: 6,
      score: 0,
      pieces: [],
      selectedId: null,
      timer: 90,
      isAnswered: false,
      isGameOver: false,
      hintUsed: false,
      startTime: 0,
      draggingId: null,
      dragOffset: { x: 0, y: 0 }
    },
    timers: [],
    timerId: null,
    _boundListeners: false, // 전역 리스너 중복 바인딩 원천 차단 플래그

    mount(container, context) {
      let target = null;
      if (typeof container === 'string') target = document.querySelector(container);
      else if (container instanceof HTMLElement) target = container;
      if (!target) target = document.getElementById('mathlab-view') || document.getElementById('new-root') || document.getElementById('game-container');

      if (!target || target === document.body) {
        let host = document.getElementById('tangram-force-host');
        if (!host) {
          host = document.createElement('div'); host.id = 'tangram-force-host';
          host.style.cssText = 'width:100%; max-width:960px; margin:0 auto; padding:20px 10px; box-sizing:border-box; z-index:999; position:relative; background:#1e1b4b; min-height:650px; display:block; border-radius:24px;';
          const header = document.querySelector('header, .navbar, #app-header, .top-bar');
          if (header && header.parentNode) header.parentNode.insertBefore(host, header.nextSibling);
          else document.body.appendChild(host);
        }
        target = host;
      }

      this.container = target;
      this.container.style.display = 'block'; this.container.style.visibility = 'visible'; this.container.style.opacity = '1'; this.container.style.minHeight = '650px';

      let parentNode = this.container.parentElement;
      while (parentNode && parentNode !== document.body && parent !== document.documentElement) {
        if (parentNode.style && parentNode.style.display === 'none') parentNode.style.display = 'block';
        if (parentNode.style && parentNode.style.visibility === 'hidden') parentNode.style.visibility = 'visible';
        parent = parent.parentElement;
      }

      this.restoreGlobalNavigation();
      this.resetGame();
    },

    restoreGlobalNavigation() {
      const navElements = document.querySelectorAll('header, .navbar, #app-header, .top-bar, #floating-home-btn, .floating-home, [id*="home"], [class*="floating"]');
      navElements.forEach(el => { if (el && el.style && el.style.display === 'none') el.style.display = ''; });
    },

    setDifficulty(diff) {
      if (this.state.difficulty === diff && !this.state.isGameOver && this.state.roundIdx === 0) return;
      this.state.difficulty = diff;
      this.resetGame();
    },

    resetGame() {
      if (window.MathLabCleanup && typeof window.MathLabCleanup.clearTimers === 'function') {
        window.MathLabCleanup.clearTimers(this.timers);
      }
      this.timers.forEach(clearTimeout);
      this.timers = [];
      if (this.timerId) { clearInterval(this.timerId); this.timerId = null; }
      
      this.state.roundIdx = 0;
      this.state.score = 0;
      this.state.isGameOver = false;
      
      this.setupRound();
    },
    
    setupRound() {
      const stageList = STAGES[this.state.difficulty] || STAGES.easy;
      this.state.maxRounds = stageList.length;
      
      if (this.state.roundIdx >= stageList.length) {
        this.gameOver(true);
        return;
      }

      if (this.timerId) { clearInterval(this.timerId); this.timerId = null; }

      this.state.hintUsed = false;
      this.state.isAnswered = false;
      this.state.selectedId = 'L1';
      this.state.startTime = Date.now();
      this.state.draggingId = null;

      this.state.pieces = PIECE_DEFS.map(def => ({
        ...def,
        x: def.origX,
        y: def.origY,
        angle: 0,
        flipped: false,
        isLocked: false
      }));

      if (this.state.difficulty === 'hard') {
        this.state.timer = 90;
        this.timerId = setInterval(() => {
          if (this.state.isAnswered || this.state.isGameOver) return;
          this.state.timer--;
          this.updateTimerUI();
          if (this.state.timer <= 0) {
            clearInterval(this.timerId); this.timerId = null;
            this.handleTimeout();
          }
        }, 1000);
      }

      this.render();
    },

    updateTimerUI() {
      const el = this.container?.querySelector('.stat-badge.timer');
      const valEl = el?.querySelector('.timer-val');
      if (valEl) valEl.textContent = `${this.state.timer}초`;
    },

    handleTimeout() {
      this.state.isAnswered = true;
      const resArea = this.container?.querySelector('.result-area');
      if (resArea) {
        resArea.className = 'result-area show error';
        resArea.innerHTML = `⏰ <strong>시간 초과! 실루엣 완성 실패!</strong><br>제한 시간 내에 7개의 조각을 모두 알맞게 맞춰야 합니다.`;
      }
      const t = setTimeout(() => { this.gameOver(false); }, 2000);
      this.timers.push(t);
    },

    selectPiece(id) {
      if (this.state.isAnswered || this.state.isGameOver) return;
      this.state.selectedId = id;
      // 💡 [버벅임 해소 핵심]: innerHTML을 갈아엎지 않고 DOM 클래스/속성만 즉시 업데이트!
      this.updatePieceStylesOnly();
      this.updateControlUI();
    },

    rotateSelected(deltaAngle) {
      if (!this.state.selectedId || this.state.isAnswered || this.state.isGameOver) return;
      const p = this.state.pieces.find(item => item.id === this.state.selectedId);
      if (!p || p.isLocked) return;

      p.angle = (p.angle + deltaAngle + 360) % 360;
      this.checkSnap(p);
      
      // 💡 [버벅임 해소 핵심]: DOM 전체 재성성 없이 해당 조각의 transform과 스냅 상태만 동시 동기화!
      this.updateSinglePieceTransform(p);
      this.updatePieceStylesOnly();
      this.checkVictoryCondition();
    },

    flipSelected() {
      if (!this.state.selectedId || this.state.isAnswered || this.state.isGameOver) return;
      const p = this.state.pieces.find(item => item.id === this.state.selectedId);
      if (!p || !p.canFlip || p.isLocked) return;

      p.flipped = !p.flipped;
      this.checkSnap(p);
      this.updateSinglePieceTransform(p);
      this.updatePieceStylesOnly();
      this.checkVictoryCondition();
    },

    // 45도 각도 스냅 + 허용 오차 기반 고정 판정
    checkSnap(p) {
      if (p.isLocked) return;
      const stageList = STAGES[this.state.difficulty] || STAGES.easy;
      const curStage = stageList[this.state.roundIdx];
      if (!curStage) return;

      const matchingTargets = curStage.targets.filter(t => t.type === p.type);
      for (let t of matchingTargets) {
        const alreadyOccupied = this.state.pieces.some(other => other.isLocked && Math.abs(other.x - t.x) < 5 && Math.abs(other.y - t.y) < 5);
        if (alreadyOccupied) continue;

        const dist = Math.hypot(p.x - t.x, p.y - t.y);
        if (dist < 38) {
          let angleMatch = false;
          let flipMatch = (p.flipped === t.flip);

          if (p.type === 'SQ') {
            angleMatch = (p.angle % 90 === t.angle % 90);
            flipMatch = true;
          } else if (p.type === 'PARA') {
            if (p.flipped === t.flip) {
              angleMatch = (p.angle % 180 === t.angle % 180);
            } else {
              angleMatch = false;
            }
          } else {
            angleMatch = (p.angle === t.angle);
            flipMatch = true;
          }

          if (angleMatch && flipMatch) {
            p.x = t.x;
            p.y = t.y;
            p.angle = t.angle;
            p.flipped = t.flip;
            p.isLocked = true;
            break;
          }
        }
      }
    },

    checkVictoryCondition() {
      const allLocked = this.state.pieces.every(p => p.isLocked);
      if (!allLocked) return;

      this.state.isAnswered = true;
      if (this.timerId) { clearInterval(this.timerId); this.timerId = null; }

      let pts = 20;
      if (this.state.difficulty === 'hard') {
        pts += Math.floor(this.state.timer * 0.4);
      }
      if (this.state.hintUsed) pts = Math.max(5, pts - 5);
      this.state.score += pts;

      const resArea = this.container.querySelector('.result-area');
      if (resArea) {
        resArea.className = 'result-area show success';
        resArea.innerHTML = `
          🎉 🧩 <strong>실루엣 퍼즐 완벽 성공! (+${pts}점)</strong><br>
          7개의 칠교 조각을 빈틈이나 겹침 없이 정확하게 맞추어 작품을 완성했습니다!
        `;
      }

      const t = setTimeout(() => {
        this.state.roundIdx++;
        this.setupRound();
      }, 2200);
      this.timers.push(t);
      this.updateStatsUI();
    },

    gameOver(cleared) {
      if (cleared && !this.state.isGameOver) {
        this.state.score += 50;
      }
      this.state.isGameOver = true;
      if (this.timerId) { clearInterval(this.timerId); this.timerId = null; }
      this.render();
      
      if (this.state.score > 0) {
        const t = setTimeout(() => {
          this.showInlineRankingModal('board-tangram', this.state.score, { cleared: cleared, difficulty: this.state.difficulty });
        }, 600);
        this.timers.push(t);
      }
    },

    updateControlUI() {
      const root = this.container?.querySelector('.game-tangram');
      if (!root) return;
      
      const selP = this.state.pieces.find(p => p.id === this.state.selectedId);
      const nameEl = root.querySelector('#tg-sel-name');
      const btnRotateRight = root.querySelector('#tg-btn-rot-right');
      const btnRotateLeft = root.querySelector('#tg-btn-rot-left');
      const btnFlip = root.querySelector('#tg-btn-flip');

      if (selP) {
        if (nameEl) nameEl.textContent = `${selP.name} (선택됨)`;
        if (btnRotateRight) btnRotateRight.disabled = selP.isLocked || this.state.isAnswered;
        if (btnRotateLeft) btnRotateLeft.disabled = selP.isLocked || this.state.isAnswered;
        if (btnFlip) {
          btnFlip.disabled = !selP.canFlip || selP.isLocked || this.state.isAnswered;
          btnFlip.style.display = selP.canFlip ? 'flex' : 'none';
        }
      } else {
        if (nameEl) nameEl.textContent = '조각을 클릭하여 선택하세요';
        if (btnRotateRight) btnRotateRight.disabled = true;
        if (btnRotateLeft) btnRotateLeft.disabled = true;
        if (btnFlip) btnFlip.disabled = true;
      }
    },

    // 💡 [버벅임 0% 최적화]: DOM 전체를 갈아엎지 않고 개별 조각의 속성/스타일만 초고속 렌더링
    updateSinglePieceTransform(p) {
      const root = this.container?.querySelector('.game-tangram');
      if (!root) return;
      const group = root.querySelector(`.tg-piece-group[data-id="${p.id}"]`);
      if (group) {
        group.setAttribute('transform', `translate(${p.x}, ${p.y}) rotate(${p.angle}) scale(${p.flipped ? -1 : 1}, 1)`);
      }
    },

    updatePieceStylesOnly() {
      const root = this.container?.querySelector('.game-tangram');
      if (!root) return;
      const svgEl = root.querySelector('#tg-svg-canvas');
      if (!svgEl) return;

      this.state.pieces.forEach(p => {
        const isSel = (p.id === this.state.selectedId);
        const group = svgEl.querySelector(`.tg-piece-group[data-id="${p.id}"]`);
        if (!group) return;

        let strokeColor = isSel ? '#fef08a' : (p.isLocked ? '#4ade80' : '#ffffff');
        let strokeWidth = isSel ? '4.5' : (p.isLocked ? '3.5' : '2');
        let filterStr = isSel ? 'drop-shadow(0 0 12px rgba(254, 240, 138, 0.9))' : 'drop-shadow(0 4px 8px rgba(0,0,0,0.6))';

        group.style.cursor = p.isLocked ? 'default' : 'grab';
        group.style.filter = filterStr;

        const poly = group.querySelector('polygon');
        if (poly) {
          poly.setAttribute('stroke', strokeColor);
          poly.setAttribute('stroke-width', strokeWidth);
        }

        let lockIcon = group.querySelector('.lock-icon');
        if (p.isLocked && !lockIcon) {
          const textEl = document.createElementNS('http://www.w3.org/2000/svg', 'text');
          textEl.setAttribute('class', 'lock-icon');
          textEl.setAttribute('x', '0'); textEl.setAttribute('y', '6');
          textEl.setAttribute('text-anchor', 'middle'); textEl.setAttribute('font-size', '18');
          textEl.setAttribute('fill', '#ffffff'); textEl.setAttribute('font-weight', 'bold');
          textEl.textContent = '✅';
          group.appendChild(textEl);
        } else if (!p.isLocked && lockIcon) {
          lockIcon.remove();
        }

        // 선택된 조각을 맨 위 레이어로 끌어올리기 (DOM 트리 이동)
        if (isSel && group.parentNode && group.parentNode.lastElementChild !== group) {
          group.parentNode.appendChild(group);
        }
      });
    },

    // 초기 마운트 또는 라운드 리셋 시 단 1회만 SVG DOM 트리 구축
    updateSVG() {
      const root = this.container?.querySelector('.game-tangram');
      if (!root) return;
      const svgEl = root.querySelector('#tg-svg-canvas');
      if (!svgEl) return;

      const stageList = STAGES[this.state.difficulty] || STAGES.easy;
      const curStage = stageList[this.state.roundIdx] || stageList[0];

      let targetHtml = '';
      if (this.state.difficulty === 'easy') {
        curStage.targets.forEach((t) => {
          const def = PIECE_DEFS.find(item => item.type === t.type);
          if (!def) return;
          const transformStr = `translate(${t.x}, ${t.y}) rotate(${t.angle}) scale(${t.flip ? -1 : 1}, 1)`;
          targetHtml += `<polygon points="${def.points}" transform="${transformStr}" fill="rgba(56, 189, 248, 0.22)" stroke="#38bdf8" stroke-dasharray="6,4" stroke-width="2.5" />`;
        });
      } else {
        // 내부 경계선이 완벽하게 사라진 100% 통짜 실루엣!
        curStage.targets.forEach((t) => {
          const def = PIECE_DEFS.find(item => item.type === t.type);
          if (!def) return;
          const transformStr = `translate(${t.x}, ${t.y}) rotate(${t.angle}) scale(${t.flip ? -1 : 1}, 1)`;
          targetHtml += `<polygon points="${def.points}" transform="${transformStr}" fill="#334155" stroke="#334155" stroke-width="1.5" stroke-linejoin="round" />`;
        });
      }

      let piecesHtml = '';
      this.state.pieces.forEach(p => {
        const isSel = (p.id === this.state.selectedId);
        const transformStr = `translate(${p.x}, ${p.y}) rotate(${p.angle}) scale(${p.flipped ? -1 : 1}, 1)`;
        
        let strokeColor = isSel ? '#fef08a' : (p.isLocked ? '#4ade80' : '#ffffff');
        let strokeWidth = isSel ? '4.5' : (p.isLocked ? '3.5' : '2');
        let filterStr = isSel ? 'drop-shadow(0 0 12px rgba(254, 240, 138, 0.9))' : 'drop-shadow(0 4px 8px rgba(0,0,0,0.6))';

        piecesHtml += `
          <g class="tg-piece-group" data-id="${p.id}" transform="${transformStr}" style="cursor: ${p.isLocked ? 'default' : 'grab'}; filter: ${filterStr};">
            <polygon points="${p.points}" fill="${p.color}" stroke="${strokeColor}" stroke-width="${strokeWidth}" stroke-linejoin="round" />
            ${p.isLocked ? `<text class="lock-icon" x="0" y="6" text-anchor="middle" font-size="18" fill="#ffffff" font-weight="bold">✅</text>` : ''}
          </g>
        `;
      });

      const targetStyle = (this.state.difficulty !== 'easy') ? 'filter: drop-shadow(0 0 10px rgba(129, 140, 248, 0.6));' : '';

      svgEl.innerHTML = `
        <line x1="0" y1="330" x2="500" y2="330" stroke="#475569" stroke-width="2" stroke-dasharray="8,6" />
        <text x="250" y="352" text-anchor="middle" font-size="14" font-weight="900" fill="#94a3b8">👇 하단 조각 보관 트레이 👇</text>
        
        <g id="tg-target-layer" style="${targetStyle}">${targetHtml}</g>
        <g id="tg-pieces-layer">${piecesHtml}</g>
      `;
    },

      const stageList = STAGES[this.state.difficulty] || STAGES.easy;
      const curStage = stageList[this.state.roundIdx] || stageList[0];

            </div>
            <div class="stats-bar">
              <button class="btn-howto" id="tg-btn-howto-top">❓ 게임 방법 가이드</button>

              <div class="stat-badge score"><span class="score-val">${this.state.score}점</span></div>

                  <h3 style="font-size: 2.4rem; color: #ffffff !important; margin-top: 0; text-shadow:0 0 15px rgba(255,255,255,0.7);">${isCleared ? '🏆 웹 칠교놀이 엘리트 마스터 완료!' : '💥 시간 초과! 퍼즐 도전을 다시 시작하세요!'}</h3>
                  <p style="font-size: 1.4rem; color: #f8fafc; font-weight: 800;">최종 달성 점수: <strong style="color:#fef08a;">${this.state.score}점</strong></p>
                  <button class="btn-howto" id="tg-btn-restart-big" style="margin: 24px auto 0; max-width: 280px; padding: 18px; font-size: 1.3rem; justify-content:center;">🔄 새 실루엣 도전하기</button>

                    </div>
                    <div class="btn-group">
                      <button class="btn-ctrl" id="tg-btn-rot-right">↻ 45° 우회전</button>
                      <button class="btn-ctrl" id="tg-btn-rot-left">↺ 45° 좌회전</button>

                  </div>
                </div>
                
                <div class="result-area"></div>
                
                <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 4px;">
                  <button class="btn-secondary" id="tg-btn-hint" ${this.state.isAnswered ? 'disabled' : ''}>💡 조각 1개 정답 위치로 맞추기 (-5점)</button>
                  <button class="btn-secondary" id="tg-btn-reset-round" ${this.state.isAnswered ? 'disabled' : ''}>🔄 조각 트레이로 초기화</button>
                </div>
              `}
            </div>
            
            <div class="sidebar">
              <div class="card" style="padding:18px;">
                <h3 style="margin-top:0; font-size:1.2rem; color:#ffffff !important; margin-bottom:12px; text-shadow:0 0 10px rgba(255,255,255,0.5);">⚙️ 난이도 선택</h3>
                <div class="diff-selector">
                  <button class="diff-btn ${this.state.difficulty === 'easy' ? 'active' : ''}" data-diff="easy">쉬움 (6문항/선 있음)</button>
                  <button class="diff-btn ${this.state.difficulty === 'normal' ? 'active' : ''}" data-diff="normal">보통 (6문항/실루엣)</button>
                  <button class="diff-btn ${this.state.difficulty === 'hard' ? 'active' : ''}" data-diff="hard">도전 (6문항/제한+반전)</button>
                </div>
              </div>

              <div class="card" style="padding:18px;">
                <h3 style="margin-top:0; font-size:1.2rem; border-bottom:2px solid #6366f1; padding-bottom:12px; color:#ffffff !important; text-align:center; text-shadow:0 0 10px rgba(255,255,255,0.5);">🏆 명예의 전당 (Top 5)</h3>
                <div id="board-tangram">
                  <p style="color:#94a3b8; font-size:1rem; text-align:center; margin:16px 0;">로딩 중...</p>
                </div>
              </div>
              
              <div class="card" style="padding:18px;">
                <button class="btn-secondary" style="width:100%; margin-bottom:12px; padding:14px;" id="tg-btn-restart-side">🔄 처음부터 다시 도전</button>
                <button class="btn-secondary" style="width:100%; padding:14px; background:#059669; color:#ffffff !important; border:none;" id="tg-btn-home">🏠 홈으로</button>
              </div>
            </div>
          </div>
        </div>
      `;
      
      this.container.innerHTML = html;
      this.bindEvents();
      this.updateSVG();
      this.updateControlUI();
      this.loadLeaderboard();
    },

    bindEvents() {
      const root = this.container?.querySelector('.game-tangram');
      if (!root) return;
      
      const btnHowToTop = root.querySelector('#tg-btn-howto-top');
      if (btnHowToTop) btnHowToTop.addEventListener('click', () => this.showHowToPlayModal());

      root.querySelectorAll('.diff-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const diff = btn.getAttribute('data-diff');
          this.setDifficulty(diff);
        });
      });

      const btnRotRight = root.querySelector('#tg-btn-rot-right');
      if (btnRotRight) btnRotRight.addEventListener('click', () => this.rotateSelected(45));

      const btnRotLeft = root.querySelector('#tg-btn-rot-left');
      if (btnRotLeft) btnRotLeft.addEventListener('click', () => this.rotateSelected(-45));

      const btnFlip = root.querySelector('#tg-btn-flip');
      if (btnFlip) btnFlip.addEventListener('click', () => this.flipSelected());

      const btnHint = root.querySelector('#tg-btn-hint');
      if (btnHint) btnHint.addEventListener('click', () => {
        this.state.hintUsed = true;
        const stageList = STAGES[this.state.difficulty] || STAGES.easy;
        const curStage = stageList[this.state.roundIdx];
        if (!curStage) return;

        const unlocked = this.state.pieces.filter(p => !p.isLocked);
        if (unlocked.length > 0) {
          const p = unlocked[0];
          const targets = curStage.targets.filter(t => t.type === p.type);
          for (let t of targets) {
            const occ = this.state.pieces.some(o => o.isLocked && Math.abs(o.x - t.x) < 5 && Math.abs(o.y - t.y) < 5);
            if (!occ) {
              p.x = t.x; p.y = t.y; p.angle = t.angle; p.flipped = t.flip; p.isLocked = true;
              this.updateSinglePieceTransform(p);
              this.updatePieceStylesOnly();
              this.updateControlUI();
              this.checkVictoryCondition();
              btnHint.disabled = true;
              return;
            }
          }
        }
      });
      
      const btnResetRound = root.querySelector('#tg-btn-reset-round');
      if (btnResetRound) btnResetRound.addEventListener('click', () => this.setupRound());

      const btnRestartBig = root.querySelector('#tg-btn-restart-big');
      if (btnRestartBig) btnRestartBig.addEventListener('click', () => this.resetGame());
      
      const btnRestartSide = root.querySelector('#tg-btn-restart-side');
      if (btnRestartSide) btnRestartSide.addEventListener('click', () => this.resetGame());

      const keyHandler = (e) => {
        if (!this.container || !document.body.contains(this.container)) {
          window.removeEventListener('keydown', keyHandler);
          return;
        }
        if (this.state.isAnswered || this.state.isGameOver || !this.state.selectedId) return;

        if (e.key === 'ArrowRight' || e.key === 'r' || e.key === 'R') {
          e.preventDefault();
          this.rotateSelected(45);
        } else if (e.key === 'ArrowLeft') {
          e.preventDefault();
          this.rotateSelected(-45);
        } else if (e.key === 'f' || e.key === 'F' || e.key === ' ') {
          e.preventDefault();
          this.flipSelected();
        }
      };
      window.removeEventListener('keydown', this._keyHandler);
      this._keyHandler = keyHandler;
      window.addEventListener('keydown', this._keyHandler);

      const btnHome = root.querySelector('#tg-btn-home');
      if (btnHome) {
        btnHome.addEventListener('click', (e) => {
          e.preventDefault();
          const topBottomHome = document.getElementById('mathlab-floating-home') || document.querySelector('#legacy-back-home-btn') || document.querySelector('.floating-home');
          if (topBottomHome) topBottomHome.click();
          else if (typeof window.MathLabRenderHome === 'function') window.MathLabRenderHome();
          else if (typeof window.goHome === 'function') window.goHome();
          else location.reload();
        });
      }

      // 💡 [버벅임/메모리 누수 해소]: SVG 드래그 및 마우스 리스너는 초기 렌더링 시 단 1번만 전역 바인딩!
      this.bindSVGEventsOnce();
    },
    
    bindSVGEventsOnce() {
      if (this._boundListeners) return;
      this._boundListeners = true;

      let lastTapTime = 0;

      const getSVGPoint = (e, svgEl) => {
        const rect = svgEl.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const x = (clientX - rect.left) * (500 / rect.width);
        const y = (clientY - rect.top) * (450 / rect.height);
        return { x, y };
      };

      const startDrag = (e) => {
        const group = e.target.closest('.tg-piece-group');
        if (!group) return;
        const svgEl = group.closest('svg');
        if (!svgEl) return;
        
        const id = group.getAttribute('data-id');
        const p = this.state.pieces.find(item => item.id === id);
        if (!p || p.isLocked) return;

        const now = Date.now();
        if (now - lastTapTime < 300 && this.state.selectedId === id) {
          this.rotateSelected(45);
          lastTapTime = 0;
          return;
        }
        lastTapTime = now;

        this.selectPiece(id);
        this.state.draggingId = id;
        
        const pt = getSVGPoint(e, svgEl);
        this.state.dragOffset = { x: pt.x - p.x, y: pt.y - p.y };

        if (e.type === 'touchstart') e.preventDefault();
      };

      // 💡 [requestAnimationFrame 초고속 스로틀링 적용]
      let rafId = null;
      let pendingEvent = null;

      const moveDrag = (e) => {
        if (!this.state.draggingId) return;
        if (e.type === 'touchmove') e.preventDefault();
        pendingEvent = e;

        if (!rafId) {
          rafId = requestAnimationFrame(() => {
            rafId = null;
            if (!this.state.draggingId || !pendingEvent) return;
            
            const p = this.state.pieces.find(item => item.id === this.state.draggingId);
            if (!p || p.isLocked) return;

            const root = this.container?.querySelector('.game-tangram');
            const svgEl = root?.querySelector('#tg-svg-canvas');
            if (!svgEl) return;

            const pt = getSVGPoint(pendingEvent, svgEl);
            p.x = Math.round(pt.x - this.state.dragOffset.x);
            p.y = Math.round(pt.y - this.state.dragOffset.y);
            p.x = Math.max(30, Math.min(470, p.x));
            p.y = Math.max(30, Math.min(420, p.y));

            // DOM 전체 재건 없이 transform 속성만 실시간 변경
            this.updateSinglePieceTransform(p);
          });
        }
      };

      const endDrag = () => {
        if (!this.state.draggingId) return;
        const p = this.state.pieces.find(item => item.id === this.state.draggingId);
        this.state.draggingId = null;

        if (p && !p.isLocked) {
          this.checkSnap(p);
          this.updateSinglePieceTransform(p);
          this.updatePieceStylesOnly();
          this.checkVictoryCondition();
        }
      };

      this._onStartDrag = startDrag;
      this._onMoveDrag = moveDrag;
      this._onEndDrag = endDrag;

      document.addEventListener('mousedown', (e) => {
        if (e.target.closest('#tg-svg-canvas')) startDrag(e);
      });
      document.addEventListener('mousemove', moveDrag);
      window.addEventListener('mouseup', endDrag);

      document.addEventListener('touchstart', (e) => {
        if (e.target.closest('#tg-svg-canvas')) startDrag(e);
      }, { passive: false });
      document.addEventListener('touchmove', moveDrag, { passive: false });
      window.addEventListener('touchend', endDrag);

      document.addEventListener('wheel', (e) => {
        if (e.target.closest('#tg-svg-canvas') && this.state.selectedId && !this.state.isAnswered) {
          e.preventDefault();
          this.rotateSelected(e.deltaY > 0 ? 45 : -45);
        }
      }, { passive: false });
    },

    loadLeaderboard() {
      try {
        if (typeof window.loadGameLeaderboard === 'function') {
          window.loadGameLeaderboard('웹 칠교놀이', true, 'board-tangram');
        } else {
          const localRanks = JSON.parse(localStorage.getItem('rank_board-tangram') || '[]');
          this.renderRankList(localRanks.slice(0, 5));
        }
      } catch (e) {
        console.error('[Tangram] 명예의 전당 로드 오류:', e);
        const localRanks = JSON.parse(localStorage.getItem('rank_board-tangram') || '[]');
        this.renderRankList(localRanks.slice(0, 5));
      }
    },

    renderRankList(ranks) {
      const el = this.container?.querySelector('#board-tangram');
      if (!el) return;

      if (!ranks || ranks.length === 0) {
        el.innerHTML = '<div style="text-align:center; color:#94a3b8; padding: 12px 0;">아직 등록된 랭킹이 없습니다. 첫 주인공이 되어보세요!</div>';
        return;
      }

      el.innerHTML = ranks.map((r, i) => `
        <div class="rank-item">
          <div><span class="rank-num">${i + 1}위</span> ${r.nickname || '익명'}</div>
          <div class="rank-score">${r.score || 0}점</div>
        </div>
      `).join('');
    },

    destroy() {
      if (window.MathLabCleanup && typeof window.MathLabCleanup.clearTimers === 'function') {
        window.MathLabCleanup.clearTimers(this.timers);
      }
      this.timers.forEach(clearTimeout);
      this.timers = [];
      if (this.timerId) { clearInterval(this.timerId); this.timerId = null; }
      if (this._keyHandler) window.removeEventListener('keydown', this._keyHandler);
      if (this._onEndDrag) {
        window.removeEventListener('mouseup', this._onEndDrag);
        window.removeEventListener('touchend', this._onEndDrag);
      }
      this._boundListeners = false;
      document.getElementById('mathlab-inline-ranking-modal')?.remove();
      document.getElementById('mathlab-tg-howto-modal')?.remove();
      const host = document.getElementById('tangram-force-host'); if (host) host.remove();
      if (this.container) this.container.innerHTML = '';
      this.container = null;
    }
  };

  if (!window.MathLabGames) {
    window.MathLabGames = {
      registry: {},
      register(app) { this.registry[app.id] = app; },
      mount(id, container, context) {
        if (this.registry[id]) this.registry[id].mount(container, context);
      }
    };
  }
  
  if (typeof window.MathLabGames.register === 'function') {
      window.MathLabGames.register(Tangram);
  }

  window.launchTangramGame = function() {
    if (typeof window.MathLabGames !== 'undefined' && typeof window.MathLabGames.mount === 'function') {
      try {
        window.MathLabGames.mount('tangram');
        return;
      } catch(e) {
        console.warn('MathLabGames mount 실패, 직접 마운트 시도:', e);
      }
    }
    const target = document.getElementById('mathlab-view') || document.getElementById('new-root') || document.body;
