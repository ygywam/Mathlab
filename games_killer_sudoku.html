<script>
  /* ==========================================================================
     KillerSudoku 모듈 - Gen-3 100% 동적 마운트 & 푸터 침범 방지 자동 방어 탑재
     ========================================================================== */
  const KillerSudoku = (function () {
    let currentDifficulty = 'EASY'; // EASY(6x6), NORMAL(9x9), HARD(9x9)
    let size = 6;
    let boxR = 2, boxC = 3;

    let solutionGrid = []; // 정답 해
    let puzzleGrid = [];   // 사용자 입력값 (0 = 빈칸)
    let memoGrid = [];     // 각 셀별 Set<number>
    let initialGrid = [];  // 초기 힌트 제공 셀 여부 (boolean[])

    let cages = [];        // { id, sum, cells: [idx1, idx2, ...], colorIdx }
    let cellToCage = [];   // idx -> cage instance

    let selectedCellIdx = -1;
    let inputMode = 'normal'; // 'normal' | 'memo'
    let showRemainingHint = false;

    let timerInterval = null;
    let elapsedSeconds = 0;
    let currentScore = 100;
    let isCompleted = false;
    let toastTimer = null;

    const escapeHTML = (str) => {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, function(match) {
        const escape = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
        return escape[match];
      });
    };

    function showToast(msg, isError = false) {
      let host = document.getElementById('killer-sudoku-app');
      if (!host) return;
      let toast = host.querySelector('#killer-toast');
      if (!toast) {
        toast = document.createElement('div');
        toast.id = 'killer-toast';
        toast.style.cssText = 'position:absolute; top:20px; left:50%; transform:translateX(-50%); padding:12px 24px; border-radius:12px; font-weight:800; font-size:1rem; z-index:99999; box-shadow:0 10px 25px rgba(0,0,0,0.5); transition:all 0.3s; text-align:center; min-width:300px; pointer-events:none; opacity:0;';
        host.appendChild(toast);
      }
      toast.style.background = isError ? '#ef4444' : '#10b981';
      toast.style.color = isError ? '#ffffff' : '#0f172a';
      toast.textContent = msg;
      void toast.offsetWidth;
      toast.style.opacity = '1';
      toast.style.top = '20px';
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.top = '0px';
      }, 3000);
    }

    // 프리셋 고품질 시드 퍼즐 풀 (즉시 생성 및 검증된 킬러 스도쿠)
    const SEED_PUZZLES = {
      EASY: [
        {
          size: 6, boxR: 2, boxC: 3,
          solution: [
            1, 2, 3,  4, 5, 6,
            4, 5, 6,  1, 2, 3,
            2, 3, 4,  5, 6, 1,
            5, 6, 1,  2, 3, 4,
            3, 4, 5,  6, 1, 2,
            6, 1, 2,  3, 4, 5
          ],
          cages: [
            { cells: [0, 1], sum: 3 },
            { cells: [2, 3], sum: 7 },
            { cells: [4, 5], sum: 11 },
            { cells: [6, 12], sum: 6 },
            { cells: [7, 8], sum: 11 },
            { cells: [9, 10, 11], sum: 6 },
            { cells: [13, 14], sum: 7 },
            { cells: [15, 16], sum: 11 },
            { cells: [17, 23], sum: 5 },
            { cells: [18, 19, 20], sum: 12 },
            { cells: [21, 22], sum: 5 },
            { cells: [24, 30], sum: 9 },
            { cells: [25, 26], sum: 9 },
            { cells: [27, 28], sum: 7 },
            { cells: [29, 35], sum: 7 },
            { cells: [31, 32], sum: 3 },
            { cells: [33, 34], sum: 7 }
          ],
          prefilledCount: 4
        }
      ],
      NORMAL: [
        {
          size: 9, boxR: 3, boxC: 3,
          solution: [
            5, 3, 4, 6, 7, 8, 9, 1, 2,
            6, 7, 2, 1, 9, 5, 3, 4, 8,
            1, 9, 8, 3, 4, 2, 5, 6, 7,
            8, 5, 9, 7, 6, 1, 4, 2, 3,
            4, 2, 6, 8, 5, 3, 7, 9, 1,
            7, 1, 3, 9, 2, 4, 8, 5, 6,
            9, 6, 1, 5, 3, 7, 2, 8, 4,
            2, 8, 7, 4, 1, 9, 6, 3, 5,
            3, 4, 5, 2, 8, 6, 1, 7, 9
          ],
          cages: [
            { cells: [0, 1], sum: 8 },
            { cells: [2, 3], sum: 10 },
            { cells: [4, 5], sum: 15 },
            { cells: [6, 7, 8], sum: 12 },
            { cells: [9, 18], sum: 7 },
            { cells: [10, 11], sum: 9 },

            { cells: [29, 30], sum: 16 },

            { cells: [39, 40], sum: 13 },
            { cells: [41, 42], sum: 10 },
            { cells: [43, 44], sum: 10 },

    /* --------------------------------------------------------------------------
       Gen-3 동적 마운트 (mount): #mathlab-view 내부에 UI 주입 + 푸터 침범 방지 보정
       -------------------------------------------------------------------------- */

              </div>

                <input type="text" id="killer-nickname-input" placeholder="닉네임 입력" style="flex:1; padding:10px 14px; border-radius:10px; border:1px solid #334155; background:#0f172a; color:#f8fafc; font-weight:700;">

    function setDifficulty(diff) {
      currentDifficulty = diff;
      document.querySelectorAll('#killer-sudoku-app .mode-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById('killer-btn-' + diff.toLowerCase());
      if (activeBtn) activeBtn.classList.add('active');
      resetGame();
    }

    function resetGame() {
      isCompleted = false;
      showRemainingHint = false;
      elapsedSeconds = 0;
      currentScore = 100;
      selectedCellIdx = -1;
      startTimer();

      if (currentDifficulty === 'EASY') {
        size = 6; boxR = 2; boxC = 3;
      } else {
        size = 9; boxR = 3; boxC = 3;
      }

      loadOrGeneratePuzzle();
      renderNumPad();
      renderBoard();
      updateStatusPanel();
    }

    // 퍼즐 생성
    function loadOrGeneratePuzzle() {
      const pool = SEED_PUZZLES[currentDifficulty] || SEED_PUZZLES.NORMAL;
      const seed = pool[Math.floor(Math.random() * pool.length)];

      size = seed.size;
      boxR = seed.boxR;
      boxC = seed.boxC;

      const perm = [];
      const digits = Array.from({ length: size }, (_, i) => i + 1);
      for (let i = size - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [digits[i], digits[j]] = [digits[j], digits[i]];
      }
      for (let i = 0; i < size; i++) perm[i + 1] = digits[i];

      solutionGrid = seed.solution.map(val => perm[val]);
      puzzleGrid = Array(size * size).fill(0);
      memoGrid = Array.from({ length: size * size }, () => new Set());
      initialGrid = Array(size * size).fill(false);

      cages = seed.cages.map((cg, idx) => {
        const cells = [...cg.cells];
        const sum = cells.reduce((acc, cellIdx) => acc + solutionGrid[cellIdx], 0);
        return {
          id: idx,
          cells: cells,
          sum: sum,
          colorIdx: idx % 6
        };
      });

      cellToCage = Array(size * size).fill(null);
      cages.forEach(cg => {
        cg.cells.forEach(idx => {
          cellToCage[idx] = cg;
        });
      });

      if (seed.prefilledCount > 0) {
        let count = 0;
        const indices = Array.from({ length: size * size }, (_, i) => i);
        indices.sort(() => Math.random() - 0.5);
        for (let idx of indices) {
          if (count >= seed.prefilledCount) break;
          puzzleGrid[idx] = solutionGrid[idx];
          initialGrid[idx] = true;
          count++;
        }
      }
    }

    function renderNumPad() {
      const numpadEl = document.getElementById('killer-numpad-el');
      if (!numpadEl) return;
      numpadEl.innerHTML = '';

      for (let n = 1; n <= size; n++) {
        const btn = document.createElement('button');
        btn.className = 'num-btn';
        btn.textContent = n;
        btn.onclick = () => inputDigit(n);
        numpadEl.appendChild(btn);
      }
    }

    function renderBoard() {
      const boardEl = document.getElementById('killer-board-el');
      if (!boardEl) return;

      boardEl.className = 'sudoku-grid ' + (size === 6 ? 'grid-6x6' : 'grid-9x9');
      boardEl.innerHTML = '';

      for (let idx = 0; idx < size * size; idx++) {
        const r = Math.floor(idx / size);
        const c = idx % size;
        const cg = cellToCage[idx];

        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.dataset.idx = idx;

        if ((c + 1) % boxC === 0 && c < size - 1) {
          cell.classList.add(size === 6 ? 'box-right-6' : 'box-right');
        }
        if ((r + 1) % boxR === 0 && r < size - 1) {
          cell.classList.add(size === 6 ? 'box-bottom-6' : 'box-bottom');
        }

        const upIdx = r > 0 ? idx - size : -1;
        const downIdx = r < size - 1 ? idx + size : -1;
        const leftIdx = c > 0 ? idx - 1 : -1;
        const rightIdx = c < size - 1 ? idx + 1 : -1;

        if (upIdx === -1 || cellToCage[upIdx] !== cg) cell.classList.add('cage-t');
        if (downIdx === -1 || cellToCage[downIdx] !== cg) cell.classList.add('cage-b');
        if (leftIdx === -1 || cellToCage[leftIdx] !== cg) cell.classList.add('cage-l');
        if (rightIdx === -1 || cellToCage[rightIdx] !== cg) cell.classList.add('cage-r');

        const isCageTopLeft = cg && cg.cells[0] === idx;
        if (isCageTopLeft) {
          const badge = document.createElement('span');
          badge.className = 'cage-sum';
          badge.textContent = cg.sum;
          cell.appendChild(badge);
        }

        const val = puzzleGrid[idx];
        if (val !== 0) {
          const span = document.createElement('span');
          span.textContent = val;
          cell.appendChild(span);
          if (initialGrid[idx]) cell.classList.add('prefilled');
          else cell.classList.add('user-input');
        } else if (memoGrid[idx] && memoGrid[idx].size > 0) {
          const memoDiv = document.createElement('div');
          memoDiv.className = 'memo-grid';
          for (let m = 1; m <= 9; m++) {
            const mSpan = document.createElement('div');
            mSpan.className = 'memo-num';
            mSpan.textContent = memoGrid[idx].has(m) ? m : '';
            memoDiv.appendChild(mSpan);
          }
          cell.appendChild(memoDiv);
        }

        cell.onclick = () => selectCell(idx);
        boardEl.appendChild(cell);
      }

      updateHighlightsAndConflicts();
    }

    function selectCell(idx) {
      selectedCellIdx = idx;
      updateHighlightsAndConflicts();
      updateStatusPanel();
    }

    function updateHighlightsAndConflicts() {
      const boardEl = document.getElementById('killer-board-el');
      if (!boardEl) return;
      const cells = boardEl.children;

      const conflicts = getConflictSet();

      for (let idx = 0; idx < size * size; idx++) {
        const cell = cells[idx];
        if (!cell) continue;

        cell.classList.remove('selected', 'cage-highlight', 'conflict');

        if (idx === selectedCellIdx) {
          cell.classList.add('selected');
        } else if (selectedCellIdx !== -1 && cellToCage[idx] === cellToCage[selectedCellIdx]) {
          cell.classList.add('cage-highlight');
        }

        if (conflicts.has(idx)) {
          cell.classList.add('conflict');
        }
      }
    }

    function getConflictSet() {
      const conflicts = new Set();

      for (let i = 0; i < size; i++) {
        checkGroupConflicts(conflicts, getRowIndices(i));
        checkGroupConflicts(conflicts, getColIndices(i));
        checkGroupConflicts(conflicts, getBoxIndices(i));
      }

      cages.forEach(cg => {
        const values = cg.cells.map(i => puzzleGrid[i]).filter(v => v !== 0);
        const sum = values.reduce((a, b) => a + b, 0);

        const seen = new Set();
        cg.cells.forEach(idx => {
          const val = puzzleGrid[idx];
          if (val !== 0) {
            if (seen.has(val)) conflicts.add(idx);
            seen.add(val);
          }
        });

        const allFilled = cg.cells.every(i => puzzleGrid[i] !== 0);
        if (sum > cg.sum || (allFilled && sum !== cg.sum)) {
          cg.cells.forEach(idx => conflicts.add(idx));
        }
      });

      return conflicts;
    }

    function checkGroupConflicts(conflicts, indices) {
      const map = {};
      indices.forEach(idx => {
        const val = puzzleGrid[idx];
        if (val !== 0) {
          if (map[val] !== undefined) {
            conflicts.add(map[val]);
            conflicts.add(idx);
          } else {
            map[val] = idx;
          }
        }
      });
    }

    function getRowIndices(r) {
      return Array.from({ length: size }, (_, c) => r * size + c);
    }

    function getColIndices(c) {
      return Array.from({ length: size }, (_, r) => r * size + c);
    }

    function getBoxIndices(boxIdx) {
      const br = Math.floor(boxIdx / (size / boxC)) * boxR;
      const bc = (boxIdx % (size / boxC)) * boxC;
      const res = [];
      for (let r = 0; r < boxR; r++) {
        for (let c = 0; c < boxC; c++) {
          res.push((br + r) * size + (bc + c));
        }
      }
      return res;
    }

    function setInputMode(mode) {
      inputMode = mode;
      document.getElementById('killer-mode-normal-btn')?.classList.toggle('active', mode === 'normal');
      document.getElementById('killer-mode-memo-btn')?.classList.toggle('active', mode === 'memo');
    }

    function inputDigit(num) {
      if (isCompleted || selectedCellIdx === -1) return;
      if (initialGrid[selectedCellIdx]) {
        showToast('🔒 초기 힌트 숫자는 변경할 수 없습니다.', true);
        return;
      }

      if (inputMode === 'normal') {
        if (puzzleGrid[selectedCellIdx] === num) {
          puzzleGrid[selectedCellIdx] = 0;
        } else {
          puzzleGrid[selectedCellIdx] = num;
          memoGrid[selectedCellIdx].clear();
        }
      } else {
        if (puzzleGrid[selectedCellIdx] !== 0) return;
        if (memoGrid[selectedCellIdx].has(num)) memoGrid[selectedCellIdx].delete(num);
        else memoGrid[selectedCellIdx].add(num);
      }

      renderBoard();
      updateStatusPanel();
      checkWinCondition();
    }

    function clearSelectedCell() {
      if (isCompleted || selectedCellIdx === -1 || initialGrid[selectedCellIdx]) return;
      puzzleGrid[selectedCellIdx] = 0;
      memoGrid[selectedCellIdx].clear();
      renderBoard();
      updateStatusPanel();
    }

    function toggleRemainingSumHint() {
      if (selectedCellIdx === -1) {
        showToast('💡 먼저 잔여 합을 확인할 케이지의 칸을 선택해 주세요.');
        return;
      }
      showRemainingHint = !showRemainingHint;
      if (showRemainingHint) {
        currentScore = Math.max(10, currentScore - 5);
        showToast('💡 힌트 사용! 남은 합 표시가 켜집니다 (-5점)');
      }
      updateStatusPanel();
    }

    function updateStatusPanel() {
      const scoreEl = document.getElementById('killer-score');
      if (scoreEl) scoreEl.textContent = currentScore;

      const badgeEl = document.getElementById('killer-cage-badge');
      if (!badgeEl) return;

      if (selectedCellIdx === -1) {
        badgeEl.innerHTML = '<span>🔒 선택 케이지 합: -</span>';
        return;
      }

      const cg = cellToCage[selectedCellIdx];
      if (!cg) return;

      const curSum = cg.cells.reduce((acc, idx) => acc + puzzleGrid[idx], 0);
      const rem = cg.sum - curSum;

      if (showRemainingHint) {
        badgeEl.innerHTML = `<span>🔒 케이지 합: <b>${cg.sum}</b> | 남은 합: <b style="color:#f59e0b">${rem}</b></span>`;
      } else {
        badgeEl.innerHTML = `<span>🔒 선택 케이지 목표 합: <b style="color:#fcd34d">${cg.sum}</b></span>`;
      }
    }

    function checkWinCondition() {
      const allFilled = puzzleGrid.every(v => v !== 0);
      if (!allFilled) return;

      const conflicts = getConflictSet();
      if (conflicts.size > 0) return;

      isCompleted = true;
      stopTimer();
      if (typeof playSound === 'function') playSound('win');

      const bonus = Math.max(0, 30 - Math.floor(elapsedSeconds / 10));
      const finalScore = currentScore + 20 + bonus;

      setTimeout(() => {
        showToast(`🎉 킬러 스도쿠 완성!! 최종 점수: ${finalScore}점`);
        showRankingModal();
      }, 300);
    }

    function startTimer() {
      stopTimer();
      timerInterval = setInterval(() => {
        elapsedSeconds++;
        const min = String(Math.floor(elapsedSeconds / 60)).padStart(2, '0');
        const sec = String(elapsedSeconds % 60).padStart(2, '0');
        const timerEl = document.getElementById('killer-timer');
        if (timerEl) timerEl.textContent = `${min}:${sec}`;
      }, 1000);
    }

    function stopTimer() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
    }

    function onKeyDown(e) {
      const key = e.key;
      if (key >= '1' && key <= String(size)) {
        inputDigit(parseInt(key, 10));
      } else if (key === 'Backspace' || key === 'Delete' || key === '0') {
        clearSelectedCell();
      } else if (key === 'm' || key === 'M') {
        setInputMode(inputMode === 'normal' ? 'memo' : 'normal');
      } else if (key.startsWith('Arrow') && selectedCellIdx !== -1) {
        e.preventDefault();
        let r = Math.floor(selectedCellIdx / size);
        let c = selectedCellIdx % size;
        if (key === 'ArrowUp') r = Math.max(0, r - 1);
        if (key === 'ArrowDown') r = Math.min(size - 1, r + 1);
        if (key === 'ArrowLeft') c = Math.max(0, c - 1);
        if (key === 'ArrowRight') c = Math.min(size - 1, c + 1);
        selectCell(r * size + c);
      }
    }

    function showGuideModal() {
      document.getElementById('killer-guide-modal')?.classList.add('open');
    }

    function showCombosModal() {
      document.getElementById('killer-combos-modal')?.classList.add('open');
    }

    function showRankingModal() {
      document.getElementById('killer-ranking-modal')?.classList.add('open');
      if (typeof loadGameLeaderboard === 'function') {
        loadGameLeaderboard('킬러스도쿠', true, 'board-killer-sudoku');
      }
    }

    function closeModals() {
      document.querySelectorAll('.game-killer-sudoku .modal-backdrop').forEach(el => el.classList.remove('open'));
    }

    function submitRankScore() {
      const nicknameInput = document.getElementById('killer-nickname-input');
      const nickname = nicknameInput ? nicknameInput.value.trim() : '';
      if (!nickname) {
        showToast('⚠️ 닉네임을 입력해 주세요.', true);
        return;
      }

      try {
        let list = JSON.parse(localStorage.getItem('mathlab_lb_killer_sudoku') || '[]');
        const dateStr = new Date().toLocaleDateString('ko-KR', { month: '2-digit', day: '2-digit' });
        list.push({ nickname, score: currentScore + 20, date: dateStr });
        list.sort((a, b) => b.score - a.score);
        localStorage.setItem('mathlab_lb_killer_sudoku', JSON.stringify(list.slice(0, 20)));
      } catch (e) {}

      if (typeof window.submitRanking === 'function') {
        window.submitRanking('킬러스도쿠', currentScore + 20, true, 'killer-nickname-input', 'board-killer-sudoku');
      } else if (typeof window.parent?.submitRanking === 'function') {
        window.parent.submitRanking('킬러스도쿠', currentScore + 20, true, 'killer-nickname-input', 'board-killer-sudoku');
      } else {
        showToast('🎉 명예의 전당 등록 완료! 점수가 등록되었습니다!');
        if (nicknameInput) nicknameInput.value = '';
        closeModals();
      }
    }

    // 🌟 스킬 표준 안전 홈 버튼 (기본 상/하단 홈버튼과 100% 동일 동작)
    function goHome() {
      stopTimer();
      window.removeEventListener('keydown', onKeyDown);

      // 1. 표준 브리지 최우선 호출 (상단 로고/우측 하단 홈버튼과 완벽 동일 동작)
      if (window.LegacyBridge && typeof window.LegacyBridge.backHome === 'function') {
        try { window.LegacyBridge.backHome(); return; } catch(e) {}
      }
      if (typeof window.renderLegacyDashboardHome === 'function') {
        try { window.renderLegacyDashboardHome(); return; } catch(e) {}
      }
      if (typeof window.MathLabRenderHome === 'function') {
        try { window.MathLabRenderHome(); return; } catch(e) {}
      }

      // 2. 브리지 부재 시 폴백: 수동 루트 전환 및 대시보드 활성화
      const mathlabRoot = document.getElementById('mathlab-root');
      const legacyRoot = document.getElementById('legacy-root');
      if (mathlabRoot) mathlabRoot.classList.add('hidden');
      if (legacyRoot) legacyRoot.classList.remove('hidden');

      const dashboard = document.getElementById('dashboard-screen');
      if (dashboard) {
        dashboard.classList.add('active');
        dashboard.style.display = '';
      }
      window.scrollTo({ top: 0, left: 0, behavior: 'smooth' });
    }

    function destroy() {
      stopTimer();
      window.removeEventListener('keydown', onKeyDown);
    }

    return {
      mount,
      resetGame,
      destroy,
      setDifficulty,
      setInputMode,
      inputDigit,
      clearSelectedCell,
      toggleRemainingSumHint,
      showGuideModal,
      showCombosModal,
      showRankingModal,
      closeModals,
      submitRankScore,
      goHome,       // 🌟 표준 인터페이스 이름 등록
      goHomeAction: goHome // 🌟 기존 HTML 버튼의 onclick 호환성 유지
    };
  })();

  // 🌟 스킬 표준 3중 자율 등록 (스크립트 로딩 순서 무관 100% 등록 보장)
  function registerKillerSudoku() {
    if (typeof window.MathLabGames !== 'undefined' && typeof window.MathLabGames.register === 'function') {
      if (!window.MathLabGames.get('killer-sudoku')) {
        window.MathLabGames.register({
          id: 'killer-sudoku',
          title: '킬러 스도쿠',
          icon: '➕',
          sourceType: 'new',
          mount(container, context) { KillerSudoku.mount(container, context); },
          reset() { KillerSudoku.resetGame(); },
          destroy() { KillerSudoku.destroy(); }
        });
      }
    }
  }

  registerKillerSudoku();
  window.addEventListener('DOMContentLoaded', registerKillerSudoku);
  setTimeout(registerKillerSudoku, 100);
  setTimeout(registerKillerSudoku, 500);
</script>
