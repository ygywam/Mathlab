
<script>
(function() {
  'use strict';

  const RatIrrConceptApp = {
    host: null,
    chart: null,
    mode: 'rational', // 'rational' or 'irrational'
    
    mount(container) {
      // 1. Get container securely
      this.host = (typeof container === 'string') ? document.querySelector(container) : container;
      if (!this.host) {
        this.host = document.getElementById('mathlab-view') || document.getElementById('new-root') || document.body;
      }
      
      // 2. Gen-3 Safe Mount (Unhide parents)
      this.host.style.display = '';
      this.host.style.visibility = 'visible';
      this.host.style.opacity = '1';
      let parent = this.host.parentElement;
      while (parent && parent !== document.body && parent !== document.documentElement) {
        if (parent.style && parent.style.display === 'none') parent.style.display = 'block';
        if (parent.style && parent.style.visibility === 'hidden') parent.style.visibility = 'visible';
        parent = parent.parentElement;
      }
      
      this.render();
    },

    goHome() {
      this.destroy();
      if (typeof window.LegacyBridge !== 'undefined' && typeof window.LegacyBridge.backHome === 'function') {
        try { window.LegacyBridge.backHome(); return; } catch (e) {}
      }
      if (typeof window.MathLabUtils !== 'undefined' && typeof window.MathLabUtils.goHome === 'function') {
        window.MathLabUtils.goHome();
      } else {
        location.reload();
      }
    },

    destroy() {
      if (this.chart) {
        this.chart.destroy();
        this.chart = null;
      }
      if (this.host) {
        this.host.innerHTML = '';
        this.host.style.display = 'none';
      }
    },

    setMode(mode) {
      this.mode = mode;
      const root = this.host;
      if (!root) return;
      
      // Update tabs
      root.querySelectorAll('.rat-irr-tab-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = root.querySelector(`.rat-irr-tab-btn[data-mode="${mode}"]`);
      if (activeBtn) activeBtn.classList.add('active');
      
      // Update sliders
      if (mode === 'rational') {
        root.querySelector('#rat-sliders-rational').classList.remove('hidden');
        root.querySelector('#rat-sliders-irrational').classList.add('hidden');
      } else {
        root.querySelector('#rat-sliders-rational').classList.add('hidden');
        root.querySelector('#rat-sliders-irrational').classList.remove('hidden');
      }
      
      this.updateChart();
    },

    initChart() {
      const canvas = this.host.querySelector('#canvas-rat-irr');
      if (!canvas) return;
      
      const ctx = canvas.getContext('2d');
      if (this.chart) this.chart.destroy();
      
      // Chart.js requires global window.Chart
      if (typeof Chart === 'undefined') return;

      this.chart = new Chart(ctx, { 
        type: 'scatter', 
        data: { 
          datasets: [
            { label: '함수 그래프', data: [], borderColor: '#1abc9c', borderWidth: 3, showLine: true, pointRadius: 0, tension: 0.1 }, 
            { label: '점근선 가이드', data: [], borderColor: '#e74c3c', borderWidth: 1.5, borderDash: [5,5], showLine: true, pointRadius: 0 }
          ] 
        }, 
        options: { 
          responsive: true, 
          maintainAspectRatio: false, 
          animation: { duration: 0 }, 
          scales: { x: { min: -10, max: 10 }, y: { min: -10, max: 10 } } 
        } 
      });
      
      this.updateChart();
    },

    updateChart() {
      if (!this.chart || !this.host) return;
      const root = this.host;
      
      let mainData = []; 
      let asymData = []; 
      let fText = ""; 
      let descText = "";
      
      if (this.mode === 'rational') {
        let k = parseFloat(root.querySelector('#slider-rat-k').value); 
        if(Math.abs(k) < 0.1) k = k >= 0 ? 0.2 : -0.2; 
        let p = parseFloat(root.querySelector('#slider-rat-p').value); 
        let q = parseFloat(root.querySelector('#slider-rat-q').value);
        
        root.querySelector('#val-rat-k').innerText = k.toFixed(1); 
        root.querySelector('#val-rat-p').innerText = p.toFixed(1); 
        root.querySelector('#val-rat-q').innerText = q.toFixed(1);
        
        for(let x = -10.1; x <= 10.1; x += 0.1) { 
          if(Math.abs(x - p) < 0.11) { 
            mainData.push({x: x, y: null}); 
            continue; 
          } 
          mainData.push({x: x, y: k/(x-p) + q}); 
        }
        
        asymData.push({x: p, y: -20}, {x: p, y: 20}, {x: null, y: null}, {x: -20, y: q}, {x: 20, y: q});
        
        let pTerm = p === 0 ? "x" : (p > 0 ? `(x - ${p.toFixed(1)})` : `(x + ${Math.abs(p).toFixed(1)})`); 
        let qTerm = q === 0 ? "" : (q > 0 ? `+ ${q.toFixed(1)}` : `- ${Math.abs(q).toFixed(1)}`);
        fText = `y = \\frac{${k.toFixed(1)}}{${pTerm}} ${qTerm}`; 
        descText = `점근선의 방정식은 $x = ${p.toFixed(1)}$, $y = ${q.toFixed(1)}$ 입니다.`;
      } else {
        let a = parseFloat(root.querySelector('#slider-irr-a').value); 
        if(Math.abs(a) < 0.1) a = 0.5; 
        let b = parseFloat(root.querySelector('#slider-irr-b').value); 
        if(Math.abs(b) < 0.1) b = 0.5; 
        let p = parseFloat(root.querySelector('#slider-irr-p').value); 
        let q = parseFloat(root.querySelector('#slider-irr-q').value);
        
        root.querySelector('#val-irr-a').innerText = a.toFixed(1); 
        root.querySelector('#val-irr-b').innerText = b.toFixed(1); 
        root.querySelector('#val-irr-p').innerText = p.toFixed(1); 
        root.querySelector('#val-irr-q').innerText = q.toFixed(1);
        
        for(let x = -10; x <= 10; x += 0.05) { 
          if (b * (x - p) >= 0) mainData.push({x: x, y: a * Math.sqrt(b * (x - p)) + q}); 
        } 
        
        mainData.push({x: p, y: q}); 
        mainData.sort((pt1, pt2) => pt1.x - pt2.x); 
        
        let pTerm = p === 0 ? "x" : (p > 0 ? `(x - ${p.toFixed(1)})` : `(x + ${Math.abs(p).toFixed(1)})`); 
        let bTerm = b === 1 ? "" : (b === -1 ? "-" : `${b.toFixed(1)}`); 
        let qTerm = q === 0 ? "" : (q > 0 ? `+ ${q.toFixed(1)}` : `- ${Math.abs(q).toFixed(1)}`);
        
        fText = `y = ${a.toFixed(1)}\\sqrt{${bTerm}${pTerm}} ${qTerm}`; 
        descText = `시작점의 좌표는 $(${p.toFixed(1)}, ${q.toFixed(1)})$ 입니다.`;
      }
      
      this.chart.data.datasets[0].data = mainData; 
      this.chart.data.datasets[1].data = asymData; 
      this.chart.update();
      
      if (typeof katex !== 'undefined') {
        katex.render(fText, root.querySelector('#rat-irr-formula'), { throwOnError: false }); 
      }
      
      const descEl = root.querySelector('#rat-irr-desc');
      if (descEl) {
        descEl.innerHTML = descText;
        if (typeof renderMathInElement !== 'undefined') {
          renderMathInElement(descEl, false);
        }
      }
    },

    render() {
      if (!this.host) return;

      this.host.innerHTML = `
        <style>
          .rat-irr-container {
            padding: 24px; background: #ffffff; border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); font-family: 'Pretendard', sans-serif;
            max-width: 800px; margin: 0 auto;
          }
          .rat-irr-header {
            display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px;
          }
          .rat-irr-header h1 { margin: 0; font-size: 2rem; color: #2c3e50; font-weight: 900; }
          .rat-irr-home-btn {
            padding: 10px 16px; background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 10px; 
            cursor: pointer; color: #475569; font-weight: 800; transition: 0.2s;
          }
          .rat-irr-home-btn:hover { background: #e2e8f0; }
          .rat-irr-msg {
            background: #e8f8f5; color: #16a085; border: 1px solid #a3e4d7; padding: 12px; 
            border-radius: 12px; text-align: center; margin-bottom: 20px; font-weight: 800;
          }
          .rat-irr-tabs {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px;
          }
          .rat-irr-tab-btn {
            padding: 14px; border: 2px solid #dfe6e9; border-radius: 14px; background: #fff; 
            color: #7f8c8d; font-weight: 900; font-size: 1.1rem; cursor: pointer; transition: 0.2s;
          }
          .rat-irr-tab-btn.active {
            border-color: #1abc9c; color: #1abc9c; background: #f0fdfa;
          }
          .rat-irr-chart {
            height: 400px; width: 100%; margin-bottom: 24px;
          }
          .rat-irr-sliders {
            display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
          }
          .rat-irr-sliders.hidden { display: none; }
          .rat-irr-slider-group {
            background: #f8fafc; padding: 16px; border-radius: 14px; border: 1px solid #e2e8f0;
          }
          .rat-irr-slider-group.full { grid-column: 1 / -1; }
          .rat-irr-slider-group label { display: block; font-weight: 800; color: #334155; margin-bottom: 12px; }
          .rat-irr-slider-group input[type="range"] { 
            width: 100%; cursor: pointer; accent-color: #1abc9c;
          }
        </style>
        
        <div class="rat-irr-container">
          <div class="rat-irr-header">
            <h1>유리·무리함수 공작소 🪞</h1>
            <button class="rat-irr-home-btn" onclick="window.RatIrrConceptApp.goHome()">🏠 대시보드</button>
          </div>
          
          <div class="rat-irr-msg">점근선을 움직이고, 부호를 바꿔가며 개형의 변화를 관찰하세요!</div>
          
          <div class="rat-irr-tabs">
            <button class="rat-irr-tab-btn active" data-mode="rational" onclick="window.RatIrrConceptApp.setMode('rational')">유리함수 (점근선)</button>
            <button class="rat-irr-tab-btn" data-mode="irrational" onclick="window.RatIrrConceptApp.setMode('irrational')">무리함수 (시작점)</button>
          </div>
          
          <div class="rat-irr-chart"><canvas id="canvas-rat-irr"></canvas></div>
          
          <div class="rat-irr-sliders" id="rat-sliders-rational">
            <div class="rat-irr-slider-group">
              <label>비례 상수 (k) : <span id="val-rat-k">1.0</span></label>
              <input type="range" id="slider-rat-k" min="-5.0" max="5.0" step="0.5" value="1.0" oninput="window.RatIrrConceptApp.updateChart()">
            </div>
            <div class="rat-irr-slider-group">
              <label>x축 이동 (p) : <span id="val-rat-p">0.0</span></label>
              <input type="range" id="slider-rat-p" min="-5.0" max="5.0" step="0.5" value="0.0" oninput="window.RatIrrConceptApp.updateChart()">
            </div>
            <div class="rat-irr-slider-group full">
              <label>y축 이동 (q) : <span id="val-rat-q">0.0</span></label>
              <input type="range" id="slider-rat-q" min="-5.0" max="5.0" step="0.5" value="0.0" oninput="window.RatIrrConceptApp.updateChart()">
            </div>
          </div>
          
          <div class="rat-irr-sliders hidden" id="rat-sliders-irrational">
            <div class="rat-irr-slider-group">
              <label>바깥 계수 (a) : <span id="val-irr-a">1.0</span></label>
              <input type="range" id="slider-irr-a" min="-3.0" max="3.0" step="0.5" value="1.0" oninput="window.RatIrrConceptApp.updateChart()">
            </div>
            <div class="rat-irr-slider-group">
              <label>안쪽 계수 (b) : <span id="val-irr-b">1.0</span></label>
              <input type="range" id="slider-irr-b" min="-3.0" max="3.0" step="0.5" value="1.0" oninput="window.RatIrrConceptApp.updateChart()">
            </div>
            <div class="rat-irr-slider-group">
              <label>x축 이동 (p) : <span id="val-irr-p">0.0</span></label>
              <input type="range" id="slider-irr-p" min="-5.0" max="5.0" step="0.5" value="0.0" oninput="window.RatIrrConceptApp.updateChart()">
            </div>
            <div class="rat-irr-slider-group">
              <label>y축 이동 (q) : <span id="val-irr-q">0.0</span></label>
              <input type="range" id="slider-irr-q" min="-5.0" max="5.0" step="0.5" value="0.0" oninput="window.RatIrrConceptApp.updateChart()">
            </div>
          </div>
          
          <div id="rat-irr-formula" style="margin-top:24px; font-size:2rem; text-align:center;"></div>
          <p id="rat-irr-desc" style="text-align:center; font-size:1.2rem; color:#34495e; font-weight:800; margin-top:16px;"></p>
        </div>
      `;

      // HTML 렌더링이 완료된 후 차트 초기화! 이게 매우 중요합니다. 없는 함수 에러 원천 차단.
      setTimeout(() => this.initChart(), 50);
    }
  };

  // Expose to window for inline onclicks
  window.RatIrrConceptApp = RatIrrConceptApp;

  // Register standard app to MathLabGames
  function registerMyApp() {
    if (typeof window.MathLabGames !== 'undefined' && typeof window.MathLabGames.register === 'function') {
      window.MathLabGames.register({
        id: 'rat-irr-concept',
        title: '유리·무리함수 공작소',
        icon: '🪞',
        appType: 'concept',
        topApp: '수학 개념',
        sourceType: 'new',
        mount(container) { RatIrrConceptApp.mount(container); },
        reset() { RatIrrConceptApp.setMode('rational'); },
        destroy() { RatIrrConceptApp.destroy(); },
        goHome() { RatIrrConceptApp.goHome(); }
      });
    }
  }

  registerMyApp();
  window.addEventListener('DOMContentLoaded', registerMyApp);
  
  // Legacy bridge entry point for backwards compatibility if needed
  window.initRatIrrApp = function() {
    if (window.LegacyBridge && typeof window.LegacyBridge.hideAllLegacySections === 'function') {
      window.LegacyBridge.hideAllLegacySections();
      window.LegacyBridge.showNewRoot();
    }
    if (typeof window.MathLabGames !== 'undefined' && typeof window.MathLabGames.mount === 'function') {
      try { window.MathLabGames.mount('rat-irr-concept'); return; } catch(e){}
    }
    RatIrrConceptApp.mount();
  };
})();
</script>
