<style>
  /* Gen-3 토스트창 및 게임 설정 오버레이 스타일 */
  .make24-toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #334155;
    color: #fff;
    padding: 12px 24px;
    border-radius: 12px;
    font-weight: bold;
    box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    z-index: 999999;
    opacity: 0;
    transition: opacity 0.3s, bottom 0.3s;
  }
  .make24-toast.error { background: #dc2626; }
  .make24-toast.show { opacity: 1; bottom: 40px; }

  .m24-setup-overlay {
    position: absolute; top:0; left:0; right:0; bottom:0;
    background: rgba(255,255,255,0.95);
    z-index: 100; display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    border-radius: 12px; padding: 20px; text-align: center;
  }
  .m24-mode-btn {
    padding: 8px 18px; border-radius: 999px; font-weight: 800; font-size: 14px;
    border: 2px solid #e2e8f0; background: #fff; color: #64748b; cursor: pointer; transition: 0.2s;
  }
  .m24-mode-btn.active {
    border-color: #22c55e; background: #f0fdf4; color: #15803d; box-shadow: 0 2px 8px rgba(34, 197, 94, 0.2);
  }
  .m24-turn-box {
    background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 14px;
    padding: 12px 16px; margin: 0 auto 16px; max-width: 500px; text-align: center;
    font-weight: 800; color: #334155;
  }
  .m24-turn-badges { display: flex; justify-content: center; gap: 12px; margin-top: 8px; }
  .m24-badge { padding: 5px 14px; border-radius: 999px; font-size: 13px; background: #e2e8f0; color: #64748b; transition: 0.3s; }
  .m24-badge.p1.active { background: #2563eb; color: #fff; box-shadow: 0 2px 8px rgba(37, 99, 235, 0.35); }
  .m24-badge.p2.active { background: #dc2626; color: #fff; box-shadow: 0 2px 8px rgba(220, 38, 38, 0.35); }
</style>

<script>
class Make24Game {
  constructor() {
    this.containerEl = null;
    this.cards = [];
    this.used = [false, false, false, false];
    this.exprStr = "";
    this.evalStr = "";
    this.score = 0;
    this.time = 0;
    this.timer = null;
    this.currentSolution = "";
    this.hintUsed = false;
    
    this.mode = 'single';
    this.targetScore = 10;
    this.turn = 1;
    this.aiScore = 0;
    this.aiThinking = false;
    this.gameOver = false;
  }

  mount(container) {
    this.containerEl = container;
    this.containerEl.style.display = 'block';
    this.renderUI();
  }

  renderUI() {
    this.containerEl.innerHTML = `
      <button class="home-btn" id="m24-home-btn">🏠 대시보드로 돌아가기</button>
      <div class="finance-container" style="max-width: 500px; margin: 0 auto; text-align: left; position: relative;">
        <h1 style="text-align: center;">메이크 24 🃏</h1>
        <p class="highlight-msg" style="background:#e8f0fe; color:#2980b9; border-color:#a9cce3; font-size:0.95rem;">
          주어진 4개의 카드를 한 번씩 사용하여 사칙연산으로 <strong>24</strong>를 만드세요!
        </p>

        <!-- 게임 설정 오버레이 -->
        <div id="m24-setup-screen" class="m24-setup-overlay">
          <h2 style="color:#2c3e50; margin-bottom:10px;">게임 설정</h2>
          <div style="display:flex; gap:10px; justify-content:center; margin-bottom:15px; flex-wrap:wrap;">
            <button class="m24-mode-btn active" data-mode="single">👤 솔로 타임어택</button>
            <button class="m24-mode-btn" data-mode="ai">🤖 AI 턴 대결</button>
          </div>
          <div style="margin-bottom:20px;">
            <h4 style="margin-bottom:8px; color:#34495e;">목표 점수</h4>
            <div style="display:flex; gap:10px; justify-content:center;">
              <button class="btn m24-target-btn" data-target="5" style="background:#fff; color:#2c3e50; border:1px solid #cbd5e1;">5점</button>
              <button class="btn m24-target-btn active" data-target="10" style="background:#2c3e50; color:#fff; border:1px solid #cbd5e1;">10점</button>
              <button class="btn m24-target-btn" data-target="20" style="background:#fff; color:#2c3e50; border:1px solid #cbd5e1;">20점</button>
            </div>
          </div>
          <button class="btn save-btn" id="m24-start-btn" style="width:200px; font-size:1.1rem; padding:12px;">게임 시작 🚀</button>
        </div>

        <div id="m24-turn-display" class="m24-turn-box" style="display: none;">
          <div id="m24-turn-msg" style="margin-bottom: 4px; font-size: 14px; color: #1e3a8a;">👤 플레이어 차례입니다!</div>
          <div class="m24-turn-badges">
            <span id="m24-p1-badge" class="m24-badge p1 active">👤 플레이어 (<span id="m24-p1-sc">0</span>점)</span>
            <span id="m24-p2-badge" class="m24-badge p2">🤖 AI (<span id="m24-p2-sc">0</span>점)</span>
          </div>
          <div id="m24-ai-status" style="font-size: 13px; color: #dc2626; margin-top: 8px; visibility: hidden;">
            🤖 AI가 4개의 카드를 조합하여 24 수식을 탐색 중입니다...
          </div>
        </div>

        <div style="display: flex; justify-content: space-between; margin-bottom: 15px; font-weight: bold; font-size: 1.1rem; background: var(--container-bg); padding:10px; border-radius:8px;">
          <div style="color:#27ae60;">✨ 통과: <span id="m24-score">0</span> / <span id="m24-target-disp">10</span></div>
          <div style="color:#e67e22;">⏱️ 시간: <span id="m24-time">0</span>초</div>
        </div>

        <div class="make24-cards" id="m24-card-container"></div>
        <div class="make24-display" id="m24-formula" style="min-height:50px;"></div>

        <div class="make24-keyboard">
          <button class="make24-key op" data-char="+">＋</button>
          <button class="make24-key op" data-char="-">－</button>
          <button class="make24-key op" data-char="*">×</button>
          <button class="make24-key op" data-char="/">÷</button>
          <button class="make24-key op" data-char="(">(</button>
          <button class="make24-key op" data-char=")">)</button>
          <button class="make24-key fn" id="m24-btn-del" style="background:#e74c3c; color:#fff;">지우기</button>
          <button class="make24-key fn" id="m24-btn-reset" style="background:#f39c12; color:#fff;">리셋</button>
        </div>

        <div style="display:flex; gap:10px; margin-bottom: 12px; margin-top:10px;">
          <button class="btn" id="m24-btn-hint" style="background:#f39c12; margin:0; flex:1;">💡 힌트 보기</button>
          <button class="btn" id="m24-btn-skip" style="background:#95a5a6; margin:0; flex:1;">🔄 건너뛰기</button>
        </div>
        
        <button class="btn save-btn" id="m24-btn-submit" style="font-size: 1.2rem; padding: 18px; margin-bottom: 12px; width:100%;">✅ 정답 확인 및 제출</button>
        <button class="btn" id="m24-btn-exit" style="background:#8e44ad; font-size: 1.1rem; padding: 15px; width:100%;">🛑 게임 조기 종료 및 랭킹 등록</button>

        <div class="leaderboard-container">
          <h3 class="leaderboard-title">🏆 명예의 전당 (누적 통과 수)</h3>
          <div id="board-make24"><p style="color:#7f8c8d; text-align:center;">로딩 중...</p></div>
        </div>
      </div>
    `;
    this.bindEvents();
    if(typeof window.loadGameLeaderboard === 'function') {
      window.loadGameLeaderboard('메이크24', true, 'board-make24');
    }
  }

  bindEvents() {
    this.containerEl.querySelector('#m24-home-btn').addEventListener('click', () => this.goHome());

    const modeBtns = this.containerEl.querySelectorAll('.m24-mode-btn');
    modeBtns.forEach(btn => {
      btn.addEventListener('click', (e) => {
        modeBtns.forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        this.mode = e.target.dataset.mode;
      });
    });

    const targetBtns = this.containerEl.querySelectorAll('.m24-target-btn');
    targetBtns.forEach(btn => {
      btn.addEventListener('click', (e) => {
        targetBtns.forEach(b => {
          b.classList.remove('active');
          b.style.background = '#fff';
          b.style.color = '#2c3e50';
        });
        e.target.classList.add('active');
        e.target.style.background = '#2c3e50';
        e.target.style.color = '#fff';
        this.targetScore = parseInt(e.target.dataset.target);
      });
    });

    this.containerEl.querySelector('#m24-start-btn').addEventListener('click', () => {
      this.containerEl.querySelector('#m24-setup-screen').style.display = 'none';
      this.initGame();
    });

    this.containerEl.querySelectorAll('.make24-key.op').forEach(btn => {
      btn.addEventListener('click', (e) => this.inputChar(e.target.dataset.char));
    });
    this.containerEl.querySelector('#m24-btn-del').addEventListener('click', () => this.resetBoard());
    this.containerEl.querySelector('#m24-btn-reset').addEventListener('click', () => this.resetBoard());

    this.containerEl.querySelector('#m24-btn-hint').addEventListener('click', () => this.showHint());
    this.containerEl.querySelector('#m24-btn-skip').addEventListener('click', () => this.skipRound());
    this.containerEl.querySelector('#m24-btn-submit').addEventListener('click', () => this.submitAnswer());
    this.containerEl.querySelector('#m24-btn-exit').addEventListener('click', () => this.endGame());
  }

  initGame() {
    this.score = 0;
    this.time = 0;
    this.aiScore = 0;
    this.turn = 1;
    this.aiThinking = false;
    this.gameOver = false;
    
    this.containerEl.querySelector('#m24-score').innerText = this.score;
    this.containerEl.querySelector('#m24-target-disp').innerText = this.targetScore;
    this.containerEl.querySelector('#m24-time').innerText = this.time;
    
    const turnDisp = this.containerEl.querySelector('#m24-turn-display');
    if (this.mode === 'ai') {
      turnDisp.style.display = 'block';
    } else {
      turnDisp.style.display = 'none';
    }
    
    this.updateAiUI();

    if(this.timer) clearInterval(this.timer);
    this.timer = setInterval(() => {
      if(!this.gameOver) {
        this.time++;
        this.containerEl.querySelector('#m24-time').innerText = this.time;
      }
    }, 1000);

    this.nextRound();
  }

  nextRound() {
    if (this.score >= this.targetScore || this.aiScore >= this.targetScore) {
      this.endGame();
      return;
    }

    let solution = null;
    while(!solution) {
      this.cards = [
        Math.floor(Math.random() * 9) + 1,
        Math.floor(Math.random() * 9) + 1,
        Math.floor(Math.random() * 9) + 1,
        Math.floor(Math.random() * 9) + 1
      ];
      solution = this.findSolution(this.cards);
    }
    this.currentSolution = solution;
    this.hintUsed = false;
    this.resetBoard();
    this.updateAiUI();
  }

  findSolution(cards) {
    let resultExpr = null;
    function search(nums, exprs) {
      if(nums.length === 1) {
        if(Math.abs(nums[0] - 24) < 0.001) resultExpr = exprs[0];
        return;
      }
      for(let i = 0; i < nums.length; i++) {
        for(let j = 0; j < nums.length; j++) {
          if(i === j) continue;
          let nextNums = [], nextExprs = [];
          for(let k = 0; k < nums.length; k++) {
            if(k !== i && k !== j) { nextNums.push(nums[k]); nextExprs.push(exprs[k]); }
          }
          let a = nums[i], b = nums[j];
          let ea = exprs[i], eb = exprs[j];
          let combos = [
            {n: a + b, e: `(${ea} + ${eb})`},
            {n: a - b, e: `(${ea} - ${eb})`},
            {n: a * b, e: `(${ea} × ${eb})`}
          ];
          if(b !== 0) combos.push({n: a / b, e: `(${ea} ÷ ${eb})`});
          for(let c of combos) {
            nextNums.push(c.n); nextExprs.push(c.e);
            search(nextNums, nextExprs);
            nextNums.pop(); nextExprs.pop();
            if(resultExpr) return;
          }
        }
      }
    }
    search(cards, cards.map(String));
    if(resultExpr && resultExpr.startsWith('(') && resultExpr.endsWith(')')) {
      resultExpr = resultExpr.slice(1, -1);
    }
    return resultExpr;
  }

  resetBoard() {
    this.used = [false, false, false, false];
    this.exprStr = "";
    this.evalStr = "";
    const formulaEl = this.containerEl.querySelector('#m24-formula');
    formulaEl.innerText = "수식을 만드세요";
    formulaEl.style.color = '#7f8c8d';
    this.renderCards();
  }

  renderCards() {
    const container = this.containerEl.querySelector('#m24-card-container');
    container.innerHTML = '';
    for(let i = 0; i < 4; i++) {
      const card = document.createElement('div');
      card.className = 'make24-card';
      if(this.used[i]) card.classList.add('used');
      card.innerText = this.cards[i];
      card.onclick = () => {
        if (this.mode === 'ai' && (this.turn === 2 || this.aiThinking)) return;
        this.useCard(i);
      };
      container.appendChild(card);
    }
  }

  useCard(idx) {
    if(this.used[idx]) return;
    this.used[idx] = true;
    let val = this.cards[idx];
    this.exprStr += val;
    this.evalStr += val;
    this.updateDisplay();
    this.renderCards();
  }

  inputChar(char) {
    if (this.mode === 'ai' && (this.turn === 2 || this.aiThinking)) return;
    let dispChar = char;
    if(char === '*') dispChar = '×';
    if(char === '/') dispChar = '÷';
    this.exprStr += dispChar;
    this.evalStr += char;
    this.updateDisplay();
  }

  updateDisplay() {
    const disp = this.containerEl.querySelector('#m24-formula');
    disp.innerText = this.exprStr === "" ? "수식을 만드세요" : this.exprStr;
    disp.style.color = '#f1c40f';
  }

  showHint() {
    if (this.mode === 'ai' && (this.turn === 2 || this.aiThinking)) return;
    this.hintUsed = true;
    const formulaEl = this.containerEl.querySelector('#m24-formula');
    formulaEl.innerText = "💡 " + this.currentSolution;
    formulaEl.style.color = '#e74c3c';
  }

  skipRound() {
    if (this.mode === 'ai' && (this.turn === 2 || this.aiThinking)) return;
    this.showToast("다른 문제로 넘어갑니다.");
    if (this.mode === 'ai') {
      this.turn = 2;
      this.updateAiUI();
      setTimeout(() => this.triggerAiTurn(), 600);
    } else {
      this.nextRound();
    }
  }

  submitAnswer() {
    if (this.mode === 'ai' && (this.turn === 2 || this.aiThinking)) return;
    if(!this.used.every(v => v === true)) {
      this.showToast("4개의 숫자 카드를 모두 한 번씩 사용해야 합니다.", true);
      return;
    }
    try {
      let result = eval(this.evalStr);
      if(Math.abs(result - 24) < 0.001) {
        if(!this.hintUsed) {
          this.score++;
          this.containerEl.querySelector('#m24-score').innerText = this.score;
          this.showToast("🎉 정답입니다! 24를 만들었습니다!");
        } else {
          this.showToast("💡 힌트를 사용하여 통과했습니다. (점수 미반영)");
        }
        this.updateAiUI();
        if (this.score >= this.targetScore) {
          setTimeout(() => this.endGame(), 1000);
          return;
        }
        setTimeout(() => {
          if (this.mode === 'ai') {
            this.turn = 2;
            this.updateAiUI();
            setTimeout(() => this.triggerAiTurn(), 800);
          } else {
            this.nextRound();
          }
        }, 1000);
      } else {
        this.showToast(`결과가 24가 아닙니다. (현재 값: ${result})`, true);
      }
    } catch(e) {
      this.showToast("올바른 수식이 아닙니다. 괄호와 연산자를 확인하세요.", true);
    }
  }

  triggerAiTurn() {
    if (this.mode !== 'ai' || this.turn !== 2 || this.gameOver) return;
    this.aiThinking = true;
    this.updateAiUI();
    setTimeout(() => {
      let sol = this.findSolution(this.cards);
      if (sol && Math.random() < 0.85) {
        this.exprStr = sol;
        this.used = [true, true, true, true];
        this.updateDisplay();
        this.renderCards();
        this.showToast("🤖 AI 정답 발견! [ " + sol + " = 24 ]");
        this.aiScore++;
      } else {
        this.showToast("🤖 AI가 제한 시간 내에 24 수식을 찾지 못해 턴을 넘겼습니다!");
      }
      this.aiThinking = false;
      this.updateAiUI();
      if (this.aiScore >= this.targetScore) {
        setTimeout(() => this.endGame(), 1500);
        return;
      }
      setTimeout(() => {
        this.turn = 1;
        this.nextRound();
      }, 2000);
    }, 1500);
  }

  updateAiUI() {
    if (this.mode !== 'ai') return;
    this.containerEl.querySelector('#m24-p1-sc').innerText = this.score;
    this.containerEl.querySelector('#m24-p2-sc').innerText = this.aiScore;
    const turnMsg = this.containerEl.querySelector('#m24-turn-msg');
    const p1Badge = this.containerEl.querySelector('#m24-p1-badge');
    const p2Badge = this.containerEl.querySelector('#m24-p2-badge');
    const aiStatus = this.containerEl.querySelector('#m24-ai-status');

    if (this.turn === 1) {
      turnMsg.innerText = '👤 플레이어 차례입니다! 4개의 숫자로 24를 완성하세요.';
      turnMsg.style.color = '#1e3a8a';
      p1Badge.classList.add('active');
      p2Badge.classList.remove('active');
      aiStatus.style.visibility = 'hidden';
    } else {
      turnMsg.innerText = '🤖 AI 차례입니다. 잠시만 기다려주세요.';
      turnMsg.style.color = '#b91c1c';
      p1Badge.classList.remove('active');
      p2Badge.classList.add('active');
      aiStatus.style.visibility = 'visible';
    }
  }

  showToast(msg, isError = false) {
    if (typeof window.showToast === 'function') {
      window.showToast(msg);
      return;
    }
    let toast = document.getElementById('make24-toast-msg');
    if (!toast) {
      toast = document.createElement('div');
      toast.id = 'make24-toast-msg';
      toast.innerHTML = `<div class="make24-toast"></div>`;
      document.body.appendChild(toast);
    }
    const t = toast.querySelector('.make24-toast');
    t.className = `make24-toast ${isError ? 'error' : ''}`;
    t.innerText = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  endGame() {
    this.gameOver = true;
    if(this.timer) clearInterval(this.timer);
    
    let endMsg = `총 ${this.score}문제를 맞췄습니다!`;
    if (this.mode === 'ai') {
      if (this.score > this.aiScore) endMsg = `🎉 당신의 승리입니다! (당신 ${this.score} : AI ${this.aiScore})`;
      else if (this.score < this.aiScore) endMsg = `🤖 AI의 승리입니다! (당신 ${this.score} : AI ${this.aiScore})`;
      else endMsg = `🤝 무승부입니다! (당신 ${this.score} : AI ${this.aiScore})`;
    }

    if(typeof window.showInlineRankingModal === 'function') {
      window.showInlineRankingModal('메이크24', this.score, true, 'board-make24', () => {
        this.containerEl.querySelector('#m24-setup-screen').style.display = 'flex';
      }, endMsg);
    } else {
      let name = prompt(`${endMsg}\n명예의 전당에 등록할 닉네임을 입력하세요.`);
      if(name) {
        name = name.replace(/</g, "&lt;").replace(/>/g, "&gt;");
        if(typeof window.submitRanking === 'function') {
          window.submitRanking('메이크24', this.score, true, { value: name, trim: () => name }, 'board-make24');
        }
      }
      this.containerEl.querySelector('#m24-setup-screen').style.display = 'flex';
    }
  }

  cleanupGame(full = false) {
    this.gameOver = true;
    if(this.timer) clearInterval(this.timer);
    if(full && this.containerEl) {
      this.containerEl.innerHTML = '';
    }
  }

  goHome() {
    this.cleanupGame(true);
    if (typeof window.goHome === 'function') {
      window.goHome();
    } else {
      const roots = ['mathlab-view', 'new-root', 'monty-force-host'];
      roots.forEach(id => {
        const el = document.getElementById(id);
        if(el) { el.innerHTML = ''; el.style.display = 'none'; }
      });
      const legacy = document.getElementById('legacy-root');
      if(legacy) legacy.style.display = 'block';
    }
  }
}

(function() {
  const gameMeta = {
    id: 'make-24',
    title: '메이크 24',
    icon: '🃏',
    sourceType: 'new',
    mount(container, context) {
      if(!window.make24GameInstance) window.make24GameInstance = new Make24Game();
      window.make24GameInstance.mount(container);
    },
    reset() { if(window.make24GameInstance) window.make24GameInstance.initGame(); },
    destroy() { if(window.make24GameInstance) window.make24GameInstance.cleanupGame(true); },
    goHome() { if(window.make24GameInstance) window.make24GameInstance.goHome(); }
  };

  function registerMake24GameApp() {
    if (typeof window.MathLabGames !== 'undefined' && typeof window.MathLabGames.register === 'function') {
      if (!window.MathLabGames.get || !window.MathLabGames.get('make-24')) {
        try { window.MathLabGames.register(gameMeta); } catch (e) {}
      }
    } else {
      if (typeof window.MathLabGames === 'undefined') {
        window.MathLabGames = { _registry: {}, register(game) { this._registry[game.id] = game; } };
      }
      if (window.MathLabGames._registry) window.MathLabGames._registry['make-24'] = gameMeta;
    }
  }

  registerMake24GameApp();
  window.addEventListener('DOMContentLoaded', registerMake24GameApp);
  setTimeout(registerMake24GameApp, 100);
  setTimeout(registerMake24GameApp, 500);

  window.launchMake24Game = function() {
    registerMake24GameApp();
    if (window.LegacyBridge && typeof window.LegacyBridge.hideAllLegacySections === 'function') {
      window.LegacyBridge.hideAllLegacySections();
      window.LegacyBridge.showNewRoot();
    }
    if (typeof window.MathLabGames !== 'undefined' && typeof window.MathLabGames.mount === 'function') {
      try { window.MathLabGames.mount('make-24'); return; } catch(e) {}
    }
    const targetEl = document.getElementById('mathlab-view') || document.getElementById('new-root');
    if(!window.make24GameInstance) window.make24GameInstance = new Make24Game();
    window.make24GameInstance.mount(targetEl);
  };
})();
</script>
