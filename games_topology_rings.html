<script>
  /* ==========================================================================
     TopologyRings - 위상 링 풀기 (Untangle Graph Engine)
     Gen-3 수학 실험실 표준 규격 · 시간제한 보너스 점수 · 2인용 전자칠판 배틀 완결판
     ========================================================================== */
  const TopologyRings = (function() {
    // 1인용 / 2인용 모드 설정
    let gameMode = '1p'; // '1p' or '2p'
    let difficulty = 'easy';
    let round = 1;

    // 타이머 및 시간 제한 설정
    let timerInterval = null;
    let timeLeft = 60;

    const DIFF_CONFIG = {
      easy: { nodeCount: 7, timeLimit: 60, nameKo: '🟢 쉬움 (60초)' },
      medium: { nodeCount: 11, timeLimit: 50, nameKo: '🔵 보통 (50초)' },
      hard: { nodeCount: 15, timeLimit: 40, nameKo: '🟣 도전 (40초)' }
    };

    // 1인 탐구 모드 상태
    let nodes = [];
    let edges = [];
    let moves = 0;
    let stageScore = 1000;
    let cumulativeScore = 0;
    let crossingCount = 0;
    let isCleared = false;
    let draggedNode = null;

    // 2인 대결 모드 상태 (P1 / P2)
    let nodesP1 = [], edgesP1 = [], crossingCountP1 = 0, movesP1 = 0, draggedNodeP1 = null;
    let nodesP2 = [], edgesP2 = [], crossingCountP2 = 0, movesP2 = 0, draggedNodeP2 = null;
    let p1Wins = 0, p2Wins = 0;
    let is2pCleared = false;
    let toastTimer = null;

    const escapeHTML = (str) => {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, function(match) {
        const escape = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
        return escape[match];
      });
    };

    function showToast(msg, isError = false) {
      let host = document.getElementById('topology-rings-app');
      if (!host) return;
      let toast = host.querySelector('#topo-toast');
      if (!toast) {
        toast = document.createElement('div');
        toast.id = 'topo-toast';
        toast.style.cssText = 'position:absolute; top:20px; left:50%; transform:translateX(-50%); padding:12px 24px; border-radius:12px; font-weight:800; font-size:1rem; z-index:99999; box-shadow:0 10px 25px rgba(0,0,0,0.5); transition:all 0.3s; text-align:center; min-width:300px; pointer-events:none; opacity:0;';
        host.appendChild(toast);
      }
      toast.style.background = isError ? '#ef4444' : '#10b981';
      toast.style.color = isError ? '#ffffff' : '#0f172a';
      toast.textContent = msg;
      void toast.offsetWidth;
      toast.style.opacity = '1';
      toast.style.top = '20px';
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.top = '0px';
      }, 3000);
    }

    /* --------------------------------------------------------------------------
       Gen-3 동적 마운트 (mount): #mathlab-view 내부에 UI 주입 + 푸터 침범 방지 보정
       -------------------------------------------------------------------------- */
    function mount(container, context) {
      let host = null;
      if (typeof container === 'string') host = document.querySelector(container);
      else if (container instanceof HTMLElement) host = container;
      if (!host) host = window.MathLabUtils?.getMountContainer ? window.MathLabUtils.getMountContainer(container) : document.getElementById('mathlab-view');
      if (!host) host = document.getElementById('new-root') || document.getElementById('game-container');

      if (!host) {
        let createdHost = document.getElementById('topology-rings-force-host');
        if (!createdHost) {
          createdHost = document.createElement('div');
          createdHost.id = 'topology-rings-force-host';
          document.body.appendChild(createdHost);
        }
        host = createdHost;
      }

      // 🌟 [DOM 레이아웃 자동 방어] 푸터 위에 안전 재배치
      const footerEl = document.querySelector('footer, #footer, .app-footer') || 
                       Array.from(document.querySelectorAll('div, p, span')).find(el => el.textContent && el.textContent.includes('2026 기록조율사'));
      if (footerEl && host.compareDocumentPosition(footerEl) & Node.DOCUMENT_POSITION_PRECEDING) {
        footerEl.parentNode.insertBefore(host, footerEl);
      }

      host.style.display = '';

      host.innerHTML = `
        <div class="game-topology-rings" id="topology-rings-app">
          <!-- 상단 헤더 -->
          <div class="stats-bar">
            <div class="title-group">
              <div class="title-icon">🪢</div>
              <div>
                <div style="display:flex; align-items:center; gap:8px;">
                  <span class="title-text">위상 링 풀기 (Topology Rings)</span>
                  <span class="title-badge">평면 그래프 & 위상동형</span>
                  <span class="title-badge-2p">👥 1~2인</span>
                </div>
              </div>
            </div>
            <div class="header-actions">
              <button class="btn-header home" onclick="TopologyRings.goHome()"><span>🏠 홈으로</span></button>
              <button class="btn-header" onclick="TopologyRings.showGuideModal()"><span>❓ 게임 방법 & 2인 규칙</span></button>
              <button class="btn-header primary" id="btn-rank-header" onclick="TopologyRings.showRankingModal()"><span>🏆 명예의 전당</span></button>
              <button class="btn-header" style="background:#10b981; color:white;" onclick="TopologyRings.resetGame(false)"><span>🔄 처음부터 다시</span></button>
            </div>
          </div>

          <!-- 모드 선택 탭 바 (1인 탐구 vs 2인 전자칠판 대결) -->
          <div class="player-mode-bar">
            <button class="pmode-btn active" id="btn-pmode-1p" onclick="TopologyRings.setPlayerMode('1p')">
              <span>👤 1인 탐구 모드 (도전 & 명예의 전당)</span>
            </button>
            <button class="pmode-btn vs" id="btn-pmode-2p" onclick="TopologyRings.setPlayerMode('2p')">
              <span>👥 2인 전자칠판 대결 모드 (VS 멀티터치 배틀)</span>
            </button>
          </div>

          <!-- 통계 및 난이도 선택 바 -->
          <div class="info-dashboard">
            <div class="mode-tabs">
              <button class="tab-btn active" id="topo-tab-easy" onclick="TopologyRings.handleTabClick('easy')">🟢 쉬움 (60초 / 7노드)</button>

    /* --------------------------------------------------------------------------
       모드 및 탭 전환
       -------------------------------------------------------------------------- */
    function setPlayerMode(mode, isInitial = false) {
      if (!isInitial && mode === gameMode) return;
      gameMode = mode;

      const btn1p = document.getElementById('btn-pmode-1p');
      const btn2p = document.getElementById('btn-pmode-2p');
      const grid = document.getElementById('topo-arenas-grid');
      const card2 = document.getElementById('arena-card-2');
      const rankHeaderBtn = document.getElementById('btn-rank-header');
      const bottomRankSec = document.getElementById('bottom-ranking-sec');
      const badgeMoves = document.getElementById('badge-moves');
      const badgeScore = document.getElementById('badge-score');
      const head1 = document.getElementById('arena-head-1');

      if (btn1p && btn2p) {
        if (mode === '1p') {
          btn1p.classList.add('active');
          btn2p.classList.remove('active');
          if (grid) grid.classList.remove('two-player');
          if (card2) card2.style.display = 'none';
          if (rankHeaderBtn) rankHeaderBtn.style.display = 'inline-flex';
          if (bottomRankSec) bottomRankSec.style.display = 'flex';
          if (badgeMoves) badgeMoves.style.display = 'flex';
          if (badgeScore) badgeScore.style.display = 'flex';
          if (head1) head1.innerHTML = '<span>👤 1인 탐구 캔버스</span><span id="arena-info-1">남은 교차: 0</span>';
        } else {
          btn1p.classList.remove('active');
          btn2p.classList.add('active');
          if (grid) grid.classList.add('two-player');
          if (card2) card2.style.display = 'flex';
          if (rankHeaderBtn) rankHeaderBtn.style.display = 'none';
          if (bottomRankSec) bottomRankSec.style.display = 'none';
          if (badgeMoves) badgeMoves.style.display = 'none';
          if (badgeScore) badgeScore.style.display = 'none';
          p1Wins = 0; p2Wins = 0;
          if (head1) head1.innerHTML = '<span>🔴 플레이어 1 (P1)</span><span id="arena-info-1">승리: 0 | 교차: 0</span>';
        }
      }

      resetGame(false);
    }

    function handleTabClick(targetLevel) {
      if (targetLevel === difficulty) return;
      if (gameMode === '1p' && cumulativeScore > 0) {
        showToast(`난이도 변경! 기존 누적 점수(${cumulativeScore}점)는 유지됩니다.`);
      }
      setDifficulty(targetLevel, true);
    }

    function setDifficulty(level, keepScore = true) {
      difficulty = level;
      if (!keepScore) {
        cumulativeScore = 0;
        round = 1;
      }
      document.querySelectorAll('#topology-rings-app .mode-tabs .tab-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById('topo-tab-' + level);
      if (activeBtn) activeBtn.classList.add('active');

      generateStage(false);
    }

    function resetGame(keepScore = false) {
      if (!keepScore) {
        cumulativeScore = 0;
        round = 1;
        if (gameMode === '2p') {
          p1Wins = 0; p2Wins = 0;
        }
      }
      generateStage(false);
    }

    /* --------------------------------------------------------------------------
       스테이지 생성 & 타이머 초기화
       -------------------------------------------------------------------------- */
    function generateStage(isReorderOnly = false) {
      // 타이머 초기화 및 시작
      if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
      const cfg = DIFF_CONFIG[difficulty] || DIFF_CONFIG.easy;
      timeLeft = cfg.timeLimit;
      updateTimerUI();
      timerInterval = setInterval(updateTimerTick, 1000);

      const nextBtn = document.getElementById('topo-next-btn');
      if (nextBtn) nextBtn.style.display = 'none';

      if (gameMode === '1p') {
        isCleared = false;
        moves = 0;
        stageScore = 1000;
        if (!isReorderOnly) {
          generateGraphStructure(cfg.nodeCount, 1);
        }
        randomizePositions(nodes, 1);
        renderGraph(1);
        updateCrossingState(1);
        updateStatsUI();
        showBanner(`💡 [1인 / ${cfg.nameKo}] 제한시간 ${timeLeft}초 내에 교차 수 0을 만드세요! (초당 보너스 10점)`, '#38bdf8');
      } else {
        // 2인용 대결 모드: 100% 동일한 위상 구조를 생성하고 양쪽에 무작위 배치하여 공정 대결
        is2pCleared = false;
        movesP1 = 0; movesP2 = 0;
        if (!isReorderOnly) {
          generateGraphStructure(cfg.nodeCount, '2p-both');
        }
        randomizePositions(nodesP1, 1);
        randomizePositions(nodesP2, 2);
        renderGraph(1);
        renderGraph(2);
        updateCrossingState(1);
        updateCrossingState(2);
        updateStatsUI();
        showBanner(`🔥 [👥 2인 전자칠판 VS 배틀 / ${cfg.nameKo}] 제한시간 ${timeLeft}초! 먼저 교차 수 0을 푸는 선수가 승리합니다!`, '#facc15');
      }
    }

    function updateTimerTick() {
      timeLeft--;
      updateTimerUI();
      if (timeLeft <= 0) {
        if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
        onTimeout();
      }
    }

    function updateTimerUI() {
      const timerVal = document.getElementById('topo-timer-val');
      const timerBadge = document.getElementById('topo-timer-badge');
      if (timerVal) timerVal.textContent = `${Math.max(0, timeLeft)}초`;
      if (timerBadge) {
        if (timeLeft <= 10) timerBadge.classList.add('warning');
        else timerBadge.classList.remove('warning');
      }
    }

    function onTimeout() {
      if (gameMode === '1p') {
        if (isCleared) return;
        isCleared = true;
        showBanner(`⏰ [시간 초과!] 제한시간이 종료되어 ROUND #${round} 클리어에 실패했습니다.`, '#f43f5e');
        setTimeout(() => {
          showRankingModal(`⏰ [시간 초과 / R#${round}] 최종 점수 조기 정산`);
        }, 1200);
      } else {
        if (is2pCleared) return;
        is2pCleared = true;
        let winText = '';
        if (crossingCountP1 < crossingCountP2) {
          p1Wins++;
          winText = `⏰ [시간 종료] 🔴 플레이어 1(P1)이 남은 교차 수가 더 적어 승리했습니다! (${crossingCountP1} vs ${crossingCountP2})`;
        } else if (crossingCountP2 < crossingCountP1) {
          p2Wins++;
          winText = `⏰ [시간 종료] 🔵 플레이어 2(P2)가 남은 교차 수가 더 적어 승리했습니다! (${crossingCountP1} vs ${crossingCountP2})`;
        } else {
          winText = `⏰ [시간 종료] 양쪽 교차 수가 같아 무승부입니다! (${crossingCountP1} vs ${crossingCountP2})`;
        }
        updateStatsUI();
        showBanner(winText, '#facc15');
        const nextBtn = document.getElementById('topo-next-btn');
        if (nextBtn) nextBtn.style.display = 'inline-flex';
      }
    }

    /* --------------------------------------------------------------------------
       그래프 생성 및 무작위 배치
       -------------------------------------------------------------------------- */
    function generateGraphStructure(n, target) {
      const center = { x: 400, y: 240 };
      const radius = 160;
      let tempNodes = [];
      let tempEdges = [];

      for (let i = 0; i < n; i++) {
        const angle = (2 * Math.PI * i) / n;
        tempNodes.push({
          id: i,
          targetX: center.x + radius * Math.cos(angle),
          targetY: center.y + radius * Math.sin(angle),
          x: 0, y: 0
        });
      }

      for (let i = 0; i < n; i++) {
        tempEdges.push({ u: i, v: (i + 1) % n });
      }

      for (let i = 0; i < n; i += 2) {
        const tgt = (i + 3) % n;
        if (Math.abs(i - tgt) > 1 && !(i === 0 && tgt === n - 1)) {
          if (!tempEdges.some(e => (e.u === i && e.v === tgt) || (e.u === tgt && e.v === i))) {
            tempEdges.push({ u: i, v: tgt });
          }
        }
      }

      if (target === 1) {
        nodes = tempNodes; edges = tempEdges;
      } else if (target === '2p-both') {
        // P1과 P2에 완전히 독립된 복제본 할당
        nodesP1 = JSON.parse(JSON.stringify(tempNodes));
        edgesP1 = JSON.parse(JSON.stringify(tempEdges));
        nodesP2 = JSON.parse(JSON.stringify(tempNodes));
        edgesP2 = JSON.parse(JSON.stringify(tempEdges));
      }
    }

    function randomizePositions(nArray, arenaIdx) {
      const svg = document.getElementById(`topo-svg-${arenaIdx}`) || document.getElementById('topo-svg-1');
      const rect = svg ? svg.getBoundingClientRect() : { width: 500, height: 480 };
      const width = rect.width || 500;
      const height = rect.height || 480;
      const pad = 45;

      nArray.forEach(node => {
        node.x = pad + Math.random() * (width - pad * 2);
        node.y = pad + Math.random() * (height - pad * 2);
      });
    }

    /* --------------------------------------------------------------------------
       교차 판정 및 렌더링
       -------------------------------------------------------------------------- */
    function ccw(A, B, C) {
      return (C.y - A.y) * (B.x - A.x) > (B.y - A.y) * (C.x - A.x);
    }

    function doSegmentsIntersect(p1, p2, p3, p4) {
      if (p1 === p3 || p1 === p4 || p2 === p3 || p2 === p4) return false;
      return (ccw(p1, p3, p4) !== ccw(p2, p3, p4)) && (ccw(p1, p2, p3) !== ccw(p1, p2, p4));
    }

    function updateCrossingState(arenaIdx) {
      let currentNodes = (gameMode === '1p' || arenaIdx === 1) ? (gameMode === '1p' ? nodes : nodesP1) : nodesP2;
      let currentEdges = (gameMode === '1p' || arenaIdx === 1) ? (gameMode === '1p' ? edges : edgesP1) : edgesP2;

      let cCount = 0;
      const crossingEdges = new Set();

      for (let i = 0; i < currentEdges.length; i++) {
        for (let j = i + 1; j < currentEdges.length; j++) {
          const e1 = currentEdges[i];
          const e2 = currentEdges[j];
          const p1 = currentNodes[e1.u], p2 = currentNodes[e1.v];
          const p3 = currentNodes[e2.u], p4 = currentNodes[e2.v];

          if (doSegmentsIntersect(p1, p2, p3, p4)) {
            cCount++;
            crossingEdges.add(i);
            crossingEdges.add(j);
          }
        }
      }

      if (gameMode === '1p') crossingCount = cCount;
      else if (arenaIdx === 1) crossingCountP1 = cCount;
      else crossingCountP2 = cCount;

      currentEdges.forEach((e, idx) => {
        const lineEl = document.getElementById(`topo-edge-${arenaIdx}-${idx}`);
        if (!lineEl) return;
        if (crossingEdges.has(idx)) {
          lineEl.setAttribute('stroke', '#f43f5e');
          lineEl.setAttribute('stroke-width', '3.5');
          lineEl.setAttribute('stroke-opacity', '0.95');
        } else {
          lineEl.setAttribute('stroke', '#10b981');
          lineEl.setAttribute('stroke-width', '3.5');
          lineEl.setAttribute('stroke-opacity', '0.95');
        }
      });

      updateStatsUI();

      // 클리어 체크
      if (gameMode === '1p') {
        if (crossingCount === 0 && !isCleared && timeLeft > 0) {
          isCleared = true;
          if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
          onGameClear1p();
        }
      } else {
        if (!is2pCleared && timeLeft > 0) {
          if (crossingCountP1 === 0) {
            is2pCleared = true;
            if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
            p1Wins++;
            onGameClear2p(1);
          } else if (crossingCountP2 === 0) {
            is2pCleared = true;
            if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
            p2Wins++;
            onGameClear2p(2);
          }
        }
      }
    }

    function renderGraph(arenaIdx) {
      let currentNodes = (gameMode === '1p' || arenaIdx === 1) ? (gameMode === '1p' ? nodes : nodesP1) : nodesP2;
      let currentEdges = (gameMode === '1p' || arenaIdx === 1) ? (gameMode === '1p' ? edges : edgesP1) : edgesP2;

      const edgesGroup = document.getElementById(`topo-edges-group-${arenaIdx}`);
      const nodesGroup = document.getElementById(`topo-nodes-group-${arenaIdx}`);
      if (!edgesGroup || !nodesGroup) return;

      edgesGroup.innerHTML = '';
      nodesGroup.innerHTML = '';

      currentEdges.forEach((e, idx) => {
        const p1 = currentNodes[e.u], p2 = currentNodes[e.v];
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('id', `topo-edge-${arenaIdx}-${idx}`);
        line.setAttribute('x1', p1.x); line.setAttribute('y1', p1.y);
        line.setAttribute('x2', p2.x); line.setAttribute('y2', p2.y);
        line.setAttribute('stroke-linecap', 'round');
        edgesGroup.appendChild(line);
      });

      currentNodes.forEach((n, idx) => {
        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        g.setAttribute('class', 'node-group');

        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.setAttribute('id', `topo-node-${arenaIdx}-${idx}`);
        circle.setAttribute('class', 'node-circle');
        circle.setAttribute('cx', n.x); circle.setAttribute('cy', n.y);
        circle.setAttribute('r', '17');
        circle.setAttribute('fill', arenaIdx === 1 ? '#0ea5e9' : '#3b82f6');
        circle.setAttribute('stroke', '#ffffff');
        circle.setAttribute('stroke-width', '3');

        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('id', `topo-text-${arenaIdx}-${idx}`);
        text.setAttribute('x', n.x); text.setAttribute('y', n.y + 4);
        text.setAttribute('text-anchor', 'middle');
        text.setAttribute('fill', '#ffffff');
        text.setAttribute('font-size', '12px');
        text.setAttribute('font-weight', 'bold');
        text.setAttribute('pointer-events', 'none');
        text.textContent = idx + 1;

        g.appendChild(circle);
        g.appendChild(text);

        // 멀티터치 및 마우스 드래그 이벤트 등록
        circle.addEventListener('mousedown', (evt) => startDrag(evt, idx, arenaIdx));
        circle.addEventListener('touchstart', (evt) => startDrag(evt, idx, arenaIdx), { passive: false });

        nodesGroup.appendChild(g);
      });
    }

    /* --------------------------------------------------------------------------
       동시 터치/마우스 드래그 핸들러 (1인용 & 2인용 공통)
       -------------------------------------------------------------------------- */
    function startDrag(evt, idx, arenaIdx) {
      if (gameMode === '1p' && isCleared) return;
      if (gameMode === '2p' && is2pCleared) return;
      evt.preventDefault();

      if (gameMode === '1p' || arenaIdx === 1) draggedNodeP1 = { idx, arenaIdx: 1 };
      else draggedNodeP2 = { idx, arenaIdx: 2 };
    }

    function onGlobalDrag(evt) {
      if (!draggedNodeP1 && !draggedNodeP2) return;

      if (evt.touches && evt.touches.length > 0) {
        // 여러 손가락이 터치 중일 때 각각의 터치 좌표를 아레나와 매칭
        for (let i = 0; i < evt.touches.length; i++) {
          const touch = evt.touches[i];
          const targetEl = document.elementFromPoint(touch.clientX, touch.clientY);
          // 1번 아레나 드래그
          if (draggedNodeP1 && isPointInArena(touch.clientX, touch.clientY, 1)) {
            moveNodeToPoint(touch.clientX, touch.clientY, draggedNodeP1.idx, 1);
          }
          // 2번 아레나 드래그
          if (draggedNodeP2 && isPointInArena(touch.clientX, touch.clientY, 2)) {
            moveNodeToPoint(touch.clientX, touch.clientY, draggedNodeP2.idx, 2);
          }
        }
      } else {
        // 마우스 드래그
        if (draggedNodeP1) moveNodeToPoint(evt.clientX, evt.clientY, draggedNodeP1.idx, 1);
        if (draggedNodeP2) moveNodeToPoint(evt.clientX, evt.clientY, draggedNodeP2.idx, 2);
      }
    }

    function isPointInArena(cx, cy, arenaIdx) {
      const svg = document.getElementById(`topo-svg-${arenaIdx}`);
      if (!svg) return false;
      const rect = svg.getBoundingClientRect();
      return cx >= rect.left && cx <= rect.right && cy >= rect.top && cy <= rect.bottom;
    }

    function moveNodeToPoint(cx, cy, idx, arenaIdx) {
      const svg = document.getElementById(`topo-svg-${arenaIdx}`);
      if (!svg) return;
      const rect = svg.getBoundingClientRect();

      let newX = cx - rect.left;
      let newY = cy - rect.top;
      newX = Math.max(25, Math.min(rect.width - 25, newX));
      newY = Math.max(25, Math.min(rect.height - 25, newY));

      let currentNodes = (gameMode === '1p' || arenaIdx === 1) ? (gameMode === '1p' ? nodes : nodesP1) : nodesP2;
      let currentEdges = (gameMode === '1p' || arenaIdx === 1) ? (gameMode === '1p' ? edges : edgesP1) : edgesP2;

      currentNodes[idx].x = newX;
      currentNodes[idx].y = newY;

      const circle = document.getElementById(`topo-node-${arenaIdx}-${idx}`);
      const text = document.getElementById(`topo-text-${arenaIdx}-${idx}`);
      if (circle) { circle.setAttribute('cx', newX); circle.setAttribute('cy', newY); }
      if (text) { text.setAttribute('x', newX); text.setAttribute('y', newY + 4); }

      currentEdges.forEach((e, edgeIdx) => {
        if (e.u === idx || e.v === idx) {
          const line = document.getElementById(`topo-edge-${arenaIdx}-${edgeIdx}`);
          if (line) {
            const p1 = currentNodes[e.u], p2 = currentNodes[e.v];
            line.setAttribute('x1', p1.x); line.setAttribute('y1', p1.y);
            line.setAttribute('x2', p2.x); line.setAttribute('y2', p2.y);
          }
        }
      });

      updateCrossingState(arenaIdx);
    }

    function onGlobalDragEnd(evt) {
      if (draggedNodeP1) {
        if (gameMode === '1p') { moves++; stageScore = Math.max(100, stageScore - 5); }
        else movesP1++;
        draggedNodeP1 = null;
        updateCrossingState(1);
      }
      if (draggedNodeP2) {
        movesP2++;
        draggedNodeP2 = null;
        updateCrossingState(2);
      }
    }

    // 전역 드래그 리스너 연결
    window.addEventListener('mousemove', onGlobalDrag);
    window.addEventListener('touchmove', onGlobalDrag, { passive: false });
    window.addEventListener('mouseup', onGlobalDragEnd);
    window.addEventListener('touchend', onGlobalDragEnd);

    /* --------------------------------------------------------------------------
       통계 및 UI 업데이트
       -------------------------------------------------------------------------- */
    function updateStatsUI() {
      const roundEl = document.getElementById('topo-round-val');
      const crossEl = document.getElementById('topo-crossings-count');
      const badgeCross = document.getElementById('topo-crossings-badge');
      const movesEl = document.getElementById('topo-moves-count');
      const scoreEl = document.getElementById('topo-score-count');
      const info1 = document.getElementById('arena-info-1');
      const info2 = document.getElementById('arena-info-2');

      if (roundEl) roundEl.textContent = `ROUND #${round}`;

      if (gameMode === '1p') {
        if (crossEl) crossEl.textContent = crossingCount;
        if (movesEl) movesEl.textContent = `${moves}회`;
        if (scoreEl) scoreEl.textContent = `${cumulativeScore + (isCleared ? 0 : stageScore)}점`;
        if (badgeCross) {
          if (crossingCount === 0) badgeCross.classList.add('cleared');
          else badgeCross.classList.remove('cleared');
        }
        if (info1) info1.textContent = `남은 교차: ${crossingCount}`;
      } else {
        if (crossEl) crossEl.textContent = `P1:${crossingCountP1} / P2:${crossingCountP2}`;
        if (info1) info1.textContent = `🏆 승리: ${p1Wins} | 남은 교차: ${crossingCountP1}`;
        if (info2) info2.textContent = `🏆 승리: ${p2Wins} | 남은 교차: ${crossingCountP2}`;
      }
    }

    /* --------------------------------------------------------------------------
       클리어 이벤트 (1인용 시간보너스 vs 2인용 대결 승리)
       -------------------------------------------------------------------------- */
    function onGameClear1p() {
      const timeBonus = timeLeft * 10;
      const roundTotal = stageScore + timeBonus;
      cumulativeScore += roundTotal;
      updateStatsUI();

      showBanner(`🎉 [ROUND #${round} 클리어!] 교차 0 (+${stageScore}점) + 시간보너스(+${timeBonus}점) = 총 +${roundTotal}점 누적! 하단의 [▶ 다음 라운드 진행 (+)]을 누르세요.`, '#34d399');
      document.querySelectorAll('#topo-nodes-group-1 circle').forEach(c => c.setAttribute('fill', '#10b981'));

      const nextBtn = document.getElementById('topo-next-btn');
      if (nextBtn) nextBtn.style.display = 'inline-flex';
    }

    function onGameClear2p(winnerIdx) {
      updateStatsUI();
      if (winnerIdx === 1) {
        showBanner(`🎉 [2인 VS 배틀 P1 승리!] 🔴 플레이어 1(P1)이 더 빠르게 위상 링을 풀어냈습니다! (P1 승리: ${p1Wins}회 / P2 승리: ${p2Wins}회)`, '#34d399');
        document.querySelectorAll('#topo-nodes-group-1 circle').forEach(c => c.setAttribute('fill', '#10b981'));
      } else {
        showBanner(`🎉 [2인 VS 배틀 P2 승리!] 🔵 플레이어 2(P2)가 더 빠르게 위상 링을 풀어냈습니다! (P1 승리: ${p1Wins}회 / P2 승리: ${p2Wins}회)`, '#34d399');
        document.querySelectorAll('#topo-nodes-group-2 circle').forEach(c => c.setAttribute('fill', '#10b981'));
      }
      const nextBtn = document.getElementById('topo-next-btn');
      if (nextBtn) nextBtn.style.display = 'inline-flex';
    }

    function onNextRound() {
      round++;
      if (gameMode === '1p') {
        if (difficulty === 'easy' && round === 6) {
          showBanner(`🎉 쉬움 5라운드 완벽 마스터! [🔵 보통 모드(50초/11노드)]로 자동 승급합니다!`, '#facc15');
          setDifficulty('medium', true);
        } else if (difficulty === 'medium' && round === 11) {
          showBanner(`🔥 보통 5라운드 완벽 마스터! [🟣 도전 모드(40초/15노드)]로 자동 승급합니다!`, '#facc15');
          setDifficulty('hard', true);
        } else {
          generateStage(false);
        }
      } else {
        generateStage(false);
      }
    }

    function useHint() {
      if (gameMode === '1p' && isCleared) return;
      if (gameMode === '2p' && is2pCleared) return;

      let currentNodes = gameMode === '1p' ? nodes : nodesP1;
      let currentEdges = gameMode === '1p' ? edges : edgesP1;
      let arenaIdx = 1;

      const nodeCrossingCount = new Array(currentNodes.length).fill(0);
      for (let i = 0; i < currentEdges.length; i++) {
        for (let j = i + 1; j < currentEdges.length; j++) {
          const e1 = currentEdges[i], e2 = currentEdges[j];
          if (doSegmentsIntersect(currentNodes[e1.u], currentNodes[e1.v], currentNodes[e2.u], currentNodes[e2.v])) {
            nodeCrossingCount[e1.u]++; nodeCrossingCount[e1.v]++;
            nodeCrossingCount[e2.u]++; nodeCrossingCount[e2.v]++;
          }
        }
      }

      let maxNode = 0, maxCnt = -1;
      nodeCrossingCount.forEach((cnt, idx) => {
        if (cnt > maxCnt) { maxCnt = cnt; maxNode = idx; }
      });

      if (maxCnt > 0) {
        if (gameMode === '1p') stageScore = Math.max(100, stageScore - 30);
        updateStatsUI();

        const targetCircle = document.getElementById(`topo-node-${arenaIdx}-${maxNode}`);
        if (targetCircle) {
          targetCircle.setAttribute('fill', '#f59e0b');
          targetCircle.setAttribute('r', '23');
          showBanner(`💡 가장 얽힌 [${maxNode + 1}번 노드]를 바깥쪽으로 당기세요! (-30점)`, '#facc15');
          setTimeout(() => {
            targetCircle.setAttribute('fill', '#0ea5e9');
            targetCircle.setAttribute('r', '17');
          }, 1400);
        }
      } else {
        showBanner(`💡 더 이상 얽힌 노드가 없습니다!`, '#38bdf8');
      }
    }

    function showBanner(msg, color) {
      const banner = document.getElementById('topo-status-msg');
      if (banner) {
        banner.innerHTML = msg;
        banner.style.color = color || '#38bdf8';
      }
    }

    function manualStopAndSave() {
      showRankingModal(`🏁 [${DIFF_CONFIG[difficulty].nameKo} ROUND #${round}] 최종 정산 완료!`);
    }

    function showGuideModal() {
      closeModals();
      document.getElementById('topo-guide-modal')?.classList.add('active');
    }

    function showRankingModal(reasonMsg = '') {
      closeModals();
      const modal = document.getElementById('topo-rank-modal');
      if (modal) modal.classList.add('active');

      const titleEl = document.getElementById('topo-rank-modal-title');
      const sumEl = document.getElementById('topo-gameover-summary');

      if (titleEl) titleEl.textContent = reasonMsg ? '🏁 위상 링 풀기 기록 정산' : '🏆 위상 링 풀기 명예의 전당';

      const displayScore = isCleared ? cumulativeScore : cumulativeScore + stageScore;
      if (sumEl) {
        sumEl.innerHTML = `
          <div style="font-size:1.15rem; font-weight:900; color:#f87171; margin-bottom:6px;">${reasonMsg || '명예의 전당 랭킹 조회'}</div>
          <div style="font-size:1.35rem; font-weight:900; color:#38bdf8;">최종 누적 점수: ${displayScore}점</div>
          <div style="font-size:0.98rem; color:#facc15; margin-top:4px; font-weight:800;">최종 도달 위치: [${DIFF_CONFIG[difficulty].nameKo}] ROUND #${round}</div>
        `;
      }

      if (typeof loadGameLeaderboard === 'function') {
        loadGameLeaderboard('위상링풀기', true, 'board-topology-rings');
      }
    }

    function renderBottomLeaderboard() {
      if (typeof loadGameLeaderboard === 'function') {
        loadGameLeaderboard('위상링풀기', true, 'board-topology-rings-bottom');
      } else {
        try {
          let list = JSON.parse(localStorage.getItem('mathlab_lb_topology_rings') || '[]');
          const bottomEl = document.getElementById('board-topology-rings-bottom');
          if (bottomEl) {
            if (list.length === 0) {
              bottomEl.innerHTML = '<p style="text-align:center; color:#94a3b8; padding:12px 0;">아직 등록된 명예의 전당 기록이 없습니다. 첫 번째 위상 마스터가 되어보세요!</p>';
            } else {
              bottomEl.innerHTML = `
                <div style="display:flex; flex-direction:column; gap:6px;">
                  ${list.slice(0, 5).map((item, idx) => `
                    <div style="display:flex; justify-content:space-between; align-items:center; background:#0f172a; padding:10px 14px; border-radius:10px; border:1px solid #334155;">
                      <span style="font-weight:800; color:${idx === 0 ? '#facc15' : '#cbd5e1'};">${idx === 0 ? '👑 1위' : `${idx + 1}위`} - ${escapeHTML(item.nickname)}</span>
                      <span style="color:#38bdf8; font-weight:900;">${item.score}점 (${item.modeSummary || item.difficulty || 'EASY'})</span>
                    </div>
                  `).join('')}
                </div>
              `;
            }
          }
        } catch(e) {}
      }
    }

    function closeModals() {
      document.querySelectorAll('#topology-rings-app .modal-overlay').forEach(m => m.classList.remove('active'));
    }

    function submitRankScore() {
      const input = document.getElementById('topo-nickname-input');
      const nickname = (input && input.value.trim()) ? input.value.trim() : '';
      if (!nickname) {
        showToast('⚠️ 닉네임을 입력해 주세요!', true);
        return;
      }

      const displayScore = isCleared ? cumulativeScore : cumulativeScore + stageScore;
      const modeSummary = `${DIFF_CONFIG[difficulty].nameKo} (R#${round})`;

      try {
        let list = JSON.parse(localStorage.getItem('mathlab_lb_topology_rings') || '[]');
        const dateStr = new Date().toLocaleDateString('ko-KR', { month: '2-digit', day: '2-digit' });
        list.push({ nickname, score: displayScore, date: dateStr, difficulty: DIFF_CONFIG[difficulty].nameKo, round, modeSummary });
        list.sort((a, b) => b.score - a.score);
        localStorage.setItem('mathlab_lb_topology_rings', JSON.stringify(list.slice(0, 20)));
      } catch (e) {}

      if (typeof window.submitRanking === 'function') {
        window.submitRanking('위상링풀기', displayScore, true, 'topo-nickname-input', 'board-topology-rings');
      } else if (typeof window.parent?.submitRanking === 'function') {
        window.parent.submitRanking('위상링풀기', displayScore, true, 'topo-nickname-input', 'board-topology-rings');
      } else {
        showToast(`🎉 명예의 전당 등재 완료!`);
        if (input) input.value = '';
        closeModals();
      }

      renderBottomLeaderboard();
    }

    function goHome() {
      if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
      destroy();
      if (window.LegacyBridge && typeof window.LegacyBridge.backHome === 'function') { try { window.LegacyBridge.backHome(); return; } catch(e) {} }
      if (typeof window.renderLegacyDashboardHome === 'function') { try { window.renderLegacyDashboardHome(); return; } catch(e) {} }
      if (typeof window.MathLabRenderHome === 'function') { try { window.MathLabRenderHome(); return; } catch(e) {} }

      const mathlabRoot = document.getElementById('mathlab-root');
      const legacyRoot = document.getElementById('legacy-root');
      if (mathlabRoot) mathlabRoot.classList.add('hidden');
      if (legacyRoot) legacyRoot.classList.remove('hidden');

      const dashboard = document.getElementById('dashboard-screen');
      if (dashboard) { dashboard.classList.add('active'); dashboard.style.display = ''; }
      window.scrollTo({ top: 0, left: 0, behavior: 'smooth' });
    }

    function destroy() {
      if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
      window.removeEventListener('mousemove', onGlobalDrag);
      window.removeEventListener('touchmove', onGlobalDrag);
      window.removeEventListener('mouseup', onGlobalDragEnd);
      window.removeEventListener('touchend', onGlobalDragEnd);
    }

    return {
      mount,
      setPlayerMode,
      handleTabClick,
      setDifficulty,
      generateStage,
      useHint,
      onNextRound,
      manualStopAndSave,
      showGuideModal,
      showRankingModal,
      closeModals,
      submitRankScore,
      renderBottomLeaderboard,
      goHome,
      resetGame,
      destroy
    };
  })();

  /* 하단 안전 등록 4중 브리지 */
  function registerTopologyRings() {
    if (typeof window.MathLabGames !== 'undefined' && typeof window.MathLabGames.register === 'function') {
      if (!window.MathLabGames.get('topology-rings')) {
        try {
          window.MathLabGames.register({
            id: 'topology-rings',
            title: '위상 링 풀기',
            icon: '🪢',
            sourceType: 'new',
            players: '1~2인',
            isMultiplayer: true,
            mount(container, context) { TopologyRings.mount(container, context); },
            reset() { TopologyRings.resetGame(false); },
            destroy() { TopologyRings.destroy(); },
            goHome() { TopologyRings.goHome(); }
          });
        } catch (e) {
          console.warn('topology-rings 안전 등록 방어:', e);
        }
      }
    }
  }

  registerTopologyRings();
  window.addEventListener('DOMContentLoaded', registerTopologyRings);
  setTimeout(registerTopologyRings, 100);
  setTimeout(registerTopologyRings, 500);

  window.TopologyRings = TopologyRings;
  window.initTopologyRingsGame = function() {
    const target = document.getElementById('game-topology-rings-app') || document.getElementById('mathlab-view');
    TopologyRings.mount(target);
  };
  window.launchTopologyRingsGame = function() {
    registerTopologyRings();
    if (typeof window.MathLabGames !== 'undefined' && typeof window.MathLabGames.mount === 'function') {
      try { window.MathLabGames.mount('topology-rings'); return; } catch(e) {}
    }
    TopologyRings.mount();
  };
</script>
