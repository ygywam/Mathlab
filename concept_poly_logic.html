
<script>
(function() {
  'use strict';

  const PolyConceptApp = {
    host: null,
    currentPolyMode: 'cubic-horiz',
    lastPolyForm: '',

    mount(container) {
      this.host = (typeof container === 'string') ? document.querySelector(container) : container;
      if (!this.host) {
        this.host = document.getElementById('mathlab-view') || document.getElementById('new-root') || document.body;
      }
      
      this.host.style.display = '';
      this.host.style.visibility = 'visible';
      this.host.style.opacity = '1';
      let parent = this.host.parentElement;
      while (parent && parent !== document.body && parent !== document.documentElement) {
        if (parent.style && parent.style.display === 'none') parent.style.display = 'block';
        if (parent.style && parent.style.visibility === 'hidden') parent.style.visibility = 'visible';
        parent = parent.parentElement;
      }
      
      this.render();
    },

    goHome() {
      this.destroy();
      if (typeof window.LegacyBridge !== 'undefined' && typeof window.LegacyBridge.backHome === 'function') {
        try { window.LegacyBridge.backHome(); return; } catch (e) {}
      }
      if (typeof window.MathLabUtils !== 'undefined' && typeof window.MathLabUtils.goHome === 'function') {
        window.MathLabUtils.goHome();
      } else {
        location.reload();
      }
    },

    destroy() {
      if (this.host) {
        this.host.innerHTML = '';
        this.host.style.display = 'none';
      }
    },

    switchPoly(mode) {
      if (!this.host) return;
      this.currentPolyMode = mode; 
      
      this.host.querySelectorAll('.poly-tab-btn').forEach(btn => {
        btn.classList.remove('active');
        btn.style.borderColor = '#dfe6e9';
        btn.style.background = '#fff';
      });
      
      let activeBtn = this.host.querySelector(`.poly-tab-btn[data-mode="${mode}"]`); 
      if(activeBtn) {
        activeBtn.classList.add('active');
        activeBtn.style.borderColor = '#8e44ad';
        activeBtn.style.background = '#f4ecf7';
      }
      
      this.host.querySelector('#poly-sliders-ratio').classList.add('hidden'); 
      this.host.querySelector('#poly-sliders-cfree').classList.add('hidden'); 
      this.host.querySelector('#poly-sliders-qfree').classList.add('hidden');
      
      if (mode === 'cubic-free') {
        this.host.querySelector('#poly-sliders-cfree').classList.remove('hidden');
      } else if (mode === 'quartic-free') {
        this.host.querySelector('#poly-sliders-qfree').classList.remove('hidden');
      } else { 
        this.host.querySelector('#poly-sliders-ratio').classList.remove('hidden'); 
        this.host.querySelector('#group-poly-m').style.display = (mode === 'cubic-slant') ? 'block' : 'none'; 
      }
      
      this.updatePoly();
    },

    updatePoly() {
      if (!this.host) return;
      const canvas = this.host.querySelector('#canvas-poly'); 
      if (!canvas) return;
      const ctx = canvas.getContext('2d'); 
      ctx.clearRect(0, 0, canvas.width, canvas.height); 
      ctx.setLineDash([]); 
      
      const centerX = canvas.width / 2; 
      const centerY = canvas.height / 2;
      
      let f = (x) => 0; let lineF = null; let points = []; let fText = ""; let descText = ""; 
      
      // Fixed view logic based on mode
      let rangeW = 20; // Default width span: x from -10 to 10
      let midFocusX = 0;
      let rangeH = 100; // Default height span: y from -50 to 50
      let midFocusY = 0;
      
      if (this.currentPolyMode === 'cubic-free') {
        let a = parseFloat(this.host.querySelector('#slider-cf-a').value); if(Math.abs(a)<0.1) a=0.5;
        let b = parseFloat(this.host.querySelector('#slider-cf-b').value); let c = parseFloat(this.host.querySelector('#slider-cf-c').value); let d = parseFloat(this.host.querySelector('#slider-cf-d').value);
        this.host.querySelector('#val-cf-a').innerText = a.toFixed(1); this.host.querySelector('#val-cf-b').innerText = b; this.host.querySelector('#val-cf-c').innerText = c; this.host.querySelector('#val-cf-d').innerText = d;
        f = (x) => a*x*x*x + b*x*x + c*x + d;
        let bPart = b === 0 ? "" : (b > 0 ? `+ ${b.toFixed(1)}x^2` : `- ${Math.abs(b).toFixed(1)}x^2`); let cPart = c === 0 ? "" : (c > 0 ? `+ ${c.toFixed(1)}x` : `- ${Math.abs(c).toFixed(1)}x`); let dPart = d === 0 ? "" : (d > 0 ? `+ ${d.toFixed(1)}` : `- ${Math.abs(d).toFixed(1)}`);
        fText = `f(x) = ${a.toFixed(1)}x^3 ${bPart} ${cPart} ${dPart}`; this.host.querySelector('#poly-title').innerText = "삼차함수 일반형 (자유 조작)";
        
        rangeW = 16; rangeH = 120; // Fixed frame
        const D = 4*b*b - 12*a*c;
        if (D > 0) {
          const x1 = (-2*b - Math.sqrt(D))/(6*a); const x2 = (-2*b + Math.sqrt(D))/(6*a);
          const leftEx = Math.min(x1, x2); const rightEx = Math.max(x1, x2); const ipX = -b/(3*a); const cross1 = 3*ipX - 2*leftEx; 
          points.push({x: leftEx, y: f(leftEx), label: '극점', color: '#d35400', ratio:'start'}); points.push({x: rightEx, y: f(rightEx), label: '극점', color: '#3498db', ratio:'mid'}); points.push({x: cross1, y: f(leftEx), label: '교점', color: '#27ae60', ratio:'end'});
          lineF = (x) => f(leftEx);
          descText = `변곡점을 중심으로 극대점과 교점 사이의 가로폭 분할 비율은 언제나 <strong>2 : 1</strong>로 보존됩니다.`;
        } else { 
          descText = `극값이 생기지 않는 개형입니다.`;
        }
      } else if (this.currentPolyMode === 'quartic-free') {
        let a = parseFloat(this.host.querySelector('#slider-qf-a').value); if(Math.abs(a)<0.1) a=0.2;
        let b = parseFloat(this.host.querySelector('#slider-qf-b').value); let c = parseFloat(this.host.querySelector('#slider-qf-c').value); let d = parseFloat(this.host.querySelector('#slider-qf-d').value); let e = parseFloat(this.host.querySelector('#slider-qf-e').value);
        this.host.querySelector('#val-qf-a').innerText = a.toFixed(1); this.host.querySelector('#val-qf-b').innerText = b; this.host.querySelector('#val-qf-c').innerText = c; this.host.querySelector('#val-qf-d').innerText = d; this.host.querySelector('#val-qf-e').innerText = e;
        f = (x) => a*Math.pow(x,4) + b*Math.pow(x,3) + c*Math.pow(x,2) + d*x + e;
        let bPart = b === 0 ? "" : (b > 0 ? `+ ${b.toFixed(1)}x^3` : `- ${Math.abs(b).toFixed(1)}x^3`); let cPart = c === 0 ? "" : (c > 0 ? `+ ${c.toFixed(1)}x^2` : `- ${Math.abs(c).toFixed(1)}x^2`); let dPart = d === 0 ? "" : (d > 0 ? `+ ${d.toFixed(1)}x` : `- ${Math.abs(d).toFixed(1)}x`); let ePart = e === 0 ? "" : (e > 0 ? `+ ${e.toFixed(1)}` : `- ${Math.abs(e).toFixed(1)}`);
        fText = `f(x) = ${a.toFixed(1)}x^4 ${bPart} ${cPart} ${dPart} ${ePart}`; this.host.querySelector('#poly-title').innerText = "사차함수 일반형 (자유 조작)"; 
        descText = "계수 조작에 따른 도함수의 실근 변화와 대칭성 붕괴를 실시간으로 확인하세요."; 
        rangeW = 16; rangeH = 150;
      } else {
        let a = parseFloat(this.host.querySelector('#slider-poly-a').value); if(Math.abs(a)<0.1) a=0.2;
        const p = parseFloat(this.host.querySelector('#slider-poly-p').value); const k = parseFloat(this.host.querySelector('#slider-poly-k').value); const m = parseFloat(this.host.querySelector('#slider-poly-m').value);
        this.host.querySelector('#val-poly-a').innerText = a.toFixed(1); this.host.querySelector('#val-poly-p').innerText = p.toFixed(1); this.host.querySelector('#val-poly-k').innerText = k.toFixed(1); this.host.querySelector('#val-poly-m').innerText = m.toFixed(1);
        let kTerm = k === 0 ? "x" : (k > 0 ? `(x - ${k.toFixed(1)})` : `(x + ${Math.abs(k).toFixed(1)})`);
        
        rangeW = 20; rangeH = 120; // Fixed coordinate system for ratio apps
        
        if (this.currentPolyMode === 'cubic-horiz') {
          f = (x) => a * Math.pow(x-k, 2) * (x-k - 3*p); lineF = (x) => 0; 
          let targetX = k + 3*p; let pTerm = targetX === 0 ? "x" : (targetX > 0 ? `(x - ${targetX.toFixed(1)})` : `(x + ${Math.abs(targetX).toFixed(1)})`);
          fText = `f(x) = ${a.toFixed(1)}${kTerm}^2 ${pTerm}`; this.host.querySelector('#poly-title').innerText = "삼차함수 평행접선 (2 : 1 비율)"; 
          descText = "극대극소를 통과하는 평행접선과 삼차함수가 만나는 교점 사이의 내부 분할비는 무조건 <strong>2 : 1</strong> 입니다.";
          points.push({x: k, y: 0, label: '접점', color: '#d35400', ratio:'start'}); points.push({x: k+2*p, y: f(k+2*p), label: '극소', color: '#3498db', ratio:'mid'}); points.push({x: k+3*p, y: 0, label: '교점', color: '#27ae60', ratio:'end'});
        } else if (this.currentPolyMode === 'cubic-slant') {
          f = (x) => a * Math.pow(x-k, 2) * (x-k - 3*p) + m*(x-k); lineF = (x) => m*(x-k); 
          let targetX = k + 3*p; let pTerm = targetX === 0 ? "x" : (targetX > 0 ? `(x - ${targetX.toFixed(1)})` : `(x + ${Math.abs(targetX).toFixed(1)})`);
          let slantPart = m === 0 ? "" : (m > 0 ? `+ ${m.toFixed(1)}${kTerm}` : `- ${Math.abs(m).toFixed(1)}${kTerm}`);
          fText = `f(x) = ${a.toFixed(1)}${kTerm}^2 ${pTerm} ${slantPart}`; this.host.querySelector('#poly-title').innerText = "기울어진 접선과 평균변화율"; 
          descText = "접선이 임의의 기울기 $m$으로 변형되어도 교점과 평행접점 사이의 $x$축 투영폭은 똑같이 <strong>2 : 1</strong>을 유지합니다.";
          points.push({x: k, y: f(k), label: '접점', color: '#d35400', ratio:'start'}); points.push({x: k+2*p, y: f(k+2*p), label: '평행접점', color: '#8e44ad', ratio:'mid'}); points.push({x: k+3*p, y: f(k+3*p), label: '교점', color: '#27ae60', ratio:'end'});
        } else if (this.currentPolyMode === 'quartic-31') {
          f = (x) => a * Math.pow(x-k, 3) * (x-k - 4*p); lineF = (x) => 0;
          let targetX = k + 4*p; let pTerm = targetX === 0 ? "x" : (targetX > 0 ? `(x - ${targetX.toFixed(1)})` : `(x + ${Math.abs(targetX).toFixed(1)})`);
          fText = `f(x) = ${a.toFixed(1)}${kTerm}^3 ${pTerm}`; this.host.querySelector('#poly-title').innerText = "사차함수 삼중근과 극소 (3 : 1 비율)"; 
          descText = "변곡접점(삼중근)에서 극솟값 위치와 반대편 교점까지의 거리비는 완벽하게 <strong>3 : 1</strong> 대칭을 이룹니다.";
          points.push({x: k, y: 0, label: '삼중근', color: '#d35400', ratio:'start'}); points.push({x: k+3*p, y: f(k+3*p), label: '극소', color: '#3498db', ratio:'mid'}); points.push({x: k+4*p, y: 0, label: '교점', color: '#27ae60', ratio:'end'});
        } else if (this.currentPolyMode === 'quartic-w') {
          f = (x) => a * Math.pow(x-k, 2) * (Math.pow(x-k,2) - 2*p*p);
          fText = `f(x) = ${a.toFixed(1)}${kTerm}^2 \\left[ ${kTerm}^2 - 2(${(p).toFixed(1)})^2 \\right]`; this.host.querySelector('#poly-title').innerText = "사차함수 대칭 W형 (1 : √2 비율)"; 
          descText = "선대칭형 이중 접선을 가질 때, 극대 극소 간격과 외각 실근 교점 간격의 비는 <strong>1 : \\sqrt{2}</strong> 입니다.";
          points.push({x: k, y: f(k), label: '극대(축)', color: '#d35400', ratio:'start'}); points.push({x: k+p, y: f(k+p), label: '극소', color: '#3498db', ratio:'mid'}); points.push({x: k+p*Math.sqrt(2), y: f(k+p*Math.sqrt(2)), label: '교점', color: '#27ae60', ratio:'end'});
        }
      }

      if (fText !== this.lastPolyForm) {
        const polyForm = this.host.querySelector('#poly-formula');
        if (typeof katex !== 'undefined' && polyForm) katex.render(fText, polyForm, { throwOnError: false });
        else if (polyForm) polyForm.innerText = fText;
        this.lastPolyForm = fText;
      }
      const polyDesc = this.host.querySelector('#poly-desc');
      if (polyDesc) polyDesc.innerHTML = descText;

      // FIXED SCALE LOGIC
      const scaleX = (canvas.width * 0.9) / rangeW; 
      const scaleY = (canvas.height * 0.9) / rangeH; 

      const getCanvasX = (val) => centerX + (val - midFocusX) * scaleX; 
      const getCanvasY = (val) => centerY - (val - midFocusY) * scaleY; 

      ctx.strokeStyle = '#f1f1f1'; ctx.lineWidth = 1;
      let gridStep = 2; 
      for(let i = -Math.floor(rangeW); i <= Math.floor(rangeW); i+=gridStep) { 
        ctx.beginPath(); ctx.moveTo(getCanvasX(i), 0); ctx.lineTo(getCanvasX(i), canvas.height); ctx.stroke(); 
      }
      for(let i = -Math.floor(rangeH); i <= Math.floor(rangeH); i+=gridStep*5) { 
        ctx.beginPath(); ctx.moveTo(0, getCanvasY(i)); ctx.lineTo(canvas.width, getCanvasY(i)); ctx.stroke(); 
      }

      ctx.strokeStyle = '#bdc3c7'; ctx.lineWidth = 2; ctx.beginPath(); 
      ctx.moveTo(0, getCanvasY(0)); ctx.lineTo(canvas.width, getCanvasY(0)); 
      ctx.moveTo(getCanvasX(0), 0); ctx.lineTo(getCanvasX(0), canvas.height); ctx.stroke(); 

      if (lineF) { 
        ctx.beginPath(); ctx.strokeStyle = '#95a5a6'; ctx.lineWidth = 2; ctx.setLineDash([5,5]); 
        ctx.moveTo(getCanvasX(midFocusX - rangeW), getCanvasY(lineF(midFocusX - rangeW))); 
        ctx.lineTo(getCanvasX(midFocusX + rangeW), getCanvasY(lineF(midFocusX + rangeW))); 
        ctx.stroke(); ctx.setLineDash([]); 
      }

      ctx.beginPath(); ctx.strokeStyle = '#8e44ad'; ctx.lineWidth = 3.5; 
      for (let x = midFocusX - rangeW/2; x <= midFocusX + rangeW/2; x += rangeW/300) { 
        if (x === midFocusX - rangeW/2) ctx.moveTo(getCanvasX(x), getCanvasY(f(x))); 
        else ctx.lineTo(getCanvasX(x), getCanvasY(f(x))); 
      }
      ctx.stroke();

      const ratioPoints = points.filter(pt => pt.ratio);
      if (ratioPoints.length >= 3) {
        const p1 = ratioPoints.find(pt=>pt.ratio==='start'); const p2 = ratioPoints.find(pt=>pt.ratio==='mid'); const p3 = ratioPoints.find(pt=>pt.ratio==='end');
        let minPtY = Math.min(p1.y, p2.y, p3.y);
        let yDim = getCanvasY(minPtY) + 50; if(yDim > canvas.height - 30) yDim = canvas.height - 30;
        
        ctx.strokeStyle = '#e74c3c'; ctx.lineWidth = 2.5; ctx.beginPath(); 
        ctx.moveTo(getCanvasX(p1.x), yDim); ctx.lineTo(getCanvasX(p3.x), yDim); 
        [p1.x, p2.x, p3.x].forEach(x => { ctx.moveTo(getCanvasX(x), yDim-7); ctx.lineTo(getCanvasX(x), yDim+7); }); 
        ctx.stroke();
        
        ctx.fillStyle = '#e74c3c'; ctx.font = 'bold 15px Pretendard';
        let r1 = "2", r2 = "1";
        if (this.currentPolyMode === 'quartic-31') { r1 = "3"; r2 = "1"; } else if (this.currentPolyMode === 'quartic-w') { r1 = "1"; r2 = "√2"; } else if (this.currentPolyMode === 'cubic-free') { const dist1 = Math.abs(p2.x - p1.x); const dist2 = Math.abs(p3.x - p2.x); r1 = (dist1/dist2).toFixed(2); }
        ctx.fillText(r1, getCanvasX((p1.x+p2.x)/2) - 5, yDim - 12); ctx.fillText(r2, getCanvasX((p2.x+p3.x)/2) - 5, yDim - 12);
        
        ctx.strokeStyle = 'rgba(231, 76, 60, 0.4)'; ctx.setLineDash([4,3]); ctx.lineWidth = 1; 
        [p1, p2, p3].forEach(pt => { ctx.beginPath(); ctx.moveTo(getCanvasX(pt.x), getCanvasY(pt.y)); ctx.lineTo(getCanvasX(pt.x), yDim); ctx.stroke(); }); 
        ctx.setLineDash([]);
      }
      
      points.forEach(pt => { 
        ctx.beginPath(); ctx.arc(getCanvasX(pt.x), getCanvasY(pt.y), 6, 0, Math.PI*2); 
        ctx.fillStyle = pt.color; ctx.fill(); 
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.stroke(); 
        ctx.fillStyle = '#2c3e50'; ctx.font = 'bold 13px Pretendard'; 
        ctx.fillText(`${pt.label}`, getCanvasX(pt.x) + 10, getCanvasY(pt.y) - 10); 
      });
    },

    render() {
      if (!this.host) return;
      var h = '';
      h += '<style>';
      h += '  .poly-logic-container { padding: 24px; background: #ffffff; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); max-width: 800px; margin: 0 auto; font-family: "Pretendard", sans-serif; }';
      h += '  .poly-logic-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }';
      h += '  .poly-logic-header h1 { margin: 0; font-size: 2rem; color: #2c3e50; font-weight: 900; }';
      h += '  .poly-home-btn { padding: 10px 16px; background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 10px; cursor: pointer; color: #475569; font-weight: 800; transition: 0.2s; }';
      h += '  .poly-msg { background: #f3e5f5; color: #8e44ad; border: 1px solid #d2b4de; padding: 12px; border-radius: 12px; text-align: center; margin-bottom: 20px; font-weight: 800; }';
      h += '  .poly-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 15px; }';
      h += '  .poly-tab-btn { padding: 10px 4px; border: 1px solid #dfe6e9; border-radius: 10px; background: #fff; color: #34495e; font-weight: 800; font-size: 0.85rem; cursor: pointer; transition: 0.2s; text-align: center; }';
      h += '  .poly-canvas-wrap { background: #ffffff; border: 3px solid #e0e0e0; height: 380px; margin-bottom: 20px; border-radius: 16px; overflow: hidden; }';
      h += '  .poly-canvas-wrap canvas { height: 100%; width: 100%; display: block; }';
      h += '  .poly-sliders.hidden { display: none; }';
      h += '  .poly-sliders { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }';
      h += '  .poly-slider-group { background: #f8fafc; padding: 16px; border-radius: 14px; border: 1px solid #e2e8f0; }';
      h += '  .poly-slider-group label { display: block; font-weight: 800; color: #334155; margin-bottom: 12px; }';
      h += '  .poly-slider-group input { width: 100%; cursor: pointer; accent-color: #8e44ad; }';
      h += '  .poly-board { background: #2c3e50; min-height: 120px; border-radius: 16px; padding: 20px; }';
      h += '  .poly-board-title { color: #a29bfe; font-weight: 900; margin-bottom: 15px; font-size: 1.1rem; }';
      h += '  .poly-board-math { color: #ffffff; font-size: 1.2rem; font-family: "Courier New", monospace; margin-bottom: 15px; overflow-x: auto; padding: 10px 0; min-height: 40px; }';
      h += '  .poly-board-desc { color: #bdc3c7; font-size: 0.95rem; line-height: 1.6; border-top: 1px dashed #7f8c8d; padding-top: 12px; }';
      h += '</style>';
      h += '<div class="poly-logic-container">';
      h += '  <div class="poly-logic-header">';
      h += '    <h1>다항함수 해부학 &#128200;</h1>';
      h += '    <button class="poly-home-btn" onclick="window.PolyConceptApp.goHome()">&#127968; 대시보드</button>';
      h += '  </div>';
      h += '  <div class="poly-msg">수능 수학의 치트키! 흔들리지 않는 고정 좌표계로 그래프의 이동과 절대비율을 확인하세요.</div>';
      h += '  <div class="poly-tabs">';
      h += '    <button class="poly-tab-btn active" data-mode="cubic-horiz" onclick="window.PolyConceptApp.switchPoly(\'cubic-horiz\')">삼차 (평행접선)</button>';
      h += '    <button class="poly-tab-btn" data-mode="cubic-slant" onclick="window.PolyConceptApp.switchPoly(\'cubic-slant\')">삼차 (평균변화율)</button>';
      h += '    <button class="poly-tab-btn" data-mode="cubic-free" onclick="window.PolyConceptApp.switchPoly(\'cubic-free\')">삼차 (자유조작)</button>';
      h += '    <button class="poly-tab-btn" data-mode="quartic-31" onclick="window.PolyConceptApp.switchPoly(\'quartic-31\')">사차 (삼중근)</button>';
      h += '    <button class="poly-tab-btn" data-mode="quartic-w" onclick="window.PolyConceptApp.switchPoly(\'quartic-w\')">사차 (대칭 W형)</button>';
      h += '    <button class="poly-tab-btn" data-mode="quartic-free" onclick="window.PolyConceptApp.switchPoly(\'quartic-free\')">사차 (자유조작)</button>';
      h += '  </div>';
      h += '  <div class="poly-canvas-wrap">';
      h += '    <canvas id="canvas-poly" width="700" height="400"></canvas>';
      h += '  </div>';
      h += '  <div class="poly-sliders" id="poly-sliders-ratio">';
      h += '    <div class="poly-slider-group"><label>최고차항 계수(a): <span id="val-poly-a">1.0</span></label><input type="range" id="slider-poly-a" min="-3.0" max="3.0" step="0.2" value="1.0" oninput="window.PolyConceptApp.updatePoly()"></div>';

      this.host.innerHTML = h;
      
      setTimeout(() => this.switchPoly('cubic-horiz'), 50);

  };

  window.PolyConceptApp = PolyConceptApp;

  function registerMyApp() {
    if (typeof window.MathLabGames !== 'undefined' && typeof window.MathLabGames.register === 'function') {
      window.MathLabGames.register({
        id: 'poly-concept',
        title: '다항함수 해부학',
        icon: '📈',
        appType: 'concept',
        topApp: '수학 개념',
        sourceType: 'new',
        mount(container) { PolyConceptApp.mount(container); },
        reset() { /* 필요 시 초기화 로직 추가 */ },
        destroy() { PolyConceptApp.destroy(); },
        goHome() { PolyConceptApp.goHome(); }
      });
    }
  }

  registerMyApp();
  window.addEventListener('DOMContentLoaded', registerMyApp);


})();
