<style>
  /* ==========================================================================
     Gen-3 수학 실험실 표준 스타일 - 원의 방정식 타겟 슈터 (Circle Shooter)
     모던 슬레이트 & 다크 네이비 프리미엄 테마 (고대비 형광색 금지, 절제된 하모니)
     ========================================================================== */
  .game-circle-shooter {
    --bg-primary: #0f172a;
    --bg-surface: #1e293b;
    --bg-card: #202e48;
    --accent-color: #38bdf8;
    --accent-glow: rgba(56, 189, 248, 0.35);
    --success-color: #22c55e;
    --warning-color: #f59e0b;
    --danger-color: #ef4444;
    --text-main: #f8fafc;
    --text-sub: #cbd5e1;
    --border-color: #3b82f6;

    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #172554 100%);
    color: var(--text-main);
    min-height: 100%;
    width: 100%;
    padding: 24px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
    user-select: none;
    -webkit-user-select: none;
    border-radius: 24px;
    border: 3px solid #3b82f6;
    box-shadow: inset 0 0 40px rgba(0,0,0,0.6), 0 16px 36px rgba(0,0,0,0.5);
    position: relative;
  }

  .game-circle-shooter * {
    box-sizing: border-box;
  }

  /* 상단 한 줄 정돈 컴팩트 헤더 */
  .game-circle-shooter .app-header {
    width: 100%;
    max-width: 1050px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #0f172a;
    padding: 16px 24px;
    border-radius: 20px;
    border: 2px solid #3b82f6;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 14px;
  }

  .game-circle-shooter .title-area {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .game-circle-shooter .app-title {
    font-size: clamp(1.4rem, 2.3vw, 2.0rem);
    font-weight: 900;
    margin: 0;
    color: #ffffff !important;
    text-shadow: 0 0 15px rgba(255, 255, 255, 0.7);
  }

  .game-circle-shooter .app-badge {
    background: #1e1b4b;
    color: #fef08a;
    font-size: 0.9rem;
    font-weight: 800;
    padding: 6px 12px;
    border-radius: 20px;
    border: 1px solid #f59e0b;
  }

  /* 상단 컨트롤 바 (한 줄 정렬 & 반응형 균등 배열) */
  .game-circle-shooter .stats-bar {
    display: flex;
    gap: 6px;
    font-weight: 800;
    font-size: 0.86rem;
    flex-wrap: wrap;
    align-items: center;
    justify-content: flex-end;
    flex: 1 1 auto;
  }

  .game-circle-shooter .stat-badge,
  .game-circle-shooter .btn-howto,
  .game-circle-shooter .btn-action {
    height: 36px;
    padding: 0 11px;
    border-radius: 12px;
    font-size: 0.86rem;
    font-weight: 900;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    white-space: nowrap;
    flex: 0 1 auto;
    transition: all 0.2s;
  }
  .game-circle-shooter .stat-badge.score { color: #fef08a; border-color: #f59e0b; background: #271c14; }
  .game-circle-shooter .stat-badge.round { color: #ffffff; border-color: #38bdf8; background: #0f172a; }
  .game-circle-shooter .stat-badge.shots { color: #86efac; border-color: #22c55e; background: #0a2316; }
  .game-circle-shooter .stat-badge.timer { color: #fca5a5; border-color: #ef4444; background: #451a1a; }

  .game-circle-shooter .btn-howto {
    background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
    color: #ffffff !important;
    border: 2px solid #93c5fd;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(59, 130, 246, 0.4);
  }
  .game-circle-shooter .btn-howto:hover {
    transform: translateY(-2px);
    background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  }

  .game-circle-shooter .btn-action {
    background: #1e293b;
    color: #ffffff !important;
    border: 2px solid #60a5fa;
    cursor: pointer;
  }
  .game-circle-shooter .btn-action:hover {
    background: #334155;
    border-color: #93c5fd;
    transform: translateY(-2px);
  }

  .game-circle-shooter .btn-action.home {
    background: rgba(244, 63, 94, 0.18);
    color: #fda4af !important;
    border-color: rgba(244, 63, 94, 0.45);
  }
  .game-circle-shooter .btn-action.home:hover {
    background: rgba(244, 63, 94, 0.35);
    color: #ffffff !important;
  }

  .game-circle-shooter .btn-action.reset {
    background: #0ea5e9;
    border-color: #38bdf8;
  }
  .game-circle-shooter .btn-action.reset:hover {
    background: #0284c7;
  }

  /* 반응형 화면 폭 축소 시 모든 버튼 가로 폭 균등 배열 및 자동 줄바꿈 최적화 */
  @media (max-width: 960px) {
    .game-circle-shooter .app-header {
      flex-direction: column;
      align-items: stretch;
      gap: 14px;
      padding: 16px;
    }
    .game-circle-shooter .title-area {
      justify-content: center;
    }
    .game-circle-shooter .stats-bar {
      justify-content: center;
      gap: 8px;
    }
    .game-circle-shooter .stat-badge,
    .game-circle-shooter .btn-howto,
    .game-circle-shooter .btn-action {
      flex: 1 1 118px;
      height: 38px;
    }
  }

  .game-circle-shooter .main-container {
    width: 100%;
    max-width: 1050px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .game-circle-shooter .diff-bar {
    display: flex;
    justify-content: center;
    gap: 10px;
    background: #090d16;
    padding: 8px;
    border-radius: 16px;
    border: 2px solid #3b82f6;
    flex-wrap: wrap;
  }

  .game-circle-shooter .diff-btn {
    flex: 1;
    min-width: 160px;
    padding: 11px 14px;
    border-radius: 12px;
    background: transparent;
    color: #cbd5e1;
    border: none;
    font-weight: 900;
    font-size: 0.95rem;
    cursor: pointer;
    transition: all 0.2s;
  }

  .game-circle-shooter .diff-btn.active {
    background: #3b82f6;
    color: #ffffff !important;
    box-shadow: 0 4px 10px rgba(0,0,0,0.5);
  }

  /* 수식 및 상태 피드백 배너 */
  .game-circle-shooter .formula-banner {
    background: radial-gradient(circle at center, #1e1b4b 0%, #0f172a 80%);
    border: 3px solid #3b82f6;
    border-radius: 20px;
    padding: 18px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.7);
  }

  .game-circle-shooter .formula-title {
    font-size: 14px;
    color: #93c5fd;
    font-weight: 800;
    margin: 0;
  }

  .game-circle-shooter .formula-display {
    font-size: clamp(1.2rem, 2.5vw, 1.8rem);
    font-weight: 900;
    color: #fef08a;
    margin: 0;
    letter-spacing: 0.5px;
    text-shadow: 0 0 12px rgba(254, 240, 138, 0.45);
  }

  /* 워크스페이스 (좌: 좌표 지도, 우: 계수 조절 바 & 상태) */
  .game-circle-shooter .workspace {
    display: grid;
    grid-template-columns: 1.35fr 1fr;
    gap: 20px;
  }

  @media (max-width: 860px) {
    .game-circle-shooter .workspace {
      grid-template-columns: 1fr;
    }
  }

  /* 좌측 좌표 지도 카드 */
  .game-circle-shooter .map-card {
    background: #1e293b;
    border: 2px solid #3b82f6;
    border-radius: 20px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
  }

  .game-circle-shooter .map-header {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }

  .game-circle-shooter .map-title {
    font-size: 16px;
    font-weight: 800;
    color: #ffffff;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .game-circle-shooter .map-svg-wrap {
    width: 100%;
    aspect-ratio: 1 / 1;
    max-height: 480px;
    background: #0a0f1d;
    border: 2px solid #475569;
    border-radius: 14px;
    position: relative;
    overflow: hidden;
  }

  .game-circle-shooter svg {
    width: 100%;
    height: 100%;
  }

  /* 우측 제어 패널 및 슬라이더 카드 */
  .game-circle-shooter .panel-card {
    background: #1e293b;
    border: 2px solid #3b82f6;
    border-radius: 20px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .game-circle-shooter .control-section {
    background: #0f172a;
    border: 2px solid #475569;
    border-radius: 16px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .game-circle-shooter .control-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .game-circle-shooter .control-title {
    font-size: 15px;
    font-weight: 800;
    color: #38bdf8;
    margin: 0;
  }

  .game-circle-shooter .snap-toggle-btn {
    background: #1e293b;
    color: #fef08a;
    border: 1px solid #f59e0b;
    padding: 4px 10px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 800;
    cursor: pointer;
    transition: all 0.2s;
  }
  .game-circle-shooter .snap-toggle-btn:hover {
    background: #334155;
  }

  .game-circle-shooter .slider-row {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .game-circle-shooter .slider-label-area {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
    font-weight: 800;
  }

  .game-circle-shooter .slider-name {
    color: #e2e8f0;
  }

  .game-circle-shooter .slider-val {
    color: #38bdf8;
    font-size: 16px;
    font-weight: 900;
    background: #1e293b;
    padding: 2px 10px;
    border-radius: 8px;
    border: 1px solid #3b82f6;
  }

  .game-circle-shooter input[type="range"] {
    width: 100%;
    height: 8px;
    background: #334155;
    border-radius: 4px;
    outline: none;
    -webkit-appearance: none;
    cursor: pointer;
  }

  .game-circle-shooter input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 22px;
    height: 22px;
    background: #38bdf8;
    border: 3px solid #ffffff;
    border-radius: 50%;
    cursor: pointer;
    box-shadow: 0 0 10px rgba(56, 189, 248, 0.7);
    transition: transform 0.15s;
  }
  .game-circle-shooter input[type="range"]::-webkit-slider-thumb:hover {
    transform: scale(1.15);
  }

  .game-circle-shooter .btn-fire {
    width: 100%;
    background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
    border: 2px solid #fef08a;
    color: #ffffff;
    font-weight: 900;
    padding: 14px;
    font-size: 18px;
    border-radius: 14px;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(245, 158, 11, 0.45);
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .game-circle-shooter .btn-fire:hover {
    transform: translateY(-2px);
    background: linear-gradient(135deg, #d97706 0%, #b45309 100%);
  }

  /* 타겟 체크 이력 / 대수 검증 리스트 */
  .game-circle-shooter .target-list-section {
    background: #0f172a;
    border: 2px solid #475569;
    border-radius: 16px;
    padding: 14px;
    flex-grow: 1;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-height: 180px;
    max-height: 230px;
    overflow-y: auto;
  }

  .game-circle-shooter .target-list-title {
    font-size: 14px;
    font-weight: 800;
    color: #fef08a;
    margin: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .game-circle-shooter .target-item {
    background: #1e293b;
    border-left: 4px solid #3b82f6;
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 13.5px;
    line-height: 1.4;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .game-circle-shooter .target-item.hit {
    border-color: #22c55e;
    background: #0a2316;
  }
  .game-circle-shooter .target-item.forbidden {
    border-color: #ef4444;
    background: #381313;
  }

  /* 모달 공통 스타일 */
  .game-circle-shooter .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.88);
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }

  .game-circle-shooter .modal-overlay.active {
    opacity: 1;
    pointer-events: auto;
  }

  .game-circle-shooter .modal-card {
    background: #0f172a;
    border: 3px solid #3b82f6;
    border-radius: 24px;
    padding: 28px;
    width: 90%;
    max-width: 540px;
    box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8);
    text-align: center;
    transform: scale(0.9);
    transition: transform 0.3s ease;
    color: #ffffff;
  }

  .game-circle-shooter .modal-overlay.active .modal-card {
    transform: scale(1);
  }

  .game-circle-shooter .modal-title {
    font-size: 24px;
    font-weight: 900;
    margin: 0 0 16px 0;
    color: #ffffff;
    text-shadow: 0 0 15px rgba(255,255,255,0.7);
  }

  .game-circle-shooter .modal-desc {
    font-size: 15px;
    color: #cbd5e1;
    line-height: 1.6;
    margin-bottom: 24px;
    text-align: left;
    font-weight: 700;
  }

  .game-circle-shooter .hall-table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 20px;
    font-size: 14px;
  }

  .game-circle-shooter .hall-table th,
  .game-circle-shooter .hall-table td {
    padding: 12px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    text-align: center;
  }

  .game-circle-shooter .hall-table th {
    color: #38bdf8;
    font-weight: 900;
  }
</style>

<script>
(function() {
  const BOARD_KEY = 'board-circle-shooter';
  const GAME_NAME = '원의 방정식 타겟 슈터';

  const escapeHTML = (str) => {
    if (!str) return '';
    return String(str).replace(/[&<>"']/g, function(match) {
      const escape = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
      return escape[match];
    });
  };

  const state = {
    difficulty: 'easy',
    round: 1,
    maxRound: 5,
    score: 0,
    shotsLeft: 5,
    timer: 90,
    timerId: null,
    a: 0,
    b: 0,
    r: 5,
    snapStep: 1.0,
    targets: [],
    forbidden: [],
    roundCleared: false
  };

  // 명예의 전당 로드
  function loadLeaderboard() {
    const tbody = document.getElementById('cs-hall-tbody');
    if (!tbody) return;
    tbody.innerHTML = '<tr><td colspan="4" style="padding:20px; color:#94a3b8;">랭킹 정보를 불러오는 중...</td></tr>';

    const renderRanks = (list) => {
      if (!tbody) return;
      tbody.innerHTML = '';
      if (!list || list.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" style="padding:20px; color:#64748b;">아직 명예의 전당 기록이 없습니다. 첫 번째 주인공이 되어보세요!</td></tr>';
        return;
      }
      list.slice(0, 10).forEach((item, idx) => {
        const badge = idx === 0 ? '🥇 1위' : (idx === 1 ? '🥈 2위' : (idx === 2 ? '🥉 3위' : `${idx+1}위`));
        const nick = item.nickname || item.name || '원의마스터';
        const sc = item.score || 0;
        let dt = item.difficulty || item.date || '기록';
        try { if (item.date) dt = new Date(item.date).toLocaleDateString('ko-KR', {month:'short', day:'numeric'}); } catch(e){}
        tbody.innerHTML += `
          <tr style="border-bottom:1px solid rgba(255,255,255,0.08);">
            <td style="padding:12px; font-weight:bold; color:#fbbf24;">${badge}</td>
            <td style="padding:12px; font-weight:800; color:#ffffff;">${escapeHTML(nick)}</td>
            <td style="padding:12px; font-weight:900; color:#38bdf8;">${sc}점</td>
            <td style="padding:12px; color:#94a3b8; font-size:12px;">${escapeHTML(dt)}</td>
          </tr>
        `;
      });
    };

    if (typeof window.getRankingList === 'function') {
      try { window.getRankingList(GAME_NAME, BOARD_KEY, renderRanks); return; } catch(e){}
    } else if (typeof google !== 'undefined' && google.script && google.script.run && typeof google.script.run.getGameScores === 'function') {
      try {
        const sheetId = (typeof getLeaderboardSheetId === 'function') ? getLeaderboardSheetId() : '';
        google.script.run.withSuccessHandler(renderRanks).withFailureHandler(() => {
          renderRanks(JSON.parse(localStorage.getItem(`rank_${BOARD_KEY}`) || '[]'));
        }).getGameScores(sheetId, GAME_NAME);
        return;
      } catch(e){}
    }
    renderRanks(JSON.parse(localStorage.getItem(`rank_${BOARD_KEY}`) || '[]'));
  }

  // 사용자 직접 입력 명예의 전당 등록 모달
  function showInlineRankingModal(score, diffName) {
    document.getElementById('mathlab-inline-ranking-modal')?.remove();
    const modalHtml = `
      <div id="mathlab-inline-ranking-modal" style="position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(15,23,42,0.88); backdrop-filter:blur(8px); display:flex; align-items:center; justify-content:center; z-index:999999; padding:20px; box-sizing:border-box; font-family:'Pretendard',sans-serif;">
        <div style="background:#0f172a; border-radius:26px; padding:30px 26px; max-width:420px; width:100%; box-shadow:0 20px 40px rgba(0,0,0,0.8); text-align:center; border:4px solid #3b82f6; color:#ffffff;">
          <div style="font-size:46px; margin-bottom:10px;">🏆</div>
          <h2 style="margin:0 0 8px; font-size:26px; font-weight:900; color:#ffffff !important;">명예의 전당 등록</h2>
          <p style="margin:0 0 20px; font-size:15px; color:#fef08a !important; font-weight:800;">5라운드 탐험 완료! 최고 점수를 달성했습니다.<br>당신의 이름을 남겨주세요!</p>
          <div style="background:#1e1b4b; border:2px solid #3b82f6; border-radius:18px; padding:16px; margin-bottom:20px;">
            <div style="font-size:14px; color:#e0e7ff; font-weight:800; margin-bottom:4px;">최종 탐험 점수</div>
            <div style="font-size:36px; font-weight:900; color:#fbbf24;">${score} <span style="font-size:20px;">점</span></div>
          </div>
          <input type="text" id="inline-rank-nickname" placeholder="닉네임 입력 (예: 원의마스터)" maxlength="10" style="width:100%; padding:14px 16px; font-size:16px; font-weight:800; border:2px solid #60a5fa; background:#1e293b; color:#ffffff; border-radius:14px; outline:none; text-align:center; margin-bottom:20px; box-sizing:border-box;">
          <div style="display:flex; gap:10px;">
            <button id="inline-rank-cancel" style="flex:1; padding:14px; border-radius:14px; font-size:15px; font-weight:800; background:#1e293b; color:#ffffff; border:1px solid #60a5fa; cursor:pointer;">건너뛰기</button>
            <button id="inline-rank-submit" style="flex:2; padding:14px; border-radius:14px; font-size:15px; font-weight:900; background:linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); color:#ffffff !important; border:none; cursor:pointer; box-shadow:0 4px 10px rgba(59,130,246,0.5);">🚀 등록하기</button>
          </div>
        </div>
      </div>
    `;
    document.body.insertAdjacentHTML('beforeend', modalHtml);
    const inputEl = document.getElementById('inline-rank-nickname');
    if (inputEl) inputEl.focus();

    const closeAndOpenHall = () => {
      document.getElementById('mathlab-inline-ranking-modal')?.remove();
      loadLeaderboard();
      document.getElementById('cs-hall-modal')?.classList.add('active');
    };

    document.getElementById('inline-rank-cancel')?.addEventListener('click', closeAndOpenHall);

    const doSubmit = () => {
      let nickname = inputEl?.value.trim() || '원의마스터';
      if (typeof window.submitRanking === 'function') {
        try { window.submitRanking(GAME_NAME, score, true, nickname, BOARD_KEY); } catch(e){}
      } else if (typeof google !== 'undefined' && google.script && google.script.run && typeof google.script.run.saveGameScore === 'function') {
        try {

          google.script.run.withSuccessHandler(closeAndOpenHall).saveGameScore(sheetId, GAME_NAME, nickname, score, true, meta);
        } catch(e){}
      }

      let ranks = JSON.parse(localStorage.getItem(`rank_${BOARD_KEY}`) || '[]');
      ranks.push({ nickname: nickname, score: score, difficulty: diffName, date: new Date().toISOString() });
      ranks.sort((a, b) => (b.score || 0) - (a.score || 0));
      localStorage.setItem(`rank_${BOARD_KEY}`, JSON.stringify(ranks.slice(0, 50)));
      closeAndOpenHall();

  const CircleShooter = {

        this.container.appendChild(toast);
      }
      toast.style.background = isError ? '#ef4444' : '#10b981';
      toast.style.color = isError ? '#ffffff' : '#0f172a';
      toast.textContent = msg;
      
      void toast.offsetWidth;
      toast.style.opacity = '1';
      toast.style.top = '20px';
      
      if (this._toastTimer) clearTimeout(this._toastTimer);
      this._toastTimer = setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.top = '0px';
      }, 3000);

    mount(container, context = {}) {

      if (footerEl && target.compareDocumentPosition(footerEl) & Node.DOCUMENT_POSITION_PRECEDING) {

          <div class="modal-overlay" id="cs-howto-modal">
            <div class="modal-card">
              <h2 class="modal-title">⭕ 원의 방정식 타겟 슈터 방법</h2>
              <div class="modal-desc">
                <p><strong>📍 원의 표준 방정식</strong><br>
                좌표평면에서 점 $(a, b)$를 중심으로 하고 반지름이 $r$인 원의 방정식은 다음과 같습니다:<br>
                <span style="display:block; text-align:center; color:#fef08a; font-size:18px; margin:8px 0;">$(x - a)^2 + (y - b)^2 = r^2$</span></p>
                <ul style="padding-left: 20px; margin: 10px 0;">
                  <li><strong>계수 조작:</strong> $a, b, r$ 슬라이더를 움직여 원의 위치와 크기를 실시간으로 조절합니다.</li>
                  <li><strong>포획 판정:</strong> 타겟 $(x_i, y_i)$가 원의 방정식 $(x_i - a)^2 + (y_i - b)^2 = r^2$을 만족(허용 오차 내)하면 발사 시 포획됩니다!</li>
                  <li><strong>콤보 보너스:</strong> 여러 개의 타겟을 한 원 위에 올려 동시에 포획하면 보너스 점수가 부여됩니다.</li>

          <div class="modal-overlay" id="cs-hall-modal">

      this.bindEvents();

    },

    bindEvents() {
      document.querySelectorAll('.game-circle-shooter .diff-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          document.querySelectorAll('.game-circle-shooter .diff-btn').forEach(b => b.classList.remove('active'));
          e.target.classList.add('active');
          state.difficulty = e.target.getAttribute('data-diff');
          this.startNewGame();
        });
      });

      document.getElementById('cs-snap-toggle')?.addEventListener('click', () => {
        if (state.snapStep === 1.0) {
          state.snapStep = 0.5;
          document.getElementById('cs-snap-toggle').textContent = '0.5 스냅 적용 중 🔄';
        } else {
          state.snapStep = 1.0;
          document.getElementById('cs-snap-toggle').textContent = '정수 스냅 (1.0) 🔄';
        }
        ['cs-slider-a', 'cs-slider-b', 'cs-slider-r'].forEach(id => {
          const el = document.getElementById(id);
          if (el) el.step = state.snapStep;
        });
        this.onSliderChange();
      });

      ['cs-slider-a', 'cs-slider-b', 'cs-slider-r'].forEach(id => {
        const el = document.getElementById(id);
        if (el) {
          el.addEventListener('input', () => this.onSliderChange());
          el.addEventListener('change', () => this.onSliderChange());
        }
      });

      document.getElementById('cs-btn-fire')?.addEventListener('click', () => this.fireShot());

      document.getElementById('cs-btn-howto')?.addEventListener('click', () => {
        document.getElementById('cs-howto-modal')?.classList.add('active');
      });
      document.getElementById('cs-howto-close')?.addEventListener('click', () => {
        document.getElementById('cs-howto-modal')?.classList.remove('active');
      });
      document.getElementById('cs-btn-hall')?.addEventListener('click', () => {
        loadLeaderboard();
        document.getElementById('cs-hall-modal')?.classList.add('active');
      });
      document.getElementById('cs-hall-close')?.addEventListener('click', () => {
        document.getElementById('cs-hall-modal')?.classList.remove('active');
      });
    },

    onSliderChange() {
      state.a = parseFloat(document.getElementById('cs-slider-a')?.value || 0);
      state.b = parseFloat(document.getElementById('cs-slider-b')?.value || 0);
      state.r = parseFloat(document.getElementById('cs-slider-r')?.value || 5);

      if (state.difficulty === 'easy') {
        state.a = 0;
        state.b = 0;
      }

      document.getElementById('cs-val-a').textContent = state.a;
      document.getElementById('cs-val-b').textContent = state.b;
      document.getElementById('cs-val-r').textContent = state.r;

      this.updateFormulaUI();
      this.renderMap(false);
      this.updateTargetListUI();
    },

    updateFormulaUI() {
      const el = document.getElementById('cs-formula-text');
      if (!el) return;

      const formatPart = (varName, val) => {
        if (val === 0) return `${varName}²`;
        if (val > 0) return `(${varName} - ${val})²`;
        return `(${varName} + ${Math.abs(val)})²`;
      };

      const lhs = `${formatPart('x', state.a)} + ${formatPart('y', state.b)}`;
      const rhs = `${state.r}² <span style="font-size:16px; color:#93c5fd;">(= ${state.r * state.r})</span>`;
      el.innerHTML = `${lhs} = ${rhs}`;
    },

    startNewGame() {
      state.round = 1;
      state.score = 0;
      this.setupRound();
    },

    setupRound() {
      state.targets = [];
      state.forbidden = [];
      state.roundCleared = false;
      if (state.timerId) clearInterval(state.timerId);

      const rowA = document.getElementById('cs-row-a');
      const rowB = document.getElementById('cs-row-b');
      const timerBox = document.getElementById('cs-timer-box');

      if (state.difficulty === 'easy') {
        if (rowA) rowA.style.display = 'none';
        if (rowB) rowB.style.display = 'none';
        if (timerBox) timerBox.style.display = 'none';
        state.shotsLeft = 6;
        state.a = 0;
        state.b = 0;
        document.getElementById('cs-slider-a').value = 0;
        document.getElementById('cs-slider-b').value = 0;

        const pythPairs = [
          { r: 5, pts: [[3,4], [-3,4], [4,-3], [0,5], [-5,0]] },
          { r: 4, pts: [[0,4], [4,0], [0,-4], [-4,0]] },
          { r: 3, pts: [[0,3], [3,0], [0,-3], [-3,0]] },
          { r: 6, pts: [[0,6], [6,0], [0,-6], [-6,0]] }
        ];
        const chosen = pythPairs[Math.floor(Math.random() * pythPairs.length)];
        const targetCount = Math.floor(Math.random() * 2) + 1;
        const shuffled = chosen.pts.sort(() => Math.random() - 0.5);
        for (let i = 0; i < targetCount; i++) {
          state.targets.push({ id: i + 1, x: shuffled[i][0], y: shuffled[i][1], captured: false });
        }
      } else if (state.difficulty === 'normal') {
        if (rowA) rowA.style.display = 'flex';
        if (rowB) rowB.style.display = 'flex';
        if (timerBox) timerBox.style.display = 'none';
        state.shotsLeft = 5;

        const ca = Math.floor(Math.random() * 9) - 4;
        const cb = Math.floor(Math.random() * 9) - 4;
        const pyth = [
          { r: 5, offsets: [[3,4], [-3,4], [4,-3], [-4,-3], [0,5], [5,0]] },
          { r: 3, offsets: [[0,3], [3,0], [0,-3], [-3,0]] },
          { r: 4, offsets: [[0,4], [4,0], [0,-4], [-4,0]] }
        ][Math.floor(Math.random() * 3)];

        const shuffled = pyth.offsets.sort(() => Math.random() - 0.5);
        const count = 2;
        for (let i = 0; i < count; i++) {
          const tx = ca + shuffled[i][0];
          const ty = cb + shuffled[i][1];
          if (tx >= -9 && tx <= 9 && ty >= -9 && ty <= 9) {
            state.targets.push({ id: i + 1, x: tx, y: ty, captured: false });
          }
        }
        if (state.targets.length < 1) state.targets.push({ id: 1, x: ca + pyth.r, y: cb, captured: false });
      } else {
        if (rowA) rowA.style.display = 'flex';
        if (rowB) rowB.style.display = 'flex';
        if (timerBox) timerBox.style.display = 'inline-flex';
        state.shotsLeft = 4;
        state.timer = 90;
        document.getElementById('cs-timer').textContent = '90s';
        state.timerId = setInterval(() => {
          state.timer--;
          const el = document.getElementById('cs-timer');
          if (el) el.textContent = `${state.timer}s`;
          if (state.timer <= 0) {
            clearInterval(state.timerId);
            this.showToast('⏱️ 제한 시간이 초과되었습니다! 다음 라운드로 진행합니다.', true);
            this.nextRound();
          }
        }, 1000);

        const ca = Math.floor(Math.random() * 9) - 4;
        const cb = Math.floor(Math.random() * 9) - 4;
        const pyth = { r: 5, offsets: [[3,4], [-3,4], [4,-3], [-4,-3], [0,5], [-5,0]] };
        const shuffled = pyth.offsets.sort(() => Math.random() - 0.5);
        for (let i = 0; i < 2; i++) {
          state.targets.push({ id: i + 1, x: ca + shuffled[i][0], y: cb + shuffled[i][1], captured: false });
        }
        const fx = ca + shuffled[2][0];
        const fy = cb + shuffled[2][1];
        state.forbidden.push({ id: 'F1', x: fx, y: fy });
      }

      this.updateStatsUI();
      this.renderMap(true);
      this.onSliderChange();
    },

    updateStatsUI() {
      const rEl = document.getElementById('cs-round');
      if (rEl) rEl.textContent = `${state.round} / ${state.maxRound}`;
      const sEl = document.getElementById('cs-shots');
      if (sEl) sEl.textContent = `${state.shotsLeft}회`;
      const scEl = document.getElementById('cs-score');
      if (scEl) scEl.textContent = state.score;
    },

    renderMap(fullRebuild = false) {
      const svg = document.getElementById('cs-map-svg');
      if (!svg) return;

      const scale = 22;
      const coordToSvg = (x, y) => ({ sx: x * scale, sy: -y * scale });
      const centerPt = coordToSvg(state.a, state.b);
      const svgR = state.r * scale;

      let areaEl = document.getElementById('cs-radar-area');
      let outlineEl = document.getElementById('cs-radar-outline');
      let centerEl = document.getElementById('cs-radar-center');
      let labelEl = document.getElementById('cs-radar-label');

      if (!fullRebuild && areaEl && outlineEl && centerEl && labelEl) {
        areaEl.setAttribute('cx', centerPt.sx);
        areaEl.setAttribute('cy', centerPt.sy);
        areaEl.setAttribute('r', svgR);

        outlineEl.setAttribute('cx', centerPt.sx);
        outlineEl.setAttribute('cy', centerPt.sy);
        outlineEl.setAttribute('r', svgR);

        centerEl.setAttribute('cx', centerPt.sx);
        centerEl.setAttribute('cy', centerPt.sy);

        labelEl.setAttribute('x', centerPt.sx);
        labelEl.setAttribute('y', centerPt.sy - 8);
        labelEl.textContent = `(${state.a}, ${state.b})`;
        return;
      }

      let html = '';
      for (let i = -10; i <= 10; i++) {
        const pos = i * scale;
        const isAxis = i === 0;
        html += `<line x1="${pos}" y1="-230" x2="${pos}" y2="230" stroke="${isAxis ? '#38bdf8' : 'rgba(255,255,255,0.08)'}" stroke-width="${isAxis ? 3 : 1}" />`;
        html += `<line x1="-230" y1="${pos}" x2="230" y2="${pos}" stroke="${isAxis ? '#38bdf8' : 'rgba(255,255,255,0.08)'}" stroke-width="${isAxis ? 3 : 1}" />`;
        if (i !== 0 && i % 2 === 0) {
          html += `<text x="${pos}" y="14" fill="#64748b" font-size="10" font-weight="bold" text-anchor="middle">${i}</text>`;
          html += `<text x="12" y="${-pos + 4}" fill="#64748b" font-size="10" font-weight="bold" text-anchor="middle">${i}</text>`;
        }
      }
      html += `<text x="-12" y="14" fill="#38bdf8" font-size="12" font-weight="900">O</text>`;

      state.targets.forEach(t => {
        if (t.captured) return;
        const pt = coordToSvg(t.x, t.y);
        html += `
          <circle cx="${pt.sx}" cy="${pt.sy}" r="12" fill="rgba(34,197,94,0.25)" stroke="#22c55e" stroke-width="2.5">
            <animate attributeName="r" values="10;14;10" dur="1.5s" repeatCount="indefinite" />
          </circle>
          <circle cx="${pt.sx}" cy="${pt.sy}" r="5" fill="#fef08a" />
          <text x="${pt.sx}" y="${pt.sy - 16}" fill="#fef08a" font-size="12" font-weight="900" text-anchor="middle">🎯 T${t.id} (${t.x}, ${t.y})</text>
        `;
      });

      state.forbidden.forEach(f => {
        const pt = coordToSvg(f.x, f.y);
        html += `
          <circle cx="${pt.sx}" cy="${pt.sy}" r="13" fill="rgba(239,68,68,0.3)" stroke="#ef4444" stroke-width="2.5" />
          <text x="${pt.sx}" y="${pt.sy + 4}" fill="#ffffff" font-size="14" font-weight="900" text-anchor="middle">🚫</text>
          <text x="${pt.sx}" y="${pt.sy - 16}" fill="#fca5a5" font-size="11" font-weight="800" text-anchor="middle">금지 (${f.x}, ${f.y})</text>
        `;
      });

      html += `
        <circle id="cs-radar-area" cx="${centerPt.sx}" cy="${centerPt.sy}" r="${svgR}" fill="rgba(56, 189, 248, 0.15)" />
        <circle id="cs-radar-outline" cx="${centerPt.sx}" cy="${centerPt.sy}" r="${svgR}" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6,4" />
        <circle id="cs-radar-center" cx="${centerPt.sx}" cy="${centerPt.sy}" r="4" fill="#38bdf8" />
        <text id="cs-radar-label" x="${centerPt.sx}" y="${centerPt.sy - 8}" fill="#93c5fd" font-size="12" font-weight="800" text-anchor="middle">(${state.a}, ${state.b})</text>
      `;

      svg.innerHTML = html;
    },

    updateTargetListUI() {
      const container = document.getElementById('cs-target-list');
      if (!container) return;
      let html = '';

      state.targets.forEach(t => {
        if (t.captured) {
          html += `
            <div class="target-item hit">
              <strong style="color:#86efac;">🎯 타겟 T${t.id} (${t.x}, ${t.y})</strong>
              <span style="font-weight:900; color:#fef08a;">✨ 포획 완료 (+10점)</span>
            </div>
          `;
          return;
        }

        const distSq = (t.x - state.a) ** 2 + (t.y - state.b) ** 2;
        const dist = Math.sqrt(distSq);
        const diff = Math.abs(dist - state.r);
        const isHit = diff <= 0.35;

        html += `
          <div class="target-item ${isHit ? 'hit' : ''}">
            <strong style="color:#ffffff;">🎯 T${t.id} (${t.x}, ${t.y})</strong>
            <span style="font-weight:800; color:${isHit ? '#86efac' : '#cbd5e1'};">
              중심 거리: ${dist.toFixed(2)} / 목표 r=${state.r} ${isHit ? '✨ [조준 일치! 발사하세요]' : `(오차 ${diff.toFixed(2)})`}
            </span>
          </div>
        `;
      });

      state.forbidden.forEach(f => {
        const dist = Math.sqrt((f.x - state.a) ** 2 + (f.y - state.b) ** 2);
        const diff = Math.abs(dist - state.r);
        const isHit = diff <= 0.35;
        html += `
          <div class="target-item forbidden">
            <strong style="color:#fca5a5;">🚫 금지 타겟 (${f.x}, ${f.y})</strong>
            <span style="font-weight:800; color:${isHit ? '#ef4444' : '#cbd5e1'};">
              ${isHit ? '⚠️ [경고: 포획 시 -10점 감점!]' : `안전 거리 확보됨`}
            </span>
          </div>
        `;
      });

      container.innerHTML = html;
    },

    fireShot() {
      if (state.roundCleared || state.shotsLeft <= 0) return;
      state.shotsLeft--;

      let capturedCount = 0;
      state.targets.forEach(t => {
        if (t.captured) return;
        const dist = Math.sqrt((t.x - state.a) ** 2 + (t.y - state.b) ** 2);
        if (Math.abs(dist - state.r) <= 0.35) {
          t.captured = true;
          capturedCount++;
        }
      });

      let forbiddenHit = false;
      state.forbidden.forEach(f => {
        const dist = Math.sqrt((f.x - state.a) ** 2 + (f.y - state.b) ** 2);
        if (Math.abs(dist - state.r) <= 0.35) {
          forbiddenHit = true;
        }
      });

      if (capturedCount > 0) {
        let pts = capturedCount * 10;
        if (capturedCount === 2) pts += 5;
        if (capturedCount >= 3) pts += 15;
        if (forbiddenHit) pts -= 10;

        state.score += pts;
        this.updateStatsUI();
        this.renderMap(true);
        this.updateTargetListUI();

        const allDone = state.targets.every(t => t.captured);
        if (allDone) {
          state.roundCleared = true;
          const status = document.getElementById('cs-map-status');
          if (status) status.textContent = `🎉 라운드 ${state.round} 완벽 클리어! (+${pts}점획득)`;
          this.showToast(`🎉 라운드 완벽 클리어! (+${pts}점)`);
          setTimeout(() => this.nextRound(), 1200);
          return;
        } else {
          this.showToast(`✨ 부분 명중! (+${pts}점)`);
        }
      } else {
        if (forbiddenHit) {
          state.score = Math.max(0, state.score - 10);
          this.showToast('🚫 금지 타겟을 포획하여 -10점 감점되었습니다!', true);
        } else {
          this.showToast(`아쉽습니다! 현재 설정된 원 위에 타겟이 없습니다. 남은 발사: ${state.shotsLeft}회`, true);
        }
        this.updateStatsUI();
      }

      if (state.shotsLeft <= 0 && !state.roundCleared) {
        this.showToast('🎯 남은 발사 횟수가 모두 소진되었습니다! 다음 라운드로 진행합니다.', true);
        setTimeout(() => this.nextRound(), 1200);
      }
    },

    nextRound() {
      if (state.round >= state.maxRound) {
        const diffName = state.difficulty === 'easy' ? '🟢 쉬움' : (state.difficulty === 'normal' ? '🟡 보통' : '🔴 도전');
        showInlineRankingModal(state.score, diffName);
      } else {
        state.round++;
        this.setupRound();
      }
    },

    resetGame() {
      this.startNewGame();
    },

    goHome() {
      this.destroy();

      if (window.LegacyBridge && typeof window.LegacyBridge.backHome === 'function') {
        try { window.LegacyBridge.backHome(); return; } catch(e) {}
      }
      if (typeof window.renderLegacyDashboardHome === 'function') {
        try { window.renderLegacyDashboardHome(); return; } catch(e) {}
      }
      if (typeof window.MathLabRenderHome === 'function') {
        try { window.MathLabRenderHome(); return; } catch(e) {}
      }

      const mathlabRoot = document.getElementById('mathlab-root');
      const legacyRoot = document.getElementById('legacy-root');
      if (mathlabRoot) mathlabRoot.classList.add('hidden');
      if (legacyRoot) legacyRoot.classList.remove('hidden');

      const dashboard = document.getElementById('dashboard-screen');
      if (dashboard) {
        dashboard.classList.add('active');
        dashboard.style.display = '';
      }
      window.scrollTo({ top: 0, left: 0, behavior: 'smooth' });
    },

    destroy() {
      if (state.timerId) clearInterval(state.timerId);
      if (this.container) this.container.innerHTML = '';
    }
  };

  window.CircleShooter = CircleShooter;

  function registerCircleShooter() {
    if (typeof window.MathLabGames !== 'undefined' && typeof window.MathLabGames.register === 'function') {
      if (!window.MathLabGames.get?.('circle-shooter')) {
        window.MathLabGames.register({
          id: 'circle-shooter',
          title: '원의 방정식 타겟 슈터',
          icon: '⭕',
          category: 'game',
          sourceType: 'new',
          mount(container, context) { CircleShooter.mount(container, context); },
          reset() { CircleShooter.resetGame(); },
          destroy() { CircleShooter.destroy(); },
          goHome() { CircleShooter.goHome(); }
        });
      }
    }
  }

  registerCircleShooter();
  window.addEventListener('DOMContentLoaded', registerCircleShooter);
  setTimeout(registerCircleShooter, 100);
  setTimeout(registerCircleShooter, 500);

  window.launchCircleShooterGame = function() {
    if (typeof window.MathLabGames !== 'undefined' && typeof window.MathLabGames.mount === 'function') {
      try {
        window.MathLabGames.mount('circle-shooter');
        return;
      } catch(e) {}
    }
    CircleShooter.mount();
  };
})();
</script>
