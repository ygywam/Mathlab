<style>
  .game-sequence-racing {
    width: 100%;
    min-height: 100%;
    padding: 24px;
    box-sizing: border-box;
    color: #1f2937;
    background: linear-gradient(135deg, #fff7ed 0%, #eff6ff 100%);
    border-radius: 24px;
    font-family: inherit;
    user-select: none;
  }
  .game-sequence-racing * { box-sizing: border-box; }

  .seq-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
  .seq-title h2 { margin: 0 0 8px; font-size: clamp(1.8rem, 3.5vw, 2.6rem); color: #111827; }
  .seq-title p { margin: 0; color: #4b5563; font-size: 1.05rem; }
  .seq-badge { padding: 8px 12px; border-radius: 999px; color: #fff; background: linear-gradient(135deg, #ea580c, #dc2626); font-weight: 900; font-size: 0.9rem; }

  .seq-mode-tabs { display: flex; gap: 8px; margin-bottom: 20px; justify-content: center; }
  .seq-mode-tab { padding: 12px 24px; border-radius: 12px; font-weight: bold; cursor: pointer; border: 2px solid transparent; background: #e2e8f0; color: #475569; font-size: 1.1rem; }
  .seq-mode-tab.active { background: #fff; border-color: #3b82f6; color: #1d4ed8; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }

  .seq-track-area {
    background: rgba(255, 255, 255, 0.9);
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 10px 25px rgba(15, 23, 42, 0.05);
    margin-bottom: 20px;
  }

  .seq-lane {
    position: relative; height: 64px; border-radius: 16px;
    background: repeating-linear-gradient(90deg, #e5e7eb 0, #e5e7eb 2px, #f8fafc 2px, #f8fafc 10%);
    border: 2px solid #e5e7eb; overflow: hidden; margin-bottom: 12px;
  }
  .seq-lane:last-child { margin-bottom: 0; }

  .seq-lane-label { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); z-index: 2; font-weight: 900; background: rgba(255,255,255,0.8); padding: 4px 10px; border-radius: 999px; }
  .seq-runner { position: absolute; top: 50%; left: 8px; transform: translateY(-50%); width: 48px; height: 48px; display: grid; place-items: center; border-radius: 50%; font-size: 1.8rem; transition: left 0.35s ease; z-index: 3; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
  .seq-runner.p1 { background: linear-gradient(135deg, #dbeafe, #60a5fa); }
  .seq-runner.p2 { background: linear-gradient(135deg, #fee2e2, #fb7185); }

  .seq-finish { position: absolute; top: 0; right: 12px; bottom: 0; width: 8px; background: repeating-linear-gradient(180deg, #111827 0, #111827 8px, #fff 8px, #fff 16px); border-radius: 999px; opacity: 0.9; }

  .seq-arena {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }
  @media (max-width: 768px) { .seq-arena { grid-template-columns: 1fr; } }

  .seq-panel {
    background: #fff; border-radius: 20px; padding: 20px; position: relative;
    box-shadow: 0 10px 25px rgba(15, 23, 42, 0.05);
    display: flex; flex-direction: column; gap: 16px;
  }

  .seq-panel.ai-mode::after {
    content: '🤖 AI 연산 중...';
    position: absolute; top:0; left:0; width:100%; height:100%;
    background: rgba(241, 245, 249, 0.85); border-radius: 20px;
    display: flex; justify-content: center; align-items: center;
    font-size: 1.5rem; font-weight: bold; color: #475569;
    z-index: 10;
  }

  .seq-panel-header { display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 1.2rem; border-bottom: 2px solid #f1f5f9; padding-bottom: 12px; }
  .seq-panel-header.p1 { color: #2563eb; }
  .seq-panel-header.p2 { color: #e11d48; }

  .seq-problem-box {
    background: #0f172a; color: #fff; border-radius: 16px; padding: 16px; text-align: center;
  }
  .seq-problem-type { font-size: 0.9rem; color: #94a3b8; margin-bottom: 8px; }
  .seq-sequence { font-size: 2.2rem; font-weight: 900; letter-spacing: 2px; margin-bottom: 12px; }
  .seq-hint-btn { background: #334155; color: #facc15; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; transition: background 0.2s; }
  .seq-hint-btn:hover { background: #475569; }
  .seq-hint-text { color: #fde047; font-weight: bold; background: rgba(255,255,255,0.1); padding: 8px; border-radius: 8px; }

  .seq-display { background: #f8fafc; border: 2px solid #cbd5e1; border-radius: 12px; font-size: 2rem; font-weight: bold; text-align: center; padding: 12px; min-height: 64px; display: flex; justify-content: center; align-items: center; }
  .seq-keypad {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
  }
  .seq-key { background: #e2e8f0; border: none; padding: 16px; font-size: 1.5rem; font-weight: bold; border-radius: 12px; cursor: pointer; color: #334155; transition: background 0.1s; }
  .seq-key:active { background: #cbd5e1; transform: scale(0.95); }
  .seq-key.submit { background: #3b82f6; color: #fff; }
  .seq-key.submit:active { background: #2563eb; }
  .seq-key.clear { background: #ef4444; color: #fff; }

  .seq-msg { padding: 12px; border-radius: 12px; font-weight: bold; text-align: center; min-height: 48px; display: flex; align-items: center; justify-content: center; }
  .seq-msg.normal { background: #f1f5f9; color: #475569; }
  .seq-msg.success { background: #dcfce7; color: #166534; }
  .seq-msg.error { background: #fee2e2; color: #991b1b; }

  .seq-controls { margin-top: 20px; display: flex; gap: 12px; justify-content: center; }
  .seq-btn { border: none; padding: 12px 24px; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 1.1rem; color: #fff; }
  .seq-btn.primary { background: #f97316; }
  .seq-btn.secondary { background: #64748b; }

  .seq-bottom-ranking { margin-top: 20px; background: #fff; padding: 20px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
  .seq-bottom-ranking h3 { margin: 0 0 12px; color: #1e293b; }
</style>
<script>
(function () {
  'use strict';

  const RacingGame = {
    container: null,
    aiInterval: null,

    state: {
      mode: '1p', // 1p (vs AI) or 2p (vs Player)
      finish: 10,
      gameOver: false,
      winner: null,
      players: {
        1: { pos: 0, score: 0, problem: null, hint: false, input: '', msg: '준비 완료!', msgType: 'normal' },
        2: { pos: 0, score: 0, problem: null, hint: false, input: '', msg: '준비 완료!', msgType: 'normal' }
      }
    },

    problemBank: [
      { type: '등차수열', hint: '같은 수를 계속 더합니다.', make() { const s = randInt(1,12), d = randInt(2,9); return { seq: [s, s+d, s+d*2, s+d*3], ans: s+d*4, rule: `+ ${d}` }; } },
      { type: '등비수열', hint: '같은 수를 계속 곱합니다.', make() { const s = randInt(1,5), r = randInt(2,4); return { seq: [s, s*r, s*r**2, s*r**3], ans: s*r**4, rule: `× ${r}` }; } },
      { type: '제곱수', hint: '자연수의 제곱을 생각합니다.', make() { const s = randInt(1,4); return { seq: [s, s+1, s+2, s+3].map(n=>n*n), ans: (s+4)**2, rule: `제곱수` }; } },
      { type: '피보나치형', hint: '앞의 두 수를 더해 다음 수를 만듭니다.', make() { const a=randInt(1,5), b=randInt(2,8); return { seq: [a, b, a+b, a+2*b], ans: 2*a+3*b, rule: `앞 두 수의 합` }; } }
    ],

    mount(container, context = {}) {
      let host = null;
      if (typeof container === 'string') host = document.querySelector(container);
      else if (container instanceof HTMLElement) host = container;
      
      if (!host) host = window.MathLabUtils?.getMountContainer ? window.MathLabUtils.getMountContainer(container) : document.getElementById('mathlab-view');
      if (!host || !(host instanceof HTMLElement)) host = document.getElementById('new-root') || document.getElementById('game-container') || document.getElementById('mathlab-view');

      if (!host || !(host instanceof HTMLElement) || host === document.body) {
        let createdHost = document.getElementById('seq-force-host');
        if (!createdHost) {
          createdHost = document.createElement('div');
          createdHost.id = 'seq-force-host';
          document.body.appendChild(createdHost);
        }
        host = createdHost;
      }

      const footerEl = document.querySelector('footer, #footer, .app-footer') || Array.from(document.querySelectorAll('div, p, span')).find(el => el.textContent && el.textContent.includes('2026 기록조율사'));
      if (footerEl && host && typeof host.compareDocumentPosition === 'function' && (host.compareDocumentPosition(footerEl) & Node.DOCUMENT_POSITION_PRECEDING)) {
        footerEl.parentNode.insertBefore(host, footerEl);
      }

      host.style.display = ''; host.style.visibility = 'visible'; host.style.opacity = '1';
      let parent = host.parentElement;
      while (parent && parent !== document.body && parent !== document.documentElement) {
        if (parent.style && parent.style.display === 'none') parent.style.display = 'block';
        if (parent.style && parent.style.visibility === 'hidden') parent.style.visibility = 'visible';
        parent = parent.parentElement;
      }

      document.querySelectorAll('header, .navbar, #app-header, .top-bar, #floating-home-btn, .floating-home, [id*="home"], [class*="floating"]').forEach(el => {
        if (el && el.style && el.style.display === 'none') el.style.display = '';
      });

      this.container = host;
      this.setMode('1p');
    },

    setMode(mode) {
      this.state.mode = mode;
      this.reset();
    },

    reset() {
      if (this.aiInterval) { clearInterval(this.aiInterval); this.aiInterval = null; }
      this.state.gameOver = false;
      this.state.winner = null;
      this.state.players[1] = { pos: 0, score: 0, problem: this.makeProblem(), hint: false, input: '', msg: '준비 완료!', msgType: 'normal' };
      this.state.players[2] = { pos: 0, score: 0, problem: this.makeProblem(), hint: false, input: '', msg: '준비 완료!', msgType: 'normal' };
      this.render();

      if (this.state.mode === '1p') {
        this.startAI();
      }
    },

    makeProblem() {
      const maker = this.problemBank[Math.floor(Math.random() * this.problemBank.length)];
      const data = maker.make();
      return { type: maker.type, hint: maker.hint, seq: data.seq, ans: data.ans, rule: data.rule };
    },

    startAI() {
      this.aiInterval = setInterval(() => {
        if (this.state.gameOver) return;
        const p2 = this.state.players[2];
        if (Math.random() < 0.2 && !p2.hint) {
          p2.hint = true;
          this.render();
          return;
        }
        if (Math.random() < 0.1) {
          this.handleAnswer(2, p2.problem.ans + randInt(1,3));
        } else {
          this.handleAnswer(2, p2.problem.ans);
        }
      }, randInt(3500, 6500));
    },

    handleKeyPress(p, key) {
      if (this.state.gameOver) return;
      if (this.state.mode === '1p' && p === 2) return; 

      const player = this.state.players[p];
      if (key === 'C') {
        player.input = '';
      } else if (key === 'E') {
        this.handleAnswer(p, player.input);
        player.input = '';
      } else {
        if (player.input.length < 5) player.input += key;
      }
      this.render();
    },

    handleAnswer(p, val) {
      if (this.state.gameOver) return;
      const player = this.state.players[p];
      if (val === '' || val === null) return;
      const num = Number(val);

      if (num === player.problem.ans) {
        const move = player.hint ? 1 : 2;
        player.pos += move;
        player.score += player.hint ? 10 : 20;
        player.msgType = 'success';
        player.msg = `정답! ${move}칸 전진!`;
        
        if (player.pos >= this.state.finish) {
          player.pos = this.state.finish;
          this.gameOver(p);
        } else {
          player.problem = this.makeProblem();
          player.hint = false;
        }
      } else {
        player.msgType = 'error';
        player.msg = `오답! 정답은 ${player.problem.ans} (${player.problem.rule})`;
        player.problem = this.makeProblem();
        player.hint = false;
      }
    },

    useHint(p) {
      if (this.state.gameOver) return;
      if (this.state.mode === '1p' && p === 2) return;
      const player = this.state.players[p];
      player.hint = true;
      player.msgType = 'normal';
      player.msg = '힌트 사용! 정답 시 1칸 전진';
      this.render();
    },

    gameOver(winner) {
      this.state.gameOver = true;
      this.state.winner = winner;
      if (this.aiInterval) { clearInterval(this.aiInterval); this.aiInterval = null; }
      
      this.state.players[winner].msgType = 'success';
      this.state.players[winner].msg = '🎉 승리했습니다! 🎉';
      const loser = winner === 1 ? 2 : 1;
      this.state.players[loser].msgType = 'error';
      this.state.players[loser].msg = '패배했습니다...';
      
      this.render();

      if (winner === 1 || this.state.mode === '2p') {
        setTimeout(() => {
           window.showRankingModal ? window.showRankingModal('수열 규칙 레이싱', this.state.players[winner].score, 'board-sequence-racing') : this.legacyRanking(winner);
        }, 500);
      }
    },

    legacyRanking(winner) {
       const overlay = document.createElement('div');
       overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:9999;display:flex;align-items:center;justify-content:center;';
       overlay.innerHTML = `
         <div style="background:#fff;padding:24px;border-radius:16px;text-align:center;max-width:400px;width:90%;">
           <h3 style="margin-top:0;">🏆 P${winner} 승리!</h3>
           <p>명예의 전당에 등록할 닉네임을 입력하세요.</p>
           <input type="text" id="sr-nick" placeholder="닉네임" style="width:100%;padding:10px;margin-bottom:12px;border:1px solid #ccc;border-radius:8px;font-size:1.1rem;text-align:center;">
           <button id="sr-submit" style="background:#3b82f6;color:#fff;border:none;padding:10px 20px;border-radius:8px;font-weight:bold;cursor:pointer;">등록</button>
           <button id="sr-cancel" style="background:#94a3b8;color:#fff;border:none;padding:10px 20px;border-radius:8px;font-weight:bold;cursor:pointer;margin-left:8px;">취소</button>
         </div>
       `;
       this.container.appendChild(overlay);
       overlay.querySelector('#sr-submit').onclick = () => {
         const name = overlay.querySelector('#sr-nick').value.trim();
         if(name) window.submitRanking('수열 규칙 레이싱', this.state.players[winner].score, true, {value: name, trim: ()=>name.trim()}, 'board-sequence-racing');
         overlay.remove();
       };
       overlay.querySelector('#sr-cancel').onclick = () => overlay.remove();
    },

    getPos(p) {
      return `${Math.min(88, 8 + (this.state.players[p].pos / this.state.finish) * 78)}%`;
    },

    renderPanel(p) {
      const player = this.state.players[p];
      const isAI = (this.state.mode === '1p' && p === 2);
      return `
        <div class="seq-panel ${isAI ? 'ai-mode' : ''}" data-p="${p}">
          <div class="seq-panel-header p${p}">
            <span>P${p} ${isAI ? '(AI 봇)' : ''}</span>
            <span>${player.score}점</span>
          </div>
          <div class="seq-problem-box">
            <div class="seq-problem-type">[${player.problem.type}] 다음 수를 입력하세요</div>
            <div class="seq-sequence">${player.problem.seq.join(', ')}, ?</div>
            ${player.hint 
              ? `<div class="seq-hint-text">${player.problem.hint}</div>` 
              : `<button class="seq-hint-btn" data-hint="${p}">💡 힌트 보기 (-1칸 전진)</button>`
            }
          </div>
          <div class="seq-display">${player.input || '&nbsp;'}</div>
          <div class="seq-keypad">
            ${[1,2,3,4,5,6,7,8,9].map(n => `<button class="seq-key" data-key="${n}" data-kp="${p}">${n}</button>`).join('')}
            <button class="seq-key clear" data-key="C" data-kp="${p}">C</button>
            <button class="seq-key" data-key="0" data-kp="${p}">0</button>
            <button class="seq-key submit" data-key="E" data-kp="${p}">🚀</button>
          </div>
          <div class="seq-msg ${player.msgType}">${player.msg}</div>
        </div>
      `;
    },

    render() {
      if (!this.container) return;
      this.container.innerHTML = `
        <div class="game-sequence-racing">
          <!-- 가이드 모달 -->
          <div id="sr-guide-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:9999; justify-content:center; align-items:center;">
            <div style="background:#fff; width:90%; max-width:500px; border-radius:16px; padding:24px; box-shadow:0 10px 25px rgba(0,0,0,0.2);">
              <h3 style="margin-top:0; color:#1e293b; border-bottom:1px solid #e2e8f0; padding-bottom:12px;">📖 수열 규칙 레이싱 방법</h3>
              <div style="color:#475569; font-size:1rem; line-height:1.6; margin-bottom:20px;">
                1. 화면 중앙에 나타나는 수열의 규칙을 파악하세요.<br>
                2. 규칙에 맞는 <strong>다음 항의 숫자</strong>를 우측 패드에 입력하고 제출(발사)하세요.<br>
                3. 정답을 맞히면 내 말이 2칸 전진합니다. (힌트 사용 시 1칸)<br>
                4. 등차수열, 등비수열, 피보나치 등 다양한 규칙이 등장합니다.<br>
                5. <strong>동시 진행 방식</strong>이며, 먼저 목표 지점(${this.state.finish}칸)에 도달하는 쪽이 승리합니다!
              </div>
              <div style="text-align:right;">
                <button id="sr-close-guide" style="background:#16a34a; color:#fff; border:none; padding:10px 20px; border-radius:8px; cursor:pointer; font-weight:bold;">확인</button>
              </div>
            </div>
          </div>

          <div class="seq-header">
            <div class="seq-title">
              <h2>🏁 수열 규칙 레이싱</h2>
              <p>수열의 규칙을 찾아 다음 항을 입력하세요. 실시간으로 먼저 결승선에 도착하면 승리합니다.</p>
            </div>
            <div style="display:flex; flex-direction:column; align-items:flex-end; gap:8px;">
              <button class="seq-btn secondary" id="sr-btn-guide" style="padding:8px 16px; border-radius:8px; font-size:1rem;">📖 게임 방법</button>
              <div class="seq-badge">Gen-3 실시간 Racing 👥 1~2인</div>
            </div>
          </div>

          <div class="seq-mode-tabs">
            <button class="seq-mode-tab ${this.state.mode==='1p'?'active':''}" data-mode="1p">👤 1인용 (vs AI)</button>
            <button class="seq-mode-tab ${this.state.mode==='2p'?'active':''}" data-mode="2p">👥 2인용 (전자칠판 1:1 대결)</button>
          </div>

          <div class="seq-track-area">
            <div class="seq-lane">
              <div class="seq-lane-label">P1</div>
              <div class="seq-runner p1" style="left:${this.getPos(1)}">🐢</div>
              <div class="seq-finish"></div>
            </div>
            <div class="seq-lane">
              <div class="seq-lane-label">P2</div>
              <div class="seq-runner p2" style="left:${this.getPos(2)}">🐇</div>
              <div class="seq-finish"></div>
            </div>
          </div>

          <div class="seq-arena">
            ${this.renderPanel(1)}
            ${this.renderPanel(2)}
          </div>

          <div class="seq-controls">
            <button class="seq-btn primary" data-action="reset">다시 시작</button>
            <button class="seq-btn secondary" data-action="home">홈으로</button>
          </div>

          <div class="seq-bottom-ranking">
            <h3>🏆 명예의 전당 (상시 랭킹 보드)</h3>
            <div id="board-sequence-racing"><p style="color:#94a3b8;">로딩 중...</p></div>
          </div>
        </div>
      `;
      this.bindEvents();
      if (typeof window.loadGameLeaderboard === 'function') {
        window.loadGameLeaderboard('수열 규칙 레이싱', true, 'board-sequence-racing');
      }
    },

    bindEvents() {
      const btnGuide = this.container.querySelector('#sr-btn-guide');
      const btnClose = this.container.querySelector('#sr-close-guide');
      const modal = this.container.querySelector('#sr-guide-modal');
      if (btnGuide && modal) btnGuide.addEventListener('click', () => modal.style.display = 'flex');
      if (btnClose && modal) btnClose.addEventListener('click', () => modal.style.display = 'none');

      this.container.querySelectorAll('[data-mode]').forEach(btn => {
        btn.addEventListener('click', (e) => this.setMode(e.target.dataset.mode));
      });

      this.container.querySelectorAll('[data-hint]').forEach(btn => {
        btn.addEventListener('click', (e) => this.useHint(Number(e.target.dataset.hint)));
      });

      this.container.querySelectorAll('.seq-key').forEach(btn => {
        btn.addEventListener('click', (e) => this.handleKeyPress(Number(e.target.dataset.kp), e.target.dataset.key));
      });

      const btnReset = this.container.querySelector('[data-action="reset"]');
      if (btnReset) btnReset.addEventListener('click', () => this.reset());

      const btnHome = this.container.querySelector('[data-action="home"]');
      if (btnHome) btnHome.addEventListener('click', () => {
         if (window.MathLabUtils?.goHome) window.MathLabUtils.goHome();
         else if (window.LegacyBridge?.backHome) window.LegacyBridge.backHome();
         else location.reload();
      });

      // PC Keyboard mapping for P1 (and P2 if 2p mode)
      if (!this._keyBound) {
        window.addEventListener('keydown', (e) => {
          if (this.state.gameOver) return;
          // P1 controls (Numpad or top numbers)
          if (/[0-9]/.test(e.key)) this.handleKeyPress(1, e.key);
          if (e.key === 'Backspace' || e.key === 'Escape') this.handleKeyPress(1, 'C');
          if (e.key === 'Enter') this.handleKeyPress(1, 'E');
        });
        this._keyBound = true;
      }
    },

    destroy() {
      if (this.aiInterval) clearInterval(this.aiInterval);
      this.container = null;
    }
  };

  function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

  const gameMeta = {
    id: 'sequence-racing',
    title: '수열 규칙 레이싱',
    icon: '🏁',
    description: '수열의 다음 항을 맞히며 결승선을 향해 실시간으로 달리는 대결 게임',
    appType: 'game',
    topApp: '수학 게임',
    activityType: ['게임', '추론', '문제풀이'],
    schoolLevel: ['middle', 'high'],
    gradeBand: ['중2', '중3', '고1'],
    curriculumArea: ['규칙성', '함수', '수와 연산'],
    unit: ['수열', '규칙 찾기'],
    concepts: ['등차수열', '등비수열', '피보나치형 수열', '제곱수 수열'],
    category: '수열과 규칙',
    level: '중/고',
    concept: '등차수열, 등비수열, 규칙 찾기',
    classroomUse: ['전자칠판', '팀전', '도입 활동', '정리 활동'],
    difficulty: '보통',
    duration: '10분',
    renderMode: 'DOM',
    sourceType: 'new',
    playModes: ['single', 'versus'],
    tags: ['수열', '패턴', '규칙 찾기', '대결', '중등', '고등', '실시간'],
    keywords: ['수열', '등차수열', '등비수열'],
    mount(container, context) { RacingGame.mount(container, context); },
    reset() { RacingGame.reset(); },
    destroy() { RacingGame.destroy(); },
    goHome() {
      if (window.LegacyBridge && typeof window.LegacyBridge.backHome === 'function') window.LegacyBridge.backHome();
    }
  };

  function registerSeqRacing() {
    if (typeof window.MathLabGames !== 'undefined' && typeof window.MathLabGames.register === 'function') {
      if (!window.MathLabGames.get('sequence-racing')) {
        try { window.MathLabGames.register(gameMeta); } catch (e) {}
      }
    }
  }

  registerSeqRacing();
  window.addEventListener('DOMContentLoaded', registerSeqRacing);
  setTimeout(registerSeqRacing, 100);
  setTimeout(registerSeqRacing, 500);

  window.initSequenceRacingGame = function() {
    registerSeqRacing();
    if (window.LegacyBridge && typeof window.LegacyBridge.hideAllLegacySections === 'function') {
      window.LegacyBridge.hideAllLegacySections();
      window.LegacyBridge.showNewRoot();
    }
    if (typeof window.MathLabGames !== 'undefined' && typeof window.MathLabGames.mount === 'function') {
      try { window.MathLabGames.mount('sequence-racing'); return; } catch(e) {}
    }
    const targetEl = document.getElementById('mathlab-view') || document.getElementById('new-root') || document.getElementById('game-container');
    RacingGame.mount(targetEl);
  };
  window.launchSequenceRacing = window.initSequenceRacingGame;
})();
</script>
