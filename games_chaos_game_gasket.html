    var isDisplay = el.getAttribute('data-display') === 'true';

  });

function getVertPos(n) {
  var cx = CW / 2, cy = CH / 2 + 10;
  var R = Math.min(CW, CH) * 0.38;
  var arr = [];
  for (var i = 0; i < n; i++) {
    var ang = -Math.PI / 2 + (i * 2 * Math.PI / n);
    arr.push({ x: cx + R * Math.cos(ang), y: cy + R * Math.sin(ang) });
  }
  return arr;
}

        q: "꼭짓점 4개(정사각형)에서 r=0.5로 카오스 게임을 진행할 때, 직전과 동일한 꼭짓점을 연속으로 선택하지 못하는 제약을 두면 어떤 프랙탈이 나타날까요?",
        sol: "<b>[수학적 분석]</b><br>• 제약이 없으면 점이 평면 전체를 가득 채웁니다.<br>• '직전 선택 꼭짓점 재선택 금지' 제약을 추가하면 시에르핀스키 카펫 및 유사 카오스 카펫 프랙탈 구멍이 형성됩니다."
      },
      {
        title: "Q2. 코흐 눈송이(Koch Snowflake)의 둘레와 넓이",
        q: "정삼각형의 각 변을 3등분하여 만든 코흐 눈송이의 둘레의 길이와 넓이의 극한값은 각각 어떻게 될까요?",
        sol: "<b>[수학적 증명]</b><br>• 둘레의 길이: <span class=\"math-tex\" data-tex=\"\\lim_{n \\to \\infty} L_n = \\infty\"></span> (무한대로 발산)<br>• 넓이: 유한한 원 안에 갇히므로 <span class=\"math-tex\" data-tex=\"S = \\frac{8}{5} S_0\"></span> (유한값 수렴)"
      },
      {
        title: "Q3. 하우스도르프 차원의 기하학적 의미",
        q: "길이가 1/3로 줄어들 때 개수가 4배로 늘어나는 프랙탈 도형의 차원 d의 계산값은 얼마일까요?",
        sol: "<b>[수학적 해설]</b><br>• 프랙탈 차원 공식: <span class=\"math-tex\" data-tex=\"d = \\frac{\\ln 4}{\\ln 3} \\approx 1.2618\"></span>"
      },
      {
        title: "Q4. IFS (반복 함수 시스템) 애니메이션 원리",
        q: "고사리 잎(Barnsley Fern) 형상을 카오스 게임 행렬 연산으로 그릴 수 있는 이유는 무엇일까요?",
        sol: "<b>[수학적 분석]</b><br>• 4가지 선형 변환 행렬과 발생 확률을 기하학적으로 조합(IFS)함으로써 실제 자연 속 고사리 줄기와 잎의 자기 유사성을 완전 재현합니다."
      }
    ];

    probs.forEach(function(item, idx) {
      h += '<div style="background:#ffffff; border:1px solid #e2e8f0; border-radius:14px; padding:16px; margin-bottom:14px;">';
      h += '  <div style="font-weight:900; font-size:1.05rem; color:#7c3aed; margin-bottom:6px;">' + item.title + '</div>';
      h += '  <div style="line-height:1.6; color:#334155; margin-bottom:10px;">' + item.q + '</div>';
      h += '  <button type="button" class="btn p btn-show-sol" data-idx="' + idx + '">💡 수학적 해설 보기</button>';
      h += '  <div id="sol-' + idx + '" style="display:none; background:#f8fafc; border:1px solid #cbd5e1; border-radius:12px; padding:14px; margin-top:10px; font-size:0.92rem; line-height:1.65;">' + item.sol + '</div>';
      h += '</div>';
    });

    h += '  </div>';
    h += '  </div>';

    /* Slide Modal */
    h += '<div class="modal" id="cg-modal">';
    h += '  <div class="mbox" id="cg-modal-box"></div>';
    h += '</div>';

    h += '</div>';
    return h;
  },

  bindEvents: function() {
    var _this = this;
    var root = S.host.querySelector('#cg-app-root');

    /* Tabs */
    root.querySelectorAll('.tab-btn').forEach(function(btn) {
      btn.onclick = function() {
        root.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
        this.classList.add('active');
        S.activeTab = this.getAttribute('data-tab');

        root.querySelector('#tab-sec-sim').style.display = (S.activeTab === 'sim') ? 'block' : 'none';
        root.querySelector('#tab-sec-math').style.display = (S.activeTab === 'math') ? 'block' : 'none';
        root.querySelector('#tab-sec-prob').style.display = (S.activeTab === 'prob') ? 'block' : 'none';

        updateMathElements();
      };
    });

    /* Optimized Slider Drag Events (Light UI update on input, Reset on change or debounced) */
    var rngRatio = root.querySelector('#rng-ratio');
    var rngVerts = root.querySelector('#rng-verts');
    var rngMax = root.querySelector('#rng-max');

    function triggerDebouncedReset() {
      if (S.debounceTimer) clearTimeout(S.debounceTimer);
      S.debounceTimer = setTimeout(function() {
        _this.resetSim();
      }, 100);
    }

    rngRatio.oninput = function() {
      S.ratio = parseFloat(this.value);
      root.querySelector('#lbl-val-ratio').textContent = S.ratio.toFixed(2);
      triggerDebouncedReset();
    };
    rngRatio.onchange = function() { _this.resetSim(); };

    rngVerts.oninput = function() {
      S.verts = parseInt(this.value, 10);
      root.querySelector('#lbl-val-verts').textContent = S.verts;
      triggerDebouncedReset();
    };
    rngVerts.onchange = function() { _this.resetSim(); };

    rngMax.oninput = function() {
      S.maxPts = parseInt(this.value, 10);
      root.querySelector('#lbl-val-max').textContent = S.maxPts.toLocaleString();
      root.querySelector('#lbl-pts-max').textContent = S.maxPts.toLocaleString();
    };

    /* Actions */
    root.querySelector('#btn-run-sim').onclick = function() { _this.toggleRun(); };
    root.querySelector('#btn-reset-sim').onclick = function() { _this.resetSim(); };

    /* Quiz */
    root.querySelector('#btn-submit-quiz').onclick = function() {
      var val = (root.querySelector('#inp-quiz-ans').value || '').trim();
      var msgEl = root.querySelector('#lbl-quiz-msg');
      if (val === '1.58' || val === '1.585' || val === '1.59' || val.indexOf('ln3') !== -1) {
        msgEl.innerHTML = '✅ <b>정답입니다!</b> d = ln(3)/ln(2) ≈ 1.585 차원의 프랙탈 구조가 입증됩니다.';
        msgEl.style.color = '#059669';
      } else {
        msgEl.innerHTML = '❌ 오답입니다. (힌트: ln 3 / ln 2 ≈ 1.585 차원입니다)';
        msgEl.style.color = '#ef4444';
      }
    };

    /* Solutions Toggle */
    root.querySelectorAll('.btn-show-sol').forEach(function(btn) {
      btn.onclick = function() {
        var idx = this.getAttribute('data-idx');
        var solEl = root.querySelector('#sol-' + idx);
        if (solEl) {
          var isShown = solEl.style.display === 'block';
          solEl.style.display = isShown ? 'none' : 'block';
          this.textContent = isShown ? '💡 수학적 해설 보기' : '🙈 해설 닫기';
          updateMathElements();
        }
      };
    });

    /* Modal Open & Render Slide */
    root.querySelector('#btn-open-guide').onclick = function() {
      S.guidePage = 0;
      _this.renderSlideGuide();
      root.querySelector('#cg-modal').classList.add('on');
    };
  },

  resetSim: function() {
    this.stopRun();
    S.count = 0;
    S.points = [];
    var V = getVertPos(S.verts);
    S.px = (V[0].x + V[1].x + V[2].x) / 3;
    S.py = (V[0].y + V[1].y + V[2].y) / 3;
    
    var root = S.host.querySelector('#cg-app-root');
    if (root) {
      root.querySelector('#lbl-pts-count').textContent = '0';
    }
    this.draw(true);
  },

  stopRun: function() {
    S.running = false;
    if (S.raf) { cancelAnimationFrame(S.raf); S.raf = null; }
    var root = S.host.querySelector('#cg-app-root');
    if (root) {
      var btn = root.querySelector('#btn-run-sim');
      if (btn) btn.textContent = '▶ 시뮬레이션 시작';
    }
  },

  toggleRun: function() {
    if (S.running) {
      this.stopRun();
    } else {
      S.running = true;
      var root = S.host.querySelector('#cg-app-root');
      if (root) {
        var btn = root.querySelector('#btn-run-sim');
        if (btn) btn.textContent = '⏸ 일시 정지';
      }
      this.loop();
    }
  },

  stepBatch: function(batchSize) {
    var V = getVertPos(S.verts);
    for (var i = 0; i < batchSize && S.count < S.maxPts; i++) {
      var vi = Math.floor(Math.random() * V.length);
      S.px = S.px + (V[vi].x - S.px) * S.ratio;
      S.py = S.py + (V[vi].y - S.py) * S.ratio;
      S.points.push(S.px, S.py);
      S.count++;
    }
    var root = S.host.querySelector('#cg-app-root');
    if (root) {
      root.querySelector('#lbl-pts-count').textContent = S.count.toLocaleString();
    }
  },

  draw: function(clear) {
    var root = S.host.querySelector('#cg-app-root');
    if (!root) return;
    var cv = root.querySelector('#cg-cv');
    if (!cv) return;
    var ctx = cv.getContext('2d');

    if (clear) {
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, CW, CH);
    }

    var V = getVertPos(S.verts);
    ctx.fillStyle = '#fbbf24';
    for (var i = 0; i < V.length; i++) {
      ctx.beginPath();
      ctx.arc(V[i].x, V[i].y, 6, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.fillStyle = 'rgba(167, 139, 250, 0.85)';
    var pts = S.points;
    for (var j = 0; j < pts.length; j += 2) {
      ctx.fillRect(pts[j], pts[j + 1], 1.4, 1.4);
    }
  },

  loop: function() {
    var _this = this;
    if (!S.running || !S.host) return;

    this.stepBatch(S.count < 200 ? 30 : 250);
    this.draw(S.count % 1000 < 250);

    if (S.count >= S.maxPts) {
      this.stopRun();
      return;
    }
    S.raf = requestAnimationFrame(function() { _this.loop(); });
  },

  renderSlideGuide: function() {
    var _this = this;
    var root = S.host.querySelector('#cg-app-root');
    var mBox = root.querySelector('#cg-modal-box');
    if (!mBox) return;

    var pg = SLIDE_GUIDE[S.guidePage] || SLIDE_GUIDE[0];
    var dots = SLIDE_GUIDE.map(function(_, i) {
      return '<span class="dot' + (i === S.guidePage ? ' on' : '') + '"></span>';
    }).join('');
    var isLast = S.guidePage >= SLIDE_GUIDE.length - 1;

    var h = '';
    h += '<div style="font-size:.8rem; font-weight:800; color:#7c3aed; margin-bottom:4px;">온보딩 슬라이드 탐구 ' + (S.guidePage + 1) + ' / ' + SLIDE_GUIDE.length + '</div>';
    h += '<h3 style="margin:0 0 12px; color:#0f172a; font-weight:900;">' + pg.title + '</h3>';
    h += '<div style="line-height:1.65; color:#334155; font-size:0.95rem;">' + pg.html + '</div>';
    h += '<div class="dots">' + dots + '</div>';

    h += '<div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px;">';
    h += '  <button type="button" class="btn" id="btn-slide-prev"' + (S.guidePage === 0 ? ' disabled' : '') + '>← 이전</button>';
    h += '  <button type="button" class="btn p" id="btn-slide-next">' + (isLast ? '탐구 시작하기 🚀' : '다음 →') + '</button>';
    h += '</div>';

    mBox.innerHTML = h;
    updateMathElements();

    var prevBtn = mBox.querySelector('#btn-slide-prev');
    var nextBtn = mBox.querySelector('#btn-slide-next');

    if (prevBtn) {
      prevBtn.onclick = function() {
        if (S.guidePage > 0) {
          S.guidePage--;
          _this.renderSlideGuide();
        }
      };
    }
    if (nextBtn) {
      nextBtn.onclick = function() {
        if (isLast) {
          root.querySelector('#cg-modal').classList.remove('on');
        } else {
          S.guidePage++;
          _this.renderSlideGuide();
        }
      };
    }
  },

  destroy: function() {
    this.stopRun();
    if (S.host) S.host.innerHTML = '';
    S.host = null;
  }
};

function goHome() {
  if (S.host) S.host.innerHTML = '';
  if (typeof window.LegacyBridge !== 'undefined' && typeof window.LegacyBridge.backHome === 'function') {
    window.LegacyBridge.backHome();
  } else if (typeof window.MathLabGames !== 'undefined' && window.MathLabGames.goHome) {
    window.MathLabGames.goHome();
  } else {
    window.location.reload();
  }
}

function reg() {
  if (typeof window.MathLabGames === 'undefined' || !window.MathLabGames.register) return;
  try {
    if (window.MathLabGames.get && window.MathLabGames.get(APP_ID)) return;
    window.MathLabGames.register({
      id: APP_ID,
      title: APP_TITLE,
      icon: ICON,
      sourceType: 'new',
      players: '1인',
      isMultiplayer: false,
      mount: function(c, x) { ChaosApp.mount(c, x); },
      reset: function() { ChaosApp.resetSim(); },
      destroy: function() { ChaosApp.destroy(); },
      goHome: function() { goHome(); }
    });
  } catch (e) {
    console.warn(APP_ID + ' reg', e);
  }
}

reg();
window.addEventListener('DOMContentLoaded', reg);
setTimeout(reg, 100);
setTimeout(reg, 500);

window.ChaosGameGasket = {
  mount: function(c) { ChaosApp.mount(c); },
  resetGame: function() { ChaosApp.resetSim(); },
  destroy: function() { ChaosApp.destroy(); },
  goHome: goHome
};

window.initChaosGameGasketGame = function() {
  reg();
  try {
    if (window.LegacyBridge) {
      window.LegacyBridge.hideAllLegacySections();
      if (window.LegacyBridge.showNewRoot) window.LegacyBridge.showNewRoot();
    }
  } catch (e) {}
  if (window.MathLabGames && window.MathLabGames.mount) {
    try { window.MathLabGames.mount(APP_ID); return; } catch (e) {}
  }
  ChaosApp.mount(document.getElementById('mathlab-view'));
};

window.launchChaosGameGasketGame = window.initChaosGameGasketGame;
})();
</script>
