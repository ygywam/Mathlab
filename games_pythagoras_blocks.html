    box-shadow: 0 4px 8px rgba(0,0,0,0.3); transition: all 0.15s;
  }

  /* 모드 선택 탭 (각 모드별 차이점 한눈에 표시) */

  .game-pythagoras-blocks .btn-skip:hover { background: #475569; }

  /* 힌트 및 피드백 박스 */
  .game-pythagoras-blocks .pb-hint-box {

  /* 명예의 전당 카드 */

  /* 모달 오버레이 */
  .game-pythagoras-blocks .pb-modal-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.88); display: none; justify-content: center; align-items: center; z-index: 50; padding: 20px;
  }
  .game-pythagoras-blocks .pb-modal {
    background: #1e293b !important; border: 2px solid #38bdf8 !important; border-radius: 20px; max-width: 560px; width: 100%; padding: 28px; color: #f8fafc !important; box-shadow: 0 20px 35px rgba(0,0,0,0.6); max-height: 85vh; overflow-y: auto; text-align: left;
  }
  .game-pythagoras-blocks .pb-modal h3 { color: #38bdf8 !important; -webkit-text-fill-color: #38bdf8 !important; margin-top: 0; font-size: 1.45rem; border-bottom: 1px solid #334155; padding-bottom: 12px; font-weight: 900; }
  .game-pythagoras-blocks .pb-modal h4 { color: #facc15 !important; -webkit-text-fill-color: #facc15 !important; margin: 18px 0 8px 0; font-size: 1.15rem; font-weight: 800; }
  .game-pythagoras-blocks .pb-modal p { font-size: 1rem; line-height: 1.65; color: #e2e8f0 !important; margin-bottom: 10px; }
  .game-pythagoras-blocks .btn-close-modal { background: #38bdf8; color: #0f172a; border: none; font-weight: 800; padding: 14px 20px; border-radius: 12px; cursor: pointer; margin-top: 22px; width: 100%; font-size: 1.05rem; }

  /* 게임 오버 / 클리어 오버레이 */
  .game-pythagoras-blocks .pb-overlay {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.96); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; border-radius: 20px; backdrop-filter: blur(8px); text-align: center; padding: 24px; animation: fadeIn 0.3s ease-out;
  }
  @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
  .game-pythagoras-blocks .btn-primary { background: #3b82f6; color: white; padding: 14px 28px; border-radius: 12px; border: none; font-size: 1.1rem; font-weight: 800; cursor: pointer; margin-top: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
  .game-pythagoras-blocks .pb-rank-card { background: #1e293b; border: 1px solid #38bdf8; border-radius: 16px; padding: 18px; width: 100%; max-width: 360px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); margin: 15px 0; }

  @media (max-width: 560px) {
    .game-pythagoras-blocks .pb-title h1 { font-size: 1.35rem !important; }
    .game-pythagoras-blocks .mission-tabs { grid-template-columns: 1fr; }
    .game-pythagoras-blocks .pb-svg-container { height: 390px; }
    .game-pythagoras-blocks .pb-answer-panel { flex-direction: column; }
    .game-pythagoras-blocks .btn-ctrl { flex: 1 1 100%; }
  }
</style>

<script>
(function() {
  // 🌟 [보안] XSS 방어용 HTML 특수기호 이스케이프 함수
  function escapeHTML(str) {
    if (!str) return '';
    return String(str).replace(/[&<>"']/g, function(match) {
      const escape = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
      return escape[match];
    });
  }

  const TRIPLES = [
    [3, 4, 5], [6, 8, 10], [9, 12, 15], [12, 16, 20],
    [5, 12, 13], [10, 24, 26], [8, 15, 17], [7, 24, 25]
  ];

  const PythagorasBlocks = {
    id: 'pythagoras-blocks',
    title: '피타고라스 블록 퍼즐',
    icon: '🧱',
    category: 'game',

    container: null,
    timers: [],
    timerInterval: null,
    animationFrameId: null,

    state: {
      mode: '쉬움',
      round: 1,
      maxRounds: 10,
      score: 0,
      combo: 0,
      timeLeft: 60,
      currentProblem: null,
      startTime: 0,
      isAnimating: false,
      isGameOver: false,
      isAnswerRevealed: false
    },

    mount(container, context = {}) {
      let target = typeof container === 'string' ? document.querySelector(container) : container;
      if (!target || !(target instanceof HTMLElement)) {
        target = window.MathLabUtils?.getMountContainer ? window.MathLabUtils.getMountContainer(container) : document.getElementById('mathlab-view');
      }
      if (!target) target = document.getElementById('game-pythagoras-blocks-app') || document.getElementById('new-root') || document.getElementById('game-container');

      if (!target || target === document.body) {
        let host = document.getElementById('pythagoras-blocks-force-host');
        if (!host) {
          host = document.createElement('div'); host.id = 'pythagoras-blocks-force-host';
          host.style.cssText = 'width:100%; max-width:960px; margin:0 auto; padding:20px 10px; box-sizing:border-box; z-index:999; position:relative; background:#0f172a; border-radius:24px;';
          const footer = document.querySelector('footer, #footer, .app-footer, #legacy-footer, .mathlab-footer');
          if (footer && footer.parentNode) footer.parentNode.insertBefore(host, footer);
          else document.body.appendChild(host);
        }
        target = host;
      }

      if (target) target.style.display = '';
      this.container = target;

      const level = context?.level || '쉬움';
      this.initGame(level);
    },

    goHome() {
      if (typeof window.MathLabCleanup?.clearTimers === 'function') {
        window.MathLabCleanup.clearTimers(this.timers);
      }
      this.timers.forEach(clearTimeout);
      if (this.timerInterval) clearInterval(this.timerInterval);
      if (this.animationFrameId) cancelAnimationFrame(this.animationFrameId);
      this.timers = [];
      this.timerInterval = null;
      this.animationFrameId = null;

      const mathlabView = document.getElementById('mathlab-view');
      if (mathlabView) { mathlabView.style.display = 'none'; mathlabView.innerHTML = ''; }
      const hostView = document.getElementById('pythagoras-blocks-force-host');
      if (hostView) { hostView.style.display = 'none'; hostView.innerHTML = ''; }
      const legacyAppView = document.getElementById('game-pythagoras-blocks-app');
      if (legacyAppView) { legacyAppView.style.display = 'none'; legacyAppView.innerHTML = ''; }

      if (window.LegacyBridge && typeof window.LegacyBridge.backHome === 'function') {
        try { window.LegacyBridge.backHome(); return; } catch(e) {}
      }
      if (typeof window.renderLegacyDashboardHome === 'function') {
        try { window.renderLegacyDashboardHome(); return; } catch(e) {}
      }
      if (typeof window.MathLabRenderHome === 'function') {
        try { window.MathLabRenderHome(); return; } catch(e) {}
      }

      const mathlabRoot = document.getElementById('mathlab-root');
      const legacyRoot = document.getElementById('legacy-root');
      if (mathlabRoot) mathlabRoot.classList.add('hidden');
      if (legacyRoot) legacyRoot.classList.remove('hidden');

      const dashboard = document.getElementById('dashboard-screen');
      if (dashboard) { dashboard.classList.add('active'); dashboard.style.display = ''; }
      window.scrollTo({ top: 0, left: 0, behavior: 'smooth' });
    },

    switchMode(mode) {
      this.initGame(mode);
    },

    initGame(mode) {
      this.state.mode = mode;
      this.state.round = 1;
      this.state.score = 0;
      this.state.combo = 0;
      this.state.timeLeft = mode === '도전' ? 60 : 0;
      this.state.isGameOver = false;
      this.state.isAnimating = false;

      this.startTimer();
      this.generateProblem();
      this.render();
    },

    startTimer() {
      if (this.timerInterval) clearInterval(this.timerInterval);
      if (this.state.mode === '도전') {
        this.timerInterval = setInterval(() => {
          if (!document.querySelector('.game-pythagoras-blocks')) { this.destroy(); return; }
          if (this.state.isGameOver || this.state.isAnimating) return;
          this.state.timeLeft--;
          this.updateStatsOnly();
          if (this.state.timeLeft <= 0) {
            this.gameOver();
          }
        }, 1000);
      }
    },

    formatMathText(text) {
      if (!text) return '';
      return String(text)
        .replace(/\$\$(.*?)\$\$/g, '<span class="math-expr font-mono text-amber-300 font-bold">$1</span>')
        .replace(/\$(.*?)\$/g, (match, expr) => {
          let clean = expr
            .replace(/a\^2/g, 'a²')
            .replace(/b\^2/g, 'b²')
            .replace(/c\^2/g, 'c²')
            .replace(/\^2/g, '²')
            .replace(/\\sqrt\{([^}]+)\}/g, '√$1');
          return `<span style="color:#fde047; font-weight:800; font-family:monospace; padding:0 4px;">${clean}</span>`;
        });
    },

    // 🌟 쉬움(빗변c/블록c²) vs 보통(남은변a,b/직각판별) 완벽 분리 및 질문 객체 누락 원복!
    generateProblem() {
      this.state.startTime = Date.now();
      this.state.isAnswerRevealed = false;
      const mode = this.state.mode;
      const triple = TRIPLES[Math.floor(Math.random() * TRIPLES.length)];
      let [a, b, c] = triple;

      let type = 'hypotenuse';
      if (mode === '쉬움') {
        // 🟢 쉬움 모드: 빗변 길이(c) 또는 빗변 블록 수(c²)만 출제 (기초 확실히 체득)
        type = Math.random() < 0.65 ? 'hypotenuse' : 'block_fill';
      } else if (mode === '보통') {
        // 🔵 보통 모드: 남은 한 변(a,b) 역산 또는 직각삼각형 성립 여부 판별(예/아니오) 출제 (응용 체득)
        type = Math.random() < 0.6 ? 'leg' : 'verify_right';
      } else { // 도전 모드
        // 🟣 도전 모드: 60초 타임어택 & 무리수 제곱근(√) 표기 찾기 등 고난도 종합
        const types = ['challenge_root', 'leg', 'verify_right', 'hypotenuse'];
        type = types[Math.floor(Math.random() * types.length)];
      }

      let questionTitle = '';
      let questionDesc = '';
      let answer = '';
      let targetLabel = '';
      let choices = null;

      if (type === 'hypotenuse') {
        questionTitle = '💡 빗변의 길이 c를 계산하세요!';
        questionDesc = `직각삼각형의 두 직각변이 $a = ${a}$, $b = ${b}$ 일 때, 가장 긴 빗변 $c$의 길이는 얼마인가요? ($a^2 + b^2 = c^2$)`;
        answer = String(c);
        targetLabel = `c (빗변의 길이) =`;
      } else if (type === 'leg') {
        const isA = Math.random() < 0.5;
        if (isA) {
          questionTitle = '💡 남은 직각변 a의 길이를 역산하세요!';
          questionDesc = `빗변의 길이 $c = ${c}$, 다른 직각변 $b = ${b}$ 일 때, 남은 한 변 $a$의 길이는 얼마인가요? ($c^2 - b^2 = a^2$)`;
          answer = String(a);
          targetLabel = `a (남은 직각변 길이) =`;
        } else {
          questionTitle = '💡 남은 직각변 b의 길이를 역산하세요!';
          questionDesc = `빗변의 길이 $c = ${c}$, 다른 직각변 $a = ${a}$ 일 때, 남은 한 변 $b$의 길이는 얼마인가요? ($c^2 - a^2 = b^2$)`;
          answer = String(b);
          targetLabel = `b (남은 직각변 길이) =`;
        }
      } else if (type === 'block_fill') {
        questionTitle = '🧱 빗변 정사각형 c² 블록 채우기!';
        questionDesc = `두 정사각형 블록 개수가 $a^2 = ${a*a}$ ($a=${a}$)와 $b^2 = ${b*b}$ ($b=${b}$)입니다. 합쳐서 빗변 정사각형($c^2$)을 채우려면 블록은 총 몇 개 필요한가요?`;
        answer = String(c * c);
        targetLabel = `c² (필요한 총 블록 수) =`;
      } else if (type === 'verify_right') {
        const isRight = Math.random() < 0.6;
        if (!isRight) {
          c += (Math.random() < 0.5 ? 1 : 2);
        }
        questionTitle = '🔍 직각삼각형 성립 여부 판별!';
        questionDesc = `세 변의 길이가 $a=${a}, b=${b}, c=${c}$ 인 삼각형은 직각삼각형인가요? ($a^2 + b^2 = ${a*a + b*b}$ 와 $c^2 = ${c*c}$ 비교)`;
        answer = isRight ? '예' : '아니오';
        targetLabel = `직각삼각형이 맞나요?`;
        choices = ['예', '아니오'];
      } else if (type === 'challenge_root') {
        const rootA = Math.floor(Math.random() * 4) + 2;
        const rootB = Math.floor(Math.random() * 4) + 3;
        const rootC2 = rootA * rootA + rootB * rootB;
        a = rootA; b = rootB; c = Math.round(Math.sqrt(rootC2) * 10) / 10;
        questionTitle = '🚀 [도전] 빗변의 길이 제곱근 표기 찾기!';
        questionDesc = `두 변의 길이가 $a = ${rootA}$, $b = ${rootB}$ 일 때, 빗변 $c$의 정확한 길이는 무엇인가요? ($c^2 = ${rootC2}$)`;
        answer = `√${rootC2}`;
        targetLabel = `c (빗변의 길이) =`;
        choices = [`√${rootC2}`, `√${rootC2 - 2}`, `√${rootA + rootB}`, `${rootA + rootB}`].sort(() => Math.random() - 0.5);
      }

      // 🌟 [핵심 수정] questionTitle과 questionDesc를 객체에 반드시 포함하여 노란 박스 빈칸 문제 원천 해결!
      this.state.currentProblem = { a, b, c, type, questionTitle, questionDesc, answer, targetLabel, choices, isRight: type !== 'verify_right' || answer === '예' };
    },

    render() {
      const mode = this.state.mode;
      const prob = this.state.currentProblem;
      let html = `
        <div class="game-pythagoras-blocks">
          <div class="pb-top-bar">
            <div class="pb-title">
              <h1>${this.icon} ${this.title}</h1>
              <span class="pb-diff-badge">${mode} 모드 (Round ${this.state.round}/${this.state.maxRounds})</span>
            </div>
            <button class="btn-manual" id="pb-btn-manual">📖 원리 및 조작법</button>
          </div>

          <div class="mission-tabs">
            <button class="tab-btn ${mode === '쉬움' ? 'active' : ''}" id="pb-tab-easy">
              🟢 쉬움 모드
              <span>빗변 c & 블록 c² 구하기</span>
            </button>
            <button class="tab-btn ${mode === '보통' ? 'active' : ''}" id="pb-tab-normal">
              🔵 보통 모드
              <span>남은 변 a,b & 직각 판별(O/X)</span>
            </button>
            <button class="tab-btn ${mode === '도전' ? 'active' : ''}" id="pb-tab-hard">
              🟣 도전 모드 (60초)
              <span>타임어택 & 제곱근(√) 도전</span>
            </button>
          </div>

          <div class="pb-header">
            <div style="font-size:1.15rem; font-weight:800; color:#fbbf24;">
              🏆 누적 점수: <span id="pb-score" style="color:white; font-size:1.45rem;">${this.state.score}</span>
              ${this.state.combo > 1 ? `<span style="color:#f43f5e; font-size:0.95rem; margin-left:8px;">🔥 ${this.state.combo} COMBO!</span>` : ''}
            </div>
            <div class="pb-stats">
              ${mode === '도전' ? `<div>남은 시간: <strong id="pb-timer" style="color:#ef4444;">${this.state.timeLeft}초</strong></div>` : ''}
              <div>현재 라운드: <strong>${this.state.round} / ${this.state.maxRounds}</strong></div>
            </div>
          </div>

          <div class="pb-board">
            <div class="pb-svg-container" id="pb-svg-container">
              ${this.renderSVG()}
            </div>

            <!-- 🌟 그림 바로 아래 노란 질문 상자 (100% 정상 렌더링) -->
            <div class="pb-question-box">
              <div class="pb-question-title">${this.formatMathText(prob.questionTitle)}</div>
              <div class="pb-question-desc">${this.formatMathText(prob.questionDesc)}</div>
            </div>

            <div class="pb-answer-panel">
              ${prob.choices ? `
                <div class="pb-target-badge">🎯 구하는 대상: <span class="pb-target-highlight">${prob.targetLabel}</span></div>
                <div class="pb-choices" style="margin-top:10px;">
                  ${prob.choices.map(ch => `<button class="choice-btn" data-val="${ch}">${ch}</button>`).join('')}
                </div>
              ` : `
                <div class="pb-target-badge">
                  🎯 구하는 값: <span class="pb-target-highlight">${prob.targetLabel}</span>
                </div>
                <input type="number" class="pb-input" id="pb-input" placeholder="정답" autocomplete="off">
                <button class="btn-submit" id="pb-submit-btn">정답 확인 및 블록 채우기 ➔</button>
              `}
            </div>

            <div class="pb-hint-box" id="pb-hint-box"></div>
          </div>

          <div class="pb-controls">
            <button class="btn-ctrl btn-hint" id="pb-btn-hint">💡 블록 공식 힌트 (-5점)</button>
            <button class="btn-ctrl btn-skip" id="pb-btn-skip">⏭️ 이 문제 건너뛰기</button>
            <button class="btn-ctrl btn-home" id="pb-btn-home">🏠 대시보드 홈으로</button>
          </div>

          <div class="pb-leaderboard-card">
            <h3>🏆 명예의 전당 (피타고라스 블록 퍼즐 TOP 기록)</h3>
            <div id="pb-leaderboard-container">
              <p style="color:#64748b; font-size:0.9rem; text-align:center;">로딩 중...</p>
            </div>
          </div>

          <!-- 원리 설명 모달 -->
          <div class="pb-modal-overlay" id="pb-manual-modal">
            <div class="pb-modal">
              <h3>📖 피타고라스 블록 퍼즐 원리 및 조작법</h3>
              <h4>🌟 1. 피타고라스 정리의 시각적 증명</h4>
              <p>• 직각삼각형에서 빗변(가장 긴 변 $c$) 위의 정사각형 면적($c^2$)은 나머지 두 변 위의 정사각형 면적의 합($a^2 + b^2$)과 <strong>정확히 일치</strong>합니다! ($a^2 + b^2 = c^2$)</p>
              <p>• 정답을 맞히면 $a^2$와 $b^2$ 정사각형에 있던 블록들이 물 흐르듯 빗변 정사각형($c^2$)으로 이동하여 완벽하게 채워지는 시각 증명을 체험합니다.</p>
              <h4>🎮 2. 모드별 차이점 안내</h4>
              <p>• <strong>🟢 쉬움 모드:</strong> 가장 기본이 되는 빗변의 길이 $c$나 전체 블록 수 $c^2$을 구하며 공식($a^2+b^2=c^2$)의 기초를 체득합니다.</p>
              <p>• <strong>🔵 보통 모드:</strong> 빗변 $c$가 주어지고 남은 한 변 $a$나 $b$를 역산($c^2-a^2=b^2$)하거나, 세 변으로 직각삼각형이 맞는지 판별(예/아니오)하는 응용력을 키웁니다.</p>
              <p>• <strong>🟣 도전 모드:</strong> 60초 제한시간 내의 타임어택 및 루트값($\sqrt{c^2}$) 문제에 도전합니다.</p>
              <button class="btn-close-modal" id="pb-close-modal">확인 (게임으로 돌아가기)</button>
            </div>
          </div>
        </div>
      `;

      this.container.innerHTML = html;
      this.bindEvents();
      this.loadLeaderboard();

      const modalP = this.container.querySelectorAll('.pb-modal p');
      modalP.forEach(p => { p.innerHTML = this.formatMathText(p.innerHTML); });
    },

    // 🌟 선생님 요청 완벽 반영: 정사각형 내부 = 넓이(a^2) / 정사각형 바깥 검정 배경 = 변의 길이(a)
    renderSVG() {
      const prob = this.state.currentProblem;
      const { a, b, c, type } = prob;
      const revealed = this.state.isAnswerRevealed;

      const showA = (type !== 'leg' || prob.questionTitle.includes('b')) || revealed;
      const showB = (type !== 'leg' || prob.questionTitle.includes('a')) || revealed;
      const showC = (type !== 'hypotenuse' && type !== 'challenge_root' && type !== 'block_fill') || revealed;

      // 1. 정사각형 내부: 면적 라벨
      const labelSqA = showA ? `a² = ${a*a}` : `a² = ?`;
      const labelSqB = showB ? `b² = ${b*b}` : `b² = ?`;
      const labelSqC = showC ? `c² = ${Math.round(c*c)}` : `c² = ?`;

      // 2. 정사각형 바깥쪽 검정 배경: 변의 길이 라벨
      const labelA = showA ? `a = ${a}` : `a = ?`;
      const labelB = showB ? `b = ${b}` : `b = ?`;
      const labelC = showC ? `c = ${c}` : `c = ?`;

      const maxSide = Math.max(a, b, c);
      const scale = Math.min(130 / maxSide, 15);
      const wA = a * scale;
      const wB = b * scale;
      const wC = Math.sqrt(wA * wA + wB * wB);

      const P1 = { x: 265 - wB/2 + wA * 0.2, y: 250 + wA/2 - wB * 0.2 }; // 직각 꼭짓점
      const P2 = { x: P1.x + wB, y: P1.y }; // 밑변 끝
      const P3 = { x: P1.x, y: P1.y - wA }; // 높이 끝

      const sqA_x = P3.x - wA;
      const sqA_y = P3.y;
      const sqB_x = P1.x;
      const sqB_y = P1.y;

      const angleRad = Math.atan2(wA, wB);
      const angleDeg = angleRad * 180 / Math.PI;

      const fontSqA = Math.min(15, Math.max(11, wA * 0.42));
      const fontSqB = Math.min(15, Math.max(12, wB * 0.35));
      const fontSqC = Math.min(16, Math.max(13, wC * 0.32));

      // 🌟 변의 길이 a: 빨간 정사각형 왼쪽 바깥 검정 배경 (sqA_x 왼쪽으로 14px)
      const posA_x = sqA_x - 14;
      const posA_y = sqA_y + wA/2 + 5;

      // 🌟 변의 길이 b: 파란 정사각형 아래쪽 바깥 검정 배경 (sqB_y + wB 아래로 24px)
      const posB_x = sqB_x + wB/2;
      const posB_y = sqB_y + wB + 24;

      return `
        <svg width="560" height="450" viewBox="0 0 560 450" id="pb-main-svg">
          <defs>
            <pattern id="gridA" width="${scale}" height="${scale}" patternUnits="userSpaceOnUse">
              <rect width="${scale}" height="${scale}" fill="#ef4444" stroke="#7f1d1d" stroke-width="1"/>
            </pattern>
            <pattern id="gridB" width="${scale}" height="${scale}" patternUnits="userSpaceOnUse">
              <rect width="${scale}" height="${scale}" fill="#3b82f6" stroke="#1e3a8a" stroke-width="1"/>
            </pattern>
            <pattern id="gridC" width="${scale}" height="${scale}" patternUnits="userSpaceOnUse">
              <rect width="${scale}" height="${scale}" fill="#10b981" stroke="#064e3b" stroke-width="1" opacity="0.35"/>
            </pattern>
          </defs>

          <!-- 1. a^2 정사각형 (내부 중심) -->
          <rect id="pb-sq-a" x="${sqA_x}" y="${sqA_y}" width="${wA}" height="${wA}" fill="url(#gridA)" rx="3"/>
          <text x="${sqA_x + wA/2}" y="${sqA_y + wA/2 + fontSqA * 0.35}" fill="${showA ? 'white' : '#facc15'}" font-weight="900" font-size="${fontSqA}" text-anchor="middle" style="filter: drop-shadow(0 1px 3px rgba(0,0,0,0.8));">${labelSqA}</text>

          <!-- 2. b^2 정사각형 (내부 중심) -->
          <rect id="pb-sq-b" x="${sqB_x}" y="${sqB_y}" width="${wB}" height="${wB}" fill="url(#gridB)" rx="3"/>
          <text x="${sqB_x + wB/2}" y="${sqB_y + wB/2 + fontSqB * 0.35}" fill="${showB ? 'white' : '#facc15'}" font-weight="900" font-size="${fontSqB}" text-anchor="middle" style="filter: drop-shadow(0 1px 3px rgba(0,0,0,0.8));">${labelSqB}</text>

          <!-- 3. c^2 정사각형 (내부 중심) -->
          <g id="pb-sq-c-group" transform="translate(${P3.x}, ${P3.y}) rotate(${angleDeg})">
            <rect id="pb-sq-c" x="0" y="${-wC}" width="${wC}" height="${wC}" fill="url(#gridC)" stroke="#10b981" stroke-width="3" stroke-dasharray="6,6" rx="3"/>
            <text x="${wC/2}" y="${-wC/2 + fontSqC * 0.35}" fill="${showC ? '#34d399' : '#facc15'}" font-weight="900" font-size="${fontSqC}" text-anchor="middle" transform="rotate(${-angleDeg}, ${wC/2}, ${-wC/2 + fontSqC * 0.35})" style="filter: drop-shadow(0 1px 3px rgba(0,0,0,0.8));">${labelSqC}</text>
            <!-- 🌟 변의 길이 c: 초록 정사각형 우측 상단 바깥 검정 배경 영역 -->
            <text x="${wC/2}" y="${-wC - 16}" fill="${showC ? '#34d399' : '#facc15'}" font-weight="900" font-size="16" text-anchor="middle" transform="rotate(${-angleDeg}, ${wC/2}, ${-wC - 16})" style="filter: drop-shadow(0 1px 3px rgba(0,0,0,0.9));">${labelC}</text>
          </g>

          <!-- 4. 중앙 직각삼각형 -->
          <polygon points="${P1.x},${P1.y} ${P2.x},${P2.y} ${P3.x},${P3.y}" fill="#facc15" stroke="#ca8a04" stroke-width="3" opacity="0.95"/>
          <polyline points="${P1.x},${P1.y - 14} ${P1.x + 14},${P1.y - 14} ${P1.x + 14},${P1.y}" fill="none" stroke="#713f12" stroke-width="2.5"/>

          <!-- 🌟 5. 변의 길이 a와 b: 각 정사각형 바깥쪽 검정 배경에 독립 배치 -->
          <!-- a 변 길이: 빨간 정사각형 왼쪽 바깥 검정 배경 -->
          <text x="${posA_x}" y="${posA_y}" fill="${showA ? '#fca5a5' : '#facc15'}" font-weight="900" font-size="16" text-anchor="end" style="filter: drop-shadow(0 1px 3px rgba(0,0,0,0.9));">${labelA}</text>
          <!-- b 변 길이: 파란 정사각형 아래쪽 바깥 검정 배경 -->
          <text x="${posB_x}" y="${posB_y}" fill="${showB ? '#93c5fd' : '#facc15'}" font-weight="900" font-size="16" text-anchor="middle" style="filter: drop-shadow(0 1px 3px rgba(0,0,0,0.9));">${labelB}</text>
        </svg>
      `;
    },

    bindEvents() {
      this.container.querySelector('#pb-tab-easy')?.addEventListener('click', () => this.switchMode('쉬움'));
      this.container.querySelector('#pb-tab-normal')?.addEventListener('click', () => this.switchMode('보통'));
      this.container.querySelector('#pb-tab-hard')?.addEventListener('click', () => this.switchMode('도전'));

      this.container.querySelector('#pb-btn-home')?.addEventListener('click', (e) => {
        e.preventDefault();
        this.goHome();
      });

      this.container.querySelector('#pb-btn-hint')?.addEventListener('click', () => this.showHint());
      this.container.querySelector('#pb-btn-skip')?.addEventListener('click', () => {
        this.state.combo = 0;
        this.nextRound();
      });

      const submitBtn = this.container.querySelector('#pb-submit-btn');
      const inputEl = this.container.querySelector('#pb-input');
      if (submitBtn && inputEl) {
        submitBtn.addEventListener('click', () => this.checkAnswer(inputEl.value.trim()));
        inputEl.addEventListener('keypress', (e) => { if (e.key === 'Enter') this.checkAnswer(inputEl.value.trim()); });
        setTimeout(() => inputEl.focus(), 100);
      }

      this.container.querySelectorAll('.choice-btn').forEach(btn => {
        btn.addEventListener('click', () => this.checkAnswer(btn.dataset.val));
      });

      const modal = this.container.querySelector('#pb-manual-modal');
      this.container.querySelector('#pb-btn-manual')?.addEventListener('click', () => { modal.style.display = 'flex'; });
      this.container.querySelector('#pb-close-modal')?.addEventListener('click', () => { modal.style.display = 'none'; });
    },

    showHint() {
      this.state.score = Math.max(0, this.state.score - 5);
      const prob = this.state.currentProblem;
      const hintBox = this.container.querySelector('#pb-hint-box');
      if (hintBox) {
        hintBox.style.display = 'block';
        const hintText = `💡 [피타고라스 정리] $a^2(${prob.a*prob.a}) + b^2(${prob.b*prob.b}) = c^2(${Math.round(prob.c*prob.c)})$ 성립 관계를 비교하세요!`;
        hintBox.innerHTML = this.formatMathText(hintText);
      }
      this.updateStatsOnly();
    },

    checkAnswer(userInput) {
      if (this.state.isAnimating || this.state.isGameOver) return;
      if (!userInput) return;

      const prob = this.state.currentProblem;
      const isCorrect = (userInput === prob.answer);

      if (isCorrect) {
        this.state.isAnimating = true;
        this.state.isAnswerRevealed = true;
        const svgContainer = this.container.querySelector('#pb-svg-container');
        if (svgContainer) svgContainer.innerHTML = this.renderSVG();

        const timeTaken = (Date.now() - this.state.startTime) / 1000;
        let bonus = timeTaken <= 5 ? 5 : (timeTaken <= 10 ? 3 : 1);
        this.state.combo++;
        const comboBonus = this.state.combo * 3;
        const totalPlus = 10 + bonus + comboBonus;
        this.state.score += totalPlus;

        this.updateStatsOnly();
        this.playBlockFillAnimation(() => {
          this.state.isAnimating = false;
          this.nextRound();
        });
      } else {
        this.state.combo = 0;
        this.state.score = Math.max(0, this.state.score - 5);
        this.updateStatsOnly();
        const hintBox = this.container.querySelector('#pb-hint-box');
        if (hintBox) {
          hintBox.style.display = 'block';
          hintBox.style.borderColor = '#ef4444';
          const errMsg = `⚠️ 오답입니다! (-5점) | $a^2(${prob.a*prob.a}) + b^2(${prob.b*prob.b}) = ${prob.a*prob.a + prob.b*prob.b}$ 인지 다시 확인하세요!`;
          hintBox.innerHTML = this.formatMathText(errMsg);
        }
      }
    },

    playBlockFillAnimation(callback) {
      const sqA = this.container.querySelector('#pb-sq-a');
      const sqB = this.container.querySelector('#pb-sq-b');
      const sqCGroup = this.container.querySelector('#pb-sq-c-group');
      if (!sqA || !sqB || !sqCGroup) { callback(); return; }

      sqA.style.transition = 'all 0.8s ease-in-out';
      sqB.style.transition = 'all 0.8s ease-in-out';
      sqA.style.opacity = '0.1';
      sqA.style.transform = 'scale(0.3)';
      sqB.style.opacity = '0.1';
      sqB.style.transform = 'scale(0.3)';

      const rectC = sqCGroup.querySelector('rect');
      if (rectC) {
        rectC.style.transition = 'all 0.8s ease-in-out';
        rectC.setAttribute('fill', 'url(#gridC)');
        rectC.setAttribute('stroke-dasharray', 'none');
        rectC.setAttribute('opacity', '1');
      }

      const toast = document.createElement('div');
      toast.style.cssText = 'position:absolute; top:45%; left:50%; transform:translate(-50%,-50%); background:rgba(16,185,129,0.96); color:white; padding:16px 28px; border-radius:16px; font-weight:900; font-size:1.35rem; box-shadow:0 10px 25px rgba(0,0,0,0.5); z-index:20;';
      toast.innerHTML = `✨ $a^2 + b^2 = c^2$ 블록 채우기 증명 완료! (+${10 + this.state.combo * 3}점)`;
      toast.innerHTML = this.formatMathText(toast.innerHTML);
      this.container.querySelector('.pb-board').appendChild(toast);

      setTimeout(() => {
        toast.remove();
        callback();
      }, 1450);
    },

    nextRound() {
      if (this.state.round >= this.state.maxRounds) {
        this.gameOver();
      } else {
        this.state.round++;
        this.generateProblem();
        this.render();
      }
    },

    updateStatsOnly() {
      const scoreEl = this.container.querySelector('#pb-score');
      const timerEl = this.container.querySelector('#pb-timer');
      if (scoreEl) scoreEl.textContent = this.state.score;
      if (timerEl) timerEl.textContent = `${this.state.timeLeft}초`;
    },

    gameOver() {
      this.state.isGameOver = true;
      if (this.timerInterval) clearInterval(this.timerInterval);

      const overlay = document.createElement('div');
      overlay.className = 'pb-overlay';
      const canSubmitRank = typeof window.submitRanking === 'function' && this.state.score > 0;

      overlay.innerHTML = `
        <h2 style="color:#facc15; font-size:2.4rem; margin:0 0 6px;">🎉 ROUND FINISHED!</h2>
        <p style="font-size:1.1rem; color:#cbd5e1; margin:0 0 4px;">모드: <strong style="color:white;">${this.state.mode}</strong> | 진행: <strong>${this.state.round}/${this.state.maxRounds}</strong></p>
        <p style="font-size:1.5rem; color:#38bdf8; font-weight:900; margin:0 0 16px;">최종 달성 점수: ${this.state.score}점</p>

        ${canSubmitRank ? `
        <div class="pb-rank-card">
          <h3 style="margin:0 0 8px 0; color:#fbbf24; font-size:1.05rem; display:flex; align-items:center; justify-content:center; gap:6px;">
            <span>🏆</span> 명예의 전당 기록 등록
          </h3>
          <p style="font-size:0.85rem; color:#94a3b8; margin:0 0 12px 0;">멋진 도전이었습니다! 이름을 남겨주세요.</p>
          <div style="display:flex; gap:8px;">
            <input type="text" id="pb-nick-input" placeholder="학교/학년/반 닉네임" maxlength="15" style="flex:1; padding:10px; border-radius:8px; border:1px solid #475569; background:#0f172a; color:white; font-size:0.95rem; font-weight:bold; text-align:center; outline:none;">
            <button id="pb-submit-btn" style="background:#fbbf24; color:#0f172a; font-weight:800; border:none; padding:0 16px; border-radius:8px; cursor:pointer; font-size:0.95rem;">등록</button>
          </div>
          <div id="pb-rank-msg" style="font-size:0.85rem; color:#10b981; margin-top:8px; height:1.2em; font-weight:bold;"></div>
        </div>
        ` : ''}

        <div style="display:flex; gap:12px; justify-content:center; flex-wrap:wrap;">
          <button class="btn-primary" id="pb-restart-btn">🔄 다시 시작하기</button>
          <button class="btn-primary" id="pb-gameover-home-btn" style="background:#3b82f6;">🏠 홈으로</button>
        </div>
      `;

      this.container.querySelector('.pb-board').appendChild(overlay);

      overlay.querySelector('#pb-restart-btn').addEventListener('click', () => {
        this.initGame(this.state.mode);
      });
      overlay.querySelector('#pb-gameover-home-btn')?.addEventListener('click', () => this.goHome());

      if (canSubmitRank) {
        const inputEl = overlay.querySelector('#pb-nick-input');
        const submitBtn = overlay.querySelector('#pb-submit-btn');
        const msgEl = overlay.querySelector('#pb-rank-msg');

        const doSubmit = () => {
          const nick = inputEl.value.trim();
          if (!nick) { msgEl.textContent = '⚠️ 닉네임을 입력해주세요!'; msgEl.style.color = '#f87171'; inputEl.focus(); return; }
          submitBtn.disabled = true; inputEl.disabled = true; submitBtn.style.opacity = '0.5';
          msgEl.style.color = '#38bdf8'; msgEl.textContent = '⏳ 서버에 랭킹 등록 중...';

          window.submitRanking('피타고라스 블록 퍼즐', this.state.score, true, nick, 'board-pythagoras-blocks');

          try {
            let ranks = JSON.parse(localStorage.getItem('rank_board-pythagoras-blocks') || '[]');
            ranks.push({ nickname: nick, score: this.state.score, date: new Date().toLocaleDateString('ko-KR') });
            ranks.sort((a, b) => (b.score || 0) - (a.score || 0));
            localStorage.setItem('rank_board-pythagoras-blocks', JSON.stringify(ranks.slice(0, 50)));
          } catch(e) {}

          setTimeout(() => {
            msgEl.style.color = '#10b981'; msgEl.textContent = '✅ 명예의 전당 등록 완료!';
            this.loadLeaderboard();
          }, 600);
        };

        submitBtn.addEventListener('click', doSubmit);
        inputEl.addEventListener('keypress', (e) => { if (e.key === 'Enter') doSubmit(); });
        setTimeout(() => inputEl.focus(), 100);
      }
    },

    destroy() {
      if (window.MathLabCleanup) window.MathLabCleanup.clearTimers(this.timers);
      this.timers.forEach(clearTimeout);
      if (this.timerInterval) clearInterval(this.timerInterval);
      if (this.animationFrameId) cancelAnimationFrame(this.animationFrameId);
      const host = document.getElementById('pythagoras-blocks-force-host'); if (host) host.remove();
      if (this.container) this.container.innerHTML = '';
      this.container = null;
    },

    loadLeaderboard() {
      try {
        if (typeof window.loadGameLeaderboard === 'function') {
          window.loadGameLeaderboard('피타고라스 블록 퍼즐', true, 'pb-leaderboard-container');
        } else {
          const localRanks = JSON.parse(localStorage.getItem('rank_board-pythagoras-blocks') || '[]');
          this.renderRankList(localRanks.slice(0, 5));
        }
      } catch (e) {
        const localRanks = JSON.parse(localStorage.getItem('rank_board-pythagoras-blocks') || '[]');
        this.renderRankList(localRanks.slice(0, 5));
      }
    },

    renderRankList(ranks) {
      const el = this.container?.querySelector('#pb-leaderboard-container');
      if (!el) return;
      if (!ranks || ranks.length === 0) {
        el.innerHTML = '<div style="text-align:center; color:#94a3b8; padding: 14px 0;">아직 등록된 랭킹이 없습니다. 첫 주인공이 되어보세요!</div>';
        return;
      }
      el.innerHTML = ranks.map((r, i) => `
        <div class="rank-item">
          <div><span class="rank-num">${i + 1}위</span> ${escapeHTML(r.nickname || '익명')}</div>
          <div class="rank-score">${r.score || 0}점</div>
        </div>
      `).join('');
    }
  };

  window.PythagorasBlocks = PythagorasBlocks;

  window.initPythagorasBlocksGame = function() {
    const targetEl = document.getElementById('game-pythagoras-blocks-app');
    if (targetEl) PythagorasBlocks.mount(targetEl);
    else PythagorasBlocks.mount();
  };

  window.launchPythagorasBlocksGame = function() {
    if (typeof window.openApp === 'function') window.openApp('game-pythagoras-blocks-app');
    else PythagorasBlocks.mount();
  };

  function registerPythagorasBlocks() {
    if (typeof window.MathLabGames !== 'undefined' && typeof window.MathLabGames.register === 'function') {
      if (!window.MathLabGames.get('pythagoras-blocks')) {
        window.MathLabGames.register({
          id: 'pythagoras-blocks',
          title: '피타고라스 블록 퍼즐',
          icon: '🧱',
          sourceType: 'new',
          mount(container, context) { PythagorasBlocks.mount(container, context); },
          reset() { if (typeof PythagorasBlocks.initGame === 'function') PythagorasBlocks.initGame('쉬움'); },
          destroy() { PythagorasBlocks.destroy(); }
        });
      }
    }
  }

  registerPythagorasBlocks();
  window.addEventListener('DOMContentLoaded', registerPythagorasBlocks);
  setTimeout(registerPythagorasBlocks, 100);
  setTimeout(registerPythagorasBlocks, 500);
})();
</script>
