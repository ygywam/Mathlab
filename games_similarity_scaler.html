<!--
  Gen-3 수학 실험실 교과수학 개념 앱: 닮음비 크기 조정기 (similarity-scaler)
  오로지 스타일((style))과 스크립트((script))로만 구성된 표준 템플릿
  (푸터 밖 밀림 방지 마운트 로직, LegacyBridge 홈버튼 연동, 5대 감사 기준 완벽 준수)
-->
<style>
  /* ==========================================================================
     Gen-3 전용 스코프 스타일 (.game-similarity-scaler)
     교과수학 개념(concept) 테마: 모던 고대비 다크 네이비/슬레이트
     ========================================================================== */
  .game-similarity-scaler {
    --bg-primary: #0f172a;
    --bg-surface: #1e293b;
    --bg-card: rgba(30, 41, 59, 0.88);
    --accent-color: #38bdf8;
    --accent-glow: rgba(56, 189, 248, 0.35);
    --success-color: #22c55e;
    --success-glow: rgba(34, 197, 94, 0.4);
    --warning-color: #f59e0b;
    --danger-color: #ef4444;
    --text-main: #f8fafc;
    --text-sub: #94a3b8;
    --border-color: #3b82f6;

    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #172554 100%);
    color: var(--text-main);
    min-height: 100%;
    width: 100%;
    padding: 24px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
    user-select: none;
    -webkit-user-select: none;
    border-radius: 24px;
    border: 3px solid var(--border-color);
    box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.8);
    position: relative;
  }

  .game-similarity-scaler * {
    box-sizing: border-box;
  }

  /* 1. 반응형 한 줄 정돈 헤더 */
  .game-similarity-scaler .app-header {
    width: 100%;
    max-width: 1020px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #0f172a;
    padding: 16px 22px;
    border-radius: 20px;
    border: 2px solid var(--border-color);
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 14px;
  }

  .game-similarity-scaler .title-area {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .game-similarity-scaler .app-title {
    font-size: clamp(1.4rem, 2.4vw, 2.0rem);
    font-weight: 900;
    margin: 0;
    color: #ffffff !important;
    text-shadow: 0 0 15px rgba(255, 255, 255, 0.7);
  }

  .game-similarity-scaler .app-badge {
    background: #1e1b4b;
    color: #fef08a;
    font-size: 0.88rem;
    font-weight: 800;
    padding: 6px 14px;
    border-radius: 20px;
    border: 1.5px solid #f59e0b;
    box-shadow: 0 0 10px rgba(245, 158, 11, 0.25);
  }

  /* 우측 상태 바 & 균등 버튼 그룹 */
  .game-similarity-scaler .stats-bar {
    display: flex;
    gap: 10px;
    font-weight: 800;
    font-size: 0.95rem;
    flex-wrap: wrap;
    align-items: center;
    justify-content: flex-end;
    flex: 1 1 auto;
  }

  .game-similarity-scaler .stat-badge {
    background: #0f172a;
    padding: 8px 14px;
    border-radius: 14px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    border: 2px solid #60a5fa;
    color: #ffffff;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-weight: 900;
    font-size: 0.95rem;
    white-space: nowrap;
  }
  .game-similarity-scaler .stat-badge.score { color: #fef08a; border-color: #f59e0b; background: #271c14; }
  .game-similarity-scaler .stat-badge.round { color: #ffffff; border-color: #38bdf8; background: #0f172a; }
  .game-similarity-scaler .stat-badge.timer { color: #fca5a5; border-color: #ef4444; background: #451a1a; }

  /* 버튼 공통 및 균등 반응형 정렬 (가장 긴 텍스트 기준 동적 분할) */
  .game-similarity-scaler .header-btn {
    padding: 9px 15px;
    border-radius: 14px;
    font-size: 0.95rem;
    font-weight: 900;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: all 0.2s;
    border: 2px solid transparent;
    white-space: nowrap;
    flex: 1 1 126px;
  }

  .game-similarity-scaler .btn-howto {
    background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
    color: #ffffff !important;
    border-color: #93c5fd;
    box-shadow: 0 4px 10px rgba(59, 130, 246, 0.4);
  }
  .game-similarity-scaler .btn-howto:hover {
    transform: translateY(-2px);
    background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  }

  .game-similarity-scaler .btn-reset {
    background: #1e293b;
    color: #ffffff !important;
    border-color: #60a5fa;
  }
  .game-similarity-scaler .btn-reset:hover {
    background: #334155;
    border-color: #93c5fd;
    transform: translateY(-2px);
  }

  .game-similarity-scaler .btn-home {
    background: #475569;
    color: #ffffff !important;
    border-color: #94a3b8;
  }
  .game-similarity-scaler .btn-home:hover {
    background: #64748b;
    transform: translateY(-2px);
  }

  /* 2. 메인 컨테이너 */
  .game-similarity-scaler .main-container {
    width: 100%;
    max-width: 1020px;
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
  }

  .game-similarity-scaler .diff-bar {
    display: flex;
    justify-content: center;
    gap: 10px;
    background: #090d16;
    padding: 8px;
    border-radius: 16px;
    border: 2px solid #3b82f6;
    flex-wrap: wrap;
  }

  .game-similarity-scaler .diff-btn {
    flex: 1;
    min-width: 160px;
    padding: 11px 14px;
    border-radius: 12px;
    background: transparent;
    color: #cbd5e1;
    border: none;
    font-weight: 900;
    font-size: 0.95rem;
    cursor: pointer;
    transition: all 0.2s;
  }

  .game-similarity-scaler .diff-btn.active {
    background: #3b82f6;
    color: #ffffff !important;
    box-shadow: 0 4px 10px rgba(0,0,0,0.5);
  }

  .game-similarity-scaler .mission-board {
    background: radial-gradient(circle at center, #1e1b4b 0%, #090d16 80%);
    border: 3px solid #3b82f6;
    border-radius: 22px;
    padding: 20px;
    text-align: center;
    position: relative;
    box-shadow: 0 10px 25px rgba(0,0,0,0.7);
  }

  .game-similarity-scaler .mission-title {
    font-size: 15px;
    color: #cbd5e1;
    margin: 0 0 8px 0;
    font-weight: 700;
  }

  .game-similarity-scaler .mission-target {
    font-size: 26px;
    font-weight: 900;
    color: #ffffff;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .game-similarity-scaler .mission-target .highlight {
    color: #fef08a;
    background: rgba(245, 158, 11, 0.25);
    padding: 4px 16px;
    border-radius: 10px;
    border: 2px solid #f59e0b;
  }

  .game-similarity-scaler .workspace {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }

  @media (max-width: 768px) {
    .game-similarity-scaler .workspace {
      grid-template-columns: 1fr;
    }
  }

  .game-similarity-scaler .canvas-card {
    background: #0f172a;
    border: 2px solid #3b82f6;
    border-radius: 18px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    min-height: 380px;
  }

  .game-similarity-scaler .canvas-title {
    font-size: 16px;
    font-weight: 800;
    margin: 0 0 12px 0;
    color: #ffffff;
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    justify-content: space-between;
  }

  .game-similarity-scaler .svg-container {
    width: 100%;
    flex-grow: 1;
    background: #060913;
    border-radius: 14px;
    border: 2px solid #475569;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .game-similarity-scaler .svg-grid {
    position: absolute;
    inset: 0;
    background-image: 
      linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
    background-size: 20px 20px;
    pointer-events: none;
  }

  .game-similarity-scaler svg {
    width: 100%;
    height: 100%;
    max-height: 280px;
    overflow: visible;
  }

  .game-similarity-scaler .shape-polygon {
    transition: fill 0.3s ease, stroke 0.3s ease, filter 0.3s ease;
  }

  .game-similarity-scaler .shape-polygon.matched {
    fill: rgba(34, 197, 94, 0.25) !important;
    stroke: #22c55e !important;
    filter: drop-shadow(0 0 10px rgba(34, 197, 94, 0.6));
  }

  .game-similarity-scaler .shape-polygon.error {
    fill: rgba(239, 68, 68, 0.25) !important;
    stroke: #ef4444 !important;
    filter: drop-shadow(0 0 10px rgba(239, 68, 68, 0.6));
  }

  .game-similarity-scaler .label-text {
    font-size: 13px;
    font-weight: 800;
    fill: #ffffff;
    text-anchor: middle;
    dominant-baseline: middle;
    filter: drop-shadow(0 1px 3px rgba(0,0,0,0.9));
  }

  /* 3. 컨트롤 패널 */
  .game-similarity-scaler .controls-panel {
    background: #1e293b;
    border: 2px solid #3b82f6;
    border-radius: 20px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .game-similarity-scaler .slider-row {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .game-similarity-scaler .scale-label {
    font-size: 16px;
    font-weight: 800;
    min-width: 110px;
    color: #93c5fd;
  }

  .game-similarity-scaler .scale-val {
    font-size: 24px;
    font-weight: 900;
    color: #fef08a;
    min-width: 80px;
    text-align: right;
  }

  .game-similarity-scaler input[type="range"] {
    flex-grow: 1;
    height: 10px;
    border-radius: 5px;
    background: #0f172a;
    accent-color: #3b82f6;
    outline: none;
    cursor: pointer;
  }

  .game-similarity-scaler .buttons-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }

  .game-similarity-scaler .fine-tune-group {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .game-similarity-scaler .btn-sm {
    padding: 8px 12px;
    font-size: 13px;
    font-weight: 800;
    border-radius: 8px;
    background: #0f172a;
    border: 1px solid #475569;
    color: #cbd5e1;
    cursor: pointer;
    transition: all 0.2s;
  }

  .game-similarity-scaler .btn-sm:hover {
    background: #334155;
    color: white;
  }

  .game-similarity-scaler .btn-action {
    background: #1e293b;
    color: #ffffff !important;
    border: 2px solid #60a5fa;
    padding: 10px 16px;
    border-radius: 14px;
    font-size: 0.95rem;
    font-weight: 900;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s;
  }
  .game-similarity-scaler .btn-action:hover {
    background: #334155;
    border-color: #93c5fd;
    transform: translateY(-2px);
  }

  .game-similarity-scaler .btn-submit {
    background: linear-gradient(135deg, #16a34a, #059669);
    border: 2px solid #86efac;
    color: white;
    font-weight: 900;
    padding: 12px 28px;
    font-size: 16px;
    border-radius: 14px;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(22, 163, 74, 0.4);
    transition: all 0.2s;
  }

  .game-similarity-scaler .btn-submit:hover {
    transform: translateY(-2px);
    background: linear-gradient(135deg, #15803d, #047857);
  }

  .game-similarity-scaler .hint-box {
    background: #271c14;
    border: 2px solid #f59e0b;
    padding: 14px;
    border-radius: 14px;
    color: #fef08a;
    font-size: 14px;
    font-weight: 800;
    line-height: 1.5;
    display: none;
    animation: fadeIn 0.3s;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-5px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* 4. 모달 스타일 */
  .game-similarity-scaler .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.88);
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }

  .game-similarity-scaler .modal-overlay.active {
    opacity: 1;
    pointer-events: auto;
  }

  .game-similarity-scaler .modal-card {
    background: #0f172a;
    border: 3px solid #3b82f6;
    border-radius: 24px;
    padding: 28px;
    width: 90%;
    max-width: 520px;
    box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8);
    text-align: center;
    transform: scale(0.9);
    transition: transform 0.3s ease;
    color: #ffffff;
  }

  .game-similarity-scaler .modal-overlay.active .modal-card {
    transform: scale(1);
  }

  .game-similarity-scaler .modal-title {
    font-size: 24px;
    font-weight: 900;
    margin: 0 0 16px 0;
    color: #ffffff;
    text-shadow: 0 0 15px rgba(255,255,255,0.7);
  }

  .game-similarity-scaler .modal-desc {
    font-size: 15px;
    color: #cbd5e1;
    line-height: 1.6;
    margin-bottom: 24px;
    text-align: left;
    font-weight: 700;
  }
</style>

<script>
(function() {
  let toastTimer = null;
  function showToast(msg, isError = false) {
    let host = document.getElementById('similarity-scaler-root');
    if (!host) return;
    let toast = host.querySelector('#ss-toast');
    if (!toast) {
      toast = document.createElement('div');
      toast.id = 'ss-toast';
      toast.style.cssText = 'position:fixed; top:20px; left:50%; transform:translateX(-50%); padding:12px 24px; border-radius:12px; font-weight:800; font-size:1rem; z-index:99999; box-shadow:0 10px 25px rgba(0,0,0,0.5); transition:all 0.3s; text-align:center; min-width:300px; pointer-events:none; opacity:0;';
      host.appendChild(toast);
    }
    toast.style.background = isError ? '#ef4444' : '#10b981';
    toast.style.color = isError ? '#ffffff' : '#0f172a';
    toast.innerHTML = msg;
    void toast.offsetWidth;
    toast.style.opacity = '1';
    toast.style.top = '20px';
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      toast.style.opacity = '0';
      toast.style.top = '0px';
    }, 3000);
  }

  const SHAPES = [
    {
      type: 'triangle',
      name: '직각삼각형',
      pts: [[-60, 40], [60, 40], [-60, -40]],
      baseLen: [120, 80, 144.2]
    },
    {
      type: 'equilateral',
      name: '정삼각형',
      pts: [[0, -60], [69.3, 60], [-69.3, 60]],
      baseLen: [138.6, 138.6, 138.6]
    },
    {
      type: 'rectangle',
      name: '직사각형',
      pts: [[-70, -40], [70, -40], [70, 40], [-70, 40]],
      baseLen: [140, 80, 140, 80]
    },
    {
      type: 'trapezoid',
      name: '사다리꼴',
      pts: [[-40, -50], [40, -50], [80, 50], [-80, 50]],
      baseLen: [80, 107.7, 160, 107.7]
    },
    {
      type: 'pentagon',
      name: '정오각형',
      pts: [[0, -65], [61.8, -20], [38.2, 55], [-38.2, 55], [-61.8, -20]],
      baseLen: [76.5, 76.5, 76.5, 76.5, 76.5]
    }
  ];

  const state = {
    difficulty: 'easy',
    round: 1,
    maxRound: 5,
    score: 0,
    timer: 60,
    timerId: null,
    showLabels: true,
    hintUsed: false,
    currentQuestion: null,
    currentScale: 1.00
  };

  const SimilarityScaler = {
    container: null,

    mount(container, context = {}) {
      // 1. 컨테이너 자동 타겟팅
      let target = typeof container === 'string' ? document.querySelector(container) : container;
      if (!target || !(target instanceof HTMLElement)) {
        target = window.MathLabUtils?.getMountContainer ? window.MathLabUtils.getMountContainer(container) : document.getElementById('mathlab-view');
      }
      if (!target) target = document.getElementById('new-root') || document.getElementById('game-container');

      // 🌟 [핵심] 푸터 아래로 밀려나지 않도록 호스트 생성 및 푸터 바로 위 삽입 보장
      if (!target || target === document.body) {
        let host = document.getElementById('similarity-scaler-force-host');
        if (!host) {
          host = document.createElement('div');
          host.id = 'similarity-scaler-force-host';
          host.style.cssText = 'width:100%; max-width:1040px; margin:0 auto; padding:16px; box-sizing:border-box; z-index:999; position:relative; background:#0f172a; border-radius:24px;';
          const footer = document.querySelector('footer, #footer, .app-footer, #legacy-footer, .mathlab-footer');
          if (footer && footer.parentNode) {
            footer.parentNode.insertBefore(host, footer);
          } else {
            document.body.appendChild(host);
          }
        }
        target = host;
      }
      this.container = target;

      // 2. 가시성 안전 복구
      if (this.container.style) {
        this.container.style.display = '';
        this.container.style.visibility = '';
        this.container.style.opacity = '1';
      }

      let parent = this.container.parentElement;
      while (parent && parent !== document.body && parent !== document.documentElement) {
        if (parent.style && parent.style.display === 'none') parent.style.display = '';
        if (parent.style && parent.style.visibility === 'hidden') parent.style.visibility = '';
        parent = parent.parentElement;
      }

      this.restoreGlobalNavigation();
      window.scrollTo({ top: 0, left: 0, behavior: 'smooth' });

      // 3. 렌더링 (교과수학 개념 규격: 명예의 전당 없음, 균등 헤더 버튼)
      target.innerHTML = `
        <div class="game-similarity-scaler" id="similarity-scaler-root">
          <header class="app-header">
            <div class="title-area">
              <span style="font-size: 32px;">📏</span>
              <div>
                <h1 class="app-title">닮음비 크기 조정기</h1>
              </div>
              <span class="app-badge">중·고 교과수학 개념</span>
            </div>
            <div class="stats-bar">
              <div class="stat-badge round">🚩 문항: <span id="ss-round">1 / 5</span></div>
              <div class="stat-badge score">⭐ 탐구점수: <span id="ss-score">0</span>점</div>
              <div class="stat-badge timer" id="ss-timer-box" style="display: none;">⏱️ 남은 시간: <span id="ss-timer">60s</span></div>
              <button class="header-btn btn-howto" id="ss-btn-howto">❓ 탐구 안내</button>
              <button class="header-btn btn-reset" id="ss-btn-reset">🔄 처음부터</button>
              <button class="header-btn btn-home" id="ss-btn-home">🏠 홈으로</button>
            </div>
          </header>

          <main class="main-container">
            <div class="diff-bar">
              <button class="diff-btn active" data-diff="easy">🟢 쉬움 (정수비·기본도형)</button>
              <button class="diff-btn" data-diff="normal">🟡 보통 (분수비·비례식)</button>
              <button class="diff-btn" data-diff="hard">🔴 도전 (넓이비·제한시간)</button>
            </div>

            <div class="mission-board">
              <p class="mission-title" id="ss-mission-desc">기준 도형과 목표 닮음비에 정확히 일치하도록 조절 바를 움직이세요!</p>
              <div class="mission-target" id="ss-mission-target">
                목표 닮음비 <span class="highlight" id="ss-target-ratio-text">1 : 2</span>
              </div>
            </div>

            <div class="workspace">
              <div class="canvas-card">
                <div class="canvas-title">
                  <span>🔹 기준 도형 (Reference)</span>
                  <span style="font-size:13px; color:#94a3b8;" id="ss-ref-scale-tag">배율 1.00x</span>
                </div>
                <div class="svg-container">
                  <div class="svg-grid"></div>
                  <svg id="ss-svg-ref" viewBox="-230 -190 460 380"></svg>
                </div>
              </div>

              <div class="canvas-card">
                <div class="canvas-title">
                  <span>🔸 조정 도형 (Target)</span>
                  <span style="font-size:13px; color:#38bdf8; font-weight:800;" id="ss-cur-scale-tag">현재 배율 1.00x</span>
                </div>
                <div class="svg-container">
                  <div class="svg-grid"></div>
                  <svg id="ss-svg-cur" viewBox="-230 -190 460 380"></svg>
                </div>
              </div>
            </div>

            <div class="controls-panel">
              <div class="slider-row">
                <span class="scale-label">크기 배율 조절</span>
                <input type="range" id="ss-scale-slider" min="0.20" max="3.00" step="0.01" value="1.00">
                <span class="scale-val" id="ss-slider-val">1.00x</span>
              </div>

              <div class="buttons-row">
                <div class="fine-tune-group">
                  <button class="btn-sm" id="ss-btn-sub-05">-- 0.05</button>
                  <button class="btn-sm" id="ss-btn-sub-01">- 0.01</button>
                  <button class="btn-sm" id="ss-btn-add-01">+ 0.01</button>
                  <button class="btn-sm" id="ss-btn-add-05">++ 0.05</button>
                </div>

                <div style="display:flex; gap:10px; flex-wrap:wrap;">
                  <button class="btn-action" id="ss-btn-hint" style="border-color:#f59e0b; color:#fbbf24 !important;">💡 비례식 힌트 (-5점)</button>
                  <button class="btn-action" id="ss-btn-toggle-label">📏 길이 수치 보기</button>
                  <button class="btn-submit" id="ss-btn-submit">✅ 정답 확정</button>
                </div>
              </div>

              <div class="hint-box" id="ss-hint-box"></div>
            </div>
          </main>

          <!-- 탐구 안내 모달 -->
          <div class="modal-overlay" id="ss-howto-modal">
            <div class="modal-card">
              <h2 class="modal-title">📏 닮음비 크기 조정기 탐구 안내</h2>
              <div class="modal-desc">
                <p><strong>도형의 닮음(Similarity)이란?</strong><br>
                한 도형을 일정한 비율로 확대하거나 축소한 도형이 다른 도형과 합동이 될 때, 두 도형은 서로 '닮음' 관계에 있습니다.</p>
                <ul style="padding-left: 20px; margin: 10px 0;">
                  <li><strong>닮음비 (Length Ratio):</strong> 대응변의 길이의 비입니다. (예: 1 : 2 이면 길이가 2배)</li>
                  <li><strong>넓이비 (Area Ratio):</strong> 닮음비가 $m : n$일 때, 넓이비는 $m^2 : n^2$이 됩니다!</li>
                </ul>
                <p><strong>💡 탐구 및 조작 방법:</strong><br>
                - 하단 슬라이더나 미세 조정 버튼(+/-)을 사용하여 오른쪽 도형의 크기 배율을 조절하세요.<br>
                - 목표 비와 일치하여 오차 범위(±0.035) 내에 도달하면 초록색 빛이 켜집니다.<br>
                - 비례식이 헷갈릴 땐 [💡 비례식 힌트]를 확인해 보세요!</p>
              </div>
              <button class="btn-submit" id="ss-howto-close" style="width:100%; justify-content:center;">이해했습니다! 탐구 시작</button>
            </div>
          </div>

          <!-- 완료 축하 모달 (명예의 전당 없음) -->
          <div class="modal-overlay" id="ss-complete-modal">
            <div class="modal-card">
              <div style="font-size:48px; margin-bottom:10px;">🎉📏</div>
              <h2 class="modal-title">탐구 미션 완료!</h2>
              <div class="modal-desc" style="text-align:center;">
                <p style="font-size:16px; color:#fef08a; margin-bottom:16px;">5개 문항의 닮음비 크기 조정을 성공적으로 마쳤습니다!</p>
                <div style="background:#1e1b4b; border:2px solid #3b82f6; border-radius:16px; padding:16px; margin-bottom:16px;">
                  <div style="font-size:14px; color:#cbd5e1; margin-bottom:4px;">최종 탐구 달성 점수</div>
                  <div style="font-size:32px; font-weight:900; color:#38bdf8;" id="ss-final-score-text">100점</div>
                </div>
                <p style="font-size:14px; color:#94a3b8; line-height:1.4;">
                  길이비가 $m : n$일 때 넓이비는 $m^2 : n^2$이 되는 기하학적 원리를 잊지 마세요!
                </p>
              </div>
              <div style="display:flex; gap:10px;">
                <button class="header-btn btn-reset" id="ss-complete-retry" style="flex:1;">🔄 다시 탐구하기</button>
                <button class="header-btn btn-howto" id="ss-complete-home" style="flex:1;">🏠 홈으로 이동</button>
              </div>
            </div>
          </div>
        </div>
      `;

      this.bindEvents();
      this.startNewGame();
    },

    restoreGlobalNavigation() {
      const navElements = document.querySelectorAll('header, .navbar, #app-header, .top-bar, #floating-home-btn, .floating-home, [id*="home"], [class*="floating"]');
      navElements.forEach(el => { if (el && el.style && el.style.display === 'none') el.style.display = ''; });
    },

    bindEvents() {
      document.querySelectorAll('.game-similarity-scaler .diff-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          document.querySelectorAll('.game-similarity-scaler .diff-btn').forEach(b => b.classList.remove('active'));
          e.target.classList.add('active');
          state.difficulty = e.target.getAttribute('data-diff');
          this.startNewGame();
        });
      });

      const slider = document.getElementById('ss-scale-slider');
      if (slider) {
        slider.addEventListener('input', (e) => {
          state.currentScale = parseFloat(e.target.value);
          this.updateView();
        });
      }

      document.getElementById('ss-btn-sub-05')?.addEventListener('click', () => this.adjustScale(-0.05));
      document.getElementById('ss-btn-sub-01')?.addEventListener('click', () => this.adjustScale(-0.01));
      document.getElementById('ss-btn-add-01')?.addEventListener('click', () => this.adjustScale(+0.01));
      document.getElementById('ss-btn-add-05')?.addEventListener('click', () => this.adjustScale(+0.05));

      document.getElementById('ss-btn-toggle-label')?.addEventListener('click', () => {
        state.showLabels = !state.showLabels;
        const toggleBtn = document.getElementById('ss-btn-toggle-label');
        if (toggleBtn) toggleBtn.textContent = state.showLabels ? '🚫 길이 수치 숨기기' : '📏 길이 수치 보기';
        this.renderSVG();
      });

      document.getElementById('ss-btn-hint')?.addEventListener('click', () => this.showHint());
      document.getElementById('ss-btn-submit')?.addEventListener('click', () => this.submitAnswer());

      document.getElementById('ss-btn-howto')?.addEventListener('click', () => openModal('ss-howto-modal'));
      document.getElementById('ss-howto-close')?.addEventListener('click', () => closeModal('ss-howto-modal'));
      document.getElementById('ss-btn-reset')?.addEventListener('click', () => this.resetGame());
      document.getElementById('ss-btn-home')?.addEventListener('click', () => this.goHome());

      document.getElementById('ss-complete-retry')?.addEventListener('click', () => {
        closeModal('ss-complete-modal');
        this.startNewGame();
      });
      document.getElementById('ss-complete-home')?.addEventListener('click', () => {
        closeModal('ss-complete-modal');
        this.goHome();
      });

      document.querySelectorAll('.game-similarity-scaler .modal-overlay').forEach(modal => {
        modal.addEventListener('click', (e) => {
          if (e.target === modal) modal.classList.remove('active');
        });
      });
    },

    adjustScale(delta) {
      let val = Math.round((state.currentScale + delta) * 100) / 100;
      val = Math.max(0.20, Math.min(3.00, val));
      state.currentScale = val;
      const slider = document.getElementById('ss-scale-slider');
      if (slider) slider.value = val;
      this.updateView();
    },

    startNewGame() {
      state.round = 1;
      state.score = 0;
      if (state.timerId) clearInterval(state.timerId);

      const timerBox = document.getElementById('ss-timer-box');
      if (state.difficulty === 'hard') {
        state.timer = 75;
        if (timerBox) timerBox.style.display = 'inline-flex';
        const timerEl = document.getElementById('ss-timer');
        if (timerEl) timerEl.textContent = state.timer + 's';
        state.timerId = setInterval(() => {
          state.timer--;
          const el = document.getElementById('ss-timer');
          if (el) el.textContent = state.timer + 's';
          if (state.timer <= 0) {
            clearInterval(state.timerId);
            this.endGame('시간 종료!');
          }
        }, 1000);
      } else {
        if (timerBox) timerBox.style.display = 'none';
      }

      this.updateScoreBoard();
      this.generateQuestion();
    },

    generateQuestion() {
      state.hintUsed = false;
      const hintBox = document.getElementById('ss-hint-box');
      if (hintBox) hintBox.style.display = 'none';
      const hintBtn = document.getElementById('ss-btn-hint');
      if (hintBtn) hintBtn.disabled = false;

      const shapeObj = SHAPES[Math.floor(Math.random() * SHAPES.length)];

      let refScale = 1.00;
      let targetScale = 1.00;
      let ratioText = '';
      let isAreaChallenge = false;
      let hintMsg = '';

      if (state.difficulty === 'easy') {
        const ratios = [
          { r: [1, 2], ts: 2.00, txt: '1 : 2' },
          { r: [1, 3], ts: 3.00, txt: '1 : 3' },
          { r: [2, 1], ts: 0.50, txt: '2 : 1' },
          { r: [3, 1], ts: 0.33, txt: '3 : 1' }
        ];
        const sel = ratios[Math.floor(Math.random() * ratios.length)];
        targetScale = sel.ts;
        ratioText = sel.txt;
        hintMsg = `비례식: <strong>${sel.r[0]} : ${sel.r[1]} = 1 : x</strong> 이므로, 목표 배율은 정확히 <strong>${targetScale.toFixed(2)}배</strong>입니다!`;
      } else if (state.difficulty === 'normal') {
        const ratios = [
          { r: [2, 3], ts: 1.50, txt: '2 : 3' },
          { r: [3, 4], ts: 1.33, txt: '3 : 4' },
          { r: [4, 5], ts: 1.25, txt: '4 : 5' },
          { r: [3, 2], ts: 0.67, txt: '3 : 2' },
          { r: [5, 4], ts: 0.80, txt: '5 : 4' }
        ];
        const sel = ratios[Math.floor(Math.random() * ratios.length)];
        targetScale = sel.ts;
        ratioText = sel.txt;
        hintMsg = `비례식: <strong>${sel.r[0]} : ${sel.r[1]} = 1 : x</strong> <br>즉, $x = ${sel.r[1]} \\div ${sel.r[0]} = ${targetScale.toFixed(2)}$배 입니다!`;
      } else {
        const challenges = [
          { txt: '넓이가 4배가 되도록', ts: 2.00, area: true, h: '넓이비가 4배이면, 길이비(닮음비)는 $\\sqrt{4} = 2$배가 되어야 합니다!' },
          { txt: '넓이가 9배가 되도록', ts: 3.00, area: true, h: '넓이비가 9배이면, 길이비(닮음비)는 $\\sqrt{9} = 3$배가 되어야 합니다!' },
          { txt: '넓이가 1/4 (0.25배)이 되도록', ts: 0.50, area: true, h: '넓이가 $\\frac{1}{4}$이 되려면, 길이비는 $\\sqrt{\\frac{1}{4}} = 0.5$배가 되어야 합니다!' },
          { txt: '5 : 3 (길이비)', ts: 0.60, area: false, h: '$5 : 3 = 1 : x \\implies x = 0.60$배 입니다!' },
          { txt: '4 : 7 (길이비)', ts: 1.75, area: false, h: '$4 : 7 = 1 : x \\implies x = 1.75$배 입니다!' }
        ];
        const sel = challenges[Math.floor(Math.random() * challenges.length)];
        targetScale = sel.ts;
        ratioText = sel.txt;
        isAreaChallenge = sel.area;
        hintMsg = sel.h;
      }

      state.currentQuestion = {
        shape: shapeObj,
        refScale: refScale,
        targetScale: targetScale,
        ratioText: ratioText,
        isAreaChallenge: isAreaChallenge,
        hintMsg: hintMsg
      };

      let initScale = 1.00;
      if (Math.abs(initScale - targetScale) < 0.2) {
        initScale = (targetScale > 1.2) ? 0.60 : 1.80;
      }
      state.currentScale = initScale;
      const slider = document.getElementById('ss-scale-slider');
      if (slider) slider.value = initScale;

      const descEl = document.getElementById('ss-mission-desc');
      if (descEl) {
        descEl.textContent = isAreaChallenge
          ? `[넓이비 도전!] 오른쪽 조정 도형의 크기를 변경하여 기준 도형보다 ${ratioText} 만드세요!`
          : `기준 도형의 대응변 길이와 비교하여 목표 닮음비 [ ${ratioText} ]가 되도록 조절하세요!`;
      }
      const targetRatioEl = document.getElementById('ss-target-ratio-text');
      if (targetRatioEl) targetRatioEl.textContent = ratioText;
      const refScaleTag = document.getElementById('ss-ref-scale-tag');
      if (refScaleTag) refScaleTag.textContent = `기준 배율 (${refScale.toFixed(2)}x)`;

      this.updateView();
    },

    updateView() {
      const valEl = document.getElementById('ss-slider-val');
      if (valEl) valEl.textContent = state.currentScale.toFixed(2) + 'x';
      const curTag = document.getElementById('ss-cur-scale-tag');
      if (curTag) curTag.textContent = `현재 배율 (${state.currentScale.toFixed(2)}x)`;
      this.renderSVG();
    },

    renderSVG() {
      const q = state.currentQuestion;
      if (!q) return;

      const refSvg = document.getElementById('ss-svg-ref');
      const curSvg = document.getElementById('ss-svg-cur');
      if (!refSvg || !curSvg) return;

      refSvg.innerHTML = '';
      curSvg.innerHTML = '';

      const refPtsStr = q.shape.pts.map(p => `${p[0] * q.refScale},${p[1] * q.refScale}`).join(' ');
      refSvg.innerHTML += `<polygon points="${refPtsStr}" fill="rgba(56, 189, 248, 0.2)" stroke="#38bdf8" stroke-width="3" stroke-linejoin="round" />`;

      const curPtsStr = q.shape.pts.map(p => `${p[0] * state.currentScale},${p[1] * state.currentScale}`).join(' ');
      
      const diff = Math.abs(state.currentScale - q.targetScale);
      const isMatch = diff <= 0.035;
      const polyClass = isMatch ? 'shape-polygon matched' : 'shape-polygon';
      const strokeCol = isMatch ? '#22c55e' : '#f97316';
      const fillCol = isMatch ? 'rgba(34, 197, 94, 0.25)' : 'rgba(249, 115, 22, 0.25)';

      curSvg.innerHTML += `<polygon class="${polyClass}" points="${curPtsStr}" fill="${fillCol}" stroke="${strokeCol}" stroke-width="3.5" stroke-linejoin="round" />`;

      if (state.showLabels) {
        q.shape.pts.forEach((p, idx) => {
          const nextP = q.shape.pts[(idx + 1) % q.shape.pts.length];
          const mx = (p[0] + nextP[0]) / 2 * q.refScale;
          const my = (p[1] + nextP[1]) / 2 * q.refScale;
          const len = (q.shape.baseLen[idx] * q.refScale).toFixed(1);
          refSvg.innerHTML += `<text x="${mx}" y="${my}" class="label-text">${len}</text>`;
        });

        q.shape.pts.forEach((p, idx) => {
          const nextP = q.shape.pts[(idx + 1) % q.shape.pts.length];
          const mx = (p[0] + nextP[0]) / 2 * state.currentScale;
          const my = (p[1] + nextP[1]) / 2 * state.currentScale;
          const len = (q.shape.baseLen[idx] * state.currentScale).toFixed(1);
          curSvg.innerHTML += `<text x="${mx}" y="${my}" class="label-text" style="fill:${isMatch ? '#86efac' : '#fdba74'}">${len}</text>`;
        });
      }
    },

    showHint() {
      if (state.hintUsed) return;
      state.hintUsed = true;
      state.score = Math.max(0, state.score - 5);
      this.updateScoreBoard();

      const box = document.getElementById('ss-hint-box');
      if (box) {
        box.innerHTML = state.currentQuestion.hintMsg;
        box.style.display = 'block';
      }
      const hintBtn = document.getElementById('ss-btn-hint');
      if (hintBtn) hintBtn.disabled = true;
    },

    submitAnswer() {
      const q = state.currentQuestion;
      if (!q) return;

      const diff = Math.abs(state.currentScale - q.targetScale);
      if (diff <= 0.035) {
        let pts = 20;
        if (state.difficulty === 'hard') pts += 10;
        state.score += pts;
        this.updateScoreBoard();

        const curSvg = document.getElementById('ss-svg-cur');
        const poly = curSvg?.querySelector('polygon');
        if (poly) poly.style.filter = 'drop-shadow(0 0 20px #22c55e)';

        setTimeout(() => {
          if (state.round >= state.maxRound) {
            this.endGame('클리어 축하합니다!');
          } else {
            state.round++;
            this.updateScoreBoard();
            this.generateQuestion();
          }
        }, 600);
      } else {
        const curSvg = document.getElementById('ss-svg-cur');
        const poly = curSvg?.querySelector('polygon');
        if (poly) {
          poly.classList.add('error');
          setTimeout(() => poly.classList.remove('error'), 400);
        }
        showToast(`⚠️ 아쉽습니다! 현재 배율(${state.currentScale.toFixed(2)}x)이 목표와 다릅니다.<br>조금 더 미세 조정 버튼을 눌러 정확한 배율을 찾아보세요!`, true);
      }
    },

    updateScoreBoard() {
      const scoreEl = document.getElementById('ss-score');
      if (scoreEl) scoreEl.textContent = state.score;
      const roundEl = document.getElementById('ss-round');
      if (roundEl) roundEl.textContent = `${state.round} / ${state.maxRound}`;
    },

    endGame(msg) {
      if (state.timerId) clearInterval(state.timerId);

      if (state.difficulty === 'hard' && state.timer > 0) {
        state.score += Math.min(10, Math.floor(state.timer / 3));
      }
      this.updateScoreBoard();

      const finalScoreText = document.getElementById('ss-final-score-text');
      if (finalScoreText) finalScoreText.textContent = `${state.score}점`;
      openModal('ss-complete-modal');
    },

    resetGame() {
      this.startNewGame();
    },

    // 🌟 100% 동작하는 표준 안전 홈버튼 로직
    goHome() {
      this.destroy();

      // 1. 표준 브리지 최우선 호출
      if (window.LegacyBridge && typeof window.LegacyBridge.backHome === 'function') {
        try { window.LegacyBridge.backHome(); return; } catch(e) {}
      }
      if (typeof window.renderLegacyDashboardHome === 'function') {
        try { window.renderLegacyDashboardHome(); return; } catch(e) {}
      }
      if (typeof window.MathLabRenderHome === 'function') {
        try { window.MathLabRenderHome(); return; } catch(e) {}
      }

      // 2. 폴백: 수동 루트 전환 및 대시보드 활성화
      const mathlabRoot = document.getElementById('mathlab-root');
      const legacyRoot = document.getElementById('legacy-root');
      if (mathlabRoot) mathlabRoot.classList.add('hidden');
      if (legacyRoot) legacyRoot.classList.remove('hidden');

      const dashboard = document.getElementById('dashboard-screen') || document.getElementById('dashboard-view');
      if (dashboard) {
        dashboard.classList.add('active');
        if (dashboard.style) dashboard.style.display = '';
      }
      window.scrollTo({ top: 0, left: 0, behavior: 'smooth' });
    },

    destroy() {
      if (state.timerId) {
        clearInterval(state.timerId);
        state.timerId = null;
      }
      if (this.container) this.container.innerHTML = '';
    }
  };

  function openModal(id) {
    document.getElementById(id)?.classList.add('active');
  }

  function closeModal(id) {
    document.getElementById(id)?.classList.remove('active');
  }

  window.SimilarityScaler = SimilarityScaler;

  function registerSimilarityScaler() {
    if (typeof window.MathLabGames !== 'undefined' && typeof window.MathLabGames.register === 'function') {
      if (!window.MathLabGames.get?.('similarity-scaler')) {
        window.MathLabGames.register({
          id: 'similarity-scaler',
        title: '닮음비 크기 조정기',
        icon: '📏',
        category: 'concept',
        sourceType: 'new',
        mount(container, context) { SimilarityScaler.mount(container, context); },
        reset() { SimilarityScaler.resetGame(); },
        destroy() { SimilarityScaler.destroy(); },
          goHome() { SimilarityScaler.goHome(); }
        });
      }
    }
  }

  registerSimilarityScaler();
  window.addEventListener('DOMContentLoaded', registerSimilarityScaler);
  setTimeout(registerSimilarityScaler, 100);
  setTimeout(registerSimilarityScaler, 500);

  window.launchSimilarityScalerGame = function() {
    if (typeof window.MathLabGames !== 'undefined' && typeof window.MathLabGames.mount === 'function') {
      try {
        window.MathLabGames.mount('similarity-scaler');
        return;
      } catch(e) {}
    }
    SimilarityScaler.mount();
  };
})();
</script>
