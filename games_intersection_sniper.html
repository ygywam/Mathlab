<style>

<script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>

<script>
(function(){

var APP_ID = 'intersection-sniper';
var APP_TITLE = '두 그래프의 교점과 실근 해부학';
var ICON = '📡';
var FORCE = 'intersection-sniper-force-host';

var CW = 640, CH = 420;
var BOUND_X = 5.0, BOUND_Y = 5.0;

// Slide Guide Content
var SLIDE_GUIDE = [
  {
    title: '📡 그래프의 교점과 방정식 실근의 등가성',
    html: '<p>두 함수 <span class="math-tex" data-tex="y = f(x)"></span> 와 <span class="math-tex" data-tex="y = g(x)"></span> 의 <b>그래프 교점의 x좌표</b>는 방정식 <b><span class="math-tex" data-tex="f(x) = g(x)"></span> 의 실근</b>과 정확히 일치합니다.</p>' +
          '<div style="background:#f0f9ff; border:1px solid #bae6fd; padding:12px; border-radius:12px; margin:8px 0; text-align:center;">' +

          '</div>' +
          '<p>즉, 두 그래프 교점의 $x$좌표는 <b>차함수 <span class="math-tex" data-tex="h(x)"></span> 의 x절편</b>과 동치입니다.</p>'
  },
  {
    title: '📐 이차함수와 직선의 판별식 D',
    html: '<p>이차함수와 직선의 연립방정식 <span class="math-tex" data-tex="ax^2 + (b - m)x + (c - n) = 0"></span> 의 판별식 <span class="math-tex" data-tex="D"></span> 의 부호에 따라 교점 개수가 결정됩니다:</p>' +
          '<ul>' +
          '  <li><b><span class="math-tex" data-tex="D > 0"></span>:</b> 서로 다른 두 점에서 만남 (실근 2개)</li>' +

  }
];

var S = {
  host: null,

  a: 1.00,
  b: 0.00,
  c: -2.00,
  m: 1.00,
  n: 0.00,
  k: 0.20,
  showDiffFunc: true,
  x0: 1.00,
  mouseTracking: true,
  guidePage: 0
};

function $(id) { return document.getElementById(id); }

function renderMath(latex, container, displayMode) {
  if (typeof katex !== 'undefined' && container) {
    try {
      katex.render(latex, container, { throwOnError: false, displayMode: !!displayMode });
      return;
    } catch(e){}
  }
  if (container) container.textContent = latex;
}

function updateMathElements() {
  document.querySelectorAll('.math-tex').forEach(function(el) {
    var tex = el.getAttribute('data-tex');
    var isDisplay = el.getAttribute('data-display') === 'true';
    if (tex) renderMath(tex, el, isDisplay);
  });
}

function fx(x) {
  if (S.mode === 'quad_line') return S.a * x * x + S.b * x + S.c;
  if (S.mode === 'cubic_line') return S.a * x * x * x + S.b * x;
  if (S.mode === 'sin_line') return Math.sin(x);
  return 0;
}

function gx(x) {
  if (S.mode === 'sin_line') return S.k * x;
  return S.m * x + S.n;
}

function hx(x) { return fx(x) - gx(x); }

function findRoots() {
  var roots = [];
  if (S.mode === 'quad_line') {
    // ax^2 + (b-m)x + (c-n) = 0
    var A = S.a, B = S.b - S.m, C = S.c - S.n;
    if (A !== 0) {
      var D = B * B - 4 * A * C;
      if (D >= 0) {
        var r1 = (-B - Math.sqrt(D)) / (2 * A);
        var r2 = (-B + Math.sqrt(D)) / (2 * A);
        roots.push(r1);
        if (D > 0.0001) roots.push(r2);
      }
    }
  } else {
    // Numerical sampling for cubic or sin
    var step = 0.02;
    for (var x = -BOUND_X; x <= BOUND_X; x += step) {
      var y1 = hx(x), y2 = hx(x + step);
      if (y1 * y2 <= 0) {
        var root = x - y1 * step / (y2 - y1);
        if (!roots.some(function(r){ return Math.abs(r - root) < 0.1; })) {
          roots.push(root);
        }
      }
    }
  }
  return roots.sort(function(u, v){ return u - v; });
}

      try { footerEl.parentNode.insertBefore(host, footerEl); } catch(e){}
    }
    
    host.style.display = ''; host.style.visibility = 'visible'; host.style.opacity = '1';
    S.host = host;
    host.innerHTML = this.renderChrome();
    this.bindEvents();
    this.updateHUD();
    this.drawCanvas();

    h += '    <button type="button" class="tab-btn" data-tab="math">2. 📐 방정식 실근 & 판별식 D 이론</button>';
    h += '    <button type="button" class="tab-btn" data-tab="prob">3. 🧩 실전 교점 미적분 문제 (4선)</button>';

    /* TAB 1: Simulator */

    h += '      <div class="chip-bar">';

    /* Canvas */

    /* TAB 2: Math Model & Clean LaTeX */

  bindEvents: function() {
    var _this = this;
    var root = S.host.querySelector('#is-app-root');

    /* Tabs */
    root.querySelectorAll('.tab-btn').forEach(function(btn) {
      btn.onclick = function() {
        root.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
        this.classList.add('active');
        S.activeTab = this.getAttribute('data-tab');

        root.querySelector('#tab-sec-sim').style.display = (S.activeTab === 'sim') ? 'block' : 'none';
        root.querySelector('#tab-sec-math').style.display = (S.activeTab === 'math') ? 'block' : 'none';
        root.querySelector('#tab-sec-prob').style.display = (S.activeTab === 'prob') ? 'block' : 'none';

        updateMathElements();
      };
    });

    /* Mode Selection Buttons */
    root.querySelectorAll('.btn-mode').forEach(function(btn) {
      btn.onclick = function() {
        root.querySelectorAll('.btn-mode').forEach(function(b){ b.className = 'btn btn-mode'; });
        this.className = 'btn p btn-mode';
        S.mode = this.getAttribute('data-mode');
        _this.updateHUD();
        _this.drawCanvas();
      };
    });

    /* Sliders */
    var rngA = root.querySelector('#rng-a');
    var rngM = root.querySelector('#rng-m');
    var rngN = root.querySelector('#rng-n');
    var rngX0 = root.querySelector('#rng-x0');

    function updateVal(key, val, rngEl) {
      if (key === 'm' && S.mode === 'sin_line') S.k = Math.round(parseFloat(val) * 100) / 100;
      else S[key] = Math.round(parseFloat(val) * 100) / 100;

      if (rngEl) rngEl.value = S[key];
      _this.updateHUD();
      _this.drawCanvas();
    }

    rngA.oninput = function() { updateVal('a', this.value, rngA); };
    rngM.oninput = function() { updateVal('m', this.value, rngM); };
    rngN.oninput = function() { updateVal('n', this.value, rngN); };
    rngX0.oninput = function() { updateVal('x0', this.value, rngX0); };

    function bindWheel(el, key) {
      el.onwheel = function(e) {
        e.preventDefault();
        var delta = e.deltaY < 0 ? 0.01 : -0.01;
        var minV = parseFloat(el.min), maxV = parseFloat(el.max);
        var nVal = Math.min(maxV, Math.max(minV, S[key] + delta));
        updateVal(key, nVal, el);
      };
    }
    bindWheel(rngA, 'a');
    bindWheel(rngM, 'm');
    bindWheel(rngN, 'n');
    bindWheel(rngX0, 'x0');

    /* Canvas Mousemove & Click to toggle lock */
    var cv = root.querySelector('#is-cv');
    cv.onmousemove = function(e) {
      if (!S.mouseTracking) return;
      var rect = cv.getBoundingClientRect();
      var mouseX = e.clientX - rect.left;
      var pad = 40;
      var xVal = -BOUND_X + (mouseX - pad) / (CW - pad * 2) * (2 * BOUND_X);
      xVal = Math.min(BOUND_X - 0.1, Math.max(-BOUND_X + 0.1, xVal));
      updateVal('x0', xVal, rngX0);
    };

    cv.onclick = function() {
      S.mouseTracking = !S.mouseTracking;
    };

    /* Actions */
    root.querySelector('#btn-toggle-diff').onclick = function() {
      S.showDiffFunc = !S.showDiffFunc;
      _this.drawCanvas();
    };
    root.querySelector('#btn-reset-params').onclick = function() {
      updateVal('a', 1.00, rngA);
      updateVal('m', 1.00, rngM);
      updateVal('n', 0.00, rngN);
      updateVal('x0', 1.00, rngX0);
    };

    /* Quiz */
    root.querySelector('#btn-submit-quiz').onclick = function() {
      var val = (root.querySelector('#inp-quiz-ans').value || '').trim();
      var msgEl = root.querySelector('#lbl-quiz-msg');
      if (val === '1') {
        msgEl.innerHTML = '✅ <b>정답입니다!</b> x^2 - 2x + 1 = (x-1)^2 = 0 이므로 접하는 교점 1개입니다.';
        msgEl.style.color = '#059669';
      } else {
        msgEl.innerHTML = '❌ 오답입니다. (힌트: 중근을 가지는 1개 입니다)';
        msgEl.style.color = '#ef4444';
      }
    };

    /* Solutions Toggle */
    root.querySelectorAll('.btn-show-sol').forEach(function(btn) {
      btn.onclick = function() {
        var idx = this.getAttribute('data-idx');
        var solEl = root.querySelector('#sol-' + idx);
        if (solEl) {
          var isShown = solEl.style.display === 'block';
          solEl.style.display = isShown ? 'none' : 'block';
          this.textContent = isShown ? '💡 수학적 해설 보기' : '🙈 해설 닫기';
          updateMathElements();
        }
      };
    });

    /* Modal Open & Render Slide */
    root.querySelector('#btn-open-guide').onclick = function() {
      S.guidePage = 0;
      _this.renderSlideGuide();
      root.querySelector('#is-modal').classList.add('on');
    };
  },

  updateHUD: function() {
    var root = S.host.querySelector('#is-app-root');
    if (!root) return;

    var roots = findRoots();
    root.querySelector('#lbl-count-val').textContent = roots.length + '개';
    root.querySelector('#lbl-x0-val').textContent = S.x0.toFixed(2);

    root.querySelector('#lbl-a-slider').textContent = S.a.toFixed(2);
    root.querySelector('#lbl-m-slider').textContent = (S.mode === 'sin_line' ? S.k : S.m).toFixed(2);
    root.querySelector('#lbl-n-slider').textContent = S.n.toFixed(2);
    root.querySelector('#lbl-x0-slider').textContent = S.x0.toFixed(2);

    var discStr = '해당 없음';
    if (S.mode === 'quad_line') {
      var B = S.b - S.m, C = S.c - S.n;
      var D = B * B - 4 * S.a * C;
      discStr = D > 0.001 ? 'D > 0 (' + D.toFixed(2) + ')' : (Math.abs(D) <= 0.001 ? 'D = 0 (접함)' : 'D < 0 (만나지 않음)');
    }
    root.querySelector('#lbl-disc-val').textContent = discStr;

    var fxTex = '', gxTex = '', hxTex = '';
    if (S.mode === 'quad_line') {
      fxTex = 'f(x) = ' + S.a.toFixed(2) + 'x^2 ' + (S.b >= 0 ? '+ ' + S.b.toFixed(2) : '- ' + Math.abs(S.b).toFixed(2)) + 'x ' + (S.c >= 0 ? '+ ' + S.c.toFixed(2) : '- ' + Math.abs(S.c).toFixed(2));
      gxTex = 'g(x) = ' + S.m.toFixed(2) + 'x ' + (S.n >= 0 ? '+ ' + S.n.toFixed(2) : '- ' + Math.abs(S.n).toFixed(2));
      var B = S.b - S.m, C = S.c - S.n;
      hxTex = 'h(x) = ' + S.a.toFixed(2) + 'x^2 ' + (B >= 0 ? '+ ' + B.toFixed(2) : '- ' + Math.abs(B).toFixed(2)) + 'x ' + (C >= 0 ? '+ ' + C.toFixed(2) : '- ' + Math.abs(C).toFixed(2));
    } else if (S.mode === 'cubic_line') {
      fxTex = 'f(x) = ' + S.a.toFixed(2) + 'x^3 ' + (S.b >= 0 ? '+ ' + S.b.toFixed(2) : '- ' + Math.abs(S.b).toFixed(2)) + 'x';
      gxTex = 'g(x) = ' + S.m.toFixed(2) + 'x ' + (S.n >= 0 ? '+ ' + S.n.toFixed(2) : '- ' + Math.abs(S.n).toFixed(2));
      hxTex = 'h(x) = ' + S.a.toFixed(2) + 'x^3 ' + ((S.b - S.m) >= 0 ? '+ ' + (S.b - S.m).toFixed(2) : '- ' + Math.abs(S.b - S.m).toFixed(2)) + 'x ' + (-S.n >= 0 ? '+ ' + (-S.n).toFixed(2) : '- ' + Math.abs(-S.n).toFixed(2));
    } else {
      fxTex = 'f(x) = \\sin(x)';
      gxTex = 'g(x) = ' + S.k.toFixed(2) + 'x';
      hxTex = 'h(x) = \\sin(x) ' + (-S.k >= 0 ? '+ ' + (-S.k).toFixed(2) : '- ' + Math.abs(-S.k).toFixed(2)) + 'x';
    }

    var elFx = root.querySelector('#lbl-math-fx');
    var elGx = root.querySelector('#lbl-math-gx');
    var elHx = root.querySelector('#lbl-math-hx');

    if (elFx) { elFx.setAttribute('data-tex', fxTex); renderMath(fxTex, elFx, false); }
    if (elGx) { elGx.setAttribute('data-tex', gxTex); renderMath(gxTex, elGx, false); }
    if (elHx) { elHx.setAttribute('data-tex', hxTex); renderMath(hxTex, elHx, false); }
  },

  worldToPx: function(x, y) {
    var pad = 40;
    return {
      X: pad + (x + BOUND_X) / (2 * BOUND_X) * (CW - pad * 2),
      Y: CH / 2 - (y / BOUND_Y) * (CH / 2 - 20)
    };
  },

  drawCanvas: function() {
    var root = S.host.querySelector('#is-app-root');
    if (!root) return;
    var cv = root.querySelector('#is-cv');
    if (!cv) return;
    var ctx = cv.getContext('2d');

    ctx.clearRect(0, 0, CW, CH);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, CW, CH);

    var _this = this;
    var pad = 40;

    // Grid & Axes
    var o = _this.worldToPx(0, 0);
    ctx.strokeStyle = '#e2e8f0';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(pad, o.Y); ctx.lineTo(CW - pad, o.Y);
    ctx.moveTo(o.X, 20); ctx.lineTo(o.X, CH - 20);
    ctx.stroke();

    // Curve f(x) (Blue)
    ctx.strokeStyle = '#0284c7';
    ctx.lineWidth = 3;
    ctx.beginPath();
    var started = false;
    for (var i = 0; i <= 240; i++) {
      var x = -BOUND_X + i * (2 * BOUND_X) / 240;
      var y = fx(x);
      if (isNaN(y) || y > BOUND_Y + 2 || y < -BOUND_Y - 2) { started = false; continue; }
      var p = _this.worldToPx(x, y);
      if (!started) { ctx.moveTo(p.X, p.Y); started = true; }
      else ctx.lineTo(p.X, p.Y);
    }
    ctx.stroke();

    // Line g(x) (Red)
    ctx.strokeStyle = '#dc2626';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    started = false;
    for (var j = 0; j <= 240; j++) {
      var xj = -BOUND_X + j * (2 * BOUND_X) / 240;
      var yj = gx(xj);
      if (isNaN(yj) || yj > BOUND_Y + 2 || yj < -BOUND_Y - 2) { started = false; continue; }
      var pj = _this.worldToPx(xj, yj);
      if (!started) { ctx.moveTo(pj.X, pj.Y); started = true; }
      else ctx.lineTo(pj.X, pj.Y);
    }
    ctx.stroke();

    // Difference Function h(x) = f(x) - g(x) (Green Dashed)
    if (S.showDiffFunc) {
      ctx.strokeStyle = '#059669';
      ctx.lineWidth = 2;
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      started = false;
      for (var k = 0; k <= 240; k++) {
        var xk = -BOUND_X + k * (2 * BOUND_X) / 240;
        var yk = hx(xk);
        if (isNaN(yk) || yk > BOUND_Y + 2 || yk < -BOUND_Y - 2) { started = false; continue; }
        var pk = _this.worldToPx(xk, yk);
        if (!started) { ctx.moveTo(pk.X, pk.Y); started = true; }
        else ctx.lineTo(pk.X, pk.Y);
      }
      ctx.stroke();
      ctx.setLineDash([]);
    }

    // Roots / Intersection Points (Green Circles)
    var roots = findRoots();
    roots.forEach(function(rx) {
      if (Math.abs(rx) <= BOUND_X) {
        var ry = fx(rx);
        var pt = _this.worldToPx(rx, ry);
        ctx.fillStyle = '#059669';
        ctx.beginPath();
        ctx.arc(pt.X, pt.Y, 6, 0, Math.PI * 2);
        ctx.fill();

        // Vertical guide to x-axis
        var px0 = _this.worldToPx(rx, 0);
        ctx.strokeStyle = '#a7f3d0';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(pt.X, pt.Y); ctx.lineTo(px0.X, px0.Y);
        ctx.stroke();
      }
    });

    // Pointer x0 Vertical Guide Line & Points P_f, P_g, P_h
    var px0 = _this.worldToPx(S.x0, 0);
    ctx.strokeStyle = '#fca5a5';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([3, 3]);
    ctx.beginPath();
    ctx.moveTo(px0.X, 20); ctx.lineTo(px0.X, CH - 20);
    ctx.stroke();
    ctx.setLineDash([]);

    // Point P_f(x0, f(x0)) on Blue Curve
    var yf0 = fx(S.x0);
    if (!isNaN(yf0) && Math.abs(yf0) <= BOUND_Y + 1) {
      var ptF = _this.worldToPx(S.x0, yf0);
      ctx.fillStyle = '#0284c7';
      ctx.beginPath();
      ctx.arc(ptF.X, ptF.Y, 7, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    // Point P_g(x0, g(x0)) on Red Line
    var yg0 = gx(S.x0);
    if (!isNaN(yg0) && Math.abs(yg0) <= BOUND_Y + 1) {
      var ptG = _this.worldToPx(S.x0, yg0);
      ctx.fillStyle = '#dc2626';
      ctx.beginPath();
      ctx.arc(ptG.X, ptG.Y, 7, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    // Point P_h(x0, h(x0)) on Green Curve
    if (S.showDiffFunc) {
      var yh0 = hx(S.x0);
      if (!isNaN(yh0) && Math.abs(yh0) <= BOUND_Y + 1) {
        var ptH = _this.worldToPx(S.x0, yh0);
        ctx.fillStyle = '#059669';
        ctx.beginPath();
        ctx.arc(ptH.X, ptH.Y, 6, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    ctx.fillStyle = '#dc2626';
    ctx.font = 'bold 12px Pretendard';
    ctx.fillText('x0 = ' + S.x0.toFixed(2), px0.X + 6, 30);
  },

  renderSlideGuide: function() {
    var _this = this;
    var root = S.host.querySelector('#is-app-root');
    var mBox = root.querySelector('#is-modal-box');
    if (!mBox) return;

    var pg = SLIDE_GUIDE[S.guidePage] || SLIDE_GUIDE[0];
    var dots = SLIDE_GUIDE.map(function(_, i) {
      return '<span class="dot' + (i === S.guidePage ? ' on' : '') + '"></span>';
    }).join('');
    var isLast = S.guidePage >= SLIDE_GUIDE.length - 1;

    var h = '';
    h += '<div style="font-size:.8rem; font-weight:800; color:#0284c7; margin-bottom:4px;">온보딩 슬라이드 탐구 ' + (S.guidePage + 1) + ' / ' + SLIDE_GUIDE.length + '</div>';
    h += '<h3 style="margin:0 0 12px; color:#0f172a; font-weight:900;">' + pg.title + '</h3>';
    h += '<div style="line-height:1.65; color:#334155; font-size:0.95rem;">' + pg.html + '</div>';
    h += '<div class="dots">' + dots + '</div>';

    h += '<div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px;">';
    h += '  <button type="button" class="btn" id="btn-slide-prev"' + (S.guidePage === 0 ? ' disabled' : '') + '>← 이전</button>';
    h += '  <button type="button" class="btn p" id="btn-slide-next">' + (isLast ? '탐구 시작하기 🚀' : '다음 →') + '</button>';
    h += '</div>';

    mBox.innerHTML = h;
    updateMathElements();

    var prevBtn = mBox.querySelector('#btn-slide-prev');
    var nextBtn = mBox.querySelector('#btn-slide-next');

    if (prevBtn) {
      prevBtn.onclick = function() {
        if (S.guidePage > 0) {
          S.guidePage--;
          _this.renderSlideGuide();
        }
      };
    }
    if (nextBtn) {
      nextBtn.onclick = function() {
        if (isLast) {
          root.querySelector('#ca2-modal').classList.remove('on');
        } else {
          S.guidePage++;
          _this.renderSlideGuide();
        }
      };
    }
  },

  destroy: function() {
    if (S.host) S.host.innerHTML = '';
    S.host = null;
  }
};

function goHome() {
  if (S.host) S.host.innerHTML = '';
  if (typeof window.LegacyBridge !== 'undefined' && typeof window.LegacyBridge.backHome === 'function') {
    window.LegacyBridge.backHome();
  } else if (typeof window.MathLabGames !== 'undefined' && window.MathLabGames.goHome) {
    window.MathLabGames.goHome();
  } else {
    window.location.reload();
  }
}

function reg() {
  if (typeof window.MathLabGames === 'undefined' || typeof window.MathLabGames.register !== 'function') return;
  try {
    if (window.MathLabGames.get && window.MathLabGames.get(APP_ID)) return;
    window.MathLabGames.register({
      id: APP_ID,
      title: APP_TITLE,
      icon: ICON,
      sourceType: 'new',
      players: '1인',
      isMultiplayer: false,
      mount: function(c, x) { IntersectionSniperApp.mount(c, x); },
      reset: function() { IntersectionSniperApp.updateHUD(); IntersectionSniperApp.drawCanvas(); },
      destroy: function() { IntersectionSniperApp.destroy(); },
      goHome: function() { goHome(); }
    });
  } catch (e) {
    console.warn(APP_ID + ' reg', e);
  }
}

reg();
window.addEventListener('DOMContentLoaded', reg);
setTimeout(reg, 100);
setTimeout(reg, 500);

window.IntersectionSniper = {
  mount: function(c) { IntersectionSniperApp.mount(c); },
  destroy: function() { IntersectionSniperApp.destroy(); },
  goHome: goHome
};

window.initIntersectionSniper = function() {
  reg();
  try {
    if (window.LegacyBridge) {
      window.LegacyBridge.hideAllLegacySections();
      if (window.LegacyBridge.showNewRoot) window.LegacyBridge.showNewRoot();
    }
  } catch (e) {}
  if (window.MathLabGames && window.MathLabGames.mount) {
    try { window.MathLabGames.mount(APP_ID); return; } catch (e) {}
  }
  IntersectionSniperApp.mount(document.getElementById('mathlab-view'));
};

window.launchIntersectionSniper = window.initIntersectionSniper;
})();
</script>
