<style>

    color: #334155;
    background: #ffffff;
    font-family: 'Pretendard', sans-serif;
    line-height: 1.6;
    max-width: 800px;
    margin: 0 auto;
  }
  .app-terms-of-service h2 {
    margin-top: 0; 
    color: #0f172a; 
    font-size: 1.8rem; 
    border-bottom: 2px solid #e2e8f0; 
    padding-bottom: 12px; 
    margin-bottom: 24px;
  }
  .app-terms-of-service h3 {
    font-size: 1.3rem; 
    color: #1e293b; 
    margin-top: 32px; 
    margin-bottom: 16px;
  }
  .app-terms-of-service p {
    font-size: 1.05rem; 
    margin-bottom: 16px;
  }
  .app-terms-of-service ul {
    font-size: 1.05rem; 
    margin-bottom: 20px;

  }
  .app-terms-of-service li {

  }
  .app-terms-of-service .important-box p {
    margin: 0;

    color: #0f172a;

<template id="terms-of-service-template">
  <div class="app-terms-of-service">
    <h2>이용약관</h2>
    
    <p>
      본 수학실험실(Gen-3 MathLabGames) 앱을 이용해 주셔서 감사합니다.
    </p>
    
    <h3>1. 서비스의 목적</h3>
    <p>
      본 서비스는 학생들이 수학적 개념을 시각적, 조작적으로 탐구하고 학습할 수 있도록 돕기 위해 무료로 제공되는 교육용 도구입니다.
    </p>

    <h3>2. 사용자의 의무</h3>
    <p>
      사용자는 본 서비스를 학습 및 교육적 목적으로만 사용하여야 하며, 불법적이거나 타인에게 피해를 주는 방식으로 사용할 수 없습니다. 서비스 내 모든 콘텐츠의 저작권은 개발자에게 있습니다.
    </p>

    <h3>3. 서비스 제공의 제한 및 중단</h3>
    <div class="important-box">
      <p>
        본 서비스는 무료로 제공되는 교육용 서비스로, 사전 공지 없이 일부 기능이 변경, 중단, 혹은 종료될 수 있습니다.
      </p>
    </div>
    <p>
      앱 업데이트, 기술적 문제 또는 기타 운영상 이유로 접속이 제한되거나 데이터(로컬 저장 정보)가 초기화될 수 있습니다. 사용자는 중요한 데이터를 별도로 백업하여야 합니다.
    </p>

    <h3>4. 책임의 한계</h3>
    <p>
      개발자는 본 서비스의 사용으로 인해 발생하는 어떠한 직간접적인 손해나 데이터 유실에 대해서도 법적 책임을 지지 않습니다.
    </p>
  </div>
</template>

<script>
  (function() {
    function mount(container) {
      if (!container) return;
      const template = document.getElementById('terms-of-service-template');
      if (template) {
        container.innerHTML = template.innerHTML;
      }
    }
    
    if (window.MathLabGames && typeof window.MathLabGames.register === 'function') {
      window.MathLabGames.register({
        id: 'terms-of-service',
        mount: mount,
        destroy: function() {
          const container = document.getElementById('mathlab-global-modal-content');
          if(container) container.innerHTML = '';
        }
      });
    }
  })();
</script>
