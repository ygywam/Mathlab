  /* 상단 헤더 */

  .game-hanoi-tower .title-icon {

    border: 1px solid rgba(59, 130, 246, 0.3);

  .game-hanoi-tower .title-text {

  .game-hanoi-tower .title-badge {

  .game-hanoi-tower .header-actions {

  .game-hanoi-tower .btn-header {
    background: #334155;

    font-size: 0.88rem;

    cursor: pointer;
    display: flex;
    align-items: center;

  .game-hanoi-tower .btn-header:hover {

  .game-hanoi-tower .btn-header.demo-btn {

  .game-hanoi-tower .btn-header.demo-btn:hover { background: #7c3aed; }

  .game-hanoi-tower .btn-header.stop-save {
    background: #f59e0b;

  }

  .game-hanoi-tower .btn-header.stop-save:hover { background: #d97706; color: #ffffff; }

  .game-hanoi-tower .btn-header.hof {
    background: #10b981;

  }

  .game-hanoi-tower .btn-header.hof:hover { background: #059669; }

  .game-hanoi-tower .btn-header.home {
    background: rgba(244, 63, 94, 0.18);
    color: #fda4af;
    border-color: rgba(244, 63, 94, 0.4);
  }

  .game-hanoi-tower .btn-header.home:hover {
    background: rgba(244, 63, 94, 0.35);

  }

  /* 모드 선택 탭 & 상태 바 */
  .game-hanoi-tower .ht-status-bar {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 12px;

    padding: 12px 18px;
    border-radius: 14px;
  }

  .game-hanoi-tower .mode-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;

    border-radius: 10px;
    border: 1px solid #334155;
  }

  .game-hanoi-tower .mode-btn {
    background: transparent;
    border: none;

  }

  .game-hanoi-tower .mode-btn.active {
    background: #3b82f6;

  }

  .game-hanoi-tower .info-group {
    display: flex;
    align-items: center;
    gap: 18px;
    flex-wrap: wrap;
  }

  .game-hanoi-tower .info-item {
    display: flex;
    align-items: center;

  }

  .game-hanoi-tower .info-value { font-weight: 900; color: #38bdf8; }
  .game-hanoi-tower .info-value.warn { color: #f87171; }

  /* 메인 타워 캔버스 (기둥 3개) */
  .game-hanoi-tower .tower-stage {
    background: #090d16;
    border: 2px solid #334155;
    border-radius: 20px;
    padding: 24px 16px;
    min-height: 380px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    box-shadow: inset 0 0 35px rgba(0, 0, 0, 0.8);
  }

  .game-hanoi-tower .pegs-container {
    display: flex;
    justify-content: space-around;
    align-items: flex-end;

  .game-hanoi-tower .peg-column {
    flex: 1;

  .game-hanoi-tower .peg-column:hover {

  .game-hanoi-tower .peg-column.selected {

  .game-hanoi-tower .peg-column.error-shake {

  @keyframes htShake {

    20%, 60% { transform: translateX(-8px); }
    40%, 80% { transform: translateX(8px); }
  }

  /* 기둥 봉 & 받침대 */
  .game-hanoi-tower .peg-rod {
    position: absolute;
    bottom: 12px;
    width: 14px;
    height: 220px;

    border-radius: 8px 8px 0 0;
    z-index: 1;
  }

  .game-hanoi-tower .peg-base {
    position: absolute;
    bottom: 0;
    width: 90%;
    height: 14px;
    background: #334155;
    border-radius: 6px;
    border: 1px solid #475569;
    z-index: 2;
  }

  .game-hanoi-tower .peg-label {
    position: absolute;
    top: 10px;
    font-size: 1rem;
    font-weight: 900;
    color: #fbbf24;
    background: #1e293b;
    padding: 4px 14px;
    border-radius: 8px;
    border: 1px solid #334155;

  }

  /* 원반 스타일 */
  .game-hanoi-tower .disk-item {
    height: 30px;
    border-radius: 12px;
    margin-bottom: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.88rem;
    font-weight: 900;
    color: #ffffff;
    text-shadow: 0 1px 2px rgba(0,0,0,0.6);
    box-shadow: 0 4px 8px rgba(0,0,0,0.4), inset 0 2px 0 rgba(255,255,255,0.3);
    z-index: 5;
    transition: all 0.2s ease;
  }

  .game-hanoi-tower .disk-item.floating {
    transform: translateY(-40px) scale(1.05);
    box-shadow: 0 12px 20px rgba(56, 189, 248, 0.5);
  }

  /* 원반 크기별 색상 팔레트 */
  .game-hanoi-tower .disk-size-1 { width: 28%; background: linear-gradient(135deg, #ef4444, #b91c1c); }
  .game-hanoi-tower .disk-size-2 { width: 40%; background: linear-gradient(135deg, #f97316, #c2410c); }
  .game-hanoi-tower .disk-size-3 { width: 52%; background: linear-gradient(135deg, #facc15, #a16207); color: #0f172a; text-shadow: none; }
  .game-hanoi-tower .disk-size-4 { width: 64%; background: linear-gradient(135deg, #10b981, #047857); }
  .game-hanoi-tower .disk-size-5 { width: 76%; background: linear-gradient(135deg, #3b82f6, #1d4ed8); }
  .game-hanoi-tower .disk-size-6 { width: 88%; background: linear-gradient(135deg, #8b5cf6, #5b21b6); }
  .game-hanoi-tower .disk-size-7 { width: 98%; background: linear-gradient(135deg, #ec4899, #be185d); }

  /* 하단 컨트롤 및 피드백 바 */
  .game-hanoi-tower .stage-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    background: #1e293b;
    padding: 12px 18px;
    border-radius: 16px;
    border: 1px solid #334155;
  }

  .game-hanoi-tower .feedback-box {
    flex: 1;
    font-size: 0.96rem;
    font-weight: 800;
    color: #38bdf8;
  }

  .game-hanoi-tower .action-btn-group {
    display: flex;
    gap: 8px;
  }

  .game-hanoi-tower .btn-submit {
    background: #10b981;
    color: #0f172a;
    border: none;
    font-size: 0.98rem;
    font-weight: 900;
    padding: 10px 22px;
    border-radius: 12px;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(16, 185, 129, 0.35);
    transition: all 0.2s;
    display: none;
  }

  .game-hanoi-tower .btn-submit:hover { background: #059669; color: #ffffff; }

  /* 퀴즈 박스 및 하단 랭킹 영역 */
  .game-hanoi-tower .bottom-ranking-card {
    background: #1e293b;
    border: 2px solid #334155;
    border-radius: 20px;
    padding: 20px;
    margin-top: 10px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .game-hanoi-tower .ranking-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #334155;
    padding-bottom: 10px;
    flex-wrap: wrap;
    gap: 8px;
  }

  .game-hanoi-tower .ranking-title {
    font-size: 1.15rem;
    font-weight: 800;
    color: #f8fafc;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* 모달 */
  .game-hanoi-tower .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.8);
    backdrop-filter: blur(6px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10000;
    padding: 20px;
  }

  .game-hanoi-tower .modal-backdrop.open { display: flex; }

  .game-hanoi-tower .modal-box {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 22px;
    width: 100%;
    max-width: 580px;
    max-height: 85vh;
    overflow-y: auto;
    padding: 24px;
    color: #e2e8f0;
    box-shadow: 0 24px 50px rgba(0, 0, 0, 0.75);
  }

  .game-hanoi-tower .modal-title {
    font-size: 1.35rem;
    font-weight: 900;
    color: #f8fafc;
    margin: 0 0 16px 0;
    display: flex;
    align-items: center;
    gap: 8px;
    border-bottom: 1px solid #334155;
    padding-bottom: 12px;
  }

  .game-hanoi-tower .rule-list {
    margin: 0 0 16px 0;
    padding-left: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    font-size: 0.95rem;
    line-height: 1.6;
    color: #cbd5e1;
  }

  .game-hanoi-tower .modal-close-btn {
    width: 100%;
    background: #10b981;
    color: #0f172a;
    border: none;
    padding: 12px;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 900;
    cursor: pointer;
    margin-top: 18px;
    transition: background 0.2s;
  }

  .game-hanoi-tower .modal-close-btn:hover { background: #059669; color: #ffffff; }

  /* 2ⁿ-1 표 스타일 */
  .game-hanoi-tower .math-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
    font-size: 0.94rem;
  }

  .game-hanoi-tower .math-table th, .game-hanoi-tower .math-table td {
    border: 1px solid #334155;
    padding: 10px;
    text-align: center;
  }

  .game-hanoi-tower .math-table th { background: #0f172a; color: #fbbf24; font-weight: 900; }
  .game-hanoi-tower .math-table tr.cur-row { background: rgba(59, 130, 246, 0.25); color: #38bdf8; font-weight: 900; }
</style>

<script>
  /* ==========================================================================
     HanoiTower 모듈 - 하노이의 탑 챌린지 (연속 누적 & 재귀 시연 완결판)
     ========================================================================== */
  const HanoiTower = (function () {
    // 🌟 [보안] XSS 방어용 HTML 특수기호 이스케이프 함수
    function escapeHTML(str) {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, function(match) {
        const escape = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
        return escape[match];
      });
    }

    const MODES = {
      EASY:   { diskPool: [3], desc: '쉬움 (원반 3개 / 2³-1 = 7수)' },
      NORMAL: { diskPool: [4, 5], desc: '보통 (원반 4~5개 / 예측 퀴즈)' },
      HARD:   { diskPool: [6, 7], desc: '도전 (원반 6~7개 / 타임어택)' }
    };

    let currentMode = 'EASY';
    let diskCount = 3;
    let round = 1;
    let modeStepIdx = 0;
    let pegs = [[], [], []]; // 각 기둥의 원반 스택 ([3,2,1] 등, 큰 원반이 아래)
    let selectedPeg = -1;
    let moveCount = 0;
    let minMoves = 7;
    let score = 0;
    let combo = 0;
    let timeLeft = 0;
    let timerInterval = null;
    let isGameOver = false;
    let isStageCleared = false;
    let isDemoRunning = false;
    let demoMoves = [];
    let demoInterval = null;

    function mount(container, context) {
      let host = null;
      if (typeof container === 'string') host = document.querySelector(container);
      else if (container instanceof HTMLElement) host = container;
      if (!host) host = window.MathLabUtils?.getMountContainer ? window.MathLabUtils.getMountContainer(container) : document.getElementById('mathlab-view');
      if (!host) host = document.getElementById('new-root') || document.getElementById('game-container');

      if (!host) {
        let createdHost = document.getElementById('hanoi-tower-force-host');
        if (!createdHost) {
          createdHost = document.createElement('div');
          createdHost.id = 'hanoi-tower-force-host';
          document.body.appendChild(createdHost);
        }
        host = createdHost;
      }

      const footerEl = document.querySelector('footer, #footer, .app-footer') || 
                       Array.from(document.querySelectorAll('div, p, span')).find(el => el.textContent && el.textContent.includes('2026 기록조율사'));
      if (footerEl && host.compareDocumentPosition(footerEl) & Node.DOCUMENT_POSITION_PRECEDING) {
        footerEl.parentNode.insertBefore(host, footerEl);
      }

      host.style.display = '';

      // 🌟 백틱 에러 차단: 문자열 내부에 백틱 사용 금지
      host.innerHTML = `
        <div class="game-hanoi-tower" id="hanoi-tower-app">
          <!-- 상단 헤더 -->
          <div class="ht-header">
            <div class="title-group">
              <div class="title-icon">🗼</div>
              <div>
                <div style="display:flex; align-items:center; gap:8px;">
                  <span class="title-text">하노이의 탑 챌린지</span>
                  <span class="title-badge">2ⁿ-1 재귀 탐구</span>
                </div>
              </div>
            </div>

            <div class="header-actions">
              <button class="btn-header home" onclick="HanoiTower.goHome()"><span>🏠 홈으로</span></button>
              <button class="btn-header" onclick="HanoiTower.showGuideModal()"><span>📖 규칙 & 표</span></button>
              <button class="btn-header demo-btn" id="ht-demo-btn" onclick="HanoiTower.toggleAutoDemo()"><span>🤖 재귀 자동 시연</span></button>
              <button class="btn-header stop-save" onclick="HanoiTower.manualStopAndSave()"><span>🏁 내 점수 정산</span></button>
              <button class="btn-header hof" onclick="HanoiTower.showRankingModal()"><span>🏆 명예의 전당</span></button>
              <button class="btn-header" style="background:#10b981; color:white;" onclick="HanoiTower.resetGame(false)"><span>🔄 처음부터 다시</span></button>
            </div>
          </div>

          <!-- 상태 바 -->
          <div class="ht-status-bar">
            <div class="mode-tabs">
              <button class="mode-btn active" id="ht-btn-easy" onclick="HanoiTower.handleTabClick('EASY')">🟢 쉬움 (3개)</button>
              <button class="mode-btn" id="ht-btn-normal" onclick="HanoiTower.handleTabClick('NORMAL')">🔵 보통 (4~5개)</button>
              <button class="mode-btn" id="ht-btn-hard" onclick="HanoiTower.handleTabClick('HARD')">🟣 도전 (6~7개)</button>
            </div>

            <div class="info-group">
              <div class="info-item"><span>📋 진행:</span> <span class="info-value" id="ht-round-val">ROUND #1</span></div>
              <div class="info-item"><span>⭕ 원반:</span> <span class="info-value" id="ht-disk-val">3개</span></div>
              <div class="info-item"><span>🚀 내 이동:</span> <span class="info-value warn" id="ht-moves-val">0 / 최소 7수</span></div>
              <div class="info-item" id="ht-timer-wrap" style="display:none;"><span>⏱️ 남은 시간:</span> <span class="info-value warn" id="ht-timer-val">300초</span></div>
              <div class="info-item"><span>⭐ 누적 점수:</span> <span class="info-value" id="ht-score-val">0점</span></div>
            </div>
          </div>

          <!-- 기둥 3개 메인 스테이지 -->
          <div class="tower-stage">
            <div class="pegs-container" id="ht-pegs-container"></div>
            
            <div class="stage-footer">
              <div class="feedback-box" id="ht-feedback">💡 출발 기둥(원반)을 클릭한 후 도착 기둥을 누르면 이동합니다. 큰 원반은 작은 원반 위에 올라갈 수 없습니다!</div>
              <div class="action-btn-group">
                <button class="btn-submit" id="ht-next-btn" onclick="HanoiTower.advanceToNextStage()">▶ 다음 원반 도전 진행 (+)</button>
              </div>
            </div>
          </div>

          <!-- 하단 상시 명예의 전당 보드 -->
          <div class="bottom-ranking-card">
            <div class="ranking-header">
              <div class="ranking-title">🏆 하노이의 탑 명예의 전당 (실시간 랭킹 보드)</div>
              <button class="btn-header stop-save" onclick="HanoiTower.manualStopAndSave()" style="font-size:0.82rem; padding:5px 10px;">🏁 내 점수 즉시 정산 등록</button>
            </div>
            <div id="board-hanoi-tower-bottom">
              <p style="text-align:center; color:#94a3b8; padding:12px 0;">랭킹 데이터를 불러오는 중...</p>
            </div>
          </div>

          <!-- 1. 규칙 및 등비수열 표 모달 -->
          <div class="modal-backdrop" id="ht-guide-modal">
            <div class="modal-box">
              <h3 class="modal-title">📖 하노이의 탑 규칙 및 2ⁿ-1 등비수열</h3>
              <ul class="rule-list">
                <li><b>🎯 핵심 규칙</b>: 한 번에 맨 위의 원반 하나씩만 옮길 수 있으며, <b>작은 원반 위에 큰 원반을 올리는 것은 금지</b>됩니다.</li>
                <li><b>📐 수학적 규칙 (2ⁿ-1)</b>: 원반 n개를 옮기기 위한 최소 이동 횟수는 <b>2ⁿ - 1</b> (등비수열의 합)입니다!</li>
                <li><b>🔁 재귀 알고리즘</b>: n개 원반을 옮기려면 [(n-1)개를 보조 기둥으로] -> [가장 큰 원반을 목표 기둥으로] -> [(n-1)개를 다시 목표 기둥으로] 합치는 큰 문제 쪼개기 원리가 작동합니다.</li>
                <li><b>🤖 재귀 자동 시연</b>: 상단의 [🤖 재귀 자동 시연]을 누르면 컴퓨터가 최소 이동 횟수로 완벽하게 푸는 과정을 감상할 수 있습니다 (시연 중 점수 저장 없음).</li>
              </ul>
              <table class="math-table">
                <thead>
                  <tr><th>원반 개수 (n)</th><th>계산식 (2ⁿ - 1)</th><th>최소 이동 횟수</th></tr>
                </thead>
                <tbody id="ht-math-table-body"></tbody>
              </table>
              <button class="modal-close-btn" onclick="HanoiTower.closeModals()">확인 및 도전 시작</button>
            </div>
          </div>

          <!-- 2. 명예의 전당 등록 모달 -->
          <div class="modal-backdrop" id="ht-ranking-modal">
            <div class="modal-box">
              <h3 class="modal-title" id="ht-ranking-modal-title">🏆 하노이의 탑 명예의 전당</h3>
              <div id="ht-gameover-summary" style="background:#0f172a; padding:14px; border-radius:12px; border:1px solid #334155; margin-bottom:14px; text-align:center;"></div>
              <div id="board-hanoi-tower">
                <p style="text-align:center; color:#94a3b8;">랭킹 데이터를 불러오는 중...</p>
              </div>
              <div style="margin-top:16px; display:flex; gap:8px;">
                <input type="text" id="ht-nickname-input" placeholder="도전자 닉네임 (예: 1반 하노이왕)" maxlength="18" style="flex:1; padding:12px; border-radius:10px; border:1px solid #334155; background:#0f172a; color:#f8fafc; font-weight:700; font-size:0.98rem; text-align:center;">
                <button class="btn-header hof" style="padding:0 20px;" onclick="HanoiTower.submitRankScore()">등록</button>
              </div>
              <button class="modal-close-btn" onclick="HanoiTower.closeModals()">창 닫기</button>
            </div>
          </div>
        </div>
      `;

      resetGame(false);
      renderBottomLeaderboard();
    }

    function handleTabClick(targetMode) {
      if (targetMode === currentMode) return;
      if (score > 0) {
        showBanner(`🔄 [${targetMode}] 모드로 이동합니다. 현재 누적 점수(${score}점)가 유지됩니다!`, '#facc15');
      }
      setMode(targetMode, true);
    }

    function setMode(mode, keepScore = true) {
      currentMode = mode;
      modeStepIdx = 0;
      document.querySelectorAll('#hanoi-tower-app .mode-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById('ht-btn-' + mode.toLowerCase());
      if (activeBtn) activeBtn.classList.add('active');

      const timerWrap = document.getElementById('ht-timer-wrap');
      if (timerWrap) timerWrap.style.display = mode === 'HARD' ? 'flex' : 'none';

      resetGame(keepScore);
    }

    function resetGame(keepScore = false) {
      stopAutoDemo();
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = null;

      if (!keepScore) {
        score = 0;
        round = 1;
        modeStepIdx = 0;
      }

      loadNextStage(true);
    }

    function loadNextStage(isInitial = false) {
      stopAutoDemo();
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = null;

      isStageCleared = false;
      selectedPeg = -1;
      moveCount = 0;

      const pool = MODES[currentMode].diskPool;
      diskCount = pool[modeStepIdx % pool.length];
      minMoves = Math.pow(2, diskCount) - 1;

      // 기둥 원반 스택 초기화 (왼쪽 기둥에 크기 순으로 쌓기)
      pegs = [[], [], []];
      for (let d = diskCount; d >= 1; d--) {
        pegs[0].push(d);
      }

      const nextBtn = document.getElementById('ht-next-btn');
      if (nextBtn) nextBtn.style.display = 'none';

      if (currentMode === 'HARD') {
        timeLeft = diskCount === 6 ? 240 : 360;
        timerInterval = setInterval(() => {
          if (isGameOver || isStageCleared || isDemoRunning) return;
          timeLeft--;
          if (timeLeft <= 0) {
            timeLeft = 0;
            triggerGameOver('⏰ 도전 모드 타임어택 제한 시간 종료!');
          }
          updateUI();
        }, 1000);
      }

      renderPegs();
      updateUI();

      if (!isInitial) {
        showBanner(`🚀 [ROUND #${round}] 원반 ${diskCount}개 도전 개시! 최소 이동(${minMoves}수)을 노려보세요.`, '#38bdf8');
      } else {
        showBanner(`💡 원반 ${diskCount}개 준비 완료! 출발 기둥을 누르고 도착 기둥을 누르면 원반이 이동합니다.`, '#38bdf8');
      }
    }

    function renderPegs() {
      const container = document.getElementById('ht-pegs-container');
      if (!container) return;

      const pegNames = ['A 기둥 (출발)', 'B 기둥 (보조)', 'C 기둥 (도착)'];

      container.innerHTML = pegs.map((stack, pIdx) => `
        <div class="peg-column ${selectedPeg === pIdx ? 'selected' : ''}" id="peg-${pIdx}" onclick="HanoiTower.onPegClick(${pIdx})">
          <div class="peg-label">${pegNames[pIdx]}</div>
          <div class="peg-rod"></div>
          <div class="peg-base"></div>
          
          <div style="width:100%; display:flex; flex-direction:column-reverse; align-items:center; z-index:5; padding-bottom:14px; min-height:220px;">
            ${stack.map((diskVal, dIdx) => {
              const isTop = (dIdx === stack.length - 1);
              const isFloating = (selectedPeg === pIdx && isTop);
              return `
                <div class="disk-item disk-size-${diskVal} ${isFloating ? 'floating' : ''}">
                  ${diskVal}
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `).join('');

      renderMathTable();
    }

    function renderMathTable() {
      const tbody = document.getElementById('ht-math-table-body');
      if (!tbody) return;

      let html = '';
      for (let n = 1; n <= 7; n++) {
        const moves = Math.pow(2, n) - 1;
        const isCur = (n === diskCount);
        html += `
          <tr class="${isCur ? 'cur-row' : ''}">
            <td>${n}개 ${isCur ? '◀ 현재 챌린지' : ''}</td>
            <td>2^${n} - 1</td>
            <td><b>${moves}수</b></td>
          </tr>
        `;
      }
      tbody.innerHTML = html;
    }

    // 기둥 클릭 2단계 조작 (선택 -> 이동 또는 취소)
    function onPegClick(pIdx) {
      if (isGameOver || isStageCleared || isDemoRunning) return;

      // 1) 아직 아무 기둥도 선택하지 않은 경우
      if (selectedPeg === -1) {
        if (pegs[pIdx].length === 0) {
          showBanner('⚠️ 선택한 기둥에 옮길 수 있는 원반이 없습니다!', '#f87171');
          return;
        }
        selectedPeg = pIdx;
        showBanner(`👆 [${['A','B','C'][pIdx]} 기둥] 맨 위 원반 선택! 이동시킬 도착 기둥을 선택하세요.`, '#facc15');
        renderPegs();
        return;
      }

      // 2) 같은 기둥을 다시 누른 경우 -> 선택 취소
      if (selectedPeg === pIdx) {
        selectedPeg = -1;
        showBanner('💡 원반 선택이 취소되었습니다. 다시 출발 기둥을 선택하세요.', '#94a3b8');
        renderPegs();
        return;
      }

      // 3) 다른 도착 기둥을 선택한 경우 -> 규칙 검증 후 이동
      const fromStack = pegs[selectedPeg];
      const toStack = pegs[pIdx];
      const movingDisk = fromStack[fromStack.length - 1];
      const topDiskAtTo = toStack.length > 0 ? toStack[toStack.length - 1] : 999;

      if (movingDisk > topDiskAtTo) {
        // ❌ 규칙 위반 (큰 원반이 작은 원반 위에 올라갈 수 없음)
        const pegEl = document.getElementById(`peg-${pIdx}`);
        if (pegEl) {
          pegEl.classList.add('error-shake');
          setTimeout(() => pegEl.classList.remove('error-shake'), 450);
        }
        showBanner(`❌ 규칙 위반! 크기가 [${movingDisk}]인 원반은 더 작은 원반[${topDiskAtTo}] 위에 놓을 수 없습니다!`, '#f87171');
        return;
      }

      // ✅ 정상 이동 확정
      fromStack.pop();
      toStack.push(movingDisk);
      selectedPeg = -1;
      moveCount++;

      renderPegs();
      updateUI();

      // C 기둥(인덱스 2)에 모든 원반이 모였는지 확인
      if (pegs[2].length === diskCount) {
        isStageCleared = true;
        let gain = 20;
        if (moveCount === minMoves) {
          gain += 15; // 최소 이동 퍼펙트 보너스!
          showBanner(`🎉 퍼펙트 클리어! 최소 이동 횟수(${minMoves}수)로 원반 ${diskCount}개를 완벽히 옮겼습니다! (+${gain}점 누적)`, '#34d399');
        } else {
          showBanner(`🎉 스테이지 클리어! 이동 횟수: ${moveCount}수 (최소: ${minMoves}수) -> (+${gain}점 누적)`, '#34d399');
        }

        score += gain;
        updateUI();

        const nextBtn = document.getElementById('ht-next-btn');
        if (nextBtn) nextBtn.style.display = 'inline-block';
      } else {
        showBanner(`⭕ 원반 이동 완료! (현재 ${moveCount}수 / 최소 ${minMoves}수)`, '#38bdf8');
      }
    }

    function advanceToNextStage() {
      if (!isStageCleared) return;
      round++;
      modeStepIdx++;

      const pool = MODES[currentMode].diskPool;
      if (currentMode === 'EASY' && modeStepIdx >= pool.length) {
        showBanner(`🎉 쉬움 마스터! [🔵 보통 모드(원반 4~5개)]로 자동 승급하여 누적 점수가 이어집니다!`, '#facc15');
        setMode('NORMAL', true);
      } else if (currentMode === 'NORMAL' && modeStepIdx >= pool.length) {
        showBanner(`🔥 보통 마스터! [🟣 도전 모드(원반 6~7개)]로 자동 승급하여 누적 점수가 이어집니다!`, '#facc15');
        setMode('HARD', true);
      } else {
        loadNextStage(false);
      }
    }

    // 🤖 재귀 자동 시연 모드 (1수씩 재생, 점수 저장 없음)
    function toggleAutoDemo() {
      const demoBtn = document.getElementById('ht-demo-btn');
      if (isDemoRunning) {
        stopAutoDemo();
        showBanner('⏹️ 재귀 자동 시연이 중지되었습니다. 내 힘으로 도전해보세요!', '#fbbf24');
        return;
      }

      showBanner(`🤖 재귀 시연 시작! 컴퓨터가 ${minMoves}수의 최적 재귀 알고리즘으로 푸는 과정을 감상합니다.`, '#8b5cf6');

      isDemoRunning = true;
      selectedPeg = -1;
      if (demoBtn) {
        demoBtn.style.background = '#ec4899';
        demoBtn.innerHTML = '<span>⏹️ 자동 시연 중지</span>';
      }

      // 기둥 초기화
      pegs = [[], [], []];
      for (let d = diskCount; d >= 1; d--) {
        pegs[0].push(d);
      }
      moveCount = 0;
      renderPegs();
      updateUI();

      demoMoves = [];
      solveHanoiAlgo(diskCount, 0, 2, 1, demoMoves);

      let step = 0;
      showBanner(`🤖 재귀 시연 중... [총 ${demoMoves.length}수 중 최적 경로 탐색]`, '#8b5cf6');

      demoInterval = setInterval(() => {
        if (!isDemoRunning || step >= demoMoves.length) {
          stopAutoDemo();
          if (step >= demoMoves.length) {
            showBanner(`✨ 재귀 알고리즘 시연 완료! 큰 문제를 (n-1)개로 쪼개는 원리를 확인하셨나요?`, '#34d399');
          }
          return;
        }

        const m = demoMoves[step];
        const disk = pegs[m.from].pop();
        pegs[m.to].push(disk);
        moveCount++;
        step++;

        renderPegs();
        updateUI();
        showBanner(`🤖 재귀 시연: ${step} / ${demoMoves.length}수 -> [${['A','B','C'][m.from]} 기둥]에서 [${['A','B','C'][m.to]} 기둥]으로 원반 [${disk}] 이동`, '#c084fc');
      }, 550);
    }

    function solveHanoiAlgo(n, from, to, aux, movesArr) {
      if (n === 1) {
        movesArr.push({ from, to });
        return;
      }
      solveHanoiAlgo(n - 1, from, aux, to, movesArr);
      movesArr.push({ from, to });
      solveHanoiAlgo(n - 1, aux, to, from, movesArr);
    }

    function stopAutoDemo() {
      isDemoRunning = false;
      if (demoInterval) clearInterval(demoInterval);
      demoInterval = null;

      const demoBtn = document.getElementById('ht-demo-btn');
      if (demoBtn) {
        demoBtn.style.background = '#8b5cf6';
        demoBtn.innerHTML = '<span>🤖 재귀 자동 시연</span>';
      }
    }

    function showBanner(msg, color) {
      const banner = document.getElementById('ht-feedback');
      if (banner) {
        banner.textContent = msg;
        banner.style.color = color || '#38bdf8';
      }
    }

    function manualStopAndSave() {
      triggerGameOver(`🏁 [${currentMode} ROUND #${round}] 최종 조기 정산 완료!`);
    }

    function triggerGameOver(reasonMsg) {
      if (isGameOver && !reasonMsg.includes('정산')) return;
      isGameOver = true;
      stopAutoDemo();
      if (timerInterval) clearInterval(timerInterval);

      showBanner(reasonMsg, '#f87171');
      setTimeout(() => {
        showRankingModal(reasonMsg);
      }, 500);
    }

    function updateUI() {
      const roundVal = document.getElementById('ht-round-val');
      const diskVal = document.getElementById('ht-disk-val');
      const movesVal = document.getElementById('ht-moves-val');
      const timerVal = document.getElementById('ht-timer-val');
      const scoreVal = document.getElementById('ht-score-val');

      if (roundVal) roundVal.textContent = `ROUND #${round} (${currentMode === 'EASY' ? '쉬움' : currentMode === 'NORMAL' ? '보통' : '도전'})`;
      if (diskVal) diskVal.textContent = `${diskCount}개`;
      if (movesVal) {
        movesVal.textContent = `${moveCount}수 / 최소 ${minMoves}수`;
        movesVal.style.color = moveCount > minMoves ? '#f87171' : '#34d399';
      }
      if (timerVal) timerVal.textContent = `${timeLeft}초`;
      if (scoreVal) scoreVal.textContent = `${score}점`;
    }

    function showGuideModal() { document.getElementById('ht-guide-modal')?.classList.add('open'); }
    function showRankingModal(reasonMsg = '') {
      document.getElementById('ht-ranking-modal')?.classList.add('open');
      const titleEl = document.getElementById('ht-ranking-modal-title');
      const sumEl = document.getElementById('ht-gameover-summary');

      if (titleEl) {
        titleEl.textContent = reasonMsg ? '🏁 하노이의 탑 도전 정산' : '🏆 하노이의 탑 명예의 전당';
      }

      if (sumEl) {
        sumEl.innerHTML = `
          <div style="font-size:1.15rem; font-weight:900; color:#f87171; margin-bottom:6px;">${reasonMsg || '명예의 전당 랭킹 조회'}</div>
          <div style="font-size:1.35rem; font-weight:900; color:#38bdf8;">최종 누적 점수: ${score}점</div>
          <div style="font-size:0.98rem; color:#facc15; margin-top:4px; font-weight:800;">최종 멈춘 위치: [${currentMode}] ROUND #${round} (원반 ${diskCount}개)</div>
        `;
      }

      if (typeof loadGameLeaderboard === 'function') {
        loadGameLeaderboard('하노이의탑챌린지', true, 'board-hanoi-tower');
      }
    }

    function renderBottomLeaderboard() {
      if (typeof loadGameLeaderboard === 'function') {
        loadGameLeaderboard('하노이의탑챌린지', false, 'board-hanoi-tower-bottom');
      } else {
        try {
          let list = JSON.parse(localStorage.getItem('mathlab_lb_hanoi_tower') || '[]');
          const bottomEl = document.getElementById('board-hanoi-tower-bottom');
          if (bottomEl) {
            if (list.length === 0) {
              bottomEl.innerHTML = '<p style="text-align:center; color:#94a3b8; padding:12px 0;">아직 등록된 명예의 전당 기록이 없습니다. 첫 번째 하노이 마스터가 되어보세요!</p>';
            } else {
              bottomEl.innerHTML = `
                <div style="display:flex; flex-direction:column; gap:6px;">
                  ${list.slice(0, 5).map((item, idx) => `
                    <div style="display:flex; justify-content:space-between; align-items:center; background:#0f172a; padding:10px 14px; border-radius:10px; border:1px solid #334155;">
                      <span style="font-weight:800; color:${idx === 0 ? '#facc15' : '#cbd5e1'};">${idx === 0 ? '👑 1위' : `${idx + 1}위`} - ${escapeHTML(item.nickname)}</span>
                      <span style="color:#38bdf8; font-weight:900;">${item.score}점 (${item.modeSummary || item.mode || 'EASY'})</span>
                    </div>
                  `).join('')}
                </div>
              `;
            }
          }
        } catch(e) {}
      }
    }

    function closeModals() {
      document.querySelectorAll('.game-hanoi-tower .modal-backdrop').forEach(el => el.classList.remove('open'));
    }

    function submitRankScore() {
      const input = document.getElementById('ht-nickname-input');
      const nickname = input ? input.value.trim() : '';
      if (!nickname) {
        const titleEl = document.getElementById('ht-ranking-modal-title');
        if(titleEl) { titleEl.innerHTML = '<span style="color:#f87171;">⚠️ 닉네임을 입력해 주세요!</span>'; setTimeout(() => titleEl.textContent = '🏆 하노이의 탑 명예의 전당', 2000); }
        return;
      }

      const modeSummary = `${currentMode} (R#${round} / ${diskCount}개)`;

      try {
        let list = JSON.parse(localStorage.getItem('mathlab_lb_hanoi_tower') || '[]');
        const dateStr = new Date().toLocaleDateString('ko-KR', { month: '2-digit', day: '2-digit' });
        list.push({ nickname, score, date: dateStr, mode: currentMode, round, diskCount, modeSummary });
        list.sort((a, b) => b.score - a.score);
        localStorage.setItem('mathlab_lb_hanoi_tower', JSON.stringify(list.slice(0, 20)));
      } catch (e) {}

      if (typeof window.submitRanking === 'function') {
        window.submitRanking('하노이의탑챌린지', score, true, 'ht-nickname-input', 'board-hanoi-tower');
      } else if (typeof window.parent?.submitRanking === 'function') {
        window.parent.submitRanking('하노이의탑챌린지', score, true, 'ht-nickname-input', 'board-hanoi-tower');
      } else {
        const titleEl = document.getElementById('ht-ranking-modal-title');
        if(titleEl) { titleEl.innerHTML = '<span style="color:#34d399;">🎉 명예의 전당 등록 완료!</span>'; }
        if (input) input.value = '';
        setTimeout(() => closeModals(), 1500);
      }

      renderBottomLeaderboard();
    }

    function goHome() {
      destroy();
      if (window.LegacyBridge && typeof window.LegacyBridge.backHome === 'function') { try { window.LegacyBridge.backHome(); return; } catch(e) {} }
      if (typeof window.renderLegacyDashboardHome === 'function') { try { window.renderLegacyDashboardHome(); return; } catch(e) {} }
      if (typeof window.MathLabRenderHome === 'function') { try { window.MathLabRenderHome(); return; } catch(e) {} }

      const mathlabRoot = document.getElementById('mathlab-root');
      const legacyRoot = document.getElementById('legacy-root');
      if (mathlabRoot) mathlabRoot.classList.add('hidden');
      if (legacyRoot) legacyRoot.classList.remove('hidden');

      const dashboard = document.getElementById('dashboard-screen');
      if (dashboard) { dashboard.classList.add('active'); dashboard.style.display = ''; }
      window.scrollTo({ top: 0, left: 0, behavior: 'smooth' });
    }

    function destroy() {
      stopAutoDemo();
      if (timerInterval) clearInterval(timerInterval);
    }

    return {
      id: 'hanoi-tower',
      title: '하노이의 탑 챌린지',
      icon: '🗼',
      mount, resetGame, destroy, setMode, handleTabClick, onPegClick,
      advanceToNextStage, toggleAutoDemo, stopAutoDemo, manualStopAndSave,
      showGuideModal, showRankingModal, closeModals, submitRankScore, renderBottomLeaderboard, goHome
    };
  })();

  /* 하단 안전 등록 4중 브리지 */
  function registerHanoiTower() {
    if (typeof window.MathLabGames !== 'undefined' && typeof window.MathLabGames.register === 'function') {
      if (!window.MathLabGames.get('hanoi-tower')) {
        try {
          window.MathLabGames.register({
            id: HanoiTower.id,
            title: HanoiTower.title,
            icon: HanoiTower.icon,
            sourceType: 'new',
            mount(container, context) { HanoiTower.mount(container, context); },
            reset() { HanoiTower.resetGame(false); },
            destroy() { HanoiTower.destroy(); },
            goHome() { HanoiTower.goHome(); }
          });
        } catch (e) {
          console.warn('hanoi-tower 안전 등록 방어:', e);
        }
      }
    }
  }

  registerHanoiTower();
  window.addEventListener('DOMContentLoaded', registerHanoiTower);
  setTimeout(registerHanoiTower, 100);
  setTimeout(registerHanoiTower, 500);

  window.HanoiTower = HanoiTower;
  window.initHanoiTowerGame = function() {
    const target = document.getElementById('game-hanoi-tower-app') || document.getElementById('mathlab-view');
    HanoiTower.mount(target);
  };
  window.launchHanoiTowerGame = function() {
    registerHanoiTower();
    if (typeof window.MathLabGames !== 'undefined' && typeof window.MathLabGames.mount === 'function') {
      try { window.MathLabGames.mount('hanoi-tower'); return; } catch(e) {}
    }
    HanoiTower.mount();
  };
</script>
