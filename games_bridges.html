    // 역산 생성 알고리즘: 미리 연결된 단일 스패닝 트리를 만들고 교차점 다리 수를 세어 오류 없는 퍼즐 무한 생성!
    function generateConstructivePuzzle(mode) {
      let cols = 7, rows = 7, numIslands = 6;
      if (mode === 'NORMAL') { cols = 9; rows = 9; numIslands = 9; }
      if (mode === 'HARD') { cols = 11; rows = 11; numIslands = 12; }

      const candPoints = [];
      const step = mode === 'EASY' ? 2 : mode === 'NORMAL' ? 2 : 2;
      for (let r = 1; r < rows; r += step) {
        for (let c = 1; c < cols; c += step) {
          candPoints.push({ x: c, y: r });
        }
      }

      candPoints.sort(() => Math.random() - 0.5);
      const selected = candPoints.slice(0, Math.min(numIslands, candPoints.length));
      const islands = selected.map((pt, idx) => ({ id: idx, x: pt.x, y: pt.y, deg: 0 }));

      const allPairs = [];
      for (let i = 0; i < islands.length; i++) {
        for (let j = i + 1; j < islands.length; j++) {
          const u = islands[i], v = islands[j];
          if (u.y === v.y) {
            const minX = Math.min(u.x, v.x), maxX = Math.max(u.x, v.x);
            if (!islands.some(w => w.y === u.y && w.x > minX && w.x < maxX)) {
              allPairs.push({ u: u.id, v: v.id, orient: 'H', min: minX, max: maxX, fixed: u.y });
            }
          } else if (u.x === v.x) {
            const minY = Math.min(u.y, v.y), maxY = Math.max(u.y, v.y);
            if (!islands.some(w => w.x === u.x && w.y > minY && w.y < maxY)) {
              allPairs.push({ u: u.id, v: v.id, orient: 'V', min: minY, max: maxY, fixed: u.x });
            }
          }
        }
      }

      const checkIntersect = (p1, p2) => {
        if (p1.orient === p2.orient) return false;
        const h = p1.orient === 'H' ? p1 : p2;
        const v = p1.orient === 'V' ? p1 : p2;
        return (h.fixed > v.min && h.fixed < v.max && v.fixed > h.min && v.fixed < h.max);
      };

      const parent = islands.map((_, i) => i);
      const find = x => (parent[x] === x ? x : (parent[x] = find(parent[x])));
      const union = (x, y) => {
        const rx = find(x), ry = find(y);
        if (rx !== ry) { parent[rx] = ry; return true; }
        return false;
      };

      const laidPairs = [];
      allPairs.sort(() => Math.random() - 0.5);

      for (let i = 0; i < allPairs.length; i++) {
        const p = allPairs[i];
        if (find(p.u) !== find(p.v)) {
          if (!laidPairs.some(lp => checkIntersect(p, lp))) {
            union(p.u, p.v);
            laidPairs.push({ ...p, count: 1 + Math.floor(Math.random() * 2) });
          }
        }
      }

      for (let i = 0; i < allPairs.length; i++) {
        const p = allPairs[i];
        const existing = laidPairs.find(lp => lp.u === p.u && lp.v === p.v);
        if (existing) {
          if (existing.count < 2 && Math.random() > 0.4) existing.count = 2;
        } else {
          if (!laidPairs.some(lp => checkIntersect(p, lp)) && Math.random() > 0.6) {
            laidPairs.push({ ...p, count: 1 + Math.floor(Math.random() * 2) });
          }
        }
      }

      islands.forEach(isl => {
        isl.deg = laidPairs.reduce((acc, lp) => {
          if (lp.u === isl.id || lp.v === isl.id) return acc + lp.count;
          return acc;
        }, 0);
      });

      if (islands.some(i => i.deg === 0)) {
        return PUZZLE_SEEDS[mode][0];
      }

      return { cols, rows, islands };
    }

    function handleTabClick(targetMode) {

    function setMode(mode, keepScore = true) {
      currentMode = mode;
      modeStepIdx = 0;
      document.querySelectorAll('#bridges-app .mode-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById('bg-btn-' + mode.toLowerCase());
      if (activeBtn) activeBtn.classList.add('active');

      const timerWrap = document.getElementById('bg-timer-wrap');
      if (timerWrap) timerWrap.style.display = mode === 'HARD' ? 'flex' : 'none';

      resetGame(keepScore);
    }

    function resetGame(keepScore = false) {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = null;

      if (!keepScore) {
        score = 0;
        round = 1;
        modeStepIdx = 0;
      }

      loadNextPuzzle(true);
    }

    function loadNextPuzzle(isInitial = false) {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = null;

      isCurrentSolved = false;
      selectedIsland = -1;
      hintCount = 0;
      quizSolved = false;

      const actionBtn = document.getElementById('bg-main-action-btn');
      if (actionBtn) {
        actionBtn.style.background = '#3b82f6';
        actionBtn.innerHTML = '<span>✅ 최종 완성 제출</span>';
      }

      const pool = PUZZLE_SEEDS[currentMode] || PUZZLE_SEEDS.EASY;
      if (modeStepIdx < pool.length) {
        currentPuzzle = JSON.parse(JSON.stringify(pool[modeStepIdx]));
      } else {
        currentPuzzle = generateConstructivePuzzle(currentMode);
      }

      validPairs = [];
      const islands = currentPuzzle.islands;
      for (let i = 0; i < islands.length; i++) {
        for (let j = i + 1; j < islands.length; j++) {
          const u = islands[i];
          const v = islands[j];

          if (u.y === v.y) {
            const minX = Math.min(u.x, v.x);
            const maxX = Math.max(u.x, v.x);
            const blocked = islands.some(w => w.y === u.y && w.x > minX && w.x < maxX);
            if (!blocked) {
              validPairs.push({
                u: u.id, v: v.id, key: `${u.id}-${v.id}`,
                orientation: 'H', minCoord: minX, maxCoord: maxX, fixedCoord: u.y
              });
            }
          }
          else if (u.x === v.x) {
            const minY = Math.min(u.y, v.y);
            const maxY = Math.max(u.y, v.y);
            const blocked = islands.some(w => w.x === u.x && w.y > minY && w.y < maxY);
            if (!blocked) {
              validPairs.push({
                u: u.id, v: v.id, key: `${u.id}-${v.id}`,
                orientation: 'V', minCoord: minY, maxCoord: maxY, fixedCoord: u.x
              });
            }
          }
        }
      }

      bridgeState = {};
      validPairs.forEach(p => bridgeState[p.key] = 0);

      if (currentMode === 'HARD') {
        timeLeft = 420;
        timerInterval = setInterval(() => {
          if (isGameOver || isCurrentSolved) return;
          timeLeft--;
          if (timeLeft <= 0) {
            timeLeft = 0;
            triggerGameOver('⏰ 도전 모드 타임어택 제한 시간 종료!');
          }
          updateUI();
        }, 1000);
      }

      setupQuiz();
      renderSvg();
      updateUI();

      const stageDesc = modeStepIdx < pool.length ? `#${modeStepIdx + 1}` : `역산자율 #${modeStepIdx - pool.length + 1}`;
      if (!isInitial) {
        showBanner(`🚀 [ROUND #${round} / ${stageDesc}] 새로운 섬 지도 연결 개시! 이전 점수를 이어갑니다.`, '#38bdf8');
      } else {
        showBanner(`💡 섬 ${islands.length}개 로드 완료! 섬 사이 통로를 클릭하여 다리를 건설하세요.`, '#38bdf8');
      }
    }

    function setupQuiz() {
      const promptEl = document.getElementById('bg-quiz-prompt');
      const inputEl = document.getElementById('bg-quiz-input');
      const actionsEl = document.getElementById('bg-quiz-actions');

      if (!promptEl || !currentPuzzle) return;

      const totalDegSum = currentPuzzle.islands.reduce((acc, cur) => acc + cur.deg, 0);
      const correctBridgeCount = totalDegSum / 2;

      if (currentMode === 'EASY') {
        promptEl.innerHTML = `📐 <b>[악수 보조정리 관찰]</b> 이 섬들의 숫자 총합은 <b style="color:#38bdf8;">${totalDegSum}</b>입니다! 따라서 완성될 총 다리 개수는 정확히 절반인 <b style="color:#34d399;">${correctBridgeCount}개</b>입니다.`;
        if (actionsEl) actionsEl.style.display = 'none';
      } else {
        promptEl.innerHTML = `📐 <b>[악수 보조정리 퀴즈]</b> 이 지도에 적힌 모든 섬의 차수 합은 <b>${totalDegSum}</b>입니다. 완성될 <b>다리의 총 개수</b>는 몇 개일까요?`;
        if (actionsEl) actionsEl.style.display = 'flex';
        if (inputEl) { inputEl.value = ''; inputEl.disabled = false; }
      }
    }

    function checkQuiz() {
      if (quizSolved || isGameOver) return;
      const inputEl = document.getElementById('bg-quiz-input');
      const val = parseInt(inputEl?.value || '');

      const totalDegSum = currentPuzzle.islands.reduce((acc, cur) => acc + cur.deg, 0);
      const ans = totalDegSum / 2;

      if (val === ans) {
        quizSolved = true;
        score += 5;
        updateUI();
        if (inputEl) inputEl.disabled = true;
        const actionsEl = document.getElementById('bg-quiz-actions');
        if (actionsEl) actionsEl.innerHTML = '<span style="color:#34d399; font-weight:900;">🎉 정답 (+5점)! 차수 합의 절반이 다리 수입니다!</span>';
        showBanner(`🎉 퀴즈 정답! 다리 1개가 양쪽 섬의 차수를 1씩 올리므로 총 다리 수는 ${ans}개입니다 (+5점)`, '#34d399');
      } else {
        showBanner(`❌ 퀴즈 오답! 힌트: 모든 섬에 적힌 숫자의 합(${totalDegSum})을 2로 나누어 보세요!`, '#f87171');
      }
    }

    function renderSvg() {
      const svgEl = document.getElementById('bg-svg-canvas');
      if (!svgEl || !currentPuzzle) return;

      const cols = currentPuzzle.cols;
      const rows = currentPuzzle.rows;
      const cellW = 460 / cols;
      const cellH = 400 / rows;
      const getPt = (col, row) => ({ x: 20 + col * cellW, y: 20 + row * cellH });

      let bridgesHtml = '';
      validPairs.forEach(p => {
        const u = currentPuzzle.islands.find(w => w.id === p.u);
        const v = currentPuzzle.islands.find(w => w.id === p.v);
        const pt1 = getPt(u.x, u.y);
        const pt2 = getPt(v.x, v.y);
        const count = bridgeState[p.key] || 0;

        bridgesHtml += `
          <line x1="${pt1.x}" y1="${pt1.y}" x2="${pt2.x}" y2="${pt2.y}" stroke="transparent" stroke-width="24" class="bridge-hit-area" onclick="Bridges.onBridgeClick('${p.key}')"/>
          <line x1="${pt1.x}" y1="${pt1.y}" x2="${pt2.x}" y2="${pt2.y}" stroke="transparent" stroke-width="6" class="bridge-preview"/>
        `;

        if (count === 1) {
          bridgesHtml += `<line x1="${pt1.x}" y1="${pt1.y}" x2="${pt2.x}" y2="${pt2.y}" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" pointer-events="none"/>`;
        } else if (count === 2) {
          const offset = 4;
          if (p.orientation === 'H') {
            bridgesHtml += `
              <line x1="${pt1.x}" y1="${pt1.y - offset}" x2="${pt2.x}" y2="${pt2.y - offset}" stroke="#facc15" stroke-width="5" stroke-linecap="round" pointer-events="none"/>
              <line x1="${pt1.x}" y1="${pt1.y + offset}" x2="${pt2.x}" y2="${pt2.y + offset}" stroke="#facc15" stroke-width="5" stroke-linecap="round" pointer-events="none"/>
            `;
          } else {
            bridgesHtml += `
              <line x1="${pt1.x - offset}" y1="${pt1.y}" x2="${pt2.x - offset}" y2="${pt2.y}" stroke="#facc15" stroke-width="5" stroke-linecap="round" pointer-events="none"/>
              <line x1="${pt1.x + offset}" y1="${pt1.y}" x2="${pt2.x + offset}" y2="${pt2.y}" stroke="#facc15" stroke-width="5" stroke-linecap="round" pointer-events="none"/>
            `;
          }
        }
      });

      let islandsHtml = '';
      currentPuzzle.islands.forEach(isl => {
        const pt = getPt(isl.x, isl.y);
        const curDeg = getCurDegree(isl.id);
        let fillColor = '#1e293b';
        let strokeColor = '#38bdf8';

        if (curDeg === isl.deg) {
          fillColor = '#064e3b';
          strokeColor = '#34d399';
        } else if (curDeg > isl.deg) {
          fillColor = '#7f1d1d';
          strokeColor = '#f87171';
        }

        if (selectedIsland === isl.id) {
          strokeColor = '#facc15';
        }

        islandsHtml += `
          <g onclick="Bridges.onIslandClick(${isl.id})">
            <circle cx="${pt.x}" cy="${pt.y}" r="22" fill="${fillColor}" stroke="${strokeColor}" stroke-width="3.5" class="island-circle"/>
            <text x="${pt.x}" y="${pt.y + 6}" fill="#ffffff" font-size="16" text-anchor="middle" class="island-text">${isl.deg}</text>
          </g>
        `;
      });

      svgEl.innerHTML = `
        <rect x="0" y="0" width="500" height="440" fill="#020617"/>
        <g id="bg-bridges-layer">${bridgesHtml}</g>
        <g id="bg-islands-layer">${islandsHtml}</g>
      `;
    }

    function getCurDegree(islandId) {
      let sum = 0;
      validPairs.forEach(p => {
        if (p.u === islandId || p.v === islandId) {
          sum += (bridgeState[p.key] || 0);
        }
      });
      return sum;
    }

    function onBridgeClick(pairKey) {
      if (isGameOver || isCurrentSolved) return;
      const targetPair = validPairs.find(p => p.key === pairKey);
      if (!targetPair) return;

      const curCount = bridgeState[pairKey] || 0;
      const nextCount = (curCount + 1) % 3;

      if (nextCount > curCount && checkIntersection(targetPair)) {
        showBanner(`❌ 교차 차단! 다리는 서로 가로질러 교차할 수 없습니다 (평면 그래프 조건)`, '#f87171');
        return;
      }

      bridgeState[pairKey] = nextCount;
      renderSvg();
      checkAutoCompletion();
    }

    function checkIntersection(newPair) {
      for (let i = 0; i < validPairs.length; i++) {
        const other = validPairs[i];
        if (other.key === newPair.key) continue;
        const count = bridgeState[other.key] || 0;
        if (count === 0) continue;

        if (newPair.orientation !== other.orientation) {
          const hPair = newPair.orientation === 'H' ? newPair : other;
          const vPair = newPair.orientation === 'V' ? newPair : other;

          if (hPair.fixedCoord > vPair.minCoord && hPair.fixedCoord < vPair.maxCoord &&
              vPair.fixedCoord > hPair.minCoord && vPair.fixedCoord < hPair.maxCoord) {
            return true;
          }
        }
      }
      return false;
    }

    function onIslandClick(id) {
      if (isGameOver || isCurrentSolved) return;

      if (selectedIsland === -1) {
        selectedIsland = id;
        renderSvg();
        showBanner(`👆 섬 [차수 ${currentPuzzle.islands.find(i=>i.id===id).deg}] 선택! 연결할 옆 섬을 클릭하세요.`, '#facc15');
        return;
      }

      if (selectedIsland === id) {
        selectedIsland = -1;
        renderSvg();
        showBanner('💡 섬 선택이 취소되었습니다.', '#94a3b8');
        return;
      }

      const key1 = `${selectedIsland}-${id}`;
      const key2 = `${id}-${selectedIsland}`;
      const pair = validPairs.find(p => p.key === key1 || p.key === key2);

      if (pair) {
        onBridgeClick(pair.key);
        selectedIsland = -1;
      } else {
        selectedIsland = id;
        renderSvg();
        showBanner('⚠️ 두 섬 사이에 방해 섬이 있거나 직선상에 없어 연결할 수 없습니다. 다른 섬을 선택하세요.', '#f87171');
      }
    }

    function useHint() {
      if (isGameOver || isCurrentSolved) return;
      hintCount++;
      score = Math.max(0, score - 5);
      updateUI();

      for (let i = 0; i < validPairs.length; i++) {
        const p = validPairs[i];
        const cur = bridgeState[p.key] || 0;
        if (cur < 2 && !checkIntersection(p)) {
          bridgeState[p.key] = cur + 1;
          renderSvg();
          showBanner(`💡 확정 다리 힌트 적용 (-5점)! 두 섬 간의 다리를 연결했습니다.`, '#facc15');
          checkAutoCompletion();
          return;
        }
      }
      showBanner(`⚠️ 더 이상 추천할 다리가 없습니다!`, '#f87171');
    }

    function checkAutoCompletion() {
      const allDegOk = currentPuzzle.islands.every(isl => getCurDegree(isl.id) === isl.deg);
      if (allDegOk && checkConnectivity()) {
        onMainAction();
      }
    }

    function checkConnectivity() {
      if (currentPuzzle.islands.length === 0) return true;
      const adj = {};
      currentPuzzle.islands.forEach(i => adj[i.id] = []);

      validPairs.forEach(p => {
        if ((bridgeState[p.key] || 0) > 0) {
          adj[p.u].push(p.v);
          adj[p.v].push(p.u);
        }
      });

      const visited = new Set();
      const queue = [currentPuzzle.islands[0].id];
      visited.add(currentPuzzle.islands[0].id);

      while (queue.length > 0) {
        const cur = queue.shift();
        adj[cur].forEach(nxt => {
          if (!visited.has(nxt)) {
            visited.add(nxt);
            queue.push(nxt);
          }
        });
      }

      return visited.size === currentPuzzle.islands.length;
    }

    function onMainAction() {
      if (isCurrentSolved) {
        round++;
        modeStepIdx++;

        const pool = PUZZLE_SEEDS[currentMode] || PUZZLE_SEEDS.EASY;
        if (currentMode === 'EASY' && modeStepIdx >= pool.length && modeStepIdx >= 12) {
          showBanner(`🎉 쉬움 12라운드 완벽 마스터! [🔵 보통 모드(9×9)]로 자동 승급하여 누적 점수가 이어집니다!`, '#facc15');
          setMode('NORMAL', true);
        } else if (currentMode === 'NORMAL' && modeStepIdx >= pool.length && modeStepIdx >= 12) {
          showBanner(`🔥 보통 12라운드 완벽 마스터! [🟣 도전 모드(11×11)]로 자동 승급하여 누적 점수가 이어집니다!`, '#facc15');
          setMode('HARD', true);
        } else {
          loadNextPuzzle(false);
        }
      } else {
        checkSolution();
      }
    }

    function checkSolution() {
      if (isGameOver || isCurrentSolved) return;

      for (let i = 0; i < currentPuzzle.islands.length; i++) {
        const isl = currentPuzzle.islands[i];
        const cur = getCurDegree(isl.id);
        if (cur !== isl.deg) {
          score = Math.max(0, score - 2);
          updateUI();
          showBanner(`❌ 일부 섬의 숫자(차수)가 맞지 않습니다 (-2점). 초록색으로 모두 충족시켜야 합니다!`, '#f87171');
          return;
        }
      }

      if (!checkConnectivity()) {
        score = Math.max(0, score - 2);
        updateUI();
        showBanner(`⚠️ 모든 섬의 차수는 맞지만, 섬 그룹이 2개 이상으로 분리되어 있습니다 (-2점). 모든 섬이 다리로 하나로 연결되어야 합니다!`, '#f87171');
        return;
      }

      isCurrentSolved = true;
      let gain = 20;
      if (currentMode === 'NORMAL') gain = 25;
      if (currentMode === 'HARD') gain = 35;
      if (hintCount === 0) gain += 5;

      score += gain;
      updateUI();

      showBanner(`🎉 완벽합니다! 차수와 단일 연결성 조건을 모두 만족했습니다! (+${gain}점 누적) [▶ 다음 지도 진행 (+)]을 누르세요.`, '#34d399');

      const actionBtn = document.getElementById('bg-main-action-btn');
      if (actionBtn) {
        actionBtn.style.background = '#10b981';
        actionBtn.innerHTML = '<span>▶ 다음 섬 지도 진행 (+)</span>';
      }
    }

    function showBanner(msg, color) {
      const banner = document.getElementById('bg-feedback');
      if (banner) {
        banner.textContent = msg;
        banner.style.color = color || '#38bdf8';
      }
    }

    function manualStopAndSave() {
      triggerGameOver(`🏁 [${currentMode} ROUND #${round}] 최종 조기 정산 완료!`);
    }

    function triggerGameOver(reasonMsg) {
      if (isGameOver && !reasonMsg.includes('정산')) return;
      isGameOver = true;
      if (timerInterval) clearInterval(timerInterval);

      showBanner(reasonMsg, '#f87171');
      setTimeout(() => {
        showRankingModal(reasonMsg);
      }, 500);
    }

    function updateUI() {
      const pool = PUZZLE_SEEDS[currentMode] || PUZZLE_SEEDS.EASY;
      const roundVal = document.getElementById('bg-round-val');
      const islandVal = document.getElementById('bg-island-val');
      const timerVal = document.getElementById('bg-timer-val');
      const hintVal = document.getElementById('bg-hint-val');
      const scoreVal = document.getElementById('bg-score-val');

      const stageDesc = modeStepIdx < pool.length ? `#${modeStepIdx + 1}` : `역산자율 #${modeStepIdx - pool.length + 1}`;
      if (roundVal) roundVal.textContent = `ROUND #${round} (${currentMode === 'EASY' ? '쉬움' : currentMode === 'NORMAL' ? '보통' : '도전'} ${stageDesc})`;
      if (islandVal) islandVal.textContent = `${currentPuzzle ? currentPuzzle.islands.length : 6}개`;
      if (timerVal) timerVal.textContent = `${timeLeft}초`;
      if (hintVal) hintVal.textContent = `${hintCount}회`;
      if (scoreVal) scoreVal.textContent = `${score}점`;
    }

    function showGuideModal() { document.getElementById('bg-guide-modal')?.classList.add('open'); }
    function showRankingModal(reasonMsg = '') {
      document.getElementById('bg-ranking-modal')?.classList.add('open');
      const titleEl = document.getElementById('bg-ranking-modal-title');
      const sumEl = document.getElementById('bg-gameover-summary');

      if (titleEl) {
        titleEl.textContent = reasonMsg ? '🏁 다리 놓기 수사 기록 정산' : '🏆 다리 놓기 명예의 전당';
      }

      if (sumEl) {
        sumEl.innerHTML = `
          <div style="font-size:1.15rem; font-weight:900; color:#f87171; margin-bottom:6px;">${reasonMsg || '명예의 전당 랭킹 조회'}</div>
          <div style="font-size:1.35rem; font-weight:900; color:#38bdf8;">최종 누적 점수: ${score}점</div>
          <div style="font-size:0.98rem; color:#facc15; margin-top:4px; font-weight:800;">최종 멈춘 위치: [${currentMode}] ROUND #${round}</div>
        `;
      }

      if (typeof loadGameLeaderboard === 'function') {
        loadGameLeaderboard('다리놓기하시와카케로', true, 'board-bridges');
      }
    }

    function renderBottomLeaderboard() {
      if (typeof loadGameLeaderboard === 'function') {
        // 🌟 수정 완료: 내림차순 정렬 (true)
        loadGameLeaderboard('다리놓기하시와카케로', true, 'board-bridges-bottom');
      } else {
        try {
          let list = JSON.parse(localStorage.getItem('mathlab_lb_bridges') || '[]');
          const bottomEl = document.getElementById('board-bridges-bottom');
          if (bottomEl) {
            if (list.length === 0) {
              bottomEl.innerHTML = '<p style="text-align:center; color:#94a3b8; padding:12px 0;">아직 등록된 명예의 전당 기록이 없습니다. 첫 번째 다리 건설 왕이 되어보세요!</p>';
            } else {
              bottomEl.innerHTML = `
                <div style="display:flex; flex-direction:column; gap:6px;">
                  ${list.slice(0, 5).map((item, idx) => `
                    <div style="display:flex; justify-content:space-between; align-items:center; background:#0f172a; padding:10px 14px; border-radius:10px; border:1px solid #334155;">
                      <span style="font-weight:800; color:${idx === 0 ? '#facc15' : '#cbd5e1'};">${idx === 0 ? '👑 1위' : `${idx + 1}위`} - ${escapeHTML(item.nickname)}</span>
                      <span style="color:#38bdf8; font-weight:900;">${item.score}점 (${item.modeSummary || item.mode || 'EASY'})</span>
                    </div>
                  `).join('')}
                </div>
              `;
            }
          }
        } catch(e) {}
      }
    }

    function closeModals() {
      document.querySelectorAll('.game-bridges .modal-backdrop').forEach(el => el.classList.remove('open'));
    }

    function submitRankScore() {
      const input = document.getElementById('bg-nickname-input');
      const nickname = input ? input.value.trim() : '';
      if (!nickname) {
        const titleEl = document.getElementById('bg-ranking-modal-title');
        if(titleEl) { titleEl.innerHTML = '<span style="color:#f87171;">⚠️ 닉네임을 입력해 주세요!</span>'; setTimeout(() => titleEl.textContent = '🏆 다리 놓기 명예의 전당', 2000); }
        return;
      }

      const modeSummary = `${currentMode} (R#${round})`;

      try {
        let list = JSON.parse(localStorage.getItem('mathlab_lb_bridges') || '[]');
        const dateStr = new Date().toLocaleDateString('ko-KR', { month: '2-digit', day: '2-digit' });
        list.push({ nickname, score, date: dateStr, mode: currentMode, round, modeSummary });
        list.sort((a, b) => b.score - a.score);
        localStorage.setItem('mathlab_lb_bridges', JSON.stringify(list.slice(0, 20)));
      } catch (e) {}

      if (typeof window.submitRanking === 'function') {
        window.submitRanking('다리놓기하시와카케로', score, true, 'bg-nickname-input', 'board-bridges');
      } else if (typeof window.parent?.submitRanking === 'function') {
        window.parent.submitRanking('다리놓기하시와카케로', score, true, 'bg-nickname-input', 'board-bridges');
      } else {
        const titleEl = document.getElementById('bg-ranking-modal-title');
        if(titleEl) { titleEl.innerHTML = '<span style="color:#34d399;">🎉 명예의 전당 등록 완료!</span>'; }
        if (input) input.value = '';
        setTimeout(() => closeModals(), 1500);
      }

      renderBottomLeaderboard();
    }

    function goHome() {
      destroy();
      if (window.LegacyBridge && typeof window.LegacyBridge.backHome === 'function') { try { window.LegacyBridge.backHome(); return; } catch(e) {} }
      if (typeof window.renderLegacyDashboardHome === 'function') { try { window.renderLegacyDashboardHome(); return; } catch(e) {} }
      if (typeof window.MathLabRenderHome === 'function') { try { window.MathLabRenderHome(); return; } catch(e) {} }

      const mathlabRoot = document.getElementById('mathlab-root');
      const legacyRoot = document.getElementById('legacy-root');
      if (mathlabRoot) mathlabRoot.classList.add('hidden');
      if (legacyRoot) legacyRoot.classList.remove('hidden');

      const dashboard = document.getElementById('dashboard-screen');
      if (dashboard) { dashboard.classList.add('active'); dashboard.style.display = ''; }
      window.scrollTo({ top: 0, left: 0, behavior: 'smooth' });
    }

    function destroy() {
      if (timerInterval) clearInterval(timerInterval);
    }

    return {
      id: 'bridges',
      title: '다리 놓기 (Bridges)',
      icon: '🌉',
      mount, resetGame, destroy, setMode, handleTabClick, onBridgeClick, onIslandClick,
      useHint, checkQuiz, onMainAction, manualStopAndSave,
      showGuideModal, showRankingModal, closeModals, submitRankScore, renderBottomLeaderboard, goHome
    };
  })();

  /* 하단 안전 등록 4중 브리지 */
  function registerBridges() {
    if (typeof window.MathLabGames !== 'undefined' && typeof window.MathLabGames.register === 'function') {
      if (!window.MathLabGames.get('bridges')) {
        try {
          window.MathLabGames.register({
            id: Bridges.id,
            title: Bridges.title,
            icon: Bridges.icon,
            sourceType: 'new',
            mount(container, context) { Bridges.mount(container, context); },
            reset() { Bridges.resetGame(false); },
            destroy() { Bridges.destroy(); },
            goHome() { Bridges.goHome(); }
          });
        } catch (e) {
          console.warn('bridges 안전 등록 방어:', e);
        }
      }
    }
  }

  registerBridges();
  window.addEventListener('DOMContentLoaded', registerBridges);
  setTimeout(registerBridges, 100);
  setTimeout(registerBridges, 500);

  window.Bridges = Bridges;
  window.initBridgesGame = function() {
    const target = document.getElementById('game-bridges-app') || document.getElementById('mathlab-view');
    Bridges.mount(target);
  };
