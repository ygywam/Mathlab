  /* 체스 타일 색상 (다크 체스 슬레이트 테마) */

  .game-eight-queens .chess-cell.dark {

  .game-eight-queens .chess-cell.conflict {

  .game-eight-queens .chess-cell.demo-checking {

  /* 발견된 해(Solutions) 미니보드 컬렉션 모달 */

  @keyframes queenDrop {

  }

  @keyframes pulseConflict {
    0% { transform: scale(1); }
    100% { transform: scale(1.05); }

<script>
  /* ==========================================================================
     EightQueens 모듈 - 8-Queens 챌린지 완결판
     (로컬 스토리지 데이터 자동 정제 & 안전 모달 & GAS 표준 홈 브리지)
     ========================================================================== */
  const EightQueens = (function() {
    let boardSize = 8;
    let board = [];
    let score = 0;
    let showAttackRange = false;
    let isDemoRunning = false;
    let isDemoPaused = false;
    let demoSpeedMs = 400;
    let demoTimer = null;
    let demoGenerator = null;
    let toastTimer = null;

    const escapeHTML = (str) => {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, function(match) {
        const escape = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
        return escape[match];
      });
    };

    function showToast(msg, isError = false) {
      let host = document.getElementById('eight-queens-app');
      if (!host) return;
      let toast = host.querySelector('#eq-toast');
      if (!toast) {
        toast = document.createElement('div');
        toast.id = 'eq-toast';
        toast.style.cssText = 'position:absolute; top:20px; left:50%; transform:translateX(-50%); padding:12px 24px; border-radius:12px; font-weight:800; font-size:1rem; z-index:99999; box-shadow:0 10px 25px rgba(0,0,0,0.5); transition:all 0.3s; text-align:center; min-width:300px; pointer-events:none; opacity:0;';
        host.appendChild(toast);
      }
      toast.style.background = isError ? '#ef4444' : '#10b981';
      toast.style.color = isError ? '#ffffff' : '#0f172a';
      toast.textContent = msg;
      void toast.offsetWidth;
      toast.style.opacity = '1';
      toast.style.top = '20px';
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.top = '0px';
      }, 3000);
    }

    const MAX_SOLUTIONS = { 4: 2, 6: 4, 8: 92 };

    function mount(container, context) {
      let target = null;
      if (typeof container === 'string') target = document.querySelector(container);
      else if (container instanceof HTMLElement) target = container;
      if (!target) target = document.getElementById('mathlab-view') || document.getElementById('new-root') || document.getElementById('game-container');

      if (!target || target === document.body) {
        let host = document.getElementById('eight-queens-force-host');
        if (!host) {
          host = document.createElement('div');
          host.id = 'eight-queens-force-host';
          host.style.cssText = 'width:100%; max-width:1040px; margin:0 auto; padding:16px; box-sizing:border-box; z-index:999; position:relative; background:#0f172a; border-radius:24px;';
          const footer = document.querySelector('footer, #footer, .app-footer, #legacy-footer, .mathlab-footer, .legacy-footer');
          if (footer && footer.parentNode) {
            footer.parentNode.insertBefore(host, footer);
          } else {
            document.body.appendChild(host);
          }
        }
        target = host;
      }

      if (target) {
        target.style.display = '';
      }

      target.innerHTML = `
        <div id="eight-queens-app" class="game-eight-queens">
          <!-- 상단 헤더 바 -->
          <div class="stats-bar">
            <div class="title-group">
              <div class="title-icon">♛</div>
              <div class="title-text">
                <h2>8-Queens 챌린지</h2>
                <span>제약 조건 추론 & 백트래킹 알고리즘 탐구</span>
              </div>
            </div>
            <div class="stats-group">
              <div class="stat-box">
                <span class="label">보드 크기</span>
                <span id="eq-board-size-display" class="value">8 × 8</span>
              </div>
              <div class="stat-box">
                <span class="label">배치 퀸</span>
                <span id="eq-queen-count" class="value">0 / 8</span>
              </div>
              <div class="stat-box">
                <span class="label">발견한 해</span>
                <span id="eq-solution-count" class="value accent">0 / 92</span>
              </div>
              <div class="stat-box">
                <span class="label">누적 점수</span>
                <span id="eq-score" class="value">0</span>
              </div>
            </div>
          </div>

          <!-- 조작 및 모드 선택 패널 (2줄 균등 분할) -->
          <div class="control-panel">
            <div class="mode-tabs-wrapper">
              <div class="mode-tabs">
                <button type="button" class="mode-tab" id="eq-tab-4" onclick="EightQueens.setBoardSize(4)">입문 (4×4)</button>
                <button type="button" class="mode-tab" id="eq-tab-6" onclick="EightQueens.setBoardSize(6)">기본 (6×6)</button>
                <button type="button" class="mode-tab active" id="eq-tab-8" onclick="EightQueens.setBoardSize(8)">도전 (8×8)</button>
              </div>
            </div>

            <div class="action-buttons-group">
              <div class="action-row row-top">
                <button type="button" class="btn" id="eq-btn-hint" onclick="EightQueens.toggleHint()">
                  <span>👁️ 공격 범위 표시 (힌트: -5점)</span>
                </button>
                <button type="button" class="btn demo" id="eq-btn-demo" onclick="EightQueens.startDemo()">
                  <span>🤖 백트래킹 자동 시연</span>
                </button>
                <button type="button" class="btn gold" onclick="EightQueens.showSolutionsModal()">
                  <span>🏆 발견 해 컬렉션</span>
                </button>
                <button type="button" class="btn" onclick="EightQueens.resetGame()">
                  <span>🔄 보드 초기화</span>
                </button>
              </div>
              <div class="action-row row-bottom">
                <button type="button" class="btn" onclick="EightQueens.showGuideModal()">
                  <span>❓ 규칙 설명</span>
                </button>
                <button type="button" class="btn primary" onclick="EightQueens.showRankingModal()">
                  <span>👑 명예의 전당</span>
                </button>
                <button type="button" class="btn" onclick="EightQueens.goHome()" style="background:#475569;">
                  <span>🏠 홈으로</span>
                </button>
              </div>
            </div>
          </div>

          <!-- 자동 시연 (Demo) 조작 바 -->
          <div id="eq-demo-controls" class="demo-controls">
            <div class="demo-row">
              <span style="font-weight: 800; color: #c4b5fd; font-size: 0.9rem;">🤖 백트래킹 알고리즘 탐색 관찰 모드 (점수 미저장)</span>
              <div style="display:flex; gap:6px;">
                <button type="button" class="btn" id="eq-demo-play-btn" onclick="EightQueens.toggleDemoPause()" style="padding:4px 10px;">⏸️ 일시정지</button>
                <button type="button" class="btn" onclick="EightQueens.stepDemo()" style="padding:4px 10px;">⏭️ 1수 진행</button>
                <button type="button" class="btn" onclick="EightQueens.stopDemo()" style="padding:4px 10px; background:#ef4444;">⏹️ 시연 종료</button>
              </div>
            </div>
            <div class="demo-row">
              <span style="font-size: 0.8rem; color: #e2e8f0;">탐색 속도 조절:</span>
              <div style="display:flex; gap:6px;">
                <button type="button" class="mode-tab" onclick="EightQueens.setDemoSpeed(800)">0.5x (느림)</button>
                <button type="button" class="mode-tab active" id="eq-spd-1" onclick="EightQueens.setDemoSpeed(400)">1.0x (보통)</button>
                <button type="button" class="mode-tab" onclick="EightQueens.setDemoSpeed(150)">2.0x (빠름)</button>
                <button type="button" class="mode-tab" onclick="EightQueens.setDemoSpeed(30)">4.0x (초고속)</button>
              </div>
            </div>
          </div>

          <!-- 메인 보드 및 사이드 정보창 -->
          <div class="main-content">
            <div class="board-container">
              <div id="eq-chess-grid" class="chess-grid"></div>
            </div>

    function setBoardSize(size, isInitial = false) {
      stopDemo();
      boardSize = size;
      
      document.querySelectorAll('#eight-queens-app .mode-tab').forEach(btn => btn.classList.remove('active'));
      const activeTab = document.getElementById('eq-tab-' + size);
      if (activeTab) activeTab.classList.add('active');

      showAttackRange = (size === 4);
      updateHintButtonUI();

      resetBoardData();
      refreshBoardUI();
      updateStatusDisplay();
      if (!isInitial) {
        logMessage(`► 보드 크기가 ${size}×${size}(으)로 변경되었습니다. (해 목표: ${MAX_SOLUTIONS[size]}개)`, 'info');
      }
    }

    function resetBoardData() {
      board = Array.from({ length: boardSize }, () => Array(boardSize).fill(0));
    }

    function resetGame() {
      stopDemo();
      resetBoardData();
      refreshBoardUI();
      logMessage('► 보드가 초기화되었습니다. 다시 시도해보세요!', 'info');
    }

    function toggleHint() {
      if (boardSize === 4) {
        showAttackRange = !showAttackRange;
      } else {
        showAttackRange = !showAttackRange;
        if (showAttackRange) {
          score = Math.max(0, score - 5);
          logMessage('👁️ 공격 범위 힌트를 사용하여 점수가 5점 차감되었습니다.', 'conflict');
        }
      }
      updateHintButtonUI();
      refreshBoardUI();
      updateStatusDisplay();
    }

    function updateHintButtonUI() {
      const hintBtn = document.getElementById('eq-btn-hint');
      if (!hintBtn) return;
      if (showAttackRange) {
        hintBtn.style.background = '#38bdf8';
        hintBtn.style.color = '#0f172a';
        hintBtn.innerHTML = `<span>👁️ 공격 범위 표시 ON</span>`;
      } else {
        hintBtn.style.background = '#334155';
        hintBtn.style.color = '#f8fafc';
        hintBtn.innerHTML = `<span>👁️ 공격 범위 표시 (힌트: -5점)</span>`;
      }
    }

    function refreshBoardUI() {
      const grid = document.getElementById('eq-chess-grid');
      if (!grid) return;

      grid.style.gridTemplateColumns = `repeat(${boardSize}, 1fr)`;
      grid.innerHTML = '';

      const { attacks, conflicts } = analyzeBoardState();

      for (let r = 0; r < boardSize; r++) {
        for (let c = 0; c < boardSize; c++) {
          const cell = document.createElement('div');
          const isDark = (r + c) % 2 === 1;
          cell.className = `chess-cell ${isDark ? 'dark' : 'light'}`;

          if (board[r][c] === 1) {
            cell.classList.add('has-queen');
            cell.innerHTML = `<span class="queen-icon" style="color: ${isDark ? '#fbbf24' : '#f59e0b'};">♛</span>`;
            if (conflicts[r][c]) {
              cell.classList.add('conflict');
            }
          } else if (showAttackRange && attacks[r][c] > 0) {
            cell.classList.add('attack-hint');
          }

          cell.onclick = () => clickCell(r, c);
          grid.appendChild(cell);
        }
      }
    }

    function clickCell(r, c) {
      if (isDemoRunning) return;

      if (board[r][c] === 1) {
        board[r][c] = 0;
        logMessage(`[${r + 1}행, ${c + 1}열] 퀸을 회수했습니다.`, 'info');
      } else {
        board[r][c] = 1;
        logMessage(`[${r + 1}행, ${c + 1}열] 퀸을 배치했습니다.`, 'info');
      }

      refreshBoardUI();
      checkCompletion();
      updateStatusDisplay();
    }

    function analyzeBoardState() {
      const attacks = Array.from({ length: boardSize }, () => Array(boardSize).fill(0));
      const conflicts = Array.from({ length: boardSize }, () => Array(boardSize).fill(false));
      const queens = [];

      for (let r = 0; r < boardSize; r++) {
        for (let c = 0; c < boardSize; c++) {
          if (board[r][c] === 1) queens.push({ r, c });
        }
      }

      queens.forEach(q1 => {
        for (let i = 0; i < boardSize; i++) {
          if (i !== q1.c) attacks[q1.r][i]++;
          if (i !== q1.r) attacks[i][q1.c]++;
        }
        for (let d = -boardSize; d <= boardSize; d++) {
          if (d === 0) continue;
          if (q1.r + d >= 0 && q1.r + d < boardSize && q1.c + d >= 0 && q1.c + d < boardSize) attacks[q1.r + d][q1.c + d]++;
          if (q1.r + d >= 0 && q1.r + d < boardSize && q1.c - d >= 0 && q1.c - d < boardSize) attacks[q1.r + d][q1.c - d]++;
        }

        queens.forEach(q2 => {
          if (q1 === q2) return;
          if (q1.r === q2.r || q1.c === q2.c || Math.abs(q1.r - q2.r) === Math.abs(q1.c - q2.c)) {
            conflicts[q1.r][q1.c] = true;
          }
        });
      });

      return { attacks, conflicts, queensCount: queens.length };
    }

    function checkCompletion() {
      const { conflicts, queensCount } = analyzeBoardState();
      if (queensCount !== boardSize) return;

      let hasConflict = false;
      for (let r = 0; r < boardSize; r++) {
        for (let c = 0; c < boardSize; c++) {
          if (conflicts[r][c]) hasConflict = true;
        }
      }

      if (!hasConflict) {
        onSolutionFound(board);
      } else {
        logMessage(`⚠️ ${boardSize}개의 퀸을 모두 놓았으나, 서로 공격하는 퀸이 존재합니다! 충돌(빨간색)을 해결하세요.`, 'conflict');
      }
    }

    function onSolutionFound(currentBoard) {
      const solKey = currentBoard.map(row => row.join('')).join('-');
      const savedList = getSavedSolutions();

      const exists = savedList.some(s => s.key === solKey);
      if (!exists) {
        const basePoint = boardSize * 5;
        const newBonus = 10;
        score += (basePoint + newBonus);

        const newSol = {
          key: solKey,
          board: currentBoard.map(row => [...row]),
          date: new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' })
        };
        savedList.push(newSol);
        saveSolutions(savedList);

        logMessage(`🎉 [축하합니다!] 무충돌 N-Queens 완벽 배치 성공! (새로운 해 발견 +${basePoint + newBonus}점)`, 'success');
        setTimeout(() => {
          showToast(`🎉 새로운 무충돌 해 발견! +${basePoint + newBonus}점`);
          showSolutionsModal();
        }, 300);
      } else {
        logMessage(`✨ 무충돌 배치를 완성했습니다! (이미 컬렉션에 등록된 해입니다.)`, 'info');
      }
      updateStatusDisplay();
    }

    // 🌟 100% 안전한 데이터 정제 & 검증 필터 적용
    function getSavedSolutions() {
      try {
        const raw = localStorage.getItem(`mathlab_eq_solutions_${boardSize}`);
        if (!raw) return [];
        const list = JSON.parse(raw);
        if (!Array.isArray(list)) return [];

        const validList = [];
        const seenKeys = new Set();

        for (const sol of list) {
          if (!sol || !Array.isArray(sol.board) || sol.board.length !== boardSize) continue;
          
          let isValidShape = true;
          let queenCount = 0;
          for (let r = 0; r < boardSize; r++) {
            if (!Array.isArray(sol.board[r]) || sol.board[r].length !== boardSize) {
              isValidShape = false;
              break;
            }
            for (let c = 0; c < boardSize; c++) {
              if (sol.board[r][c] === 1) queenCount++;
            }
          }
          if (!isValidShape || queenCount !== boardSize) continue;

          const key = sol.board.map(row => row.join('')).join('-');
          if (!seenKeys.has(key)) {
            seenKeys.add(key);
            sol.key = key;
            validList.push(sol);
          }
        }

        // 최대 개수 제한 (이전 버그 등으로 초과 저장된 경우 방어)
        if (validList.length > MAX_SOLUTIONS[boardSize]) {
          validList.splice(MAX_SOLUTIONS[boardSize]);
        }

        if (validList.length !== list.length) {
          saveSolutions(validList);
        }

        return validList;
      } catch (e) {
        return [];
      }
    }

    function saveSolutions(list) {
      try {
        localStorage.setItem(`mathlab_eq_solutions_${boardSize}`, JSON.stringify(list));
      } catch (e) {}
    }

    function updateStatusDisplay() {
      const sizeEl = document.getElementById('eq-board-size-display');
      const countEl = document.getElementById('eq-queen-count');
      const solEl = document.getElementById('eq-solution-count');
      const scoreEl = document.getElementById('eq-score');

      if (sizeEl) sizeEl.textContent = `${boardSize} × ${boardSize}`;
      if (scoreEl) scoreEl.textContent = score.toLocaleString();

      const { queensCount } = analyzeBoardState();
      if (countEl) countEl.textContent = `${queensCount} / ${boardSize}`;

      const savedList = getSavedSolutions();
      if (solEl) solEl.textContent = `${savedList.length} / ${MAX_SOLUTIONS[boardSize]}`;
    }

    function logMessage(msg, type = 'info') {
      const logContainer = document.getElementById('eq-status-log');
      if (!logContainer) return;

      const item = document.createElement('div');
      item.className = `log-item ${type}`;
      item.textContent = msg;
      logContainer.appendChild(item);
      logContainer.scrollTop = logContainer.scrollHeight;
    }

    /* ==========================================================================
       발견 해 컬렉션 및 명예의 전당 모달 (예외 방어막 적용 완벽 구동)
       ========================================================================== */
    function showSolutionsModal() {
      const modal = document.getElementById('eq-solutions-modal');
      const gridEl = document.getElementById('eq-solutions-grid');
      const countSpan = document.getElementById('eq-modal-sol-count');
      const maxSpan = document.getElementById('eq-modal-max-count');
      if (!modal || !gridEl) return;

      const savedList = getSavedSolutions();
      if (countSpan) countSpan.textContent = savedList.length;
      if (maxSpan) maxSpan.textContent = MAX_SOLUTIONS[boardSize];

      gridEl.innerHTML = '';
      if (savedList.length === 0) {
        gridEl.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: #64748b; font-size: 0.85rem; padding: 20px 0;">아직 발견한 해가 없습니다. 직접 배치하거나 자동 시연으로 찾아보세요!</p>`;
      } else {
        savedList.forEach((sol, idx) => {
          try {
            const card = document.createElement('div');
            card.className = 'mini-board-card';
            card.onclick = () => {
              board = sol.board.map(r => [...r]);
              refreshBoardUI();
              closeModals();
              logMessage(`► 컬렉션 #${idx + 1} 해를 보드로 불러왔습니다.`, 'info');
              updateStatusDisplay();
            };

            let miniGridHtml = `<div class="mini-grid" style="grid-template-columns: repeat(${boardSize}, 1fr);">`;
            for (let r = 0; r < boardSize; r++) {
              for (let c = 0; c < boardSize; c++) {
                const isDark = (r + c) % 2 === 1;
                const hasQ = (sol.board[r] && sol.board[r][c] === 1);
                miniGridHtml += `<div class="mini-cell" style="background: ${isDark ? '#1e293b' : '#334155'}; color: #fbbf24;">${hasQ ? '♛' : ''}</div>`;
              }
            }
            miniGridHtml += `</div>`;

            card.innerHTML = `
              <span style="font-weight: 800; font-size: 0.8rem; color: #facc15;">#${idx + 1} 해</span>
              ${miniGridHtml}
              <span style="font-size: 0.7rem; color: #64748b;">${sol.date || ''}</span>
            `;
            gridEl.appendChild(card);
          } catch (err) {
            console.warn('개별 해 카드 렌더링 생략:', err);
          }
        });
      }
      modal.classList.add('open');
    }

    function clearSolutions() {
      localStorage.removeItem(`mathlab_eq_solutions_${boardSize}`);
      showSolutionsModal();
      updateStatusDisplay();
      logMessage(`► ${boardSize}×${boardSize} 보드의 발견 해 컬렉션이 초기화되었습니다.`, 'info');
      showToast('해 기록이 초기화되었습니다.');
    }

    function renderLocalLeaderboard() {
      const container = document.getElementById('board-eight-queens');
      if (!container) return;

      let list = [];
      try {
        list = JSON.parse(localStorage.getItem('mathlab_lb_eight_queens') || '[]');
      } catch (e) {}

      if (list.length === 0) {
        container.innerHTML = `<p style="color: #64748b; font-size: 0.85rem;">아직 명예의 전당 등록 기록이 없습니다. 점수를 누적하고 첫 랭커가 되어보세요!</p>`;
        return;
      }

      let html = `<table style="width:100%; border-collapse: collapse; font-size: 0.85rem; text-align: left;">
        <thead>
          <tr style="border-bottom: 1px solid #334155; color: #94a3b8;">
            <th style="padding: 6px;">순위</th>
            <th style="padding: 6px;">닉네임</th>
            <th style="padding: 6px; text-align: right;">점수</th>
            <th style="padding: 6px; text-align: right;">날짜</th>
          </tr>
        </thead>
        <tbody>`;

      list.slice(0, 10).forEach((item, idx) => {
        const medal = idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : `${idx + 1}위`;
        html += `
          <tr style="border-bottom: 1px solid rgba(255,255,255,0.04); color: #e2e8f0;">
            <td style="padding: 8px 6px; font-weight: 700;">${medal}</td>
            <td style="padding: 8px 6px; font-weight: 800; color: #38bdf8;">${escapeHTML(item.nickname)}</td>
            <td style="padding: 8px 6px; text-align: right; font-weight: 800; color: #facc15;">${item.score.toLocaleString()}점</td>
            <td style="padding: 8px 6px; text-align: right; color: #64748b; font-size: 0.75rem;">${escapeHTML(item.date || '')}</td>
          </tr>`;
      });

      html += `</tbody></table>`;
      container.innerHTML = html;
    }

    function submitRankScore() {
      const input = document.getElementById('eq-nickname-input');
      const nickname = input ? input.value.trim() : '';
      if (!nickname) {
        showToast('닉네임을 입력해 주세요.', true);
        return;
      }

      try {
        let list = JSON.parse(localStorage.getItem('mathlab_lb_eight_queens') || '[]');
        const dateStr = new Date().toLocaleDateString('ko-KR', { month: '2-digit', day: '2-digit' });
        list.push({ nickname, score, date: dateStr });
        list.sort((a, b) => b.score - a.score);
        list = list.slice(0, 20);
        localStorage.setItem('mathlab_lb_eight_queens', JSON.stringify(list));
      } catch (e) {}

      if (typeof window.submitRanking === 'function') {
        window.submitRanking('8-Queens 챌린지', score, true, 'eq-nickname-input', 'board-eight-queens');
      } else if (typeof submitRanking === 'function') {
        submitRanking('8-Queens 챌린지', score, true, 'eq-nickname-input', 'board-eight-queens');
      } else if (typeof window.parent?.submitRanking === 'function') {
        window.parent.submitRanking('8-Queens 챌린지', score, true, 'eq-nickname-input', 'board-eight-queens');
      } else {
        showToast(`🎉 명예의 전당 등록 완료!`);
        if (input) input.value = '';
        renderLocalLeaderboard();
      }
    }

    /* ==========================================================================
       백트래킹 자동 시연 (Auto-Demonstration Engine)
       ========================================================================== */
    function startDemo() {
      if (isDemoRunning) {
        stopDemo();
        return;
      }

      isDemoRunning = true;
      isDemoPaused = false;
      document.getElementById('eq-demo-controls')?.classList.add('active');
      const demoBtn = document.getElementById('eq-btn-demo');
      if (demoBtn) {
        demoBtn.innerHTML = `<span>⏹️ 시연 중지</span>`;
        demoBtn.style.background = '#ef4444';
      }

      resetBoardData();
      refreshBoardUI();
      logMessage('🤖 [자동 시연 시작] 백트래킹 탐색 과정을 1수씩 관찰합니다.', 'info');

      demoGenerator = solveBacktrackingGenerator(0);
      scheduleNextDemoStep();
    }

    function toggleDemoPause() {
      isDemoPaused = !isDemoPaused;
      const playBtn = document.getElementById('eq-demo-play-btn');
      if (playBtn) {
        playBtn.textContent = isDemoPaused ? '▶️ 계속 진행' : '⏸️ 일시정지';
      }
      if (!isDemoPaused) scheduleNextDemoStep();
    }

    function stepDemo() {
      if (!isDemoRunning || !demoGenerator) return;
      isDemoPaused = true;
      const playBtn = document.getElementById('eq-demo-play-btn');
      if (playBtn) playBtn.textContent = '▶️ 계속 진행';

      const res = demoGenerator.next();
      if (res.done) {
        logMessage('🏁 [시연 완료] 모든 유망한 경로 탐색이 종료되었습니다.', 'success');
        stopDemo();
      }
    }

    function setDemoSpeed(ms) {
      demoSpeedMs = ms;
      document.querySelectorAll('#eq-demo-controls .mode-tab').forEach(b => b.classList.remove('active'));
      if (ms === 800) document.querySelectorAll('#eq-demo-controls .mode-tab')[0].classList.add('active');
      if (ms === 400) document.querySelectorAll('#eq-demo-controls .mode-tab')[1].classList.add('active');
      if (ms === 150) document.querySelectorAll('#eq-demo-controls .mode-tab')[2].classList.add('active');
      if (ms === 30) document.querySelectorAll('#eq-demo-controls .mode-tab')[3].classList.add('active');
    }

    function scheduleNextDemoStep() {
      if (demoTimer) clearTimeout(demoTimer);
      if (!isDemoRunning || isDemoPaused) return;

      demoTimer = setTimeout(() => {
        if (!isDemoRunning || isDemoPaused) return;
        const res = demoGenerator.next();
        if (!res.done) {
          scheduleNextDemoStep();
        } else {
          logMessage('🏁 [시연 완료] 모든 백트래킹 탐색이 종료되었습니다.', 'success');
          stopDemo();
        }
      }, demoSpeedMs);
    }

    function stopDemo() {
      isDemoRunning = false;
      isDemoPaused = false;
      if (demoTimer) clearTimeout(demoTimer);
      demoTimer = null;
      demoGenerator = null;

      document.getElementById('eq-demo-controls')?.classList.remove('active');
      const demoBtn = document.getElementById('eq-btn-demo');
      if (demoBtn) {
        demoBtn.innerHTML = `<span>🤖 백트래킹 자동 시연</span>`;
        demoBtn.style.background = '#8b5cf6';
      }
    }

    function* solveBacktrackingGenerator(row) {
      if (row === boardSize) {
        onSolutionFound(board);
        yield { type: 'found' };
        return;
      }

      for (let col = 0; col < boardSize; col++) {
        if (isSafeToPlace(row, col)) {
          board[row][col] = 1;
          refreshBoardUI();
          highlightCell(row, col, 'check');
          logMessage(`🔍 [${row + 1}행 ${col + 1}열] 유망함(Safe) -> 퀸 배치 후 다음 행 탐색`, 'info');
          yield { type: 'place', row, col };

          yield* solveBacktrackingGenerator(row + 1);

          board[row][col] = 0;
          refreshBoardUI();
          logMessage(`↩️ [${row + 1}행 ${col + 1}열] 막힘 또는 탐색 종료 -> 퀸 회수(Backtrack)`, 'conflict');
          yield { type: 'backtrack', row, col };
        } else {
          highlightCell(row, col, 'conflict');
          yield { type: 'conflict', row, col };
        }
      }
    }

    function isSafeToPlace(r, c) {
      for (let prevR = 0; prevR < r; prevR++) {
        for (let prevC = 0; prevC < boardSize; prevC++) {
          if (board[prevR][prevC] === 1) {
            if (prevC === c || Math.abs(prevR - r) === Math.abs(prevC - c)) {
              return false;
            }
          }
        }
      }
      return true;
    }

    function highlightCell(r, c, type) {
      const grid = document.getElementById('eq-chess-grid');
      if (!grid || !grid.children) return;
      const idx = r * boardSize + c;
      const cell = grid.children[idx];
      if (!cell) return;

      if (type === 'check') cell.classList.add('demo-checking');
      else if (type === 'conflict') cell.classList.add('conflict');
    }

    function destroy() {
      stopDemo();
    }

    function goHome() {
      stopDemo();

      
      if (typeof window.renderLegacyDashboardHome === 'function') {
        window.renderLegacyDashboardHome();
        return;
      }
      if (typeof window.MathLabRenderHome === 'function') {
        window.MathLabRenderHome();
        return;
      }

      const mathlabRoot = document.getElementById('mathlab-root');
      const legacyRoot = document.getElementById('legacy-root');
      if (mathlabRoot) mathlabRoot.classList.add('hidden');
      if (legacyRoot) legacyRoot.classList.remove('hidden');

      const dashboard = document.getElementById('dashboard-screen');
      if (dashboard) {
        dashboard.classList.add('active');
        dashboard.style.display = '';
      }

      window.scrollTo({ top: 0, left: 0, behavior: 'smooth' });
    }

    return {
      mount,
      resetGame,
      destroy,
      setBoardSize,
      toggleHint,
      startDemo,
      toggleDemoPause,
      stepDemo,
      setDemoSpeed,
      stopDemo,
      showSolutionsModal,
      clearSolutions,
      showGuideModal,
      showRankingModal,
      closeModals,
      submitRankScore,
      goHome
    };
  })();

  window.EightQueens = EightQueens;

  function registerEightQueens() {
    if (typeof window.MathLabGames !== 'undefined' && typeof window.MathLabGames.register === 'function') {
      if (!window.MathLabGames.get('eight-queens')) {
        window.MathLabGames.register({
          id: 'eight-queens',
          title: '8-Queens 챌린지',
          icon: '♛',
          sourceType: 'new',
          mount(container, context) { EightQueens.mount(container, context); },
          reset() { EightQueens.resetGame(); },
          destroy() { EightQueens.destroy(); }
        });
      }
    }
  }

  registerEightQueens();
  window.addEventListener('DOMContentLoaded', registerEightQueens);
  setTimeout(registerEightQueens, 100);
  setTimeout(registerEightQueens, 500);
</script>
