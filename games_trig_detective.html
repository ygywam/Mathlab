<script>
  /* ==========================================================================
     TrigDetective 모듈 - 삼각비 높이 탐정 (명예의 전당 완결판)
     ========================================================================== */
  const TrigDetective = (function () {
    // 🌟 [보안] XSS 방어용 HTML 특수기호 이스케이프 함수
    function escapeHTML(str) {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, function(match) {
        const escape = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
        return escape[match];
      });
    }

    const TRIG_TABLE = [
      { deg: 15, sin: 0.259, cos: 0.966, tan: 0.268 },
      { deg: 20, sin: 0.342, cos: 0.940, tan: 0.364 },
      { deg: 25, sin: 0.423, cos: 0.906, tan: 0.466 },
      { deg: 30, sin: 0.500, cos: 0.866, tan: 0.577 },
      { deg: 35, sin: 0.574, cos: 0.819, tan: 0.700 },
      { deg: 38, sin: 0.616, cos: 0.788, tan: 0.781 },
      { deg: 40, sin: 0.643, cos: 0.766, tan: 0.839 },
      { deg: 45, sin: 0.707, cos: 0.707, tan: 1.000 },
      { deg: 50, sin: 0.766, cos: 0.643, tan: 1.192 },
      { deg: 55, sin: 0.819, cos: 0.574, tan: 1.428 },
      { deg: 60, sin: 0.866, cos: 0.500, tan: 1.732 },
      { deg: 65, sin: 0.906, cos: 0.423, tan: 2.145 },
      { deg: 70, sin: 0.940, cos: 0.342, tan: 2.747 }
    ];

    let currentMode = 'EASY';
    let round = 1;
    const maxRounds = 10;
    let score = 0;
    let combo = 0;
    let lives = 3;
    let timeLeft = 600;
    let timerInterval = null;
    let isGameOver = false;

    let currentCase = null;
    let isSolved = false;

    function mount(container, context) {
      let host = null;
      if (typeof container === 'string') host = document.querySelector(container);
      else if (container instanceof HTMLElement) host = container;
      if (!host) host = window.MathLabUtils?.getMountContainer ? window.MathLabUtils.getMountContainer(container) : document.getElementById('mathlab-view');
      if (!host) host = document.getElementById('new-root') || document.getElementById('game-container');

      if (!host) {
        let createdHost = document.getElementById('trig-detective-force-host');
        if (!createdHost) {
          createdHost = document.createElement('div');
          createdHost.id = 'trig-detective-force-host';
          document.body.appendChild(createdHost);
        }
        host = createdHost;
      }

      const footerEl = document.querySelector('footer, #footer, .app-footer') || 
                       Array.from(document.querySelectorAll('div, p, span')).find(el => el.textContent && el.textContent.includes('2026 기록조율사'));
      if (footerEl && host.compareDocumentPosition(footerEl) & Node.DOCUMENT_POSITION_PRECEDING) {
        footerEl.parentNode.insertBefore(host, footerEl);
      }

      host.style.display = '';

      host.innerHTML = `
        <div class="game-trig-detective" id="trig-detective-app">
          <!-- 상단 헤더 -->
          <div class="td-header">
            <div class="title-group">
              <div class="title-icon">🕵️</div>
              <div>
                <div style="display:flex; align-items:center; gap:8px;">
                  <span class="title-text">삼각비 높이 탐정</span>
                  <span class="title-badge">실측 추론 게임</span>
                </div>
              </div>
            </div>

            <div class="header-actions">
              <button class="btn-header home" onclick="TrigDetective.goHome()"><span>🏠 홈으로</span></button>
              <button class="btn-header" onclick="TrigDetective.showGuideModal()"><span>📖 규칙 안내</span></button>
              <button class="btn-header table-btn" onclick="TrigDetective.showTableModal()"><span>📊 삼각비 표 열기</span></button>
              <button class="btn-header stop-save" onclick="TrigDetective.manualStopAndSave()"><span>🏁 조기 정산</span></button>
              <button class="btn-header hof" onclick="TrigDetective.showRankingModal()"><span>🏆 명예의 전당</span></button>
              <button class="btn-header" style="background:#10b981; color:white;" onclick="TrigDetective.resetGame()"><span>🔄 새 도전</span></button>
            </div>
          </div>

          <!-- 상태 바 -->
          <div class="td-status-bar">
            <div class="mode-tabs">
              <button class="mode-btn active" id="td-btn-easy" onclick="TrigDetective.setMode('EASY')">🟢 쉬움 (정수 출제/눈높이 0m)</button>
              <button class="mode-btn" id="td-btn-normal" onclick="TrigDetective.setMode('NORMAL')">🔵 보통 (표 활용/눈높이 보정)</button>
              <button class="mode-btn" id="td-btn-hard" onclick="TrigDetective.setMode('HARD')">🟣 도전 (sin·cos·역산/타임어택)</button>
            </div>

            <div class="info-group">
              <div class="info-item"><span>📋 사건:</span> <span class="info-value" id="td-round-val">1 / 10</span></div>
              <div class="info-item" id="td-lives-wrap"><span>❤️ 생명:</span> <span class="info-value warn" id="td-lives-val">❤️❤️❤️</span></div>
              <div class="info-item" id="td-timer-wrap" style="display:none;"><span>⏱️ 남은 시간:</span> <span class="info-value warn" id="td-timer-val">60초</span></div>
              <div class="info-item"><span>⭐ 점수:</span> <span class="info-value" id="td-score-val">0점</span></div>
              <div class="info-item"><span>🔥 연속 정답:</span> <span class="info-value" style="color:#fbbf24;" id="td-combo-val">0 콤보</span></div>
            </div>
          </div>

          <!-- 메인 레이아웃 -->
          <div class="scene-layout">
            <div class="case-panel">
              <div>
                <div class="case-header">
                  <div>
                    <div class="case-num" id="td-case-num">CASE #01: 미지의 건물 높이 측량</div>
                    <div class="case-title" id="td-case-title">비밀 조직의 타워 높이를 밝혀라!</div>
                  </div>
                  <button class="btn-header table-btn" style="font-size:0.8rem; padding:6px 10px;" onclick="TrigDetective.showTableModal()">📊 표 확인</button>
                </div>

                <div class="clue-box" style="margin-top:14px;" id="td-clue-box"></div>
              </div>

              <div class="input-section">
                <div class="input-label" id="td-input-prompt">💡 구하고자 하는 값(단위: m)을 소수 첫째 자리까지 입력하세요 (정수면 정수 입력)</div>
                <div class="input-row">
                  <input type="number" step="any" class="ans-input" id="td-ans-input" placeholder="정답 숫자 입력">
                  <button class="btn-submit" id="td-submit-btn" onclick="TrigDetective.checkAnswer()">해결 제출</button>
                </div>
                <div class="feedback-box" id="td-feedback">✨ 사건 의뢰 접수! 상단 [📊 삼각비 표 열기]를 눌러 단서를 조합하세요.</div>
              </div>
            </div>

            <!-- 오른쪽: SVG 도시 실루엣 측량 장면 -->
            <div class="svg-panel">
              <svg class="city-svg" id="td-svg-canvas" viewBox="0 0 500 360"></svg>
            </div>
          </div>

          <!-- 하단 상시 노출 명예의 전당 보드 영역 -->
          <div class="bottom-ranking-card">
            <div class="ranking-header">
              <div class="ranking-title">🏆 삼각비 높이 탐정 명예의 전당 (실시간 랭킹 보드)</div>
              <button class="btn-header stop-save" onclick="TrigDetective.manualStopAndSave()" style="font-size:0.82rem; padding:5px 10px;">🏁 내 점수 정산 후 등록하기</button>
            </div>
            <div id="board-trig-detective-bottom">
              <p style="text-align:center; color:#94a3b8; padding:12px 0;">랭킹 데이터를 불러오는 중...</p>
            </div>
          </div>

          <!-- 1. 규칙 안내 모달 -->
          <div class="modal-backdrop" id="td-guide-modal">
            <div class="modal-box">
              <h3 class="modal-title">📖 삼각비 높이 탐정 규칙 안내</h3>
              <ul class="rule-list">
                <li><b>🎯 핵심 공리 [거리 × tan(앙각) = 높이]</b>: 건물에서 떨어진 거리와 올려다본 앙각을 이용해 삼각비 표의 tan 값을 곱하면 건물의 높이가 나옵니다!</li>
                <li><b>🟢 쉬움 모드</b>: 30°, 45°, 60° 등 기본 각도 위주로 출제되며 측량 눈높이 보정이 없습니다 (눈높이 0m).</li>
                <li><b>🔵 보통 모드 (눈높이 보정 + 표 활용)</b>: 15°~75° 사이의 앙각이 주어지며, 측량 기구의 눈높이(예: 1.6m)를 계산 결과에 더해주어야 최종 건물 높이가 됩니다! 소수 첫째 자리 반올림 오차(±0.5m)를 허용합니다.</li>
                <li><b>🟣 도전 모드 (sin·cos·역산 사건)</b>: 사다리 빗변 길이로 높이를 구하는 sin 사건이나, 건물 높이로부터 거리를 역산하는 문제, 60초 타임어택이 펼쳐집니다.</li>
                <li><b>🏁 조기 정산 및 명예의 전당</b>: 언제든 <b>[🏁 조기 정산]</b> 버튼을 누르면 현재 점수를 즉시 명예의 전당에 저장할 수 있습니다.</li>
              </ul>
              <button class="modal-close-btn" onclick="TrigDetective.closeModals()">확인 및 사건 수사 시작</button>
            </div>
          </div>

          <!-- 2. 삼각비 표 모달 -->
          <div class="modal-backdrop" id="td-table-modal">
            <div class="modal-box">
              <h3 class="modal-title">📊 0° ~ 90° 삼각비 간추린 표 (소수 셋째 자리)</h3>
              <p style="font-size:0.88rem; color:#94a3b8; margin-bottom:8px;">* 현재 사건 의뢰에 해당하는 각도는 <b style="color:#38bdf8;">파란색 하이라이트</b>로 표시됩니다.</p>
              <table class="trig-table">
                <thead>
                  <tr><th>각도 (°)</th><th>sin (사인)</th><th>cos (코사인)</th><th>tan (탄젠트)</th></tr>
                </thead>
                <tbody id="td-table-body"></div>
              </table>
              <button class="modal-close-btn" onclick="TrigDetective.closeModals()">닫기 (문제 풀이로 복귀)</button>
            </div>
          </div>

          <!-- 3. 명예의 전당 등록 팝업 모달 -->
          <div class="modal-backdrop" id="td-ranking-modal">
            <div class="modal-box">
              <h3 class="modal-title" id="td-ranking-modal-title">🏆 삼각비 높이 탐정 명예의 전당</h3>
              <div id="td-gameover-summary" style="background:#0f172a; padding:14px; border-radius:12px; border:1px solid #334155; margin-bottom:14px; text-align:center;"></div>
              <div id="board-trig-detective">
                <p style="text-align:center; color:#94a3b8;">랭킹 데이터를 불러오는 중...</p>
              </div>
              <div style="margin-top:16px; display:flex; gap:8px;">
                <input type="text" id="td-nickname-input" placeholder="도전자 닉네임 (예: 3반 김탐정)" maxlength="18" style="flex:1; padding:12px; border-radius:10px; border:1px solid #334155; background:#0f172a; color:#f8fafc; font-weight:700; font-size:0.98rem; text-align:center;">
                <button class="btn-header hof" style="padding:0 20px;" onclick="TrigDetective.submitRankScore()">등록</button>
              </div>
              <button class="modal-close-btn" onclick="TrigDetective.closeModals()">창 닫기</button>
            </div>
          </div>
        </div>
      `;

      const inputEl = document.getElementById('td-ans-input');
      if (inputEl) {
        inputEl.addEventListener('keypress', (e) => {
          if (e.key === 'Enter') checkAnswer();
        });
      }

      setMode('EASY');
      renderBottomLeaderboard();
    }

    function setMode(mode) {
      currentMode = mode;
      document.querySelectorAll('#trig-detective-app .mode-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById('td-btn-' + mode.toLowerCase());
      if (activeBtn) activeBtn.classList.add('active');

      const timerWrap = document.getElementById('td-timer-wrap');
      if (timerWrap) timerWrap.style.display = mode === 'HARD' ? 'flex' : 'none';

      resetGame();
    }

    function resetGame() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = null;

      round = 1;
      score = 0;
      combo = 0;
      lives = 3;
      timeLeft = 60;
      isGameOver = false;

      if (currentMode === 'HARD') {
        timerInterval = setInterval(() => {
          if (isGameOver) return;
          timeLeft--;
          if (timeLeft <= 0) {
            timeLeft = 0;
            triggerGameOver('⏰ 타임어택 제한 시간 종료!');
          }
          updateUI();
        }, 1000);
      }

      nextRound();
    }

    function nextRound() {
      if (round > maxRounds || lives <= 0) {
        triggerGameOver(lives <= 0 ? '💥 생명 소진으로 수사 종료!' : '🎉 10개 사건 모두 완벽하게 해결 완료!');
        return;
      }

      isSolved = false;
      const inputEl = document.getElementById('td-ans-input');
      if (inputEl) { inputEl.value = ''; inputEl.disabled = false; }
      const submitBtn = document.getElementById('td-submit-btn');
      if (submitBtn) { submitBtn.textContent = '해결 제출'; submitBtn.onclick = checkAnswer; }

      if (currentMode === 'EASY') {
        const easyPool = [
          { deg: 45, dist: 15, eye: 0, type: 'TAN_HEIGHT', title: '시청각실 건물 높이 측정' },
          { deg: 45, dist: 24, eye: 0, type: 'TAN_HEIGHT', title: '학교 대강당 탑 높이' },
          { deg: 30, dist: 30, eye: 0, type: 'TAN_HEIGHT', title: '송전탑까지의 높이 추론' },
          { deg: 60, dist: 10, eye: 0, type: 'TAN_HEIGHT', title: '교정 거수목 나무 높이' }
        ];
        const item = easyPool[Math.floor(Math.random() * easyPool.length)];
        const row = TRIG_TABLE.find(t => t.deg === item.deg) || TRIG_TABLE[7];
        const ans = item.dist * row.tan;
        currentCase = { ...item, row, answer: Math.round(ans * 10) / 10, eye: 0 };
      } else if (currentMode === 'NORMAL') {
        const item = TRIG_TABLE[Math.floor(Math.random() * TRIG_TABLE.length)];
        const dist = Math.floor(Math.random() * 15) + 12;
        const eye = Math.round((Math.random() * 0.4 + 1.4) * 10) / 10;
        const rawAns = dist * item.tan + eye;
        currentCase = {
          deg: item.deg, dist, eye, type: 'TAN_HEIGHT',
          title: `미지의 빌딩 타워 #${round} 측량`, row: item,
          answer: Math.round(rawAns * 10) / 10
        };
      } else {
        const randType = Math.random() < 0.5 ? 'SIN_HEIGHT' : 'TAN_REVERSE';
        const item = TRIG_TABLE[Math.floor(Math.random() * (TRIG_TABLE.length - 2)) + 1];
        if (randType === 'SIN_HEIGHT') {
          const hyp = Math.floor(Math.random() * 12) + 10;
          const rawAns = hyp * item.sin;
          currentCase = {
            deg: item.deg, hyp, eye: 0, type: 'SIN_HEIGHT',
            title: `사다리 측량 사건 #${round}`, row: item,
            answer: Math.round(rawAns * 10) / 10
          };
        } else {
          const height = Math.floor(Math.random() * 15) + 15;
          const rawDist = height / item.tan;
          currentCase = {
            deg: item.deg, targetHeight: height, eye: 0, type: 'TAN_REVERSE',
            title: `강 건너편 거리 역산 사건 #${round}`, row: item,
            answer: Math.round(rawDist * 10) / 10
          };
        }
      }

      renderCaseAndSvg();
      updateUI();
      showBanner(`💡 CASE #${round} 접수! 상단 [📊 삼각비 표 열기]에서 단서를 확인하세요.`, '#38bdf8');
    }

    function renderCaseAndSvg() {
      const numEl = document.getElementById('td-case-num');
      const titleEl = document.getElementById('td-case-title');
      const clueBox = document.getElementById('td-clue-box');
      const promptEl = document.getElementById('td-input-prompt');
      const svgEl = document.getElementById('td-svg-canvas');

      if (numEl) numEl.textContent = `CASE #${round < 10 ? '0' + round : round}: 실측 추론 의뢰`;
      if (titleEl) titleEl.textContent = currentCase.title;

      // 🌟 $ 기호 완벽 제거 및 깔끔하고 직관적인 HTML 수식 렌더링
      if (clueBox) {
        if (currentCase.type === 'TAN_HEIGHT') {
          clueBox.innerHTML = `
            <div class="clue-item"><span>📏 건물까지의 수평 거리 (<i style="color:#fbbf24; font-family:monospace;">d</i>):</span> <strong>${currentCase.dist} m</strong></div>
            <div class="clue-item"><span>📐 꼭대기를 올려다본 앙각 (<b style="color:#fbbf24;">θ</b>):</span> <strong>${currentCase.deg}°</strong></div>
            <div class="clue-item"><span>👁️ 측량 기구 눈높이 (<i style="color:#fbbf24; font-family:monospace;">h</i>₀):</span> <strong>${currentCase.eye > 0 ? currentCase.eye + ' m' : '0 m (없음)'}</strong></div>
            <div style="border-top:1px dashed #334155; padding-top:6px; font-size:0.86rem; color:#94a3b8;">
              * 공리: 건물 높이 = 수평거리 × <b style="color:#38bdf8;">tan(${currentCase.deg}°)</b> ${currentCase.eye > 0 ? '+ 눈높이(' + currentCase.eye + 'm)' : ''}
            </div>
          `;
          if (promptEl) promptEl.textContent = '💡 타워의 최종 높이(m)를 입력하세요 (소수 첫째 자리 반올림 또는 ±0.5m 오차 허용)';
        } else if (currentCase.type === 'SIN_HEIGHT') {
          clueBox.innerHTML = `
            <div class="clue-item"><span>🪜 사다리(빗변) 길이 (<i style="color:#fbbf24; font-family:monospace;">l</i>):</span> <strong>${currentCase.hyp} m</strong></div>
            <div class="clue-item"><span>📐 지면과 이루는 각도 (<b style="color:#fbbf24;">θ</b>):</span> <strong>${currentCase.deg}°</strong></div>
            <div style="border-top:1px dashed #334155; padding-top:6px; font-size:0.86rem; color:#94a3b8;">
              * 공리: 높이 = 빗변 × <b style="color:#38bdf8;">sin(${currentCase.deg}°)</b>
            </div>
          `;
          if (promptEl) promptEl.textContent = '💡 사다리가 닿은 창문의 높이(m)를 입력하세요';
        } else {
          clueBox.innerHTML = `
            <div class="clue-item"><span>🏢 알려진 건물 높이 (<i style="color:#fbbf24; font-family:monospace;">H</i>):</span> <strong>${currentCase.targetHeight} m</strong></div>
            <div class="clue-item"><span>📐 올려다본 앙각 (<b style="color:#fbbf24;">θ</b>):</span> <strong>${currentCase.deg}°</strong></div>
            <div style="border-top:1px dashed #334155; padding-top:6px; font-size:0.86rem; color:#94a3b8;">
              * 역산 공리: 수평 거리 = 높이 ÷ <b style="color:#38bdf8;">tan(${currentCase.deg}°)</b>
            </div>
          `;
          if (promptEl) promptEl.textContent = '💡 건물까지의 수평 거리(m)를 입력하세요';
        }

        // 외부 MathJax/KaTeX 렌더러가 존재할 경우 즉시 동기화 보장
        if (window.MathJax && typeof window.MathJax.typesetPromise === 'function') {
          window.MathJax.typesetPromise([clueBox]).catch(()=>{});
        }
      }

      if (svgEl) {
        let bWidth = 100;
        let bHeight = currentCase.type === 'TAN_REVERSE' ? Math.min(260, currentCase.targetHeight * 8) : Math.min(260, currentCase.answer * 7.5 + 40);
        let groundY = 310;
        let buildX = 350;
        let detX = 90;
        let eyeY = currentCase.eye > 0 ? groundY - 24 : groundY;

        svgEl.innerHTML = `
          <rect x="0" y="0" width="500" height="360" fill="#020617"/>
          <path d="M0,310 L500,310 L500,360 L0,360 Z" fill="#1e293b"/>
          <rect x="30" y="160" width="45" height="150" fill="#0f172a" opacity="0.6"/>
          <rect x="220" y="130" width="60" height="180" fill="#0f172a" opacity="0.6"/>
          
          <rect x="${buildX}" y="${groundY - bHeight}" width="${bWidth}" height="${bHeight}" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
          ${Array.from({length: Math.floor(bHeight / 30)}, (_, i) => `
            <rect x="${buildX + 18}" y="${groundY - bHeight + 15 + i * 28}" width="20" height="15" fill="#facc15" opacity="0.8"/>
            <rect x="${buildX + 62}" y="${groundY - bHeight + 15 + i * 28}" width="20" height="15" fill="#facc15" opacity="0.8"/>
          `).join('')}

          <circle cx="${detX}" cy="${groundY - 25}" r="10" fill="#cbd5e1"/>
          <rect x="${detX - 8}" y="${groundY - 15}" width="16" height="15" fill="#64748b"/>
          <line x1="${detX}" y1="${eyeY}" x2="${detX - 12}" y2="${groundY}" stroke="#94a3b8" stroke-width="2"/>
          <line x1="${detX}" y1="${eyeY}" x2="${detX + 12}" y2="${groundY}" stroke="#94a3b8" stroke-width="2"/>

          <line x1="${detX}" y1="${eyeY}" x2="${buildX}" y2="${eyeY}" stroke="#64748b" stroke-dasharray="6,4" stroke-width="2"/>
          <line x1="${detX}" y1="${eyeY}" x2="${buildX}" y2="${groundY - bHeight}" stroke="#fbbf24" stroke-width="2.5"/>
          <line x1="${buildX}" y1="${groundY - bHeight}" x2="${buildX}" y2="${eyeY}" stroke="#34d399" stroke-width="2.5" stroke-dasharray="4,3"/>

          <path d="M${detX + 45},${eyeY} A45,45 0 0,0 ${detX + 38},${eyeY - 24}" fill="none" stroke="#fbbf24" stroke-width="2"/>
          <text x="${detX + 60}" y="${eyeY - 10}" fill="#fbbf24" font-size="14" font-weight="bold">${currentCase.deg}°</text>

          ${currentCase.type === 'TAN_HEIGHT' ? `
            <text x="${(detX + buildX) / 2}" y="${eyeY + 20}" fill="#38bdf8" font-size="15" font-weight="bold" text-anchor="middle">수평 거리 d = ${currentCase.dist} m</text>
          ` : (currentCase.type === 'SIN_HEIGHT' ? `
            <text x="${(detX + buildX) / 2 - 20}" y="${(eyeY + groundY - bHeight) / 2 - 10}" fill="#fbbf24" font-size="15" font-weight="bold">l = ${currentCase.hyp} m</text>
          ` : `
            <text x="${buildX + bWidth / 2}" y="${groundY - bHeight / 2}" fill="#34d399" font-size="15" font-weight="bold" text-anchor="middle">H = ${currentCase.targetHeight} m</text>
          `)}

          ${currentCase.eye > 0 ? `
            <line x1="${detX - 30}" y1="${groundY}" x2="${detX - 30}" y2="${eyeY}" stroke="#f87171" stroke-width="2"/>
            <text x="${detX - 35}" y="${groundY - 12}" fill="#f87171" font-size="12" font-weight="bold" text-anchor="end">h0=${currentCase.eye}m</text>
          ` : ''}

          <g id="td-solved-overlay" style="display:none;">
            <rect x="110" y="40" width="280" height="70" rx="12" fill="rgba(15, 23, 42, 0.95)" stroke="#10b981" stroke-width="2"/>
            <text x="250" y="68" fill="#10b981" font-size="16" font-weight="bold" text-anchor="middle">🎉 수사 해결 완료!</text>
            <text x="250" y="92" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle" id="td-solved-text">계산: ...</text>
          </g>
        `;
      }

      renderTableBody();
    }

    function renderTableBody() {
      const tbody = document.getElementById('td-table-body');
      if (!tbody || !currentCase) return;

      tbody.innerHTML = TRIG_TABLE.map(row => {
        const isCur = row.deg === currentCase.deg;
        return `
          <tr class="${isCur ? 'highlight' : ''}">
            <td>${row.deg}° ${isCur ? '◀ 수사 각도' : ''}</td>
            <td>${row.sin}</td>
            <td>${row.cos}</td>
            <td style="${isCur ? 'color:#fbbf24; font-size:1.08rem;' : ''}">${row.tan}</td>
          </tr>
        `;
      }).join('');
    }

    function checkAnswer() {
      if (isSolved || isGameOver) return;
      const inputEl = document.getElementById('td-ans-input');
      const val = parseFloat(inputEl?.value || '');

      if (isNaN(val)) {
        showBanner('⚠️ 정답 숫자를 입력해 주세요!', '#f87171');
        inputEl?.focus();
        return;
      }

      const tol = currentMode === 'EASY' ? 0.15 : 0.55;
      const diff = Math.abs(val - currentCase.answer);

      if (diff <= tol) {
        isSolved = true;
        score += 10;
        combo++;
        if (combo >= 3) score += 3;

        showBanner(`🎉 정확합니다! 정답: ${currentCase.answer} m (+10점 ${combo >= 3 ? '+콤보 3점' : ''})`, '#34d399');
        if (inputEl) inputEl.disabled = true;

        const solGroup = document.getElementById('td-solved-overlay');
        const solText = document.getElementById('td-solved-text');
        if (solGroup) solGroup.style.display = '';
        if (solText) {
          if (currentCase.type === 'TAN_HEIGHT') {
            solText.textContent = `${currentCase.dist} × tan${currentCase.deg}°(${currentCase.row.tan}) ${currentCase.eye > 0 ? '+ ' + currentCase.eye : ''} = ${currentCase.answer}m`;
          } else if (currentCase.type === 'SIN_HEIGHT') {
            solText.textContent = `${currentCase.hyp} × sin${currentCase.deg}°(${currentCase.row.sin}) = ${currentCase.answer}m`;
          } else {
            solText.textContent = `${currentCase.targetHeight} ÷ tan${currentCase.deg}°(${currentCase.row.tan}) = ${currentCase.answer}m`;
          }
        }

        const submitBtn = document.getElementById('td-submit-btn');
        if (submitBtn) {
          submitBtn.textContent = '▶ 다음 사건으로';
          submitBtn.onclick = () => {
            round++;
            nextRound();
          };
        }
      } else {
        combo = 0;
        score = Math.max(0, score - 5);
        if (currentMode === 'EASY' || currentMode === 'NORMAL') {
          lives--;
          if (lives <= 0) {
            triggerGameOver(`💥 오답 탈락! 정답은 [ ${currentCase.answer} m ] 였습니다.`);
            return;
          }
        }

        let hintMsg = '';
        if (currentCase.type === 'TAN_HEIGHT') {
          hintMsg = `❌ 오답! (남은 생명: ${lives}개) 힌트: 상단 [삼각비 표]에서 tan${currentCase.deg}°(${currentCase.row.tan})를 찾아 거리(${currentCase.dist})와 곱해보세요!`;
          if (currentCase.eye > 0) hintMsg += ` (눈높이 ${currentCase.eye}m 더하기 포함!)`;
        } else {
          hintMsg = `❌ 오답 (-5점)! 정답은 약 ${currentCase.answer} m 입니다. 다시 계산해보세요!`;
        }
        showBanner(hintMsg, '#f87171');
      }

      updateUI();
    }

    function showBanner(msg, color) {
      const banner = document.getElementById('td-feedback');
      if (banner) {
        banner.textContent = msg;
        banner.style.color = color || '#38bdf8';
      }
    }

    function manualStopAndSave() {
      triggerGameOver('🏁 조기 정산 완료! 훌륭한 측량 탐정입니다.');
    }

    function triggerGameOver(reasonMsg) {
      if (isGameOver && !reasonMsg.includes('조기 정산')) return;
      isGameOver = true;
      if (timerInterval) clearInterval(timerInterval);

      showBanner(reasonMsg, '#f87171');
      setTimeout(() => {
        showRankingModal(reasonMsg);
      }, 500);
    }

    function updateUI() {
      const roundVal = document.getElementById('td-round-val');
      const livesVal = document.getElementById('td-lives-val');
      const timerVal = document.getElementById('td-timer-val');
      const scoreVal = document.getElementById('td-score-val');
      const comboVal = document.getElementById('td-combo-val');

      if (roundVal) roundVal.textContent = `${round} / ${maxRounds}`;
      if (livesVal) livesVal.textContent = '❤️'.repeat(lives) + '🖤'.repeat(Math.max(0, 3 - lives));
      if (timerVal) timerVal.textContent = `${timeLeft}초`;
      if (scoreVal) scoreVal.textContent = `${score}점`;
      if (comboVal) comboVal.textContent = `${combo} 콤보`;
    }

    function showGuideModal() { document.getElementById('td-guide-modal')?.classList.add('open'); }
    function showTableModal() { document.getElementById('td-table-modal')?.classList.add('open'); }
    function showRankingModal(reasonMsg = '') {
      document.getElementById('td-ranking-modal')?.classList.add('open');
      const titleEl = document.getElementById('td-ranking-modal-title');
      const sumEl = document.getElementById('td-gameover-summary');

      if (titleEl) {
        titleEl.textContent = reasonMsg ? '🏁 삼각비 높이 탐정 수사 기록' : '🏆 삼각비 높이 탐정 명예의 전당';
      }

      if (sumEl) {
        sumEl.innerHTML = `
          <div style="font-size:1.15rem; font-weight:900; color:#f87171; margin-bottom:6px;">${reasonMsg || '명예의 전당 랭킹 조회'}</div>
          <div style="font-size:1.25rem; font-weight:800; color:#38bdf8;">최종 획득 점수: ${score}점</div>
          <div style="font-size:0.95rem; color:#cbd5e1; margin-top:4px;">해결 사건 수: 총 <b>${round - (isSolved ? 0 : 1)}</b>건</div>
        `;
      }

      if (typeof loadGameLeaderboard === 'function') {
        loadGameLeaderboard('삼각비높이탐정', true, 'board-trig-detective');
      }
    }

    function renderBottomLeaderboard() {
      if (typeof loadGameLeaderboard === 'function') {
        loadGameLeaderboard('삼각비높이탐정', false, 'board-trig-detective-bottom');
      } else {
        try {
          let list = JSON.parse(localStorage.getItem('mathlab_lb_trig_detective') || '[]');
          const bottomEl = document.getElementById('board-trig-detective-bottom');
          if (bottomEl) {
            if (list.length === 0) {
              bottomEl.innerHTML = '<p style="text-align:center; color:#94a3b8; padding:12px 0;">아직 등록된 명예의 전당 기록이 없습니다. 첫 번째 수사 왕이 되어보세요!</p>';
            } else {
              bottomEl.innerHTML = `
                <div style="display:flex; flex-direction:column; gap:6px;">
                  ${list.slice(0, 5).map((item, idx) => `
                    <div style="display:flex; justify-content:space-between; align-items:center; background:#0f172a; padding:10px 14px; border-radius:10px; border:1px solid #334155;">
                      <span style="font-weight:800; color:${idx === 0 ? '#facc15' : '#cbd5e1'};">${idx === 0 ? '👑 1위' : `${idx + 1}위`} - ${escapeHTML(item.nickname)}</span>
                      <span style="color:#38bdf8; font-weight:900;">${item.score}점 (CASE #${item.round || 1})</span>
                    </div>
                  `).join('')}
                </div>
              `;
            }
          }
        } catch(e) {}
      }
    }

    function closeModals() {
      document.querySelectorAll('.game-trig-detective .modal-backdrop').forEach(el => el.classList.remove('open'));
    }

    function submitRankScore() {
      const input = document.getElementById('td-nickname-input');
      const nickname = input ? input.value.trim() : '';
      if (!nickname) {
        const titleEl = document.getElementById('td-ranking-modal-title');
        if(titleEl) { titleEl.innerHTML = '<span style="color:#f87171;">⚠️ 닉네임을 입력해 주세요!</span>'; setTimeout(() => titleEl.textContent = '🏆 삼각비 높이 탐정 명예의 전당', 2000); }
        return;
      }

      try {
        let list = JSON.parse(localStorage.getItem('mathlab_lb_trig_detective') || '[]');
        const dateStr = new Date().toLocaleDateString('ko-KR', { month: '2-digit', day: '2-digit' });
        list.push({ nickname, score, date: dateStr, round });
        list.sort((a, b) => b.score - a.score);
        localStorage.setItem('mathlab_lb_trig_detective', JSON.stringify(list.slice(0, 20)));
      } catch (e) {}

      if (typeof window.submitRanking === 'function') {
        window.submitRanking('삼각비높이탐정', score, true, 'td-nickname-input', 'board-trig-detective');
      } else if (typeof window.parent?.submitRanking === 'function') {
        window.parent.submitRanking('삼각비높이탐정', score, true, 'td-nickname-input', 'board-trig-detective');
      } else {
        const titleEl = document.getElementById('td-ranking-modal-title');
        if(titleEl) { titleEl.innerHTML = '<span style="color:#34d399;">🎉 명예의 전당 등록 완료!</span>'; }
        if (input) input.value = '';
        setTimeout(() => closeModals(), 1500);
      }

      renderBottomLeaderboard();
    }

    function goHome() {
      destroy();
      if (window.LegacyBridge && typeof window.LegacyBridge.backHome === 'function') { try { window.LegacyBridge.backHome(); return; } catch(e) {} }
      if (typeof window.renderLegacyDashboardHome === 'function') { try { window.renderLegacyDashboardHome(); return; } catch(e) {} }
      if (typeof window.MathLabRenderHome === 'function') { try { window.MathLabRenderHome(); return; } catch(e) {} }

      const mathlabRoot = document.getElementById('mathlab-root');
      const legacyRoot = document.getElementById('legacy-root');
      if (mathlabRoot) mathlabRoot.classList.add('hidden');
      if (legacyRoot) legacyRoot.classList.remove('hidden');

      const dashboard = document.getElementById('dashboard-screen');
      if (dashboard) { dashboard.classList.add('active'); dashboard.style.display = ''; }
      window.scrollTo({ top: 0, left: 0, behavior: 'smooth' });
    }

    function destroy() {
      if (timerInterval) clearInterval(timerInterval);
    }

    return {
      id: 'trig-detective',
      title: '삼각비 높이 탐정',
      icon: '🕵️',
      mount, resetGame, destroy, setMode, checkAnswer, manualStopAndSave,
      showGuideModal, showTableModal, showRankingModal, closeModals, submitRankScore, renderBottomLeaderboard, goHome
    };
  })();

  function registerTrigDetective() {
    if (typeof window.MathLabGames !== 'undefined' && typeof window.MathLabGames.register === 'function') {
      if (!window.MathLabGames.get('trig-detective')) {
        try {
          window.MathLabGames.register({
            id: TrigDetective.id,
            title: TrigDetective.title,
            icon: TrigDetective.icon,
            sourceType: 'new',
            mount(container, context) { TrigDetective.mount(container, context); },
            reset() { TrigDetective.resetGame(); },
            destroy() { TrigDetective.destroy(); },
            goHome() { TrigDetective.goHome(); }
          });
        } catch (e) {
          console.warn('trig-detective 안전 등록 방어:', e);
        }
      }
    }
  }

  registerTrigDetective();
  window.addEventListener('DOMContentLoaded', registerTrigDetective);
  setTimeout(registerTrigDetective, 100);
  setTimeout(registerTrigDetective, 500);

  window.TrigDetective = TrigDetective;
  window.initTrigDetectiveGame = function() {
    const target = document.getElementById('game-trig-detective-app') || document.getElementById('mathlab-view');
    TrigDetective.mount(target);
  };
  window.launchTrigDetectiveGame = function() {
    registerTrigDetective();
    if (typeof window.MathLabGames !== 'undefined' && typeof window.MathLabGames.mount === 'function') {
      try { window.MathLabGames.mount('trig-detective'); return; } catch(e) {}
    }
    TrigDetective.mount();
  };
</script>
