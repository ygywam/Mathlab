<style>
  :root {
    /* User's uniform theme variables */
    --color-bg: #FAF7F5;
    --color-surface: #F1E6E2;
    --color-text: #4A403A;
    --color-primary: #B08279;
    --color-accent: #9CAF97;

    /* Applied to the app's internal variables */
    --mathlab-bg: var(--color-bg);
    --mathlab-panel: var(--color-surface);
    --mathlab-text: var(--color-text);
    --mathlab-muted: #8E8279; /* slightly muted text based on text color */
    --mathlab-line: #E1D2CC; /* slightly darker surface for borders */
    --mathlab-primary: var(--color-primary);
    --mathlab-primary-dark: var(--color-accent);
    --mathlab-radius: 20px;
    --mathlab-shadow: 0 8px 24px rgba(74, 64, 58, 0.08);
  }

  * {
    box-sizing: border-box;
  }

  html {
    min-height: 100%;
  }

  body {
    margin: 0;
    min-height: 100%;
    background: var(--mathlab-bg);
    color: var(--mathlab-text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
      "Noto Sans KR", "Segoe UI", sans-serif;
  }

  button,
  input,
  textarea,
  select {
    font: inherit;
  }

  input[type="range"],
  input[type=range] {
    touch-action: pan-x;
    user-select: none;
    -webkit-user-select: none;
  }

  .hidden {
    display: none !important;
  }
</style>
