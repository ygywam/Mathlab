<style>

.zss-compare-btn { flex: 1 1 220px; background: #fff; border: 2px solid #cbd5e1; border-radius: 12px; padding: 12px 14px; cursor: pointer; text-align: left; font-size: 0.86rem; line-height: 1.6; color: #0f172a; transition: all 0.15s; }
.zss-compare-btn:hover { border-color: #0284c7; background: #e0f2fe; }
.zss-compare-btn:disabled { opacity: 0.55; cursor: not-allowed; }

.zss-result.show { display: block; }
.zss-result-title { font-size: 1.15rem; font-weight: 800; margin-bottom: 6px; }
.zss-result-score { font-size: 1.7rem; font-weight: 800; color: #d97706; }
.zss-result-detail { font-size: 0.85rem; color: #64748b; line-height: 1.7; margin-top: 6px; }
.zss-hof { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 14px; }
.zss-hof-title { font-size: 1rem; font-weight: 800; color: #b45309; margin-bottom: 10px; }
.zss-hof-item { display: flex; justify-content: space-between; align-items: center; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 8px 12px; margin-bottom: 6px; font-size: 0.84rem; }
.zss-hof-name { color: #0f172a; font-weight: 700; }
.zss-hof-score { color: #0284c7; font-weight: 800; }
.zss-modal { display: none; position: fixed; inset: 0; background: rgba(15,23,42,0.45); z-index: 9999; align-items: center; justify-content: center; }
.zss-modal.show { display: flex; }
.zss-modal-box { background: #fff; border-radius: 16px; padding: 28px; max-width: 400px; width: 90%; text-align: center; box-shadow: 0 18px 50px rgba(15,23,42,0.25); }
.zss-modal-title { font-size: 1.2rem; font-weight: 800; margin-bottom: 12px; color: #0284c7; }
.zss-modal-input { width: 100%; padding: 10px; border-radius: 8px; border: 2px solid #cbd5e1; background: #fff; color: #0f172a; font-size: 1rem; text-align: center; margin-bottom: 12px; outline: none; }
.zss-modal-input:focus { border-color: #0284c7; }
.zss-modal-btns { display: flex; gap: 8px; justify-content: center; }
.zss-guide-body { text-align: left; font-size: 0.88rem; color: #334155; line-height: 1.7; max-height: 60vh; overflow-y: auto; }
.zss-toast { position: fixed; top: 24px; left: 50%; transform: translateX(-50%) translateY(-16px); background: #0f172a; color: #f8fafc; padding: 11px 22px; border-radius: 12px; font-weight: 700; font-size: 0.95rem; z-index: 10500; opacity: 0; pointer-events: none; transition: opacity 0.25s, transform 0.25s; max-width: 90vw; text-align: center; }
.zss-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.zss-toast.ok { background: #059669; }
.zss-toast.err { background: #dc2626; }
</style>

<script>
(function () {
'use strict';

const ATITLE = '정규분포 z점수 서바이벌';
const ABOARD = 'board-z-score-survival';

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

let toastTid = null;
function showToast(msg, type) {
  const el = document.getElementById('zss-toast');
  if (!el) return;
  el.textContent = msg;
  el.className = 'zss-toast show' + (type ? ' ' + type : '');
  if (toastTid) clearTimeout(toastTid);
  toastTid = setTimeout(() => { el.className = 'zss-toast'; }, 2500);
}

const ZTABLE = [
  { z: 1.28, tail: 10 },
  { z: 1.645, tail: 5 },
  { z: 1.96, tail: 2.5 },
  { z: 2.58, tail: 0.5 }
];

const SCENARIOS = [
  { name: '화산재 확산', axis: '안전 고도 지수' },
  { name: '홍수 범람', axis: '제방 안전 지수' },
  { name: '태풍 상륙', axis: '구조물 안전 지수' },
  { name: '지진 진동', axis: '지반 안정 지수' },
  { name: '한파 급습', axis: '대피소 보온 지수' }
];

const ZScoreSurvival = {
  container: null, canvas: null, ctx: null,
  state: {
    difficulty: 'normal', round: 1, totalRounds: 5, lives: 3, score: 0, combo: 0,
    problem: null, phase: 'calc', calcTries: 0, hintUsed: false,
    selX: null, timer: null, timeLeft: 0, finalScore: 0
  },

  mount(container) {
    let host = null;
    if (typeof container === 'string') { try { host = document.querySelector(container); } catch (e) {} }
    else if (container instanceof HTMLElement) host = container;
    if (!host || !(host instanceof HTMLElement)) host = document.getElementById('mathlab-view') || document.getElementById('new-root');
    if (!host || !(host instanceof HTMLElement) || host === document.body) {
      let fh = document.getElementById('z-score-survival-force-host');
      if (!fh) { fh = document.createElement('div'); fh.id = 'z-score-survival-force-host'; document.body.appendChild(fh); }
      host = fh;
    }
    const footerEl = document.querySelector('footer, #footer, .app-footer');
    if (footerEl && footerEl.parentNode && typeof host.compareDocumentPosition === 'function' && (host.compareDocumentPosition(footerEl) & Node.DOCUMENT_POSITION_PRECEDING)) {
      footerEl.parentNode.insertBefore(host, footerEl);
    }
    host.style.display = '';
    host.style.visibility = 'visible';
    host.style.opacity = '1';
    host.style.minHeight = host.style.minHeight || '60vh';
    let parent = host.parentElement;
    while (parent && parent !== document.body && parent !== document.documentElement) {
      if (parent.style && parent.style.display === 'none') parent.style.display = 'block';
      if (parent.style && parent.style.visibility === 'hidden') parent.style.visibility = 'visible';
      parent = parent.parentElement;
    }
    this.container = host;
    this.render();
    this.initCanvas();
    this.resetGame();
  },

  render() {
    this.container.innerHTML = `
      <div class="game-z-score-survival" id="zss-root">
        <div class="zss-header">
          <div class="zss-title">🚨 정규분포 z점수 서바이벌</div>
          <div class="zss-stats">
            <div class="zss-stat">라운드 <span id="zss-round">1/5</span></div>
            <div class="zss-stat">점수 <span id="zss-score">0</span></div>
            <div class="zss-stat">생명 <span id="zss-lives">❤️❤️❤️</span></div>
            <div class="zss-stat">콤보 <span id="zss-combo">0</span></div>
            <div class="zss-stat">시간 <span id="zss-time">45</span></div>
          </div>
          <button class="zss-btn" id="zss-guide">📖 게임 방법</button>
        </div>
        <div class="zss-difficulty">
          <button class="zss-diff-btn" data-diff="easy">쉬움</button>
          <button class="zss-diff-btn active" data-diff="normal">보통</button>
          <button class="zss-diff-btn" data-diff="hard">도전</button>
        </div>
        <div class="zss-mission" id="zss-mission">게임을 시작하세요!</div>
        <div class="zss-compare" id="zss-compare">
          <button class="zss-compare-btn" id="zss-comp-a"></button>
          <button class="zss-compare-btn" id="zss-comp-b"></button>
        </div>
        <div class="zss-canvas-wrap"><canvas id="zss-canvas"></canvas></div>
        <div class="zss-panels">
          <div class="zss-calc" id="zss-calc-panel">
            <div class="zss-calc-label" id="zss-calc-label">1단계 — 안전 경계 X값 계산: X = μ + z×σ (오른쪽 경계)</div>
            <div class="zss-calc-row">
              <input class="zss-input" id="zss-input" type="number" step="0.01" placeholder="경계 X값">
              <button class="zss-btn zss-btn-primary" id="zss-check">✅ 경계 확인</button>
            </div>
            <div class="zss-calc-msg" id="zss-calc-msg"></div>
            <div class="zss-sel-info" id="zss-sel-info">2단계 — 경계 확인 후 그래프를 클릭해 대피 위치를 선택하세요.</div>
          </div>
          <div class="zss-table" id="zss-table-panel">
            <div class="zss-table-title">📊 표준정규분포표 (핵심값)</div>
            <button class="zss-btn zss-btn-gray" id="zss-hint" style="margin-bottom:6px">📊 z표 보기 (-10P)</button>
            <div id="zss-table-body" style="display:none">
              <table>
                <tr><th>z</th><th>위쪽 꼬리 확률 P(Z ≥ z)</th></tr>
                <tr><td>1.28</td><td>10%</td></tr>
                <tr><td>1.645</td><td>5%</td></tr>
                <tr><td>1.96</td><td>2.5%</td></tr>
                <tr><td>2.58</td><td>0.5%</td></tr>
              </table>
            </div>
          </div>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="zss-btn zss-btn-green" id="zss-evac" disabled>🚨 대피!</button>
          <button class="zss-btn zss-btn-gray" id="zss-home">🏠 홈</button>
        </div>
        <div class="zss-result" id="zss-result">
          <div class="zss-result-title" id="zss-result-title"></div>
          <div class="zss-result-score" id="zss-result-score"></div>
          <div class="zss-result-detail" id="zss-result-detail"></div>
          <div style="margin-top:12px">
            <button class="zss-btn zss-btn-primary" id="zss-next">다음 라운드 ▶</button>
          </div>
        </div>
        <div class="zss-hof">
          <div class="zss-hof-title">🏆 명예의 전당 (실시간 랭킹)</div>
          <div id="board-z-score-survival">
            <p style="text-align:center;color:#94a3b8;padding:10px 0;margin:0">랭킹 데이터를 불러오는 중...</p>
          </div>
        </div>
      </div>
      <div class="zss-modal" id="zss-modal">
        <div class="zss-modal-box">
          <div class="zss-modal-title">🏆 명예의 전당 등록</div>
          <div style="margin-bottom:10px;color:#64748b;font-size:0.9rem">최종 점수: <strong style="color:#d97706" id="zss-modal-score"></strong></div>
          <input class="zss-modal-input" id="zss-modal-nm" placeholder="닉네임 입력" maxlength="12">
          <div class="zss-modal-btns">
            <button class="zss-btn zss-btn-green" id="zss-modal-ok">등록</button>
            <button class="zss-btn zss-btn-gray" id="zss-modal-cancel">건너뛰기</button>
          </div>
        </div>
      </div>
      <div class="zss-modal" id="zss-guide-modal">
        <div class="zss-modal-box">
          <div class="zss-modal-title">📖 게임 방법</div>
          <div class="zss-guide-body">
            <p><strong>목표</strong>: 재난 피해가 정규분포 N(μ, σ²)를 따를 때, 표준화 z = (X - μ) / σ 로 안전 경계를 계산하고 안전 지대로 대피해 살아남으세요.</p>
            <ul style="padding-left:18px;margin:8px 0">
              <li><strong>1단계</strong>: 미션의 안전 기준(상위/하위 k%)에 맞는 경계 X값을 계산해 입력합니다. 첫 시도 정답은 +10점, 2회 틀리면 경계가 공개됩니다.</li>
              <li><strong>2단계</strong>: 그래프를 클릭해 대피 위치를 고른 뒤 <strong>🚨 대피!</strong> 버튼을 누릅니다. 안전 지대면 생존 +100점!</li>
              <li>연속 생존 시 콤보 보너스가 +10점씩 커지고, 남은 시간에 비례한 보너스도 있습니다.</li>
              <li>위험 지대를 고르거나 시간이 다 되면 생명이 1 줄어듭니다. 생명이 0이 되면 게임 종료!</li>
              <li>보통·도전 난이도에서 z표를 열면 -10점. 도전 난이도에는 두 대피소의 z값을 비교하는 라운드가 등장합니다.</li>
              <li>종료 시 남은 생명 1개당 +20점이 더해집니다. 순위는 점수 기준!</li>
            </ul>
            <p><strong>수학 개념</strong>: 표준정규분포, 표준화, z값과 꼬리 확률(1.28→10%, 1.645→5%, 1.96→2.5%, 2.58→0.5%)의 대응.</p>
          </div>
          <div class="zss-modal-btns" style="margin-top:12px">
            <button class="zss-btn zss-btn-primary" id="zss-guide-close">닫기</button>
          </div>
        </div>
      </div>
      <div class="zss-toast" id="zss-toast"></div>`;
  },

  initCanvas() {
    this.canvas = document.getElementById('zss-canvas');
    this.ctx = this.canvas ? this.canvas.getContext('2d') : null;
    if (!this.canvas) return;
    const wrap = this.canvas.parentElement;
    const w = Math.min(wrap.clientWidth || 500, 700);
    const h = Math.round(w * 0.5);
    this.canvas.width = w; this.canvas.height = h; this.canvas.style.height = h + 'px';
    this.canvas.addEventListener('click', e => this.onCanvasClick(e));
    this.canvas.addEventListener('touchend', e => {
      e.preventDefault();
      const t = e.changedTouches[0];
      const rect = this.canvas.getBoundingClientRect();
      this.handleMapClick((t.clientX - rect.left) * (this.canvas.width / rect.width));
    }, { passive: false });
  },

  diffConfig() {
    const d = this.state.difficulty;
    if (d === 'easy') return { rounds: 5, time: 60, tableFree: true, types: ['upper', 'lower'] };
    if (d === 'hard') return { rounds: 6, time: 35, tableFree: false, types: ['upper', 'lower', 'tails', 'center', 'compare', 'compare'] };
    return { rounds: 5, time: 45, tableFree: false, types: ['upper', 'lower', 'tails', 'center'] };
  },

  resetGame() {
    const S = this.state; const cfg = this.diffConfig();
    S.round = 1; S.score = 0; S.lives = 3; S.combo = 0; S.finalScore = 0;
    S.totalRounds = cfg.rounds;
    this.bindEvents();
    this.newRound();
    this.loadHOF();
  },

  restart() {
    const S = this.state; const cfg = this.diffConfig();
    S.round = 1; S.score = 0; S.lives = 3; S.combo = 0; S.finalScore = 0;
    S.totalRounds = cfg.rounds;
    this.newRound();
    this.updateStats();
  },

  newRound() {
    const S = this.state; const cfg = this.diffConfig();
    this.stopTimer();
    S.problem = this.genProblem(cfg);
    const P = S.problem;
    S.phase = P.type === 'compare' ? 'compare' : 'calc';
    S.calcTries = 0; S.hintUsed = false; S.selX = null;
    S.timeLeft = cfg.time;
    const result = document.getElementById('zss-result');
    if (result) result.classList.remove('show');
    const input = document.getElementById('zss-input');
    if (input) { input.value = ''; input.disabled = false; }
    const check = document.getElementById('zss-check');
    if (check) check.disabled = false;
    const msg = document.getElementById('zss-calc-msg');
    if (msg) msg.textContent = '';
    const sel = document.getElementById('zss-sel-info');
    if (sel) sel.textContent = '2단계 — 경계 확인 후 그래프를 클릭해 대피 위치를 선택하세요.';
    const evac = document.getElementById('zss-evac');
    if (evac) evac.disabled = true;
    const cl = document.getElementById('zss-calc-label');
    if (cl && P.type !== 'compare') {
      cl.textContent = P.type === 'lower'
        ? '1단계 — 안전 경계 X값 계산: X = μ - z×σ (왼쪽 경계)'
        : '1단계 — 안전 경계 X값 계산: X = μ + z×σ (오른쪽 경계)';
    }
    const isCompare = S.phase === 'compare';
    const calcPanel = document.getElementById('zss-calc-panel');
    if (calcPanel) calcPanel.style.display = isCompare ? 'none' : '';
    const tablePanel = document.getElementById('zss-table-panel');
    if (tablePanel) tablePanel.style.display = isCompare ? 'none' : '';
    const compBox = document.getElementById('zss-compare');
    if (compBox) compBox.classList.toggle('show', isCompare);
    if (evac) evac.style.display = isCompare ? 'none' : '';
    const tb = document.getElementById('zss-table-body');
    const hintBtn = document.getElementById('zss-hint');
    if (tb && hintBtn) {
      if (cfg.tableFree) { tb.style.display = ''; hintBtn.style.display = 'none'; }
      else { tb.style.display = 'none'; hintBtn.style.display = ''; hintBtn.disabled = false; }
    }
    if (isCompare) this.renderCompare();
    this.updateMission();
    this.updateStats();
    this.drawCurve();
    this.startTimer();
  },

  genProblem(cfg) {
    const types = cfg.types;
    const type = types[Math.floor(Math.random() * types.length)];
    if (type === 'compare') return this.genCompare();
    const sc = SCENARIOS[Math.floor(Math.random() * SCENARIOS.length)];
    const entry = ZTABLE[Math.floor(Math.random() * ZTABLE.length)];
    const mu = 30 + 5 * Math.floor(Math.random() * 11);
    const sigma = 4 + Math.floor(Math.random() * 9);
    const zc = entry.z; const k = entry.tail;
    const bHigh = mu + zc * sigma; const bLow = mu - zc * sigma;
    return { type: type, sc: sc, mu: mu, sigma: sigma, zc: zc, k: k, bHigh: bHigh, bLow: bLow, expected: type === 'lower' ? bLow : bHigh };
  },

  genCompare() {
    for (let a = 0; a < 50; a++) {
      const mk = () => {
        const mu = 40 + 5 * Math.floor(Math.random() * 7);
        const sigma = 5 + Math.floor(Math.random() * 8);
        const zr = Math.round((Math.random() * 4 - 1.5) * 100) / 100;
        const x = Math.round((mu + zr * sigma) * 10) / 10;
        return { mu: mu, sigma: sigma, x: x, z: Math.round(((x - mu) / sigma) * 100) / 100 };
      };
      const A = mk(); const B = mk();
      if (Math.abs(A.z - B.z) >= 0.25) return { type: 'compare', A: A, B: B, answer: A.z > B.z ? 'A' : 'B' };
    }
    const FA = { mu: 50, sigma: 10, x: 66, z: 1.6 }; const FB = { mu: 60, sigma: 5, x: 64, z: 0.8 };
    return { type: 'compare', A: FA, B: FB, answer: 'A' };
  },

  updateMission() {
    const P = this.state.problem; const el = document.getElementById('zss-mission');
    if (!el || !P) return;
    if (P.type === 'compare') {
      el.innerHTML = '🚨 <strong>이중 재난!</strong> 두 대피소의 안전 점수는 서로 다른 정규분포를 따릅니다. 표준화 점수 z가 <strong>더 큰</strong>(상대적으로 더 안전한) 대피소를 선택하세요!';
      return;
    }
    const base = `🚨 <strong>${P.sc.name}</strong> 발생! ${P.sc.axis} X는 <strong>N(${P.mu}, ${P.sigma}²)</strong> 분포를 따릅니다. `;
    let cond = '';
    if (P.type === 'upper') cond = `지수가 <strong>상위 ${P.k}%</strong>인 지점만 안전합니다. (오른쪽 꼬리)`;
    else if (P.type === 'lower') cond = `지수가 <strong>하위 ${P.k}%</strong>인 지점만 안전합니다. (왼쪽 꼬리)`;
    else if (P.type === 'tails') cond = `충격이 중앙에 집중! <strong>양쪽 극단 ${P.k}%씩</strong>만 안전합니다. 1단계에서는 오른쪽(+) 경계 X값을 구하세요.`;
    else cond = `외곽 <strong>양쪽 ${P.k}%씩</strong>이 위험! 중앙 ${100 - 2 * P.k}% 지대만 안전합니다. 1단계에서는 오른쪽(+) 경계 X값을 구하세요.`;
    el.innerHTML = base + cond;
  },

  renderCompare() {
    const P = this.state.problem;
    const a = document.getElementById('zss-comp-a'); const b = document.getElementById('zss-comp-b');
    if (!a || !b || !P || P.type !== 'compare') return;
    a.innerHTML = `<strong>🅰️ 대피소 A</strong><br>안전 점수 분포: N(${P.A.mu}, ${P.A.sigma}²)<br>이 대피소의 점수: <strong>${P.A.x}</strong>`;
    b.innerHTML = `<strong>🅱️ 대피소 B</strong><br>안전 점수 분포: N(${P.B.mu}, ${P.B.sigma}²)<br>이 대피소의 점수: <strong>${P.B.x}</strong>`;
    a.disabled = false; b.disabled = false;
  },

  startTimer() {
    const S = this.state;
    this.stopTimer();
    this.updateTimeView();
    S.timer = setInterval(() => {
      S.timeLeft--;
      this.updateTimeView();
      if (S.timeLeft <= 0) { this.stopTimer(); this.timeUp(); }
    }, 1000);
  },

  stopTimer() {
    const S = this.state;
    if (S.timer) { clearInterval(S.timer); S.timer = null; }
  },

  updateTimeView() {
    const el = document.getElementById('zss-time'); if (!el) return;
    el.textContent = Math.max(0, this.state.timeLeft);
    el.classList.toggle('zss-timer-warn', this.state.timeLeft <= 10);
  },

  timeUp() {
    const S = this.state;
    if (S.phase === 'result') return;
    S.lives = Math.max(0, S.lives - 1); S.combo = 0; S.phase = 'result';
    this.updateStats();
    this.showResult(false, '⏰ 시간 초과!', this.answerDetail(), 0);
    showToast('⏰ 시간 초과로 생명을 잃었습니다', 'err');
  },

  answerDetail() {
    const P = this.state.problem;
    if (!P) return '';
    const f = n => Math.round(n * 100) / 100;
    if (P.type === 'compare') return `A의 z = ${P.A.z} , B의 z = ${P.B.z} → 정답은 <strong>${P.answer}</strong>`;
    if (P.type === 'upper') return `안전 경계: X ≥ ${f(P.bHigh)} (z ≥ ${P.zc})`;
    if (P.type === 'lower') return `안전 경계: X ≤ ${f(P.bLow)} (z ≤ -${P.zc})`;
    if (P.type === 'tails') return `안전 경계: X ≤ ${f(P.bLow)} 또는 X ≥ ${f(P.bHigh)} (|z| ≥ ${P.zc})`;
    return `안전 경계: ${f(P.bLow)} ≤ X ≤ ${f(P.bHigh)} (|z| ≤ ${P.zc})`;
  },

  checkBoundary() {
    const S = this.state; const P = S.problem;
    if (!P || P.type === 'compare' || S.phase !== 'calc') return;
    const input = document.getElementById('zss-input');
    const val = parseFloat(input ? input.value : '');
    if (isNaN(val)) { showToast('⚠️ 경계 X값을 숫자로 입력해주세요!', 'err'); return; }
    const msg = document.getElementById('zss-calc-msg');
    if (Math.abs(val - P.expected) <= 0.5) {
      if (S.calcTries === 0) { S.score += 10; showToast('✅ 경계 통과! +10점 — 그래프에서 대피 위치를 클릭하세요', 'ok'); }
      else { showToast('✅ 경계 통과! 그래프에서 대피 위치를 클릭하세요', 'ok'); }
      if (msg) msg.textContent = '경계 확인 완료: ' + (Math.round(P.expected * 100) / 100);
      this.unlockMap();
    } else {
      S.calcTries++;
      if (S.calcTries >= 2) {
        if (msg) msg.textContent = '경계 공개: ' + (Math.round(P.expected * 100) / 100) + ' (z = ' + (P.type === 'lower' ? '-' : '') + P.zc + ')';
        showToast('📖 2회 오답 — 경계값이 공개되었습니다. 대피 위치를 선택하세요', 'err');
        this.unlockMap();
      } else {
        showToast('❌ 경계가 아닙니다. z = (X - μ) / σ 를 다시 확인해보세요!', 'err');
      }
    }
    this.updateStats();
  },

  unlockMap() {
    this.state.phase = 'map';
    const input = document.getElementById('zss-input'); if (input) input.disabled = true;
    const check = document.getElementById('zss-check'); if (check) check.disabled = true;
    this.drawCurve();
  },

  onCanvasClick(e) {
    const rect = this.canvas.getBoundingClientRect();
    this.handleMapClick((e.clientX - rect.left) * (this.canvas.width / rect.width));
  },

  handleMapClick(px) {
    const S = this.state; const P = S.problem;
    if (!P || P.type === 'compare' || S.phase !== 'map') {
      if (P && P.type !== 'compare' && S.phase === 'calc') showToast('⚠️ 먼저 1단계 경계 확인을 완료하세요!', 'err');
      return;
    }
    const W = this.canvas.width; const pad = 30;
    const lo = P.mu - 4 * P.sigma; const hi = P.mu + 4 * P.sigma;
    const t = Math.min(1, Math.max(0, (px - pad) / (W - pad * 2)));
    S.selX = Math.round((lo + t * (hi - lo)) * 10) / 10;
    const sel = document.getElementById('zss-sel-info');
    if (sel) sel.textContent = '선택한 대피 위치: X = ' + S.selX + ' — 준비되면 대피 버튼을 누르세요!';
    const evac = document.getElementById('zss-evac'); if (evac) evac.disabled = false;
    this.drawCurve();
  },

  isSafe(x) {
    const P = this.state.problem;
    const z = (x - P.mu) / P.sigma;
    const e = 0.000000001;
    if (P.type === 'upper') return z >= P.zc - e;
    if (P.type === 'lower') return z <= -P.zc + e;
    if (P.type === 'tails') return Math.abs(z) >= P.zc - e;
    return Math.abs(z) <= P.zc + e;
  },

  evacuate() {
    const S = this.state; const P = S.problem;
    if (!P || P.type === 'compare') return;
    if (S.phase === 'calc') { showToast('⚠️ 먼저 1단계 경계 확인을 완료하세요!', 'err'); return; }
    if (S.phase !== 'map') return;
    if (S.selX == null) { showToast('⚠️ 그래프를 클릭해 대피 위치를 먼저 선택하세요!', 'err'); return; }
    this.stopTimer();
    S.phase = 'result';
    const z = Math.round(((S.selX - P.mu) / P.sigma) * 100) / 100;
    const safe = this.isSafe(S.selX);
    if (safe) {
      const timeBonus = Math.floor(Math.max(0, S.timeLeft) / 5);
      const gained = 100 + S.combo * 10 + timeBonus;
      S.score += gained; S.combo++;
      this.showResult(true, '🎉 생존 성공!', `내 위치 X = ${S.selX}, z = ${z}<br>${this.answerDetail()}<br>기본 +100 / 콤보 +${(S.combo - 1) * 10} / 시간 보너스 +${timeBonus}`, gained);
    } else {
      S.lives = Math.max(0, S.lives - 1); S.combo = 0;
      this.showResult(false, '💥 위험 지대!', `내 위치 X = ${S.selX}, z = ${z}<br>${this.answerDetail()}`, 0);
    }
    this.updateStats();
  },

  chooseShelter(pick) {
    const S = this.state; const P = S.problem;
    if (!P || P.type !== 'compare' || S.phase !== 'compare') return;
    this.stopTimer();
    S.phase = 'result';
    const a = document.getElementById('zss-comp-a'); const b = document.getElementById('zss-comp-b');
    if (a) a.disabled = true; if (b) b.disabled = true;
    if (pick === P.answer) {
      const timeBonus = Math.floor(Math.max(0, S.timeLeft) / 5);
      const gained = 100 + S.combo * 10 + timeBonus;
      S.score += gained; S.combo++;
      this.showResult(true, '🎉 안전한 선택!', `${this.answerDetail()}<br>기본 +100 / 콤보 +${(S.combo - 1) * 10} / 시간 보너스 +${timeBonus}`, gained);
    } else {
      S.lives = Math.max(0, S.lives - 1); S.combo = 0;
      this.showResult(false, '💥 잘못된 선택!', this.answerDetail(), 0);
    }
    this.updateStats();
  },

  showResult(ok, title, detailHtml, gained) {
    const box = document.getElementById('zss-result'); if (!box) return;
    box.classList.add('show');
    const t = document.getElementById('zss-result-title');
    if (t) { t.textContent = title; t.style.color = ok ? '#059669' : '#dc2626'; }
    const sEl = document.getElementById('zss-result-score'); if (sEl) sEl.textContent = '+' + gained + '점';
    const d = document.getElementById('zss-result-detail'); if (d) d.innerHTML = detailHtml;
    const next = document.getElementById('zss-next');
    if (next) next.textContent = (this.state.lives <= 0 || this.state.round >= this.state.totalRounds) ? '🏁 최종 결과' : '다음 라운드 ▶';
    this.drawCurve();
  },

  nextRound() {
    const S = this.state;
    if (S.phase !== 'result') return;
    if (S.lives <= 0 || S.round >= S.totalRounds) { this.gameOver(); return; }
    S.round++;
    this.newRound();
  },

  gameOver() {
    const S = this.state;
    this.stopTimer();
    S.finalScore = S.score + S.lives * 20;
    const modal = document.getElementById('zss-modal');
    const ms = document.getElementById('zss-modal-score');
    if (ms) ms.textContent = S.finalScore + '점 (생명 보너스 +' + (S.lives * 20) + ' 포함)';
    const nm = document.getElementById('zss-modal-nm');
    if (nm) nm.value = '';
    if (modal) modal.classList.add('show');
  },

  updateStats() {
    const S = this.state;
    const rd = document.getElementById('zss-round'); if (rd) rd.textContent = S.round + '/' + S.totalRounds;
    const sc = document.getElementById('zss-score'); if (sc) sc.textContent = S.score;
    const lv = document.getElementById('zss-lives'); if (lv) lv.textContent = S.lives > 0 ? '❤️'.repeat(S.lives) : '💀';
    const cb = document.getElementById('zss-combo'); if (cb) cb.textContent = S.combo;
    this.updateTimeView();
  },

  showHintTable() {
    const S = this.state; const cfg = this.diffConfig();
    if (cfg.tableFree || S.hintUsed || S.phase === 'result') return;
    S.hintUsed = true;
    S.score = Math.max(0, S.score - 10);
    const tb = document.getElementById('zss-table-body'); if (tb) tb.style.display = '';
    const btn = document.getElementById('zss-hint'); if (btn) btn.disabled = true;
    showToast('📊 z표 공개 (-10점)');
    this.updateStats();
  },

  saveHOF(nm) {
    const score = this.state.finalScore;
    const name = String(nm || '무명의 생존자').trim().slice(0, 12) || '무명의 생존자';
    const levelMap = { easy: '쉬움', normal: '보통', hard: '도전' };
    const level = levelMap[this.state.difficulty] || '보통';
    const nameWithLevel = name + '(' + level + ')';
    if (typeof submitRanking === 'function') {
      try { submitRanking(ATITLE, score, true, nameWithLevel, ABOARD); showToast('🏆 명예의 전당에 저장했습니다!', 'ok'); }
      catch (e) { console.warn('[ZScoreSurvival] submitRanking 오류:', e); showToast('⚠️ 서버 저장에 실패해 로컬에만 기록합니다', 'err'); }
    } else {
      showToast('저장 완료 (로컬 기록)', 'ok');
    }
    try {
      const key = 'hof_' + ABOARD;
      const list = JSON.parse(localStorage.getItem(key) || '[]');
      list.push({ name: name, level: level, score: score });
      list.sort((x, y) => y.score - x.score);
      list.splice(5);
      localStorage.setItem(key, JSON.stringify(list));
    } catch (e) {}
    const self = this;
    setTimeout(function () { self.loadHOF(); }, 800);
  },

  loadHOF() {
    const el = document.getElementById('board-z-score-survival');
    if (typeof loadGameLeaderboard === 'function') {
      try { loadGameLeaderboard(ATITLE, true, ABOARD); return; }
      catch (e) { console.warn('[ZScoreSurvival] loadGameLeaderboard 오류:', e); }
    }
    this.renderHOFLocal(el);
  },

  renderHOFLocal(el) {
    if (!el) return;
    let list = [];
    try { list = JSON.parse(localStorage.getItem('hof_' + ABOARD) || '[]'); } catch (e) { list = []; }
    if (!list.length) {
      el.innerHTML = '<p style="text-align:center;color:#94a3b8;padding:10px 0;margin:0">아직 기록이 없습니다. 첫 번째 생존에 도전해보세요!</p>';
      return;
    }
    const medals = ['🥇', '🥈', '🥉'];
    el.innerHTML = list.slice(0, 5).map((r, i) =>
      `<div class="zss-hof-item"><span class="zss-hof-name">${medals[i] || (i + 1) + '위'} ${esc(r.name)}${r.level ? ' <span style="color:#64748b;font-weight:600">(' + esc(r.level) + ')</span>' : ''}</span><span class="zss-hof-score">${Number(r.score) || 0}점</span></div>`
    ).join('');
  },

  drawCurve() {
    const S = this.state; const P = S.problem;
    if (!P || !this.ctx || !this.canvas) return;
    const ctx = this.ctx; const W = this.canvas.width; const H = this.canvas.height;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H);
    const isComp = P.type === 'compare';
    const mu = isComp ? 0 : P.mu;
    const sigma = isComp ? 1 : P.sigma;
    const lo = mu - 4 * sigma; const hi = mu + 4 * sigma;
    const pad = 30; const baseY = H - 34; const peakH = H - 70;
    const toPx = x => pad + ((x - lo) / (hi - lo)) * (W - pad * 2);
    const pdfY = x => baseY - Math.exp(-0.5 * Math.pow((x - mu) / sigma, 2)) * peakH;
    if (S.phase === 'result' && !isComp) {
      const shade = (x1, x2) => {
        ctx.beginPath(); ctx.moveTo(toPx(x1), baseY);
        const step = (hi - lo) / 300;
        for (let x = x1; x <= x2; x += step) ctx.lineTo(toPx(x), pdfY(x));
        ctx.lineTo(toPx(x2), pdfY(x2)); ctx.lineTo(toPx(x2), baseY); ctx.closePath();
        ctx.fillStyle = 'rgba(5, 150, 105, 0.20)'; ctx.fill();
      };
      if (P.type === 'upper') shade(P.bHigh, hi);
      else if (P.type === 'lower') shade(lo, P.bLow);
      else if (P.type === 'tails') { shade(lo, P.bLow); shade(P.bHigh, hi); }
      else shade(P.bLow, P.bHigh);
    }
    ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(pad - 8, baseY); ctx.lineTo(W - pad + 8, baseY); ctx.stroke();
    ctx.beginPath();
    for (let i = 0; i <= 300; i++) {
      const x = lo + (i / 300) * (hi - lo);
      if (i === 0) ctx.moveTo(toPx(x), pdfY(x)); else ctx.lineTo(toPx(x), pdfY(x));
    }
    ctx.strokeStyle = '#0284c7'; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.font = '11px sans-serif'; ctx.textAlign = 'center';
    for (let kk = -3; kk <= 3; kk++) {
      const x = mu + kk * sigma; const px = toPx(x);
      ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(px, baseY); ctx.lineTo(px, baseY + 5); ctx.stroke();
      ctx.fillStyle = '#64748b';
      const label = isComp ? (kk === 0 ? 'z=0' : String(kk)) : String(Math.round(x * 10) / 10);
      ctx.fillText(label, px, baseY + 17);
    }
    if (!isComp && (S.phase === 'map' || S.phase === 'result')) {
      const bounds = P.type === 'upper' ? [P.bHigh] : (P.type === 'lower' ? [P.bLow] : [P.bLow, P.bHigh]);
      ctx.setLineDash([6, 4]); ctx.strokeStyle = '#d97706'; ctx.lineWidth = 2;
      bounds.forEach(bx => {
        const px = toPx(bx);
        ctx.beginPath(); ctx.moveTo(px, baseY); ctx.lineTo(px, baseY - peakH - 8); ctx.stroke();
      });
      ctx.setLineDash([]);
      ctx.fillStyle = '#b45309'; ctx.font = 'bold 11px sans-serif';
      bounds.forEach(bx => ctx.fillText(String(Math.round(bx * 100) / 100), toPx(bx), baseY - peakH - 14));
    }
    if (!isComp && S.selX != null) {
      const px = toPx(S.selX);
      let color = '#0284c7';
      if (S.phase === 'result') color = this.isSafe(S.selX) ? '#059669' : '#dc2626';
      ctx.beginPath(); ctx.arc(px, baseY, 8, 0, Math.PI * 2);
      ctx.fillStyle = color; ctx.fill();
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = color; ctx.font = 'bold 12px sans-serif';
      ctx.fillText('내 위치 ' + S.selX, px, baseY + 30);
    }
    if (isComp && S.phase === 'result') {
      const marks = [
        { z: P.A.z, label: 'A', color: '#7c3aed' },
        { z: P.B.z, label: 'B', color: '#0284c7' }
      ];
      marks.forEach(m => {
        const cz = Math.max(lo + 0.1, Math.min(hi - 0.1, m.z));
        const px = toPx(cz); const py = pdfY(cz);
        ctx.beginPath(); ctx.arc(px, py, 7, 0, Math.PI * 2);
        ctx.fillStyle = m.color; ctx.fill();
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.stroke();
        ctx.fillStyle = m.color; ctx.font = 'bold 12px sans-serif';
        ctx.fillText(m.label + ' (z=' + m.z + ')', px, py - 14);
      });
    }
  },

    const mv = document.getElementById('mathlab-view');
    if (mv) { mv.style.display = 'none'; mv.innerHTML = ''; }
    const fh = document.getElementById('z-score-survival-force-host');
    if (fh) { fh.style.display = 'none'; fh.innerHTML = ''; }
    try {
      
    } catch (e) {}
    const ag = document.querySelector('.app-grid');

    const ds = document.getElementById('dashboard-screen');
    if (ds) ds.style.display = '';
    if (typeof window.goHome === 'function') window.goHome();
  },

  bindEvents() {
    const root = document.getElementById('zss-root');
    if (!root || root.dataset.zssBound === '1') return;
    root.dataset.zssBound = '1';
    root.querySelectorAll('.zss-diff-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        this.state.difficulty = btn.dataset.diff;
        root.querySelectorAll('.zss-diff-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        showToast('난이도 변경 — 새 게임을 시작합니다');
        this.restart();
      });
    });
    const on = (id, fn) => { const el = document.getElementById(id); if (el) el.addEventListener('click', fn); };
    on('zss-check', () => this.checkBoundary());
    on('zss-evac', () => this.evacuate());
    on('zss-next', () => this.nextRound());
    on('zss-home', () => this.goHome());
    on('zss-hint', () => this.showHintTable());
    on('zss-comp-a', () => this.chooseShelter('A'));
    on('zss-comp-b', () => this.chooseShelter('B'));
    on('zss-guide', () => { const m = document.getElementById('zss-guide-modal'); if (m) m.classList.add('show'); });
    on('zss-guide-close', () => { const m = document.getElementById('zss-guide-modal'); if (m) m.classList.remove('show'); });
    on('zss-modal-ok', () => {
      const nmEl = document.getElementById('zss-modal-nm');
      const nm = (nmEl && nmEl.value ? nmEl.value : '무명의 생존자').trim();
      this.saveHOF(nm);
      const m = document.getElementById('zss-modal'); if (m) m.classList.remove('show');
      this.restart();
    });
    on('zss-modal-cancel', () => {
      const m = document.getElementById('zss-modal'); if (m) m.classList.remove('show');
      this.restart();
    });
    const input = document.getElementById('zss-input');
    if (input) input.addEventListener('keydown', e => { if (e.key === 'Enter') this.checkBoundary(); });
  },

  destroy() {
    this.stopTimer();
    if (this.container) this.container.innerHTML = '';
  }
};

function registerZScoreSurvival() {
  if (typeof window.MathLabGames === 'undefined' || typeof window.MathLabGames.register !== 'function') return;
  try {
    if (typeof window.MathLabGames.get === 'function' && window.MathLabGames.get('z-score-survival')) return;
    window.MathLabGames.register({
      id: 'z-score-survival',
      title: '정규분포 z점수 서바이벌',
      icon: '🚨',
      sourceType: 'new',
      mount(container, context) { ZScoreSurvival.mount(container, context); },
      reset() { ZScoreSurvival.resetGame(); },
      destroy() { ZScoreSurvival.destroy(); },
      goHome() { ZScoreSurvival.goHome(); }
    });
  } catch (e) { console.warn('[ZScoreSurvival] register 방어:', e); }
}
registerZScoreSurvival();
window.addEventListener('DOMContentLoaded', registerZScoreSurvival);
setTimeout(registerZScoreSurvival, 100);
setTimeout(registerZScoreSurvival, 500);

window.ZScoreSurvival = ZScoreSurvival;
window.initZScoreSurvivalGame = function () {
  registerZScoreSurvival();
  try {
    if (window.LegacyBridge && typeof window.LegacyBridge.hideAllLegacySections === 'function') {
      window.LegacyBridge.hideAllLegacySections();
      if (typeof window.LegacyBridge.showNewRoot === 'function') window.LegacyBridge.showNewRoot();
    }
  } catch (e) {}
  if (typeof window.MathLabGames !== 'undefined' && typeof window.MathLabGames.mount === 'function') {
    try { window.MathLabGames.mount('z-score-survival'); return; } catch (e) {}
  }
  ZScoreSurvival.mount(document.getElementById('mathlab-view'));
};
window.launchZScoreSurvivalGame = window.initZScoreSurvivalGame;
})();
</script>
