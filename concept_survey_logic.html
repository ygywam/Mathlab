
<script>
(function() {
  'use strict';

  const SurveyConceptApp = {
    host: null,
    currentMission: 'cos', // 'cos' or 'sin'

    mount(container) {
      this.host = (typeof container === 'string') ? document.querySelector(container) : container;
      if (!this.host) {
        this.host = document.getElementById('mathlab-view') || document.getElementById('new-root') || document.body;
      }
      
      this.host.style.display = '';
      this.host.style.visibility = 'visible';
      this.host.style.opacity = '1';
      let parent = this.host.parentElement;
      while (parent && parent !== document.body && parent !== document.documentElement) {
        if (parent.style && parent.style.display === 'none') parent.style.display = 'block';
        if (parent.style && parent.style.visibility === 'hidden') parent.style.visibility = 'visible';
        parent = parent.parentElement;
      }
      
      this.render();
    },

    goHome() {
      this.destroy();
      if (typeof window.LegacyBridge !== 'undefined' && typeof window.LegacyBridge.backHome === 'function') {
        try { window.LegacyBridge.backHome(); return; } catch (e) {}
      }
      if (typeof window.MathLabUtils !== 'undefined' && typeof window.MathLabUtils.goHome === 'function') {
        window.MathLabUtils.goHome();
      } else {
        location.reload();
      }
    },

    destroy() {
      if (this.host) {
        this.host.innerHTML = '';
        this.host.style.display = 'none';
      }
    },

    switchMission(type) {
      if (!this.host) return;
      this.currentMission = type;
      
      this.host.querySelectorAll('.sur-tab-btn').forEach(btn => btn.classList.remove('active'));
      this.host.querySelectorAll('.sur-mission-content').forEach(content => content.classList.add('hidden'));
      
      const tab = this.host.querySelector(`#sur-tab-${type}`);
      if (tab) tab.classList.add('active');
      
      const content = this.host.querySelector(`#sur-mission-${type}`);
      if (content) content.classList.remove('hidden');
      
      if (type === 'cos') this.updateSurveyCos();
      else this.updateSurveySin();
    },

    updateSurveyCos() {
      if (!this.host) return;
      const b = parseFloat(this.host.querySelector('#slider-cos-b').value); 
      const c = parseFloat(this.host.querySelector('#slider-cos-c').value); 
      const angleA = parseFloat(this.host.querySelector('#slider-cos-a').value);
      
      this.host.querySelector('#val-cos-b').innerText = b; 
      this.host.querySelector('#val-cos-c').innerText = c; 
      this.host.querySelector('#val-cos-a').innerText = angleA;
      
      const radA = angleA * Math.PI / 180; 
      const aSquared = (b*b) + (c*c) - (2*b*c*Math.cos(radA)); 
      const a = Math.sqrt(aSquared);
      
      let fTextCos = `a^2 = ${b}^2 + ${c}^2 - 2 \\times ${b} \\times ${c} \\times \\cos(${angleA}^\\circ)`;
      const formulaEl = this.host.querySelector('#formula-cos');
      if (this.katexTimeoutCos) clearTimeout(this.katexTimeoutCos);
      this.katexTimeoutCos = setTimeout(() => {
        if (typeof katex !== 'undefined' && formulaEl) {
          katex.render(fTextCos, formulaEl, { throwOnError: false, displayMode: true });
        } else if (formulaEl) {
          formulaEl.innerText = fTextCos;
        }
      }, 50);
      
      const resEl = this.host.querySelector('#result-cos');
      if (resEl) resEl.innerHTML = `거리: <strong style="color:#6c5ce7; font-size:1.4rem;">${a.toFixed(1)} m</strong>`;
      
      const canvas = this.host.querySelector('#canvas-cos'); 
      if (!canvas) return;
      const ctx = canvas.getContext('2d'); 
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      const x0 = 0, y0 = 0, x1 = b, y1 = 0, x2 = c*Math.cos(radA), y2 = c*Math.sin(radA);
      const minX = Math.min(x0, x1, x2), maxX = Math.max(x0, x1, x2), minY = Math.min(y0, y1, y2), maxY = Math.max(y0, y1, y2);
      const scale = Math.min((canvas.width - 100) / (maxX - minX || 1), (canvas.height - 80) / (maxY - minY || 1));
      const offsetX = canvas.width/2 - ((maxX+minX)/2)*scale, offsetY = canvas.height/2 + ((maxY+minY)/2)*scale;
      
      ctx.beginPath(); 
      ctx.moveTo(offsetX+x0*scale, offsetY-y0*scale); 
      ctx.lineTo(offsetX+x1*scale, offsetY-y1*scale); 
      ctx.lineTo(offsetX+x2*scale, offsetY-y2*scale); 
      ctx.closePath(); 
      ctx.fillStyle = 'rgba(108, 92, 231, 0.15)'; ctx.fill(); 
      ctx.lineWidth = 3; ctx.strokeStyle = '#6c5ce7'; ctx.stroke();
      
      ctx.fillStyle = '#2d3436'; ctx.font = 'bold 15px Pretendard'; 
      ctx.fillText('전망대', offsetX+x0*scale-20, offsetY-y0*scale+25); 
      ctx.fillText('A봉', offsetX+x1*scale-10, offsetY-y1*scale+25); 
      ctx.fillText('B봉', offsetX+x2*scale-10, offsetY-y2*scale-15);
    },

    updateSurveySin() {
      if (!this.host) return;
      const c = parseFloat(this.host.querySelector('#slider-sin-c').value); 
      const angleA = parseFloat(this.host.querySelector('#slider-sin-a').value); 
      let angleB = parseFloat(this.host.querySelector('#slider-sin-b').value);
      
      if(angleA + angleB >= 180) { 
        angleB = 179 - angleA; 
        this.host.querySelector('#slider-sin-b').value = angleB; 
      }
      
      this.host.querySelector('#val-sin-c').innerText = c; 
      this.host.querySelector('#val-sin-a').innerText = angleA; 
      this.host.querySelector('#val-sin-b').innerText = angleB;
      
      const angleC = 180 - angleA - angleB; 
      const radA = angleA*Math.PI/180; const radB = angleB*Math.PI/180; const radC = angleC*Math.PI/180;
      const b = (c*Math.sin(radB))/Math.sin(radC);
      
      let fTextSin = `\\frac{b}{\\sin(${angleB}^\\circ)} = \\frac{${c}}{\\sin(${angleC}^\\circ)}`;
      const formulaEl = this.host.querySelector('#formula-sin');
      if (this.katexTimeoutSin) clearTimeout(this.katexTimeoutSin);
      this.katexTimeoutSin = setTimeout(() => {
        if (typeof katex !== 'undefined' && formulaEl) {
          katex.render(fTextSin, formulaEl, { throwOnError: false, displayMode: true });
        } else if (formulaEl) {
          formulaEl.innerText = fTextSin;
        }
      }, 50);
      
      const resEl = this.host.querySelector('#result-sin');
      if (resEl) resEl.innerHTML = `거리: <strong style="color:#00b894; font-size:1.4rem;">${b.toFixed(1)} m</strong>`;
      
      const canvas = this.host.querySelector('#canvas-sin'); 
      if (!canvas) return;
      const ctx = canvas.getContext('2d'); 
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      const x0 = 0, y0 = 0, x1 = c, y1 = 0, x2 = b*Math.cos(radA), y2 = b*Math.sin(radA);
      const minX = Math.min(x0, x1, x2), maxX = Math.max(x0, x1, x2), minY = Math.min(y0, y1, y2), maxY = Math.max(y0, y1, y2);
      const scale = Math.min((canvas.width - 120) / (maxX - minX || 1), (canvas.height - 80) / (maxY - minY || 1));
      const offsetX = canvas.width/2 - ((maxX+minX)/2)*scale, offsetY = canvas.height/2 + ((maxY+minY)/2)*scale;
      
      ctx.beginPath(); 
      ctx.moveTo(offsetX+x0*scale, offsetY-y0*scale); 
      ctx.lineTo(offsetX+x1*scale, offsetY-y1*scale); 
      ctx.lineTo(offsetX+x2*scale, offsetY-y2*scale); 
      ctx.closePath(); 
      ctx.fillStyle = 'rgba(0, 184, 148, 0.15)'; ctx.fill(); 
      ctx.lineWidth = 3; ctx.strokeStyle = '#00b894'; ctx.stroke();
      
      ctx.fillStyle = '#2d3436'; ctx.font = 'bold 15px Pretendard'; 
      ctx.fillText('관측소A', offsetX+x0*scale-25, offsetY-y0*scale+25); 
      ctx.fillText('관측소B', offsetX+x1*scale-15, offsetY-y1*scale+25); 
      ctx.fillText('랜드마크', offsetX+x2*scale-30, offsetY-y2*scale-15);
    },

    render() {
      if (!this.host) return;
      this.host.innerHTML = `
        <style>
          .sur-container { padding: 24px; background: #ffffff; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); max-width: 800px; margin: 0 auto; font-family: 'Pretendard', sans-serif; }
          .sur-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
          .sur-header h1 { margin: 0; font-size: 2rem; color: #2c3e50; font-weight: 900; }
          .sur-home-btn { padding: 10px 16px; background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 10px; cursor: pointer; color: #475569; font-weight: 800; transition: 0.2s; }
          .sur-msg { background: #e8f8f5; color: #16a085; border: 1px solid #a3e4d7; padding: 12px; border-radius: 12px; text-align: center; margin-bottom: 20px; font-weight: 800; }
          
          .sur-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
          .sur-tab-btn { padding: 14px; border: 2px solid #dfe6e9; border-radius: 14px; background: #fff; color: #7f8c8d; font-weight: 900; font-size: 1.1rem; cursor: pointer; transition: 0.2s; }
          .sur-tab-btn.active { border-color: #0984e3; color: #0984e3; background: #f0f8ff; }
          
          .sur-mission-content.hidden { display: none; }
          .sur-mission-scenario { background: #f8fafc; padding: 15px; border-radius: 12px; border: 1px solid #e2e8f0; font-size: 1.05rem; color: #34495e; font-weight: 700; margin-bottom: 15px; }
          
          .sur-canvas-wrap { display: flex; justify-content: center; align-items: center; background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 10px; margin-bottom: 20px; height: 320px; }
          .sur-canvas-wrap canvas { max-width: 100%; max-height: 100%; }
          
          .sur-sliders { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
          .sur-slider-group { background: #f8fafc; padding: 16px; border-radius: 14px; border: 1px solid #e2e8f0; }
          .sur-slider-group.full { grid-column: 1 / -1; }
          .sur-slider-group label { display: block; font-weight: 800; color: #334155; margin-bottom: 12px; }
          .sur-slider-group input { width: 100%; cursor: pointer; accent-color: #0984e3; }
          
          .sur-board { background: #2c3e50; border-radius: 16px; padding: 20px; color: #fff; text-align: center; }
          .sur-board-title { color: #1abc9c; font-weight: 900; margin-bottom: 15px; font-size: 1.1rem; }
          .sur-board-math { font-size: 1.3rem; margin-bottom: 15px; overflow-x: auto; padding: 10px; }
          .sur-board-result { background: rgba(255,255,255,0.1); padding: 15px; border-radius: 12px; font-size: 1.2rem; font-weight: 700; }
        </style>
        
        <div class="sur-container">
          <div class="sur-header">
            <h1>삼각측량 탐험대 🗺️</h1>
            <button class="sur-home-btn" onclick="window.SurveyConceptApp.goHome()">🏠 대시보드</button>
          </div>
          <div class="sur-msg">직접 갈 수 없는 곳의 거리를 알아내자!</div>
          
          <div class="sur-tabs">
            <button class="sur-tab-btn active" id="sur-tab-cos" onclick="window.SurveyConceptApp.switchMission('cos')">미션 A (코사인법칙)</button>
            <button class="sur-tab-btn" id="sur-tab-sin" onclick="window.SurveyConceptApp.switchMission('sin')">미션 B (사인법칙)</button>
          </div>
          
          <!-- 미션 A: 코사인 -->
          <div id="sur-mission-cos" class="sur-mission-content">
            <div class="sur-mission-scenario"><strong>📍 상황:</strong> 전망대에서 두 산봉우리 사이의 직선 거리를 구하려고 합니다.</div>
            <div class="sur-canvas-wrap"><canvas id="canvas-cos" width="600" height="300"></canvas></div>
            <div class="sur-sliders">
              <div class="sur-slider-group">
                <label>전망대➔A봉 거리 (b): <span id="val-cos-b">100</span>m</label>
                <input type="range" id="slider-cos-b" min="50" max="500" step="10" value="100" oninput="window.SurveyConceptApp.updateSurveyCos()">
              </div>
              <div class="sur-slider-group">
                <label>전망대➔B봉 거리 (c): <span id="val-cos-c">120</span>m</label>
                <input type="range" id="slider-cos-c" min="50" max="500" step="10" value="120" oninput="window.SurveyConceptApp.updateSurveyCos()">
              </div>
              <div class="sur-slider-group full">
                <label>두 봉우리 사이 사잇각 (A): <span id="val-cos-a">60</span>°</label>
                <input type="range" id="slider-cos-a" min="30" max="150" step="1" value="60" oninput="window.SurveyConceptApp.updateSurveyCos()">
              </div>
            </div>
            <div class="sur-board">
              <div class="sur-board-title">코사인법칙 적용</div>
              <div class="sur-board-math" id="formula-cos"></div>
              <div class="sur-board-result" id="result-cos"></div>
            </div>
          </div>
          
          <!-- 미션 B: 사인 -->
          <div id="sur-mission-sin" class="sur-mission-content hidden">
            <div class="sur-mission-scenario"><strong>📍 상황:</strong> 강 건너 랜드마크 거리를 두 관측소의 각도를 통해 구합니다.</div>
            <div class="sur-canvas-wrap"><canvas id="canvas-sin" width="600" height="300"></canvas></div>
            <div class="sur-sliders">
              <div class="sur-slider-group full">
                <label>두 관측소 사이 거리 (c): <span id="val-sin-c">50</span>m</label>
                <input type="range" id="slider-sin-c" min="10" max="200" step="5" value="50" oninput="window.SurveyConceptApp.updateSurveySin()">
              </div>
              <div class="sur-slider-group">
                <label>관측소 A 각도 (A): <span id="val-sin-a">45</span>°</label>
                <input type="range" id="slider-sin-a" min="20" max="120" step="1" value="45" oninput="window.SurveyConceptApp.updateSurveySin()">
              </div>
              <div class="sur-slider-group">
                <label>관측소 B 각도 (B): <span id="val-sin-b">60</span>°</label>
                <input type="range" id="slider-sin-b" min="20" max="120" step="1" value="60" oninput="window.SurveyConceptApp.updateSurveySin()">
              </div>
            </div>
            <div class="sur-board">
              <div class="sur-board-title">사인법칙 적용</div>
              <div class="sur-board-math" id="formula-sin"></div>
              <div class="sur-board-result" id="result-sin"></div>
            </div>
          </div>
          
        </div>
      `;

      setTimeout(() => this.switchMission('cos'), 50);
    }
  };

  window.SurveyConceptApp = SurveyConceptApp;

  function registerMyApp() {
    if (typeof window.MathLabGames !== 'undefined' && typeof window.MathLabGames.register === 'function') {
      window.MathLabGames.register({
        id: 'survey-concept',
        title: '삼각측량 탐험대',
        icon: '🗺️',
        appType: 'concept',
        topApp: '수학 개념',
        sourceType: 'new',
        mount(container) { SurveyConceptApp.mount(container); },
        reset() { SurveyConceptApp.switchMission('cos'); },
        destroy() { SurveyConceptApp.destroy(); },
        goHome() { SurveyConceptApp.goHome(); }
      });
    }
  }

  registerMyApp();
  window.addEventListener('DOMContentLoaded', registerMyApp);

  window.initSurveyApp = function() {
    if (window.LegacyBridge && typeof window.LegacyBridge.hideAllLegacySections === 'function') {
      window.LegacyBridge.hideAllLegacySections();
      window.LegacyBridge.showNewRoot();
    }
    if (typeof window.MathLabGames !== 'undefined' && typeof window.MathLabGames.mount === 'function') {
      try { window.MathLabGames.mount('survey-concept'); return; } catch(e){}
    }
    SurveyConceptApp.mount();
  };
})();
</script>
