<style>
  /* =========================================================
     MathLab Components CSS
     12단계 정리본
     - 새 홈 / 앱 목록 / 게임 목록 / 상단 내비 / footer 중심
     - 기존 게임 내부 UI는 최대한 침범하지 않음
  ========================================================= */

  /* ---------- App Shell ---------- */

  .mathlab-root {
    width: 100%;
    min-height: 100vh;
  }

  .mathlab-header {
    width: 100%;
    max-width: 1480px;
    margin: 0 auto;
    padding: 20px 32px 0;
    text-align: left;
  }

  #mathlab-logo.mathlab-logo {
    display: inline-block;
    border: 0;
    padding: 0;
    background: transparent;
    color: #3f2f24;
    box-shadow: none;
    font-size: 1.35rem;
    font-weight: 900;
    line-height: 1.2;
    cursor: default;
  }

  .mathlab-view,
  #mathlab-view {
    width: 100% !important;
    max-width: 1480px !important;
    margin: 0 auto !important;
    padding: 32px 32px 56px !important;
  }

  #mathlab-view > section {
    width: 100% !important;
    max-width: none !important;
    margin-left: auto !important;
    margin-right: auto !important;
  }

  /* ---------- Page Title ---------- */

  #mathlab-view h1 {
    margin: 0 0 12px;
    color: #3f2f24;
    font-size: clamp(1.8rem, 3vw, 3rem);
    line-height: 1.15;
    font-weight: 900;
  }

  #mathlab-view section > p {
    margin: 0 0 28px;
    color: #9a8f7f;
    font-size: 1rem;
  }

  /* ---------- Card Grid 핵심 ---------- */

  #home-app-cards,
  #mathlab-view .app-card-grid {
    width: 100% !important;
    max-width: none !important;

    display: grid !important;
    grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)) !important;
    gap: 22px !important;

    align-items: stretch !important;
    justify-content: stretch !important;

    margin: 0 !important;
    padding: 0 !important;
  }

  /* 홈 4대 앱은 PC에서 4열 고정 */
  #home-app-cards {
    grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)) !important;
  }

  /* 게임/개념/응용/튜터 목록도 기본 4열 */
  #mathlab-view .app-card-grid {
    grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)) !important;
  }

  /* 대형 화면은 5열 */
  @media (min-width: 1500px) {
    #mathlab-view {
      max-width: 1680px !important;
      padding-left: 40px !important;
      padding-right: 40px !important;
    }

    #mathlab-view .app-card-grid {
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)) !important;
      gap: 26px !important;
    }

    #home-app-cards {
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)) !important;
    }
  }

  /* 노트북/태블릿 */
  @media (max-width: 1100px) {
    #home-app-cards,
    #mathlab-view .app-card-grid {
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)) !important;
    }
  }

  @media (max-width: 820px) {
    #home-app-cards,
    #mathlab-view .app-card-grid {
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)) !important;
    }
  }

  /* 모바일 */
  @media (max-width: 560px) {
    .mathlab-header {
      padding: 16px 14px 0;
    }

    #mathlab-logo.mathlab-logo {
      font-size: 1.15rem;
    }

    #mathlab-view {
      max-width: 100% !important;
      padding: 24px 14px 40px !important;
    }

    #home-app-cards,
    #mathlab-view .app-card-grid {
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)) !important;
      gap: 14px !important;
    }
  }

  /* ---------- Cards ---------- */

  #home-app-cards .app-card,
  #mathlab-view .app-card-grid .app-card {
    width: 100% !important;
    max-width: none !important;
    min-width: 0 !important;
    min-height: 110px !important;

    display: flex !important;
    flex-direction: column !important;
    align-items: center !important;
    justify-content: center !important;

    padding: 18px 10px !important;
    border: 1px solid rgba(148, 163, 184, 0.35);
    border-radius: 20px;

    background: linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(248, 250, 252, 0.98));
    color: #243447;

    text-align: center !important;
    cursor: pointer;

    box-shadow: 0 10px 20px rgba(15, 23, 42, 0.04);

    transition:
      transform 0.16s ease,
      box-shadow 0.16s ease,
      border-color 0.16s ease;
  }

  #home-app-cards .app-card:hover,
  #mathlab-view .app-card-grid .app-card:hover {
    transform: translateY(-4px);
    border-color: rgba(37, 99, 235, 0.35);
    box-shadow: 0 22px 48px rgba(15, 23, 42, 0.13);
  }

  .app-card-icon {
    margin-bottom: 8px;
    font-size: 2.2rem;
    line-height: 1.1;
  }

  .app-card-title {
    color: #1f2937;
    font-size: 1rem;
    font-weight: 800;
    line-height: 1.2;
    margin: 0;
  }

  /* ---------- Legacy Back Buttons ---------- */

  #legacy-back-home.legacy-back-home {
    position: static !important;
    width: 100% !important;
    max-width: 1480px !important;

    margin: 0 auto 20px !important;
    padding: 0 32px !important;

    display: flex !important;
    gap: 8px !important;
    align-items: center !important;
    justify-content: flex-start !important;

    background: transparent !important;
    border: 0 !important;
    box-shadow: none !important;
    transform: none !important;
    z-index: auto !important;
  }

  #legacy-back-list-btn,
  #legacy-back-home-btn {
    appearance: none !important;

    border: 1px solid rgba(148, 163, 184, 0.45) !important;
    border-radius: 999px !important;

    padding: 10px 15px !important;
    min-height: 38px !important;

    background: rgba(255, 255, 255, 0.94) !important;
    color: #1f2937 !important;

    font-size: 0.92rem !important;
    font-weight: 800 !important;
    line-height: 1 !important;

    cursor: pointer !important;
    box-shadow: 0 8px 20px rgba(15, 23, 42, 0.1) !important;

    transition:
      transform 0.16s ease,
      box-shadow 0.16s ease,
      background 0.16s ease;
  }

  #legacy-back-list-btn:hover,
  #legacy-back-home-btn:hover {
    background: #ffffff !important;
    transform: translateY(-1px) !important;
    box-shadow: 0 12px 26px rgba(15, 23, 42, 0.15) !important;
  }

  @media (max-width: 560px) {
    #legacy-back-home.legacy-back-home {
      padding: 0 14px !important;
      flex-wrap: wrap !important;
    }

    #legacy-back-list-btn,
    #legacy-back-home-btn {
      padding: 9px 12px !important;
      font-size: 0.86rem !important;
    }
  }

  /* ---------- Floating Home Button ---------- */

  #mathlab-floating-home {
    position: fixed !important;
    right: 24px !important;
    bottom: 24px !important;
    top: auto !important;
    left: auto !important;

    z-index: 10000 !important;

    border: 0 !important;
    border-radius: 999px !important;
    padding: 13px 18px !important;

    background: rgba(15, 23, 42, 0.92) !important;
    color: #ffffff !important;

    font-weight: 800 !important;
    cursor: pointer !important;

    box-shadow: 0 14px 36px rgba(15, 23, 42, 0.24) !important;

    transition:
      transform 0.16s ease,
      box-shadow 0.16s ease,
      background 0.16s ease;
  }

  #mathlab-floating-home:hover {
    transform: translateY(-2px) !important;
    background: rgba(30, 41, 59, 0.96) !important;
    box-shadow: 0 18px 42px rgba(15, 23, 42, 0.32) !important;
  }

  @media (max-width: 560px) {
    #mathlab-floating-home {
      right: 16px !important;
      bottom: 16px !important;
      padding: 12px 15px !important;
      font-size: 0.9rem !important;
    }
  }

  /* ---------- Settings App Buttons ---------- */

  #settings-app .btn,
  #settings-app .save-btn,
  #settings-app .home-btn {
    appearance: none;
    border: 0;
    border-radius: 999px;
    padding: 13px 20px;
    font-weight: 800;
    font-size: 0.96rem;
    cursor: pointer;

    transition:
      transform 0.16s ease,
      box-shadow 0.16s ease,
      filter 0.16s ease;
  }

  #settings-app .save-btn {
    width: 100%;
    background: linear-gradient(135deg, #16a34a, #22c55e);
    color: #ffffff;
    box-shadow: 0 12px 28px rgba(22, 163, 74, 0.22);
  }

  #settings-app .save-btn:hover {
    transform: translateY(-2px);
    filter: brightness(1.04);
    box-shadow: 0 16px 36px rgba(22, 163, 74, 0.28);
  }

  #settings-app .home-btn {
    background: #f1f5f9;
    color: #334155;
    box-shadow: 0 8px 18px rgba(15, 23, 42, 0.08);
  }

  #settings-app .home-btn:hover {
    transform: translateY(-2px);
    background: #e2e8f0;
  }

  #settings-app input:focus {
    outline: none;
    border-color: rgba(37, 99, 235, 0.65) !important;
    box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
    background: #ffffff;
  }

  /* ---------- Toast ---------- */

  #mathlab-toast {
    position: fixed;
    left: 50%;
    bottom: 32px;
    transform: translateX(-50%);
    z-index: 99999;

    max-width: 90vw;
    padding: 14px 18px;
    border-radius: 999px;

    font-size: 0.95rem;
    font-weight: 700;

    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
  }

  /* ---------- Footer ---------- */

  .mathlab-footer {
    width: 100%;
    max-width: 1480px;
    margin: 48px auto 24px;
    padding: 24px 32px;
    text-align: center;
    color: #9a8f7f;
  }

  .mathlab-footer p {
    margin: 0 0 12px;
    text-align: center;
  }

  .mathlab-footer a {
    display: inline-block;
    color: #2563eb;
    text-align: center;
  }

</style>
