  setupWave: function() {
    S.t = 0;
    S.path = [];
    S.predictDone = false;

    if (S.diff === 'easy') {
      S.b = 2; S.N0 = 6; S.bombs = 7; S.limit = 500;
    } else if (S.diff === 'hard') {
      S.b = 2.5; S.N0 = 10; S.bombs = 3; S.limit = 600;
    } else {
      S.b = 2; S.N0 = 8; S.bombs = 5; S.limit = 700;
    }
    S.N = S.N0;
    S.path.push({ t: 0, n: S.N });

    var root = S.host.querySelector('#ez-app-root');
    if (root) {
      root.querySelector('#lbl-wave-num').textContent = S.wave;
      root.querySelector('#lbl-score-num').textContent = S.score;
      root.querySelector('#lbl-bomb-num').textContent = S.bombs;
      root.querySelector('#lbl-stat-N').textContent = Math.floor(S.N);
      root.querySelector('#lbl-stat-b').textContent = S.b;
      root.querySelector('#lbl-stat-t').textContent = '0.0';
      root.querySelector('#lbl-game-msg').innerHTML = '웨이브 ' + S.wave + ': N(t) = ' + S.N0 + ' · ' + S.b + 'ᵗ  (방어선 한계: ' + S.limit + ')';
    }

    this.drawCanvas();
  },

  startWave: function() {
    var _this = this;
    S.running = true;
    if (S.raf) cancelAnimationFrame(S.raf);
    
    function loop() {
      if (!S.running) return;
      S.t += 0.05;
      S.N = S.N0 * Math.pow(S.b, S.t);
      if (S.N > 1e10) S.N = 1e10;

      S.path.push({ t: S.t, n: S.N });
      if (S.path.length > 400) S.path.shift();

      _this.updateHUD();
      _this.drawCanvas();

      if (S.N >= S.limit) {
        S.running = false;
        var root = S.host.querySelector('#ez-app-root');
        if (root) {
          root.querySelector('#lbl-game-msg').innerHTML = '💥 <b>방어선 붕괴!</b> 좀비 수가 방어선 한계(' + S.limit + ')를 초과했습니다.';
        }
        setTimeout(function() {
          if (S.wave >= WAVES) _this.finishGame();
          else { S.wave++; _this.setupWave(); }
        }, 1200);
        return;
      }

      S.raf = requestAnimationFrame(loop);
    }

    S.raf = requestAnimationFrame(loop);
  },

  useBomb: function() {
    if (!S.running || S.bombs <= 0) return;
    S.bombs--;

    var beforeN = S.N;
    var logBase = Math.max(S.b, 1.05);
    var afterN = Math.max(1, Math.log(Math.max(beforeN, logBase)) / Math.log(logBase));
    if (afterN >= beforeN) afterN = Math.max(1, beforeN * 0.35);

    S.N = afterN;
    S.N0 = S.N / Math.pow(S.b, Math.max(S.t, 0.01));
    S.path.push({ t: S.t, n: S.N });

    S.score += 10;
    this.updateHUD();
    this.drawCanvas();

    var root = S.host.querySelector('#ez-app-root');
    if (root) {
      root.querySelector('#lbl-game-msg').innerHTML = '💣 <b>로그 폭탄 투하!</b> N: ' + Math.floor(beforeN) + ' → ' + Math.floor(S.N) + ' (로그 수식 감쇄 성취)';
    }

    if (S.N < S.limit * 0.15 && S.t > 1.5) {
      S.running = false;
      S.score += 30;
      setTimeout(function() {
        if (S.wave >= WAVES) ExponentialZombiesApp.finishGame();
        else { S.wave++; ExponentialZombiesApp.setupWave(); }
      }, 1000);
    }
  },

  submitPrediction: function() {
    var root = S.host.querySelector('#ez-app-root');
    var val = parseFloat((root.querySelector('#inp-predict-t').value || '').trim());
    if (isNaN(val)) return;

    var targetN = 1000;
    var exactT = Math.log(targetN / S.N0) / Math.log(S.b);

    if (Math.abs(val - exactT) <= 1.0) {
      S.score += 20;
      root.querySelector('#lbl-game-msg').innerHTML = '🎯 <b>예측 성공!</b> 정확한 도갈 시간 t ≈ ' + exactT.toFixed(2) + ' 초입니다! (+20점)';
    } else {
      root.querySelector('#lbl-game-msg').innerHTML = '❌ <b>예측 실패!</b> 계산된 정답 t ≈ ' + exactT.toFixed(2) + ' 초입니다.';
    }
    this.updateHUD();
  },

  updateHUD: function() {
    var root = S.host.querySelector('#ez-app-root');
    if (!root) return;

    root.querySelector('#lbl-score-num').textContent = S.score;
    root.querySelector('#lbl-bomb-num').textContent = S.bombs;
    root.querySelector('#lbl-stat-N').textContent = Math.floor(S.N);
    root.querySelector('#lbl-stat-t').textContent = S.t.toFixed(1);
  },

  drawCanvas: function() {
    var root = S.host.querySelector('#ez-app-root');
    if (!root) return;
    var cv = root.querySelector('#ez-cv');
    if (!cv) return;
    var ctx = cv.getContext('2d');

    ctx.clearRect(0, 0, CW, CH);
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(0, 0, CW, CH);

    var pad = 40;
    ctx.strokeStyle = '#334155';
    ctx.beginPath();
    ctx.moveTo(pad, CH - pad);
    ctx.lineTo(CW - pad, CH - pad);
    ctx.moveTo(pad, pad);
    ctx.lineTo(pad, CH - pad);
    ctx.stroke();

    var maxT = Math.max(8, S.t + 2);
    var maxN = Math.max(S.limit * 1.1, S.N * 1.2, 20);

    function mapX(tVal) { return pad + (tVal / maxT) * (CW - pad * 2); }
    function mapY(nVal) { return CH - pad - (Math.min(nVal, maxN) / maxN) * (CH - pad * 2); }

    // Defense limit line
    ctx.strokeStyle = '#ef4444';
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.moveTo(pad, mapY(S.limit));
    ctx.lineTo(CW - pad, mapY(S.limit));
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.fillStyle = '#ef4444';
    ctx.font = 'bold 12px Pretendard';
    ctx.fillText('방어선 한계 N = ' + S.limit, pad + 10, mapY(S.limit) - 6);

    // Exponential Curve Plot
    ctx.strokeStyle = '#38bdf8';
    ctx.lineWidth = 3;
    ctx.beginPath();
    for (var i = 0; i < S.path.length; i++) {
      var pt = S.path[i];
      var px = mapX(pt.t);
      var py = mapY(pt.n);
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.stroke();

    // Zombie Icon Visuals
    var zCount = Math.min(30, Math.floor(Math.log10(Math.max(1, S.N)) * 10) + 2);
    ctx.font = '20px serif';
    for (var k = 0; k < zCount; k++) {
      ctx.globalAlpha = 0.6 + 0.4 * Math.random();
      ctx.fillText('🧟', pad + 15 + (k % 8) * 50, CH - pad - 24 - Math.floor(k / 8) * 26);
    }
    ctx.globalAlpha = 1.0;
  },

    S.finished = true;

    if (S.raf) cancelAnimationFrame(S.raf);
    var root = S.host.querySelector('#ez-app-root');

    this.openRank(true);

    S.finished = false;
    S.running = false;
    if (S.raf) cancelAnimationFrame(S.raf);
    S.wave = 1;
    S.score = 0;
    this.setupWave();
  },

  renderSlideGuide: function() {
    var _this = this;
    var root = S.host.querySelector('#ez-app-root');
    var mBox = root.querySelector('#ez-modal-box');
    if (!mBox) return;

    var pg = SLIDE_GUIDE[S.guidePage] || SLIDE_GUIDE[0];
    var dots = SLIDE_GUIDE.map(function(_, i) {
      return '<span class="dot' + (i === S.guidePage ? ' on' : '') + '"></span>';
    }).join('');
    var isLast = S.guidePage >= SLIDE_GUIDE.length - 1;

    var h = '';
    h += '<div style="font-size:.8rem; font-weight:800; color:#dc2626; margin-bottom:4px;">온보딩 슬라이드 탐구 ' + (S.guidePage + 1) + ' / ' + SLIDE_GUIDE.length + '</div>';

    h += '<div class="dots">' + dots + '</div>';

    h += '<div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px;">';

    h += '  <button type="button" class="btn w" id="btn-slide-next">' + (isLast ? '디펜스 개시 🚀' : '다음 →') + '</button>';
    h += '</div>';

    mBox.innerHTML = h;
    updateMathElements();

    var prevBtn = mBox.querySelector('#btn-slide-prev');
    var nextBtn = mBox.querySelector('#btn-slide-next');

    if (prevBtn) {
      prevBtn.onclick = function() {
        if (S.guidePage > 0) {
          S.guidePage--;
          _this.renderSlideGuide();
        }
      };
    }
    if (nextBtn) {
      nextBtn.onclick = function() {
        if (isLast) {
          root.querySelector('#ez-modal').classList.remove('on');
        } else {
          S.guidePage++;
          _this.renderSlideGuide();
        }
      };
    }
  },

function goHome() {
  if (S.host) S.host.innerHTML = '';
  if (typeof window.LegacyBridge !== 'undefined' && typeof window.LegacyBridge.backHome === 'function') {
    window.LegacyBridge.backHome();
  } else if (typeof window.MathLabGames !== 'undefined' && window.MathLabGames.goHome) {
    window.MathLabGames.goHome();
  } else {
    window.location.reload();
  }
}

function reg() {
  if (typeof window.MathLabGames === 'undefined' || typeof window.MathLabGames.register !== 'function') return;
  try {
    if (window.MathLabGames.get && window.MathLabGames.get(APP_ID)) return;
    window.MathLabGames.register({
      id: APP_ID,
      title: APP_TITLE,
      icon: ICON,
      sourceType: 'new',
      players: '1인',
      isMultiplayer: false,
      mount: function(c, x) { ExponentialZombiesApp.mount(c, x); },
      reset: function() { ExponentialZombiesApp.resetGame(); },
      destroy: function() { ExponentialZombiesApp.destroy(); },
      goHome: function() { goHome(); }
    });
  } catch (e) {
    console.warn(APP_ID + ' reg', e);
  }
}
