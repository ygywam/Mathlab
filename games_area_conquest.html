<!-- 넓이 땅따먹기 (Area Conquest) 스마트 툴 잠금(Lock) & AI 대전 & 명예의 전당 완결판 -->
<style>
  .game-area-conquest {
    width: 100%;
    min-height: 100%;
    padding: 20px 10px;
    box-sizing: border-box;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);

    display: flex;
    flex-direction: column;
    align-items: center;
    user-select: none;
  }

  .game-area-conquest * { box-sizing: border-box; }

  /* 상단 헤더 */
  .game-area-conquest .ac-header {
    width: 100%; max-width: 760px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; background: #1e293b !important; padding: 16px 22px; border-radius: 20px; border: 2px solid #10b981 !important; box-shadow: 0 10px 25px rgba(0,0,0,0.5) !important;
  }
  .game-area-conquest .ac-title h1 {
    margin: 0 !important; font-size: 1.6rem !important; font-weight: 900 !important; color: #ffffff !important; display: flex; align-items: center; gap: 10px; text-shadow: 0 2px 8px rgba(255,255,255,0.4);
  }
  .game-area-conquest .ac-diff-badge {
    background: #10b981; color: white; padding: 4px 14px; border-radius: 999px; font-size: 0.88rem; font-weight: 800; margin-top: 5px; display: inline-block;
  }
  .game-area-conquest .btn-manual {
    background: #10b981; color: #0f172a; font-weight: 800; padding: 10px 16px; border-radius: 12px; border: none; cursor: pointer; font-size: 0.95rem; box-shadow: 0 4px 8px rgba(0,0,0,0.3); transition: all 0.15s;
  }
  .game-area-conquest .btn-manual:hover { background: #059669; color: white; }

  /* 모드 탭 (AI 대전 포함 5탭) */
  .game-area-conquest .ac-tabs {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; width: 100%; max-width: 760px; margin-bottom: 16px;
  }
  .game-area-conquest .tab-btn {
    padding: 12px 4px; border-radius: 14px; border: 2px solid #334155; background: #1e293b; color: #94a3b8; font-size: 0.9rem; font-weight: 800; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.25); text-align: center; display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .game-area-conquest .tab-btn span { font-size: 0.75rem; opacity: 0.85; font-weight: 600; }
  .game-area-conquest .tab-btn.active { border-color: #10b981; background: #059669; color: white; box-shadow: 0 6px 16px rgba(16,185,129,0.35); }
  .game-area-conquest .tab-btn.active span { opacity: 1; font-weight: 800; color: #fef08a; }

  /* 미션 정보 카드 */
  .game-area-conquest .ac-mission-card {
    width: 100%; max-width: 760px; background: #1e293b; border-radius: 18px; padding: 16px 20px; border: 2px solid #334155; box-shadow: 0 6px 18px rgba(0,0,0,0.3); margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;
  }
  .game-area-conquest .mission-target {
    display: flex; align-items: center; gap: 14px;
  }
  .game-area-conquest .target-box {
    background: #0f172a; border: 2px solid #fbbf24; padding: 10px 18px; border-radius: 14px; text-align: center;
  }
  .game-area-conquest .target-box .target-label { font-size: 0.85rem; color: #fbbf24; font-weight: 800; }
  .game-area-conquest .target-box .target-val { font-size: 1.8rem; font-weight: 900; color: white; line-height: 1.1; }
  
  .game-area-conquest .condition-badge {
    background: #3b82f6; color: white; padding: 8px 14px; border-radius: 12px; font-weight: 800; font-size: 0.95rem; display: flex; align-items: center; gap: 6px;
  }
  .game-area-conquest .ac-stats {
    display: flex; gap: 16px; font-weight: 800; font-size: 1.05rem;
  }
  .game-area-conquest .ac-stats div { display: flex; flex-direction: column; align-items: flex-end; }
  .game-area-conquest .ac-stats span { font-size: 0.82rem; color: #94a3b8; }
  .game-area-conquest .ac-stats strong { font-size: 1.3rem; color: #fbbf24; }

  /* 2인 및 AI 대전 플레이어 현황 바 */
  .game-area-conquest .ac-vs-bar {
    width: 100%; max-width: 760px; display: flex; gap: 12px; margin-bottom: 16px;
  }
  .game-area-conquest .vs-player {
    flex: 1; padding: 14px; border-radius: 16px; border: 2px solid #334155; background: #1e293b; display: flex; justify-content: space-between; align-items: center; font-weight: 800; transition: all 0.2s;
  }
  .game-area-conquest .vs-player.p1 { border-color: #3b82f6; }
  .game-area-conquest .vs-player.p2 { border-color: #f97316; }
  .game-area-conquest .vs-player.turn-active { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.4); }
  .game-area-conquest .vs-player.p1.turn-active { background: rgba(59, 130, 246, 0.2); border-width: 3px; }
  .game-area-conquest .vs-player.p2.turn-active { background: rgba(249, 115, 22, 0.2); border-width: 3px; }

  /* 🌟 그리기 도형 툴 선택 바 (스마트 잠금 스타일 포함) */
  .game-area-conquest .ac-tools {
    display: flex; gap: 10px; width: 100%; max-width: 760px; margin-bottom: 16px; flex-wrap: wrap;
  }
  .game-area-conquest .tool-btn {
    flex: 1 1 calc(33.333% - 10px); min-width: 180px; padding: 12px 14px; border-radius: 14px; border: 2px solid #334155; background: #1e293b; color: #cbd5e1; font-weight: 800; font-size: 0.95rem; cursor: pointer; transition: all 0.15s; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  }
  .game-area-conquest .tool-btn:hover:not(:disabled) { border-color: #10b981; }
  .game-area-conquest .tool-btn.tool-active { border-color: #fbbf24; background: #b45309; color: white; font-weight: 900; box-shadow: 0 4px 12px rgba(251, 191, 36, 0.3); }
  .game-area-conquest .tool-btn:disabled {
    opacity: 0.42 !important; border-color: #334155 !important; background: #0f172a !important; color: #64748b !important; cursor: not-allowed !important; pointer-events: none !important;
  }

  /* 메인 보드 (SVG 격자판) */
  .game-area-conquest .ac-board-panel {
    width: 100%; max-width: 760px; background: #0f172a; padding: 20px; border-radius: 24px; border: 2px solid #334155; box-shadow: 0 15px 35px rgba(0,0,0,0.5); display: flex; flex-direction: column; align-items: center; margin-bottom: 20px; position: relative;
  }
  .game-area-conquest .svg-board-wrapper {
    width: 100%; max-width: 540px; aspect-ratio: 1 / 1; position: relative; background: #1e293b; border-radius: 16px; border: 3px solid #475569; overflow: hidden; box-shadow: inset 0 0 20px rgba(0,0,0,0.6); touch-action: none; cursor: crosshair;
  }
  .game-area-conquest svg.grid-svg { width: 100%; height: 100%; display: block; }

  /* 실시간 드로잉 상태 바 */
  .game-area-conquest .ac-draw-status {
    width: 100%; margin-top: 14px; padding: 12px 18px; border-radius: 14px; background: #1e293b; border: 1px solid #475569; display: flex; justify-content: space-between; align-items: center; font-weight: 800; font-size: 0.98rem; flex-wrap: wrap; gap: 10px;
  }
  .game-area-conquest .draw-info { display: flex; align-items: center; gap: 8px; color: #cbd5e1; }
  .game-area-conquest .draw-info strong { color: #38bdf8; font-size: 1.15rem; }

  /* 조작 및 홈 컨트롤 (패스/턴넘기기 버튼 포함) */
  .game-area-conquest .ac-actions {
    display: flex; gap: 10px; width: 100%; max-width: 760px; margin-bottom: 24px; flex-wrap: wrap;
  }
  .game-area-conquest .btn-action {
    flex: 1 1 calc(25% - 10px); min-width: 150px; padding: 14px 10px; border-radius: 14px; border: none; font-weight: 800; font-size: 0.95rem; cursor: pointer; box-shadow: 0 4px 8px rgba(0,0,0,0.3); transition: transform 0.1s, background 0.2s; color: white;
  }
  .game-area-conquest .btn-action:active { transform: scale(0.96); }
  .game-area-conquest .btn-clear-points { background: #64748b; }
  .game-area-conquest .btn-clear-points:hover { background: #475569; }
  .game-area-conquest .btn-submit-shape { background: #10b981; }
  .game-area-conquest .btn-submit-shape:hover { background: #059669; }
  .game-area-conquest .btn-pass-turn { background: #f59e0b; color: #0f172a; }
  .game-area-conquest .btn-pass-turn:hover { background: #d97706; color: white; }
  .game-area-conquest .btn-home { background: #3b82f6; }
  .game-area-conquest .btn-home:hover { background: #2563eb; }

  /* 명예의 전당 */
  .game-area-conquest .ac-leaderboard-card {
    width: 100%; max-width: 760px; background: #1e293b; padding: 20px; border-radius: 16px; margin-bottom: 20px; border: 1px solid #334155;
  }
  .game-area-conquest .ac-leaderboard-card h3 { margin: 0 0 12px 0; font-size: 1.15rem; color: #f8fafc; text-align: center; }
  .game-area-conquest .rank-item {
    display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 8px 14px; border-radius: 8px; margin-bottom: 6px; font-size: 0.95rem; font-weight: 600;
  }
  .game-area-conquest .rank-num { color: #fbbf24; font-weight: 900; margin-right: 8px; }
  .game-area-conquest .rank-score { color: #10b981; font-weight: 800; }

  /* 모달 & 오버레이 */
  .game-area-conquest .ac-modal-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.88); display: none; justify-content: center; align-items: center; z-index: 50; padding: 20px;
  }
  .game-area-conquest .ac-modal {
    background: #1e293b !important; border: 2px solid #10b981 !important; border-radius: 20px; max-width: 600px; width: 100%; padding: 28px; color: #f8fafc !important; box-shadow: 0 20px 35px rgba(0,0,0,0.6); max-height: 85vh; overflow-y: auto; text-align: left;
  }
  .game-area-conquest .ac-modal h3 { color: #10b981 !important; margin-top: 0; font-size: 1.45rem; border-bottom: 1px solid #334155; padding-bottom: 12px; font-weight: 900; }
  .game-area-conquest .ac-modal h4 { color: #fbbf24 !important; margin: 18px 0 8px 0; font-size: 1.15rem; font-weight: 800; }
  .game-area-conquest .ac-modal p { font-size: 0.98rem; line-height: 1.6; color: #e2e8f0; margin-bottom: 10px; }
  .game-area-conquest .btn-close-modal { background: #10b981; color: #0f172a; border: none; font-weight: 800; padding: 14px 20px; border-radius: 12px; cursor: pointer; margin-top: 22px; width: 100%; font-size: 1.05rem; }

  .game-area-conquest .ac-overlay {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.96); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 20; border-radius: 24px; backdrop-filter: blur(8px); text-align: center; padding: 24px; animation: acFadeIn 0.3s ease-out;
  }
  @keyframes acFadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
  .game-area-conquest .btn-primary { background: #10b981; color: white; padding: 14px 28px; border-radius: 12px; border: none; font-size: 1.1rem; font-weight: 800; cursor: pointer; margin-top: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
  .game-area-conquest .ac-rank-card { background: #1e293b; border: 1px solid #10b981; border-radius: 16px; padding: 18px; width: 100%; max-width: 360px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); margin: 15px 0; }

  @media (max-width: 600px) {
    .game-area-conquest .ac-tabs { grid-template-columns: repeat(2, 1fr); }
    .game-area-conquest .ac-mission-card { flex-direction: column; align-items: stretch; text-align: center; }
    .game-area-conquest .mission-target { justify-content: center; }
    .game-area-conquest .ac-stats { justify-content: space-around; }
    .game-area-conquest .tool-btn, .game-area-conquest .btn-action { flex: 1 1 100%; }
  }
</style>

<script>
(function() {
  // 🌟 [보안] XSS 방어용 HTML 특수기호 이스케이프 함수
  function escapeHTML(str) {
    if (!str) return '';
    return String(str).replace(/[&<>"']/g, function(match) {
      const escape = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
      return escape[match];
    });
  }

  const AreaConquest = {
    id: 'area-conquest',
    title: '넓이 땅따먹기',
    icon: '🟩',
    category: 'game',

    container: null,
    timers: [],
    
    showToast(msg, isError = false) {
      if (!this.container) return;
      let toast = this.container.querySelector('#ac-toast');
      if (!toast) {
        toast = document.createElement('div');
        toast.id = 'ac-toast';
        toast.style.cssText = 'position:absolute; top:20px; left:50%; transform:translateX(-50%); padding:12px 24px; border-radius:12px; font-weight:800; font-size:1rem; z-index:9999; box-shadow:0 10px 25px rgba(0,0,0,0.5); transition:all 0.3s; text-align:center; min-width:300px; pointer-events:none; opacity:0;';
        this.container.appendChild(toast);
      }
      toast.style.background = isError ? '#ef4444' : '#10b981';
      toast.style.color = isError ? '#ffffff' : '#0f172a';
      toast.textContent = msg;
      
      // trigger reflow
      void toast.offsetWidth;
      toast.style.opacity = '1';
      toast.style.top = '20px';
      
      if (this._toastTimer) clearTimeout(this._toastTimer);
      this._toastTimer = setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.top = '0px';
      }, 3000);
    },
    timerInterval: null,

    state: {
      mode: '쉬움',
      gridSize: 10,
      turn: 1,
      maxTurns: 10,
      score: 0,
      p1Score: 0,
      p2Score: 0,
      currentPlayer: 1,
      targetArea: 12,
      condition: '자유 도형',
      currentTool: 'rect',
      selectedPoints: [],
      capturedPolygons: [],
      startTime: 0,
      timeLeft: 600,
      isGameOver: false,
      isAiThinking: false
    },

    mount(container, context = {}) {
      let target = typeof container === 'string' ? document.querySelector(container) : container;
      if (!target || !(target instanceof HTMLElement)) {
        target = window.MathLabUtils?.getMountContainer ? window.MathLabUtils.getMountContainer(container) : document.getElementById('mathlab-view');
      }
      if (!target) target = document.getElementById('game-area-conquest-app') || document.getElementById('new-root') || document.getElementById('game-container');

      if (!target || target === document.body) {
        let host = document.getElementById('area-conquest-force-host');
        if (!host) {
          host = document.createElement('div'); host.id = 'area-conquest-force-host';
          host.style.cssText = 'width:100%; max-width:960px; margin:0 auto; padding:20px 10px; box-sizing:border-box; z-index:999; position:relative; background:#0f172a; border-radius:24px;';
          const footer = document.querySelector('footer, #footer, .app-footer, #legacy-footer, .mathlab-footer');
          if (footer && footer.parentNode) footer.parentNode.insertBefore(host, footer);
          else document.body.appendChild(host);
        }
        target = host;
      }

      if (target) target.style.display = '';
      this.container = target;

      const level = context?.level || '쉬움';
      this.initGame(level);
    },

    goHome() {
      if (typeof window.MathLabCleanup?.clearTimers === 'function') {
        window.MathLabCleanup.clearTimers(this.timers);
      }
      this.timers.forEach(clearTimeout);
      if (this.timerInterval) clearInterval(this.timerInterval);
      this.timers = [];
      this.timerInterval = null;

      const mathlabView = document.getElementById('mathlab-view');
      if (mathlabView) { mathlabView.style.display = 'none'; mathlabView.innerHTML = ''; }
      const hostView = document.getElementById('area-conquest-force-host');
      if (hostView) { hostView.style.display = 'none'; hostView.innerHTML = ''; }
      const legacyAppView = document.getElementById('game-area-conquest-app');
      if (legacyAppView) { legacyAppView.style.display = 'none'; legacyAppView.innerHTML = ''; }

      if (window.LegacyBridge && typeof window.LegacyBridge.backHome === 'function') {
        try { window.LegacyBridge.backHome(); return; } catch(e) {}
      }
      if (typeof window.renderLegacyDashboardHome === 'function') {
        try { window.renderLegacyDashboardHome(); return; } catch(e) {}
      }
      if (typeof window.MathLabRenderHome === 'function') {
        try { window.MathLabRenderHome(); return; } catch(e) {}
      }

      const mathlabRoot = document.getElementById('mathlab-root');
      const legacyRoot = document.getElementById('legacy-root');
      if (mathlabRoot) mathlabRoot.classList.add('hidden');
      if (legacyRoot) legacyRoot.classList.remove('hidden');

      const dashboard = document.getElementById('dashboard-screen');
      if (dashboard) { dashboard.classList.add('active'); dashboard.style.display = ''; }
      window.scrollTo({ top: 0, left: 0, behavior: 'smooth' });
    },

    switchMode(mode) {
      this.initGame(mode);
    },

    initGame(mode) {
      this.state.mode = mode;
      this.state.gridSize = mode === '쉬움' ? 10 : 12;
      this.state.turn = 1;
      this.state.maxTurns = (mode === '2인전' || mode === 'AI대전') ? 12 : 10;
      this.state.score = 0;
      this.state.p1Score = 0;
      this.state.p2Score = 0;
      this.state.currentPlayer = 1;
      this.state.currentTool = mode === '쉬움' ? 'rect' : 'tri';
      this.state.selectedPoints = [];
      this.state.capturedPolygons = [];
      this.state.isGameOver = false;
      this.state.isAiThinking = false;
      this.state.startTime = Date.now();
      this.state.timeLeft = mode === '도전' ? 480 : 0;

      this.generateMission();
      this.startTimer();
      this.render();
    },

    startTimer() {
      if (this.timerInterval) clearInterval(this.timerInterval);
      if (this.state.mode === '도전') {
        this.timerInterval = setInterval(() => {
          if (!document.querySelector('.game-area-conquest')) { this.destroy(); return; }
          if (this.state.isGameOver) return;
          this.state.timeLeft--;
          const timerEl = this.container.querySelector('#ac-timer-val');
          if (timerEl) {
            const m = Math.floor(this.state.timeLeft / 60);
            const s = this.state.timeLeft % 60;
            timerEl.textContent = `${m}:${s < 10 ? '0' : ''}${s}`;
          }
          if (this.state.timeLeft <= 0) this.gameOver(false);
        }, 1000);
      }
    },

    generateMission() {
      const mode = this.state.mode;
      const areasEasy = [6, 8, 9, 10, 12, 14, 16];
      const areasNormal = [6, 8, 9, 10, 12, 14, 15, 16, 18, 20];
      const pool = mode === '쉬움' ? areasEasy : areasNormal;

      const shuffled = [...pool].sort(() => Math.random() - 0.5);
      let foundValid = false;

      for (let area of shuffled) {
        let cond = mode === '쉬움' ? '직사각형만 허용' : '자유 도형';
        if (mode === '보통' || mode === '도전') {
          const conds = ['자유 도형', '삼각형만 허용', '직사각형만 허용', '정사각형 금지'];
          cond = conds[Math.floor(Math.random() * conds.length)];
        }
        let tool = cond === '삼각형만 허용' ? 'tri' : 'rect';

        if (this.checkFeasibility(area, cond, tool)) {
          this.state.targetArea = area;
          this.state.condition = cond;
          this.state.currentTool = tool;
          foundValid = true;
          break;
        }
      }

      this.state.selectedPoints = [];

      if (!foundValid && this.state.capturedPolygons.length > 0) {
        setTimeout(() => {
          if (!this.state.isGameOver) {
            this.showToast('🛑 남은 공간이 없어 게임이 종료됩니다!', true);
            this.gameOver(true);
          }
        }, 300);
      }
    },

    checkFeasibility(targetArea, condition, tool) {
      const gs = this.state.gridSize;
      if (tool === 'rect' || condition === '자유 도형' || condition === '직사각형만 허용' || condition === '정사각형 금지') {
        for (let w = 1; w <= gs; w++) {
          for (let h = 1; h <= gs; h++) {
            if (w * h === targetArea) {
              if (condition === '정사각형 금지' && w === h) continue;
              for (let x = 0; x <= gs - w; x += 1) {
                for (let y = 0; y <= gs - h; y += 1) {
                  const pts = [{x, y}, {x: x + w, y}, {x: x + w, y: y + h}, {x, y: y + h}];
                  if (!this.checkOverlap(pts)) return true;
                }
              }
            }
          }
        }
      }
      if (tool === 'tri' || condition === '자유 도형' || condition === '삼각형만 허용') {
        for (let b = 1; b <= gs; b++) {
          for (let h = 1; h <= gs; h++) {
            if (b * h === 2 * targetArea) {
              for (let x = 0; x <= gs - b; x += 2) {
                for (let y = 0; y <= gs - h; y += 2) {
                  const pts = [{x, y}, {x: x + b, y}, {x, y: y + h}];
                  if (!this.checkOverlap(pts)) return true;
                }
              }
            }
          }
        }
      }
      return false;
    },

    calculatePolygonArea(pts) {
      if (!pts || pts.length < 3) return 0;
      let sum = 0;
      for (let i = 0; i < pts.length; i++) {
        const p1 = pts[i];
        const p2 = pts[(i + 1) % pts.length];
        sum += (p1.x * p2.y - p2.x * p1.y);
      }
      return Math.abs(sum) / 2;
    },

    getEffectivePolygon(pts, tool) {
      if (!pts || pts.length === 0) return [];
      if (tool === 'rect') {
        if (pts.length < 2) return pts;
        const p1 = pts[0];
        const p2 = pts[1];
        const minX = Math.min(p1.x, p2.x);
        const maxX = Math.max(p1.x, p2.x);
        const minY = Math.min(p1.y, p2.y);
        const maxY = Math.max(p1.y, p2.y);
        return [{x: minX, y: minY}, {x: maxX, y: minY}, {x: maxX, y: maxY}, {x: minX, y: maxY}];
      }
      return pts;
    },

    checkOverlap(newPolygon) {
      if (newPolygon.length < 3) return false;
      const gs = this.state.gridSize;

      for (let pt of newPolygon) {
        if (pt.x < 0 || pt.x > gs || pt.y < 0 || pt.y > gs) return true;
      }

      let minX = gs, maxX = 0, minY = gs, maxY = 0;
      for (let pt of newPolygon) {
        minX = Math.min(minX, pt.x); maxX = Math.max(maxX, pt.x);
        minY = Math.min(minY, pt.y); maxY = Math.max(maxY, pt.y);
      }

      for (let x = minX; x <= maxX; x++) {
        for (let y = minY; y <= maxY; y++) {
          const samples = [
            {x: x + 0.3, y: y + 0.3}, {x: x + 0.7, y: y + 0.3},
            {x: x + 0.3, y: y + 0.7}, {x: x + 0.7, y: y + 0.7},
            {x: x + 0.5, y: y + 0.5}
          ];
          for (let s of samples) {
            if (this.isPointInPolygon(s, newPolygon)) {
              for (let cap of this.state.capturedPolygons) {
                if (this.isPointInPolygon(s, cap.points)) {
                  return true;
                }
              }
            }
          }
        }
      }
      return false;
    },

    isPointInPolygon(pt, polygon) {
      let inside = false;
      for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
        const xi = polygon[i].x, yi = polygon[i].y;
        const xj = polygon[j].x, yj = polygon[j].y;
        const intersect = ((yi > pt.y) !== (yj > pt.y)) &&
            (pt.x < (xj - xi) * (pt.y - yi) / (yj - yi) + xi);
        if (intersect) inside = !inside;
      }
      return inside;
    },

    render() {
      const mode = this.state.mode;
      const gs = this.state.gridSize;
      const tool = this.state.currentTool;
      const cond = this.state.condition;
      const effPoly = this.getEffectivePolygon(this.state.selectedPoints, tool);
      const curArea = effPoly.length >= 3 ? this.calculatePolygonArea(effPoly) : 0;

      let totalCapturedArea = 0;
      this.state.capturedPolygons.forEach(p => totalCapturedArea += p.area);
      const totalBoardArea = gs * gs;
      const capturePercent = Math.round((totalCapturedArea / totalBoardArea) * 100);

      const isVsOrAi = (mode === '2인전' || mode === 'AI대전');
      const isRectDisabled = (cond === '삼각형만 허용');
      const isTriDisabled = (mode === '쉬움' || cond === '직사각형만 허용');
      const isParaDisabled = (mode === '쉬움' || mode === '보통' || cond === '직사각형만 허용' || cond === '삼각형만 허용');

      // 🌟 innerHTML 내 백틱 에러 완벽 해결 (`🔒` -> [🔒 자물쇠])
      let html = `
        <div class="game-area-conquest">
          <div class="ac-header">
            <div class="ac-title">
              <h1>${this.icon} ${this.title}</h1>
              <span class="ac-diff-badge">${mode} 모드 (${gs}×${gs} 격자)</span>
            </div>
            <button class="btn-manual" id="ac-btn-manual">📖 규칙 및 팁</button>
          </div>

          <div class="ac-tabs">
            <button class="tab-btn ${mode === '쉬움' ? 'active' : ''}" id="ac-tab-easy">🟢 쉬움<span>10×10 (직사각형)</span></button>
            <button class="tab-btn ${mode === '보통' ? 'active' : ''}" id="ac-tab-normal">🔵 보통<span>12×12 (삼각형 포함)</span></button>
            <button class="tab-btn ${mode === '도전' ? 'active' : ''}" id="ac-tab-hard">🟣 도전<span>타임어택 + 조건</span></button>
            <button class="tab-btn ${mode === '2인전' ? 'active' : ''}" id="ac-tab-vs">🧑🤝🧑 2인전<span>P1 vs P2 턴제</span></button>
            <button class="tab-btn ${mode === 'AI대전' ? 'active' : ''}" id="ac-tab-ai">🤖 vs AI<span>P1 vs 인공지능</span></button>
          </div>

          ${isVsOrAi ? `
            <div class="ac-vs-bar">
              <div class="vs-player p1 ${this.state.currentPlayer === 1 ? 'turn-active' : ''}">
                <div>🟦 P1 (파랑) 점수: <strong>${this.state.p1Score}</strong>점</div>
                <span>${this.state.currentPlayer === 1 ? '👉 현재 턴!' : ''}</span>
              </div>
              <div class="vs-player p2 ${this.state.currentPlayer === 2 ? 'turn-active' : ''}">
                <div>${mode === 'AI대전' ? '🤖 AI 로봇 (주황)' : '🟧 P2 (주황)'}: <strong>${this.state.p2Score}</strong>점</div>
                <span>${this.state.currentPlayer === 2 ? (mode === 'AI대전' ? '🤖 생각 중...' : '👉 현재 턴!') : ''}</span>
              </div>
            </div>
          ` : ''}

          <div class="ac-mission-card">
            <div class="mission-target">
              <div class="target-box">
                <div class="target-label">🎯 목표 넓이</div>
                <div class="target-val">${this.state.targetArea}</div>
              </div>
              <div class="condition-badge">
                <span>📌 조건:</span>
                <strong style="color:#fef08a;">${cond}</strong>
              </div>
            </div>

            <div class="ac-stats">
              <div>
                <span>턴 진행</span>
                <strong>${this.state.turn} / ${this.state.maxTurns}턴</strong>
              </div>
              <div>
                <span>점유율</span>
                <strong>${capturePercent}%</strong>
              </div>
              ${mode === '도전' ? `
                <div>
                  <span>⏳ 남은 시간</span>
                  <strong id="ac-timer-val" style="color:#ef4444;">08:00</strong>
                </div>
              ` : `
                <div>
                  <span>🏆 내 점수</span>
                  <strong>${isVsOrAi ? Math.max(this.state.p1Score, this.state.p2Score) : this.state.score}점</strong>
                </div>
              `}
            </div>
          </div>

          <div class="ac-tools">
            <button class="tool-btn ${tool === 'rect' ? 'tool-active' : ''}" id="tool-rect" ${isRectDisabled ? 'disabled' : ''}>
              <div><span>📐 직사각형</span> <small style="opacity:0.8;">(대각 2점)</small></div>
              ${isRectDisabled ? '<span style="font-size:0.75rem; color:#f87171;">[🔒 조건 잠금]</span>' : ''}
            </button>
            <button class="tool-btn ${tool === 'tri' ? 'tool-active' : ''}" id="tool-tri" ${isTriDisabled ? 'disabled' : ''}>
              <div><span>🔺 삼각형</span> <small style="opacity:0.8;">(꼭짓점 3점)</small></div>
              ${isTriDisabled ? `<span style="font-size:0.75rem; color:#f87171;">[🔒 ${mode === '쉬움' ? '쉬움모드 잠금' : '조건 잠금'}]</span>` : ''}
            </button>
            <button class="tool-btn ${tool === 'para' ? 'tool-active' : ''}" id="tool-para" ${isParaDisabled ? 'disabled' : ''}>
              <div><span>▱ 평행/다각형</span> <small style="opacity:0.8;">(꼭짓점 4점)</small></div>
              ${isParaDisabled ? `<span style="font-size:0.75rem; color:#f87171;">[🔒 ${mode === '쉬움' || mode === '보통' ? '모드 잠금 (도전 전용)' : '조건 잠금'}]</span>` : ''}
            </button>
          </div>

          <div class="ac-board-panel">
            <div class="svg-board-wrapper" id="ac-svg-wrapper">
              <svg class="grid-svg" viewBox="0 0 ${gs} ${gs}">
                <rect x="0" y="0" width="${gs}" height="${gs}" fill="#1e293b"/>
                ${Array.from({length: gs + 1}, (_, i) => `
                  <line x1="${i}" y1="0" x2="${i}" y2="${gs}" stroke="#334155" stroke-width="0.04"/>
                  <line x1="0" y1="${i}" x2="${gs}" y2="${i}" stroke="#334155" stroke-width="0.04"/>
                `).join('')}

                ${this.state.capturedPolygons.map((cap, idx) => {
                  const ptsStr = cap.points.map(p => `${p.x},${p.y}`).join(' ');
                  return `
                    <polygon points="${ptsStr}" fill="${cap.color}" stroke="#ffffff" stroke-width="0.06" opacity="0.82"/>
                    <text x="${cap.points.reduce((a,b)=>a+b.x,0)/cap.points.length}" y="${cap.points.reduce((a,b)=>a+b.y,0)/cap.points.length}" font-size="0.45" font-weight="900" fill="white" text-anchor="middle" dominant-baseline="middle" filter="drop-shadow(0 0 0.1px rgba(0,0,0,0.9))">${cap.area}</text>
                  `;
                }).join('')}

                ${effPoly.length >= 3 ? `
                  <polygon points="${effPoly.map(p => `${p.x},${p.y}`).join(' ')}" fill="rgba(251, 191, 36, 0.35)" stroke="#fbbf24" stroke-width="0.08" stroke-dasharray="0.15 0.1"/>
                ` : ''}

                ${this.state.selectedPoints.map((pt, idx) => `
                  <circle cx="${pt.x}" cy="${pt.y}" r="0.16" fill="#facc15" stroke="#ffffff" stroke-width="0.04"/>
                  <text x="${pt.x}" y="${pt.y - 0.25}" font-size="0.32" font-weight="bold" fill="#facc15" text-anchor="middle">${idx + 1}</text>
                `).join('')}

                ${Array.from({length: (gs + 1) * (gs + 1)}, (_, idx) => {
                  const gx = idx % (gs + 1);
                  const gy = Math.floor(idx / (gs + 1));
                  return `<circle class="snap-point" data-x="${gx}" data-y="${gy}" cx="${gx}" cy="${gy}" r="0.35" fill="transparent" style="cursor:pointer;"/>`;
                }).join('')}
              </svg>
            </div>

            <div class="ac-draw-status">
              <div class="draw-info">
                <span>🎨 현재 선택: <strong>${this.state.selectedPoints.length}</strong> / ${tool === 'rect' ? '2점' : (tool === 'tri' ? '3점' : '4점')}</span>
              </div>
              <div class="draw-info">
                <span>📏 실시간 넓이: <strong style="color:${curArea === this.state.targetArea ? '#10b981' : '#facc15'}">${curArea}</strong> / 목표: ${this.state.targetArea}</span>
              </div>
            </div>
          </div>

          <div class="ac-actions">
            <button class="btn-action btn-clear-points" id="ac-btn-clear">⌫ 선택 초기화</button>
            <button class="btn-action btn-submit-shape" id="ac-btn-submit">✨ 땅 점령</button>
            <button class="btn-action btn-pass-turn" id="ac-btn-pass">🏳️ 그리기 불가 (패스/종료)</button>
            <button class="btn-action btn-home" id="ac-btn-home">🏠 홈으로</button>
          </div>

          <div class="ac-leaderboard-card">
            <h3>🏆 명예의 전당 (넓이 땅따먹기 TOP 기록)</h3>
            <div id="ac-leaderboard-container"><p style="color:#64748b; font-size:0.9rem; text-align:center;">로딩 중...</p></div>
          </div>

          <div class="ac-modal-overlay" id="ac-manual-modal">
            <div class="ac-modal">
              <h3>📖 넓이 땅따먹기 퍼즐 규칙</h3>
              <h4>1. 목표 넓이에 맞는 도형 그리기</h4>
              <p>• 격자 교차점을 선택하여 목표 넓이와 정확히 일치하는 직사각형, 삼각형을 그립니다.</p>
              <h4>2. 스마트 도구 잠금(Lock) 시스템</h4>
              <p>• <strong>쉬움 모드</strong>: 직사각형만 사용할 수 있으며, 삼각형/다각형은 자동으로 잠깁니다.</p>
              <p>• <strong>조건 제한 턴</strong>: 미션 카드 조건에 맞지 않는 도형 버튼은 턴 동안 [🔒 자물쇠]로 보호됩니다.</p>
              <button class="btn-close-modal" id="ac-close-manual">확인 (게임 시작)</button>
            </div>
          </div>
        </div>
      `;

      this.container.innerHTML = html;
      this.bindEvents();
      this.loadLeaderboard();
    },

    bindEvents() {
      this.container.querySelector('#ac-tab-easy')?.addEventListener('click', () => this.switchMode('쉬움'));
      this.container.querySelector('#ac-tab-normal')?.addEventListener('click', () => this.switchMode('보통'));
      this.container.querySelector('#ac-tab-hard')?.addEventListener('click', () => this.switchMode('도전'));
      this.container.querySelector('#ac-tab-vs')?.addEventListener('click', () => this.switchMode('2인전'));
      this.container.querySelector('#ac-tab-ai')?.addEventListener('click', () => this.switchMode('AI대전'));

      this.container.querySelector('#ac-btn-home')?.addEventListener('click', (e) => {
        e.preventDefault();
        this.goHome();
      });

      this.container.querySelector('#tool-rect')?.addEventListener('click', () => {
        this.state.currentTool = 'rect'; this.state.selectedPoints = []; this.render();
      });
      this.container.querySelector('#tool-tri')?.addEventListener('click', () => {
        this.state.currentTool = 'tri'; this.state.selectedPoints = []; this.render();
      });
      this.container.querySelector('#tool-para')?.addEventListener('click', () => {
        this.state.currentTool = 'para'; this.state.selectedPoints = []; this.render();
      });

      this.container.querySelector('#ac-btn-clear')?.addEventListener('click', () => {
        this.state.selectedPoints = []; this.render();
      });

      this.container.querySelector('#ac-btn-submit')?.addEventListener('click', () => this.submitShape());
      this.container.querySelector('#ac-btn-pass')?.addEventListener('click', () => this.passTurn());

      this.container.querySelector('#ac-btn-manual')?.addEventListener('click', () => {
        this.container.querySelector('#ac-manual-modal').style.display = 'flex';
      });
      this.container.querySelector('#ac-close-manual')?.addEventListener('click', () => {
        this.container.querySelector('#ac-manual-modal').style.display = 'none';
      });

      this.container.querySelectorAll('.snap-point').forEach(el => {
        el.addEventListener('click', (e) => {
          if (this.state.mode === 'AI대전' && this.state.currentPlayer === 2 && this.state.isAiThinking) return;
          const gx = parseInt(el.dataset.x);
          const gy = parseInt(el.dataset.y);
          this.handlePointClick(gx, gy);
        });
      });
    },

    handlePointClick(x, y) {
      if (this.state.isGameOver) return;
      const maxPts = this.state.currentTool === 'rect' ? 2 : (this.state.currentTool === 'tri' ? 3 : 4);

      const idx = this.state.selectedPoints.findIndex(p => p.x === x && p.y === y);
      if (idx !== -1) {
        this.state.selectedPoints.splice(idx, 1);
      } else {
        if (this.state.selectedPoints.length >= maxPts) {
          this.state.selectedPoints = [{x, y}];
        } else {
          this.state.selectedPoints.push({x, y});
        }
      }
      this.render();
    },

    passTurn() {
      if (this.state.isGameOver) return;
      if (this.state.mode === '2인전' || this.state.mode === 'AI대전') {
        this.showToast(`${this.state.currentPlayer === 1 ? 'P1' : 'P2'}이(가) 그릴 공간을 찾지 못해 턴을 패스합니다.`, true);
        this.advanceTurnOrSwitchPlayer();
      } else {
        this.showToast('게임을 조기 종료하고 정산합니다.', false);
        this.gameOver(true);
      }
    },

    submitShape() {
      if (this.state.isGameOver || (this.state.mode === 'AI대전' && this.state.currentPlayer === 2 && this.state.isAiThinking)) return;
      const tool = this.state.currentTool;
      const maxPts = tool === 'rect' ? 2 : (tool === 'tri' ? 3 : 4);
      if (this.state.selectedPoints.length < maxPts) {
        this.showToast(`⚠️ ${maxPts}개의 꼭짓점을 모두 선택해야 도형이 완성됩니다!`, true);
        return;
      }

      const effPoly = this.getEffectivePolygon(this.state.selectedPoints, tool);
      const area = this.calculatePolygonArea(effPoly);

      if (area !== this.state.targetArea) {
        this.showToast(`⚠️ 넓이 불일치! 그린 도형 넓이: [ ${area} ] / 목표: [ ${this.state.targetArea} ] (-3점)`, true);
        if (this.state.mode !== '2인전' && this.state.mode !== 'AI대전') this.state.score = Math.max(0, this.state.score - 3);
        this.render();
        return;
      }

      if (this.state.condition === '정사각형 금지' && tool === 'rect') {
        const dx = Math.abs(effPoly[1].x - effPoly[0].x);
        const dy = Math.abs(effPoly[3].y - effPoly[0].y);
        if (dx === dy) {
          this.showToast('⚠️ 조건 불만족: [정사각형 금지] 조건입니다!', true); return;
        }
      }
      if (this.state.condition === '삼각형만 허용' && tool !== 'tri') {
        this.showToast('⚠️ 조건 불만족: [삼각형만 허용] 조건입니다!', true); return;
      }
      if (this.state.condition === '직사각형만 허용' && tool !== 'rect') {
        this.showToast('⚠️ 조건 불만족: [직사각형만 허용] 조건입니다!', true); return;
      }

      if (this.checkOverlap(effPoly)) {
        this.showToast('⚠️ 겹침 발생! 이미 점령된 땅과 겹치거나 밖을 벗어납니다. (-3점)', true);
        if (this.state.mode !== '2인전' && this.state.mode !== 'AI대전') this.state.score = Math.max(0, this.state.score - 3);
        this.render();
        return;
      }

      const player = (this.state.mode === '2인전' || this.state.mode === 'AI대전') ? this.state.currentPlayer : 1;
      const color = player === 1 ? '#3b82f6' : '#f97316';
      this.state.capturedPolygons.push({
        points: effPoly, area: area, player: player, color: color
      });

      const baseGain = area * 10 + 15;
      if (this.state.mode === '2인전' || this.state.mode === 'AI대전') {
        if (player === 1) this.state.p1Score += baseGain;
        else this.state.p2Score += baseGain;
      } else {
        this.state.score += baseGain;
      }

      this.advanceTurnOrSwitchPlayer();
    },

    advanceTurnOrSwitchPlayer() {
      if (this.state.turn >= this.state.maxTurns) {
        this.gameOver(true);
      } else {
        if (this.state.mode === '2인전' || this.state.mode === 'AI대전') {
          this.state.currentPlayer = this.state.currentPlayer === 1 ? 2 : 1;
          this.state.turn++;
          this.generateMission();
          this.render();

          if (this.state.mode === 'AI대전' && this.state.currentPlayer === 2 && !this.state.isGameOver) {
            this.state.isAiThinking = true;
            this.render();
            setTimeout(() => {
              this.executeAiTurn();
            }, 1100);
          }
        } else {
          this.state.turn++;
          this.generateMission();
          this.render();
        }
      }
    },

    executeAiTurn() {
      if (!document.querySelector('.game-area-conquest') || this.state.isGameOver) return;
      const gs = this.state.gridSize;
      const targetArea = this.state.targetArea;
      const tool = this.state.currentTool;
      const cond = this.state.condition;

      let foundPts = null;

      if (tool === 'rect' || cond === '자유 도형' || cond === '직사각형만 허용' || cond === '정사각형 금지') {
        for (let w = 1; w <= gs; w++) {
          for (let h = 1; h <= gs; h++) {
            if (w * h === targetArea) {
              if (cond === '정사각형 금지' && w === h) continue;
              for (let x = 0; x <= gs - w; x++) {
                for (let y = 0; y <= gs - h; y++) {
                  const pts = [{x, y}, {x: x + w, y}, {x: x + w, y: y + h}, {x, y: y + h}];
                  if (!this.checkOverlap(pts)) {
                    foundPts = pts; break;
                  }
                }
                if (foundPts) break;
              }
            }
            if (foundPts) break;
          }
          if (foundPts) break;
        }
      }
      if (!foundPts && (tool === 'tri' || cond === '자유 도형' || cond === '삼각형만 허용')) {
        for (let b = 1; b <= gs; b++) {
          for (let h = 1; h <= gs; h++) {
            if (b * h === 2 * targetArea) {
              for (let x = 0; x <= gs - b; x += 2) {
                for (let y = 0; y <= gs - h; y += 2) {
                  const pts = [{x, y}, {x: x + b, y}, {x, y: y + h}];
                  if (!this.checkOverlap(pts)) {
                    foundPts = pts; break;
                  }
                }
                if (foundPts) break;
              }
            }
            if (foundPts) break;
          }
          if (foundPts) break;
        }
      }

      this.state.isAiThinking = false;

      if (foundPts) {
        this.state.capturedPolygons.push({
          points: foundPts, area: targetArea, player: 2, color: '#f97316'
        });
        const baseGain = targetArea * 10 + 15;
        this.state.p2Score += baseGain;
        this.showToast(`🤖 AI 로봇 점령 완료! (P1 파랑 차례)`, false);
      } else {
        this.showToast(`🤖 AI 로봇: 공간을 찾지 못해 패스합니다.`, true);
      }

      this.state.currentPlayer = 1;
      if (this.state.turn >= this.state.maxTurns) {
        this.gameOver(true);
      } else {
        this.state.turn++;
        this.generateMission();
        this.render();
      }
    },

    gameOver(isClear) {
      this.state.isGameOver = true;
      if (this.timerInterval) clearInterval(this.timerInterval);

      let finalScore = this.state.score;
      if (this.state.mode === '2인전' || this.state.mode === 'AI대전') {
        finalScore = Math.max(this.state.p1Score, this.state.p2Score);
      }

      const overlay = document.createElement('div');
      overlay.className = 'ac-overlay';
      const canSubmitRank = typeof window.submitRanking === 'function' && finalScore > 0 && this.state.mode !== '2인전';

      let resultTitle = '🎉 AREA CONQUEST CLEARED!';
      if (this.state.mode === '2인전' || this.state.mode === 'AI대전') {
        const p2Name = this.state.mode === 'AI대전' ? '🤖 AI 로봇' : 'P2 (주황)';
        if (this.state.p1Score > this.state.p2Score) resultTitle = '🏆 P1 (파랑) 승리!!';
        else if (this.state.p2Score > this.state.p1Score) resultTitle = `🏆 ${p2Name} 승리!!`;
        else resultTitle = '🤝 무승부 (명승부!)';
      } else if (!isClear) {
        resultTitle = '⏳ TIME OUT!';
      }

      overlay.innerHTML = `
        <h2 style="color:#fbbf24; font-size:2.3rem; margin:0 0 6px;">${resultTitle}</h2>
        <p style="font-size:1.1rem; color:#cbd5e1; margin:0 0 6px;">모드: <strong style="color:white;">${this.state.mode}</strong></p>
        ${(this.state.mode === '2인전' || this.state.mode === 'AI대전') ? `
          <p style="font-size:1.3rem; color:#3b82f6; font-weight:900; margin:4px 0;">P1 최종 점수: ${this.state.p1Score}점</p>
          <p style="font-size:1.3rem; color:#f97316; font-weight:900; margin:0 0 16px;">${this.state.mode === 'AI대전' ? '🤖 AI 로봇' : 'P2'} 최종 점수: ${this.state.p2Score}점</p>
        ` : `
          <p style="font-size:1.5rem; color:#10b981; font-weight:900; margin:0 0 16px;">최종 달성 점수: ${finalScore}점</p>
        `}

        ${canSubmitRank ? `
        <div class="ac-rank-card">
          <h3 style="margin:0 0 8px 0; color:#fbbf24; font-size:1.05rem; display:flex; align-items:center; justify-content:center; gap:6px;">
            <span>🏆</span> 명예의 전당 기록 등록
          </h3>
          <p style="font-size:0.85rem; color:#94a3b8; margin:0 0 12px 0;">멋진 넓이 전략이었습니다! 이름을 남겨주세요.</p>
          <div style="display:flex; gap:8px;">
            <input type="text" id="ac-nick-input" placeholder="학교/학년/반 닉네임" maxlength="15" style="flex:1; padding:10px; border-radius:8px; border:1px solid #475569; background:#0f172a; color:white; font-size:0.95rem; font-weight:bold; text-align:center; outline:none;">
            <button id="ac-submit-btn" style="background:#fbbf24; color:#0f172a; font-weight:800; border:none; padding:0 16px; border-radius:8px; cursor:pointer; font-size:0.95rem;">등록</button>
          </div>
          <div id="ac-rank-msg" style="font-size:0.85rem; color:#10b981; margin-top:8px; height:1.2em; font-weight:bold;"></div>
        </div>
        ` : ''}

        <div style="display:flex; gap:12px; justify-content:center; flex-wrap:wrap;">
          <button class="btn-primary" id="ac-restart-btn">🔄 새 게임 시작</button>
          <button class="btn-primary" id="ac-close-overlay-btn" style="background:#64748b;">✖ 창 닫기 (완성된 보드 보기)</button>
          <button class="btn-primary" id="ac-gameover-home-btn" style="background:#3b82f6;">🏠 홈으로</button>
        </div>
      `;

      this.container.querySelector('.ac-board-panel').appendChild(overlay);

      overlay.querySelector('#ac-restart-btn').addEventListener('click', () => {
        this.initGame(this.state.mode);
      });
      overlay.querySelector('#ac-close-overlay-btn')?.addEventListener('click', () => {
        overlay.remove();
      });
      overlay.querySelector('#ac-gameover-home-btn')?.addEventListener('click', () => this.goHome());

      if (canSubmitRank) {
        const inputEl = overlay.querySelector('#ac-nick-input');
        const submitBtn = overlay.querySelector('#ac-submit-btn');
        const msgEl = overlay.querySelector('#ac-rank-msg');

        const doSubmit = () => {
          const nick = inputEl.value.trim();
          if (!nick) { msgEl.textContent = '⚠️ 닉네임을 입력해주세요!'; msgEl.style.color = '#f87171'; inputEl.focus(); return; }
          submitBtn.disabled = true; inputEl.disabled = true; submitBtn.style.opacity = '0.5';
          msgEl.style.color = '#38bdf8'; msgEl.textContent = '⏳ 서버에 랭킹 등록 중...';

          window.submitRanking('넓이 땅따먹기', finalScore, true, nick, 'board-area-conquest');

          try {
            let ranks = JSON.parse(localStorage.getItem('rank_board-area-conquest') || '[]');
            ranks.push({ nickname: nick, score: finalScore, date: new Date().toLocaleDateString('ko-KR') });
            ranks.sort((a, b) => (b.score || 0) - (a.score || 0));
            localStorage.setItem('rank_board-area-conquest', JSON.stringify(ranks.slice(0, 50)));
          } catch(e) {}

          setTimeout(() => {
            msgEl.style.color = '#10b981'; msgEl.textContent = '✅ 등록 완료! 게임화면으로 돌아갑니다...';
            this.loadLeaderboard();
            setTimeout(() => {
              overlay.remove();
            }, 1200);
          }, 600);
        };

        submitBtn.addEventListener('click', doSubmit);
        inputEl.addEventListener('keypress', (e) => { if (e.key === 'Enter') doSubmit(); });
        setTimeout(() => inputEl.focus(), 100);
      }
    },

    destroy() {
      if (window.MathLabCleanup) window.MathLabCleanup.clearTimers(this.timers);
      this.timers.forEach(clearTimeout);
      if (this.timerInterval) clearInterval(this.timerInterval);
      const host = document.getElementById('area-conquest-force-host'); if (host) host.remove();
      if (this.container) this.container.innerHTML = '';
      this.container = null;
    },

    loadLeaderboard() {
      const container = this.container?.querySelector('#ac-leaderboard-container');
      if (!container) return;

      if (typeof window.loadGameLeaderboard === 'function') {
        window.loadGameLeaderboard('넓이 땅따먹기', false, 'ac-leaderboard-container');
      } else {
        try {
          let list = JSON.parse(localStorage.getItem('rank_board-area-conquest') || '[]');
          if (list.length === 0) {
            container.innerHTML = '<p style="color:#94a3b8; font-size:0.9rem; text-align:center;">아직 등록된 기록이 없습니다. 첫 승리의 주인공이 되어보세요!</p>';
          } else {
            container.innerHTML = list.slice(0, 5).map((item, idx) => `
              <div class="rank-item">
                <div><span class="rank-num">${idx === 0 ? '👑 1위' : `${idx + 1}위`}</span> ${escapeHTML(item.nickname)}</div>
                <div class="rank-score">${item.score}점 <small style="color:#64748b;">(${item.date || ''})</small></div>
              </div>
            `).join('');
          }
        } catch(e) {
          container.innerHTML = '<p style="color:#64748b; font-size:0.9rem; text-align:center;">로컬 기록 조회 완료</p>';
        }
      }
    }
  };

  /* ==========================================================================
     Gen-3 무결점 자율 로딩 및 4중 안전 등록 브리지
     ========================================================================== */
  function registerAreaConquest() {
    if (typeof window.MathLabGames !== 'undefined' && typeof window.MathLabGames.register === 'function') {
      if (!window.MathLabGames.get('area-conquest')) {
        try {
          window.MathLabGames.register({
            id: AreaConquest.id,
            title: AreaConquest.title,
            icon: AreaConquest.icon,
            sourceType: 'new',
            mount(container, context) { AreaConquest.mount(container, context); },
            reset() { AreaConquest.initGame(AreaConquest.state.mode); },
            destroy() { AreaConquest.destroy(); },
            goHome() { AreaConquest.goHome(); }
          });
        } catch (e) {
          console.warn('[AreaConquest] 안전 등록 방어:', e);
        }
      }
    }
  }

  registerAreaConquest();
  window.addEventListener('DOMContentLoaded', registerAreaConquest);
  window.addEventListener('load', registerAreaConquest);
  setTimeout(registerAreaConquest, 100);
  setTimeout(registerAreaConquest, 500);

  window.AreaConquest = AreaConquest;
  window.initAreaConquestGame = function() {
    registerAreaConquest();
    const target = document.getElementById('game-area-conquest-app') || document.getElementById('mathlab-view');
    AreaConquest.mount(target);
  };
  window.launchAreaConquestGame = function() {
    registerAreaConquest();
    if (typeof window.MathLabGames !== 'undefined' && typeof window.MathLabGames.mount === 'function') {
      try { window.MathLabGames.mount('area-conquest'); return; } catch(e) {}
    }
    AreaConquest.mount();
  };
})();
</script>
