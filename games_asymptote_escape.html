        sol: "<b>[수학적 변환]</b><br>• <span class=\"math-tex\" data-tex=\"y = \\frac{2(x-1) + 3}{x - 1} = \\frac{3}{x - 1} + 2\"></span><br>• 세로 점근선: <span class=\"math-tex\" data-tex=\"x = 1\"></span>, 가로 점근선: <span class=\"math-tex\" data-tex=\"y = 2\"></span><br>• 점근선의 교점 좌표: <b>(1, 2)</b>"
      },
      {
        title: "Q2. 유리함수 그래프가 지나는 사분면",
        q: "<span class=\"math-tex\" data-tex=\"y = \\frac{-4}{x + 2} + 1\"></span> 그래프가 지나지 않는 사분면은?",
        sol: "<b>[수학적 해설]</b><br>• 대칭 중심 (-2, 1), k = -4 이므로 2, 4사분면 방향 곡선<br>• y절편: <span class=\"math-tex\" data-tex=\"x=0 \\implies y = -4/2 + 1 = -1\"></span><br>• 그래프를 그리면 **제1사분면**을 지나지 않습니다."
      },
      {
        title: "Q3. 유리함수의 역함수 구하기",
        q: "<span class=\"math-tex\" data-tex=\"f(x) = \\frac{ax + b}{cx + d}\"></span> 의 역함수 공식 <span class=\"math-tex\" data-tex=\"f^{-1}(x)\"></span> 는?",
        sol: "<b>[역함수 공식]</b><br>• 대각선 a와 d의 위치를 바꾸고 부호를 반전합니다:<br>• <span class=\"math-tex\" data-tex=\"f^{-1}(x) = \\frac{-dx + b}{cx - a}\"></span>"
      },
      {
        title: "Q4. 실생활 광학 렌즈의 초점거리 공식",
        q: "렌즈 초점거리 <span class=\"math-tex\" data-tex=\"f\"></span>에 대해 물체 거리 <span class=\"math-tex\" data-tex=\"x\"></span>와 상의 거리 <span class=\"math-tex\" data-tex=\"y\"></span>의 관계식 <span class=\"math-tex\" data-tex=\"\\frac{1}{x} + \\frac{1}{y} = \\frac{1}{f}\"></span> 를 <span class=\"math-tex\" data-tex=\"y\"></span>에 대해 정리하면?",
        sol: "<b>[유리함수 수식 정리]</b><br>• <span class=\"math-tex\" data-tex=\"\\frac{1}{y} = \\frac{1}{f} - \\frac{1}{x} = \\frac{x - f}{fx} \\implies y = \\frac{fx}{x - f} = f + \\frac{f^2}{x - f}\"></span> (점근선 x = f, y = f)"
      }
    ];

    probs.forEach(function(item, idx) {
      h += '<div style="background:#ffffff; border:1px solid #e2e8f0; border-radius:14px; padding:16px; margin-bottom:14px;">';
      h += '  <div style="font-weight:900; font-size:1.05rem; color:#0284c7; margin-bottom:6px;">' + item.title + '</div>';
      h += '  <div style="line-height:1.6; color:#334155; margin-bottom:10px;">' + item.q + '</div>';
      h += '  <button type="button" class="btn p btn-show-sol" data-idx="' + idx + '">💡 수학적 해설 보기</button>';
      h += '  <div id="sol-' + idx + '" style="display:none; background:#f8fafc; border:1px solid #cbd5e1; border-radius:12px; padding:14px; margin-top:10px; font-size:0.92rem; line-height:1.65;">' + item.sol + '</div>';
      h += '</div>';
    });

    h += '  </div>';
    h += '  </div>';

    /* Slide Modal */
    h += '<div class="modal" id="ae-modal">';
    h += '  <div class="mbox" id="ae-modal-box"></div>';
    h += '</div>';

    h += '</div>';
    return h;
  },

  bindEvents: function() {
    var _this = this;
    var root = S.host.querySelector('#ae-app-root');

    /* Tabs */
    root.querySelectorAll('.tab-btn').forEach(function(btn) {
      btn.onclick = function() {
        root.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
        this.classList.add('active');
        S.activeTab = this.getAttribute('data-tab');

        root.querySelector('#tab-sec-sim').style.display = (S.activeTab === 'sim') ? 'block' : 'none';
        root.querySelector('#tab-sec-math').style.display = (S.activeTab === 'math') ? 'block' : 'none';
        root.querySelector('#tab-sec-prob').style.display = (S.activeTab === 'prob') ? 'block' : 'none';

        updateMathElements();
      };
    });

    /* Sliders */
    var rngA = root.querySelector('#rng-a');
    var rngB = root.querySelector('#rng-b');
    var rngK = root.querySelector('#rng-k');
    var rngX0 = root.querySelector('#rng-x0');

    function updateVal(key, val, rngEl) {
      S[key] = Math.round(parseFloat(val) * 100) / 100;
      if (rngEl) rngEl.value = S[key];
      _this.updateHUD();
      _this.drawCanvas();
    }

    rngA.oninput = function() { updateVal('a', this.value, rngA); };
    rngB.oninput = function() { updateVal('b', this.value, rngB); };
    rngK.oninput = function() { updateVal('k', this.value, rngK); };
    rngX0.oninput = function() { updateVal('x0', this.value, rngX0); };

    function bindWheel(el, key) {
      el.onwheel = function(e) {
        e.preventDefault();
        var delta = e.deltaY < 0 ? 0.01 : -0.01;
        var minV = parseFloat(el.min), maxV = parseFloat(el.max);
        var nVal = Math.min(maxV, Math.max(minV, S[key] + delta));
        updateVal(key, nVal, el);
      };
    }
    bindWheel(rngA, 'a');
    bindWheel(rngB, 'b');
    bindWheel(rngK, 'k');
    bindWheel(rngX0, 'x0');

    /* Canvas Mousemove */
    var cv = root.querySelector('#ae-cv');
    cv.onmousemove = function(e) {
      var rect = cv.getBoundingClientRect();
      var mouseX = e.clientX - rect.left;
      var pad = 40;
      var xVal = -BOUND_X + (mouseX - pad) / (CW - pad * 2) * (2 * BOUND_X);
      xVal = Math.min(BOUND_X - 0.2, Math.max(-BOUND_X + 0.2, xVal));
      updateVal('x0', xVal, rngX0);
    };

    /* Actions */
    root.querySelector('#btn-toggle-sym').onclick = function() {
      S.showSymmetryLines = !S.showSymmetryLines;
      _this.drawCanvas();
    };
    root.querySelector('#btn-switch-mode').onclick = function() {
      S.mode = S.mode === 'standard' ? 'general' : 'standard';
      this.textContent = S.mode === 'standard' ? '일반형 ↔ 표준형 변환' : '표준형 ↔ 일반형 변환';
      _this.updateHUD();
      _this.drawCanvas();
    };

    /* Quiz */
    root.querySelector('#btn-submit-quiz').onclick = function() {
      var val = (root.querySelector('#inp-quiz-ans').value || '').trim();
      var msgEl = root.querySelector('#lbl-quiz-msg');
      if (val === '2') {
        msgEl.innerHTML = '✅ <b>정답입니다!</b> x - 2 = 0 이므로 대칭 중심 x 의 값은 2 입니다.';
        msgEl.style.color = '#059669';
      } else {
        msgEl.innerHTML = '❌ 오답입니다. (힌트: 분모를 0으로 만드는 x의 값인 2 입니다)';
        msgEl.style.color = '#ef4444';
      }
    };

    /* Solutions Toggle */
    root.querySelectorAll('.btn-show-sol').forEach(function(btn) {
      btn.onclick = function() {
        var idx = this.getAttribute('data-idx');
        var solEl = root.querySelector('#sol-' + idx);
        if (solEl) {
          var isShown = solEl.style.display === 'block';
          solEl.style.display = isShown ? 'none' : 'block';
          this.textContent = isShown ? '💡 수학적 해설 보기' : '🙈 해설 닫기';
          updateMathElements();
        }
      };
    });

    /* Modal Open & Render Slide */
    root.querySelector('#btn-open-guide').onclick = function() {
      S.guidePage = 0;
      _this.renderSlideGuide();
      root.querySelector('#ae-modal').classList.add('on');
    };
  },

  updateHUD: function() {
    var root = S.host.querySelector('#ae-app-root');
    if (!root) return;

    var a = getA(), b = getB(), k = getK();
    var y0 = fx(S.x0);

    root.querySelector('#lbl-va').textContent = 'x = ' + a.toFixed(2);
    root.querySelector('#lbl-ha').textContent = 'y = ' + b.toFixed(2);
    root.querySelector('#lbl-center').textContent = '(' + a.toFixed(2) + ', ' + b.toFixed(2) + ')';
    root.querySelector('#lbl-k-val').textContent = k.toFixed(2);

    root.querySelector('#lbl-a-slider').textContent = S.a.toFixed(2);
    root.querySelector('#lbl-b-slider').textContent = S.b.toFixed(2);
    root.querySelector('#lbl-k-slider').textContent = S.k.toFixed(2);
    root.querySelector('#lbl-x0-slider').textContent = S.x0.toFixed(2);

    var formTex = '';
    if (S.mode === 'standard') {
      formTex = 'y = \\frac{' + k.toFixed(2) + '}{x ' + (a >= 0 ? '- ' + a.toFixed(2) : '+ ' + Math.abs(a).toFixed(2)) + '} ' + (b >= 0 ? '+ ' + b.toFixed(2) : '- ' + Math.abs(b).toFixed(2));
    } else {
      var cVal = b;
      var dVal = k - cVal * a;
      formTex = 'y = \\frac{' + cVal.toFixed(2) + 'x ' + (dVal >= 0 ? '+ ' + dVal.toFixed(2) : '- ' + Math.abs(dVal).toFixed(2)) + '}{x ' + (a >= 0 ? '- ' + a.toFixed(2) : '+ ' + Math.abs(a).toFixed(2)) + '} \\implies \\frac{' + k.toFixed(2) + '}{x ' + (a >= 0 ? '- ' + a.toFixed(2) : '+ ' + Math.abs(a).toFixed(2)) + '} ' + (b >= 0 ? '+ ' + b.toFixed(2) : '- ' + Math.abs(b).toFixed(2));
    }

    var ptTex = isNaN(y0) ? 'P(' + S.x0.toFixed(2) + ', \\text{정의되지 않음})' : 'P(' + S.x0.toFixed(2) + ', ' + y0.toFixed(2) + ')';

    var elForm = root.querySelector('#lbl-math-formula');
    var elPt = root.querySelector('#lbl-math-point');

    if (elForm) { elForm.setAttribute('data-tex', formTex); renderMath(formTex, elForm, true); }
    if (elPt) { elPt.setAttribute('data-tex', ptTex); renderMath(ptTex, elPt, false); }
  },

  worldToPx: function(x, y) {
    var pad = 40;
    return {
      X: pad + (x + BOUND_X) / (2 * BOUND_X) * (CW - pad * 2),
      Y: CH / 2 - (y / BOUND_Y) * (CH / 2 - 20)
    };
  },

  drawCanvas: function() {
    var root = S.host.querySelector('#ae-app-root');
    if (!root) return;
    var cv = root.querySelector('#ae-cv');
    if (!cv) return;
    var ctx = cv.getContext('2d');

    ctx.clearRect(0, 0, CW, CH);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, CW, CH);

    var _this = this;
    var a = getA(), b = getB(), k = getK();
    var pad = 40;

    // Grid & Axes
    var o = _this.worldToPx(0, 0);
    ctx.strokeStyle = '#e2e8f0';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(pad, o.Y); ctx.lineTo(CW - pad, o.Y);
    ctx.moveTo(o.X, 20); ctx.lineTo(o.X, CH - 20);
    ctx.stroke();

    // Asymptotes (Red Dashed)
    var va = _this.worldToPx(a, 0);
    var hb = _this.worldToPx(0, b);

    ctx.strokeStyle = '#ef4444';
    ctx.lineWidth = 2.5;
    ctx.setLineDash([6, 4]);

    ctx.beginPath();
    ctx.moveTo(va.X, 20); ctx.lineTo(va.X, CH - 20);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(pad, hb.Y); ctx.lineTo(CW - pad, hb.Y);
    ctx.stroke();
    ctx.setLineDash([]);

    // Symmetry Lines (y = (x-a)+b  and  y = -(x-a)+b)
    if (S.showSymmetryLines) {
      ctx.strokeStyle = '#cbd5e1';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([3, 3]);

      ctx.beginPath();
      for (var t = -BOUND_X; t <= BOUND_X; t += BOUND_X) {
        var sy1 = (t - a) + b;
        var sp1 = _this.worldToPx(t, sy1);
        if (t === -BOUND_X) ctx.moveTo(sp1.X, sp1.Y);
        else ctx.lineTo(sp1.X, sp1.Y);
      }
      ctx.stroke();

      ctx.beginPath();
      for (var t2 = -BOUND_X; t2 <= BOUND_X; t2 += BOUND_X) {
        var sy2 = -(t2 - a) + b;
        var sp2 = _this.worldToPx(t2, sy2);
        if (t2 === -BOUND_X) ctx.moveTo(sp2.X, sp2.Y);
        else ctx.lineTo(sp2.X, sp2.Y);
      }
      ctx.stroke();
      ctx.setLineDash([]);
    }

    // Rational Hyperbola Curve
    ctx.strokeStyle = '#0284c7';
    ctx.lineWidth = 3;
    ctx.beginPath();
    var started = false;
    for (var i = 0; i <= 300; i++) {
      var x = -BOUND_X + i * (2 * BOUND_X) / 300;
      if (Math.abs(x - a) < 0.08) {
        started = false;
        continue;
      }
      var y = k / (x - a) + b;
      if (y > BOUND_Y + 2 || y < -BOUND_Y - 2) {
        started = false;
        continue;
      }
      var p = _this.worldToPx(x, y);
      if (!started) { ctx.moveTo(p.X, p.Y); started = true; }
      else ctx.lineTo(p.X, p.Y);
    }
    ctx.stroke();

    // Center of Symmetry (a, b)
    var cp = _this.worldToPx(a, b);
    ctx.fillStyle = '#0284c7';
    ctx.beginPath();
    ctx.arc(cp.X, cp.Y, 6, 0, Math.PI * 2);
    ctx.fill();

    // Point P(x0, y0)
    var y0 = fx(S.x0);
    if (!isNaN(y0)) {
      var p0 = _this.worldToPx(S.x0, y0);
      ctx.fillStyle = '#dc2626';
      ctx.beginPath();
      ctx.arc(p0.X, p0.Y, 6, 0, Math.PI * 2);
      ctx.fill();

      // Vertical line to x0
      var px0 = _this.worldToPx(S.x0, 0);
      ctx.strokeStyle = '#fca5a5';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([3, 3]);
      ctx.beginPath();
      ctx.moveTo(p0.X, p0.Y); ctx.lineTo(px0.X, px0.Y);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    ctx.fillStyle = '#dc2626';
    ctx.font = 'bold 12px Pretendard';
    ctx.fillText('x = ' + a.toFixed(2), va.X + 6, 30);
    ctx.fillText('y = ' + b.toFixed(2), pad + 6, hb.Y - 8);
    ctx.fillText('대칭중심 (' + a.toFixed(2) + ', ' + b.toFixed(2) + ')', cp.X + 8, cp.Y + 16);
  },

  renderSlideGuide: function() {
    var _this = this;
    var root = S.host.querySelector('#ae-app-root');
    var mBox = root.querySelector('#ae-modal-box');
    if (!mBox) return;

    var pg = SLIDE_GUIDE[S.guidePage] || SLIDE_GUIDE[0];
    var dots = SLIDE_GUIDE.map(function(_, i) {
      return '<span class="dot' + (i === S.guidePage ? ' on' : '') + '"></span>';
    }).join('');
    var isLast = S.guidePage >= SLIDE_GUIDE.length - 1;

    var h = '';
    h += '<div style="font-size:.8rem; font-weight:800; color:#0284c7; margin-bottom:4px;">온보딩 슬라이드 탐구 ' + (S.guidePage + 1) + ' / ' + SLIDE_GUIDE.length + '</div>';
    h += '<h3 style="margin:0 0 12px; color:#0f172a; font-weight:900;">' + pg.title + '</h3>';
    h += '<div style="line-height:1.65; color:#334155; font-size:0.95rem;">' + pg.html + '</div>';
    h += '<div class="dots">' + dots + '</div>';

    h += '<div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px;">';
    h += '  <button type="button" class="btn" id="btn-slide-prev"' + (S.guidePage === 0 ? ' disabled' : '') + '>← 이전</button>';
    h += '  <button type="button" class="btn p" id="btn-slide-next">' + (isLast ? '탐구 시작하기 🚀' : '다음 →') + '</button>';
    h += '</div>';

    mBox.innerHTML = h;
    updateMathElements();

    var prevBtn = mBox.querySelector('#btn-slide-prev');
    var nextBtn = mBox.querySelector('#btn-slide-next');

    if (prevBtn) {
      prevBtn.onclick = function() {
        if (S.guidePage > 0) {
          S.guidePage--;
          _this.renderSlideGuide();
        }
      };
    }
    if (nextBtn) {
      nextBtn.onclick = function() {
        if (isLast) {
          root.querySelector('#ae-modal').classList.remove('on');
        } else {
          S.guidePage++;
          _this.renderSlideGuide();
        }
      };
    }
  },

  destroy: function() {
    if (S.host) S.host.innerHTML = '';
    S.host = null;
  }
};

function goHome() {
  if (S.host) S.host.innerHTML = '';
  if (typeof window.LegacyBridge !== 'undefined' && typeof window.LegacyBridge.backHome === 'function') {
    window.LegacyBridge.backHome();
  } else if (typeof window.MathLabGames !== 'undefined' && window.MathLabGames.goHome) {
    window.MathLabGames.goHome();
  } else {
    window.location.reload();
  }
}

function reg() {
  if (typeof window.MathLabGames === 'undefined' || typeof window.MathLabGames.register !== 'function') return;
  try {
    if (window.MathLabGames.get && window.MathLabGames.get(APP_ID)) return;
    window.MathLabGames.register({
      id: APP_ID,
      title: APP_TITLE,
      icon: ICON,
      sourceType: 'new',
      players: '1인',
      isMultiplayer: false,
      mount: function(c, x) { AsymptoteConceptApp.mount(c, x); },
      reset: function() { AsymptoteConceptApp.updateHUD(); AsymptoteConceptApp.drawCanvas(); },
      destroy: function() { AsymptoteConceptApp.destroy(); },
      goHome: function() { goHome(); }
    });
  } catch (e) {
    console.warn(APP_ID + ' reg', e);
  }
}

reg();
window.addEventListener('DOMContentLoaded', reg);
setTimeout(reg, 100);
setTimeout(reg, 500);

window.AsymptoteConcept = {
  mount: function(c) { AsymptoteConceptApp.mount(c); },
  destroy: function() { AsymptoteConceptApp.destroy(); },
  goHome: goHome
};

window.initAsymptoteEscape = function() {
  reg();
  try {
    if (window.LegacyBridge) {
      window.LegacyBridge.hideAllLegacySections();
      if (window.LegacyBridge.showNewRoot) window.LegacyBridge.showNewRoot();
    }
  } catch (e) {}
  if (window.MathLabGames && window.MathLabGames.mount) {
    try { window.MathLabGames.mount(APP_ID); return; } catch (e) {}
  }
  AsymptoteConceptApp.mount(document.getElementById('mathlab-view'));
};

window.launchAsymptoteEscape = window.initAsymptoteEscape;
})();
</script>
