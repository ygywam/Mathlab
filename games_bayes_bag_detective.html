function renderMath(latex, container, displayMode) {
  if (typeof katex !== 'undefined' && container) {

      return;
    } catch(e){}
  }

}

function updateMathElements() {
  document.querySelectorAll('.math-tex').forEach(function(el) {
    var tex = el.getAttribute('data-tex');
    var isDisplay = el.getAttribute('data-display') === 'true';
    if (tex) renderMath(tex, el, isDisplay);
  });
}

function makeBags() {
  var count = S.diff === 'easy' ? 2 : 3;
  var bags = [];
  var prior = 1 / count;
  for (var i = 0; i < count; i++) {
    var redCount = 2 + Math.floor(Math.random() * 6);
    var blueCount = 2 + Math.floor(Math.random() * 6);
    if (S.diff === 'easy') {
      if (i === 0) { redCount = 7; blueCount = 3; }
      if (i === 1) { redCount = 2; blueCount = 8; }
    }
    bags.push({
      name: String.fromCharCode(65 + i),
      prior: prior,
      red: redCount,
      blue: blueCount
    });
  }
  return bags;
}

function getLikelihood(bag, color) {
  var total = bag.red + bag.blue;
  return color === 'R' ? (bag.red / total) : (bag.blue / total);
}

function calcPosterior(bags, color) {
  var raws = bags.map(function(b) {
    return b.prior * getLikelihood(b, color);
  });
  var sum = raws.reduce(function(a, b) { return a + b; }, 0) || 1;
  return raws.map(function(v) { return v / sum; });
}

function getBestIndex() {
  var bestI = 0;
  for (var i = 1; i < S.post.length; i++) {
    if (S.post[i] > S.post[bestI]) bestI = i;
  }
  return bestI;
}

    h += '      <div class="card-title">🧩 실전 확률 및 베이즈 정리 탐구 문제 (4선)</div>';

    var probs = [
      {
        title: "Q1. 희귀 질환 검사와 양성 판정 사후 확률",
        q: "발병률 1%인 희귀 질환이 있습니다. 검사 진단 정확도(우도)가 95%일 때, 어떤 사람이 검사에서 양성이 나왔다면 실제로 이 병에 걸렸을 사후 확률은 몇 %일까요?",
        sol: "<b>[정답: 약 16.1%]</b><br>• 베이즈 정리 계산: <span class=\"math-tex\" data-tex=\"P(\\text{병} \\mid \\text{양성}) = \\frac{0.95 \\times 0.01}{(0.95 \\times 0.01) + (0.05 \\times 0.99)} \\approx 16.1\\%\"></span><br>• 사전 확률(발병률 1%)이 매우 낮기 때문에 양성이 나와도 실제 환자일 확률은 생각보다 낮습니다."
      },
      {
        title: "Q2. 이메일 스팸 필터링 알고리즘",
        q: "전체 이메일 중 스팸 메일 비율이 40%입니다. 스팸 메일 중 '무료' 단어 포함 비율은 80%, 일반 메일 중 포함 비율은 10%입니다. '무료' 단어가 포함된 메일이 스팸일 사후 확률은?",
        sol: "<b>[수학적 해설]</b><br>• 베이즈 정리: <span class=\"math-tex\" data-tex=\"P(\\text{스팸} \\mid \\text{단어}) = \\frac{0.80 \\times 0.40}{(0.80 \\times 0.40) + (0.10 \\times 0.60)} = \\frac{0.32}{0.38} \\approx 84.2\\%\"></span><br>• 스팸 필터는 이와 같이 단어별 사후 확률을 곱하여 스팸 여부를 자동 판정합니다."
      },
      {
        title: "Q3. 거짓말 탐지기 신뢰성 분석",
        q: "거짓말 탐지기가 거짓말을 정확히 집어낼 확률이 90%이고, 진실을 말할 때 오작동할 확률이 10%입니다. 용의자 중 거짓말쟁이가 5%라면, 반응이 온 용의자가 실제 거짓말쟁이일 확률은?",
        sol: "<b>[수학적 분석]</b><br>• 계산: <span class=\"math-tex\" data-tex=\"P(\\text{거짓} \\mid \\text{반응}) = \\frac{0.90 \\times 0.05}{(0.90 \\times 0.05) + (0.10 \\times 0.95)} = \\frac{0.045}{0.14} \\approx 32.1\\%\"></span><br>• 기준율이 낮은 상태에서는 법적 증거력 채택에 신중해야 함을 보여줍니다."
      },
      {
        title: "Q4. 기계 고장 원인 추단 (품질 관리)",
        q: "공장에서 A 라인이 60%, B 라인이 40% 제품을 생산합니다. A 라인 불량률은 2%, B 라인 불량률은 5%입니다. 무심코 뽑은 불량품이 B 라인 제품일 확률은?",
        sol: "<b>[정답: 약 62.5%]</b><br>• 베이즈 계산: <span class=\"math-tex\" data-tex=\"P(B \\mid \\text{불량}) = \\frac{0.05 \\times 0.40}{(0.02 \\times 0.60) + (0.05 \\times 0.40)} = \\frac{0.02}{0.032} = 62.5\\%\"></span>"
      }
    ];

    probs.forEach(function(item, idx) {
      h += '<div style="background:#ffffff; border:1px solid #e2e8f0; border-radius:14px; padding:16px; margin-bottom:14px;">';
      h += '  <div style="font-weight:900; font-size:1.05rem; color:#0284c7; margin-bottom:6px;">' + item.title + '</div>';
      h += '  <div style="line-height:1.6; color:#334155; margin-bottom:10px;">' + item.q + '</div>';
      h += '  <button type="button" class="btn p btn-show-sol" data-idx="' + idx + '">💡 수학적 해설 보기</button>';
      h += '  <div id="sol-' + idx + '" style="display:none; background:#f8fafc; border:1px solid #cbd5e1; border-radius:12px; padding:14px; margin-top:10px; font-size:0.92rem; line-height:1.65;">' + item.sol + '</div>';
      h += '</div>';
    });

    h += '  </div>';
    h += '  </div>';

    /* Slide Modal */
    h += '<div class="modal" id="bb-modal">';
    h += '  <div class="mbox" id="bb-modal-box"></div>';
    h += '</div>';

    h += '</div>';
    return h;
  },

  bindEvents: function() {
    var _this = this;
    var root = S.host.querySelector('#bb-app-root');

    /* Tabs */
    root.querySelectorAll('.tab-btn').forEach(function(btn) {
      btn.onclick = function() {
        root.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
        this.classList.add('active');
        S.activeTab = this.getAttribute('data-tab');

        root.querySelector('#tab-sec-sim').style.display = (S.activeTab === 'sim') ? 'block' : 'none';
        root.querySelector('#tab-sec-math').style.display = (S.activeTab === 'math') ? 'block' : 'none';
        root.querySelector('#tab-sec-prob').style.display = (S.activeTab === 'prob') ? 'block' : 'none';

        updateMathElements();
      };
    });

    /* Difficulty Buttons */
    root.querySelector('#btn-diff-easy').onclick = function() {
      S.diff = 'easy';
      this.className = 'btn p';
      root.querySelector('#btn-diff-norm').className = 'btn';
      _this.startRound();
    };
    root.querySelector('#btn-diff-norm').onclick = function() {
      S.diff = 'normal';
      this.className = 'btn p';
      root.querySelector('#btn-diff-easy').className = 'btn';
      _this.startRound();
    };

    /* Actions */
    root.querySelector('#btn-submit-choice').onclick = function() { _this.submitChoice(); };
    root.querySelector('#btn-next-round').onclick = function() { _this.startRound(); };

    /* Quiz */
    root.querySelector('#btn-submit-quiz').onclick = function() {
      var val = (root.querySelector('#inp-quiz-ans').value || '').trim();
      var msgEl = root.querySelector('#lbl-quiz-msg');
      if (val === '0.8' || val === '4/5' || val === '80%' || val === '0.80') {
        msgEl.innerHTML = '✅ <b>정답입니다!</b> 8개 / 10개 = 0.8 (80%) 우도가 계산됩니다.';
        msgEl.style.color = '#059669';
      } else {
        msgEl.innerHTML = '❌ 오답입니다. (힌트: 주머니 A 내의 빨간 공 개수 8개를 전체 10개로 나눈 값입니다)';
        msgEl.style.color = '#ef4444';
      }
    };

    /* Solutions Toggle */
    root.querySelectorAll('.btn-show-sol').forEach(function(btn) {
      btn.onclick = function() {
        var idx = this.getAttribute('data-idx');
        var solEl = root.querySelector('#sol-' + idx);
        if (solEl) {
          var isShown = solEl.style.display === 'block';
          solEl.style.display = isShown ? 'none' : 'block';
          this.textContent = isShown ? '💡 수학적 해설 보기' : '🙈 해설 닫기';
          updateMathElements();
        }
      };
    });

    /* Modal Open & Render Slide */
    root.querySelector('#btn-open-guide').onclick = function() {
      S.guidePage = 0;
      _this.renderSlideGuide();
      root.querySelector('#bb-modal').classList.add('on');
    };
  },

  startRound: function() {
    S.bags = makeBags();
    S.drawnColor = Math.random() < 0.5 ? 'R' : 'B';
    S.post = calcPosterior(S.bags, S.drawnColor);
    S.selectedIdx = null;
    S.revealed = false;

    var root = S.host.querySelector('#bb-app-root');
    if (root) {
      root.querySelector('#inp-post-val').value = '';
      root.querySelector('#lbl-sim-status').innerHTML = '관측된 구슬을 보고 사후 확률이 가장 높을 것으로 추정되는 주머니를 선택하세요.';
      var proofBox = root.querySelector('#math-proof-box');
      if (proofBox) { proofBox.style.display = 'none'; proofBox.innerHTML = ''; }
    }
    this.renderBagsView();
  },

  renderBagsView: function() {
    var _this = this;
    var root = S.host.querySelector('#bb-app-root');
    if (!root) return;

    var drawnText = S.drawnColor === 'R' ? '🔴 빨간 구슬' : '🔵 파란 구슬';
    root.querySelector('#lbl-drawn-obs').textContent = drawnText;

    var grid = root.querySelector('#bag-grid-box');
    var bestI = getBestIndex();

    grid.innerHTML = S.bags.map(function(b, i) {
      var isUserSel = (S.selectedIdx === i);
      var isBest = S.revealed && (i === bestI);

      var cardClass = 'bag-card';
      if (isUserSel) cardClass += ' user-selected';
      if (isBest) cardClass += ' best-target';

      var pctVal = (S.post[i] * 100).toFixed(1);
      var postHtml = S.revealed ? 
        ('<div style="margin-top:8px; font-weight:800; font-size:0.9rem; color:#0284c7;">사후 확률: ' + pctVal + '%</div>' +
         '<div class="bar-track"><div class="bar-fill" style="width:' + pctVal + '%;"></div></div>') :
        ('<div style="margin-top:8px; font-weight:700; font-size:0.88rem; color:#94a3b8;">사후 확률: ? %</div>');

      return '<div class="' + cardClass + '" data-idx="' + i + '">' +
        '<div class="bag-icon">🎒</div>' +
        '<div class="bag-title">주머니 ' + b.name + '</div>' +
        '<div style="font-size:0.88rem; margin-top:4px; font-weight:700; color:#64748b;">사전 확률: ' + (b.prior * 100).toFixed(0) + '%</div>' +
        '<div style="font-size:0.88rem; font-weight:800; margin-top:4px;">🔴 ' + b.red + '개 · 🔵 ' + b.blue + '개</div>' +
        postHtml +
        '</div>';
    }).join('');

    grid.querySelectorAll('.bag-card').forEach(function(card) {
      card.onclick = function() {
        if (S.revealed) return;
        S.selectedIdx = parseInt(this.getAttribute('data-idx'), 10);
        _this.renderBagsView();
      };
    });
  },

  submitChoice: function() {
    var root = S.host.querySelector('#bb-app-root');
    if (S.selectedIdx === null) {
      root.querySelector('#lbl-sim-status').innerHTML = '⚠️ 먼저 가장 유력하다고 생각하는 <b>주머니를 클릭하여 선택</b>해 주세요!';
      return;
    }

    S.revealed = true;
    var bestI = getBestIndex();
    var bestBagName = S.bags[bestI].name;
    var bestPct = (S.post[bestI] * 100).toFixed(1);

    var userPickName = S.bags[S.selectedIdx].name;
    var userPostPct = (S.post[S.selectedIdx] * 100).toFixed(1);

    var msg = '';
    if (S.selectedIdx === bestI) {
      msg = '🎉 <b>정답 적중!</b> ' + userPickName + ' 주머니가 사후 확률 <b>' + userPostPct + '%</b>로 가장 유력합니다!';
    } else {
      msg = '😭 <b>아쉽습니다.</b> 선택한 ' + userPickName + ' 주머니(사후 ' + userPostPct + '%)보다 <b>' + bestBagName + ' 주머니(사후 ' + bestPct + '%)</b>의 확률이 더 높습니다.';
    }

    root.querySelector('#lbl-sim-status').innerHTML = msg;
    this.renderBagsView();
    this.renderMathProofBox();
  },

  /* Generate Step-by-Step Math Proof Box for Posterior Probabilities */
  renderMathProofBox: function() {
    var root = S.host.querySelector('#bb-app-root');
    var proofBox = root.querySelector('#math-proof-box');
    if (!proofBox) return;

    var colorText = S.drawnColor === 'R' ? '🔴 빨간 구슬' : '🔵 파란 구슬';
    var lines = [];

    lines.push('<div style="font-weight:900; color:#0369a1; margin-bottom:8px;">📐 단계별 베이즈 정리 수식 계산 과정 (' + colorText + ' 관측)</div>');
    
    // 1. Likelihoods
    var likText = S.bags.map(function(b) {
      var count = S.drawnColor === 'R' ? b.red : b.blue;
      var total = b.red + b.blue;
      var lik = (count / total).toFixed(3);
      return '• <b>' + b.name + ' 우도:</b> P(' + (S.drawnColor==='R'?'빨강':'파랑') + '|' + b.name + ') = ' + count + '/' + total + ' ≈ ' + lik;
    }).join('<br>');
    lines.push('<div style="font-size:0.9rem; line-height:1.6; color:#334155; margin-bottom:8px;">' + likText + '</div>');

    // 2. Unnormalized priors * likelihoods & Total Sum
    var raws = S.bags.map(function(b) {
      var lik = getLikelihood(b, S.drawnColor);
      return b.prior * lik;
    });
    var sumRaw = raws.reduce(function(a,b){ return a+b; }, 0);

    var rawText = S.bags.map(function(b, i) {
      return 'P(' + (S.drawnColor==='R'?'빨강':'파랑') + '|' + b.name + ') \\times P(' + b.name + ') = ' + getLikelihood(b, S.drawnColor).toFixed(3) + ' \\times ' + b.prior.toFixed(2) + ' = ' + raws[i].toFixed(4);
    }).join(' \\\\ ');

    lines.push('<div class="math-block"><span class="math-tex" data-display="true" data-tex="' + rawText + '"></span></div>');
    lines.push('<div style="font-size:0.9rem; font-weight:800; color:#0f172a; margin-top:6px;">전체 확률 분모 (Σ) = ' + sumRaw.toFixed(4) + '</div>');

    // 3. Final Posteriors
    var postText = S.bags.map(function(b, i) {
      var pct = (S.post[i] * 100).toFixed(1);
      return 'P(' + b.name + '|' + (S.drawnColor==='R'?'빨강':'파랑') + ') = \\frac{' + raws[i].toFixed(4) + '}{' + sumRaw.toFixed(4) + '} = ' + S.post[i].toFixed(3) + ' \\; (' + pct + '\\%)';
    }).join(' \\\\ ');

    lines.push('<div class="math-block" style="background:#f0fdf4; border-color:#bbf7d0;"><span class="math-tex" data-display="true" data-tex="' + postText + '"></span></div>');

    proofBox.innerHTML = lines.join('');
    proofBox.style.display = 'block';
    updateMathElements();
  },

  renderSlideGuide: function() {
    var _this = this;
    var root = S.host.querySelector('#bb-app-root');
    var mBox = root.querySelector('#bb-modal-box');
    if (!mBox) return;

    var pg = SLIDE_GUIDE[S.guidePage] || SLIDE_GUIDE[0];
    var dots = SLIDE_GUIDE.map(function(_, i) {
      return '<span class="dot' + (i === S.guidePage ? ' on' : '') + '"></span>';
    }).join('');
    var isLast = S.guidePage >= SLIDE_GUIDE.length - 1;

    var h = '';
    h += '<div style="font-size:.8rem; font-weight:800; color:#0284c7; margin-bottom:4px;">온보딩 슬라이드 탐구 ' + (S.guidePage + 1) + ' / ' + SLIDE_GUIDE.length + '</div>';
    h += '<h3 style="margin:0 0 12px; color:#0f172a; font-weight:900;">' + pg.title + '</h3>';
    h += '<div style="line-height:1.65; color:#334155; font-size:0.95rem;">' + pg.html + '</div>';
    h += '<div class="dots">' + dots + '</div>';

    h += '<div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px;">';
    h += '  <button type="button" class="btn" id="btn-slide-prev"' + (S.guidePage === 0 ? ' disabled' : '') + '>← 이전</button>';
    h += '  <button type="button" class="btn p" id="btn-slide-next">' + (isLast ? '탐구 시작하기 🚀' : '다음 →') + '</button>';
    h += '</div>';

    mBox.innerHTML = h;
    updateMathElements();

    var prevBtn = mBox.querySelector('#btn-slide-prev');
    var nextBtn = mBox.querySelector('#btn-slide-next');

    if (prevBtn) {
      prevBtn.onclick = function() {
        if (S.guidePage > 0) {
          S.guidePage--;
          _this.renderSlideGuide();
        }
      };
    }
    if (nextBtn) {
      nextBtn.onclick = function() {
        if (isLast) {
          root.querySelector('#bb-modal').classList.remove('on');
        } else {
          S.guidePage++;
          _this.renderSlideGuide();
        }
      };
    }
  },

  destroy: function() {
    if (S.host) S.host.innerHTML = '';
    S.host = null;
  }
};

function goHome() {
  if (S.host) S.host.innerHTML = '';
  if (typeof window.LegacyBridge !== 'undefined' && typeof window.LegacyBridge.backHome === 'function') {
    window.LegacyBridge.backHome();
  } else if (typeof window.MathLabGames !== 'undefined' && window.MathLabGames.goHome) {
    window.MathLabGames.goHome();
  } else {
    window.location.reload();
  }
}

function reg() {
  if (typeof window.MathLabGames === 'undefined' || !window.MathLabGames.register) return;
  try {
    if (window.MathLabGames.get && window.MathLabGames.get(APP_ID)) return;
    window.MathLabGames.register({
      id: APP_ID,
      title: APP_TITLE,
      icon: ICON,
      sourceType: 'new',
      players: '1인',
      isMultiplayer: false,
      mount: function(c, x) { BayesApp.mount(c, x); },
      reset: function() { BayesApp.startRound(); },
      destroy: function() { BayesApp.destroy(); },
      goHome: function() { goHome(); }
    });
  } catch (e) {
    console.warn(APP_ID + ' reg', e);
  }
}

reg();
window.addEventListener('DOMContentLoaded', reg);
setTimeout(reg, 100);
setTimeout(reg, 500);

window.BayesBagDetective = {
  mount: function(c) { BayesApp.mount(c); },
  resetGame: function() { BayesApp.startRound(); },
  destroy: function() { BayesApp.destroy(); },
  goHome: goHome
};

window.initBayesBagDetectiveGame = function() {
  reg();
  try {
    if (window.LegacyBridge) {
      window.LegacyBridge.hideAllLegacySections();
      if (window.LegacyBridge.showNewRoot) window.LegacyBridge.showNewRoot();
    }
  } catch (e) {}
  if (window.MathLabGames && window.MathLabGames.mount) {
    try { window.MathLabGames.mount(APP_ID); return; } catch (e) {}
  }
  BayesApp.mount(document.getElementById('mathlab-view'));
};

window.launchBayesBagDetectiveGame = window.initBayesBagDetectiveGame;
})();
</script>
