</style>
<script>
(function () {
  'use strict';

  if (window.FactorBreaker && window.FactorBreaker.__gen3) {
    return; // 중복 로드 방어
  }

  var APP_ID = 'factor-breaker';
  var APP_TITLE = '다항식 인수분해 브레이커';
  var BOARD_ID = 'board-factor-breaker';
  var LS_KEY = 'mathlab_lb_factor_breaker';
  var TYPE_LABEL = { basic: '기본 인수분해', common: '공통인수', square: '완전제곱식', diff: '합차 공식' };
  var DIFF_PRESET = {
    easy: { label: '쉬움', speed: 0.22 },
    normal: { label: '보통', speed: 0.32 },
    hard: { label: '도전', speed: 0.45 }
  };

  var state = {
    mounted: false,
    running: false,
    paused: false,
    waiting: false,
    over: true,
    score: 0,
    lives: 3,
    combo: 0,
    bestCombo: 0,
    round: 1,
    cleared: 0,
    difficulty: 'normal',
    baseSpeed: 0.32,
    speed: 0.32,
    blockY: 0,
    problem: null,
    options: [],
    loopId: null,
    boomTimer: null,
    keyHandler: null
  };

  /* ---------- 유틸 ---------- */
  function $(sel) {
    var root = document.getElementById('fb-root');
    return root ? root.querySelector(sel) : null;
  }
  function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
  function escapeHTML(str) {
    return String(str).replace(/[&<>"']/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
  }

  /* ---------- 수식 엔진 (전개 기반 계수 비교 판정) ---------- */
  function expandPair(f1, f2) {
    return { a: f1.m * f2.m, b: f1.m * f2.c + f2.m * f1.c, c: f1.c * f2.c };
  }
  function samePoly(p, q) { return p.a === q.a && p.b === q.b && p.c === q.c; }
  function fmtSigned(v, first) {
    if (v < 0) return first ? '-' : ' - ';
    return first ? '' : ' + ';
  }
  function fmtPoly(p) {
    var out = '';
    var first = true;
    if (p.a !== 0) {
      out += fmtSigned(p.a, first) + (Math.abs(p.a) === 1 ? '' : Math.abs(p.a)) + 'x²';
      first = false;
    }
    if (p.b !== 0) {
      out += fmtSigned(p.b, first) + (Math.abs(p.b) === 1 ? '' : Math.abs(p.b)) + 'x';
      first = false;
    }
    if (p.c !== 0 || first) {
      out += fmtSigned(p.c, first) + Math.abs(p.c);
    }
    return out;
  }
  function fmtFactor(f) {
    var xPart = (Math.abs(f.m) === 1 ? (f.m < 0 ? '-x' : 'x') : f.m + 'x');
    if (f.c === 0) return xPart;
    return '(' + xPart + (f.c > 0 ? ' + ' + f.c : ' - ' + Math.abs(f.c)) + ')';
  }
  function fmtPair(f1, f2) {
    if (f1.c === 0) return fmtFactor(f1) + fmtFactor(f2);
    if (f2.c === 0) return fmtFactor(f2) + fmtFactor(f1);
    return fmtFactor(f1) + fmtFactor(f2);
  }

  /* ---------- 출제 엔진 (인수 조합 → 전개, 역방향 생성) ---------- */
  function allowedTypes() {
    if (state.difficulty === 'easy') {
      return state.round >= 3 ? ['basic', 'common'] : ['basic'];
    }
    if (state.difficulty === 'normal') {
      return state.round >= 3 ? ['basic', 'common', 'square', 'diff'] : ['basic', 'common', 'square'];
    }
    return ['basic', 'common', 'square', 'diff'];
  }
  function maxMag() {
    var base = state.difficulty === 'easy' ? 5 : 9;
    return Math.min(base + (state.round - 1), 12);
  }
  function pickC(allowNeg) {
    var v = randInt(1, maxMag());
    if (allowNeg && Math.random() < 0.5) v = -v;
    return v;
  }
  function generateProblem() {
    var types = allowedTypes();
    var type = types[randInt(0, types.length - 1)];
    var neg = state.difficulty === 'hard';
    var f1, f2, p;
    if (type === 'square') {
      p = pickC(neg);
      f1 = { m: 1, c: p };
      f2 = { m: 1, c: p };
    } else if (type === 'diff') {
      p = randInt(1, maxMag());
      f1 = { m: 1, c: p };
      f2 = { m: 1, c: -p };
    } else if (type === 'common') {
      f1 = { m: randInt(2, 3), c: 0 };
      f2 = { m: 1, c: pickC(neg) };
    } else {
      f1 = { m: 1, c: pickC(neg) };
      f2 = { m: 1, c: pickC(neg) };
    }
    return { type: type, f1: f1, f2: f2, poly: expandPair(f1, f2) };
  }
  function pickDelta() {
    var d = randInt(1, 2);
    return Math.random() < 0.5 ? -d : d;
  }
  function buildOptions(problem) {
    var options = [{ f1: problem.f1, f2: problem.f2, text: fmtPair(problem.f1, problem.f2) }];
    var guard = 0;
    while (options.length < 4 && guard < 300) {
      guard++;
      var g1 = { m: problem.f1.m, c: problem.f1.c };
      var g2 = { m: problem.f2.m, c: problem.f2.c };
      var r = Math.random();
      if (g1.c === 0) {
        if (r < 0.5) g2.c += pickDelta();
        else g1.m = Math.max(2, g1.m + (Math.random() < 0.5 ? -1 : 1));
      } else if (r < 0.4) {
        g1.c += pickDelta();
      } else if (r < 0.8) {
        g2.c += pickDelta();
      } else {
        g1.c += pickDelta();
        g2.c -= pickDelta();
      }
      if (g1.c === 0 && problem.f1.c !== 0) continue;
      if (g2.c === 0 && problem.f2.c !== 0) continue;
      var poly = expandPair(g1, g2);
      if (samePoly(poly, problem.poly)) continue;
      var text = fmtPair(g1, g2);
      var dup = false;
      for (var i = 0; i < options.length; i++) {
        if (options[i].text === text) { dup = true; break; }
        if (samePoly(expandPair(options[i].f1, options[i].f2), poly)) { dup = true; break; }
      }
      if (dup) continue;
      options.push({ f1: g1, f2: g2, text: text });
    }
    var shift = 3;
    while (options.length < 4 && shift < 12) {
      var h1 = { m: 1, c: problem.f1.c + shift };
      var h2 = { m: 1, c: problem.f2.c - shift };
      shift++;
      if (samePoly(expandPair(h1, h2), problem.poly)) continue;
      var t = fmtPair(h1, h2);
      var exists = false;
      for (var j = 0; j < options.length; j++) {
        if (options[j].text === t) { exists = true; break; }
      }
      if (exists) continue;
      options.push({ f1: h1, f2: h2, text: t });
    }
    for (var k = options.length - 1; k > 0; k--) {
      var idx = randInt(0, k);
      var tmp = options[k]; options[k] = options[idx]; options[idx] = tmp;
    }
    return options;
  }

  /* ---------- 토스트 & 플로어 모달 (alert/prompt 금지) ---------- */
  function showToast(msg, type) {
    var wrap = $('#fb-toast-wrap');
    if (!wrap) return;
    var t = document.createElement('div');
    t.className = 'fb-toast' + (type && type !== 'info' ? ' fb-' + type : '');
    t.innerHTML = msg;
    wrap.appendChild(t);
    setTimeout(function () {
      t.style.transition = 'opacity .3s';
      t.style.opacity = '0';
      setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 320);
    }, 1800);
  }
  function openModal(html) {
    var overlay = $('#fb-modal');
    var card = $('#fb-modal-card');
    if (!overlay || !card) return;
    card.innerHTML = html;
    overlay.classList.add('fb-open');
  }
  function closeModal() {
    var overlay = $('#fb-modal');
    if (overlay) overlay.classList.remove('fb-open');
  }
  function bindModalClose() {
    var btn = $('#fb-modal-close');
    if (btn) btn.addEventListener('click', closeModal);
  }

  function showGuideModal() {
    openModal(
      '<h3>📖 게임 방법</h3>' +
      '<ul class="fb-guide-list">' +
      '<li>화면 위에서 다항식 블록(예: <code>x² + 5x + 6</code>)이 내려옵니다.</li>' +
      '<li>아래 4개의 선택지 중 올바른 인수분해 결과(예: <code>(x + 2)(x + 3)</code>)를 고르세요. 키보드 <code>1</code>~<code>4</code>로도 선택할 수 있습니다.</li>' +
      '<li>정답이면 블록이 파괴되고 점수와 콤보가 오릅니다. 오답이면 낙하 속도가 빨라집니다!</li>' +
      '<li>블록이 바닥 경고선에 닿으면 라이프가 1 감소하고, 라이프 소진 시 게임이 끝납니다.</li>' +
      '<li>블록 5개를 파괴할 때마다 라운드가 올라가고 계수 범위·공식 유형이 확장됩니다.</li>' +
      '</ul>' +
      '<h3>🧮 수학 개념</h3>' +
      '<ul class="fb-guide-list">' +
      '<li><b>기본 인수분해</b>: <code>x² + (p+q)x + pq = (x+p)(x+q)</code> — 합과 곱의 관계</li>' +
      '<li><b>공통인수 묶기</b>: <code>kx² + kpx = kx(x+p)</code></li>' +
      '<li><b>완전제곱식</b>: <code>x² + 2px + p² = (x+p)(x+p)</code></li>' +
      '<li><b>합차 공식</b>: <code>a² - b² = (a+b)(a-b)</code></li>' +
      '</ul>' +
      '<h3>⭐ 점수 규칙</h3>' +
      '<ul class="fb-guide-list">' +
      '<li>파괴 성공 +10점 × 콤보 배수 (연속 3회 x2, 연속 6회 이상 x3 최대)</li>' +
      '<li>공식 유형(공통인수·완전제곱식·합차) 보너스 +5점</li>' +
      '<li>라운드 클리어 +20점 / 오답 시 콤보 초기화 + 낙하 가속 페널티</li>' +
      '</ul>' +
      '<div class="fb-modal-btns"><button type="button" class="fb-btn" id="fb-modal-close">닫기</button></div>'
    );
    bindModalClose();
  }

  /* ---------- 명예의 전당 (하단 상시 보드 + 플로어 모달) ---------- */
  function getLocalRanking() {
    try { return JSON.parse(localStorage.getItem(LS_KEY) || '[]'); } catch (e) { return []; }
  }
  function rankingListHTML(list) {
    if (!list.length) {
      return '<p style="text-align:center; color:#64748b; padding:12px 0;">아직 등록된 기록이 없습니다. 첫 번째 도전을 완료해보세요!</p>';
    }
    var html = '';
    for (var i = 0; i < Math.min(list.length, 5); i++) {
      var item = list[i];
      html += '<div class="fb-rank-row">' +
        '<span style="font-weight:800; color:' + (i === 0 ? '#d97706' : '#475569') + ';">' +
        (i === 0 ? '👑 1위' : (i + 1) + '위') + ' - ' + escapeHTML(item.nickname) + '</span>' +
        '<span style="color:#0284c7; font-weight:900;">' + Number(item.score) + '점</span></div>';
    }
    return html;
  }
  function renderBottomLeaderboard() {
    var bottomEl = document.getElementById('board-factor-breaker-bottom');
    if (!bottomEl) return;
    if (typeof window.loadGameLeaderboard === 'function') {
      try { window.loadGameLeaderboard(APP_ID, true, 'board-factor-breaker-bottom'); return; } catch (e) {}
    }
    bottomEl.innerHTML = rankingListHTML(getLocalRanking());
  }
  function showRankingModal() {
    openModal(
      '<h3>🏆 명예의 전당 TOP 5</h3>' +
      '<div>' + rankingListHTML(getLocalRanking()) + '</div>' +
      '<div class="fb-modal-btns"><button type="button" class="fb-btn" id="fb-modal-close">닫기</button></div>'
    );
    bindModalClose();
  }
  function saveScore(nickname, score) {
    var list = getLocalRanking();
    list.push({ nickname: nickname, score: score, date: new Date().toISOString().slice(0, 10) });
    list.sort(function (a, b) { return b.score - a.score; });
    list = list.slice(0, 20);
    try { localStorage.setItem(LS_KEY, JSON.stringify(list)); } catch (e) {}
    if (typeof window.submitRanking === 'function') {
      try { window.submitRanking(APP_ID, score, true, nickname, 'board-factor-breaker-bottom'); } catch (e) {}
    } else if (typeof window.submitRankingScore === 'function') {
      try { window.submitRankingScore(BOARD_ID, nickname, score); } catch (e) {}
    } else if (typeof window.saveGameScore === 'function') {
      try { window.saveGameScore(APP_ID, nickname, score); } catch (e) {}
    }
    renderBottomLeaderboard();
  }

  /* ---------- HUD & 렌더링 ---------- */
  function comboMult() {
    if (state.combo >= 6) return 3;
    if (state.combo >= 3) return 2;
    return 1;
  }
  function updateHud() {
    var s = $('#fb-score'); if (s) s.textContent = state.score;
    var l = $('#fb-lives'); if (l) l.textContent = state.lives;
    var c = $('#fb-combo'); if (c) c.textContent = state.combo;
    var m = $('#fb-mult'); if (m) m.textContent = comboMult();
    var r = $('#fb-round'); if (r) r.textContent = state.round;
  }
  function renderProblem() {
    var block = $('#fb-block');
    if (!block || !state.problem) return;
    block.classList.remove('fb-boom', 'fb-shake');
    block.style.display = '';
    block.style.top = '0%';
    block.innerHTML = '<span class="fb-type-tag">' + TYPE_LABEL[state.problem.type] + '</span>' + fmtPoly(state.problem.poly);
    var wrap = $('#fb-options');
    if (!wrap) return;
    var html = '';
    for (var i = 0; i < state.options.length; i++) {
      html += '<button type="button" class="fb-option" data-idx="' + i + '"><span class="fb-key">' + (i + 1) + '</span>' + state.options[i].text + '</button>';
    }
    wrap.innerHTML = html;
  }
  function spawnBlock() {
    state.problem = generateProblem();
    state.options = buildOptions(state.problem);
    state.blockY = 0;
    state.waiting = false;
    renderProblem();
  }

  /* ---------- 게임 판정 ---------- */
  function handleAnswer(idx) {
    if (!state.running || state.paused || state.waiting || state.over) return;
    var opt = state.options[idx];
    if (!opt || !state.problem) return;
    var chosen = expandPair(opt.f1, opt.f2);
    if (samePoly(chosen, state.problem.poly)) {
      state.combo += 1;
      if (state.combo > state.bestCombo) state.bestCombo = state.combo;
      var mult = comboMult();
      var gain = 10 * mult;
      if (state.problem.type !== 'basic') gain += 5;
      state.score += gain;
      state.cleared += 1;
      state.waiting = true;
      var block = $('#fb-block');
      if (block) block.classList.add('fb-boom');
      showToast('💥 파괴 성공! +' + gain + '점' + (mult > 1 ? ' (콤보 x' + mult + ')' : ''), 'success');
      updateHud();
      if (state.boomTimer) clearTimeout(state.boomTimer);
      state.boomTimer = setTimeout(function () {
        if (state.over || !state.running) return;
        if (state.cleared % 5 === 0) {
          state.round += 1;
          state.score += 20;
          state.baseSpeed = Math.min(state.baseSpeed * 1.12, 1.2);
          showToast('🚩 라운드 ' + state.round + ' 시작! 클리어 보너스 +20점', 'info');
        }
        state.speed = state.baseSpeed;
        updateHud();
        spawnBlock();
      }, 320);
    } else {
      state.combo = 0;
      state.speed = Math.min(state.speed * 1.35, state.baseSpeed * 3.2);
      var blockEl = $('#fb-block');
      if (blockEl) {
        blockEl.classList.remove('fb-shake');
        void blockEl.offsetWidth;
        blockEl.classList.add('fb-shake');
      }
      showToast('❌ 오답! 낙하 속도가 빨라집니다', 'error');
      updateHud();
    }
  }
  function hitFloor() {
    state.combo = 0;
    state.lives -= 1;
    updateHud();
    if (state.lives <= 0) {
      showToast('💔 라이프 소진! 게임 종료', 'error');
      endGame();
      return;
    }
    showToast('💔 블록이 바닥에 닿았습니다! 라이프 -1', 'warn');
    state.speed = state.baseSpeed;
    spawnBlock();
  }
  function tick() {
    if (!state.running || state.paused || state.waiting || state.over) return;
    state.blockY += state.speed;
    var block = $('#fb-block');
    if (block) block.style.top = Math.min(state.blockY, 92) + '%';
    if (state.blockY >= 92) hitFloor();
  }

  /* ---------- 시작·일시정지·종료·리셋 ---------- */
  function startGame(difficulty) {
    if (!DIFF_PRESET[difficulty]) difficulty = 'normal';
    state.difficulty = difficulty;
    state.baseSpeed = DIFF_PRESET[difficulty].speed;
    state.speed = state.baseSpeed;
    state.score = 0; state.lives = 3; state.combo = 0; state.bestCombo = 0;
    state.round = 1; state.cleared = 0;
    state.over = false; state.running = true; state.paused = false;
    var startEl = $('#fb-start'); if (startEl) startEl.style.display = 'none';
    var pauseBtn = $('#fb-pause-btn'); if (pauseBtn) pauseBtn.textContent = '⏸️ 일시정지';
    updateHud();
    spawnBlock();
    if (state.loopId) clearInterval(state.loopId);
    state.loopId = setInterval(tick, 40);
    showToast('🧨 ' + DIFF_PRESET[difficulty].label + ' 난이도 시작! 인수분해로 블록을 파괴하세요!', 'info');
  }
  function togglePause() {
    if (state.over || !state.running) return;
    state.paused = !state.paused;
    var pauseBtn = $('#fb-pause-btn');
    if (pauseBtn) pauseBtn.textContent = state.paused ? '▶️ 계속하기' : '⏸️ 일시정지';
    showToast(state.paused ? '⏸️ 일시정지되었습니다' : '▶️ 게임을 계속합니다', 'info');
  }
  function showGameOverModal() {
    openModal(
      '<h3>💥 게임 종료!</h3>' +
      '<div class="fb-result-grid">' +
      '<div class="fb-stat">⭐ 최종 점수 <b>' + state.score + '</b></div>' +
      '<div class="fb-stat">🔥 최고 콤보 <b>' + state.bestCombo + '</b></div>' +
      '<div class="fb-stat">🚩 도달 라운드 <b>' + state.round + '</b></div>' +
      '</div>' +
      '<p style="color:#64748b; margin:12px 0 0;">명예의 전당에 기록을 남겨보세요!</p>' +
      '<input class="fb-input" id="fb-nickname" maxlength="12" placeholder="닉네임 (최대 12자)">' +
      '<div class="fb-modal-btns">' +
      '<button type="button" class="fb-btn fb-btn-primary" id="fb-save-btn">💾 기록 등록</button>' +
      '<button type="button" class="fb-btn" id="fb-retry-btn">🔄 다시 도전</button>' +
      '<button type="button" class="fb-btn" id="fb-close-btn">닫기</button>' +
      '</div>'
    );
    var saveBtn = $('#fb-save-btn');
    var retryBtn = $('#fb-retry-btn');
    var closeBtn = $('#fb-close-btn');
    if (saveBtn) saveBtn.addEventListener('click', function () {
      var input = $('#fb-nickname');
      var nickname = input ? input.value.trim() : '';
      if (!nickname) { showToast('닉네임을 입력해주세요!', 'warn'); return; }
      saveScore(nickname, state.score);
      closeModal();
      showToast('🏆 명예의 전당에 등록되었습니다!', 'success');
      resetGame(true);
    });
    if (retryBtn) retryBtn.addEventListener('click', function () { closeModal(); resetGame(true); });
    if (closeBtn) closeBtn.addEventListener('click', function () { closeModal(); resetGame(true); });
  }
  function endGame() {
    state.over = true;
    state.running = false;
    if (state.loopId) { clearInterval(state.loopId); state.loopId = null; }
    var block = $('#fb-block'); if (block) block.style.display = 'none';
    showGameOverModal();
  }
  function stopTimers() {
    if (state.loopId) { clearInterval(state.loopId); state.loopId = null; }
    if (state.boomTimer) { clearTimeout(state.boomTimer); state.boomTimer = null; }
  }
  function resetGame(showStart) {
    stopTimers();
    state.running = false; state.paused = false; state.over = true; state.waiting = false;
    state.score = 0; state.lives = 3; state.combo = 0; state.bestCombo = 0; state.round = 1; state.cleared = 0;
    updateHud();
    var block = $('#fb-block'); if (block) block.style.display = 'none';
    var wrap = $('#fb-options'); if (wrap) wrap.innerHTML = '';
    var pauseBtn = $('#fb-pause-btn'); if (pauseBtn) pauseBtn.textContent = '⏸️ 일시정지';
    var startEl = $('#fb-start');
    if (startEl && showStart !== false) startEl.style.display = 'flex';
  }

  /* ---------- 홈 복귀 (컨테이너 정리 → 대시보드 복원 → 표준 브리지) ---------- */
  function goHomeSafely() {
    stopTimers();
    closeModal();
    state.running = false; state.over = true;
    var view = document.getElementById('mathlab-view');
    var host = document.getElementById('factor-breaker-force-host');
    [view, host].forEach(function (el) {
      if (el) { el.style.display = 'none'; el.innerHTML = ''; }
    });
    state.mounted = false;
    document.querySelectorAll('.app-grid, #dashboard-screen, .dashboard-screen').forEach(function (el) {
      if (el && el.style) el.style.display = '';
    });
    
    if (typeof window.goHome === 'function') window.goHome();
  }
  function destroy() {
    stopTimers();
    state.running = false; state.paused = false; state.over = true; state.waiting = false;
    if (state.keyHandler) {
      document.removeEventListener('keydown', state.keyHandler);
      state.keyHandler = null;
    }
    state.mounted = false;
  }

  /* ---------- 마운트 (자가 복구 + 푸터 위 삽입 + 부모 가시화 방어막) ---------- */
  function buildHTML() {
    return '' +
      '<div class="game-factor-breaker" id="fb-root">' +
      '<div class="fb-header">' +
      '<div class="fb-title">🧨 다항식 인수분해 브레이커</div>' +
      '<div class="fb-header-btns">' +
      '<button type="button" class="fb-btn" id="fb-guide-btn">📖 게임 방법</button>' +
      '<button type="button" class="fb-btn" id="fb-rank-btn">🏆 명예의 전당</button>' +
      '<button type="button" class="fb-btn fb-btn-home" id="fb-home-btn">🏠 홈으로</button>' +
      '</div></div>' +
      '<div class="fb-status">' +
      '<div class="fb-stat">⭐ 점수 <b id="fb-score">0</b></div>' +
      '<div class="fb-stat">❤️ 라이프 <b id="fb-lives">3</b></div>' +
      '<div class="fb-stat">🔥 콤보 <b id="fb-combo">0</b> · 배수 x<b id="fb-mult">1</b></div>' +
      '<div class="fb-stat">🚩 라운드 <b id="fb-round">1</b></div>' +
      '<button type="button" class="fb-btn" id="fb-pause-btn">⏸️ 일시정지</button>' +
      '</div>' +
      '<div class="fb-arena" id="fb-arena">' +
      '<div class="fb-block" id="fb-block" style="display:none;"></div>' +
      '<div class="fb-floor"></div>' +
      '<div class="fb-start" id="fb-start">' +
      '<div class="fb-start-title">🧨 다항식 인수분해 브레이커</div>' +
      '<p class="fb-start-desc">위에서 내려오는 다항식 블록을 올바른 인수분해 선택지로 파괴하세요!<br>난이도를 선택하면 게임이 시작됩니다.</p>' +
      '<div class="fb-diff-btns">' +
      '<button type="button" class="fb-btn fb-btn-diff" data-diff="easy">🌱 쉬움</button>' +
      '<button type="button" class="fb-btn fb-btn-diff" data-diff="normal">🌊 보통</button>' +
      '<button type="button" class="fb-btn fb-btn-diff" data-diff="hard">🔥 도전</button>' +
      '</div></div></div>' +
      '<div class="fb-options" id="fb-options"></div>' +
      '<div class="bottom-ranking-card" id="fb-bottom-ranking-sec">' +
      '<div class="ranking-header"><div class="ranking-title">🏆 명예의 전당 (실시간 랭킹 보드)</div></div>' +
      '<div id="board-factor-breaker-bottom"><p style="text-align:center; color:#64748b; padding:12px 0;">랭킹 데이터를 불러오는 중...</p></div>' +
      '</div>' +
      '<div class="fb-modal-overlay" id="fb-modal"><div class="fb-modal-card" id="fb-modal-card"></div></div>' +
      '<div class="fb-toast-wrap" id="fb-toast-wrap"></div>' +
      '</div>';
  }
  function bindEvents() {
    var guideBtn = $('#fb-guide-btn');
    var rankBtn = $('#fb-rank-btn');
    var homeBtn = $('#fb-home-btn');
    var pauseBtn = $('#fb-pause-btn');
    var startEl = $('#fb-start');
    var optionsEl = $('#fb-options');
    var overlay = $('#fb-modal');
    if (guideBtn) guideBtn.addEventListener('click', showGuideModal);
    if (rankBtn) rankBtn.addEventListener('click', showRankingModal);
    if (homeBtn) homeBtn.addEventListener('click', goHomeSafely);
    if (pauseBtn) pauseBtn.addEventListener('click', togglePause);
    if (startEl) startEl.addEventListener('click', function (ev) {
      var btn = ev.target && ev.target.closest ? ev.target.closest('.fb-btn-diff') : null;
      if (btn) startGame(btn.getAttribute('data-diff'));
    });
    if (optionsEl) optionsEl.addEventListener('click', function (ev) {
      var btn = ev.target && ev.target.closest ? ev.target.closest('.fb-option') : null;
      if (btn) handleAnswer(parseInt(btn.getAttribute('data-idx'), 10));
    });
    if (overlay) overlay.addEventListener('click', function (ev) {
      if (ev.target === overlay) closeModal();
    });
    if (state.keyHandler) document.removeEventListener('keydown', state.keyHandler);
    state.keyHandler = function (ev) {
      if (!state.mounted) return;
      if (ev.key >= '1' && ev.key <= '4') handleAnswer(parseInt(ev.key, 10) - 1);
      else if (ev.key === 'p' || ev.key === 'P') togglePause();
    };
    document.addEventListener('keydown', state.keyHandler);
  }
  function mount(container, context) {
    var host = null;
    if (typeof container === 'string') host = document.querySelector(container);
    else if (container instanceof HTMLElement) host = container;
    if (!host && window.MathLabUtils && typeof window.MathLabUtils.getMountContainer === 'function') {
      try { host = window.MathLabUtils.getMountContainer(container); } catch (e) { host = null; }
    }
    if (!host || !(host instanceof HTMLElement)) {
      host = document.getElementById('mathlab-view') || document.getElementById('new-root') || document.getElementById('game-container');
    }
    if (!host || !(host instanceof HTMLElement) || host === document.body) {
      var createdHost = document.getElementById('factor-breaker-force-host');
      if (!createdHost) {
        createdHost = document.createElement('div');
        createdHost.id = 'factor-breaker-force-host';
        document.body.appendChild(createdHost);
      }
      host = createdHost;
    }
    var footerEl = document.querySelector('footer, #footer, .app-footer');
    if (footerEl && host && typeof host.compareDocumentPosition === 'function' &&
        (host.compareDocumentPosition(footerEl) & Node.DOCUMENT_POSITION_PRECEDING)) {
      try { footerEl.parentNode.insertBefore(host, footerEl); } catch (e) {}
    }
    host.style.display = '';
    host.style.visibility = 'visible';
    host.style.opacity = '1';
    var parent = host.parentElement;
    while (parent && parent !== document.body && parent !== document.documentElement) {
      if (parent.style && parent.style.display === 'none') parent.style.display = 'block';
      if (parent.style && parent.style.visibility === 'hidden') parent.style.visibility = 'visible';
      parent = parent.parentElement;
    }
    document.querySelectorAll('header, .navbar, #app-header, .top-bar, #floating-home-btn, .floating-home').forEach(function (el) {
      if (el && el.style && el.style.display === 'none') el.style.display = '';
    });
    host.innerHTML = buildHTML();
    state.mounted = true;
    bindEvents();
    resetGame(true);
    renderBottomLeaderboard();
  }

  /* ---------- 모듈 공개 ---------- */
  var FactorBreaker = {
    __gen3: true,
    mount: mount,
    resetGame: resetGame,
    destroy: destroy,
    goHome: goHomeSafely
  };
  window.FactorBreaker = FactorBreaker;

  /* ---------- Gen-3 3중 자율 등록 & 상호 실행 브리지 (즉시 마운트 금지) ---------- */
  function registerFactorBreaker() {
    if (typeof window.MathLabGames !== 'undefined' && typeof window.MathLabGames.register === 'function') {
      var exists = false;
      try { exists = typeof window.MathLabGames.get === 'function' && !!window.MathLabGames.get(APP_ID); } catch (e) { exists = false; }
      if (!exists) {
        try {
          window.MathLabGames.register({
            id: APP_ID,
            title: APP_TITLE,
            icon: '🧨',
            sourceType: 'new',
            players: '1인',
            isMultiplayer: false,
            mount: function (container, context) { FactorBreaker.mount(container, context); },
            reset: function () { FactorBreaker.resetGame(true); },
            destroy: function () { FactorBreaker.destroy(); },
            goHome: function () { FactorBreaker.goHome(); }
          });
        } catch (e) {
          console.warn('factor-breaker 안전 등록 방어:', e);
        }
      }
    }
  }
  registerFactorBreaker();
  window.addEventListener('DOMContentLoaded', registerFactorBreaker);
  setTimeout(registerFactorBreaker, 100);
  setTimeout(registerFactorBreaker, 500);

  window.initFactorBreakerGame = function () {
    registerFactorBreaker();
    if (window.LegacyBridge && typeof window.LegacyBridge.hideAllLegacySections === 'function') {
      window.LegacyBridge.hideAllLegacySections();
      if (typeof window.LegacyBridge.showNewRoot === 'function') window.LegacyBridge.showNewRoot();
    }
    if (typeof window.MathLabGames !== 'undefined' && typeof window.MathLabGames.mount === 'function') {
      try { window.MathLabGames.mount(APP_ID); return; } catch (e) {}
    }
    var targetEl = document.getElementById('mathlab-view') || document.getElementById('new-root');
    FactorBreaker.mount(targetEl);
  };
  window.launchFactorBreakerGame = function () { window.initFactorBreakerGame(); };
})();
</script>
