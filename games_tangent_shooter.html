<!--
  수학 실험실 Gen-3 신규 앱: 미분계수 접선 슈터 (games_tangent_shooter.html)
  - id: tangent-shooter / 아이콘: 📐 (기존 🏹는 극한값 타겟 슈팅과 중복이므로 교체)
  - 순수 (style) + (script) 스니펫 구조 (DOCTYPE/html/head/body 래퍼 없음)
  - 라이트(화이트) 테마 · mathlab_gen3_standard 스킬 준수
  - index.html에는 <?!= include('games_tangent_shooter'); ?> 1줄만 추가
-->
<style>

  .game-tangent-shooter * { box-sizing: border-box; }

  .game-tangent-shooter .tns-title { font-size: 1.45rem; font-weight: 900; color: #0f172a; margin: 0; }
  .game-tangent-shooter .tns-btn { border: 1px solid #cbd5e1; background: #ffffff; color: #1e293b; font-weight: 700; padding: 8px 14px; border-radius: 10px; cursor: pointer; font-size: 0.92rem; transition: background 0.15s, transform 0.1s; }
  .game-tangent-shooter .tns-btn:hover { background: #f1f5f9; }

  .game-tangent-shooter .tns-btn.tns-primary:hover { background: #0369a1; }
  .game-tangent-shooter .tns-btn.tns-warn { background: #fffbeb; border-color: #fcd34d; color: #b45309; }
  .game-tangent-shooter .tns-mode-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .game-tangent-shooter .tns-mode-btn { flex: 1; min-width: 110px; padding: 9px 10px; border-radius: 10px; border: 1px solid #cbd5e1; background: #ffffff; color: #475569; font-weight: 800; cursor: pointer; font-size: 0.92rem; }
  .game-tangent-shooter .tns-mode-btn.active { background: #e0f2fe; border-color: #0284c7; color: #0369a1; }
  .game-tangent-shooter .tns-status { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .game-tangent-shooter .tns-chip { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 999px; padding: 6px 14px; font-size: 0.9rem; color: #475569; font-weight: 700; }
  .game-tangent-shooter .tns-chip b { color: #0284c7; }
  .game-tangent-shooter .tns-mission { background: #f0f9ff; border: 1px solid #bae6fd; border-radius: 12px; padding: 10px 14px; font-size: 0.95rem; color: #0f172a; margin-bottom: 10px; }
  .game-tangent-shooter .tns-canvas-wrap { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 10px; margin-bottom: 10px; }
  .game-tangent-shooter .tns-canvas-wrap canvas { display: block; width: 100%; height: auto; border-radius: 10px; background: #ffffff; }
  .game-tangent-shooter .tns-legend { font-size: 0.82rem; color: #64748b; margin: 8px 2px 0; line-height: 1.5; }
  .game-tangent-shooter .tns-info-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
  .game-tangent-shooter .tns-slope-box { flex: 1; min-width: 180px; background: #ffffff; border: 1px dashed #cbd5e1; border-radius: 12px; padding: 9px 14px; font-family: 'Consolas', monospace; font-weight: 800; color: #0369a1; font-size: 1rem; text-align: center; }
  .game-tangent-shooter .tns-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .game-tangent-shooter .tns-actions .tns-btn { flex: 1; min-width: 120px; padding: 12px 10px; font-size: 1.02rem; }
  .game-tangent-shooter .bottom-ranking-card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 14px 16px; }
  .game-tangent-shooter .ranking-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .game-tangent-shooter .ranking-title { font-weight: 900; color: #0f172a; font-size: 1.02rem; }
  .game-tangent-shooter .tns-modal-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.45); display: flex; align-items: center; justify-content: center; z-index: 9000; padding: 16px; }
  .game-tangent-shooter .tns-modal { background: #ffffff; border-radius: 16px; max-width: 520px; width: 100%; max-height: 82vh; overflow-y: auto; padding: 22px 24px; box-shadow: 0 18px 50px rgba(15, 23, 42, 0.25); color: #1e293b; line-height: 1.6; }
  .game-tangent-shooter .tns-modal h3 { color: #0f172a; }
  .game-tangent-shooter .tns-modal code { background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 6px; padding: 1px 6px; font-size: 0.88em; color: #0369a1; }
  .game-tangent-shooter .tns-modal input[type="text"] { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 1rem; color: #0f172a; background: #f8fafc; }
  .game-tangent-shooter .tns-toast { position: fixed; top: 24px; left: 50%; transform: translateX(-50%) translateY(-16px); background: #0f172a; color: #f8fafc; padding: 11px 20px; border-radius: 12px; font-weight: 700; font-size: 0.95rem; z-index: 9500; opacity: 0; pointer-events: none; transition: opacity 0.25s, transform 0.25s; max-width: 90vw; text-align: center; }
  .game-tangent-shooter .tns-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .game-tangent-shooter .tns-toast.success { background: #059669; }
  .game-tangent-shooter .tns-toast.error { background: #dc2626; }
  .game-tangent-shooter .tns-toast.warn { background: #d97706; }
  @media (max-width: 640px) {
    .game-tangent-shooter .tns-title { font-size: 1.2rem; }
    .game-tangent-shooter .tns-actions .tns-btn { min-width: 96px; }
  }
</style>
<script>
(function () {
  'use strict';

  var APP_ID = 'tangent-shooter';
  var APP_TITLE = '미분계수 접선 슈터';
  var BOTTOM_BOARD_ID = 'board-tangent-shooter-bottom';
  var LS_KEY = 'mathlab_lb_tangent_shooter';
  var TOTAL_ROUNDS = 5;
  var CV_W = 900;
  var CV_H = 520;
  var X_MIN = -4.5;
  var X_MAX = 4.5;
  var Y_MIN = -5.5;
  var Y_MAX = 5.5;

  var DIFF_RULE = {
    easy:   { label: '\ud83c\udf31 쉬움',  curve: 'quad',  preview: true,  targetSpeed: 0.45, spawnGap: 2600, hitsToClear: 3, timeLimit: 0,  special: false },
    normal: { label: '\ud83c\udf3f 보통',  curve: 'cubic', preview: false, targetSpeed: 0.7,  spawnGap: 2200, hitsToClear: 4, timeLimit: 0,  special: true },
    hard:   { label: '\ud83d\udd25 도전',  curve: 'mixed', preview: false, targetSpeed: 1.0,  spawnGap: 1800, hitsToClear: 4, timeLimit: 60, special: true }
  };

  var state = {
    mounted: false,
    host: null,
    difficulty: 'easy',
    round: 1,
    score: 0,
    combo: 0,
    hits: 0,
    hitsThisRound: 0,
    finished: false,
    busy: false,
    paused: false,
    coeffs: [0, 0, 1, 0],
    pointX: X_MIN,
    pointDir: 1,
    targets: [],
    bullets: [],
    lastSpawn: 0,
    lastFrame: 0,
    reqId: null,
    timerInterval: null,
    roundStart: 0,
    pendingTimeouts: []
  };

  /* ---------- 유틸 ---------- */
  function byId(id) { return document.getElementById(id); }
  function setText(id, v) { var el = byId(id); if (el) el.textContent = String(v); }
  function escapeHTML(str) {
    return String(str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function fmtNum(v) {
    var r = Math.round(v * 100) / 100;
    return String(r);
  }
  var toastTimeout = null;
  function showToast(msg, type) {
    var el = byId('tns-toast');
    if (!el) return;
    el.textContent = msg;
    el.className = 'tns-toast show' + (type ? ' ' + type : '');
    if (toastTimeout) clearTimeout(toastTimeout);
    toastTimeout = setTimeout(function () { el.className = 'tns-toast'; }, 2300);
  }
  function closeModal() {
    var overlay = byId('tns-modal-overlay');
    if (overlay && overlay.parentNode) overlay.parentNode.removeChild(overlay);
  }
  function openModal(innerHTML) {
    closeModal();
    if (!state.host) return;
    var root = state.host.querySelector('.game-tangent-shooter');
    if (!root) return;
    var overlay = document.createElement('div');
    overlay.className = 'tns-modal-overlay';
    overlay.id = 'tns-modal-overlay';
    overlay.innerHTML = '<div class="tns-modal">' + innerHTML + '</div>';
    overlay.addEventListener('click', function (ev) { if (ev.target === overlay) closeModal(); });
    root.appendChild(overlay);
  }
  function clearPendingTimeouts() {
    if (state.pendingTimeouts && state.pendingTimeouts.length) {
      state.pendingTimeouts.forEach(function (tid) { clearTimeout(tid); });
    }
    state.pendingTimeouts = [];
  }

  /* ---------- 곱선 생성 및 미분 엔진 ---------- */
  function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
  function randPick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function genCurve() {
    var rule = DIFF_RULE[state.difficulty];
    var kind = rule.curve;
    if (kind === 'mixed') kind = state.round >= 3 ? 'cubic' : randPick(['quad', 'cubic']);
    if (kind === 'quad') {
      var a2 = randPick([-0.5, -0.4, 0.4, 0.5, 0.6]);
      var b2 = randPick([-1, -0.5, 0, 0.5, 1]);
      var c2 = randInt(-2, 2);
      state.coeffs = [0, a2, b2, c2];
    } else {
      var a3 = randPick([-0.12, -0.1, 0.1, 0.12, 0.15]);
      var b3 = randPick([-0.4, -0.2, 0, 0.2, 0.4]);
      var c3 = randPick([-1.5, -1, 1, 1.5]);
      var d3 = randInt(-1, 1);
      state.coeffs = [a3, b3, c3, d3];
    }
  }
  function fx(x) {
    var c = state.coeffs;
    return c[0] * x * x * x + c[1] * x * x + c[2] * x + c[3];
  }
  function fpx(x) {
    var c = state.coeffs;
    return 3 * c[0] * x * x + 2 * c[1] * x + c[2];
  }
  function curveText() {
    var c = state.coeffs;
    var parts = [];
    function term(coef, pow) {
      if (Math.abs(coef) < 1e-9) return;
      var sign = coef >= 0 ? (parts.length ? ' + ' : '') : (parts.length ? ' - ' : '-');
      var mag = Math.abs(Math.round(coef * 100) / 100);
      var body;
      if (pow === 0) body = String(mag);
      else if (pow === 1) body = (mag === 1 ? '' : String(mag)) + 'x';
      else body = (mag === 1 ? '' : String(mag)) + 'x^' + pow;
      parts.push(sign + body);
    }
    term(c[0], 3); term(c[1], 2); term(c[2], 1); term(c[3], 0);
    if (!parts.length) parts.push('0');
    return 'f(x) = ' + parts.join('');
  }

  /* ---------- 좌표 변환 계층 (수학 ↔ 화면, 기울기 부호 혼동 방지) ---------- */
  function mxToS(x) { return (x - X_MIN) / (X_MAX - X_MIN) * CV_W; }
  function myToS(y) { return CV_H - (y - Y_MIN) / (Y_MAX - Y_MIN) * CV_H; }
  function clampY(y) { return Math.max(Y_MIN + 0.2, Math.min(Y_MAX - 0.2, y)); }

  /* ---------- 타겟 생성 ---------- */
  function spawnTarget() {
    var rule = DIFF_RULE[state.difficulty];
    if (state.targets.length >= 3) return;
    var types = ['normal', 'normal'];
    if (rule.special) {
      types.push('slope');
      if (state.difficulty === 'hard') { types.push('extremum'); types.push('increase'); }
    }
    var type = randPick(types);
    var t = {
      type: type,
      x: Math.random() < 0.5 ? X_MIN + 0.4 : X_MAX - 0.4,
      y: 2.2 + Math.random() * 2.6,
      vx: 0,
      r: 0.42,
      reqSlope: 0,
      label: ''
    };
    t.vx = (t.x < 0 ? 1 : -1) * rule.targetSpeed * (0.8 + Math.random() * 0.5);
    if (type === 'slope') {
      t.reqSlope = randPick([-2, -1, 1, 2]);
      t.label = "f'=" + t.reqSlope;
    } else if (type === 'extremum') {
      t.label = "f'=0";
    } else if (type === 'increase') {
      t.label = '증가구간';
    }
    state.targets.push(t);
  }

  /* ---------- 발사 ---------- */
  function fire() {
    if (state.finished || state.busy || state.paused || !state.mounted) return;
    var x0 = state.pointX;
    var y0 = fx(x0);
    var m = fpx(x0);
    var len = Math.sqrt(1 + m * m);
    state.bullets.push({
      x: x0, y: y0,
      dx: 1 / len, dy: m / len,
      slope: m,
      dir: state.pointDir >= 0 ? 1 : -1,
      dist: 0
    });
    var b = state.bullets[state.bullets.length - 1];
    if (b.dir < 0) { b.dx = -b.dx; b.dy = -b.dy; }
    setText('tns-slope', "f'(" + fmtNum(x0) + ') = ' + fmtNum(m));
  }

  /* ---------- 명중 판정 ---------- */
  function judgeHit(bullet, target) {
    var m = bullet.slope;
    if (target.type === 'slope') {
      if (Math.abs(m - target.reqSlope) > 0.35) {
        missCondition('요구 기울기 ' + target.reqSlope + ' 지점이 아닙니다! (발사 순간 f&#39; = ' + fmtNum(m) + ')');
        return 0;
      }
      return 20;
    }
    if (target.type === 'extremum') {
      if (Math.abs(m) > 0.18) {
        missCondition('극값 지점(f&#39;=0)이 아닙니다! (발사 순간 f&#39; = ' + fmtNum(m) + ')');
        return 0;
      }
      return 25;
    }
    if (target.type === 'increase') {
      if (m <= 0.05) {
        missCondition('증가 구간(f&#39;&gt;0)에서 발사해야 명중 인정! (f&#39; = ' + fmtNum(m) + ')');
        return 0;
      }
      return 15;
    }
    return 10;
  }
  function missCondition(msg) {
    state.combo = 0;
    updateStatus();
    var div = document.createElement('div');
    div.innerHTML = msg;
    showToast('\u26a0\ufe0f ' + div.textContent, 'warn');
  }
  function comboMult() {
    if (state.combo >= 6) return 3;
    if (state.combo >= 4) return 2;
    if (state.combo >= 2) return 1.5;
    return 1;
  }
  function onHit(target, base) {
    state.combo += 1;
    var mult = comboMult();
    var gained = Math.round(base * mult);
    state.score += gained;
    state.hits += 1;
    state.hitsThisRound += 1;
    updateStatus();
    var comboTxt = mult > 1 ? ' (콤보 x' + mult + '!)' : '';
    var typeName = target.type === 'slope' ? '요구 기울기 명중' : target.type === 'extremum' ? '극값 저격' : target.type === 'increase' ? '증가구간 명중' : '명중';
    showToast('\ud83d\udcd0 ' + typeName + '! +' + gained + '점' + comboTxt, 'success');
    var rule = DIFF_RULE[state.difficulty];
    if (state.hitsThisRound >= rule.hitsToClear) {
      state.busy = true;
      showToast('\u2705 라운드 ' + state.round + ' 클리어!', 'success');
      var tid = setTimeout(nextRound, 1400);
      state.pendingTimeouts.push(tid);
    }
  }

  /* ---------- 게임 루프 (rAF + 안전 취소) ---------- */
  function loop(ts) {
    if (!state.mounted) return;
    state.reqId = requestAnimationFrame(loop);
    if (state.paused || state.finished) { state.lastFrame = ts; return; }
    var dt = state.lastFrame ? Math.min(0.05, (ts - state.lastFrame) / 1000) : 0.016;
    state.lastFrame = ts;
    if (!state.busy) {
      state.pointX += state.pointDir * 1.1 * dt;
      if (state.pointX > X_MAX - 0.3) { state.pointX = X_MAX - 0.3; state.pointDir = -1; }
      if (state.pointX < X_MIN + 0.3) { state.pointX = X_MIN + 0.3; state.pointDir = 1; }
      if (!state.lastSpawn || ts - state.lastSpawn > DIFF_RULE[state.difficulty].spawnGap) {
        spawnTarget();
        state.lastSpawn = ts;
      }
    }
    var i;
    for (i = state.targets.length - 1; i >= 0; i--) {
      var t = state.targets[i];
      t.x += t.vx * dt;
      if (t.x < X_MIN - 0.6 || t.x > X_MAX + 0.6) state.targets.splice(i, 1);
    }
    for (i = state.bullets.length - 1; i >= 0; i--) {
      var b = state.bullets[i];
      var step = 7 * dt;
      b.x += b.dx * step;
      b.y += b.dy * step;
      b.dist += step;
      var removed = false;
      var j;
      for (j = state.targets.length - 1; j >= 0; j--) {
        var tg = state.targets[j];
        var ddx = b.x - tg.x;
        var ddy = b.y - tg.y;
        if (ddx * ddx + ddy * ddy <= (tg.r + 0.12) * (tg.r + 0.12)) {
          var base = judgeHit(b, tg);
          state.targets.splice(j, 1);
          state.bullets.splice(i, 1);
          removed = true;
          if (base > 0) onHit(tg, base);
          break;
        }
      }
      if (removed) continue;
      if (b.x < X_MIN - 1 || b.x > X_MAX + 1 || b.y < Y_MIN - 1 || b.y > Y_MAX + 1 || b.dist > 16) {
        state.bullets.splice(i, 1);
        if (state.combo > 0) { state.combo = 0; updateStatus(); }
      }
    }
    render();
  }
  function stopLoop() {
    if (typeof state.reqId !== 'undefined' && state.reqId) {
      cancelAnimationFrame(state.reqId);
      state.reqId = null;
    }
  }

  /* ---------- 라운드 진행 ---------- */
  function nextRound() {
    if (!state.mounted) return;
    if (state.round >= TOTAL_ROUNDS) { finishGame(); return; }
    state.round += 1;
    startRound();
  }
  function startRound() {
    state.hitsThisRound = 0;
    state.targets = [];
    state.bullets = [];
    state.busy = false;
    state.lastSpawn = 0;
    state.roundStart = Date.now();
    genCurve();
    state.pointX = X_MIN + 0.5;
    state.pointDir = 1;
    setText('tns-curve', curveText());
    setText('tns-slope', "f'(x) = ?");
    updateStatus();
    renderMission();
  }
  function finishGame() {
    state.finished = true;
    state.busy = true;
    stopTimer();
    showToast('\ud83c\udfc1 모든 라운드 종료! 최종 점수 ' + state.score + '점', 'success');
    var tid = setTimeout(function () { if (state.mounted) showRankingModal(true); }, 900);
    state.pendingTimeouts.push(tid);
  }
  function renderMission() {
    var rule = DIFF_RULE[state.difficulty];
    var el = byId('tns-mission');
    if (!el) return;
    var extra = rule.special ? ' 특수 타겟(요구 기울기·극값·증가구간)은 조건 충족 시에만 명중 처리됩니다.' : ' 접선 미리보기(점선)를 참고해 발사 타이밍을 잡으세요.';
    el.innerHTML = '<b>라운드 ' + state.round + '</b> · 타겟 ' + rule.hitsToClear + '개를 명중하면 클리어!' + extra;
  }

  /* ---------- 상태 표시 및 타이머 ---------- */
  function updateStatus() {
    setText('tns-round', state.round);
    setText('tns-score', state.score);
    setText('tns-combo', state.combo + ' (x' + comboMult() + ')');
    setText('tns-hits', state.hitsThisRound + '/' + DIFF_RULE[state.difficulty].hitsToClear);
  }
  function startTimer() {
    stopTimer();
    state.timerInterval = setInterval(function () {
      if (!state.mounted || state.finished || state.paused) return;
      var rule = DIFF_RULE[state.difficulty];
      var elapsed = Math.floor((Date.now() - state.roundStart) / 1000);
      if (rule.timeLimit > 0) {
        var remain = rule.timeLimit - elapsed;
        setText('tns-time', Math.max(0, remain));
        if (remain <= 0 && !state.busy) {
          state.busy = true;
          showToast('\u23f0 제한 시간 초과! 다음 라운드로 넘어갑니다.', 'error');
          var tid = setTimeout(nextRound, 1300);
          state.pendingTimeouts.push(tid);
        }
      } else {
        setText('tns-time', elapsed);
      }
    }, 500);
  }
  function stopTimer() {
    if (typeof state.timerInterval !== 'undefined' && state.timerInterval) {
      clearInterval(state.timerInterval);
      state.timerInterval = null;
    }
  }

  /* ---------- Canvas 렌더링 ---------- */
  function render() {
    var cv = byId('tns-canvas');
    if (!cv) return;
    var ctx = cv.getContext('2d');
    if (!ctx) return;
    ctx.clearRect(0, 0, CV_W, CV_H);
    var i, x, y;
    ctx.strokeStyle = '#eef2f7';
    ctx.lineWidth = 1;
    for (i = Math.ceil(X_MIN); i <= Math.floor(X_MAX); i++) {
      ctx.beginPath(); ctx.moveTo(mxToS(i), 0); ctx.lineTo(mxToS(i), CV_H); ctx.stroke();
    }
    for (i = Math.ceil(Y_MIN); i <= Math.floor(Y_MAX); i++) {
      ctx.beginPath(); ctx.moveTo(0, myToS(i)); ctx.lineTo(CV_W, myToS(i)); ctx.stroke();
    }
    ctx.strokeStyle = '#94a3b8';
    ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(mxToS(0), 0); ctx.lineTo(mxToS(0), CV_H); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, myToS(0)); ctx.lineTo(CV_W, myToS(0)); ctx.stroke();
    ctx.strokeStyle = '#0284c7';
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    var first = true;
    for (x = X_MIN; x <= X_MAX; x += 0.04) {
      y = clampY(fx(x));
      if (first) { ctx.moveTo(mxToS(x), myToS(y)); first = false; }
      else ctx.lineTo(mxToS(x), myToS(y));
    }
    ctx.stroke();
    var px = state.pointX;
    var py = fx(px);
    var m = fpx(px);
    if (DIFF_RULE[state.difficulty].preview) {
      ctx.strokeStyle = '#d97706';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([6, 5]);
      ctx.beginPath();
      ctx.moveTo(mxToS(px - 2.4), myToS(clampY(py - 2.4 * m)));
      ctx.lineTo(mxToS(px + 2.4), myToS(clampY(py + 2.4 * m)));
      ctx.stroke();
      ctx.setLineDash([]);
    }
    for (i = 0; i < state.targets.length; i++) {
      var t = state.targets[i];
      var sx = mxToS(t.x);
      var sy = myToS(t.y);
      var sr = (t.r / (X_MAX - X_MIN)) * CV_W;
      ctx.beginPath();
      ctx.arc(sx, sy, sr, 0, Math.PI * 2);
      if (t.type === 'normal') { ctx.fillStyle = 'rgba(186, 230, 253, 0.75)'; ctx.strokeStyle = '#0284c7'; }
      else if (t.type === 'slope') { ctx.fillStyle = 'rgba(254, 243, 199, 0.85)'; ctx.strokeStyle = '#d97706'; }
      else if (t.type === 'extremum') { ctx.fillStyle = 'rgba(220, 252, 231, 0.85)'; ctx.strokeStyle = '#059669'; }
      else { ctx.fillStyle = 'rgba(237, 233, 254, 0.85)'; ctx.strokeStyle = '#7c3aed'; }
      ctx.lineWidth = 2;
      ctx.fill();
      ctx.stroke();
      if (t.label) {
        ctx.fillStyle = '#334155';
        ctx.font = 'bold 13px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(t.label, sx, sy - sr - 6);
      }
    }
    for (i = 0; i < state.bullets.length; i++) {
      var b = state.bullets[i];
      ctx.beginPath();
      ctx.arc(mxToS(b.x), myToS(b.y), 5, 0, Math.PI * 2);
      ctx.fillStyle = '#dc2626';
      ctx.fill();
    }
    ctx.beginPath();
    ctx.arc(mxToS(px), myToS(clampY(py)), 7, 0, Math.PI * 2);
    ctx.fillStyle = '#0f172a';
    ctx.fill();
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  /* ---------- 명예의 전당 ---------- */

  function saveScore(nickname) {
    var name = (nickname || '').trim().slice(0, 12) || '익명의 저격수';

    list.push({ nickname: name, score: state.score, date: new Date().toISOString().slice(0, 10) });
    list.sort(function (a, b) { return b.score - a.score; });
    list = list.slice(0, 20);
    try { localStorage.setItem(LS_KEY, JSON.stringify(list)); } catch (e) {}
    var sent = false;
    try {
      if (typeof window.submitRanking === 'function') {
        window.submitRanking(APP_ID, state.score, true, name, BOTTOM_BOARD_ID);
        sent = true;
      }
    } catch (e) { console.warn('tangent-shooter 랭킹 서버 전송 방어:', e); }
    if (!sent) renderBottomLeaderboard();
    showToast(sent ? '\ud83c\udfc6 명예의 전당에 기록을 전송했습니다!' : '\ud83d\udcbe 이 기기에 기록을 저장했습니다!', 'success');
  }

  function showGuideModal() {
    openModal('<h3 style="margin:0 0 12px;">\ud83d\udcd6 게임 방법 - 미분계수 접선 슈터</h3>' +
      '<p>곱선 위를 좌우로 움직이는 접점을 보며, 타이밍에 맞춰 <strong>접선 방향으로 탄환을 발사</strong>해 날아오는 타겟을 맞추세요!</p>' +
      '<ul>' +
      '<li>발사 순간 접점 <code>(a, f(a))</code>에서 탄환은 기울기 <code>f&#39;(a)</code>인 접선을 따라 직선으로 날아갑니다</li>' +
      '<li><strong>파랑 타겟</strong>: 접선이 닿기만 하면 명중 +10점</li>' +

      '<li><strong>초록 타겟(극값 저격)</strong>: <code>f&#39;(a)=0</code>인 극대·극소 지점에서 수평 발사해야 +25점</li>' +
      '<li><strong>보라 타겟(증가구간)</strong>: <code>f&#39;(a)&gt;0</code>인 증가 구간에서 발사해야 +15점</li>' +
      '<li>연속 명중 콤보: 2연속 x1.5 → 4연속 x2 → 6연속 x3 (빗나가면 초기화)</li>' +
      '<li>난이도: \ud83c\udf31 쉬움(이차함수·접선 미리보기·느린 타겟) / \ud83c\udf3f 보통(삼차함수·미리보기 없음·요구 기울기) / \ud83d\udd25 도전(복합 다항함수·빠른 타겟·라운드당 60초·극값·증감 미션)</li>' +
      '</ul>' +
      '<p style="background:#f0fdf4; border:1px solid #bbf7d0; border-radius:10px; padding:10px 12px;">\ud83d\udcda <strong>수학 개념</strong>: 미분계수 <code>f&#39;(a)</code>는 곱선 위 한 점에서의 접선의 기울기입니다. 극값에서는 접선이 수평(<code>f&#39;=0</code>)이 되고, <code>f&#39;&gt;0</code>이면 증가 구간, <code>f&#39;&lt;0</code>이면 감소 구간입니다.</p>' +
      '<button type="button" class="tns-btn tns-primary" id="tns-guide-close" style="width:100%;">이해했어요!</button>');
    var btn = byId('tns-guide-close');

  /* ---------- 이벤트 바인딩 ---------- */
  function refreshModeBar() {
    var bar = byId('tns-mode-bar');
    if (!bar) return;
    Array.prototype.forEach.call(bar.querySelectorAll('.tns-mode-btn'), function (btn) {
      if (btn.getAttribute('data-diff') === state.difficulty) btn.classList.add('active');
      else btn.classList.remove('active');
    });
  }
  function togglePause() {
    if (state.finished) return;
    state.paused = !state.paused;
    var btn = byId('tns-pause-btn');
    if (btn) btn.textContent = state.paused ? '\u25b6 계속하기' : '\u23f8 일시정지';
    if (state.paused) {
      state.pausedAt = Date.now();
      showToast('\u23f8 일시정지 — 천천히 기울기를 계산해보세요!', '');
    } else {
      if (state.pausedAt) state.roundStart += Date.now() - state.pausedAt;
      showToast('\u25b6 게임 재개!', '');
    }
  }
  function onKeyDown(ev) {
    if (!state.mounted) return;
    if (ev.code === 'Space' || ev.key === ' ') {
      var overlay = byId('tns-modal-overlay');
      if (overlay) return;
      ev.preventDefault();
      fire();
    }
  }
  function bindEvents() {
    var guideBtn = byId('tns-guide-btn');
    if (guideBtn) guideBtn.addEventListener('click', showGuideModal);
    var rankBtn = byId('tns-rank-btn');
    if (rankBtn) rankBtn.addEventListener('click', function () { showRankingModal(state.finished && state.score > 0); });
    var homeBtn = byId('tns-home-btn');
    if (homeBtn) homeBtn.addEventListener('click', goHomeSafe);
    var fireBtn = byId('tns-fire-btn');
    if (fireBtn) fireBtn.addEventListener('click', fire);
    var pauseBtn = byId('tns-pause-btn');
    if (pauseBtn) pauseBtn.addEventListener('click', togglePause);
    var restartBtn = byId('tns-restart-btn');
    if (restartBtn) restartBtn.addEventListener('click', function () {
      restartGame();
      showToast('새 게임을 시작합니다! 접선 방향을 예측해 타겟을 맞추세요.', '');
    });
    var bar = byId('tns-mode-bar');
    if (bar) {
      bar.addEventListener('click', function (ev) {
        var btn = ev.target && ev.target.closest ? ev.target.closest('.tns-mode-btn') : null;
        if (!btn) return;
        var diff = btn.getAttribute('data-diff');
        if (diff && diff !== state.difficulty && DIFF_RULE[diff]) {
          state.difficulty = diff;
          refreshModeBar();
          restartGame();
          showToast(DIFF_RULE[diff].label + ' 난이도로 새 게임을 시작합니다!', '');
        }
      });
    }
    document.removeEventListener('keydown', onKeyDown);
    document.addEventListener('keydown', onKeyDown);
  }
  function restartGame() {
    state.round = 1;
    state.score = 0;
    state.combo = 0;
    state.hits = 0;
    state.finished = false;
    state.paused = false;
    clearPendingTimeouts();
    closeModal();
    var pauseBtn = byId('tns-pause-btn');
    if (pauseBtn) pauseBtn.textContent = '\u23f8 일시정지';
    startRound();
    startTimer();
    stopLoop();
    state.lastFrame = 0;
    state.reqId = requestAnimationFrame(loop);
  }

  /* ---------- 안전 마운트 (Gen-3 표준 템플릿 A) ---------- */
  function mount(container, context) {
    var host = null;
    if (typeof container === 'string') {
      try { host = document.querySelector(container); } catch (e) { host = null; }
    } else if (container instanceof HTMLElement) {
      host = container;
    }
    if (!host && window.MathLabUtils && typeof window.MathLabUtils.getMountContainer === 'function') {
      try { host = window.MathLabUtils.getMountContainer(container); } catch (e) { host = null; }
    }
    if (!host || !(host instanceof HTMLElement)) {
      host = document.getElementById('mathlab-view') || document.getElementById('new-root') || document.getElementById('game-container');
    }
    if (!host || !(host instanceof HTMLElement) || host === document.body) {
      var createdHost = document.getElementById('tangent-shooter-force-host');
      if (!createdHost) {
        createdHost = document.createElement('div');
        createdHost.id = 'tangent-shooter-force-host';
        document.body.appendChild(createdHost);
      }
      host = createdHost;
    }
    var footerEl = document.querySelector('footer, #footer, .app-footer');
    if (footerEl && host && typeof host.compareDocumentPosition === 'function' && (host.compareDocumentPosition(footerEl) & Node.DOCUMENT_POSITION_PRECEDING)) {
      try { footerEl.parentNode.insertBefore(host, footerEl); } catch (e) {}
    }
    host.style.display = '';
    host.style.visibility = 'visible';
    host.style.opacity = '1';
    var parent = host.parentElement;
    while (parent && parent !== document.body && parent !== document.documentElement) {
      if (parent.style && parent.style.display === 'none') parent.style.display = 'block';
      if (parent.style && parent.style.visibility === 'hidden') parent.style.visibility = 'visible';
      parent = parent.parentElement;
    }
    document.querySelectorAll('header, .navbar, #app-header, .top-bar, #floating-home-btn, .floating-home').forEach(function (el) {
      if (el && el.style && el.style.display === 'none') el.style.display = '';
    });
    state.host = host;
    state.mounted = true;
    host.innerHTML = buildHTML();
    bindEvents();
    refreshModeBar();
    restartGame();
    renderBottomLeaderboard();
  }

  /* ---------- 정리·홈 복귀 ---------- */
  function destroy() {
    stopTimer();
    stopLoop();
    clearPendingTimeouts();
    closeModal();
    document.removeEventListener('keydown', onKeyDown);
    state.mounted = false;
    state.targets = [];
    state.bullets = [];
    if (state.host) {
      try { state.host.innerHTML = ''; } catch (e) {}
    }
    state.host = null;
  }
  function goHomeSafe() {
    stopTimer();
    stopLoop();
    clearPendingTimeouts();
    closeModal();
    destroy();
    try {
      
    } catch (e) { console.warn('tangent-shooter backHome 방어:', e); }
    var forced = document.getElementById('tangent-shooter-force-host');
    if (forced) {
      forced.style.display = 'none';
      forced.innerHTML = '';
    }
    if (typeof window.goHome === 'function') {
      try { window.goHome(); } catch (e) { console.warn('tangent-shooter goHome 방어:', e); }
    }
  }

  var TangentShooter = {
    mount: mount,
    resetGame: restartGame,
    destroy: destroy,
    goHome: goHomeSafe
  };

  /* ---------- 3중 자율 등록 & 상호 실행 브리지 (Gen-3 표준 템플릿 B) ---------- */
  function registerTangentShooter() {
    if (typeof window.MathLabGames !== 'undefined' && typeof window.MathLabGames.register === 'function') {
      var exists = false;
      try { exists = typeof window.MathLabGames.get === 'function' && !!window.MathLabGames.get(APP_ID); } catch (e) { exists = false; }
      if (!exists) {
        try {
          window.MathLabGames.register({
            id: APP_ID,
            title: APP_TITLE,
            icon: '\ud83d\udcd0',
            sourceType: 'new',
            players: '1인',
            isMultiplayer: false,
            mount: function (container, context) { TangentShooter.mount(container, context); },
            reset: function () { TangentShooter.resetGame(); },
            destroy: function () { TangentShooter.destroy(); },
            goHome: function () { TangentShooter.goHome(); }
          });
        } catch (e) { console.warn('tangent-shooter 안전 등록 방어:', e); }
      }
    }
  }

  registerTangentShooter();
  window.addEventListener('DOMContentLoaded', registerTangentShooter);
  setTimeout(registerTangentShooter, 100);
  setTimeout(registerTangentShooter, 500);

  window.TangentShooter = TangentShooter;

  window.initTangentShooterGame = function () {
    registerTangentShooter();
    if (window.LegacyBridge && typeof window.LegacyBridge.hideAllLegacySections === 'function') {
      window.LegacyBridge.hideAllLegacySections();
      if (typeof window.LegacyBridge.showNewRoot === 'function') window.LegacyBridge.showNewRoot();
    }
    if (typeof window.MathLabGames !== 'undefined' && typeof window.MathLabGames.mount === 'function') {
      try { window.MathLabGames.mount(APP_ID); return; } catch (e) { console.warn('tangent-shooter 범용 마운트 방어:', e); }
    }
    var targetEl = document.getElementById('mathlab-view') || document.getElementById('new-root');
    TangentShooter.mount(targetEl);
  };

  window.launchTangentShooterGame = function () {
    window.initTangentShooterGame();
  };
})();
</script>
