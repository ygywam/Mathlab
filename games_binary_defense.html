
<style>
  .game-binary-defense {
    width: 100%;
    min-height: 100%;
    padding: 24px;
    box-sizing: border-box;
    color: #f8fafc;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    border-radius: 24px;
    font-family: 'Pretendard', sans-serif;
  }
  .game-binary-defense * { box-sizing: border-box; }

  /* Header */
  .bd-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 20px; }
  .bd-title h2 { margin: 0 0 8px; font-size: clamp(1.8rem, 4vw, 2.5rem); font-weight: 900; }
  .bd-title p { margin: 0; color: #94a3b8; font-size: 1.05rem; }
  .bd-header-actions { display: flex; gap: 10px; }
  
  .bd-btn {
    border: none; border-radius: 12px; padding: 12px 20px; font-size: 1rem; font-weight: 800;
    cursor: pointer; transition: all 0.2s; color: #fff;
  }
  .bd-btn:hover { transform: translateY(-2px); }
  .bd-btn:active { transform: translateY(0); }
  .bd-btn.blue { background: linear-gradient(135deg, #3b82f6, #1d4ed8); }
  .bd-btn.green { background: linear-gradient(135deg, #10b981, #047857); }
  .bd-btn.red { background: linear-gradient(135deg, #ef4444, #b91c1c); }
  .bd-btn.gray { background: #334155; color: #f8fafc; }

  /* Mode Switch */
  .bd-mode-bar { display: flex; gap: 10px; margin-bottom: 24px; justify-content: center; }
  .mode-btn {
    flex: 1; max-width: 300px; padding: 14px; border-radius: 14px; border: 2px solid #334155;
    background: #0f172a; color: #94a3b8; font-weight: 800; cursor: pointer; transition: 0.2s;
  }
  .mode-btn.active { background: #3b82f6; border-color: #60a5fa; color: #fff; }

  /* Difficulty */
  .bd-start-screen { text-align: center; padding: 40px 20px; background: rgba(255,255,255,0.02); border-radius: 20px; border: 1px solid #334155; }
  .bd-diff-grid { display: flex; justify-content: center; gap: 16px; margin-top: 30px; flex-wrap: wrap; }

  /* Arena */
  .bd-arena-grid { display: grid; grid-template-columns: 1fr; gap: 20px; margin-bottom: 24px; }
  .bd-arena-grid.two-player { grid-template-columns: 1fr 1fr; }

  /* Player Area */
  .bd-player-area {
    background: rgba(30, 41, 59, 0.6); border-radius: 20px; padding: 20px;
    border: 3px solid #334155; display: flex; flex-direction: column; gap: 16px;
    position: relative;
  }
  .bd-player-area.p1 { border-color: #ef4444; }
  .bd-player-area.p2 { border-color: #3b82f6; }
  .p-badge {
    position: absolute; top: -14px; left: 20px; padding: 4px 12px; border-radius: 8px; font-weight: 900; font-size: 0.9rem; color: #fff;
  }
  .p-badge.p1 { background: #ef4444; }
  .p-badge.p2 { background: #3b82f6; }

  /* Stats Row */
  .bd-stats { display: flex; justify-content: space-between; align-items: center; font-size: 1.1rem; font-weight: 800; background: #0f172a; padding: 10px 16px; border-radius: 12px; }
  .bd-score { color: #38bdf8; }
  .bd-lives { color: #f87171; }

  /* Visual Game Box */
  .bd-game-box {
    position: relative; height: 220px; border-radius: 16px;
    background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
    border: 2px solid #475569; overflow: hidden;
    display: flex; align-items: flex-end; padding-bottom: 20px;
  }
  .bd-castle { position: absolute; left: 20px; bottom: 20px; font-size: 4rem; z-index: 10; filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.5)); transition: transform 0.2s; }
  .bd-castle.hit { transform: scale(0.9) rotate(-10deg); filter: grayscale(1); }

  .bd-monster-box {
    position: absolute; right: 20px; bottom: 20px; display: flex; flex-direction: column; align-items: center;
    transition: transform 0.3s;
  }
  .bd-monster-icon { font-size: 3.5rem; filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.5)); }
  .bd-binary-bubble {
    background: #000; color: #34d399; padding: 6px 12px; border-radius: 8px;
    font-family: monospace; font-size: 1.3rem; font-weight: 900; margin-bottom: 8px;
    border: 2px solid #34d399; letter-spacing: 2px; text-shadow: 0 0 5px #34d399;
  }

  /* Timer */
  .bd-timer-wrap { background: #334155; height: 12px; border-radius: 6px; overflow: hidden; margin-top: 10px; }
  .bd-timer-fill { height: 100%; background: linear-gradient(90deg, #ef4444, #f59e0b); transition: width 1s linear; width: 100%; }
  
  /* Input & Keypad */
  .bd-input-wrap { text-align: center; }
  .bd-display-input {
    width: 100%; padding: 16px; font-size: 2rem; font-weight: 900; text-align: center;
    background: #0f172a; border: 2px solid #475569; border-radius: 12px; color: #fff;
    margin-bottom: 12px; outline: none; font-family: monospace;
  }
  .bd-display-input:focus { border-color: #3b82f6; }
  
  .bd-keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .bd-keypad-btn {
    background: #334155; color: #f8fafc; border: none; border-radius: 10px; padding: 14px;
    font-size: 1.4rem; font-weight: 900; cursor: pointer; transition: 0.1s;
  }
  .bd-keypad-btn:active { transform: scale(0.95); background: #475569; }
  .bd-keypad-btn.col-span-2 { grid-column: span 2; }
  .bd-keypad-btn.action { background: #2563eb; }
  .bd-keypad-btn.del { background: #ef4444; }

  /* Message */
  .bd-msg-bar { text-align: center; padding: 12px; font-weight: 800; border-radius: 12px; min-height: 48px; display: flex; align-items: center; justify-content: center; }
  .bd-msg-bar.normal { background: rgba(255,255,255,0.1); }
  .bd-msg-bar.correct { background: rgba(16,185,129,0.2); color: #34d399; }
  .bd-msg-bar.wrong { background: rgba(239,68,68,0.2); color: #f87171; }

  /* Bottom Leaderboard */
  .bottom-ranking-card {
    background: rgba(30, 41, 59, 0.7); border: 2px solid #334155; border-radius: 20px; padding: 20px; margin-top: 30px;
  }
  .ranking-header { margin-bottom: 16px; border-bottom: 2px solid #475569; padding-bottom: 12px; }
  .ranking-title { font-size: 1.2rem; font-weight: 900; color: #f8fafc; }
</style>

<script>
(function() {
  'use strict';
  
  function escapeHTML(str) {
    return String(str || '').replace(/[&<>'"]/g, s => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
    }[s]));
  }

  const MathLabUtils = window.MathLabUtils || {
    getMountContainer(c) {
      if (!c) return document.getElementById('mathlab-view') || document.getElementById('new-root') || document.body;
      if (typeof c === 'string') return document.querySelector(c);
      return c;
    },
    goHome() {
      if (window.LegacyBridge && typeof window.LegacyBridge.backHome === 'function') {
        try { window.LegacyBridge.backHome(); return; } catch (e) {}
      }
      location.reload();
    }
  };

  const BinaryDefenseGame = {
    host: null,
    mode: '1p', // 1p, 2p
    difficulty: null,
    gameOver: false,
    maxTime: 0,
    mainTimer: null,
    waveCount: 0,
    targetMonster: null, // { binary, decimal }
    
    // Player States
    p1: { lives: 3, score: 0, input: '', timeLeft: 0, msg: '', msgType: 'normal', active: true },
    p2: { lives: 3, score: 0, input: '', timeLeft: 0, msg: '', msgType: 'normal', active: true },

    config: {
      easy: { bits: [3, 4], time: 10, label: '쉬움 (3~4비트)' },
      normal: { bits: [5, 6], time: 15, label: '보통 (5~6비트)' },
      hard: { bits: [7, 8], time: 20, label: '어려움 (7~8비트)' }
    },

    mount(container) {
      this.host = MathLabUtils.getMountContainer(container);
      if (!this.host) return;
      
      // Gen-3 Standard Safe Mount
      if (this.host === document.body) {
        let forceHost = document.getElementById('binary-defense-force-host');
        if (!forceHost) {
          forceHost = document.createElement('div');
          forceHost.id = 'binary-defense-force-host';
          document.body.appendChild(forceHost);
        }
        this.host = forceHost;
      }
      
      const footerEl = document.querySelector('footer, #footer, .app-footer');
      if (footerEl && typeof this.host.compareDocumentPosition === 'function' && (this.host.compareDocumentPosition(footerEl) & Node.DOCUMENT_POSITION_PRECEDING)) {
        footerEl.parentNode.insertBefore(this.host, footerEl);
      }

      this.host.style.display = '';
      this.host.style.visibility = 'visible';
      this.host.style.opacity = '1';

      let parent = this.host.parentElement;
      while (parent && parent !== document.body && parent !== document.documentElement) {
        if (parent.style && parent.style.display === 'none') parent.style.display = 'block';
        if (parent.style && parent.style.visibility === 'hidden') parent.style.visibility = 'visible';
        parent = parent.parentElement;
      }
      document.querySelectorAll('header, .navbar, #app-header, #floating-home-btn').forEach(el => {
        if (el && el.style && el.style.display === 'none') el.style.display = '';
      });

      this.bindGlobalKeys = this.handleKeyDown.bind(this);
      document.addEventListener('keydown', this.bindGlobalKeys);
      
      this.resetToTitle();
    },

    destroy() {
      if (this.mainTimer) clearInterval(this.mainTimer);
      document.removeEventListener('keydown', this.bindGlobalKeys);
      if (this.host) {
        this.host.innerHTML = '';
        this.host.style.display = 'none';
      }
    },
    
    goHome() {
      this.destroy();
      MathLabUtils.goHome();
    },

    resetToTitle() {
      if (this.mainTimer) clearInterval(this.mainTimer);
      this.difficulty = null;
      this.gameOver = false;
      this.p1 = { lives: 3, score: 0, input: '', timeLeft: 0, msg: '방어 준비 완료!', msgType: 'normal', active: true };
      this.p2 = { lives: 3, score: 0, input: '', timeLeft: 0, msg: '방어 준비 완료!', msgType: 'normal', active: true };
      this.waveCount = 0;
      this.render();
    },

    setMode(m) {
      if (this.difficulty !== null) {
         this.resetToTitle();
      }
      this.mode = m;
      this.render();
    },

    startGame(diff) {
      this.difficulty = diff;
      this.p1 = { lives: 3, score: 0, input: '', timeLeft: 0, msg: '전투 시작!', msgType: 'normal', active: true };
      this.p2 = { lives: 3, score: 0, input: '', timeLeft: 0, msg: '전투 시작!', msgType: 'normal', active: true };
      this.gameOver = false;
      this.waveCount = 0;
      this.nextWave();
    },

    generateBinary(bits) {
      let bin = '1';
      for(let i=1; i<bits; i++) bin += Math.random() < 0.5 ? '0' : '1';
      return { binary: bin, decimal: parseInt(bin, 2) };
    },

    nextWave() {
      if (this.gameOver) return;
      if (!this.p1.active && (this.mode === '1p' || !this.p2.active)) {
        this.endGame();
        return;
      }
      
      const conf = this.config[this.difficulty];
      const bits = conf.bits[0] + Math.floor(Math.random() * (conf.bits[1] - conf.bits[0] + 1));
      this.targetMonster = this.generateBinary(bits);
      this.maxTime = conf.time;
      this.waveCount++;
      
      if (this.p1.active) { this.p1.timeLeft = this.maxTime; this.p1.input = ''; this.p1.msg = '몬스터 등장!'; this.p1.msgType = 'normal'; }
      if (this.mode === '2p' && this.p2.active) { this.p2.timeLeft = this.maxTime; this.p2.input = ''; this.p2.msg = '몬스터 등장!'; this.p2.msgType = 'normal'; }
      
      this.startTimer();
      this.render();
    },

    startTimer() {
      if (this.mainTimer) clearInterval(this.mainTimer);
      this.mainTimer = setInterval(() => {
        let waveEnded = true;
        
        if (this.p1.active) {
          this.p1.timeLeft -= 1;
          if (this.p1.timeLeft <= 0) {
            this.p1.lives -= 1;
            this.p1.msg = `시간 초과! 정답: ${this.targetMonster.decimal}`;
            this.p1.msgType = 'wrong';
            if (this.p1.lives <= 0) this.p1.active = false;
          } else {
            waveEnded = false;
            const fill = document.getElementById('p1-time-fill');
            const txt = document.getElementById('p1-time-txt');
            if (fill) fill.style.width = `${(this.p1.timeLeft/this.maxTime)*100}%`;
            if (txt) txt.textContent = `${this.p1.timeLeft}초`;
          }
        }
        
        if (this.mode === '2p' && this.p2.active) {
          this.p2.timeLeft -= 1;
          if (this.p2.timeLeft <= 0) {
            this.p2.lives -= 1;
            this.p2.msg = `시간 초과! 정답: ${this.targetMonster.decimal}`;
            this.p2.msgType = 'wrong';
            if (this.p2.lives <= 0) this.p2.active = false;
          } else {
            waveEnded = false;
            const fill = document.getElementById('p2-time-fill');
            const txt = document.getElementById('p2-time-txt');
            if (fill) fill.style.width = `${(this.p2.timeLeft/this.maxTime)*100}%`;
            if (txt) txt.textContent = `${this.p2.timeLeft}초`;
          }
        }
        
        if (waveEnded) {
          clearInterval(this.mainTimer);
          if (!this.p1.active && (this.mode === '1p' || !this.p2.active)) {
            this.endGame();
          } else {
            this.render();
            setTimeout(() => this.nextWave(), 2000);
          }
        }
      }, 1000);
    },

    handleInput(pid, char) {
      if (this.gameOver) return;
      const p = pid === 'p1' ? this.p1 : this.p2;
      if (!p.active) return;
      if (p.input.length < 5) p.input += char;
      this.updateInputUI(pid);
    },
    
    handleDelete(pid) {
      if (this.gameOver) return;
      const p = pid === 'p1' ? this.p1 : this.p2;
      if (!p.active) return;
      p.input = p.input.slice(0, -1);
      this.updateInputUI(pid);
    },
    
    updateInputUI(pid) {
      const el = document.getElementById(`${pid}-input-display`);
      if (el) el.textContent = pid === 'p1' ? (this.p1.input || '-') : (this.p2.input || '-');
    },

    handleSubmit(pid) {
      if (this.gameOver || !this.targetMonster) return;
      const p = pid === 'p1' ? this.p1 : this.p2;
      if (!p.active || !p.input) return;
      
      const ans = parseInt(p.input, 10);
      if (ans === this.targetMonster.decimal) {
        // 정답
        p.score += 100 + (p.timeLeft * 10);
        p.msg = `방어 성공! (+100점)`;
        p.msgType = 'correct';
        p.activeForWave = false; // 이번 웨이브 클리어 표시용 임시 플래그
        
        // 웨이브 종료 여부 체크
        let p1Done = !this.p1.active || this.p1.msgType === 'correct';
        let p2Done = this.mode === '1p' || !this.p2.active || this.p2.msgType === 'correct';
        
        this.render();
        
        if (p1Done && p2Done) {
          clearInterval(this.mainTimer);
          setTimeout(() => this.nextWave(), 1200);
        }
      } else {
        // 오답
        p.lives -= 1;
        p.input = '';
        if (p.lives <= 0) {
          p.active = false;
          p.msg = '성 파괴 됨!';
          p.msgType = 'wrong';
        } else {
          p.msg = '오답! 생명 -1';
          p.msgType = 'wrong';
        }
        
        let p1Done = !this.p1.active || this.p1.msgType === 'correct';
        let p2Done = this.mode === '1p' || !this.p2.active || this.p2.msgType === 'correct';
        
        this.render();
        if (p1Done && p2Done) {
          clearInterval(this.mainTimer);
          if (!this.p1.active && (this.mode === '1p' || !this.p2.active)) {
             setTimeout(() => this.endGame(), 1000);
          } else {
             setTimeout(() => this.nextWave(), 1500);
          }
        }
      }
    },

    handleKeyDown(e) {
      if (this.difficulty === null || this.gameOver) return;
      
      // P1 (키보드 0-9, Enter, Backspace)
      if (e.key >= '0' && e.key <= '9') { this.handleInput('p1', e.key); }
      else if (e.key === 'Backspace') { this.handleDelete('p1'); }
      else if (e.key === 'Enter') { this.handleSubmit('p1'); }
    },

    endGame() {
      this.gameOver = true;
      if (this.mainTimer) clearInterval(this.mainTimer);
      this.render();
      setTimeout(() => this.showRankingModal(), 1000);
    },

    showRankingModal() {
      const dbId = 'board-binary-defense-bottom';
      const score = this.p1.score;
      if (score <= 0) return;
      
      document.getElementById('mathlab-inline-ranking-modal')?.remove();
      const div = document.createElement('div');
      div.id = 'mathlab-inline-ranking-modal';
      div.style.cssText = "position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(15,23,42,0.85); backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center; z-index:999999; padding:20px; box-sizing:border-box; font-family:'Pretendard',sans-serif;";
      div.innerHTML = `
        <div style="background:#1e293b; border-radius:26px; padding:30px; max-width:400px; width:100%; border:3px solid #facc15; text-align:center; box-shadow:0 25px 50px rgba(0,0,0,0.5);">
          <div style="font-size:3rem; margin-bottom:10px;">🏆</div>
          <h2 style="color:#f8fafc; font-size:1.8rem; margin:0 0 10px;">게임 종료!</h2>
          <p style="color:#94a3b8; margin:0 0 20px; font-size:1.1rem;">최종 점수: <strong style="color:#38bdf8;">${score}점</strong></p>
          <input type="text" id="ranking-nickname-input" placeholder="닉네임 입력 (최대 8자)" maxlength="8" style="width:100%; padding:14px; border-radius:12px; border:2px solid #334155; background:#0f172a; color:#fff; font-size:1.2rem; text-align:center; margin-bottom:20px; outline:none;">
          <div style="display:flex; gap:10px;">
            <button id="ranking-cancel-btn" style="flex:1; padding:14px; background:#475569; color:#fff; border:none; border-radius:12px; font-weight:800; cursor:pointer;">닫기</button>
            <button id="ranking-submit-btn" style="flex:2; padding:14px; background:#eab308; color:#fff; border:none; border-radius:12px; font-weight:900; cursor:pointer;">명예의 전당 등록</button>
          </div>
        </div>
      `;
      document.body.appendChild(div);
      
      const input = document.getElementById('ranking-nickname-input');
      input?.focus();
      
      const close = () => div.remove();
      document.getElementById('ranking-cancel-btn').addEventListener('click', close);
      
      const submit = () => {
        const nick = (input.value || '').trim() || '익명';
        const nickArg = { value: nick, trim: () => nick, toString: () => nick };
        try { window.submitRanking('바이너리 디펜스', score, true, nickArg, dbId); } catch(e){}
        close();
        if (typeof window.loadGameLeaderboard === 'function') {
           window.loadGameLeaderboard('바이너리 디펜스', true, dbId);
        } else {
           this.renderBottomLeaderboardFallback(dbId, nick, score);
        }
      };
      document.getElementById('ranking-submit-btn').addEventListener('click', submit);
      input?.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
    },
    
    renderBottomLeaderboardFallback(dbId, newNick, newScore) {
       try {
         const key = 'mathlab_lb_binary_defense';
         let list = JSON.parse(localStorage.getItem(key) || '[]');
         if (newNick && newScore) {
           list.push({ nickname: newNick, score: newScore, date: new Date().toISOString() });
           list.sort((a,b) => b.score - a.score);
           localStorage.setItem(key, JSON.stringify(list));
         }
         const el = document.getElementById(dbId);
         if (el) {
           if (list.length === 0) { el.innerHTML = '<p style="color:#94a3b8;text-align:center;">기록이 없습니다.</p>'; return; }
           el.innerHTML = list.slice(0,5).map((item, idx) => `
             <div style="display:flex; justify-content:space-between; align-items:center; background:#1e293b; padding:10px 14px; border-radius:10px; margin-bottom:6px; border:1px solid #334155;">
               <span style="font-weight:800; color:${idx===0?'#facc15':'#cbd5e1'};">${idx===0?'👑 1위':`${idx+1}위`} - ${escapeHTML(item.nickname)}</span>
               <span style="color:#38bdf8; font-weight:900;">${item.score}점</span>
             </div>
           `).join('');
         }
       } catch(e){}
    },

    showManualModal() {
      document.getElementById('mathlab-manual-modal')?.remove();
      const div = document.createElement('div');
      div.id = 'mathlab-manual-modal';
      div.style.cssText = "position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(15,23,42,0.65); backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center; z-index:999999; padding:20px; box-sizing:border-box; font-family:'Pretendard',sans-serif;";
      div.innerHTML = `
        <div style="background:#ffffff; border-radius:26px; padding:30px 26px; max-width:620px; width:100%; max-height:88vh; overflow-y:auto; box-shadow:0 15px 30px rgba(0,0,0,0.2); border:2px solid #e2e8f0; text-align:left; color:#334155;">
          <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid #e2e8f0; padding-bottom:14px; margin-bottom:18px;">
            <h2 style="margin:0; font-size:22px; font-weight:900; color:#1e293b;">📖 사용설명서 & 2진법 교과 개념</h2>
            <button id="manual-close-btn" style="background:#f1f5f9; border:1px solid #cbd5e1; color:#64748b; font-size:20px; font-weight:bold; width:40px; height:40px; border-radius:20px; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0;">✕</button>
          </div>
          <div style="font-size:15px; line-height:1.65;">
            <h3 style="color:#2563eb; font-size:17px; margin:0 0 8px; font-weight:800;">🕹️ 앱 사용설명서 (게임 규칙 & 조작법)</h3>
            <p style="margin:0 0 8px;">다가오는 2진수 몬스터가 머리 위에 띄운 숫자를 10진수로 빠르게 환산하여 입력하고 성을 방어하는 진법 타임어택 게임입니다.</p>
            <ul style="padding-left:20px; margin:0 0 16px; line-height:1.5; color:#0f172a;">
              <li><strong>조작 방법:</strong> 입력창에 숫자 입력 후 <code>Enter</code> 키 또는 <strong>[발사🚀]</strong> 버튼 클릭</li>
              <li><strong>2인용 전자칠판 지원:</strong> 스플릿 스크린 양쪽에 자체 숫자 키패드가 제공되어 동시 터치 대결이 가능합니다!</li>
              <li><strong>난이도 선택:</strong> 쉬움(4비트/10초), 보통(6비트/15초), 어려움(8비트/20초)</li>
            </ul>
            <h3 style="color:#2563eb; font-size:17px; margin:0 0 8px; font-weight:800;">📐 교과 개념적 지식: 2진수와 10진수의 진법 변환</h3>
            <p style="margin:0 0 10px;">우리가 일상에서 쓰는 <strong style="color:#1e293b;">10진수</strong>는 0부터 9까지 10개의 숫자를 쓰지만, 디지털 시스템이 쓰는 <strong style="color:#1e293b;">2진수</strong>는 0과 1 두 가지 기호만 사용합니다.</p>
            <div style="background:#f8fafc; padding:14px 16px; border-radius:14px; border:1px solid #e2e8f0; margin-bottom:16px;">
              <strong style="color:#2563eb;">2진수 ➔ 10진수 변환 공식:</strong><br>
              2진수의 각 자리는 오른쪽 끝(1의 자리가 2⁰)부터 왼쪽으로 이동할 때마다 <strong style="color:#1e293b;">2배씩 (1, 2, 4, 8, 16...)</strong> 커집니다.<br>
              <div style="background:#ffffff; color:#0f172a; padding:8px 12px; border-radius:8px; font-family:monospace; margin-top:6px; font-weight:bold; text-align:center; border:1px solid #cbd5e1;">
                예시: 1011(2) = 8 + 0 + 2 + 1 = 11(10)
              </div>
            </div>
          </div>
          <button id="manual-confirm-btn" style="width:100%; margin-top:10px; padding:16px; background:#10b981; color:#fff; font-size:16.5px; font-weight:900; border:none; border-radius:14px; cursor:pointer;">✨ 확인 및 방어 시작!</button>
        </div>
      `;
      document.body.appendChild(div);
      const close = () => div.remove();
      document.getElementById('manual-close-btn').addEventListener('click', close);
      document.getElementById('manual-confirm-btn').addEventListener('click', close);
    },

    renderPlayer(pid) {
      const p = pid === 'p1' ? this.p1 : this.p2;
      const isOver = this.gameOver || !p.active;
      const m = this.targetMonster;
      
      let monsterHtml = '';
      if (m && !isOver && p.msgType !== 'correct') {
        monsterHtml = `
          <div class="bd-monster-box">
            <div class="bd-binary-bubble">${m.binary}</div>
            <div class="bd-monster-icon">👾</div>
          </div>
        `;
      }
      
      const castleClass = (!p.active && this.waveCount > 0) ? 'bd-castle hit' : 'bd-castle';
      const castleIcon = p.active ? '🏰' : '🔥';
      
      return `
        <div class="bd-player-area ${pid}">
          <div class="p-badge ${pid}">${pid === 'p1' ? '🔴 P1' : '🔵 P2'}</div>
          <div class="bd-stats">
            <div class="bd-score">🏆 ${p.score}</div>
            <div class="bd-lives">❤️ ${p.lives}</div>
          </div>
          <div class="bd-timer-wrap">
            <div class="bd-timer-fill" id="${pid}-time-fill" style="width: ${this.maxTime ? (p.timeLeft/this.maxTime)*100 : 0}%"></div>
          </div>
          <div style="text-align:right; font-size:0.9rem; font-weight:800; color:#94a3b8; margin-top:4px;" id="${pid}-time-txt">${p.timeLeft}초</div>
          
          <div class="bd-game-box">
            <div class="${castleClass}">${castleIcon}</div>
            ${monsterHtml}
          </div>
          
          <div class="bd-msg-bar ${p.msgType}">${p.msg}</div>
          
          <div class="bd-input-wrap">
            <div class="bd-display-input" id="${pid}-input-display">${p.input || '-'}</div>
            <div class="bd-keypad">
              ${[1,2,3,4,5,6,7,8,9].map(n => `<button class="bd-keypad-btn" onclick="window.BinaryDefenseGame.handleInput('${pid}', '${n}')">${n}</button>`).join('')}
              <button class="bd-keypad-btn del" onclick="window.BinaryDefenseGame.handleDelete('${pid}')">지움</button>
              <button class="bd-keypad-btn" onclick="window.BinaryDefenseGame.handleInput('${pid}', '0')">0</button>
              <button class="bd-keypad-btn action" onclick="window.BinaryDefenseGame.handleSubmit('${pid}')">발사🚀</button>
            </div>
          </div>
        </div>
      `;
    },

    render() {
      if (!this.host) return;

      let mainContent = '';
      if (this.difficulty === null) {
        mainContent = `
          <div class="bd-start-screen">
            <div style="font-size: 5rem; margin-bottom: 20px;">🛡️</div>
            <h3 style="font-size: 1.8rem; margin: 0 0 10px;">바이너리 디펜스</h3>
            <p style="color: #94a3b8; margin-bottom: 30px;">다가오는 2진수 몬스터를 10진수로 변환해 성을 방어하세요!</p>
            <div class="bd-diff-grid">
              <button class="bd-btn green" onclick="window.BinaryDefenseGame.startGame('easy')">쉬움 (4비트)</button>
              <button class="bd-btn blue" onclick="window.BinaryDefenseGame.startGame('normal')">보통 (6비트)</button>
              <button class="bd-btn red" onclick="window.BinaryDefenseGame.startGame('hard')">어려움 (8비트)</button>
            </div>
          </div>
        `;
      } else {
        mainContent = `
          <div class="bd-arena-grid ${this.mode === '2p' ? 'two-player' : ''}">
            ${this.renderPlayer('p1')}
            ${this.mode === '2p' ? this.renderPlayer('p2') : ''}
          </div>
        `;
      }

      this.host.innerHTML = `
        <div class="game-binary-defense">
          <div class="bd-header">
            <div class="bd-title">
              <h2>🛡️ 바이너리 디펜스</h2>
              <p>2진수 몬스터를 10진수로 변환해 막아내는 진법 타임어택 게임</p>
            </div>
            <div class="bd-header-actions">
              <button class="bd-btn red" onclick="window.BinaryDefenseGame.resetToTitle()" style="background: linear-gradient(135deg, #ef4444, #b91c1c);">🔄 게임 중단</button>
              <button class="bd-btn blue" onclick="window.BinaryDefenseGame.showManualModal()">📖 게임 방법</button>
              <button class="bd-btn gray" onclick="window.BinaryDefenseGame.goHome()">🏠 홈</button>
            </div>
          </div>
          
          <div class="bd-mode-bar">
            <button class="mode-btn ${this.mode === '1p' ? 'active' : ''}" onclick="window.BinaryDefenseGame.setMode('1p')">👤 1인 카운트다운 방어 모드</button>
            <button class="mode-btn ${this.mode === '2p' ? 'active' : ''}" onclick="window.BinaryDefenseGame.setMode('2p')">👥 2인 전자칠판 대결 모드</button>
          </div>
          
          ${mainContent}
          
          <div class="bottom-ranking-card" id="my-app-bottom-ranking-sec">
            <div class="ranking-header">
              <div class="ranking-title">🏆 명예의 전당 (실시간 랭킹 보드)</div>
            </div>
            <div id="board-binary-defense-bottom">
              <p style="text-align:center; color:#94a3b8; padding:12px 0;">랭킹 데이터를 불러오는 중...</p>
            </div>
          </div>
        </div>
      `;

      if (typeof window.loadGameLeaderboard === 'function') {
        window.loadGameLeaderboard('바이너리 디펜스', true, 'board-binary-defense-bottom');
      } else {
        this.renderBottomLeaderboardFallback('board-binary-defense-bottom');
      }
    }
  };

  function registerMyApp() {
    if (typeof window.MathLabGames !== 'undefined' && typeof window.MathLabGames.register === 'function') {
      if (!window.MathLabGames.get('binary-defense')) {
        try {
          window.MathLabGames.register({
            id: 'binary-defense',
            title: '바이너리 디펜스',
            icon: '🛡️',
            sourceType: 'new',
            players: '1~2인',
            isMultiplayer: true,
            mount(container, context) { BinaryDefenseGame.mount(container, context); },
            reset() { BinaryDefenseGame.resetToTitle(); },
            destroy() { BinaryDefenseGame.destroy(); },
            goHome() { BinaryDefenseGame.goHome(); }
          });
        } catch (e) {
          console.warn('안전 등록 방어:', e);
        }
      }
    }
  }

  registerMyApp();
  window.addEventListener('DOMContentLoaded', registerMyApp);
  setTimeout(registerMyApp, 100);
  setTimeout(registerMyApp, 500);

  window.BinaryDefenseGame = BinaryDefenseGame;

  window.initBinaryDefenseGame = function() {
    registerMyApp();
    if (window.LegacyBridge && typeof window.LegacyBridge.hideAllLegacySections === 'function') {
      window.LegacyBridge.hideAllLegacySections();
      window.LegacyBridge.showNewRoot();
    }
    if (typeof window.MathLabGames !== 'undefined' && typeof window.MathLabGames.mount === 'function') {
      try { window.MathLabGames.mount('binary-defense'); return; } catch(e) {}
    }
    BinaryDefenseGame.mount();
  };

  window.launchBinaryDefenseGame = window.initBinaryDefenseGame;
})();
</script>
