  border-radius: 16px;
  border: 1px solid #e2e8f0;
  box-shadow: 0 4px 6px rgba(0,0,0,0.02);

.lsv-app .t {

.lsv-app .sub-title {

}

/* Nav Tabs */
.lsv-app .nav-tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
  background: #ffffff;
  padding: 6px;
  border-radius: 14px;
  border: 1px solid #e2e8f0;
}
.lsv-app .tab-btn {
  flex: 1;
  padding: 12px 14px;
  border: none;
  border-radius: 10px;
  font-size: 0.98rem;
  font-weight: 800;
  cursor: pointer;
  background: transparent;
  color: #64748b;
  transition: all 0.2s;
  text-align: center;
}
.lsv-app .tab-btn.active {
  background: #0ea5e9;
  color: #ffffff;
  box-shadow: 0 4px 12px rgba(14,165,233,0.25);
}

/* Responsive Grid Layout for Desktop & Mobile */
.lsv-app .card {

  border: 1px solid #e2e8f0;
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 16px;
}
.lsv-app .card-title {
  font-size: 1.15rem;
  font-weight: 900;
  color: #0f172a;
  margin-top: 0;

  align-items: center;
  gap: 8px;
  border-bottom: 2px solid #f1f5f9;
  padding-bottom: 10px;
}

.lsv-app .grid-2 {
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  gap: 16px;
}
@media(max-width: 860px) {
  .lsv-app .grid-2 { grid-template-columns: 1fr; }
}

.lsv-app .stage-viewport {

  transition: border-color 0.2s;
}
.lsv-app .stage-viewport:hover {
  border-color: #0284c7;

.lsv-app .stage-emoji {

  font-size: 0.78rem;
  font-weight: 800;
  color: #64748b;

.lsv-app .dex-item {
  background: #f1f5f9;
  border: 1px solid #cbd5e1;
  border-radius: 10px;
  padding: 6px 10px;
  font-size: 0.85rem;
  font-weight: 800;
  color: #64748b;

.lsv-app .dex-item.discovered {

  background: #ffffff;
  color: #1e293b;

.lsv-app .btn.g { background: #059669; border-color: #059669; color: #ffffff; box-shadow: 0 3px 0 #047857; }

/* Slide Modal */
.lsv-app .modal { position: fixed; inset: 0; background: rgba(15,23,42,0.55); display: none; align-items: center; justify-content: center; z-index: 9400; padding: 14px; backdrop-filter: blur(4px); }
.lsv-app .modal.on { display: flex; }
.lsv-app .modal .mbox { background: #fff; border-radius: 18px; max-width: 600px; width: 100%; padding: 24px; max-height: 88vh; overflow: auto; box-shadow: 0 20px 50px rgba(15,23,42,0.3); }
.lsv-app .dots { display: flex; gap: 6px; justify-content: center; margin: 16px 0 8px; }
.lsv-app .dot { width: 8px; height: 8px; border-radius: 50%; background: #cbd5e1; transition: all 0.2s; }
.lsv-app .dot.on { background: #0284c7; width: 22px; border-radius: 10px; }

function renderMath(latex, container, displayMode) {
  if (typeof katex !== 'undefined' && container) {

    } catch(e){}

function updateMathElements() {

    var isDisplay = el.getAttribute('data-display') === 'true';
    if (tex) renderMath(tex, el, isDisplay);
  });
}

function getNearestObject(expVal) {
  var best = OBJECTS[0];
  var minDiff = 999;
  for (var i = 0; i < OBJECTS.length; i++) {
    var diff = Math.abs(OBJECTS[i].exp - expVal);
    if (diff < minDiff) {
      minDiff = diff;
      best = OBJECTS[i];
    }
  }
  return best;
}

    h += '        <div style="background:#f8fafc; border:1px solid #e2e8f0; border-radius:14px; padding:16px;">';
    h += '          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">';
    h += '            <div style="font-weight:900; font-size:1.05rem; color:#0f172a;">📚 탐험 수집 도감</div>';
    h += '            <div style="font-weight:800; color:#0284c7; font-size:0.95rem;" id="lbl-dex-count">0 / 22 수집</div>';
    h += '          </div>';

    h += '          <div class="dex-grid" id="dex-grid-box"></div>';

    h += '          <div style="background:#ffffff; border:1px solid #cbd5e1; border-radius:12px; padding:12px; margin-top:14px; font-size:0.88rem; line-height:1.6; color:#475569;">';
    h += '            💡 <b>로그의 직관적 원리:</b><br>';
    h += '            슬라이더가 오른쪽으로 <b>1칸</b> 이동할 때마다 실체 사물 크기는 <b>10배</b> 커지며, <b>3칸</b> 이동하면 $10^3 = 1,000$배 거대해집니다.';
    h += '          </div>';
    h += '        </div>';
    h += '      </div>';

    h += '    </div>';
    h += '  </div>';

    /* TAB 2: Math Model & Clean LaTeX */
    h += '  <div id="tab-sec-math" style="display:none;">';
    h += '    <div class="card">';
    h += '      <div class="card-title">📐 상용로그 수식과 지수 차이 연산</div>';

    h += '      <div style="line-height:1.7; color:#334155; margin-bottom:16px;">';
    h += '        상용로그(Common Logarithm)는 10을 밑으로 하여 거대한 수치들의 자릿수를 일차선형 수치로 정돈하는 강력한 수학적 도구입니다.';
    h += '      </div>';

    h += '      <div style="background:#f0f9ff; border:1px solid #bae6fd; border-radius:14px; padding:16px; margin-bottom:14px; line-height:1.7;">';
    h += '        <div style="font-weight:900; font-size:1.05rem; color:#0369a1; margin-bottom:6px;">1. 상용로그의 기본 변환 수식</div>';
    h += '        <div class="math-block"><span class="math-tex" data-display="true" data-tex="y = \\log_{10} x \\iff x = 10^y"></span></div>';
    h += '        <p>예를 들어 지구 지름 $10^7$ m 의 상용로그 값은 $\\log_{10}(10^7) = 7$ 입니다.</p>';
    h += '      </div>';

    h += '      <div style="background:#fefce8; border:1px solid #fde047; border-radius:14px; padding:16px; margin-bottom:14px; line-height:1.7;">';
    h += '        <div style="font-weight:900; font-size:1.05rem; color:#854d0e; margin-bottom:6px;">2. 상용로그 뺄셈 성질과 비율 연산</div>';
    h += '        <p>지구 지름($10^7$ m)과 사람 키($10^0$ m)의 크기 비율 연산:</p>';
    h += '        <div class="math-block"><span class="math-tex" data-display="true" data-tex="\\log_{10} \\left( \\frac{10^7}{10^0} \\right) = \\log_{10}(10^7) - \\log_{10}(10^0) = 7 - 0 = 7"></span></div>';
    h += '        <p>따라서 지구의 지름은 사람 키의 $10^7 = 10,000,000$배 (천만 배)임을 알 수 있습니다.</p>';
    h += '      </div>';

    /* Non-squished Quiz Controls */
    h += '      <div style="background:#ffffff; border:1px solid #cbd5e1; border-radius:14px; padding:18px; margin-top:16px;">';
    h += '        <div style="font-weight:900; color:#0284c7; margin-bottom:8px; font-size:1.05rem;">🧠 개념 확인 퀴즈</div>';
    h += '        <div style="font-size:0.95rem; font-weight:800; color:#0f172a; margin-bottom:12px;">Q. 태양 지름($10^9$ m)은 사람 키($10^0$ m)의 몇 배일까요? 지수 수치를 입력하세요. ($10^k$ 배의 $k$값)</div>';
    h += '        <input type="text" id="inp-quiz-ans" class="inp" placeholder="예: 9 키보드로 입력">';
    h += '        <button type="button" class="btn p" id="btn-submit-quiz" style="width:100%; padding:12px; font-size:1rem;">퀴즈 제출</button>';
    h += '        <div id="lbl-quiz-msg" style="margin-top:10px; font-weight:800; font-size:0.92rem;"></div>';
    h += '      </div>';

    h += '    </div>';
    h += '  </div>';

    /* TAB 3: Problem Solving */
    h += '  <div id="tab-sec-prob" style="display:none;">';
    h += '    <div class="card">';
    h += '      <div class="card-title">🧩 실전 로그 스케일 및 상용로그 탐구 문제 (4선)</div>';

    var probs = [
      {
        title: "Q1. 리히터 지진 규모와 지수 스케일",
        q: "지진의 규모 M은 로그 스케일로 정해집니다. 리히터 규모 7의 지진은 리히터 규모 5의 지진보다 에너지가 몇 배 강력할까요? (규모 1 증가 당 약 31.6배 $\\approx 10^{1.5}$ 배)",
        sol: "<b>[수학적 계산]</b><br>• 규모 차이: <span class=\"math-tex\" data-tex=\"\\Delta M = 7 - 5 = 2\"></span><br>• 에너지 차이: <span class=\"math-tex\" data-tex=\"10^{1.5 \\times 2} = 10^3 = 1,000\\text{배}\"></span><br>• 따라서 규모 7의 지진은 규모 5보다 약 1,000배 강한 에너지를 방출합니다."
      },
      {
        title: "Q2. 소음 데시벨(dB) 단위와 상용로그",
        q: "소음 측정 단위 dB는 <span class=\"math-tex\" data-tex=\"dB = 10 \\log_{10} (I / I_0)\"></span> 수식을 따릅니다. 60 dB 소음은 30 dB 소음보다 세기가 몇 배 강할까요?",
        sol: "<b>[수학적 증명]</b><br>• 데시벨 차이: <span class=\"math-tex\" data-tex=\"60 - 30 = 30\\text{ dB}\"></span><br>• 세기 비율: <span class=\"math-tex\" data-tex=\"10 \\log_{10}(I_1 / I_2) = 30 \\implies \\log_{10}(I_1 / I_2) = 3 \\implies 10^3 = 1,000\\text{배}\"></span>"
      },
      {
        title: "Q3. 수소 이온 농도(pH) 수식",
        q: "pH는 <span class=\"math-tex\" data-tex=\"\\text{pH} = -\\log_{10} [H^+]\"></span> 로 정의됩니다. pH 3 산성 용액은 pH 6 용액보다 수소 이온 농도가 몇 배 높은가요?",
        sol: "<b>[수학적 분석]</b><br>• pH 차이: <span class=\"math-tex\" data-tex=\"6 - 3 = 3\"></span><br>• 농도 비율: <span class=\"math-tex\" data-tex=\"10^3 = 1,000\\text{배}\"></span><br>• pH 수치가 3 낮으면 수소 이온 농도는 1,000배 높습니다."
      },
      {
        title: "Q4. 별의 등급과 겉보기 밝기",
        q: "별의 1등급 차이는 약 2.512배 밝기 차이($10^{0.4}$ 배)입니다. 1등성과 6등성의 밝기 차이는 몇 배인가요?",
        sol: "<b>[정답: 100배]</b><br>• 등급 차이: <span class=\"math-tex\" data-tex=\"6 - 1 = 5\\text{등급}\"></span><br>• 밝기 비율: <span class=\"math-tex\" data-tex=\"10^{0.4 \\times 5} = 10^2 = 100\\text{배}\"></span>"
      }
    ];

    probs.forEach(function(item, idx) {
      h += '<div style="background:#ffffff; border:1px solid #e2e8f0; border-radius:14px; padding:16px; margin-bottom:14px;">';
      h += '  <div style="font-weight:900; font-size:1.05rem; color:#0284c7; margin-bottom:6px;">' + item.title + '</div>';
      h += '  <div style="line-height:1.6; color:#334155; margin-bottom:10px;">' + item.q + '</div>';
      h += '  <button type="button" class="btn p btn-show-sol" data-idx="' + idx + '">💡 수학적 해설 보기</button>';
      h += '  <div id="sol-' + idx + '" style="display:none; background:#f8fafc; border:1px solid #cbd5e1; border-radius:12px; padding:14px; margin-top:10px; font-size:0.92rem; line-height:1.65;">' + item.sol + '</div>';
      h += '</div>';
    });

    h += '  </div>';
    h += '  </div>';

    /* Slide Modal */
    h += '<div class="modal" id="lsv-modal">';
    h += '  <div class="mbox" id="lsv-modal-box"></div>';
    h += '</div>';

    h += '</div>';
    return h;
  },

  bindEvents: function() {
    var _this = this;
    var root = S.host.querySelector('#lsv-app-root');

    /* Tabs */
    root.querySelectorAll('.tab-btn').forEach(function(btn) {
      btn.onclick = function() {
        root.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
        this.classList.add('active');
        S.activeTab = this.getAttribute('data-tab');

        root.querySelector('#tab-sec-sim').style.display = (S.activeTab === 'sim') ? 'block' : 'none';
        root.querySelector('#tab-sec-math').style.display = (S.activeTab === 'math') ? 'block' : 'none';
        root.querySelector('#tab-sec-prob').style.display = (S.activeTab === 'prob') ? 'block' : 'none';

        updateMathElements();
      };
    });

    /* Slider Input Event */
    var slider = root.querySelector('#rng-log-scale');
    slider.oninput = function() {
      S.exp = parseInt(this.value, 10);
      _this.updateStage();
    };

    /* Mouse Wheel Scroll Event on Viewport Box */
    var stageViewport = root.querySelector('#stage-viewport-box');
    stageViewport.addEventListener('wheel', function(e) {
      e.preventDefault(); // Prevent full page scrolling when navigating scale
      
      if (S.wheelThrottleTimer) return;
      S.wheelThrottleTimer = setTimeout(function() { S.wheelThrottleTimer = null; }, 40);

      if (e.deltaY < 0) {
        // Scroll Up -> Increase Exponent
        if (S.exp < MAX_EXP) {
          S.exp++;
          slider.value = S.exp;
          _this.updateStage();
        }
      } else if (e.deltaY > 0) {
        // Scroll Down -> Decrease Exponent
        if (S.exp > MIN_EXP) {
          S.exp--;
          slider.value = S.exp;
          _this.updateStage();
        }
      }
    }, { passive: false });

    /* Buttons */
    root.querySelector('#btn-reset-exp').onclick = function() {
      S.exp = 0;
      slider.value = 0;
      _this.updateStage();
    };

    root.querySelector('#btn-random-voyage').onclick = function() {
      var rObj = OBJECTS[Math.floor(Math.random() * OBJECTS.length)];
      S.exp = rObj.exp;
      slider.value = S.exp;
      _this.updateStage();
    };

    /* Quiz */
    root.querySelector('#btn-submit-quiz').onclick = function() {
      var val = (root.querySelector('#inp-quiz-ans').value || '').trim();
      var msgEl = root.querySelector('#lbl-quiz-msg');
      if (val === '9') {
        msgEl.innerHTML = '✅ <b>정답입니다!</b> log₁₀(10⁹ / 10⁰) = 9 - 0 = 9 지수 차이가 나므로 10⁹배 (10억 배) 거대합니다.';
        msgEl.style.color = '#059669';
      } else {
        msgEl.innerHTML = '❌ 오답입니다. (힌트: 10⁹ m / 10⁰ m 의 지수 차이 9 입니다)';
        msgEl.style.color = '#ef4444';
      }
    };

    /* Solutions Toggle */
    root.querySelectorAll('.btn-show-sol').forEach(function(btn) {
      btn.onclick = function() {
        var idx = this.getAttribute('data-idx');
        var solEl = root.querySelector('#sol-' + idx);
        if (solEl) {
          var isShown = solEl.style.display === 'block';
          solEl.style.display = isShown ? 'none' : 'block';
          this.textContent = isShown ? '💡 수학적 해설 보기' : '🙈 해설 닫기';
          updateMathElements();
        }
      };
    });

    /* Modal Open & Render Slide */
    root.querySelector('#btn-open-guide').onclick = function() {
      S.guidePage = 0;
      _this.renderSlideGuide();
      root.querySelector('#lsv-modal').classList.add('on');
    };
  },

  updateStage: function() {
    var root = S.host.querySelector('#lsv-app-root');
    if (!root) return;

    var obj = getNearestObject(S.exp);
    S.found[obj.exp] = true; // Mark as collected in Dex

    root.querySelector('#lbl-exp-val').textContent = 'k = ' + (S.exp >= 0 ? '+' + S.exp : S.exp) + ' (10^{' + S.exp + '} m)';
    root.querySelector('#lbl-stage-emoji').textContent = obj.emoji;
    
    // Smooth Scale Animation based on distance
    var scaleFactor = 1 + Math.max(0, 0.25 - Math.abs(obj.exp - S.exp) * 0.08);
    root.querySelector('#lbl-stage-emoji').style.transform = 'scale(' + scaleFactor.toFixed(2) + ')';
    
    root.querySelector('#lbl-stage-name').textContent = obj.name;
    root.querySelector('#lbl-stage-meta').textContent = obj.m + ' · ' + obj.note;
    root.querySelector('#lbl-stage-pow').textContent = '상용로그 값 log₁₀ x = ' + S.exp + '  (가장 가까운 표준 사물: 10^{' + obj.exp + '} m)';

    this.renderDex();
    updateMathElements();
  },

  renderDex: function() {
    var root = S.host.querySelector('#lsv-app-root');
    if (!root) return;

    var dexGrid = root.querySelector('#dex-grid-box');
    var collectedCount = Object.keys(S.found).length;
    root.querySelector('#lbl-dex-count').textContent = collectedCount + ' / ' + OBJECTS.length + ' 수집 완료';

    dexGrid.innerHTML = OBJECTS.map(function(obj) {
      var isFound = S.found[obj.exp];
      var cls = 'dex-item' + (isFound ? ' discovered' : '');
      return '<div class="' + cls + '">' + (isFound ? obj.emoji + ' ' : '🔒 ') + obj.name + '</div>';
    }).join('');
  },

  renderSlideGuide: function() {
    var _this = this;
    var root = S.host.querySelector('#lsv-app-root');
    var mBox = root.querySelector('#lsv-modal-box');
    if (!mBox) return;

    var pg = SLIDE_GUIDE[S.guidePage] || SLIDE_GUIDE[0];
    var dots = SLIDE_GUIDE.map(function(_, i) {
      return '<span class="dot' + (i === S.guidePage ? ' on' : '') + '"></span>';
    }).join('');
    var isLast = S.guidePage >= SLIDE_GUIDE.length - 1;

    var h = '';
    h += '<div style="font-size:.8rem; font-weight:800; color:#0284c7; margin-bottom:4px;">온보딩 슬라이드 탐구 ' + (S.guidePage + 1) + ' / ' + SLIDE_GUIDE.length + '</div>';
    h += '<h3 style="margin:0 0 12px; color:#0f172a; font-weight:900;">' + pg.title + '</h3>';
    h += '<div style="line-height:1.65; color:#334155; font-size:0.95rem;">' + pg.html + '</div>';
    h += '<div class="dots">' + dots + '</div>';

    h += '<div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px;">';
    h += '  <button type="button" class="btn" id="btn-slide-prev"' + (S.guidePage === 0 ? ' disabled' : '') + '>← 이전</button>';
    h += '  <button type="button" class="btn p" id="btn-slide-next">' + (isLast ? '탐구 시작하기 🚀' : '다음 →') + '</button>';
    h += '</div>';

    mBox.innerHTML = h;
    updateMathElements();

    var prevBtn = mBox.querySelector('#btn-slide-prev');
    var nextBtn = mBox.querySelector('#btn-slide-next');

    if (prevBtn) {
      prevBtn.onclick = function() {
        if (S.guidePage > 0) {
          S.guidePage--;
          _this.renderSlideGuide();
        }
      };
    }
    if (nextBtn) {
      nextBtn.onclick = function() {
        if (isLast) {
          root.querySelector('#lsv-modal').classList.remove('on');
        } else {
          S.guidePage++;
          _this.renderSlideGuide();
        }
      };
    }
  },

  destroy: function() {
    if (S.host) S.host.innerHTML = '';
    S.host = null;
  }
};

function goHome() {
  if (S.host) S.host.innerHTML = '';
  if (typeof window.LegacyBridge !== 'undefined' && typeof window.LegacyBridge.backHome === 'function') {
    window.LegacyBridge.backHome();
  } else if (typeof window.MathLabGames !== 'undefined' && window.MathLabGames.goHome) {
    window.MathLabGames.goHome();
  } else {
    window.location.reload();
  }
}

function reg() {
  if (typeof window.MathLabGames === 'undefined' || typeof window.MathLabGames.register !== 'function') return;
  try {
    if (window.MathLabGames.get && window.MathLabGames.get(APP_ID)) return;
    window.MathLabGames.register({
      id: APP_ID,
      title: APP_TITLE,
      icon: ICON,
      sourceType: 'new',
      players: '1인',
      isMultiplayer: false,
      mount: function(c, x) { LogScaleVoyageApp.mount(c, x); },
      reset: function() { LogScaleVoyageApp.updateStage(); },
      destroy: function() { LogScaleVoyageApp.destroy(); },
      goHome: function() { goHome(); }
    });
  } catch (e) {
    console.warn(APP_ID + ' reg', e);
  }
}

reg();
window.addEventListener('DOMContentLoaded', reg);
setTimeout(reg, 100);
setTimeout(reg, 500);

window.LogScaleVoyage = {
  mount: function(c) { LogScaleVoyageApp.mount(c); },
  resetGame: function() { LogScaleVoyageApp.updateStage(); },
  destroy: function() { LogScaleVoyageApp.destroy(); },
  goHome: goHome
};

window.initLogScaleVoyage = function() {
  reg();
  try {
    if (window.LegacyBridge) {
      window.LegacyBridge.hideAllLegacySections();
      if (window.LegacyBridge.showNewRoot) window.LegacyBridge.showNewRoot();
    }
  } catch (e) {}
  if (window.MathLabGames && window.MathLabGames.mount) {
    try { window.MathLabGames.mount(APP_ID); return; } catch (e) {}
  }
  LogScaleVoyageApp.mount(document.getElementById('mathlab-view'));
};

window.launchLogScaleVoyage = window.initLogScaleVoyage;
})();
</script>
