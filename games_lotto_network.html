<!--
  수학 실험실 Gen-3 앱: 로또 번호 네트워크 (games_lotto_network.html) — 최종 버전
  - id: lotto-network / 아이콘: 🔗 / 유형: 확률·통계 탐구 도구 (점수·명예의 전당 없음)
  - 라이트(화이트) 테마 / 명확한 실행 버튼 / 최다 출현 TOP 10 패널 통합
  - Force-directed 네트워크 + 번호 클릭 관계망 강조
  - index.html에는 <?!= include('games_lotto_network'); ?> 1줄만 추가
  - js_app.html 수정 없음: launchMathLabGame('lotto-network') 범용 실행
-->
<style>

.game-lotto-network .gln-header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }

.game-lotto-network .gln-run-bar { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 10px 14px; }
.game-lotto-network .gln-run-hint { font-size: 0.8rem; color: #64748b; line-height: 1.5; }

.game-lotto-network .gln-legend-item { display: flex; align-items: center; gap: 5px; color: #64748b; }

.game-lotto-network .gln-stats { display: flex; gap: 10px; flex-wrap: wrap; }

.game-lotto-network .gln-top10-title { font-size: 0.9rem; font-weight: 800; color: #334155; margin-bottom: 10px; }
.game-lotto-network .gln-top10-title small { color: #94a3b8; font-weight: 600; }
.game-lotto-network .gln-top10-row { display: flex; gap: 8px; flex-wrap: wrap; }
.game-lotto-network .gln-top10-item { display: flex; align-items: center; gap: 6px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 999px; padding: 4px 12px 4px 5px; cursor: pointer; transition: border-color 0.12s, background 0.12s; }
.game-lotto-network .gln-top10-item:hover { border-color: #c4b5fd; background: #f5f3ff; }
.game-lotto-network .gln-top10-item.selected { border-color: #7c3aed; background: #f5f3ff; }
.game-lotto-network .gln-top10-rank { font-size: 0.74rem; font-weight: 800; color: #94a3b8; min-width: 26px; text-align: center; }
.game-lotto-network .gln-top10-item.selected .gln-top10-rank { color: #7c3aed; }
.game-lotto-network .gln-top10-count { font-size: 0.78rem; font-weight: 800; color: #475569; }
.game-lotto-network .gln-top10-item .gln-ball { width: 30px; height: 30px; font-size: 0.76rem; cursor: inherit; }

.game-lotto-network .gln-number-bar-title { font-size: 0.82rem; color: #64748b; margin-bottom: 8px; font-weight: 700; }
.game-lotto-network .gln-number-row { display: flex; gap: 6px; flex-wrap: wrap; }
.game-lotto-network .gln-ball { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 0.8rem; cursor: pointer; transition: transform 0.12s; border: 2px solid transparent; box-shadow: inset 0 -3px 0 rgba(0,0,0,0.08); }
.game-lotto-network .gln-ball:hover { transform: scale(1.12); }
.game-lotto-network .gln-ball.selected { border-color: #0f172a; transform: scale(1.12); }
.game-lotto-network .gln-ball.b1-9 { background: #fbbf24; color: #78350f; }
.game-lotto-network .gln-ball.b10-19 { background: #60a5fa; color: #1e3a8a; }
.game-lotto-network .gln-ball.b20-29 { background: #f87171; color: #7f1d1d; }
.game-lotto-network .gln-ball.b30-39 { background: #a3e635; color: #1a2e05; }
.game-lotto-network .gln-ball.b40-45 { background: #a78bfa; color: #2e1065; }
</style>

<script>
(function () {
'use strict';

const LottoNetwork = {
  container: null, root: null, canvas: null, ctx: null,
  state: {
    rounds: 30, minEdgeWeight: 5, selectedNode: null,
    nodes: [], edges: [], freq: {}, pairs: {},
    rafId: null, physics: true
  },

  q(sel) { return this.root ? this.root.querySelector(sel) : null; },
  setText(sel, v) { const el = this.q(sel); if (el) el.textContent = String(v); },
  ballClass(n) { return n <= 9 ? 'b1-9' : n <= 19 ? 'b10-19' : n <= 29 ? 'b20-29' : n <= 39 ? 'b30-39' : 'b40-45'; },
  ballColor(n) {
    if (n <= 9) return '#fbbf24'; if (n <= 19) return '#60a5fa';
    if (n <= 29) return '#f87171'; if (n <= 39) return '#a3e635'; return '#a78bfa';
  },
  ballTextColor(n) {
    if (n <= 9) return '#78350f'; if (n <= 19) return '#1e3a8a';
    if (n <= 29) return '#7f1d1d'; if (n <= 39) return '#1a2e05'; return '#2e1065';
  },

  mount(container, context) {
  const view = document.getElementById('mathlab-view');
  const fbId = 'lotto-network-force-host';
  let host = container || view; // ⭕ 모달(container)을 최우선 타깃으로 설정
    if (!host || typeof host.innerHTML === 'undefined') {
      host = document.getElementById(fbId);
      if (!host) { host = document.createElement('div'); host.id = fbId; document.body.appendChild(host); }
    }
    if (host.style) { host.style.display = ''; host.style.minHeight = host.style.minHeight || '60vh'; }
    this.container = host;
    this.renderShell();
    this.root = host.querySelector('.game-lotto-network');
    if (!this.root) {
      console.error('[LottoNetwork] .game-lotto-network 루트를 찾을 수 없습니다.', host);
      return;
    }
    this.initCanvas();
    this.bindEvents();
    this.simulate();
  },

  renderShell() {
    this.container.innerHTML = `<br>      <div class="game-lotto-network" id="gln-root"><br>        <div class="gln-header"><br>          <div><br>            <div class="gln-title">🔗 로또 숫자 관계망 분석기</div><br>            <div class="gln-desc">로또 번호 사이의 동시 출현 관계를 네트워크 그래프로 탐구합니다</div><br>          </div><br>          <div class="gln-controls"><br>            <button type="button" class="gln-btn" id="gln-home">🏠 홈으로</button><br>          </div><br>        </div><br>        <div class="gln-concept"><br>          <strong>📊 핵심 개념</strong>: 45개의 로또 번호를 <strong>노드(꼭짓점)</strong>로, 두 번호가 같은 회차에 함께 당첨된 횟수를 <strong>엣지(간선)의 굵기</strong>로 표현한 <strong>가중치 무방향 그래프</strong>입니다. 공(번호)을 클릭하면 그 번호와 연결된 관계망만 강조됩니다.<br>        </div><br>        <div class="gln-run-bar"><br>          <button type="button" class="gln-btn gln-btn-run" id="gln-run">▶ 시뮬레이션 실행</button><br>          <span class="gln-run-hint">누를 때마다 설정한 회차만큼 로또 추첨을 새로 시뮬레이션하고 네트워크를 다시 그립니다.</span><br>        </div><br>        <div class="gln-settings"><br>          <div class="gln-field"><br>            <label>시뮬레이션 회차:</label><br>            <input type="range" id="gln-rounds" min="10" max="200" step="10" value="30"><br>            <span class="gln-fval" id="gln-rounds-val">30</span>회<br>          </div><br>          <div class="gln-field"><br>            <label>최소 연결 횟수:</label><br>            <input type="range" id="gln-min-edge" min="1" max="20" step="1" value="5"><br>            <span class="gln-fval" id="gln-min-edge-val">5</span>회 이상<br>          </div><br>          <div class="gln-field"><br>            <label>물리 시뮬레이션:</label><br>            <input type="checkbox" id="gln-physics" checked style="accent-color:#7c3aed;width:16px;height:16px;cursor:pointer;"><br>          </div><br>        </div><br>        <div class="gln-canvas-wrap"><canvas id="gln-canvas"></canvas></div><br>        <div class="gln-legend"><br>          <div class="gln-legend-item"><div class="gln-legend-dot" style="background:#fbbf24"></div>1~9번</div><br>          <div class="gln-legend-item"><div class="gln-legend-dot" style="background:#60a5fa"></div>10~19번</div><br>          <div class="gln-legend-item"><div class="gln-legend-dot" style="background:#f87171"></div>20~29번</div><br>          <div class="gln-legend-item"><div class="gln-legend-dot" style="background:#a3e635"></div>30~39번</div><br>          <div class="gln-legend-item"><div class="gln-legend-dot" style="background:#a78bfa"></div>40~45번</div><br>          <div class="gln-legend-item" style="margin-left:auto">선 굵기 = 동시 출현 횟수 / 노드 크기 = 총 출현 빈도</div><br>        </div><br>        <div class="gln-stats"><br>          <div class="gln-stat"><div class="gln-stat-label">총 시뮬레이션 회차</div><div class="gln-stat-val" id="gln-s-rounds">-</div></div><br>          <div class="gln-stat"><div class="gln-stat-label">표시된 연결(엣지) 수</div><div class="gln-stat-val" id="gln-s-edges">-</div></div><br>          <div class="gln-stat"><div class="gln-stat-label">가장 많이 나온 번호</div><div class="gln-stat-val" id="gln-s-top">-</div></div><br>          <div class="gln-stat"><div class="gln-stat-label">가장 강한 연결 쌍</div><div class="gln-stat-val" id="gln-s-pair">-</div></div><br>        </div><br>        <div class="gln-top10"><br>          <div class="gln-top10-title">🏆 최다 출현 번호 TOP 10 <small>(클릭하면 네트워크에서 해당 번호 강조)</small></div><br>          <div class="gln-top10-row" id="gln-top10-row"></div><br>        </div><br>        <div class="gln-number-bar"><br>          <div class="gln-number-bar-title">전체 번호판 — 번호 클릭 → 해당 번호의 관계망만 강조 (다시 클릭하면 해제)</div><br>          <div class="gln-number-row" id="gln-number-row"></div><br>        </div><br>      </div>`;
  },

  initCanvas() {
    this.canvas = this.q('#gln-canvas');
    this.ctx = this.canvas ? this.canvas.getContext('2d') : null;
    if (!this.canvas) return;
    const wrap = this.canvas.parentElement;
    const w = Math.min((wrap && wrap.clientWidth) || 600, 800);
    const h = Math.round(w * 0.7);
    this.canvas.width = w; this.canvas.height = h; this.canvas.style.height = h + 'px';
    this.canvas.addEventListener('click', (e) => {
      const rect = this.canvas.getBoundingClientRect();
      const sx = this.canvas.width / rect.width, sy = this.canvas.height / rect.height;
      this.handleCanvasClick((e.clientX - rect.left) * sx, (e.clientY - rect.top) * sy);
    });
    this.canvas.addEventListener('touchend', (e) => {
      e.preventDefault();
      const t = e.changedTouches[0];
      const rect = this.canvas.getBoundingClientRect();
      const sx = this.canvas.width / rect.width, sy = this.canvas.height / rect.height;
      this.handleCanvasClick((t.clientX - rect.left) * sx, (t.clientY - rect.top) * sy);
    }, { passive: false });
  },

  handleCanvasClick(x, y) {
    const S = this.state;
    for (const node of S.nodes) {
      if (Math.hypot(x - node.x, y - node.y) <= node.r + 4) { this.selectNumber(node.num); return; }
    }
    if (S.selectedNode !== null) {
      S.selectedNode = null;
      this.updateBallBar(); this.updateTop10(); this.drawGraph();
    }
  },

  selectNumber(num) {
    const S = this.state;
    S.selectedNode = S.selectedNode === num ? null : num;
    this.updateBallBar(); this.updateTop10(); this.drawGraph();
  },

  simulate() {
    const S = this.state;
    if (!this.root) return;
    S.freq = {}; S.pairs = {};
    for (let i = 1; i <= 45; i++) S.freq[i] = 0;
    for (let r = 0; r < S.rounds; r++) {
      const draw = this.drawLotto();
      draw.forEach((n) => { S.freq[n]++; });
      for (let a = 0; a < draw.length; a++) {
        for (let b = a + 1; b < draw.length; b++) {
          const key = draw[a] + '-' + draw[b];
          S.pairs[key] = (S.pairs[key] || 0) + 1;
        }
      }
    }
    this.buildNodes(); this.buildEdges();
    this.updateStats(); this.updateBallBar(); this.updateTop10();
    this.startPhysics();
  },

  drawLotto() {
    const pool = Array.from({ length: 45 }, (_, i) => i + 1);
    const picks = [];
    for (let i = 0; i < 6; i++) {
      const idx = Math.floor(Math.random() * pool.length);
      picks.push(pool[idx]);
      pool.splice(idx, 1);
    }
    return picks.sort((a, b) => a - b);
  },

  buildNodes() {
    const S = this.state;
    const W = this.canvas ? this.canvas.width : 600;
    const H = this.canvas ? this.canvas.height : 420;
    const CX = W / 2, CY = H / 2, R_LAYOUT = Math.min(W, H) * 0.38;
    const freqValues = Object.values(S.freq);
    const maxFreq = freqValues.length ? Math.max.apply(null, freqValues) : 1;
    S.nodes = [];
    for (let i = 1; i <= 45; i++) {
      const angle = ((i - 1) / 45) * Math.PI * 2 - Math.PI / 2;
      const freqRatio = (S.freq[i] || 0) / (maxFreq || 1);
      S.nodes.push({
        num: i,
        x: CX + Math.cos(angle) * R_LAYOUT,
        y: CY + Math.sin(angle) * R_LAYOUT,
        vx: 0, vy: 0, fx: 0, fy: 0,
        r: 9 + freqRatio * 10,
        freq: S.freq[i] || 0,
        color: this.ballColor(i)
      });
    }
  },

  buildEdges() {
    const S = this.state;
    S.edges = [];
    const weights = Object.values(S.pairs).filter((v) => v >= S.minEdgeWeight);
    const maxPairWeight = weights.length ? Math.max.apply(null, weights) : 1;
    Object.entries(S.pairs).forEach(([key, weight]) => {
      if (weight < S.minEdgeWeight) return;
      const parts = key.split('-');
      S.edges.push({ a: parseInt(parts[0], 10), b: parseInt(parts[1], 10), weight: weight, ratio: weight / maxPairWeight });
    });
  },

  nodeByNum(num) { return this.state.nodes.find((n) => n.num === num); },

  drawGraph() {
    const S = this.state;
    if (!this.ctx || !this.canvas) return;
    const ctx = this.ctx;
    const W = this.canvas.width, H = this.canvas.height;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#f8fafc';
    ctx.fillRect(0, 0, W, H);
    const sel = S.selectedNode;
    for (const edge of S.edges) {
      const na = this.nodeByNum(edge.a), nb = this.nodeByNum(edge.b);
      if (!na || !nb) continue;
      const highlight = sel === null || sel === edge.a || sel === edge.b;
      ctx.beginPath(); ctx.moveTo(na.x, na.y); ctx.lineTo(nb.x, nb.y);
      ctx.strokeStyle = highlight ? 'rgba(124,58,237,' + (0.22 + edge.ratio * 0.6).toFixed(3) + ')' : 'rgba(148,163,184,0.12)';
      ctx.lineWidth = highlight ? 0.6 + edge.ratio * 3.5 : 0.5;
      ctx.stroke();
    }
    for (const node of S.nodes) {
      const isSel = sel === node.num;
      const connected = sel !== null && S.edges.some((e) => (e.a === sel && e.b === node.num) || (e.b === sel && e.a === node.num));
      ctx.globalAlpha = sel === null || isSel || connected ? 1 : 0.25;
      ctx.beginPath(); ctx.arc(node.x, node.y, node.r, 0, Math.PI * 2);
      ctx.fillStyle = node.color; ctx.fill();
      ctx.strokeStyle = isSel ? '#0f172a' : 'rgba(15,23,42,0.15)';
      ctx.lineWidth = isSel ? 3 : 1;
      ctx.stroke();
      ctx.fillStyle = this.ballTextColor(node.num);
      ctx.font = 'bold ' + Math.max(9, Math.round(node.r * 0.72)) + 'px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(node.num, node.x, node.y);
      ctx.globalAlpha = 1;
    }
  },

  startPhysics() {
    const S = this.state;
    if (S.rafId) cancelAnimationFrame(S.rafId);
    if (!S.physics) { this.drawGraph(); return; }
    const CX = this.canvas ? this.canvas.width / 2 : 300;
    const CY = this.canvas ? this.canvas.height / 2 : 210;
    let iter = 0;
    const step = () => {
      if (!this.root || !S.physics || iter > 300) { S.rafId = null; this.drawGraph(); return; }
      iter++;
      for (const node of S.nodes) { node.fx = 0; node.fy = 0; }
      for (let i = 0; i < S.nodes.length; i++) {
        for (let j = i + 1; j < S.nodes.length; j++) {
          const a = S.nodes[i], b = S.nodes[j];
          const dx = a.x - b.x, dy = a.y - b.y;
          const dist = Math.max(Math.hypot(dx, dy), 1);
          const force = 3000 / (dist * dist);
          const fx = (dx / dist) * force, fy = (dy / dist) * force;
          a.fx += fx; a.fy += fy; b.fx -= fx; b.fy -= fy;
        }
      }
      for (const edge of S.edges) {
        const na = this.nodeByNum(edge.a), nb = this.nodeByNum(edge.b);
        if (!na || !nb) continue;
        const dx = nb.x - na.x, dy = nb.y - na.y;
        const dist = Math.max(Math.hypot(dx, dy), 1);
        const restLen = 80 + (1 - edge.ratio) * 80;
        const force = (dist - restLen) * 0.02 * edge.ratio;
        const fx = (dx / dist) * force, fy = (dy / dist) * force;
        na.fx += fx; na.fy += fy; nb.fx -= fx; nb.fy -= fy;
      }
      for (const node of S.nodes) {
        node.fx += (CX - node.x) * 0.01;
        node.fy += (CY - node.y) * 0.01;
        node.vx = (node.vx + node.fx) * 0.85;
        node.vy = (node.vy + node.fy) * 0.85;
        node.x += node.vx; node.y += node.vy;
        const pad = node.r + 4;
        if (node.x < pad) { node.x = pad; node.vx = 0; }
        if (node.y < pad) { node.y = pad; node.vy = 0; }
        if (this.canvas && node.x > this.canvas.width - pad) { node.x = this.canvas.width - pad; node.vx = 0; }
        if (this.canvas && node.y > this.canvas.height - pad) { node.y = this.canvas.height - pad; node.vy = 0; }
      }
      this.drawGraph();
      S.rafId = requestAnimationFrame(step);
    };
    S.rafId = requestAnimationFrame(step);
  },

  updateStats() {
    const S = this.state;
    this.setText('#gln-s-rounds', S.rounds + '회');
    this.setText('#gln-s-edges', S.edges.length + '개');
    const topNum = Object.entries(S.freq).sort((a, b) => b[1] - a[1] || Number(a[0]) - Number(b[0]))[0];
    if (topNum) this.setText('#gln-s-top', topNum[0] + '번 (' + topNum[1] + '회)');
    const topPair = Object.entries(S.pairs).sort((a, b) => b[1] - a[1])[0];
    if (topPair) this.setText('#gln-s-pair', topPair[0] + '번 (' + topPair[1] + '회)');
  },

  updateTop10() {
    const S = this.state;
    const row = this.q('#gln-top10-row');
    if (!row) return;
    row.innerHTML = '';
    const top = Object.entries(S.freq)
      .map(([n, c]) => [parseInt(n, 10), c])
      .sort((a, b) => b[1] - a[1] || a[0] - b[0])
      .slice(0, 10);
    top.forEach(([num, cnt], i) => {
      const item = document.createElement('div');
      item.className = 'gln-top10-item' + (S.selectedNode === num ? ' selected' : '');
      item.title = num + '번: ' + cnt + '회 출현';
      item.innerHTML = '<span class="gln-top10-rank">' + (i + 1) + '위</span>' +
        '<div class="gln-ball ' + this.ballClass(num) + '">' + num + '</div>' +
        '<span class="gln-top10-count">' + cnt + '회</span>';
      item.addEventListener('click', () => this.selectNumber(num));
      row.appendChild(item);
    });
  },

  updateBallBar() {
    const S = this.state;
    const row = this.q('#gln-number-row');
    if (!row) return;
    row.innerHTML = '';
    for (let i = 1; i <= 45; i++) {
      const btn = document.createElement('div');
      btn.className = 'gln-ball ' + this.ballClass(i) + (S.selectedNode === i ? ' selected' : '');
      btn.textContent = i;
      btn.title = i + '번: ' + (S.freq[i] || 0) + '회 출현';
      btn.addEventListener('click', () => this.selectNumber(i));
      row.appendChild(btn);
    }
  },

  bindEvents() {
    const root = this.root;
    if (!root) {
      console.error('[LottoNetwork] .game-lotto-network 루트를 찾을 수 없습니다.', this.container);
      return;
    }
    const runBtn = this.q('#gln-run');
    if (runBtn) runBtn.addEventListener('click', () => { this.state.selectedNode = null; this.simulate(); });
    const homeBtn = this.q('#gln-home');
    if (homeBtn) homeBtn.addEventListener('click', () => {
      this.destroy();
      const mv = document.getElementById('mathlab-view');
      const fh = document.getElementById('lotto-network-force-host');
      if (mv) { mv.style.display = 'none'; mv.innerHTML = ''; }
      if (fh) { fh.style.display = 'none'; fh.innerHTML = ''; }
      const ag = document.querySelector('.app-grid');
      const ds = document.getElementById('dashboard-screen');
      if (ag) ag.style.display = '';
      if (ds) ds.style.display = '';
      if (typeof window.goHome === 'function') window.goHome();
    });
    const roundsSlider = this.q('#gln-rounds');
    if (roundsSlider) {
      roundsSlider.addEventListener('input', () => {
        this.state.rounds = parseInt(roundsSlider.value, 10);
        this.setText('#gln-rounds-val', this.state.rounds);
      });
      roundsSlider.addEventListener('change', () => { this.state.selectedNode = null; this.simulate(); });
    }
    const minEdgeSlider = this.q('#gln-min-edge');
    if (minEdgeSlider) {
      minEdgeSlider.addEventListener('input', () => {
        this.state.minEdgeWeight = parseInt(minEdgeSlider.value, 10);
        this.setText('#gln-min-edge-val', this.state.minEdgeWeight);
      });
      minEdgeSlider.addEventListener('change', () => { this.buildEdges(); this.updateStats(); this.drawGraph(); });
    }
    const physicsCheck = this.q('#gln-physics');
    if (physicsCheck) physicsCheck.addEventListener('change', () => {
      this.state.physics = physicsCheck.checked;
      if (this.state.physics) this.startPhysics();
      else {
        if (this.state.rafId) { cancelAnimationFrame(this.state.rafId); this.state.rafId = null; }
        this.drawGraph();
      }
    });
  },

  destroy() {
    if (this.state.rafId) cancelAnimationFrame(this.state.rafId);
    this.state.rafId = null;
    this.state.selectedNode = null;
    if (this.container) { try { this.container.innerHTML = ''; } catch (e) {} }
    this.root = null; this.canvas = null; this.ctx = null;
  }
};

function registerLottoNetwork() {
  if (typeof window.MathLabGames === 'undefined' || typeof window.MathLabGames.register !== 'function') return;
  try {
    if (typeof window.MathLabGames.get === 'function' && window.MathLabGames.get('lotto-network')) return;
    window.MathLabGames.register({
      id: 'lotto-network',
      title: '로또 숫자 관계망 분석기',
      icon: '🔗',
      sourceType: 'new',
      mount(container, context) { LottoNetwork.mount(container, context); },
      reset() { LottoNetwork.simulate(); },
      destroy() { LottoNetwork.destroy(); }
    });
  } catch (e) { console.warn('[LottoNetwork] register 방어:', e); }
}
registerLottoNetwork();
window.addEventListener('DOMContentLoaded', registerLottoNetwork);
setTimeout(registerLottoNetwork, 100);
setTimeout(registerLottoNetwork, 500);
})();
</script>
