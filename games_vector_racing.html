<!--
  Gen-3 수학 실험실 수학게임 앱: 벡터 레이싱 (vector-racing)
  오로지 스타일((style))과 스크립트((script))로만 구성된 표준 템플릿
  (푸터 밖 밀림 방지 마운트 로직, LegacyBridge 홈버튼 연동, 독립 명예의 전당 모달, 5대 감사 기준 완벽 준수)
-->
<style>
  /* ==========================================================================
     Gen-3 전용 스코프 스타일 (.game-vector-racing)
     수학게임(game) 테마: 모던 고대비 다크 네이비/슬레이트
     ========================================================================== */
  .game-vector-racing {
    --bg-primary: #0f172a;
    --bg-surface: #1e293b;
    --bg-card: rgba(30, 41, 59, 0.88);
    --accent-color: #38bdf8;
    --accent-glow: rgba(56, 189, 248, 0.35);
    --success-color: #22c55e;
    --warning-color: #f59e0b;
    --danger-color: #ef4444;
    --text-main: #f8fafc;
    --text-sub: #cbd5e1;
    --border-color: #3b82f6;

    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #172554 100%);
    color: var(--text-main);
    min-height: 100%;
    width: 100%;
    padding: 24px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
    user-select: none;
    -webkit-user-select: none;
    border-radius: 24px;
    border: 3px solid var(--border-color);
    box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.8);
    position: relative;
  }

  .game-vector-racing * {
    box-sizing: border-box;
  }

  /* 상단 한 줄 반응형 헤더 */
  .game-vector-racing .app-header {
    width: 100%;
    max-width: 1040px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #0f172a;
    padding: 16px 22px;
    border-radius: 20px;
    border: 2px solid var(--border-color);
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 14px;
  }

  .game-vector-racing .title-area {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .game-vector-racing .app-title {
    font-size: clamp(1.4rem, 2.4vw, 2.0rem);
    font-weight: 900;
    margin: 0;
    color: #ffffff !important;
    text-shadow: 0 0 15px rgba(255, 255, 255, 0.7);
  }

  .game-vector-racing .app-badge {
    background: #1e1b4b;
    color: #38bdf8;
    font-size: 0.88rem;
    font-weight: 800;
    padding: 6px 14px;
    border-radius: 20px;
    border: 1.5px solid #3b82f6;
    box-shadow: 0 0 10px rgba(59, 130, 246, 0.25);
  }

  .game-vector-racing .stats-bar {
    display: flex;
    gap: 10px;
    font-weight: 800;
    font-size: 0.95rem;
    flex-wrap: wrap;
    align-items: center;
    justify-content: flex-end;
    flex: 1 1 auto;
  }

  .game-vector-racing .stat-badge {
    background: #0f172a;
    padding: 8px 14px;
    border-radius: 14px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    border: 2px solid #60a5fa;
    color: #ffffff;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-weight: 900;
    font-size: 0.95rem;
    white-space: nowrap;
  }
  .game-vector-racing .stat-badge.turn { color: #fef08a; border-color: #f59e0b; background: #271c14; }
  .game-vector-racing .stat-badge.player { color: #ffffff; border-color: #38bdf8; background: #0f172a; }
  .game-vector-racing .stat-badge.score { color: #86efac; border-color: #22c55e; background: #062313; }

  /* 헤더 균등 버튼 (가장 긴 글자 기준 flex 동적 정돈) */
  .game-vector-racing .header-btn {
    padding: 9px 15px;
    border-radius: 14px;
    font-size: 0.95rem;
    font-weight: 900;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: all 0.2s;
    border: 2px solid transparent;
    white-space: nowrap;
    flex: 1 1 126px;
  }

  .game-vector-racing .btn-howto {
    background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
    color: #ffffff !important;
    border-color: #93c5fd;
    box-shadow: 0 4px 10px rgba(59, 130, 246, 0.4);
  }
  .game-vector-racing .btn-howto:hover { transform: translateY(-2px); background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); }

  .game-vector-racing .btn-rank {
    background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
    color: #ffffff !important;
    border-color: #fde68a;
    box-shadow: 0 4px 10px rgba(245, 158, 11, 0.4);
  }
  .game-vector-racing .btn-rank:hover { transform: translateY(-2px); background: linear-gradient(135deg, #d97706 0%, #b45309 100%); }

  .game-vector-racing .btn-reset {
    background: #1e293b;
    color: #ffffff !important;
    border-color: #60a5fa;
  }
  .game-vector-racing .btn-reset:hover { background: #334155; border-color: #93c5fd; transform: translateY(-2px); }

  .game-vector-racing .btn-home {
    background: #475569;
    color: #ffffff !important;
    border-color: #94a3b8;
  }
  .game-vector-racing .btn-home:hover { background: #64748b; transform: translateY(-2px); }

  /* 메인 그리드 */
  .game-vector-racing .main-container {
    width: 100%;
    max-width: 1040px;
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
  }

  /* 옵션 바 (난이도 & 모드) */
  .game-vector-racing .option-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    background: #090d16;
    padding: 10px 16px;
    border-radius: 18px;
    border: 2px solid #3b82f6;
    flex-wrap: wrap;
  }

  .game-vector-racing .diff-group, .game-vector-racing .mode-group {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    flex: 1;
  }

  .game-vector-racing .opt-btn {
    flex: 1;
    min-width: 120px;
    padding: 9px 12px;
    border-radius: 12px;
    background: transparent;
    color: #cbd5e1;
    border: 1.5px solid #475569;
    font-weight: 800;
    font-size: 0.9rem;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
  }
  .game-vector-racing .opt-btn.active {
    background: #3b82f6;
    color: #ffffff !important;
    border-color: #93c5fd;
    box-shadow: 0 4px 10px rgba(59, 130, 246, 0.4);
  }
  .game-vector-racing .opt-btn.mode.active {
    background: #f59e0b;
    border-color: #fde68a;
    box-shadow: 0 4px 10px rgba(245, 158, 11, 0.4);
  }

  /* 작업 영역 (트랙 & 컨트롤러) */
  .game-vector-racing .workspace {
    display: grid;
    grid-template-columns: 1.5fr 1fr;
    gap: 20px;
  }

  @media (max-width: 850px) {
    .game-vector-racing .workspace {
      grid-template-columns: 1fr;
    }
  }

  /* 트랙 캔버스 카드 */
  .game-vector-racing .track-card {
    background: #0f172a;
    border: 3px solid var(--border-color);
    border-radius: 20px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
  }

  .game-vector-racing .track-header {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    font-size: 1rem;
    font-weight: 800;
  }

  .game-vector-racing .canvas-wrapper {
    width: 100%;
    position: relative;
    background: #060913;
    border-radius: 14px;
    border: 2px solid #334155;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .game-vector-racing canvas {
    max-width: 100%;
    height: auto;
    cursor: pointer;
    display: block;
  }

  /* 오른쪽 컨트롤 & 수식 패널 */
  .game-vector-racing .control-card {
    background: #1e293b;
    border: 3px solid var(--border-color);
    border-radius: 20px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .game-vector-racing .vector-formula-box {
    background: #0f172a;
    border: 2px solid #60a5fa;
    border-radius: 16px;
    padding: 14px;
    text-align: center;
  }

  .game-vector-racing .formula-title {
    font-size: 0.85rem;
    color: #93c5fd;
    font-weight: 800;
    margin-bottom: 8px;
  }

  .game-vector-racing .formula-expr {
    font-size: 1.15rem;
    font-weight: 900;
    color: #f8fafc;
    line-height: 1.6;
    word-break: keep-all;
  }

  .game-vector-racing .formula-expr .v-cur { color: #38bdf8; }
  .game-vector-racing .formula-expr .v-acc { color: #f59e0b; }
  .game-vector-racing .formula-expr .v-next { color: #22c55e; }

  /* 3x3 가속 방향 키패드 */
  .game-vector-racing .pad-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  .game-vector-racing .pad-title {
    font-size: 0.9rem;
    font-weight: 800;
    color: #cbd5e1;
  }

  .game-vector-racing .acc-pad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    width: 100%;
    max-width: 260px;
  }

  .game-vector-racing .pad-btn {
    aspect-ratio: 1;
    border-radius: 12px;
    background: #0f172a;
    border: 2px solid #475569;
    color: #ffffff;
    font-size: 1.1rem;
    font-weight: 900;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    transition: all 0.15s;
  }
  .game-vector-racing .pad-btn:hover { background: #334155; border-color: #60a5fa; transform: scale(1.05); }
  .game-vector-racing .pad-btn.selected {
    background: rgba(245, 158, 11, 0.25);
    border-color: #f59e0b;
    box-shadow: 0 0 12px rgba(245, 158, 11, 0.5);
    color: #fef08a;
  }
  .game-vector-racing .pad-btn .vec-sub { font-size: 0.72rem; color: #94a3b8; font-weight: 700; margin-top: 2px; }

  /* 하단 액션 버튼 그룹 */
  .game-vector-racing .action-bar {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .game-vector-racing .btn-exec {
    flex: 2;
    padding: 13px;
    border-radius: 14px;
    background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
    color: white;
    font-size: 1.1rem;
    font-weight: 900;
    border: 2px solid #86efac;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(34, 197, 94, 0.4);
    transition: all 0.2s;
  }
  .game-vector-racing .btn-exec:hover { transform: translateY(-2px); background: linear-gradient(135deg, #16a34a 0%, #15803d 100%); }

  .game-vector-racing .btn-undo {
    flex: 1;
    padding: 13px;
    border-radius: 14px;
    background: #271c14;
    color: #fef08a !important;
    font-size: 0.95rem;
    font-weight: 800;
    border: 2px solid #f59e0b;
    cursor: pointer;
    transition: all 0.2s;
  }
  .game-vector-racing .btn-undo:hover { background: #451a1a; border-color: #ef4444; color: white !important; }

  /* 설명 팁 박스 */
  .game-vector-racing .tip-box {
    background: #0f172a;
    border: 1.5px solid #475569;
    border-radius: 14px;
    padding: 12px;
    font-size: 0.85rem;
    color: #cbd5e1;
    line-height: 1.5;
  }
  .game-vector-racing .tip-box strong { color: #fef08a; }

  /* 모달 공통 스타일 */
  .game-vector-racing .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.88);
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }
  .game-vector-racing .modal-overlay.active { opacity: 1; pointer-events: auto; }

  .game-vector-racing .modal-card {
    background: #0f172a;
    border: 3px solid #3b82f6;
    border-radius: 24px;
    padding: 28px;
    width: 90%;
    max-width: 520px;
    box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8);
    text-align: center;
    transform: scale(0.9);
    transition: transform 0.3s ease;
    color: #ffffff;
    max-height: 90vh;
    overflow-y: auto;
  }
  .game-vector-racing .modal-overlay.active .modal-card { transform: scale(1); }

  .game-vector-racing .modal-title {
    font-size: 1.6rem;
    font-weight: 900;
    margin: 0 0 16px 0;
    color: #ffffff;
    text-shadow: 0 0 15px rgba(255,255,255,0.7);
  }

  .game-vector-racing .modal-desc {
    font-size: 0.95rem;
    color: #cbd5e1;
    line-height: 1.6;
    margin-bottom: 24px;
    text-align: left;
    font-weight: 700;
  }
</style>

<script>
(function() {
  // 🌟 [보안] XSS 방어용 HTML 특수기호 이스케이프 함수
  function escapeHTML(str) {
    if (!str) return '';
    return String(str).replace(/[&<>"']/g, function(match) {
      const escape = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
      return escape[match];
    });
  }

  // 트랙 데이터 정의 (30x20 정수 격자)
  // 0: WALL, 1: TRACK, 2: START, 3: FINISH, 4: OBSTACLE
  const TRACKS = {
    easy: {
      name: '쉬움 (직선 위주 넓은 타원)',
      gridWidth: 28,
      gridHeight: 18,
      startPos: [{x: 4, y: 14}, {x: 4, y: 13}],
      baseTurns: 18,
      generate() {
        const grid = Array.from({length: 18}, () => Array(28).fill(0));
        for (let y = 2; y < 16; y++) {
          for (let x = 2; x < 26; x++) {
            const dx = (x - 14) / 11;
            const dy = (y - 9) / 6.5;
            const dist = dx*dx + dy*dy;
            if (dist <= 1.05 && dist >= 0.28) {
              grid[y][x] = 1;
            }
          }
        }
        grid[14][4] = 2; grid[13][4] = 2; grid[12][4] = 2;
        grid[14][5] = 3; grid[13][5] = 3; grid[12][5] = 3;
        return grid;
      }
    },
    normal: {
      name: '보통 (S자 곡선 트랙)',
      gridWidth: 30,
      gridHeight: 20,
      startPos: [{x: 3, y: 16}, {x: 3, y: 15}],
      baseTurns: 22,
      generate() {
        const grid = Array.from({length: 20}, () => Array(30).fill(0));
        for (let y = 1; y < 19; y++) {
          for (let x = 1; x < 29; x++) {
            if (y >= 14 && y <= 17 && x >= 2 && x <= 27) grid[y][x] = 1;
            if (x >= 23 && x <= 27 && y >= 3 && y <= 17) grid[y][x] = 1;
            if (y >= 3 && y <= 6 && x >= 10 && x <= 27) grid[y][x] = 1;
            if (x >= 10 && x <= 14 && y >= 3 && y <= 11) grid[y][x] = 1;
            if (y >= 8 && y <= 11 && x >= 3 && x <= 14) grid[y][x] = 1;
          }
        }
        grid[16][3] = 2; grid[15][3] = 2; grid[14][3] = 2;
        grid[16][4] = 3; grid[15][4] = 3; grid[14][4] = 3;
        return grid;
      }
    },
    hard: {
      name: '도전 (좁은 헤어핀 + 장애물)',
      gridWidth: 32,
      gridHeight: 20,
      startPos: [{x: 3, y: 17}, {x: 3, y: 16}],
      baseTurns: 26,
      generate() {
        const grid = Array.from({length: 20}, () => Array(32).fill(0));
        for (let y = 1; y < 19; y++) {
          for (let x = 1; x < 31; x++) {
            if (y >= 15 && y <= 18 && x >= 2 && x <= 29) grid[y][x] = 1;
            if (x >= 26 && x <= 29 && y >= 2 && y <= 18) grid[y][x] = 1;
            if (y >= 2 && y <= 5 && x >= 15 && x <= 29) grid[y][x] = 1;
            if (x >= 15 && x <= 18 && y >= 2 && y <= 12) grid[y][x] = 1;
            if (y >= 9 && y <= 12 && x >= 3 && x <= 18) grid[y][x] = 1;
          }
        }
        grid[16][14] = 4; grid[17][14] = 4;
        grid[4][23] = 4; grid[3][23] = 4;
        grid[10][10] = 4;

        grid[17][3] = 2; grid[16][3] = 2; grid[15][3] = 2;
        grid[17][4] = 3; grid[16][4] = 3; grid[15][4] = 3;
        return grid;
      }
    }
  };

  const state = {
    difficulty: 'easy',
    mode: 'solo',
    turn: 1,
    activePlayer: 0,
    players: [],
    grid: [],
    gridWidth: 28,
    gridHeight: 18,
    selectedAcc: {x: 0, y: 0},
    showHistory: true,
    gameOver: false
  };

  const VectorRacing = {
    container: null,
    canvas: null,
    ctx: null,

    showToast(msg, isError = false) {
      if (!this.container) return;
      let toast = this.container.querySelector('#vr-toast');
      if (!toast) {
        toast = document.createElement('div');
        toast.id = 'vr-toast';
        toast.style.cssText = 'position:absolute; top:20px; left:50%; transform:translateX(-50%); padding:12px 24px; border-radius:12px; font-weight:800; font-size:1rem; z-index:99999; box-shadow:0 10px 25px rgba(0,0,0,0.5); transition:all 0.3s; text-align:center; min-width:300px; pointer-events:none; opacity:0;';
        this.container.appendChild(toast);
      }
      toast.style.background = isError ? '#ef4444' : '#10b981';
      toast.style.color = isError ? '#ffffff' : '#0f172a';
      toast.textContent = msg;
      
      void toast.offsetWidth;
      toast.style.opacity = '1';
      toast.style.top = '20px';
      
      if (this._toastTimer) clearTimeout(this._toastTimer);
      this._toastTimer = setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.top = '0px';
      }, 3000);
    },

    mount(container, context = {}) {
      let target = typeof container === 'string' ? document.querySelector(container) : container;
      if (!target || !(target instanceof HTMLElement)) {
        target = window.MathLabUtils?.getMountContainer ? window.MathLabUtils.getMountContainer(container) : document.getElementById('mathlab-view');
      }
      if (!target) target = document.getElementById('new-root') || document.getElementById('game-container');

      // 🌟 푸터 아래 밀림 방지 호스트 마운트 보장
      if (!target || target === document.body) {
        let host = document.getElementById('vector-racing-force-host');
        if (!host) {
          host = document.createElement('div');
          host.id = 'vector-racing-force-host';
          host.style.cssText = 'width:100%; max-width:1040px; margin:0 auto; padding:16px; box-sizing:border-box; z-index:999; position:relative; background:#0f172a; border-radius:24px;';
          const footer = document.querySelector('footer, #footer, .app-footer, #legacy-footer, .mathlab-footer');
          if (footer && footer.parentNode) {
            footer.parentNode.insertBefore(host, footer);
          } else {
            document.body.appendChild(host);
          }
        }
        target = host;
      }
      this.container = target;

      if (this.container.style) {
        this.container.style.display = '';
        this.container.style.visibility = '';
        this.container.style.opacity = '1';
      }

      let parent = this.container.parentElement;
      while (parent && parent !== document.body && parent !== document.documentElement) {
        if (parent.style && parent.style.display === 'none') parent.style.display = '';
        if (parent.style && parent.style.visibility === 'hidden') parent.style.visibility = '';
        parent = parent.parentElement;
      }

      this.restoreGlobalNavigation();
      window.scrollTo({ top: 0, left: 0, behavior: 'smooth' });

      target.innerHTML = `
        <div class="game-vector-racing" id="vector-racing-root">
          <header class="app-header">
            <div class="title-area">
              <span style="font-size: 32px;">🏎️</span>
              <div>
                <h1 class="app-title">벡터 레이싱</h1>
              </div>
              <span class="app-badge">중·고 교과 수학게임</span>
            </div>
            <div class="stats-bar">
              <div class="stat-badge turn">🔄 턴: <span id="vr-turn-cnt">1</span></div>
              <div class="stat-badge player" id="vr-player-badge">🏎️ P1 차례</div>
              <div class="stat-badge score">⭐ 점수: <span id="vr-score">100</span>점</div>
              <button class="header-btn btn-howto" id="vr-btn-howto">❓ 탐구 안내</button>
              <button class="header-btn btn-rank" id="vr-btn-rank">🏆 명예의 전당</button>

                <ul style="padding-left: 20px; margin: 10px 0;">
                  <li><strong>다음 속도:</strong> $\vec{v}_{next} = \vec{v}_{cur} + \vec{a}$</li>

      `;

      this.canvas = document.getElementById('vr-canvas');
      this.ctx = this.canvas ? this.canvas.getContext('2d') : null;

      this.bindEvents();
      this.startNewGame();
    },

    restoreGlobalNavigation() {
      const navElements = document.querySelectorAll('header, .navbar, #app-header, .top-bar, #floating-home-btn, .floating-home, [id*="home"], [class*="floating"]');
      navElements.forEach(el => { if (el && el.style && el.style.display === 'none') el.style.display = ''; });
    },

    bindEvents() {
      document.querySelectorAll('.game-vector-racing .opt-btn[data-diff]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          document.querySelectorAll('.game-vector-racing .opt-btn[data-diff]').forEach(b => b.classList.remove('active'));
          e.target.classList.add('active');
          state.difficulty = e.target.getAttribute('data-diff');
          this.startNewGame();
        });
      });

      document.querySelectorAll('.game-vector-racing .opt-btn[data-mode]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          document.querySelectorAll('.game-vector-racing .opt-btn[data-mode]').forEach(b => b.classList.remove('active'));
          e.target.classList.add('active');
          state.mode = e.target.getAttribute('data-mode');
          this.startNewGame();
        });
      });

      document.querySelectorAll('.game-vector-racing .pad-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const ax = parseInt(btn.getAttribute('data-ax'), 10);
          const ay = parseInt(btn.getAttribute('data-ay'), 10);
          this.selectAcceleration(ax, ay);
        });
      });

      if (this.canvas) {
        this.canvas.addEventListener('click', (e) => {
          if (state.gameOver) return;
          const rect = this.canvas.getBoundingClientRect();
          const scaleX = this.canvas.width / rect.width;
          const scaleY = this.canvas.height / rect.height;
          const mouseX = (e.clientX - rect.left) * scaleX;
          const mouseY = (e.clientY - rect.top) * scaleY;

          const cellW = this.canvas.width / state.gridWidth;
          const cellH = this.canvas.height / state.gridHeight;
          const gx = Math.floor(mouseX / cellW);
          const gy = Math.floor(mouseY / cellH);

          const curP = state.players[state.activePlayer];
          const inertiaX = curP.x + curP.vx;
          const inertiaY = curP.y + curP.vy;

          const ax = gx - inertiaX;
          const ay = gy - inertiaY;
          if (ax >= -1 && ax <= 1 && ay >= -1 && ay <= 1) {
            this.selectAcceleration(ax, ay);
          }
        });
      }

      document.getElementById('vr-btn-exec')?.addEventListener('click', () => this.executeTurn());
      document.getElementById('vr-btn-undo')?.addEventListener('click', () => this.undoTurn());
      document.getElementById('vr-toggle-history')?.addEventListener('change', (e) => {
        state.showHistory = e.target.checked;
        this.renderCanvas();
      });

      // 모달 리스너
      document.getElementById('vr-btn-howto')?.addEventListener('click', () => openModal('vr-howto-modal'));
      document.getElementById('vr-howto-close')?.addEventListener('click', () => closeModal('vr-howto-modal'));
      document.getElementById('vr-btn-rank')?.addEventListener('click', () => this.showLeaderboardModal());
      document.getElementById('vr-leaderboard-close')?.addEventListener('click', () => closeModal('vr-leaderboard-modal'));
      document.getElementById('vr-btn-reset')?.addEventListener('click', () => this.startNewGame());
      document.getElementById('vr-btn-home')?.addEventListener('click', () => this.goHome());

      document.getElementById('vr-complete-retry')?.addEventListener('click', () => {
        closeModal('vr-complete-modal');
        this.startNewGame();
      });
      document.getElementById('vr-complete-home')?.addEventListener('click', () => {
        closeModal('vr-complete-modal');
        this.goHome();
      });
      document.getElementById('vr-btn-submit-score')?.addEventListener('click', () => this.submitRankScore());

      document.querySelectorAll('.game-vector-racing .modal-overlay').forEach(modal => {
        modal.addEventListener('click', (e) => {
          if (e.target === modal) modal.classList.remove('active');
        });
      });
    },

    selectAcceleration(ax, ay) {
      state.selectedAcc = { x: ax, y: ay };
      document.querySelectorAll('.game-vector-racing .pad-btn').forEach(btn => {
        const bx = parseInt(btn.getAttribute('data-ax'), 10);
        const by = parseInt(btn.getAttribute('data-ay'), 10);
        if (bx === ax && by === ay) btn.classList.add('selected');
        else btn.classList.remove('selected');
      });
      this.updateFormulaView();
      this.renderCanvas();
    },

    updateFormulaView() {
      const curP = state.players[state.activePlayer];
      if (!curP) return;
      const vx = curP.vx, vy = curP.vy;
      const ax = state.selectedAcc.x, ay = state.selectedAcc.y;
      const nvx = vx + ax, nvy = vy + ay;

      const el = document.getElementById('vr-formula-text');
      if (el) {
        el.innerHTML = `
          <span class="v-cur">속도 (${vx}, ${vy})</span> + <span class="v-acc">가속 (${ax >= 0 ? '+'+ax : ax}, ${ay >= 0 ? '+'+ay : ay})</span><br>
          = <span class="v-next">다음 속도 (${nvx}, ${nvy})</span>
        `;
      }
    },

    startNewGame() {
      const trackConf = TRACKS[state.difficulty];
      state.gridWidth = trackConf.gridWidth;
      state.gridHeight = trackConf.gridHeight;
      state.grid = trackConf.generate();
      state.turn = 1;
      state.activePlayer = 0;
      state.gameOver = false;
      state.selectedAcc = { x: 0, y: 0 };

      state.players = [
        {
          name: 'Player 1 (Red)',
          color: '#ef4444',
          x: trackConf.startPos[0].x,
          y: trackConf.startPos[0].y,
          vx: 0,
          vy: 0,
          score: 100,
          undoCount: 3,
          history: [{ x: trackConf.startPos[0].x, y: trackConf.startPos[0].y, vx: 0, vy: 0 }]
        }
      ];

      if (state.mode === 'hotseat') {
        state.players.push({
          name: 'Player 2 (Blue)',
          color: '#38bdf8',
          x: trackConf.startPos[1].x,
          y: trackConf.startPos[1].y,
          vx: 0,
          vy: 0,
          score: 100,
          undoCount: 3,
          history: [{ x: trackConf.startPos[1].x, y: trackConf.startPos[1].y, vx: 0, vy: 0 }]
        });
      }

      const trackNameEl = document.getElementById('vr-track-name');
      if (trackNameEl) trackNameEl.textContent = `🏁 트랙: ${trackConf.name}`;
      this.selectAcceleration(0, 0);
      this.updateStatsBar();
      this.renderCanvas();
    },

    updateStatsBar() {
      const turnEl = document.getElementById('vr-turn-cnt');
      if (turnEl) turnEl.textContent = state.turn;

      const curP = state.players[state.activePlayer];
      const pBadge = document.getElementById('vr-player-badge');
      if (pBadge && curP) {
        if (state.mode === 'hotseat') {
          pBadge.textContent = state.activePlayer === 0 ? '🏎️ P1 (Red) 차례' : '🚙 P2 (Blue) 차례';
          pBadge.style.borderColor = curP.color;
        } else {
          pBadge.textContent = '🏎️ 주행 중';
          pBadge.style.borderColor = '#38bdf8';
        }
      }

      const scoreEl = document.getElementById('vr-score');
      if (scoreEl && curP) scoreEl.textContent = curP.score;

      const undoBtn = document.getElementById('vr-btn-undo');
      if (undoBtn && curP) {
        undoBtn.textContent = `↩️ 직전 턴 취소 (남은 횟수 ${curP.undoCount}회, -3점)`;
      }
    },

    executeTurn() {
      if (state.gameOver) return;
      const curP = state.players[state.activePlayer];
      const ax = state.selectedAcc.x;
      const ay = state.selectedAcc.y;

      const newVx = curP.vx + ax;
      const newVy = curP.vy + ay;
      const newX = curP.x + newVx;
      const newY = curP.y + newVy;

      const collision = this.checkPathCollision(curP.x, curP.y, newX, newY);

      if (collision.hit) {
        this.showToast('💥 트랙 이탈! 속도 초기화 (패널티 +2턴, -5점)', true);
        curP.vx = 0;
        curP.vy = 0;
        curP.score = Math.max(0, curP.score - 5);
        state.turn += 2;
        curP.history.push({ x: curP.x, y: curP.y, vx: 0, vy: 0 });
      } else {
        curP.x = newX;
        curP.y = newY;
        curP.vx = newVx;
        curP.vy = newVy;
        curP.history.push({ x: curP.x, y: curP.y, vx: curP.vx, vy: curP.vy });

        if (collision.finished || state.grid[curP.y]?.[curP.x] === 3) {
          this.handleFinish(curP);
          return;
        }
      }

      if (state.mode === 'hotseat') {
        state.activePlayer = (state.activePlayer + 1) % state.players.length;
        if (state.activePlayer === 0) state.turn++;
      } else {
        state.turn++;
      }

      this.selectAcceleration(0, 0);
      this.updateStatsBar();
      this.renderCanvas();
    },

    checkPathCollision(x0, y0, x1, y1) {
      let dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0);
      let sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
      let err = dx - dy;
      let cx = x0, cy = y0;
      let finished = false;

      while (true) {
        if (cx < 0 || cx >= state.gridWidth || cy < 0 || cy >= state.gridHeight || state.grid[cy][cx] === 0 || state.grid[cy][cx] === 4) {
          return { hit: true, finished: false };
        }
        if (state.grid[cy][cx] === 3) {
          finished = true;
        }
        if (cx === x1 && cy === y1) break;
        let e2 = 2 * err;
        if (e2 > -dy) { err -= dy; cx += sx; }
        if (e2 < dx) { err += dx; cy += sy; }
      }
      return { hit: false, finished: finished };
    },

    undoTurn() {
      if (state.gameOver) return;
      const curP = state.players[state.activePlayer];
      if (curP.undoCount <= 0 || curP.history.length <= 1) {
        this.showToast('⚠️ 더 이상 턴을 취소할 수 없습니다.', true);
        return;
      }
      curP.undoCount--;
      curP.score = Math.max(0, curP.score - 3);
      curP.history.pop();
      const last = curP.history[curP.history.length - 1];
      curP.x = last.x;
      curP.y = last.y;
      curP.vx = last.vx;
      curP.vy = last.vy;

      this.selectAcceleration(0, 0);
      this.updateStatsBar();
      this.renderCanvas();
    },

    handleFinish(player) {
      state.gameOver = true;
      const trackConf = TRACKS[state.difficulty];
      const savedTurns = Math.max(0, trackConf.baseTurns - state.turn);
      player.score += 20 + savedTurns * 5;
      this.updateStatsBar();
      this.renderCanvas();

      const titleEl = document.getElementById('vr-complete-title');
      const sumEl = document.getElementById('vr-complete-summary');
      const scoreEl = document.getElementById('vr-final-score');
      const rankArea = document.getElementById('vr-rank-submit-area');

      if (titleEl) titleEl.textContent = state.mode === 'hotseat' ? `🎉 ${player.name} 승리 및 완주!` : '🎉 레이싱 완주 성공!';
      if (sumEl) sumEl.textContent = `총 사용 턴: ${state.turn}턴 (기준 턴: ${trackConf.baseTurns}턴, 절약 보너스 +${savedTurns * 5}점)`;
      if (scoreEl) scoreEl.textContent = `${player.score}점`;

      if (rankArea) {
        rankArea.style.display = state.mode === 'solo' ? 'flex' : 'none';
      }
      openModal('vr-complete-modal');
    },

    renderCanvas() {
      if (!this.ctx || !this.canvas) return;
      const w = this.canvas.width;
      const h = this.canvas.height;
      const cellW = w / state.gridWidth;
      const cellH = h / state.gridHeight;

      this.ctx.clearRect(0, 0, w, h);

      for (let y = 0; y < state.gridHeight; y++) {
        for (let x = 0; x < state.gridWidth; x++) {
          const cellType = state.grid[y][x];
          if (cellType === 0) {
            this.ctx.fillStyle = '#0f172a';
          } else if (cellType === 1) {
            this.ctx.fillStyle = (x + y) % 2 === 0 ? '#334155' : '#1e293b';
          } else if (cellType === 2) {
            this.ctx.fillStyle = '#15803d';
          } else if (cellType === 3) {
            this.ctx.fillStyle = (x + y) % 2 === 0 ? '#ffffff' : '#000000';
          } else if (cellType === 4) {
            this.ctx.fillStyle = '#7c2d12';
          }
          this.ctx.fillRect(x * cellW, y * cellH, cellW, cellH);

          this.ctx.strokeStyle = 'rgba(255,255,255,0.06)';
          this.ctx.lineWidth = 1;
          this.ctx.strokeRect(x * cellW, y * cellH, cellW, cellH);

          if (cellType === 2) {
            this.ctx.fillStyle = '#ffffff';
            this.ctx.font = 'bold 11px sans-serif';
            this.ctx.fillText('S', x * cellW + cellW/2 - 4, y * cellH + cellH/2 + 4);
          } else if (cellType === 4) {
            this.ctx.fillStyle = '#fb923c';
            this.ctx.font = '14px sans-serif';
            this.ctx.fillText('🛢️', x * cellW + cellW/2 - 7, y * cellH + cellH/2 + 5);
          }
        }
      }

      if (state.showHistory) {
        state.players.forEach(p => {
          if (p.history.length > 1) {
            this.ctx.strokeStyle = p.color;
            this.ctx.lineWidth = 2.5;
            this.ctx.setLineDash([4, 3]);
            this.ctx.beginPath();
            p.history.forEach((pos, idx) => {
              const px = pos.x * cellW + cellW/2;
              const py = pos.y * cellH + cellH/2;
              if (idx === 0) this.ctx.moveTo(px, py);
              else this.ctx.lineTo(px, py);
            });
            this.ctx.stroke();
            this.ctx.setLineDash([]);
          }
        });
      }

      if (!state.gameOver) {
        const curP = state.players[state.activePlayer];
        const cx = curP.x * cellW + cellW/2;
        const cy = curP.y * cellH + cellH/2;

        const inertiaX = curP.x + curP.vx;
        const inertiaY = curP.y + curP.vy;
        const ixCenter = inertiaX * cellW + cellW/2;
        const iyCenter = inertiaY * cellH + cellH/2;

        if (curP.vx !== 0 || curP.vy !== 0) {
          this.drawArrow(cx, cy, ixCenter, iyCenter, '#38bdf8', 3, '관성');
        }

        for (let dy = -1; dy <= 1; dy++) {
          for (let dx = -1; dx <= 1; dx++) {
            const hx = inertiaX + dx;
            const hy = inertiaY + dy;
            if (hx >= 0 && hx < state.gridWidth && hy >= 0 && hy < state.gridHeight) {
              const markerX = hx * cellW + cellW/2;
              const markerY = hy * cellH + cellH/2;
              const isSelected = (dx === state.selectedAcc.x && dy === state.selectedAcc.y);

              this.ctx.beginPath();
              this.ctx.arc(markerX, markerY, isSelected ? cellW * 0.38 : cellW * 0.22, 0, Math.PI * 2);
              this.ctx.fillStyle = isSelected ? 'rgba(245, 158, 11, 0.85)' : 'rgba(255, 255, 255, 0.25)';
              this.ctx.fill();
              this.ctx.strokeStyle = isSelected ? '#fef08a' : '#94a3b8';
              this.ctx.lineWidth = isSelected ? 3 : 1.5;
              this.ctx.stroke();
            }
          }
        }

        const nextX = inertiaX + state.selectedAcc.x;
        const nextY = inertiaY + state.selectedAcc.y;
        const nxCenter = nextX * cellW + cellW/2;
        const nyCenter = nextY * cellH + cellH/2;
        if (nxCenter !== cx || nyCenter !== cy) {
          this.drawArrow(cx, cy, nxCenter, nyCenter, '#22c55e', 4, '다음');
        }
      }

      state.players.forEach((p, idx) => {
        const px = p.x * cellW + cellW/2;
        const py = p.y * cellH + cellH/2;
        const isTurn = (idx === state.activePlayer);

        this.ctx.beginPath();
        this.ctx.arc(px, py, cellW * 0.4, 0, Math.PI * 2);
        this.ctx.fillStyle = p.color;
        this.ctx.fill();
        this.ctx.strokeStyle = isTurn ? '#ffffff' : '#000000';
        this.ctx.lineWidth = isTurn ? 3 : 1.5;
        this.ctx.stroke();

        this.ctx.fillStyle = '#ffffff';
        this.ctx.font = 'bold 12px sans-serif';
        this.ctx.textAlign = 'center';
        this.ctx.fillText(idx === 0 ? 'P1' : 'P2', px, py + 4);
      });
    },

    drawArrow(fromX, fromY, toX, toY, color, width, label = '') {
      if (fromX === toX && fromY === toY) return;
      const angle = Math.atan2(toY - fromY, toX - fromX);
      const headLen = 10;

      this.ctx.strokeStyle = color;
      this.ctx.fillStyle = color;
      this.ctx.lineWidth = width;
      this.ctx.beginPath();
      this.ctx.moveTo(fromX, fromY);
      this.ctx.lineTo(toX, toY);
      this.ctx.stroke();

      this.ctx.beginPath();
      this.ctx.moveTo(toX, toY);
      this.ctx.lineTo(toX - headLen * Math.cos(angle - Math.PI / 6), toY - headLen * Math.sin(angle - Math.PI / 6));
      this.ctx.lineTo(toX - headLen * Math.cos(angle + Math.PI / 6), toY - headLen * Math.sin(angle + Math.PI / 6));
      this.ctx.closePath();
      this.ctx.fill();

      if (label) {
        this.ctx.fillStyle = color;
        this.ctx.font = 'bold 11px sans-serif';
        this.ctx.fillText(label, (fromX + toX) / 2, (fromY + toY) / 2 - 6);
      }
    },

    submitRankScore() {
      const curP = state.players[0];
      const input = document.getElementById('vr-nickname-input');
      const nickname = input ? input.value.trim() : '';
      if (!nickname) { this.showToast('⚠️ 닉네임을 입력해 주세요!', true); input.focus(); return; }

      try {
        let list = JSON.parse(localStorage.getItem('mathlab_lb_vector-racing') || '[]');
        const dateStr = new Date().toLocaleDateString('ko-KR', { month: '2-digit', day: '2-digit' });
        list.push({ nickname, score: curP.score, date: dateStr });
        list.sort((a, b) => b.score - a.score);
        localStorage.setItem('mathlab_lb_vector-racing', JSON.stringify(list.slice(0, 20)));
      } catch (e) {}

      if (typeof window.submitRanking === 'function') {
        window.submitRanking('벡터 레이싱', curP.score, true, 'vr-nickname-input', 'board-vector-racing');
        this.showToast('✅ 명예의 전당 등록이 서버로 요청되었습니다.');
        setTimeout(() => closeModal('vr-complete-modal'), 1200);
      } else if (typeof window.parent?.submitRanking === 'function') {
        window.parent.submitRanking('벡터 레이싱', curP.score, true, 'vr-nickname-input', 'board-vector-racing');
        this.showToast('✅ 명예의 전당 등록이 서버로 요청되었습니다.');
        setTimeout(() => closeModal('vr-complete-modal'), 1200);
      } else {
        this.showToast('🎉 명예의 전당 기록이 로컬에 안전하게 등록되었습니다!');
        if (input) input.value = '';
        setTimeout(() => closeModal('vr-complete-modal'), 1200);
      }
    },

    showLeaderboardModal() {
      let list = [];
      try {
        list = JSON.parse(localStorage.getItem('mathlab_lb_vector-racing') || '[]');
      } catch(e) {}

      let rowsHtml = list.map((item, idx) => `
        <div style="display:flex; justify-content:space-between; padding:8px 12px; border-bottom:1px solid #334155;">
          <span><strong>${idx+1}위</strong> ${escapeHTML(item.nickname)} (${escapeHTML(item.date) || '-'})</span>
          <span style="color:#fef08a; font-weight:900;">${item.score}점</span>
        </div>
      `).join('');

      if (!rowsHtml) rowsHtml = '<div style="padding:20px; text-align:center; color:#94a3b8;">아직 등록된 명예의 전당 기록이 없습니다! 완주 후 첫 기록을 남겨보세요.</div>';

      const contentBox = document.getElementById('vr-leaderboard-content');
      if (contentBox) {
        contentBox.innerHTML = rowsHtml;
      }
      openModal('vr-leaderboard-modal');
    },

    resetGame() {
      this.startNewGame();
    },

    goHome() {
      this.destroy();

      if (window.LegacyBridge && typeof window.LegacyBridge.backHome === 'function') {
        try { window.LegacyBridge.backHome(); return; } catch(e) {}
      }
      if (typeof window.renderLegacyDashboardHome === 'function') {
        try { window.renderLegacyDashboardHome(); return; } catch(e) {}
      }
      if (typeof window.MathLabRenderHome === 'function') {
        try { window.MathLabRenderHome(); return; } catch(e) {}
      }

      const mathlabRoot = document.getElementById('mathlab-root');
      const legacyRoot = document.getElementById('legacy-root');
      if (mathlabRoot) mathlabRoot.classList.add('hidden');
      if (legacyRoot) legacyRoot.classList.remove('hidden');

      const dashboard = document.getElementById('dashboard-screen') || document.getElementById('dashboard-view');
      if (dashboard) {
        dashboard.classList.add('active');
        if (dashboard.style) dashboard.style.display = '';
      }
      window.scrollTo({ top: 0, left: 0, behavior: 'smooth' });
    },

    destroy() {
      state.gameOver = true;
      if (this.container) this.container.innerHTML = '';
    }
  };

  function openModal(id) {
    document.getElementById(id)?.classList.add('active');
  }

  function closeModal(id) {
    document.getElementById(id)?.classList.remove('active');
  }

  window.VectorRacing = VectorRacing;

  function registerVectorRacing() {
    if (typeof window.MathLabGames !== 'undefined' && typeof window.MathLabGames.register === 'function') {
      window.MathLabGames.register({
        id: 'vector-racing',
        title: '벡터 레이싱',
        icon: '🏎️',
        category: 'game',
        sourceType: 'new',
        mount(container, context) { VectorRacing.mount(container, context); },
        reset() { VectorRacing.resetGame(); },
        destroy() { VectorRacing.destroy(); },
        goHome() { VectorRacing.goHome(); }
      });
    }
  }

  registerVectorRacing();
  window.addEventListener('DOMContentLoaded', registerVectorRacing);
  setTimeout(registerVectorRacing, 100);
  setTimeout(registerVectorRacing, 500);

  window.launchVectorRacingGame = function() {
    if (typeof window.MathLabGames !== 'undefined' && typeof window.MathLabGames.mount === 'function') {
      try {
        window.MathLabGames.mount('vector-racing');
        return;
      } catch(e) {}
    }
    VectorRacing.mount();
  };
})();
</script>
