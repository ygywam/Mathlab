<script>
(function() {
  const BOARD_KEY = 'board-sudoku-classic';
  const GAME_NAME = '스도쿠 클래식';

  let toastTimer = null;
  const escapeHTML = (str) => {
    if (!str) return '';
    return String(str).replace(/[&<>"']/g, function(match) {
      const escape = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
      return escape[match];
    });
  };

  function showToast(msg, isError = false) {
    let host = document.getElementById('sudoku-classic-root');
    if (!host) return;
    let toast = host.querySelector('#sd-toast');
    if (!toast) {
      toast = document.createElement('div');
      toast.id = 'sd-toast';
      toast.style.cssText = 'position:fixed; top:20px; left:50%; transform:translateX(-50%); padding:12px 24px; border-radius:12px; font-weight:800; font-size:1rem; z-index:99999; box-shadow:0 10px 25px rgba(0,0,0,0.5); transition:all 0.3s; text-align:center; min-width:300px; pointer-events:none; opacity:0;';
      host.appendChild(toast);
    }
    toast.style.background = isError ? '#ef4444' : '#10b981';
    toast.style.color = isError ? '#ffffff' : '#0f172a';
    toast.textContent = msg;
    void toast.offsetWidth;
    toast.style.opacity = '1';
    toast.style.top = '20px';
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      toast.style.opacity = '0';
      toast.style.top = '0px';
    }, 3000);
  }

  // 검증된 유일해 보장 시드 퍼즐 풀 (정답 / 출제 마스크)
  const SEED_PUZZLES = {
    easy6: [
      {

  // 명예의 전당 로드
  function loadLeaderboard() {
    const tbody = document.getElementById('sd-hall-tbody');
    if (!tbody) return;
    tbody.innerHTML = '<tr><td colspan="4" style="padding:20px; color:#94a3b8;">랭킹 정보를 불러오는 중...</td></tr>';

    const renderRanks = (list) => {
      if (!tbody) return;
      tbody.innerHTML = '';
      if (!list || list.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" style="padding:20px; color:#64748b;">아직 명예의 전당 기록이 없습니다. 첫 번째 논리 마스터가 되어보세요!</td></tr>';

      list.slice(0, 10).forEach((item, idx) => {
        const badge = idx === 0 ? '🥇 1위' : (idx === 1 ? '🥈 2위' : (idx === 2 ? '🥉 3위' : `${idx+1}위`));

        let dt = escapeHTML(item.difficulty || item.date || '기록');

    bindEvents() {
      // 난이도 버튼
      document.querySelectorAll('.game-sudoku-classic .diff-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          document.querySelectorAll('.game-sudoku-classic .diff-btn').forEach(b => b.classList.remove('active'));
          e.target.classList.add('active');
          state.difficulty = e.target.getAttribute('data-diff');
          state.gridSize = state.difficulty === 'easy' ? 6 : 9;
          this.startNewGame();
        });
      });

      // 기능 버튼
      document.getElementById('sd-btn-memo')?.addEventListener('click', () => {
        state.memoMode = !state.memoMode;
        document.getElementById('sd-btn-memo')?.classList.toggle('active', state.memoMode);
      });

      document.getElementById('sd-btn-erase')?.addEventListener('click', () => {
        if (state.selectedCell) {
          const { r, c } = state.selectedCell;
          if (!state.fixed[r][c]) {
            state.board[r][c] = 0;
            state.memos[r][c] = [];
            this.renderGrid();
          }
        }
      });

      document.getElementById('sd-btn-hint')?.addEventListener('click', () => {
        if (state.selectedCell) {
          const { r, c } = state.selectedCell;
          if (!state.fixed[r][c] && state.board[r][c] !== state.solution[r][c]) {
            state.board[r][c] = state.solution[r][c];
            state.memos[r][c] = [];
            state.score = Math.max(0, state.score - 5);
            this.updateStatsUI();
            this.renderGrid();
            this.checkCompletion();
          }
        } else {
          showToast('⚠️ 힌트를 적용할 빈 셀을 먼저 선택해 주세요!', true);
        }
      });

      document.getElementById('sd-opt-error')?.addEventListener('change', (e) => {
        state.showErrors = e.target.checked;
        this.renderGrid();
      });

      // 키보드 입력 지원
      document.addEventListener('keydown', (e) => {
        if (!state.selectedCell) return;
        const keyNum = parseInt(e.key, 10);
        if (keyNum >= 1 && keyNum <= state.gridSize) {
          this.inputNumber(keyNum);
        } else if (e.key === 'Backspace' || e.key === 'Delete') {
          document.getElementById('sd-btn-erase')?.click();
        } else if (e.key.toLowerCase() === 'm') {
          document.getElementById('sd-btn-memo')?.click();

        document.getElementById('sd-hall-modal')?.classList.remove('active');
      });
    },

    startNewGame() {
      state.round = 1;
      state.score = 0;
      this.setupRound();
    },

    setupRound() {
      state.selectedCell = null;
      if (state.timerId) clearInterval(state.timerId);
      state.timer = 0;
      state.timerId = setInterval(() => {
        state.timer++;
        const el = document.getElementById('sd-timer');
        if (el) el.textContent = `${state.timer}s`;
      }, 1000);

      this.generatePuzzle();
      this.renderNumpad();
      this.renderGrid();
      this.updateStatsUI();

      const banner = document.getElementById('sd-info-banner');
      if (banner) {
        if (state.gridSize === 6) {
          banner.innerHTML = `💡 <strong>6×6 입문</strong>: 각 행, 열, 2×3 박스마다 1부터 6까지 숫자를 겹치지 않게 채우세요!`;
        } else if (state.difficulty === 'normal') {
          banner.innerHTML = `💡 <strong>9×9 클래식</strong>: 각 행, 열, 3×3 박스마다 1부터 9까지 숫자를 겹치지 않게 채우세요!`;
        } else {
          banner.innerHTML = `💡 <strong>9×9 심화·도전</strong>: 더 적은 단서! 소거법과 연필 메모를 적극 활용하여 1~9를 채우세요!`;
        }
      }
    },

    generatePuzzle() {
      const size = state.gridSize;
      const seedKey = size === 6 ? 'easy6' : (state.difficulty === 'hard' ? 'hard9' : 'normal9');
      const pool = SEED_PUZZLES[seedKey];
      const seed = pool[Math.floor(Math.random() * pool.length)];

      // 숫자 랜덤 치환 (1~N bijection 치환으로 무한 다변화 보장)
      const nums = Array.from({ length: size }, (_, i) => i + 1);
      for (let i = nums.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [nums[i], nums[j]] = [nums[j], nums[i]];
      }
      const permMap = {};
      for (let i = 0; i < size; i++) permMap[i + 1] = nums[i];

      state.solution = Array.from({ length: size }, () => Array(size).fill(0));
      state.board = Array.from({ length: size }, () => Array(size).fill(0));
      state.fixed = Array.from({ length: size }, () => Array(size).fill(false));
      state.memos = Array.from({ length: size }, () => Array.from({ length: size }, () => []));

      for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
          const val = permMap[seed.solution[r][c]];
          state.solution[r][c] = val;
          if (seed.mask[r][c] === 1) {
            state.board[r][c] = val;
            state.fixed[r][c] = true;
          } else {
            state.board[r][c] = 0;
            state.fixed[r][c] = false;
          }
        }
      }
    },

    renderNumpad() {
      const npEl = document.getElementById('sd-numpad');
      if (!npEl) return;
      npEl.innerHTML = '';
      npEl.style.gridTemplateColumns = 'repeat(3, 1fr)';

      for (let n = 1; n <= state.gridSize; n++) {
        npEl.innerHTML += `
          <button class="num-btn" onclick="SudokuClassic.inputNumber(${n})">${n}</button>
        `;
      }
    },

    renderGrid() {
      const gridEl = document.getElementById('sd-grid');
      if (!gridEl) return;
      const size = state.gridSize;

      gridEl.className = `grid-board grid-${size}`;
      gridEl.innerHTML = '';

      let selVal = 0;
      if (state.selectedCell) {
        const { r, c } = state.selectedCell;
        selVal = state.board[r][c];
      }

      for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
          const val = state.board[r][c];
          const isFixed = state.fixed[r][c];
          const isSelected = state.selectedCell && state.selectedCell.r === r && state.selectedCell.c === c;
          const isSameNum = val !== 0 && val === selVal && !isSelected;

          let isError = false;
          if (state.showErrors && val !== 0 && !isFixed && val !== state.solution[r][c]) {
            isError = true;
          }

          let classes = 'cell';
          if (isFixed) classes += ' fixed';
          else if (val !== 0) classes += ' user';
          if (isSelected) classes += ' selected';
          if (isSameNum) classes += ' same-num';
          if (isError) classes += ' error';

          let contentHtml = val !== 0 ? val : '';
          if (val === 0 && state.memos[r][c] && state.memos[r][c].length > 0) {
            let memoHtml = `<div class="memo-grid">`;
            for (let m = 1; m <= size; m++) {
              const hasMemo = state.memos[r][c].includes(m);
              memoHtml += `<span class="memo-num">${hasMemo ? m : ''}</span>`;
            }
            memoHtml += `</div>`;
            contentHtml = memoHtml;
          }

          gridEl.innerHTML += `
            <div class="${classes}" onclick="SudokuClassic.selectCell(${r}, ${c})">
              ${contentHtml}
            </div>
          `;
        }
      }
    },

    selectCell(r, c) {
      state.selectedCell = { r, c };
      this.renderGrid();
    },

    inputNumber(num) {
      if (!state.selectedCell) return;
      const { r, c } = state.selectedCell;
      if (state.fixed[r][c]) return;

      if (state.memoMode) {
        const memos = state.memos[r][c];
        const idx = memos.indexOf(num);
        if (idx >= 0) memos.splice(idx, 1);
        else memos.push(num);
        state.memos[r][c] = memos;
      } else {
        state.board[r][c] = num;
        state.memos[r][c] = [];
      }

      this.renderGrid();
      this.checkCompletion();
    },

    checkCompletion() {
      const size = state.gridSize;
      for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
          if (state.board[r][c] !== state.solution[r][c]) return;
        }
      }

      // 퍼즐 완성!
      clearInterval(state.timerId);
      const timeBonus = Math.max(0, Math.floor((300 - state.timer) / 10));
      const roundEarned = 30 + timeBonus;
      state.score += roundEarned;
      this.updateStatsUI();

      setTimeout(() => {
        if (state.round >= state.maxRound) {
          const diffName = state.difficulty === 'easy' ? '🟢 쉬움 (6×6)' : (state.difficulty === 'hard' ? '🔴 도전 (9×9)' : '🟡 보통 (9×9)');
          showInlineRankingModal(state.score, diffName);
        } else {
          showToast(`🎉 라운드 ${state.round} 완성! (+${roundEarned}점)`);
          state.round++;
          this.setupRound();
        }
      }, 300);
    },

    updateStatsUI() {
      const roundEl = document.getElementById('sd-round');
      if (roundEl) roundEl.textContent = `${state.round} / ${state.maxRound}`;
      const scoreEl = document.getElementById('sd-score');
      if (scoreEl) scoreEl.textContent = state.score;
    },

    resetGame() {
      this.startNewGame();
    },

    // 🌟 Gen-3 스킬 표준 홈 버튼 (`goHome`) 완결성 보장
    goHome() {
      this.destroy();

      if (window.LegacyBridge && typeof window.LegacyBridge.backHome === 'function') {
        try { window.LegacyBridge.backHome(); return; } catch(e) {}
      }
      if (typeof window.renderLegacyDashboardHome === 'function') {
        try { window.renderLegacyDashboardHome(); return; } catch(e) {}
      }
      if (typeof window.MathLabRenderHome === 'function') {
        try { window.MathLabRenderHome(); return; } catch(e) {}
      }

      const mathlabRoot = document.getElementById('mathlab-root');
      const legacyRoot = document.getElementById('legacy-root');
      if (mathlabRoot) mathlabRoot.classList.add('hidden');
      if (legacyRoot) legacyRoot.classList.remove('hidden');

      const dashboard = document.getElementById('dashboard-screen');
      if (dashboard) {
        dashboard.classList.add('active');
        dashboard.style.display = '';
      }
      window.scrollTo({ top: 0, left: 0, behavior: 'smooth' });
    },

    destroy() {
      if (state.timerId) clearInterval(state.timerId);
      if (this.container) this.container.innerHTML = '';
    }
  };

  window.SudokuClassic = SudokuClassic;

  // 🌟 Gen-3 스킬 표준 3중 자율 등록 (로딩 순서 100% 무관)
  function registerSudokuClassic() {
    if (typeof window.MathLabGames !== 'undefined' && typeof window.MathLabGames.register === 'function') {
      if (!window.MathLabGames.get?.('sudoku-classic')) {
        window.MathLabGames.register({
          id: 'sudoku-classic',
          title: '스도쿠 클래식',
          icon: '9️⃣',
          category: 'game',
          sourceType: 'new',
          mount(container, context) { SudokuClassic.mount(container, context); },
          reset() { SudokuClassic.resetGame(); },
          destroy() { SudokuClassic.destroy(); },
          goHome() { SudokuClassic.goHome(); }
        });
      }
    }
  }

  registerSudokuClassic();
  window.addEventListener('DOMContentLoaded', registerSudokuClassic);
  setTimeout(registerSudokuClassic, 100);
  setTimeout(registerSudokuClassic, 500);

  window.launchSudokuClassicGame = function() {
    if (typeof window.MathLabGames !== 'undefined' && typeof window.MathLabGames.mount === 'function') {
      try {
        window.MathLabGames.mount('sudoku-classic');
        return;
      } catch(e) {}
    }
    SudokuClassic.mount();
  };
})();
</script>
