      const escape = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
      return escape[match];

    let host = document.getElementById('nonogram-root');
    if (!host) return;

      toast = document.createElement('div');
      toast.id = 'nn-toast';
      toast.style.cssText = 'position:fixed; top:20px; left:50%; transform:translateX(-50%); padding:12px 24px; border-radius:12px; font-weight:800; font-size:1rem; z-index:99999; box-shadow:0 10px 25px rgba(0,0,0,0.5); transition:all 0.3s; text-align:center; min-width:300px; pointer-events:none; opacity:0;';
      host.appendChild(toast);
    }
    toast.style.background = isError ? '#ef4444' : '#10b981';
    toast.style.color = isError ? '#ffffff' : '#0f172a';
    toast.textContent = msg;
    void toast.offsetWidth;
    toast.style.opacity = '1';
    toast.style.top = '20px';
    if (toastTimer) clearTimeout(toastTimer);

  // 명예의 전당 로드
  function loadLeaderboard() {
    const tbody = document.getElementById('nn-hall-tbody');
    if (!tbody) return;
    tbody.innerHTML = '<tr><td colspan="4" style="padding:20px; color:#94a3b8;">랭킹 정보를 불러오는 중...</td></tr>';

    const renderRanks = (list) => {
      if (!tbody) return;
      tbody.innerHTML = '';
      if (!list || list.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" style="padding:20px; color:#64748b;">아직 명예의 전당 기록이 없습니다. 첫 번째 퍼즐 마스터가 되어보세요!</td></tr>';
        return;
      }
      list.slice(0, 10).forEach((item, idx) => {
        const badge = idx === 0 ? '🥇 1위' : (idx === 1 ? '🥈 2위' : (idx === 2 ? '🥉 3위' : `${idx+1}위`));
        const nick = escapeHTML(item.nickname || item.name || '수학탐험대');
        const sc = item.score || 0;
        let dt = escapeHTML(item.difficulty || item.date || '기록');
        try { if (item.date) dt = new Date(item.date).toLocaleDateString('ko-KR', {month:'short', day:'numeric'}); } catch(e){}
        tbody.innerHTML += `
          <tr style="border-bottom:1px solid rgba(255,255,255,0.08);">
            <td style="padding:12px; font-weight:bold; color:#fbbf24;">${badge}</td>
            <td style="padding:12px; font-weight:800; color:#ffffff;">${nick}</td>
            <td style="padding:12px; font-weight:900; color:#38bdf8;">${sc}점</td>
            <td style="padding:12px; color:#94a3b8; font-size:12px;">${dt}</td>
          </tr>
        `;
      });
    };

    if (typeof window.getRankingList === 'function') {
      try { window.getRankingList(GAME_NAME, BOARD_KEY, renderRanks); return; } catch(e){}
    } else if (typeof google !== 'undefined' && google.script && google.script.run && typeof google.script.run.getGameScores === 'function') {
      try {
        const sheetId = (typeof getLeaderboardSheetId === 'function') ? getLeaderboardSheetId() : '';
        google.script.run.withSuccessHandler(renderRanks).withFailureHandler(() => {
          renderRanks(JSON.parse(localStorage.getItem(`rank_${BOARD_KEY}`) || '[]'));
        }).getGameScores(sheetId, GAME_NAME);
        return;
      } catch(e){}
    }
    renderRanks(JSON.parse(localStorage.getItem(`rank_${BOARD_KEY}`) || '[]'));
  }

  // 사용자 직접 입력 명예의 전당 모달 (Gen-3 표준 준수)
  function showInlineRankingModal(score, diffName) {
    document.getElementById('mathlab-inline-ranking-modal')?.remove();
    const modalHtml = `
      <div id="mathlab-inline-ranking-modal" style="position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(15,23,42,0.88); backdrop-filter:blur(8px); display:flex; align-items:center; justify-content:center; z-index:999999; padding:20px; box-sizing:border-box; font-family:'Pretendard',sans-serif;">
        <div style="background:#0f172a; border-radius:26px; padding:30px 26px; max-width:420px; width:100%; box-shadow:0 20px 40px rgba(0,0,0,0.8); text-align:center; border:4px solid #3b82f6; color:#ffffff;">
          <div style="font-size:46px; margin-bottom:10px;">🏆</div>
          <h2 style="margin:0 0 8px; font-size:26px; font-weight:900; color:#ffffff !important;">명예의 전당 등록</h2>
          <p style="margin:0 0 20px; font-size:15px; color:#fef08a !important; font-weight:800;">3라운드 퍼즐 완성! 최고 논리 점수를 달성했습니다.<br>당신의 이름을 남겨주세요!</p>
          <div style="background:#1e1b4b; border:2px solid #3b82f6; border-radius:18px; padding:16px; margin-bottom:20px;">
            <div style="font-size:14px; color:#e0e7ff; font-weight:800; margin-bottom:4px;">최종 퍼즐 점수</div>
            <div style="font-size:36px; font-weight:900; color:#fbbf24;">${score} <span style="font-size:20px;">점</span></div>
          </div>
          <input type="text" id="inline-rank-nickname" placeholder="닉네임 입력 (예: 논리천재)" maxlength="10" style="width:100%; padding:14px 16px; font-size:16px; font-weight:800; border:2px solid #60a5fa; background:#1e293b; color:#ffffff; border-radius:14px; outline:none; text-align:center; margin-bottom:20px; box-sizing:border-box;">
          <div style="display:flex; gap:10px;">
            <button id="inline-rank-cancel" style="flex:1; padding:14px; border-radius:14px; font-size:15px; font-weight:800; background:#1e293b; color:#ffffff; border:1px solid #60a5fa; cursor:pointer;">건너뛰기</button>
            <button id="inline-rank-submit" style="flex:2; padding:14px; border-radius:14px; font-size:15px; font-weight:900; background:linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); color:#ffffff !important; border:none; cursor:pointer; box-shadow:0 4px 10px rgba(59,130,246,0.5);">🚀 등록하기</button>
          </div>
        </div>
      </div>
    `;
    document.body.insertAdjacentHTML('beforeend', modalHtml);
    const inputEl = document.getElementById('inline-rank-nickname');
    if (inputEl) inputEl.focus();

    const closeAndOpenHall = () => {
      document.getElementById('mathlab-inline-ranking-modal')?.remove();
      loadLeaderboard();
      document.getElementById('nn-hall-modal')?.classList.add('active');
    };

    document.getElementById('inline-rank-cancel')?.addEventListener('click', closeAndOpenHall);

    const doSubmit = () => {
      let nickname = inputEl?.value.trim() || '논리천재';
      if (typeof window.submitRanking === 'function') {
        try { window.submitRanking(GAME_NAME, score, true, nickname, BOARD_KEY); } catch(e){}
      } else if (typeof window.parent?.submitRanking === 'function') {
        try { window.parent.submitRanking(GAME_NAME, score, true, nickname, BOARD_KEY); } catch(e){}
      } else if (typeof google !== 'undefined' && google.script && google.script.run && typeof google.script.run.saveGameScore === 'function') {
        try {
          const sheetId = (typeof getLeaderboardSheetId === 'function') ? getLeaderboardSheetId() : '';
          const meta = (typeof getLeaderboardMeta === 'function') ? getLeaderboardMeta() : {};
          google.script.run.withSuccessHandler(closeAndOpenHall).saveGameScore(sheetId, GAME_NAME, nickname, score, true, meta);
        } catch(e){}
      }

      let ranks = JSON.parse(localStorage.getItem(`rank_${BOARD_KEY}`) || '[]');
      ranks.push({ nickname: nickname, score: score, difficulty: diffName, date: new Date().toISOString() });
      ranks.sort((a, b) => (b.score || 0) - (a.score || 0));
      localStorage.setItem(`rank_${BOARD_KEY}`, JSON.stringify(ranks.slice(0, 50)));
      closeAndOpenHall();
    };

    document.getElementById('inline-rank-submit')?.addEventListener('click', doSubmit);
    inputEl?.addEventListener('keydown', (e) => { if (e.key === 'Enter') doSubmit(); });
  }

      let target = null;
      if (typeof container === 'string') target = document.querySelector(container);
      else if (container instanceof HTMLElement) target = container;
      if (!target) target = window.MathLabUtils?.getMountContainer ? window.MathLabUtils.getMountContainer(container) : document.getElementById('mathlab-view');
      if (!target) target = document.getElementById('new-root') || document.getElementById('game-container');
      if (!target) return;
      this.container = target;

      // 🌟 [DOM 레이아웃 자동 방어] 만약 마운트 컨테이너가 푸터보다 DOM 순서상 아래쪽에 있다면 푸터 위로 즉시 재배치
      const footerEl = document.querySelector('footer, #footer, .app-footer') || 
                       Array.from(document.querySelectorAll('div, p, span')).find(el => el.textContent && el.textContent.includes('2026 기록조율사'));

        footerEl.parentNode.insertBefore(target, footerEl);
      }

      // 🌟 스킬 표준 방어막: 잔류 인라인 숨김 해제
      target.style.display = 'block';
      target.style.visibility = 'visible';
      target.style.opacity = '1';

      let parent = target.parentElement;
      while (parent && parent !== document.body && parent !== document.documentElement) {
        if (parent.style && parent.style.display === 'none') parent.style.display = 'block';
        if (parent.style && parent.style.visibility === 'hidden') parent.style.visibility = 'visible';

                  <li><strong>상·좌 교차 논리:</strong> 상단(열) 조건과 좌측(행) 조건을 동시에 만족하는 지점을 소거법으로 찾아냅니다.</li>
                  <li><strong>드래그 연속 입력:</strong> 클릭하거나 마우스/터치로 드래그하여 연속으로 칠하거나 X표시할 수 있습니다.</li>
                </ul>
                <p><strong>💡 점수 규칙:</strong><br>
                퍼즐 완성 시 기본 30점과 남은 시간에 따른 보너스를 획득합니다.</p>
              </div>
              <button class="btn-action" id="nn-howto-close" style="width:100%; justify-content:center; background:#3b82f6;">확인하고 게임 시작하기</button>
            </div>
          </div>

          <!-- 명예의 전당 모달 -->
          <div class="modal-overlay" id="nn-hall-modal">
            <div class="modal-card">
              <h2 class="modal-title">🏆 명예의 전당 (Top 10)</h2>
              <table class="hall-table">
                <thead>
                  <tr>
                    <th>순위</th>
                    <th>닉네임</th>
                    <th>점수</th>
                    <th>난이도/날짜</th>
                  </tr>
                </thead>
                <tbody id="nn-hall-tbody"></tbody>
              </table>
              <button class="btn-action" id="nn-hall-close" style="width:100%; justify-content:center; background:#3b82f6;">닫기</button>
            </div>
          </div>
        </div>
      `;

      this.bindEvents();
      this.startNewGame();
    },

    bindEvents() {
      // 3단계 난이도 버튼
      document.querySelectorAll('.game-nonogram .diff-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          document.querySelectorAll('.game-nonogram .diff-btn').forEach(b => b.classList.remove('active'));
          e.target.classList.add('active');
          state.difficulty = e.target.getAttribute('data-diff');
          state.size = state.difficulty === 'easy' ? 5 : 10;
          this.startNewGame();
        });
      });

      // 입력 모드 토글
      document.getElementById('nn-mode-paint')?.addEventListener('click', () => {
        state.inputMode = 1;
        document.getElementById('nn-mode-paint')?.classList.add('active');
        document.getElementById('nn-mode-x')?.classList.remove('active');
      });

      document.getElementById('nn-mode-x')?.addEventListener('click', () => {
        state.inputMode = 2;
        document.getElementById('nn-mode-x')?.classList.add('active');
        document.getElementById('nn-mode-paint')?.classList.remove('active');
      });

      document.getElementById('nn-btn-solve-line')?.addEventListener('click', () => {
        if (state.isCleared) return;
        for (let r = 0; r < state.size; r++) {
          let lineMatch = true;
          for (let c = 0; c < state.size; c++) {
            if ((state.currentPuzzle.data[r][c] === 1 && state.board[r][c] !== 1) ||
                (state.currentPuzzle.data[r][c] === 0 && state.board[r][c] === 1)) {
              lineMatch = false;
              break;
            }
          }
          if (!lineMatch) {
            for (let c = 0; c < state.size; c++) {
              state.board[r][c] = state.currentPuzzle.data[r][c] === 1 ? 1 : 2;
            }
            state.score = Math.max(0, state.score - 5);
            this.updateStatsUI();
            this.renderPuzzleBoard();
            this.checkCompletion();
            return;
          }
        }
      });

      window.addEventListener('mouseup', () => { state.isDragging = false; });
      window.addEventListener('touchend', () => { state.isDragging = false; });

      document.getElementById('nn-btn-howto')?.addEventListener('click', () => {
        document.getElementById('nn-howto-modal')?.classList.add('active');
      });
      document.getElementById('nn-howto-close')?.addEventListener('click', () => {
        document.getElementById('nn-howto-modal')?.classList.remove('active');
      });
      document.getElementById('nn-btn-home')?.addEventListener('click', () => {
        this.goHome();
      });      
      document.getElementById('nn-btn-hall')?.addEventListener('click', () => {
        loadLeaderboard();
        document.getElementById('nn-hall-modal')?.classList.add('active');
      });
      document.getElementById('nn-hall-close')?.addEventListener('click', () => {
        document.getElementById('nn-hall-modal')?.classList.remove('active');
      });
    },

    startNewGame() {
      state.round = 1;
      state.score = 0;
      this.setupRound();
    },

    setupRound() {
      state.isCleared = false;
      if (state.timerId) clearInterval(state.timerId);
      state.timer = 0;
      state.timerId = setInterval(() => {
        state.timer++;
        const el = document.getElementById('nn-timer');
        if (el) el.textContent = `${state.timer}s`;
      }, 1000);

      const key = state.difficulty === 'easy' ? 'easy5' : (state.difficulty === 'normal' ? 'normal10' : 'hard10');
      const pool = PUZZLE_SETS[key];
      state.currentPuzzle = pool[Math.floor(Math.random() * pool.length)];
      state.size = state.currentPuzzle.size;

      state.board = Array.from({ length: state.size }, () => Array(state.size).fill(0));
      this.calculateHints();
      this.renderPuzzleBoard();
      this.updateStatsUI();

      const banner = document.getElementById('nn-info-banner');
      if (banner) {
        banner.innerHTML = `💡 상단(열 힌트)과 좌측(행 힌트)의 조건을 종합하여 숨은 그림을 찾으세요!`;
      }
    },

    calculateHints() {
      const size = state.size;
      const data = state.currentPuzzle.data;

      state.rowHints = [];
      for (let r = 0; r < size; r++) {
        const hints = [];
        let cnt = 0;
        for (let c = 0; c < size; c++) {
          if (data[r][c] === 1) cnt++;
          else if (cnt > 0) { hints.push(cnt); cnt = 0; }
        }
        if (cnt > 0) hints.push(cnt);
        if (hints.length === 0) hints.push(0);
        state.rowHints.push(hints);
      }

      state.colHints = [];
      for (let c = 0; c < size; c++) {
        const hints = [];
        let cnt = 0;
        for (let r = 0; r < size; r++) {
          if (data[r][c] === 1) cnt++;
          else if (cnt > 0) { hints.push(cnt); cnt = 0; }
        }
        if (cnt > 0) hints.push(cnt);
        if (hints.length === 0) hints.push(0);
        state.colHints.push(hints);
      }
    },

    // 상단 및 좌측이 정확히 맞물리는 4분할 테이블 CSS Grid 렌더링
    renderPuzzleBoard() {
      const wrap = document.getElementById('nn-puzzle-wrap');
      if (!wrap) return;
      const size = state.size;

      let html = `
        <div class="nono-table" style="grid-template-columns: 85px auto;">
          <!-- 1. 좌상단 상태 블록 -->
          <div class="top-left-blank">${size}×${size}<br>NO-NO</div>

          <!-- 2. 상단 열 힌트 영역 -->
          <div class="col-hints-wrap" style="grid-template-columns: repeat(${size}, 1fr);">
      `;

      for (let c = 0; c < size; c++) {
        let isSat = this.isColSatisfied(c);
        html += `
          <div class="hint-cell col-hint ${isSat ? 'satisfied' : ''}">
            ${state.colHints[c].map(h => `<span>${h}</span>`).join('')}
          </div>
        `;
      }
      html += `</div>`;

      // 3. 좌측 행 힌트 영역
      html += `<div class="row-hints-wrap" style="grid-template-rows: repeat(${size}, 1fr);">`;
      for (let r = 0; r < size; r++) {
        let isSat = this.isRowSatisfied(r);
        html += `
          <div class="hint-cell row-hint ${isSat ? 'satisfied' : ''}">
            ${state.rowHints[r].map(h => `<span>${h}</span>`).join('')}
          </div>
        `;
      }
      html += `</div>`;

      // 4. 우하단 픽셀 보드 영역
      html += `<div class="grid-board" style="grid-template-columns: repeat(${size}, 1fr); grid-template-rows: repeat(${size}, 1fr);">`;
      for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
          const val = state.board[r][c];
          let classes = 'cell';
          if ((c + 1) % 5 === 0 && c !== size - 1) classes += ' border-right-5';
          if ((r + 1) % 5 === 0 && r !== size - 1) classes += ' border-bottom-5';
          if (val === 1) classes += ' filled';
          else if (val === 2) classes += ' marked-x';

          let icon = val === 2 ? '✕' : '';
          html += `
            <div class="${classes}"
                 onmousedown="Nonogram.startDrag(${r}, ${c})"
                 onmouseenter="Nonogram.dragMove(${r}, ${c})">
              ${icon}
            </div>
          `;
        }
      }
      html += `</div></div>`;

      wrap.innerHTML = html;
    },

    isRowSatisfied(r) {
      for (let c = 0; c < state.size; c++) {
        if ((state.currentPuzzle.data[r][c] === 1 && state.board[r][c] !== 1) ||
            (state.currentPuzzle.data[r][c] === 0 && state.board[r][c] === 1)) return false;
      }
      return true;
    },

    isColSatisfied(c) {
      for (let r = 0; r < state.size; r++) {
        if ((state.currentPuzzle.data[r][c] === 1 && state.board[r][c] !== 1) ||
            (state.currentPuzzle.data[r][c] === 0 && state.board[r][c] === 1)) return false;
      }
      return true;
    },

    startDrag(r, c) {
      if (state.isCleared) return;
      state.isDragging = true;
      const cur = state.board[r][c];
      if (cur === state.inputMode) {
        state.dragValue = 0;
      } else {
        state.dragValue = state.inputMode;
      }
      state.board[r][c] = state.dragValue;
      this.renderPuzzleBoard();
      this.checkCompletion();
    },

    dragMove(r, c) {
      if (!state.isDragging || state.isCleared) return;
      state.board[r][c] = state.dragValue;
      this.renderPuzzleBoard();
      this.checkCompletion();
    },

    checkCompletion() {
      const size = state.size;
      for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
          if (state.currentPuzzle.data[r][c] === 1 && state.board[r][c] !== 1) return;
          if (state.currentPuzzle.data[r][c] === 0 && state.board[r][c] === 1) return;
        }
      }

      state.isCleared = true;
      clearInterval(state.timerId);

      const banner = document.getElementById('nn-info-banner');
      if (banner) {
        banner.innerHTML = `🎉 축하합니다! 숨은 그림 <strong>[ ${state.currentPuzzle.title} ]</strong> 완성!`;
      }

      const timeBonus = Math.max(0, Math.floor((300 - state.timer) / 10));
      const roundEarned = 30 + timeBonus;
      state.score += roundEarned;
      this.updateStatsUI();

      setTimeout(() => {
        if (state.round >= state.maxRound) {
          const diffName = state.difficulty === 'easy' ? '🟢 쉬움 (5×5)' : (state.difficulty === 'normal' ? '🟡 보통 (10×10)' : '🔴 도전 (10×10 심화)');
          showInlineRankingModal(state.score, diffName);
        } else {
          showToast(`🎉 라운드 ${state.round} 숨은 그림 [${state.currentPuzzle.title}] 완성! (+${roundEarned}점)`);
          state.round++;
          this.setupRound();
        }
      }, 800);
    },

    updateStatsUI() {
      document.getElementById('nn-round').textContent = `${state.round} / ${state.maxRound}`;
      document.getElementById('nn-score').textContent = state.score;
    },
    // 🌟 스킬 표준 안전 홈 버튼 (타이머 중단 및 표준 브리지 연동)
    goHome() {
      this.destroy();

      // 1. 표준 브리지 최우선 호출 (상단 로고/우측 하단 홈버튼과 완벽 동일 동작)
      if (window.LegacyBridge && typeof window.LegacyBridge.backHome === 'function') {
        try { window.LegacyBridge.backHome(); return; } catch(e) {}
      }
      if (typeof window.renderLegacyDashboardHome === 'function') {
        try { window.renderLegacyDashboardHome(); return; } catch(e) {}
      }
      if (typeof window.MathLabRenderHome === 'function') {
        try { window.MathLabRenderHome(); return; } catch(e) {}
      }

      // 2. 브리지 부재 시 폴백: 수동 루트 전환 및 대시보드 활성화
      const mathlabRoot = document.getElementById('mathlab-root');
      const legacyRoot = document.getElementById('legacy-root');
      if (mathlabRoot) mathlabRoot.classList.add('hidden');
      if (legacyRoot) legacyRoot.classList.remove('hidden');

      const dashboard = document.getElementById('dashboard-screen');
      if (dashboard) {
        dashboard.classList.add('active');
        dashboard.style.display = '';
      }
      window.scrollTo({ top: 0, left: 0, behavior: 'smooth' });
    },
    resetGame() {
      this.startNewGame();
    },

    destroy() {
      if (state.timerId) clearInterval(state.timerId);
      if (this.container) this.container.innerHTML = '';
    }
  };

  window.Nonogram = Nonogram;

  if (!window.MathLabGames) {
    window.MathLabGames = {
      registry: {},
      get(id) { return this.registry[id]; },
      register(app) { this.registry[app.id] = app; },
      mount(id, container, context) {
        if (this.registry[id]) this.registry[id].mount(container, context);
      }
    };
  }

  // 🌟 스킬 표준 3중 자율 등록 (스크립트 로딩 순서 무관 100% 등록 보장)
  function registerNonogram() {
    if (typeof window.MathLabGames !== 'undefined' && typeof window.MathLabGames.register === 'function') {
      if (typeof window.MathLabGames.get !== 'function' || !window.MathLabGames.get('nonogram')) {
        window.MathLabGames.register({
          id: 'nonogram',
          title: '노노그램 (네모네모)',
          icon: '🖼️',
          category: 'game',
          sourceType: 'new',
          mount(container, context) { Nonogram.mount(container, context); },
          reset() { Nonogram.resetGame(); },
          destroy() { Nonogram.destroy(); },
          goHome() { Nonogram.goHome(); } // 🌟 시스템 호출 호환을 위해 goHome 노출
        });
      }
    }
  }

  registerNonogram();
  window.addEventListener('DOMContentLoaded', registerNonogram);
  setTimeout(registerNonogram, 100);
  setTimeout(registerNonogram, 500);

  window.launchNonogramGame = function() {
    if (typeof window.MathLabGames !== 'undefined' && typeof window.MathLabGames.mount === 'function') {
      try {
        window.MathLabGames.mount('nonogram');
        return;
      } catch(e) {}
    }
    Nonogram.mount();
  };
})();
</script>
