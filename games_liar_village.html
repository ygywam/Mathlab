        { id: 'E', name: '시우', avatar: '👨‍🚀', statement: '나래는 정직한 사람입니다.' }
      ],
      answer: { liars: ['B', 'E'] },
      hint: '나래와 시우의 말이 서로 반대 방향인지 확인해 보세요.',
      explanation: '나래와 시우가 거짓말쟁이면 가온의 “나래는 거짓말쟁이”는 참, 나래의 “도윤은 거짓말쟁이”는 거짓, 도윤과 라희의 말은 참, 시우의 “나래는 정직한 사람”은 거짓이 됩니다.'
    },
    {
      id: 'hard-002',
      level: 'hard',
      title: '성문 앞의 다섯 문장',
      story: '거짓말쟁이는 정확히 2명입니다.',
      people: [
        { id: 'A', name: '가온', avatar: '🛡️', statement: '나래는 거짓말쟁이입니다.' },
        { id: 'B', name: '나래', avatar: '🏹', statement: '도윤은 정직한 사람입니다.' },
        { id: 'C', name: '도윤', avatar: '🗝️', statement: '라희는 거짓말쟁이입니다.' },
        { id: 'D', name: '라희', avatar: '📜', statement: '시우는 정직한 사람입니다.' },
        { id: 'E', name: '시우', avatar: '🔍', statement: '가온은 정직한 사람입니다.' }
      ],
      answer: { liars: ['B', 'D'] },
      hint: 'A, C, E가 참이라고 놓고 B와 D의 발언을 확인해 보세요.',

    }
  ];

  function sameSet(a, b) {
    const aa = [...a].sort().join('|');
    const bb = [...b].sort().join('|');
    return aa === bb;
  }
  // - 문장을 "파싱"하지 않고, 구조화된 규칙(type+args)을 만들고
  //   그 규칙으로 표시 텍스트를 렌더링 + 정답을 브루트포스로 계산합니다.
  // ================================

  const STAT_TEMPLATES = {
    accuseLiar: (self, target) => `${target}는 지금 사실이 아닌 말을 하고 있어.`,
    defend: (self, target) => `${target}의 말은 맞아.`,
    notDefend: (self, target) => `${target}의 말은 틀렸어.`,
    exactlyOneLiarAmong2: (self, a, b) => `${a}와 ${b} 중 정확히 한 명만 거짓말을 하고 있어.`,
    atLeastOneLiarAmong3: (self, a, b, c) => `${a}, ${b}, ${c} 중 적어도 한 명은 거짓말을 하고 있어.`,
    atMostOneLiarAmong3: (self, a, b, c) => `${a}, ${b}, ${c} 중 거짓말쟁이는 최대 1명이야.`
  };

  function pick(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
  }

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function evalRule(rule, assignment) {
    // assignment: { A: 'honest'|'liar', ... }
    const isLiar = (id) => assignment[id] === 'liar';

    if (rule.type === 'accuseLiar') {
      return isLiar(rule.target);
    }
    if (rule.type === 'defend') {
      return !isLiar(rule.target);
    }
    if (rule.type === 'notDefend') {
      return isLiar(rule.target);
    }
    if (rule.type === 'exactlyOneLiarAmong2') {
      return (isLiar(rule.a) + isLiar(rule.b)) === 1;
    }
    if (rule.type === 'atLeastOneLiarAmong3') {
      return isLiar(rule.a) || isLiar(rule.b) || isLiar(rule.c);
    }
    if (rule.type === 'atMostOneLiarAmong3') {
      return (isLiar(rule.a) + isLiar(rule.b) + isLiar(rule.c)) <= 1;
    }

    return false;
  }

  function findSolutions(peopleIds, rulesByPerson, liarCount) {
    const solutions = [];

    function rec(i, assignment) {
      if (i === peopleIds.length) {
        const liars = peopleIds.filter((id) => assignment[id] === 'liar');
        if (typeof liarCount === 'number' && liars.length !== liarCount) return;

        // 각 인물의 발언(규칙)이 정직/거짓에 맞는지 검사
        for (const id of peopleIds) {
          const truth = evalRule(rulesByPerson[id], assignment);
          if (assignment[id] === 'honest' && !truth) return;
          if (assignment[id] === 'liar' && truth) return;
        }

        solutions.push({ assignment: { ...assignment }, liars });
        return;
      }

      const id = peopleIds[i];
      assignment[id] = 'honest';
      rec(i + 1, assignment);
      assignment[id] = 'liar';
      rec(i + 1, assignment);
      delete assignment[id];
    }

    rec(0, {});
    return solutions;
  }

  function makeGeneratedPuzzle(level, serial) {
    // 1) 인원수
    const personCount = level === 'easy' ? 3 : level === 'normal' ? 4 : 4;
    const ids = 'ABCDE'.slice(0, personCount).split('');
    const namesPool = shuffle(['서윤', '지후', '민아', '도윤', '하린', '유나', '태오', '규리', '서진', '민재', '지아', '수빈', '준호', '연우']);
    const avatarsPool = shuffle(['🧑', '👩', '👨', '🧒', '👧', '👦', '🧐', '😶', '🙂', '🔍', '📌', '🧩']);

    const people = ids.map((id, idx) => ({ id, name: namesPool[idx], avatar: avatarsPool[idx] }));

    // 2) 거짓말쟁이 수(난이도별)
    const liarCount = level === 'easy' ? 1 : 2;

    // 3) 규칙(문장) 생성: 구조화된 rule을 만들고 텍스트는 템플릿으로 렌더
    //    - 쉬움: 주로 "A는 거짓말" / "B는 사실" / "둘 중 한 명만 거짓말"
    //    - 보통/어려움: 3명 범위 조건 추가

    const idToName = {};
    people.forEach((p) => { idToName[p.id] = p.name; });

    const rulesByPerson = {};

    const baseTypes = level === 'easy'
      ? ['accuseLiar', 'defend', 'notDefend', 'exactlyOneLiarAmong2']
      : ['accuseLiar', 'defend', 'notDefend', 'exactlyOneLiarAmong2', 'atLeastOneLiarAmong3', 'atMostOneLiarAmong3'];

    // 만들고 → 해가 "유일"할 때만 채택
    for (let attempt = 0; attempt < 120; attempt++) {
      ids.forEach((id) => { rulesByPerson[id] = null; });

      for (const speaker of ids) {
        const type = pick(baseTypes);
        const others = shuffle(ids.filter((x) => x !== speaker));

        if (type === 'accuseLiar') {
          rulesByPerson[speaker] = { type, target: pick(others) };
        } else if (type === 'defend') {
          rulesByPerson[speaker] = { type, target: pick(others) };
        } else if (type === 'notDefend') {
          rulesByPerson[speaker] = { type, target: pick(others) };
        } else if (type === 'exactlyOneLiarAmong2') {
          rulesByPerson[speaker] = { type, a: others[0], b: others[1] };
        } else if (type === 'atLeastOneLiarAmong3') {
          rulesByPerson[speaker] = { type, a: others[0], b: others[1], c: others[2] };
        } else if (type === 'atMostOneLiarAmong3') {
          rulesByPerson[speaker] = { type, a: others[0], b: others[1], c: others[2] };
        }
      }

      const sols = findSolutions(ids, rulesByPerson, liarCount);
      if (sols.length === 1) {
        const sol = sols[0];

        // statement 렌더
        const peopleWithStatements = people.map((p) => {
          const r = rulesByPerson[p.id];
          let text = '';
          if (r.type === 'accuseLiar') text = STAT_TEMPLATES.accuseLiar(p.id, idToName[r.target]);
          if (r.type === 'defend') text = STAT_TEMPLATES.defend(p.id, idToName[r.target]);
          if (r.type === 'notDefend') text = STAT_TEMPLATES.notDefend(p.id, idToName[r.target]);
          if (r.type === 'exactlyOneLiarAmong2') text = STAT_TEMPLATES.exactlyOneLiarAmong2(p.id, idToName[r.a], idToName[r.b]);
          if (r.type === 'atLeastOneLiarAmong3') text = STAT_TEMPLATES.atLeastOneLiarAmong3(p.id, idToName[r.a], idToName[r.b], idToName[r.c]);
          if (r.type === 'atMostOneLiarAmong3') text = STAT_TEMPLATES.atMostOneLiarAmong3(p.id, idToName[r.a], idToName[r.b], idToName[r.c]);
          return { ...p, statement: text };
        });

        const liarNames = sol.liars.map((id) => idToName[id]).join(', ');

        return {
          id: `gen-${level}-${serial}`,
          level,
          title: level === 'easy' ? '랜덤 사건(쉬움)' : level === 'normal' ? '랜덤 사건(보통)' : '랜덤 사건(어려움)',
          story: `거짓말쟁이는 정확히 ${liarCount}명입니다. (자동 생성 문제)` ,
          people: peopleWithStatements,
          // 정답은 생성 시점에 같이 계산되어 들어감
          answer: { liars: sol.liars },
          hint: '모든 발언이 동시에 성립하도록 경우를 나눠 보세요.',
          explanation: `정답은 생성기에서 브루트포스 검증으로 계산되었습니다. 거짓말쟁이: ${liarNames}.`
        };
      }
    }

    // 실패 시 안전하게 기존 퍼즐을 반환
    return null;
  }
  const GENERATED_POOL = { easy: [], normal: [], hard: [] };

  function ensureGenerated(level, wantCount) {
    const pool = GENERATED_POOL[level];
    let serial = pool.length;
    while (pool.length < wantCount) {
      const puzzle = makeGeneratedPuzzle(level, serial + 1);
      serial += 1;
      if (puzzle) pool.push(puzzle);
      else break;
    }
  }

  function getAllPuzzlesForLevel(level) {
    // 내장형 + 자동생성형을 합쳐서 사용
    const builtIn = PUZZLES.filter((p) => p.level === level);
    ensureGenerated(level, 8); // 레벨별로 자동생성 최소 8개 확보
    return builtIn.concat(GENERATED_POOL[level]);
  }

  const LiarVillageGame = {
    container: null,
    root: null,
    level: 'easy',
    indexByLevel: { easy: 0, normal: 0, hard: 0 },
    score: 0,
    lives: MAX_LIVES,
    cleared: 0,
    gameOver: false,
    state: null,


    showToast(msg, isError = false) {
      if (typeof window.showToast === 'function') {
        window.showToast(msg);
        return;
      }
      let toast = document.getElementById('lv-toast-msg');
      if (!toast) {
        toast = document.createElement('div');
        toast.id = 'lv-toast-msg';
        toast.className = 'game-liar-village';
        toast.innerHTML = '<div class="lv-toast"></div>';
        document.body.appendChild(toast);
      }
      const toastEl = toast.querySelector('.lv-toast');
      toastEl.textContent = msg;
      toastEl.style.background = isError ? '#ef4444' : '#334155';
      toastEl.classList.add('show');
      setTimeout(() => toastEl.classList.remove('show'), 3000);
    },

    goHome() {
      this.destroy();
      if (window.LegacyBridge && typeof window.LegacyBridge.backHome === 'function') {
        window.LegacyBridge.backHome();
      } else if (typeof window.goHome === 'function') {
        window.goHome();
        const d = document.getElementById('dashboard-screen');
        if (d) d.style.display = '';
      } else {
        window.location.reload();
      }
    },
    mount(container) {
      const view = document.getElementById('mathlab-view');
      this.container = container || view;
      this.container.style.display = 'block';
      if (!this.container || typeof this.container.innerHTML === 'undefined') {
        console.error('[LiarVillage] 렌더링할 컨테이너를 찾을 수 없습니다.', container);
        return;
      }
      if (!this.state || this.gameOver) this.startGame();
      this.renderAndBind();
    },

    startGame() {
      this.level = 'easy';
      this.indexByLevel = { easy: 0, normal: 0, hard: 0 };
      this.score = 0;
      this.lives = MAX_LIVES;
      this.cleared = 0;
      this.gameOver = false;
      this.startPuzzle('쉬움 1번 문제부터 시작합니다.');
    },

    reset() {
      if (this.gameOver) this.startGame();
      else this.startPuzzle('현재 문제를 다시 시작합니다.');
      this.renderAndBind();
    },

    destroy() {
      if (this.container) this.container.innerHTML = '';
      this.root = null;
    },

    getPuzzlesByLevel(level) {
      return PUZZLES.filter((puzzle) => puzzle.level === level);
    },

    getCurrentPuzzle() {
      const list = this.getPuzzlesByLevel(this.level);
      const index = this.indexByLevel[this.level] || 0;
      return list[Math.min(index, list.length - 1)] || PUZZLES[0];
    },

    startPuzzle(message) {
      const puzzle = this.getCurrentPuzzle();
      const choices = {};
      puzzle.people.forEach((person) => { choices[person.id] = 'honest'; });
      this.state = {
        puzzle,
        choices,
        hinted: false,
        roundOver: false,
        tone: 'normal',
        message: message || '각 사람을 정직/거짓말쟁이로 분류한 뒤 정답을 제출하세요.',
        explanation: ''
      };
    },

    setLevel(level) {
      this.level = level;
      this.startPuzzle(`${LEVEL_LABELS[level]} 단계로 이동했습니다.`);
      this.renderAndBind();
    },

    nextPuzzle() {
      if (this.gameOver) {
        this.startGame();
        this.renderAndBind();
        return;
      }
      const list = this.getPuzzlesByLevel(this.level);
      this.indexByLevel[this.level] = ((this.indexByLevel[this.level] || 0) + 1) % list.length;
      const nextIndex = (this.indexByLevel[this.level] || 0) + 1;
      this.startPuzzle(`${LEVEL_LABELS[this.level]} ${nextIndex}번 문제입니다.`);
      this.renderAndBind();
    },

    setChoice(personId, role) {
      if (this.state.roundOver || this.gameOver) return;
      this.state.choices[personId] = role;
      this.renderAndBind();
    },

    useHint() {
      if (this.state.roundOver || this.gameOver) return;
      this.state.hinted = true;
      this.state.message = '힌트: ' + this.state.puzzle.hint;
      this.state.tone = 'warn';
      this.renderAndBind();
    },

    submitAnswer() {
      if (this.state.roundOver || this.gameOver) return;
      const selectedLiars = Object.keys(this.state.choices).filter((id) => this.state.choices[id] === 'liar');
      const answerLiars = this.state.puzzle.answer.liars;
      if (sameSet(selectedLiars, answerLiars)) {
        const gained = 100 + this.getLevelBonus() + (this.lives * 10) + (this.state.hinted ? 0 : 20);
        this.score += gained;
        this.cleared += 1;
        this.state.roundOver = true;
        this.state.tone = 'success';
        this.state.message = `정답입니다! +${gained}점`;
        this.state.explanation = this.getAnswerText();
      } else {
        this.lives = Math.max(0, this.lives - 1);
        this.state.roundOver = true;
        this.state.tone = this.lives > 0 ? 'warn' : 'danger';
        this.state.message = this.lives > 0 ? `오답입니다. 생명 1개가 차감됩니다. 남은 생명: ${this.lives}개` : '오답입니다. 생명이 모두 소진되어 게임이 종료되었습니다.';
        this.state.explanation = this.getAnswerText();
        if (this.lives <= 0) this.gameOver = true;
      }
      this.renderAndBind();
    },

    getLevelBonus() {
      if (this.level === 'normal') return 20;
      if (this.level === 'hard') return 40;
      return 0;
    },

    getProgressText() {
      const list = this.getPuzzlesByLevel(this.level);
      return `${LEVEL_LABELS[this.level]} ${(this.indexByLevel[this.level] || 0) + 1} / ${list.length}`;
    },

    getAnswerText() {
      const puzzle = this.state.puzzle;
      const liars = puzzle.answer.liars.map((id) => {
        const person = puzzle.people.find((p) => p.id === id);
        return person ? person.name : id;
      }).join(', ');
      return `정답: 거짓말쟁이 ${liars}. ${puzzle.explanation}`;
    },

    submitScore() {
      if (typeof window.showInlineRankingModal === 'function') {
        window.showInlineRankingModal(GAME_NAME, this.score, true, BOARD_ID);

        this.showToast('랭킹 모달 함수를 찾을 수 없습니다.', true);

      }
    },

    renderAndBind() {
      this.render();
      this.bindEvents();
      this.loadLeaderboard();
    },

    render() {

      const statusClass = this.state.tone === 'success' ? 'success' : this.state.tone === 'danger' ? 'danger' : this.state.tone === 'warn' ? 'warn' : '';
      this.container.innerHTML = `

              <button class="lv-btn-home" onclick="if(window.LiarVillageGameInstance) window.LiarVillageGameInstance.goHome()" style="background: #ef4444; color: #fff; border: none; border-radius: 8px; font-weight: bold; padding: 6px 12px; cursor: pointer;">🏠 홈으로</button>
            </div>
            <p class="lv-subtitle">정직한 사람은 참말만, 거짓말쟁이는 거짓말만 합니다. 발언을 비교해 누가 거짓말쟁이인지 찾아보세요.</p>
          </section>
          <section class="lv-layout">
            <main class="lv-panel">
              <div class="lv-board-head"><h3 class="lv-puzzle-title">${puzzle.title}</h3><span class="lv-badge">${this.getProgressText()}</span></div>
              <p class="lv-story">${puzzle.story}</p>

              <div class="lv-card"><h3>현재 상태</h3><div class="lv-status ${statusClass}">${this.state.message}</div><div class="lv-stats"><div class="lv-stat"><span>점수</span><strong>${this.score}점</strong></div><div class="lv-stat"><span>생명</span><strong>${'❤️'.repeat(this.lives) || '0'}</strong></div><div class="lv-stat"><span>성공 라운드</span><strong>${this.cleared}</strong></div><div class="lv-stat"><span>힌트</span><strong>${this.state.hinted ? '사용' : '미사용'}</strong></div></div></div>

            <div class="lv-leaderboard"><h3>🏆 명예의 전당 (누적 점수)</h3><div id="board-liar-village"><p>랭킹 로딩 중...</p></div></div>
          </section>
        </div>`;
    },

    renderPeople() {
      return this.state.puzzle.people.map((person) => {
        const role = this.state.choices[person.id];
        return `<article class="lv-person"><div class="lv-person-name"><span><span class="lv-avatar">${person.avatar}</span> ${person.name}</span><span>${person.id}</span></div><div class="lv-statement">“${person.statement}”</div><div class="lv-choice-row"><button type="button" class="lv-choice honest ${role === 'honest' ? 'active' : ''}" data-person="${person.id}" data-role="honest">정직</button><button type="button" class="lv-choice liar ${role === 'liar' ? 'active' : ''}" data-person="${person.id}" data-role="liar">거짓</button></div></article>`;
      }).join('');
    },

    renderLevelButton(level, label) {
      const active = this.level === level ? 'active' : '';
      return `<button type="button" class="lv-btn-level ${active}" data-level="${level}">${label}</button>`;
    },

    bindEvents() {
      this.root = this.container.querySelector('#liar-village-game');
      if (!this.root) return;
      this.root.querySelectorAll('[data-person]').forEach((button) => button.addEventListener('click', () => this.setChoice(button.getAttribute('data-person'), button.getAttribute('data-role'))));
      this.root.querySelectorAll('[data-level]').forEach((button) => button.addEventListener('click', () => this.setLevel(button.getAttribute('data-level'))));
      const actions = { submit: () => this.submitAnswer(), hint: () => this.useHint(), restart: () => this.reset(), next: () => this.nextPuzzle(), score: () => this.submitScore() };
      Object.keys(actions).forEach((action) => { const button = this.root.querySelector(`[data-action="${action}"]`); if (button) button.addEventListener('click', actions[action]); });
    }
  };

  const gameMeta = {
    id: 'liar-village',
    title: '거짓말쟁이 마을 추리',
    icon: '🤥',
    description: '명제의 참과 거짓을 비교해 거짓말쟁이를 찾는 논리 추리 게임',
    sourceType: 'new',
    mount(container, context) {
      if(!window.LiarVillageGameInstance) window.LiarVillageGameInstance = LiarVillageGame;
      window.LiarVillageGameInstance.mount(container);
    },
    reset() { if(window.LiarVillageGameInstance) window.LiarVillageGameInstance.reset(); },
    destroy() { if(window.LiarVillageGameInstance) window.LiarVillageGameInstance.destroy(); },
    goHome() { if(window.LiarVillageGameInstance) window.LiarVillageGameInstance.goHome(); }
  };

  function registerLiarVillageGameApp() {
    if (typeof window.MathLabGames !== 'undefined' && typeof window.MathLabGames.register === 'function') {
      if (!window.MathLabGames.get || !window.MathLabGames.get('liar-village')) {
        try { window.MathLabGames.register(gameMeta); } catch (e) {}
      }
    } else {
      if (typeof window.MathLabGames === 'undefined') {
        window.MathLabGames = { _registry: {}, register(game) { this._registry[game.id] = game; } };
      }
      if (window.MathLabGames._registry) window.MathLabGames._registry['liar-village'] = gameMeta;
    }
  }

  registerLiarVillageGameApp();
  window.addEventListener('DOMContentLoaded', registerLiarVillageGameApp);
  setTimeout(registerLiarVillageGameApp, 100);
  setTimeout(registerLiarVillageGameApp, 500);

  window.launchLiarVillageGame = function () {
    registerLiarVillageGameApp();
    if (window.LegacyBridge && typeof window.LegacyBridge.hideAllLegacySections === 'function') {
      window.LegacyBridge.hideAllLegacySections();
      window.LegacyBridge.showNewRoot();
    }
    if (typeof window.MathLabGames !== 'undefined' && typeof window.MathLabGames.mount === 'function') {
      try { window.MathLabGames.mount('liar-village'); return; } catch(e) {}
    }
    const targetEl = document.getElementById('mathlab-view') || document.getElementById('new-root');
    if(!window.LiarVillageGameInstance) window.LiarVillageGameInstance = LiarVillageGame;
    window.LiarVillageGameInstance.mount(targetEl);
  };
})();
</script>
