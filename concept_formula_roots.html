    },

    switchTab(tab) {
      if (this.state) {
        this.state.tab = tab;
        this.renderCurrentTab('tab');
      }
    },

    handleSliderInput(key, value) {
      if (!this.state) return;
      this.state.coeffs[this.state.tab][key] = Number(value);
      
      if(this.uiRaf) cancelAnimationFrame(this.uiRaf); 
      this.uiRaf = requestAnimationFrame(() => {
        this.updateCoeffLabels();
        this.markResultDirty();
      });
      
      // KaTeX 디바운싱 처리 (150ms로 늘려서 슬라이딩 중 버벅임 방지)
      if (this.equationTimeout) clearTimeout(this.equationTimeout);
      this.equationTimeout = setTimeout(() => {
        this.renderEquation();
      }, 150); // 150ms 디바운스
    },

    renderCurrentTab(reason) {
      const root = this.getRoot();
      if (!root || !this.state) return;

      root.querySelectorAll('[data-tab]').forEach((btn) => {
        const active = btn.getAttribute('data-tab') === this.state.tab;
        btn.classList.toggle('active', active);
        btn.setAttribute('aria-selected', active ? 'true' : 'false');
      });

      this.renderSummary();
      this.renderEquation();
      this.renderSliders();
      this.renderTheory();
      this.markResultDirty();
      this.renderLatexBlocks();
    },

    renderSummary() {
      const el = this.getRoot().querySelector('#fr-summary');
      if (!el) return;
      const info = this.getTabInfo();
      el.innerHTML = `<h2>${info.title}</h2><p>${info.desc}</p>`;
    },

    getTabInfo() {
      return {
        quadratic: {
          title: '이차방정식',
          desc: '판별식과 근의 공식을 이용해 실근, 중근, 허근을 구분합니다.'
        },
        cubic: {
          title: '삼차방정식',
          desc: 'Cardano 공식의 흐름을 살펴보고, 실제 근은 버튼을 눌러 수치적으로 구합니다.'
        },
        quartic: {
          title: '사차방정식',
          desc: 'Ferrari 방법의 핵심 아이디어를 살펴보고, 실제 근은 버튼을 눌러 수치적으로 구합니다.'
        }
      }[this.state.tab];
    },

    renderEquation() {
      const target = this.getRoot().querySelector('#fr-equation');
      this.renderLatex(target, this.getEquationLatex(), true);
    },

    getEquationLatex() {
      const tab = this.state.tab;
      const c = this.state.coeffs[tab];
      if (tab === 'quadratic') return `${this.term(c.a, 'x^2', true)}${this.term(c.b, 'x')}${this.constant(c.c)} = 0`;
      if (tab === 'cubic') return `${this.term(c.a, 'x^3', true)}${this.term(c.b, 'x^2')}${this.term(c.c, 'x')}${this.constant(c.d)} = 0`;
      return `${this.term(c.a, 'x^4', true)}${this.term(c.b, 'x^3')}${this.term(c.c, 'x^2')}${this.term(c.d, 'x')}${this.constant(c.e)} = 0`;
    },

    term(value, variable, first) {
      const n = Number(value);
      if (!Number.isFinite(n) || Math.abs(n) < 1e-12) return first ? `0${variable}` : '';
      const sign = n < 0 ? '-' : '+';
      const abs = Math.abs(n);
      const body = abs === 1 ? variable : `${this.formatNumber(abs)}${variable}`;
      if (first) return n < 0 ? `-${body}` : body;
      return ` ${sign} ${body}`;
    },

    constant(value) {
      const n = Number(value);
      if (!Number.isFinite(n) || Math.abs(n) < 1e-12) return '';
      return n < 0 ? ` - ${this.formatNumber(Math.abs(n))}` : ` + ${this.formatNumber(n)}`;
    },

    renderSliders() {

      if (!box) return;
      const coeffs = this.state.coeffs[this.state.tab];

        <label class="fr-slider-row">
          <span class="fr-slider-label">${cfg.label}: <strong id="fr-val-${cfg.key}">${this.formatNumber(coeffs[cfg.key])}</strong></span>
          <input type="range" min="${cfg.min}" max="${cfg.max}" step="${cfg.step}" value="${coeffs[cfg.key]}" data-coeff="${cfg.key}" oninput="window.FormulaRootsApp.handleSliderInput('${cfg.key}', this.value)">
        </label>
      `).join('');
    },

    getSliderConfigs(tab) {
      if (tab === 'quadratic') return [
        { key: 'a', label: 'a', min: -5, max: 5, step: 0.5 },
        { key: 'b', label: 'b', min: -10, max: 10, step: 0.5 },
        { key: 'c', label: 'c', min: -10, max: 10, step: 0.5 }
      ];
      if (tab === 'cubic') return [
        { key: 'a', label: 'a', min: -3, max: 3, step: 0.5 },
        { key: 'b', label: 'b', min: -10, max: 10, step: 0.5 },
        { key: 'c', label: 'c', min: -15, max: 15, step: 0.5 },
        { key: 'd', label: 'd', min: -20, max: 20, step: 0.5 }
      ];
      return [
        { key: 'a', label: 'a', min: -3, max: 3, step: 0.5 },
        { key: 'b', label: 'b', min: -10, max: 10, step: 0.5 },
        { key: 'c', label: 'c', min: -15, max: 15, step: 0.5 },
        { key: 'd', label: 'd', min: -20, max: 20, step: 0.5 },
        { key: 'e', label: 'e', min: -20, max: 20, step: 0.5 }
      ];
    },

    updateCoeffLabels() {
      const root = this.getRoot();
      if (!root) return;
      const coeffs = this.state.coeffs[this.state.tab];
      Object.keys(coeffs).forEach((key) => {
        const el = root.querySelector(`#fr-val-${key}`);
        if (el) el.textContent = this.formatNumber(coeffs[key]);
      });
    },

    markResultDirty() {
      const result = this.getRoot().querySelector('#fr-result');
      if (result) result.innerHTML = '계수가 바뀌었습니다. <strong>[근 구하기]</strong>를 눌러 다시 계산하세요.';
    },

    solveCurrent() {
      const result = this.getRoot().querySelector('#fr-result');
      if (!result) return;
      const tab = this.state.tab;
      const c = this.state.coeffs[tab];
      if (Math.abs(c.a) < 1e-12) {
        result.innerHTML = '<p class="fr-error">최고차항 계수 a는 0이 될 수 없습니다. a를 0이 아닌 값으로 조정해 주세요.</p>';
        return;
      }
      if (tab === 'quadratic') result.innerHTML = this.quadraticResult(c);
      else {
        const coeffs = tab === 'cubic' ? [c.a, c.b, c.c, c.d] : [c.a, c.b, c.c, c.d, c.e];
        result.innerHTML = this.numericalResult(coeffs);
      }
      this.renderLatexBlocks();
    },

    quadraticResult(c) {
      const D = c.b * c.b - 4 * c.a * c.c;
      const yIntercept = c.c;
      const real = -c.b / (2 * c.a);
      let kind = '';
      let roots = [];
      if (Math.abs(D) < 1e-12) {
        kind = '중근';
        roots = [`x_1 = x_2 = ${this.formatNumber(real)}`];
      } else if (D > 0) {
        kind = '서로 다른 두 실근';
        const sqrtD = Math.sqrt(D);
        roots = [`x_1 = ${this.formatNumber((-c.b + sqrtD) / (2 * c.a))}`, `x_2 = ${this.formatNumber((-c.b - sqrtD) / (2 * c.a))}`];
      } else {
        kind = '서로 켤레인 두 허근';
        const im = Math.sqrt(-D) / Math.abs(2 * c.a);
        roots = [`x_1 = ${this.formatNumber(real)} + ${this.formatNumber(im)}i`, `x_2 = ${this.formatNumber(real)} - ${this.formatNumber(im)}i`];
      }
      return `
        <h3>계산 결과</h3>
        <div class="fr-result-grid">
          <div><strong>판별식</strong><span data-latex="D = ${this.formatNumber(D)}"></span></div>
          <div><strong>근의 형태</strong><br>${kind}</div>
          <div><strong>y절편</strong><span data-latex="(0, ${this.formatNumber(yIntercept)})"></span></div>
        </div>
        <ul class="fr-roots-list">${roots.map(r => `<li><span data-latex="${r}"></span></li>`).join('')}</ul>
        <div class="fr-mini-latex" data-latex="x = \\frac{-b \\pm \\sqrt{b^2 - 4ac}}{2a}"></div>
      `;
    },

    numericalResult(coeffs) {
      const degree = coeffs.length - 1;
      const roots = this.durandKerner(coeffs);
      return `
        <h3>${degree}차방정식 수치 근사 결과</h3>
        <p class="fr-note">일반 ${degree}차 공식은 매우 길기 때문에, 버튼을 누른 시점의 계수에 대해 Durand-Kerner 방식으로 근을 근사합니다.</p>
        <div class="fr-result-grid">
          <div><strong>차수</strong><br>${degree}차</div>
          <div><strong>y절편</strong><span data-latex="(0, ${this.formatNumber(coeffs[coeffs.length - 1])})"></span></div>
          <div><strong>표시</strong><br>소수 근사, a ± bi</div>
        </div>
        <ul class="fr-roots-list">${roots.map((z, i) => `<li><span data-latex="x_${i + 1} = ${this.complexLatex(z)}"></span></li>`).join('')}</ul>
      `;
    },

    durandKerner(coeffs) {
      const n = coeffs.length - 1;
      const a0 = coeffs[0];
      const normalized = coeffs.map(v => v / a0);
      const radius = 1 + Math.max(...normalized.slice(1).map(v => Math.abs(v)));
      const roots = Array.from({ length: n }, (_, k) => {
        const theta = 2 * Math.PI * k / n;
        return { re: radius * Math.cos(theta), im: radius * Math.sin(theta) };
      });
      for (let iter = 0; iter < 90; iter++) {
        let maxDelta = 0;
        for (let i = 0; i < n; i++) {
          let denom = { re: 1, im: 0 };
          for (let j = 0; j < n; j++) if (i !== j) denom = this.cMul(denom, this.cSub(roots[i], roots[j]));
          if (this.cAbs(denom) < 1e-14) denom = { re: 1e-8, im: 1e-8 };
          const delta = this.cDiv(this.evalPolyComplex(normalized, roots[i]), denom);
          roots[i] = this.cSub(roots[i], delta);
          maxDelta = Math.max(maxDelta, this.cAbs(delta));
        }
        if (maxDelta < 1e-10) break;
      }
      return roots.sort((a, b) => a.re - b.re || a.im - b.im);
    },

    evalPolyComplex(coeffs, z) {
      let result = { re: coeffs[0], im: 0 };
      for (let i = 1; i < coeffs.length; i++) result = this.cAdd(this.cMul(result, z), { re: coeffs[i], im: 0 });
      return result;
    },
    cAdd(a, b) { return { re: a.re + b.re, im: a.im + b.im }; },
    cSub(a, b) { return { re: a.re - b.re, im: a.im - b.im }; },
    cMul(a, b) { return { re: a.re * b.re - a.im * b.im, im: a.re * b.im + a.im * b.re }; },
    cDiv(a, b) { const den = b.re * b.re + b.im * b.im; return { re: (a.re * b.re + a.im * b.im) / den, im: (a.im * b.re - a.re * b.im) / den }; },
    cAbs(a) { return Math.hypot(a.re, a.im); },

    complexLatex(z) {
      const re = Math.abs(z.re) < 1e-7 ? 0 : z.re;
      const im = Math.abs(z.im) < 1e-7 ? 0 : z.im;
      if (im === 0) return this.formatNumber(re);
      if (re === 0) return `${this.formatNumber(im)}i`;
      return `${this.formatNumber(re)} ${im >= 0 ? '+' : '-'} ${this.formatNumber(Math.abs(im))}i`;
    },

    formatNumber(value) {
      const n = Number(value);
      if (!Number.isFinite(n)) return String(value);
      const rounded = Math.round(n * 10000) / 10000;
      if (Object.is(rounded, -0)) return '0';
      if (Number.isInteger(rounded)) return String(rounded);
      return rounded.toFixed(4).replace(/\.?0+$/, '');
    },

    renderTheory() {
      const box = this.getRoot().querySelector('#fr-theory');
      if (!box) return;
      if (this.state.tab === 'quadratic') box.innerHTML = this.quadraticTheory();
      else if (this.state.tab === 'cubic') box.innerHTML = this.cubicTheory();
      else box.innerHTML = this.quarticTheory();
      this.renderLatexBlocks();
    },

    quadraticTheory() {
      return `
        <details class="fr-details">
          <summary>이차방정식 근의 공식 유도 보기</summary>

          <div class="fr-explain-box fr-key-box">
            <h4>핵심 아이디어</h4>
            <p>이차방정식은 <strong>완전제곱식</strong>을 만들면 풀 수 있습니다. 목표는 왼쪽을 어떤 식의 제곱으로 바꾸고, 마지막에 제곱근을 씌우는 것입니다.</p>

          <div class="fr-step-grid">
            <div class="fr-step-card">
              <div class="fr-step-badge">1단계</div>

            <div class="fr-step-card">
              <div class="fr-step-badge">4단계</div>

              <div data-latex="x^2 + \\frac{b}{a}x + \\left(\\frac{b}{2a}\\right)^2 = -\\frac{c}{a} + \\left(\\frac{b}{2a}\\right)^2"></div>

    cubicTheory() {
      return `
        <details class="fr-details">
          <summary>삼차방정식 Cardano 공식의 흐름 자세히 보기</summary>

            <h4>핵심 아이디어</h4>
            <p>삼차방정식은 먼저 이차항을 없애서 단순한 꼴로 만든 뒤, 미지수를 두 수의 합 $t=u+v$로 나누어 생각합니다.</p>

          <div class="fr-step-grid">
            <div class="fr-step-card">
              <div class="fr-step-badge">1단계</div>

    quarticTheory() {
      return `
        <details class="fr-details">

          <div class="fr-explain-box fr-derivation-box">
            <h4>m을 왜 넣을까?</h4>

            <p>이 조건을 정리하면 $m$에 대한 삼차방정식이 나옵니다.</p>
            <div data-latex="q^2 = 4(2m-p)(m^2-r)"></div>
            <p>이 $m$에 대한 삼차방정식이 바로 <strong>resolvent cubic</strong>, 즉 보조 삼차방정식입니다.</p>
          </div>

          <div class="fr-explain-box fr-flow-box">
            <h4>Ferrari 방법 전체 흐름</h4>
            <ol>
              <li>사차방정식에서 삼차항을 없앱니다.</li>
              <li>$m$을 넣어 왼쪽을 $(y^2+m)^2$ 꼴로 만듭니다.</li>
              <li>오른쪽도 완전제곱식이 되도록 판별식을 0으로 둡니다.</li>
              <li>그 조건에서 나온 보조 삼차방정식을 풉니다.</li>
              <li>얻은 $m$으로 사차식을 두 이차방정식으로 나눕니다.</li>
              <li>마지막에는 이차방정식의 근의 공식으로 네 근을 구합니다.</li>
            </ol>
            <p>이 앱에서는 이 긴 공식을 직접 전개해서 계산하지 않고, Ferrari 방법의 큰 흐름을 이해한 뒤 실제 근은 수치해석으로 구합니다.</p>
          </div>
        </details>
      `;
    },

    renderLatexBlocks() {
      const root = this.getRoot();
      if (!root) return;
      root.querySelectorAll('[data-latex]').forEach(el => this.renderLatex(el, el.getAttribute('data-latex'), true));
      this.renderInlineMath(root);
    },

    renderInlineMath(root) {
      if (typeof katex === 'undefined') return;
      const targets = root.querySelectorAll('.fr-details p, .fr-details li');
      targets.forEach((el) => {
        if (el.dataset.inlineMathDone === '1') return;
        const text = el.textContent;
        if (!text || !text.includes('$')) return;

        const parts = text.split(/(\$[^$]+\$)/g);
        el.innerHTML = '';
        parts.forEach((part) => {
          if (part.startsWith('$') && part.endsWith('$')) {
            const span = document.createElement('span');
            katex.render(part.slice(1, -1), span, { throwOnError: false, displayMode: false });
            el.appendChild(span);
          } else {
            el.appendChild(document.createTextNode(part));
          }
        });
        el.dataset.inlineMathDone = '1';
      });
    },

    renderLatex(target, latex, displayMode) {
      if (!target) return;
      if (typeof katex !== 'undefined') katex.render(latex, target, { throwOnError: false, displayMode: !!displayMode });
      else target.textContent = latex;
    }
  };

  window.FormulaRootsApp = FormulaRootsApp;

  function registerMyApp() {
    if (typeof window.MathLabGames !== 'undefined' && typeof window.MathLabGames.register === 'function') {
      window.MathLabGames.register({
        id: 'formula-roots-concept',
        title: '근의 공식 실험실',
        icon: '🪄',
        appType: 'concept',
        topApp: '수학 개념',
        sourceType: 'new',
        mount(container) { FormulaRootsApp.mount(container); },
        reset() { FormulaRootsApp.reset(); },
        destroy() { FormulaRootsApp.destroy(); },
        goHome() { FormulaRootsApp.goHome(); }
      });
    }
  }

  registerMyApp();
  window.addEventListener('DOMContentLoaded', registerMyApp);

  window.initFormulaRootsApp = function() {
    if (window.LegacyBridge && typeof window.LegacyBridge.hideAllLegacySections === 'function') {
      window.LegacyBridge.hideAllLegacySections();
      window.LegacyBridge.showNewRoot();
    }
    if (typeof window.MathLabGames !== 'undefined' && typeof window.MathLabGames.mount === 'function') {
      try { window.MathLabGames.mount('formula-roots-concept'); return; } catch(e){}
    }
    FormulaRootsApp.mount();
  };
})();
</script>
