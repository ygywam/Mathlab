<script>
(function() {
  'use strict';

  /* --------------------------------------------------------------------------
     1. KaTeX 수식 렌더링 헬퍼 & 안전 파서
     -------------------------------------------------------------------------- */
  function flcKatex(elOrId, latex, isDisplay) {
    var el = typeof elOrId === 'string' ? document.getElementById(elOrId) : elOrId;
    if (!el) return;
    if (window.katex && typeof window.katex.render === 'function') {
      try {
        window.katex.render(latex, el, { displayMode: !!isDisplay, throwOnError: false });
        return;
      } catch(e) {}
    }
    el.textContent = latex;
  }

  class SafeMathParser {
    static sanitize(expr) {
      if (!expr) return () => 0;
      var s = expr.trim();
      if (s.includes('?') && s.includes(':')) {
        return this.compileTernary(s);
      }
      return this.compileSingle(s);
    }

    static compileTernary(str) {
      var qIdx = str.indexOf('?');
      var condStr = str.substring(0, qIdx).trim();
      var rest = str.substring(qIdx + 1);
      var colonIdx = -1;
      var depth = 0;
      for (var i = 0; i < rest.length; i++) {
        if (rest[i] === '(' || rest[i] === '{' || rest[i] === '[') depth++;
        else if (rest[i] === ')' || rest[i] === '}' || rest[i] === ']') depth--;
        else if (rest[i] === '?' && depth === 0) depth++;
        else if (rest[i] === ':' && depth === 0) { colonIdx = i; break; }
        else if (rest[i] === ':' && depth > 0) depth--;
      }
      if (colonIdx === -1) colonIdx = rest.lastIndexOf(':');
      var trueStr = rest.substring(0, colonIdx).trim();
      var falseStr = rest.substring(colonIdx + 1).trim();

      var condFn = this.compileCondition(condStr);
      var trueFn = this.sanitize(trueStr);
      var falseFn = this.sanitize(falseStr);
      return function(x) { return condFn(x) ? trueFn(x) : falseFn(x); };
    }

    static compileCondition(condStr) {
      var match = condStr.match(/x\s*(<=|>=|!=|==|<|>)\s*(-?\d+(\.\d+)?)/);
      if (!match) return function() { return true; };
      var op = match[1];
      var val = parseFloat(match[2]);
      return function(x) {
        switch (op) {
          case '<=': return x <= val + 1e-9;
          case '>=': return x >= val - 1e-9;
          case '<': return x < val - 1e-9;
          case '>': return x > val + 1e-9;
          case '!=': return Math.abs(x - val) > 1e-6;
          case '==': return Math.abs(x - val) <= 1e-6;
          default: return true;
        }
      };
    }

    static compileSingle(expr) {
      var code = expr.replace(/\s+/g, '');
      code = code.replace(/\|([^|]+)\|/g, 'abs($1)');
      code = code.replace(/(\d)([a-zA-Z(])/g, '$1*$2');
      code = code.replace(/([xX\)])(\()/g, '$1*$2');
      code = code.replace(/(\))([0-9a-zA-Z])/g, '$1*$2');
      code = code.replace(/([xX])([a-zA-Z])/g, '$1*$2');
      code = this.convertPowers(code);
      code = code.replace(/\babs\(/g, 'Math.abs(')
                 .replace(/\bsqrt\(/g, 'Math.sqrt(')
                 .replace(/\bsin\(/g, 'Math.sin(')
                 .replace(/\bcos\(/g, 'Math.cos(')
                 .replace(/\btan\(/g, 'Math.tan(')
                 .replace(/\bln\(/g, 'Math.log(')
                 .replace(/\bexp\(/g, 'Math.exp(')
                 .replace(/\bpi\b/gi, 'Math.PI')
                 .replace(/\be\b/g, 'Math.E');

      try {
        var fn = new Function('x', 'try { var y = ' + code + '; if (typeof y !== "number" || isNaN(y)) return NaN; if (!isFinite(y)) return y > 0 ? Infinity : -Infinity; return y; } catch(e) { return NaN; }');
        fn(1);
        return fn;
      } catch (err) {
        return function() { return NaN; };
      }
    }

    static convertPowers(expr) {
      var res = expr;
      while (res.includes('^')) {
        var idx = res.lastIndexOf('^');
        var baseStart = idx - 1;
        if (res[baseStart] === ')') {
          var depth = 1;
          baseStart--;
          while (baseStart >= 0 && depth > 0) {
            if (res[baseStart] === ')') depth++;
            else if (res[baseStart] === '(') depth--;
            baseStart--;
          }
          baseStart++;
        } else {
          while (baseStart >= 0 && /[0-9a-zA-Z_\.]/.test(res[baseStart])) {
            baseStart--;
          }
          baseStart++;
        }

        var expEnd = idx + 1;
        if (res[expEnd] === '(') {
          var d = 1;
          expEnd++;
          while (expEnd < res.length && d > 0) {
            if (res[expEnd] === '(') d++;
            else if (res[expEnd] === ')') d--;
            expEnd++;
          }
        } else {
          if (res[expEnd] === '-') expEnd++;
          while (expEnd < res.length && /[0-9a-zA-Z_\.]/.test(res[expEnd])) {
            expEnd++;
          }
        }

        var base = res.slice(baseStart, idx);
        var exponent = res.slice(idx + 1, expEnd);
        var replacement = 'Math.pow(' + base + ', ' + exponent + ')';
        res = res.slice(0, baseStart) + replacement + res.slice(expEnd);
      }
      return res;
    }
  }

  /* --------------------------------------------------------------------------
     2. 모듈 상태 및 계산 엔진
     -------------------------------------------------------------------------- */
  var state = {
    rawExpr: 'x^3 - 3*x',
    evalFn: SafeMathParser.sanitize('x^3 - 3*x'),
    a: 1.0,
    animProgress: 0,
    showTangent: true,
    showAnim: true,
    view: { originX: 0, originY: 0, scale: 48 },
    animReqId: null,
    currentSlide: 0
  };

  function evalLimitsAndDiff(f, a) {
    var h_vals = [0.1, 0.01, 0.001, 0.0001, 0.00001];
    var fa = f(a);
    var isFaDefined = !isNaN(fa) && isFinite(fa);

    var leftVals = h_vals.map(function(h) { return f(a - h); }).filter(function(y) { return !isNaN(y) && isFinite(y); });
    var leftLimit = NaN;
    if (leftVals.length >= 2) {
      leftLimit = leftVals[leftVals.length - 1];
      if (Math.abs(leftLimit) > 1e4) leftLimit = leftLimit > 0 ? Infinity : -Infinity;
    }

    var rightVals = h_vals.map(function(h) { return f(a + h); }).filter(function(y) { return !isNaN(y) && isFinite(y); });
    var rightLimit = NaN;
    if (rightVals.length >= 2) {
      rightLimit = rightVals[rightVals.length - 1];
      if (Math.abs(rightLimit) > 1e4) rightLimit = rightLimit > 0 ? Infinity : -Infinity;
    }

    var isLimitExist = false;
    var limitVal = NaN;
    if (isFinite(leftLimit) && isFinite(rightLimit)) {
      if (Math.abs(leftLimit - rightLimit) < 1e-3) {
        isLimitExist = true;
        limitVal = (leftLimit + rightLimit) / 2;
      }
    }

    var isContinuous = false;
    if (isFaDefined && isLimitExist) {
      if (Math.abs(fa - limitVal) < 1e-3) isContinuous = true;
    }

    var leftDiff = NaN, rightDiff = NaN;
    if (isContinuous) {
      var dh = 0.0001;
      var y_left = f(a - dh);
      var y_right = f(a + dh);
      if (isFinite(y_left)) leftDiff = (fa - y_left) / dh;
      if (isFinite(y_right)) rightDiff = (y_right - fa) / dh;
    }

    var isDiff = false;
    var diffVal = NaN;
    if (isContinuous && isFinite(leftDiff) && isFinite(rightDiff)) {
      if (Math.abs(leftDiff - rightDiff) < 1e-2) {
        isDiff = true;
        diffVal = (leftDiff + rightDiff) / 2;
      }
    }

    return {
      fa: fa, isFaDefined: isFaDefined,
      leftLimit: leftLimit, rightLimit: rightLimit, isLimitExist: isLimitExist, limitVal: limitVal,
      isContinuous: isContinuous,
      leftDiff: leftDiff, rightDiff: rightDiff, isDiff: isDiff, diffVal: diffVal
    };
  }

  function showToast(msg) {
    var toast = document.getElementById('flc-toast-box');
    if (!toast) return;
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(function() { toast.classList.remove('show'); }, 2200);
  }

  /* --------------------------------------------------------------------------
     3. 캔버스 렌더러
     -------------------------------------------------------------------------- */
  function toScrX(x) { return state.view.originX + x * state.view.scale; }
  function toScrY(y) { return state.view.originY - y * state.view.scale; }
  function toWldX(sx) { return (sx - state.view.originX) / state.view.scale; }
  function toWldY(sy) { return (state.view.originY - sy) / state.view.scale; }

  function drawCanvas() {
    var canvas = document.getElementById('flcGraphCanvas');
    if (!canvas || !canvas.parentElement) return;
    var ctx = canvas.getContext('2d');
    var w = canvas.parentElement.clientWidth;
    var h = canvas.parentElement.clientHeight;
    if (w === 0 || h === 0) return;

    ctx.clearRect(0, 0, w, h);
    var xMin = toWldX(0), xMax = toWldX(w);
    var yMin = toWldY(h), yMax = toWldY(0);

    // 1. 격자 및 축
    ctx.lineWidth = 1;
    ctx.strokeStyle = '#e2e8f0';
    ctx.fillStyle = '#64748b';
    ctx.font = '11px -apple-system, sans-serif';

    var xStep = state.view.scale < 30 ? 2 : 1;
    for (var x = Math.floor(xMin / xStep) * xStep; x <= xMax; x += xStep) {
      var sx = toScrX(x);
      ctx.beginPath(); ctx.moveTo(sx, 0); ctx.lineTo(sx, h); ctx.stroke();
      if (x !== 0) ctx.fillText(x.toFixed(0), sx - 4, toScrY(0) + 14);
    }
    var yStep = state.view.scale < 30 ? 2 : 1;
    for (var y = Math.floor(yMin / yStep) * yStep; y <= yMax; y += yStep) {
      var sy = toScrY(y);
      ctx.beginPath(); ctx.moveTo(0, sy); ctx.lineTo(w, sy); ctx.stroke();
      if (y !== 0) ctx.fillText(y.toFixed(0), toScrX(0) + 6, sy + 4);
    }

    ctx.lineWidth = 2;
    ctx.strokeStyle = '#94a3b8';
    var y0 = toScrY(0);
    ctx.beginPath(); ctx.moveTo(0, y0); ctx.lineTo(w, y0); ctx.stroke();
    var x0 = toScrX(0);
    ctx.beginPath(); ctx.moveTo(x0, 0); ctx.lineTo(x0, h); ctx.stroke();
    ctx.fillText("O", x0 - 12, y0 + 14);

    // 2. 함수 곡선
    var f = state.evalFn;
    ctx.lineWidth = 3.5;
    ctx.strokeStyle = '#4f46e5';
    ctx.beginPath();
    var isDrawing = false;
    for (var px = 0; px <= w; px += 1.5) {
      var wx = toWldX(px);
      var wy = f(wx);
      if (isNaN(wy) || !isFinite(wy) || Math.abs(wy) > 100) {
        isDrawing = false;
        continue;
      }
      var py = toScrY(wy);
      if (!isDrawing) { ctx.moveTo(px, py); isDrawing = true; }
      else {
        var prevX = toWldX(px - 1.5);
        var prevY = f(prevX);
        if (Math.abs(wy - prevY) > (toWldY(0) - toWldY(canvas.height)) * 1.5) {
          ctx.moveTo(px, py);
        } else {
          ctx.lineTo(px, py);
        }
      }
    }
    ctx.stroke();

    // 3. 조사점 a 시각화
    var a = state.a;
    var res = evalLimitsAndDiff(f, a);
    var sa = toScrX(a);

    ctx.setLineDash([4, 4]);
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = '#64748b';
    ctx.beginPath(); ctx.moveTo(sa, 0); ctx.lineTo(sa, h); ctx.stroke();
    ctx.setLineDash([]);

    if (state.showTangent && res.isContinuous) {
      var tLen = 3.5;
      if (isFinite(res.leftDiff)) {
        var x1 = a - tLen, y1 = res.fa - res.leftDiff * tLen;
        ctx.lineWidth = 2.5; ctx.strokeStyle = 'rgba(2, 132, 199, 0.85)';
        ctx.beginPath(); ctx.moveTo(toScrX(x1), toScrY(y1)); ctx.lineTo(sa, toScrY(res.fa)); ctx.stroke();
      }
      if (isFinite(res.rightDiff)) {
        var x2 = a + tLen, y2 = res.fa + res.rightDiff * tLen;
        ctx.lineWidth = 2.5; ctx.strokeStyle = 'rgba(225, 29, 72, 0.85)';
        ctx.beginPath(); ctx.moveTo(sa, toScrY(res.fa)); ctx.lineTo(toScrX(x2), toScrY(y2)); ctx.stroke();
      }
    }

    if (state.showAnim) {
      var delta = (1 - state.animProgress) * 1.5 + 0.05;
      var xL = a - delta, yL = f(xL);
      if (isFinite(yL)) {
        var sxL = toScrX(xL), syL = toScrY(yL);
        ctx.fillStyle = '#0284c7'; ctx.beginPath(); ctx.arc(sxL, syL, 6, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#0284c7'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(sxL, syL); ctx.lineTo(sxL + 12, syL); ctx.stroke();
      }
      var xR = a + delta, yR = f(xR);
      if (isFinite(yR)) {
        var sxR = toScrX(xR), syR = toScrY(yR);
        ctx.fillStyle = '#e11d48'; ctx.beginPath(); ctx.arc(sxR, syR, 6, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#e11d48'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(sxR, syR); ctx.lineTo(sxR - 12, syR); ctx.stroke();
      }
    }

    if (res.isFaDefined) {
      var sfa = toScrY(res.fa);
      ctx.fillStyle = '#16a34a'; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(sa, sfa, 7, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    } else if (res.isLimitExist) {
      var sLim = toScrY(res.limitVal);
      ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#e11d48'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(sa, sLim, 7, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    }

    ctx.fillStyle = '#1e293b';
    ctx.font = 'bold 13px -apple-system, sans-serif';
    ctx.fillText('x = ' + a.toFixed(2), sa + 8, y0 - 10);
  }

  function resizeCanvas() {
    var canvas = document.getElementById('flcGraphCanvas');
    if (!canvas || !canvas.parentElement) return;
    var rect = canvas.parentElement.getBoundingClientRect();
    var dpr = window.devicePixelRatio || 1;
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    var ctx = canvas.getContext('2d');
    ctx.resetTransform();
    ctx.scale(dpr, dpr);
    state.view.originX = rect.width / 2;
    state.view.originY = rect.height / 2;
    drawCanvas();
  }

  /* --------------------------------------------------------------------------
     4. 대시보드 갱신 (\displaystyle lim 정가운데 배치)
     -------------------------------------------------------------------------- */
  function updateDashboard() {
    var a = state.a;
    var aStr = a.toFixed(2);
    var f = state.evalFn;
    var res = evalLimitsAndDiff(f, a);

    var badge = document.getElementById('flcBadgeA');
    if (badge) badge.textContent = aStr;
    flcKatex('flcLblA', '\\text{조사할 점 } x = a \\;(' + aStr + ')');

    var fmtLatex = function(v) { return isFinite(v) ? v.toFixed(4) : (v > 0 ? '+\\infty' : (v < 0 ? '-\\infty' : '\\text{없음}')); };

    // 1단계: 극한
    flcKatex('flcTitleLimit', '\\text{1단계 : } \\displaystyle\\lim_{x \\to ' + aStr + '} f(x) \\;\\text{존재 여부}');
    flcKatex('flcLblLeftLimit', '\\displaystyle\\lim_{x \\to ' + aStr + '^-} f(x) =');
    flcKatex('flcValLeftLimit', fmtLatex(res.leftLimit));
    flcKatex('flcLblRightLimit', '\\displaystyle\\lim_{x \\to ' + aStr + '^+} f(x) =');
    flcKatex('flcValRightLimit', fmtLatex(res.rightLimit));
    flcKatex('flcLblLimit', '\\displaystyle\\lim_{x \\to ' + aStr + '} f(x) =');
    flcKatex('flcValLimit', res.isLimitExist ? res.limitVal.toFixed(4) : '\\text{존재하지 않음}');

    var statusLimit = document.getElementById('flcStatusLimit');
    var explainLimit = document.getElementById('flcExplainLimit');
    if (statusLimit && explainLimit) {
      if (res.isLimitExist) {
        statusLimit.className = 'flc-badge-status flc-status-pass';
        statusLimit.textContent = '극한값 존재';
        explainLimit.innerHTML = '좌극한(' + fmtLatex(res.leftLimit) + ')과 우극한(' + fmtLatex(res.rightLimit) + ')이 서로 같으므로 <strong>극한값 = ' + res.limitVal.toFixed(4) + '</strong>으로 수렴합니다.';
      } else {
        statusLimit.className = 'flc-badge-status flc-status-fail';
        statusLimit.textContent = '극한값 없음';
        explainLimit.innerHTML = '좌극한(' + fmtLatex(res.leftLimit) + ')과 우극한(' + fmtLatex(res.rightLimit) + ')이 서로 다르거나 발산하여 극한값이 존재하지 않습니다.';
      }
    }

    // 2단계: 연속
    flcKatex('flcTitleCont', '\\text{2단계 : } x = ' + aStr + ' \\;\\text{에서 연속 여부}');
    flcKatex('flcLblFa', 'f(' + aStr + ') =');
    flcKatex('flcValFa', res.isFaDefined ? res.fa.toFixed(4) : '\\text{정의 안 됨}');
    flcKatex('flcLblLimFa', '\\displaystyle\\lim_{x \\to ' + aStr + '} f(x) =');
    flcKatex('flcValLimFa', res.isLimitExist ? res.limitVal.toFixed(4) : '\\text{존재 안 함}');

    var statusCont = document.getElementById('flcStatusCont');
    var explainCont = document.getElementById('flcExplainCont');
    if (statusCont && explainCont) {
      if (res.isContinuous) {
        statusCont.className = 'flc-badge-status flc-status-pass';
        statusCont.textContent = '연속 (Continuous)';
        explainCont.innerHTML = '함숫값 f(' + aStr + ') = ' + res.fa.toFixed(4) + '과 극한값이 일치하므로 <strong>연속</strong>입니다.';
      } else {
        statusCont.className = 'flc-badge-status flc-status-fail';
        statusCont.textContent = '불연속 (Discontinuous)';
        if (!res.isFaDefined) explainCont.innerHTML = 'x = ' + aStr + '에서 함숫값이 정의되지 않아 <strong>불연속</strong>입니다.';
        else if (!res.isLimitExist) explainCont.innerHTML = 'x = ' + aStr + '에서 극한값이 존재하지 않아 <strong>불연속</strong>입니다.';
        else explainCont.innerHTML = '함숫값(' + res.fa.toFixed(4) + ')과 극한값(' + res.limitVal.toFixed(4) + ')이 달라 <strong>불연속</strong>입니다.';
      }
    }

    // 3단계: 미분가능성
    flcKatex('flcTitleDiff', '\\text{3단계 : } x = ' + aStr + ' \\;\\text{에서 미분가능 여부}');
    flcKatex('flcLblLeftDiff', 'f\'_-(' + aStr + ') =');
    flcKatex('flcValLeftDiff', isFinite(res.leftDiff) ? res.leftDiff.toFixed(4) : '\\text{불가}');
    flcKatex('flcLblRightDiff', 'f\'_+(' + aStr + ') =');
    flcKatex('flcValRightDiff', isFinite(res.rightDiff) ? res.rightDiff.toFixed(4) : '\\text{불가}');
    flcKatex('flcLblDiff', 'f\'(' + aStr + ') =');
    flcKatex('flcValDiff', res.isDiff ? res.diffVal.toFixed(4) : '\\text{미분계수 없음}');

    var statusDiff = document.getElementById('flcStatusDiff');
    var explainDiff = document.getElementById('flcExplainDiff');
    if (statusDiff && explainDiff) {
      if (res.isDiff) {
        statusDiff.className = 'flc-badge-status flc-status-pass';
        statusDiff.textContent = '미분가능 (Differentiable)';
        explainDiff.innerHTML = '함수가 연속이고 좌미분계수 = 우미분계수 = ' + res.diffVal.toFixed(4) + '이므로 매끄럽게 연결되어 <strong>미분가능</strong>합니다.';
      } else {
        statusDiff.className = 'flc-badge-status flc-status-fail';
        statusDiff.textContent = '미분불가능';
        if (!res.isContinuous) explainDiff.innerHTML = 'x = ' + aStr + '에서 <strong>불연속이므로 미분 불가능</strong>합니다.';
        else explainDiff.innerHTML = '연속이지만 좌미분계수(' + res.leftDiff.toFixed(4) + ')와 우미분계수(' + res.rightDiff.toFixed(4) + ')가 달라 <strong>첨점(뾰족점)</strong>을 이루어 미분 불가능합니다.';
      }
    }
  }

  function initPresetsAndGuideKaTeX() {
    document.querySelectorAll('.flc-preset-item').forEach(function(btn) {
      var latex = btn.getAttribute('data-latex');
      var holder = btn.querySelector('.flc-preset-katex');
      if (holder && latex) flcKatex(holder, latex);
    });
    document.querySelectorAll('.flc-guide-math').forEach(function(el) {
      var latex = el.getAttribute('data-latex');
      if (latex) flcKatex(el, latex);
    });

  function applyExpr(expr) {
    state.rawExpr = expr;
    state.evalFn = SafeMathParser.sanitize(expr);
    var input = document.getElementById('flcFuncInput');
    if (input) input.value = expr;
    drawCanvas();
    updateDashboard();
  }

  function showSlide(idx) {
    state.currentSlide = Math.max(0, Math.min(4, idx));
    document.querySelectorAll('.flc-guide-slide').forEach(function(slide, i) {

    document.querySelectorAll('.flc-dot').forEach(function(dot, i) {

    });
    var btnPrev = document.getElementById('flcBtnPrevSlide');
    var btnNext = document.getElementById('flcBtnNextSlide');

    if (btnNext) btnNext.textContent = (state.currentSlide === 4) ? '완료 ✕' : '다음 ▶';
    initPresetsAndGuideKaTeX();
  }

  /* --------------------------------------------------------------------------
     5. Gen-3 표준 모듈 객체 정의
     -------------------------------------------------------------------------- */
  var FuncLimitContinuityModule = {

    bindEvents: function() {
      var self = this;
      var funcInput = document.getElementById('flcFuncInput');

      document.getElementById('flcBtnHome').addEventListener('click', function() { self.goHome(); });

      // 모달 가이드 열기/닫기
      document.getElementById('flcBtnOpenGuide').addEventListener('click', function() {
        document.getElementById('flcGuideModal').classList.add('open');
        showSlide(0);
      });
      document.getElementById('flcBtnCloseGuide').addEventListener('click', function() {
        document.getElementById('flcGuideModal').classList.remove('open');
      });
      document.getElementById('flcGuideModal').addEventListener('click', function(e) {
        if (e.target.id === 'flcGuideModal') document.getElementById('flcGuideModal').classList.remove('open');
      });
      document.getElementById('flcBtnPrevSlide').addEventListener('click', function() { showSlide(state.currentSlide - 1); });
      document.getElementById('flcBtnNextSlide').addEventListener('click', function() {
        if (state.currentSlide === 4) document.getElementById('flcGuideModal').classList.remove('open');
        else showSlide(state.currentSlide + 1);
      });
      document.querySelectorAll('.flc-dot').forEach(function(dot) {
        dot.addEventListener('click', function() { showSlide(parseInt(dot.getAttribute('data-idx'))); });
      });
      document.querySelectorAll('.flc-btn-paste').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var code = btn.getAttribute('data-copy');
          applyExpr(code);
          document.getElementById('flcGuideModal').classList.remove('open');
          showToast('수식이 입력창에 적용되었습니다.');
        });
      });

      // 수식 입력창
      funcInput.addEventListener('change', function(e) { applyExpr(e.target.value); });
      funcInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') applyExpr(e.target.value); });

      // 빠른 템플릿
      document.getElementById('flcTplFraction').addEventListener('click', function() { applyExpr('(x^2 - 1) / (x - 1)'); });
      document.getElementById('flcTplPiecewise2').addEventListener('click', function() { applyExpr('x >= 3 ? 2*x - 3 : -2*x'); });
      document.getElementById('flcTplHole').addEventListener('click', function() { applyExpr('x != 1 ? x + 1 : 4'); });

      // 프리셋 탭
      document.querySelectorAll('.flc-tab-btn').forEach(function(tab) {
        tab.addEventListener('click', function() {
          document.querySelectorAll('.flc-tab-btn').forEach(function(t) { t.classList.remove('active'); });
          tab.classList.add('active');
          var cat = tab.getAttribute('data-cat');
          document.querySelectorAll('.flc-preset-item').forEach(function(btn) {
            btn.style.display = (cat === 'all' || btn.getAttribute('data-cat') === cat) ? 'flex' : 'none';
          });
        });
      });

      // 프리셋 아이템 클릭
      document.querySelectorAll('.flc-preset-item').forEach(function(btn) {
        btn.addEventListener('click', function() {
          document.querySelectorAll('.flc-preset-item').forEach(function(b) { b.classList.remove('active'); });
          btn.classList.add('active');
          var expr = btn.getAttribute('data-expr');
          var aVal = parseFloat(btn.getAttribute('data-a') || '1');
          state.a = aVal;
          var slider = document.getElementById('flcSliderA');
          if (slider) slider.value = aVal;
          applyExpr(expr);
        });
      });

      // 조사점 슬라이더
      var sliderA = document.getElementById('flcSliderA');
      sliderA.addEventListener('input', function(e) {
        state.a = parseFloat(e.target.value);
        drawCanvas();
        updateDashboard();
      });
      document.getElementById('flcBtnStepPrev').addEventListener('click', function() {
        state.a = Math.max(-4, parseFloat((state.a - 0.1).toFixed(2)));
        sliderA.value = state.a;
        drawCanvas();
        updateDashboard();
      });
      document.getElementById('flcBtnStepNext').addEventListener('click', function() {
        state.a = Math.min(4, parseFloat((state.a + 0.1).toFixed(2)));
        sliderA.value = state.a;
        drawCanvas();
        updateDashboard();
      });

      // 가상 키보드
      var kbBox = document.getElementById('flcVirtualKb');
      document.getElementById('flcBtnToggleKb').addEventListener('click', function() {
        var isHidden = kbBox.style.display === 'none';
        kbBox.style.display = isHidden ? 'flex' : 'none';
        document.getElementById('flcKbText').textContent = isHidden ? '키보드 닫기' : '키보드 열기';
      });
      document.querySelectorAll('.flc-kb-btn[data-insert]').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var t = btn.getAttribute('data-insert');
          var start = funcInput.selectionStart || funcInput.value.length;
          var end = funcInput.selectionEnd || funcInput.value.length;
          funcInput.value = funcInput.value.substring(0, start) + t + funcInput.value.substring(end);
          funcInput.focus();
          funcInput.setSelectionRange(start + t.length, start + t.length);
        });
      });
      document.getElementById('flcKbBsp').addEventListener('click', function() {
        var start = funcInput.selectionStart, end = funcInput.selectionEnd;
        if (start === end && start > 0) {
          funcInput.value = funcInput.value.substring(0, start - 1) + funcInput.value.substring(end);
          funcInput.setSelectionRange(start - 1, start - 1);
        } else if (start !== end) {
          funcInput.value = funcInput.value.substring(0, start) + funcInput.value.substring(end);
          funcInput.setSelectionRange(start, start);
        }
        funcInput.focus();
      });
      document.getElementById('flcKbClr').addEventListener('click', function() { funcInput.value = ''; funcInput.focus(); });
      document.getElementById('flcKbApply').addEventListener('click', function() { applyExpr(funcInput.value); });

      // 캔버스 툴바
      document.getElementById('flcBtnZoomIn').addEventListener('click', function() { state.view.scale = Math.min(120, state.view.scale * 1.25); drawCanvas(); });
      document.getElementById('flcBtnZoomOut').addEventListener('click', function() { state.view.scale = Math.max(15, state.view.scale / 1.25); drawCanvas(); });
      document.getElementById('flcBtnResetView').addEventListener('click', function() {
        state.view.scale = 48;
        var canvas = document.getElementById('flcGraphCanvas');
        state.view.originX = canvas.parentElement.clientWidth / 2;
        state.view.originY = canvas.parentElement.clientHeight / 2;
        drawCanvas();
      });
      var btnTang = document.getElementById('flcBtnToggleTangent');
      btnTang.addEventListener('click', function() {
        state.showTangent = !state.showTangent;
        btnTang.classList.toggle('active', state.showTangent);
        drawCanvas();
      });
      var btnAnim = document.getElementById('flcBtnToggleAnim');
      btnAnim.addEventListener('click', function() {
        state.showAnim = !state.showAnim;
        btnAnim.classList.toggle('active', state.showAnim);
        drawCanvas();
      });

      // 캔버스 마우스/터치 드래그 & 휠
      var canvas = document.getElementById('flcGraphCanvas');
      var isDragA = false, isPan = false, lastX = 0, lastY = 0;
      canvas.addEventListener('pointerdown', function(e) {
        var rect = canvas.getBoundingClientRect();
        var mx = e.clientX - rect.left, my = e.clientY - rect.top;
        var sa = toScrX(state.a);
        if (Math.abs(mx - sa) < 18) {
          isDragA = true;
          canvas.setPointerCapture(e.pointerId);
        } else {
          isPan = true;
          lastX = mx; lastY = my;
          canvas.setPointerCapture(e.pointerId);
        }
      });
      canvas.addEventListener('pointermove', function(e) {
        var rect = canvas.getBoundingClientRect();
        var mx = e.clientX - rect.left, my = e.clientY - rect.top;
        if (isDragA) {
          state.a = parseFloat(Math.max(-4, Math.min(4, toWldX(mx))).toFixed(2));
          sliderA.value = state.a;
          drawCanvas();
          updateDashboard();
        } else if (isPan) {
          state.view.originX += (mx - lastX);
          state.view.originY += (my - lastY);
          lastX = mx; lastY = my;
          drawCanvas();
        }
      });
      canvas.addEventListener('pointerup', function() { isDragA = false; isPan = false; });
      canvas.addEventListener('wheel', function(e) {
        e.preventDefault();
        var z = e.deltaY < 0 ? 1.1 : 0.9;
        state.view.scale = Math.max(15, Math.min(150, state.view.scale * z));
        drawCanvas();
      }, { passive: false });

      window.addEventListener('resize', resizeCanvas);
    },

    goHome: function() {
      this.destroy();
      if (window.LegacyBridge && typeof window.LegacyBridge.backHome === 'function') {
        window.LegacyBridge.backHome();
        return;
      }
      if (window.MathLabGames && typeof window.MathLabGames.goHome === 'function') {
        window.MathLabGames.goHome();
        return;
      }
      var modalOverlay = document.getElementById('mathlab-global-modal-overlay');
      if (modalOverlay) {
        modalOverlay.classList.add('hidden');
        document.body.style.overflow = '';
      }
    },

    destroy: function() {
      if (state.animReqId) {
        cancelAnimationFrame(state.animReqId);
        state.animReqId = null;
      }
      window.removeEventListener('resize', resizeCanvas);
    }
  };

  /* --------------------------------------------------------------------------
     6. MathLabGames 3중 자율 등록 및 상호 실행 브리지
     -------------------------------------------------------------------------- */
  function registerFuncLimitContinuity() {
    if (typeof window.MathLabGames !== 'undefined' && typeof window.MathLabGames.register === 'function') {
      if (!window.MathLabGames.get('func-limit-continuity')) {
        try {
          var appObj = {
            id: 'func-limit-continuity',
            title: '함수의 극한·연속·미분 시각화',
            icon: '📈',
            sourceType: 'new',
            category: 'concept',
            curriculumSchool: '고등학교',
            curriculumSubject: '미적분Ⅰ',
            mount: function(container, context) { FuncLimitContinuityModule.mount(container, context); },
            destroy: function() { FuncLimitContinuityModule.destroy(); },
            goHome: function() { FuncLimitContinuityModule.goHome(); }
          };
          window.MathLabGames.register(appObj);
        } catch(e) {
          console.warn('func-limit-continuity 등록 방어:', e);
        }
      }
    }
  }

  registerFuncLimitContinuity();
  window.addEventListener('DOMContentLoaded', registerFuncLimitContinuity);
  setTimeout(registerFuncLimitContinuity, 100);
  setTimeout(registerFuncLimitContinuity, 500);

  window.FuncLimitContinuityModule = FuncLimitContinuityModule;

  window.initFuncLimitContinuityGame = function() {
    registerFuncLimitContinuity();
    if (window.LegacyBridge && typeof window.LegacyBridge.hideAllLegacySections === 'function') {
      window.LegacyBridge.hideAllLegacySections();
      window.LegacyBridge.showNewRoot();
    }
    if (typeof window.MathLabGames !== 'undefined' && typeof window.MathLabGames.mount === 'function') {
      try { window.MathLabGames.mount('func-limit-continuity'); return; } catch(e) {}
    }
    var targetEl = document.getElementById('mathlab-global-modal-content') || document.getElementById('mathlab-view') || document.getElementById('new-root');
    FuncLimitContinuityModule.mount(targetEl);
  };

  window.launchFuncLimitContinuityGame = function() {
    window.initFuncLimitContinuityGame();
  };

})();
</script>
