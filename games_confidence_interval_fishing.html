<style>
.game-confidence-interval-fishing,.game-confidence-interval-fishing *{box-sizing:border-box}
.game-confidence-interval-fishing{max-width:1000px;margin:0 auto;padding:16px;font-family:Pretendard,'Noto Sans KR',sans-serif;background:#f8fafc;color:#0f172a;border-radius:16px}
.cif-h{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.cif-t{font-size:1.35rem;font-weight:900;margin:0}
.cif-btn{border:1px solid #cbd5e1;background:#fff;border-radius:10px;padding:8px 12px;font-weight:700;cursor:pointer}
.cif-btn.p{background:#0284c7;border-color:#0284c7;color:#fff}
.cif-btn.g{background:#059669;border-color:#059669;color:#fff}
.cif-chip{background:#fff;border:1px solid #e2e8f0;border-radius:999px;padding:5px 12px;font-size:.88rem;font-weight:700}
.cif-chip b{color:#0284c7}
.cif-bar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.cif-diff{flex:1;min-width:90px;padding:8px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;font-weight:800;cursor:pointer}
.cif-diff.on{background:#e0f2fe;border-color:#0284c7;color:#0369a1}
.cif-box{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:14px;margin-bottom:10px}
.cif-box canvas{width:100%;display:block;border-radius:8px}
.cif-slider{width:100%;accent-color:#0284c7;touch-action:none;user-select:none}
.cif-msg{line-height:1.55;min-height:3em}
.cif-note{background:#ecfdf5;border:1px solid #bbf7d0;border-radius:10px;padding:10px;font-size:.9rem}
.cif-toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-12px);background:#0f172a;color:#fff;padding:10px 18px;border-radius:12px;font-weight:700;z-index:9500;opacity:0;pointer-events:none;transition:.25s}
.cif-toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.cif-toast.ok{background:#059669}.cif-toast.err{background:#dc2626}
.cif-modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;z-index:9000;padding:16px}
.cif-modal.on{display:flex}.cif-modal .box{background:#fff;border-radius:14px;max-width:480px;width:100%;padding:18px;max-height:80vh;overflow:auto}
</style>
<script>
(function(){
'use strict';
var APP_ID='confidence-interval-fishing',APP_TITLE='모평균 신뢰구간 낚시',BOARD='board-confidence-interval-fishing',TOTAL=5,CW=700,CH=280,CW2=700,CH2=180;
var ZMAP={90:1.645,95:1.96,99:2.576};
var state={mounted:false,host:null,diff:'normal',round:1,score:0,finished:false,mu:50,sigma:10,n:25,conf:95,sample:[],xbar:0,half:0,lo:0,hi:0,caught:false,hintUsed:false,covHits:0,covTotal:0,pending:[],animating:false,netY:-50};
function byId(id){return document.getElementById(id)}
function setText(id,v){var el=byId(id);if(el)el.textContent=String(v)}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
var toastT=null;function toast(m,t){var el=byId('cif-toast');if(!el)return;el.textContent=m;el.className='cif-toast on'+(t?' '+t:'');if(toastT)clearTimeout(toastT);toastT=setTimeout(function(){el.className='cif-toast'},2200)}
function randn(){var u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
function sampleN(mu,sig,n){var a=[],i;for(i=0;i<n;i++)a.push(mu+sig*randn());return a}
function mean(a){return a.reduce(function(s,x){return s+x},0)/a.length}
function startRound(){state.mu=40+Math.random()*20;state.sigma=state.diff==='easy'?8:(state.diff==='hard'?14:10);state.n=state.diff==='easy'?36:(state.diff==='hard'?16:25);state.conf=95;state.sample=[];state.caught=false;state.hintUsed=false;state.covHits=0;state.covTotal=0;state.xbar=0;state.half=0;state.lo=0;state.hi=0;renderUI();drawSea();drawCov()}
function castNet(){if(state.animating)return;var z=ZMAP[state.conf];state.sample=sampleN(state.mu,state.sigma,state.n);state.xbar=mean(state.sample);state.half=z*state.sigma/Math.sqrt(state.n);state.lo=state.xbar-state.half;state.hi=state.xbar+state.half;state.caught=state.lo<=state.mu&&state.mu<=state.hi;state.animating=true;state.netY=-50;var targetY=CH/2;var start=Date.now();function loop(){var now=Date.now();var p=(now-start)/400;if(p>=1){state.animating=false;drawSea();setText('cif-msg','x̄='+state.xbar.toFixed(2)+', CI=['+state.lo.toFixed(2)+', '+state.hi.toFixed(2)+'] 폭='+(2*state.half).toFixed(2)+(state.caught?' → 🐟 포획!':' → 빗나감'));toast(state.caught?'포획 성공':'실패',state.caught?'ok':'err');return}state.netY=-50+(targetY-(-50))*p;drawSea();requestAnimationFrame(loop)}loop()}
function scoreCast(){if(!state.sample.length){toast('먼저 그물을 던지세요','err');return}var sc=0;if(state.caught){sc+=50;var widthScore=Math.max(0,40-Math.floor(state.half*3));sc+=widthScore;if(state.n<=20)sc+=10}if(state.hintUsed)sc=Math.max(0,sc-15);state.score+=sc;setText('cif-score',state.score);toast('+' +sc+'점',sc?'ok':'err');var t=setTimeout(function(){if(state.round>=TOTAL)finish();else{state.round++;startRound()}},1100);state.pending.push(t)}
function runCoverage(){var z=ZMAP[state.conf],hits=0,N=100,i,xb,half,lo,hi;for(i=0;i<N;i++){xb=mean(sampleN(state.mu,state.sigma,state.n));half=z*state.sigma/Math.sqrt(state.n);lo=xb-half;hi=xb+half;if(lo<=state.mu&&state.mu<=hi)hits++}state.covHits=hits;state.covTotal=N;drawCov();setText('cif-cov','100회 중 '+hits+'회 포함 ('+hits+'%) — 이론 신뢰수준 약 '+state.conf+'%');toast('커버리지 실험 완료','ok');var guess=parseFloat((byId('cif-guess')||{}).value);if(!isNaN(guess)){var er=Math.abs(guess-hits);var b=er<=3?30:(er<=8?15:0);state.score+=b;setText('cif-score',state.score);if(b)toast('예측 보너스 +'+b,'ok')}}
function drawSea(){var cv=byId('cif-cv');if(!cv)return;var ctx=cv.getContext('2d');ctx.clearRect(0,0,CW,CH);ctx.fillStyle='#e0f2fe';ctx.fillRect(0,0,CW,CH);var pad=40,mn=state.mu-4*state.sigma,mx=state.mu+4*state.sigma;function X(v){return pad+(v-mn)/(mx-mn)*(CW-pad*2)}var y=CH/2;ctx.strokeStyle='#0284c7';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(pad,y);ctx.lineTo(CW-pad,y);ctx.stroke();ctx.fillStyle='#64748b';ctx.font='12px sans-serif';for(var k=-3;k<=3;k++){var v=state.mu+k*state.sigma;ctx.fillText(v.toFixed(0),X(v)-8,y+24);ctx.beginPath();ctx.moveTo(X(v),y-5);ctx.lineTo(X(v),y+5);ctx.stroke()}if(state.sample.length){var currentY=state.animating?state.netY:y;ctx.strokeStyle=state.animating?'#475569':(state.caught?'#059669':'#dc2626');ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(X(state.lo),currentY);ctx.lineTo(X(state.hi),currentY);ctx.stroke();ctx.fillStyle='#0f172a';ctx.beginPath();ctx.arc(X(state.xbar),currentY,6,0,Math.PI*2);ctx.fill();if(!state.animating)ctx.fillText('x̄',X(state.xbar)-4,y-12)}if(state.hintUsed||state.sample.length){ctx.fillStyle='#d97706';var fx=X(state.mu),fy=y-20;ctx.beginPath();ctx.ellipse(fx,fy,12,6,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.moveTo(fx-10,fy);ctx.lineTo(fx-18,fy-6);ctx.lineTo(fx-18,fy+6);ctx.closePath();ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(fx+6,fy-2,2,0,Math.PI*2);ctx.fill();ctx.fillStyle='#d97706';ctx.fillText('μ'+(state.hintUsed||state.caught||(!state.sample.length&&!state.animating)?'':'?'),fx-4,fy-14)}else{ctx.fillStyle='#94a3b8';ctx.fillText('μ 숨김 (물고기)',CW/2-40,40)}ctx.fillStyle='#0369a1';ctx.font='bold 13px sans-serif';ctx.fillText('바다 수직선 · 그물=신뢰구간',pad,22)}
function drawCov(){var cv=byId('cif-cv2');if(!cv)return;var ctx=cv.getContext('2d');ctx.clearRect(0,0,CW2,CH2);ctx.fillStyle='#fff';ctx.fillRect(0,0,CW2,CH2);if(!state.covTotal){ctx.fillStyle='#94a3b8';ctx.font='14px sans-serif';ctx.fillText('「100번 던져보기」로 커버리지를 확인하세요',40,CH2/2);return}var hits=state.covHits,miss=state.covTotal-hits,pad=30,bw=(CW2-pad*2)/2;ctx.fillStyle='#059669';ctx.fillRect(pad,CH2-pad-hits*1.2,bw-10,hits*1.2);ctx.fillStyle='#dc2626';ctx.fillRect(pad+bw,CH2-pad-miss*1.2,bw-10,miss*1.2);ctx.fillStyle='#0f172a';ctx.font='12px sans-serif';ctx.fillText('포함 '+hits,pad+20,CH2-10);ctx.fillText('빗나감 '+miss,pad+bw+20,CH2-10);ctx.fillText('95% 신뢰 ≠ "이번 구간이 95% 확률로 μ 포함"',pad,24)}
function renderUI(){setText('cif-round',state.round+'/'+TOTAL);setText('cif-score',state.score);setText('cif-n',state.n);setText('cif-conf',state.conf+'%');var ns=byId('cif-nslider');if(ns)ns.value=String(state.n);document.querySelectorAll('.cif-diff').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-d')===state.diff)});setText('cif-msg','표본 크기 n과 신뢰수준을 정한 뒤 그물을 던지세요. (교육용 가상 모평균)');setText('cif-cov','—')}
function finish(){state.finished=true;toast('종료 '+state.score+'점','ok');openRank(true)}
function openRank(reg){var m=byId('cif-modal');var list=[];try{list=JSON.parse(localStorage.getItem('mathlab_lb_cif')||'[]')}catch(e){}
var rows=list.slice(0,5).map(function(it,i){return '<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #e2e8f0"><span>'+(i+1)+' '+esc(it.nickname)+'</span><b style="color:#0284c7">'+it.score+'</b></div>'}).join('')||'<p style="color:#64748b">기록 없음</p>';
var regH=reg?'<p><b>최종 '+state.score+'점</b></p><input id="cif-nick" maxlength="12" placeholder="닉네임" style="width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px"><button class="cif-btn p" id="cif-save" style="width:100%;margin-top:8px">등록</button>':'';
m.innerHTML='<div class="box"><h3>🏆 명예의 전당</h3>'+regH+rows+'<button class="cif-btn" id="cif-close" style="width:100%;margin-top:10px">닫기</button></div>';m.className='cif-modal on';byId('cif-close').onclick=function(){m.className='cif-modal'};
var sb=byId('cif-save');if(sb)sb.onclick=function(){var nm=(byId('cif-nick').value||'익명').trim().slice(0,12);try{if(typeof submitRanking==='function')submitRanking(APP_TITLE,state.score,true,nm,BOARD)}catch(e){}try{list.push({nickname:nm,score:state.score});list.sort(function(a,b){return b.score-a.score});localStorage.setItem('mathlab_lb_cif',JSON.stringify(list.slice(0,20)))}catch(e){}toast('저장','ok');m.className='cif-modal';loadRank()}}
function loadRank(){var el=byId(BOARD);if(!el)return;if(typeof loadGameLeaderboard==='function'){try{loadGameLeaderboard(APP_TITLE,true,BOARD);return}catch(e){}}var list=[];try{list=JSON.parse(localStorage.getItem('mathlab_lb_cif')||'[]')}catch(e){}el.innerHTML=list.length?list.slice(0,5).map(function(it,i){return '<div style="display:flex;justify-content:space-between;padding:8px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;margin-bottom:6px"><span>'+(i+1)+' '+esc(it.nickname)+'</span><b style="color:#0284c7">'+it.score+'</b></div>'}).join(''):'<p style="text-align:center;color:#94a3b8">기록 없음</p>'}
function html(){return '<div class="game-confidence-interval-fishing" id="cif-root"><div class="cif-h"><h2 class="cif-t">🎣 모평균 신뢰구간 낚시</h2><div style="display:flex;gap:6px"><button type="button" class="cif-btn" id="cif-guide">📖 게임방법</button><button type="button" class="cif-btn" id="cif-home">🏠 홈</button></div></div>'+
'<div class="cif-bar"><button type="button" class="cif-diff" data-d="easy">쉬움</button><button type="button" class="cif-diff on" data-d="normal">보통</button><button type="button" class="cif-diff" data-d="hard">도전</button></div>'+
'<div class="cif-bar"><span class="cif-chip">라운드 <b id="cif-round">1/5</b></span><span class="cif-chip">점수 <b id="cif-score">0</b></span><span class="cif-chip">n=<b id="cif-n">25</b></span><span class="cif-chip">신뢰 <b id="cif-conf">95%</b></span></div>'+
'<div class="cif-box"><canvas id="cif-cv" width="'+CW+'" height="'+CH+'"></canvas><div class="cif-msg" id="cif-msg"></div>'+
'<div style="margin-top:8px">표본 크기 n <input type="range" class="cif-slider" id="cif-nslider" min="9" max="100" step="1" value="25"></div>'+
'<div class="cif-bar"><button type="button" class="cif-btn" data-c="90">90%</button><button type="button" class="cif-btn p" data-c="95">95%</button><button type="button" class="cif-btn" data-c="99">99%</button></div>'+
'<div class="cif-bar"><button type="button" class="cif-btn p" id="cif-cast">🎣 그물 던지기</button><button type="button" class="cif-btn g" id="cif-scorebtn">✅ 점수 반영</button><button type="button" class="cif-btn" id="cif-hint">💡 μ 힌트(-15)</button></div></div>'+
'<div class="cif-box"><div style="font-weight:800;margin-bottom:6px">100번 던져보기 (커버리지 확인) <span style="font-size:0.85rem;font-weight:normal;color:#64748b;margin-left:8px;">이 설정 그대로 그물을 100번 던지면 몇 번이나 물고기를 잡을지 실험합니다.</span></div><canvas id="cif-cv2" width="'+CW2+'" height="'+CH2+'"></canvas><div id="cif-cov" style="margin:8px 0">—</div>'+
'포함 횟수 예측: <input id="cif-guess" type="number" min="0" max="100" style="width:80px;padding:8px;border:1px solid #cbd5e1;border-radius:8px"> <button type="button" class="cif-btn p" id="cif-covrun">실험 실행</button></div>'+
'<div class="cif-note">95% 신뢰구간의 올바른 해석: 같은 방법으로 반복하면 약 95%의 구간이 μ를 포함합니다. "이번 한 구간이 95% 확률로 μ를 포함한다"가 아닙니다. 가상 교육용 데이터입니다.</div>'+
'<div class="cif-bar"><button type="button" class="cif-btn" id="cif-restart">🔄</button><button type="button" class="cif-btn p" id="cif-rank">🏆</button></div>'+
'<div class="cif-box"><div style="font-weight:900;margin-bottom:8px">🏆 명예의 전당</div><div id="'+BOARD+'"></div></div>'+
'<div class="cif-toast" id="cif-toast"></div><div class="cif-modal" id="cif-modal"></div></div>'}
function bind(){byId('cif-home').onclick=goHome;byId('cif-cast').onclick=castNet;byId('cif-scorebtn').onclick=scoreCast;byId('cif-covrun').onclick=runCoverage;byId('cif-rank').onclick=function(){openRank(state.finished)};byId('cif-restart').onclick=function(){state.finished=false;state.round=1;state.score=0;startRound()};
byId('cif-hint').onclick=function(){if(state.hintUsed)return;state.hintUsed=true;drawSea();toast('μ 위치 표시(-15 적용 예정)','err')};
byId('cif-nslider').oninput=function(){state.n=parseInt(this.value,10);setText('cif-n',state.n)};
document.querySelectorAll('[data-c]').forEach(function(b){b.onclick=function(){state.conf=parseInt(b.getAttribute('data-c'),10);setText('cif-conf',state.conf+'%');document.querySelectorAll('[data-c]').forEach(function(x){x.classList.toggle('p',x===b)})}});
document.querySelectorAll('.cif-diff').forEach(function(b){b.onclick=function(){state.diff=b.getAttribute('data-d');state.finished=false;state.round=1;state.score=0;startRound()}});
byId('cif-guide').onclick=function(){var m=byId('cif-modal');m.innerHTML='<div class="box"><h3 style="color:#0284c7; border-bottom:2px solid #e0f2fe; padding-bottom:8px;">📖 고등학교 확률과 통계: 신뢰구간 낚시</h3><div style="font-size:0.95rem; line-height:1.6; color:#334155; max-height: 50vh; overflow-y: auto;"><p><strong>1. 모평균(μ)이란?</strong><br>전체 집단(모집단)의 실제 평균입니다. 현실에서는 모두 조사하기 어려워 알 수 없기 때문에, 바다 속에 숨어있는 <b>황금 물고기(μ)</b>로 비유했습니다.</p><p><strong>2. 표본 추출과 신뢰구간 (그물)</strong><br>일부(표본)만 조사해서 표본평균(x̄)을 구하고, 이를 중심으로 일정한 폭을 가지는 <b>그물(신뢰구간)</b>을 던져 모평균(물고기)이 속해 있을지 추정합니다.</p><p><strong>3. 표본크기(n)의 역할</strong><br><b>- n이 커지면:</b> 그물의 폭(신뢰구간)이 좁아집니다! 더 정밀하게 위치를 예측하는 셈이지만, 자칫하면 물고기를 놓칠 위험이 커집니다.<br><b>- n이 작으면:</b> 그물이 넓어지지만, 그만큼 부정확한 추정이 됩니다.</p><p><strong>4. 신뢰도(95%, 99%)의 진짜 의미</strong><br>95% 신뢰도란 "내가 방금 던진 그물 안에 물고기가 있을 확률이 95%다"가 <b>아닙니다.</b><br>같은 방식으로 <b>100번 그물을 던질 때, 약 95번 정도는 물고기를 포획할 수 있다</b>는 통계적인 약속을 뜻합니다. (하단의 <b>100번 던져보기</b> 실험으로 직접 확인해보세요!)</p><p><strong>5. 점수 획득 전략</strong><br>그물을 좁게(큰 n, 95% 신뢰도) 설정해서 낚시에 성공하면 더 높은 점수를 획득합니다!</p></div><button class="cif-btn p" id="cif-close" style="width:100%; margin-top:16px;">확인</button></div>';m.className='cif-modal on';byId('cif-close').onclick=function(){m.className='cif-modal'}}}
function mount(c){var host=null;if(typeof c==='string'){try{host=document.querySelector(c)}catch(e){}}else if(c instanceof HTMLElement)host=c;if(!host)host=document.getElementById('mathlab-view')||document.getElementById('new-root');
if(!host||host===document.body){host=document.getElementById('confidence-interval-fishing-force-host');if(!host){host=document.createElement('div');host.id='confidence-interval-fishing-force-host';document.body.appendChild(host)}}host.style.display='';host.style.minHeight='60vh';state.host=host;state.mounted=true;host.innerHTML=html();bind();startRound();loadRank()}
function destroy(){state.pending.forEach(clearTimeout);state.pending=[];state.mounted=false;if(state.host)try{state.host.innerHTML=''}catch(e){}state.host=null}
function goHome(){destroy();var fh=document.getElementById('confidence-interval-fishing-force-host');if(fh){fh.style.display='none';fh.innerHTML=''}var mv=document.getElementById('mathlab-view');if(mv){mv.style.display='none';mv.innerHTML=''}var ag=document.querySelector('.app-grid'),ds=document.getElementById('dashboard-screen');if(ag)ag.style.display='';if(ds)ds.style.display='';if(typeof window.goHome==='function')try{window.goHome()}catch(e){}}
var API={mount:mount,resetGame:function(){state.finished=false;state.round=1;state.score=0;startRound()},destroy:destroy,goHome:goHome};
function reg(){if(typeof window.MathLabGames==='undefined'||!window.MathLabGames.register)return;try{if(window.MathLabGames.get&&window.MathLabGames.get(APP_ID))return;window.MathLabGames.register({id:APP_ID,title:APP_TITLE,icon:'🎣',sourceType:'new',mount:function(c,x){API.mount(c,x)},reset:function(){API.resetGame()},destroy:function(){API.destroy()},goHome:function(){API.goHome()}})}catch(e){console.warn(e)}}
reg();window.addEventListener('DOMContentLoaded',reg);setTimeout(reg,100);setTimeout(reg,500);
window.CIFishing=API;window.initCIFishingGame=function(){reg();if(window.MathLabGames&&window.MathLabGames.mount){try{window.MathLabGames.mount(APP_ID);return}catch(e){}}API.mount(document.getElementById('mathlab-view'))};window.launchCIFishingGame=window.initCIFishingGame;
})();
</script>
