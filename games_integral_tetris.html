<script>
(function () {
  'use strict';

  var APP_ID = 'integral-tetris';
  var APP_TITLE = '적분 면적 탐구';
  var CV_W = 700; var CV_H = 400;
  var CV2_W = 700; var CV2_H = 220;

  /* ---- 공식 모음 ---- */
  var CURVES = [
    { key: 'x2',     label: 'x\u00b2',       fn: function(x){return x*x;},           anti: function(x){return x*x*x/3;},      a:0, b:2,   name: 'y = x\u00b2' },
    { key: 'x3',     label: 'x\u00b3',       fn: function(x){return x*x*x;},         anti: function(x){return x*x*x*x/4;},    a:0, b:2,   name: 'y = x\u00b3' },
    { key: 'x2+1',   label: 'x\u00b2+1',     fn: function(x){return x*x+1;},         anti: function(x){return x*x*x/3+x;},   a:0, b:3,   name: 'y = x\u00b2+1' },
    { key: 'sqrt',   label: '\u221ax',        fn: function(x){return Math.sqrt(x);},  anti: function(x){return 2/3*Math.pow(x,1.5);}, a:0, b:4, name: 'y = \u221ax' },
    { key: 'sin',    label: 'sin x',          fn: function(x){return Math.sin(x);},   anti: function(x){return -Math.cos(x);}, a:0, b:Math.PI, name: 'y = sin x' },
    { key: '2x-x2',  label: '2x\u2212x\u00b2', fn: function(x){return 2*x-x*x;},   anti: function(x){return x*x-x*x*x/3;}, a:0, b:2,   name: 'y = 2x\u2212x\u00b2' }
  ];

  var state = {
    mounted: false,
    host: null,
    curveIdx: 0,
    method: 'mid',
    n: 4,
    exactArea: 0,
    approxArea: 0,
    errorPct: 0,
    pendingTimeouts: []
  };

  /* ---- 유틸 ---- */
  function byId(id){ return document.getElementById(id); }
  function setText(id,v){ var el=byId(id); if(el) el.textContent=String(v); }
  function fmtN(v,d){ return Number(v).toFixed(d===undefined?4:d); }
  var _toastTid=null;
  function showToast(msg,type){
    var el=byId('ait-toast'); if(!el) return;
    el.textContent=msg;
    el.className='ait-toast show'+(type?' '+type:'');
    if(_toastTid) clearTimeout(_toastTid);
    _toastTid=setTimeout(function(){ el.className='ait-toast'; },2400);
  }
  function closeModal(){
    var o=byId('ait-modal-overlay');
    if(o && o.parentNode) o.parentNode.removeChild(o);
  }
  function openModal(html){
    closeModal();
    if(!state.host) return;
    var root=state.host.querySelector('.app-integral-tetris');
    if(!root) return;
    var o=document.createElement('div');
    o.className='ait-modal-overlay'; o.id='ait-modal-overlay';
    o.innerHTML='<div class="ait-modal">'+html+'</div>';
    o.addEventListener('click',function(ev){ if(ev.target===o) closeModal(); });
    root.appendChild(o);
  }
  function clearPending(){
    state.pendingTimeouts.forEach(function(t){ clearTimeout(t); });
    state.pendingTimeouts=[];
  }

  /* ---- 리만 합 엔진 ---- */
  function curve(){ return CURVES[state.curveIdx]; }
  function exactIntegral(){
    var c=curve(); return c.anti(c.b)-c.anti(c.a);
  }
  function riemannSum(n,method){
    var c=curve(); var a=c.a,b=c.b;
    var h=(b-a)/n; var sum=0;
    for(var i=0;i<n;i++){
      var xi;
      if(method==='left') xi=a+i*h;
      else if(method==='right') xi=a+(i+1)*h;
      else xi=a+(i+0.5)*h;
      sum+=c.fn(xi)*h;
    }
    return sum;
  }
  function calcErr(approx,exact){
    if(Math.abs(exact)<1e-9) return 0;
    return Math.abs((approx-exact)/exact)*100;
  }
  function updateCalc(){
    var exact=exactIntegral();
    var approx=riemannSum(state.n,state.method);
    state.exactArea=exact;
    state.approxArea=approx;
    state.errorPct=calcErr(approx,exact);
    /* 수치 표시 */
    setText('ait-exact-val', fmtN(exact,5));
    setText('ait-approx-val', fmtN(approx,5));
    var err=state.errorPct;
    var errEl=byId('ait-err-val');
    if(errEl){ errEl.textContent=fmtN(err,3)+'%'; errEl.style.color=err<1?'#059669':err<5?'#d97706':'#dc2626'; }
    var bar=byId('ait-err-bar');
    if(bar){
      var pct=Math.min(100,err/30*100);
      bar.style.width=pct+'%';
      bar.style.background=err<1?'#059669':err<5?'#d97706':'#dc2626';
    }
    updateCompareTable();
    render();
    renderConverge();
  }
  function updateCompareTable(){
    var exact=exactIntegral();
    var tbody=byId('ait-compare-body'); if(!tbody) return;
    var ms=['left','mid','right'];
    var ns=['좌합 (Left)','중점합 (Mid)','우합 (Right)'];
    tbody.innerHTML=ms.map(function(m,i){
      var v=riemannSum(state.n,m);
      var e=calcErr(v,exact);
      var hi=m===state.method?'style="background:#fef9c3;font-weight:900;"':'';
      var ec=e<1?'color:#059669':e<5?'color:#d97706':'color:#dc2626';
      return '<tr '+hi+'><td>'+ns[i]+'</td><td>'+fmtN(v,5)+'</td><td style="'+ec+'">'+fmtN(e,3)+'%</td></tr>';
    }).join('');
  }

  /* ---- Canvas 마주 렌더링 ---- */
  var PAD_L=52,PAD_R=18,PAD_T=20,PAD_B=36;
  function xs(x,xl,xr){ return PAD_L+(x-xl)/(xr-xl)*(CV_W-PAD_L-PAD_R); }
  function ys(y,yl,yr){ return CV_H-PAD_B-(y-yl)/(yr-yl)*(CV_H-PAD_T-PAD_B); }
  function render(){
    var cv=byId('ait-canvas'); if(!cv) return;
    var ctx=cv.getContext('2d'); if(!ctx) return;
    var c=curve();
    var a=c.a,b=c.b;
    var xl=a-(b-a)*0.1,xr=b+(b-a)*0.1;
    /* y 범위 */
    var ymn=0,ymx=0.1;
    for(var xi2=a;xi2<=b;xi2+=(b-a)/80){
      var fy=c.fn(xi2); ymn=Math.min(ymn,fy); ymx=Math.max(ymx,fy);
    }
    var pad=(ymx-ymn)*0.18;
    var yl=ymn-pad, yr=ymx+pad;
    ctx.clearRect(0,0,CV_W,CV_H);
    /* 격자 */
    ctx.strokeStyle='#eef2f7'; ctx.lineWidth=1;
    var step=(xr-xl)/7;
    for(var gx=Math.ceil(xl/step)*step;gx<=xr;gx+=step){
      ctx.beginPath(); ctx.moveTo(xs(gx,xl,xr),PAD_T); ctx.lineTo(xs(gx,xl,xr),CV_H-PAD_B); ctx.stroke();
    }
    /* 축 */
    ctx.strokeStyle='#94a3b8'; ctx.lineWidth=1.3;
    ctx.beginPath(); ctx.moveTo(xs(xl,xl,xr),ys(0,yl,yr)); ctx.lineTo(xs(xr,xl,xr),ys(0,yl,yr)); ctx.stroke();
    if(xl<0&&0<xr){ ctx.beginPath(); ctx.moveTo(xs(0,xl,xr),PAD_T); ctx.lineTo(xs(0,xl,xr),CV_H-PAD_B); ctx.stroke(); }
    /* 기둥 */
    var n=state.n; var h=(b-a)/n;
    for(var i=0;i<n;i++){
      var xi; if(state.method==='left') xi=a+i*h;
      else if(state.method==='right') xi=a+(i+1)*h;
      else xi=a+(i+0.5)*h;
      var rh=c.fn(xi);
      var rx=xs(a+i*h,xl,xr);
      var rw=xs(a+(i+1)*h,xl,xr)-rx;
      var ry0=ys(0,yl,yr),ryH=ys(rh,yl,yr);
      ctx.fillStyle='rgba(2,132,199,0.20)'; ctx.strokeStyle='#0284c7'; ctx.lineWidth=1.2;
      ctx.beginPath(); ctx.rect(rx,Math.min(ry0,ryH),rw,Math.abs(ryH-ry0));
      ctx.fill(); ctx.stroke();
    }
    /* 실제 면적 음영 */
    var approx=state.approxArea,exact=state.exactArea;
    ctx.fillStyle=approx>exact?'rgba(220,38,38,0.08)':'rgba(5,150,105,0.08)';
    ctx.beginPath(); ctx.moveTo(xs(a,xl,xr),ys(0,yl,yr));
    for(var xf=a;xf<=b;xf+=(b-a)/120) ctx.lineTo(xs(xf,xl,xr),ys(c.fn(xf),yl,yr));
    ctx.lineTo(xs(b,xl,xr),ys(0,yl,yr)); ctx.closePath(); ctx.fill();
    /* 공선 */
    ctx.strokeStyle='#0ea5e9'; ctx.lineWidth=2.5;
    ctx.beginPath();
    var first=true;
    for(var xc=xl;xc<=xr;xc+=(xr-xl)/250){
      var yc=c.fn(xc);
      if(first){ ctx.moveTo(xs(xc,xl,xr),ys(yc,yl,yr)); first=false; }
      else ctx.lineTo(xs(xc,xl,xr),ys(yc,yl,yr));
    }
    ctx.stroke();
    /* 구간 표시 */
    ctx.strokeStyle='#d97706'; ctx.lineWidth=2; ctx.setLineDash([6,4]);
    ctx.beginPath(); ctx.moveTo(xs(a,xl,xr),PAD_T); ctx.lineTo(xs(a,xl,xr),CV_H-PAD_B); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(xs(b,xl,xr),PAD_T); ctx.lineTo(xs(b,xl,xr),CV_H-PAD_B); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle='#b45309'; ctx.font='bold 12px sans-serif'; ctx.textAlign='center';
    ctx.fillText('a='+fmtN(a,2),xs(a,xl,xr),CV_H-PAD_B+18);
    ctx.fillText('b='+fmtN(b,2),xs(b,xl,xr),CV_H-PAD_B+18);
    /* 정보 텍스트 */
    ctx.fillStyle='#0f172a'; ctx.font='bold 12px sans-serif'; ctx.textAlign='left';
    ctx.fillText('정확한 면적: '+fmtN(exact,5),PAD_L,PAD_T+14);
    ctx.fillStyle='#0284c7';
    ctx.fillText('수치 근사: '+fmtN(approx,5),PAD_L,PAD_T+30);
  }

  /* ---- 수렴 그래프 Canvas ---- */
  function renderConverge(){
    var cv=byId('ait-cv2'); if(!cv) return;
    var ctx=cv.getContext('2d'); if(!ctx) return;
    ctx.clearRect(0,0,CV2_W,CV2_H);
    var exact=exactIntegral();
    var nVals=[1,2,4,6,8,12,16,24,32,48,64];
    var methods=['left','mid','right'];
    var colors=['#dc2626','#059669','#d97706'];
    var mLabels=['좌합','중점합','우합'];
    var errs=methods.map(function(m){
      return nVals.map(function(n){ return calcErr(riemannSum(n,m),exact); });
    });
    var maxErr=0;
    errs.forEach(function(arr){ arr.forEach(function(v){ maxErr=Math.max(maxErr,v); }); });
    if(maxErr<0.01) maxErr=1;
    var pl=48,pr=12,pt=18,pb=38;
    var W=CV2_W-pl-pr, H=CV2_H-pt-pb;
    /* y축 레이블 */
    ctx.strokeStyle='#e2e8f0'; ctx.lineWidth=1; ctx.fillStyle='#94a3b8'; ctx.font='11px sans-serif'; ctx.textAlign='right';
    [0,25,50,75,100].forEach(function(pct){
      var yv=pt+H*(1-pct/100);
      ctx.beginPath(); ctx.moveTo(pl,yv); ctx.lineTo(pl+W,yv); ctx.stroke();
      ctx.fillText(fmtN(maxErr*pct/100,1)+'%',pl-4,yv+4);
    });
    /* x축 레이블 */
    ctx.fillStyle='#94a3b8'; ctx.textAlign='center'; ctx.font='11px sans-serif';
    nVals.forEach(function(n,i){
      var xv=pl+i/(nVals.length-1)*W;
      ctx.fillText(String(n),xv,CV2_H-pb+16);
    });
    ctx.fillStyle='#475569'; ctx.font='bold 11px sans-serif'; ctx.textAlign='center';
    ctx.fillText('기둥 개수 n',pl+W/2,CV2_H-4);
    /* 그래프 */
    methods.forEach(function(m,mi){
      ctx.strokeStyle=colors[mi]; ctx.lineWidth=mi===1?2.5:1.8;
      ctx.beginPath();
      errs[mi].forEach(function(e,i){
        var xv=pl+i/(nVals.length-1)*W;
        var yv=pt+H*(1-Math.min(e,maxErr)/maxErr);
        if(i===0) ctx.moveTo(xv,yv); else ctx.lineTo(xv,yv);
      });
      ctx.stroke();
      /* 레이블 */
      var lastX=pl+W;
      var lastY=pt+H*(1-Math.min(errs[mi][errs[mi].length-1],maxErr)/maxErr);
      ctx.fillStyle=colors[mi]; ctx.font='bold 11px sans-serif'; ctx.textAlign='left';
      ctx.fillText(mLabels[mi],lastX+3,lastY+4);
    });
    /* 현재 n 수직선 */
    var curN=state.n;
    var ni=nVals.indexOf(curN);
    if(ni===-1){
      for(var k=0;k<nVals.length-1;k++){ if(nVals[k]<=curN&&curN<nVals[k+1]){ ni=k; break; } }
      if(ni===-1) ni=nVals.length-1;
    }
    var nxv=pl+ni/(nVals.length-1)*W;
    ctx.strokeStyle='#0284c7'; ctx.lineWidth=1.5; ctx.setLineDash([4,3]);
    ctx.beginPath(); ctx.moveTo(nxv,pt); ctx.lineTo(nxv,pt+H); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle='#0284c7'; ctx.font='bold 11px sans-serif'; ctx.textAlign='center';
    ctx.fillText('n='+curN,nxv,pt-4);
  }

  /* ---- HTML 빌드 ---- */
  function buildHTML(){
    var curveButtons=CURVES.map(function(c,i){
      return '<button type="button" class="ait-curve-btn"'+(i===0?' ait-active':'')+' data-ci="'+i+'" id="ait-cb-'+i+'">'+c.label+'</button>';
    }).join('');
    return '<div class="app-integral-tetris" id="ait-root">' +
      '<div class="ait-header">' +
      '<div><h2 class="ait-title">⛲ 적분 면적 탐구</h2><p class="ait-subtitle">리만 합으로 정적분 실험 · 교과개념 탐구 도구</p></div>' +
      '<div style="display:flex;gap:8px;"><button type="button" class="ait-btn" id="ait-guide-btn">\ud83d\udcd6 사용법</button><button type="button" class="ait-btn" id="ait-home-btn">\ud83c\udfe0 홈으로</button></div></div>' +
      '<div class="ait-concept-bar">' +
      '<div class="ait-concept-icon">\ud83d\udcda</div>' +
      '<div class="ait-concept-text">' +
      '<strong>리만 합(Riemann Sum)</strong>: 구간 [a,b]를 n등분해 직사각형으로 채워 나가는 과정. ' +
      '기둥 수 n → ∞ 일 때 <strong>정적분(Definite Integral)</strong>에 수렴하는 것이 <strong>구분구적법의 핵심</strong>입니다. ' +
      '하단 수렴 그래프에서 세 방식(좌합·중점합·우합)의 수렴 속도를 비교할 수 있습니다.' +
      '</div></div>' +
      '<div class="ait-main">' +
      '<div>' +
      '<div class="ait-canvas-wrap"><canvas id="ait-canvas" width="'+CV_W+'" height="'+CV_H+'"></canvas>' +
      '<p class="ait-legend">파랑 곡선: y=f(x) / 파란 기둥: 리만 합 근사 / 노랑 점선: 적분 구간 [a,b] / 음영: 근사 오차 영역</p></div>' +
      '<div class="ait-converge-wrap"><p class="ait-converge-title">\ud83d\udcc9 수렴 그래프: 기둥 수 n 증가 → 오차율 감소</p><canvas id="ait-cv2" width="'+CV2_W+'" height="'+CV2_H+'"></canvas></div>' +
      '</div>' +
      '<div class="ait-panel">' +
      '<div class="ait-box"><h4>\ud83d\udcca 탐구할 함수</h4><div class="ait-curve-grid" id="ait-curve-grid">'+curveButtons+'</div></div>' +
      '<div class="ait-box"><h4>\u2696\ufe0f 근사 방식</h4>' +
      '<div class="ait-method-row" id="ait-method-row">' +
      '<button type="button" class="ait-method-btn" data-method="left">좌합</button>' +
      '<button type="button" class="ait-method-btn active" data-method="mid">중점합</button>' +
      '<button type="button" class="ait-method-btn" data-method="right">우합</button>' +
      '</div>' +
      '<div class="ait-slider-row"><label for="ait-n-slider">기둥 n</label>' +
      '<input type="range" id="ait-n-slider" min="1" max="64" step="1" value="4">' +
      '<span class="ait-val" id="ait-n-val">4</span></div></div>' +
      '<div class="ait-box"><h4>\ud83d\udd22 현재 근사 결과</h4>' +
      '<div class="ait-result-grid">' +
      '<div class="ait-result-card ait-exact"><div class="ait-rc-label">정확한 면적 (\u222bf dx)</div><div class="ait-rc-val" id="ait-exact-val">-</div></div>' +
      '<div class="ait-result-card ait-approx"><div class="ait-rc-label">수치 근사 (n개 기둥)</div><div class="ait-rc-val" id="ait-approx-val">-</div></div>' +
      '</div>' +
      '<div class="ait-err-row"><span class="ait-err-label">오차율</span><span class="ait-err-val" id="ait-err-val">-</span></div>' +
      '<div class="ait-err-bar-wrap"><div class="ait-err-bar" id="ait-err-bar" style="width:50%;background:#d97706;"></div></div>' +
      '</div>' +
      '<div class="ait-box"><h4>\ud83d\udcca 방식별 오차율 비교</h4>' +
      '<table class="ait-compare-table"><thead><tr><th>방식</th><th>근사 면적</th><th>오차율</th></tr></thead><tbody id="ait-compare-body"></tbody></table></div>' +
      '</div></div>' +
      '<div class="ait-concept-note">' +
      '\ud83d\udccc <strong>수학 개념 정리</strong>: ' +
      '① 좌합은 증가함수에서 <em>과소평가</em>, 우합은 <em>과대평가</em>하는 경향이 있습니다. ' +
      '② 중점합은 대체로 가장 빠르게 수렴합니다 — 두 방향의 오차가 서로 상쇄되기 때문입니다. ' +
      '③ n이 충분히 클 때 리만 합의 정의로부터 <code>∫ᵃᵇ f(x) dx = lim_{n→∞} Σ f(x*ᴵ)Δx</code> 를 확인할 수 있습니다.' +
      '</div>' +
      '<div class="ait-toast" id="ait-toast"></div>' +
      '</div>';
  }

  /* ---- 이벤트 ---- */
  function refreshCurveGrid(){
    var grid=byId('ait-curve-grid'); if(!grid) return;
    Array.prototype.forEach.call(grid.querySelectorAll('.ait-curve-btn'),function(btn){
      var ci=parseInt(btn.getAttribute('data-ci'),10);
      if(ci===state.curveIdx) btn.classList.add('active'); else btn.classList.remove('active');
    });
    var c=curve();
    var formulaEl=byId('ait-formula-disp');
    if(formulaEl) formulaEl.textContent=c.name+' \u00b7 \uad6c간 ['+fmtN(c.a,2)+', '+fmtN(c.b,2)+']';
  }
  function refreshMethodBar(){
    var row=byId('ait-method-row'); if(!row) return;
    Array.prototype.forEach.call(row.querySelectorAll('.ait-method-btn'),function(btn){
      if(btn.getAttribute('data-method')===state.method) btn.classList.add('active');
      else btn.classList.remove('active');
    });
  }
  function bindEvents(){
    var guideBtn=byId('ait-guide-btn');
    if(guideBtn) guideBtn.addEventListener('click',showGuideModal);
    var homeBtn=byId('ait-home-btn');
    if(homeBtn) homeBtn.addEventListener('click',goHomeSafe);
    var grid=byId('ait-curve-grid');
    if(grid) grid.addEventListener('click',function(ev){
      var btn=ev.target&&ev.target.closest?ev.target.closest('.ait-curve-btn'):null;
      if(!btn) return;
      var ci=parseInt(btn.getAttribute('data-ci'),10);
      if(!isNaN(ci)&&ci!==state.curveIdx){
        state.curveIdx=ci; refreshCurveGrid(); updateCalc();
        showToast(CURVES[ci].name+' 선택','');
      }
    });
    var mr=byId('ait-method-row');
    if(mr) mr.addEventListener('click',function(ev){
      var btn=ev.target&&ev.target.closest?ev.target.closest('.ait-method-btn'):null;
      if(!btn) return;
      var m=btn.getAttribute('data-method');
      if(m&&m!==state.method){ state.method=m; refreshMethodBar(); updateCalc(); }
    });
    var slider=byId('ait-n-slider');
    if(slider){
      var _rafId=null;
      slider.addEventListener('input',function(){
        state.n=parseInt(slider.value,10); setText('ait-n-val',state.n);
        if(_rafId) cancelAnimationFrame(_rafId);
        _rafId=requestAnimationFrame(function(){ _rafId=null; updateCalc(); });
      });
    }
  }
  function showGuideModal(){
    openModal('<h3 style="margin:0 0 12px;">\ud83d\udcd6 사용법 - 적분 면적 탐구</h3>' +
      '<p><strong>상단 시각화</strong>에서 직사각형 기둥의 수를 늘리면 곡선 아래 면적에 점점 가까워집니다. <strong>하단 수렴 그래프</strong>에서 n이 커질수록 세 방식의 오차율이 어떻게 줄어드는지 비교해 보세요.</p>' +
      '<ul>' +
      '<li><strong>함수 선택</strong>: 아래 6가지 레이블로 비교</li>' +
      '<li><strong>근사 방식</strong>: 좌합(왼쪽 끝) / 중점합(중간점) / 우합(오른쪽 끝)</li>' +
      '<li><strong>기둥 n</strong>: 슬라이더로 1\u22c564 사이를 자유롭게 조절</li>' +
      '<li><strong>비교 테이블</strong>: 같은 n에서 세 방식의 오차율을 나란히 확인</li>' +
      '<li><strong>수렴 그래프</strong>: 세 방식이 n에 따라 얼마나 빨리 수렴하는지 시각화</li>' +
      '</ul>' +
      '<p style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;padding:10px 12px;">' +
      '\ud83d\udccc 중점합이 가장 빠른 이유: 각 구간에서 커질 때의 오차(+방향)와 작아질 때의 오차(-방향)가 서로 상쇄되는 <em>중점 규칙</em> 때문입니다.' +
      '<br>\ud83d\udccc 좌합/우합은 한 방향으로만 수렴하기 때문에 n이 클 때 관찰해보세요.' +
      '</p>' +
      '<button type="button" class="ait-btn ait-primary" id="ait-guide-close" style="width:100%;">이해했어요!</button>');
    var btn=byId('ait-guide-close'); if(btn) btn.addEventListener('click',closeModal);
  }

  /* ---- Gen-3 안전 마운트 ---- */
  function mount(container,context){
    var host=null;
    if(typeof container==='string'){ try{ host=document.querySelector(container); }catch(e){ host=null; } }
    else if(container instanceof HTMLElement) host=container;
    if(!host&&window.MathLabUtils&&typeof window.MathLabUtils.getMountContainer==='function'){
      try{ host=window.MathLabUtils.getMountContainer(container); }catch(e){ host=null; }
    }
    if(!host||!(host instanceof HTMLElement)) host=document.getElementById('mathlab-view')||document.getElementById('new-root')||document.getElementById('game-container');
    if(!host||!(host instanceof HTMLElement)||host===document.body){
      var ch=document.getElementById('integral-tetris-force-host');
      if(!ch){ ch=document.createElement('div'); ch.id='integral-tetris-force-host'; document.body.appendChild(ch); }
      host=ch;
    }
    var footerEl=document.querySelector('footer, #footer, .app-footer');
    if(footerEl&&host&&typeof host.compareDocumentPosition==='function'&&(host.compareDocumentPosition(footerEl)&Node.DOCUMENT_POSITION_PRECEDING)){
      try{ footerEl.parentNode.insertBefore(host,footerEl); }catch(e){}
    }
    host.style.display=''; host.style.visibility='visible'; host.style.opacity='1';
    var parent=host.parentElement;
    while(parent&&parent!==document.body&&parent!==document.documentElement){
      if(parent.style&&parent.style.display==='none') parent.style.display='block';
      if(parent.style&&parent.style.visibility==='hidden') parent.style.visibility='visible';
      parent=parent.parentElement;
    }
    document.querySelectorAll('header, .navbar, #app-header, .top-bar, #floating-home-btn, .floating-home').forEach(function(el){
      if(el&&el.style&&el.style.display==='none') el.style.display='';
    });
    state.host=host; state.mounted=true;
    host.innerHTML=buildHTML();
    bindEvents(); refreshCurveGrid(); refreshMethodBar(); updateCalc();
  }
  function destroy(){
    clearPending(); closeModal(); state.mounted=false;
    if(state.host){ try{ state.host.innerHTML=''; }catch(e){} }
    state.host=null;
  }
  function goHomeSafe(){
    clearPending(); closeModal(); destroy();
    try{  }catch(e){}
    var forced=document.getElementById('integral-tetris-force-host');
    if(forced){ forced.style.display='none'; forced.innerHTML=''; }
    if(typeof window.goHome==='function'){ try{ window.goHome(); }catch(e){} }
  }

  var IntegralTetris={ mount:mount, resetGame:function(){ if(state.mounted){ state.curveIdx=0; state.method='mid'; state.n=4; updateCalc(); } }, destroy:destroy, goHome:goHomeSafe };

  /* ---- 3중 등록 ---- */
  function registerIntegralTetris(){
    if(typeof window.MathLabGames!=='undefined'&&typeof window.MathLabGames.register==='function'){
      var exists=false;
      try{ exists=typeof window.MathLabGames.get==='function'&&!!window.MathLabGames.get(APP_ID); }catch(e){ exists=false; }
      if(!exists){
        try{
          window.MathLabGames.register({
            id:APP_ID, title:APP_TITLE, icon:'⛲',
            sourceType:'new', players:'1인', isMultiplayer:false,
            mount:function(c,ctx){ IntegralTetris.mount(c,ctx); },
            reset:function(){ IntegralTetris.resetGame(); },
            destroy:function(){ IntegralTetris.destroy(); },
            goHome:function(){ IntegralTetris.goHome(); }
          });
        }catch(e){ console.warn('integral-tetris 등록 방어:',e); }
      }
    }
  }
  registerIntegralTetris();
  window.addEventListener('DOMContentLoaded',registerIntegralTetris);
  setTimeout(registerIntegralTetris,100);
  setTimeout(registerIntegralTetris,500);

  window.IntegralTetris=IntegralTetris;
  window.initIntegralTetrisGame=function(){
    registerIntegralTetris();
    if(window.LegacyBridge&&typeof window.LegacyBridge.hideAllLegacySections==='function'){
      window.LegacyBridge.hideAllLegacySections();
      if(typeof window.LegacyBridge.showNewRoot==='function') window.LegacyBridge.showNewRoot();
    }
    if(typeof window.MathLabGames!=='undefined'&&typeof window.MathLabGames.mount==='function'){
      try{ window.MathLabGames.mount(APP_ID); return; }catch(e){}
    }
    var t=document.getElementById('mathlab-view')||document.getElementById('new-root');
    IntegralTetris.mount(t);
  };
  window.launchIntegralTetrisGame=function(){ window.initIntegralTetrisGame(); };
})();
</script>
