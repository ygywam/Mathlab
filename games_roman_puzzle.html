  /* LED 자물쇠 디스플레이 */

  /* 4지선다 보기 (로마 숫자 선택용) */
  .game-roman-puzzle .choice-grid {

  @media (max-width: 500px) { .game-roman-puzzle .choice-grid { grid-template-columns: 1fr; } }
  
  .game-roman-puzzle .btn-choice {
    background: #3b2512;
    border: 3px solid #d97706;

  .game-roman-puzzle .btn-secondary { background: #3f2e21; color: #fde68a; border: 1px solid #78350f; padding: 12px 20px; font-size: 1rem; border-radius: 12px; cursor: pointer; font-weight: 700; transition: all 0.15s; }

  .game-roman-puzzle .result-area { text-align: center; margin-top: 16px; padding: 18px; border-radius: 16px; display: none; font-weight: 800; font-size: 1.15rem; }
  .game-roman-puzzle .result-area.show { display: block; animation: fadeIn 0.4s; }
  .game-roman-puzzle .result-area.success { background: #064e3b; border: 2px solid #34d399; color: #a7f3d0; }
  .game-roman-puzzle .result-area.error { background: #7f1d1d; border: 2px solid #f87171; color: #fecaca; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

  /* 대응표 힌트 박스 */
  .game-roman-puzzle .hint-box { background: #271c14; border: 2px solid #d97706; padding: 18px; border-radius: 16px; margin-top: 16px; display: none; text-align: left; }
  .game-roman-puzzle .hint-box h4 { margin: 0 0 10px; color: #fbbf24; font-size: 1.1rem; font-weight: 900; border-bottom: 1px solid #78350f; padding-bottom: 8px; }
  .game-roman-puzzle .hint-table { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; font-size: 0.95rem; font-weight: 800; margin-bottom: 12px; }
  .game-roman-puzzle .hint-item { background: #3f2e21; padding: 6px 10px; border-radius: 8px; text-align: center; color: #fde68a; border: 1px solid #92400e; }
  .game-roman-puzzle .hint-item span { color: #fbbf24; font-family: serif; font-size: 1.1rem; }
  .game-roman-puzzle .hint-desc { margin: 0; color: #fcd34d; font-size: 0.9rem; line-height: 1.5; font-weight: 600; }
  
  .game-roman-puzzle .sidebar { width: 320px; display: flex; flex-direction: column; gap: 16px; flex-shrink: 0; }
  @media (max-width: 768px) { .game-roman-puzzle .sidebar { width: 100%; } }

  .game-roman-puzzle .diff-selector { display: flex; gap: 6px; background: #1a130d; p: 6px; border-radius: 14px; padding: 6px; border: 1px solid #5c2b0b; }
  .game-roman-puzzle .diff-btn { flex: 1; padding: 10px 8px; border: none; border-radius: 10px; font-weight: 800; font-size: 0.95rem; cursor: pointer; color: #a8a29e; background: transparent; transition: all 0.2s; }
  .game-roman-puzzle .diff-btn.active { background: #d97706; color: #ffffff; box-shadow: 0 2px 6px rgba(0,0,0,0.3); }

  .game-roman-puzzle .rank-item {
    display: flex; justify-content: space-between; align-items: center;
    background: #3f2e21; border: 1px solid #78350f;
    padding: 10px 14px; border-radius: 12px; margin-bottom: 8px;
    font-size: 0.95rem; color: #fde68a; font-weight: 700;
  }
  .game-roman-puzzle .rank-num { color: #fbbf24; font-weight: 900; margin-right: 8px; }
  .game-roman-puzzle .rank-score { color: #fcd34d; font-weight: 900; }
</style>
<script>
(function() {
  const ROMAN_MAP = [
    { val: 1000, sym: 'M' }, { val: 900, sym: 'CM' },
    { val: 500, sym: 'D' }, { val: 400, sym: 'CD' },
    { val: 100, sym: 'C' }, { val: 90, sym: 'XC' },
    { val: 50, sym: 'L' }, { val: 40, sym: 'XL' },
    { val: 10, sym: 'X' }, { val: 9, sym: 'IX' },
    { val: 5, sym: 'V' }, { val: 4, sym: 'IV' },
    { val: 1, sym: 'I' }
  ];

  function toRoman(num) {
    let res = '';
    let n = num;
    for (let item of ROMAN_MAP) {
      while (n >= item.val) {
        res += item.sym;
        n -= item.val;
      }
    }
    return res;
  }

  function fromRoman(str) {
    const map = { I: 1, V: 5, X: 10, L: 50, C: 100, D: 500, M: 1000 };
    let res = 0;
    for (let i = 0; i < str.length; i++) {
      const curr = map[str[i]] || 0;
      const next = map[str[i + 1]] || 0;
      if (curr < next) {
        res += (next - curr);
        i++;
      } else {
        res += curr;
      }
    }
    return res;
  }

  function isValidRoman(str) {
    if (!str || typeof str !== 'string') return false;
    const val = fromRoman(str);
    if (val <= 0 || val > 3999) return false;
    return toRoman(val) === str;
  }

  const RomanPuzzle = {
    id: 'roman-puzzle',
    container: null,
    state: {
      difficulty: 'easy', // 'easy', 'normal', 'hard'
      roundIdx: 0,
      maxRounds: 10,
      score: 0,
      combo: 0,
      lives: 3,
      missionType: 'to_arabic', // 'to_arabic', 'to_roman', 'equation', 'find_invalid'
      questionText: '',
      correctAnswer: '',
      choices: [], // For multiple choice
      userInput: '', // For keypad input
      timer: 60,
      isAnswered: false,
      isGameOver: false,
      hintUsed: false,
      startTime: 0
    },
    timers: [],
    timerId: null,

    mount(container, context) {
      let target = null;
      if (typeof container === 'string') target = document.querySelector(container);
      else if (container instanceof HTMLElement) target = container;
      if (!target) target = document.getElementById('mathlab-view') || document.getElementById('new-root') || document.getElementById('game-container');

      // 💡 [자가 복구 엔진] 컨테이너가 없거나 가려져 있다면, 100% 보이는 전용 도화지 생성!
      if (!target || target === document.body) {
        let host = document.getElementById('roman-puzzle-force-host');
        if (!host) {
          host = document.createElement('div'); host.id = 'roman-puzzle-force-host';
          host.style.cssText = 'width:100%; max-width:960px; margin:0 auto; padding:20px 10px; box-sizing:border-box; z-index:999; position:relative; background:#17120e; min-height:650px; display:block; border-radius:24px;';
          const header = document.querySelector('header, .navbar, #app-header, .top-bar');
          if (header && header.parentNode) header.parentNode.insertBefore(host, header.nextSibling);
          else document.body.appendChild(host);
        }
        target = host;
      }

      this.container = target;
      this.container.style.display = 'block'; this.container.style.visibility = 'visible'; this.container.style.opacity = '1'; this.container.style.minHeight = '650px';

      let parent = this.container.parentElement;
      while (parent && parent !== document.body && parent !== document.documentElement) {
        if (parent.style && parent.style.display === 'none') parent.style.display = 'block';
        if (parent.style && parent.style.visibility === 'hidden') parent.style.visibility = 'visible';
        parent = parent.parentElement;
      }

      this.restoreGlobalNavigation();
      this.resetGame();
    },

    restoreGlobalNavigation() {
      const navElements = document.querySelectorAll('header, .navbar, #app-header, .top-bar, #floating-home-btn, .floating-home, [id*="home"], [class*="floating"]');
      navElements.forEach(el => { if (el && el.style && el.style.display === 'none') el.style.display = ''; });
    },

    setDifficulty(diff) {
      if (this.state.difficulty === diff && !this.state.isGameOver && this.state.roundIdx === 0) return;
      this.state.difficulty = diff;
      this.resetGame();
    },

    resetGame() {
      if (window.MathLabCleanup && typeof window.MathLabCleanup.clearTimers === 'function') {
        window.MathLabCleanup.clearTimers(this.timers);
      }
      this.timers.forEach(clearTimeout);
      this.timers = [];
      if (this.timerId) { clearInterval(this.timerId); this.timerId = null; }
      
      this.state.roundIdx = 0;
      this.state.score = 0;
      this.state.combo = 0;
      this.state.lives = 3;
      this.state.isGameOver = false;
      
      this.setupRound();
    },
    
    setupRound() {
      if (this.state.roundIdx >= this.state.maxRounds || this.state.lives <= 0) {
        this.gameOver(this.state.lives > 0);
        return;
      }

      if (this.timerId) { clearInterval(this.timerId); this.timerId = null; }

      this.state.userInput = '';
      this.state.choices = [];
      this.state.hintUsed = false;
      this.state.isAnswered = false;
      this.state.startTime = Date.now();

      // 난이도별 문제 범위 및 유형 선택
      let maxVal = 50;
      let types = ['to_arabic', 'to_roman'];
      if (this.state.difficulty === 'normal') {
        maxVal = 500;
        types = ['to_arabic', 'to_roman', 'equation'];
      } else if (this.state.difficulty === 'hard') {
        maxVal = 3999;
        types = ['to_arabic', 'to_roman', 'equation', 'find_invalid'];
        
        // 타이머 시작
        this.state.timer = 45;
        this.timerId = setInterval(() => {
          if (this.state.isAnswered || this.state.isGameOver) return;
          this.state.timer--;
          this.updateTimerUI();
          if (this.state.timer <= 0) {
            clearInterval(this.timerId); this.timerId = null;
            this.handleTimeout();
          }
        }, 1000);
      }

      this.state.missionType = types[Math.floor(Math.random() * types.length)];

      if (this.state.missionType === 'to_arabic') {
        // 로마 -> 아라비아 변환
        const targetNum = Math.floor(Math.random() * (maxVal - 1)) + 1;
        this.state.correctAnswer = String(targetNum);
        this.state.questionText = `${toRoman(targetNum)} = ?`;
      } 
      else if (this.state.missionType === 'to_roman') {
        // 아라비아 -> 로마 변환 (4지선다)
        const targetNum = Math.floor(Math.random() * (maxVal - 1)) + 1;
        const correctRoman = toRoman(targetNum);
        this.state.correctAnswer = correctRoman;
        this.state.questionText = `${targetNum} = ?`;
        
        // 보기 생성 (오답 3개)
        const choiceSet = new Set([correctRoman]);
        while (choiceSet.size < 4) {
          const offset = Math.floor(Math.random() * 21) - 10;
          const fakeNum = targetNum + offset;
          if (fakeNum > 0 && fakeNum <= 3999 && fakeNum !== targetNum) {
            choiceSet.add(toRoman(fakeNum));
          } else {
            // 임의 로마 숫자
            choiceSet.add(toRoman(Math.floor(Math.random() * maxVal) + 1));
          }
        }
        this.state.choices = Array.from(choiceSet).sort(() => Math.random() - 0.5);
      } 
      else if (this.state.missionType === 'equation') {
        // 로마 숫자 수식
        const isPlus = Math.random() > 0.4;
        let a = Math.floor(Math.random() * Math.min(maxVal / 2, 500)) + 1;
        let b = Math.floor(Math.random() * Math.min(maxVal / 2, 500)) + 1;
        if (!isPlus && a < b) [a, b] = [b, a]; // 뺄셈 시 음수 방지
        if (!isPlus && a === b) a++; // 0 방지 (로마 숫자에 0 없음)
        
        const ansNum = isPlus ? (a + b) : (a - b);
        this.state.correctAnswer = String(ansNum);
        this.state.questionText = `${toRoman(a)} ${isPlus ? '+' : '-'} ${toRoman(b)} = ?`;
      } 
      else if (this.state.missionType === 'find_invalid') {
        // 틀린 표기 찾기
        const validNums = [
          Math.floor(Math.random() * 500) + 1,
          Math.floor(Math.random() * 500) + 10,
          Math.floor(Math.random() * 500) + 20
        ];
        const validRomans = validNums.map(n => toRoman(n));
        
        // 잘못된 표기 생성
        const invalidPool = ['IIII', 'VV', 'XXXX', 'LL', 'IC', 'IXX', 'DM', 'DD', 'CMM', 'VIV', 'LIL'];
        const invalidStr = invalidPool[Math.floor(Math.random() * invalidPool.length)];
        
        this.state.correctAnswer = invalidStr;
        this.state.questionText = '다음 중 잘못된(규칙에 어긋난) 로마 숫자를 고르세요!';
        
        const choiceSet = new Set([...validRomans, invalidStr]);
        this.state.choices = Array.from(choiceSet).sort(() => Math.random() - 0.5);
      }

      this.render();
    },

    updateTimerUI() {
      const el = this.container?.querySelector('.stat-badge.timer');
      const valEl = el?.querySelector('.timer-val');
      if (valEl) valEl.textContent = `${this.state.timer}초`;
    },

    handleTimeout() {
      this.state.isAnswered = true;
      this.state.combo = 0;
      this.state.lives--;
      this.state.score = Math.max(0, this.state.score - 5);

      const resArea = this.container?.querySelector('.result-area');
      if (resArea) {
        resArea.className = 'result-area show error';
        resArea.innerHTML = `⏰ <strong>시간 초과! 자물쇠가 굳어버렸습니다! (생명 -1)</strong><br>제한 시간 내에 암호를 입력해야 합니다.`;
      }
      this.updateStatsUI();

      const t = setTimeout(() => {
        if (this.state.lives <= 0) this.gameOver(false);
        else this.setupRound();
      }, 2000);
      this.timers.push(t);
    },

    appendDigit(d) {
      if (this.state.isAnswered || this.state.isGameOver) return;
      if (this.state.userInput.length >= 6) return;
      this.state.userInput += d;
      this.updateDisplayUI();
    },

    backspaceDigit() {
      if (this.state.isAnswered || this.state.isGameOver || !this.state.userInput) return;
      this.state.userInput = this.state.userInput.slice(0, -1);
      this.updateDisplayUI();
    },

    clearInput() {
      if (this.state.isAnswered || this.state.isGameOver) return;
      this.state.userInput = '';
      this.updateDisplayUI();
    },

    updateDisplayUI() {
      const disp = this.container?.querySelector('.lock-display');
      if (!disp) return;
      if (!this.state.userInput) {
        disp.className = 'lock-display empty';
        disp.textContent = '암호 입력...';
      } else {
        disp.className = 'lock-display';
        disp.textContent = this.state.userInput;
      }
    },

    checkAnswer(ans) {
      if (this.state.isAnswered || this.state.isGameOver) return;
      const submitted = (typeof ans === 'string' ? ans.trim() : this.state.userInput.trim());
      if (!submitted) return;

      this.state.isAnswered = true;
      if (this.timerId) { clearInterval(this.timerId); this.timerId = null; }

      const isCorrect = (submitted === this.state.correctAnswer);
      const resArea = this.container.querySelector('.result-area');
      
      if (isCorrect) {
        let pts = 10;
        const timeDiff = (Date.now() - this.state.startTime) / 1000;
        if (timeDiff <= 5) pts += 5; // 스피드 보너스
        if (this.state.hintUsed) pts = Math.max(3, pts - 5);
        
        this.state.combo++;
        if (this.state.combo >= 3) pts += 5;
        this.state.score += pts;

        if (resArea) {
          resArea.className = 'result-area show success';
          let explain = `정답 [ ${this.state.correctAnswer} ] 정확합니다!`;
          if (this.state.missionType === 'find_invalid') {
            explain = `정답! [ ${submitted} ]는 로마 숫자 표기 규칙(같은 숫자 3번 초과 금지 또는 잘못된 감산 표기)에 위배됩니다!`;
          } else if (this.state.missionType === 'to_arabic' || this.state.missionType === 'equation') {
            explain = `🎉 <strong>철컥! 자물쇠가 열렸습니다! (+${pts}점)</strong><br>입력하신 암호 [ ${submitted} ]이(가) 일치합니다!`;
          } else {
            explain = `🎉 <strong>철컥! 자물쇠가 열렸습니다! (+${pts}점)</strong><br>아라비아 숫자를 로마 숫자 [ ${submitted} ](으)로 완벽하게 변환했습니다!`;
          }
          resArea.innerHTML = explain;
        }

        const t = setTimeout(() => {
          this.state.roundIdx++;
          this.setupRound();
        }, 1600);
        this.timers.push(t);
      } else {
        this.state.combo = 0;
        this.state.lives--;
        this.state.score = Math.max(0, this.state.score - 5);
        
        if (resArea) {
          resArea.className = 'result-area show error';
          let errorMsg = `❌ <strong>삐버빅! 자물쇠 해제 실패! (생명 -1)</strong><br>올바른 정답은 <strong>[ ${this.state.correctAnswer} ]</strong> 입니다.`;
          if (this.state.missionType === 'find_invalid') {
            errorMsg = `❌ <strong>틀렸습니다! (생명 -1)</strong><br>선택하신 숫자는 표준 규칙에 맞는 유효한 표기입니다. 규칙에 위배된 표기는 <strong>[ ${this.state.correctAnswer} ]</strong> 입니다.`;
          }
          resArea.innerHTML = errorMsg;
        }

        const t = setTimeout(() => {
          if (this.state.lives <= 0) {
            this.gameOver(false);
          } else {
            this.state.isAnswered = false;
            this.render();
          }
        }, 2200);
        this.timers.push(t);
      }

      this.updateStatsUI();
    },

    gameOver(cleared) {
      if (cleared && !this.state.isGameOver) {
        this.state.score += 50; // 클리어 보너스
      }
      this.state.isGameOver = true;
      if (this.timerId) { clearInterval(this.timerId); this.timerId = null; }
      this.render();
      
      if (this.state.score > 0) {
        const t = setTimeout(() => {
          this.showInlineRankingModal('board-roman-puzzle', this.state.score, { cleared: cleared, difficulty: this.state.difficulty });
        }, 600);
        this.timers.push(t);
      }
    },

                <h3 style="margin-top:0; font-size:1.05rem; color:#fbbf24; margin-bottom:10px;">⚙️ 난이도 선택</h3>
                <div class="diff-selector">
                  <button class="diff-btn ${this.state.difficulty === 'easy' ? 'active' : ''}" data-diff="easy">쉬움 (1~50)</button>
                  <button class="diff-btn ${this.state.difficulty === 'normal' ? 'active' : ''}" data-diff="normal">보통 (1~500)</button>
                  <button class="diff-btn ${this.state.difficulty === 'hard' ? 'active' : ''}" data-diff="hard">도전 (~3999)</button>
                </div>
              </div>

              <div class="card" style="padding:16px;">
                <h3 style="margin-top:0; font-size:1.1rem; border-bottom:1px solid #78350f; padding-bottom:12px; color:#fbbf24; text-align:center;">🏆 명예의 전당 (Top 5)</h3>
                <div id="board-roman-puzzle">
                  <p style="color:#a8a29e; font-size:0.95rem; text-align:center; margin:16px 0;">로딩 중...</p>
                </div>
              </div>
              
              <div class="card" style="padding:16px;">
                <button class="btn-secondary" style="width:100%; margin-bottom:12px; padding:12px;" id="rp-btn-restart-side">🔄 처음부터 다시 시작</button>
                <button class="btn-secondary" style="width:100%; padding:12px; background:#d97706; color:#ffffff; border:none;" id="rp-btn-home">🏠 홈으로</button>
              </div>
            </div>
          </div>
        </div>
      `;
      
      this.container.innerHTML = html;
      this.bindEvents();
      this.updateDisplayUI();
      this.loadLeaderboard();
    },

    bindEvents() {
      const root = this.container?.querySelector('.game-roman-puzzle');
      if (!root) return;
      
      const btnHowToTop = root.querySelector('#rp-btn-howto-top');
      if (btnHowToTop) btnHowToTop.addEventListener('click', () => this.showHowToPlayModal());

      root.querySelectorAll('.diff-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const diff = btn.getAttribute('data-diff');
          this.setDifficulty(diff);
        });
      });

      root.querySelectorAll('.btn-num[data-num]').forEach(btn => {
        btn.addEventListener('click', () => {
          const d = btn.getAttribute('data-num');
          this.appendDigit(d);
        });
      });

      const btnClear = root.querySelector('#rp-btn-clear');
      if (btnClear) btnClear.addEventListener('click', () => this.clearInput());
      
      const btnBs = root.querySelector('#rp-btn-bs');
      if (btnBs) btnBs.addEventListener('click', () => this.backspaceDigit());

      const btnSubmit = root.querySelector('#rp-btn-submit');
      if (btnSubmit) btnSubmit.addEventListener('click', () => this.checkAnswer());

      root.querySelectorAll('.btn-choice').forEach(btn => {
        btn.addEventListener('click', () => {
          const choice = btn.getAttribute('data-choice');
          this.checkAnswer(choice);
        });
      });

      const btnHint = root.querySelector('#rp-btn-hint');
      if (btnHint) btnHint.addEventListener('click', () => {
        this.state.hintUsed = true;
        const hintEl = root.querySelector('.hint-box');
        if (hintEl) hintEl.style.display = 'block';
        btnHint.disabled = true;
      });
      
      const btnResetRound = root.querySelector('#rp-btn-reset-round');
      if (btnResetRound) btnResetRound.addEventListener('click', () => this.setupRound());

      const btnRestartBig = root.querySelector('#rp-btn-restart-big');
      if (btnRestartBig) btnRestartBig.addEventListener('click', () => this.resetGame());
      
      const btnRestartSide = root.querySelector('#rp-btn-restart-side');
      if (btnRestartSide) btnRestartSide.addEventListener('click', () => this.resetGame());

      // 키보드 숫자 입력 지원
      const keyHandler = (e) => {
        if (!this.container || !document.body.contains(this.container)) {
          window.removeEventListener('keydown', keyHandler);
          return;
        }
        if (this.state.isAnswered || this.state.isGameOver) return;
        if (this.state.missionType === 'to_roman' || this.state.missionType === 'find_invalid') return;

        if (e.key >= '0' && e.key <= '9') {
          this.appendDigit(e.key);
        } else if (e.key === 'Backspace') {
          this.backspaceDigit();
        } else if (e.key === 'Enter') {
          this.checkAnswer();
        } else if (e.key === 'Escape' || e.key === 'Delete') {
          this.clearInput();
        }
      };
      window.removeEventListener('keydown', this._keyHandler);
      this._keyHandler = keyHandler;
      window.addEventListener('keydown', this._keyHandler);

      const btnHome = root.querySelector('#rp-btn-home');
      if (btnHome) {
        btnHome.addEventListener('click', (e) => {
          e.preventDefault();
          const topBottomHome = document.getElementById('mathlab-floating-home') || document.querySelector('#legacy-back-home-btn') || document.querySelector('.floating-home');
          if (topBottomHome) topBottomHome.click();
          else if (typeof window.MathLabRenderHome === 'function') window.MathLabRenderHome();
          else if (typeof window.goHome === 'function') window.goHome();
          else location.reload();
        });
      }
    },
    
    loadLeaderboard() {
      try {
        if (typeof window.loadGameLeaderboard === 'function') {
          window.loadGameLeaderboard('로마 숫자 퍼즐', true, 'board-roman-puzzle');
        } else {
          const localRanks = JSON.parse(localStorage.getItem('rank_board-roman-puzzle') || '[]');
          this.renderRankList(localRanks.slice(0, 5));
        }
      } catch (e) {
        console.error('[RomanPuzzle] 명예의 전당 로드 오류:', e);
        const localRanks = JSON.parse(localStorage.getItem('rank_board-roman-puzzle') || '[]');
        this.renderRankList(localRanks.slice(0, 5));
      }
    },

    renderRankList(ranks) {
      const el = this.container?.querySelector('#board-roman-puzzle');
      if (!el) return;

      if (!ranks || ranks.length === 0) {
        el.innerHTML = '<div style="text-align:center; color:#a8a29e; padding: 12px 0;">아직 등록된 랭킹이 없습니다. 첫 주인공이 되어보세요!</div>';
        return;
      }

      const escapeHTML = (str) => {
        if (!str) return '';
        return String(str).replace(/[&<>"']/g, function(match) {
          const escape = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
          return escape[match];
        });
      };
      el.innerHTML = ranks.map((r, i) => `
        <div class="rank-item">
          <div><span class="rank-num">${i + 1}위</span> ${escapeHTML(r.nickname || '익명')}</div>
          <div class="rank-score">${r.score || 0}점</div>
        </div>
      `).join('');
    },

    destroy() {
      if (window.MathLabCleanup && typeof window.MathLabCleanup.clearTimers === 'function') {
        window.MathLabCleanup.clearTimers(this.timers);
      }
      this.timers.forEach(clearTimeout);
      this.timers = [];
      if (this.timerId) { clearInterval(this.timerId); this.timerId = null; }
      if (this._keyHandler) window.removeEventListener('keydown', this._keyHandler);
      document.getElementById('mathlab-inline-ranking-modal')?.remove();
      document.getElementById('mathlab-rp-howto-modal')?.remove();
      const host = document.getElementById('roman-puzzle-force-host'); if (host) host.remove();
      if (this.container) this.container.innerHTML = '';
      this.container = null;
    }
  };

  if (!window.MathLabGames) {
    window.MathLabGames = {
      registry: {},
      register(app) { this.registry[app.id] = app; },
      get(id) { return this.registry[id]; },
      mount(id, container, context) {
        if (this.registry[id]) this.registry[id].mount(container, context);
      }
    };
  }
  
  if (typeof window.MathLabGames.register === 'function') {
    if (!window.MathLabGames.get?.('roman-puzzle')) {
      window.MathLabGames.register(RomanPuzzle);
    }
  }

  window.launchRomanPuzzleGame = function() {
    if (typeof window.MathLabGames !== 'undefined' && typeof window.MathLabGames.mount === 'function') {
      try {
        window.MathLabGames.mount('roman-puzzle');
        return;
      } catch(e) {
        console.warn('MathLabGames mount 실패, 직접 마운트 시도:', e);
      }
    }
    const target = document.getElementById('mathlab-view') || document.getElementById('new-root') || document.body;
    RomanPuzzle.mount(target);
  };
})();
</script>
