      return;
    } catch(e){}
  }

}

  });

      {
        title: "Q2. 계수에 0이 포함된 다항식 나눗셈",
        q: "<span class=\"math-tex\" data-tex=\"P(x) = x^3 - 8\"></span> 을 <span class=\"math-tex\" data-tex=\"x - 2\"></span> 로 나눌 때 조립제법 1행의 계수 배열은?",
        sol: "<b>[주의점 해설]</b><br>• 빠진 차수(<span class=\"math-tex\" data-tex=\"x^2\"></span> 항과 <span class=\"math-tex\" data-tex=\"x\"></span> 항)의 계수 0을 반드시 채워야 합니다.<br>• 1행 계수: <b><span class=\"math-tex\" data-tex=\"[1, 0, 0, -8]\"></span></b>"
      },
      {
        title: "Q3. 일차식 계수가 1이 아닌 경우의 조립제법",
        q: "<span class=\"math-tex\" data-tex=\"P(x)\"></span>를 <span class=\"math-tex\" data-tex=\"2x - 1\"></span> 로 나누었을 때 조립제법에서 얻은 몫 <span class=\"math-tex\" data-tex=\"Q'(x)\"></span>과 실제 몫 <span class=\"math-tex\" data-tex=\"Q(x)\"></span>의 관계는?",
        sol: "<b>[수학적 증명]</b><br>• 조립제법은 <span class=\"math-tex\" data-tex=\"x - 1/2\"></span> 기준이므로 <span class=\"math-tex\" data-tex=\"P(x) = (x - 1/2)Q'(x) + R = (2x - 1) \\left( \\frac{1}{2}Q'(x) \\right) + R\"></span><br>• 실제 몫: <b><span class=\"math-tex\" data-tex=\"Q(x) = \\frac{1}{2} Q'(x)\"></span></b> (몫을 2로 나누어야 함)"
      },
      {
        title: "Q4. 나머지정리와 조립제법의 통합",
        q: "<span class=\"math-tex\" data-tex=\"x^3 + ax^2 - 4x + 4\"></span> 가 <span class=\"math-tex\" data-tex=\"x - 2\"></span> 로 나누어떨어질 때 상수 a의 값은?",
        sol: "<b>[수학적 풀이]</b><br>• 인수정리에 의해 <span class=\"math-tex\" data-tex=\"P(2) = 8 + 4a - 8 + 4 = 0 \\implies 4a + 4 = 0 \\implies a = -1\"></span>"
      }
    ];

    probs.forEach(function(item, idx) {
      h += '<div style="background:#ffffff; border:1px solid #e2e8f0; border-radius:14px; padding:16px; margin-bottom:14px;">';
      h += '  <div style="font-weight:900; font-size:1.05rem; color:#0284c7; margin-bottom:6px;">' + item.title + '</div>';
      h += '  <div style="line-height:1.6; color:#334155; margin-bottom:10px;">' + item.q + '</div>';
      h += '  <button type="button" class="btn p btn-show-sol" data-idx="' + idx + '">💡 수학적 해설 보기</button>';
      h += '  <div id="sol-' + idx + '" style="display:none; background:#f8fafc; border:1px solid #cbd5e1; border-radius:12px; padding:14px; margin-top:10px; font-size:0.92rem; line-height:1.65;">' + item.sol + '</div>';
      h += '</div>';
    });

    h += '  </div>';
    h += '  </div>';

    /* Slide Modal */
    h += '<div class="modal" id="sd-modal">';
    h += '  <div class="mbox" id="sd-modal-box"></div>';
    h += '</div>';

    h += '</div>';
    return h;
  },

  bindEvents: function() {
    var _this = this;
    var root = S.host.querySelector('#sd-app-root');

    /* Tabs */
    root.querySelectorAll('.tab-btn').forEach(function(btn) {
      btn.onclick = function() {
        root.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
        this.classList.add('active');
        S.activeTab = this.getAttribute('data-tab');

        root.querySelector('#tab-sec-sim').style.display = (S.activeTab === 'sim') ? 'block' : 'none';
        root.querySelector('#tab-sec-math').style.display = (S.activeTab === 'math') ? 'block' : 'none';
        root.querySelector('#tab-sec-prob').style.display = (S.activeTab === 'prob') ? 'block' : 'none';

        updateMathElements();
      };
    });

    /* Difficulty Buttons */
    root.querySelector('#btn-diff-easy').onclick = function() {
      S.diff = 'easy';
      this.className = 'btn p';
      root.querySelector('#btn-diff-norm').className = 'btn';
      root.querySelector('#btn-diff-hard').className = 'btn';
      _this.startRound();
    };
    root.querySelector('#btn-diff-norm').onclick = function() {
      S.diff = 'normal';
      this.className = 'btn p';
      root.querySelector('#btn-diff-easy').className = 'btn';
      root.querySelector('#btn-diff-hard').className = 'btn';
      _this.startRound();
    };
    root.querySelector('#btn-diff-hard').onclick = function() {
      S.diff = 'hard';
      this.className = 'btn p';
      root.querySelector('#btn-diff-easy').className = 'btn';
      root.querySelector('#btn-diff-norm').className = 'btn';
      _this.startRound();
    };

    /* Actions */
    root.querySelector('#btn-submit-cell').onclick = function() { _this.submitCellVal(); };
    root.querySelector('#btn-next-round').onclick = function() { _this.startRound(); };

    /* Keypad Binding */
    var keys = ['7','8','9','4','5','6','1','2','3','-','0','.'];
    var padBox = root.querySelector('#keypad-box');
    padBox.innerHTML = keys.map(function(k) {
      return '<button type="button" data-k="' + k + '">' + k + '</button>';
    }).join('');
    padBox.onclick = function(ev) {
      var b = ev.target.closest('button');
      if (!b) return;
      root.querySelector('#inp-cell-val').value += b.getAttribute('data-k');
    };

    root.querySelector('#btn-key-del').onclick = function() {
      var inp = root.querySelector('#inp-cell-val');
      inp.value = inp.value.slice(0, -1);
    };

    root.querySelector('#inp-cell-val').onkeydown = function(e) {
      if (e.key === 'Enter') _this.submitCellVal();
    };

    /* Quiz */
    root.querySelector('#btn-submit-quiz').onclick = function() {
      var val = (root.querySelector('#inp-quiz-ans').value || '').trim();
      var msgEl = root.querySelector('#lbl-quiz-msg');
      if (val === '9') {
        msgEl.innerHTML = '✅ <b>정답입니다!</b> P(2) = 2(8) - 4(2) + 1 = 16 - 8 + 1 = 9 로 나머지정리가 완벽히 적용됩니다.';
        msgEl.style.color = '#059669';
      } else {
        msgEl.innerHTML = '❌ 오답입니다. (힌트: P(2) = 2×8 - 4×2 + 1 = 9 입니다)';
        msgEl.style.color = '#ef4444';
      }
    };

    /* Solutions Toggle */
    root.querySelectorAll('.btn-show-sol').forEach(function(btn) {
      btn.onclick = function() {
        var idx = this.getAttribute('data-idx');
        var solEl = root.querySelector('#sol-' + idx);
        if (solEl) {
          var isShown = solEl.style.display === 'block';
          solEl.style.display = isShown ? 'none' : 'block';
          this.textContent = isShown ? '💡 수학적 해설 보기' : '🙈 해설 닫기';
          updateMathElements();
        }
      };
    });

    /* Modal Open & Render Slide */
    root.querySelector('#btn-open-guide').onclick = function() {
      S.guidePage = 0;
      _this.renderSlideGuide();
      root.querySelector('#sd-modal').classList.add('on');
    };
  },

  startRound: function() {
    S.alpha = (Math.random() < 0.5 ? 1 : -1) * Math.floor(Math.random() * 3 + 1);
    
    if (S.diff === 'easy') {
      S.row1 = [Math.floor(Math.random() * 3 + 1), Math.floor(Math.random() * 6 - 3), Math.floor(Math.random() * 8 - 4)];
    } else if (S.diff === 'hard') {
      S.row1 = [Math.floor(Math.random() * 2 + 1), Math.floor(Math.random() * 4 - 2), Math.floor(Math.random() * 6 - 3), Math.floor(Math.random() * 6 - 3), Math.floor(Math.random() * 8 - 4)];
    } else {
      S.row1 = [Math.floor(Math.random() * 2 + 1), Math.floor(Math.random() * 4 - 2), Math.floor(Math.random() * 6 - 3), Math.floor(Math.random() * 8 - 4)];
    }

    var n = S.row1.length;
    S.row2 = new Array(n).fill(null);
    S.row3 = new Array(n).fill(null);

    S.row2[0] = 0;
    S.row3[0] = S.row1[0];

    S.stepIndex = 1;
    S.isComplete = false;

    var root = S.host.querySelector('#sd-app-root');
    if (root) {
      root.querySelector('#inp-cell-val').value = '';
      root.querySelector('#lbl-step-guide').innerHTML = '▶ 첫 계수 <b>' + S.row1[0] + '</b> 이 내려왔습니다. 다음 2행 곱셈 값 (<b>' + S.alpha + ' × ' + S.row3[0] + '</b>)을 구하세요.';
    }

    this.renderSyntheticGrid();
    this.updatePolyExpression();
  },

  renderSyntheticGrid: function() {
    var root = S.host.querySelector('#sd-app-root');
    if (!root) return;
    var container = root.querySelector('#syn-grid-container');
    if (!container) return;

    var cols = S.row1.length;
    var h = '<table class="syn-table"><tbody>';

    /* Row 1: Alpha & Coefficients */
    h += '<tr>';
    h += '<td class="syn-cell syn-vbar" style="background:#f1f5f9; color:#0284c7;">' + S.alpha + '</td>';
    for (var j = 0; j < cols; j++) {
      h += '<td class="syn-cell">' + S.row1[j] + '</td>';
    }
    h += '</tr>';

    /* Row 2: Multiplied Values */
    h += '<tr class="syn-divider">';
    h += '<td class="syn-cell syn-vbar" style="background:#f1f5f9;">×</td>';
    for (var j2 = 0; j2 < cols; j2++) {
      var isTarget2 = (!S.isComplete && S.stepIndex === j2 * 2 - 1);
      var val2 = S.row2[j2] !== null ? S.row2[j2] : '';
      var cls2 = isTarget2 ? 'syn-cell target-cell' : 'syn-cell';
      h += '<td class="' + cls2 + '">' + val2 + '</td>';
    }
    h += '</tr>';

    /* Row 3: Sum / Result Values */
    h += '<tr>';
    h += '<td class="syn-cell syn-vbar" style="background:#f1f5f9;">+</td>';
    for (var j3 = 0; j3 < cols; j3++) {
      var isTarget3 = (!S.isComplete && S.stepIndex === j3 * 2);
      var val3 = S.row3[j3] !== null ? S.row3[j3] : '';
      var isRem = (j3 === cols - 1);
      var cls3 = isTarget3 ? 'syn-cell target-cell' : (isRem ? 'syn-cell rem-cell' : 'syn-cell');
      h += '<td class="' + cls3 + '">' + val3 + '</td>';
    }
    h += '</tr>';

    h += '</tbody></table>';
    container.innerHTML = h;
  },

  submitCellVal: function() {
    if (S.isComplete) return;

    var root = S.host.querySelector('#sd-app-root');
    var inp = root.querySelector('#inp-cell-val');
    var inputVal = parseFloat((inp.value || '').trim());
    if (isNaN(inputVal)) return;

    var cols = S.row1.length;
    var targetCol = Math.floor((S.stepIndex + 1) / 2);
    var isRow2Step = (S.stepIndex % 2 === 1);

    var expectedVal = 0;
    if (isRow2Step) {
      expectedVal = S.alpha * S.row3[targetCol - 1];
    } else {
      expectedVal = S.row1[targetCol] + S.row2[targetCol];
    }

    if (Math.abs(inputVal - expectedVal) < 0.01) {
      if (isRow2Step) {
        S.row2[targetCol] = expectedVal;
      } else {
        S.row3[targetCol] = expectedVal;
      }

      S.stepIndex++;
      inp.value = '';

      if (S.stepIndex >= cols * 2 - 1) {
        S.isComplete = true;
        root.querySelector('#lbl-step-guide').innerHTML = '🎉 <b>조립제법 나눗셈 완료!</b> 몫과 나머지가 정확히 산출되었습니다.';
      } else {
        var nextIsRow2 = (S.stepIndex % 2 === 1);
        var nextCol = Math.floor((S.stepIndex + 1) / 2);
        if (nextIsRow2) {
          root.querySelector('#lbl-step-guide').innerHTML = '✅ 정답! 다음 2행 곱셈 값 (<b>' + S.alpha + ' × ' + S.row3[nextCol - 1] + '</b>)을 입력하세요.';
        } else {
          root.querySelector('#lbl-step-guide').innerHTML = '✅ 정답! 다음 3행 덧셈 결과 (<b>' + S.row1[nextCol] + ' + ' + S.row2[nextCol] + '</b>)를 입력하세요.';
        }
      }

      this.renderSyntheticGrid();
      this.updatePolyExpression();
    } else {
      root.querySelector('#lbl-step-guide').innerHTML = '❌ <b>계산 오류!</b> 다시 계산해보세요. (입력값: ' + inputVal + ')';
    }
  },

  updatePolyExpression: function() {
    var root = S.host.querySelector('#sd-app-root');
    if (!root) return;

    var signStr = S.alpha >= 0 ? '- ' + S.alpha : '+ ' + Math.abs(S.alpha);
    var texStr = 'P(x) = (x ' + signStr + ') Q(x) + R';

    if (S.isComplete) {
      var rem = S.row3[S.row3.length - 1];
      texStr = 'P(x) = (x ' + signStr + ') \\cdot Q(x) ' + (rem >= 0 ? '+ ' + rem : '- ' + Math.abs(rem));
    }

    var mathEl = root.querySelector('#lbl-math-poly-eq');
    if (mathEl) {
      mathEl.setAttribute('data-tex', texStr);
      renderMath(texStr, mathEl, false);
    }
  },

  renderSlideGuide: function() {
    var _this = this;
    var root = S.host.querySelector('#sd-app-root');
    var mBox = root.querySelector('#sd-modal-box');
    if (!mBox) return;

    var pg = SLIDE_GUIDE[S.guidePage] || SLIDE_GUIDE[0];
    var dots = SLIDE_GUIDE.map(function(_, i) {
      return '<span class="dot' + (i === S.guidePage ? ' on' : '') + '"></span>';
    }).join('');
    var isLast = S.guidePage >= SLIDE_GUIDE.length - 1;

    var h = '';
    h += '<div style="font-size:.8rem; font-weight:800; color:#0284c7; margin-bottom:4px;">온보딩 슬라이드 탐구 ' + (S.guidePage + 1) + ' / ' + SLIDE_GUIDE.length + '</div>';
    h += '<h3 style="margin:0 0 12px; color:#0f172a; font-weight:900;">' + pg.title + '</h3>';
    h += '<div style="line-height:1.65; color:#334155; font-size:0.95rem;">' + pg.html + '</div>';
    h += '<div class="dots">' + dots + '</div>';

    h += '<div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px;">';
    h += '  <button type="button" class="btn" id="btn-slide-prev"' + (S.guidePage === 0 ? ' disabled' : '') + '>← 이전</button>';
    h += '  <button type="button" class="btn p" id="btn-slide-next">' + (isLast ? '실습 시작하기 🚀' : '다음 →') + '</button>';
    h += '</div>';

    mBox.innerHTML = h;
    updateMathElements();

    var prevBtn = mBox.querySelector('#btn-slide-prev');
    var nextBtn = mBox.querySelector('#btn-slide-next');

    if (prevBtn) {
      prevBtn.onclick = function() {
        if (S.guidePage > 0) {
          S.guidePage--;
          _this.renderSlideGuide();
        }
      };
    }
    if (nextBtn) {
      nextBtn.onclick = function() {
        if (isLast) {
          root.querySelector('#sd-modal').classList.remove('on');
        } else {
          S.guidePage++;
          _this.renderSlideGuide();
        }
      };
    }
  },

  destroy: function() {
    if (S.host) S.host.innerHTML = '';
    S.host = null;
  }
};

function goHome() {
  if (S.host) S.host.innerHTML = '';
  if (typeof window.LegacyBridge !== 'undefined' && typeof window.LegacyBridge.backHome === 'function') {
    window.LegacyBridge.backHome();
  } else if (typeof window.MathLabGames !== 'undefined' && window.MathLabGames.goHome) {
    window.MathLabGames.goHome();
  } else {
    window.location.reload();
  }
}

function reg() {
  if (typeof window.MathLabGames === 'undefined' || typeof window.MathLabGames.register !== 'function') return;
  try {
    if (window.MathLabGames.get && window.MathLabGames.get(APP_ID)) return;
    window.MathLabGames.register({
      id: APP_ID,
      title: APP_TITLE,
      icon: ICON,
      sourceType: 'new',
      players: '1인',
      isMultiplayer: false,
      mount: function(c, x) { SyntheticDivisionApp.mount(c, x); },
      reset: function() { SyntheticDivisionApp.startRound(); },
      destroy: function() { SyntheticDivisionApp.destroy(); },
      goHome: function() { goHome(); }
    });
  } catch (e) {
    console.warn(APP_ID + ' reg', e);
  }
}

reg();
window.addEventListener('DOMContentLoaded', reg);
setTimeout(reg, 100);
setTimeout(reg, 500);

window.SyntheticDivision = {
  mount: function(c) { SyntheticDivisionApp.mount(c); },
  resetGame: function() { SyntheticDivisionApp.startRound(); },
  destroy: function() { SyntheticDivisionApp.destroy(); },
  goHome: goHome
};

window.initSyntheticDivision = function() {
  reg();
  try {
    if (window.LegacyBridge) {
      window.LegacyBridge.hideAllLegacySections();
      if (window.LegacyBridge.showNewRoot) window.LegacyBridge.showNewRoot();
    }
  } catch (e) {}
  if (window.MathLabGames && window.MathLabGames.mount) {
    try { window.MathLabGames.mount(APP_ID); return; } catch (e) {}
  }
  SyntheticDivisionApp.mount(document.getElementById('mathlab-view'));
};

window.launchSyntheticDivision = window.initSyntheticDivision;
})();
</script>
