<script>
document.addEventListener('DOMContentLoaded', function () {
  const view = document.getElementById('mathlab-view');
  const logo = document.getElementById('mathlab-logo');

  let currentMenuRenderer = null;

  let currentState = {
    category: 'all',
    search: '',
    sort: 'newest',
    viewMode: 'grid'
  };

  function renderHome() {
    if (window.MathLabGames && typeof window.MathLabGames.destroyCurrent === "function") { window.MathLabGames.destroyCurrent(); }
    currentMenuRenderer = null;
    
    if (window.LegacyBridge) {
      window.LegacyBridge.showNewRoot();
    }
    
    // Check if we are already showing the dashboard (avoid re-rendering entire shell if already there)
    const existingSearch = document.getElementById('mathlab-global-search');
    if (existingSearch) {
      renderAppCards();
      return;
    }

    const template = document.getElementById('tpl-home');
    if (!template) {
      view.innerHTML = '<p>홈 템플릿을 찾을 수 없습니다.</p>';
      return;
    }

    view.innerHTML = template.innerHTML;
    
    bindHomeEvents();
    renderAppCards();
  }

  function bindHomeEvents() {
    const searchInput = document.getElementById('mathlab-global-search');
    const searchClear = document.getElementById('mathlab-search-clear');
    const sortSelect = document.getElementById('mathlab-sort-select');
    const catBtns = document.querySelectorAll('.cat-btn');
    const pillBtns = document.querySelectorAll('.search-pill-btn');
    
    if (searchInput) {
      searchInput.addEventListener('input', (e) => {
        currentState.search = e.target.value.trim().toLowerCase();
        if (searchClear) searchClear.style.display = currentState.search ? 'block' : 'none';
        renderAppCards();
      });
    }

    if (searchClear) {
      searchClear.addEventListener('click', () => {
        if (searchInput) searchInput.value = '';
        currentState.search = '';
        searchClear.style.display = 'none';
        renderAppCards();
      });
    }

    if (sortSelect) {
      sortSelect.addEventListener('change', (e) => {
        currentState.sort = e.target.value;
        renderAppCards();
      });
    }

    catBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        catBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentState.category = btn.getAttribute('data-cat');
        renderAppCards();
      });
    });

    pillBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const tag = btn.getAttribute('data-tag');
        if (searchInput) {
          searchInput.value = tag;
          currentState.search = tag.toLowerCase();
          if(searchClear) searchClear.style.display = 'block';
          
          catBtns.forEach(b => b.classList.remove('active'));
          const allBtn = document.querySelector('.cat-btn[data-cat="all"]');
          if (allBtn) allBtn.classList.add('active');
          currentState.category = 'all';

          renderAppCards();
        }
      });
    });
    
    const launchBtns = view.querySelectorAll('[data-launch-app]');
    launchBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const appId = btn.getAttribute('data-launch-app');
        if (window.MathLabGames && typeof window.MathLabGames.get === 'function' && window.MathLabGames.get(appId)) {
          window.MathLabGames.mount(appId);
        } else if (typeof window.openApp === 'function') {
          window.openApp(appId);
        }
      });
    });
  }

  function renderAppCards() {
    const grid = document.getElementById('home-app-cards');
    const statusEl = document.getElementById('mathlab-search-status');
    if (!grid) return;

    let apps = window.MathLabMetadata ? [...window.MathLabMetadata] : [];

    if (currentState.category !== 'all') {
      apps = apps.filter(app => app.appType === currentState.category);
    }

    if (currentState.search) {
      let qRaw = currentState.search;
      let filterType = 'all';
      let qParsed = qRaw;
      
      if (qRaw.startsWith('학교급:')) {
        filterType = 'school';
        qParsed = qRaw.replace('학교급:', '');
      } else if (qRaw.startsWith('과목명:')) {
        filterType = 'subject';
        qParsed = qRaw.replace('과목명:', '');
      }

      let q = qParsed.toLowerCase().replace(/\s+/g, '');
      q = q.replace(/미적분1/g, '미적분ⅰ').replace(/미적분2/g, '미적분ⅱ');
      
      apps = apps.filter(app => {
        if (filterType === 'school') {
          const school = (app.curriculumSchool || '').toLowerCase().replace(/\s+/g, '');
          return school.includes(q);
        } else if (filterType === 'subject') {
          const subject = (app.curriculumSubject || '').toLowerCase().replace(/\s+/g, '');
          return subject.includes(q);
        } else {
          const text = [
            app.title, 
            app.description, 
            app.curriculumSchool || '',
            app.curriculumSubject || '',
            app.curriculumUnit || '',
            ...(app.tags || []), 
            ...(app.keywords || []), 
            ...(app.gradeBand || []),
            ...(app.schoolLevel || []),
            ...(app.curriculumArea || [])
          ].join(' ').toLowerCase().replace(/\s+/g, '');
          return text.includes(q);
        }
      });
      if (statusEl) {
        statusEl.style.display = 'block';
        statusEl.textContent = `⚡ "${currentState.search}" 검색 결과: 총 ${apps.length}개의 앱이 발견되었습니다!`;
      }
    } else {
      if (statusEl) statusEl.style.display = 'none';
    }

    apps.sort((a, b) => {
      if (currentState.sort === 'nameAsc') {
        return a.title.localeCompare(b.title);
      } else if (currentState.sort === 'nameDesc') {
        return b.title.localeCompare(a.title);
      } else if (currentState.sort === 'oldest') {
        return window.MathLabMetadata.indexOf(a) - window.MathLabMetadata.indexOf(b);
      } else {
        return window.MathLabMetadata.indexOf(b) - window.MathLabMetadata.indexOf(a);
      }
    });

    if (!apps.length) {
      grid.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding:40px; color:#94a3b8; font-size:1.1rem;">조건에 맞는 앱이 없습니다. 😢</div>`;
      return;
    }

    grid.innerHTML = apps.map(app => {
      const modeBadges = [];
      if (app.playModes) {
        if (app.playModes.includes('simultaneousVersus') || app.playModes.includes('turnVersus')) modeBadges.push('👥 대결');
        if (app.playModes.includes('classroom') || app.playModes.includes('team')) modeBadges.push('🏫 교실');
      }

      const badgeHtml = modeBadges.length ? `<div class="card-badges" style="margin-top:10px; font-size:0.75rem; display:flex; gap:6px; flex-wrap:wrap;">` + modeBadges.map(b => `<span style="background:#e74c3c; color:#fff; padding:3px 6px; border-radius:6px; font-weight:bold;">${b}</span>`).join('') + `</div>` : '';

      const multiBadge = app.multiplayer ? `<br><span style="font-size:0.7rem; background:#e74c3c; color:#fff; padding:3px 6px; border-radius:6px; vertical-align:middle; margin-top:5px; display:inline-block;">👥 ${app.multiplayer}</span>` : '';

            const tooltipHTML = `[${app.curriculumSchool || '전연령'} - ${app.curriculumSubject || '창의수학'} - ${app.curriculumUnit || '일반'}]<br><span style="font-weight:400; font-size:0.8rem; margin-top:4px; display:inline-block; color:#475569;">${app.description || ''}</span>`;
      return `
        <button class="app-card" data-launch-type="${app.launchType}" data-launch-id="${app.launchId}">
          <div class="card-icon">${app.icon || '📌'}</div>
          <h3 class="card-title">${app.title}${multiBadge}</h3>
          <p class="card-desc">${tooltipHTML}</p>
          ${badgeHtml}
        </button>
      `;
    }).join('');

    const cards = grid.querySelectorAll('.app-card');
    cards.forEach(card => {
      card.addEventListener('click', () => {
        const lType = card.getAttribute('data-launch-type');
        const lId = card.getAttribute('data-launch-id');

        if (lType === 'mathLabGame' && window.MathLabGames) {
          window.MathLabGames.mount(lId);
        } else if (lType === 'openApp' && typeof window.openApp === 'function') {
          window.openApp(lId);
        } else if (lType === 'concept' && window.MathLabConcepts) {
          window.MathLabConcepts.mount(lId);
        } else if (lType === 'application' && window.MathLabApplications) {
          window.MathLabApplications.mount(lId);
        } else if (lType === 'tutor' && window.MathLabTutor) {
          window.MathLabTutor.mount(lId);
        } else if (lType === 'function' && typeof window[lId] === 'function') {
          window[lId]();
        } else {
          alert('해당 앱을 실행할 수 없습니다.');
        }
      });
    });
  }

  if (logo) {
    logo.addEventListener('click', renderHome);
  }

  window.MathLabBackToCurrentMenu = function() {
    if (window.LegacyBridge) window.LegacyBridge.showNewRoot();
    window.MathLabRenderHome();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  window.MathLabRenderNewHome = renderHome;
  window.MathLabRenderHome = renderHome;
  window.MathLabRenderLegacyDashboard = renderHome;

  function bindLegacyButtons() {
    const buttons = view.querySelectorAll('[data-legacy]');

    buttons.forEach(function(button) {
      button.addEventListener('click', function() {
        const legacyId = button.getAttribute('data-legacy');
        openLegacy(legacyId);
      });
    });
  }

  function openLegacy(legacyId) {
    if (!window.LegacyBridge) {
      alert('LegacyBridge를 찾을 수 없습니다.');
      return;
    }

    window.LegacyBridge.mountLegacy(legacyId);
  }

  function renderAppPlaceholder(app) {
    view.innerHTML = `
      <section>
        <h1>${app}</h1>
        <p>이 영역은 다음 단계에서 기존 기능과 연결됩니다.</p>
        <button id="back-home">홈으로 돌아가기</button>
      </section>
    `;

    bindBackHomeButton();
  }

  if (logo) {
  logo.addEventListener('click', renderHome);
}

  window.MathLabRenderNewHome = renderHome;
window.MathLabRenderHome = renderHome;
window.MathLabRenderLegacyDashboard = renderHome;

  const floatingHome = document.getElementById('mathlab-floating-home');

  if (floatingHome) {
  floatingHome.addEventListener('click', function () {
    

    renderHome();
  });
}

  renderHome();
});
</script>
