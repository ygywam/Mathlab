<template id="tpl-home">
  <section id="dashboard-screen" class="app-home app-home-main" style="max-width:1200px; margin:0 auto; padding:0 10px 20px 10px;">
    <!-- HERO SECTION -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; position: sticky; top: 0; z-index: 1000; background: var(--mathlab-bg, #ffffff); padding: 10px 0; border-bottom: 1px solid var(--mathlab-line, #f1f5f9);">
      <h1 class="dash-title" style="margin-bottom:0; text-align:left; cursor:pointer; color: var(--mathlab-text);" onclick="window.scrollTo({top: 0, behavior: 'smooth'})" title="맨 위로 가기">수학 실험실 v2.0🧪</h1>
      <div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center;">
        <button class="home-btn" data-launch-app="version" style="margin-bottom:0; background:var(--mathlab-panel, #fff); border-color:var(--mathlab-line, #e2e8f0); padding: 8px 12px; color:var(--mathlab-text); font-weight:bold;">📜 버전 기록</button>
        <button class="home-btn" onclick="if(typeof openFeedbackModal === 'function') openFeedbackModal()" style="margin-bottom:0; background:var(--mathlab-panel, #fff); border-color:var(--mathlab-line, #e2e8f0); padding:8px 12px; color:var(--mathlab-text); font-weight:bold; position:relative;">
          💬 소통 창구
          <span id="feedback-new-badge" style="display:none; position:absolute; top:-6px; right:-6px; background:#ef4444; color:#ffffff; font-size:0.65rem; font-weight:900; padding:2px 6px; border-radius:999px; box-shadow:0 2px 6px rgba(239, 68, 68, 0.5); letter-spacing:0.5px; animation: pulseBadge 1.5s infinite;">NEW</span>
        </button>
        <button class="home-btn" data-launch-app="settings" style="margin-bottom:0; background:var(--mathlab-panel, #fff); border-color:var(--mathlab-line, #e2e8f0); padding: 8px 12px; color:var(--mathlab-text);">⚙️ 설정</button>
      </div>
    </div>
    <p class="dash-subtitle" style="text-align:left; margin-bottom:30px; color: var(--mathlab-text);">눈으로 보고 직접 조작하며 깨닫는 수학</p>

    <!-- SEARCH & SORT CONTROLS -->
    <div id="mathlab-search-section" style="width: 100%; max-width: 1050px; margin: 16px auto 20px auto; padding: 0 16px; box-sizing: border-box;">
      <div style="background: linear-gradient(135deg, rgba(30, 41, 59, 0.95) 0%, rgba(15, 23, 42, 0.95) 100%); border: 2px solid #38bdf8; border-radius: 20px; padding: 18px 24px; box-shadow: 0 12px 30px rgba(0,0,0,0.3); backdrop-filter: blur(10px);">
        
        <div style="display: flex; flex-wrap:wrap; gap: 10px; align-items: center; position: relative; margin-bottom: 14px; justify-content:space-between;">
          <div style="display:flex; flex:1; min-width:280px; align-items:center; gap:10px; position:relative;">
            <span style="font-size: 1.4rem; padding-left: 6px; position:absolute; left:10px;">🔍</span>
            <input type="text" id="mathlab-global-search" 
                   placeholder="원하는 수학 앱, 단원, 개념, 학년을 검색하세요..." 
                   style="width: 100%; padding: 14px 40px 14px 45px; border-radius: 12px; border: 1px solid #475569; background: #0f172a; color: #f8fafc; font-size: 1.05rem; outline: none; transition: border-color 0.2s, box-shadow 0.2s; font-family: 'Pretendard', sans-serif;"
                   onfocus="this.style.borderColor='#38bdf8'; this.style.boxShadow='0 0 12px rgba(56,189,248,0.3)';" 
                   onblur="this.style.borderColor='#475569'; this.style.boxShadow='none';">
            <button id="mathlab-search-clear" 
                    style="display:none; position:absolute; right:10px; background: #334155; color: #cbd5e1; border: none; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 0.85rem; transition: background 0.2s;">
              초기화 ✕
            </button>
          </div>
          
          <div style="display:flex; gap:10px; align-items:center;">
            <select id="mathlab-sort-select" style="padding:12px; border-radius:12px; border:1px solid #475569; background:#1e293b; color:#f8fafc; font-weight:bold; cursor:pointer; font-size:0.95rem; outline:none;">
              <option value="newest">최신 개발순 (기본)</option>
              <option value="oldest">과거 개발순</option>
              <option value="nameAsc">가나다순 (오름차순)</option>
              <option value="nameDesc">가나다순 (내림차순)</option>
            </select>
            
          </div>
        </div>

        <div id="mathlab-quick-tags" style="display: flex; flex-direction: column; gap: 8px;">
          <div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center;">
            <span style="font-size: 0.85rem; color: #94a3b8; font-weight: 800; margin-right: 4px; margin-right: 8px; white-space: nowrap; flex-shrink: 0;">🏫 학교급:</span>
            <button class="search-pill-btn" data-tag="학교급:초등학교" style="background:#1e293b; border:1px solid #10b981; color:#10b981; padding:6px 12px; border-radius:20px; font-size:0.85rem; cursor:pointer; font-weight:600; transition:all 0.2s;">#초등학교</button>
            <button class="search-pill-btn" data-tag="학교급:중학교" style="background:#1e293b; border:1px solid #10b981; color:#10b981; padding:6px 12px; border-radius:20px; font-size:0.85rem; cursor:pointer; font-weight:600; transition:all 0.2s;">#중학교</button>
            <button class="search-pill-btn" data-tag="학교급:고등학교" style="background:#1e293b; border:1px solid #10b981; color:#10b981; padding:6px 12px; border-radius:20px; font-size:0.85rem; cursor:pointer; font-weight:600; transition:all 0.2s;">#고등학교</button>
          </div>
          <div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center;">
            <span style="font-size: 0.85rem; color: #94a3b8; font-weight: 800; margin-right: 4px; margin-right: 8px; white-space: nowrap; flex-shrink: 0;">📚 과목명:</span>
            <button class="search-pill-btn" data-tag="과목명:공통수학1" style="background:#1e293b; border:1px solid #38bdf8; color:#38bdf8; padding:6px 12px; border-radius:20px; font-size:0.85rem; cursor:pointer; font-weight:600; transition:all 0.2s;">#공통수학1</button>
            <button class="search-pill-btn" data-tag="과목명:공통수학2" style="background:#1e293b; border:1px solid #38bdf8; color:#38bdf8; padding:6px 12px; border-radius:20px; font-size:0.85rem; cursor:pointer; font-weight:600; transition:all 0.2s;">#공통수학2</button>
            <button class="search-pill-btn" data-tag="과목명:대수" style="background:#1e293b; border:1px solid #38bdf8; color:#38bdf8; padding:6px 12px; border-radius:20px; font-size:0.85rem; cursor:pointer; font-weight:600; transition:all 0.2s;">#대수</button>
            <button class="search-pill-btn" data-tag="과목명:미적분1" style="background:#1e293b; border:1px solid #38bdf8; color:#38bdf8; padding:6px 12px; border-radius:20px; font-size:0.85rem; cursor:pointer; font-weight:600; transition:all 0.2s;">#미적분1</button>
            <button class="search-pill-btn" data-tag="과목명:미적분2" style="background:#1e293b; border:1px solid #38bdf8; color:#38bdf8; padding:6px 12px; border-radius:20px; font-size:0.85rem; cursor:pointer; font-weight:600; transition:all 0.2s;">#미적분2</button>
            <button class="search-pill-btn" data-tag="과목명:확률과통계" style="background:#1e293b; border:1px solid #38bdf8; color:#38bdf8; padding:6px 12px; border-radius:20px; font-size:0.85rem; cursor:pointer; font-weight:600; transition:all 0.2s;">#확률과통계</button>
            <button class="search-pill-btn" data-tag="과목명:기하" style="background:#1e293b; border:1px solid #38bdf8; color:#38bdf8; padding:6px 12px; border-radius:20px; font-size:0.85rem; cursor:pointer; font-weight:600; transition:all 0.2s;">#기하</button>
            <button class="search-pill-btn" data-tag="과목명:경제수학" style="background:#1e293b; border:1px solid #38bdf8; color:#38bdf8; padding:6px 12px; border-radius:20px; font-size:0.85rem; cursor:pointer; font-weight:600; transition:all 0.2s;">#경제수학</button>
          </div>
        </div>

        <div id="mathlab-search-status" style="font-size: 0.95rem; color: #38bdf8; font-weight: bold; margin-top: 12px; display: none;"></div>
      </div>
    </div>
    
    <!-- CATEGORY TABS -->
    <div class="category-filter" id="mathlab-category-filters" style="margin-bottom:20px; flex-wrap:wrap; display:flex; gap:10px;">
      <button class="cat-btn active" data-cat="all">전체 보기</button>
      <button class="cat-btn" data-cat="concept">📊 교과 수학 개념</button>
      <button class="cat-btn" data-cat="game">🎮 수학 게임</button>
      <button class="cat-btn" data-cat="application">💰 실생활 응용</button>
    </div>

    <style>
      .search-pill-btn:hover { background: #334155 !important; transform: translateY(-2px); }
      
      /* List View (Table-like List) */
      .grid-container.view-mode-list { display: flex !important; flex-direction: column; gap: 8px; }
      .grid-container.view-mode-list .app-card { width: 100%; display: grid; grid-template-columns: 50px 200px 1fr auto; align-items: center; text-align: left; padding: 10px 20px; height: auto; justify-content: start; box-sizing:border-box; }
      .grid-container.view-mode-list .app-card .card-icon { margin: 0; font-size: 2rem; }
      .grid-container.view-mode-list .app-card .card-title { margin: 0; font-size: 1.15rem; padding-left:15px; }
      .grid-container.view-mode-list .app-card .card-desc { margin: 0; font-size: 0.95rem; color:#7f8c8d; }
      .grid-container.view-mode-list .app-card .card-badges { justify-self: end; }
      
      /* Compact View with Tooltip */
      .grid-container.view-mode-compact { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)) !important; gap: 10px; justify-content:center; }
      .grid-container.view-mode-compact .app-card { padding: 12px 6px; height: auto; justify-content: center; position:relative; transition: all 0.2s ease; }
      .grid-container.view-mode-compact .app-card:hover { transform: translateY(-4px); box-shadow: 0 0 15px rgba(52, 152, 219, 0.5), 0 10px 20px rgba(0,0,0,0.1); border-color: #3498db; z-index: 10; }
      .grid-container.view-mode-compact .app-card .card-icon { font-size: 2.2rem; margin-bottom: 8px; }
      .grid-container.view-mode-compact .app-card .card-title { font-size: 0.95rem; margin: 0; font-weight:700; }
      .grid-container.view-mode-compact .app-card .card-desc { 
        display: none; position: absolute; bottom: 110%; left: 50%; transform: translateX(-50%); 
        width: max-content; max-width: 280px; background: rgba(255, 255, 255, 0.98); color: #0f172a; 
        padding: 10px 14px; border-radius: 8px; font-size: 0.85rem; font-weight:600; z-index: 100; text-align:center;
        box-shadow: 0 8px 25px rgba(0,0,0,0.2); pointer-events:none; border:1px solid #e2e8f0;
      }
      .grid-container.view-mode-compact .app-card:hover .card-desc { display: block; }
      .grid-container.view-mode-compact .app-card .card-badges { display: none; }
    </style>

    <!-- APP CARDS GRID -->
    <div id="home-app-cards" class="grid-container view-mode-compact"></div>

  </section>
</template>
