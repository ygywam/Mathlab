<script>
  window.MathLabTutor = (function () {
    const tutors = new Map();

    return {
      register(tutor) {
        if (!tutor || !tutor.id) {
          throw new Error('AI 튜터 id가 없습니다.');
        }

        if (tutors.has(tutor.id)) {
          tutors.set(tutor.id, tutor);
          return;
        }

        tutors.set(tutor.id, tutor);
      },

      get(id) {
        return tutors.get(id);
      },

      all() {
        return Array.from(tutors.values());
      },

      mount(id, context = {}) {
        const tutor = tutors.get(id);

        if (!tutor) throw new Error('Unknown tutor: ' + id);
        const modalOverlay = document.getElementById('mathlab-global-modal-overlay');
        const defaultContainer = document.getElementById('mathlab-global-modal-content') || document.getElementById('mathlab-view') || document.getElementById('new-root') || document.body;
        
        if (modalOverlay) {
          modalOverlay.classList.remove('hidden');
          document.body.style.overflow = 'hidden';
        }
        return tutor.mount(defaultContainer, context);
      },
    };
  })();
</script>
