<!-- 생일 패러독스 확률 실험실 (Birthday Paradox) 홈 버튼 & 랭킹 시트 연동 완결판 -->
<style>
  .game-birthday-paradox {
    width: 100%;
    min-height: 100%;
    padding: 28px;
    box-sizing: border-box;
    color: #1f2937;
    background: linear-gradient(135deg, #fdf4ff 0%, #f3e8ff 100%);
    border-radius: 24px;
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    user-select: none;
    -webkit-user-select: none;
  }

  .game-birthday-paradox * { box-sizing: border-box; }
  
  .game-birthday-paradox .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
  .game-birthday-paradox .title-area h2 { margin: 0 0 8px; font-size: clamp(1.8rem, 3vw, 2.5rem); color: #111827; font-weight: 900; }
  .game-birthday-paradox .title-area p { margin: 0; color: #4b5563; font-size: 1.05rem; font-weight: 600; }
  .game-birthday-paradox .stats { display: flex; gap: 16px; font-weight: 800; font-size: 1.1rem; flex-wrap: wrap; }
  
  .game-birthday-paradox .main-layout { display: flex; gap: 24px; flex-wrap: wrap; }
  
  .game-birthday-paradox .game-area { flex: 1; min-width: 300px; display: flex; flex-direction: column; gap: 24px; }
  .game-birthday-paradox .card { background: #fff; border-radius: 16px; padding: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); border: 1px solid #e9d5ff; }
  
  .game-birthday-paradox .room-info { text-align: center; font-size: 1.5rem; font-weight: 900; color: #7e22ce; margin-bottom: 8px; }
  
  .game-birthday-paradox .predict-area { display: flex; flex-direction: column; align-items: center; gap: 16px; margin: 20px 0; }
  .game-birthday-paradox input[type=range] { width: 100%; max-width: 400px; accent-color: #9333ea; cursor: pointer; }
  .game-birthday-paradox .predict-val { font-size: 2.5rem; font-weight: 900; color: #9333ea; }
  
  .game-birthday-paradox .btn-primary { background: #9333ea; color: white; border: none; padding: 14px 28px; font-size: 1.1rem; border-radius: 12px; cursor: pointer; font-weight: 800; transition: background 0.2s, transform 0.1s; box-shadow: 0 4px 10px rgba(147, 51, 234, 0.3); }
  .game-birthday-paradox .btn-primary:hover:not(:disabled) { background: #7e22ce; transform: translateY(-1px); }
  .game-birthday-paradox .btn-primary:disabled { background: #d8b4fe; cursor: not-allowed; box-shadow: none; }
  
  .game-birthday-paradox .btn-secondary { background: #e5e7eb; color: #374151; border: none; padding: 12px 20px; font-size: 1rem; border-radius: 12px; cursor: pointer; font-weight: 700; transition: background 0.15s; }
  .game-birthday-paradox .btn-secondary:hover:not(:disabled) { background: #d1d5db; }
  
  .game-birthday-paradox .sim-area { min-height: 120px; background: #f3f4f6; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; justify-content: center; align-items: center; overflow: hidden; position: relative; margin-top: 16px; border: 1px solid #e5e7eb; }
  .game-birthday-paradox .sim-log { font-family: monospace; font-size: 1.1rem; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .game-birthday-paradox .sim-log span { background: #fff; border: 1px solid #d1d5db; padding: 4px 8px; border-radius: 6px; color: #374151; font-weight: 700; }
  .game-birthday-paradox .sim-log span.match { background: #fca5a5; border-color: #ef4444; color: #991b1b; font-weight: 900; animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
  @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.3); } 100% { transform: scale(1); } }
  
  .game-birthday-paradox .result-area { text-align: center; margin-top: 24px; padding: 18px; border-radius: 12px; display: none; font-weight: 700; }
  .game-birthday-paradox .result-area.show { display: block; background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; animation: fadeIn 0.5s; }
  .game-birthday-paradox .result-area.show.bad { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
  
  .game-birthday-paradox .controls { display: flex; justify-content: space-between; gap: 16px; margin-top: 24px; flex-wrap: wrap; }
  .game-birthday-paradox .hint-box { background: #fef3c7; border: 1px solid #fde68a; padding: 20px; border-radius: 12px; margin-top: 16px; display: none; }
  .game-birthday-paradox .detail-box { background: #eff6ff; border: 1px solid #bfdbfe; padding: 20px; border-radius: 12px; margin-top: 16px; display: none; text-align: left; }
  .game-birthday-paradox .detail-box li { margin-bottom: 8px; line-height: 1.5; color: #374151; font-weight: 600; }
  
  .game-birthday-paradox .sidebar { width: 320px; display: flex; flex-direction: column; gap: 16px; flex-shrink: 0; }
  @media (max-width: 768px) {
    .game-birthday-paradox .sidebar { width: 100%; }
  }

  .game-birthday-paradox .rank-item {
    display: flex; justify-content: space-between; align-items: center;
    background: #f8fafc; border: 1px solid #cbd5e1;
    padding: 8px 14px; border-radius: 10px; margin-bottom: 6px;
    font-size: 0.95rem; color: #334155; font-weight: 700;
  }
  .game-birthday-paradox .rank-num { color: #9333ea; font-weight: 900; margin-right: 8px; }
  .game-birthday-paradox .rank-score { color: #7e22ce; font-weight: 900; }
</style>
<script>
(function() {
  function escapeHTML(str) { return String(str || '').replace(/[&<>'"]/g, s => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[s])); }
  function getScoreForError(errPercent) {
    if (errPercent <= 2) return 100; // 오차 2% 이내
    if (errPercent <= 5) return 70;  // 오차 5% 이내
    if (errPercent <= 10) return 40; // 오차 10% 이내
    return 10;
  }

  function getTheoreticalProb(n) {
    let pDiff = 1.0;
    for (let i = 0; i < n; i++) {
      pDiff *= (365 - i) / 365;
    }
    return (1 - pDiff) * 100;
  }

  const BirthdayParadoxGame = {
    id: 'birthday-paradox',
    container: null,
    state: {
      roomIdx: 0,
      score: 0,
      combo: 0,
      hintUsed: false,
      isSimulating: false,
      predictVal: 50,
      simDays: [],
      simFound: false,
      roomFinished: false,
      errorPercent: 0
    },
    timers: [],

    mount(container, context) {
      let target = null;
      if (typeof container === 'string') target = document.querySelector(container);
      else if (container instanceof HTMLElement) target = container;
      if (!target) target = document.getElementById('mathlab-view') || document.getElementById('new-root') || document.getElementById('game-container');

      // 💡 [자가 복구 엔진] 컨테이너가 없거나 가려져 있다면, 100% 보이는 전용 도화지 생성!
      if (!target || target === document.body) {
        let host = document.getElementById('birthday-paradox-force-host');
        if (!host) {
          host = document.createElement('div'); host.id = 'birthday-paradox-force-host';
          host.style.cssText = 'width:100%; max-width:960px; margin:0 auto; padding:20px 10px; box-sizing:border-box; z-index:999; position:relative; background:#ffffff; min-height:650px; display:block; border-radius:24px;';
          const header = document.querySelector('header, .navbar, #app-header, .top-bar');
          if (header && header.parentNode) header.parentNode.insertBefore(host, header.nextSibling);
          else document.body.appendChild(host);
        }
        target = host;
      }

      this.container = target;
      this.container.style.display = 'block'; this.container.style.visibility = 'visible'; this.container.style.opacity = '1'; this.container.style.minHeight = '650px';

      let parent = this.container.parentElement;
      while (parent && parent !== document.body && parent !== document.documentElement) {
        if (parent.style && parent.style.display === 'none') parent.style.display = 'block';
        if (parent.style && parent.style.visibility === 'hidden') parent.style.visibility = 'visible';
        parent = parent.parentElement;
      }

      this.restoreGlobalNavigation();
      this.reset();
    },

    restoreGlobalNavigation() {
      const navElements = document.querySelectorAll('header, .navbar, #app-header, .top-bar, #floating-home-btn, .floating-home, [id*="home"], [class*="floating"]');
      navElements.forEach(el => { if (el && el.style && el.style.display === 'none') el.style.display = ''; });
    },

    reset() {
      if (window.MathLabCleanup && typeof window.MathLabCleanup.clearTimers === 'function') {
        window.MathLabCleanup.clearTimers(this.timers);
      }
      this.timers.forEach(clearTimeout);
      this.timers = [];
      
      const randomRooms = [];
      while(randomRooms.length < 7) {
        const r = Math.floor(Math.random() * 56) + 5; // 5명 ~ 60명 사이
        if (!randomRooms.includes(r)) randomRooms.push(r);
      }
      randomRooms.sort((a, b) => a - b);
      
      this.state = {
        rooms: randomRooms,
        roomIdx: 0,
        score: 0,
        combo: 0,
        hintUsed: false,
        isSimulating: false,
        predictVal: 50,
        simDays: [],
        simFound: false,
        roomFinished: false,
        errorPercent: 0,
        isGameOver: false
      };
      this.render();
    },
    
    nextRoom() {
      if (this.state.roomIdx >= this.state.rooms.length - 1) {
        if (!this.state.isGameOver) {
          this.state.roomIdx++;
          this.gameOver(true);
        }
        return;
      }
      this.state.roomIdx++;
      this.state.hintUsed = false;
      this.state.isSimulating = false;
      this.state.roomFinished = false;
      this.state.simDays = [];
      this.state.simFound = false;
      this.state.predictVal = 50;
      this.render();
    },
    
    gameOver(cleared) {
      this.state.isGameOver = true;
      this.render();
      const nextBtn = this.container.querySelector('#bp-btn-next');
      if (nextBtn) {
         nextBtn.disabled = true;
         nextBtn.style.display = 'none';
      }
      setTimeout(() => {
        this.showExplorationFinishModal();
      }, 400);
    },

    showExplorationFinishModal() {
      document.getElementById('mathlab-completion-modal')?.remove();
      const modalHtml = `
        <div id="mathlab-completion-modal" style="position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(15,23,42,0.85); backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center; z-index:999999; padding:20px; box-sizing:border-box; font-family:'Pretendard',sans-serif;">
          <div style="background:#ffffff; border-radius:26px; padding:32px 28px; max-width:500px; width:100%; box-shadow:0 25px 50px rgba(0,0,0,0.5); text-align:center; border:3px solid #6b21a8;">
            <div style="font-size:54px; margin-bottom:12px;">🎉📈</div>
            <h2 style="margin:0 0 10px; font-size:24px; font-weight:900; color:#1e293b;">7단계 확률 탐구 실습 완료!</h2>
            <p style="margin:0 0 20px; font-size:15px; color:#475569; line-height:1.5;">10명부터 50명까지 표본 집단 변화에 따른<br><strong>여사건의 확률 곡선 성장</strong> 실습을 모두 완수했습니다.</p>
            <div style="background:#faf5ff; border:1px solid #d8b4fe; border-radius:16px; padding:18px; margin-bottom:24px; text-align:left; color:#581c87; font-size:14px; line-height:1.65;">
              <strong style="font-size:15px;">💡 교과 탐구 핵심 결론:</strong><br>
              • <strong>23명 집단:</strong> 일치 확률 약 <strong>50.7%</strong> (과반 초과)<br>
              • <strong>50명 집단:</strong> 일치 확률 약 <strong>97.0%</strong> (확실성에 수렴)<br>
              • 나와 같은 생일을 찾는 것(1/365)과 달리 '임의의 두 사람' 쌍의 수는 조합((_{n}C_2))으로 기하급수적으로 늘어나 직관과 엄청난 차이를 냅니다.
            </div>
            <div style="display:flex; gap:12px;">
              <button id="comp-btn-restart" style="flex:1; padding:15px; border-radius:14px; font-size:15px; font-weight:800; background:#f1f5f9; color:#475569; border:none; cursor:pointer;">🔄 실습 다시 하기</button>
              <button id="comp-btn-home" style="flex:1; padding:15px; border-radius:14px; font-size:15px; font-weight:800; background:#6b21a8; color:#ffffff; border:none; cursor:pointer;">🏠 홈으로 이동</button>
            </div>
          </div>
        </div>
      `;
      document.body.insertAdjacentHTML('beforeend', modalHtml);
      if (typeof window.renderMathInElement === 'function') {
        try { window.renderMathInElement(document.getElementById('mathlab-completion-modal'), false); } catch(e){}
      }
      const close = () => document.getElementById('mathlab-completion-modal')?.remove();
      document.getElementById('comp-btn-restart')?.addEventListener('click', () => { close(); this.resetGame(); });
      document.getElementById('comp-btn-home')?.addEventListener('click', () => {
        e = { preventDefault: () => {} };
        close();
        this.destroy();
        if (window.LegacyBridge && typeof window.LegacyBridge.backHome === 'function') {
          try { window.LegacyBridge.backHome(); return; } catch(err){}
        }
        const topBottomHome = document.getElementById('mathlab-floating-home') || document.querySelector('#legacy-back-home-btn') || document.querySelector('.floating-home');
        if (topBottomHome) topBottomHome.click();
        else if (typeof window.MathLabRenderHome === 'function') window.MathLabRenderHome();
        else if (typeof window.goHome === 'function') window.goHome();
        else location.reload();
      });
    },

    runSimulation() {
      if (this.state.isSimulating) return;
      this.state.isSimulating = true;
      this.state.simDays = [];
      this.state.simFound = false;
      this.render();
      
      const n = this.state.rooms[this.state.roomIdx];
      const speed = n > 30 ? 20 : 80; 
      let count = 0;
      const seen = new Set();
      
      const step = () => {
        if (count >= n || this.state.simFound) {
            this.finishSimulation(n);
            return;
        }
        
        const day = Math.floor(Math.random() * 365) + 1;
        const isMatch = seen.has(day);
        
        this.state.simDays.push({ day, isMatch });
        seen.add(day);
        
        if (isMatch) {
            this.state.simFound = true;
        }
        
        this.renderSimOnly();
        count++;
        
        if (!this.state.simFound) {
            const t = setTimeout(step, speed);
            this.timers.push(t);
        } else {
            const t = setTimeout(() => this.finishSimulation(n), 600);
            this.timers.push(t);
        }
      };
      
      step();
    },
    
    finishSimulation(n) {
      this.state.isSimulating = false;
      this.state.roomFinished = true;
      
      const theoryProb = getTheoreticalProb(n);
      const err = Math.abs(this.state.predictVal - theoryProb);
      this.state.errorPercent = err;
      
      let pts = getScoreForError(err);
      if (this.state.hintUsed) pts = Math.min(pts, 70);
      
      if (err <= 10) {
        this.state.combo++;
        if (this.state.combo >= 3) {
            pts += 50;
            this.state.combo = 0;
        }
      } else {
        this.state.combo = 0;
      }
      
      this.state.score += pts;
      this.render();
    },

    renderSimOnly() {
        const root = this.container.querySelector('.game-birthday-paradox');
        if (!root) return;
        const simLog = root.querySelector('.sim-log');
        if (simLog) {
            simLog.innerHTML = this.state.simDays.map(d => `<span class="${d.isMatch ? 'match' : ''}">${d.day}일</span>`).join('');
        }
    },

    render() {
      const isCleared = this.state.roomIdx >= this.state.rooms.length;
      if (isCleared) return;

      const n = this.state.rooms[this.state.roomIdx];
      const theoryStr = getTheoreticalProb(n).toFixed(1);
      const errStr = this.state.errorPercent.toFixed(1);
      const isBad = this.state.errorPercent > 10;

      const html = `
        <div class="game-birthday-paradox">
          <div class="header">
            <div class="title-area">
                            <h2>🎂 생일 패러독스 확률 실험실</h2>
              <p>여사건의 원리를 통해 직관과 실제 수학적 확률의 놀라운 차이를 체험해보세요!</p>
              
            </div>
            <div class="stats">
              <div>🔬 실험 단계: <strong>${this.state.roomIdx + 1} / ${this.state.rooms.length}</strong></div>
              <div>👥 표본 규모: <strong>${n}명</strong></div>
              <div style="color:#7e22ce;">📊 상태: <strong>${this.state.roomFinished ? '관찰 완료' : '예측 탐구 중'}</strong></div>
            </div>
          </div>
          
          <div style="background:#fff7ed; color:#c2410c; padding:12px 16px; border-radius:12px; font-size:1rem; margin-bottom:24px; text-align:center; border:1px solid #ffedd5; font-weight:700;">
            💡 <strong>교과개념 탐구 안내 (명예의 전당 미사용):</strong> 10명부터 50명까지 집단 규모를 변경하며, 시뮬레이션을 통해 여사건 확률의 비선형적 성장 궤적을 실습해보세요!
          </div>
          
          <div class="main-layout">
            <div class="game-area">
              <div class="card">
                <div class="room-info">🔬 현재 표본 집단 인원: ${n}명</div>
                <p style="text-align:center; color:#4b5563; font-size:1.1rem; margin-top:0; font-weight:700;">이 표본 집단 내에서 생일이 같은 사람이 2명 이상 존재할 확률은 얼마나 될까요?</p>
                
                <div class="predict-area" style="display: ${this.state.roomFinished || this.state.isSimulating ? 'none' : 'flex'};">
                  <div class="predict-val">${this.state.predictVal}%</div>
                  <input type="range" min="0" max="100" value="${this.state.predictVal}" id="bp-slider">
                  <div style="color:#9ca3af; font-size:0.9rem; font-weight:600;">슬라이더를 좌우로 움직여 확률을 예측해보세요.</div>
                  <button class="btn-primary" id="bp-btn-sim" style="margin-top:8px;">🚀 시뮬레이션 시작</button>
                </div>
                
                <div class="sim-area" style="display: ${this.state.isSimulating || this.state.roomFinished ? 'flex' : 'none'};">
                  <div class="sim-log">
                    ${this.state.simDays.map(d => `<span class="${d.isMatch ? 'match' : ''}">${d.day}일</span>`).join('')}
                  </div>
                  ${this.state.isSimulating ? '<div style="margin-top:16px; color:#6b7280; font-weight:bold; animation: pulse 1.5s infinite;">표본 집단 구성원의 생일 데이터를 가상 추출하는 중... 📊🔍</div>' : ''}
                </div>
                
                <div class="result-area ${this.state.roomFinished ? 'show ' + (isBad ? 'bad' : '') : ''}">
                  <h3 style="margin-top:0; font-size:1.4rem;">${this.state.simFound ? '🎉 같은 생일 발견!' : '❌ 모두 생일이 다름!'}</h3>
                  <p style="font-size:1.1rem;">이론적 확률: <strong>${theoryStr}%</strong></p>
                  <p style="font-size:1.1rem;">나의 예측: <strong>${this.state.predictVal}%</strong> (오차: ${errStr}%p)</p>
                  <p style="color: ${isBad ? '#991b1b' : '#166534'}; font-weight:800; margin-top:8px;">
                    ${isBad ? '⚠️ 예측 오차가 너무 큽니다! 집단 규모가 증가할 때 일치 확률은 직관보다 훨씬 가파르게 상승함을 기하급수적으로 고려해보세요.' : '✨ 훌륭한 예측입니다! 점수를 획득했습니다.'}
                  </p>
                  
                  <button class="btn-secondary" id="bp-btn-detail" style="margin-top:12px; font-size:0.95rem;">📚 이론적 확률 계산 원리 보기</button>
                  <div class="detail-box" id="bp-detail-box">
                    <h4 style="margin-top:0; color:#1e3a8a; font-size:1.1rem;">왜 확률이 ${theoryStr}%나 될까요?</h4>
                    <p style="line-height:1.5;">우리는 무의식적으로 <strong>'나와 같은 생일'</strong>을 가진 사람을 찾으려 하지만, 사실 방 안의 <strong>'아무나 두 명'</strong>만 생일이 같아도 됩니다. 이를 쉽게 계산하려면 <strong>여사건(반대 사건)</strong>을 이용해 <strong>모두가 생일이 다를 확률</strong>을 먼저 구합니다.</p>
                    <ul style="padding-left:20px;">
                      <li>첫 번째 사람의 생일은 무엇이든 상관없습니다: $ \\frac{365}{365} $</li>
                      <li>두 번째 사람은 첫 번째 사람과 달라야 합니다: $ \\frac{364}{365} $</li>
                      <li>세 번째 사람은 앞의 두 사람과 달라야 합니다: $ \\frac{363}{365} $</li>
                      <li>이 과정을 ${n}번째 사람까지 계속 곱하면 <strong>'모두 다를 확률'</strong>이 됩니다.</li>
                    </ul>
                    <div style="text-align:center; margin:16px 0; font-size:1.1rem;">
                      $ P(\\text{모두 다름}) = \\frac{365}{365} \\times \\frac{364}{365} \\times \\cdots \\times \\frac{365-${n}+1}{365} $
                    </div>
                    <p style="line-height:1.5;">따라서 <strong>'적어도 두 명이 같은 생일일 확률'</strong>은 전체 확률(1)에서 위 값을 빼면 됩니다.</p>
                    <div style="text-align:center; font-weight:bold; color:#b91c1c; font-size:1.2rem; margin-top:12px;">
                      $ P(\\text{같음}) = 1 - P(\\text{모두 다름}) \\approx ${theoryStr}\\% $
                    </div>
                  </div>
                </div>
              </div>
              
              <div class="hint-box" style="display: ${this.state.hintUsed ? 'block' : 'none'};">
                <h4 style="margin-top:0; color:#b45309; font-size:1.2rem;">💡 여사건 힌트 (최대 70점 제한)</h4>
                <p style="margin-bottom:8px; line-height:1.5;">"같은 생일이 있을 확률"을 직접 구하기보다 <strong>"모두 생일이 다를 확률"</strong>을 구해서 1에서 빼는 것이 계산하기 쉽습니다.</p>
                <div class="math-target" style="text-align:center; font-size:1.2rem; padding:8px 0;">
                  $ P = 1 - \\frac{365 \\times 364 \\times \\cdots \\times (365-${n}+1)}{365^{${n}}} $
                </div>
              </div>
              
              <div class="controls" style="display:flex; gap:10px; align-items:center;">
                <button class="btn-secondary" id="bp-btn-hint" ${this.state.roomFinished || this.state.isSimulating ? 'disabled' : ''}>💡 힌트 보기 (-페널티)</button>
                <button class="btn-primary" id="bp-btn-next" style="display: ${this.state.roomFinished ? 'inline-block' : 'none'}; margin-left:auto;">
                  ${this.state.roomIdx === this.state.rooms.length - 1 ? '🏆 최종 탐구 완료 및 명예의 전당 ➔' : '다음 실험 단계로 ➔'}
                </button>
              </div>
            </div>
            
            <div class="sidebar">
              <div class="card" style="padding:20px; text-align:center; border:2px solid #c084fc; background:#faf5ff;">
                <div style="font-size:36px; margin-bottom:8px;">📖✨</div>
                <h3 style="margin:0 0 10px; font-size:1.15rem; color:#581c87; font-weight:900;">사용설명서 & 교과 개념</h3>
                <p style="font-size:0.9rem; color:#6b7280; margin:0 0 16px; line-height:1.4;">생일 패러독스의 수학적 배경(여사건의 원리)과 본 앱의 탐구 사용 방법을 팝업 모달로 바로 확인하세요.</p>
                <button type="button" id="bp-btn-manual" style="width:100%; padding:14px; background:#6b21a8; color:#ffffff; font-weight:800; border:none; border-radius:14px; font-size:15px; cursor:pointer; box-shadow:0 4px 12px rgba(107,33,168,0.3);">📖 사용설명서 및 개념 열기</button>
              </div>
              
              <div class="card" style="padding:16px;">
                <h3 style="margin-top:0; font-size:1rem; color:#475569; margin-bottom:12px; text-align:center;">🔧 탐구 제어</h3>
                <button class="btn-secondary" style="width:100%; margin-bottom:10px; padding:12px; font-weight:800;" id="bp-btn-reset">🔄 다시 시작</button>
                <!-- 🚨 [패치 완료] 홈으로 버튼 안전 연동 -->
                <button class="btn-secondary" style="width:100%; padding:12px; background:#9333ea; color:#ffffff;" id="bp-btn-home">🏠 홈으로</button>
              </div>
            </div>
          </div>
        </div>
      `;
      this.container.innerHTML = html;
      this.bindEvents();
      this.loadLeaderboard();
      
      if (this.state.hintUsed && typeof window.renderMathInElement === 'function') {
        const hintEl = this.container.querySelector('.math-target');
        if (hintEl && (hintEl.textContent || '').includes('$')) {
          window.renderMathInElement(hintEl, false);
        }
      }
    },

    bindEvents() {
      const root = this.container.querySelector('.game-birthday-paradox');
      if (!root) return;
      
      const slider = root.querySelector('#bp-slider');
      if (slider) {
        slider.addEventListener('input', (e) => {
          this.state.predictVal = parseInt(e.target.value, 10);
          root.querySelector('.predict-val').textContent = this.state.predictVal + '%';
        });
      }
      
      const btnSim = root.querySelector('#bp-btn-sim');
      if (btnSim) btnSim.addEventListener('click', () => this.runSimulation());
      
      const btnNext = root.querySelector('#bp-btn-next');
      if (btnNext) btnNext.addEventListener('click', () => this.nextRoom());
      
      const btnHint = root.querySelector('#bp-btn-hint');
      if (btnHint) btnHint.addEventListener('click', () => {
        this.state.hintUsed = true;
        this.render();
      });
      
      const btnReset = root.querySelector('#bp-btn-reset');
      if (btnReset) btnReset.addEventListener('click', () => this.reset());
      
      const btnDetail = root.querySelector('#bp-btn-detail');
      if (btnDetail) {
        btnDetail.addEventListener('click', () => {
          const detailBox = root.querySelector('#bp-detail-box');
          if (detailBox) {
            const isHidden = detailBox.style.display === 'none' || detailBox.style.display === '';
            detailBox.style.display = isHidden ? 'block' : 'none';
            if (isHidden && typeof window.renderMathInElement === 'function') {
              window.renderMathInElement(detailBox, false);
            }
          }
        });
      }

            const btnHome = root.querySelector('#bp-btn-home');
      if (btnHome) {
        btnHome.addEventListener('click', (e) => {
          e.preventDefault();
          this.destroy();
          if (window.LegacyBridge && typeof window.LegacyBridge.backHome === 'function') {
            try { window.LegacyBridge.backHome(); return; } catch(err) {}
          }
          const topBottomHome = document.getElementById('mathlab-floating-home') || document.querySelector('#legacy-back-home-btn') || document.querySelector('.floating-home');
          if (topBottomHome) topBottomHome.click();
          else if (typeof window.MathLabRenderHome === 'function') window.MathLabRenderHome();
          else if (typeof window.goHome === 'function') window.goHome();
          else location.reload();
        });
      }
      
      const btnManual = root.querySelector('#bp-btn-manual');
      if (btnManual) {
        btnManual.addEventListener('click', () => this.showConceptModal());
      }
    },
    
    showConceptModal() {
      document.getElementById('mathlab-concept-modal')?.remove();
      document.getElementById('mathlab-completion-modal')?.remove();
      const modalHtml = `
        <div id="mathlab-concept-modal" style="position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(15,23,42,0.85); backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center; z-index:999999; padding:20px; box-sizing:border-box; font-family:'Pretendard',sans-serif;">
          <div style="background:#ffffff; border-radius:24px; padding:30px 26px; max-width:620px; width:100%; max-height:88vh; overflow-y:auto; box-shadow:0 25px 50px rgba(0,0,0,0.5); border:3px solid #4338ca; text-align:left;">
            <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid #e2e8f0; padding-bottom:14px; margin-bottom:18px;">
              <h2 style="margin:0; font-size:22px; font-weight:900; color:#1e293b;">📖 생일 패러독스 사용설명서 & 교과개념</h2>
              <button id="concept-close-btn" style="background:#f1f5f9; border:none; color:#64748b; font-size:20px; font-weight:bold; width:36px; height:36px; border-radius:18px; cursor:pointer;">✕</button>
            </div>
            <div style="color:#334155; font-size:15px; line-height:1.65;">
              <h3 style="color:#4338ca; font-size:17px; margin:0 0 8px; font-weight:800;">💡 왜 '패러독스(역설)'라고 불릴까요?</h3>
              <p style="margin:0 0 16px;">1년은 365일이므로, 누군가와 생일이 겹치려면 사람이 아주 많이 모여야 할 것 같다는 생각이 듭니다. 하지만 놀랍게도 <strong>단 23명</strong>만 모여도 생일이 일치하는 한 쌍이 존재할 확률이 <strong>50.7%</strong>로 절반을 넘고, <strong>50명</strong>이 모이면 <strong>97.0%</strong>에 달합니다! 직관적 생각과 실제 계산된 확률 사이의 괴리 때문에 역설(Paradox)이라고 부릅니다.</p>
              
              <h3 style="color:#4338ca; font-size:17px; margin:0 0 8px; font-weight:800;">📐 교과 수학 원리: '여사건의 확률'</h3>
              <p style="margin:0 0 10px;">우리가 무의식적으로 계산하는 것은 '나와 생일이 같을 확률'이지만, 문제의 핵심은 방 안의 <strong>'임의의 두 사람(누구든)'</strong>의 생일이 같으면 된다는 점입니다.<br>이 사건을 직접 계산하기는 매우 까다로우므로, 반대되는 <strong>여사건(모든 사람의 생일이 서로 다를 확률)</strong>을 먼저 구하여 전체 확률 1에서 뺍니다.</p>
              <div style="background:#f8fafc; padding:12px 16px; border-radius:12px; border:1px solid #cbd5e1; margin-bottom:16px; font-family:monospace; text-align:center; color:#1e293b; font-weight:700;">
                P(2명 이상 일치) = 1 - P(모든 사람의 생일이 다름)<br>
                = 1 - [(365/365) × (364/365) × (363/365) × ··· × (365 - n + 1)/365]
              </div>
              
              <h3 style="color:#4338ca; font-size:17px; margin:0 0 8px; font-weight:800;">🕹️ 앱 사용설명서 (탐구 및 관찰 방법)</h3>
              <ol style="padding-left:20px; margin:0 0 16px; line-height:1.6;">
                <li><strong>집단 규모 선택 및 예측:</strong> 10명부터 50명까지 7개 단계로 표본이 주어집니다. 슬라이더를 움직여 해당 인원에서 생일이 겹칠 확률을 예측해봅니다.</li>
                <li><strong>시뮬레이션 가동:</strong> '🚀 시뮬레이션 시작' 버튼을 누르면 인원에 맞는 가상의 생일 데이터를 즉시 추출하여 실제 일치 여부를 대조합니다.</li>
                <li><strong>여사건 원리 도출:</strong> '📚 이론적 확률 계산 원리 보기' 및 '💡 여사건 계산 원리 힌트'를 열어, 왜 23명만 모여도 일치 확률이 절반을 넘는지 수식으로 학습합니다.</li>
                <li><strong>명예의 전당 미사용 안내:</strong> 본 앱은 경쟁 게임이 아닌 교과개념 탐구 실습 전용이므로 랭킹 시스템을 사용하지 않으며 7단계 완료 시 탐구 결론 리포트가 열립니다.</li>
              </ol>
            </div>
            <button id="concept-confirm-btn" style="width:100%; margin-top:20px; padding:14px; background:#4338ca; color:#fff; font-size:16px; font-weight:800; border:none; border-radius:14px; cursor:pointer;">✨ 개념 완벽 이해 및 실습 계속하기</button>
          </div>
        </div>
      `;
      document.body.insertAdjacentHTML('beforeend', modalHtml);
      const close = () => document.getElementById('mathlab-concept-modal')?.remove();
      document.getElementById('mathlab-completion-modal')?.remove();
      document.getElementById('concept-close-btn')?.addEventListener('click', close);
      document.getElementById('concept-confirm-btn')?.addEventListener('click', close);
    },

    loadLeaderboard() {
      try {
        if (typeof window.loadGameLeaderboard === 'function') {
          window.loadGameLeaderboard('생일 패러독스 확률 실험실', true, 'bp-leaderboard-container');
        } else {
          const localRanks = JSON.parse(localStorage.getItem('rank_bp-leaderboard-container') || '[]');
          this.renderRankList(localRanks.slice(0, 5));
        }
      } catch (e) {
        console.error('[BirthdayParadox] 명예의 전당 로드 오류:', e);
        const localRanks = JSON.parse(localStorage.getItem('rank_bp-leaderboard-container') || '[]');
        this.renderRankList(localRanks.slice(0, 5));
      }
    },

    renderRankList(ranks) {
      const el = this.container?.querySelector('#bp-leaderboard-container');
      if (!el) return;

      if (!ranks || ranks.length === 0) {
        el.innerHTML = '<div style="text-align:center; color:#94a3b8; padding: 12px 0;">아직 등록된 랭킹이 없습니다. 첫 주인공이 되어보세요!</div>';
        return;
      }

      el.innerHTML = ranks.map((r, i) => `
        <div class="rank-item">
          <div><span class="rank-num">${i + 1}위</span> ${escapeHTML(r.nickname || '익명')}</div>
          <div class="rank-score">${r.score || 0}점</div>
        </div>
      `).join('');
    },

    destroy() {
      if (window.MathLabCleanup && typeof window.MathLabCleanup.clearTimers === 'function') {
        window.MathLabCleanup.clearTimers(this.timers);
      }
      this.timers.forEach(clearTimeout);
      this.timers = [];
      document.getElementById('mathlab-inline-ranking-modal')?.remove();
      document.getElementById('mathlab-concept-modal')?.remove();
      document.getElementById('mathlab-completion-modal')?.remove();
      const host = document.getElementById('birthday-paradox-force-host'); if (host) host.remove();
      if (this.container) this.container.innerHTML = '';
      this.container = null;
    }
  };

  if (!window.MathLabGames) {
    window.MathLabGames = {
      registry: {},
      register(app) { this.registry[app.id] = app; },
      mount(id, container, context) {
        if (this.registry[id]) this.registry[id].mount(container, context);
      }
    };
  }
  
  window.BirthdayParadoxGame = BirthdayParadoxGame;
  
  function registerBirthdayParadox() {
    if (window.MathLabGames && typeof window.MathLabGames.register === 'function') {
      BirthdayParadoxGame.title = '생일 패러독스 확률 실험실';
      BirthdayParadoxGame.icon = '🎂';
      BirthdayParadoxGame.category = 'concept'; // 🚨 교과개념 앱 (명예의 전당 미사용)
      BirthdayParadoxGame.type = 'concept';
      BirthdayParadoxGame.sourceType = 'concept';
      BirthdayParadoxGame.description = '여사건의 확률 원리를 탐구하고, 사용설명서와 시뮬레이션을 통해 직관과 수학적 확률의 차이를 체험하는 교과개념 실습 앱 (명예의 전당 미사용)';
      window.MathLabGames.register(BirthdayParadoxGame);
    }
  }
  
  registerBirthdayParadox();
  document.addEventListener('DOMContentLoaded', registerBirthdayParadox);
  setTimeout(registerBirthdayParadox, 300);

  window.launchBirthdayParadoxGame = function() {
    if (typeof window.MathLabGames !== 'undefined' && typeof window.MathLabGames.mount === 'function') {
      try {
        window.MathLabGames.mount('birthday-paradox');
        return;
      } catch(e) {
        console.warn('MathLabGames mount 실패, 직접 마운트 시도:', e);
      }
    }
    const target = document.getElementById('mathlab-view') || document.getElementById('new-root') || document.body;
    BirthdayParadoxGame.mount(target);
  };
})();
</script>
