<script>
  window.MathLabConcepts = (function () {
    const concepts = new Map();

    return {
      register(concept) {
        if (!concept || !concept.id) {
          throw new Error('개념 앱 id가 없습니다.');
        }

        if (concepts.has(concept.id)) {
          concepts.set(concept.id, concept);
          return;
        }

        concepts.set(concept.id, concept);
      },

      get(id) {
        return concepts.get(id);
      },

      all() {
        return Array.from(concepts.values());
      },

      mount(id, context = {}) {
        const concept = concepts.get(id);

        if (!concept) {
          throw new Error('Unknown concept app: ' + id);
        }

        const modalOverlay = document.getElementById('mathlab-global-modal-overlay');
        const defaultContainer = document.getElementById('mathlab-global-modal-content') || document.getElementById('mathlab-view') || document.getElementById('new-root') || document.body;
        
        if (modalOverlay) {
          modalOverlay.classList.remove('hidden');
          document.body.style.overflow = 'hidden';
        }
        return concept.mount(defaultContainer, context);
      }
    };
  })();
</script>
