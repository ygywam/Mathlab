<style>
/* Gen-3 수학 실험실 표준 테마 (Premium Light) */
#tax-elec-container {
  background: #ffffff;
  color: #1e293b;
  padding: 24px;
  border-radius: 16px;
  max-width: 1000px;
  margin: 0 auto;
  box-shadow: 0 10px 25px rgba(0,0,0,0.1);
  border: 1px solid #e2e8f0;
}
#tax-elec-container .app-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  border-bottom: 1px solid #e2e8f0;
  padding-bottom: 15px;
}
#tax-elec-container .app-header h1 {
  margin: 0;
  font-size: 2rem;
  color: #0f172a;
}
#tax-elec-container .header-btns {
  display: flex;
  gap: 10px;
}
#tax-elec-container .tax-btn {
  background: #f1f5f9;
  color: #334155;
  border: 1px solid #cbd5e1;
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
  transition: all 0.2s;
}
#tax-elec-container .tax-btn:hover { background: #e2e8f0; }
#tax-elec-container .tax-btn.primary {
  background: #3b82f6;
  color: #ffffff;
  border-color: #2563eb;
}
#tax-elec-container .tax-btn.primary:hover { background: #2563eb; }

#tax-elec-container .tax-elec-tabs {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
}
#tax-elec-container .tax-elec-tabs button {
  flex: 1;
  padding: 15px;
  background: #f8fafc;
  color: #475569;
  border: 2px solid #cbd5e1;
  border-radius: 10px;
  cursor: pointer;
  font-weight: bold;
  font-size: 1.1rem;
  transition: all 0.3s ease;
}
#tax-elec-container .tax-elec-tabs button.active {
  background: rgba(59, 130, 246, 0.1);
  color: #3b82f6;
  border-color: #3b82f6;
}

#tax-elec-container .chart-wrapper {
  background: #ffffff;
  border: 1px solid #e2e8f0;
  border-radius: 12px;
  padding: 15px;
  margin-bottom: 20px;
  height: 400px;
  box-shadow: 0 4px 6px rgba(0,0,0,0.02);
}

#tax-elec-container .sliders-wrapper {
  background: #f8fafc;
  border: 1px solid #e2e8f0;
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 20px;
}
#tax-elec-container .sliders-wrapper.hidden { display: none; }
#tax-elec-container .slider-group label {
  display: block;
  font-weight: bold;
  margin-bottom: 15px;
  color: #475569;
  font-size: 1.1rem;
}
#tax-elec-container .slider-group input[type="range"] {
  width: 100%;
  accent-color: #3b82f6;
  height: 8px;
}

#tax-elec-container .calc-board {
  background: #ffffff;
  border: 1px solid #e2e8f0;
  border-radius: 12px;
  padding: 20px;
  box-shadow: 0 4px 6px rgba(0,0,0,0.02);
}
#tax-elec-container .formula-title {
  color: #3b82f6;
  font-weight: bold;
  margin-bottom: 10px;
  font-size: 1.2rem;
}
#tax-elec-container .formula-math {
  color: #1e293b;
  font-size: 1.3rem;
  padding: 15px;
  background: #f1f5f9;
  border-radius: 8px;
  min-height: 50px;
  overflow-x: auto;
  margin-bottom: 15px;
  border: 1px solid #e2e8f0;
}
#tax-elec-container .survey-result {
  color: #d97706;
  font-size: 1.1rem;
  line-height: 1.6;
  border-top: 1px dashed #cbd5e1;
  padding-top: 15px;
}

/* Modal */
#tax-modal-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 99999;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}
#tax-modal-overlay.show {
  opacity: 1;
  pointer-events: auto;
}
.tax-modal-content {
  background: #ffffff;
  color: #1e293b;
  padding: 30px;
  border-radius: 16px;
  max-width: 500px;
  width: 90%;
  border: 1px solid #e2e8f0;
  box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
  line-height: 1.6;
}
.tax-modal-content h2 { color: #3b82f6; margin-top: 0; }
.tax-modal-content ul { padding-left: 20px; color: #475569; }
.tax-modal-content li { margin-bottom: 10px; }
</style>

<script>
const ConceptTaxElecApp = (function() {
  let taxElecChart = null;
  let currentTaxMode = 'tax';
  let taxElecRafId = null;
  let lastTaxElecFormula = '';

  function mount(container, context = {}) {
    let host = null;
    if (typeof container === 'string') host = document.querySelector(container);
    else if (container instanceof HTMLElement) host = container;
    if (!host) host = window.MathLabUtils?.getMountContainer ? window.MathLabUtils.getMountContainer(container) : document.getElementById('mathlab-view');
    if (!host || !(host instanceof HTMLElement)) host = document.getElementById('new-root') || document.getElementById('game-container') || document.getElementById('mathlab-view');

    if (!host || !(host instanceof HTMLElement) || host === document.body) {
      let createdHost = document.getElementById('tax-elec-force-host');
      if (!createdHost) {
        createdHost = document.createElement('div');
        createdHost.id = 'tax-elec-force-host';
        document.body.appendChild(createdHost);
      }
      host = createdHost;
    }

    const footerEl = document.querySelector('footer, #footer, .app-footer') || 
                     Array.from(document.querySelectorAll('div, p, span')).find(el => el.textContent && el.textContent.includes('2026 기록조율사'));
    if (footerEl && host && typeof host.compareDocumentPosition === 'function' && (host.compareDocumentPosition(footerEl) & Node.DOCUMENT_POSITION_PRECEDING)) {
      footerEl.parentNode.insertBefore(host, footerEl);
    }

    host.style.display = '';
    host.style.visibility = 'visible';
    host.style.opacity = '1';

    let parent = host.parentElement;
    while (parent && parent !== document.body && parent !== document.documentElement) {
      if (parent.style && parent.style.display === 'none') parent.style.display = 'block';
      if (parent.style && parent.style.visibility === 'hidden') parent.style.visibility = 'visible';
      parent = parent.parentElement;
    }

    document.querySelectorAll('header, .navbar, #app-header, .top-bar, #floating-home-btn, .floating-home').forEach(el => {
      if (el && el.style && el.style.display === 'none') el.style.display = '';
    });

    // 템플릿 리터럴 마크다운 백틱 사용 금지 (Gen-3 규격)
    host.innerHTML = `
      <div id="tax-elec-container">
        <div class="app-header">
          <h1>생활 속 함수 💳</h1>
          <div class="header-btns">
            <button class="tax-btn primary" onclick="ConceptTaxElecApp.showGuide()">📖 개념 가이드</button>
            <button class="tax-btn" onclick="ConceptTaxElecApp.goHome()">🏠 홈으로</button>
          </div>
        </div>
        
        <p style="color:#94a3b8; margin-bottom: 20px;">구간별 함수(조건부 함수)가 실생활 세금과 요금에 어떻게 적용되는지 확인해봅시다.</p>
        
        <div class="tax-elec-tabs" id="tax-tabs">
          <button class="tab-btn active" onclick="ConceptTaxElecApp.switchTaxElec('tax')" id="tab-tax">종합소득세 (누진세)</button>
          <button class="tab-btn" onclick="ConceptTaxElecApp.switchTaxElec('elec')" id="tab-elec">전기요금 (누진제)</button>
        </div>
        
        <div class="chart-wrapper">
          <canvas id="taxElecChart"></canvas>
        </div>
        
        <div class="sliders-wrapper" id="sliders-tax">
          <div class="slider-group">
            <label for="slider-tax-x">나의 과세표준(만원): <span id="val-tax-x" style="color:#38bdf8;">3000</span> 만원</label>
            <input type="range" id="slider-tax-x" min="1000" max="15000" step="100" value="3000" oninput="ConceptTaxElecApp.updateTaxElec()">
          </div>
        </div>
        
        <div class="sliders-wrapper hidden" id="sliders-elec">
          <div class="slider-group">
            <label for="slider-elec-x">월간 전력 사용량 (kWh): <span id="val-elec-x" style="color:#38bdf8;">350</span> kWh</label>
            <input type="range" id="slider-elec-x" min="0" max="800" step="10" value="350" oninput="ConceptTaxElecApp.updateTaxElec()">
          </div>
          <div class="slider-group" style="grid-column: 1 / -1; display:flex; align-items:center; gap:10px; margin-top:10px; background:#f1f5f9; padding:15px; border-radius:8px; border:1px solid #cbd5e1;">
            <input type="checkbox" id="chk-multi-child" onchange="ConceptTaxElecApp.updateTaxElec()" style="width:20px; height:20px; margin:0;">
            <label for="chk-multi-child" style="margin:0; cursor:pointer; color:#1e293b;">👶👶👶 3자녀 이상 다자녀 가구 할인 (30% 할인)</label>
          </div>
        </div>
        
        <div class="calc-board">
          <div class="formula-title" id="tax-title">수학적 표현 (조건부 함수)</div>
          <div class="formula-math" id="tax-formula"></div>
          <div class="survey-result" id="tax-desc">...</div>
        </div>
      </div>

      <!-- Guide Modal -->
      <div id="tax-modal-overlay" class="tax-elec-modal-overlay">
        <div class="tax-modal-content">
          <h2>💡 생활 속 함수 가이드</h2>
          <p>종합소득세와 전기요금은 <strong>조건부 함수(Piecewise function)</strong>의 완벽한 실생활 사례입니다.</p>
          <ul>
            <li><strong>누진세(종합소득세)</strong>: 소득 구간(과세표준)이 높아질수록 더 높은 세율이 적용되는 계단식 함수입니다. 부의 재분배를 위한 수학적 장치입니다.</li>
            <li><strong>누진제(전기요금)</strong>: 전기를 많이 쓸수록 단가가 급격히 상승하는 함수입니다. 에너지 절약을 유도하기 위해 설계되었습니다.</li>
          </ul>
          <p style="color:#facc15; font-size:0.95rem; margin-top:15px;">슬라이더를 움직여 x축(입력값)이 변할 때 구간에 따라 적용되는 식이 어떻게 달라지는지 관찰해 보세요!</p>
          <div style="text-align:right; margin-top:20px;">
            <button class="close-btn" onclick="ConceptTaxElecApp.hideGuide()">닫기</button>
          </div>
        </div>
      </div>
    `;

    initTaxElecApp();
  }

  function initTaxElecApp() {
    if (taxElecChart) taxElecChart.destroy();

    const canvas = document.getElementById('taxElecChart');
    if (!canvas) return;

    taxElecChart = new Chart(canvas.getContext('2d'), {
      type: 'line',
      data: {
        datasets: [
          {
            label: '누진 부과액 (f(x))',
            data: [],
            borderColor: '#38bdf8',
            backgroundColor: 'rgba(56, 189, 248, 0.1)',
            borderWidth: 3,
            pointRadius: 0,
            fill: true
          },
          {
            label: '나의 현재 위치',
            data: [],
            backgroundColor: '#facc15',
            borderColor: '#facc15',
            pointRadius: 8,
            pointHoverRadius: 10,
            showLine: false
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: false,
        scales: {
          x: { 
            type: 'linear', 
            min: 0,
            grid: { color: '#334155' },
            ticks: { color: '#94a3b8' }
          },
          y: { 
            min: 0,
            grid: { color: '#334155' },
            ticks: { color: '#94a3b8' }
          }
        },
        plugins: {
          legend: { labels: { color: '#cbd5e1' } }
        }
      }
    });

    switchTaxElec('tax');
  }

  function switchTaxElec(mode) {
    currentTaxMode = mode;

    document.getElementById('tab-tax').classList.remove('active');
    document.getElementById('tab-elec').classList.remove('active');
    
    if (mode === 'tax') {
      document.getElementById('tab-tax').classList.add('active');
      document.getElementById('sliders-tax').classList.remove('hidden');
      document.getElementById('sliders-elec').classList.add('hidden');
    } else {
      document.getElementById('tab-elec').classList.add('active');
      document.getElementById('sliders-tax').classList.add('hidden');
      document.getElementById('sliders-elec').classList.remove('hidden');
    }

    lastTaxElecFormula = '';
    updateTaxElec();
  }

  function updateTaxElec() {
    const taxSlider = document.getElementById('slider-tax-x');
    const elecSlider = document.getElementById('slider-elec-x');

    if (taxSlider && document.getElementById('val-tax-x')) {
      document.getElementById('val-tax-x').innerText = taxSlider.value;
    }

    if (elecSlider && document.getElementById('val-elec-x')) {
      document.getElementById('val-elec-x').innerText = elecSlider.value;
    }

    if (taxElecRafId) return;

    taxElecRafId = requestAnimationFrame(() => {
      taxElecRafId = null;
      renderTaxElec();
    });
  }

  function renderTaxElec() {
    if (!taxElecChart) return;

    let lineData = [];
    let myPoint = [];
    let fText = '';
    let descText = '';

    if (currentTaxMode === 'tax') {
      const targetX = parseFloat(document.getElementById('slider-tax-x').value);

      const getTax = (x) => {
        if (x <= 1400) return x * 0.06;
        else if (x <= 5000) return x * 0.15 - 126;
        else if (x <= 8800) return x * 0.24 - 576;
        else return x * 0.35 - 1544;
      };

      for (let x = 0; x <= 15000; x += 500) {
        lineData.push({ x: x, y: getTax(x) });
      }

      myPoint.push({ x: targetX, y: getTax(targetX) });
      taxElecChart.options.scales.x.max = 15000;

      fText = `f(x) = \\begin{cases} 0.06x & (x \\leq 1400) \\\\ 0.15x - 126 & (1400 < x \\leq 5000) \\\\ 0.24x - 576 & (5000 < x \\leq 8800) \\\\ 0.35x - 1544 & (x > 8800) \\end{cases}`;
      descText = `연봉(과세표준)이 <strong>${targetX.toLocaleString()}만원</strong>일 때, ➔ 예상 산출 세액은 <strong style="color:#34d399; font-size:1.3rem;">${Math.round(getTax(targetX)).toLocaleString()}만원</strong> 입니다.`;
    } else {
      const targetX = parseFloat(document.getElementById('slider-elec-x').value);
      const isMultiChild = document.getElementById('chk-multi-child').checked;

      const getElec = (x) => {
        let bill = 0;
        if (x <= 300) {
          bill = 910 + (x * 120.0);
        } else if (x <= 450) {
          bill = 1600 + (300 * 120.0) + ((x - 300) * 214.6);
        } else {
          bill = 7300 + (300 * 120.0) + (150 * 214.6) + ((x - 450) * 307.3);
        }

        if (isMultiChild) {
          const discount = Math.min(bill * 0.3, 16000);
          bill -= discount;
        }
        return bill;
      };

      for (let x = 0; x <= 800; x += 20) {
        lineData.push({ x: x, y: getElec(x) });
      }

      myPoint.push({ x: targetX, y: getElec(targetX) });
      taxElecChart.options.scales.x.max = 800;

      fText = `f(x) = \\begin{cases} 120x + 910 & (x \\leq 300) \\\\ 214.6(x-300) + 37600 & (300 < x \\leq 450) \\\\ 307.3(x-450) + 77090 & (x > 450) \\end{cases}`;
      descText = `전력 사용량이 <strong>${targetX.toLocaleString()}kWh</strong>일 때, ➔ 예상 청구 요금은 <strong style="color:#34d399; font-size:1.3rem;">${Math.round(getElec(targetX)).toLocaleString()}원</strong> 입니다.`;
    }

    taxElecChart.data.datasets[0].data = lineData;
    taxElecChart.data.datasets[1].data = myPoint;
    taxElecChart.update('none');

    if (fText !== lastTaxElecFormula) {
      if (typeof katex !== 'undefined') {
        katex.render(fText, document.getElementById('tax-formula'), { throwOnError: false, displayMode: true });
      } else {
        document.getElementById('tax-formula').innerText = fText;
      }
      lastTaxElecFormula = fText;
    }

    document.getElementById('tax-desc').innerHTML = descText;
  }

  function showGuide() {
    const modal = document.getElementById('tax-modal-overlay');
    if (modal) modal.classList.add('show');
  }

  function hideGuide() {
    const modal = document.getElementById('tax-modal-overlay');
    if (modal) modal.classList.remove('show');
  }

  function goHome() {
    if (window.LegacyBridge && typeof window.LegacyBridge.backHome === 'function') {
      window.LegacyBridge.backHome();
    }
  }

  return {
    mount,
    initTaxElecApp,
    switchTaxElec,
    updateTaxElec,
    showGuide,
    hideGuide,
    goHome
  };
})();

/* 하단 안전 등록 및 레거시/Gen-3 상호 실행 브리지 */
function registerConceptTaxElecApp() {
  if (typeof window.MathLabGames !== 'undefined' && typeof window.MathLabGames.register === 'function') {
    if (!window.MathLabGames.get('tax-elec-app')) {
      try {
        const gameObj = {
          id: 'tax-elec-app',
          title: '생활 속 함수',
          icon: '💳',
          sourceType: 'new',
          players: '1인',
          isMultiplayer: false,
          mount(container, context) { ConceptTaxElecApp.mount(container, context); },
          reset() { ConceptTaxElecApp.initTaxElecApp(); },
          destroy() { },
          goHome() { ConceptTaxElecApp.goHome(); }
        };
        window.MathLabGames.register(gameObj);
      } catch (e) {
        console.warn('tax-elec-app 등록 방어:', e);
      }
    }
  }
}

registerConceptTaxElecApp();
window.addEventListener('DOMContentLoaded', registerConceptTaxElecApp);
setTimeout(registerConceptTaxElecApp, 100);
setTimeout(registerConceptTaxElecApp, 500);

window.ConceptTaxElecApp = ConceptTaxElecApp;

window.initTaxElecApp = function() {
  registerConceptTaxElecApp();
  if (window.LegacyBridge && typeof window.LegacyBridge.hideAllLegacySections === 'function') {
    window.LegacyBridge.hideAllLegacySections();
    window.LegacyBridge.showNewRoot();
  }
  if (typeof window.MathLabGames !== 'undefined' && typeof window.MathLabGames.mount === 'function') {
    try { window.MathLabGames.mount('tax-elec-app'); return; } catch(e) {}
  }
  const targetEl = document.getElementById('mathlab-view') || document.getElementById('new-root');
  ConceptTaxElecApp.mount(targetEl);
};
</script>
