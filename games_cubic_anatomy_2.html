<style>
@import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800;900&display=swap');
@import url('https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css');

.ca2-app, .ca2-app * { box-sizing: border-box; }
.ca2-app {
  max-width: 1100px;
  margin: 0 auto;
  padding: 20px 22px 28px;
  font-family: 'Pretendard', system-ui, sans-serif;
  background: #f8fafc;
  color: #0f172a;
  border-radius: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.04);
}

/* Header */
.ca2-app .h {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  background: #ffffff;
  padding: 16px 22px;
  border-radius: 16px;
  border: 1px solid #e2e8f0;
  box-shadow: 0 4px 6px rgba(0,0,0,0.02);
  margin-bottom: 16px;
}
.ca2-app .t {
  font-size: 1.35rem;
  font-weight: 900;
  margin: 0;
  display: flex;
  align-items: center;
  gap: 8px;
  color: #0284c7;
}
.ca2-app .sub-title {
  font-size: 0.88rem;
  color: #64748b;
  font-weight: 700;
}

/* Nav Tabs */
.ca2-app .nav-tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
  background: #ffffff;
  padding: 6px;
  border-radius: 14px;
  border: 1px solid #e2e8f0;
}
.ca2-app .tab-btn {
  flex: 1;
  padding: 12px 14px;
  border: none;
  border-radius: 10px;
  font-size: 0.98rem;
  font-weight: 800;
  cursor: pointer;
  background: transparent;
  color: #64748b;
  transition: all 0.2s;
  text-align: center;
}
.ca2-app .tab-btn.active {
  background: #0284c7;
  color: #ffffff;
  box-shadow: 0 4px 12px rgba(2,132,199,0.25);
}

/* Card & Layout */
.ca2-app .card {
  background: #ffffff;
  border: 1px solid #e2e8f0;
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 16px;
}
.ca2-app .card-title {
  font-size: 1.15rem;
  font-weight: 900;
  color: #0f172a;
  margin-top: 0;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
  border-bottom: 2px solid #f1f5f9;
  padding-bottom: 10px;
}

.ca2-app .grid-2 {
  display: grid;
  grid-template-columns: 1.35fr 1fr;
  gap: 16px;
}
@media(max-width: 860px) {
  .ca2-app .grid-2 { grid-template-columns: 1fr; }
}

/* Dual Canvases Container */
.ca2-app .cv-container {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.ca2-app .cv-box {
  background: #ffffff;
  border: 1px solid #cbd5e1;
  border-radius: 14px;
  padding: 10px;
  position: relative;
}
.ca2-app .cv-label {
  position: absolute;
  top: 14px;
  left: 16px;
  background: rgba(15,23,42,0.85);
  color: #ffffff;
  font-size: 0.8rem;
  font-weight: 800;
  padding: 4px 10px;
  border-radius: 6px;
  pointer-events: none;
  z-index: 5;
}
.ca2-app canvas {
  width: 100%;
  height: auto;
  display: block;
  border-radius: 10px;
  background: #ffffff;
  touch-action: none;
  cursor: crosshair;
}

/* Controls & Sliders */
.ca2-app .slider-item {
  margin-bottom: 10px;
}
.ca2-app .slider-label {
  display: flex;
  justify-content: space-between;
  font-weight: 800;
  color: #334155;
  font-size: 0.9rem;
  margin-bottom: 4px;
}
.ca2-app .slider {
  width: 100%;
  accent-color: #0284c7;
  height: 8px;
  border-radius: 4px;
  cursor: pointer;
}

/* Equal 50%:50% Grid Buttons Container */
.ca2-app .btn-grid-50 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  width: 100%;
  margin-top: 10px;
}

/* Buttons & Inputs */
.ca2-app .btn {
  border: 1px solid #cbd5e1;
  background: #ffffff;
  color: #1e293b;
  border-radius: 12px;
  padding: 12px 14px;
  font-weight: 800;
  cursor: pointer;
  font-size: 0.95rem;
  transition: all 0.15s;
  display: flex;
  align-items: center;
  justify-content: center;
  white-space: nowrap;
}
.ca2-app .btn:hover { background: #f1f5f9; }
.ca2-app .btn.p { background: #0284c7; border-color: #0284c7; color: #ffffff; box-shadow: 0 3px 0 #0369a1; }
.ca2-app .btn.g { background: #059669; border-color: #059669; color: #ffffff; box-shadow: 0 3px 0 #047857; }

.ca2-app .inp {
  width: 100%;
  display: block;
  padding: 12px 14px;
  border: 2px solid #cbd5e1;
  border-radius: 10px;
  font-size: 1rem;
  font-weight: 800;
  outline: none;
  background: #ffffff;
  margin-bottom: 10px;
}

/* Math Display Box */
.ca2-app .math-block {
  background: #ffffff;
  padding: 12px 18px;
  border-radius: 12px;
  display: block;
  border: 1px solid #bae6fd;
  margin: 10px 0;
  font-size: 1.02rem;
  overflow-x: auto;
}

/* Status Chips */
.ca2-app .chip-bar {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}
.ca2-app .chip {
  background: #ffffff;
  border: 1px solid #e2e8f0;
  border-radius: 999px;
  padding: 6px 14px;
  font-size: 0.9rem;
  font-weight: 800;
  color: #475569;
}
.ca2-app .chip b { color: #0284c7; }

/* Slide Modal */
.ca2-app .modal { position: fixed; inset: 0; background: rgba(15,23,42,0.55); display: none; align-items: center; justify-content: center; z-index: 9400; padding: 14px; backdrop-filter: blur(4px); }
.ca2-app .modal.on { display: flex; }
.ca2-app .modal .mbox { background: #fff; border-radius: 18px; max-width: 600px; width: 100%; padding: 24px; max-height: 88vh; overflow: auto; box-shadow: 0 20px 50px rgba(15,23,42,0.3); }
.ca2-app .dots { display: flex; gap: 6px; justify-content: center; margin: 16px 0 8px; }
.ca2-app .dot { width: 8px; height: 8px; border-radius: 50%; background: #cbd5e1; transition: all 0.2s; }
.ca2-app .dot.on { background: #0284c7; width: 22px; border-radius: 10px; }
</style>

function $(id) { return document.getElementById(id); }

function renderMath(latex, container, displayMode) {
  if (typeof katex !== 'undefined' && container) {
    try {
      katex.render(latex, container, { throwOnError: false, displayMode: !!displayMode });
      return;
    } catch(e){}
  }
  if (container) container.textContent = latex;
}

function updateMathElements() {
  document.querySelectorAll('.math-tex').forEach(function(el) {
    var tex = el.getAttribute('data-tex');
    var isDisplay = el.getAttribute('data-display') === 'true';
    if (tex) renderMath(tex, el, isDisplay);
  });
}

function fx(x) { return S.a * x * x * x + S.b * x * x + S.c * x + S.d; }
function fprime(x) { return 3 * S.a * x * x + 2 * S.b * x + S.c; }

var CubicAnatomy2App = {
  mount: function(container) {

    }
    
    host.style.display = ''; host.style.visibility = 'visible'; host.style.opacity = '1';
    S.host = host;

    this.bindEvents();
    this.updateHUD();
    this.drawAll();
    updateMathElements();
  },

    h += '      </div>';

    h += '      <div class="grid-2">';
    
    /* Dual Canvases */
    h += '        <div class="cv-container">';
    
    h += '          <div class="cv-box">';
    h += '            <div class="cv-label">삼차함수 f(x) & 접선</div>';
    h += '            <canvas id="cv-cubic" width="' + CW + '" height="' + CH + '"></canvas>';
    h += '          </div>';

    h += '          <div class="cv-box">';

    h += '      </div>';

    h += '    </div>';

    /* TAB 2: Math Model & Clean LaTeX */

  bindEvents: function() {
    var _this = this;
    var root = S.host.querySelector('#ca2-app-root');

    /* Tabs */
    root.querySelectorAll('.tab-btn').forEach(function(btn) {
      btn.onclick = function() {
        root.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
        this.classList.add('active');
        S.activeTab = this.getAttribute('data-tab');

        root.querySelector('#tab-sec-sim').style.display = (S.activeTab === 'sim') ? 'block' : 'none';
        root.querySelector('#tab-sec-math').style.display = (S.activeTab === 'math') ? 'block' : 'none';
        root.querySelector('#tab-sec-prob').style.display = (S.activeTab === 'prob') ? 'block' : 'none';

        updateMathElements();
      };
    });

    /* Sliders Fine 0.01 Step Precision + Wheel Event */
    var rngX0 = root.querySelector('#rng-x0');
    var rngA = root.querySelector('#rng-a');
    var rngB = root.querySelector('#rng-b');
    var rngC = root.querySelector('#rng-c');
    var rngD = root.querySelector('#rng-d');

    function updateVal(key, val, rngEl) {
      S[key] = Math.round(parseFloat(val) * 100) / 100;
      if (rngEl) rngEl.value = S[key];
      _this.updateHUD();
      _this.drawAll();
    }

    rngX0.oninput = function() { updateVal('x0', this.value, rngX0); };
    rngA.oninput = function() { updateVal('a', this.value, rngA); };
    rngB.oninput = function() { updateVal('b', this.value, rngB); };
    rngC.oninput = function() { updateVal('c', this.value, rngC); };
    rngD.oninput = function() { updateVal('d', this.value, rngD); };

    /* Wheel Scroll on Sliders */
    function bindWheel(el, key) {
      el.onwheel = function(e) {
        e.preventDefault();
        var delta = e.deltaY < 0 ? 0.01 : -0.01;
        var minV = parseFloat(el.min), maxV = parseFloat(el.max);
        var nVal = Math.min(maxV, Math.max(minV, S[key] + delta));
        updateVal(key, nVal, el);
      };
    }
    bindWheel(rngX0, 'x0');
    bindWheel(rngA, 'a');
    bindWheel(rngB, 'b');
    bindWheel(rngC, 'c');
    bindWheel(rngD, 'd');

    /* Mouse Tracking on Canvases */
    var cvCubic = root.querySelector('#cv-cubic');
    var cvDeriv = root.querySelector('#cv-deriv');

    function handleMouseMove(e, cv) {
      if (!S.mouseTracking) return;
      var rect = cv.getBoundingClientRect();
      var mouseX = e.clientX - rect.left;
      var pad = 40;
      var xVal = -BOUND_X + (mouseX - pad) / (CW - pad * 2) * (2 * BOUND_X);
      xVal = Math.min(BOUND_X - 0.2, Math.max(-BOUND_X + 0.2, xVal));
      updateVal('x0', xVal, rngX0);
    }

    cvCubic.onmousemove = function(e) { handleMouseMove(e, cvCubic); };
    cvDeriv.onmousemove = function(e) { handleMouseMove(e, cvDeriv); };

    cvCubic.onclick = function() { S.mouseTracking = !S.mouseTracking; };
    cvDeriv.onclick = function() { S.mouseTracking = !S.mouseTracking; };

    /* Presets */
    root.querySelector('#btn-preset-1').onclick = function() {
      updateVal('a', 1.00, rngA);
      updateVal('b', 0.00, rngB);
      updateVal('c', -3.00, rngC);
      updateVal('d', 0.00, rngD);
      updateVal('x0', 1.00, rngX0);
    };
    root.querySelector('#btn-preset-2').onclick = function() {
      updateVal('a', 1.00, rngA);
      updateVal('b', 0.00, rngB);
      updateVal('c', 0.00, rngC);
      updateVal('d', 0.00, rngD);
      updateVal('x0', 0.00, rngX0);
    };

    /* Quiz */
    root.querySelector('#btn-submit-quiz').onclick = function() {
      var val = (root.querySelector('#inp-quiz-ans').value || '').trim();
      var msgEl = root.querySelector('#lbl-quiz-msg');
      if (val === '1') {
        msgEl.innerHTML = '✅ <b>정답입니다!</b> f\'(x) = 3x^2 - 3 = 0 에서 양수인 근 x = 1 입니다.';
        msgEl.style.color = '#059669';
      } else {
        msgEl.innerHTML = '❌ 오답입니다. (힌트: 3x^2 = 3 이므로 x^2 = 1 입니다)';
        msgEl.style.color = '#ef4444';
      }
    };

    /* Solutions Toggle */
    root.querySelectorAll('.btn-show-sol').forEach(function(btn) {
      btn.onclick = function() {
        var idx = this.getAttribute('data-idx');
        var solEl = root.querySelector('#sol-' + idx);
        if (solEl) {
          var isShown = solEl.style.display === 'block';
          solEl.style.display = isShown ? 'none' : 'block';
          this.textContent = isShown ? '💡 수학적 해설 보기' : '🙈 해설 닫기';
          updateMathElements();
        }
      };
    });

    /* Modal Open & Render Slide */
    root.querySelector('#btn-open-guide').onclick = function() {
      S.guidePage = 0;
      _this.renderSlideGuide();
      root.querySelector('#ca2-modal').classList.add('on');
    };
  },

  updateHUD: function() {
    var root = S.host.querySelector('#ca2-app-root');
    if (!root) return;

    var disc = S.b * S.b - 3 * S.a * S.c;
    var slope = fprime(S.x0);
    var y0 = fx(S.x0);

    root.querySelector('#lbl-disc-val').textContent = disc.toFixed(2);
    root.querySelector('#lbl-slope-val').textContent = slope.toFixed(2);
    root.querySelector('#lbl-x0-val').textContent = S.x0.toFixed(2);
    root.querySelector('#lbl-a-val').textContent = S.a.toFixed(2);
    root.querySelector('#lbl-b-val').textContent = S.b.toFixed(2);
    root.querySelector('#lbl-c-val').textContent = S.c.toFixed(2);
    root.querySelector('#lbl-d-val').textContent = S.d.toFixed(2);

    var shapeStr = disc > 0.01 ? '극값 2개 (D\' > 0)' : (Math.abs(disc) <= 0.01 ? '변곡 중근 (D\' = 0)' : '단조 증가/감소 (D\' < 0)');
    root.querySelector('#lbl-shape-type').textContent = shapeStr;

    var fxTex = 'f(x) = ' + (S.a !== 1 ? S.a.toFixed(2) : '') + 'x^3 ' + (S.b >= 0 ? '+ ' + S.b.toFixed(2) : '- ' + Math.abs(S.b).toFixed(2)) + 'x^2 ' + (S.c >= 0 ? '+ ' + S.c.toFixed(2) : '- ' + Math.abs(S.c).toFixed(2)) + 'x ' + (S.d >= 0 ? '+ ' + S.d.toFixed(2) : '- ' + Math.abs(S.d).toFixed(2));
    var fpTex = 'f\'(x) = ' + (3 * S.a).toFixed(2) + 'x^2 ' + (2 * S.b >= 0 ? '+ ' + (2 * S.b).toFixed(2) : '- ' + Math.abs(2 * S.b).toFixed(2)) + 'x ' + (S.c >= 0 ? '+ ' + S.c.toFixed(2) : '- ' + Math.abs(S.c).toFixed(2));
    var tanTex = 'y = ' + slope.toFixed(2) + '(x ' + (S.x0 >= 0 ? '- ' + S.x0.toFixed(2) : '+ ' + Math.abs(S.x0).toFixed(2)) + ') ' + (y0 >= 0 ? '+ ' + y0.toFixed(2) : '- ' + Math.abs(y0).toFixed(2));

    var elFx = root.querySelector('#lbl-math-fx');
    var elFp = root.querySelector('#lbl-math-fp');
    var elTan = root.querySelector('#lbl-math-tangent');

    if (elFx) { elFx.setAttribute('data-tex', fxTex); renderMath(fxTex, elFx, false); }
    if (elFp) { elFp.setAttribute('data-tex', fpTex); renderMath(fpTex, elFp, false); }
    if (elTan) { elTan.setAttribute('data-tex', tanTex); renderMath(tanTex, elTan, false); }
  },

  worldToPxCubic: function(x, y) {
    var pad = 40;
    return {
      X: pad + (x + BOUND_X) / (2 * BOUND_X) * (CW - pad * 2),
      Y: CH / 2 - (y / BOUND_Y) * (CH / 2 - 20)
    };
  },

  worldToPxDeriv: function(x, y) {
    var pad = 40;
    return {
      X: pad + (x + BOUND_X) / (2 * BOUND_X) * (CW - pad * 2),
      Y: CH / 2 - (y / 15.0) * (CH / 2 - 20)
    };
  },

  drawAll: function() {
    this.drawCubicCanvas();
    this.drawDerivCanvas();
  },

  drawCubicCanvas: function() {
    var root = S.host.querySelector('#ca2-app-root');
    if (!root) return;
    var cv = root.querySelector('#cv-cubic');
    if (!cv) return;
    var ctx = cv.getContext('2d');

    ctx.clearRect(0, 0, CW, CH);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, CW, CH);

    var _this = this;

    // Axes
    var o = _this.worldToPxCubic(0, 0);
    ctx.strokeStyle = '#cbd5e1';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(40, o.Y); ctx.lineTo(CW - 40, o.Y);
    ctx.moveTo(o.X, 15); ctx.lineTo(o.X, CH - 15);
    ctx.stroke();

    // Vertical Guide line for x0
    var px0 = _this.worldToPxCubic(S.x0, 0);
    ctx.strokeStyle = '#fca5a5';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.moveTo(px0.X, 15); ctx.lineTo(px0.X, CH - 15);
    ctx.stroke();
    ctx.setLineDash([]);

    // Cubic Curve f(x)
    ctx.strokeStyle = '#0284c7';
    ctx.lineWidth = 3;
    ctx.beginPath();
    var started = false;
    for (var i = 0; i <= 240; i++) {
      var x = -BOUND_X + i * (2 * BOUND_X) / 240;
      var y = fx(x);
      var p = _this.worldToPxCubic(x, y);
      if (!started) { ctx.moveTo(p.X, p.Y); started = true; }
      else ctx.lineTo(p.X, p.Y);
    }
    ctx.stroke();

    // Tangent Line at x0
    var slope = fprime(S.x0);
    var y0 = fx(S.x0);
    ctx.strokeStyle = '#dc2626';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    for (var t = -BOUND_X; t <= BOUND_X; t += BOUND_X) {
      var ty = slope * (t - S.x0) + y0;
      var tp = _this.worldToPxCubic(t, ty);
      if (t === -BOUND_X) ctx.moveTo(tp.X, tp.Y);
      else ctx.lineTo(tp.X, tp.Y);
    }
    ctx.stroke();

    // Point P(x0, f(x0))
    var p0 = _this.worldToPxCubic(S.x0, y0);
    ctx.fillStyle = '#dc2626';
    ctx.beginPath();
    ctx.arc(p0.X, p0.Y, 6, 0, Math.PI * 2);
    ctx.fill();

    // Extrema Points
    var disc = S.b * S.b - 3 * S.a * S.c;
    if (disc > 0 && S.a !== 0) {
      var x1 = (-S.b - Math.sqrt(disc)) / (3 * S.a);
      var x2 = (-S.b + Math.sqrt(disc)) / (3 * S.a);
      [x1, x2].forEach(function(exX) {
        if (Math.abs(exX) <= BOUND_X) {
          var exY = fx(exX);
          var exP = _this.worldToPxCubic(exX, exY);
          ctx.fillStyle = '#059669';
          ctx.beginPath();
          ctx.arc(exP.X, exP.Y, 5, 0, Math.PI * 2);
          ctx.fill();
        }
      });
    }

    ctx.fillStyle = '#475569';
    ctx.font = 'bold 12px Pretendard';
    ctx.fillText('x0 = ' + S.x0.toFixed(2), px0.X + 6, 25);
  },

  drawDerivCanvas: function() {
    var root = S.host.querySelector('#ca2-app-root');
    if (!root) return;
    var cv = root.querySelector('#cv-deriv');
    if (!cv) return;
    var ctx = cv.getContext('2d');

    ctx.clearRect(0, 0, CW, CH);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, CW, CH);

    var _this = this;

    // Axes
    var o = _this.worldToPxDeriv(0, 0);
    ctx.strokeStyle = '#cbd5e1';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(40, o.Y); ctx.lineTo(CW - 40, o.Y);
    ctx.moveTo(o.X, 15); ctx.lineTo(o.X, CH - 15);
    ctx.stroke();

    // Vertical Guide line for x0
    var px0 = _this.worldToPxDeriv(S.x0, 0);
    ctx.strokeStyle = '#fca5a5';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.moveTo(px0.X, 15); ctx.lineTo(px0.X, CH - 15);
    ctx.stroke();
    ctx.setLineDash([]);

    // Derivative Parabola f'(x)
    ctx.strokeStyle = '#059669';
    ctx.lineWidth = 3;
    ctx.beginPath();
    var started = false;
    for (var i = 0; i <= 240; i++) {
      var x = -BOUND_X + i * (2 * BOUND_X) / 240;
      var y = fprime(x);
      var p = _this.worldToPxDeriv(x, y);
      if (!started) { ctx.moveTo(p.X, p.Y); started = true; }
      else ctx.lineTo(p.X, p.Y);
    }
    ctx.stroke();

    // Point Q(x0, f'(x0))
    var slope = fprime(S.x0);
    var p0 = _this.worldToPxDeriv(S.x0, slope);
    ctx.fillStyle = '#059669';
    ctx.beginPath();
    ctx.arc(p0.X, p0.Y, 6, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#059669';
    ctx.font = 'bold 12px Pretendard';
    ctx.fillText('f\'(x0) = ' + slope.toFixed(2), p0.X + 8, p0.Y - 6);
  },

  renderSlideGuide: function() {
    var _this = this;
    var root = S.host.querySelector('#ca2-app-root');
    var mBox = root.querySelector('#ca2-modal-box');
    if (!mBox) return;

    var pg = SLIDE_GUIDE[S.guidePage] || SLIDE_GUIDE[0];
    var dots = SLIDE_GUIDE.map(function(_, i) {
      return '<span class="dot' + (i === S.guidePage ? ' on' : '') + '"></span>';
    }).join('');
    var isLast = S.guidePage >= SLIDE_GUIDE.length - 1;

    var h = '';
    h += '<div style="font-size:.8rem; font-weight:800; color:#0284c7; margin-bottom:4px;">온보딩 슬라이드 탐구 ' + (S.guidePage + 1) + ' / ' + SLIDE_GUIDE.length + '</div>';
    h += '<h3 style="margin:0 0 12px; color:#0f172a; font-weight:900;">' + pg.title + '</h3>';
    h += '<div style="line-height:1.65; color:#334155; font-size:0.95rem;">' + pg.html + '</div>';
    h += '<div class="dots">' + dots + '</div>';

    h += '<div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px;">';
    h += '  <button type="button" class="btn" id="btn-slide-prev"' + (S.guidePage === 0 ? ' disabled' : '') + '>← 이전</button>';
    h += '  <button type="button" class="btn p" id="btn-slide-next">' + (isLast ? '탐구 시작하기 🚀' : '다음 →') + '</button>';
    h += '</div>';

    mBox.innerHTML = h;
    updateMathElements();

    var prevBtn = mBox.querySelector('#btn-slide-prev');
    var nextBtn = mBox.querySelector('#btn-slide-next');

    if (prevBtn) {
      prevBtn.onclick = function() {
        if (S.guidePage > 0) {
          S.guidePage--;
          _this.renderSlideGuide();
        }
      };
    }
    if (nextBtn) {
      nextBtn.onclick = function() {
        if (isLast) {
          root.querySelector('#ca2-modal').classList.remove('on');
        } else {
          S.guidePage++;
          _this.renderSlideGuide();
        }
      };
    }
  },

  destroy: function() {
    if (S.host) S.host.innerHTML = '';
    S.host = null;
  }
};
