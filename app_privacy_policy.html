    <p>본 <strong>수학 실험실 🧪</strong> 앱(이하 "서비스")은 정보주체의 개인정보를 보호하고 관련 고충을 처리하기 위해 다음과 같이 개인정보처리방침을 공개합니다.</p>
    
    <h3>제1조 (처리하는 개인정보 항목 및 최소 수집)</h3>
    <p>서비스는 점수 랭킹 기능 제공을 위해 <strong>최소한의 정보</strong>만 자발적으로 입력받아 수집합니다.</p>

      <li><strong>기타:</strong> Google Gemini API Key 및 개인 스프레드시트 ID는 사용자 기기(브라우저)에만 저장되며 서버로 수집되지 않습니다.</li>
    </ul>

    <h3>제2조 (개인정보의 처리 목적)</h3>
    <p>수집된 개인정보는 <strong>점수 랭킹 보드 표시 및 유지</strong> 목적으로만 사용되며, 그 외 어떠한 목적으로도 사용되지 않습니다.</p>

    <h3>제3조 (개인정보의 처리 및 보유 기간, 파기 절차)</h3>
    <p>수집된 랭킹 정보는 <strong>1개월마다 초기화</strong>되며, <strong>매월 1일에 데이터베이스에서 영구 삭제(파기)</strong>됩니다. 기기에 저장된 API Key 등은 브라우저 캐시 삭제 시 즉각 파기됩니다.</p>

    <h3>제4조 (개인정보의 안전성 확보 조치)</h3>
    <p>서비스는 개인정보 보호를 위해 다음과 같은 <strong>안전조치</strong>를 취하고 있습니다.</p>
    <ul>
      <li>통신 구간 암호화 (HTTPS 설정) 및 구글 인프라의 강력한 보안망 적용</li>
      <li>데이터베이스(Google Apps Script 데이터 저장소) 접근은 앱 운영자 외에 철저히 통제됨</li>
    </ul>

    <h3>제5조 (정보주체의 권리 행사 방법: 열람/정정/삭제)</h3>
    <p>사용자는 언제든지 자신의 랭킹 등록 정보에 대해 삭제 또는 정정을 요청할 수 있으며, 요청 즉시 앱 관리자는 해당 정보를 삭제 조치합니다.</p>

    <h3>제6조 (만 14세 미만 아동의 개인정보 보호)</h3>
    <p>서비스는 법정대리인의 동의가 필요한 개인 식별 정보를 일절 수집하지 않으며, <strong>아동 개인정보 보호</strong>를 위해 식별이 불가능한 형태(자유 닉네임)로만 랭킹 참여를 허용합니다.</p>

    <h3>제7조 (개인정보의 제3자 제공 및 처리 위탁)</h3>
    <ul>
      <li><strong>제3자 제공:</strong> 서비스는 수집된 개인정보를 어떠한 제3자에게도 제공하지 않습니다.</li>
      <li><strong>처리 위탁:</strong> 서비스의 원활한 운영 및 AI 기능을 위해 아래와 같이 업무를 위탁(호스팅 및 외부 API)합니다.
        <ul>
          <li>데이터 저장 및 호스팅: Google LLC (Google Apps Script, Google Sheets)</li>
          <li>AI 기능 처리: Google LLC (Gemini API) - 전송 시 이름 등 개인식별정보는 포함되지 않습니다.</li>
        </ul>
      </li>
    </ul>

    <h3>제8조 (개인정보 보호책임자)</h3>
    <p>서비스 운영 및 개인정보 관리에 대한 모든 책임은 앱 개발/운영자에게 있습니다.</p>
    <ul>
      <li>보호책임자: 앱 운영자</li>
      <li>문의처: 서비스 내 '소통 창구' 메뉴 이용</li>
    </ul>
  </div>
</template>
<script>
  (function() {
    function mount(container) {
      if (!container) return;
      const template = document.getElementById('privacy-policy-template');
      if (template) {
        container.innerHTML = template.innerHTML;
      }
    }
    
    if (window.MathLabGames && typeof window.MathLabGames.register === 'function') {
      window.MathLabGames.register({
        id: 'privacy-policy',
        mount: mount,
        destroy: function() {
          const container = document.getElementById('mathlab-global-modal-content');
          if(container) container.innerHTML = '';
        }
      });
    }
  })();
</script>
