    padding: 10px 20px;
    background: #8b5cf6;

</style>

<script>
const GaltonBoard = (function() {
  let host = null;
  let asset = 1000;
  let scoreSaved = false;

  // Board Settings
  let rows = 8; // 4, 8, 12
  let probRight = 0.5; // 0.2 to 0.8
  let drops = 1; // 1, 10, 1000
  let isSimulating = false;
  
  // Canvas Animation
  let animReq = null;
  let marbles = [];
  let bins = []; // 0 to rows
  let maxBinCount = 0;
  let droppedCount = 0;
  let targetDrops = 0;
  
  function fact(n) {
    if (n === 0 || n === 1) return 1;
    let res = 1;
    for(let i=2; i<=n; i++) res *= i;
    return res;
  }
  function nCr(n, r) {
    if(r < 0 || r > n) return 0;
    return fact(n) / (fact(r) * fact(n-r));
  }
  function binomialProb(n, k, p) {
    return nCr(n, k) * Math.pow(p, k) * Math.pow(1-p, n-k);
  }

  function getTheoreticalMultiplier(n, targetK, p) {
    let prob = binomialProb(n, targetK, p);
    if(prob <= 0) prob = 0.001;
    // Edge bets should give higher multiplier.
    // e.g. if prob = 0.01 (1%), multiplier should be around 1/0.01 = 100
    // We add a house edge and cap it.
    let mult = 0.95 / prob; 
    return Math.max(1.1, Math.min(100.0, mult));
  }

  function escapeHTML(str) {
    if (!str) return '';
    return str.replace(/[&<>'"]/g, function(tag) {
      return {
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[tag] || tag;
    });
  }

  function showToast(msg, type) {
    if (!type) type = 'normal';
    let toast = document.getElementById('gb-toast');
    if (!toast) {
      toast = document.createElement('div');
      toast.id = 'gb-toast';
      toast.className = 'gb-toast';
      document.body.appendChild(toast);
    }
    toast.className = 'gb-toast ' + type + ' show';
    toast.textContent = msg;
    setTimeout(function() { toast.classList.remove('show'); }, 3000);
  }

  function renderUI() {
    if (!host) return;
    
    host.querySelector('#gb-asset').textContent = Math.floor(asset).toLocaleString() + ' P';
    
    // Buttons
    host.querySelectorAll('.btn-rows').forEach(function(b) {
      b.classList.toggle('active', parseInt(b.dataset.val) === rows);
    });
    host.querySelectorAll('.btn-drops').forEach(function(b) {
      b.classList.toggle('active', parseInt(b.dataset.val) === drops);
    });
    
    const pSlider = host.querySelector('#gb-p-slider');
    pSlider.value = probRight;
    host.querySelector('#gb-p-val').textContent = probRight.toFixed(1);
    
    // Betting max bin
    const binSelect = host.querySelector('#gb-bet-bin');
    if (binSelect.max != rows) {
      binSelect.max = rows;
      if (parseInt(binSelect.value) > rows) binSelect.value = Math.floor(rows / 2);
    }
    
    let currentBin = parseInt(binSelect.value) || 0;
    const mult = getTheoreticalMultiplier(rows, currentBin, probRight).toFixed(1);
    host.querySelector('#gb-mult').textContent = '적중 시 ' + mult + '배';
    host.querySelector('#gb-path-info').textContent = '해당 칸 경로 수: ' + nCr(rows, currentBin);
    
    const btnBet = host.querySelector('#btn-run-bet');
    const btnObs = host.querySelector('#btn-run-obs');
    
    btnBet.disabled = isSimulating || asset <= 0;
    btnObs.disabled = isSimulating;
    
    pSlider.disabled = isSimulating;
    host.querySelectorAll('.opt-btn').forEach(function(b) { b.disabled = isSimulating; });
  }

  function initBoard() {
    bins = new Array(rows + 1).fill(0);
    maxBinCount = 0;
    droppedCount = 0;
    marbles = [];
    if(host) {
      host.querySelector('#gb-chart-stat').textContent = '대기 중...';
    }
    drawCanvas();
  }

  function drawCanvas() {
    const canvas = host.querySelector('#gb-canvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const w = canvas.width;
    const h = canvas.height;
    
    ctx.clearRect(0, 0, w, h);
    
    const topMargin = 30;
    const bottomMargin = 80; // Space for bins and histogram
    const boardHeight = h - topMargin - bottomMargin;
    
    const rowHeight = boardHeight / (rows + 1);
    
    // Draw Pegs (Pascal's triangle layout)
    ctx.fillStyle = '#64748b';
    for (let r = 0; r <= rows; r++) {
      const pegsInRow = r + 1;
      const rowWidth = pegsInRow * 30; // spacing
      let startX = (w - rowWidth) / 2 + 15;
      let y = topMargin + r * rowHeight;
      for (let c = 0; c < pegsInRow; c++) {
        let x = startX + c * 30;
        ctx.beginPath();
        ctx.arc(x, y, 3, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    
    // Draw Bins and Histogram
    const binRowWidth = (rows + 1) * 30;
    let binStartX = (w - binRowWidth) / 2;
    let yBottom = h - 20;
    
    // Calculate theoretical max for histogram scaling
    let maxTheoProb = 0;
    for(let i=0; i<=rows; i++) {
      let p = binomialProb(rows, i, probRight);
      if(p > maxTheoProb) maxTheoProb = p;
    }
    let histScaleCount = Math.max(10, Math.max(maxBinCount, Math.ceil(targetDrops * maxTheoProb)));
    if(targetDrops === 0) histScaleCount = 10;

    for (let i = 0; i <= rows; i++) {
      let xCenter = binStartX + i * 30 + 15;
      
      // Bin numbers
      ctx.fillStyle = '#475569';
      ctx.font = '12px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(i, xCenter, yBottom + 20);
      
      // Histogram bars
      let count = bins[i];
      if (count > 0) {
        let barHeight = (count / histScaleCount) * (bottomMargin - 30);
        ctx.fillStyle = 'rgba(139, 92, 246, 0.7)';
        ctx.fillRect(xCenter - 10, yBottom - barHeight, 20, barHeight);
        
        ctx.fillStyle = '#1e293b';
        ctx.font = '10px sans-serif';
        ctx.fillText(count, xCenter, yBottom - barHeight - 5);
      }
    }
    
    // Draw Normal Curve Overlay if Drops == 1000
    if (targetDrops >= 1000) {
      let mu = rows * probRight;
      let variance = rows * probRight * (1 - probRight);
      let sigma = Math.sqrt(variance);
      
      ctx.beginPath();
      ctx.strokeStyle = '#10b981';
      ctx.lineWidth = 2;
      for (let i = 0; i <= rows; i++) {
        let xCenter = binStartX + i * 30 + 15;
        let p = 1 / (sigma * Math.sqrt(2 * Math.PI)) * Math.exp(-0.5 * Math.pow((i - mu)/sigma, 2));
        let expectedCount = p * targetDrops;
        let curveY = yBottom - (expectedCount / histScaleCount) * (bottomMargin - 30);
        if (i === 0) ctx.moveTo(xCenter, curveY);
        else ctx.lineTo(xCenter, curveY);
      }
      ctx.stroke();
    }
    
    // Draw Marbles
    ctx.fillStyle = '#facc15';
    for (let m of marbles) {
      ctx.beginPath();
      ctx.arc(m.x, m.y, 4, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function simulateMarbles(callback) {
    if (isSimulating) return;
    isSimulating = true;
    renderUI();
    
    targetDrops = drops;
    initBoard();
    
    const canvas = host.querySelector('#gb-canvas');
    const w = canvas.width;
    const h = canvas.height;
    const topMargin = 30;
    const bottomMargin = 80;
    const boardHeight = h - topMargin - bottomMargin;
    const rowHeight = boardHeight / (rows + 1);
    
    if (targetDrops >= 1000) {
      // Fast simulation without marble physics
      let simCount = 0;
      function fastStep() {
        let batch = 50;
        for (let b = 0; b < batch; b++) {
          if (simCount >= targetDrops) break;
          let k = 0;
          for (let r = 0; r < rows; r++) {
            if (Math.random() < probRight) k++;
          }
          bins[k]++;
          if(bins[k] > maxBinCount) maxBinCount = bins[k];
          simCount++;
          droppedCount++;
        }
        
        host.querySelector('#gb-chart-stat').textContent = '낙하: ' + simCount + ' / ' + targetDrops;
        drawCanvas();
        
        if (simCount < targetDrops) {
          animReq = requestAnimationFrame(fastStep);
        } else {
          isSimulating = false;
          renderUI();
          if (callback) callback();
        }
      }
      fastStep();
      return;
    }
    
    // Detailed Simulation
    let spawnTimer = 0;
    let spawnInterval = targetDrops === 10 ? 5 : 20; 
    let spawned = 0;
    
    function animate() {
      // Spawn
      if (spawned < targetDrops && spawnTimer <= 0) {
        marbles.push({
          row: 0,
          col: 0, // 0 to row
          x: w / 2,
          y: topMargin - 15,
          targetX: w / 2,
          targetY: topMargin,
          state: 'falling'
        });
        spawned++;
        spawnTimer = spawnInterval;
      }
      spawnTimer--;
      
      // Update
      let active = false;
      for (let i = marbles.length - 1; i >= 0; i--) {
        let m = marbles[i];
        if (m.state === 'done') continue;
        active = true;
        
        // Move towards target
        let dx = m.targetX - m.x;
        let dy = m.targetY - m.y;
        let dist = Math.sqrt(dx*dx + dy*dy);
        let speed = 4;
        
        if (dist < speed) {
          m.x = m.targetX;
          m.y = m.targetY;
          
          if (m.row < rows) {
            // Hit a peg, decide direction
            let goRight = Math.random() < probRight;
            if (goRight) m.col++;
            m.row++;
            
            const pegsInRow = m.row + 1;
            const rowWidth = pegsInRow * 30;
            let startX = (w - rowWidth) / 2 + 15;
            
            m.targetX = startX + m.col * 30;
            m.targetY = topMargin + m.row * rowHeight;
          } else {
            // Fall into bin
            bins[m.col]++;
            if(bins[m.col] > maxBinCount) maxBinCount = bins[m.col];
            droppedCount++;
            m.state = 'done';
            marbles.splice(i, 1); // remove to save draw calls
          }
        } else {
          m.x += (dx / dist) * speed;
          m.y += (dy / dist) * speed;
        }
      }
      
      host.querySelector('#gb-chart-stat').textContent = '낙하: ' + droppedCount + ' / ' + targetDrops;
      drawCanvas();
      
      if (droppedCount < targetDrops || active) {
        animReq = requestAnimationFrame(animate);
      } else {
        isSimulating = false;
        renderUI();
        if (callback) callback();
      }
    }
    
    if (animReq) cancelAnimationFrame(animReq);
    animate();
  }

  function handleBetting() {
    if (drops >= 1000) {
      showToast('1000회 대량 드롭은 관찰(시연) 모드 전용입니다.', 'error');
      return;
    }
    
    let betAmount = parseFloat(host.querySelector('#gb-bet-amount').value);
    if (isNaN(betAmount) || betAmount <= 0 || betAmount > asset) {
      showToast('올바른 베팅 금액을 입력하세요.', 'error');
      return;
    }
    
    let predictedBin = parseInt(host.querySelector('#gb-bet-bin').value);
    if (isNaN(predictedBin) || predictedBin < 0 || predictedBin > rows) {
      showToast('올바른 도착 칸 번호를 입력하세요.', 'error');
      return;
    }
    
    asset -= betAmount;
    
    simulateMarbles(function() {
      // Find mode of bins dropped
      let actualCount = bins[predictedBin];
      
      // If we bet on a bin, we win if a marble falls in it.
      // Wait, in 1 drop, it falls in exactly one bin.
      // In 10 drops, we can say "if ANY marble falls in the predicted bin".
      // Let's keep it simple: If at least 1 marble falls in predicted bin, player wins.
      // But probability of AT LEAST 1 is different from single drop.
      // If drops = 1, prob = bin_prob.
      // If drops = 10, prob = 1 - (1 - bin_prob)^10.
      
      if (actualCount > 0) {
        // Correct prediction
        // Calculate dynamic multiplier based on drops and bin
        let singleProb = binomialProb(rows, predictedBin, probRight);
        if(singleProb <= 0) singleProb = 0.0001;
        let winProb = drops === 1 ? singleProb : (1 - Math.pow(1 - singleProb, drops));
        
        let mult = 0.95 / winProb;
        mult = Math.max(1.1, Math.min(100.0, mult));
        
        let payout = betAmount * mult;
        asset += payout;
        
        let extra = '';
        if (nCr(rows, predictedBin) === 1) { // edge bin bonus
          asset += 10;
          extra = '가장자리 희귀 칸 적중 보너스 +10! ';
        }
        
        showToast('적중! ' + extra + mult.toFixed(1) + '배 배당 획득! (+' + Math.floor(payout) + ' P)', 'success');
      } else {
        showToast('실패... 예측한 칸에 구슬이 들어가지 않았습니다.', 'error');
      }
      
      if (asset <= 0) {
        showToast('자산이 소진되었습니다! 랭킹을 등록하세요.', 'error');
        setTimeout(showRankingModal, 1500);
      }
      renderUI();
    });
  }

  function handleObserve() {
    if (drops < 1000) drops = 1000; // force 1000
    renderUI();
    simulateMarbles(function() {
      showToast('정규 근사 관찰이 완료되었습니다. 곡선과 히스토그램을 비교해보세요!', 'normal');
    });
  }

  function renderBottomLeaderboard() {
    if (typeof window.loadGameLeaderboard === 'function') {
      window.loadGameLeaderboard('galton-board', true, 'board-galton-board');
    } else {
      try {
        let list = JSON.parse(localStorage.getItem('mathlab_lb_galton-board') || '[]');
        const bottomEl = document.getElementById('board-galton-board');
        if (bottomEl) {
          if (list.length === 0) {
            bottomEl.innerHTML = '<p style="text-align:center; color:#94a3b8; padding:12px 0;">아직 등록된 기록이 없습니다.</p>';
          } else {
            bottomEl.innerHTML = list.slice(0, 5).map(function(item, idx) {
              return '<div style="display:flex; justify-content:space-between; align-items:center; background:#0f172a; padding:10px 14px; border-radius:10px; border:1px solid #334155; margin-bottom:6px;">' +
                '<span style="font-weight:800; color:' + (idx === 0 ? '#facc15' : '#cbd5e1') + ';">' + (idx === 0 ? '👑 1위' : (idx + 1) + '위') + ' - ' + escapeHTML(item.nickname) + '</span>' +
                '<span style="color:#a78bfa; font-weight:900;">' + item.score + ' P</span>' +
              '</div>';
            }).join('');
          }
        }
      } catch(e) {}
    }
  }

  function showGuideModal() {
    let modal = document.getElementById('gb-guide-modal');
    if (!modal) {
      modal = document.createElement('div');
      modal.id = 'gb-guide-modal';
      modal.className = 'gb-modal-overlay';
      modal.innerHTML = 
        '<div class="gb-modal">' +
          '<h3>📖 게임 방법</h3>' +
          '<p>' +
            '- 구슬이 떨어지는 <b>도착 칸 번호</b>를 예측하여 자산을 베팅하세요.<br>' +
            '- 가운데 칸일수록 경로 수(파스칼의 삼각형)가 많아 확률이 높고 배당은 낮습니다.<br>' +
            '- 양쪽 끝 칸일수록 확률이 희박하여 <b>고배당</b>을 얻습니다.<br>' +
            '- 편향 확률(p)을 조절하여 분포가 한쪽으로 쏠리는 것을 관찰할 수 있습니다.<br>' +
            '- 1000개 드롭 <b>관찰 모드</b>에서는 이항분포가 <b>정규분포 곡선</b>에 가까워지는 현상을 볼 수 있습니다.' +
          '</p>' +
          '<button class="close-btn" onclick="document.getElementById(&quot;gb-guide-modal&quot;).style.display=&quot;none&quot;">확인</button>' +
        '</div>';
      document.body.appendChild(modal);
    }
    modal.style.display = 'flex';
  }

  function showRankingModal() {
    let modal = document.getElementById('gb-ranking-modal');
    if (!modal) {
      modal = document.createElement('div');
      modal.id = 'gb-ranking-modal';
      modal.className = 'gb-modal-overlay';
      modal.innerHTML = 
        '<div class="gb-modal">' +
          '<h3>🏆 랭킹 등록</h3>' +
          '<p>최종 자산: <strong id="gb-rank-score" style="color:#facc15; font-size:1.5rem;"></strong> P</p>' +
          '<input type="text" id="gb-rank-name" placeholder="닉네임 (10자 이내)" maxlength="10" style="width:100%; padding:10px; margin-bottom:15px; border-radius:8px; background:#0f172a; border:1px solid #475569; color:#fff; text-align:center;">' +
          '<button class="close-btn" id="gb-rank-submit">등록</button>' +
          '<button class="close-btn" style="background:#475569; margin-left:10px;" onclick="document.getElementById(&quot;gb-ranking-modal&quot;).style.display=&quot;none&quot;">닫기</button>' +
        '</div>';
      document.body.appendChild(modal);
      
      document.getElementById('gb-rank-submit').addEventListener('click', function() {
        const nameInput = document.getElementById('gb-rank-name');
        let name = nameInput.value.trim();
        if (!name) { showToast('닉네임을 입력하세요.', 'error'); return; }
        name = escapeHTML(name);
        
        const finalScore = Math.floor(asset);
        if (typeof window.submitRankingScore === 'function') {
          window.submitRankingScore('galton-board', name, finalScore);
        } else {
          let list = JSON.parse(localStorage.getItem('mathlab_lb_galton-board') || '[]');
          list.push({ nickname: name, score: finalScore });
          list.sort(function(a,b) { return b.score - a.score; });
          localStorage.setItem('mathlab_lb_galton-board', JSON.stringify(list));
        }
        
        showToast('명예의 전당에 등록되었습니다!', 'success');
        document.getElementById('gb-ranking-modal').style.display = 'none';
        renderBottomLeaderboard();
        resetGame();
      });
    }
    document.getElementById('gb-rank-score').textContent = Math.floor(asset);
    document.getElementById('gb-rank-name').value = '';
    modal.style.display = 'flex';
  }

  function goHome() {
    if (animReq) cancelAnimationFrame(animReq);

    if (host) {
      host.style.display = 'none';
      host.innerHTML = '';
    }
    const legacyHost = document.getElementById('mathlab-view');
    if (legacyHost) {
      legacyHost.style.display = 'none';
      legacyHost.innerHTML = '';
    }
    const forceHost = document.getElementById('galton-board-force-host');
    if (forceHost) {
      forceHost.style.display = 'none';
      forceHost.innerHTML = '';
    }

    document.querySelectorAll('.app-grid, #dashboard-screen, #hero-section').forEach(function(el) {
      if (el && el.style) {
        el.style.display = '';
        el.style.visibility = '';
      }
    });

    if (window.LegacyBridge && typeof window.LegacyBridge.backHome === 'function') {
      window.LegacyBridge.backHome();
    } else if (typeof window.goHome === 'function') {
      window.goHome();
    }
  }

  function mount(container, context) {
    let target = null;
    if (typeof container === 'string') target = document.querySelector(container);
    else if (container instanceof HTMLElement) target = container;
    
    if (!target) target = window.MathLabUtils && window.MathLabUtils.getMountContainer ? window.MathLabUtils.getMountContainer(container) : document.getElementById('mathlab-view');
    if (!target || !(target instanceof HTMLElement)) target = document.getElementById('new-root') || document.getElementById('game-container') || document.getElementById('mathlab-view');

    if (!target || !(target instanceof HTMLElement) || target === document.body) {
      let createdHost = document.getElementById('galton-board-force-host');
      if (!createdHost) {
        createdHost = document.createElement('div');
        createdHost.id = 'galton-board-force-host';
        document.body.appendChild(createdHost);
      }
      target = createdHost;
    }

    const footerEl = document.querySelector('footer, #footer, .app-footer') || 
                     Array.from(document.querySelectorAll('div, p, span')).find(function(el) { return el.textContent && el.textContent.indexOf('2026 기록조율사') !== -1; });
    if (footerEl && target && typeof target.compareDocumentPosition === 'function' && (target.compareDocumentPosition(footerEl) & Node.DOCUMENT_POSITION_PRECEDING)) {
      footerEl.parentNode.insertBefore(target, footerEl);
    }

    target.style.display = '';
    target.style.visibility = 'visible';
    target.style.opacity = '1';

    let parent = target.parentElement;
    while (parent && parent !== document.body && parent !== document.documentElement) {
      if (parent.style && parent.style.display === 'none') parent.style.display = 'block';
      if (parent.style && parent.style.visibility === 'hidden') parent.style.visibility = 'visible';
      parent = parent.parentElement;
    }

    document.querySelectorAll('header, .navbar, #app-header, .top-bar, #floating-home-btn, .floating-home').forEach(function(el) {
      if (el && el.style && el.style.display === 'none') el.style.display = '';
    });
    
    host = target;

    host.innerHTML = 
      '<div class="game-galton-board">' +
        '<div class="app-header">' +
          '<div class="app-title">📊 갈톤 보드 구슬 드롭</div>' +
          '<div class="header-btns">' +
            '<button class="btn btn-primary" id="btn-guide">📖 방법</button>' +
            '<button class="btn" style="background:#f59e0b;" id="btn-rank-submit">🏆 랭킹</button>' +
            '<button class="btn btn-home" id="btn-home">🏠 홈</button>' +
          '</div>' +
        '</div>' +
        '<div class="main-area">' +
          '<div class="status-bar">' +
            '<span class="asset-label">내 자산:</span>' +
            '<span class="asset-display" id="gb-asset">1,000 P</span>' +
          '</div>' +
          '<div class="control-panel">' +
            '<div class="panel-box">' +
              '<div class="panel-title">보드 설정 (못의 단수)</div>' +
              '<div class="btn-group">' +
                '<button class="opt-btn btn-rows" data-val="4">4단 (초급)</button>' +
                '<button class="opt-btn btn-rows active" data-val="8">8단 (일반)</button>' +
                '<button class="opt-btn btn-rows" data-val="12">12단 (도전)</button>' +
              '</div>' +
              '<div class="range-slider-wrap">' +
                '<span>좌측 쏠림 (0.2)</span>' +
                '<input type="range" id="gb-p-slider" min="0.2" max="0.8" step="0.1" value="0.5" style="flex:1;">' +
                '<span>우측 쏠림 (0.8)</span>' +
              '</div>' +
              '<div style="text-align:center; color:#94a3b8; font-size:0.9rem; margin-top:5px;">현재 우측 이동 확률 (p) = <span id="gb-p-val" style="color:#a78bfa; font-weight:bold;">0.5</span></div>' +
            '</div>' +
            '<div class="panel-box">' +
              '<div class="panel-title">시뮬레이션 모드</div>' +
              '<div class="btn-group">' +
                '<button class="opt-btn btn-drops active" data-val="1">1개 드롭 (베팅)</button>' +
                '<button class="opt-btn btn-drops" data-val="10">10개 드롭 (베팅)</button>' +
                '<button class="opt-btn btn-drops" data-val="1000">1000개 드롭 (관찰)</button>' +
              '</div>' +
            '</div>' +
          '</div>' +
          
          '<div class="canvas-container">' +
            '<canvas id="gb-canvas"></canvas>' +
            '<div class="canvas-overlay">' +
              '<div class="canvas-stat" id="gb-chart-stat">대기 중...</div>' +
            '</div>' +
          '</div>' +

          '<div class="panel-box">' +
            '<div class="bet-inputs">' +
              '<div class="input-row">' +
                '<span class="asset-label">도착 칸(0~N) 예측:</span>' +
                '<input type="number" id="gb-bet-bin" class="num-input" value="4" min="0" max="8">' +
                '<span id="gb-path-info" style="color:#94a3b8; margin-left:10px;">해당 칸 경로 수: 70</span>' +
              '</div>' +
              '<div class="input-row">' +
                '<span class="asset-label">베팅 금액:</span>' +
                '<input type="number" id="gb-bet-amount" class="num-input" value="100" min="0"> P' +
                '<span class="multiplier-info" id="gb-mult">적중 시 --배</span>' +
              '</div>' +
              '<button class="action-btn" id="btn-run-bet">예측 베팅 & 드롭 🚀</button>' +
              '<button class="action-btn observe" id="btn-run-obs">대량 드롭 정규 근사 관찰 (점수 없음) 📈</button>' +
            '</div>' +
          '</div>' +
        '</div>' +
        
        '<div class="bottom-ranking-card" id="board-galton-board-wrapper">' +
          '<div class="ranking-title">🏆 명예의 전당 (최고 점수)</div>' +
          '<div id="board-galton-board">' +
            '<p style="text-align:center; color:#94a3b8; padding:12px 0;">로딩 중...</p>' +
          '</div>' +
        '</div>' +
      '</div>';

    // Event Bindings
    host.querySelector('#btn-home').addEventListener('click', goHome);
    host.querySelector('#btn-guide').addEventListener('click', showGuideModal);
    host.querySelector('#btn-rank-submit').addEventListener('click', showRankingModal);
    
    host.querySelectorAll('.btn-rows').forEach(function(t) {
      t.addEventListener('click', function(e) {
        if (isSimulating) return;
        rows = parseInt(e.target.dataset.val);
        initBoard();
        renderUI();
      });
    });

    host.querySelectorAll('.btn-drops').forEach(function(t) {
      t.addEventListener('click', function(e) {
        if (isSimulating) return;
        drops = parseInt(e.target.dataset.val);
        renderUI();
      });
    });
    
    const pSlider = host.querySelector('#gb-p-slider');
    pSlider.addEventListener('input', function(e) {
      if (isSimulating) return;
      probRight = parseFloat(e.target.value);
      initBoard();
      renderUI();
    });

    const updateBetInfo = function() {
      let currentBin = parseInt(host.querySelector('#gb-bet-bin').value) || 0;
      if (currentBin < 0) currentBin = 0;
      if (currentBin > rows) currentBin = rows;
      host.querySelector('#gb-bet-bin').value = currentBin;
      
      const mult = getTheoreticalMultiplier(rows, currentBin, probRight).toFixed(1);
      host.querySelector('#gb-mult').textContent = '적중 시 ' + mult + '배';
      host.querySelector('#gb-path-info').textContent = '해당 칸 경로 수: ' + nCr(rows, currentBin);
    };
    
    host.querySelector('#gb-bet-bin').addEventListener('input', updateBetInfo);
    host.querySelector('#gb-bet-bin').addEventListener('change', updateBetInfo);

    host.querySelector('#btn-run-bet').addEventListener('click', handleBetting);
    host.querySelector('#btn-run-obs').addEventListener('click', handleObserve);

    setTimeout(function() {
      const canvas = host.querySelector('#gb-canvas');
      if (canvas) {
        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = canvas.parentElement.clientHeight;
      }
      initBoard();
      renderUI();
      renderBottomLeaderboard();
    }, 100);
    
    window.addEventListener('resize', function() {
      if (host && host.querySelector('#gb-canvas')) {
        const c = host.querySelector('#gb-canvas');
        c.width = c.parentElement.clientWidth;
        c.height = c.parentElement.clientHeight;
        drawCanvas();
      }
    });
  }

  function resetGame() {
    asset = 1000;
    rows = 8;
    probRight = 0.5;
    drops = 1;
    if (animReq) cancelAnimationFrame(animReq);
    initBoard();
    renderUI();
  }

  function destroy() {
    if (animReq) cancelAnimationFrame(animReq);
    if (host) host.innerHTML = '';
  }

  return { mount: mount, resetGame: resetGame, destroy: destroy, goHome: goHome };
})();

function registerGaltonBoard() {
  if (typeof window.MathLabGames !== 'undefined' && typeof window.MathLabGames.register === 'function') {
    if (!window.MathLabGames.get('galton-board')) {
      try {
        window.MathLabGames.register({
          id: 'galton-board',
          title: '갈톤 보드 구슬 드롭',
          icon: '📊',
          sourceType: 'new',
          players: '1인',
          isMultiplayer: false,
          mount: function(container, context) { GaltonBoard.mount(container, context); },
          reset: function() { GaltonBoard.resetGame(); },
          destroy: function() { GaltonBoard.destroy(); },
          goHome: function() { GaltonBoard.goHome(); }
        });
      } catch (e) {
        console.warn('galton-board 안전 등록 방어:', e);
      }
    }
  }
}

registerGaltonBoard();
window.addEventListener('DOMContentLoaded', registerGaltonBoard);
setTimeout(registerGaltonBoard, 100);
setTimeout(registerGaltonBoard, 500);

window.GaltonBoardModule = GaltonBoard;

window.initGaltonBoardGame = function() {
  registerGaltonBoard();
  if (window.LegacyBridge && typeof window.LegacyBridge.hideAllLegacySections === 'function') {
    window.LegacyBridge.hideAllLegacySections();
    window.LegacyBridge.showNewRoot();
  }
  if (typeof window.MathLabGames !== 'undefined' && typeof window.MathLabGames.mount === 'function') {
    try { window.MathLabGames.mount('galton-board'); return; } catch(e) {}
  }
  const targetEl = document.getElementById('mathlab-view') || document.getElementById('new-root');
  GaltonBoard.mount(targetEl);
};

window.launchMathLabGame = window.launchMathLabGame || function(id) {
  if (id === 'galton-board') {
    window.initGaltonBoardGame();
  }
};
</script>
