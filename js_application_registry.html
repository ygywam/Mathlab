<script>
  window.MathLabApplications = (function () {
    const applications = new Map();

    return {
      register(application) {
        if (!application || !application.id) {
          throw new Error('실생활 응용 앱 id가 없습니다.');
        }

        if (applications.has(application.id)) {
          applications.set(application.id, application);
          return;
        }

        applications.set(application.id, application);
      },

      get(id) {
        return applications.get(id);
      },

      all() {
        return Array.from(applications.values());
      },

      mount(id, context = {}) {
        const application = applications.get(id);

        if (!application) {
          throw new Error('Unknown application: ' + id);
        }

        const modalOverlay = document.getElementById('mathlab-global-modal-overlay');
        const defaultContainer = document.getElementById('mathlab-global-modal-content') || document.getElementById('mathlab-view') || document.getElementById('new-root') || document.body;
        
        if (modalOverlay) {
          modalOverlay.classList.remove('hidden');
          document.body.style.overflow = 'hidden';
        }

        return application.mount(defaultContainer, context);
      }
    };
  })();
</script>
