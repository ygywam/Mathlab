  /* 3D 전개도 파트 */
  .scene-container { perspective: 1200px; }
  .scene { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; transform-style: preserve-3d; }
  .cube { width: 120px; height: 120px; position: relative; transform-style: preserve-3d; transition: transform 1.5s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; }
  @keyframes spinCube { from { transform: rotateX(-20deg) rotateY(0deg); } to { transform: rotateX(-20deg) rotateY(360deg); } }
  .cube.folded { animation: spinCube 10s infinite linear forwards; }
  .cube.unfolded { transform: rotateX(0deg) rotateY(0deg) scale(0.6); animation: none; }
  .face { position: absolute; width: 120px; height: 120px; background: rgba(108, 92, 231, 0.85); border: 2px solid #ffffff; box-shadow: inset 0 0 20px rgba(0,0,0,0.1); display: flex; justify-content: center; align-items: center; font-size: 1.8rem; color: #ffffff; font-weight: bold; transition: transform 1.5s cubic-bezier(0.4, 0, 0.2, 1); backface-visibility: visible; }
  .cube.unfolded .front  { transform: translateX(0) translateY(0) translateZ(0); }
  .cube.unfolded .top    { transform: translateX(0) translateY(-120px) translateZ(0); }
  .cube.unfolded .bottom { transform: translateX(0) translateY(120px) translateZ(0); }
  .cube.unfolded .left   { transform: translateX(-120px) translateY(0) translateZ(0); }
  .cube.unfolded .right  { transform: translateX(120px) translateY(0) translateZ(0); }
  .cube.unfolded .back   { transform: translateX(240px) translateY(0) translateZ(0); }
  .cube.folded .front  { transform: rotateY(0deg) translateZ(60px); }
  .cube.folded .top    { transform: rotateX(90deg) translateZ(60px); }
  .cube.folded .bottom { transform: rotateX(-90deg) translateZ(60px); }
  .cube.folded .left   { transform: rotateY(-90deg) translateZ(60px); }
  .cube.folded .right  { transform: rotateY(90deg) translateZ(60px); }
  .cube.folded .back   { transform: rotateY(180deg) translateZ(60px); }
