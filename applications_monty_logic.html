<style>
/* Gen-3 수학 실험실 표준 테마 (Premium Light) 및 몬티홀 딜레마 스타일 */
#monty-container {
  background: #ffffff;
  color: #1e293b;
  padding: 24px;
  border-radius: 16px;
  max-width: 900px;
  margin: 0 auto;
  box-shadow: 0 10px 25px rgba(0,0,0,0.1);
  border: 1px solid #e2e8f0;
}
#monty-container .app-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  border-bottom: 1px solid #e2e8f0;
  padding-bottom: 15px;
}
#monty-container .app-header h1 { margin: 0; font-size: 2rem; color: #0f172a; }
#monty-container .header-btns { display: flex; gap: 10px; }

.monty-btn {
  background: #f1f5f9;
  color: #334155;
  border: 1px solid #cbd5e1;
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
  transition: all 0.2s;
}
.monty-btn:hover { background: #e2e8f0; }
.monty-btn.primary { background: #3b82f6; color: #ffffff; border-color: #2563eb; }
.monty-btn.primary:hover { background: #2563eb; }
.monty-btn.save-btn { background: #10b981; color: #ffffff; border-color: #059669; }
.monty-btn.save-btn:hover { background: #059669; }

.highlight-msg {
  background: #f0fdfa;
  color: #0f766e;
  border: 1px solid #99f6e4;
  padding: 15px;
  border-radius: 8px;
  font-size: 1.2rem;
  font-weight: bold;
  text-align: center;
  margin-bottom: 30px;
}

.doors-wrapper {
  display: flex;
  justify-content: center;
  gap: 30px;
  margin-bottom: 40px;
  perspective: 1000px;
}

/* 🚪 문 크기 변형 버그 원천 차단 (box-sizing 및 고정 테두리 두께) */
.door-box {
  width: 140px;
  height: 200px;
  background: #f8fafc;
  border: 4px solid #cbd5e1;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 4rem;
  cursor: pointer;
  box-sizing: border-box; /* 핵심 버그 픽스 */
  transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), border-color 0.3s, background 0.3s;
  user-select: none;
}
.door-box:hover {
  transform: translateY(-5px);
  border-color: #94a3b8;
}
.door-box.selected {
  border-color: #f59e0b;
  background: #fffbeb;
  transform: translateY(-10px);
  box-shadow: 0 10px 20px rgba(245, 158, 11, 0.15);
}
.door-box.opened {
  background: #f1f5f9;
  border-color: #ef4444;
  cursor: default;
  transform: rotateY(15deg);
}
.door-box.opened.win {
  border-color: #10b981;
}

#monty-actions, #monty-next {
  text-align: center;
  margin-bottom: 40px;
}
#monty-actions .monty-btn { font-size: 1.1rem; padding: 12px 24px; margin: 0 10px; }
#monty-next .monty-btn { font-size: 1.2rem; padding: 15px 30px; }
.hidden { display: none !important; }

.monty-stats {
  background: #f8fafc;
  border: 1px solid #e2e8f0;
  padding: 20px;
  border-radius: 12px;
}
.stat-row {
  display: flex;
  align-items: center;
  margin-bottom: 8px;
}
.stat-label { width: 100px; font-weight: bold; color: #475569; }
.stat-bar-bg {
  flex: 1;
  background: #e2e8f0;
  height: 24px;
  border-radius: 12px;
  overflow: hidden;
  margin: 0 15px;
}
.stat-bar-fill { height: 100%; transition: width 0.5s ease-out; }
.stat-percent { width: 50px; text-align: right; font-weight: bold; color: #0f172a; }
.stat-detail { color: #64748b; font-size: 0.9rem; text-align: right; margin: 0; }

/* Guide Modal */
#monty-modal-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(15, 23, 42, 0.6);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 99999;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}
#monty-modal-overlay.show {
  opacity: 1;
  pointer-events: auto;
}
.monty-modal-content {
  background: #ffffff;
  color: #1e293b;
  padding: 30px;
  border-radius: 16px;
  max-width: 500px;
  width: 90%;
  border: 1px solid #e2e8f0;
  box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
  line-height: 1.6;
}
.monty-modal-content h2 { color: #3b82f6; margin-top: 0; }
</style>

<script>
const ConceptMontyApp = (function() {
  let montyState = 0; // 0: select door, 1: choice to switch, 2: result
  let carDoorIndex = 0;
  let selectedDoorIndex = -1;
  let openedGoatIndex = -1;
  let stats = { stayWins: 0, stayTotal: 0, switchWins: 0, switchTotal: 0 };

  function mount(container, context = {}) {
    let host = null;
    if (typeof container === 'string') host = document.querySelector(container);
    else if (container instanceof HTMLElement) host = container;
    if (!host) host = window.MathLabUtils?.getMountContainer ? window.MathLabUtils.getMountContainer(container) : document.getElementById('mathlab-view');
    if (!host || !(host instanceof HTMLElement)) host = document.getElementById('new-root') || document.getElementById('game-container') || document.getElementById('mathlab-view');

    if (!host || !(host instanceof HTMLElement) || host === document.body) {
      let createdHost = document.getElementById('monty-force-host');
      if (!createdHost) {
        createdHost = document.createElement('div');
        createdHost.id = 'monty-force-host';
        document.body.appendChild(createdHost);
      }
      host = createdHost;
    }

    const footerEl = document.querySelector('footer, #footer, .app-footer') || 
                     Array.from(document.querySelectorAll('div, p, span')).find(el => el.textContent && el.textContent.includes('2026 기록조율사'));
    if (footerEl && host && typeof host.compareDocumentPosition === 'function' && (host.compareDocumentPosition(footerEl) & Node.DOCUMENT_POSITION_PRECEDING)) {
      footerEl.parentNode.insertBefore(host, footerEl);
    }

    host.style.display = '';
    host.style.visibility = 'visible';
    host.style.opacity = '1';

    let parent = host.parentElement;
    while (parent && parent !== document.body && parent !== document.documentElement) {
      if (parent.style && parent.style.display === 'none') parent.style.display = 'block';
      if (parent.style && parent.style.visibility === 'hidden') parent.style.visibility = 'visible';
      parent = parent.parentElement;
    }

    document.querySelectorAll('header, .navbar, #app-header, .top-bar, #floating-home-btn, .floating-home').forEach(el => {
      if (el && el.style && el.style.display === 'none') el.style.display = '';
    });

    host.innerHTML = `
      <div id="monty-container">
        <div class="app-header">
          <h1>몬티홀 딜레마 🚪</h1>
          <div class="header-btns">
            <button class="monty-btn primary" onclick="ConceptMontyApp.showGuide()">📖 딜레마 가이드</button>
            <button class="monty-btn" onclick="ConceptMontyApp.goHome()">🏠 홈으로</button>
          </div>
        </div>
        
        <p id="monty-message" class="highlight-msg">3개의 문 중 하나에 🚘 자동차가 있습니다. 행운의 문을 선택하세요!</p>
        
        <div class="doors-wrapper">
          <div class="door-box" id="door-0" onclick="ConceptMontyApp.clickDoor(0)"><div id="door-content-0">🚪</div></div>
          <div class="door-box" id="door-1" onclick="ConceptMontyApp.clickDoor(1)"><div id="door-content-1">🚪</div></div>
          <div class="door-box" id="door-2" onclick="ConceptMontyApp.clickDoor(2)"><div id="door-content-2">🚪</div></div>
        </div>
        
        <div id="monty-actions" class="hidden">
          <button class="monty-btn" style="background: #475569;" onclick="ConceptMontyApp.finalChoice(false)">🔒 선택 유지하기</button>
          <button class="monty-btn save-btn" onclick="ConceptMontyApp.finalChoice(true)">🔄 다른 문으로 바꾸기</button>
        </div>
        
        <div id="monty-next" class="hidden">
          <button class="monty-btn primary" onclick="ConceptMontyApp.initMonty()">▶ 다음 라운드 진행하기</button>
        </div>
        
        <div class="monty-stats">
          <h3 style="margin-bottom: 20px; font-size: 1.2rem; color:#38bdf8;">📊 누적 실험 결과 (확률의 법칙)</h3>
          
          <div class="stat-row">
            <span class="stat-label">선택 유지 승률</span>
            <div class="stat-bar-bg"><div class="stat-bar-fill" id="stat-stay-bar" style="background:#94a3b8; width:0%;"></div></div>
            <span class="stat-percent" id="stat-stay-text">0%</span>
          </div>
          <p class="stat-detail" id="stat-stay-detail">0승 / 0회 시도</p>
          
          <div class="stat-row" style="margin-top: 20px;">
            <span class="stat-label" style="color:#d97706;">바꿨을 때 승률</span>
            <div class="stat-bar-bg"><div class="stat-bar-fill" id="stat-switch-bar" style="background:#10b981; width:0%;"></div></div>
            <span class="stat-percent" id="stat-switch-text" style="color:#d97706;">0%</span>
          </div>
          <p class="stat-detail" id="stat-switch-detail">0승 / 0회 시도</p>
        </div>
      </div>

      <!-- Guide Modal -->
      <div id="monty-modal-overlay">
        <div class="monty-modal-content">
          <h2>💡 몬티홀 딜레마란?</h2>
          <p>미국의 TV 쇼 "Let's Make a Deal"에서 유래된 유명한 <strong>조건부 확률</strong> 문제입니다.</p>
          <ul style="padding-left: 20px; color: #475569;">
            <li style="margin-bottom: 10px;">참가자가 3개의 문 중 하나를 고릅니다. (자동차 당첨 확률 1/3)</li>
            <li style="margin-bottom: 10px;">정답을 알고 있는 진행자(몬티 홀)가 남은 2개의 문 중 <strong>반드시 염소가 있는 문</strong>을 열어줍니다.</li>
            <li style="margin-bottom: 10px;">이때 선택을 바꾸는 것이 유리할까요? 유지하는 것이 유리할까요?</li>
          </ul>
          <p style="color:#d97706; font-size:0.95rem; margin-top:15px; font-weight:bold;">직접 여러 번 게임을 반복하며 하단의 누적 통계 그래프(승률)가 어떻게 변하는지 확인해 보세요!</p>
          <div style="text-align:right; margin-top:20px;">
            <button class="monty-btn primary" onclick="ConceptMontyApp.hideGuide()">이해했습니다</button>
          </div>
        </div>
      </div>
    `;

    initMonty();
  }

  function initMonty() {
    montyState = 0;
    selectedDoorIndex = -1;
    openedGoatIndex = -1;
    carDoorIndex = Math.floor(Math.random() * 3);

    document.getElementById('monty-message').innerHTML = '3개의 문 중 하나에 🚘 자동차가 있습니다. 행운의 문을 선택하세요!';
    document.getElementById('monty-message').style.borderColor = '#0284c7';
    document.getElementById('monty-message').style.color = '#38bdf8';

    document.getElementById('monty-actions').classList.add('hidden');
    document.getElementById('monty-next').classList.add('hidden');

    for (let i = 0; i < 3; i++) {
      let door = document.getElementById(`door-${i}`);
      door.className = 'door-box';
      document.getElementById(`door-content-${i}`).innerText = '🚪';
    }
  }

  function clickDoor(index) {
    if (montyState !== 0) return;

    selectedDoorIndex = index;
    document.getElementById(`door-${index}`).classList.add('selected');

    let goats = [0, 1, 2].filter(i => i !== selectedDoorIndex && i !== carDoorIndex);
    openedGoatIndex = goats[Math.floor(Math.random() * goats.length)];

    document.getElementById(`door-${openedGoatIndex}`).classList.add('opened');
    document.getElementById(`door-content-${openedGoatIndex}`).innerText = '🐐';

    document.getElementById('monty-message').innerHTML = `진행자가 <strong>${openedGoatIndex + 1}번 문(염소)</strong>을 열었습니다. 선택을 바꾸시겠습니까?`;
    document.getElementById('monty-message').style.borderColor = '#facc15';
    document.getElementById('monty-message').style.color = '#facc15';

    document.getElementById('monty-actions').classList.remove('hidden');
    montyState = 1;
  }

  function finalChoice(isSwitching) {
    if (montyState !== 1) return;

    let finalDoorIndex = isSwitching
      ? [0, 1, 2].find(i => i !== selectedDoorIndex && i !== openedGoatIndex)
      : selectedDoorIndex;

    if (isSwitching) stats.switchTotal++;
    else stats.stayTotal++;

    let isWin = (finalDoorIndex === carDoorIndex);

    if (isSwitching && isWin) stats.switchWins++;
    if (!isSwitching && isWin) stats.stayWins++;

    for (let i = 0; i < 3; i++) {
      let door = document.getElementById(`door-${i}`);
      door.classList.add('opened');
      door.classList.remove('selected');

      if (i === finalDoorIndex) {
        door.classList.add('selected');
        if (isWin) door.classList.add('win');
      }

      document.getElementById(`door-content-${i}`).innerText = (i === carDoorIndex) ? '🚘' : '🐐';
    }

    if (isWin) {
      document.getElementById('monty-message').innerHTML = '축하합니다! 🚘 자동차 획득 성공!';
      document.getElementById('monty-message').style.borderColor = '#34d399';
      document.getElementById('monty-message').style.color = '#34d399';
    } else {
      document.getElementById('monty-message').innerHTML = '아쉽습니다. 염소가 나왔네요. 🐐';
      document.getElementById('monty-message').style.borderColor = '#ef4444';
      document.getElementById('monty-message').style.color = '#ef4444';
    }

    document.getElementById('monty-actions').classList.add('hidden');
    document.getElementById('monty-next').classList.remove('hidden');

    const stayRate = stats.stayTotal === 0 ? 0 : Math.round((stats.stayWins / stats.stayTotal) * 100);
    const switchRate = stats.switchTotal === 0 ? 0 : Math.round((stats.switchWins / stats.switchTotal) * 100);

    document.getElementById('stat-stay-bar').style.width = `${stayRate}%`;
    document.getElementById('stat-stay-text').innerText = `${stayRate}%`;
    document.getElementById('stat-stay-detail').innerText = `${stats.stayWins}승 / ${stats.stayTotal}회`;

    document.getElementById('stat-switch-bar').style.width = `${switchRate}%`;
    document.getElementById('stat-switch-text').innerText = `${switchRate}%`;
    document.getElementById('stat-switch-detail').innerText = `${stats.switchWins}승 / ${stats.switchTotal}회`;

    montyState = 2;
  }

  function showGuide() {
    const modal = document.getElementById('monty-modal-overlay');
    if (modal) modal.classList.add('show');
  }

  function hideGuide() {
    const modal = document.getElementById('monty-modal-overlay');
    if (modal) modal.classList.remove('show');
  }

  function goHome() {
    if (window.LegacyBridge && typeof window.LegacyBridge.backHome === 'function') {
      window.LegacyBridge.backHome();
    }
  }

  return {
    mount,
    initMonty,
    clickDoor,
    finalChoice,
    showGuide,
    hideGuide,
    goHome
  };
})();

/* 하단 안전 등록 및 레거시/Gen-3 상호 실행 브리지 */
function registerConceptMontyApp() {
  if (typeof window.MathLabGames !== 'undefined' && typeof window.MathLabGames.register === 'function') {
    if (!window.MathLabGames.get('monty-app')) {
      try {
        window.MathLabGames.register({
          id: 'monty-app',
          title: '몬티홀 딜레마',
          icon: '🚪',
          sourceType: 'new',
          players: '1인',
          isMultiplayer: false,
          mount(container, context) { ConceptMontyApp.mount(container, context); },
          reset() { ConceptMontyApp.initMonty(); },
          destroy() { },
          goHome() { ConceptMontyApp.goHome(); }
        });
      } catch (e) { console.warn('monty-app 등록 방어:', e); }
    }
  }
}

registerConceptMontyApp();
window.addEventListener('DOMContentLoaded', registerConceptMontyApp);
setTimeout(registerConceptMontyApp, 100);
setTimeout(registerConceptMontyApp, 500);

window.ConceptMontyApp = ConceptMontyApp;

// 레거시 onclick="openApp('monty-app')" 처리 브리지용 글로벌 함수 노출은 불필요할 수 있으나, 
// 1,2세대 앱 전환 호환성을 위해 window에 initMonty를 남겨둠. 
window.initMonty = function() {
  registerConceptMontyApp();
  if (window.LegacyBridge && typeof window.LegacyBridge.hideAllLegacySections === 'function') {
    window.LegacyBridge.hideAllLegacySections();
    window.LegacyBridge.showNewRoot();
  }
  if (typeof window.MathLabGames !== 'undefined' && typeof window.MathLabGames.mount === 'function') {
    try { window.MathLabGames.mount('monty-app'); return; } catch(e) {}
  }
  const targetEl = document.getElementById('mathlab-view') || document.getElementById('new-root');
  ConceptMontyApp.mount(targetEl);
};
</script>
