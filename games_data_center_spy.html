<script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>

<script>
(function(){

  {

    html: '<p>데이터의 중앙 경향을 나타내는 지표를 <b>대푯값(Representative Value)</b>이라고 하며, 대표적으로 <b>평균, 중앙값, 최빈값</b>이 있습니다.</p>' +
          '<p>이때 극단적으로 크거나 작은 값인 <b>이상치(Outlier)</b>가 데이터 세트에 포함되면 대푯값에 어떤 변화가 생기는지 탐구합니다.</p>'
  },
  {
    title: '📐 대푯값 3종 수식 정의',
    html: '<p>데이터 <span class="math-tex" data-tex="x_1, x_2, \\dots, x_n"></span>에 대하여:</p>' +

          '  <li><b>평균 (<span class="math-tex" data-tex="\\bar{x}"></span>):</b> <span class="math-tex" data-tex="\\bar{x} = \\frac{1}{n}\\sum_{i=1}^n x_i"></span> (모든 합을 개수로 나눈 값)</li>' +

  if (typeof katex !== 'undefined' && container) {

      katex.render(latex, container, { throwOnError: false, displayMode: !!displayMode });
      return;
    } catch(e){}
  }
  if (container) container.textContent = latex;
}

function updateMathElements() {
  document.querySelectorAll('.math-tex').forEach(function(el) {
    var tex = el.getAttribute('data-tex');
    var isDisplay = el.getAttribute('data-display') === 'true';
    if (tex) renderMath(tex, el, isDisplay);
  });
}

function calcMean(arr) {
  if (!arr.length) return 0;
  return arr.reduce(function(a, b) { return a + b; }, 0) / arr.length;
}

function calcMedian(arr) {
  if (!arr.length) return 0;
  var s = arr.slice().sort(function(a, b) { return a - b; });
  var mid = Math.floor(s.length / 2);
  return (s.length % 2 !== 0) ? s[mid] : (s[mid - 1] + s[mid]) / 2;
}

function calcMode(arr) {
  if (!arr.length) return 0;
  var map = {}, maxCount = 0, best = arr[0];
  for (var i = 0; i < arr.length; i++) {
    map[arr[i]] = (map[arr[i]] || 0) + 1;
    if (map[arr[i]] > maxCount) {
      maxCount = map[arr[i]];
      best = arr[i];
    }
  }
  return best;
}

    host.innerHTML = this.renderChrome();

    h += '  <div id="tab-sec-prob" style="display:none;">';
    h += '    <div class="card">';
    h += '      <div class="card-title">🧩 실전 대푯값 및 통계 탐구 문제 (4선)</div>';

    var probs = [
      {
        title: "Q1. 평균 소득 통계 착시 현상",
        q: "한 기업의 구성원 10명의 월급이 9명은 300만 원이고, 사장 1명은 5,000만 원입니다. 평균 월급과 중앙값 월급은 각각 얼마일까요?",
        sol: "<b>[수학적 계산]</b><br>• 평균: <span class=\"math-tex\" data-tex=\"\\bar{x} = \\frac{9 \\times 300 + 5000}{10} = 770\\text{만 원}\"></span><br>• 중앙값: <span class=\"math-tex\" data-tex=\"m = 300\\text{만 원}\"></span><br>• 사장의 이상치 수입으로 인해 평균은 770만 원이지만 실제 90% 사원의 대푯값은 중앙값 300만 원입니다."
      },
      {
        title: "Q2. 데이터 세트 변화와 대푯값 변동성",
        q: "어떤 수열의 모든 데이터 값에 각각 10을 더하고 2를 곱할 때, 평균과 중앙값은 어떻게 변할까요?",
        sol: "<b>[수학적 성질]</b><br>• 신규 평균: <span class=\"math-tex\" data-tex=\"\\bar{x}_{\\text{신규}} = 2(\\bar{x} + 10)\"></span><br>• 신규 중앙값: <span class=\"math-tex\" data-tex=\"m_{\\text{신규}} = 2(m + 10)\"></span><br>• 선형 변환 규칙은 평균과 중앙값 모두에 동일하게 적용됩니다."
      },
      {
        title: "Q3. 사분위수 범주(IQR)를 활용한 이상치 판단 기준",
        q: "통계학에서 이상치를 수학적으로 정의하는 사분위수 범주(IQR) 기반 기준 공식은 무엇일까요?",
        sol: "<b>[수학적 해설]</b><br>• <span class=\"math-tex\" data-tex=\"\\text{IQR} = Q_3 - Q_1\"></span><br>• 하한선 <span class=\"math-tex\" data-tex=\"Q_1 - 1.5 \\times \\text{IQR}\"></span> 미만이거나 상한선 <span class=\"math-tex\" data-tex=\"Q_3 + 1.5 \\times \\text{IQR}\"></span> 초과인 데이터를 이상치로 정의합니다."
      },
      {
        title: "Q4. 주택 매매 시세 대푯값 선정",
        q: "아파트 단지의 실거래가 시세를 발표할 때 최고가 극단값을 제외한 중앙값을 사용하는 이유는?",
        sol: "<b>[수학적 분석]</b><br>• 펜트하우스 등의 특수 대형 평수 거래(이상치)가 전체 일반 평수의 시세 평균을 왜곡하는 현상을 방지하기 위해 강건한(Robust) 중앙값을 기준 시세로 사용합니다."
      }
    ];

    probs.forEach(function(item, idx) {
      h += '<div style="background:#ffffff; border:1px solid #e2e8f0; border-radius:14px; padding:16px; margin-bottom:14px;">';
      h += '  <div style="font-weight:900; font-size:1.05rem; color:#0284c7; margin-bottom:6px;">' + item.title + '</div>';
      h += '  <div style="line-height:1.6; color:#334155; margin-bottom:10px;">' + item.q + '</div>';
      h += '  <button type="button" class="btn p btn-show-sol" data-idx="' + idx + '">💡 수학적 해설 보기</button>';
      h += '  <div id="sol-' + idx + '" style="display:none; background:#f8fafc; border:1px solid #cbd5e1; border-radius:12px; padding:14px; margin-top:10px; font-size:0.92rem; line-height:1.65;">' + item.sol + '</div>';
      h += '</div>';
    });

    h += '  </div>';
    h += '  </div>';

    /* Slide Modal */
    h += '<div class="modal" id="ds-modal">';
    h += '  <div class="mbox" id="ds-modal-box"></div>';
    h += '</div>';

    h += '</div>';
    return h;
  },

  bindEvents: function() {
    var _this = this;
    var root = S.host.querySelector('#ds-app-root');

    /* Tabs */
    root.querySelectorAll('.tab-btn').forEach(function(btn) {
      btn.onclick = function() {
        root.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
        this.classList.add('active');
        S.activeTab = this.getAttribute('data-tab');

        root.querySelector('#tab-sec-sim').style.display = (S.activeTab === 'sim') ? 'block' : 'none';
        root.querySelector('#tab-sec-math').style.display = (S.activeTab === 'math') ? 'block' : 'none';
        root.querySelector('#tab-sec-prob').style.display = (S.activeTab === 'prob') ? 'block' : 'none';

        updateMathElements();
      };
    });

    /* Difficulty Buttons */
    root.querySelector('#btn-diff-easy').onclick = function() {
      S.diff = 'easy';
      this.className = 'btn p';
      root.querySelector('#btn-diff-norm').className = 'btn';
      _this.startRound();
    };
    root.querySelector('#btn-diff-norm').onclick = function() {
      S.diff = 'normal';
      this.className = 'btn p';
      root.querySelector('#btn-diff-easy').className = 'btn';
      _this.startRound();
    };

    /* Actions */
    root.querySelector('#btn-arrest-choice').onclick = function() { _this.submitChoice(); };
    root.querySelector('#btn-next-round').onclick = function() { _this.startRound(); };

    /* Quiz */
    root.querySelector('#btn-submit-quiz').onclick = function() {
      var val = (root.querySelector('#inp-quiz-ans').value || '').trim();
      var msgEl = root.querySelector('#lbl-quiz-msg');
      if (val === '30') {
        msgEl.innerHTML = '✅ <b>정답입니다!</b> 오름차순 정렬 시 (10, 20, 30, 40, 500) 세 번째 중앙값은 30입니다. 500이라는 이상치가 있어도 중앙값은 강건하게 유지됩니다.';
        msgEl.style.color = '#059669';
      } else {
        msgEl.innerHTML = '❌ 오답입니다. (힌트: 5개 수치를 정렬했을 때 정확히 3번째 값 30입니다)';
        msgEl.style.color = '#ef4444';
      }
    };

    /* Solutions Toggle */
    root.querySelectorAll('.btn-show-sol').forEach(function(btn) {
      btn.onclick = function() {
        var idx = this.getAttribute('data-idx');
        var solEl = root.querySelector('#sol-' + idx);
        if (solEl) {
          var isShown = solEl.style.display === 'block';
          solEl.style.display = isShown ? 'none' : 'block';
          this.textContent = isShown ? '💡 수학적 해설 보기' : '🙈 해설 닫기';
          updateMathElements();
        }
      };
    });

    /* Modal Open & Render Slide */
    root.querySelector('#btn-open-guide').onclick = function() {
      S.guidePage = 0;
      _this.renderSlideGuide();
      root.querySelector('#ds-modal').classList.add('on');
    };
  },

  startRound: function() {
    S.selected = {};
    S.revealed = false;

    var n = S.diff === 'easy' ? 6 : 10;
    var spyCount = 1;
    var base = [];
    for (var i = 0; i < n - spyCount; i++) {
      base.push(40 + Math.floor(Math.random() * 21)); // 40~60 사이 정규 데이터
    }

    var spyVal = (Math.random() < 0.5) ? (5 + Math.floor(Math.random() * 10)) : (95 + Math.floor(Math.random() * 35));
    var spies = [spyVal];

    var allData = base.concat(spies);
    // Shuffle
    for (var j = allData.length - 1; j > 0; j--) {
      var r = Math.floor(Math.random() * (j + 1));
      var temp = allData[j];
      allData[j] = allData[r];
      allData[r] = temp;
    }

    S.data = allData;
    S.spies = [];
    for (var k = 0; k < S.data.length; k++) {
      if (S.data[k] === spyVal) S.spies.push(k);
    }

    S.meanVal = calcMean(S.data);
    S.medVal = calcMedian(S.data);
    S.modeVal = calcMode(S.data);

    var root = S.host.querySelector('#ds-app-root');
    if (root) {
      root.querySelector('#lbl-stat-mean').textContent = S.meanVal.toFixed(1);
      root.querySelector('#lbl-stat-med').textContent = S.medVal.toFixed(1);
      root.querySelector('#lbl-stat-mode').textContent = S.modeVal;
      root.querySelector('#lbl-sim-status').innerHTML = '이상치 후보 카드를 선택한 후 <b>[검거 및 분석]</b> 버튼을 누르세요.';

      var proofBox = root.querySelector('#math-proof-box');
      if (proofBox) { proofBox.style.display = 'none'; proofBox.innerHTML = ''; }
    }

    this.renderDataCards();
  },

  renderDataCards: function() {
    var _this = this;
    var root = S.host.querySelector('#ds-app-root');
    if (!root) return;

    var grid = root.querySelector('#data-grid-box');
    grid.innerHTML = S.data.map(function(val, idx) {
      var isSel = S.selected[idx];
      var isSpy = S.spies.indexOf(idx) >= 0;

      var cls = 'data-card';
      if (isSel) cls += ' selected';
      if (S.revealed) {
        if (isSpy) cls += ' outlier-target';
        else cls += ' normal-target';
      }

      return '<div class="' + cls + '" data-idx="' + idx + '">' + val + '</div>';
    }).join('');

    grid.querySelectorAll('.data-card').forEach(function(card) {
      card.onclick = function() {
        if (S.revealed) return;
        var idx = parseInt(this.getAttribute('data-idx'), 10);
        if (S.selected[idx]) delete S.selected[idx];
        else S.selected[idx] = true;
        _this.renderDataCards();
      };
    });
  },

  submitChoice: function() {
    var root = S.host.querySelector('#ds-app-root');
    var picks = Object.keys(S.selected).map(Number);

    if (!picks.length) {
      root.querySelector('#lbl-sim-status').innerHTML = '⚠️ 먼저 이상치로 의심되는 <b>숫자 카드를 선택</b>해 주세요!';
      return;
    }

    S.revealed = true;
    var isCorrect = (picks.length === S.spies.length) && picks.every(function(i) { return S.spies.indexOf(i) >= 0; });

    var cleaned = S.data.filter(function(_, i) { return picks.indexOf(i) < 0; });
    var cleanMean = calcMean(cleaned);
    var cleanMed = calcMedian(cleaned);

    var msg = '';
    if (isCorrect) {
      msg = '🎉 <b>이상치 적중!</b> 선택한 데이터(' + picks.map(function(i){return S.data[i];}).join(', ') + ')는 완벽한 이상치입니다!';
    } else {
      msg = '😭 <b>검거 실패!</b> 실제 이상치는 ' + S.spies.map(function(i){return S.data[i];}).join(', ') + ' 카드였습니다.';
    }

    root.querySelector('#lbl-sim-status').innerHTML = msg;
    this.renderDataCards();
    this.renderMathProofBox(cleanMean, cleanMed);
  },

  renderMathProofBox: function(cleanMean, cleanMed) {
    var root = S.host.querySelector('#ds-app-root');
    var proofBox = root.querySelector('#math-proof-box');
    if (!proofBox) return;

    var diffMean = Math.abs(S.meanVal - cleanMean);
    var diffMed = Math.abs(S.medVal - cleanMed);

    var h = '';
    h += '<div style="font-weight:900; color:#0369a1; margin-bottom:8px;">📐 이상치 제거 전후 대푯값 비교 수식 분석</div>';
    
    h += '<div style="font-size:0.9rem; line-height:1.6; color:#334155;">';
    h += '• <b>제거 전 대푯값:</b> 평균 = ' + S.meanVal.toFixed(1) + ', 중앙값 = ' + S.medVal.toFixed(1) + '<br>';
    h += '• <b>제거 후 대푯값:</b> 평균 = ' + cleanMean.toFixed(1) + ', 중앙값 = ' + cleanMed.toFixed(1) + '<br>';
    h += '</div>';

    h += '<div class="math-block"><span class="math-tex" data-display="true" data-tex="\\Delta \\bar{x} = |' + S.meanVal.toFixed(1) + ' - ' + cleanMean.toFixed(1) + '| = ' + diffMean.toFixed(1) + '"></span></div>';
    h += '<div class="math-block" style="background:#f0fdf4; border-color:#bbf7d0;"><span class="math-tex" data-display="true" data-tex="\\Delta m = |' + S.medVal.toFixed(1) + ' - ' + cleanMed.toFixed(1) + '| = ' + diffMed.toFixed(1) + '"></span></div>';

    h += '<div style="font-size:0.88rem; font-weight:800; color:#059669; margin-top:6px;">';
    h += '💡 이상치 제거 시 평균은 <b>' + diffMean.toFixed(1) + '</b>만큼 변동하지만, 중앙값은 단 <b>' + diffMed.toFixed(1) + '</b>만 변동되어 강건함(Robustness)이 확인됩니다.';
    h += '</div>';

    proofBox.innerHTML = h;
    proofBox.style.display = 'block';
    updateMathElements();
  },

  renderSlideGuide: function() {
    var _this = this;
    var root = S.host.querySelector('#ds-app-root');
    var mBox = root.querySelector('#ds-modal-box');
    if (!mBox) return;

    var pg = SLIDE_GUIDE[S.guidePage] || SLIDE_GUIDE[0];
    var dots = SLIDE_GUIDE.map(function(_, i) {
      return '<span class="dot' + (i === S.guidePage ? ' on' : '') + '"></span>';
    }).join('');
    var isLast = S.guidePage >= SLIDE_GUIDE.length - 1;

    var h = '';
    h += '<div style="font-size:.8rem; font-weight:800; color:#0284c7; margin-bottom:4px;">온보딩 슬라이드 탐구 ' + (S.guidePage + 1) + ' / ' + SLIDE_GUIDE.length + '</div>';
    h += '<h3 style="margin:0 0 12px; color:#0f172a; font-weight:900;">' + pg.title + '</h3>';
    h += '<div style="line-height:1.65; color:#334155; font-size:0.95rem;">' + pg.html + '</div>';
    h += '<div class="dots">' + dots + '</div>';

    h += '<div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px;">';
    h += '  <button type="button" class="btn" id="btn-slide-prev"' + (S.guidePage === 0 ? ' disabled' : '') + '>← 이전</button>';
    h += '  <button type="button" class="btn p" id="btn-slide-next">' + (isLast ? '탐구 시작하기 🚀' : '다음 →') + '</button>';
    h += '</div>';

    mBox.innerHTML = h;
    updateMathElements();

    var prevBtn = mBox.querySelector('#btn-slide-prev');
    var nextBtn = mBox.querySelector('#btn-slide-next');

    if (prevBtn) {
      prevBtn.onclick = function() {
        if (S.guidePage > 0) {
          S.guidePage--;
          _this.renderSlideGuide();
        }
      };
    }
    if (nextBtn) {
      nextBtn.onclick = function() {
        if (isLast) {
          root.querySelector('#ds-modal').classList.remove('on');
        } else {
          S.guidePage++;
          _this.renderSlideGuide();
        }
      };
    }
  },

  destroy: function() {
    if (S.host) S.host.innerHTML = '';
    S.host = null;
  }
};

function goHome() {
  if (S.host) S.host.innerHTML = '';
  if (typeof window.LegacyBridge !== 'undefined' && typeof window.LegacyBridge.backHome === 'function') {
    window.LegacyBridge.backHome();
  } else if (typeof window.MathLabGames !== 'undefined' && window.MathLabGames.goHome) {
    window.MathLabGames.goHome();
  } else {
    window.location.reload();
  }
}

function reg() {
  if (typeof window.MathLabGames === 'undefined' || typeof window.MathLabGames.register !== 'function') return;
  try {
    if (window.MathLabGames.get && window.MathLabGames.get(APP_ID)) return;
    window.MathLabGames.register({
      id: APP_ID,
      title: APP_TITLE,
      icon: ICON,
      sourceType: 'new',
      players: '1인',
      isMultiplayer: false,
      mount: function(c, x) { DataCenterSpyApp.mount(c, x); },
      reset: function() { DataCenterSpyApp.startRound(); },
      destroy: function() { DataCenterSpyApp.destroy(); },
      goHome: function() { goHome(); }
    });
  } catch (e) {
    console.warn(APP_ID + ' reg', e);
  }
}

reg();
window.addEventListener('DOMContentLoaded', reg);
setTimeout(reg, 100);
setTimeout(reg, 500);

window.DataCenterSpy = {
  mount: function(c) { DataCenterSpyApp.mount(c); },
  resetGame: function() { DataCenterSpyApp.startRound(); },
  destroy: function() { DataCenterSpyApp.destroy(); },
  goHome: goHome
};

window.initDataCenterSpy = function() {
  reg();
  try {
    if (window.LegacyBridge) {
      window.LegacyBridge.hideAllLegacySections();
      if (window.LegacyBridge.showNewRoot) window.LegacyBridge.showNewRoot();
    }
  } catch (e) {}
  if (window.MathLabGames && window.MathLabGames.mount) {
    try { window.MathLabGames.mount(APP_ID); return; } catch (e) {}
  }
  DataCenterSpyApp.mount(document.getElementById('mathlab-view'));
};

window.launchDataCenterSpy = window.initDataCenterSpy;
})();
</script>
