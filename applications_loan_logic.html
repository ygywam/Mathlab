<style>
/* Gen-3 수학 실험실 표준 테마 (Premium Light) 및 대출 상환 시뮬레이터 스타일 */
#loan-container {
  background: #ffffff;
  color: #1e293b;
  padding: 24px;
  border-radius: 16px;
  max-width: 900px;
  margin: 0 auto;
  box-shadow: 0 10px 25px rgba(0,0,0,0.1);
  border: 1px solid #e2e8f0;
}
#loan-container .app-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  border-bottom: 1px solid #e2e8f0;
  padding-bottom: 15px;
}
#loan-container .app-header h1 { margin: 0; font-size: 2rem; color: #0f172a; }
#loan-container .header-btns { display: flex; gap: 10px; }

.loan-btn {
  background: #f1f5f9;
  color: #334155;
  border: 1px solid #cbd5e1;
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
  transition: all 0.2s;
}
.loan-btn:hover { background: #e2e8f0; }
.loan-btn.primary { background: #3b82f6; color: #ffffff; border-color: #2563eb; }
.loan-btn.primary:hover { background: #2563eb; }

.highlight-msg {
  background: #fffbeb;
  color: #d97706;
  border: 1px solid #fde68a;
  padding: 15px;
  border-radius: 8px;
  font-size: 1.1rem;
  font-weight: bold;
  text-align: center;
  margin-bottom: 20px;
}

/* Toggle Switch */
.toggle-wrapper {
  display: flex;
  justify-content: center;
  margin-bottom: 20px;
}
.toggle-group {
  display: flex;
  background: #f8fafc;
  border: 2px solid #cbd5e1;
  border-radius: 8px;
  overflow: hidden;
  width: 100%;
}
.toggle-group input[type="radio"] { display: none; }
.toggle-label {
  flex: 1;
  text-align: center;
  padding: 12px 15px;
  cursor: pointer;
  color: #475569;
  font-weight: bold;
  transition: 0.3s;
}
.toggle-group input[type="radio"]:checked + .toggle-label {
  background: #3b82f6;
  color: #ffffff;
}
.toggle-label:not(:last-child) { border-right: 1px solid #cbd5e1; }

/* Chart Container */
.chart-wrapper {
  background: #ffffff;
  border: 1px solid #e2e8f0;
  border-radius: 12px;
  padding: 15px;
  height: 350px;
  margin-bottom: 20px;
  box-shadow: 0 4px 6px rgba(0,0,0,0.02);
}

/* Sliders */
.sliders-wrapper {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
  margin-bottom: 20px;
  background: #f8fafc;
  padding: 20px;
  border-radius: 12px;
  border: 1px solid #e2e8f0;
}
.sliders-wrapper.full-width { grid-template-columns: 1fr; }
.slider-group label {
  display: block;
  font-weight: bold;
  color: #475569;
  margin-bottom: 8px;
}
.slider-group span {
  color: #0f172a;
  font-size: 1.1rem;
}
.slider-group input[type="range"] {
  width: 100%;
  accent-color: #3b82f6;
}

/* Result Board */
.calc-board {
  background: #ffffff;
  border: 1px solid #e2e8f0;
  border-radius: 12px;
  padding: 20px;
  box-shadow: 0 4px 6px rgba(0,0,0,0.02);
}
.formula-title {
  color: #3b82f6;
  font-weight: bold;
  margin-bottom: 10px;
}
.formula-math {
  color: #1e293b;
  font-size: 1.2rem;
  padding-bottom: 15px;
  border-bottom: 1px dashed #cbd5e1;
  text-align: center;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.calc-results {
  display: flex;
  justify-content: space-between;
  margin-top: 15px;
  font-size: 1rem;
  color: #475569;
}
.calc-results span strong { color: #0f172a; font-size: 1.1rem; }
.calc-results span .interest-val { color: #ef4444; }
.survey-result {
  margin-top: 15px;
  background: #f8fafc;
  padding: 15px;
  border-radius: 8px;
  text-align: center;
  border: 1px solid #e2e8f0;
}
.survey-result strong { color: #3b82f6; font-size: 1.3rem; }
.survey-result span { display: block; margin-top: 5px; color: #64748b; }

/* Guide Modal */
#loan-modal-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(15, 23, 42, 0.6);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 99999;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}
#loan-modal-overlay.show { opacity: 1; pointer-events: auto; }
.loan-modal-content {
  background: #ffffff;
  color: #1e293b;
  padding: 30px;
  border-radius: 16px;
  max-width: 500px;
  width: 90%;
  border: 1px solid #e2e8f0;
  box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
  line-height: 1.6;
}
.loan-modal-content h2 { color: #3b82f6; margin-top: 0; }
</style>

<script>
const ConceptLoanApp = (function() {
  let loanChart;
  let lastLoanForm = "";

  function mount(container, context = {}) {
    let host = null;
    if (typeof container === 'string') host = document.querySelector(container);
    else if (container instanceof HTMLElement) host = container;
    if (!host) host = window.MathLabUtils?.getMountContainer ? window.MathLabUtils.getMountContainer(container) : document.getElementById('mathlab-view');
    if (!host || !(host instanceof HTMLElement)) host = document.getElementById('new-root') || document.getElementById('game-container') || document.getElementById('mathlab-view');

    if (!host || !(host instanceof HTMLElement) || host === document.body) {
      let createdHost = document.getElementById('loan-force-host');
      if (!createdHost) {
        createdHost = document.createElement('div');
        createdHost.id = 'loan-force-host';
        document.body.appendChild(createdHost);
      }
      host = createdHost;
    }

    const footerEl = document.querySelector('footer, #footer, .app-footer') || 
                     Array.from(document.querySelectorAll('div, p, span')).find(el => el.textContent && el.textContent.includes('2026 기록조율사'));
    if (footerEl && host && typeof host.compareDocumentPosition === 'function' && (host.compareDocumentPosition(footerEl) & Node.DOCUMENT_POSITION_PRECEDING)) {
      footerEl.parentNode.insertBefore(host, footerEl);
    }

    host.style.display = '';
    host.style.visibility = 'visible';
    host.style.opacity = '1';

    let parent = host.parentElement;
    while (parent && parent !== document.body && parent !== document.documentElement) {
      if (parent.style && parent.style.display === 'none') parent.style.display = 'block';
      if (parent.style && parent.style.visibility === 'hidden') parent.style.visibility = 'visible';
      parent = parent.parentElement;
    }

    document.querySelectorAll('header, .navbar, #app-header, .top-bar, #floating-home-btn, .floating-home').forEach(el => {
      if (el && el.style && el.style.display === 'none') el.style.display = '';
    });

    host.innerHTML = `
      <div id="loan-container">
        <div class="app-header">
          <h1>대출 상환 시뮬레이터 🏦</h1>
          <div class="header-btns">
            <button class="loan-btn primary" onclick="ConceptLoanApp.showGuide()">📖 상환 방식 가이드</button>
            <button class="loan-btn" onclick="ConceptLoanApp.goHome()">🏠 홈으로</button>
          </div>
        </div>
        
        <p class="highlight-msg">상환 방식에 따라 <strong>총 이자액</strong>과 <strong>매월 부담액</strong>이 어떻게 달라지는지 눈으로 직접 확인하세요!</p>
        
        <div class="toggle-wrapper">
          <div class="toggle-group">
            <input type="radio" id="repay-equal-pi" name="repayType" value="equal-pi" checked onchange="ConceptLoanApp.updateLoan()">
            <label for="repay-equal-pi" class="toggle-label left">원리금균등</label>
            
            <input type="radio" id="repay-equal-p" name="repayType" value="equal-p" onchange="ConceptLoanApp.updateLoan()">
            <label for="repay-equal-p" class="toggle-label">원금균등</label>
            
            <input type="radio" id="repay-bullet" name="repayType" value="bullet" onchange="ConceptLoanApp.updateLoan()">
            <label for="repay-bullet" class="toggle-label right">만기일시(전세 등)</label> 
          </div>
        </div>
        
        <div class="chart-wrapper"><canvas id="loanChart"></canvas></div>
        
        <div class="sliders-wrapper">
          <div class="slider-group">
            <label>대출 원금: <span id="val-loan-p">1000</span> 만원</label>
            <input type="range" id="slider-loan-p" min="100" max="50000" step="100" value="1000" oninput="ConceptLoanApp.updateLoan()">
          </div>
          <div class="slider-group">
            <label>연 이자율: <span id="val-loan-r">5.0</span>%</label>
            <input type="range" id="slider-loan-r" min="1.0" max="20.0" step="0.1" value="5.0" oninput="ConceptLoanApp.updateLoan()">
          </div>
        </div>
        <div class="sliders-wrapper full-width" style="margin-top: -5px;">
          <div class="slider-group">
            <label>대출 기간: <span id="val-loan-n">60</span> 개월</label>
            <input type="range" id="slider-loan-n" min="12" max="360" step="12" value="60" oninput="ConceptLoanApp.updateLoan()">
          </div>
        </div>
        
        <div class="calc-board">
          <div class="formula-title" id="loan-formula-title">계산 공식 (월 상환액)</div>
          <div class="formula-math" id="formula-loan">수식</div>
          <div class="calc-results">
            <span>대출 원금: <strong id="loan-res-principal">10,000,000</strong>원</span>
            <span>총 이자액: <strong class="interest-val" id="loan-res-interest">0</strong>원</span>
          </div>
          <div class="survey-result">
            총 상환 금액: <strong id="loan-res-total">0 원</strong>
            <span id="loan-res-monthly">매월 상환액</span>
          </div>
        </div>
      </div>

      <!-- Guide Modal -->
      <div id="loan-modal-overlay">
        <div class="loan-modal-content">
          <h2>💡 상환 방식 완벽 이해하기</h2>
          <ul style="padding-left: 20px; color: #475569;">
            <li style="margin-bottom: 10px;"><strong>원리금균등 상환:</strong> 매월 갚는 금액(원금+이자)이 동일합니다. 계획적인 지출 관리에 유리하지만, 초기에는 이자 비중이 높습니다.</li>
            <li style="margin-bottom: 10px;"><strong>원금균등 상환:</strong> 매월 갚는 '원금'이 동일합니다. 원금이 일정하게 줄어들기 때문에 총 이자액이 가장 적지만, 초기 월 납입금 부담이 큽니다.</li>
            <li style="margin-bottom: 10px;"><strong>만기일시 상환:</strong> 대출 기간 동안 이자만 내다가, 마지막 달에 원금을 한 번에 갚습니다. 주로 전세자금 대출에 많이 쓰이며 이자 부담이 가장 큽니다.</li>
          </ul>
          <p style="color:#d97706; font-size:0.95rem; margin-top:15px; font-weight:bold;">슬라이더를 조작하여 금리와 기간이 이자에 어떤 폭발적인 영향을 미치는지 시뮬레이션 해보세요!</p>
          <div style="text-align:right; margin-top:20px;">
            <button class="loan-btn primary" onclick="ConceptLoanApp.hideGuide()">닫기</button>
          </div>
        </div>
      </div>
    `;

    initLoanApp();
  }

  function initLoanApp() {
    if (loanChart) loanChart.destroy();
    loanChart = new Chart(document.getElementById('loanChart').getContext('2d'), {
      type: 'bar',
      data: {
        labels: [],
        datasets: [
          { label: '상환 원금', data: [], backgroundColor: '#38bdf8', stack: 'Stack 0' },
          { label: '납부 이자', data: [], backgroundColor: '#ef4444', stack: 'Stack 0' }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: { duration: 400 },
        plugins: {
          legend: { labels: { color: '#475569' } }
        },
        scales: {
          x: { stacked: true, ticks: { color: '#64748b' }, grid: { color: '#e2e8f0' } },
          y: { stacked: true, ticks: { color: '#64748b' }, grid: { color: '#e2e8f0' } }
        }
      }
    });
    updateLoan();
  }

  function updateLoan() {
    const typeEl = document.querySelector('input[name="repayType"]:checked');
    const type = typeEl ? typeEl.value : 'equal-pi';
    const pEl = document.getElementById('slider-loan-p');
    const rEl = document.getElementById('slider-loan-r');
    const nEl = document.getElementById('slider-loan-n');
    if(!pEl || !rEl || !nEl) return;

    const P = parseFloat(pEl.value); 
    const aRate = parseFloat(rEl.value); 
    const n = parseInt(nEl.value); 
    const r = (aRate/100)/12;

    document.getElementById('val-loan-p').innerText = P.toLocaleString(); 
    document.getElementById('val-loan-r').innerText = aRate.toFixed(1); 
    document.getElementById('val-loan-n').innerText = n;
    
    let labels = [], pData = [], iData = [], totalI = 0, remP = P, fPay = 0, lPay = 0;
    const pmt = (P * r * Math.pow(1+r, n)) / (Math.pow(1+r, n) - 1);
    
    for (let k = 1; k <= n; k++) {
      labels.push(`${k}회차`);
      let mP = 0, mI = 0;
      if (type === 'equal-pi') {
        mI = remP * r;
        mP = pmt - mI;
      } else if (type === 'equal-p') {
        mP = P / n;
        mI = remP * r;
      } else if (type === 'bullet') {
        mP = (k === n) ? P : 0;
        mI = P * r;
      }
      pData.push(mP);
      iData.push(mI);
      totalI += mI;
      remP -= mP;
      if (k === 1) fPay = mP + mI;
      if (k === n) lPay = mP + mI;
    }

    loanChart.data.labels = labels;
    loanChart.data.datasets[0].data = pData;
    loanChart.data.datasets[1].data = iData;
    loanChart.update();
    
    let fText = "";
    if (type === 'equal-pi') fText = `M = \\frac{P\\cdot r(1+r)^n}{(1+r)^n - 1}`;
    else if (type === 'equal-p') fText = `\\text{상환액} = \\frac{P}{n} + \\text{잔액}\\cdot r`;
    else fText = `\\text{월 이자} = P\\cdot r`;

    if (fText !== lastLoanForm) {
      const formulaEl = document.getElementById('formula-loan');
      if (formulaEl && typeof katex !== 'undefined') {
        katex.render(fText, formulaEl, { throwOnError: false });
      }
      lastLoanForm = fText;
    }

    document.getElementById('loan-res-principal').innerText = Math.round(P*10000).toLocaleString();
    document.getElementById('loan-res-interest').innerText = Math.round(totalI*10000).toLocaleString();
    document.getElementById('loan-res-total').innerText = Math.round((P+totalI)*10000).toLocaleString() + " 원";
    document.getElementById('loan-res-monthly').innerHTML = `첫 달 납입액: <strong>${Math.round(fPay*10000).toLocaleString()} 원</strong> / 만기 납입액: <strong>${Math.round(lPay*10000).toLocaleString()} 원</strong>`;
  }

  function showGuide() {
    const modal = document.getElementById('loan-modal-overlay');
    if (modal) modal.classList.add('show');
  }

  function hideGuide() {
    const modal = document.getElementById('loan-modal-overlay');
    if (modal) modal.classList.remove('show');
  }

  function goHome() {
    if (window.LegacyBridge && typeof window.LegacyBridge.backHome === 'function') {
      window.LegacyBridge.backHome();
    }
  }

  return { mount, initLoanApp, updateLoan, showGuide, hideGuide, goHome };
})();

/* 하단 안전 등록 및 레거시/Gen-3 상호 실행 브리지 */
function registerConceptLoanApp() {
  if (typeof window.MathLabGames !== 'undefined' && typeof window.MathLabGames.register === 'function') {
    if (!window.MathLabGames.get('loan-app')) {
      try {
        window.MathLabGames.register({
          id: 'loan-app',
          title: '대출 상환 시뮬레이터',
          icon: '🏦',
          sourceType: 'new',
          players: '1인',
          isMultiplayer: false,
          mount(container, context) { ConceptLoanApp.mount(container, context); },
          reset() { ConceptLoanApp.initLoanApp(); },
          destroy() { },
          goHome() { ConceptLoanApp.goHome(); }
        });
      } catch (e) { console.warn('loan-app 등록 방어:', e); }
    }
  }
}

registerConceptLoanApp();
window.addEventListener('DOMContentLoaded', registerConceptLoanApp);
setTimeout(registerConceptLoanApp, 100);
setTimeout(registerConceptLoanApp, 500);

window.ConceptLoanApp = ConceptLoanApp;

// 레거시 호환성 브리지
window.initLoanApp = function() {
  registerConceptLoanApp();
  if (window.LegacyBridge && typeof window.LegacyBridge.hideAllLegacySections === 'function') {
    window.LegacyBridge.hideAllLegacySections();
    window.LegacyBridge.showNewRoot();
  }
  if (typeof window.MathLabGames !== 'undefined' && typeof window.MathLabGames.mount === 'function') {
    try { window.MathLabGames.mount('loan-app'); return; } catch(e) {}
  }
  const targetEl = document.getElementById('mathlab-view') || document.getElementById('new-root');
  ConceptLoanApp.mount(targetEl);
};
</script>
