function evalTaylorPoly(coeffs, a, x) {
  var sum = 0, p = 1, dx = x - a;
  for (var i = 0; i < coeffs.length; i++) {
    sum += coeffs[i] * p;
    p *= dx;
  }
  return sum;
}

// Generate Formula LaTeX for P_N(x)
function generatePolyFormulaLatex(TF, N, a) {
  var latex = 'P_{' + N + '}(x) = ';
  if (TF.id === 'exp' && Math.abs(a) < 0.001) {
    var terms = [];
    for(var k=0; k<=Math.min(N, 6); k++) {
      if (k === 0) terms.push('1');
      else if (k === 1) terms.push('x');
      else if (k === 2) terms.push('\\frac{x^2}{2!}');
      else if (k === 3) terms.push('\\frac{x^3}{3!}');
      else terms.push('\\frac{x^{' + k + '}}{' + k + '!}');
    }
    if (N > 6) terms.push('\\dots + \\frac{x^{' + N + '}}{' + N + '!}');
    latex += terms.join(' + ');
  } else if (TF.id === 'sin' && Math.abs(a) < 0.001) {
    var terms = [];
    for(var k=1; k<=Math.min(N, 9); k+=2) {
      var sign = (k % 4 === 1) ? '' : '-';
      if (k === 1) terms.push('x');
      else if (k === 3) terms.push(sign + '\\frac{x^3}{3!}');
      else terms.push(sign + '\\frac{x^{' + k + '}}{' + k + '!}');
    }
    if (N > 9) terms.push('+ \\dots');
    latex += terms.join(' ');
  } else if (TF.id === 'cos' && Math.abs(a) < 0.001) {
    var terms = [];
    for(var k=0; k<=Math.min(N, 8); k+=2) {
      var sign = (k % 4 === 0) ? (k===0?'':'+') : '-';
      if (k === 0) terms.push('1');
      else if (k === 2) terms.push(sign + '\\frac{x^2}{2!}');
      else terms.push(sign + '\\frac{x^{' + k + '}}{' + k + '!}');
    }
    if (N > 8) terms.push('+ \\dots');
    latex += terms.join(' ');
  } else if (TF.id === 'ln' && Math.abs(a) < 0.001) {
    var terms = [];
    for(var k=1; k<=Math.min(N, 6); k++) {
      var sign = (k % 2 === 1) ? (k===1?'':'+') : '-';
      if (k === 1) terms.push('x');
      else if (k === 2) terms.push(sign + '\\frac{x^2}{2}');
      else terms.push(sign + '\\frac{x^{' + k + '}}{' + k + '}');
    }
    if (N > 6) terms.push('+ \\dots + \\frac{(-1)^{' + (N-1) + '} x^{' + N + '}}{' + N + '}');
    latex += terms.join(' ');
  } else {
    // General expansion around a
    latex += 'f(a) + f\'(a)(x-a) + \\frac{f\'\'(a)}{2!}(x-a)^2 + \\dots + \\frac{f^{(' + N + ')}(a)}{' + N + '!}(x-a)^{' + N + '}';
  }
  return latex;
}

  bindEvents: function() {
    var _this = this;
    var root = S.host.querySelector('#ts-app-root');

    /* Tabs */
    root.querySelectorAll('.tab-btn').forEach(function(btn) {
      btn.onclick = function() {
        root.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
        this.classList.add('active');
        S.activeTab = this.getAttribute('data-tab');

        root.querySelector('#tab-sec-sim').style.display = (S.activeTab === 'sim') ? 'block' : 'none';
        root.querySelector('#tab-sec-math').style.display = (S.activeTab === 'math') ? 'block' : 'none';
        root.querySelector('#tab-sec-prob').style.display = (S.activeTab === 'prob') ? 'block' : 'none';

        updateMathElements();
      };
    });

    /* Function Selection Buttons */
    root.querySelectorAll('.btn-fn').forEach(function(btn) {
      btn.onclick = function() {
        root.querySelectorAll('.btn-fn').forEach(function(b){ b.className = 'btn btn-fn'; });
        this.className = 'btn p btn-fn';
        S.funcIdx = parseInt(this.getAttribute('data-idx'), 10);
        _this.updateHUD();
        _this.drawCanvas();
      };
    });

    /* Sliders */
    var rngN = root.querySelector('#rng-n');
    var rngA = root.querySelector('#rng-a');
    var rngX0 = root.querySelector('#rng-x0');

    function updateVal(key, val, rngEl) {
      if (key === 'N') S.N = parseInt(val, 10);
      else S[key] = Math.round(parseFloat(val) * 100) / 100;

      if (rngEl) rngEl.value = S[key];
      _this.updateHUD();
      _this.drawCanvas();
    }

    rngN.oninput = function() { updateVal('N', this.value, rngN); };
    rngA.oninput = function() { updateVal('a', this.value, rngA); };
    rngX0.oninput = function() { updateVal('x0', this.value, rngX0); };

    function bindWheel(el, key) {
      el.onwheel = function(e) {
        e.preventDefault();
        var delta = key === 'N' ? (e.deltaY < 0 ? 1 : -1) : (e.deltaY < 0 ? 0.01 : -0.01);
        var minV = parseFloat(el.min), maxV = parseFloat(el.max);
        var nVal = Math.min(maxV, Math.max(minV, S[key] + delta));
        updateVal(key, nVal, el);
      };
    }
    bindWheel(rngN, 'N');
    bindWheel(rngA, 'a');
    bindWheel(rngX0, 'x0');

    /* Canvas Mousemove & Lock Toggle */
    var cv = root.querySelector('#ts-cv');
    cv.onmousemove = function(e) {
      if (!S.mouseTracking) return;
      var rect = cv.getBoundingClientRect();
      var mouseX = e.clientX - rect.left;
      var TF = TARGET_FUNCS[S.funcIdx];
      var pad = 40;
      var xVal = TF.lo + (mouseX - pad) / (CW - pad * 2) * (TF.hi - TF.lo);
      xVal = Math.min(TF.hi - 0.05, Math.max(TF.lo + 0.05, xVal));
      updateVal('x0', xVal, rngX0);
    };

    cv.onclick = function() {
      S.mouseTracking = !S.mouseTracking;
    };

    /* Actions */
    root.querySelector('#btn-quick-5').onclick = function() {
      updateVal('N', 5, rngN);
    };
    root.querySelector('#btn-quick-30').onclick = function() {
      updateVal('N', 30, rngN);
    };

    /* Quiz */
    root.querySelector('#btn-submit-quiz').onclick = function() {
      var val = (root.querySelector('#inp-quiz-ans').value || '').trim();
      var msgEl = root.querySelector('#lbl-quiz-msg');
      if (val === '2') {
        msgEl.innerHTML = '✅ <b>정답입니다!</b> 2! = 2 * 1 = 2 입니다.';
        msgEl.style.color = '#059669';
      } else {
        msgEl.innerHTML = '❌ 오답입니다. (힌트: 2 팩토리얼인 2 입니다)';
        msgEl.style.color = '#ef4444';
      }
    };

    /* Solutions Toggle */
    root.querySelectorAll('.btn-show-sol').forEach(function(btn) {
      btn.onclick = function() {
        var idx = this.getAttribute('data-idx');
        var solEl = root.querySelector('#sol-' + idx);
        if (solEl) {
          var isShown = solEl.style.display === 'block';
          solEl.style.display = isShown ? 'none' : 'block';
          this.textContent = isShown ? '💡 수학적 해설 보기' : '🙈 해설 닫기';
          updateMathElements();
        }
      };
    });

    /* Modal Open & Render Slide */
    root.querySelector('#btn-open-guide').onclick = function() {
      S.guidePage = 0;
      _this.renderSlideGuide();
      root.querySelector('#ts-modal').classList.add('on');
    };
  },

  updateHUD: function() {
    var root = S.host.querySelector('#ts-app-root');
    if (!root) return;

    var TF = TARGET_FUNCS[S.funcIdx];
    var coeffs = TF.polyCoeffs(S.N, S.a);
    var trueVal = TF.f(S.x0);
    var approxVal = evalTaylorPoly(coeffs, S.a, S.x0);
    var errVal = Math.abs(trueVal - approxVal);

    root.querySelector('#lbl-func-name').textContent = TF.name;
    root.querySelector('#lbl-n-val').textContent = 'N = ' + S.N;
    root.querySelector('#lbl-a-val').textContent = 'a = ' + S.a.toFixed(2);
    root.querySelector('#lbl-rad-val').textContent = TF.convergeRad;

    root.querySelector('#lbl-n-slider').textContent = S.N + '차';
    root.querySelector('#lbl-a-slider').textContent = S.a.toFixed(2);
    root.querySelector('#lbl-x0-slider').textContent = S.x0.toFixed(2);

    // Render Formula LaTeX
    var formulaTex = generatePolyFormulaLatex(TF, S.N, S.a);
    var elPolyForm = root.querySelector('#lbl-math-poly-formula');
    if (elPolyForm) { elPolyForm.setAttribute('data-tex', formulaTex); renderMath(formulaTex, elPolyForm, true); }

    var trueTex = 'f(' + S.x0.toFixed(2) + ') = ' + trueVal.toFixed(4);
    var approxTex = 'P_{' + S.N + '}(' + S.x0.toFixed(2) + ') = ' + (isNaN(approxVal) ? '\\text{발산}' : approxVal.toFixed(4));
    var errTex = '|Error| = ' + (isNaN(errVal) ? '\\text{발산}' : errVal.toFixed(5));

    var elTrue = root.querySelector('#lbl-math-true-val');
    var elApprox = root.querySelector('#lbl-math-approx-val');
    var elErr = root.querySelector('#lbl-math-error-val');

    if (elTrue) { elTrue.setAttribute('data-tex', trueTex); renderMath(trueTex, elTrue, false); }
    if (elApprox) { elApprox.setAttribute('data-tex', approxTex); renderMath(approxTex, elApprox, false); }
    if (elErr) { elErr.setAttribute('data-tex', errTex); renderMath(errTex, elErr, false); }
  },

  worldToPx: function(x, y) {
    var TF = TARGET_FUNCS[S.funcIdx];
    var pad = 40;
    return {
      X: pad + (x - TF.lo) / (TF.hi - TF.lo) * (CW - pad * 2),
      Y: CH - pad - (y - TF.ylo) / (TF.yhi - TF.ylo) * (CH - pad * 2)
    };
  },

  drawCanvas: function() {
    var root = S.host.querySelector('#ts-app-root');
    if (!root) return;
    var cv = root.querySelector('#ts-cv');
    if (!cv) return;
    var ctx = cv.getContext('2d');

    ctx.clearRect(0, 0, CW, CH);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, CW, CH);

    var _this = this;
    var TF = TARGET_FUNCS[S.funcIdx];
    var pad = 40;

    // Grid & Axes
    var o = _this.worldToPx(0, 0);
    ctx.strokeStyle = '#cbd5e1';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(pad, o.Y); ctx.lineTo(CW - pad, o.Y);
    ctx.moveTo(o.X, 20); ctx.lineTo(o.X, CH - 20);
    ctx.stroke();

    // Convergence Boundary Lines for ln(1+x)
    if (TF.id === 'ln') {
      var pLeft = _this.worldToPx(-1, 0);
      var pRight = _this.worldToPx(1, 0);

      ctx.strokeStyle = '#fca5a5';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([4, 4]);

      ctx.beginPath();
      ctx.moveTo(pLeft.X, 20); ctx.lineTo(pLeft.X, CH - 20);
      ctx.moveTo(pRight.X, 20); ctx.lineTo(pRight.X, CH - 20);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.fillStyle = '#dc2626';
      ctx.font = 'bold 11px Pretendard';
      ctx.fillText('수렴한계 x = -1', pLeft.X + 4, 35);
      ctx.fillText('수렴한계 x = 1', pRight.X + 4, 35);
    }

    // Expansion Center Line (a)
    var pa = _this.worldToPx(S.a, 0);
    ctx.strokeStyle = '#93c5fd';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.moveTo(pa.X, 20); ctx.lineTo(pa.X, CH - 20);
    ctx.stroke();
    ctx.setLineDash([]);

    // Target True Function Curve f(x) (Blue)
    ctx.strokeStyle = '#0284c7';
    ctx.lineWidth = 3.5;
    ctx.beginPath();
    var started = false;
    for (var i = 0; i <= 300; i++) {
      var x = TF.lo + i * (TF.hi - TF.lo) / 300;
      var y = TF.f(x);
      if (isNaN(y) || y > TF.yhi + 2 || y < TF.ylo - 2) { started = false; continue; }
      var p = _this.worldToPx(x, y);
      if (!started) { ctx.moveTo(p.X, p.Y); started = true; }
      else ctx.lineTo(p.X, p.Y);
    }
    ctx.stroke();

    // Taylor Polynomial Curve P_N(x) (Orange)
    var coeffs = TF.polyCoeffs(S.N, S.a);
    ctx.strokeStyle = '#d97706';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    started = false;
    for (var j = 0; j <= 300; j++) {
      var xj = TF.lo + j * (TF.hi - TF.lo) / 300;
      var yj = evalTaylorPoly(coeffs, S.a, xj);
      if (isNaN(yj) || yj > TF.yhi + 3 || yj < TF.ylo - 3) { started = false; continue; }
      var pj = _this.worldToPx(xj, yj);
      if (!started) { ctx.moveTo(pj.X, pj.Y); started = true; }
      else ctx.lineTo(pj.X, pj.Y);
    }
    ctx.stroke();

    // Point P(x0, f(x0)) & Q(x0, P_N(x0))
    var trueY = TF.f(S.x0);
    var approxY = evalTaylorPoly(coeffs, S.a, S.x0);

    var ptP = _this.worldToPx(S.x0, trueY);
    var ptQ = _this.worldToPx(S.x0, approxY);

    // Vertical Error Line
    ctx.strokeStyle = '#ef4444';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(ptP.X, ptP.Y); ctx.lineTo(ptQ.X, ptQ.Y);
    ctx.stroke();

    // True Point (Blue)
    ctx.fillStyle = '#0284c7';
    ctx.beginPath();
    ctx.arc(ptP.X, ptP.Y, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Approx Point (Orange)
    if (!isNaN(approxY) && Math.abs(approxY) <= TF.yhi + 3) {
      ctx.fillStyle = '#d97706';
      ctx.beginPath();
      ctx.arc(ptQ.X, ptQ.Y, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    // Vertical Guide for x0
    var px0 = _this.worldToPx(S.x0, 0);
    ctx.strokeStyle = '#fca5a5';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([3, 3]);
    ctx.beginPath();
    ctx.moveTo(px0.X, 20); ctx.lineTo(px0.X, CH - 20);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.fillStyle = '#475569';
    ctx.font = 'bold 12px Pretendard';
    ctx.fillText('중심 a = ' + S.a.toFixed(2), pa.X + 6, 25);
    ctx.fillStyle = '#dc2626';
    ctx.fillText('x0 = ' + S.x0.toFixed(2), px0.X + 6, CH - 15);
  },

  renderSlideGuide: function() {
    var _this = this;
    var root = S.host.querySelector('#ts-app-root');
    var mBox = root.querySelector('#ts-modal-box');
    if (!mBox) return;

    var pg = SLIDE_GUIDE[S.guidePage] || SLIDE_GUIDE[0];
    var dots = SLIDE_GUIDE.map(function(_, i) {
      return '<span class="dot' + (i === S.guidePage ? ' on' : '') + '"></span>';
    }).join('');
    var isLast = S.guidePage >= SLIDE_GUIDE.length - 1;

    var h = '';
    h += '<div style="font-size:.8rem; font-weight:800; color:#0284c7; margin-bottom:4px;">온보딩 슬라이드 탐구 ' + (S.guidePage + 1) + ' / ' + SLIDE_GUIDE.length + '</div>';
    h += '<h3 style="margin:0 0 12px; color:#0f172a; font-weight:900;">' + pg.title + '</h3>';
    h += '<div style="line-height:1.65; color:#334155; font-size:0.95rem;">' + pg.html + '</div>';
    h += '<div class="dots">' + dots + '</div>';

    h += '<div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px;">';
    h += '  <button type="button" class="btn" id="btn-slide-prev"' + (S.guidePage === 0 ? ' disabled' : '') + '>← 이전</button>';
    h += '  <button type="button" class="btn p" id="btn-slide-next">' + (isLast ? '탐구 시작하기 🚀' : '다음 →') + '</button>';
    h += '</div>';

    mBox.innerHTML = h;
    updateMathElements();

    var prevBtn = mBox.querySelector('#btn-slide-prev');
    var nextBtn = mBox.querySelector('#btn-slide-next');

    if (prevBtn) {
      prevBtn.onclick = function() {
        if (S.guidePage > 0) {
          S.guidePage--;
          _this.renderSlideGuide();
        }
      };
    }
    if (nextBtn) {
      nextBtn.onclick = function() {
        if (isLast) {
          root.querySelector('#ca2-modal').classList.remove('on');
        } else {
          S.guidePage++;
          _this.renderSlideGuide();
        }
      };
    }
  },

  destroy: function() {
    if (S.host) S.host.innerHTML = '';
    S.host = null;
  }
};

function goHome() {
  if (S.host) S.host.innerHTML = '';
  if (typeof window.LegacyBridge !== 'undefined' && typeof window.LegacyBridge.backHome === 'function') {
    window.LegacyBridge.backHome();
  } else if (typeof window.MathLabGames !== 'undefined' && window.MathLabGames.goHome) {
    window.MathLabGames.goHome();
  } else {
    window.location.reload();
  }
}

function reg() {
  if (typeof window.MathLabGames === 'undefined' || typeof window.MathLabGames.register !== 'function') return;
  try {
    if (window.MathLabGames.get && window.MathLabGames.get(APP_ID)) return;
    window.MathLabGames.register({
      id: APP_ID,
      title: APP_TITLE,
      icon: ICON,
      sourceType: 'new',
      players: '1인',
      isMultiplayer: false,
      mount: function(c, x) { TaylorSeriesApp.mount(c, x); },
      reset: function() { TaylorSeriesApp.updateHUD(); TaylorSeriesApp.drawCanvas(); },
      destroy: function() { TaylorSeriesApp.destroy(); },
      goHome: function() { goHome(); }
    });
  } catch (e) {
    console.warn(APP_ID + ' reg', e);
  }
}

reg();
window.addEventListener('DOMContentLoaded', reg);
setTimeout(reg, 100);
setTimeout(reg, 500);

window.TaylorSeries = {
  mount: function(c) { TaylorSeriesApp.mount(c); },
  destroy: function() { TaylorSeriesApp.destroy(); },
  goHome: goHome
};

window.initTaylorSeries = function() {
  reg();
  try {
    if (window.LegacyBridge) {
      window.LegacyBridge.hideAllLegacySections();
      if (window.LegacyBridge.showNewRoot) window.LegacyBridge.showNewRoot();
    }
  } catch (e) {}
  if (window.MathLabGames && window.MathLabGames.mount) {
    try { window.MathLabGames.mount(APP_ID); return; } catch (e) {}
  }
  TaylorSeriesApp.mount(document.getElementById('mathlab-view'));
};

window.launchTaylorSeries = window.initTaylorSeries;
})();
</script>
