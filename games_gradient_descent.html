<style>
.gd,.gd *{box-sizing:border-box}
.gd{max-width:1100px;margin:0 auto;padding:14px 16px 22px;font-family:'Pretendard','Noto Sans KR',system-ui,sans-serif;background:#f8fafc;color:#0f172a;border-radius:16px}
.gd .h{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.gd .t{font-size:1.25rem;font-weight:900;margin:0}
.gd .btn{border:1px solid #cbd5e1;background:#fff;color:#1e293b;border-radius:10px;padding:8px 12px;font-weight:700;cursor:pointer;font-size:.9rem}
.gd .btn:hover{background:#f1f5f9}
.gd .btn.p{background:#0284c7;border-color:#0284c7;color:#fff}
.gd .btn.g{background:#059669;border-color:#059669;color:#fff}
.gd .btn.w{background:#dc2626;border-color:#dc2626;color:#fff}
.gd .btn:disabled{opacity:.45;cursor:not-allowed}
.gd .chip{background:#fff;border:1px solid #e2e8f0;border-radius:999px;padding:5px 12px;font-size:.86rem;font-weight:700;color:#475569}
.gd .chip b{color:#0284c7}
.gd .bar{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;align-items:center}
.gd .diff{flex:1;min-width:86px;padding:8px;border-radius:10px;border:1px solid #cbd5e1;background:#fff;font-weight:800;cursor:pointer}
.gd .diff.on{background:#e0f2fe;border-color:#0284c7;color:#0369a1}
.gd .main{display:grid;grid-template-columns:1.25fr 1fr;gap:12px}
@media(max-width:860px){.gd .main{grid-template-columns:1fr}}
.gd .box{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:12px}
.gd .box canvas{width:100%;display:block;border-radius:8px;background:#fff;touch-action:none}
.gd .cv-sub{margin-top:8px;border:1px solid #cbd5e1}
.gd .msg{font-size:.92rem;line-height:1.55;color:#334155;min-height:2.6em}
.gd .note{background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;padding:10px;font-size:.86rem;margin-top:8px;line-height:1.5}
.gd .eq{font-family:'STIX Two Math',serif,monospace;background:#f1f5f9;border-radius:8px;padding:12px;font-size:1.1rem;font-weight:700;margin:6px 0;text-align:center;color:#0f172a;min-height:2.4em;display:flex;align-items:center;justify-content:center}
.gd .inp{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font-size:1rem;font-weight:700}
.gd .sl{width:100%;accent-color:#0284c7;touch-action:none}
.gd .toast{position:fixed;top:18px;left:50%;transform:translateX(-50%) translateY(-12px);background:#0f172a;color:#fff;padding:10px 18px;border-radius:12px;font-weight:700;z-index:9600;opacity:0;pointer-events:none;transition:.25s;max-width:92vw}
.gd .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.gd .toast.ok{background:#059669}.gd .toast.err{background:#dc2626}.gd .toast.info{background:#0369a1}
.gd .modal{position:fixed;inset:0;background:rgba(15,23,42,.48);display:none;align-items:center;justify-content:center;z-index:9400;padding:14px}
.gd .modal.on{display:flex}
.gd .modal .mbox{background:#fff;border-radius:16px;max-width:580px;width:100%;padding:20px;max-height:88vh;overflow:auto;box-shadow:0 20px 50px rgba(15,23,42,.25)}
.gd .modal h3{margin:0 0 8px;font-size:1.12rem}
.gd .modal p,.gd .modal li{font-size:.93rem;line-height:1.62;color:#334155}
.gd .modal ul{padding-left:1.15em;margin:8px 0}
.gd .dots{display:flex;gap:6px;justify-content:center;margin:12px 0 4px}
.gd .dot{width:8px;height:8px;border-radius:50%;background:#cbd5e1}
.gd .dot.on{background:#0284c7}
.gd .g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gd .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.gd .pad button{padding:12px;font-weight:900;font-size:1.05rem;border-radius:10px;border:1px solid #cbd5e1;background:#fff;cursor:pointer}
.gd .gauge{height:12px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin:6px 0}
.gd .gauge>i{display:block;height:100%;background:linear-gradient(90deg,#38bdf8,#059669);width:0%;transition:width .25s}
.gd .leg{display:flex;gap:10px;flex-wrap:wrap;font-size:.8rem;color:#64748b;margin-top:6px}
.gd .math-toggle{width:100%;text-align:left;font-size:.95rem;display:flex;justify-content:space-between;align-items:center;padding:12px;border-radius:10px;background:#f1f5f9;border:1px solid #cbd5e1;font-weight:800;cursor:pointer;margin-top:12px}
.gd .math-content{display:none;padding:14px;background:#fff;border:1px solid #e2e8f0;border-radius:10px;margin-top:8px;line-height:1.7;font-size:.92rem;color:#334155}
.gd .math-content.on{display:block}
</style>

<script>
(function() {
  'use strict';

  const APP_ID = "gradient-descent";
  const APP_TITLE = "경사하강법 골짜기 탈출";
  const ICON = "⛰️";
  const FORCE = "gradient-descent-force-host";

  function ensureKaTeX(callback) {
    if (window.katex) { callback(); return; }
    const css = document.createElement('link');
    css.rel = 'stylesheet';
    css.href = 'https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css';
    document.head.appendChild(css);
    const js = document.createElement('script');
    js.src = 'https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js';
    js.onload = callback;
    document.head.appendChild(js);
  }

  const GUIDE_PAGES = [
    {
      "title": "⛰️ 경사하강법이란? (산속 안개 비유)",
      "html": "<p>자욱한 안개 속에서 산 한가운데에 갇혔을 때, 가장 낮은 골짜기(최저점)로 안전하게 내려가려면 어떻게 해야 할까요?</p><ul><li>앞이 보이지 않으므로 <b>현재 내가 딛고 있는 땅의 경사(기울기)</b>를 확인합니다.</li><li>경사가 <b>가장 가파르게 내려가는 방향</b>으로 한 걸음씩 내딛습니다.</li><li>이처럼 인공지능(AI)이 손실(오차)을 최소화하기 위해 최적의 정답을 찾아가는 핵심 알고리즘이 바로 <b>경사하강법(Gradient Descent)</b>입니다.</li></ul>"
    },
    {
      "title": "📐 고등학교 수학 연계 개념 (미적분 & AI)",
      "html": "<p><b>교과 연계:</b> 고등학교 미적분 (접선의 기울기와 도함수) & 인공지능 수학 (최적화)</p><ul><li><b>1변수 경사하강:</b> <span class=\"k-math\" data-tex=\"x_{n+1} = x_n - \\eta f'(x_n)\"></span><br>접선의 기울기 <span class=\"k-math\" data-tex=\"f'(x_n)\"></span>이 양수이면 왼쪽으로, 음수이면 오른쪽으로 이동합니다.</li><li><b>2변수 고도 지형:</b> 고도 <span class=\"k-math\" data-tex=\"z = f(x, y)\"></span>에서는 기울기 벡터 <span class=\"k-math\" data-tex=\"\\nabla f = \\left(\\frac{\\partial f}{\\partial x}, \\frac{\\partial f}{\\partial y}\\right)\"></span>의 반대 방향인 <span class=\"k-math\" data-tex=\"-\\nabla f\"></span>로 이동합니다.</li><li><b>학습률 (<span class=\"k-math\" data-tex=\"\\eta\"></span>):</b> 한 번에 이동할 보폭입니다. 보폭이 너무 크면 골짜기를 뛰어넘어 발산하고, 너무 작으면 탐구가 지나치게 오래 걸립니다.</li></ul>"
    },
    {
      "title": "🎮 탐구 화면 및 종합 관찰 포인트",
      "html": "<ol><li><b>2D 등고선 지도:</b> 위에서 바라본 고도 지형과 위치 좌표 및 기울기 화살표를 확인합니다.</li><li><b>1D 단면 그래프:</b> 현재 <span class=\"k-math\" data-tex=\"y\"></span> 위치에서의 단면 곡선과 기울기 변화를 실시간 관찰합니다.</li><li><b>3D 입체 지형:</b> 3차원 입체 지형상에서의 위치 및 기울기 벡터 방향을 다각도로 관찰합니다.</li><li><b>지역 최솟값(Local Minimum):</b> 진짜 최저점(전역 최솟값)이 아닌 웅덩이에 갇혔을 때는 <b>탈출 점프</b> 기능을 사용해보세요!</li></ol>"
    }
  ];

  const CW = 640, CH = 340, TOTAL = 4;
  const DIRS = [
    {n:'↖',x:-1,y:1},{n:'↑',x:0,y:1},{n:'↗',x:1,y:1},
    {n:'←',x:-1,y:0},{n:'·',x:0,y:0},{n:'→',x:1,y:0},
    {n:'↙',x:-1,y:-1},{n:'↓',x:0,y:-1},{n:'↘',x:1,y:-1}
  ];

  let toastT = null;

  const GradientDescentGame = {
    id: APP_ID,
    container: null,
    timers: [],
    raf: 0,
    pending: [],
    mounted: false,
    
    state: {
      diff: 'normal',
      round: 1,
      finished: false,
      guidePage: 0,
      hintUsed: false,
      demo: false,
      mathOpen: false
    },

    G: {
      x: 0, y: 0,
      steps: 0, maxSteps: 25,
      mode: 'single', lr: 0.35,
      arrows: false, jumps: 1, targetZ: 0.08
    },

    mount(container, context = {}) {
      let host = null;
      if (typeof container === 'string') {
        try { host = document.querySelector(container); } catch (e) {}
      } else if (container instanceof HTMLElement) {
        host = container;
      }

      if (!host && window.MathLabUtils?.getMountContainer) {
        try { host = window.MathLabUtils.getMountContainer(container); } catch (e) {}
      }

      if (!host || !(host instanceof HTMLElement)) {
        host = document.getElementById('mathlab-view') || document.getElementById('new-root') || document.getElementById('game-container');
      }

      if (!host || !(host instanceof HTMLElement) || host === document.body) {
        host = document.getElementById(FORCE);
        if (!host) {
          host = document.createElement('div');
          host.id = FORCE;
          document.body.appendChild(host);
        }
      }

      const footerEl = document.querySelector('footer, #footer, .app-footer');
      if (footerEl && host && typeof host.compareDocumentPosition === 'function' && (host.compareDocumentPosition(footerEl) & Node.DOCUMENT_POSITION_PRECEDING)) {
        try { footerEl.parentNode.insertBefore(host, footerEl); } catch (e) {}
      }

      host.style.display = '';
      host.style.visibility = 'visible';
      host.style.opacity = '1';
      host.style.minHeight = host.style.minHeight || '60vh';

      let parent = host.parentElement;
      while (parent && parent !== document.body && parent !== document.documentElement) {
        if (parent.style && parent.style.display === 'none') parent.style.display = 'block';
        if (parent.style && parent.style.visibility === 'hidden') parent.style.visibility = 'visible';
        parent = parent.parentElement;
      }

      document.querySelectorAll('header, .navbar, #app-header, .top-bar, #floating-home-btn, .floating-home').forEach(el => {
        if (el && el.style && el.style.display === 'none') el.style.display = '';
      });

      this.container = host;
      this.mounted = true;
      this.container.innerHTML = this.chrome();
      this.bindChrome();
      this.resetRun();
      this.renderAllMath();
    },

    reset() {
      this.resetRun();
    },

    destroy() {
      this.clearTimers();
      this.mounted = false;
      if (this.container) {
        try { this.container.innerHTML = ''; } catch (e) {}
      }
      this.container = null;
    },

    goHome() {
      this.destroy();
      try {
        if (window.LegacyBridge && window.LegacyBridge.backHome) {
          window.LegacyBridge.backHome();
          return;
        }
      } catch (e) {}

      const fh = document.getElementById(FORCE);
      if (fh) { fh.style.display = 'none'; fh.innerHTML = ''; }
      const mv = document.getElementById('mathlab-view');
      if (mv) { mv.style.display = 'none'; mv.innerHTML = ''; }

      const ag = document.querySelector('.app-grid');
      const ds = document.getElementById('dashboard-screen');
      if (ag) ag.style.display = '';
      if (ds) ds.style.display = '';

      if (typeof window.goHome === 'function') {
        try { window.goHome(); } catch (e) {}
      }
    },

    clearTimers() {
      this.timers.forEach(t => { clearInterval(t); clearTimeout(t); });
      this.timers = [];
      if (this.raf) { cancelAnimationFrame(this.raf); this.raf = 0; }
      this.pending.forEach(clearTimeout);
      this.pending = [];
    },

    later(fn, ms) {
      const id = setTimeout(fn, ms);
      this.pending.push(id);
      return id;
    },

    $(id) { return document.getElementById(id); },
    setT(id, v) { const el = this.$(id); if (el) el.textContent = String(v); },

    toast(m, t) {
      const el = this.$('gd-toast');
      if (!el) return;
      el.textContent = m;
      el.className = 'toast on' + (t ? ' ' + t : '');
      if (toastT) clearTimeout(toastT);
      toastT = setTimeout(() => { el.className = 'toast'; }, 2400);
    },

    renderAllMath() {
      ensureKaTeX(() => {
        if (!window.katex) return;
        const root = this.container || document;
        root.querySelectorAll('.k-math').forEach(el => {
          const tex = el.getAttribute('data-tex');
          const isBlock = el.classList.contains('block');
          if (tex) {
            try {
              window.katex.render(tex, el, { throwOnError: false, displayMode: isBlock });
            } catch (e) {}
          }
        });
      });
    },

    openGuide(start) {
      this.state.guidePage = typeof start === 'number' ? start : 0;
      this.renderGuide();
      const m = this.$('gd-modal');
      if (m) m.className = 'modal on';
    },

    renderGuide() {
      const m = this.$('gd-modal');
      if (!m) return;
      const pg = GUIDE_PAGES[this.state.guidePage] || GUIDE_PAGES[0];
      const dots = GUIDE_PAGES.map((_, i) => `<span class="dot${i === this.state.guidePage ? ' on' : ''}"></span>`).join('');
      const isLast = this.state.guidePage >= GUIDE_PAGES.length - 1;

      m.innerHTML = `
        <div class="mbox">
          <div style="font-size:.78rem;font-weight:800;color:#0284c7;margin-bottom:4px">개념 탐구 ${this.state.guidePage + 1} / ${GUIDE_PAGES.length}</div>
          <h3>${pg.title}</h3>
          <div class="gbody">${pg.html}</div>
          <div class="dots">${dots}</div>
          <div class="g2" style="margin-top:12px">
            <button type="button" class="btn" id="gd-gprev"${this.state.guidePage === 0 ? ' disabled' : ''}>← 이전</button>
            <button type="button" class="btn p" id="gd-gnext">${isLast ? '탐구 시작하기' : '다음 →'}</button>
          </div>
          <button type="button" class="btn" id="gd-gskip" style="width:100%;margin-top:8px">닫기</button>
        </div>
      `;

      this.$('gd-gprev').onclick = () => { if (this.state.guidePage > 0) { this.state.guidePage--; this.renderGuide(); } };
      this.$('gd-gnext').onclick = () => {
        if (isLast) {
          m.className = 'modal';
          this.toast('개념 탐구를 시작합니다', 'ok');
        } else {
          this.state.guidePage++;
          this.renderGuide();
        }
      };
      this.$('gd-gskip').onclick = () => { m.className = 'modal'; };
      this.renderAllMath();
    },

    chrome() {
      return `
        <div class="gd" id="gd-root">
          <div class="h">
            <h2 class="t">${ICON} ${APP_TITLE}</h2>
            <div style="display:flex;gap:6px;flex-wrap:wrap">
              <button type="button" class="btn" id="gd-guide">📖 교과 개념 설명</button>
            </div>
          </div>
          <div class="bar">
            <button type="button" class="diff" data-d="easy">쉬움 (단봉 지형)</button>
            <button type="button" class="diff on" data-d="normal">보통 (다봉 지형)</button>
            <button type="button" class="diff" data-d="hard">도전 (안개 지형)</button>
          </div>
          <div class="bar">
            <span class="chip">탐구 단계 <b id="gd-round">1</b></span>
            <span class="chip" id="gd-extra">스텝 0/25</span>
          </div>
          ${this.GAME_BODY()}
          <button type="button" class="math-toggle" id="gd-math-btn">
            <span>📐 왜 <span class="k-math" data-tex="-\\nabla f"></span> 방향이 가장 가파른 내리막일까? (수학적 증명)</span>
            <span id="gd-math-arrow">▼</span>
          </button>
          <div class="math-content" id="gd-math-box">
            <p><b>1. 방향유도미분(Directional Derivative)의 정의</b></p>
            <p>크기가 1인 단위방향벡터 <span class="k-math" data-tex="\\mathbf{u} = (u_1, u_2)"></span> (<span class="k-math" data-tex="\\|\\mathbf{u}\\| = 1"></span>) 방향으로 이동할 때의 고도 변화율 <span class="k-math" data-tex="D_{\\mathbf{u}} f(\\mathbf{x})"></span>는 그래디언트 벡터와의 <b>내적(Dot Product)</b>으로 정의됩니다:</p>
            <div class="eq k-math block" data-tex="D_{\\mathbf{u}} f(\\mathbf{x}) = \\nabla f(\\mathbf{x}) \\cdot \\mathbf{u}"></div>
            
            <p><b>2. 내적과 코사인 법칙 적용</b></p>
            <p>벡터 내적의 기하학적 정의에 따라, <span class="k-math" data-tex="\\theta"></span>를 그래디언트 <span class="k-math" data-tex="\\nabla f(\\mathbf{x})"></span>와 이동 방향 <span class="k-math" data-tex="\\mathbf{u}"></span> 사이의 사잇각이라 하면 다음과 같이 전개됩니다:</p>
            <div class="eq k-math block" data-tex="D_{\\mathbf{u}} f(\\mathbf{x}) = \\|\\nabla f(\\mathbf{x})\\| \\|\\mathbf{u}\\| \\cos \\theta = \\|\\nabla f(\\mathbf{x})\\| \\cos \\theta"></div>

            <p><b>3. 가장 가파른 내리막(최대 감소) 조건</b></p>
            <p>고도가 가장 빠르게 감소하려면 변화율 <span class="k-math" data-tex="D_{\\mathbf{u}} f(\\mathbf{x})"></span>가 <b>음수로서 절대값이 최대(최솟값)</b>가 되어야 합니다.</p>
            <p><span class="k-math" data-tex="\\cos \\theta"></span>의 최솟값은 <span class="k-math" data-tex="-1"></span>이므로:</p>
            <div class="eq k-math block" data-tex="\\cos \\theta = -1 \\implies \\theta = 180^\\circ (\\pi \\text{ rad})"></div>

            <p><b>4. 결론</b></p>
            <p>따라서 이동 방향 <span class="k-math" data-tex="\\mathbf{u}"></span>는 그래디언트 <span class="k-math" data-tex="\\nabla f(\\mathbf{x})"></span>와 **정반대 방향**이어야 가장 가파르게 고도가 낮아집니다. 즉, 가장 가파른 내리막 방향은 항상 <span class="k-math" data-tex="-\\nabla f(\\mathbf{x})"></span>가 됩니다!</p>
          </div>
          <div class="toast" id="gd-toast"></div>
          <div class="modal" id="gd-modal"></div>
        </div>
      `;
    },

    bindChrome() {
      this.$('gd-guide').onclick = () => this.openGuide(0);
      
      document.querySelectorAll('#gd-root .diff').forEach(btn => {
        btn.onclick = () => {
          this.state.diff = btn.getAttribute('data-d');
          document.querySelectorAll('#gd-root .diff').forEach(b => b.classList.toggle('on', b === btn));
          this.resetRun();
        };
      });

      this.$('gd-math-btn').onclick = () => {
        this.state.mathOpen = !this.state.mathOpen;
        const box = this.$('gd-math-box');
        const arrow = this.$('gd-math-arrow');
        if (box) box.className = 'math-content' + (this.state.mathOpen ? ' on' : '');
        if (arrow) arrow.textContent = this.state.mathOpen ? '▲' : '▼';
        if (this.state.mathOpen) this.renderAllMath();
      };

      this.bindGame();
    },

    updateHUD() {
      this.setT('gd-round', this.state.round);
    },

    finishRun() {
      this.state.finished = true;
      this.clearTimers();
      this.toast('모든 탐구가 완료되었습니다!', 'ok');
    },

    height(x, y) {
      if (this.G.mode === 'single') return (x * x + y * y) * 0.45;
      const z1 = (x - 1.2) * (x - 1.2) + (y - 0.8) * (y - 0.8);
      const z2 = (x + 1.4) * (x + 1.4) + (y + 1.0) * (y + 1.0);
      const z3 = (x - 0.2) * (x - 0.2) + (y + 1.5) * (y + 1.5) * 1.2;
      return Math.min(z1, z2 * 0.9 + 0.35, z3 * 0.85 + 0.55);
    },

    grad(x, y) {
      const h = 1e-3;
      return {
        gx: (this.height(x + h, y) - this.height(x - h, y)) / (2 * h),
        gy: (this.height(x, y + h) - this.height(x, y - h)) / (2 * h)
      };
    },

    resetPos() {
      this.G.mode = this.state.diff === 'easy' ? 'single' : 'multi';
      this.G.arrows = this.state.diff === 'easy';
      this.G.jumps = 1;
      this.G.steps = 0;
      this.G.maxSteps = this.state.diff === 'hard' ? 14 : 25;
      this.G.lr = 0.35;
      this.G.x = Math.random() * 3 - 1.5;
      this.G.y = Math.random() * 3 - 1.5;

      if (this.state.diff !== 'easy' && Math.random() < 0.5) {
        this.G.x = -1.2;
        this.G.y = -0.9;
      }

      this.state.hintUsed = false;
      this.setT('gd-msg', '가장 가파른 하강 방향과 보폭을 선택해 골짜기 최저점으로 이동하세요.');
      this.setT('gd-extra', '스텝 0/' + this.G.maxSteps);
      this.updateZ();
      this.draw();
      this.renderAllMath();
    },

    updateZ() {
      const z = this.height(this.G.x, this.G.y);
      this.setT('gd-z', z.toFixed(3));
      const pct = Math.max(0, Math.min(100, (1 - Math.min(z, 4) / 4) * 100));
      const g = this.$('gd-gauge');
      if (g) g.style.width = pct + '%';
    },

    draw() {
      this.draw2D();
      this.draw1D();
      this.draw3D();
    },

    draw2D() {
      const cv = this.$('gd-cv');
      if (!cv) return;
      const ctx = cv.getContext('2d');
      const img = ctx.createImageData(CW, CH);

      for (let j = 0; j < CH; j++) {
        for (let i = 0; i < CW; i++) {
          const x = (i / CW) * 6 - 3;
          const y = 3 - (j / CH) * 6;
          const z = this.height(x, y);
          const t = Math.max(0, Math.min(1, z / 4));
          let r = Math.floor(14 + t * 200);
          let g = Math.floor(165 - t * 100);
          let b = Math.floor(233 - t * 80);

          if (this.state.diff === 'hard') {
            const dx = x - this.G.x, dy = y - this.G.y;
            if (dx * dx + dy * dy > 0.85) { r = g = b = 226; }
          }

          const o = (j * CW + i) * 4;
          img.data[o] = r; img.data[o + 1] = g; img.data[o + 2] = b; img.data[o + 3] = 255;
        }
      }
      ctx.putImageData(img, 0, 0);

      const px = x => (x + 3) / 6 * CW;
      const py = y => (3 - y) / 6 * CH;

      ctx.fillStyle = '#0f172a'; ctx.beginPath(); ctx.arc(px(this.G.x), py(this.G.y), 7, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#f8fafc'; ctx.beginPath(); ctx.arc(px(this.G.x), py(this.G.y), 3.5, 0, Math.PI * 2); ctx.fill();

      if (this.G.arrows || this.state.hintUsed) {
        const gr = this.grad(this.G.x, this.G.y);
        const n = Math.hypot(gr.gx, gr.gy) || 1;
        const dx = -gr.gx / n, dy = -gr.gy / n;
        ctx.strokeStyle = '#facc15'; ctx.lineWidth = 3; ctx.beginPath();
        ctx.moveTo(px(this.G.x), py(this.G.y));
        ctx.lineTo(px(this.G.x + dx * 0.6), py(this.G.y + dy * 0.6));
        ctx.stroke();
      }
    },

    draw1D() {
      const cv = this.$('gd-cv-1d');
      if (!cv) return;
      const ctx = cv.getContext('2d');
      const w = cv.width, h = cv.height;
      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, w, h);

      ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(0, h - 20); ctx.lineTo(w, h - 20); ctx.stroke();

      ctx.beginPath(); ctx.strokeStyle = '#0284c7'; ctx.lineWidth = 2.5;
      for (let i = 0; i <= 100; i++) {
        const x = -3 + (6 * i / 100);
        const z = this.height(x, this.G.y);
        const px = (i / 100) * w;
        const py = (h - 25) - Math.min(z, 4) / 4 * (h - 35);
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.stroke();

      const curX = this.G.x;
      const curZ = this.height(curX, this.G.y);
      const curPx = ((curX + 3) / 6) * w;
      const curPy = (h - 25) - Math.min(curZ, 4) / 4 * (h - 35);

      ctx.strokeStyle = '#cbd5e1'; ctx.setLineDash([3, 3]);
      ctx.beginPath(); ctx.moveTo(curPx, 0); ctx.lineTo(curPx, h); ctx.stroke(); ctx.setLineDash([]);

      const gr = this.grad(curX, this.G.y);
      const slope = gr.gx;
      ctx.strokeStyle = '#ea580c'; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(curPx - 25, curPy + slope * 15);
      ctx.lineTo(curPx + 25, curPy - slope * 15);
      ctx.stroke();

      ctx.fillStyle = '#dc2626'; ctx.beginPath(); ctx.arc(curPx, curPy, 5.5, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = '#475569'; ctx.font = 'bold 11px Pretendard, sans-serif';
      ctx.fillText(`1D 단면 높낮이 그래프 (y = ${this.G.y.toFixed(2)} 절단면)`, 8, 15);
    },

    draw3D() {
      const cv = this.$('gd-cv-3d');
      if (!cv) return;
      const ctx = cv.getContext('2d');
      const w = cv.width, h = cv.height;
      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = '#f8fafc'; ctx.fillRect(0, 0, w, h);

      const project = (x, y, z) => {
        const radY = -0.55, radX = 0.5;
        const x1 = x * Math.cos(radY) + y * Math.sin(radY);
        const y1 = -x * Math.sin(radY) + y * Math.cos(radY);
        const x2 = x1;
        const y2 = y1 * Math.cos(radX) - z * Math.sin(radX);
        const scale = 38;
        return {
          px: w / 2 + x2 * scale,
          py: h / 2 + y2 * scale - z * 16 + 10
        };
      };

      const step = 0.4;
      ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 1;
      for (let x = -2.8; x <= 2.8; x += step) {
        ctx.beginPath();
        for (let y = -2.8; y <= 2.8; y += step) {
          const z = this.height(x, y);
          const p = project(x, y, z);
          if (y === -2.8) ctx.moveTo(p.px, p.py);
          else ctx.lineTo(p.px, p.py);
        }
        ctx.stroke();
      }
      for (let y = -2.8; y <= 2.8; y += step) {
        ctx.beginPath();
        for (let x = -2.8; x <= 2.8; x += step) {
          const z = this.height(x, y);
          const p = project(x, y, z);
          if (x === -2.8) ctx.moveTo(p.px, p.py);
          else ctx.lineTo(p.px, p.py);
        }
        ctx.stroke();
      }

      const curZ = this.height(this.G.x, this.G.y);
      const pCur = project(this.G.x, this.G.y, curZ);
      const pBase = project(this.G.x, this.G.y, 0);

      ctx.strokeStyle = '#94a3b8'; ctx.setLineDash([3, 3]); ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(pCur.px, pCur.py); ctx.lineTo(pBase.px, pBase.py); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = '#94a3b8'; ctx.beginPath(); ctx.arc(pBase.px, pBase.py, 3, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = '#0284c7'; ctx.beginPath(); ctx.arc(pCur.px, pCur.py, 6, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#f8fafc'; ctx.beginPath(); ctx.arc(pCur.px, pCur.py, 2.5, 0, Math.PI * 2); ctx.fill();

      const gr = this.grad(this.G.x, this.G.y);
      const n = Math.hypot(gr.gx, gr.gy) || 1;
      const nextX = this.G.x - (gr.gx / n) * 0.6;
      const nextY = this.G.y - (gr.gy / n) * 0.6;
      const nextZ = this.height(nextX, nextY);
      const pNext = project(nextX, nextY, nextZ);

      ctx.strokeStyle = '#facc15'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(pCur.px, pCur.py); ctx.lineTo(pNext.px, pNext.py); ctx.stroke();

      ctx.fillStyle = '#475569'; ctx.font = 'bold 11px Pretendard, sans-serif';
      ctx.fillText('3D 입체 지형 뷰 (z = f(x, y))', 8, 15);
    },

    move(dx, dy, isAuto = false) {
      if (this.state.finished) return;
      if (this.state.demo && !isAuto) return;
      if (dx === 0 && dy === 0) return;

      const n = Math.hypot(dx, dy) || 1;
      dx /= n; dy /= n;
      const z0 = this.height(this.G.x, this.G.y);

      this.G.x += dx * this.G.lr;
      this.G.y += dy * this.G.lr;
      this.G.x = Math.max(-2.8, Math.min(2.8, this.G.x));
      this.G.y = Math.max(-2.8, Math.min(2.8, this.G.y));
      this.G.steps++;

      const z1 = this.height(this.G.x, this.G.y);
      this.updateZ();
      this.draw();
      this.setT('gd-extra', '스텝 ' + this.G.steps + '/' + this.G.maxSteps);

      if (z1 > z0 + 0.02) this.toast('고도 상승! 보폭·방향을 재검토하세요.', 'err');

      if (z1 <= this.G.targetZ) {
        this.toast('골짜기 최저점 도달 성공!', 'ok');
        this.setT('gd-msg', '🎉 골짜기 최저점 도달 성공!');
        this.state.demo = false;
        this.later(() => {
          if (this.state.round >= TOTAL) this.finishRun();
          else { this.state.round++; this.updateHUD(); this.resetPos(); }
        }, 800);
        return;
      }

      const gr = this.grad(this.G.x, this.G.y);
      if (Math.hypot(gr.gx, gr.gy) < 0.08 && z1 > this.G.targetZ + 0.15) {
        this.setT('gd-msg', '지역 최솟값(Local Minimum) 근처입니다. 탈출 점프를 고려해보세요.');
      }

      if (this.G.steps >= this.G.maxSteps) {
        this.toast('최대 허용 스텝에 도달했습니다.', 'err');
        this.state.demo = false;
        this.later(() => {
          if (this.state.round >= TOTAL) this.finishRun();
          else { this.state.round++; this.updateHUD(); this.resetPos(); }
        }, 600);
      }
    },

    resetRun() {
      this.clearTimers();
      this.state.finished = false;
      this.state.round = 1;
      this.state.demo = false;
      this.updateHUD();
      this.resetPos();
    },

    GAME_BODY() {
      return `
        <div class="main">
          <div class="box">
            <canvas id="gd-cv" width="${CW}" height="${CH}"></canvas>
            <canvas id="gd-cv-1d" width="${CW}" height="110" class="cv-sub"></canvas>
            <canvas id="gd-cv-3d" width="${CW}" height="180" class="cv-sub"></canvas>
            <div class="note">고도 z (낮을수록 최적값) <b id="gd-z">—</b><div class="gauge"><i id="gd-gauge"></i></div>파랑=낮음 · 황갈=높음</div>
          </div>
          <div>
            <div class="box">
              <div class="eq k-math block" id="gd-eq" data-tex="\\mathbf{x}_{k+1} = \\mathbf{x}_k - \\eta \\nabla f(\\mathbf{x}_k)"></div>
              <div class="msg" id="gd-msg"></div>
              <div style="font-weight:800;margin:6px 0">보폭(학습률 <span class="k-math" data-tex="\\eta"></span>)</div>
              <div class="bar">
                <button type="button" class="btn" data-lr="0.15" id="gd-lr1">소 0.15</button>
                <button type="button" class="btn p" data-lr="0.35" id="gd-lr2">중 0.35</button>
                <button type="button" class="btn" data-lr="0.7" id="gd-lr3">대 0.70</button>
              </div>
              <div style="font-weight:800;margin:8px 0 4px">이동 방향</div>
              <div class="pad" id="gd-pad"></div>
              <div class="bar" style="margin-top:10px">
                <button type="button" class="btn" id="gd-hint">💡 기울기 화살표</button>
                <button type="button" class="btn w" id="gd-jump">🦘 탈출 점프</button>
                <button type="button" class="btn" id="gd-auto">▶ 자동 시연</button>
              </div>
              <div class="note">💡 <b>교과 탐구 Tip</b>: 가장 가파른 하강 방향은 <span class="k-math" data-tex="-\\nabla f"></span>입니다. 학습률이 너무 크면 최저점을 지나쳐 발산할 수 있습니다.</div>
            </div>
          </div>
        </div>
      `;
    },

    bindGame() {
      const pad = this.$('gd-pad');
      pad.innerHTML = DIRS.map((d, i) => `<button type="button" data-i="${i}">${d.n}</button>`).join('');
      pad.onclick = ev => {
        const b = ev.target.closest('button');
        if (!b) return;
        const d = DIRS[+b.getAttribute('data-i')];
        this.move(d.x, d.y);
      };

      ['gd-lr1', 'gd-lr2', 'gd-lr3'].forEach(id => {
        this.$(id).onclick = () => {
          this.G.lr = parseFloat(this.$(id).getAttribute('data-lr'));
          ['gd-lr1', 'gd-lr2', 'gd-lr3'].forEach(x => {
            this.$(x).className = 'btn' + (x === id ? ' p' : '');
          });
          this.toast('학습률 ' + this.G.lr + ' 설정됨', 'info');
        };
      });

      this.$('gd-hint').onclick = () => {
        if (this.G.arrows) return;
        this.state.hintUsed = true;
        this.G.arrows = true;
        this.toast('기울기 화살표 표시됨', 'info');
        this.draw();
      };

      this.$('gd-jump').onclick = () => {
        if (this.G.jumps <= 0) { this.toast('남은 점프 횟수가 없습니다.', 'err'); return; }
        this.G.jumps--;
        this.G.x += (Math.random() < .5 ? -1 : 1) * (1 + Math.random());
        this.G.y += (Math.random() < .5 ? -1 : 1) * (1 + Math.random());
        this.toast('탈출 점프 실행', 'info');
        this.updateZ();
        this.draw();
      };

      this.$('gd-auto').onclick = () => {
        if (this.state.demo) {
          this.state.demo = false;
          this.toast('자동 시연 중지', 'info');
          return;
        }
        this.state.demo = true;
        this.toast('자동 시연 시작', 'info');
        let k = 0;
        const tick = () => {
          if (!this.state.demo || k++ > 35 || this.height(this.G.x, this.G.y) <= this.G.targetZ) {
            this.state.demo = false;
            this.toast('자동 시연 완료', 'ok');
            return;
          }
          const gr = this.grad(this.G.x, this.G.y);
          const n = Math.hypot(gr.gx, gr.gy) || 1;
          this.move(-gr.gx / n, -gr.gy / n, true);
          this.later(tick, 350);
        };
        tick();
      };
    }
  };

  const gameMeta = {
    id: 'gradient-descent',
    title: APP_TITLE,
    icon: ICON,
    description: '등고선 지형에서 기울기(Gradient)와 학습률을 조절하며 최적의 최솟값을 찾는 미적분 시뮬레이션 교과 개념 탐구',
    appType: 'concept',
    topApp: '교과 수학 개념',
    activityType: ['시뮬레이션', '개념 탐구', '시각화'],
    schoolLevel: ['high'],
    gradeBand: ['고1', '고2', '고3'],
    curriculumArea: ['미적분', '인공지능 수학'],
    unit: ['미분법', '최적화'],
    concepts: ['경사하강법', '접선의 기울기', '학습률', '편미분'],
    category: '미적분과 AI',
    level: '고등',
    concept: '경사하강법, 미분, 학습률',
    classroomUse: ['개념 제시', '수업 시연', '탐구 활동'],
    difficulty: '보통',
    duration: '5분',
    renderMode: 'Canvas',
    sourceType: 'new',
    playModes: ['single'],
    tags: ['경사하강법', '미적분', '인공지능', '최적화', '학습률'],
    keywords: ['경사하강법', 'Gradient Descent', '미분', '인공지능수학'],
    mount(container, context) {
      GradientDescentGame.mount(container, context);
    },
    reset() {
      GradientDescentGame.reset();
    },
    destroy() {
      GradientDescentGame.destroy();
    },
    goHome() {
      GradientDescentGame.goHome();
    }
  };

  function registerGradientDescent() {
    if (typeof window.MathLabGames !== 'undefined' && typeof window.MathLabGames.register === 'function') {
      if (!window.MathLabGames.get || !window.MathLabGames.get('gradient-descent')) {
        try {
          window.MathLabGames.register(gameMeta);
        } catch (e) { console.warn('gradient-descent 방어적 등록:', e); }
      }
    }
  }

  registerGradientDescent();
  window.addEventListener('DOMContentLoaded', registerGradientDescent);
  setTimeout(registerGradientDescent, 100);
  setTimeout(registerGradientDescent, 500);

  window.GradientDescent = {
    mount: (c, x) => GradientDescentGame.mount(c, x),
    resetGame: () => GradientDescentGame.reset(),
    destroy: () => GradientDescentGame.destroy(),
    goHome: () => GradientDescentGame.goHome()
  };

  window.initGradientDescent = function() {
    registerGradientDescent();
    if (window.LegacyBridge && typeof window.LegacyBridge.hideAllLegacySections === 'function') {
      window.LegacyBridge.hideAllLegacySections();
      if (window.LegacyBridge.showNewRoot) window.LegacyBridge.showNewRoot();
    }
    if (typeof window.MathLabGames !== 'undefined' && typeof window.MathLabGames.mount === 'function') {
      try { window.MathLabGames.mount('gradient-descent'); return; } catch(e) {}
    }
    const targetEl = document.getElementById('mathlab-view') || document.getElementById('new-root') || document.getElementById('game-container');
    GradientDescentGame.mount(targetEl);
  };

  window.launchGradientDescent = window.initGradientDescent;
})();
</script>
