<style>
/* Gen-3 Settings App Light Theme */
.app-settings-container {
  width: 100%;
  max-width: 680px;
  margin: 0 auto;
  padding: 40px 20px 80px;
  background: #f8fafc;
  color: #0f172a;
  font-family: 'Pretendard', -apple-system, sans-serif;
  text-align: left;
}

.app-settings-header {
  margin-bottom: 30px;
}

.app-settings-header h1 {
  font-size: 2.2rem;
  font-weight: 900;
  color: #0f172a;
  margin: 0 0 8px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.app-settings-header p {
  color: #475569;
  font-size: 1rem;
  margin: 0;
  line-height: 1.6;
}

.settings-section {
  background: #ffffff;
  border: 1px solid #e2e8f0;
  border-radius: 20px;
  padding: 24px 28px;
  margin-bottom: 24px;
  box-shadow: 0 4px 12px rgba(15, 23, 42, 0.03);
}

.settings-section h2 {
  font-size: 1.25rem;
  font-weight: 800;
  color: #1e293b;
  margin: 0 0 20px;
  display: flex;
  align-items: center;
  gap: 8px;
  border-bottom: 2px solid #f1f5f9;
  padding-bottom: 12px;
}

.settings-field {
  margin-bottom: 20px;
}

.settings-field:last-child {
  margin-bottom: 0;
}

.settings-field label {
  display: block;
  font-size: 0.95rem;
  font-weight: 700;
  color: #334155;
  margin-bottom: 8px;
}

.settings-input {
  width: 100%;
  padding: 14px 16px;
  border: 1px solid #cbd5e1;
  border-radius: 12px;
  background: #f8fafc;
  color: #0f172a;
  font-size: 1rem;
  transition: all 0.2s;
  box-sizing: border-box;
}

.settings-input:focus {
  outline: none;
  border-color: #3b82f6;
  background: #ffffff;
  box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
}

.settings-radio-group {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.settings-radio-label {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 14px;
  border: 1px solid #cbd5e1;
  border-radius: 12px;
  background: #ffffff;
  cursor: pointer;
  transition: all 0.2s;
}

.settings-radio-label:hover {
  border-color: #94a3b8;
  background: #f1f5f9;
}

.settings-radio-label input[type="radio"] {
  margin-top: 4px;
  accent-color: #3b82f6;
}

.settings-radio-text {
  display: flex;
  flex-direction: column;
}

.settings-radio-text strong {
  color: #0f172a;
  font-size: 0.95rem;
  margin-bottom: 4px;
}

.settings-radio-text span {
  color: #64748b;
  font-size: 0.85rem;
  line-height: 1.4;
}

.settings-radio-label:has(input:checked) {
  border-color: #3b82f6;
  background: #eff6ff;
}

.settings-btn-save {
  width: 100%;
  background: #3b82f6;
  color: #ffffff;
  border: none;
  border-radius: 14px;
  padding: 16px;
  font-size: 1.1rem;
  font-weight: 800;
  cursor: pointer;
  box-shadow: 0 6px 16px rgba(59, 130, 246, 0.25);
  transition: all 0.2s;
  margin-top: 10px;
}

.settings-btn-save:hover {
  background: #2563eb;
  transform: translateY(-1px);
  box-shadow: 0 8px 20px rgba(59, 130, 246, 0.35);
}

.settings-btn-save:active {
  transform: translateY(1px);
}

.settings-btn-secondary {
  width: 100%;
  background: #ffffff;
  color: #3b82f6;
  border: 1px solid #3b82f6;
  border-radius: 12px;
  padding: 14px;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
  margin-top: 16px;
}

.settings-btn-secondary:hover {
  background: #eff6ff;
}
</style>

<script>
const AdminSettingsModule = (function() {
  function getAppHtml() {
    return `
      <div class="app-settings-container">
        <div class="app-settings-header">
          <h1>⚙️ 환경 설정</h1>
          <p>AI 튜터(과외) 기능 이용을 위한 Gemini API Key를 관리합니다.</p>
        </div>

        <div class="settings-section">
          <h2>🤖 AI 튜터 연결 설정</h2>
          <div class="settings-field">
            <label for="set-api-key">Gemini API Key (Google AI Studio)</label>
            <input type="password" id="set-api-key" class="settings-input" placeholder="AI-Key를 입력하세요 (예: AIzaSy...)">
            <p style="font-size:0.85rem; color:#64748b; margin-top:8px; line-height:1.5;">
              🔒 <strong>보안 안내:</strong> 입력하신 API Key는 외부 서버로 전송되지 않으며, 사용자 본인의 브라우저(localStorage)에 안전하게 암호화되어 보관됩니다.
            </p>
          </div>
        </div>

        <button type="button" class="settings-btn-save" id="btn-save-settings">💾 설정 저장하기</button>
      </div>
    `;
  }

  function loadValues() {
    const apiKey = localStorage.getItem('math_lab_api_key') || localStorage.getItem('gemini_api_key') || '';
    const input = document.getElementById('set-api-key');
    if (input) input.value = apiKey;
  }

  function saveValues() {
    const apiKey = (document.getElementById('set-api-key')?.value || '').trim();
    localStorage.setItem('math_lab_api_key', apiKey);
    localStorage.setItem('gemini_api_key', apiKey);

    if (typeof showToast === 'function') {
      if (!apiKey) {
        showToast("ℹ️ API Key가 비어있습니다.");
      } else {
        showToast("✨ Gemini API Key가 성공적으로 저장되었습니다!");
      }
    }

    setTimeout(() => {
      if (typeof goHome === 'function') goHome();
    }, 800);
  }

  function mount(container, context = {}) {
    let host = null;
    if (typeof container === 'string') host = document.querySelector(container);
    else if (container instanceof HTMLElement) host = container;
    
    if (!host) host = window.MathLabUtils?.getMountContainer ? window.MathLabUtils.getMountContainer(container) : document.getElementById('mathlab-view');
    if (!host || !(host instanceof HTMLElement)) host = document.getElementById('new-root') || document.getElementById('game-container') || document.getElementById('mathlab-view');

    if (!host || !(host instanceof HTMLElement) || host === document.body) {
      let createdHost = document.getElementById('admin-settings-host');
      if (!createdHost) {
        createdHost = document.createElement('div');
        createdHost.id = 'admin-settings-host';
        document.body.appendChild(createdHost);
      }
      host = createdHost;
    }

    const footerEl = document.querySelector('footer, #footer, .app-footer');
    if (footerEl && host && typeof host.compareDocumentPosition === 'function' && (host.compareDocumentPosition(footerEl) & Node.DOCUMENT_POSITION_PRECEDING)) {
      footerEl.parentNode.insertBefore(host, footerEl);
    }

    host.style.display = '';
    host.style.visibility = 'visible';
    host.style.opacity = '1';

    let parent = host.parentElement;
    while (parent && parent !== document.body && parent !== document.documentElement) {
      if (parent.style && parent.style.display === 'none') parent.style.display = 'block';
      if (parent.style && parent.style.visibility === 'hidden') parent.style.visibility = 'visible';
      parent = parent.parentElement;
    }

    document.querySelectorAll('header, .navbar, #app-header, .top-bar, #floating-home-btn, .floating-home').forEach(el => {
      if (el && el.style && el.style.display === 'none') el.style.display = '';
    });

    host.innerHTML = getAppHtml();
    loadValues();

    document.getElementById('btn-save-settings').addEventListener('click', saveValues);
  }

  function destroy() {}
  
  function goHomeFallback() {
    if (typeof goHome === 'function') goHome();
  }

  return { mount, destroy, goHome: goHomeFallback };
})();

function registerAdminSettings() {
  if (typeof window.MathLabGames !== 'undefined' && typeof window.MathLabGames.register === 'function') {
    if (!window.MathLabGames.get('settings')) {
      try {
        window.MathLabGames.register({
          id: 'settings',
          title: '환경 설정',
          icon: '⚙️',
          sourceType: 'gen3',
          mount(container, context) { AdminSettingsModule.mount(container, context); },
          reset() {},
          destroy() { AdminSettingsModule.destroy(); },
          goHome() { AdminSettingsModule.goHome(); }
        });
      } catch (e) {
        console.warn('settings 안전 등록 실패:', e);
      }
    }
  }
}

registerAdminSettings();
window.addEventListener('DOMContentLoaded', registerAdminSettings);
setTimeout(registerAdminSettings, 100);
setTimeout(registerAdminSettings, 500);

window.initSettingsApp = function() {
  registerAdminSettings();
  if (typeof window.MathLabGames !== 'undefined' && typeof window.MathLabGames.mount === 'function') {
    try { window.MathLabGames.mount('settings'); return; } catch(e) {}
  }
  const targetEl = document.getElementById('mathlab-view') || document.getElementById('new-root');
  if (targetEl) AdminSettingsModule.mount(targetEl);
};
</script>
