  /* Canvas Container */

    width: 100%;

  /* Quiz Overlay */
  .game-graph-runner .quiz-overlay {
    position: absolute;
    top: 20px;

    border: 2px solid #f59e0b;

  }
  .game-graph-runner .quiz-overlay.show { display: flex; }
  .game-graph-runner .quiz-text {
    font-size: 1.1rem;

  .game-graph-runner .btn-start-run {
    padding: 8px 24px;

    box-shadow: 0 4px 6px rgba(16, 185, 129, 0.3);
    transition: transform 0.2s;
  }
  .game-graph-runner .btn-start-run:hover { transform: scale(1.05); }

  /* Controls */
  .game-graph-runner .control-panel {
    background: #ffffff;

  .game-graph-runner .equation-display {
    text-align: center;

  }
  .game-graph-runner .sliders {
    display: flex;

  }
  .game-graph-runner .slider-group {
    flex: 1;
    min-width: 250px;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: #f8fafc;

    border-radius: 12px;
    border: 1px solid #cbd5e1;
  }
  .game-graph-runner .slider-label {
    font-size: 1.1rem;
    font-weight: 800;
    color: #475569;

  }
  .game-graph-runner .slider-row {
    display: flex;
    align-items: center;
    gap: 15px;
    width: 100%;
  }
  .game-graph-runner .btn-adj {
    width: 40px;
    height: 40px;
    border-radius: 8px;
    border: none;
    background: #e2e8f0;
    color: #1e293b;
    font-size: 1.5rem;
    font-weight: 900;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .game-graph-runner .btn-adj:active { background: #cbd5e1; }
  .game-graph-runner input[type="range"] {
    flex: 1;
    accent-color: #0ea5e9;
    cursor: pointer;
  }

  /* Bottom Ranking */
  .game-graph-runner .bottom-ranking-card {
    background: #ffffff;
    border-top: 2px solid #e2e8f0;
    padding: 15px 20px;
  }
  .game-graph-runner .ranking-title {
    font-size: 1.1rem;
    font-weight: 800;
    color: #f59e0b;
    margin-bottom: 10px;
  }

  /* Modals */
  .gr-modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.5);
    backdrop-filter: blur(4px);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 10000;
  }
  .gr-modal {
    background: #ffffff;
    width: 90%;
    max-width: 500px;
    border-radius: 16px;
    padding: 30px;
    border: 1px solid #e2e8f0;
    box-shadow: 0 20px 50px rgba(0,0,0,0.1);
    text-align: center;
    color: #1e293b;
  }
  .gr-modal h3 { font-size: 1.5rem; margin-bottom: 15px; color: #0ea5e9; }
  .gr-modal p { font-size: 1.05rem; line-height: 1.6; color: #475569; margin-bottom: 20px; text-align: left; }
  .gr-modal .close-btn {
    padding: 10px 20px;
    background: #0ea5e9;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 1.1rem;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    margin: 5px;
  }

  .gr-toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #ffffff;
    color: #1e293b;
    padding: 12px 24px;
    border-radius: 30px;
    font-weight: 700;
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    z-index: 9999;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s, top 0.3s;
    border: 1px solid #e2e8f0;
  }
  .gr-toast.show { opacity: 1; top: 40px; }
  .gr-toast.error { border-color: #fca5a5; color: #ef4444; background: #fef2f2; }
  .gr-toast.success { border-color: #6ee7b7; color: #10b981; background: #ecfdf5; }
</style>

<script>
const GraphRunner = (function() {
  let host = null;
  let canvas, ctx;
  let reqId;
  let resizeObserver = null;
  
  const UNIT = 30; // pixels per math unit
  
  // Game State
  let gameState = 'idle'; // 'idle', 'quiz', 'running', 'cycle_end', 'gameover'
  let score = 0;
  let currentRound = 1; // absolute round 1, 2, 3...
  let roundsCompletedInCycle = 0; // 0 to 5
  
  let speed = 3; // units per second
  let timeLeft = 0;
  
  let playerX = 0;
  let currentA = 0;
  let currentB = 0;
  
  let cameraX = 0;
  let cameraY = 0;
  
  // Current Round Data
  let coins = [];
  let walls = [];
  let targetA = 0;
  let targetB = 0;
  let p1 = {x:0, y:0};
  let p2 = {x:0, y:0};
  let goalX = 30;
  let quizHintText = "";
  
  let lastTime = 0;

  function showToast(msg, type) {
    if (!type) type = 'normal';
    let toast = document.getElementById('gr-toast');
    if (!toast) {
      toast = document.createElement('div');
      toast.id = 'gr-toast';
      toast.className = 'gr-toast';
      document.body.appendChild(toast);
    }
    toast.className = 'gr-toast ' + type + ' show';
    toast.textContent = msg;
    setTimeout(function() { toast.classList.remove('show'); }, 3000);
  }

  function escapeHTML(str) {
    if (!str) return '';
    return str.replace(/[&<>'"]/g, function(tag) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag;
    });
  }

  function formatEquation(a, b) {
    let aStr = '';
    if (a === 1) aStr = 'x';
    else if (a === -1) aStr = '-x';
    else if (a !== 0) aStr = a + 'x';
    
    let bStr = '';
    if (b > 0) bStr = (a !== 0 ? ' + ' : '') + b;
    else if (b < 0) bStr = (a !== 0 ? ' - ' : '-') + Math.abs(b);
    
    if (a === 0 && b === 0) return 'y = 0';
    return 'y = ' + aStr + bStr;
  }

  function startNextRound() {
    gameState = 'quiz';
    roundsCompletedInCycle++;
    
    playerX = 0;
    
    // Determine time limit
    timeLeft = Math.max(10, 20 - (currentRound - 1));
    
    // Speed logic (increases every round slightly)
    speed = 3 + (currentRound * 0.4);
    
    // Generate Target Function based on Round Level
    let isEasy = currentRound <= 2;
    let isMed = currentRound > 2 && currentRound <= 4;
    
    if (isEasy) {
       targetA = Math.floor(Math.random() * 5) - 2; // -2 to 2
       targetB = Math.floor(Math.random() * 9) - 4; // -4 to 4
       p1.x = 0; p1.y = targetB;
       p2.x = Math.floor(Math.random() * 3) + 2; 
       p2.y = targetA * p2.x + targetB;
       quizHintText = "y절편(0, " + targetB + ")과 한 점(" + p2.x + ", " + p2.y + ")을 지나는 직선!";
    } else if (isMed) {
       // x-intercept and y-intercept
       targetA = (Math.random() > 0.5 ? 1 : -1) * (Math.floor(Math.random() * 2) + 1); // 1, 2, -1, -2
       let xInt = Math.floor(Math.random() * 4) + 2; // 2 to 5
       if (Math.random() > 0.5) xInt *= -1;
       // 0 = a * xInt + b => b = -a * xInt
       targetB = -targetA * xInt;
       p1.x = xInt; p1.y = 0;
       p2.x = 0; p2.y = targetB;
       quizHintText = "x절편(" + xInt + ", 0)과 y절편(0, " + targetB + ")을 지나는 직선!";
    } else {
       // Random two points
       targetA = Math.floor(Math.random() * 7) - 3;
       if (targetA === 0) targetA = 1;
       targetB = Math.floor(Math.random() * 11) - 5;
       p1.x = Math.floor(Math.random() * 5) - 4; // -4 to 0
       p1.y = targetA * p1.x + targetB;
       p2.x = p1.x + Math.floor(Math.random() * 3) + 2; 
       p2.y = targetA * p2.x + targetB;
       quizHintText = "두 점 (" + p1.x + ", " + p1.y + ")과 (" + p2.x + ", " + p2.y + ")를 지나는 직선!";
    }
    
    // Set Goal
    goalX = 40;
    
    // Generate Coins along the TRUE line
    coins = [];
    for (let cx = 3; cx <= goalX - 2; cx += 2) {
      coins.push({ x: cx, y: targetA * cx + targetB, collected: false });
    }
    
    // Generate Obstacles
    walls = [];
    let numWalls = Math.min(10, Math.floor(currentRound / 2) + 1);
    let wallXCandidates = [];
    for(let x=5; x<=goalX-5; x+=3) wallXCandidates.push(x);
    wallXCandidates.sort(function() { return Math.random() - 0.5; });
    
    for (let i=0; i<numWalls && i<wallXCandidates.length; i++) {
      let wx = wallXCandidates[i];
      let wy = targetA * wx + targetB;
      walls.push({
        x: wx,
        ymin: wy - 1.5,
        ymax: wy + 1.5,
        hit: false
      });
      // Remove coins that are exactly where the wall is
      for (let c of coins) {
        if (Math.abs(c.x - wx) < 1) c.collected = true;
      }
    }
    
    // Reset player position for quiz phase camera
    cameraX = (p1.x + p2.x) / 2;
    cameraY = (p1.y + p2.y) / 2;
    
    // Reset sliders to 0 to force solving
    updateA(0);
    updateB(0);
    
    lastTime = performance.now();
    updateUI();
  }

  function startRunning() {
    if (gameState !== 'quiz') return;
    gameState = 'running';
    // Align camera with player
    cameraX = playerX + (canvas.width/4)/UNIT;
    cameraY = currentA * playerX + currentB;
    updateUI();
  }

  function endRound() {
    if (roundsCompletedInCycle >= 5) {
      gameState = 'cycle_end';
      showCycleEndModal();
    } else {
      currentRound++;
      startNextRound();
    }
  }

  function updateA(val) {
    currentA = parseFloat(val);
    if(host) {
      host.querySelector('#slider-a').value = currentA;
      host.querySelector('#val-a').textContent = currentA;
      host.querySelector('#eq-display').textContent = formatEquation(currentA, currentB);
    }
  }

  function updateB(val) {
    currentB = parseFloat(val);
    if(host) {
      host.querySelector('#slider-b').value = currentB;
      host.querySelector('#val-b').textContent = currentB;
      host.querySelector('#eq-display').textContent = formatEquation(currentA, currentB);
    }
  }

  function changeA(delta) {
    let nv = currentA + delta;
    if (nv >= -5 && nv <= 5) updateA(nv);
  }

  function changeB(delta) {
    let nv = currentB + delta;
    if (nv >= -10 && nv <= 10) updateB(nv);
  }

  function updateUI() {
    if (!host) return;
    host.querySelector('#ui-score').textContent = score;
    host.querySelector('#ui-level').textContent = currentRound;
    
    const timeEl = host.querySelector('#ui-time');
    if (gameState === 'quiz') {
      timeEl.textContent = '⏳ ' + Math.ceil(timeLeft) + '초';
      timeEl.style.color = timeLeft <= 5 ? '#ef4444' : '#f59e0b';
    } else {
      timeEl.textContent = '🏃 달리는 중...';
      timeEl.style.color = '#10b981';
    }
    
    const overlay = host.querySelector('#quiz-overlay');
    if (gameState === 'quiz') {
      host.querySelector('#quiz-text').textContent = quizHintText;
      overlay.classList.add('show');
    } else {
      overlay.classList.remove('show');
    }
  }

  function worldToScreen(X, Y) {
    return {
      x: (canvas.width/4) + (X - cameraX) * UNIT,
      y: (canvas.height/2) - (Y - cameraY) * UNIT
    };
  }

  function draw() {
    if (!canvas || !ctx) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    let targetCX = playerX;
    let targetCY = currentA * playerX + currentB;
    
    if (gameState === 'quiz') {
      targetCX = (p1.x + p2.x) / 2;
      targetCY = (p1.y + p2.y) / 2;
    }
    
    // Smooth camera
    cameraX += (targetCX - cameraX) * 0.15;
    cameraY += (targetCY - cameraY) * 0.15;
    
    let minX = cameraX - (canvas.width/4)/UNIT - 2;
    let maxX = cameraX + (canvas.width*3/4)/UNIT + 2;
    let minY = cameraY - (canvas.height/2)/UNIT - 2;
    let maxY = cameraY + (canvas.height/2)/UNIT + 2;
    
    // Grid
    ctx.strokeStyle = '#e2e8f0';
    ctx.lineWidth = 1;
    for(let x = Math.floor(minX); x <= Math.ceil(maxX); x++) {
      let p = worldToScreen(x, 0);
      ctx.beginPath(); ctx.moveTo(p.x, 0); ctx.lineTo(p.x, canvas.height); ctx.stroke();
    }
    for(let y = Math.floor(minY); y <= Math.ceil(maxY); y++) {
      let p = worldToScreen(0, y);
      ctx.beginPath(); ctx.moveTo(0, p.y); ctx.lineTo(canvas.width, p.y); ctx.stroke();
    }
    
    // Axes
    ctx.strokeStyle = '#94a3b8';
    ctx.lineWidth = 2;
    let pOrigin = worldToScreen(0, 0);
    if (pOrigin.x >= 0 && pOrigin.x <= canvas.width) {
      ctx.beginPath(); ctx.moveTo(pOrigin.x, 0); ctx.lineTo(pOrigin.x, canvas.height); ctx.stroke();
    }
    if (pOrigin.y >= 0 && pOrigin.y <= canvas.height) {
      ctx.beginPath(); ctx.moveTo(0, pOrigin.y); ctx.lineTo(canvas.width, pOrigin.y); ctx.stroke();
    }
    
    // During Quiz, we hide the lines, coins, and player to prevent visual cheating!
    if (gameState === 'running' || gameState === 'cycle_end') {
      // Target Line Outline
      let ty1 = targetA * minX + targetB;
      let ty2 = targetA * maxX + targetB;
      let tpL1 = worldToScreen(minX, ty1);
      let tpL2 = worldToScreen(maxX, ty2);
      ctx.strokeStyle = 'rgba(16, 185, 129, 0.2)'; 
      ctx.lineWidth = 8;
      ctx.beginPath(); ctx.moveTo(tpL1.x, tpL1.y); ctx.lineTo(tpL2.x, tpL2.y); ctx.stroke();
      
      // Walls
      for (let w of walls) {
        if (!w.hit && w.x > minX - 2 && w.x < maxX + 2) {
          let pTop = worldToScreen(w.x, w.ymax);
          let pBot = worldToScreen(w.x, w.ymin);
          ctx.fillStyle = '#fca5a5'; 
          let width = 0.8 * UNIT;
          ctx.fillRect(pTop.x - width/2, pTop.y, width, pBot.y - pTop.y);
          ctx.fillStyle = '#ef4444';
          ctx.font = '16px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('⚠️', pTop.x, pTop.y + (pBot.y - pTop.y)/2 + 6);
        }
      }
      
      // Coins
      ctx.font = '24px sans-serif';
      ctx.textAlign = 'center';
      for (let c of coins) {
        if (!c.collected && c.x > minX - 2 && c.x < maxX + 2) {
          let p = worldToScreen(c.x, c.y);
          ctx.fillText('🪙', p.x, p.y + 8);
        }
      }
      
      // The User's Line
      let y1 = currentA * minX + currentB;
      let y2 = currentA * maxX + currentB;
      let pL1 = worldToScreen(minX, y1);
      let pL2 = worldToScreen(maxX, y2);
      ctx.strokeStyle = '#0ea5e9';
      ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(pL1.x, pL1.y); ctx.lineTo(pL2.x, pL2.y); ctx.stroke();
      
      // Player
      let playerY = currentA * playerX + currentB;
      let pPlayer = worldToScreen(playerX, playerY);
      ctx.font = '28px sans-serif';
      ctx.fillText('🛹', pPlayer.x, pPlayer.y + 10);
    }
    
    // Quiz Points (Hints)
    if (gameState === 'quiz') {
      let mp1 = worldToScreen(p1.x, p1.y);
      let mp2 = worldToScreen(p2.x, p2.y);
      ctx.fillStyle = '#f59e0b';
      ctx.beginPath(); ctx.arc(mp1.x, mp1.y, 8, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(mp2.x, mp2.y, 8, 0, Math.PI*2); ctx.fill();
      
      ctx.fillStyle = '#1e293b';
      ctx.font = 'bold 16px Pretendard';
      ctx.fillText(`(${p1.x}, ${p1.y})`, mp1.x, mp1.y - 12);
      ctx.fillText(`(${p2.x}, ${p2.y})`, mp2.x, mp2.y - 12);
    }
    
    // Goal Line (only when running)
    if (gameState === 'running' && goalX > minX - 2 && goalX < maxX + 2) {
      let pGoalTop = worldToScreen(goalX, maxY);
      let pGoalBot = worldToScreen(goalX, minY);
      ctx.strokeStyle = '#f59e0b';
      ctx.setLineDash([10, 10]);
      ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(pGoalTop.x, pGoalTop.y); ctx.lineTo(pGoalBot.x, pGoalBot.y); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = '#f59e0b';
      ctx.font = 'bold 16px Pretendard';
      ctx.fillText('GOAL', pGoalTop.x, pGoalTop.y + 30);
    }
  }

  function gameLoop(time) {
    if (gameState === 'idle' || gameState === 'gameover' || gameState === 'cycle_end') {
      lastTime = time;
      return;
    }
    let dt = (time - lastTime) / 1000;
    lastTime = time;
    if (dt > 0.1) dt = 0.1;
    
    if (gameState === 'quiz') {
      timeLeft -= dt;
      if (timeLeft <= 0) {
        timeLeft = 0;
        showToast('시간 초과! 그대로 강제 출발합니다.', 'error');
        startRunning();
      }
      if (Math.floor(timeLeft) !== Math.floor(timeLeft + dt)) {
        updateUI();
      }
    }
    else if (gameState === 'running') {
      let oldX = playerX;
      playerX += speed * dt;
      let playerY = currentA * playerX + currentB;
      
      for (let c of coins) {
        if (!c.collected && playerX >= c.x && oldX < c.x) {
          if (Math.abs(playerY - c.y) <= 0.8) {
            c.collected = true;
            score += 10;
            updateUI();
          }
        }
      }
      
      for (let w of walls) {
        if (!w.hit && playerX >= w.x && oldX < w.x) {
          if (playerY >= w.ymin - 0.5 && playerY <= w.ymax + 0.5) {
            w.hit = true;
            score -= 5;
            if (score < 0) score = 0;
            showToast('💥 장애물 충돌! 점수 -5', 'error');
            updateUI();
          }
        }
      }
      
      if (playerX >= goalX) {
        endRound();
      }
    }
    
    draw();
    if (gameState !== 'gameover' && gameState !== 'idle' && gameState !== 'cycle_end') {
      reqId = requestAnimationFrame(gameLoop);
    }
  }

  function fullResetGame() {
    if (reqId) cancelAnimationFrame(reqId);
    score = 0;
    currentRound = 1;
    roundsCompletedInCycle = 0;
    startNextRound();
    if (reqId) cancelAnimationFrame(reqId);
    reqId = requestAnimationFrame(gameLoop);
  }

  function showCycleEndModal() {
    let modal = document.getElementById('gr-cycle-modal');
    if (!modal) {
      modal = document.createElement('div');
      modal.id = 'gr-cycle-modal';
      modal.className = 'gr-modal-overlay';
      modal.innerHTML = 
        '<div class="gr-modal">' +
          '<h3>🎉 5라운드 완료!</h3>' +
          '<p>현재 누적 점수: <strong id="gr-cycle-score" style="color:#0ea5e9; font-size:1.4rem;"></strong> 점<br><br>' +
          '다음 5라운드에 계속 도전하시겠습니까?<br>계속 진행하면 스피드가 더 빨라집니다!</p>' +
          '<div style="display:flex; justify-content:center; gap:10px;">' +
            '<button class="close-btn" id="btn-continue" style="background:#10b981;">계속 도전하기 🏃</button>' +
            '<button class="close-btn" id="btn-stop" style="background:#f59e0b;">여기서 멈추고 랭킹 등록 🏆</button>' +
          '</div>' +
        '</div>';
      document.body.appendChild(modal);
      
      document.getElementById('btn-continue').addEventListener('click', function() {
        document.getElementById('gr-cycle-modal').style.display = 'none';
        roundsCompletedInCycle = 0;
        currentRound++;
        startNextRound();
        reqId = requestAnimationFrame(gameLoop);
      });
      document.getElementById('btn-stop').addEventListener('click', function() {
        document.getElementById('gr-cycle-modal').style.display = 'none';
        gameOver();
      });
    }
    document.getElementById('gr-cycle-score').textContent = score;
    modal.style.display = 'flex';
  }

  function gameOver() {
    gameState = 'gameover';
    showRankingModal();
  }

  function showGuideModal() {
    let modal = document.getElementById('gr-guide-modal');
    if (!modal) {
      modal = document.createElement('div');
      modal.id = 'gr-guide-modal';
      modal.className = 'gr-modal-overlay';
      modal.innerHTML = 
        '<div class="gr-modal">' +
          '<h3>📖 게임 방법</h3>' +
          '<p>' +
            '- <b>[블라인드 퀴즈]</b> 제한시간 내에 화면에 주어진 두 점의 좌표를 보고 직선의 식(y=ax+b)을 <b>직접 계산</b>하여 입력하세요.<br>' +
            '- 입력 중에는 내 선과 맵이 보이지 않습니다! 계산력을 발휘하세요.<br>' +
            '- <b>[출발]</b> 버튼을 누르면 내가 입력한 수식대로 캐릭터가 나타나 달리며, 정답 경로에 놓인 코인을 먹게 됩니다.<br>' +
            '- 예측에 실패했거나 달리던 도중 <b>장애물(벽)</b>이 나타나면, 달리는 도중 실시간으로 기울기와 절편을 수정하여 궤도를 변경하세요.<br>' +
            '- 5라운드마다 도전과 멈춤을 선택할 수 있습니다.' +
          '</p>' +
          '<button class="close-btn" onclick="document.getElementById(&quot;gr-guide-modal&quot;).style.display=&quot;none&quot;">확인</button>' +
        '</div>';
      document.body.appendChild(modal);
    }
    modal.style.display = 'flex';
  }

  function showRankingModal() {
    let modal = document.getElementById('gr-ranking-modal');
    if (!modal) {
      modal = document.createElement('div');
      modal.id = 'gr-ranking-modal';
      modal.className = 'gr-modal-overlay';
      modal.innerHTML = 
        '<div class="gr-modal">' +
          '<h3>🏆 랭킹 등록</h3>' +
          '<p>최종 점수: <strong id="gr-rank-score" style="color:#f59e0b; font-size:1.5rem;"></strong> 점 (도달 라운드: <span id="gr-rank-round"></span>)</p>' +
          '<input type="text" id="gr-rank-name" placeholder="닉네임 (10자 이내)" maxlength="10" style="width:100%; padding:10px; margin-bottom:15px; border-radius:8px; background:#f8fafc; border:1px solid #cbd5e1; color:#1e293b; text-align:center;">' +
          '<button class="close-btn" id="gr-rank-submit">등록 후 처음부터 재시작</button>' +
          '<button class="close-btn" style="background:#64748b; margin-left:10px;" onclick="document.getElementById(&quot;gr-ranking-modal&quot;).style.display=&quot;none&quot;">닫기</button>' +
        '</div>';
      document.body.appendChild(modal);
      
      document.getElementById('gr-rank-submit').addEventListener('click', function() {
        const nameInput = document.getElementById('gr-rank-name');
        let name = nameInput.value.trim();
        if (!name) { showToast('닉네임을 입력하세요.', 'error'); return; }
        name = escapeHTML(name);
        
        if (typeof window.submitRanking === 'function') {
          window.submitRanking('graph-runner', score, true, 'gr-rank-name', 'board-graph-runner');
        } else if (typeof window.submitRankingScore === 'function') {
          window.submitRankingScore('graph-runner', name, score);
        } else {
          let list = JSON.parse(localStorage.getItem('mathlab_lb_graph-runner') || '[]');
          list.push({ nickname: name, score: score });
          list.sort(function(a,b) { return b.score - a.score; });
          localStorage.setItem('mathlab_lb_graph-runner', JSON.stringify(list));
        }
        
        showToast('명예의 전당에 등록되었습니다!', 'success');
        document.getElementById('gr-ranking-modal').style.display = 'none';
        renderBottomLeaderboard();
        fullResetGame();
      });
    }
    document.getElementById('gr-rank-score').textContent = score;
    document.getElementById('gr-rank-round').textContent = currentRound;
    document.getElementById('gr-rank-name').value = '';
    modal.style.display = 'flex';
  }

  function renderBottomLeaderboard() {
    if (typeof window.loadGameLeaderboard === 'function') {
      window.loadGameLeaderboard('graph-runner', true, 'board-graph-runner');
    } else {
      try {
        let list = JSON.parse(localStorage.getItem('mathlab_lb_graph-runner') || '[]');
        const bottomEl = document.getElementById('board-graph-runner');
        if (bottomEl) {
          if (list.length === 0) {
            bottomEl.innerHTML = '<p style="text-align:center; color:#94a3b8; padding:12px 0;">아직 등록된 기록이 없습니다.</p>';
          } else {
            bottomEl.innerHTML = list.slice(0, 5).map(function(item, idx) {
              return '<div style="display:flex; justify-content:space-between; align-items:center; background:#f8fafc; padding:10px 14px; border-radius:10px; border:1px solid #e2e8f0; margin-bottom:6px;">' +
                '<span style="font-weight:800; color:' + (idx === 0 ? '#f59e0b' : '#334155') + ';">' + (idx === 0 ? '👑 1위' : (idx + 1) + '위') + ' - ' + escapeHTML(item.nickname) + '</span>' +
                '<span style="color:#0ea5e9; font-weight:900;">' + item.score + ' 점</span>' +
              '</div>';
            }).join('');
          }
        }
      } catch(e) {}
    }
  }

  function goHome() {
    if (reqId) cancelAnimationFrame(reqId);
    gameState = 'idle';
    
    if (resizeObserver && host && host.querySelector('.canvas-wrapper')) {
      resizeObserver.disconnect();
    }
    
    if (host) {
      host.style.maxWidth = '';
      host.style.width = '';
      if (host.parentElement) {
        host.parentElement.style.maxWidth = '';
        host.parentElement.style.padding = '';
      }
      host.style.display = 'none';
      host.innerHTML = '';
    }
    const legacyHost = document.getElementById('mathlab-view');
    if (legacyHost) {
      legacyHost.style.display = 'none';
      legacyHost.innerHTML = '';
    }
    const forceHost = document.getElementById('graph-runner-force-host');
    if (forceHost) {
      forceHost.style.display = 'none';
      forceHost.innerHTML = '';
    }

    document.querySelectorAll('.app-grid, #dashboard-screen, #hero-section').forEach(function(el) {
      if (el && el.style) {
        el.style.display = '';
        el.style.visibility = '';
      }
    });

    if (window.LegacyBridge && typeof window.LegacyBridge.backHome === 'function') {
      window.LegacyBridge.backHome();
    } else if (typeof window.goHome === 'function') {
      window.goHome();
    }
  }

  function mount(container, context) {
    let target = null;
    if (typeof container === 'string') target = document.querySelector(container);
    else if (container instanceof HTMLElement) target = container;
    
    if (!target) target = window.MathLabUtils && window.MathLabUtils.getMountContainer ? window.MathLabUtils.getMountContainer(container) : document.getElementById('mathlab-view');
    if (!target || !(target instanceof HTMLElement)) target = document.getElementById('new-root') || document.getElementById('game-container') || document.getElementById('mathlab-view');

    if (!target || !(target instanceof HTMLElement) || target === document.body) {
      let createdHost = document.getElementById('graph-runner-force-host');
      if (!createdHost) {
        createdHost = document.createElement('div');
        createdHost.id = 'graph-runner-force-host';
        document.body.appendChild(createdHost);
      }
      target = createdHost;
    }

    const footerEl = document.querySelector('footer, #footer, .app-footer') || 
                     Array.from(document.querySelectorAll('div, p, span')).find(function(el) { return el.textContent && el.textContent.indexOf('2026 기록조율사') !== -1; });
    if (footerEl && target && typeof target.compareDocumentPosition === 'function' && (target.compareDocumentPosition(footerEl) & Node.DOCUMENT_POSITION_PRECEDING)) {
      footerEl.parentNode.insertBefore(target, footerEl);
    }

    target.style.display = '';
    target.style.visibility = 'visible';
    target.style.opacity = '1';
    
    // 강제로 전체 폭 허용 (부모 제약 해제)
    target.style.maxWidth = '100%';
    target.style.width = '100%';
    if (target.parentElement) {
       target.parentElement.style.maxWidth = '100%';
       target.parentElement.style.padding = '0';
    }

    let parent = target.parentElement;
    while (parent && parent !== document.body && parent !== document.documentElement) {
      if (parent.style && parent.style.display === 'none') parent.style.display = 'block';
      if (parent.style && parent.style.visibility === 'hidden') parent.style.visibility = 'visible';
      parent = parent.parentElement;
    }

    document.querySelectorAll('header, .navbar, #app-header, .top-bar, #floating-home-btn, .floating-home').forEach(function(el) {
      if (el && el.style && el.style.display === 'none') el.style.display = '';
    });
    
    host = target;

    host.innerHTML = 
      '<div class="game-graph-runner">' +
        '<div class="app-header">' +
          '<div class="app-title">🛹 함수 그래프 러너</div>' +
          '<div class="header-btns">' +
            '<button class="btn btn-primary" id="btn-guide">📖 방법</button>' +
            '<button class="btn btn-home" id="btn-home">🏠 홈</button>' +
          '</div>' +
        '</div>' +
        
        '<div class="status-bar">' +
          '<div class="stat-group">' +
            '<div class="stat-item">Level <span id="ui-level" style="color:#0ea5e9;">1</span></div>' +
            '<div class="stat-item time" id="ui-time">⏳ 20초</div>' +
          '</div>' +
          '<div class="stat-group">' +
            '<div class="stat-item">점수: <span class="score" id="ui-score">0</span></div>' +
          '</div>' +
        '</div>' +
        
        '<div class="main-area">' +
          '<div class="canvas-wrapper">' +
            '<canvas id="game-canvas" width="800" height="400"></canvas>' +
            '<div class="quiz-overlay" id="quiz-overlay">' +
              '<div class="quiz-text" id="quiz-text">두 점을 지나는 직선을 설정하세요!</div>' +
              '<button class="btn-start-run" id="btn-start-run">출발 🚀</button>' +
            '</div>' +
          '</div>' +
          
          '<div class="control-panel">' +
            '<div class="equation-display" id="eq-display">y = 0</div>' +
            '<div class="sliders">' +
              '<div class="slider-group">' +
                '<div class="slider-label">기울기 (a): <span id="val-a">0</span></div>' +
                '<div class="slider-row">' +
                  '<button class="btn-adj" id="btn-a-minus">-</button>' +
                  '<input type="range" id="slider-a" min="-5" max="5" step="1" value="0">' +
                  '<button class="btn-adj" id="btn-a-plus">+</button>' +
                '</div>' +
              '</div>' +
              '<div class="slider-group">' +
                '<div class="slider-label">y절편 (b): <span id="val-b">0</span></div>' +
                '<div class="slider-row">' +
                  '<button class="btn-adj" id="btn-b-minus">-</button>' +
                  '<input type="range" id="slider-b" min="-10" max="10" step="1" value="0">' +
                  '<button class="btn-adj" id="btn-b-plus">+</button>' +
                '</div>' +
              '</div>' +
            '</div>' +
          '</div>' +
        '</div>' +
        
        '<div class="bottom-ranking-card" id="board-graph-runner-wrapper">' +
          '<div class="ranking-title">🏆 명예의 전당 (최고 점수)</div>' +
          '<div id="board-graph-runner">' +
            '<p style="text-align:center; color:#94a3b8; padding:12px 0;">로딩 중...</p>' +
          '</div>' +
        '</div>' +
      '</div>';

    canvas = host.querySelector('#game-canvas');
    ctx = canvas.getContext('2d');
    
    resizeObserver = new ResizeObserver(function(entries) {
      for (let entry of entries) {
        let cw = entry.target.clientWidth;
        let ch = entry.target.clientHeight;
        if (cw > 0 && ch > 0) {
          canvas.width = cw;
          canvas.height = ch;
          if (gameState === 'quiz' || gameState === 'idle' || gameState === 'cycle_end') {
            draw();
          }
        }
      }
    });
    resizeObserver.observe(host.querySelector('.canvas-wrapper'));

    // Events
    host.querySelector('#btn-home').addEventListener('click', goHome);
    host.querySelector('#btn-guide').addEventListener('click', showGuideModal);
    
    host.querySelector('#slider-a').addEventListener('input', function(e) { updateA(e.target.value); });
    host.querySelector('#slider-b').addEventListener('input', function(e) { updateB(e.target.value); });
    host.querySelector('#btn-a-minus').addEventListener('click', function() { changeA(-1); });
    host.querySelector('#btn-a-plus').addEventListener('click', function() { changeA(1); });
    host.querySelector('#btn-b-minus').addEventListener('click', function() { changeB(-1); });
    host.querySelector('#btn-b-plus').addEventListener('click', function() { changeB(1); });
    
    host.querySelector('#btn-start-run').addEventListener('click', startRunning);

    setTimeout(function() {
      fullResetGame();
      renderBottomLeaderboard();
    }, 100);
  }

  function destroy() {
    if (reqId) cancelAnimationFrame(reqId);
    gameState = 'idle';
    if (resizeObserver && host && host.querySelector('.canvas-wrapper')) {
      resizeObserver.disconnect();
    }
    if (host) host.innerHTML = '';
  }

  return { mount: mount, resetGame: fullResetGame, destroy: destroy, goHome: goHome };
})();

function registerGraphRunner() {
  if (typeof window.MathLabGames !== 'undefined' && typeof window.MathLabGames.register === 'function') {
    if (!window.MathLabGames.get('graph-runner')) {
      try {
        window.MathLabGames.register({
          id: 'graph-runner',
          title: '함수 그래프 러너',
          icon: '🛹',
          sourceType: 'new',
          players: '1인',
          isMultiplayer: false,
          mount: function(container, context) { GraphRunner.mount(container, context); },
          reset: function() { GraphRunner.resetGame(); },
          destroy: function() { GraphRunner.destroy(); },
          goHome: function() { GraphRunner.goHome(); }
        });
      } catch (e) {
        console.warn('graph-runner 안전 등록 방어:', e);
      }
    }
  }
}

registerGraphRunner();
window.addEventListener('DOMContentLoaded', registerGraphRunner);
setTimeout(registerGraphRunner, 100);
setTimeout(registerGraphRunner, 500);

window.GraphRunnerModule = GraphRunner;

window.initGraphRunnerGame = function() {
  registerGraphRunner();
  if (window.LegacyBridge && typeof window.LegacyBridge.hideAllLegacySections === 'function') {
    window.LegacyBridge.hideAllLegacySections();
    window.LegacyBridge.showNewRoot();
  }
  if (typeof window.MathLabGames !== 'undefined' && typeof window.MathLabGames.mount === 'function') {
    try { window.MathLabGames.mount('graph-runner'); return; } catch(e) {}
  }
  const targetEl = document.getElementById('mathlab-view') || document.getElementById('new-root');
  GraphRunner.mount(targetEl);
};

window.launchMathLabGame = window.launchMathLabGame || function(id) {
  if (id === 'graph-runner') {
    window.initGraphRunnerGame();
  }
};
</script>
