<style>
  /* Gen-3 전용 스코프 스타일 (.game-coordinate-treasure) - 눈이 편안한 프리미엄 네이비/고대비 스타일 */
  .game-coordinate-treasure {
    --bg-primary: #0f172a;
    --bg-surface: #1e293b;
    --bg-card: #202e48;
    --accent-color: #38bdf8;
    --accent-glow: rgba(56, 189, 248, 0.35);
    --success-color: #22c55e;
    --warning-color: #f59e0b;
    --danger-color: #ef4444;
    --text-main: #f8fafc;
    --text-sub: #cbd5e1;
    --border-color: #3b82f6;

    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #172554 100%);
    color: var(--text-main);
    min-height: 100%;
    width: 100%;
    padding: 24px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
    user-select: none;
    border-radius: 24px;
    border: 3px solid #3b82f6;
    box-shadow: inset 0 0 40px rgba(0,0,0,0.6);
  }

  .game-coordinate-treasure * {
    box-sizing: border-box;
  }

  /* 한 줄 정돈 컴팩트 헤더 */
  .game-coordinate-treasure .app-header {
    width: 100%;
    max-width: 1050px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #0f172a;
    padding: 16px 24px;
    border-radius: 20px;
    border: 2px solid #3b82f6;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 14px;
  }

  .game-coordinate-treasure .title-area {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .game-coordinate-treasure .app-title {
    font-size: clamp(1.4rem, 2.3vw, 2.0rem);
    font-weight: 900;
    margin: 0;
    color: #ffffff !important;
    text-shadow: 0 0 15px rgba(255, 255, 255, 0.7);
  }

  .game-coordinate-treasure .app-badge {
    background: #1e1b4b;
    color: #fef08a;
    font-size: 0.9rem;
    font-weight: 800;
    padding: 6px 12px;
    border-radius: 20px;
    border: 1px solid #f59e0b;
  }

  /* 상단 컨트롤 바 (한 줄 정렬 & 반응형 균등 배열) */
  .game-coordinate-treasure .stats-bar {
    display: flex;
    gap: 6px;
    font-weight: 800;
    font-size: 0.86rem;
    flex-wrap: wrap;
    align-items: center;
    justify-content: flex-end;
    flex: 1 1 auto;
  }

  .game-coordinate-treasure .stat-badge,
  .game-coordinate-treasure .btn-howto,
  .game-coordinate-treasure .btn-action {
    height: 36px;
    padding: 0 11px;
    border-radius: 12px;
    font-size: 0.86rem;
    font-weight: 900;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    white-space: nowrap;
    flex: 0 1 auto;
    transition: all 0.2s;
  }
  .game-coordinate-treasure .stat-badge.score { color: #fef08a; border-color: #f59e0b; background: #271c14; }
  .game-coordinate-treasure .stat-badge.round { color: #ffffff; border-color: #38bdf8; background: #0f172a; }
  .game-coordinate-treasure .stat-badge.attempts { color: #86efac; border-color: #22c55e; background: #0a2316; }
  .game-coordinate-treasure .stat-badge.timer { color: #fca5a5; border-color: #ef4444; background: #451a1a; }

  .game-coordinate-treasure .btn-howto {
    background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
    color: #ffffff !important;
    border: 2px solid #93c5fd;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(59, 130, 246, 0.4);
  }
  .game-coordinate-treasure .btn-howto:hover {
    transform: translateY(-2px);
    background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  }

  .game-coordinate-treasure .btn-action {
    background: #1e293b;
    color: #ffffff !important;
    border: 2px solid #60a5fa;
    cursor: pointer;
  }
  .game-coordinate-treasure .btn-action:hover {
    background: #334155;
    border-color: #93c5fd;
    transform: translateY(-2px);
  }

  .game-coordinate-treasure .btn-action.home {
    background: rgba(244, 63, 94, 0.18);
    color: #fda4af !important;
    border-color: rgba(244, 63, 94, 0.45);
  }
  .game-coordinate-treasure .btn-action.home:hover {
    background: rgba(244, 63, 94, 0.35);
    color: #ffffff !important;
  }

  .game-coordinate-treasure .btn-action.reset {
    background: #0ea5e9;
    border-color: #38bdf8;
  }
  .game-coordinate-treasure .btn-action.reset:hover {
    background: #0284c7;
  }

  /* 반응형 화면 폭 축소 시 모든 버튼 가로 폭 균등 배열 및 자동 줄바꿈 최적화 */
  @media (max-width: 960px) {
    .game-coordinate-treasure .app-header {
      flex-direction: column;
      align-items: stretch;
      gap: 14px;
      padding: 16px;
    }
    .game-coordinate-treasure .title-area {
      justify-content: center;
    }
    .game-coordinate-treasure .stats-bar {
      justify-content: center;
      gap: 8px;
    }
    .game-coordinate-treasure .stat-badge,
    .game-coordinate-treasure .btn-howto,
    .game-coordinate-treasure .btn-action {
      flex: 1 1 118px;
      height: 38px;
    }
  }

  .game-coordinate-treasure .main-container {
    width: 100%;
    max-width: 1050px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .game-coordinate-treasure .diff-bar {
    display: flex;
    justify-content: center;
    gap: 10px;
    background: #090d16;
    padding: 8px;
    border-radius: 16px;
    border: 2px solid #3b82f6;
    flex-wrap: wrap;
  }

  .game-coordinate-treasure .diff-btn {
    flex: 1;
    min-width: 150px;
    padding: 11px 14px;
    border-radius: 12px;
    background: transparent;
    color: #cbd5e1;
    border: none;
    font-weight: 900;
    font-size: 0.95rem;
    cursor: pointer;
    transition: all 0.2s;
  }

  .game-coordinate-treasure .diff-btn.active {
    background: #3b82f6;
    color: #ffffff !important;
    box-shadow: 0 4px 10px rgba(0,0,0,0.5);
  }

  .game-coordinate-treasure .hint-banner {
    background: radial-gradient(circle at center, #1e1b4b 0%, #0f172a 80%);
    border: 3px solid #3b82f6;
    border-radius: 20px;
    padding: 18px 24px;
    text-align: center;
    box-shadow: 0 10px 25px rgba(0,0,0,0.7);
  }

  .game-coordinate-treasure .hint-title {
    font-size: 14px;
    color: #93c5fd;
    font-weight: 800;
    margin: 0 0 6px 0;
  }

  .game-coordinate-treasure .hint-content {
    font-size: 22px;
    font-weight: 900;
    color: #fef08a;
    margin: 0;
    line-height: 1.4;
  }

  .game-coordinate-treasure .workspace {
    display: grid;
    grid-template-columns: 1.35fr 1fr;
    gap: 20px;
  }

  @media (max-width: 860px) {
    .game-coordinate-treasure .workspace {
      grid-template-columns: 1fr;
    }
  }

  .game-coordinate-treasure .map-card {
    background: #1e293b;
    border: 2px solid #3b82f6;
    border-radius: 20px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
  }

  .game-coordinate-treasure .map-title {
    font-size: 16px;
    font-weight: 800;
    color: #ffffff;
    margin: 0 0 14px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
  }

  .game-coordinate-treasure .map-svg-wrap {
    width: 100%;
    aspect-ratio: 1 / 1;
    max-height: 480px;
    background: #0a0f1d;
    border: 2px solid #475569;
    border-radius: 14px;
    position: relative;
    overflow: hidden;
  }

  .game-coordinate-treasure svg {
    width: 100%;
    height: 100%;
    cursor: crosshair;
  }

  .game-coordinate-treasure .grid-point {
    fill: transparent;
    cursor: pointer;
    transition: fill 0.15s, r 0.15s;
  }
  .game-coordinate-treasure .grid-point:hover {
    fill: rgba(56, 189, 248, 0.75);
    r: 10px;
  }

  .game-coordinate-treasure .panel-card {
    background: #1e293b;
    border: 2px solid #3b82f6;
    border-radius: 20px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .game-coordinate-treasure .input-section {
    background: #0f172a;
    border: 2px solid #475569;
    border-radius: 16px;
    padding: 16px;
  }

  .game-coordinate-treasure .input-title {
    font-size: 15px;
    font-weight: 800;
    color: #38bdf8;
    margin: 0 0 12px 0;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .game-coordinate-treasure .coord-row {
    display: flex;
    align-items: center;
    gap: 10px;
    justify-content: center;
    margin-bottom: 14px;
  }

  .game-coordinate-treasure .coord-box {
    display: flex;
    align-items: center;
    background: #1e293b;
    border: 2px solid #3b82f6;
    border-radius: 12px;
    padding: 4px 12px;
  }

  .game-coordinate-treasure .coord-label {
    font-size: 18px;
    font-weight: 900;
    color: #93c5fd;
    margin-right: 6px;
  }

  .game-coordinate-treasure input[type="number"] {
    width: 60px;
    padding: 8px 4px;
    font-size: 18px;
    font-weight: 900;
    background: transparent;
    border: none;
    color: #fef08a;
    text-align: center;
    outline: none;
  }

  .game-coordinate-treasure .btn-dig {
    width: 100%;
    background: linear-gradient(135deg, #16a34a, #059669);
    border: 2px solid #86efac;
    color: white;
    font-weight: 900;
    padding: 13px;
    font-size: 17px;
    border-radius: 14px;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(22, 163, 74, 0.4);
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .game-coordinate-treasure .btn-dig:hover {
    transform: translateY(-2px);
    background: linear-gradient(135deg, #15803d, #047857);
  }

  .game-coordinate-treasure .log-section {
    background: #0f172a;
    border: 2px solid #475569;
    border-radius: 16px;
    padding: 14px;
    flex-grow: 1;
    display: flex;
    flex-direction: column;
    min-height: 200px;
    max-height: 240px;
  }

  .game-coordinate-treasure .log-title {
    font-size: 14px;
    font-weight: 800;
    color: #fef08a;
    margin: 0 0 10px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .game-coordinate-treasure .log-list {
    flex-grow: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding-right: 4px;
  }

  .game-coordinate-treasure .log-item {
    background: #1e293b;
    border-left: 4px solid #3b82f6;
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 13.5px;
    line-height: 1.4;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .game-coordinate-treasure .log-item.miss { border-color: #f59e0b; }
  .game-coordinate-treasure .log-item.success { border-color: #22c55e; background: #0a2316; }

  /* 모달 공통 스타일 */
  .game-coordinate-treasure .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.88);
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }

  .game-coordinate-treasure .modal-overlay.active {
    opacity: 1;

  }

  .game-coordinate-treasure .modal-card {
    background: #0f172a;

    max-width: 540px;
    box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8);

    transition: transform 0.3s ease;

  }

  .game-coordinate-treasure .modal-overlay.active .modal-card {
    transform: scale(1);
  }

  .game-coordinate-treasure .modal-title {
    font-size: 24px;
    font-weight: 900;
    margin: 0 0 16px 0;

  }

  .game-coordinate-treasure .modal-desc {

  .game-coordinate-treasure .hall-table {
    width: 100%;
    border-collapse: collapse;

  }

  .game-coordinate-treasure .hall-table th,
  .game-coordinate-treasure .hall-table td {
    padding: 12px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    text-align: center;
  }

  .game-coordinate-treasure .hall-table th {
    color: #38bdf8;
    font-weight: 900;
  }
</style>

<script>
(function() {
  const BOARD_KEY = 'board-coordinate-treasure';
  const GAME_NAME = '좌표평면 보물찾기';

  let toastTimer = null;
  const escapeHTML = (str) => {
    if (!str) return '';
    return String(str).replace(/[&<>"']/g, function(match) {
      const escape = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
      return escape[match];
    });
  };

  function showToast(msg, isError = false) {
    let host = document.getElementById('coordinate-treasure-root');
    if (!host) return;
    let toast = host.querySelector('#ct-toast');
    if (!toast) {
      toast = document.createElement('div');
      toast.id = 'ct-toast';
      toast.style.cssText = 'position:fixed; top:20px; left:50%; transform:translateX(-50%); padding:12px 24px; border-radius:12px; font-weight:800; font-size:1rem; z-index:99999; box-shadow:0 10px 25px rgba(0,0,0,0.5); transition:all 0.3s; text-align:center; min-width:300px; pointer-events:none; opacity:0;';
      host.appendChild(toast);
    }
    toast.style.background = isError ? '#ef4444' : '#10b981';
    toast.style.color = isError ? '#ffffff' : '#0f172a';
    toast.textContent = msg;
    void toast.offsetWidth;
    toast.style.opacity = '1';
    toast.style.top = '20px';
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      toast.style.opacity = '0';
      toast.style.top = '0px';
    }, 3000);
  }

  const state = {
    difficulty: 'easy',
    round: 1,
    maxRound: 5,
    score: 0,
    attemptsLeft: 8,
    timer: 90,
    timerId: null,
    treasure: { x: 3, y: 4 },
    history: [],
    gridRange: { minX: 0, maxX: 10, minY: 0, maxY: 10 },
    roundCleared: false
  };

  // 명예의 전당 로드
  function loadLeaderboard() {
    const tbody = document.getElementById('ct-hall-tbody');
    if (!tbody) return;
    tbody.innerHTML = '<tr><td colspan="4" style="padding:20px; color:#94a3b8;">랭킹 정보를 불러오는 중...</td></tr>';

    const renderRanks = (list) => {
      if (!tbody) return;
      tbody.innerHTML = '';
      if (!list || list.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" style="padding:20px; color:#64748b;">아직 명예의 전당 기록이 없습니다. 첫 번째 주인공이 되어보세요!</td></tr>';
        return;
      }
      list.slice(0, 10).forEach((item, idx) => {
        const badge = idx === 0 ? '🥇 1위' : (idx === 1 ? '🥈 2위' : (idx === 2 ? '🥉 3위' : `${idx+1}위`));
        const nick = escapeHTML(item.nickname || item.name || '수학탐험대');
        const sc = item.score || 0;
        let dt = escapeHTML(item.difficulty || item.date || '기록');
        try { if (item.date) dt = new Date(item.date).toLocaleDateString('ko-KR', {month:'short', day:'numeric'}); } catch(e){}
        tbody.innerHTML += `
          <tr style="border-bottom:1px solid rgba(255,255,255,0.08);">
            <td style="padding:12px; font-weight:bold; color:#fbbf24;">${badge}</td>
            <td style="padding:12px; font-weight:800; color:#ffffff;">${nick}</td>
            <td style="padding:12px; font-weight:900; color:#38bdf8;">${sc}점</td>
            <td style="padding:12px; color:#94a3b8; font-size:12px;">${dt}</td>
          </tr>
        `;
      });
    };

    if (typeof window.getRankingList === 'function') {
      try { window.getRankingList(GAME_NAME, BOARD_KEY, renderRanks); return; } catch(e){}
    } else if (typeof google !== 'undefined' && google.script && google.script.run && typeof google.script.run.getGameScores === 'function') {
      try {
        const sheetId = (typeof getLeaderboardSheetId === 'function') ? getLeaderboardSheetId() : '';
        google.script.run.withSuccessHandler(renderRanks).withFailureHandler(() => {
          renderRanks(JSON.parse(localStorage.getItem(`rank_${BOARD_KEY}`) || '[]'));
        }).getGameScores(sheetId, GAME_NAME);
        return;
      } catch(e){}
    }
    renderRanks(JSON.parse(localStorage.getItem(`rank_${BOARD_KEY}`) || '[]'));
  }

  // 사용자 직접 입력 명예의 전당 등록 모달
  function showInlineRankingModal(score, diffName) {
    document.getElementById('mathlab-inline-ranking-modal')?.remove();
    const modalHtml = `
      <div id="mathlab-inline-ranking-modal" style="position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(15,23,42,0.88); backdrop-filter:blur(8px); display:flex; align-items:center; justify-content:center; z-index:999999; padding:20px; box-sizing:border-box; font-family:'Pretendard',sans-serif;">
        <div style="background:#0f172a; border-radius:26px; padding:30px 26px; max-width:420px; width:100%; box-shadow:0 20px 40px rgba(0,0,0,0.8); text-align:center; border:4px solid #3b82f6; color:#ffffff;">
          <div style="font-size:46px; margin-bottom:10px;">🏆</div>
          <h2 style="margin:0 0 8px; font-size:26px; font-weight:900; color:#ffffff !important;">명예의 전당 등록</h2>
          <p style="margin:0 0 20px; font-size:15px; color:#fef08a !important; font-weight:800;">5라운드 탐험 완료! 최고 점수를 달성했습니다.<br>당신의 이름을 남겨주세요!</p>
          <div style="background:#1e1b4b; border:2px solid #3b82f6; border-radius:18px; padding:16px; margin-bottom:20px;">
            <div style="font-size:14px; color:#e0e7ff; font-weight:800; margin-bottom:4px;">최종 탐험 점수</div>
            <div style="font-size:36px; font-weight:900; color:#fbbf24;">${score} <span style="font-size:20px;">점</span></div>
          </div>
          <input type="text" id="inline-rank-nickname" placeholder="닉네임 입력 (예: 보물탐험대)" maxlength="10" style="width:100%; padding:14px 16px; font-size:16px; font-weight:800; border:2px solid #60a5fa; background:#1e293b; color:#ffffff; border-radius:14px; outline:none; text-align:center; margin-bottom:20px; box-sizing:border-box;">
          <div style="display:flex; gap:10px;">
            <button id="inline-rank-cancel" style="flex:1; padding:14px; border-radius:14px; font-size:15px; font-weight:800; background:#1e293b; color:#ffffff; border:1px solid #60a5fa; cursor:pointer;">건너뛰기</button>
            <button id="inline-rank-submit" style="flex:2; padding:14px; border-radius:14px; font-size:15px; font-weight:900; background:linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); color:#ffffff !important; border:none; cursor:pointer; box-shadow:0 4px 10px rgba(59,130,246,0.5);">🚀 등록하기</button>
          </div>
        </div>
      </div>
    `;
    document.body.insertAdjacentHTML('beforeend', modalHtml);
    const inputEl = document.getElementById('inline-rank-nickname');
    if (inputEl) inputEl.focus();

    const closeAndOpenHall = () => {
      document.getElementById('mathlab-inline-ranking-modal')?.remove();
      loadLeaderboard();
      document.getElementById('ct-hall-modal')?.classList.add('active');
    };

    document.getElementById('inline-rank-cancel')?.addEventListener('click', closeAndOpenHall);

    const doSubmit = () => {
      let nickname = inputEl?.value.trim() || '보물탐험대';
      if (typeof window.submitRanking === 'function') {
        try { window.submitRanking(GAME_NAME, score, true, nickname, BOARD_KEY); } catch(e){}
      } else if (typeof google !== 'undefined' && google.script && google.script.run && typeof google.script.run.saveGameScore === 'function') {
        try {
          const sheetId = (typeof getLeaderboardSheetId === 'function') ? getLeaderboardSheetId() : '';
          const meta = (typeof getLeaderboardMeta === 'function') ? getLeaderboardMeta() : {};
          google.script.run.withSuccessHandler(closeAndOpenHall).saveGameScore(sheetId, GAME_NAME, nickname, score, true, meta);
        } catch(e){}
      }

      let ranks = JSON.parse(localStorage.getItem(`rank_${BOARD_KEY}`) || '[]');
      ranks.push({ nickname: nickname, score: score, difficulty: diffName, date: new Date().toISOString() });
      ranks.sort((a, b) => (b.score || 0) - (a.score || 0));
      localStorage.setItem(`rank_${BOARD_KEY}`, JSON.stringify(ranks.slice(0, 50)));
      closeAndOpenHall();
    };

    document.getElementById('inline-rank-submit')?.addEventListener('click', doSubmit);
    inputEl?.addEventListener('keydown', (e) => { if (e.key === 'Enter') doSubmit(); });
  }

  // 게임 코어 모듈
  const CoordinateTreasure = {
    container: null,

    mount(container, context = {}) {
      // 1. 컨테이너 타겟팅
      let target = container;
      if (typeof target === 'string') target = document.querySelector(target);
      if (!target || !(target instanceof HTMLElement)) {
        target = window.MathLabUtils?.getMountContainer ? window.MathLabUtils.getMountContainer(container) : document.getElementById('mathlab-view');
      }
      if (!target) target = document.getElementById('new-root') || document.getElementById('game-container');
      if (!target) {
        let created = document.getElementById('coordinate-treasure-force-host');
        if (!created) {
          created = document.createElement('div');
          created.id = 'coordinate-treasure-force-host';
          document.body.appendChild(created);
        }
        target = created;
      }
      this.container = target;

      // 🌟 [DOM 레이아웃 자동 방어] 마운트 컨테이너가 푸터보다 아래에 있다면 푸터 위로 즉시 재배치
      const footerEl = document.querySelector('footer, #footer, .app-footer') || 
                       Array.from(document.querySelectorAll('div, p, span')).find(el => el.textContent && el.textContent.includes('2026 기록조율사'));
      if (footerEl && target.compareDocumentPosition(footerEl) & Node.DOCUMENT_POSITION_PRECEDING) {
        footerEl.parentNode.insertBefore(target, footerEl);
      }

      target.style.display = '';
      target.style.visibility = 'visible';
      target.style.opacity = '1';

      let parent = target.parentElement;
      while (parent && parent !== document.body && parent !== document.documentElement) {
        if (parent.style && parent.style.display === 'none') parent.style.display = 'block';
        if (parent.style && parent.style.visibility === 'hidden') parent.style.visibility = 'visible';
        parent = parent.parentElement;
      }

      // 상단 로고 및 플로팅 홈 버튼 부활
      document.querySelectorAll('header, .navbar, #app-header, .top-bar, #floating-home-btn, .floating-home').forEach(el => {
        if (el && el.style && el.style.display === 'none') el.style.display = '';
      });

      // 2. 동적 UI 마운트 (Gen-3 홈 버튼 및 새 게임 버튼 헤더 통합 + 균등 정돈 컨트롤 바)
      target.innerHTML = `
        <div class="game-coordinate-treasure" id="coordinate-treasure-root">
          <header class="app-header">
            <div class="title-area">

            <div class="stats-bar">

              <div class="stat-badge round">🚩 라운드: <span id="ct-round">1 / 5</span></div>
              <div class="stat-badge attempts">⛏️ 남은 시도: <span id="ct-attempts">8회</span></div>
              <div class="stat-badge score">⭐ 점수: <span id="ct-score">0</span>점</div>
              <div class="stat-badge timer" id="ct-timer-box" style="display: none;">⏱️ 시간: <span id="ct-timer">90s</span></div>
            </div>
          </header>

          <main class="main-container">
            <div class="diff-bar">
              <button class="diff-btn active" data-diff="easy">🟢 쉬움 (제1사분면·격자거리)</button>
              <button class="diff-btn" data-diff="normal">🟡 보통 (4사분면·사분면힌트)</button>
              <button class="diff-btn" data-diff="hard">🔴 도전 (직선거리·대칭점힌트)</button>
            </div>

            <div class="hint-banner">
              <p class="hint-title">💡 보물 탐지 레이더 힌트</p>
              <p class="hint-content" id="ct-main-hint">좌표평면 어딘가에 전설의 보물이 숨겨졌습니다! 좌표 (x, y)를 입력하여 첫 발굴을 시작하세요!</p>
            </div>

            <div class="workspace">
              <div class="map-card">
                <div class="map-title">
                  <span>📍 데카르트 좌표평면 지도</span>
                  <span style="font-size: 13px; color: #38bdf8;" id="ct-map-status">클릭 또는 우측 입력창으로 발굴</span>
                </div>
                <div class="map-svg-wrap">
                  <svg id="ct-map-svg" viewBox="-260 -260 520 520"></svg>
                </div>
              </div>

              <div class="panel-card">
                <div class="input-section">
                  <h3 class="input-title">🎯 발굴 좌표 (x, y) 순서쌍 입력</h3>
                  <div class="coord-row">
                    <span style="font-size: 22px; font-weight: 900; color: #cbd5e1;">(</span>
                    <div class="coord-box">
                      <span class="coord-label">X:</span>
                      <input type="number" id="ct-input-x" value="0">
                    </div>
                    <span style="font-size: 22px; font-weight: 900; color: #cbd5e1;">,</span>
                    <div class="coord-box">
                      <span class="coord-label">Y:</span>
                      <input type="number" id="ct-input-y" value="0">
                    </div>
                    <span style="font-size: 22px; font-weight: 900; color: #cbd5e1;">)</span>
                  </div>
                  <button class="btn-dig" id="ct-btn-dig">🚀 이 좌표로 보물 발굴하기</button>
                </div>

                <div class="log-section">
                  <div class="log-title">
                    <span>📜 탐지 이력 및 힌트 기록</span>

                  <div class="log-list" id="ct-log-list">
                    <div style="color:#64748b; font-size:13px; text-align:center; margin-top:20px;">
                      발굴 시도 내역과 힌트가 여기에 기록됩니다.
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </main>

          <div class="modal-overlay" id="ct-howto-modal">
            <div class="modal-card">
              <h2 class="modal-title">🗺️ 좌표평면 보물찾기 방법</h2>
              <div class="modal-desc">
                <p><strong>📍 순서쌍 (x, y)와 데카르트 좌표계</strong><br>
                가로축(x축)과 세로축(y축)이 수직으로 만나는 평면에서 점의 위치는 순서쌍 <strong>(x, y)</strong>로 나타냅니다.</p>
                <ul style="padding-left: 20px; margin: 10px 0;">
                  <li><strong>사분면 규칙:</strong> 제1사분면(+, +), 제2사분면(-, +), 제3사분면(-, -), 제4사분면(+, -)</li>
                  <li><strong>격자 거리 (택시 거리):</strong> 가로 이동 칸 수 + 세로 이동 칸 수 ($|x_1-x_2| + |y_1-y_2|$)</li>
                  <li><strong>직선 거리 (도전 모드):</strong> 두 점 사이의 최단 직선 피타고라스 정수 거리</li>
                </ul>
                <p><strong>💡 플레이 팁:</strong><br>
                발굴이 빗나가면 보물까지의 정확한 거리 힌트가 제공됩니다. 힌트 정보를 종합하여 남은 시도 안에 보물의 정확한 좌표를 찾아내세요!</p>
              </div>
              <button class="btn-action" id="ct-howto-close" style="width:100%; justify-content:center; background:#3b82f6;">확인하고 게임 시작하기</button>
            </div>
          </div>

          <div class="modal-overlay" id="ct-hall-modal">
            <div class="modal-card">
              <h2 class="modal-title">🏆 명예의 전당 (Top 10)</h2>
              <table class="hall-table">
                <thead>
                  <tr>
                    <th>순위</th>
                    <th>닉네임</th>
                    <th>점수</th>
                    <th>난이도/날짜</th>
                  </tr>
                </thead>
                <tbody id="ct-hall-tbody"></tbody>
              </table>
              <button class="btn-action" id="ct-hall-close" style="width:100%; justify-content:center; background:#3b82f6;">닫기</button>
            </div>
          </div>
        </div>
      `;

      this.bindEvents();
      this.startNewGame();
    },

    bindEvents() {
      // 난이도 선택
      document.querySelectorAll('.game-coordinate-treasure .diff-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          document.querySelectorAll('.game-coordinate-treasure .diff-btn').forEach(b => b.classList.remove('active'));
          e.target.classList.add('active');
          state.difficulty = e.target.getAttribute('data-diff');
          this.startNewGame();
        });
      });

      // 발굴 시도 버튼
      document.getElementById('ct-btn-dig')?.addEventListener('click', () => {
        const x = parseInt(document.getElementById('ct-input-x')?.value || 0, 10);
        const y = parseInt(document.getElementById('ct-input-y')?.value || 0, 10);
        this.digCoordinate(x, y);
      });

      // 모달 조작
      document.getElementById('ct-btn-howto')?.addEventListener('click', () => {
        document.getElementById('ct-howto-modal')?.classList.add('active');
      });
      document.getElementById('ct-howto-close')?.addEventListener('click', () => {
        document.getElementById('ct-howto-modal')?.classList.remove('active');
      });
      document.getElementById('ct-btn-hall')?.addEventListener('click', () => {
        loadLeaderboard();
        document.getElementById('ct-hall-modal')?.classList.add('active');
      });
      document.getElementById('ct-hall-close')?.addEventListener('click', () => {
        document.getElementById('ct-hall-modal')?.classList.remove('active');
      });
    },

    startNewGame() {
      state.round = 1;
      state.score = 0;
      this.setupRound();
    },

    setupRound() {
      state.history = [];
      state.roundCleared = false;
      if (state.timerId) clearInterval(state.timerId);

      // 난이도별 범위 및 시도 횟수 설정
      if (state.difficulty === 'easy') {
        state.gridRange = { minX: 0, maxX: 10, minY: 0, maxY: 10 };
        state.attemptsLeft = 8;
        document.getElementById('ct-timer-box').style.display = 'none';
      } else if (state.difficulty === 'normal') {
        state.gridRange = { minX: -10, maxX: 10, minY: -10, maxY: 10 };
        state.attemptsLeft = 6;
        document.getElementById('ct-timer-box').style.display = 'none';
      } else {
        state.gridRange = { minX: -10, maxX: 10, minY: -10, maxY: 10 };
        state.attemptsLeft = 5;
        state.timer = 90;
        document.getElementById('ct-timer-box').style.display = 'inline-flex';
        document.getElementById('ct-timer').textContent = '90s';
        state.timerId = setInterval(() => {
          state.timer--;
          const timerEl = document.getElementById('ct-timer');
          if (timerEl) timerEl.textContent = state.timer + 's';
          if (state.timer <= 0) {
            clearInterval(state.timerId);
            showToast('⏱️ 제한 시간이 초과되었습니다! 다음 라운드로 이동합니다.', true);
            this.nextRound();
          }
        }, 1000);
      }

      // 보물 좌표 무작위 배치
      const rx = state.gridRange.maxX - state.gridRange.minX;
      const ry = state.gridRange.maxY - state.gridRange.minY;
      state.treasure = {
        x: Math.floor(Math.random() * (rx + 1)) + state.gridRange.minX,
        y: Math.floor(Math.random() * (ry + 1)) + state.gridRange.minY
      };

      if (state.treasure.x === 0 && state.treasure.y === 0) {
        state.treasure.x = Math.floor(Math.random() * 8) + 1;
        state.treasure.y = Math.floor(Math.random() * 8) + 1;
      }

      this.updateStatsUI();
      this.renderMap();
      this.updateLogUI();

      const mainHint = document.getElementById('ct-main-hint');
      if (mainHint) {
        if (state.difficulty === 'easy') {
          mainHint.innerHTML = `제1사분면 <strong>(0~10, 0~10)</strong> 어딘가에 보물이 숨어있습니다!`;
        } else if (state.difficulty === 'normal') {
          const quad = state.treasure.x > 0 && state.treasure.y > 0 ? '제1사분면' :
                       state.treasure.x < 0 && state.treasure.y > 0 ? '제2사분면' :
                       state.treasure.x < 0 && state.treasure.y < 0 ? '제3사분면' :
                       state.treasure.x > 0 && state.treasure.y < 0 ? '제4사분면' : '축 위';
          mainHint.innerHTML = `레이더 초기 단서: 보물은 <strong>[ ${quad} ]</strong> 방향 구역에 숨겨져 있습니다!`;
        } else {
          const symX = state.treasure.x;
          const symY = -state.treasure.y;
          mainHint.innerHTML = `고급 힌트: 보물의 위치를 <strong>x축 대칭이동</strong>한 점의 좌표는 <strong>(${symX}, ${symY})</strong>입니다!`;
        }
      }
    },

    updateStatsUI() {
      const roundEl = document.getElementById('ct-round');
      if (roundEl) roundEl.textContent = `${state.round} / ${state.maxRound}`;
      const attemptsEl = document.getElementById('ct-attempts');
      if (attemptsEl) attemptsEl.textContent = `${state.attemptsLeft}회`;
      const scoreEl = document.getElementById('ct-score');
      if (scoreEl) scoreEl.textContent = state.score;
    },

    renderMap() {
      const svg = document.getElementById('ct-map-svg');
      if (!svg) return;
      svg.innerHTML = '';

      const { minX, maxX, minY, maxY } = state.gridRange;
      const spanX = maxX - minX;
      const spanY = maxY - minY;
      const scale = 440 / Math.max(spanX, spanY);

      const coordToSvg = (x, y) => {
        return {
          sx: (x - minX) * scale - 220,
          sy: 220 - (y - minY) * scale
        };
      };

      for (let x = minX; x <= maxX; x++) {
        const { sx } = coordToSvg(x, 0);
        const isAxis = x === 0;
        svg.innerHTML += `<line x1="${sx}" y1="-230" x2="${sx}" y2="230" stroke="${isAxis ? '#38bdf8' : 'rgba(255,255,255,0.08)'}" stroke-width="${isAxis ? 3 : 1}" />`;
      }
      for (let y = minY; y <= maxY; y++) {
        const { sy } = coordToSvg(0, y);
        const isAxis = y === 0;
        svg.innerHTML += `<line x1="-230" y1="${sy}" x2="230" y2="${sy}" stroke="${isAxis ? '#38bdf8' : 'rgba(255,255,255,0.08)'}" stroke-width="${isAxis ? 3 : 1}" />`;
      }

      for (let x = minX; x <= maxX; x += (state.difficulty === 'easy' ? 1 : 2)) {
        if (x === 0) continue;
        const { sx, sy } = coordToSvg(x, 0);
        svg.innerHTML += `<text x="${sx}" y="${sy + 16}" fill="#94a3b8" font-size="11" font-weight="bold" text-anchor="middle">${x}</text>`;
      }
      for (let y = minY; y <= maxY; y += (state.difficulty === 'easy' ? 1 : 2)) {
        if (y === 0) continue;
        const { sx, sy } = coordToSvg(0, y);
        svg.innerHTML += `<text x="${sx + 16}" y="${sy + 4}" fill="#94a3b8" font-size="11" font-weight="bold" text-anchor="middle">${y}</text>`;
      }

      const zeroPt = coordToSvg(0, 0);
      svg.innerHTML += `<text x="${zeroPt.sx - 12}" y="${zeroPt.sy + 14}" fill="#38bdf8" font-size="13" font-weight="900">O</text>`;

      for (let x = minX; x <= maxX; x++) {
        for (let y = minY; y <= maxY; y++) {
          const pt = coordToSvg(x, y);
          svg.innerHTML += `
            <circle class="grid-point" cx="${pt.sx}" cy="${pt.sy}" r="7"
              onmouseover="CoordinateTreasure.hoverGridPoint(${x}, ${y})"
              onmouseout="CoordinateTreasure.unhoverGridPoint()"
              onclick="CoordinateTreasure.selectGridPoint(${x}, ${y})" />
          `;
        }
      }

      state.history.forEach((item, idx) => {
        const pt = coordToSvg(item.x, item.y);
        if (item.success) {
          svg.innerHTML += `
            <circle cx="${pt.sx}" cy="${pt.sy}" r="18" fill="rgba(34,197,94,0.3)" stroke="#22c55e" stroke-width="3" />
            <text x="${pt.sx}" y="${pt.sy + 6}" fill="#fef08a" font-size="20" font-weight="900" text-anchor="middle">👑</text>
          `;
        } else {
          svg.innerHTML += `
            <circle cx="${pt.sx}" cy="${pt.sy}" r="14" fill="rgba(245,158,11,0.25)" stroke="#f59e0b" stroke-width="2" />
            <text x="${pt.sx}" y="${pt.sy + 4}" fill="#fef08a" font-size="11" font-weight="900" text-anchor="middle">${item.dist}</text>
          `;
        }
      });
    },

    hoverGridPoint(x, y) {
      if (state.roundCleared) return;
      const statusEl = document.getElementById('ct-map-status');
      if (statusEl) statusEl.textContent = `⚡ 클릭하여 발굴 좌표 입력: (${x}, ${y})`;
    },

    unhoverGridPoint() {
      if (state.roundCleared) return;
      const statusEl = document.getElementById('ct-map-status');
      if (statusEl) statusEl.textContent = `클릭 또는 우측 입력창으로 발굴`;
    },

    selectGridPoint(x, y) {
      if (state.roundCleared) return;
      document.getElementById('ct-input-x').value = x;
      document.getElementById('ct-input-y').value = y;
      this.digCoordinate(x, y);
    },

    digCoordinate(x, y) {
      if (state.roundCleared) return;
      if (isNaN(x) || isNaN(y)) {
        showToast('⚠️ 올바른 x, y 숫자 좌표를 입력해 주세요.', true);
        return;
      }

      if (state.history.some(h => h.x === x && h.y === y)) {
        showToast(`⚠️ 이미 발굴한 좌표 (${x}, ${y}) 입니다. 다른 좌표를 찾아보세요!`, true);
        return;
      }

      state.attemptsLeft--;
      const dx = Math.abs(state.treasure.x - x);
      const dy = Math.abs(state.treasure.y - y);
      const gridDist = dx + dy;

      if (x === state.treasure.x && y === state.treasure.y) {
        state.roundCleared = true;
        state.history.unshift({ x, y, dist: 0, success: true });
        const earned = 20 + state.attemptsLeft * 5;
        state.score += earned;
        this.updateStatsUI();
        this.renderMap();
        this.updateLogUI();

        document.getElementById('ct-main-hint').innerHTML = `🎉 축하합니다! 정확한 좌표 <strong>(${x}, ${y})</strong>에서 보물을 발굴했습니다! (+${earned}점)`;

        setTimeout(() => {
          if (state.round >= state.maxRound) {
            const diffName = state.difficulty === 'easy' ? '🟢 쉬움' : (state.difficulty === 'normal' ? '🟡 보통' : '🔴 도전');
            showInlineRankingModal(state.score, diffName);
          } else {
            state.round++;
            this.setupRound();
          }
        }, 1200);
      } else {
        state.history.unshift({ x, y, dist: gridDist, success: false });
        this.updateStatsUI();
        this.renderMap();
        this.updateLogUI();

        document.getElementById('ct-main-hint').innerHTML = `⛏️ 발굴 실패! 좌표 <strong>(${x}, ${y})</strong>에서 보물까지 <strong>격자 거리 ${gridDist}칸</strong> 떨어져 있습니다!`;

        if (state.attemptsLeft <= 0) {
          state.roundCleared = true;
          showToast(`아쉽습니다! 보물의 진짜 위치는 (${state.treasure.x}, ${state.treasure.y}) 였습니다.`, true);
          if (state.round >= state.maxRound) {
            const diffName = state.difficulty === 'easy' ? '🟢 쉬움' : (state.difficulty === 'normal' ? '🟡 보통' : '🔴 도전');
            showInlineRankingModal(state.score, diffName);
          } else {
            state.round++;
            this.setupRound();
          }
        }
      }
    },

    nextRound() {
      if (state.round >= state.maxRound) {
        const diffName = state.difficulty === 'easy' ? '🟢 쉬움' : (state.difficulty === 'normal' ? '🟡 보통' : '🔴 도전');
        showInlineRankingModal(state.score, diffName);
      } else {
        state.round++;
        this.setupRound();
      }
    },

    updateLogUI() {
      const listEl = document.getElementById('ct-log-list');
      if (!listEl) return;
      listEl.innerHTML = '';

      if (state.history.length === 0) {
        listEl.innerHTML = `<div style="color:#64748b; font-size:13px; text-align:center; margin-top:20px;">발굴 시도 내역과 거리 힌트가 표시됩니다.</div>`;
        return;
      }

      state.history.forEach((h, i) => {
        const cls = h.success ? 'log-item success' : 'log-item miss';
        const icon = h.success ? '👑 발견 성공!' : `택시 거리: ${h.dist}칸`;
        listEl.innerHTML += `
          <div class="${cls}">
            <strong style="color:#ffffff;">#${state.history.length - i} 시도: (${h.x}, ${h.y})</strong>
            <span style="font-weight:800; color:${h.success ? '#86efac' : '#fef08a'}">${icon}</span>
          </div>
        `;
      });
    },

    resetGame() {
      this.startNewGame();
    },

    // 🌟 Gen-3 표준 홈 버튼 (`goHome`) 완결성 보장
    goHome() {
      this.destroy();

      if (window.LegacyBridge && typeof window.LegacyBridge.backHome === 'function') {
        try { window.LegacyBridge.backHome(); return; } catch(e) {}
      }
      if (typeof window.renderLegacyDashboardHome === 'function') {
        try { window.renderLegacyDashboardHome(); return; } catch(e) {}
      }
      if (typeof window.MathLabRenderHome === 'function') {
        try { window.MathLabRenderHome(); return; } catch(e) {}
      }

      const mathlabRoot = document.getElementById('mathlab-root');
      const legacyRoot = document.getElementById('legacy-root');
      if (mathlabRoot) mathlabRoot.classList.add('hidden');
      if (legacyRoot) legacyRoot.classList.remove('hidden');

      const dashboard = document.getElementById('dashboard-screen');
      if (dashboard) {
        dashboard.classList.add('active');
        dashboard.style.display = '';
      }
      window.scrollTo({ top: 0, left: 0, behavior: 'smooth' });
    },

    destroy() {
      if (state.timerId) clearInterval(state.timerId);
      if (this.container) this.container.innerHTML = '';
    }
  };

  window.CoordinateTreasure = CoordinateTreasure;

  // 🌟 Gen-3 스킬 표준 3중 자율 등록
  function registerCoordinateTreasure() {
    if (typeof window.MathLabGames !== 'undefined' && typeof window.MathLabGames.register === 'function') {
      if (!window.MathLabGames.get?.('coordinate-treasure')) {
        window.MathLabGames.register({
          id: 'coordinate-treasure',
          title: '좌표평면 보물찾기',
          icon: '🗺️',
          category: 'game',
          sourceType: 'new',
          mount(container, context) { CoordinateTreasure.mount(container, context); },
          reset() { CoordinateTreasure.resetGame(); },
          destroy() { CoordinateTreasure.destroy(); },
          goHome() { CoordinateTreasure.goHome(); }
        });
      }
    }
  }

  registerCoordinateTreasure();
  window.addEventListener('DOMContentLoaded', registerCoordinateTreasure);
  setTimeout(registerCoordinateTreasure, 100);
  setTimeout(registerCoordinateTreasure, 500);

  window.launchCoordinateTreasureGame = function() {
    if (typeof window.MathLabGames !== 'undefined' && typeof window.MathLabGames.mount === 'function') {
      try {
        window.MathLabGames.mount('coordinate-treasure');
        return;
      } catch(e) {}
    }
    CoordinateTreasure.mount();
  };
})();
</script>
