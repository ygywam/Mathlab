<style>
  .game-binary-tree-maze {
    position: relative;
    width: 100%;
    max-width: 1000px;
    margin: 0 auto;
    font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
    background: #f8fafc;
    color: #1e293b;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    display: flex;
    flex-direction: column;
    min-height: 750px;
    box-sizing: border-box;
    overflow: hidden;
  }
  .game-binary-tree-maze * { box-sizing: border-box; }

  /* Header */
  .game-binary-tree-maze .app-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 20px;
    background: #ffffff;
    border-bottom: 2px solid #e2e8f0;
  }
  .game-binary-tree-maze .app-title {
    font-size: 1.4rem;
    font-weight: 800;
    color: #10b981;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .game-binary-tree-maze .header-btns {
    display: flex;
    gap: 10px;
  }
  .game-binary-tree-maze .btn {
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    border: none;
    transition: all 0.2s;
    background: #e2e8f0;
    color: #1e293b;
    white-space: nowrap;
  }
  .game-binary-tree-maze .btn:hover { background: #cbd5e1; transform: translateY(-2px); }
  .game-binary-tree-maze .btn-primary { background: #10b981; color: #ffffff; }
  .game-binary-tree-maze .btn-primary:hover { background: #059669; }
  .game-binary-tree-maze .btn-home { background: #ef4444; color: #ffffff; }
  .game-binary-tree-maze .btn-home:hover { background: #dc2626; }

  /* Main Area */
  .game-binary-tree-maze .main-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 20px;
    gap: 15px;
    overflow-y: auto;
  }

  /* Status Bar */
  .game-binary-tree-maze .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #ffffff;
    padding: 15px 20px;
    border-radius: 12px;
    border: 1px solid #e2e8f0;
    box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    flex-wrap: wrap;
    gap: 10px;
  }
  .game-binary-tree-maze .stat-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 80px;
  }
  .game-binary-tree-maze .stat-label {
    font-size: 0.85rem;
    font-weight: 700;
    color: #64748b;
  }
  .game-binary-tree-maze .stat-value {
    font-size: 1.4rem;
    font-weight: 900;
    color: #0f172a;
  }
  .game-binary-tree-maze .stat-value.score { color: #3b82f6; font-size: 1.6rem; }
  .game-binary-tree-maze .stat-value.green { color: #10b981; }
  .game-binary-tree-maze .stat-value.red { color: #ef4444; }

  /* Controls */
  .game-binary-tree-maze .controls-row {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }
  .game-binary-tree-maze .diff-indicator {
    padding: 8px 16px;
    border-radius: 8px;
    background: #f1f5f9;
    border: 1px solid #cbd5e1;
    color: #64748b;
    font-weight: 700;
    font-size: 0.9rem;
  }
  .game-binary-tree-maze .diff-indicator.active {
    background: #10b981;
    border-color: #059669;
    color: #ffffff;
  }

  /* SVG Container */
  .game-binary-tree-maze .svg-container {
    flex: 1;
    background: #ffffff;
    border-radius: 12px;
    border: 1px solid #e2e8f0;
    overflow: auto;
    position: relative;
    min-height: 400px;
  }
  .game-binary-tree-maze svg {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* Node styling */
  .btm-node-circle {
    fill: #ffffff;
    stroke: #94a3b8;
    stroke-width: 3;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btm-node-circle.current {
    stroke: #3b82f6;
    stroke-width: 5;
    fill: #eff6ff;
  }
  .btm-node-circle.visited {
    stroke: #10b981;
    fill: #ecfdf5;
  }
  .btm-node-circle.optimal {
    stroke: #f59e0b;
    fill: #fef3c7;
    stroke-width: 4;
  }
  
  .btm-edge {
    stroke: #cbd5e1;
    stroke-width: 3;
    transition: all 0.2s;
  }
  .btm-edge.visited {
    stroke: #10b981;
    stroke-width: 4;
  }
  .btm-edge.optimal {
    stroke: #f59e0b;
    stroke-width: 4;
    stroke-dasharray: 6 6;
  }
  
  .btm-node-text {
    font-size: 14px;
    font-weight: bold;
    fill: #1e293b;
    pointer-events: none;
    text-anchor: middle;
    dominant-baseline: central;
  }
  .btm-icon-text {
    font-size: 18px;
    pointer-events: none;
    text-anchor: middle;
    dominant-baseline: central;
  }

  /* Move Controls */
  .game-binary-tree-maze .move-controls {
    display: flex;
    justify-content: center;
    gap: 15px;
    padding: 10px;
  }
  .game-binary-tree-maze .move-btn {
    padding: 12px 30px;
    border-radius: 12px;
    background: #3b82f6;
    color: white;
    font-size: 1.2rem;
    font-weight: 800;
    border: none;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(59, 130, 246, 0.3);
  }
  .game-binary-tree-maze .move-btn:disabled {
    background: #94a3b8;
    box-shadow: none;
    cursor: not-allowed;
  }
  .game-binary-tree-maze .move-btn:hover:not(:disabled) { background: #2563eb; }

  /* End Round Banner */
  .game-binary-tree-maze .end-round-banner {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #fef3c7;
    border: 2px solid #f59e0b;
    border-radius: 12px;
    padding: 15px;
    margin-top: 10px;
    text-align: center;
    box-shadow: 0 5px 15px rgba(245, 158, 11, 0.2);
  }
  .game-binary-tree-maze .end-round-banner.show {
    display: flex;
  }
  .game-binary-tree-maze .end-round-title {
    font-size: 1.2rem;
    font-weight: 800;
    color: #d97706;
    margin-bottom: 8px;
  }
  .game-binary-tree-maze .end-round-text {
    font-size: 1rem;
    color: #92400e;
    margin-bottom: 12px;
  }

  /* Bottom Ranking */
  .game-binary-tree-maze .bottom-ranking-card {
    background: #ffffff;
    border-top: 2px solid #e2e8f0;
    padding: 15px 20px;
  }
  .game-binary-tree-maze .ranking-title {
    font-size: 1.1rem;
    font-weight: 800;
    color: #f59e0b;
    margin-bottom: 10px;
  }
  
  /* Toasts & Modals */
  .btm-toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #ffffff;
    color: #1e293b;
    padding: 12px 24px;
    border-radius: 30px;
    font-weight: 700;
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    z-index: 9999;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s, top 0.3s;
    border: 1px solid #e2e8f0;
  }
  .btm-toast.show { opacity: 1; top: 40px; }
  .btm-toast.error { border-color: #fca5a5; color: #ef4444; background: #fef2f2; }
  .btm-toast.success { border-color: #6ee7b7; color: #10b981; background: #ecfdf5; }

  .btm-modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.5);
    backdrop-filter: blur(4px);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 10000;
  }
  .btm-modal {
    background: #ffffff;
    width: 90%;
    max-width: 500px;
    border-radius: 16px;
    padding: 30px;
    border: 1px solid #e2e8f0;
    box-shadow: 0 20px 50px rgba(0,0,0,0.1);
    text-align: center;
    color: #1e293b;
  }
  .btm-modal h3 { font-size: 1.5rem; margin-bottom: 15px; color: #10b981; }
  .btm-modal p { font-size: 1.05rem; line-height: 1.6; color: #475569; margin-bottom: 20px; text-align: left; }
  .btm-modal .close-btn {
    padding: 10px 20px;
    background: #10b981;
    color: #ffffff;
    border: none;
    border-radius: 8px;
    font-size: 1.1rem;
    font-weight: 700;
    cursor: pointer;
  }
</style>

<script>
const BinaryTreeMaze = (function() {
  let host = null;
  let score = 50; // Initial score
  
  let tree = null;
  let maxDepth = 3; 
  let difficulty = 'easy'; // easy, normal, hard
  
  let currentNodeId = 0;
  let currentCost = 0;
  let visitedNodes = [0];
  let hasKey = false;
  
  let optimalCost = Infinity;
  let optimalPath = [];
  
  let isGameOver = false; // per maze round
  let isFullGameOver = false; // game over for scoring

  function showToast(msg, type) {
    if (!type) type = 'normal';
    let toast = document.getElementById('btm-toast');
    if (!toast) {
      toast = document.createElement('div');
      toast.id = 'btm-toast';
      toast.className = 'btm-toast';
      document.body.appendChild(toast);
    }
    toast.className = 'btm-toast ' + type + ' show';
    toast.textContent = msg;
    setTimeout(function() { toast.classList.remove('show'); }, 3000);
  }

  function escapeHTML(str) {
    if (!str) return '';
    return str.replace(/[&<>'"]/g, function(tag) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag;
    });
  }

  function checkLevelUp() {
    if (score >= 200) {
      difficulty = 'hard';
      maxDepth = 5;
    } else if (score >= 100) {
      difficulty = 'normal';
      maxDepth = 4;
    } else {
      difficulty = 'easy';
      maxDepth = 3;
    }
  }

  function generateTree() {
    tree = {};
    checkLevelUp(); // Ensure depth matches current score level
    
    let nextId = 0;
    function buildNode(depth, id) {
      let node = {
        id: id,
        depth: depth,
        cost: Math.floor(Math.random() * 9) + 1,
        left: null,
        right: null,
        type: 'normal'
      };
      
      tree[id] = node;
      
      if (depth < maxDepth) {
        let hasLeft = true;
        let hasRight = true;
        if (difficulty === 'hard' && Math.random() < 0.1 && depth > 1) hasRight = false;
        
        if (hasLeft) {
          nextId++;
          node.left = nextId;
          buildNode(depth + 1, nextId);
        }
        if (hasRight) {
          nextId++;
          node.right = nextId;
          buildNode(depth + 1, nextId);
        }
      } else {
        node.type = 'exit';
      }
    }
    
    buildNode(0, 0);
    
    // Add special nodes
    let allIds = Object.keys(tree);
    if (difficulty === 'normal' || difficulty === 'hard') {
      let trapCount = difficulty === 'normal' ? 2 : 4;
      for(let i=0; i<trapCount; i++) {
        let r = Math.floor(Math.random() * allIds.length);
        if (tree[r].depth > 0 && tree[r].depth < maxDepth && tree[r].type === 'normal') {
          tree[r].type = 'trap';
          tree[r].cost = 20;
        }
      }
      
      if (difficulty === 'hard') {
        let internalNodes = allIds.filter(function(id) { return tree[id].depth > 0 && tree[id].depth < maxDepth && tree[id].type === 'normal'; });
        if (internalNodes.length > 0) {
          let keyNode = internalNodes[Math.floor(Math.random() * internalNodes.length)];
          tree[keyNode].type = 'key';
        }
        
        let exits = allIds.filter(function(id) { return tree[id].type === 'exit'; });
        if (exits.length > 1) {
          for(let i=0; i<exits.length/2; i++) {
            tree[exits[i]].type = 'locked_exit';
          }
        }
      }
    }
    
    calculateOptimal();
  }

  function calculateOptimal() {
    optimalCost = Infinity;
    optimalPath = [];
    
    function dfs(id, currentCostSum, path, haveKey) {
      let node = tree[id];
      let newCost = currentCostSum + node.cost;
      let newPath = path.concat([id]);
      let newKey = haveKey || node.type === 'key';
      
      if (node.type === 'exit' || (node.type === 'locked_exit' && newKey)) {
        if (newCost < optimalCost) {
          optimalCost = newCost;
          optimalPath = newPath;
        }
      }
      
      if (node.left !== null) dfs(node.left, newCost, newPath, newKey);
      if (node.right !== null) dfs(node.right, newCost, newPath, newKey);
    }
    
    dfs(0, 0, [], false);
  }

  function renderTree() {
    const svgEl = host.querySelector('#btm-svg');
    if (!svgEl) return;
    
    let svgWidth = Math.max(800, Math.pow(2, maxDepth) * 60);
    let svgHeight = (maxDepth + 1) * 100 + 40;
    
    function assignCoords(id, x, y, xOffset) {
      tree[id].x = x;
      tree[id].y = y;
      if (tree[id].left !== null) assignCoords(tree[id].left, x - xOffset, y + 100, xOffset / 2);
      if (tree[id].right !== null) assignCoords(tree[id].right, x + xOffset, y + 100, xOffset / 2);
    }
    
    assignCoords(0, svgWidth / 2, 40, svgWidth / 4);
    
    let svgContent = '';
    
    for (let id in tree) {
      let node = tree[id];
      if (node.left !== null) {
        let child = tree[node.left];
        let edgeClass = 'btm-edge';
        if (isGameOver && optimalPath.indexOf(parseInt(id)) !== -1 && optimalPath.indexOf(child.id) !== -1) {
          edgeClass += ' optimal';
        } else if (visitedNodes.indexOf(parseInt(id)) !== -1 && visitedNodes.indexOf(child.id) !== -1) {
          edgeClass += ' visited';
        }
        svgContent += '<line class="' + edgeClass + '" x1="' + node.x + '" y1="' + node.y + '" x2="' + child.x + '" y2="' + child.y + '"></line>';
      }
      if (node.right !== null) {
        let child = tree[node.right];
        let edgeClass = 'btm-edge';
        if (isGameOver && optimalPath.indexOf(parseInt(id)) !== -1 && optimalPath.indexOf(child.id) !== -1) {
          edgeClass += ' optimal';
        } else if (visitedNodes.indexOf(parseInt(id)) !== -1 && visitedNodes.indexOf(child.id) !== -1) {
          edgeClass += ' visited';
        }
        svgContent += '<line class="' + edgeClass + '" x1="' + node.x + '" y1="' + node.y + '" x2="' + child.x + '" y2="' + child.y + '"></line>';
      }
    }
    
    for (let id in tree) {
      let node = tree[id];
      let circleClass = 'btm-node-circle';
      if (parseInt(id) === currentNodeId) circleClass += ' current';
      else if (isGameOver && optimalPath.indexOf(parseInt(id)) !== -1) circleClass += ' optimal';
      else if (visitedNodes.indexOf(parseInt(id)) !== -1) circleClass += ' visited';
      
      svgContent += '<circle class="' + circleClass + '" cx="' + node.x + '" cy="' + node.y + '" r="22" onclick="window.BinaryTreeMazeModule.moveToNode(' + id + ')"></circle>';
      
      let icon = '';
      if (node.type === 'trap') icon = '👿';
      else if (node.type === 'key') icon = '🔑';
      else if (node.type === 'exit') icon = '🏁';
      else if (node.type === 'locked_exit') icon = '🔒';
      
      if (icon !== '') {
        svgContent += '<text class="btm-icon-text" x="' + node.x + '" y="' + (node.y - 30) + '">' + icon + '</text>';
      }
      
      svgContent += '<text class="btm-node-text" x="' + node.x + '" y="' + node.y + '">' + node.cost + '</text>';
    }
    
    svgEl.innerHTML = svgContent;
    
    // 뷰박스를 전체 트리 크기에 맞춰 고정하여 화면이 잘리지 않도록 수정
    svgEl.setAttribute('viewBox', '0 0 ' + svgWidth + ' ' + svgHeight);
  }

  function renderUI() {
    if (!host) return;
    
    host.querySelector('#btm-score').textContent = score;
    host.querySelector('#btm-cost').textContent = currentCost;
    
    let keyStatus = hasKey ? '🔑 획득' : '없음';
    host.querySelector('#btm-key').textContent = keyStatus;
    
    host.querySelectorAll('.diff-indicator').forEach(function(b) {
      b.classList.toggle('active', b.dataset.diff === difficulty);
    });
    
    let node = tree[currentNodeId];
    host.querySelector('#btn-left').disabled = (node.left === null || isGameOver || isFullGameOver);
    host.querySelector('#btn-right').disabled = (node.right === null || isGameOver || isFullGameOver);
    host.querySelector('#btn-undo').disabled = (visitedNodes.length <= 1 || isGameOver || isFullGameOver);
    
    const banner = host.querySelector('#end-round-banner');
    if (isGameOver && !isFullGameOver) {
      banner.classList.add('show');
    } else {
      banner.classList.remove('show');
    }
  }

  function nextMaze() {
    if (isFullGameOver) return;
    isGameOver = false;
    checkLevelUp();
    generateTree();
    currentNodeId = 0;
    currentCost = tree[0].cost;
    visitedNodes = [0];
    hasKey = tree[0].type === 'key';
    
    renderUI();
    renderTree();
  }

  function fullResetGame() {
    score = 50;
    isFullGameOver = false;
    nextMaze();
  }

  function moveToNode(id) {
    if (isGameOver || isFullGameOver) return;
    let node = tree[id];
    let curr = tree[currentNodeId];
    
    if (curr.left == id || curr.right == id) {
      currentNodeId = id;
      visitedNodes.push(id);
      currentCost += node.cost;
      
      if (node.type === 'trap') {
        showToast('함정을 밟았습니다! 비용이 크게 증가합니다.', 'error');
      } else if (node.type === 'key') {
        hasKey = true;
        showToast('열쇠를 획득했습니다! 잠긴 출구로 나갈 수 있습니다.', 'success');
      }
      
      checkExit();
      renderUI();
      renderTree();
    }
  }
  
  function moveLeft() {
    if (tree[currentNodeId].left !== null) moveToNode(tree[currentNodeId].left);
  }
  function moveRight() {
    if (tree[currentNodeId].right !== null) moveToNode(tree[currentNodeId].right);
  }
  function undoMove() {
    if (visitedNodes.length > 1 && !isGameOver && !isFullGameOver) {
      let popped = visitedNodes.pop();
      currentCost -= tree[popped].cost;
      currentNodeId = visitedNodes[visitedNodes.length - 1];
      
      currentCost += 5; // Penalty
      showToast('되돌리기: 경로 비용 +5 페널티', 'error');
      
      hasKey = false;
      for(let i=0; i<visitedNodes.length; i++) {
        if (tree[visitedNodes[i]].type === 'key') hasKey = true;
      }
      
      renderUI();
      renderTree();
    }
  }

  function checkExit() {
    let node = tree[currentNodeId];
    if (node.type === 'exit') {
      roundOver();
    } else if (node.type === 'locked_exit') {
      if (hasKey) {
        showToast('잠긴 출구를 열고 탈출했습니다!', 'success');
        roundOver();
      } else {
        showToast('출구가 잠겨 있습니다. 열쇠가 필요하거나 다른 곳을 가야합니다.', 'error');
      }
    }
  }

  function roundOver() {
    isGameOver = true;
    
    let diff = currentCost - optimalCost;
    let scoreChange = 0;
    
    let resultMsg = '';
    
    if (diff === 0) {
      scoreChange = 20;
      resultMsg = '최적 비용 달성! 점수 +20 획득';
    } else if (diff > 0) {
      scoreChange = -diff;
      resultMsg = '최적 비용 실패. 차이만큼 점수 차감: ' + scoreChange;
    }
    
    score += scoreChange;
    
    const titleEl = host.querySelector('#banner-title');
    const textEl = host.querySelector('#banner-text');
    
    if (scoreChange >= 0) {
      titleEl.textContent = '🎉 완벽한 탈출 경로입니다!';
      titleEl.style.color = '#059669';
    } else {
      titleEl.textContent = '⚠️ 아슬아슬하게 탈출했습니다.';
      titleEl.style.color = '#b45309';
    }
    textEl.textContent = '최적 경로 비용: ' + optimalCost + ' / 내 경로 비용: ' + currentCost + ' ➔ ' + resultMsg;
    
    renderUI();
    renderTree();
    
    if (score <= 0) {
      score = 0;
      isFullGameOver = true;
      showToast('생존 점수가 모두 소진되어 게임이 종료되었습니다.', 'error');
      setTimeout(showRankingModal, 1500);
    }
  }

  function showGuideModal() {
    let modal = document.getElementById('btm-guide-modal');
    if (!modal) {
      modal = document.createElement('div');
      modal.id = 'btm-guide-modal';
      modal.className = 'btm-modal-overlay';
      modal.innerHTML = 
        '<div class="btm-modal">' +
          '<h3>📖 게임 방법</h3>' +
          '<p>' +
            '- 이진 트리 미로에서 <b>좌/우 자식 노드</b>를 선택하여 잎(출구)까지 이동하세요.<br>' +
            '- 각 노드에는 <b>비용</b>이 있으며, 누적 비용을 <b>최소화</b>하는 것이 목표입니다.<br>' +
            '- 최적 경로와 일치하면 <b>생존 점수 +20점</b>, 실패하면 그 차이만큼 <b>점수가 차감</b>됩니다.<br>' +
            '- 점수가 <b>100점</b>을 넘으면 <b>보통</b> 난이도로, <b>200점</b>을 넘으면 <b>어려움</b> 난이도로 상승합니다.<br>' +
            '- 점수가 0 이하가 되면 게임 오버입니다! 신중히 선택하세요.' +
          '</p>' +
          '<button class="close-btn" onclick="document.getElementById(&quot;btm-guide-modal&quot;).style.display=&quot;none&quot;">확인</button>' +
        '</div>';
      document.body.appendChild(modal);
    }
    modal.style.display = 'flex';
  }

  function endAndRegister() {
    if (isFullGameOver) return;
    isFullGameOver = true;
    showRankingModal();
  }

  function showRankingModal() {
    let modal = document.getElementById('btm-ranking-modal');
    if (!modal) {
      modal = document.createElement('div');
      modal.id = 'btm-ranking-modal';
      modal.className = 'btm-modal-overlay';
      modal.innerHTML = 
        '<div class="btm-modal">' +
          '<h3>🏆 랭킹 등록</h3>' +
          '<p>최종 생존 점수: <strong id="btm-rank-score" style="color:#f59e0b; font-size:1.5rem;"></strong> 점</p>' +
          '<input type="text" id="btm-rank-name" placeholder="닉네임 (10자 이내)" maxlength="10" style="width:100%; padding:10px; margin-bottom:15px; border-radius:8px; background:#f8fafc; border:1px solid #cbd5e1; color:#1e293b; text-align:center;">' +
          '<button class="close-btn" id="btm-rank-submit">등록 후 재시작</button>' +
          '<button class="close-btn" style="background:#64748b; margin-left:10px;" onclick="document.getElementById(&quot;btm-ranking-modal&quot;).style.display=&quot;none&quot;">닫기</button>' +
        '</div>';
      document.body.appendChild(modal);
      
      document.getElementById('btm-rank-submit').addEventListener('click', function() {
        const nameInput = document.getElementById('btm-rank-name');
        let name = nameInput.value.trim();
        if (!name) { showToast('닉네임을 입력하세요.', 'error'); return; }
        name = escapeHTML(name);
        
        if (typeof window.submitRankingScore === 'function') {
          window.submitRankingScore('binary-tree-maze', name, score);
        } else {
          let list = JSON.parse(localStorage.getItem('mathlab_lb_binary-tree-maze') || '[]');
          list.push({ nickname: name, score: score });
          list.sort(function(a,b) { return b.score - a.score; });
          localStorage.setItem('mathlab_lb_binary-tree-maze', JSON.stringify(list));
        }
        
        showToast('명예의 전당에 등록되었습니다!', 'success');
        document.getElementById('btm-ranking-modal').style.display = 'none';
        renderBottomLeaderboard();
        fullResetGame();
      });
    }
    document.getElementById('btm-rank-score').textContent = score;
    document.getElementById('btm-rank-name').value = '';
    modal.style.display = 'flex';
  }

  function renderBottomLeaderboard() {
    if (typeof window.loadGameLeaderboard === 'function') {
      window.loadGameLeaderboard('binary-tree-maze', true, 'board-binary-tree-maze');
    } else {
      try {
        let list = JSON.parse(localStorage.getItem('mathlab_lb_binary-tree-maze') || '[]');
        const bottomEl = document.getElementById('board-binary-tree-maze');
        if (bottomEl) {
          if (list.length === 0) {
            bottomEl.innerHTML = '<p style="text-align:center; color:#64748b; padding:12px 0;">아직 등록된 기록이 없습니다.</p>';
          } else {
            bottomEl.innerHTML = list.slice(0, 5).map(function(item, idx) {
              return '<div style="display:flex; justify-content:space-between; align-items:center; background:#f8fafc; padding:10px 14px; border-radius:10px; border:1px solid #e2e8f0; margin-bottom:6px;">' +
                '<span style="font-weight:800; color:' + (idx === 0 ? '#f59e0b' : '#334155') + ';">' + (idx === 0 ? '👑 1위' : (idx + 1) + '위') + ' - ' + escapeHTML(item.nickname) + '</span>' +
                '<span style="color:#10b981; font-weight:900;">' + item.score + ' 점</span>' +
              '</div>';
            }).join('');
          }
        }
      } catch(e) {}
    }
  }

  function goHome() {
    if (host) {
      host.style.display = 'none';
      host.innerHTML = '';
    }
    const legacyHost = document.getElementById('mathlab-view');
    if (legacyHost) {
      legacyHost.style.display = 'none';
      legacyHost.innerHTML = '';
    }
    const forceHost = document.getElementById('binary-tree-maze-force-host');
    if (forceHost) {
      forceHost.style.display = 'none';
      forceHost.innerHTML = '';
    }

    document.querySelectorAll('.app-grid, #dashboard-screen, #hero-section').forEach(function(el) {
      if (el && el.style) {
        el.style.display = '';
        el.style.visibility = '';
      }
    });

    if (window.LegacyBridge && typeof window.LegacyBridge.backHome === 'function') {
      window.LegacyBridge.backHome();
    } else if (typeof window.goHome === 'function') {
      window.goHome();
    }
  }

  function mount(container, context) {
    let target = null;
    if (typeof container === 'string') target = document.querySelector(container);
    else if (container instanceof HTMLElement) target = container;
    
    if (!target) target = window.MathLabUtils && window.MathLabUtils.getMountContainer ? window.MathLabUtils.getMountContainer(container) : document.getElementById('mathlab-view');
    if (!target || !(target instanceof HTMLElement)) target = document.getElementById('new-root') || document.getElementById('game-container') || document.getElementById('mathlab-view');

    if (!target || !(target instanceof HTMLElement) || target === document.body) {
      let createdHost = document.getElementById('binary-tree-maze-force-host');
      if (!createdHost) {
        createdHost = document.createElement('div');
        createdHost.id = 'binary-tree-maze-force-host';
        document.body.appendChild(createdHost);
      }
      target = createdHost;
    }

    const footerEl = document.querySelector('footer, #footer, .app-footer') || 
                     Array.from(document.querySelectorAll('div, p, span')).find(function(el) { return el.textContent && el.textContent.indexOf('2026 기록조율사') !== -1; });
    if (footerEl && target && typeof target.compareDocumentPosition === 'function' && (target.compareDocumentPosition(footerEl) & Node.DOCUMENT_POSITION_PRECEDING)) {
      footerEl.parentNode.insertBefore(target, footerEl);
    }

    target.style.display = '';
    target.style.visibility = 'visible';
    target.style.opacity = '1';

    let parent = target.parentElement;
    while (parent && parent !== document.body && parent !== document.documentElement) {
      if (parent.style && parent.style.display === 'none') parent.style.display = 'block';
      if (parent.style && parent.style.visibility === 'hidden') parent.style.visibility = 'visible';
      parent = parent.parentElement;
    }

    document.querySelectorAll('header, .navbar, #app-header, .top-bar, #floating-home-btn, .floating-home').forEach(function(el) {
      if (el && el.style && el.style.display === 'none') el.style.display = '';
    });
    
    host = target;

    host.innerHTML = 
      '<div class="game-binary-tree-maze">' +
        '<div class="app-header">' +
          '<div class="app-title">🌳 이진 트리 미로 탈출</div>' +
          '<div class="header-btns">' +
            '<button class="btn btn-primary" id="btn-guide">📖 방법</button>' +
            '<button class="btn btn-home" id="btn-home">🏠 홈</button>' +
          '</div>' +
        '</div>' +
        '<div class="main-area">' +
          '<div class="status-bar">' +
            '<div class="stat-box">' +
              '<span class="stat-label">내 생존 점수</span>' +
              '<span class="stat-value score" id="btm-score">50</span>' +
            '</div>' +
            '<div class="stat-box">' +
              '<span class="stat-label">현재 경로 비용</span>' +
              '<span class="stat-value red" id="btm-cost">0</span>' +
            '</div>' +
            '<div class="stat-box">' +
              '<span class="stat-label">아이템 상태</span>' +
              '<span class="stat-value" style="font-size:1.1rem; padding-top:5px;" id="btm-key">없음</span>' +
            '</div>' +
          '</div>' +
          
          '<div class="controls-row">' +
            '<span class="diff-indicator" data-diff="easy">쉬움 (~99점)</span>' +
            '<span class="diff-indicator" data-diff="normal">보통 (~199점)</span>' +
            '<span class="diff-indicator" data-diff="hard">도전 (200점~)</span>' +
            '<button class="btn" style="margin-left:auto; background:#fef2f2; border:1px solid #fca5a5; color:#ef4444;" id="btn-end">🛑 기록 등록 후 종료</button>' +
          '</div>' +
          
          '<div class="svg-container">' +
            '<svg id="btm-svg"></svg>' +
          '</div>' +
          
          '<div class="move-controls">' +
            '<button class="move-btn" id="btn-left">⬅️ 좌측 이동</button>' +
            '<button class="btn" style="background:#ef4444; color:white; border-radius:12px;" id="btn-undo">↩️ 되돌리기 (-5)</button>' +
            '<button class="move-btn" id="btn-right">우측 이동 ➡️</button>' +
          '</div>' +
          
          '<div class="end-round-banner" id="end-round-banner">' +
            '<div class="end-round-title" id="banner-title">결과</div>' +
            '<div class="end-round-text" id="banner-text">내용</div>' +
            '<button class="btn btn-primary" style="font-size:1.1rem; padding:10px 20px;" id="btn-next-maze">다음 미로로 이동 ➡️</button>' +
          '</div>' +
        '</div>' +
        
        '<div class="bottom-ranking-card" id="board-binary-tree-maze-wrapper">' +
          '<div class="ranking-title">🏆 명예의 전당 (최고 점수)</div>' +
          '<div id="board-binary-tree-maze">' +
            '<p style="text-align:center; color:#94a3b8; padding:12px 0;">로딩 중...</p>' +
          '</div>' +
        '</div>' +
      '</div>';

    // Events
    host.querySelector('#btn-home').addEventListener('click', goHome);
    host.querySelector('#btn-guide').addEventListener('click', showGuideModal);
    host.querySelector('#btn-end').addEventListener('click', endAndRegister);
    host.querySelector('#btn-next-maze').addEventListener('click', nextMaze);
    
    host.querySelector('#btn-left').addEventListener('click', moveLeft);
    host.querySelector('#btn-right').addEventListener('click', moveRight);
    host.querySelector('#btn-undo').addEventListener('click', undoMove);

    setTimeout(function() {
      fullResetGame();
      renderBottomLeaderboard();
    }, 100);
  }

  function destroy() {
    if (host) host.innerHTML = '';
  }

  return { mount: mount, resetGame: fullResetGame, destroy: destroy, goHome: goHome, moveToNode: moveToNode };
})();

function registerBinaryTreeMaze() {
  if (typeof window.MathLabGames !== 'undefined' && typeof window.MathLabGames.register === 'function') {
    if (!window.MathLabGames.get('binary-tree-maze')) {
      try {
        window.MathLabGames.register({
          id: 'binary-tree-maze',
          title: '이진 트리 미로 탈출',
          icon: '🌳',
          sourceType: 'new',
          players: '1인',
          isMultiplayer: false,
          mount: function(container, context) { BinaryTreeMaze.mount(container, context); },
          reset: function() { BinaryTreeMaze.resetGame(); },
          destroy: function() { BinaryTreeMaze.destroy(); },
          goHome: function() { BinaryTreeMaze.goHome(); }
        });
      } catch (e) {
        console.warn('binary-tree-maze 안전 등록 방어:', e);
      }
    }
  }
}

registerBinaryTreeMaze();
window.addEventListener('DOMContentLoaded', registerBinaryTreeMaze);
setTimeout(registerBinaryTreeMaze, 100);
setTimeout(registerBinaryTreeMaze, 500);

window.BinaryTreeMazeModule = BinaryTreeMaze;

window.initBinaryTreeMazeGame = function() {
  registerBinaryTreeMaze();
  if (window.LegacyBridge && typeof window.LegacyBridge.hideAllLegacySections === 'function') {
    window.LegacyBridge.hideAllLegacySections();
    window.LegacyBridge.showNewRoot();
  }
  if (typeof window.MathLabGames !== 'undefined' && typeof window.MathLabGames.mount === 'function') {
    try { window.MathLabGames.mount('binary-tree-maze'); return; } catch(e) {}
  }
  const targetEl = document.getElementById('mathlab-view') || document.getElementById('new-root');
  BinaryTreeMaze.mount(targetEl);
};

window.launchMathLabGame = window.launchMathLabGame || function(id) {
  if (id === 'binary-tree-maze') {
    window.initBinaryTreeMazeGame();
  }
};
</script>
