<style>
.game-markov-weather-chain{max-width:1060px;margin:0 auto;padding:18px 14px 40px;font-family:'Pretendard','Noto Sans KR',sans-serif;color:#0f172a;background:#f8fafc;border-radius:18px}
.game-markov-weather-chain *{box-sizing:border-box}
.mwc-header{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.mwc-title{font-size:1.45rem;font-weight:900;margin:0}
.mwc-subtitle{font-size:.88rem;color:#64748b;margin:3px 0 0;font-weight:600}
.mwc-btn{border:1px solid #cbd5e1;background:#fff;color:#1e293b;font-weight:700;padding:8px 14px;border-radius:10px;cursor:pointer;font-size:.9rem;transition:background .15s,transform .1s;user-select:none}
.mwc-btn:hover{background:#f1f5f9}.mwc-btn:active{transform:scale(.97)}
.mwc-btn.primary{background:#7c3aed;border-color:#7c3aed;color:#fff}.mwc-btn.primary:hover{background:#6d28d9}
.mwc-btn.success{background:#059669;border-color:#059669;color:#fff}
.mwc-btn.warn{background:#d97706;border-color:#d97706;color:#fff}
.mwc-btn:disabled{opacity:.45;cursor:not-allowed}
.mwc-diff-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.mwc-diff-btn{padding:6px 16px;border-radius:20px;border:2px solid #e2e8f0;background:#fff;font-weight:700;font-size:.86rem;cursor:pointer;transition:all .15s}
.mwc-diff-btn.active{border-color:#7c3aed;background:#7c3aed;color:#fff}
.mwc-hud{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.mwc-hud-card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:10px 16px;min-width:90px}
.mwc-hud-label{font-size:.75rem;color:#64748b;font-weight:700}
.mwc-hud-val{font-size:1.1rem;font-weight:900;color:#0f172a}
.mwc-hud-val.purple{color:#7c3aed}.mwc-hud-val.green{color:#059669}.mwc-hud-val.amber{color:#d97706}
.mwc-body{display:grid;grid-template-columns:1fr 300px;gap:14px}
@media(max-width:820px){.mwc-body{grid-template-columns:1fr}}
.mwc-panel{display:flex;flex-direction:column;gap:12px}
.mwc-box{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:16px}
.mwc-box h4{margin:0 0 12px;font-size:.95rem;color:#334155;font-weight:800}
.mwc-mission-box{background:#faf5ff;border:1px solid #ddd6fe;border-radius:14px;padding:14px 16px;margin-bottom:14px}
.mwc-mission-box h4{margin:0 0 6px;color:#6d28d9;font-size:.95rem;font-weight:800}
.mwc-mission-txt{font-size:.93rem;color:#1e293b;line-height:1.6}
.mwc-matrix{width:100%;border-collapse:collapse;font-size:.88rem;margin:8px 0}
.mwc-matrix th{background:#f3f0ff;color:#5b21b6;font-weight:800;padding:7px 12px;border:1px solid #ddd6fe;text-align:center}
.mwc-matrix td{border:1px solid #e2e8f0;padding:7px 12px;text-align:center;font-weight:600}
.mwc-matrix td.highlight{background:#faf5ff;color:#7c3aed;font-weight:900}
.mwc-weather-icons{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0}
.mwc-weather-icon{font-size:1.6rem;text-align:center;line-height:1.2}
.mwc-weather-label{font-size:.75rem;color:#64748b;font-weight:700}
.mwc-tree{overflow-x:auto;margin:8px 0}
.mwc-tree svg{display:block;max-width:100%}
.mwc-bet-opts{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.mwc-bet-opt{display:flex;align-items:center;gap:10px;background:#f8fafc;border:2px solid #e2e8f0;border-radius:10px;padding:10px 14px;cursor:pointer;transition:border-color .15s,background .15s}
.mwc-bet-opt:hover{border-color:#7c3aed;background:#faf5ff}
.mwc-bet-opt.selected{border-color:#7c3aed;background:#faf5ff}
.mwc-bet-opt-icon{font-size:1.4rem}
.mwc-bet-opt-name{font-weight:800;font-size:.92rem}
.mwc-bet-opt-prob{font-size:.8rem;color:#64748b}
.mwc-bet-opt-odds{margin-left:auto;font-weight:900;font-size:.95rem;color:#7c3aed}
.mwc-bet-input{display:flex;align-items:center;gap:8px;margin:10px 0}
.mwc-bet-input label{font-weight:700;font-size:.88rem;white-space:nowrap}
.mwc-bet-input input{flex:1;border:1px solid #cbd5e1;border-radius:8px;padding:7px 10px;font-size:.9rem;font-weight:700;min-width:0}
.mwc-bet-presets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.mwc-bet-presets button{padding:4px 10px;border-radius:8px;border:1px solid #cbd5e1;background:#fff;font-weight:700;font-size:.8rem;cursor:pointer}
.mwc-bet-presets button:hover{background:#f1f5f9}
.mwc-result-box{border-radius:12px;padding:14px 16px;margin-top:8px}
.mwc-result-box.win{background:#f0fdf4;border:2px solid #86efac}
.mwc-result-box.lose{background:#fef2f2;border:2px solid #fca5a5}
.mwc-result-box.draw{background:#fffbeb;border:2px solid #fde68a}
.mwc-result-title{font-size:1rem;font-weight:900;margin-bottom:6px}
.mwc-result-detail{font-size:.85rem;color:#475569;line-height:1.6}
.mwc-bar-wrap{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.mwc-bar-row{display:flex;align-items:center;gap:8px}
.mwc-bar-lbl{width:56px;font-size:.82rem;font-weight:700;text-align:right;flex-shrink:0}
.mwc-bar-bg{flex:1;background:#f1f5f9;border-radius:6px;height:22px;overflow:hidden}
.mwc-bar-fill{height:100%;border-radius:6px;transition:width .6s ease;display:flex;align-items:center;padding-left:8px}
.mwc-bar-pct{font-size:.8rem;font-weight:900;color:#fff;white-space:nowrap}
.mwc-sim-controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.mwc-top-list{list-style:none;padding:0;margin:0}
.mwc-top-list li{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid #f1f5f9;font-size:.84rem}
.mwc-top-list li:last-child{border-bottom:none}
.mwc-rank-badge{width:22px;height:22px;border-radius:50%;background:#e2e8f0;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:900;color:#475569;flex-shrink:0}
.mwc-rank-badge.gold{background:#fbbf24;color:#fff}.mwc-rank-badge.silver{background:#94a3b8;color:#fff}.mwc-rank-badge.bronze{background:#b45309;color:#fff}
.mwc-gameover-box{background:#fff;border:2px solid #7c3aed;border-radius:14px;padding:18px}
.mwc-toast{position:fixed;top:24px;left:50%;transform:translateX(-50%) translateY(-16px);background:#0f172a;color:#f8fafc;padding:11px 22px;border-radius:12px;font-weight:700;font-size:.95rem;z-index:9500;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:90vw;text-align:center}
.mwc-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.mwc-toast.ok{background:#059669}.mwc-toast.err{background:#dc2626}
.mwc-modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;z-index:9000;padding:16px}
.mwc-modal{background:#fff;border-radius:16px;max-width:520px;width:100%;max-height:88vh;overflow-y:auto;padding:22px 24px;box-shadow:0 18px 50px rgba(15,23,42,.25);color:#1e293b;line-height:1.65}
.mwc-tab-row{display:flex;gap:4px;border-bottom:2px solid #e2e8f0;margin-bottom:14px}
.mwc-tab{padding:7px 14px;border:none;background:none;font-weight:700;font-size:.88rem;color:#94a3b8;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px}
.mwc-tab.active{color:#7c3aed;border-bottom-color:#7c3aed}
</style>
<script>
(function(){
'use strict';
var AID='markov-weather-chain',ATITLE='마르코프 날씨 체인 도박',ABOARD='board-markov-weather-chain';
var INIT_POINTS=500;
var STATES2=[{id:'sunny',icon:'☀️',name:'맑음',color:'#f59e0b'},{id:'rainy',icon:'🌧️',name:'비',color:'#3b82f6'}];
var STATES3=[{id:'sunny',icon:'☀️',name:'맑음',color:'#f59e0b'},{id:'cloudy',icon:'⛅',name:'흐림',color:'#94a3b8'},{id:'rainy',icon:'🌧️',name:'비',color:'#3b82f6'}];
var DIFF={
  easy:{label:'쉬움',states:2,days:2,rounds:4,treeAuto:true,hintPenalty:0},
  normal:{label:'보통',states:2,days:3,rounds:5,treeAuto:false,hintPenalty:5},
  hard:{label:'도전',states:3,days:5,rounds:5,treeAuto:false,hintPenalty:10}
};
var MATRIX2_PRESETS=[
  [[0.7,0.3],[0.4,0.6]],
  [[0.8,0.2],[0.3,0.7]],
  [[0.6,0.4],[0.5,0.5]],
  [[0.75,0.25],[0.35,0.65]]
];
var MATRIX3_PRESETS=[
  [[0.6,0.2,0.2],[0.3,0.4,0.3],[0.2,0.3,0.5]],
  [[0.7,0.2,0.1],[0.2,0.5,0.3],[0.1,0.3,0.6]]
];
var G={
  mounted:false,host:null,diff:'normal',
  round:1,totalR:5,points:INIT_POINTS,phase:'playing',
  states:null,matrix:null,todayIdx:0,targetDay:3,
  probs:null,selectedWeather:-1,betAmt:50,
  hintUsed:false,submitted:false,
  simRunning:false,simDay:0,simDist:null,
  tab:'game',tids:[]
};
function calcProbs(matrix,startIdx,days){
  var n=matrix.length;
  var v=new Array(n).fill(0);v[startIdx]=1;
  for(var d=0;d<days;d++){
    var nv=new Array(n).fill(0);
    for(var i=0;i<n;i++)for(var j=0;j<n;j++)nv[j]+=v[i]*matrix[i][j];
    v=nv;
  }
  return v;
}
function randMatrix(n){
  if(n===2){return MATRIX2_PRESETS[Math.floor(Math.random()*MATRIX2_PRESETS.length)];}
  return MATRIX3_PRESETS[Math.floor(Math.random()*MATRIX3_PRESETS.length)];
}
function randStateIdx(n){return Math.floor(Math.random()*n);}
function calcOdds(prob){
  if(prob<=0)return 99;
  var raw=1/prob;
  var odds=Math.max(1.1,raw*0.88);
  return Math.round(odds*10)/10;
}
function buildTreeSVG(matrix,startIdx,days,states){
  var n=states.length;
  var showDays=Math.min(days,2);
  var W=480,rowH=48,nodeR=18;
  var levels=[];
  levels.push([{stateIdx:startIdx,prob:1,x:60,parentX:null,parentY:null}]);
  for(var d=0;d<showDays;d++){
    var prev=levels[d],next=[];
    var totalNodes=prev.length*n;
    var spacing=Math.max(36,Math.floor((W-120)/Math.max(totalNodes-1,1)));
    var startX=60;
    var ni=0;
    for(var pi=0;pi<prev.length;pi++){
      var pn=prev[pi];
      for(var j=0;j<n;j++){
        var prob=pn.prob*matrix[pn.stateIdx][j];
        var x=startX+ni*spacing;
        next.push({stateIdx:j,prob:prob,x:x,parentX:pn.x,parentY:(d)*rowH+30});
        ni++;
      }
    }
    levels.push(next);
  }
  var H=(showDays+1)*rowH+60;
  var lines='',nodes='';
  for(var lv=1;lv<levels.length;lv++){
    var lvNodes=levels[lv];
    for(var ni2=0;ni2<lvNodes.length;ni2++){
      var nd=lvNodes[ni2];
      var y=lv*rowH+30;
      lines+='<line x1="'+nd.parentX+'" y1="'+nd.parentY+'" x2="'+nd.x+'" y2="'+y+'" stroke="#cbd5e1" stroke-width="1.5"/>';
      var mx=(nd.parentX+nd.x)/2,my=(nd.parentY+y)/2;
      var tp=matrix[levels[lv-1].find(function(p){return p.x===nd.parentX;})?.stateIdx||0][nd.stateIdx];
      lines+='<text x="'+mx+'" y="'+(my-4)+'" text-anchor="middle" font-size="9" fill="#7c3aed" font-weight="700">×'+tp.toFixed(2)+'</text>';
    }
  }
  for(var lv2=0;lv2<levels.length;lv2++){
    var lvNodes2=levels[lv2];
    for(var ni3=0;ni3<lvNodes2.length;ni3++){
      var nd2=lvNodes2[ni3];
      var y2=lv2*rowH+30;
      var st=states[nd2.stateIdx];
      nodes+='<circle cx="'+nd2.x+'" cy="'+y2+'" r="'+nodeR+'" fill="'+st.color+'" opacity="0.18"/>';
      nodes+='<text x="'+nd2.x+'" y="'+(y2-2)+'" text-anchor="middle" font-size="14" dominant-baseline="middle">'+st.icon+'</text>';
      if(lv2>0){nodes+='<text x="'+nd2.x+'" y="'+(y2+nodeR+10)+'" text-anchor="middle" font-size="9" fill="#334155" font-weight="700">'+(nd2.prob*100).toFixed(1)+'%</text>';}
    }
  }
  var labels='';
  for(var lv3=0;lv3<levels.length;lv3++){
    labels+='<text x="8" y="'+(lv3*rowH+34)+'" font-size="10" fill="#94a3b8" font-weight="700">'+(lv3===0?'오늘':lv3+'일 후')+'</text>';
  }
  if(days>showDays){labels+='<text x="'+Math.floor(W/2)+'" y="'+(H-8)+'" text-anchor="middle" font-size="10" fill="#94a3b8">'+days+'일 후 최종 분포는 아래 막대 그래프 참조</text>';}
  return '<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">'+lines+nodes+labels+'</svg>';
}
function buildBarChart(probs,states){
  var COLORS=['#f59e0b','#94a3b8','#3b82f6'];
  var html='<div class="mwc-bar-wrap">';
  for(var i=0;i<states.length;i++){
    var pct=Math.round(probs[i]*1000)/10;
    var w=Math.round(probs[i]*100);
    html+='<div class="mwc-bar-row"><div class="mwc-bar-lbl">'+states[i].icon+' '+states[i].name+'</div>'+
      '<div class="mwc-bar-bg"><div class="mwc-bar-fill" style="width:'+w+'%;background:'+COLORS[i%COLORS.length]+'">'+
      '<span class="mwc-bar-pct">'+pct+'%</span></div></div></div>';
  }
  return html+'</div>';
}
function buildHTML(){
  return '<div class="game-markov-weather-chain" id="mwc-root">'+
  '<div class="mwc-header"><div><h2 class="mwc-title">🌦️ 마르코프 날씨 체인 도박</h2>'+
  '<p class="mwc-subtitle">전이 확률 표를 분석해 며칠 뒤 날씨를 예측·베팅하는 마르코프 체인 게임</p></div>'+
  '<div style="display:flex;gap:8px;">'+
  '<button type="button" class="mwc-btn" id="mwc-guide-btn">📖 사용법</button>'+
  '<button type="button" class="mwc-btn" id="mwc-sim-btn">📊 장기 관찰</button>'+
  '<button type="button" class="mwc-btn" id="mwc-home-btn">🏠 홈으로</button>'+
  '</div></div>'+
  '<div class="mwc-diff-row"><span style="font-size:.85rem;font-weight:700;color:#64748b;">난이도:</span>'+
  '<button type="button" class="mwc-diff-btn" id="mwc-d-easy">쉬움</button>'+
  '<button type="button" class="mwc-diff-btn active" id="mwc-d-normal">보통</button>'+
  '<button type="button" class="mwc-diff-btn" id="mwc-d-hard">도전</button></div>'+
  '<div class="mwc-hud">'+
  '<div class="mwc-hud-card"><div class="mwc-hud-label">라운드</div><div class="mwc-hud-val purple" id="mwc-round">1 / 5</div></div>'+
  '<div class="mwc-hud-card"><div class="mwc-hud-label">포인트</div><div class="mwc-hud-val green" id="mwc-points">500</div></div>'+
  '<div class="mwc-hud-card"><div class="mwc-hud-label">베팅 적중</div><div class="mwc-hud-val amber" id="mwc-hits">0 / 0</div></div>'+
  '</div>'+
  '<div class="mwc-mission-box"><h4>🗺️ 미션</h4><p class="mwc-mission-txt" id="mwc-mission">로딩 중...</p></div>'+
  '<div class="mwc-body"><div class="mwc-panel">'+
  '<div class="mwc-box"><h4>📊 전이 확률 표 (오늘 날씨→내일 날씨)</h4><div id="mwc-matrix-wrap"></div></div>'+
  '<div class="mwc-box"><h4>🌳 확률 트리 <span id="mwc-tree-hint-lbl"></span></h4>'+
  '<div id="mwc-tree-wrap"></div>'+
  '<button type="button" class="mwc-btn warn" id="mwc-hint-btn" style="margin-top:8px;">💡 힌트 (트리 표시)</button></div>'+
  '<div class="mwc-box" id="mwc-result-area" style="display:none;"></div></div>'+
  '<div class="mwc-panel"><div class="mwc-box">'+
  '<h4>🎯 날씨 베팅</h4><div id="mwc-bet-opts" class="mwc-bet-opts"></div>'+
  '<div class="mwc-bet-presets"><span style="font-size:.8rem;font-weight:700;color:#64748b;">빠른 베팅:</span>'+
  '<button type="button" id="mwc-p10">10%</button>'+
  '<button type="button" id="mwc-p25">25%</button>'+
  '<button type="button" id="mwc-p50">50%</button>'+
  '<button type="button" id="mwc-p100">올인</button></div>'+
  '<div class="mwc-bet-input"><label>베팅:</label>'+
  '<input type="number" id="mwc-bet-amt" min="10" max="9999" value="50">'+
  '<span style="font-size:.85rem;color:#64748b;">P</span></div>'+
  '<div style="display:flex;gap:8px;"><button type="button" class="mwc-btn primary" id="mwc-submit-btn">📦 베팅 제출</button></div>'+
  '<button type="button" class="mwc-btn success" id="mwc-next-btn" style="display:none;width:100%;margin-top:10px;">다음 라운드 ▶</button></div>'+
  '<div class="mwc-box"><h4>🏆 명예의 전당</h4>'+
  '<ul class="mwc-top-list" id="mwc-hof-list"><li style="color:#94a3b8;font-size:.84rem;">불러오는 중...</li></ul></div>'+
  '<div id="mwc-gameover" style="display:none;"></div></div></div>'+
  '<div class="mwc-toast" id="mwc-toast"></div></div>';
}
function startRound(){
  var cfg=DIFF[G.diff];
  G.states=cfg.states===2?STATES2:STATES3;
  G.matrix=randMatrix(G.states.length);
  G.todayIdx=randStateIdx(G.states.length);
  G.targetDay=cfg.days;
  G.probs=calcProbs(G.matrix,G.todayIdx,G.targetDay);
  G.selectedWeather=-1;
  G.betAmt=Math.min(50,Math.floor(G.points*0.1)||10);
  G.hintUsed=false;
  G.submitted=false;
  var mEl=byId('mwc-mission');
  if(mEl)mEl.innerHTML='오늘 날씨는 <strong>'+G.states[G.todayIdx].icon+' '+G.states[G.todayIdx].name+'</strong>입니다.'+
    ' 전이 확률 표를 보고 <strong>'+G.targetDay+'일 뒤</strong> 날씨를 예측해 베팅하세요!';
  renderMatrix();
  if(cfg.treeAuto){renderTree();}else{clearTree();}
  renderBetOpts();
  syncBtns();
  setText('mwc-round',G.round+' / '+G.totalR);
  var ra=byId('mwc-result-area');if(ra)ra.style.display='none';
  var gb=byId('mwc-gameover');if(gb)gb.style.display='none';
  updateHUD();
}
function renderMatrix(){
  var el=byId('mwc-matrix-wrap');if(!el)return;
  var n=G.states.length,html='<table class="mwc-matrix"><thead><tr><th>오늘↓ / 내일→</th>';
  for(var j=0;j<n;j++)html+='<th>'+G.states[j].icon+' '+G.states[j].name+'</th>';
  html+='</tr></thead><tbody>';
  for(var i=0;i<n;i++){
    html+='<tr><td class="highlight">'+G.states[i].icon+' '+G.states[i].name+'</td>';
    for(var j2=0;j2<n;j2++)html+='<td>'+(G.matrix[i][j2]*100).toFixed(0)+'%</td>';
    html+='</tr>';
  }
  el.innerHTML=html+'</tbody></table>';
}
function renderTree(){
  var el=byId('mwc-tree-wrap');if(!el)return;
  el.innerHTML='<div class="mwc-tree">'+buildTreeSVG(G.matrix,G.todayIdx,G.targetDay,G.states)+'</div>'+
    '<div style="margin-top:8px;"><strong>'+G.targetDay+'일 뒤 이론 확률:</strong></div>'+
    buildBarChart(G.probs,G.states);
  var hb=byId('mwc-hint-btn');if(hb)hb.style.display='none';
  var hl=byId('mwc-tree-hint-lbl');if(hl)hl.textContent='';
}
function clearTree(){
  var el=byId('mwc-tree-wrap');if(!el)return;
  el.innerHTML='<p style="color:#94a3b8;font-size:.88rem;margin:4px 0;">확률 트리는 힌트 버튼으로 볼 수 있습니다.</p>';
  var hb=byId('mwc-hint-btn');if(hb)hb.style.display='';
}
function renderBetOpts(){
  var el=byId('mwc-bet-opts');if(!el)return;
  var html='';
  for(var i=0;i<G.states.length;i++){
    var st=G.states[i];
    var odds=calcOdds(G.probs[i]);
    html+='<div class="mwc-bet-opt" data-idx="'+i+'" id="mwc-opt-'+i+'">'+
      '<span class="mwc-bet-opt-icon">'+st.icon+'</span>'+
      '<div><div class="mwc-bet-opt-name">'+st.name+'</div>'+
      '<div class="mwc-bet-opt-prob">이론 확률: ?%</div></div>'+
      '<div class="mwc-bet-opt-odds">×'+odds+'</div></div>';
  }
  el.innerHTML=html;
  for(var i2=0;i2<G.states.length;i2++){
    (function(idx){
      var opt=byId('mwc-opt-'+idx);
      if(opt)opt.addEventListener('click',function(){
        if(G.submitted)return;
        G.selectedWeather=idx;
        for(var k=0;k<G.states.length;k++){
          var o=byId('mwc-opt-'+k);
          if(o)o.className='mwc-bet-opt'+(k===idx?' selected':'');
        }
      });
    })(i2);
  }
  var ai=byId('mwc-bet-amt');if(ai){ai.value=G.betAmt;}
}
function syncBtns(){
  var sb=byId('mwc-submit-btn');if(sb)sb.disabled=G.submitted;
  var hb=byId('mwc-hint-btn');if(hb)hb.disabled=G.submitted||G.hintUsed;
  var nb=byId('mwc-next-btn');if(nb)nb.style.display=G.submitted?'':'none';
}
function updateHUD(){
  setText('mwc-points',G.points+' P');
  setText('mwc-round',G.round+' / '+G.totalR);
}
function showHint(){
  if(G.submitted||G.hintUsed)return;
  G.hintUsed=true;
  var pen=DIFF[G.diff].hintPenalty;
  if(pen>0){G.points=Math.max(0,G.points-pen);updateHUD();toast('힌트 사용 (-'+pen+'P)','err');}
  renderTree();
  var hl=byId('mwc-tree-hint-lbl');
  if(hl&&pen>0)hl.innerHTML='<span style="color:#dc2626;font-size:.8rem;">(-'+pen+'P)</span>';
  var hb=byId('mwc-hint-btn');if(hb)hb.disabled=true;
}
var G_hits=0,G_totalBets=0;
function submitBet(){
  if(G.submitted)return;
  if(G.selectedWeather<0){toast('⚠️ 날씨를 먼저 선택하세요!');return;}
  var betEl=byId('mwc-bet-amt');
  var amt=parseInt((betEl||{}).value||'50',10)||50;
  amt=Math.max(10,Math.min(amt,G.points));
  if(G.points<10){toast('❌ 포인트가 부족합니다!','err');return;}
  G.submitted=true;
  G_totalBets++;
  var cur=G.todayIdx;
  for(var d=0;d<G.targetDay;d++){
    var r=Math.random(),acc=0;
    for(var j=0;j<G.states.length;j++){acc+=G.matrix[cur][j];if(r<acc){cur=j;break;}}
  }
  var actualIdx=cur;
  var won=actualIdx===G.selectedWeather;
  var odds=calcOdds(G.probs[G.selectedWeather]);
  var gain=won?Math.round(amt*(odds-1)):0;
  var loss=won?0:amt;
  G.points=Math.max(0,G.points+(won?gain:-loss));
  if(won)G_hits++;
  updateHUD();
  for(var i=0;i<G.states.length;i++){
    var optEl=byId('mwc-opt-'+i);
    if(optEl){var pEl=optEl.querySelector('.mwc-bet-opt-prob');if(pEl)pEl.textContent='이론 확률: '+(G.probs[i]*100).toFixed(1)+'%';}
  }
  setText('mwc-hits',G_hits+' / '+G_totalBets);
  if(!G.hintUsed&&!DIFF[G.diff].treeAuto){renderTree();}
  var ra=byId('mwc-result-area');if(!ra)return;
  ra.style.display='';
  var cls=won?'win':'lose',title=won?'🎉 적중! +'+gain+'P':'❌ 빗나감 -'+loss+'P';
  var detail='실제 결과: '+G.states[actualIdx].icon+' '+G.states[actualIdx].name+'<br>'+
    '선택: '+G.states[G.selectedWeather].icon+' '+G.states[G.selectedWeather].name+
    ' (이론 확률: '+(G.probs[G.selectedWeather]*100).toFixed(1)+'%, 배당: ×'+odds+')<br>'+
    '현재 포인트: <strong>'+G.points+'P</strong>';
  ra.innerHTML='<div class="mwc-result-box '+cls+'"><div class="mwc-result-title">'+title+'</div>'+
    '<div class="mwc-result-detail">'+detail+'</div></div>';
  if(won)toast('🎉 적중! +'+gain+'P','ok');else toast('빗나감 -'+loss+'P');
  syncBtns();
  if(G.points<=0){setTimeout(gameOver,800);return;}
}
function nextRound(){
  G.round++;
  if(G.round>G.totalR){gameOver();return;}
  startRound();
}
function gameOver(){
  G.phase='gameover';
  var finalScore=G.points;
  var gb=byId('mwc-gameover');
  if(gb){
    gb.innerHTML='<div class="mwc-gameover-box"><h3 style="margin:0 0 10px;">🏁 게임 종료!</h3>'+
      '<p>최종 포인트: <strong style="font-size:1.4rem;color:#7c3aed;">'+finalScore+'P</strong> ['+DIFF[G.diff].label+']</p>'+
      '<p style="color:#64748b;font-size:.88rem;">베팅 적중: '+G_hits+' / '+G_totalBets+'</p>'+
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;">'+
      '<button type="button" class="mwc-btn primary" id="mwc-save-btn">🏆 명예의 전당 등록</button>'+
      '<button type="button" class="mwc-btn" id="mwc-retry-btn">🔄 다시 하기</button>'+
      '</div></div>';
    gb.style.display='';
  }
  on('mwc-save-btn','click',function(){openHOF(finalScore);});
  on('mwc-retry-btn','click',function(){startGame(G.diff);});
}
function loadHOFFromServer(){
  var el=byId('mwc-hof-list');if(!el)return;
  if(typeof loadGameLeaderboard==='function'){
    try{
      el.innerHTML='<li style="color:#94a3b8;font-size:.84rem;">⏳ 불러오는 중...</li>';
      loadGameLeaderboard(ATITLE,true,ABOARD);
      setTimeout(function(){if(el.dataset.srv!=='1')renderHOFLocal(el);},1800);
    }catch(e){renderHOFLocal(el);}
  }else{renderHOFLocal(el);}
}
function renderHOFLocal(el){
  if(!el)return;
  var hof=[];
  try{var d=localStorage.getItem('mwc_hof');if(d)hof=JSON.parse(d);}catch(e){}
  if(!hof.length){el.innerHTML='<li style="color:#94a3b8;font-size:.84rem;">기록 없음</li>';return;}
  var bc=['gold','silver','bronze'];
  el.innerHTML=hof.map(function(h,i){
    return '<li><div class="mwc-rank-badge '+(bc[i]||'')+'">'+( i+1)+'</div>'+
      '<span><strong>'+h.name+'</strong> <span style="color:#94a3b8;font-size:.78rem;">['+h.diff+']</span></span>'+
      '<span style="margin-left:auto;font-weight:900;color:#7c3aed;">'+h.score+'P</span></li>';
  }).join('');
}
function openHOF(score){
  openModal('<h3 style="margin:0 0 12px;">🏆 명예의 전당 등록</h3>'+
    '<p>최종 포인트: <strong>'+score+'P</strong> ('+DIFF[G.diff].label+')</p>'+
    '<label style="font-weight:700;">이름</label><br>'+
    '<input type="text" id="mwc-hof-inp" style="width:100%;border:1px solid #cbd5e1;border-radius:8px;padding:8px 12px;margin:6px 0 14px;font-size:.95rem;" maxlength="12" placeholder="이름 입력">'+
    '<div style="display:flex;gap:8px;">'+
    '<button type="button" class="mwc-btn success" id="mwc-hof-ok">저장</button>'+
    '<button type="button" class="mwc-btn" id="mwc-hof-cancel">취소</button></div>');
  var inp=byId('mwc-hof-inp');if(inp)inp.focus();
  on('mwc-hof-ok','click',function(){
    var nm=((byId('mwc-hof-inp')||{}).value||'익명').trim()||'익명';
    if(typeof submitRanking==='function'){
      try{submitRanking(ATITLE,score,true,nm,ABOARD);toast('🏆 명예의 전당에 저장했습니다!','ok');}
      catch(e){console.warn('[mwc] submitRanking 오류:',e);toast('⚠️ 서버 저장 실패, 로컬에만 기록','err');}
    }else{
      console.warn('[mwc] submitRanking 없음 — localStorage fallback');
      toast('저장 완료 (로컬)','ok');
    }
    try{
      var hof=[];var d=localStorage.getItem('mwc_hof');if(d)hof=JSON.parse(d);
      hof.push({name:nm,score:score,diff:DIFF[G.diff].label});
      hof.sort(function(a,b){return b.score-a.score;});hof=hof.slice(0,5);
      localStorage.setItem('mwc_hof',JSON.stringify(hof));
    }catch(e){}
    closeModal();
    setTimeout(loadHOFFromServer,800);
  });
  on('mwc-hof-cancel','click',closeModal);
}
function openSimMode(){
  var n=G.states?G.states.length:2;
  var states=n===3?STATES3:STATES2;
  var matrix=G.matrix||MATRIX2_PRESETS[0];
  var initIdx=G.todayIdx||0;
  var dist=new Array(n).fill(0);dist[initIdx]=1;
  var day=0,simId=null;
  function step(){
    day++;var nd=new Array(n).fill(0);
    for(var i=0;i<n;i++)for(var j=0;j<n;j++)nd[j]+=dist[i]*matrix[i][j];
    dist=nd;
    updateSim(day,dist,states);
  }
  openModal('<h3 style="margin:0 0 10px;">📊 장기 수렴 관찰 (시연, 점수 미저장)</h3>'+
    '<p style="font-size:.85rem;color:#64748b;">현재 전이 행렬로 하루씩 시뮬레이션합니다. 초기 상태와 무관하게 확률 분포가 수렴하는 현상을 관찰하세요.</p>'+
    '<div id="mwc-sim-day" style="font-weight:800;color:#7c3aed;margin:8px 0;">0일째</div>'+
    '<div id="mwc-sim-dist"></div>'+
    '<div class="mwc-sim-controls">'+
    '<button type="button" class="mwc-btn primary" id="mwc-sim-play">▶ 자동 재생</button>'+
    '<button type="button" class="mwc-btn" id="mwc-sim-step">+1일</button>'+
    '<button type="button" class="mwc-btn" id="mwc-sim-reset">↺ 초기화</button>'+
    '<button type="button" class="mwc-btn" id="mwc-sim-close">닫기</button></div>');
  updateSim(0,dist,states);
  var playing=false;
  on('mwc-sim-step','click',step);
  on('mwc-sim-reset','click',function(){day=0;dist=new Array(n).fill(0);dist[initIdx]=1;clearInterval(simId);playing=false;var pb=byId('mwc-sim-play');if(pb)pb.textContent='▶ 자동 재생';updateSim(0,dist,states);});
  on('mwc-sim-play','click',function(){
    if(playing){clearInterval(simId);playing=false;var pb=byId('mwc-sim-play');if(pb)pb.textContent='▶ 자동 재생';}
    else{playing=true;var pb=byId('mwc-sim-play');if(pb)pb.textContent='⏸ 일시정지';simId=setInterval(function(){if(day>=60){clearInterval(simId);playing=false;var pb=byId('mwc-sim-play');if(pb)pb.textContent='▶ 자동 재생';}else step();},300);}
  });
  on('mwc-sim-close','click',function(){clearInterval(simId);closeModal();});
}
function updateSim(day,dist,states){
  var de=byId('mwc-sim-day');if(de)de.textContent=day+'일째';
  var dd=byId('mwc-sim-dist');if(dd)dd.innerHTML=buildBarChart(dist,states);
}
function showGuide(){
  openModal('<h3 style="margin:0 0 12px;">📖 사용법 — 마르코프 날씨 체인 도박</h3>'+
    '<p><strong>마르코프 체인:</strong> 내일 날씨는 오늘 날씨에만 의존합니다. 전이 확률 표를 보고 며칠 뒤 날씨를 예측해 베팅하세요!</p>'+
    '<ul style="padding-left:18px;"><li>📊 <strong>전이 확률 표</strong>: 오늘→내일 날씨 전이 확률</li>'+
    '<li>🌳 확률 트리로 n일 뒤 각 날씨의 확률을 계산하세요</li>'+
    '<li>🎯 예측 날씨에 포인트를 베팅, 낮은 확률일수록 고배당</li>'+
    '<li>💡 힌트 버튼으로 확률 트리 공개 (점수 감점)</li>'+
    '<li>📊 <strong>장기 관찰</strong>: 분포 수렴 현상 관찰</li></ul>'+
    '<div style="background:#faf5ff;border:1px solid #ddd6fe;border-radius:10px;padding:10px 12px;margin-top:8px;">'+
    '<strong>채점 기준</strong><br>베팅 적중: 확률 기반 배당 획득<br>힌트 사용: 포인트 감점<br>포인트 0이면 게임 종료<br>최종 포인트가 점수입니다!</div>'+
    '<button type="button" class="mwc-btn primary" id="mwc-guide-close" style="width:100%;margin-top:14px;">시작!</button>');
  on('mwc-guide-close','click',closeModal);
}
function closeModal(){var o=byId('mwc-modal-ov');if(o&&o.parentNode)o.parentNode.removeChild(o);}
function openModal(html){
  closeModal();
  var root=G.host?G.host.querySelector('.game-markov-weather-chain'):null;
  if(!root)root=document.getElementById('mwc-root');
  if(!root)return;
  var o=document.createElement('div');o.className='mwc-modal-overlay';o.id='mwc-modal-ov';
  o.innerHTML='<div class="mwc-modal">'+html+'</div>';
  o.addEventListener('click',function(ev){if(ev.target===o)closeModal();});
  root.appendChild(o);
}
var _ttid=null;
function toast(msg,type){
  var el=byId('mwc-toast');if(!el)return;
  el.textContent=msg;el.className='mwc-toast show'+(type?' '+type:'');
  if(_ttid)clearTimeout(_ttid);
  _ttid=setTimeout(function(){el.className='mwc-toast';},2500);
}
function byId(id){return document.getElementById(id);}
function setText(id,v){var el=byId(id);if(el)el.textContent=String(v);}
function on(id,ev,fn){var el=byId(id);if(el)el.addEventListener(ev,fn);}
function clearTids(){G.tids.forEach(function(t){clearTimeout(t);});G.tids=[];}
function bindEvents(){
  on('mwc-guide-btn','click',showGuide);
  on('mwc-sim-btn','click',openSimMode);
  on('mwc-home-btn','click',goHomeSafe);
  on('mwc-hint-btn','click',showHint);
  on('mwc-submit-btn','click',submitBet);
  on('mwc-next-btn','click',nextRound);
  ['easy','normal','hard'].forEach(function(d){on('mwc-d-'+d,'click',function(){startGame(d);});});
  on('mwc-p10','click',function(){setBet(0.1);});
  on('mwc-p25','click',function(){setBet(0.25);});
  on('mwc-p50','click',function(){setBet(0.5);});
  on('mwc-p100','click',function(){setBet(1);});
}
function setBet(ratio){
  var amt=Math.max(10,Math.floor(G.points*ratio));
  var el=byId('mwc-bet-amt');if(el)el.value=amt;
}
function startGame(d){
  G.diff=d||G.diff;
  var cfg=DIFF[G.diff];
  G.round=1;G.totalR=cfg.rounds;G.points=INIT_POINTS;G.phase='playing';
  G_hits=0;G_totalBets=0;
  ['easy','normal','hard'].forEach(function(x){
    var b=byId('mwc-d-'+x);if(b)b.className='mwc-diff-btn'+(x===G.diff?' active':'');
  });
  setText('mwc-hits','0 / 0');
  startRound();
  loadHOFFromServer();
}
function mount(container,context){
  var host=null;
  if(typeof container==='string'){try{host=document.querySelector(container);}catch(e){}}
  else if(container instanceof HTMLElement)host=container;
  if(!host||!(host instanceof HTMLElement))host=document.getElementById('mathlab-view')||document.getElementById('new-root');
  if(!host||!(host instanceof HTMLElement)||host===document.body){
    var ch=document.getElementById('markov-weather-chain-force-host');
    if(!ch){ch=document.createElement('div');ch.id='markov-weather-chain-force-host';document.body.appendChild(ch);}
    host=ch;
  }
  host.style.display='';host.style.visibility='visible';host.style.opacity='1';
  G.host=host;G.mounted=true;
  host.innerHTML=buildHTML();
  bindEvents();
  startGame('normal');
}
function destroy(){
  clearTids();closeModal();G.mounted=false;
  if(G.host){try{G.host.innerHTML='';}catch(e){}}G.host=null;
}
function goHomeSafe(){
  clearTids();closeModal();
  var mv=document.getElementById('mathlab-view');
  if(mv){mv.style.display='none';mv.innerHTML='';}
  var fh=document.getElementById('markov-weather-chain-force-host');
  if(fh){fh.style.display='none';fh.innerHTML='';}
  try{}catch(e){}
  if(typeof window.goHome==='function'){try{window.goHome();}catch(e){}}
}
var MarkovWeatherChain={mount:mount,resetGame:function(){startGame(G.diff);},destroy:destroy,goHome:goHomeSafe};
window.MarkovWeatherChain=MarkovWeatherChain;
function reg(){
  if(typeof window.MathLabGames!=='undefined'&&typeof window.MathLabGames.register==='function'){
    var ex=false;
    try{ex=typeof window.MathLabGames.get==='function'&&!!window.MathLabGames.get(AID);}catch(e){}
    if(!ex){
      try{
        window.MathLabGames.register({
          id:AID,title:ATITLE,icon:'🌦️',sourceType:'new',
          mount:function(c,ctx){MarkovWeatherChain.mount(c,ctx);},
          reset:function(){MarkovWeatherChain.resetGame();},
          destroy:function(){MarkovWeatherChain.destroy();},
          goHome:function(){MarkovWeatherChain.goHome();}
        });
      }catch(e){console.warn('[mwc] register 방어:',e);}
    }
  }
}
reg();
window.addEventListener('DOMContentLoaded',reg);
setTimeout(reg,100);setTimeout(reg,500);
window.initMarkovWeatherChainApp=function(){
  reg();
  if(window.LegacyBridge&&typeof window.LegacyBridge.hideAllLegacySections==='function'){
    window.LegacyBridge.hideAllLegacySections();
    if(typeof window.LegacyBridge.showNewRoot==='function')window.LegacyBridge.showNewRoot();
  }
  if(typeof window.MathLabGames!=='undefined'&&typeof window.MathLabGames.mount==='function'){
    try{window.MathLabGames.mount(AID);return;}catch(e){}
  }
  var t=document.getElementById('mathlab-view')||document.getElementById('new-root');
  MarkovWeatherChain.mount(t);
};
})();
</script>
