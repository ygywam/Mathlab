<script>
  // ==========================================
  // 🌟 [Gen-3 호환용] LegacyBridge 폴리필 (Polyfill)
  // 이전 1세대 브릿지 코드가 삭제되었으므로, 구버전 코드들과의 호환성을 유지하면서
  // 3세대 앱 진입/복귀 시 뷰(View)를 전환해주는 가벼운 엔진입니다.
  // ==========================================
  window.LegacyBridge = {
    hideAllLegacySections: function() {
      const legacyRoot = document.getElementById('legacy-root');
      if (legacyRoot) {
        legacyRoot.querySelectorAll('.view-section').forEach(function(section) {
          section.classList.remove('active');
          section.style.display = '';
        });
      }
    },
    showNewRoot: function() {
      const legacyRoot = document.getElementById('legacy-root');
      const mathlabRoot = document.getElementById('mathlab-root');
      if (legacyRoot) legacyRoot.classList.add('hidden');
      if (mathlabRoot) mathlabRoot.classList.remove('hidden');
    },
    showLegacyRoot: function() {
      const legacyRoot = document.getElementById('legacy-root');
      const mathlabRoot = document.getElementById('mathlab-root');
      if (mathlabRoot) mathlabRoot.classList.add('hidden');
      if (legacyRoot) legacyRoot.classList.remove('hidden');
    },
    backHome: function() {
      if (typeof goHome === 'function') goHome();
    }
  };

  // ==========================================
  // 1. 공통 라우팅 엔진 및 커스텀 알림창(Toast)
  // ==========================================
  function showToast(message, isError) {
  let toast =
    document.getElementById('mathlab-toast') ||
    document.getElementById('toast') ||
    document.getElementById('toast-message');

  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'mathlab-toast';
    toast.style.position = 'fixed';
    toast.style.left = '50%';
    toast.style.bottom = '32px';
    toast.style.transform = 'translateX(-50%)';
    toast.style.zIndex = '9999999';
    toast.style.maxWidth = '90vw';
    toast.style.padding = '14px 18px';
    toast.style.borderRadius = '999px';
    toast.style.fontSize = '0.95rem';
    toast.style.fontWeight = '700';
    toast.style.boxShadow = '0 10px 30px rgba(0,0,0,0.18)';
    toast.style.transition = 'opacity 0.2s ease, bottom 0.2s ease';
    document.body.appendChild(toast);
  }

  toast.innerText = message;
  toast.style.background = isError ? '#e74c3c' : '#2ecc71';
  toast.style.color = '#ffffff';
  toast.style.opacity = '1';
  toast.style.bottom = '32px';

  clearTimeout(window.__mathlabToastTimer);
  window.__mathlabToastTimer = setTimeout(function () {
    toast.style.opacity = '0';
    toast.style.bottom = '20px';
  }, 1800);
}

  function getFloatingHomeButton() {
  return (
    document.getElementById('mathlab-floating-home') ||
    document.getElementById('floating-home-btn')
  );
}

function showFloatingHomeButton() {
  const btn = getFloatingHomeButton();

  if(!btn) {
    return;
  }

  btn.classList.add('visible');
}

function hideFloatingHomeButton() {
  const btn = getFloatingHomeButton();

  if(!btn) {
    return;
  }

  btn.classList.remove('visible');
}

function setupFloatingHomeButton() {
  const btn = getFloatingHomeButton();

  if(!btn) {
    return;
  }

  btn.onclick = function() {
    if(typeof goHome === 'function') {
      goHome();
    }
  };
}
  // ==========================================
  // 🎵 [오디오 엔진] 레트로 8비트 효과음 생성기
  // ==========================================
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  
  function playTone(freq, type, duration, vol) {
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type; 
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + duration);
  }
  
  function playSound(type) {
    if(type === 'click') { playTone(600, 'sine', 0.1, 0.05); } // 가벼운 터치음
    else if(type === 'merge') { playTone(800, 'square', 0.1, 0.05); setTimeout(()=>playTone(1200, 'square', 0.15, 0.05), 100); } // 병합/블록생성음
    else if(type === 'correct') { playTone(523.25, 'sine', 0.1, 0.1); setTimeout(()=>playTone(659.25, 'sine', 0.1, 0.1), 100); setTimeout(()=>playTone(783.99, 'sine', 0.2, 0.1), 200); } // 정답 (도미솔)
    else if(type === 'wrong') { playTone(300, 'sawtooth', 0.2, 0.1); setTimeout(()=>playTone(250, 'sawtooth', 0.3, 0.1), 150); } // 오답 삐빅
    else if(type === 'gameover') { playTone(400, 'square', 0.3, 0.1); setTimeout(()=>playTone(350, 'square', 0.3, 0.1), 300); setTimeout(()=>playTone(300, 'square', 0.5, 0.1), 600); } // 쥬르륵
    else if(type === 'win') { playTone(523.25, 'square', 0.1, 0.1); setTimeout(()=>playTone(659.25, 'square', 0.1, 0.1), 150); setTimeout(()=>playTone(783.99, 'square', 0.1, 0.1), 300); setTimeout(()=>playTone(1046.50, 'square', 0.4, 0.1), 450); } // 승리 팡파레
  }

  function filterCategory(cat) {
    document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
    document.getElementById('cat-btn-' + cat).classList.add('active');
    
    document.querySelectorAll('.app-card').forEach(card => {
      if (cat === 'all' || card.getAttribute('data-category') === cat) {
        card.style.display = 'flex';
      } else {
        card.style.display = 'none';
      }
    });
  }

  // 🌟 화면 밖으로 나갈 때 모든 백그라운드 타이머/프레임 킬러
  function stopAllGames() {
    if (window.MathLabGames && typeof window.MathLabGames.destroyCurrent === 'function') {
      window.MathLabGames.destroyCurrent();
    }
    if(typeof guguActive !== 'undefined') guguActive = false; 
    if(typeof guguReqId !== 'undefined' && guguReqId) { cancelAnimationFrame(guguReqId); guguReqId = null; }
    if(typeof cleanupNumCountGame === 'function') {
  cleanupNumCountGame(true);
} else {
  if(typeof ncActive !== 'undefined') {
    ncActive = false;
  }

  if(typeof ncTimer !== 'undefined' && ncTimer) {
    clearInterval(ncTimer);
    ncTimer = null;
  }
}
    if(typeof cleanupMake24Game === 'function') {
  cleanupMake24Game(true);
} else {
  if(typeof make24Timer !== 'undefined' && make24Timer) {
    clearInterval(make24Timer);
    make24Timer = null;
  }
}
if(typeof cleanupWordleGame === 'function') {
  cleanupWordleGame(true);
}
// 🪓 소수 헌터 정리
if(typeof cleanupPrimeGame === 'function') {
  cleanupPrimeGame(true);
} else {
  if(typeof primeInterval1 !== 'undefined' && primeInterval1) {
    clearInterval(primeInterval1);
    primeInterval1 = null;
  }
  if(typeof primeInterval2 !== 'undefined' && primeInterval2) {
    clearInterval(primeInterval2);
    primeInterval2 = null;
  }
  if(typeof primeState !== 'undefined') {
    if(primeState[1]) primeState[1].life = 0;
    if(primeState[2]) primeState[2].life = 0;
  }
  document.querySelectorAll('.prime-target-el').forEach(function(el) {
    el.remove();
  });
}

// 🦋 대칭 매칭 정리
if(typeof cleanupSymmetryGame === 'function') {
  cleanupSymmetryGame(true);
} else {
  if(typeof symTimerId !== 'undefined' && symTimerId) {
    clearInterval(symTimerId);
    symTimerId = null;
  }
}
} // End of stopAllGames

function openApp(appId) {
  if (window.LegacyBridge && typeof window.LegacyBridge.showLegacyRoot === 'function') {
    window.LegacyBridge.showLegacyRoot();
  }

  stopAllGames();
  document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
  
  const targetEl = document.getElementById(appId);
  if (targetEl) {
    targetEl.classList.add('active');
    
    // 강제 모달 스타일 적용 (레거시 앱용 임시 처방)
    targetEl.style.position = 'fixed';
    targetEl.style.top = '0';
    targetEl.style.left = '0';
    targetEl.style.width = '100vw';
    targetEl.style.height = '100vh';
    targetEl.style.background = 'rgba(248, 250, 252, 0.95)';
    targetEl.style.backdropFilter = 'blur(8px)';
    targetEl.style.zIndex = '999999';
    targetEl.style.overflowY = 'auto';
    targetEl.style.padding = '20px';
    document.body.style.overflow = 'hidden';
  }
  
  window.scrollTo({ top: 0, left: 0, behavior: 'instant' });

  if(appId === 'mbti-app') { if(typeof restartTest === 'function') restartTest(); }
  else if(appId === 'coin-app') { if(typeof initCoinApp === 'function') initCoinApp(); }
  else if(appId === 'monty-app') { if(typeof initMonty === 'function') initMonty(); }
  else if(appId === 'trig-app') { if(typeof initTrigApp === 'function') initTrigApp(); }
  else if(appId === 'angle-app') { if(typeof initAngleApp === 'function') initAngleApp(); }
  else if(appId === 'survey-app') { if(typeof updateSurveyCos === 'function') { updateSurveyCos(); updateSurveySin(); } }
  else if(appId === 'finance-app') { if(typeof initFinanceApp === 'function') initFinanceApp(); }
  else if(appId === 'loan-app') { if(typeof initLoanApp === 'function') initLoanApp(); }
  else if(appId === 'poly-app') { if(typeof initPolyApp === 'function') initPolyApp(); }
  else if(appId === 'matrix-app') { if(typeof initMatrixApp === 'function') initMatrixApp(); }
  else if(appId === 'rat-irr-app') { if(typeof initRatIrrApp === 'function') initRatIrrApp(); }
  else if(appId === 'exp-log-app') { if(typeof initExpLogApp === 'function') initExpLogApp(); }
  else if(appId === 'tax-elec-app') { if(typeof initTaxElecApp === 'function') initTaxElecApp(); }
  else if(appId === 'poly-net-app') { if(typeof initPoly3DApp === 'function') initPoly3DApp(); }
  else if(appId === 'game-prime-app') {
    if(typeof cleanupPrimeGame === 'function') cleanupPrimeGame(true);
    if(typeof loadGameLeaderboard === 'function') loadGameLeaderboard('소수헌터', true, 'board-prime');
  }
  else if(appId === 'game-sym-app') { if(typeof initSymGame === 'function') initSymGame(); }
  else if(appId === 'game-make24-app') { if(typeof initMake24Game === 'function') initMake24Game(); }
  else if(appId === 'game-wordle-app') { if(typeof initWordleGame === 'function') initWordleGame(); }
  else if(appId === 'game-gugudan-app') { if(typeof initGugudanGame === 'function') initGugudanGame(); }
  else if(appId === 'game-numcount-app') { if(typeof initNumCountGame === 'function') initNumCountGame(); }
  else if(appId === 'ai-tutor-app' || appId === 'gemini-tutor') { if(window.MathLabGames) window.MathLabGames.mount('gemini-tutor'); }
  else if(appId === 'settings-app' || appId === 'settings') { if(window.MathLabGames) window.MathLabGames.mount('settings'); }
  else if(appId === 'version-app' || appId === 'version') { if(window.MathLabGames) window.MathLabGames.mount('version'); }
}

  function goHome() {
    stopAllGames(); // 🌟 대시보드 복귀 시 게임 정지 방어막 가동
    
    // 전역 모달 닫기
    const modalOverlay = document.getElementById('mathlab-global-modal-overlay');
    const modalContent = document.getElementById('mathlab-global-modal-content');
    if (modalOverlay) {
      modalOverlay.classList.add('hidden');
      document.body.style.overflow = '';
      if (modalContent) modalContent.innerHTML = '';
    }

    if (window.LegacyBridge) window.LegacyBridge.showNewRoot();
    if (typeof window.MathLabRenderHome === "function") window.MathLabRenderHome();
    const mathlabView = document.getElementById("mathlab-view");
    if(mathlabView) { mathlabView.style.display = ""; }
    window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
  }

  // ==========================================
  // ⚙️ 테마 시스템 및 로컬 환경 설정 로드
  // ==========================================
  function changeTheme(theme) {
    document.body.className = ''; 
    if(theme !== 'default') document.body.classList.add('theme-' + theme);
    localStorage.setItem('math_lab_theme', theme);
    showToast('🎨 디자인 테마가 변경되었습니다.');
  }

  window.onload = function() {
    const savedTheme = localStorage.getItem('math_lab_theme') || 'default';
    document.body.className = ''; 
    if(savedTheme !== 'default') document.body.classList.add('theme-' + savedTheme);

    const key = localStorage.getItem('math_lab_api_key');
    const sheet = localStorage.getItem('math_lab_sheet_id');
    if(!key || !sheet) setTimeout(() => showToast("⚙️ 설정 메뉴에서 AI 키와 시트 ID를 등록해 주세요.", true), 1000);

    if (typeof katex !== 'undefined') {
      document.querySelectorAll('.highlight-msg, .card-desc, .survey-result').forEach(el => {
        if(el.innerText.includes('$')) renderMathInElement(el, false);
      });
    }
  };



  // =======================================
  // 건드리지 마시오.
  // =======================================
  function renderMathInElement(el, preserveNewlines = true) {
    const text = el.innerText; const regex = /(\$\$[\s\S]*?\$\$|\$[\s\S]*?\$)/g; const parts = text.split(regex); el.innerHTML = '';
    parts.forEach(part => {
      if (part.startsWith('$$') && part.endsWith('$$')) { const span = document.createElement('div'); katex.render(part.slice(2, -2), span, { displayMode: true, throwOnError: false }); el.appendChild(span); }
      else if (part.startsWith('$') && part.endsWith('$')) { const span = document.createElement('span'); katex.render(part.slice(1, -1), span, { displayMode: false, throwOnError: false }); el.appendChild(span); }
      else { const span = document.createElement('span'); span.innerHTML = preserveNewlines ? part.replace(/\n/g, '<br>') : part; el.appendChild(span); }
    });
  }
  
  // ==========================================
  // 24. 💬 피드백 및 게시판 로직 (원본 비침범 업그레이드)
  // ==========================================
  const ADMIN_PASS = "5202";
  let isAdmin = false;

  // 🌟 Gen-3 논블로킹(Non-blocking) 다이얼로그 모듈
  function mathlabCustomConfirm(message, callback) {
    const modalHtml = `
      <div id="mathlab-custom-confirm-modal" style="position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(15,23,42,0.8); backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center; z-index:999999; padding:20px; box-sizing:border-box; font-family:'Pretendard',sans-serif;">
        <div style="background:#ffffff; border-radius:24px; padding:28px; max-width:360px; width:100%; box-shadow:0 20px 40px rgba(0,0,0,0.3); text-align:center;">
          <h3 style="margin:0 0 24px; font-size:1.15rem; color:#1e293b; line-height:1.5;">${message}</h3>
          <div style="display:flex; gap:10px;">
            <button id="custom-confirm-cancel" style="flex:1; padding:12px; border-radius:12px; font-size:1rem; font-weight:700; background:#e2e8f0; color:#475569; border:none; cursor:pointer;">취소</button>
            <button id="custom-confirm-ok" style="flex:1; padding:12px; border-radius:12px; font-size:1rem; font-weight:700; background:#ef4444; color:#ffffff; border:none; cursor:pointer;">확인</button>
          </div>
        </div>
      </div>
    `;
    document.body.insertAdjacentHTML('beforeend', modalHtml);
    document.getElementById('custom-confirm-cancel').onclick = () => { document.getElementById('mathlab-custom-confirm-modal').remove(); callback(false); };
    document.getElementById('custom-confirm-ok').onclick = () => { document.getElementById('mathlab-custom-confirm-modal').remove(); callback(true); };
  }

  function mathlabCustomPrompt(message, callback, isPassword = false) {
    const modalHtml = `
      <div id="mathlab-custom-prompt-modal" style="position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(15,23,42,0.8); backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center; z-index:999999; padding:20px; box-sizing:border-box; font-family:'Pretendard',sans-serif;">
        <div style="background:#ffffff; border-radius:24px; padding:28px; max-width:360px; width:100%; box-shadow:0 20px 40px rgba(0,0,0,0.3); text-align:center;">
          <h3 style="margin:0 0 16px; font-size:1.15rem; color:#1e293b; line-height:1.5;">${message}</h3>
          <input type="${isPassword ? 'password' : 'text'}" id="custom-prompt-input" style="width:100%; padding:12px; border-radius:12px; border:2px solid #cbd5e1; margin-bottom:20px; font-size:1rem; outline:none; text-align:center; box-sizing:border-box;" autocomplete="off">
          <div style="display:flex; gap:10px;">
            <button id="custom-prompt-cancel" style="flex:1; padding:12px; border-radius:12px; font-size:1rem; font-weight:700; background:#e2e8f0; color:#475569; border:none; cursor:pointer;">취소</button>
            <button id="custom-prompt-ok" style="flex:1; padding:12px; border-radius:12px; font-size:1rem; font-weight:700; background:#3b82f6; color:#ffffff; border:none; cursor:pointer;">확인</button>
          </div>
        </div>
      </div>
    `;
    document.body.insertAdjacentHTML('beforeend', modalHtml);
    const inputEl = document.getElementById('custom-prompt-input');
    inputEl.focus();
    const finish = (isOk) => {
      const val = inputEl.value;
      document.getElementById('mathlab-custom-prompt-modal').remove();
      callback(isOk ? val : null);
    };
    document.getElementById('custom-prompt-cancel').onclick = () => finish(false);
    document.getElementById('custom-prompt-ok').onclick = () => finish(true);
    inputEl.onkeydown = (e) => { if (e.key === 'Enter') finish(true); };
  }

  function toggleAdminMode() {
    const btn = document.getElementById('btn-admin-toggle');
    if (isAdmin) {
      isAdmin = false;
      if (btn) { btn.innerText = "관리자 로그인"; btn.style.background = "#34495e"; }
      showToast("🔒 관리자 모드가 해제되었습니다.");
      loadFeedbackBoard();
      return;
    }
    mathlabCustomPrompt("🔐 관리자 비밀번호를 입력해 주세요:", (inputPass) => {
      if (inputPass === null) return;
      if (inputPass === ADMIN_PASS) {
        isAdmin = true;
        if (btn) { btn.innerText = "🔓 관리자 로그아웃 (ON)"; btn.style.background = "#e67e22"; }
        showToast("🎉 관리자 로그인 성공! 삭제 및 답변 달기 버튼이 표시됩니다.");
        loadFeedbackBoard();
      } else {
        showToast("❌ 비밀번호가 일치하지 않습니다.", true);
      }
    }, true);
  }

  function submitFeedback() {
    const sheetId = '';
    const inputEl = document.getElementById('feedback-input');
    if (!inputEl) return;
    const text = inputEl.value.trim();
    if (!text) { showToast("내용을 입력하세요.", true); return; }

    const school = localStorage.getItem('math_lab_school_name') || '';
    const gradeClass = localStorage.getItem('math_lab_class_name') || '';
    const nickname = localStorage.getItem('math_lab_nickname') || localStorage.getItem('math_lab_user_nickname') || '';
    let infoParts = [];
    if (school) infoParts.push(school);
    if (gradeClass) infoParts.push(gradeClass);
    if (nickname) infoParts.push(nickname);

    let fullContent = text;
    if (infoParts.length > 0) fullContent = `[👤 ${infoParts.join(' / ')}]\n${text}`;

    inputEl.value = '';
    showToast("의견을 서버로 전송 중입니다...");
    google.script.run
      .withSuccessHandler(() => {
        showToast("🎉 소중한 의견 감사합니다!");
        setTimeout(() => loadFeedbackBoard(), 500);
      })
      .withFailureHandler(err => {
        showToast("전송 실패: " + (err.message || ''), true);
      })
      .saveFeedback(sheetId, fullContent);
  }

  // 🌟 배지 표시/숨김 제어 공통 함수
  function updateFeedbackBadge(hasUnanswered) {
    const badge = document.getElementById('feedback-new-badge');
    if (badge) {
      badge.style.display = hasUnanswered ? 'inline-block' : 'none';
    }
  }

  // 🌟 대시보드 진입(로딩) 시 자동으로 미답변 게시글 검사
  function checkUnansweredFeedback() {
    if (typeof google === 'undefined' || !google.script || !google.script.run) return;
    google.script.run
      .withSuccessHandler(r => {
        if (r && r.success && Array.isArray(r.data)) {
          // 답변이 없거나 빈 문자열인 게시글이 하나라도 있는지 확인
          const hasUnanswered = r.data.some(item => !item.reply || String(item.reply).trim() === '');
          updateFeedbackBadge(hasUnanswered);
        }
      })
      .getFeedbackList('');
  }

  // 페이지 로드 시 3초 뒤에 백그라운드로 미답변 게시글 감지 (초기 로딩 속도 저하 방지)
  window.addEventListener('DOMContentLoaded', () => {
    setTimeout(checkUnansweredFeedback, 3000);
  });

  // 🌟 기존 loadFeedbackBoard 함수 교체 (데이터 로딩과 동시에 배지 업데이트)
  function loadFeedbackBoard() {
    const sheetId = ''; 
    const list = document.getElementById('feedback-list'); 
    if (!list) return;
    list.innerHTML = '게시판 데이터를 불러오는 중...';
    
    google.script.run
      .withSuccessHandler(r => {
        if (r && r.success) {
          list.innerHTML = '';
          if (r.data.length === 0) {
            list.innerHTML = '아직 등록된 의견이 없습니다.';
            updateFeedbackBadge(false);
            return;
          }

          // 🌟 미답변 여부 체크 후 배지 갱신
          const hasUnanswered = r.data.some(item => !item.reply || String(item.reply).trim() === '');
          updateFeedbackBadge(hasUnanswered);

          r.data.forEach(item => {
            let div = document.createElement('div');
            div.style = 'background:#f8f9fa; padding:15px; border-radius:8px; margin-bottom:10px; border-left:4px solid ' + (item.reply ? '#2ecc71' : '#3498db') + '; text-align:left;';
            let replyHtml = item.reply ? `<div style="margin-top:10px; padding:10px; background:#e8f0fe; border-radius:5px; font-size:0.9rem; color:#2c3e50;"><strong>관리자 답변:</strong> ${item.reply}</div>` : `<div style="margin-top:8px; font-size:0.82rem; color:#e67e22; font-weight:bold;">⌛ 관리자 답변을 기다리고 있습니다.</div>`;
            
            let adminBtns = '';
            if (typeof isAdmin !== 'undefined' && isAdmin) {
              adminBtns = `<div style="margin-top:10px; display:flex; gap:8px;">
                <button onclick="addAdminReply(${item.row})" style="padding:6px 12px; background:#3498db; color:white; border:none; border-radius:4px; cursor:pointer; font-size:0.8rem;">💬 답변 달기</button>
                <button onclick="deleteFeedbackItem(${item.row})" style="padding:6px 12px; background:#e74c3c; color:white; border:none; border-radius:4px; cursor:pointer; font-size:0.8rem;">🗑️ 삭제</button>
              </div>`;
            }

            div.innerHTML = `<div style="font-size:0.8rem; color:#7f8c8d; margin-bottom:5px;">${item.date}</div><div style="font-size:1rem; color:#2d3436; font-weight:600;">${item.text}</div>${replyHtml}${adminBtns}`;
            list.appendChild(div);
          });
        } else {
          list.innerHTML = '게시판 데이터를 불러오는데 실패했습니다.' + (r && r.error ? '<br>' + r.error : '');
        }
      })
      .withFailureHandler(err => {
        list.innerHTML = `<p style="color:#e74c3c;">통신 오류! 스크립트 새 버전 배포를 확인하세요.</p>`;
      })
      .getFeedbackList(sheetId);
  }

  function deleteFeedbackItem(rowIndex) {
    mathlabCustomConfirm("정말 이 피드백을 삭제하시겠습니까?", (isOk) => {
      if (!isOk) return;
      const sheetId = '';
      google.script.run
        .withSuccessHandler((r) => {
          if (r && r.success) {
            showToast("🗑️ 게시글이 삭제되었습니다.");
            setTimeout(() => loadFeedbackBoard(), 500);
          } else {
            showToast("삭제 실패: " + (r ? r.error : "알 수 없는 오류"), true);
          }
        })
        .withFailureHandler(err => {
          showToast("삭제 실패: " + (err.message || ''), true);
        })
        .deleteFeedbackItem(sheetId, rowIndex);
    });
  }

  function addAdminReply(rowIndex) {
    mathlabCustomPrompt("👨🏫 이 피드백에 등록할 관리자 답변을 입력하세요:", (replyText) => {
      if (!replyText) return;
      const sheetId = '';
      google.script.run
        .withSuccessHandler((r) => {
          if (r && r.success) {
            showToast("💬 답변이 등록되었습니다!");
            setTimeout(() => loadFeedbackBoard(), 500);
          } else {
            showToast("답변 등록 실패: " + (r ? r.error : "알 수 없는 오류"), true);
          }
        })
        .withFailureHandler(err => {
          showToast("답변 등록 실패: " + (err.message || ''), true);
        })
        .replyFeedback(sheetId, rowIndex, replyText);
    });
  }

function getLeaderboardMeta() {
  return {
    schoolLevel: localStorage.getItem('math_lab_school_level') || '',
    schoolName: localStorage.getItem('math_lab_school_name') || '',
    className: localStorage.getItem('math_lab_class_name') || ''
  };
}

  function loadGameLeaderboard(gameName, isDesc, boardId) {
  const board = document.getElementById(boardId);

  if (!board) {
    console.error('[loadGameLeaderboard] board 요소를 찾지 못함:', boardId);
    return;
  }

  board.innerHTML = '<p class="ranking-empty">로딩 중...</p>';

  const sheetId = getLeaderboardSheetId();

  console.log('[loadGameLeaderboard 호출]', {
    sheetId,
    gameName,
    isDesc,
    boardId
  });

  google.script.run
    .withSuccessHandler(function(result) {
      console.log('[getGameLeaderboard 성공]', result);

      try {
        if (!result || result.success === false) {
          board.innerHTML = '<p class="ranking-empty">랭킹을 불러오지 못했습니다.</p>';
          console.error('[getGameLeaderboard 실패 응답]', result);
          return;
        }

        const rows = Array.isArray(result.data) ? result.data : [];

        console.log('[leaderboard rows]', rows);

        renderLeaderboard(rows, boardId);
      } catch (error) {
        console.error('[renderLeaderboard 처리 오류]', error);
        board.innerHTML = '<p class="ranking-empty">랭킹 표시 중 오류가 발생했습니다.</p>';
      }
    })
    .withFailureHandler(function(error) {
      console.error('[getGameLeaderboard 서버 호출 오류]', error);

      board.innerHTML = `
        <p class="ranking-empty">
          랭킹을 불러오지 못했습니다.<br>
          ${error && error.message ? error.message : error}
        </p>
      `;
    })
    .getGameLeaderboard(sheetId, gameName, isDesc);
}

function renderLeaderboard(rows, boardId) {
  const board = document.getElementById(boardId);

  if (!board) {
    console.error('[renderLeaderboard] board 요소를 찾지 못함:', boardId);
    return;
  }

  if (!rows || rows.length === 0) {
    board.innerHTML = '<p class="ranking-empty">아직 등록된 랭킹이 없습니다.</p>';
    return;
  }

  const topRows = rows.slice(0, 5);

  board.innerHTML = `
    <div class="leaderboard-list">
      ${topRows.map(function(row, index) {
        const rank = index + 1;
        const schoolName = row.schoolName || '학교 미입력';
        const className = row.className || '학년/반 미입력';
        const nickname = row.nickname || '익명';
        const score = row.score || 0;

        return `
          <div class="leaderboard-item">
            <div class="leaderboard-main">
              <span class="rank">${rank}위</span>
              <span class="school-name">${schoolName}</span>
              <span class="class-name">${className}</span>
              <span class="nickname">${nickname}</span>
              <span class="score">${score}점</span>
            </div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

function submitRanking(gameName, score, isDesc, inputId, boardId) {
    let nickname = "";
    if (typeof inputId === 'object' && inputId.value) { nickname = inputId.value.trim(); } 
    else if (typeof inputId === 'string' && document.getElementById(inputId)) { nickname = document.getElementById(inputId).value.trim(); } 
    else if (typeof inputId === 'string') { nickname = inputId.trim(); }

    if(!nickname) { showToast("닉네임을 입력해 주세요!", true); return; }
    showToast("점수를 기록 중입니다...");

    if (window.MathLabFirebase && typeof window.MathLabFirebase.submitScore === 'function') {
      window.MathLabFirebase.submitScore(gameName, nickname, score);
    }
    
    showToast(`🎉 명예의 전당 등록 완료! (${nickname}: ${score}점)`);
    if(typeof inputId === 'string' && document.getElementById(inputId)) document.getElementById(inputId).value = ''; 
    
    if (typeof loadGameLeaderboard === 'function') {
      loadGameLeaderboard(gameName, isDesc, boardId); 
    }
}

// 🌟 학교 정보 필수 입력 강제 모달 팝업
function showRequiredSchoolModal(gameName, score, isDesc, inputId, boardId) {
    // 기존에 열려있는 모달이 있다면 제거
    const oldModal = document.getElementById('required-school-modal');
    if (oldModal) oldModal.remove();

    const curLevel = localStorage.getItem('math_lab_school_level') || '';
    const curSchool = localStorage.getItem('math_lab_school_name') || '';
    const curClass = localStorage.getItem('math_lab_class_name') || '';

    const modalHtml = `
      <div id="required-school-modal" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.75); z-index:999999; display:flex; align-items:center; justify-content:center; backdrop-filter:blur(4px);">
        <div style="background:#1e293b; border:3px solid #38bdf8; border-radius:20px; padding:28px; width:90%; max-width:420px; color:#f8fafc; box-shadow:0 20px 50px rgba(0,0,0,0.8); font-family:sans-serif;">
          <h3 style="margin:0 0 8px 0; font-size:1.3rem; color:#38bdf8; display:flex; align-items:center; gap:8px;">
            <span>🏫</span> 학교 정보 필수 설정
          </h3>
          <p style="margin:0 0 20px 0; font-size:0.9rem; color:#cbd5e1; line-height:1.4;">
            명예의 전당 랭킹 등록을 위해 소속 정보를 입력해주세요. (최초 1회만 입력하면 이후 자동 적용됩니다.)
          </p>
          
          <div style="margin-bottom:14px; text-align:left;">
            <label style="display:block; font-size:0.85rem; color:#94a3b8; margin-bottom:6px; font-weight:bold;">학교 구분</label>
            <select id="req-school-level" style="width:100%; padding:10px; border-radius:10px; border:2px solid #475569; background:#0f172a; color:#fff; font-size:0.95rem;">
              <option value="" disabled ${!curLevel ? 'selected' : ''}>-- 학교 구분 선택 --</option>
              <option value="초등학교" ${curLevel === '초등학교' ? 'selected' : ''}>초등학교</option>
              <option value="중학교" ${curLevel === '중학교' ? 'selected' : ''}>중학교</option>
              <option value="고등학교" ${curLevel === '고등학교' ? 'selected' : ''}>고등학교</option>
              <option value="일반/기타" ${curLevel === '일반/기타' ? 'selected' : ''}>일반 / 기타</option>
            </select>
          </div>

          <div style="margin-bottom:14px; text-align:left;">
            <label style="display:block; font-size:0.85rem; color:#94a3b8; margin-bottom:6px; font-weight:bold;">학교 이름</label>
            <input type="text" id="req-school-name" placeholder="예: 한국과학영재학교" value="${curSchool}" style="width:100%; padding:10px; border-radius:10px; border:2px solid #475569; background:#0f172a; color:#fff; font-size:0.95rem; box-sizing:border-box;" />
          </div>

          <div style="margin-bottom:24px; text-align:left;">
            <label style="display:block; font-size:0.85rem; color:#94a3b8; margin-bottom:6px; font-weight:bold;">학년 · 반</label>
            <input type="text" id="req-class-name" placeholder="예: 1학년 3반" value="${curClass}" style="width:100%; padding:10px; border-radius:10px; border:2px solid #475569; background:#0f172a; color:#fff; font-size:0.95rem; box-sizing:border-box;" />
          </div>

          <div style="display:flex; gap:10px;">
            <button id="req-school-cancel" style="flex:1; padding:12px; border-radius:12px; border:none; background:#475569; color:#fff; font-weight:bold; cursor:pointer;">취소</button>
            <button id="req-school-save" style="flex:2; padding:12px; border-radius:12px; border:none; background:linear-gradient(135deg, #0284c7, #2563eb); color:#fff; font-weight:bold; cursor:pointer; box-shadow:0 4px 14px rgba(37,99,235,0.4);">💾 저장 후 점수 등록</button>
          </div>
        </div>
      </div>
    `;

    document.body.insertAdjacentHTML('beforeend', modalHtml);

    document.getElementById('req-school-cancel').onclick = () => {
      document.getElementById('required-school-modal').remove();
      showToast("학교 정보 미입력으로 점수 등록이 취소되었습니다.", true);
    };

    document.getElementById('req-school-save').onclick = () => {
      const level = document.getElementById('req-school-level').value;
      const name = document.getElementById('req-school-name').value.trim();
      const cls = document.getElementById('req-class-name').value.trim();

      // 1. 빈칸 검증 (alert 대신 고급스러운 showToast 적용)
      if (!level || !name || !cls) {
        showToast("⚠️ 학교 구분, 학교 이름, 학년·반 정보를 모두 입력해주세요!", true);
        return;
      }

      // 2. 로컬스토리지에 학교 정보 저장
      localStorage.setItem('math_lab_school_level', level);
      localStorage.setItem('math_lab_school_name', name);
      localStorage.setItem('math_lab_class_name', cls);

      // 3. 모달 닫기
      document.getElementById('required-school-modal').remove();

      // 🌟 [추가된 닉네임 확인 로직] 게임 화면의 inputId 칸에서 닉네임 추출 시도
      let nickname = "";
      if (typeof inputId === 'object' && inputId.value) { nickname = inputId.value.trim(); } 
      else if (typeof inputId === 'string' && document.getElementById(inputId)) { nickname = document.getElementById(inputId).value.trim(); } 
      else if (typeof inputId === 'string') { nickname = inputId.trim(); }

      // 🌟 닉네임이 비어있다면 자연스럽게 다음 행동 안내 후 종료
      if (!nickname) {
        showToast("🏫 학교 정보가 저장되었습니다! 게임 화면에서 닉네임을 입력 후 [기록 등록]을 한번 더 눌러주세요.", true);
        return;
      }

      // 4. 닉네임까지 잘 적혀있다면 중단했던 명예의 전당 등록 함수 바로 실행!
      showToast("🏫 학교 정보가 저장되었습니다! 점수를 등록합니다.");
      submitRanking(gameName, score, isDesc, inputId, boardId);
    };
}

  function getLeaderboardSheetId() {
  try {
    const mode = localStorage.getItem('math_lab_leaderboard_storage_mode') || 'default';

    if (mode === 'personal') {
      return localStorage.getItem('math_lab_sheet_id') || '';
    }

    return '';
  } catch (error) {
    console.warn('[getLeaderboardSheetId] localStorage 접근 실패, 기본 시트 사용', error);
    return '';
  }
}

  // ==========================================
// 🌟 스크롤 이벤트: 플로팅 홈 버튼 표시
// ==========================================
window.addEventListener('scroll', () => {
  const floatBtn =
    document.getElementById('mathlab-floating-home') ||
    document.getElementById('floating-home-btn');

  if (!floatBtn) return;

  if (window.scrollY > 300) {
    floatBtn.classList.add('visible');
  } else {
    floatBtn.classList.remove('visible');
  }
});

window.openFeedbackModal = function() {
  document.getElementById('feedback-modal-backdrop')?.remove();
  
  const div = document.createElement('div');
  div.id = 'feedback-modal-backdrop';
  div.style.cssText = 'position:fixed; inset:0; background:rgba(255, 255, 255, 0.85); backdrop-filter:blur(6px); z-index:999998; display:flex; align-items:center; justify-content:center; padding:20px; box-sizing:border-box;';
  
  div.innerHTML = `
    <div style="background:#ffffff; border:2px solid #3b82f6; border-radius:24px; padding:28px 24px; max-width:600px; width:100%; max-height:88vh; display:flex; flex-direction:column; box-shadow:0 24px 48px rgba(0,0,0,0.5); position:relative;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 20px; flex-shrink:0;">
        <h2 style="margin:0; font-size:1.8rem; font-weight:900; color:#0f172a;">💬 소통 창구 (피드백)</h2>
        <div style="display:flex; gap:10px;">
          <button id="btn-admin-toggle" onclick="toggleAdminMode()" style="background:#334155; border:1px solid #475569; color:#cbd5e1; padding:8px 12px; border-radius:8px; font-size:0.85rem; cursor:pointer; transition:all 0.2s;">관리자 로그인</button>
          <button id="feedback-modal-close" style="background:transparent; border:none; color:#64748b; font-size:1.5rem; cursor:pointer; padding:0; line-height:1;">&#x2715;</button>
        </div>
      </div>
      
      <p style="text-align:left; font-size:1rem; color:#475569; margin-bottom:20px; flex-shrink:0;">버그 신고, 게임 아이디어, 건의사항을 자유롭게 남겨주세요!</p>
      
      <div style="display:flex; gap:10px; margin-bottom: 20px; flex-shrink:0;">
        <input type="text" id="feedback-input" placeholder="여기에 의견을 남겨주세요..." style="flex:1; padding:14px 18px; border-radius:12px; border:1px solid #475569; background:#f1f5f9; color:#0f172a; font-size:1.05rem; outline:none;">
        <button onclick="submitFeedback()" style="background:#3b82f6; color:#ffffff; border:none; padding:0 25px; border-radius:12px; font-weight:800; cursor:pointer; font-size:1.05rem; box-shadow:0 4px 12px rgba(59,130,246,0.3); transition:background 0.2s;">전송</button>
      </div>
      
      <button onclick="loadFeedbackBoard()" style="background:transparent; border:1px solid #475569; color:#64748b; padding:10px 16px; border-radius:10px; font-size:0.9rem; cursor:pointer; margin-bottom:15px; width:100%; transition:all 0.2s; flex-shrink:0;">🔄 게시판 새로고침</button>
      
      <div id="feedback-list" style="overflow-y:auto; flex:1; padding-right:10px; color:#475569; text-align:left; font-size:0.95rem;"></div>
    </div>
  `;
  
  document.body.appendChild(div);
  
  div.querySelector('#feedback-modal-close')?.addEventListener('click', () => div.remove());
  
  const input = div.querySelector('#feedback-input');
  if (input) {
    input.addEventListener('focus', () => { input.style.borderColor = '#0284c7'; input.style.boxShadow = '0 0 12px rgba(56,189,248,0.3)'; });
    input.addEventListener('blur', () => { input.style.borderColor = '#475569'; input.style.boxShadow = 'none'; });
    input.addEventListener('keypress', (e) => {
      if(e.key === 'Enter') submitFeedback();
    });
  }

  setTimeout(() => {
    if (typeof loadFeedbackBoard === 'function') {
      loadFeedbackBoard();
    }
  }, 100);
};
</script>
