  resetRun: function() {
    clearTimers();
    S.finished = false;
    S.round = 1;
    S.score = 0;
    S.combo = 0;
    this.setupStage();
  },

  setupStage: function() {
    G.tries = 0;
    G.asymptote = false;
    S.hintUsed = false;

    if (S.round <= 2 && S.diff !== 'hard') {
      G.type = 'circle';
      G.r = 1.5 + Math.random();
      G.h = Math.random() * 1.2 - 0.6;
      G.k = Math.random() * 1.2 - 0.6;
      G.targets = [
        { x: G.h + G.r, y: G.k },
        { x: G.h, y: G.k + G.r },
        { x: G.h - G.r * 0.7, y: G.k - G.r * 0.7 }
      ];
      G.r = 1.20; G.h = 0.00; G.k = 0.00;
    } else if (S.round <= 4 || S.diff === 'easy') {
      G.type = 'ellipse';
      G.a = 2.0 + Math.random() * 0.8;
      G.b = 1.0 + Math.random() * 0.6;
      G.h = 0; G.k = 0;
      G.targets = [
        { x: G.a, y: 0 },
        { x: 0, y: G.b },
        { x: -G.a * 0.6, y: G.b * Math.sqrt(1 - 0.36) }
      ];
      G.a = 1.50; G.b = 1.50;
    } else {
      G.type = 'hyperbola';
      G.a = 1.20; G.b = 1.00;
      G.targets = [
        { x: 2.2, y: 1.4 },
        { x: 2.5, y: -1.6 },
        { x: -2.3, y: 1.5 }
      ];
      G.a = 1.00; G.b = 1.50;
    }

    var root = S.host.querySelector('#il-app-root');
    if (root) {
      root.querySelector('#lbl-curve-type').textContent = G.type === 'circle' ? '원' : (G.type === 'ellipse' ? '타원' : '쌍곡선');
      root.querySelector('#lbl-game-msg').innerHTML = '파라미터를 조절한 뒤 레이저를 발사해 모든 별을 통과시키세요.';
    }

    this.syncSliders();
    this.hud();
    this.drawCanvas();
  },

  syncSliders: function() {
    var _this = this;
    var root = S.host.querySelector('#il-app-root');
    if (!root) return;
    var box = root.querySelector('#il-sliders-box');
    if (!box) return;

    var h = '';
    if (G.type === 'circle') {
      h += '<div class="slider-item"><div class="slider-label"><span>반지름 (r): <b id="lbl-r-val">' + G.r.toFixed(2) + '</b></span></div><input type="range" class="slider" id="rng-r" min="0.5" max="3.5" step="0.01" value="' + G.r + '"></div>';
      h += '<div class="slider-item"><div class="slider-label"><span>중심 x (h): <b id="lbl-h-val">' + G.h.toFixed(2) + '</b></span></div><input type="range" class="slider" id="rng-h" min="-2.0" max="2.0" step="0.01" value="' + G.h + '"></div>';
      h += '<div class="slider-item"><div class="slider-label"><span>중심 y (k): <b id="lbl-k-val">' + G.k.toFixed(2) + '</b></span></div><input type="range" class="slider" id="rng-k" min="-2.0" max="2.0" step="0.01" value="' + G.k + '"></div>';
    } else {
      h += '<div class="slider-item"><div class="slider-label"><span>x축 계수 (a): <b id="lbl-a-val">' + G.a.toFixed(2) + '</b></span></div><input type="range" class="slider" id="rng-a" min="0.5" max="3.5" step="0.01" value="' + G.a + '"></div>';
      h += '<div class="slider-item"><div class="slider-label"><span>y축 계수 (b): <b id="lbl-b-val">' + G.b.toFixed(2) + '</b></span></div><input type="range" class="slider" id="rng-b" min="0.5" max="3.5" step="0.01" value="' + G.b + '"></div>';
    }

    box.innerHTML = h;

    function bind(id, key, lblId) {
      var el = box.querySelector('#' + id);
      if (!el) return;
      el.oninput = function() {
        G[key] = Math.round(parseFloat(this.value) * 100) / 100;
        var lbl = box.querySelector('#' + lblId);
        if (lbl) lbl.textContent = G[key].toFixed(2);
        _this.hud();
        _this.drawCanvas();
      };
      el.onwheel = function(e) {
        e.preventDefault();
        var delta = e.deltaY < 0 ? 0.01 : -0.01;
        var nVal = Math.round((G[key] + delta) * 100) / 100;
        G[key] = Math.max(0.1, nVal);
        el.value = G[key];
        var lbl = box.querySelector('#' + lblId);
        if (lbl) lbl.textContent = G[key].toFixed(2);
        _this.hud();
        _this.drawCanvas();
      };
    }

    if (G.type === 'circle') {
      bind('rng-r', 'r', 'lbl-r-val');
      bind('rng-h', 'h', 'lbl-h-val');
      bind('rng-k', 'k', 'lbl-k-val');
    } else {
      bind('rng-a', 'a', 'lbl-a-val');
      bind('rng-b', 'b', 'lbl-b-val');
    }
  },

  hud: function() {
    var root = S.host.querySelector('#il-app-root');
    if (!root) return;

    root.querySelector('#lbl-round').textContent = S.round;
    root.querySelector('#lbl-score').textContent = S.score;
    root.querySelector('#lbl-combo').textContent = S.combo;

    var mathStr = '';
    if (G.type === 'circle') {
      mathStr = '(x ' + (G.h >= 0 ? '- ' + G.h.toFixed(2) : '+ ' + Math.abs(G.h).toFixed(2)) + ')^2 + (y ' + (G.k >= 0 ? '- ' + G.k.toFixed(2) : '+ ' + Math.abs(G.k).toFixed(2)) + ')^2 = ' + G.r.toFixed(2) + '^2';
    } else if (G.type === 'ellipse') {
      mathStr = '\\frac{x^2}{' + G.a.toFixed(2) + '^2} + \\frac{y^2}{' + G.b.toFixed(2) + '^2} = 1';
    } else {
      mathStr = '\\frac{x^2}{' + G.a.toFixed(2) + '^2} - \\frac{y^2}{' + G.b.toFixed(2) + '^2} = 1';
    }

    var mathEl = root.querySelector('#lbl-math-eq');
    if (mathEl) {
      mathEl.setAttribute('data-tex', mathStr);
      renderMath(mathStr, mathEl, true);
    }
  },

  onCurve: function(x, y) {
    if (G.type === 'circle') {
      var v = (x - G.h) * (x - G.h) + (y - G.k) * (y - G.k) - G.r * G.r;
      return Math.abs(v) < 0.35 * G.r;
    }
    if (G.type === 'ellipse') {
      return Math.abs((x * x) / (G.a * G.a) + (y * y) / (G.b * G.b) - 1) < 0.25;
    }
    return Math.abs((x * x) / (G.a * G.a) - (y * y) / (G.b * G.b) - 1) < 0.3;
  },

  drawCanvas: function(laserT) {
    var root = S.host.querySelector('#il-app-root');
    if (!root) return;
    var cv = root.querySelector('#il-cv');
    if (!cv) return;
    var ctx = cv.getContext('2d');

    ctx.clearRect(0, 0, CW, CH);
    ctx.fillStyle = '#0b1220';
    ctx.fillRect(0, 0, CW, CH);

    // [수정] 가로/세로 1:1 비율을 유지하기 위한 스케일 계산
    var pad = 30;
    var R = 4; // 좌표계의 기본 범위 (y축 기준 -R ~ R)
    var scale = (CH - pad * 2) / (2 * R); // 1 unit 당 픽셀 수 (가로, 세로 동일 적용)
    
    var centerX = CW / 2;
    var centerY = CH / 2;

    function X(x) { return centerX + x * scale; }
    function Y(y) { return centerY - y * scale; }

    // Grid Axes
    ctx.strokeStyle = '#1e293b';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(pad, Y(0)); ctx.lineTo(CW - pad, Y(0));
    ctx.moveTo(X(0), pad); ctx.lineTo(X(0), CH - pad);
    ctx.stroke();

    // Hyperbola Asymptote Lines
    if (G.asymptote && G.type === 'hyperbola') {
      ctx.strokeStyle = '#fbbf24';
      ctx.setLineDash([5, 4]);
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(X(-R), Y(-(G.b / G.a) * R)); ctx.lineTo(X(R), Y((G.b / G.a) * R));
      ctx.moveTo(X(-R), Y((G.b / G.a) * R)); ctx.lineTo(X(R), Y(-(G.b / G.a) * R));
      ctx.stroke();
      ctx.setLineDash([]);
    }

    // Laser Curve Path
    ctx.strokeStyle = '#38bdf8';
    ctx.lineWidth = 3;
    ctx.beginPath();
    var first = true;

    if (G.type === 'circle') {
      for (var t = 0; t <= Math.PI * 2 + 0.01; t += 0.02) {
        var cx = G.h + G.r * Math.cos(t), cy = G.k + G.r * Math.sin(t);
        if (first) { ctx.moveTo(X(cx), Y(cy)); first = false; }
        else ctx.lineTo(X(cx), Y(cy));
      }
    } else if (G.type === 'ellipse') {
      for (var t2 = 0; t2 <= Math.PI * 2 + 0.01; t2 += 0.02) {
        var ex = G.a * Math.cos(t2), ey = G.b * Math.sin(t2);
        if (first) { ctx.moveTo(X(ex), Y(ey)); first = false; }
        else ctx.lineTo(X(ex), Y(ey));
      }
    } else {
      for (var s = -2.5; s <= 2.5; s += 0.03) {
        var hx1 = G.a * Math.cosh(s), hy1 = G.b * Math.sinh(s);
        if (s === -2.5) ctx.moveTo(X(hx1), Y(hy1));
        else ctx.lineTo(X(hx1), Y(hy1));
      }
      ctx.stroke();
      ctx.beginPath();
      first = true;
      for (var s2 = -2.5; s2 <= 2.5; s2 += 0.03) {
        var hx2 = -G.a * Math.cosh(s2), hy2 = G.b * Math.sinh(s2);
        if (first) { ctx.moveTo(X(hx2), Y(hy2)); first = false; }
        else ctx.lineTo(X(hx2), Y(hy2));
      }
    }
    ctx.stroke();

    // Target Stars
    var _this = this;
    G.targets.forEach(function(p, i) {
      ctx.fillStyle = '#facc15';
      ctx.font = '22px sans-serif';
      ctx.fillText('★', X(p.x) - 10, Y(p.y) + 8);
      if (typeof laserT === 'number' && laserT > i && _this.onCurve(p.x, p.y)) {
        ctx.strokeStyle = '#4ade80';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(X(p.x), Y(p.y), 14, 0, Math.PI * 2);
        ctx.stroke();
      }
    });
  },

  fire: function() {
    if (S.finished) return;
    G.tries++;
    var _this = this;
    var pass = 0;
    G.targets.forEach(function(p) { if (_this.onCurve(p.x, p.y)) pass++; });

    var step = 0;
    function anim() {
      _this.drawCanvas(step);
      step++;
      if (step <= G.targets.length) {
        later(anim, 220);
      } else {
        var root = S.host.querySelector('#il-app-root');
        if (pass >= G.targets.length) {
          _this.addScore(20 + Math.max(0, 5 - G.tries) * 2, '모든 타겟 통과');
          if (root) root.querySelector('#lbl-game-msg').innerHTML = '🎉 <b>조준 관통 성공!</b> 모든 목표 별을 음함수 레이저로 관통했습니다.';
          later(function() {
            if (S.round >= TOTAL_ROUNDS) _this.finishRun();
            else {
              S.round++;
              _this.hud();
              _this.setupStage();
            }
          }, 800);
        } else {
          _this.addScore(-2, '미통과 (' + pass + '/' + G.targets.length + ')');
          if (root) root.querySelector('#lbl-game-msg').innerHTML = '❌ <b>일부 목표 미통과!</b> 파라미터를 다시 조절해 보세요.';
        }
      }
    }
    anim();
  },

  hint: function() {
    S.hintUsed = true;
    this.addScore(-5, '힌트 사용');
    var root = S.host.querySelector('#il-app-root');
    if (G.type === 'hyperbola') {
      G.asymptote = true;
      this.drawCanvas();
      if (root) root.querySelector('#lbl-game-msg').innerHTML = '💡 <b>쌍곡선 점근선 힌트:</b> 붉은 점선 점근선 가이드라인이 표시되었습니다.';
    } else {
      if (root) root.querySelector('#lbl-game-msg').innerHTML = '💡 <b>개념 힌트:</b> 별의 (x, y) 좌표를 방정식에 대입했을 때 0에 가까워지도록 계수를 조정하세요.';
    }
  },

  addScore: function(n, why) {
    S.score += n;
    if (n > 0) {
      S.combo++;
      if (S.combo >= 2) S.score += (S.combo - 1) * 3;
    } else {
      S.combo = 0;
    }
    this.hud();
  },

  finishRun: function() {
    S.finished = true;
    this.openRank(true);
  },

             '  <span>' + (i === 0 ? '👑 ' : '') + (i + 1) + '위 ' + esc(it.nickname) + (it.level ? ' (' + esc(it.level) + ')' : '') + '</span>' +

             '</div>';
    }).join('') || '<p style="text-align:center; color:#94a3b8; padding:12px 0;">아직 명예의 전당 기록이 없습니다.</p>';

    var regH = reg ?
      '<div style="background:#f0f9ff; border:1px solid #bae6fd; border-radius:12px; padding:14px; margin-bottom:14px;">' +
      '  <div style="font-weight:900; font-size:1.05rem; color:#0369a1; margin-bottom:6px;">최종 성적: ' + S.score + '점 (' + levelTag() + ')</div>' +

          if (typeof window.submitRanking === 'function') {

        try {
          list.push({ nickname: nick, level: tag, score: S.score });
          list.sort(function(a, b) { return b.score - a.score; });
          localStorage.setItem(LSKEY, JSON.stringify(list.slice(0, 20)));
        } catch(e){}

        root.querySelector('#il-modal').classList.remove('on');
        _this.loadRank();
      };
    }
  },

  loadRank: function() {
    var root = S.host.querySelector('#il-app-root');
    if (!root) return;
    var el = root.querySelector('#' + BOARD);
    if (!el) return;

    if (typeof window.loadGameLeaderboard === 'function') {
      try { window.loadGameLeaderboard(APP_TITLE, true, BOARD); return; } catch(e){}
    }

    var list = [];
    try { list = JSON.parse(localStorage.getItem(LSKEY) || '[]'); } catch(e){}

    el.innerHTML = list.length ? list.slice(0, 5).map(function(it, i) {
      return '<div style="display:flex; justify-content:space-between; padding:10px 12px; background:#f8fafc; border:1px solid #e2e8f0; border-radius:10px; margin-bottom:6px; font-weight:700;">' +
             '  <span>' + (i + 1) + '위 ' + esc(it.nickname) + (it.level ? ' (' + esc(it.level) + ')' : '') + '</span>' +
             '  <b style="color:#0284c7;">' + it.score + '점</b>' +
             '</div>';
    }).join('') : '<p style="text-align:center; color:#94a3b8; padding:12px 0;">아직 명예의 전당 기록이 없습니다.</p>';
  },

  renderSlideGuide: function() {
    var _this = this;
    var root = S.host.querySelector('#il-app-root');
    var mBox = root.querySelector('#il-modal-box');
    if (!mBox) return;

    var pg = SLIDE_GUIDE[S.guidePage] || SLIDE_GUIDE[0];
    var dots = SLIDE_GUIDE.map(function(_, i) {
      return '<span class="dot' + (i === S.guidePage ? ' on' : '') + '"></span>';
    }).join('');
    var isLast = S.guidePage >= SLIDE_GUIDE.length - 1;

    var h = '';
    h += '<div style="font-size:.8rem; font-weight:800; color:#0284c7; margin-bottom:4px;">온보딩 슬라이드 탐구 ' + (S.guidePage + 1) + ' / ' + SLIDE_GUIDE.length + '</div>';
    h += '<h3 style="margin:0 0 12px; color:#0f172a; font-weight:900;">' + pg.title + '</h3>';
    h += '<div style="line-height:1.65; color:#334155; font-size:0.95rem;">' + pg.html + '</div>';
    h += '<div class="dots">' + dots + '</div>';

    h += '<div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px;">';
    h += '  <button type="button" class="btn" id="btn-slide-prev"' + (S.guidePage === 0 ? ' disabled' : '') + '>← 이전</button>';
    h += '  <button type="button" class="btn p" id="btn-slide-next">' + (isLast ? '조준 개시 🚀' : '다음 →') + '</button>';
    h += '</div>';

    mBox.innerHTML = h;
    updateMathElements();

    var prevBtn = mBox.querySelector('#btn-slide-prev');
    var nextBtn = mBox.querySelector('#btn-slide-next');

    if (prevBtn) {
      prevBtn.onclick = function() {
        if (S.guidePage > 0) {
          S.guidePage--;
          _this.renderSlideGuide();
        }
      };
    }
    if (nextBtn) {
      nextBtn.onclick = function() {
        if (isLast) {
          root.querySelector('#il-modal').classList.remove('on');
        } else {
          S.guidePage++;
          _this.renderSlideGuide();
        }
      };
    }
  },

  destroy: function() {
    clearTimers();
    if (S.host) S.host.innerHTML = '';
    S.host = null;
  }
};

function goHome() {
  if (S.host) S.host.innerHTML = '';
  if (typeof window.LegacyBridge !== 'undefined' && typeof window.LegacyBridge.backHome === 'function') {
    window.LegacyBridge.backHome();
  } else if (typeof window.MathLabGames !== 'undefined' && window.MathLabGames.goHome) {
    window.MathLabGames.goHome();
  } else {
    window.location.reload();
  }
}

function reg() {
  if (typeof window.MathLabGames === 'undefined' || typeof window.MathLabGames.register !== 'function') return;
  try {
    if (window.MathLabGames.get && window.MathLabGames.get(APP_ID)) return;
    window.MathLabGames.register({
      id: APP_ID,
      title: APP_TITLE,
      icon: ICON,
      sourceType: 'new',
      players: '1인',
      isMultiplayer: false,
      mount: function(c, x) { ImplicitLaserApp.mount(c, x); },
      reset: function() { ImplicitLaserApp.resetRun(); },
      destroy: function() { ImplicitLaserApp.destroy(); },
      goHome: function() { goHome(); }
    });
  } catch (e) {
    console.warn(APP_ID + ' reg', e);
  }
}

reg();
window.addEventListener('DOMContentLoaded', reg);
setTimeout(reg, 100);
setTimeout(reg, 500);

window.ImplicitLaser = {
  mount: function(c) { ImplicitLaserApp.mount(c); },
  resetGame: function() { ImplicitLaserApp.resetRun(); },
  destroy: function() { ImplicitLaserApp.destroy(); },
  goHome: goHome
};

window.initImplicitLaser = function() {
  reg();
  try {
    if (window.LegacyBridge) {
      window.LegacyBridge.hideAllLegacySections();
      if (window.LegacyBridge.showNewRoot) window.LegacyBridge.showNewRoot();
    }
  } catch (e) {}
  if (window.MathLabGames && window.MathLabGames.mount) {
    try { window.MathLabGames.mount(APP_ID); return; } catch (e) {}
  }
  ImplicitLaserApp.mount(document.getElementById('mathlab-view'));
};

window.launchImplicitLaser = window.initImplicitLaser;
})();
</script>
