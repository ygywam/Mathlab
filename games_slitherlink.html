function countCell(size,S,r,c){return[`h-${r}-${c}`,`h-${r+1}-${c}`,`v-${r}-${c}`,`v-${r}-${c+1}`].reduce((n,e)=>n+(S.has(e)?1:0),0)}
function clues(size,edges){const S=new Set(edges);return Array.from({length:size},(_,r)=>Array.from({length:size},(_,c)=>{const n=countCell(size,S,r,c);return n>0?n:null;}));}
function loopOK(edges){const g=new Map();const add=n=>{if(!g.has(n))g.set(n,new Set())};const link=(a,b)=>{add(a);add(b);g.get(a).add(b);g.get(b).add(a)};edges.forEach(id=>{const e=parseEdge(id);if(e.type==='h')link(`${e.r},${e.c}`,`${e.r},${e.c+1}`);else if(e.type==='v')link(`${e.r},${e.c}`,`${e.r+1},${e.c}`)});if(!g.size)return false;for(const ns of g.values())if(ns.size!==2)return false;const nodes=[...g.keys()],seen=new Set(),st=[nodes[0]];while(st.length){const n=st.pop();if(seen.has(n))continue;seen.add(n);g.get(n).forEach(m=>{if(!seen.has(m))st.push(m)})}return seen.size===nodes.length;}
function clueOK(p){const S=new Set(p.solutionEdges);for(let r=0;r<p.size;r++)for(let c=0;c<p.size;c++){const v=p.clues[r][c];if(v==null)continue;if(v===0)return false;if(countCell(p.size,S,r,c)!==v)return false;}return true;}
function qualityOK(p){if(!p||!loopOK(p.solutionEdges)||!clueOK(p))return false;const nums=p.clues.flat().filter(v=>v!=null);const cnt=n=>nums.filter(v=>v===n).length;if(nums.includes(0))return false;if(p.size===4)return p.solutionEdges.length>=10&&p.solutionEdges.length<=20&&nums.length>=7&&cnt(1)>=2&&cnt(2)>=2&&cnt(3)>=2;if(p.size===5)return p.solutionEdges.length>=16&&p.solutionEdges.length<=32&&nums.length>=10&&cnt(1)>=2&&cnt(2)>=3&&cnt(3)>=2;return false;}
function tPoint([r,c],size,k){if(k==='rot90')return[c,size-r];if(k==='rot180')return[size-r,size-c];if(k==='rot270')return[size-c,r];if(k==='flipH')return[r,size-c];if(k==='flipV')return[size-r,c];if(k==='diag')return[c,r];if(k==='anti')return[size-c,size-r];return[r,c];}
function transform(edges,size,k){return Array.from(new Set(edges.map(id=>{const e=parseEdge(id);const a=e.type==='h'?[e.r,e.c]:[e.r,e.c];const b=e.type==='h'?[e.r,e.c+1]:[e.r+1,e.c];return edgeId(tPoint(a,size,k),tPoint(b,size,k));}))).sort();}
function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b;}
function makePuzzle(base,size,generated){for(const k of shuffle(trKinds)){const sol=transform(base.solutionEdges,size,k);const p={id:`${base.id}-${k}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,6)}`,title:`${size}x${size} 품질 루프`,size,generated,clues:clues(size,sol),solutionEdges:sol};if(qualityOK(p))return p;}const sol=base.solutionEdges.slice();return{id:`${base.id}-fallback`,title:`${size}x${size} 품질 루프`,size,generated,clues:clues(size,sol),solutionEdges:sol};}
const SlitherlinkGame={container:null,selectedEdges:new Set(),score:0,lives:3,solved:false,gameOver:false,hintUnlocked:false,difficulty:'4x4',puzzle:null,used:new Set(),puzzles:FOUR.filter(qualityOK),
mount(container){const view=document.getElementById('mathlab-view');this.container=(container&&container.innerHTML!==undefined?container:null)||view;if(!this.container){console.error('[Slitherlink] 렌더링 영역 없음');return}console.log('[Slitherlink] 4x4 품질 통과:',this.puzzles.length,'/ 20');console.log('[Slitherlink] 5x5 품질 기반:',FIVE.filter(qualityOK).length);this.reset();this.render();},
reset(){this.score=0;this.lives=3;this.solved=false;this.gameOver=false;this.hintUnlocked=false;this.used=new Set();this.loadRandomPuzzle();},
loadRandomPuzzle(){if(this.difficulty==='5x5'){const base=shuffle(FIVE.filter(qualityOK))[0]||FIVE[0];this.puzzle=makePuzzle(base,5,true)}else{let cs=this.puzzles.filter(p=>!this.used.has(p.id));if(!cs.length){this.used=new Set();cs=this.puzzles.slice()}const base=cs[Math.floor(Math.random()*cs.length)];this.used.add(base.id);this.puzzle=makePuzzle(base,4,false)}if(!qualityOK(this.puzzle))console.error('[Slitherlink] 품질 필터 실패',this.puzzle);this.selectedEdges=new Set();this.solved=false;this.hintUnlocked=this.lives<3;},

nextPuzzle(){if(this.gameOver||this.lives<=0){this.setMessage('게임이 종료되었습니다. 다시 시작을 눌러 새 게임을 시작하세요.','fail');return}this.loadRandomPuzzle();this.render();},
destroy(){this.container=null;this.selectedEdges=new Set()},
render(){if(!this.container||!this.puzzle)return;const safe=this.hintUnlocked?this.puzzle.title:`${this.puzzle.size}x${this.puzzle.size} 랜덤 퍼즐`;const badge=this.difficulty==='4x4'?`${this.used.size||1} / ${this.puzzles.length}`:'5x5 품질 생성';this.container.innerHTML=`<div class="game-slitherlink"><div class="game-slitherlink-header"><div><h2 class="game-slitherlink-title">🔗 슬리더링크</h2><p class="game-slitherlink-subtitle">${safe} — 숫자 힌트에 맞게 선을 연결해 하나의 단일 루프를 완성하세요.</p></div><div class="game-slitherlink-badge">${badge}</div></div><div class="game-slitherlink-panel"><div class="game-slitherlink-board-wrap"><div id="grid-slitherlink"></div></div><aside class="game-slitherlink-side"><div class="game-slitherlink-stats"><div class="game-slitherlink-stat"><div class="game-slitherlink-stat-label">점수</div><div class="game-slitherlink-stat-value" data-sl-score>${this.score}</div></div><div class="game-slitherlink-stat"><div class="game-slitherlink-stat-label">생명</div><div class="game-slitherlink-stat-value" data-sl-lives>${this.lives}</div></div><div class="game-slitherlink-stat"><div class="game-slitherlink-stat-label">선</div><div class="game-slitherlink-stat-value" data-sl-edge-count>${this.selectedEdges.size}</div></div></div><div class="game-slitherlink-actions"><button type="button" class="game-slitherlink-btn ${this.difficulty==='4x4'?'primary':''}" data-sl-difficulty="4x4">4x4 품질 템플릿</button><button type="button" class="game-slitherlink-btn ${this.difficulty==='5x5'?'primary':''}" data-sl-difficulty="5x5">5x5 품질 생성</button></div><div class="game-slitherlink-actions"><button type="button" class="game-slitherlink-btn primary" data-sl-action="check" ${this.gameOver?'disabled':''}>정답 확인</button><button type="button" class="game-slitherlink-btn" data-sl-action="clear" ${this.gameOver?'disabled':''}>선 지우기</button><button type="button" class="game-slitherlink-btn" data-sl-action="next" ${this.gameOver?'disabled':''}>다음 문제</button><button type="button" class="game-slitherlink-btn" data-sl-action="hint" ${this.hintUnlocked?'':'disabled'}>힌트 보기</button><button type="button" class="game-slitherlink-btn danger" data-sl-action="solution" ${this.hintUnlocked||this.gameOver?'':'disabled'}>정답 보기</button><button type="button" class="game-slitherlink-btn" data-sl-action="restart">다시 시작</button><button type="button" class="game-slitherlink-btn" style="background:#64748b;color:#fff;" data-sl-action="home">홈으로</button></div><div class="game-slitherlink-message" data-sl-message>선을 클릭해서 루프를 만들어 보세요.</div><ul class="game-slitherlink-rules"><li>0은 표시하지 않고 정답 루프와 일치하는 1·2·3·4만 표시합니다.</li><li>품질 필터: 단일 닫힌 루프, 힌트 일치, 충분한 힌트 수, 3 포함 여부를 검사합니다.</li><li>생명이 모두 사라지면 게임이 끝나고 최종 점수가 명예의 전당에 등록됩니다.</li></ul><div class="game-slitherlink-leaderboard"><h3>🏆 명예의 전당</h3><div id="board-slitherlink"><p>랭킹 로딩 중...</p></div></div></aside></div></div>`;this.renderBoard();this.bindEvents();this.loadLeaderboard();},
renderBoard(){const board=this.container.querySelector('#grid-slitherlink');if(!board)return;const size=this.puzzle.size,grid=size*2+1,cells=[];const wrap=this.container.querySelector('.game-slitherlink-board-wrap');const maxCell=size===5?42:52;const minCell=size===5?26:30;const available=wrap?Math.max(260,wrap.clientWidth-24):grid*maxCell;const cell=Math.max(minCell,Math.min(maxCell,Math.floor(available/grid)));board.style.setProperty('--cell',`${cell}px`);board.style.gridTemplateColumns=`repeat(${grid}, var(--cell))`;board.style.gridTemplateRows=`repeat(${grid}, var(--cell))`;for(let r=0;r<grid;r++)for(let c=0;c<grid;c++){const dot=r%2===0&&c%2===0,hor=r%2===0&&c%2===1,ver=r%2===1&&c%2===0,cl=r%2===1&&c%2===1;if(dot){cells.push('<div class="sl-cell sl-dot"></div>');continue}if(hor){const id=`h-${r/2}-${Math.floor(c/2)}`,sel=this.selectedEdges.has(id)?' is-selected':'';cells.push(`<button type="button" class="sl-cell sl-edge sl-edge-horizontal${sel}" data-edge-id="${id}"></button>`);continue}if(ver){const id=`v-${Math.floor(r/2)}-${c/2}`,sel=this.selectedEdges.has(id)?' is-selected':'';cells.push(`<button type="button" class="sl-cell sl-edge sl-edge-vertical${sel}" data-edge-id="${id}"></button>`);continue}if(cl){const v=this.puzzle.clues[Math.floor(r/2)][Math.floor(c/2)],label=v==null?'':v;cells.push(`<div class="sl-cell sl-clue${label===''?' sl-clue-empty':''}">${label}</div>`);continue}cells.push('<div class="sl-cell"></div>')}board.innerHTML=cells.join('');},
bindEvents(){const root=this.container.querySelector('.game-slitherlink');if(!root)return;root.querySelectorAll('[data-edge-id]').forEach(btn=>btn.addEventListener('click',()=>{if(this.solved||this.gameOver)return;const id=btn.getAttribute('data-edge-id');if(this.selectedEdges.has(id))this.selectedEdges.delete(id);else this.selectedEdges.add(id);btn.classList.toggle('is-selected',this.selectedEdges.has(id));this.updateStats();this.setMessage('선택한 선을 기준으로 루프를 완성하세요.','')}));root.querySelectorAll('[data-sl-difficulty]').forEach(b=>b.addEventListener('click',()=>this.setDifficulty(b.getAttribute('data-sl-difficulty'))));root.querySelector('[data-sl-action="check"]')?.addEventListener('click',()=>this.checkAnswer());root.querySelector('[data-sl-action="clear"]')?.addEventListener('click',()=>this.clearEdges());root.querySelector('[data-sl-action="next"]')?.addEventListener('click',()=>this.nextPuzzle());root.querySelector('[data-sl-action="hint"]')?.addEventListener('click',()=>this.showHint());root.querySelector('[data-sl-action="solution"]')?.addEventListener('click',()=>this.showSolution());root.querySelector('[data-sl-action="restart"]')?.addEventListener('click',()=>{this.reset();this.render()});root.querySelector('[data-sl-action="home"]')?.addEventListener('click',()=>window.MathLabUtils?.goHome?window.MathLabUtils.goHome():(window.LegacyBridge&&window.LegacyBridge.backHome?window.LegacyBridge.backHome():location.reload()));},
clearEdges(){if(this.solved||this.gameOver)return;this.selectedEdges=new Set();this.renderBoard();this.bindEvents();this.updateStats();this.setMessage('선을 모두 지웠습니다. 다시 루프를 만들어 보세요.','')},showHint(){if(!this.hintUnlocked){this.setMessage('힌트는 생명이 1개 차감된 뒤부터 확인할 수 있습니다.','fail');return}this.setMessage(`힌트: ${this.puzzle.title}`,'')},showSolution(){if(!this.hintUnlocked&&!this.gameOver){this.setMessage('정답 보기는 생명이 1개 차감된 뒤부터 사용할 수 있습니다.','fail');return}this.selectedEdges=new Set(this.puzzle.solutionEdges);this.renderBoard();this.bindEvents();this.updateStats();this.setMessage('정답 예시를 표시했습니다. 이 상태에서 정답 확인을 누르면 성공 판정됩니다.','')},updateStats(){const s=this.container.querySelector('[data-sl-score]'),l=this.container.querySelector('[data-sl-lives]'),e=this.container.querySelector('[data-sl-edge-count]');if(s)s.textContent=String(this.score);if(l)l.textContent=String(this.lives);if(e)e.textContent=String(this.selectedEdges.size)},setMessage(text,type){const m=this.container.querySelector('[data-sl-message]');if(!m)return;m.textContent=text;m.classList.remove('success','fail');if(type)m.classList.add(type)},
checkAnswer(){if(this.gameOver){this.setMessage('게임이 종료되었습니다. 다시 시작을 눌러 새 게임을 시작하세요.','fail');return}if(this.solved){this.setMessage('이미 성공한 퍼즐입니다. 다음 문제를 눌러 계속 진행하세요.','success');return}const c=this.checkClues();if(!c.ok){this.handleFail(c.message);return}const l=this.checkSingleLoop();if(!l.ok){this.handleFail(l.message);return}this.handleSuccess()},checkClues(){const size=this.puzzle.size;for(let r=0;r<size;r++)for(let c=0;c<size;c++){const clue=this.puzzle.clues[r][c];if(clue==null)continue;const n=countCell(size,this.selectedEdges,r,c);if(n!==clue)return{ok:false,message:`힌트 조건이 맞지 않습니다.\n${r+1}행 ${c+1}열 숫자 ${clue} 주변의 선택된 선은 현재 ${n}개입니다.`}}return{ok:true}},checkSingleLoop(){if(this.selectedEdges.size===0)return{ok:false,message:'선이 하나도 선택되지 않았습니다.'};if(!loopOK(Array.from(this.selectedEdges)))return{ok:false,message:'선이 하나의 단일 닫힌 루프가 아닙니다. 열린 경로, 가지친 선, 분리된 루프가 없는지 확인하세요.'};return{ok:true}},handleSuccess(){this.solved=true;const gained=(this.puzzle.size===5?160:100)+this.lives*20+(this.puzzle.generated?30:0);this.score+=gained;this.updateStats();this.setMessage(`성공입니다!\n이번 문제 점수 ${gained}점을 획득했습니다.\n다음 문제를 눌러 계속 진행하세요.`,'success')},handleFail(message){this.lives=Math.max(0,this.lives-1);this.hintUnlocked=true;this.updateStats();if(this.lives<=0){this.endGame(message);return}this.render();this.setMessage(`${message}\n\n생명 1개가 차감되었습니다. 이제 힌트와 정답 보기를 사용할 수 있습니다. 남은 생명: ${this.lives}`,'fail')},endGame(reason){this.gameOver=true;this.solved=true;this.hintUnlocked=true;this.render();this.setMessage(`${reason}\n\n게임 종료입니다.\n최종 점수: ${this.score}점\n명예의 전당에 최종 점수를 등록합니다.`,'fail');this.saveLeaderboard()},saveLeaderboard(){try{if(this.score<=0)return;if(typeof window.submitRanking!=='function'){console.info('[Slitherlink] submitRanking 함수를 찾을 수 없어 점수 등록을 건너뜁니다.');return}const name=prompt('명예의 전당에 등록할 닉네임을 입력하세요.');if(!name||!name.trim()){this.setMessage(`게임 종료입니다.\n최종 점수 ${this.score}점입니다.\n닉네임을 입력하지 않아 명예의 전당 등록은 건너뛰었습니다.`,'fail');return}window.submitRanking('슬리더링크',this.score,true,{value:name,trim:function(){return name.trim()}},'board-slitherlink');if(typeof window.loadGameLeaderboard==='function')window.loadGameLeaderboard('슬리더링크',true,'board-slitherlink')}catch(e){console.error('[Slitherlink] 명예의 전당 저장 중 오류:',e)}},loadLeaderboard(){try{if(typeof window.loadGameLeaderboard==='function'){window.loadGameLeaderboard('슬리더링크',true,'board-slitherlink');return}const b=this.container.querySelector('#board-slitherlink');if(b)b.innerHTML='<p>명예의 전당 함수를 찾을 수 없습니다.</p>'}catch(e){console.error('[Slitherlink] 명예의 전당 로딩 오류:',e)}}};
window.SlitherlinkGame=SlitherlinkGame;if(!window.MathLabGames||typeof window.MathLabGames.register!=='function'){console.error('[Slitherlink] MathLabGames.register를 찾을 수 없습니다. index.html include 순서를 확인하세요.');return}window.MathLabGames.register({id:'slitherlink',title:'슬리더링크',icon:'🔗',sourceType:'new',mount(c,x){SlitherlinkGame.mount(c,x)},reset(){SlitherlinkGame.reset();SlitherlinkGame.render()},destroy(){SlitherlinkGame.destroy()}});window.launchSlitherlinkGame=function(){if(!window.MathLabGames){alert('MathLabGames를 찾을 수 없습니다. games_slitherlink include 위치를 확인하세요.');return}if(window.LegacyBridge){window.LegacyBridge.hideAllLegacySections();window.LegacyBridge.showNewRoot()}try{window.MathLabGames.mount('slitherlink')}catch(e){console.error('슬리더링크 실행 오류:',e);alert('슬리더링크 실행 중 오류가 발생했습니다.'+'\n\n실제 오류: '+(e&&e.message?e.message:e))}};
})();
