</style>

<script>
const EquationSeesaw = (function() {
  let host = null;
  let score = 50; 
  let difficulty = 'easy';
  let isRoundOver = false;
  let isFullGameOver = false;
  
  let leftX = 0;
  let leftConst = 0;
  let rightX = 0;
  let rightConst = 0;
  let moves = 0;
  
  let trueX = 0;

  function showToast(msg, type) {
    if (!type) type = 'normal';
    let toast = document.getElementById('es-toast');
    if (!toast) {
      toast = document.createElement('div');
      toast.id = 'es-toast';
      toast.className = 'es-toast';
      document.body.appendChild(toast);
    }
    toast.className = 'es-toast ' + type + ' show';
    toast.textContent = msg;
    setTimeout(function() { toast.classList.remove('show'); }, 3000);
  }

  function escapeHTML(str) {
    if (!str) return '';
    return str.replace(/[&<>'"]/g, function(tag) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag;
    });
  }

  function checkLevelUp() {
    if (score >= 200) difficulty = 'hard';
    else if (score >= 100) difficulty = 'normal';
    else difficulty = 'easy';
  }

  function generateEquation() {
    checkLevelUp();
    isRoundOver = false;
    moves = 0;
    
    trueX = Math.floor(Math.random() * 5) + 1; 
    if (difficulty === 'hard' && Math.random() < 0.5) trueX = -trueX;
    
    if (difficulty === 'easy') {
      leftX = 1;
      leftConst = Math.floor(Math.random() * 5) + 1;
      rightX = 0;
      rightConst = leftX * trueX + leftConst;
    } else if (difficulty === 'normal') {
      leftX = Math.floor(Math.random() * 3) + 2;
      rightX = Math.floor(Math.random() * leftX); // keep leftX > rightX to avoid negative x at the end easily
      leftConst = Math.floor(Math.random() * 5) + 1;
      rightConst = leftX * trueX + leftConst - (rightX * trueX);
    } else {
      leftX = Math.floor(Math.random() * 4) + 1;
      rightX = Math.floor(Math.random() * 4) + 1;
      if (leftX === rightX) leftX++;
      leftConst = Math.floor(Math.random() * 10) - 5;
      rightConst = leftX * trueX + leftConst - (rightX * trueX);
    }
    
    renderUI();
  }

  function formatSide(xCount, constCount) {
    let parts = [];
    if (xCount !== 0) {
      if (xCount === 1) parts.push('x');
      else if (xCount === -1) parts.push('-x');
      else parts.push(xCount + 'x');
    }
    if (constCount !== 0) {
      if (constCount > 0 && parts.length > 0) parts.push('+ ' + constCount);
      else if (constCount < 0 && parts.length > 0) parts.push('- ' + Math.abs(constCount));
      else parts.push(constCount);
    }
    if (parts.length === 0) return '0';
    return parts.join(' ');
  }

  function renderEquation() {
    const eqEl = host.querySelector('#equation-display');
    if (!eqEl) return;
    
    let lStr = formatSide(leftX, leftConst);
    let rStr = formatSide(rightX, rightConst);
    eqEl.innerHTML = '<span class="eq-highlight">' + lStr + '</span> = <span class="eq-highlight">' + rStr + '</span>';
  }

  function renderSeesaw() {
    const leftPan = host.querySelector('#left-pan');
    const rightPan = host.querySelector('#right-pan');
    const board = host.querySelector('#seesaw-board');
    if (!leftPan || !rightPan || !board) return;
    
    // Board animation based on true evaluation. Since operations are identical on both sides,
    // true math remains balanced. We just add a slight wobble on update.
    board.style.transform = 'rotate(2deg)';
    setTimeout(function() {
      board.style.transform = 'rotate(-2deg)';
      setTimeout(function() {
        board.style.transform = 'rotate(0deg)';
      }, 200);
    }, 200);

    function buildItems(xCount, constCount) {
      let html = '';
      let absX = Math.abs(xCount);
      for(let i=0; i<absX && i<20; i++) {
        html += '<div class="item-x ' + (xCount < 0 ? 'negative' : '') + '">' + (xCount < 0 ? '-x' : 'x') + '</div>';
      }
      if (absX > 20) html += '<div style="font-weight:bold">...</div>';
      
      let absC = Math.abs(constCount);
      // Group constants visually to save space
      if (absC <= 15) {
        for(let i=0; i<absC; i++) {
          html += '<div class="item-const ' + (constCount < 0 ? 'negative' : '') + '">' + (constCount < 0 ? '-1' : '1') + '</div>';
        }
      } else {
        html += '<div class="item-const ' + (constCount < 0 ? 'negative' : '') + '" style="width:50px">' + (constCount < 0 ? '-' : '') + absC + '</div>';
      }
      return html;
    }
    
    leftPan.innerHTML = buildItems(leftX, leftConst);
    rightPan.innerHTML = buildItems(rightX, rightConst);
  }

  function renderUI() {
    if (!host) return;
    host.querySelector('#es-score').textContent = score;
    host.querySelector('#es-moves').textContent = moves;
    
    host.querySelectorAll('.diff-indicator').forEach(function(el) {
      el.classList.toggle('active', el.dataset.diff === difficulty);
    });
    
    renderEquation();
    renderSeesaw();
    
    const banner = host.querySelector('#end-round-banner');
    if (isRoundOver && !isFullGameOver) {
      banner.classList.add('show');
    } else {
      banner.classList.remove('show');
    }
    
    host.querySelector('#btn-apply').disabled = isRoundOver || isFullGameOver;
  }

  function applyOperation() {
    if (isRoundOver || isFullGameOver) return;
    
    const op = host.querySelector('#op-select').value;
    const valStr = host.querySelector('#op-value').value;
    const type = host.querySelector('#op-type').value;
    
    let val = parseInt(valStr);
    if (isNaN(val) || val <= 0) {
      showToast('올바른 값을 입력하세요.', 'error');
      return;
    }
    
    if (op === 'div') {
      // Divide both sides
      // Validation: Can we divide evenly? 
      // For middle school, we only allow division if everything is cleanly divisible.
      if (leftX % val !== 0 || rightX % val !== 0 || leftConst % val !== 0 || rightConst % val !== 0) {
        showToast('모든 항이 ' + val + '로 나누어 떨어지지 않습니다.', 'error');
        return;
      }
      leftX /= val; rightX /= val;
      leftConst /= val; rightConst /= val;
    } else {
      let amount = (op === 'add' ? val : -val);
      if (type === 'x') {
        leftX += amount; rightX += amount;
      } else {
        leftConst += amount; rightConst += amount;
      }
    }
    
    moves++;
    renderUI();
    checkWinCondition();
  }

  function checkWinCondition() {
    // x = C or C = x
    if ((leftX === 1 && leftConst === 0 && rightX === 0) || 
        (rightX === 1 && rightConst === 0 && leftX === 0)) {
      
      isRoundOver = true;
      let moveBonus = Math.max(0, 10 - moves);
      let roundScore = 15 + moveBonus;
      score += roundScore;
      
      const titleEl = host.querySelector('#banner-title');
      const textEl = host.querySelector('#banner-text');
      titleEl.textContent = '🎉 x 값 찾기 성공!';
      textEl.textContent = 'x = ' + (leftX === 1 ? rightConst : leftConst) + ' (조작 ' + moves + '회) ➔ +' + roundScore + '점';
      
      renderUI();
    }
  }

  function useHint() {
    if (isRoundOver || isFullGameOver) return;
    score -= 3;
    showToast('힌트 사용! 점수가 3점 차감되었습니다.', 'error');
    
    let hintStr = '';
    // Basic solver logic for hint
    if (leftX !== rightX) {
      if (leftX > rightX && rightX !== 0) {
        hintStr = '양변에서 ' + rightX + 'x 를 빼보세요.';
      } else if (rightX > leftX && leftX !== 0) {
        hintStr = '양변에서 ' + leftX + 'x 를 빼보세요.';
      } else {
        // x is on one side.
        let xSide = leftX !== 0 ? 'left' : 'right';
        let constCount = xSide === 'left' ? leftConst : rightConst;
        
        if (constCount > 0) {
          hintStr = '양변에서 ' + constCount + ' 상수를 빼보세요.';
        } else if (constCount < 0) {
          hintStr = '양변에 ' + Math.abs(constCount) + ' 상수를 더해보세요.';
        } else {
          let coeff = xSide === 'left' ? leftX : rightX;
          if (coeff > 1) {
            hintStr = '양변을 ' + coeff + ' 로 나누어보세요.';
          } else if (coeff < 0) {
            hintStr = '양변을 ' + coeff + ' 로 나누어보세요. (음수로 나누기)';
          }
        }
      }
    } else {
      hintStr = 'x가 사라졌습니다! 식이 성립하는지 확인하세요.';
    }
    
    alert('💡 추천 연산: ' + hintStr);
    renderUI();
  }

  function handleOpSelectChange() {
    const op = host.querySelector('#op-select').value;
    const typeSelect = host.querySelector('#op-type');
    if (op === 'div') {
      typeSelect.style.display = 'none';
      typeSelect.value = 'const'; // internally force const
    } else {
      typeSelect.style.display = 'inline-block';
    }
  }

  function nextRound() {
    if (isFullGameOver) return;
    generateEquation();
  }

  function endAndRegister() {
    if (isFullGameOver) return;
    isFullGameOver = true;
    showRankingModal();
  }

  function fullResetGame() {
    score = 50;
    isFullGameOver = false;
    nextRound();
  }

  function showGuideModal() {
    let modal = document.getElementById('es-guide-modal');
    if (!modal) {
      modal = document.createElement('div');
      modal.id = 'es-guide-modal';
      modal.className = 'es-modal-overlay';
      modal.innerHTML = 
        '<div class="es-modal">' +
          '<h3>📖 게임 방법</h3>' +
          '<p>' +
            '- 등식 저울의 양쪽은 항상 같은 상태를 유지해야 합니다.<br>' +
            '- <b>양변 동일 연산</b> 기능을 이용해 양변에 같은 상수를 더하거나 빼고, x 상자를 옮기세요.<br>' +
            '- 마지막에 양변을 계수로 나누어 <b>한쪽에 x 상자 1개만 남기면</b> 탈출 성공입니다!<br>' +
            '- 적은 횟수로 조작할수록 높은 <b>보너스 점수</b>를 얻습니다.<br>' +
            '- 점수가 100점, 200점을 넘을 때마다 문제의 난이도가 상승합니다.' +
          '</p>' +
          '<button class="close-btn" onclick="document.getElementById(&quot;es-guide-modal&quot;).style.display=&quot;none&quot;">확인</button>' +
        '</div>';
      document.body.appendChild(modal);
    }
    modal.style.display = 'flex';
  }

  function showRankingModal() {
    let modal = document.getElementById('es-ranking-modal');
    if (!modal) {
      modal = document.createElement('div');
      modal.id = 'es-ranking-modal';
      modal.className = 'es-modal-overlay';
      modal.innerHTML = 
        '<div class="es-modal">' +
          '<h3>🏆 랭킹 등록</h3>' +
          '<p>최종 점수: <strong id="es-rank-score" style="color:#f59e0b; font-size:1.5rem;"></strong> 점</p>' +
          '<input type="text" id="es-rank-name" placeholder="닉네임 (10자 이내)" maxlength="10" style="width:100%; padding:10px; margin-bottom:15px; border-radius:8px; background:#f8fafc; border:1px solid #cbd5e1; color:#1e293b; text-align:center;">' +
          '<button class="close-btn" id="es-rank-submit">등록 후 재시작</button>' +
          '<button class="close-btn" style="background:#64748b; margin-left:10px;" onclick="document.getElementById(&quot;es-ranking-modal&quot;).style.display=&quot;none&quot;">닫기</button>' +
        '</div>';
      document.body.appendChild(modal);
      
      document.getElementById('es-rank-submit').addEventListener('click', function() {
        const nameInput = document.getElementById('es-rank-name');
        let name = nameInput.value.trim();
        if (!name) { showToast('닉네임을 입력하세요.', 'error'); return; }
        name = escapeHTML(name);
        
        if (typeof window.submitRankingScore === 'function') {
          window.submitRankingScore('equation-seesaw', name, score);
        } else {
          let list = JSON.parse(localStorage.getItem('mathlab_lb_equation-seesaw') || '[]');
          list.push({ nickname: name, score: score });
          list.sort(function(a,b) { return b.score - a.score; });
          localStorage.setItem('mathlab_lb_equation-seesaw', JSON.stringify(list));
        }
        
        showToast('명예의 전당에 등록되었습니다!', 'success');
        document.getElementById('es-ranking-modal').style.display = 'none';
        renderBottomLeaderboard();
        fullResetGame();
      });
    }
    document.getElementById('es-rank-score').textContent = score;
    document.getElementById('es-rank-name').value = '';
    modal.style.display = 'flex';
  }

  function renderBottomLeaderboard() {
    if (typeof window.loadGameLeaderboard === 'function') {
      window.loadGameLeaderboard('equation-seesaw', true, 'board-equation-seesaw');
    } else {
      try {
        let list = JSON.parse(localStorage.getItem('mathlab_lb_equation-seesaw') || '[]');
        const bottomEl = document.getElementById('board-equation-seesaw');
        if (bottomEl) {
          if (list.length === 0) {
            bottomEl.innerHTML = '<p style="text-align:center; color:#64748b; padding:12px 0;">아직 등록된 기록이 없습니다.</p>';
          } else {
            bottomEl.innerHTML = list.slice(0, 5).map(function(item, idx) {
              return '<div style="display:flex; justify-content:space-between; align-items:center; background:#f8fafc; padding:10px 14px; border-radius:10px; border:1px solid #e2e8f0; margin-bottom:6px;">' +
                '<span style="font-weight:800; color:' + (idx === 0 ? '#f59e0b' : '#334155') + ';">' + (idx === 0 ? '👑 1위' : (idx + 1) + '위') + ' - ' + escapeHTML(item.nickname) + '</span>' +
                '<span style="color:#10b981; font-weight:900;">' + item.score + ' 점</span>' +
              '</div>';
            }).join('');
          }
        }
      } catch(e) {}
    }
  }

  function goHome() {
    if (host) {
      host.style.display = 'none';
      host.innerHTML = '';
    }
    const legacyHost = document.getElementById('mathlab-view');
    if (legacyHost) {
      legacyHost.style.display = 'none';
      legacyHost.innerHTML = '';
    }
    const forceHost = document.getElementById('equation-seesaw-force-host');
    if (forceHost) {
      forceHost.style.display = 'none';
      forceHost.innerHTML = '';
    }

    document.querySelectorAll('.app-grid, #dashboard-screen, #hero-section').forEach(function(el) {
      if (el && el.style) {
        el.style.display = '';
        el.style.visibility = '';
      }
    });

    if (window.LegacyBridge && typeof window.LegacyBridge.backHome === 'function') {
      window.LegacyBridge.backHome();
    } else if (typeof window.goHome === 'function') {
      window.goHome();
    }
  }

  function mount(container, context) {
    let target = null;
    if (typeof container === 'string') target = document.querySelector(container);
    else if (container instanceof HTMLElement) target = container;
    
    if (!target) target = window.MathLabUtils && window.MathLabUtils.getMountContainer ? window.MathLabUtils.getMountContainer(container) : document.getElementById('mathlab-view');
    if (!target || !(target instanceof HTMLElement)) target = document.getElementById('new-root') || document.getElementById('game-container') || document.getElementById('mathlab-view');

    if (!target || !(target instanceof HTMLElement) || target === document.body) {
      let createdHost = document.getElementById('equation-seesaw-force-host');
      if (!createdHost) {
        createdHost = document.createElement('div');
        createdHost.id = 'equation-seesaw-force-host';
        document.body.appendChild(createdHost);
      }
      target = createdHost;
    }

    const footerEl = document.querySelector('footer, #footer, .app-footer') || 
                     Array.from(document.querySelectorAll('div, p, span')).find(function(el) { return el.textContent && el.textContent.indexOf('2026 기록조율사') !== -1; });
    if (footerEl && target && typeof target.compareDocumentPosition === 'function' && (target.compareDocumentPosition(footerEl) & Node.DOCUMENT_POSITION_PRECEDING)) {
      footerEl.parentNode.insertBefore(target, footerEl);
    }

    target.style.display = '';
    target.style.visibility = 'visible';
    target.style.opacity = '1';

    let parent = target.parentElement;
    while (parent && parent !== document.body && parent !== document.documentElement) {
      if (parent.style && parent.style.display === 'none') parent.style.display = 'block';
      if (parent.style && parent.style.visibility === 'hidden') parent.style.visibility = 'visible';
      parent = parent.parentElement;
    }

    document.querySelectorAll('header, .navbar, #app-header, .top-bar, #floating-home-btn, .floating-home').forEach(function(el) {
      if (el && el.style && el.style.display === 'none') el.style.display = '';
    });
    
    host = target;

    host.innerHTML = 
      '<div class="game-equation-seesaw">' +
        '<div class="app-header">' +
          '<div class="app-title">⚖️ 방정식 시소 밸런스</div>' +
          '<div class="header-btns">' +
            '<button class="btn btn-primary" id="btn-guide">📖 방법</button>' +
            '<button class="btn btn-home" id="btn-home">🏠 홈</button>' +
          '</div>' +
        '</div>' +
        '<div class="main-area">' +
          '<div class="status-bar">' +
            '<div class="stat-box">' +
              '<span class="stat-label">내 점수</span>' +
              '<span class="stat-value score" id="es-score">50</span>' +
            '</div>' +
            '<div class="stat-box">' +
              '<span class="stat-label">조작 횟수</span>' +
              '<span class="stat-value" id="es-moves">0</span>' +
            '</div>' +
            '<button class="btn" style="background:#fef2f2; border:1px solid #fca5a5; color:#ef4444;" id="btn-end">🛑 기록 등록 후 종료</button>' +
          '</div>' +
          
          '<div style="display:flex; justify-content:center; gap:10px; flex-wrap:wrap;">' +
            '<span class="diff-indicator" data-diff="easy">쉬움 (~99점)</span>' +
            '<span class="diff-indicator" data-diff="normal">보통 (~199점)</span>' +
            '<span class="diff-indicator" data-diff="hard">도전 (200점~)</span>' +
          '</div>' +
          
          '<div class="equation-display" id="equation-display"></div>' +
          
          '<div class="seesaw-container">' +
            '<div class="seesaw-board" id="seesaw-board">' +
              '<div class="pan"><div class="pan-content" id="left-pan"></div></div>' +
              '<div class="pan"><div class="pan-content" id="right-pan"></div></div>' +
            '</div>' +
            '<div class="seesaw-base"></div>' +
          '</div>' +
          
          '<div class="control-panel">' +
            '<div style="width:100%; text-align:center; font-weight:800; color:#475569;">양변 동일 연산</div>' +
            '<div class="control-group">' +
              '<select id="op-select">' +
                '<option value="add">더하기 (+)</option>' +
                '<option value="sub">빼기 (-)</option>' +
                '<option value="div">나누기 (/)</option>' +
              '</select>' +
              '<input type="number" id="op-value" value="1" min="1" max="100" style="width:70px;">' +
              '<select id="op-type">' +
                '<option value="const">상수 추</option>' +
                '<option value="x">x 상자</option>' +
              '</select>' +
            '</div>' +
            '<button class="btn-apply" id="btn-apply">적용하기 🚀</button>' +
            '<button class="btn" style="margin-left:auto; background:#fef3c7; color:#d97706;" id="btn-hint">💡 힌트 (-3점)</button>' +
          '</div>' +
          
          '<div class="end-round-banner" id="end-round-banner">' +
            '<div class="end-round-title" id="banner-title">결과</div>' +
            '<div class="end-round-text" id="banner-text" style="color:#065f46; font-size:1.1rem; margin-bottom:10px; font-weight:700;">내용</div>' +
            '<button class="btn btn-primary" style="font-size:1.1rem; padding:10px 20px;" id="btn-next-round">다음 문제로 ➡️</button>' +
          '</div>' +
        '</div>' +
        
        '<div class="bottom-ranking-card" id="board-equation-seesaw-wrapper">' +
          '<div class="ranking-title">🏆 명예의 전당 (최고 점수)</div>' +
          '<div id="board-equation-seesaw">' +
            '<p style="text-align:center; color:#94a3b8; padding:12px 0;">로딩 중...</p>' +
          '</div>' +
        '</div>' +
      '</div>';

    // Events
    host.querySelector('#btn-home').addEventListener('click', goHome);
    host.querySelector('#btn-guide').addEventListener('click', showGuideModal);
    host.querySelector('#btn-end').addEventListener('click', endAndRegister);
    host.querySelector('#btn-next-round').addEventListener('click', nextRound);
    host.querySelector('#btn-apply').addEventListener('click', applyOperation);
    host.querySelector('#btn-hint').addEventListener('click', useHint);
    
    host.querySelector('#op-select').addEventListener('change', handleOpSelectChange);

    setTimeout(function() {
      fullResetGame();
      renderBottomLeaderboard();
    }, 100);
  }

  function destroy() {
    if (host) host.innerHTML = '';
  }

  return { mount: mount, resetGame: fullResetGame, destroy: destroy, goHome: goHome };
})();

function registerEquationSeesaw() {
  if (typeof window.MathLabGames !== 'undefined' && typeof window.MathLabGames.register === 'function') {
    if (!window.MathLabGames.get('equation-seesaw')) {
      try {
        window.MathLabGames.register({
          id: 'equation-seesaw',
          title: '방정식 시소 밸런스',
          icon: '⚖️',
          sourceType: 'new',
          players: '1인',
          isMultiplayer: false,
          mount: function(container, context) { EquationSeesaw.mount(container, context); },
          reset: function() { EquationSeesaw.resetGame(); },
          destroy: function() { EquationSeesaw.destroy(); },
          goHome: function() { EquationSeesaw.goHome(); }
        });
      } catch (e) {
        console.warn('equation-seesaw 안전 등록 방어:', e);
      }
    }
  }
}

registerEquationSeesaw();
window.addEventListener('DOMContentLoaded', registerEquationSeesaw);
setTimeout(registerEquationSeesaw, 100);
setTimeout(registerEquationSeesaw, 500);

window.EquationSeesawModule = EquationSeesaw;

window.initEquationSeesawGame = function() {
  registerEquationSeesaw();
  if (window.LegacyBridge && typeof window.LegacyBridge.hideAllLegacySections === 'function') {
    window.LegacyBridge.hideAllLegacySections();
    window.LegacyBridge.showNewRoot();
  }
  if (typeof window.MathLabGames !== 'undefined' && typeof window.MathLabGames.mount === 'function') {
    try { window.MathLabGames.mount('equation-seesaw'); return; } catch(e) {}
  }
  const targetEl = document.getElementById('mathlab-view') || document.getElementById('new-root');
  EquationSeesaw.mount(targetEl);
};

window.launchMathLabGame = window.launchMathLabGame || function(id) {
  if (id === 'equation-seesaw') {
    window.initEquationSeesawGame();
  }
};
</script>
