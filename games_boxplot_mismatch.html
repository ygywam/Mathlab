<style>
.game-boxplot-mismatch,.game-boxplot-mismatch *{box-sizing:border-box}
.game-boxplot-mismatch{max-width:1040px;margin:0 auto;padding:16px;font-family:Pretendard,'Noto Sans KR',sans-serif;background:#f8fafc;color:#0f172a;border-radius:16px}
.bpm-h{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.bpm-t{font-size:1.35rem;font-weight:900;margin:0}
.bpm-btn{border:1px solid #cbd5e1;background:#fff;border-radius:10px;padding:8px 12px;font-weight:700;cursor:pointer}
.bpm-btn.p{background:#0284c7;border-color:#0284c7;color:#fff}
.bpm-btn.g{background:#059669;border-color:#059669;color:#fff}
.bpm-chip{background:#fff;border:1px solid #e2e8f0;border-radius:999px;padding:5px 12px;font-size:.88rem;font-weight:700}
.bpm-chip b{color:#0284c7}
.bpm-bar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.bpm-diff{flex:1;min-width:90px;padding:8px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;font-weight:800;cursor:pointer}
.bpm-diff.on{background:#e0f2fe;border-color:#0284c7;color:#0369a1}
.bpm-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:800px){.bpm-grid{grid-template-columns:1fr}}
.bpm-col h4{margin:0 0 8px}
.bpm-card{background:#fff;border:2px solid #e2e8f0;border-radius:12px;padding:10px;margin-bottom:8px;cursor:pointer}
.bpm-card.on{border-color:#0284c7;background:#e0f2fe}
.bpm-card.ok{border-color:#059669;background:#ecfdf5}
.bpm-card canvas{width:100%;display:block}
.bpm-msg{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:12px;margin-top:10px;min-height:3em;line-height:1.5}
.bpm-note{background:#f0f9ff;border:1px solid #bae6fd;border-radius:10px;padding:10px;font-size:.88rem;margin-top:8px}
.bpm-toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-12px);background:#0f172a;color:#fff;padding:10px 18px;border-radius:12px;font-weight:700;z-index:9500;opacity:0;pointer-events:none;transition:.25s}
.bpm-toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.bpm-toast.ok{background:#059669}.bpm-toast.err{background:#dc2626}
.bpm-modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;z-index:9000;padding:16px}
.bpm-modal.on{display:flex}.bpm-modal .box{background:#fff;border-radius:14px;max-width:460px;width:100%;padding:18px;max-height:80vh;overflow:auto}
</style>
<script>
(function(){
'use strict';
var APP_ID='boxplot-mismatch',APP_TITLE='상자수염 그림 미스매치',BOARD='board-boxplot-mismatch',TOTAL=5;
var state={mounted:false,host:null,diff:'normal',round:1,score:0,finished:false,pairs:0,items:[],leftOrder:[],rightOrder:[],leftSel:null,rightSel:null,matched:{},hintUsed:false,pending:[]};
function byId(id){return document.getElementById(id)}
function setText(id,v){var el=byId(id);if(el)el.textContent=String(v)}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
var toastT=null;function toast(m,t){var el=byId('bpm-toast');if(!el)return;el.textContent=m;el.className='bpm-toast on'+(t?' '+t:'');if(toastT)clearTimeout(toastT);toastT=setTimeout(function(){el.className='bpm-toast'},2200)}
function quantile(sorted,p){var n=sorted.length;if(!n)return 0;var i=(n-1)*p,lo=Math.floor(i),hi=Math.ceil(i);if(lo===hi)return sorted[lo];return sorted[lo]*(hi-i)+sorted[hi]*(i-lo)}
function five(arr){var s=arr.slice().sort(function(a,b){return a-b});var q1=quantile(s,.25),med=quantile(s,.5),q3=quantile(s,.75),iqr=q3-q1,loB=q1-1.5*iqr,hiB=q3+1.5*iqr,out=[],i,whiskLo=s[0],whiskHi=s[s.length-1];for(i=0;i<s.length;i++){if(s[i]<loB||s[i]>hiB)out.push(s[i])}for(i=0;i<s.length;i++){if(s[i]>=loB){whiskLo=s[i];break}}for(i=s.length-1;i>=0;i--){if(s[i]<=hiB){whiskHi=s[i];break}}return{min:s[0],q1:q1,med:med,q3:q3,max:s[s.length-1],iqr:iqr,whiskLo:whiskLo,whiskHi:whiskHi,out:out,data:s}}
function randn(){var u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
function genDist(kind){var n=40+Math.floor(Math.random()*20),a=[],i;if(kind==='sym'){for(i=0;i<n;i++)a.push(50+8*randn())}else if(kind==='right'){for(i=0;i<n;i++)a.push(30+Math.abs(12*randn())+Math.random()*8)}else if(kind==='left'){for(i=0;i<n;i++)a.push(70-Math.abs(12*randn())-Math.random()*8)}else if(kind==='wide'){for(i=0;i<n;i++)a.push(50+18*randn())}else if(kind==='narrow'){for(i=0;i<n;i++)a.push(50+3.5*randn())}else{for(i=0;i<n;i++)a.push(45+7*randn());a.push(45+7*randn()+28);a.push(45+7*randn()-26)}return five(a)}
var KINDS=['sym','right','left','wide','narrow','outlier'];
var LABELS={sym:'대칭',right:'오른쪽 치우침',left:'왼쪽 치우침',wide:'분산 큼',narrow:'분산 작음',outlier:'이상치 포함'};
function shuffle(a){var b=a.slice(),i,j,t;for(i=b.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));t=b[i];b[i]=b[j];b[j]=t}return b}
function startRound(){var n=state.diff==='easy'?3:(state.diff==='hard'?5:4);var kinds=shuffle(KINDS).slice(0,n);var items=kinds.map(function(k,i){return{id:i,kind:k,f:genDist(k)}});state.items=items;state.pairs=n;state.leftOrder=shuffle(items.map(function(x){return x.id}));state.rightOrder=shuffle(items.map(function(x){return x.id}));state.matched={};state.leftSel=null;state.rightSel=null;state.hintUsed=false;render();}
function drawBox(cv,f){var ctx=cv.getContext('2d'),W=cv.width,H=cv.height;ctx.clearRect(0,0,W,H);ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);var pad=28,all=[f.whiskLo,f.whiskHi].concat(f.out),mn=Math.min.apply(null,all),mx=Math.max.apply(null,all),span=mx-mn||1;function X(v){return pad+(v-mn)/span*(W-pad*2)}var y=H/2;ctx.strokeStyle='#0284c7';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(X(f.whiskLo),y);ctx.lineTo(X(f.q1),y);ctx.moveTo(X(f.q3),y);ctx.lineTo(X(f.whiskHi),y);ctx.stroke();ctx.fillStyle='rgba(2,132,199,.18)';ctx.fillRect(X(f.q1),y-18,Math.max(2,X(f.q3)-X(f.q1)),36);ctx.strokeRect(X(f.q1),y-18,Math.max(2,X(f.q3)-X(f.q1)),36);ctx.beginPath();ctx.moveTo(X(f.med),y-18);ctx.lineTo(X(f.med),y+18);ctx.stroke();ctx.beginPath();ctx.moveTo(X(f.whiskLo),y-8);ctx.lineTo(X(f.whiskLo),y+8);ctx.moveTo(X(f.whiskHi),y-8);ctx.lineTo(X(f.whiskHi),y+8);ctx.stroke();ctx.fillStyle='#dc2626';f.out.forEach(function(v){ctx.beginPath();ctx.arc(X(v),y,3.5,0,Math.PI*2);ctx.fill()});ctx.fillStyle='#64748b';ctx.font='10px sans-serif';ctx.fillText('Q1',X(f.q1)-6,y-22);ctx.fillText('Q3',X(f.q3)-6,y-22)}
function drawHist(cv,f){var ctx=cv.getContext('2d'),W=cv.width,H=cv.height;ctx.clearRect(0,0,W,H);ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);var data=f.data,bins=10,mn=data[0],mx=data[data.length-1],bw=(mx-mn)/bins||1,counts=Array(bins).fill(0);data.forEach(function(v){var b=Math.min(bins-1,Math.floor((v-mn)/bw));counts[b]++});var maxC=Math.max.apply(null,counts)||1,pad=20,iw=W-pad*2,ih=H-pad*2;ctx.fillStyle='rgba(2,132,199,.45)';counts.forEach(function(c,i){var x=pad+i*(iw/bins),h=c/maxC*ih;ctx.fillRect(x+1,pad+ih-h,iw/bins-2,h)});ctx.strokeStyle='#e2e8f0';ctx.strokeRect(pad,pad,iw,ih)}
function drawAll(){state.leftOrder.forEach(function(id){var it=state.items[id],cv=byId('bpm-box-'+id);if(cv)drawBox(cv,it.f)});state.rightOrder.forEach(function(id){var it=state.items[id],cv=byId('bpm-hist-'+id);if(cv)drawHist(cv,it.f)})}
function render(){setText('bpm-round',state.round+'/'+TOTAL);setText('bpm-score',state.score);var left=byId('bpm-left'),right=byId('bpm-right');if(!left||!right)return;
left.innerHTML=state.leftOrder.map(function(id){var m=state.matched[id];var cls=m==='ok'?' ok':(state.leftSel===id?' on':'');return '<div class="bpm-card'+cls+'" data-side="L" data-id="'+id+'"><div style="font-weight:800;margin-bottom:4px">박스플롯 '+(id+1)+'</div><canvas id="bpm-box-'+id+'" width="320" height="90"></canvas></div>'}).join('');
right.innerHTML=state.rightOrder.map(function(id,idx){var m=state.matched[id];var cls=m==='ok'?' ok':(state.rightSel===id?' on':'');return '<div class="bpm-card'+cls+'" data-side="R" data-id="'+id+'"><div style="font-weight:800;margin-bottom:4px">분포 '+String.fromCharCode(65+idx)+'</div><canvas id="bpm-hist-'+id+'" width="320" height="90"></canvas></div>'}).join('');
document.querySelectorAll('.bpm-diff').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-d')===state.diff)});bindCards();setTimeout(drawAll,0)}
function bindCards(){document.querySelectorAll('.bpm-card').forEach(function(card){card.onclick=function(){if(state.finished)return;var id=parseInt(card.getAttribute('data-id'),10),side=card.getAttribute('data-side');if(state.matched[id]==='ok')return;if(side==='L')state.leftSel=id;else state.rightSel=id;if(state.leftSel!=null&&state.rightSel!=null)tryMatch();else render()}})}
function tryMatch(){var L=state.leftSel,R=state.rightSel;if(L===R){state.matched[L]='ok';state.score+=25;toast('짝 맞춤! +25','ok');var f=state.items[L].f;setText('bpm-msg','맞음: Q1='+f.q1.toFixed(1)+', 중앙값='+f.med.toFixed(1)+', Q3='+f.q3.toFixed(1)+', IQR='+f.iqr.toFixed(1)+(f.out.length?' / 이상치 '+f.out.length+'개':''))}else{state.score=Math.max(0,state.score-5);toast('다시 시도 -5','err');setText('bpm-msg','다른 분포입니다. 수염·상자·이상치를 비교하세요.')}state.leftSel=null;state.rightSel=null;setText('bpm-score',state.score);var done=Object.keys(state.matched).filter(function(k){return state.matched[k]==='ok'}).length;if(done>=state.pairs){state.score+=30;setText('bpm-score',state.score);toast('라운드 클리어 +30','ok');var t=setTimeout(function(){if(state.round>=TOTAL)finish();else{state.round++;startRound()}},900);state.pending.push(t)}else render()}
function finish(){state.finished=true;toast('종료 '+state.score+'점','ok');openRank(true)}
function openRank(reg){var m=byId('bpm-modal');var list=[];try{list=JSON.parse(localStorage.getItem('mathlab_lb_boxplot')||'[]')}catch(e){}
var rows=list.slice(0,5).map(function(it,i){return '<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #e2e8f0"><span>'+(i+1)+' '+esc(it.nickname)+'</span><b style="color:#0284c7">'+it.score+'</b></div>'}).join('')||'<p style="color:#64748b">기록 없음</p>';
var regH=reg?'<p><b>최종 '+state.score+'점</b></p><input id="bpm-nick" maxlength="12" placeholder="닉네임" style="width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px"><button class="bpm-btn p" id="bpm-save" style="width:100%;margin-top:8px">등록</button>':'';
m.innerHTML='<div class="box"><h3>🏆 명예의 전당</h3>'+regH+rows+'<button class="bpm-btn" id="bpm-close" style="width:100%;margin-top:10px">닫기</button></div>';m.className='bpm-modal on';byId('bpm-close').onclick=function(){m.className='bpm-modal'};
var sb=byId('bpm-save');if(sb)sb.onclick=function(){var nm=(byId('bpm-nick').value||'익명').trim().slice(0,12);try{if(typeof submitRanking==='function')submitRanking(APP_TITLE,state.score,true,nm,BOARD)}catch(e){}try{list.push({nickname:nm,score:state.score});list.sort(function(a,b){return b.score-a.score});localStorage.setItem('mathlab_lb_boxplot',JSON.stringify(list.slice(0,20)))}catch(e){}toast('저장','ok');m.className='bpm-modal';loadRank()}}
function loadRank(){var el=byId(BOARD);if(!el)return;if(typeof loadGameLeaderboard==='function'){try{loadGameLeaderboard(APP_TITLE,true,BOARD);return}catch(e){}}var list=[];try{list=JSON.parse(localStorage.getItem('mathlab_lb_boxplot')||'[]')}catch(e){}el.innerHTML=list.length?list.slice(0,5).map(function(it,i){return '<div style="display:flex;justify-content:space-between;padding:8px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;margin-bottom:6px"><span>'+(i+1)+' '+esc(it.nickname)+'</span><b style="color:#0284c7">'+it.score+'</b></div>'}).join(''):'<p style="text-align:center;color:#94a3b8">기록 없음</p>'}
function showHint(){if(state.hintUsed)return;state.hintUsed=true;state.score=Math.max(0,state.score-10);setText('bpm-score',state.score);setText('bpm-msg','힌트(-10): '+state.items.map(function(it){return (it.id+1)+':'+LABELS[it.kind]+'(IQR '+it.f.iqr.toFixed(1)+')'}).join(' / '));toast('힌트','err')}
function html(){return '<div class="game-boxplot-mismatch" id="bpm-root"><div class="bpm-h"><h2 class="bpm-t">📦 상자수염 그림 미스매치</h2><div style="display:flex;gap:6px"><button type="button" class="bpm-btn" id="bpm-guide">📖 게임방법</button><button type="button" class="bpm-btn" id="bpm-home">🏠 홈</button></div></div>'+
'<div class="bpm-bar"><button type="button" class="bpm-diff" data-d="easy">쉬움</button><button type="button" class="bpm-diff on" data-d="normal">보통</button><button type="button" class="bpm-diff" data-d="hard">도전</button></div>'+
'<div class="bpm-bar"><span class="bpm-chip">라운드 <b id="bpm-round">1/5</b></span><span class="bpm-chip">점수 <b id="bpm-score">0</b></span></div>'+
'<div class="bpm-grid"><div class="bpm-col"><h4>왼쪽: 상자수염</h4><div id="bpm-left"></div></div><div class="bpm-col"><h4>오른쪽: 분포</h4><div id="bpm-right"></div></div></div>'+
'<div class="bpm-msg" id="bpm-msg">왼쪽 박스플롯과 오른쪽 분포를 탭-탭으로 짝지으세요.</div>'+
'<div class="bpm-bar"><button type="button" class="bpm-btn" id="bpm-hint">💡 힌트(-10)</button><button type="button" class="bpm-btn" id="bpm-restart">🔄</button><button type="button" class="bpm-btn p" id="bpm-rank">🏆</button></div>'+
'<div class="bpm-note">이상치: Q1−1.5×IQR 미만 또는 Q3+1.5×IQR 초과. 사분위는 정렬 후 25/50/75% 위치.</div>'+
'<div style="margin-top:12px;background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:12px"><div style="font-weight:900;margin-bottom:8px">🏆 명예의 전당</div><div id="'+BOARD+'"></div></div>'+
'<div class="bpm-toast" id="bpm-toast"></div><div class="bpm-modal" id="bpm-modal"></div></div>'}
function bind(){byId('bpm-home').onclick=goHome;byId('bpm-hint').onclick=showHint;byId('bpm-rank').onclick=function(){openRank(state.finished)};byId('bpm-restart').onclick=function(){state.finished=false;state.round=1;state.score=0;startRound()};
byId('bpm-guide').onclick=function(){var m=byId('bpm-modal');m.innerHTML='<div class="box"> <h3 style="margin-top:0; color:#0284c7; border-bottom:2px solid #e0f2fe; padding-bottom:8px;">📖 상자수염 그림 미스매치 게임 방법</h3> <div style="font-size:0.95rem; line-height:1.6; color:#334155;"> <p><strong>1. 상자수염 그림이란?</strong><br> 자료의 분포를 5가지 요약 수치(최솟값, 제1사분위수(Q1), 중앙값, 제3사분위수(Q3), 최댓값)를 이용해 상자와 수염 모양으로 시각화한 그래프입니다. 자료가 어떻게 흩어져 있는지, 어느 쪽으로 치우쳐 있는지를 파악할 때 유용합니다.</p> <p><strong>2. 분포 히스토그램과의 관계</strong><br> - <b>대칭 분포:</b> 중앙값이 상자의 가운데에 위치하고, 좌우 수염의 길이가 비슷합니다.<br> - <b>치우친 분포:</b> 막대그래프의 꼬리가 길게 늘어진 쪽으로 상자수염의 길이도 길어집니다. (오른쪽으로 치우치면 오른쪽 수염과 상자 오른쪽 절반이 깁니다)<br> - <b>분산(퍼짐 정도):</b> 넓게 퍼진 자료일수록 사분위수 범위(IQR)가 커져 상자의 폭이 넓어집니다.</p> <p><strong>3. 게임 매칭 팁!</strong><br> 왼쪽의 상자수염 그림과 오른쪽의 분포를 하나씩 <b style="color:#0284c7;">\'탭-탭\'</b>하여 짝을 맞추세요.<br> 중앙값의 위치, 상자(IQR)의 너비, 꼬리의 길이와 이상치 유무를 단서로 활용하면 정답을 찾기 쉽습니다!</p> </div> <button class="bpm-btn p" id="bpm-close" style="width:100%; margin-top:16px;">확인</button></div>';m.className='bpm-modal on';byId('bpm-close').onclick=function(){m.className='bpm-modal'}};
document.querySelectorAll('.bpm-diff').forEach(function(b){b.onclick=function(){state.diff=b.getAttribute('data-d');state.finished=false;state.round=1;state.score=0;startRound()}})}
function mount(c){var host=null;if(typeof c==='string'){try{host=document.querySelector(c)}catch(e){}}else if(c instanceof HTMLElement)host=c;if(!host)host=document.getElementById('mathlab-view')||document.getElementById('new-root');
if(!host||host===document.body){host=document.getElementById('boxplot-mismatch-force-host');if(!host){host=document.createElement('div');host.id='boxplot-mismatch-force-host';document.body.appendChild(host)}}host.style.display='';host.style.minHeight='60vh';state.host=host;state.mounted=true;host.innerHTML=html();bind();startRound();loadRank()}
function destroy(){state.pending.forEach(clearTimeout);state.pending=[];state.mounted=false;if(state.host)try{state.host.innerHTML=''}catch(e){}state.host=null}
function goHome(){destroy();var fh=document.getElementById('boxplot-mismatch-force-host');if(fh){fh.style.display='none';fh.innerHTML=''}var mv=document.getElementById('mathlab-view');if(mv){mv.style.display='none';mv.innerHTML=''}var ag=document.querySelector('.app-grid'),ds=document.getElementById('dashboard-screen');if(ag)ag.style.display='';if(ds)ds.style.display='';if(typeof window.goHome==='function')try{window.goHome()}catch(e){}}
var API={mount:mount,resetGame:function(){state.finished=false;state.round=1;state.score=0;startRound()},destroy:destroy,goHome:goHome};
function reg(){if(typeof window.MathLabGames==='undefined'||!window.MathLabGames.register)return;try{if(window.MathLabGames.get&&window.MathLabGames.get(APP_ID))return;window.MathLabGames.register({id:APP_ID,title:APP_TITLE,icon:'📦',sourceType:'new',mount:function(c,x){API.mount(c,x)},reset:function(){API.resetGame()},destroy:function(){API.destroy()},goHome:function(){API.goHome()}})}catch(e){console.warn(e)}}
reg();window.addEventListener('DOMContentLoaded',reg);setTimeout(reg,100);setTimeout(reg,500);
window.BoxplotMismatch=API;window.initBoxplotMismatchGame=function(){reg();if(window.MathLabGames&&window.MathLabGames.mount){try{window.MathLabGames.mount(APP_ID);return}catch(e){}}API.mount(document.getElementById('mathlab-view'))};window.launchBoxplotMismatchGame=window.initBoxplotMismatchGame;
})();
</script>
