<style>
@import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800;900&display=swap');
@import url('https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css');

.mp-app, .mp-app * { box-sizing: border-box; }
.mp-app {
  max-width: 1100px;
  margin: 0 auto;
  padding: 20px 22px 28px;
  font-family: 'Pretendard', system-ui, sans-serif;
  background: #f8fafc;
  color: #0f172a;
  border-radius: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.04);
}

/* Header */
.mp-app .h {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  background: #ffffff;
  padding: 16px 22px;
  border-radius: 16px;
  border: 1px solid #e2e8f0;
  box-shadow: 0 4px 6px rgba(0,0,0,0.02);
  margin-bottom: 16px;
}
.mp-app .t {
  font-size: 1.35rem;
  font-weight: 900;
  margin: 0;
  display: flex;
  align-items: center;
  gap: 8px;
  color: #0284c7;
}
.mp-app .sub-title {
  font-size: 0.88rem;
  color: #64748b;
  font-weight: 700;
}

/* Nav Tabs */
.mp-app .nav-tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
  background: #ffffff;
  padding: 6px;
  border-radius: 14px;
  border: 1px solid #e2e8f0;
}
.mp-app .tab-btn {
  flex: 1;
  padding: 12px 14px;
  border: none;
  border-radius: 10px;
  font-size: 0.98rem;
  font-weight: 800;
  cursor: pointer;
  background: transparent;
  color: #64748b;
  transition: all 0.2s;
  text-align: center;
}
.mp-app .tab-btn.active {
  background: #0ea5e9;
  color: #ffffff;
  box-shadow: 0 4px 12px rgba(14,165,233,0.25);
}

/* Card & Layout */
.mp-app .card {
  background: #ffffff;
  border: 1px solid #e2e8f0;
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 16px;
}
.mp-app .card-title {
  font-size: 1.15rem;
  font-weight: 900;
  color: #0f172a;
  margin-top: 0;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
  border-bottom: 2px solid #f1f5f9;
  padding-bottom: 10px;
}

.mp-app .grid-2 {
  display: grid;
  grid-template-columns: 1.25fr 1fr;
  gap: 16px;
}
@media(max-width: 860px) {
  .mp-app .grid-2 { grid-template-columns: 1fr; }
}

/* Coin Cards & Glowing Animations */
.mp-app .coin-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin: 16px 0;
}
.mp-app .coin-card {
  position: relative;
  padding: 24px 14px 18px;
  border-radius: 16px;
  border: 2px solid #cbd5e1;
  background: #ffffff;
  cursor: pointer;
  text-align: center;
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}
.mp-app .coin-card:hover {
  border-color: #0284c7;
  background: #f0f9ff;
  transform: translateY(-3px);
}

/* Blue Glow for User Selection */
.mp-app .coin-card.user-selected {
  border-color: #0284c7 !important;
  background: #f0f9ff !important;
  box-shadow: 0 10px 25px rgba(2, 132, 199, 0.45) !important;
  transform: translateY(-6px) !important;
}

/* Red Glow for AI Selection */
.mp-app .coin-card.ai-selected {
  border-color: #ef4444 !important;
  background: #fef2f2 !important;
  box-shadow: 0 10px 25px rgba(239, 68, 68, 0.45) !important;
  transform: translateY(-6px) !important;
}

/* Both Selected Purple Glow */
.mp-app .coin-card.both-selected {
  border-color: #8b5cf6 !important;
  background: #f5f3ff !important;
  box-shadow: 0 12px 28px rgba(139, 92, 246, 0.5) !important;
  transform: translateY(-8px) !important;
}

.mp-app .coin-icon { font-size: 2.5rem; margin-bottom: 6px; }
.mp-app .coin-title { font-size: 1.15rem; font-weight: 900; color: #0f172a; }

/* Badges on Cards */
.mp-app .badge-container {
  display: flex;
  gap: 4px;
  justify-content: center;
  margin-top: 8px;
  min-height: 24px;
}
.mp-app .badge {
  font-size: 0.75rem;
  font-weight: 800;
  padding: 3px 8px;
  border-radius: 999px;
  color: #ffffff;
}
.mp-app .badge.user { background: #0284c7; }
.mp-app .badge.ai { background: #ef4444; }

/* Role Select Buttons */
.mp-app .role-btn-group {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
}
.mp-app .role-btn {
  flex: 1;
  padding: 12px 10px;
  border-radius: 12px;
  border: 1px solid #cbd5e1;
  background: #ffffff;
  font-weight: 800;
  cursor: pointer;
  color: #64748b;
  text-align: center;
  transition: all 0.15s;
}
.mp-app .role-btn.active {
  background: #0284c7;
  border-color: #0284c7;
  color: #ffffff;
  box-shadow: 0 3px 0 #0369a1;
}

/* Payoff Table */
.mp-app table.payoff-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 10px;
  font-size: 0.92rem;
}
.mp-app table.payoff-table th, .mp-app table.payoff-table td {
  border: 1px solid #cbd5e1;
  padding: 12px;
  text-align: center;
  font-weight: 800;
}
.mp-app table.payoff-table th { background: #f1f5f9; color: #334155; }

/* Buttons & Inputs */
.mp-app .btn {
  border: 1px solid #cbd5e1;
  background: #ffffff;
  color: #1e293b;
  border-radius: 10px;
  padding: 10px 16px;
  font-weight: 800;
  cursor: pointer;
  font-size: 0.92rem;
  transition: all 0.15s;
}
.mp-app .btn:hover { background: #f1f5f9; }
.mp-app .btn.p { background: #0284c7; border-color: #0284c7; color: #ffffff; box-shadow: 0 3px 0 #0369a1; }
.mp-app .inp {
  width: 100%;
  display: block;
  padding: 12px 14px;
  border: 2px solid #cbd5e1;
  border-radius: 10px;
  font-size: 1rem;
  font-weight: 800;
  outline: none;
  background: #ffffff;
  margin-bottom: 8px;
}

/* History Flex */
.mp-app .hist-flex {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  max-height: 110px;
  overflow-y: auto;
  margin-top: 10px;
  padding: 8px;
  background: #f8fafc;
  border-radius: 10px;
  border: 1px solid #e2e8f0;
}
.mp-app .hist-chip {
  font-size: 0.82rem;
  padding: 4px 10px;
  border-radius: 8px;
  background: #ffffff;
  border: 1px solid #cbd5e1;
  font-weight: 800;
}

/* Math Display Box */
.mp-app .math-block {
  background: #ffffff;
  padding: 12px 18px;
  border-radius: 12px;
  display: block;
  border: 1px solid #bae6fd;
  margin: 10px 0;
  font-size: 1.05rem;
  overflow-x: auto;
}

/* Slide Modal */
.mp-app .modal { position: fixed; inset: 0; background: rgba(15,23,42,0.55); display: none; align-items: center; justify-content: center; z-index: 9400; padding: 14px; backdrop-filter: blur(4px); }
.mp-app .modal.on { display: flex; }
.mp-app .modal .mbox { background: #fff; border-radius: 18px; max-width: 600px; width: 100%; padding: 24px; max-height: 88vh; overflow: auto; box-shadow: 0 20px 50px rgba(15,23,42,0.3); }
.mp-app .dots { display: flex; gap: 6px; justify-content: center; margin: 16px 0 8px; }
.mp-app .dot { width: 8px; height: 8px; border-radius: 50%; background: #cbd5e1; transition: all 0.2s; }
.mp-app .dot.on { background: #0284c7; width: 22px; border-radius: 10px; }
</style>

var S = {
  host: null,
  activeTab: 'sim',
  role: 'match',
  aiDiff: 'normal',
  myH: 0,
  myT: 0,
  aiH: 0,
  aiT: 0,
  hist: [],
  score: 0,
  guidePage: 0
};

function $(id) { return document.getElementById(id); }

function renderMath(latex, container, displayMode) {
  if (typeof katex !== 'undefined' && container) {
    try {
      katex.render(latex, container, { throwOnError: false, displayMode: !!displayMode });
      return;
    } catch(e){}
  }
  if (container) container.textContent = latex;
}

function updateMathElements() {
  document.querySelectorAll('.math-tex').forEach(function(el) {
    var tex = el.getAttribute('data-tex');
    var isDisplay = el.getAttribute('data-display') === 'true';
    if (tex) renderMath(tex, el, isDisplay);
  });
}

function aiChoose() {
  var tot = S.myH + S.myT;
  if (S.aiDiff === 'easy' || tot < 3) {
    return Math.random() < 0.5 ? 'H' : 'T';
  }
  
  var pH = S.myH / tot;
  if (S.role === 'match') {
    return Math.random() < (1 - pH) ? 'H' : 'T';
  } else {
    return Math.random() < pH ? 'H' : 'T';
  }
}

    }
    
    host.style.display = ''; host.style.visibility = 'visible'; host.style.opacity = '1';

  bindEvents: function() {
    var _this = this;
    var root = S.host.querySelector('#mp-app-root');

    /* Tabs */
    root.querySelectorAll('.tab-btn').forEach(function(btn) {
      btn.onclick = function() {
        root.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
        this.classList.add('active');
        S.activeTab = this.getAttribute('data-tab');

        root.querySelector('#tab-sec-sim').style.display = (S.activeTab === 'sim') ? 'block' : 'none';
        root.querySelector('#tab-sec-math').style.display = (S.activeTab === 'math') ? 'block' : 'none';
        root.querySelector('#tab-sec-prob').style.display = (S.activeTab === 'prob') ? 'block' : 'none';

        updateMathElements();
      };
    });

    /* Roles */
    root.querySelector('#btn-role-match').onclick = function() {
      S.role = 'match';
      this.classList.add('active');
      root.querySelector('#btn-role-mis').classList.remove('active');
      _this.resetSim();
    };
    root.querySelector('#btn-role-mis').onclick = function() {
      S.role = 'mis';
      this.classList.add('active');
      root.querySelector('#btn-role-match').classList.remove('active');
      _this.resetSim();
    };

    /* Actions */
    root.querySelector('#btn-coin-h').onclick = function() { _this.step('H'); };
    root.querySelector('#btn-coin-t').onclick = function() { _this.step('T'); };
    root.querySelector('#btn-reset-sim').onclick = function() { _this.resetSim(); };

    /* Quiz */
    root.querySelector('#btn-submit-quiz').onclick = function() {
      var val = (root.querySelector('#inp-quiz-ans').value || '').trim();
      var msgEl = root.querySelector('#lbl-quiz-msg');
      if (val === '0.5' || val === '1/2' || val === '50%' || val === '0.50') {
        msgEl.innerHTML = '✅ <b>정답입니다!</b> 50%:50% (p* = 0.5) 무작위 혼합 전략이 유일한 내쉬 균형입니다.';
        msgEl.style.color = '#059669';
      } else {
        msgEl.innerHTML = '❌ 오답입니다. (힌트: 양측이 완전히 예측 불가능하도록 만드는 확률 1/2입니다)';
        msgEl.style.color = '#ef4444';
      }
    };

    /* Solutions Toggle */
    root.querySelectorAll('.btn-show-sol').forEach(function(btn) {
      btn.onclick = function() {
        var idx = this.getAttribute('data-idx');
        var solEl = root.querySelector('#sol-' + idx);
        if (solEl) {
          var isShown = solEl.style.display === 'block';
          solEl.style.display = isShown ? 'none' : 'block';
          this.textContent = isShown ? '💡 수학적 해설 보기' : '🙈 해설 닫기';
          updateMathElements();
        }
      };
    });

    /* Modal Open & Render Slide */
    root.querySelector('#btn-open-guide').onclick = function() {
      S.guidePage = 0;
      _this.renderSlideGuide();
      root.querySelector('#mp-modal').classList.add('on');
    };
  },

  renderSlideGuide: function() {
    var _this = this;
    var root = S.host.querySelector('#mp-app-root');
    var mBox = root.querySelector('#mp-modal-box');
    if (!mBox) return;

    var pg = SLIDE_GUIDE[S.guidePage] || SLIDE_GUIDE[0];
    var dots = SLIDE_GUIDE.map(function(_, i) {
      return '<span class="dot' + (i === S.guidePage ? ' on' : '') + '"></span>';
    }).join('');
    var isLast = S.guidePage >= SLIDE_GUIDE.length - 1;

    var h = '';
    h += '<div style="font-size:.8rem; font-weight:800; color:#0284c7; margin-bottom:4px;">온보딩 슬라이드 탐구 ' + (S.guidePage + 1) + ' / ' + SLIDE_GUIDE.length + '</div>';
    h += '<h3 style="margin:0 0 12px; color:#0f172a; font-weight:900;">' + pg.title + '</h3>';
    h += '<div style="line-height:1.65; color:#334155; font-size:0.95rem;">' + pg.html + '</div>';
    h += '<div class="dots">' + dots + '</div>';

    h += '<div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px;">';
    h += '  <button type="button" class="btn" id="btn-slide-prev"' + (S.guidePage === 0 ? ' disabled' : '') + '>← 이전</button>';
    h += '  <button type="button" class="btn p" id="btn-slide-next">' + (isLast ? '탐구 시작하기 🚀' : '다음 →') + '</button>';
    h += '</div>';

    mBox.innerHTML = h;
    updateMathElements();

    var prevBtn = mBox.querySelector('#btn-slide-prev');
    var nextBtn = mBox.querySelector('#btn-slide-next');

    if (prevBtn) {
      prevBtn.onclick = function() {
        if (S.guidePage > 0) {
          S.guidePage--;
          _this.renderSlideGuide();
        }
      };
    }
    if (nextBtn) {
      nextBtn.onclick = function() {
        if (isLast) {
          root.querySelector('#mp-modal').classList.remove('on');
        } else {
          S.guidePage++;
          _this.renderSlideGuide();
        }
      };
    }
  },

  step: function(myChoice) {
    var aiChoice = aiChoose();
    
    if (myChoice === 'H') S.myH++; else S.myT++;
    if (aiChoice === 'H') S.aiH++; else S.aiT++;

    var same = (myChoice === aiChoice);
    var delta = 0;
    if (S.role === 'match') {
      delta = same ? 1 : -1;
    } else {
      delta = same ? -1 : 1;
    }
    S.score += delta;
    S.hist.push({ me: myChoice, ai: aiChoice, d: delta });

    var root = S.host.querySelector('#mp-app-root');

    /* Visual Glow Animation & Badges */
    var cardH = root.querySelector('#btn-coin-h');
    var cardT = root.querySelector('#btn-coin-t');
    var badgeBoxH = root.querySelector('#badge-box-h');
    var badgeBoxT = root.querySelector('#badge-box-t');

    // Reset Glow Classes
    cardH.className = 'coin-card';
    cardT.className = 'coin-card';
    badgeBoxH.innerHTML = '';
    badgeBoxT.innerHTML = '';

    // Apply Glowing Styles
    if (myChoice === aiChoice) {
      // Both selected same coin
      var targetCard = (myChoice === 'H') ? cardH : cardT;
      var targetBox = (myChoice === 'H') ? badgeBoxH : badgeBoxT;
      targetCard.classList.add('both-selected');
      targetBox.innerHTML = '<span class="badge user">나의 선택</span><span class="badge ai">AI 선택</span>';
    } else {
      // User Card (Blue Glow)
      var uCard = (myChoice === 'H') ? cardH : cardT;
      var uBox = (myChoice === 'H') ? badgeBoxH : badgeBoxT;
      uCard.classList.add('user-selected');
      uBox.innerHTML = '<span class="badge user">나의 선택</span>';

      // AI Card (Red Glow)
      var aCard = (aiChoice === 'H') ? cardH : cardT;
      var aBox = (aiChoice === 'H') ? badgeBoxH : badgeBoxT;
      aCard.classList.add('ai-selected');
      aBox.innerHTML += '<span class="badge ai">AI 선택</span>';
    }

    var resEl = root.querySelector('#lbl-last-res');
    var myText = (myChoice === 'H') ? '앞면' : '뒷면';
    var aiText = (aiChoice === 'H') ? '앞면' : '뒷면';

    if (delta > 0) {
      resEl.innerHTML = '🎉 <b>나의 승리!</b> 나: ' + myText + ' vs AI: ' + aiText + ' (보수 +1점)';
    } else {
      resEl.innerHTML = '😭 <b>AI의 승리!</b> 나: ' + myText + ' vs AI: ' + aiText + ' (보수 -1점)';
    }

    this.hud();
  },

  resetSim: function() {
    S.myH = 0; S.myT = 0;
    S.aiH = 0; S.aiT = 0;
    S.hist = [];
    S.score = 0;

    var root = S.host.querySelector('#mp-app-root');
    if (root) {
      var cardH = root.querySelector('#btn-coin-h');
      var cardT = root.querySelector('#btn-coin-t');
      if (cardH) cardH.className = 'coin-card';
      if (cardT) cardT.className = 'coin-card';
      var badgeBoxH = root.querySelector('#badge-box-h');
      var badgeBoxT = root.querySelector('#badge-box-t');
      if (badgeBoxH) badgeBoxH.innerHTML = '';
      if (badgeBoxT) badgeBoxT.innerHTML = '';

      var resEl = root.querySelector('#lbl-last-res');
      if (resEl) resEl.textContent = '동전 면을 눌러 대결을 진행하세요.';
    }
    this.hud();
  },

  hud: function() {
    var root = S.host.querySelector('#mp-app-root');
    if (!root) return;

    var myTot = S.myH + S.myT;
    var aiTot = S.aiH + S.aiT;

    var myP = myTot ? ((S.myH / myTot) * 100).toFixed(1) : '— ';
    var aiQ = aiTot ? ((S.aiH / aiTot) * 100).toFixed(1) : '— ';
    var avgPayoff = myTot ? (S.score / myTot).toFixed(2) : '0.00';

    root.querySelector('#lbl-tot-count').textContent = myTot;
    root.querySelector('#lbl-my-p').textContent = myP + '%';
    root.querySelector('#lbl-ai-q').textContent = aiQ + '%';
    root.querySelector('#lbl-my-score').textContent = S.score;
    root.querySelector('#lbl-avg-payoff').textContent = avgPayoff;

    var container = root.querySelector('#hist-container');
    container.innerHTML = S.hist.slice(-40).map(function(h, idx) {
      var colorStyle = h.d > 0 ? 'color:#059669;' : 'color:#ef4444;';
      var mText = h.me === 'H' ? '앞' : '뒤';
      var aText = h.ai === 'H' ? '앞' : '뒤';
      return '<div class="hist-chip" style="' + colorStyle + '">#' + (idx + 1) + ' 나:' + mText + ' AI:' + aText + ' (' + (h.d > 0 ? '+1' : '-1') + ')</div>';
    }).join('');
  },

  destroy: function() {
    if (S.host) S.host.innerHTML = '';
    S.host = null;
  }
};

function goHome() {
  if (S.host) S.host.innerHTML = '';
  if (typeof window.LegacyBridge !== 'undefined' && typeof window.LegacyBridge.backHome === 'function') {
    window.LegacyBridge.backHome();
  } else if (typeof window.MathLabGames !== 'undefined' && window.MathLabGames.goHome) {
    window.MathLabGames.goHome();
  } else {
    window.location.reload();
  }
}

function reg() {
  if (typeof window.MathLabGames === 'undefined' || typeof window.MathLabGames.register !== 'function') return;
  try {
    if (window.MathLabGames.get && window.MathLabGames.get(APP_ID)) return;
    window.MathLabGames.register({
      id: APP_ID,
      title: APP_TITLE,
      icon: ICON,
      sourceType: 'new',
      players: '1인',
      isMultiplayer: false,
      mount: function(c, x) { MatchingPenniesApp.mount(c, x); },
      reset: function() { MatchingPenniesApp.resetSim(); },
      destroy: function() { MatchingPenniesApp.destroy(); },
      goHome: function() { goHome(); }
    });
  } catch (e) {
    console.warn(APP_ID + ' reg', e);
  }
}

reg();
window.addEventListener('DOMContentLoaded', reg);
setTimeout(reg, 100);
setTimeout(reg, 500);

window.MatchingPennies = {
  mount: function(c) { MatchingPenniesApp.mount(c); },
  resetGame: function() { MatchingPenniesApp.resetSim(); },
  destroy: function() { MatchingPenniesApp.destroy(); },
  goHome: goHome
};

window.initMatchingPennies = function() {
  reg();
  try {
    if (window.LegacyBridge) {
      window.LegacyBridge.hideAllLegacySections();
      if (window.LegacyBridge.showNewRoot) window.LegacyBridge.showNewRoot();

  } catch (e) {}
  if (window.MathLabGames && window.MathLabGames.mount) {
    try { window.MathLabGames.mount(APP_ID); return; } catch (e) {}
  }
