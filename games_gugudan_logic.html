<script>
  /* ==========================================================================
     GugudanLogic - 구구단 카운트다운 (Multiplication Defense Engine)
     Gen-3 수학 실험실 100% 완전 분리 표준 규격 & 2인 전자칠판 VS 배틀 완결판
     ========================================================================== */
  const GugudanLogic = (function() {
    function escapeHTML(str) {
      if (!str) return '';
      return String(str).replace(/[&<>'"/]/g, function (s) {
        return {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          "'": '&#39;',
          '"': '&quot;',
          '/': '&#x2F;'
        }[s];
      });
    }

    let gameMode = '1p'; // '1p' or '2p'
    let levelMode = 'basic'; // 'basic' (2~9단), 'advanced' (11~19단)
    let isRunning = false;
    let reqId = null;
    let frameCount = 0;

    // 1인 탐구 모드 상태
    let entities = {};
    let nextId = 0;
    let score = 0;
    let life = 5;

    // 2인 대결 모드 상태 (P1 / P2)
    let entitiesP1 = {}, entitiesP2 = {};
    let nextIdP1 = 0, nextIdP2 = 0;
    let scoreP1 = 0, scoreP2 = 0;
    let lifeP1 = 5, lifeP2 = 5;
    let p1Wins = 0, p2Wins = 0;

    /* --------------------------------------------------------------------------
       Gen-3 동적 마운트 (mount)
       -------------------------------------------------------------------------- */
    function mount(container, context) {
      let host = null;
      if (typeof container === 'string') host = document.querySelector(container);
      else if (container instanceof HTMLElement) host = container;
      if (!host) host = window.MathLabUtils?.getMountContainer ? window.MathLabUtils.getMountContainer(container) : document.getElementById('mathlab-view');
      if (!host) host = document.getElementById('new-root') || document.getElementById('game-container');

      if (!host) {
        let createdHost = document.getElementById('gugudan-logic-force-host');
        if (!createdHost) {
          createdHost = document.createElement('div');
          createdHost.id = 'gugudan-logic-force-host';
          document.body.appendChild(createdHost);
        }
        host = createdHost;
      }

      const footerEl = document.querySelector('footer, #footer, .app-footer') || 
                       Array.from(document.querySelectorAll('div, p, span')).find(el => el.textContent && el.textContent.includes('2026 기록조율사'));
      if (footerEl && host.compareDocumentPosition(footerEl) & Node.DOCUMENT_POSITION_PRECEDING) {
        footerEl.parentNode.insertBefore(host, footerEl);
      }

      host.style.display = '';
      host.style.visibility = 'visible';
      host.style.opacity = '1';

      let parent = host.parentElement;
      while (parent && parent !== document.body && parent !== document.documentElement) {
        if (parent.style && parent.style.display === 'none') parent.style.display = 'block';
        if (parent.style && parent.style.visibility === 'hidden') parent.style.visibility = 'visible';
        parent = parent.parentElement;
      }

      document.querySelectorAll('header, .navbar, #app-header, .top-bar, #floating-home-btn, .floating-home').forEach(el => {
        if (el && el.style && el.style.display === 'none') el.style.display = '';
      });

      host.innerHTML = `
        <div class="game-gugudan-logic" id="gugudan-logic-app">
          <!-- 상단 헤더 -->
          <div class="stats-bar">
            <div class="title-group">
              <div class="title-icon">🚀</div>
              <div>
                <div style="display:flex; align-items:center; gap:8px;">
                  <span class="title-text">구구단 카운트다운 (Gugudan Defense)</span>
                  <span class="title-badge">연산 속도 & 스피드 격파</span>
                  <span class="title-badge-2p">👥 1~2인</span>
                </div>
              </div>
            </div>
            <div class="header-actions">

    /* --------------------------------------------------------------------------
       모드 및 단수 설정
       -------------------------------------------------------------------------- */
    function setPlayerMode(mode, isInitial = false) {
      if (!isInitial && mode === gameMode) return;
      gameMode = mode;

      const btn1p = document.getElementById('btn-gugu-pmode-1p');
      const btn2p = document.getElementById('btn-gugu-pmode-2p');
      const grid = document.getElementById('gugu-arenas-grid');
      const card2 = document.getElementById('gugu-arena-card-2');
      const rankHeaderBtn = document.getElementById('btn-rank-header');
      const bottomRankSec = document.getElementById('gugu-bottom-ranking-sec');
      const badgeScore = document.getElementById('badge-gugu-score');
      const badgeLife = document.getElementById('badge-gugu-life');
      const head1 = document.getElementById('gugu-arena-head-1');

      if (btn1p && btn2p) {
        if (mode === '1p') {
          btn1p.classList.add('active');
          btn2p.classList.remove('active');
          if (grid) grid.classList.remove('two-player');
          if (card2) card2.style.display = 'none';
          if (rankHeaderBtn) rankHeaderBtn.style.display = 'inline-flex';
          if (bottomRankSec) bottomRankSec.style.display = 'flex';
          if (badgeScore) badgeScore.style.display = 'flex';
          if (badgeLife) badgeLife.style.display = 'flex';
          if (head1) head1.innerHTML = '<span>👤 1인 방어 캔버스</span><span id="gugu-arena-info-1">점수: 0 | 생명: ❤️❤️❤️❤️❤️</span>';
        } else {
          btn1p.classList.remove('active');
          btn2p.classList.add('active');
          if (grid) grid.classList.add('two-player');
          if (card2) card2.style.display = 'flex';
          if (rankHeaderBtn) rankHeaderBtn.style.display = 'none';
          if (bottomRankSec) bottomRankSec.style.display = 'none';
          if (badgeScore) badgeScore.style.display = 'none';
          if (badgeLife) badgeLife.style.display = 'none';
          p1Wins = 0; p2Wins = 0;
          if (head1) head1.innerHTML = '<span>🔴 플레이어 1 (P1)</span><span id="gugu-arena-info-1">점수: 0 | 생명: ❤️❤️❤️❤️❤️</span>';
        }
      }

      resetGame(false);
    }

    function setTableMode(tMode) {
      if (tMode === levelMode) return;
      levelMode = tMode;
      document.querySelectorAll('#gugudan-logic-app .mode-tabs .tab-btn').forEach(b => b.classList.remove('active'));
      const activeBtn = document.getElementById('gugu-tab-' + tMode);
      if (activeBtn) activeBtn.classList.add('active');
      resetGame(false);
    }

    function resetGame(keepScore = false) {
      if (reqId) { cancelAnimationFrame(reqId); reqId = null; }

      // 블록 청소
      clearAllEntities(1);
      clearAllEntities(2);

      frameCount = 0;
      isRunning = true;

      if (gameMode === '1p') {
        entities = {}; nextId = 0;
        if (!keepScore) score = 0;
        life = 5;
        clearInput(1);
        updateStatsUI();
        showBanner(`🚀 [1인 / ${levelMode === 'basic' ? '기본 2~9단' : '도전 11~19단'}] 방어 시작! 떨어지는 블록을 격파하세요!`, '#38bdf8');
      } else {
        entitiesP1 = {}; entitiesP2 = {};
        nextIdP1 = 0; nextIdP2 = 0;
        scoreP1 = 0; scoreP2 = 0;
        lifeP1 = 5; lifeP2 = 5;
        clearInput(1); clearInput(2);
        updateStatsUI();
        showBanner(`🔥 [👥 2인 전자칠판 VS 배틀] 양쪽에 동일한 구구단 문제가 생성됩니다! 먼저 상대 생명을 0으로 만드세요!`, '#facc15');
      }

      gameLoop();
    }

    function clearAllEntities(arenaIdx) {
      const board = document.getElementById(`gugudan-board-${arenaIdx}`);
      if (board) {
        board.querySelectorAll('.gugudan-enemy').forEach(el => el.remove());
      }
    }

    /* --------------------------------------------------------------------------
       게임 루프 및 스폰 로직
       -------------------------------------------------------------------------- */
    function gameLoop() {
      if (!isRunning) return;
      frameCount++;

      const avgScore = gameMode === '1p' ? score : Math.max(scoreP1, scoreP2);
      const spawnRate = Math.max(45, 115 - Math.floor(avgScore / 40));

      if (frameCount % spawnRate === 0) {
        spawnEnemies();
      }

      // 1인용 또는 P1 이동
      if (gameMode === '1p' || gameMode === '2p') {
        let currentEnts = gameMode === '1p' ? entities : entitiesP1;
        const board1 = document.getElementById('gugudan-board-1');
        const bHeight1 = board1 ? board1.clientHeight : 420;

        for (let id in currentEnts) {
          const ent = currentEnts[id];
          ent.y += ent.speed;
          ent.el.style.transform = `translate(${ent.x}px, ${ent.y}px)`;

          if (ent.y > bHeight1 - 40) {
            ent.el.remove();
            delete currentEnts[id];

            if (gameMode === '1p') {
              life--;
              if (board1) { board1.classList.add('shake'); setTimeout(() => board1.classList.remove('shake'), 300); }
              updateStatsUI();
              if (life <= 0) {
                isRunning = false;
                onGameOver1p();
                return;
              }
            } else {
              lifeP1--;
              if (board1) { board1.classList.add('shake'); setTimeout(() => board1.classList.remove('shake'), 300); }
              updateStatsUI();
              if (lifeP1 <= 0) {
                isRunning = false;
                onGameOver2p(2); // P2 승리
                return;
              }
            }
          }
        }
      }

      // 2인용 P2 이동
      if (gameMode === '2p') {
        const board2 = document.getElementById('gugudan-board-2');
        const bHeight2 = board2 ? board2.clientHeight : 420;

        for (let id in entitiesP2) {
          const ent = entitiesP2[id];
          ent.y += ent.speed;
          ent.el.style.transform = `translate(${ent.x}px, ${ent.y}px)`;

          if (ent.y > bHeight2 - 40) {
            ent.el.remove();
            delete entitiesP2[id];

            lifeP2--;
            if (board2) { board2.classList.add('shake'); setTimeout(() => board2.classList.remove('shake'), 300); }
            updateStatsUI();
            if (lifeP2 <= 0) {
              isRunning = false;
              onGameOver2p(1); // P1 승리
              return;
            }
          }
        }
      }

      reqId = requestAnimationFrame(gameLoop);
    }

    function spawnEnemies() {
      let a, b;
      if (levelMode === 'basic') {
        a = Math.floor(Math.random() * 8) + 2; // 2~9
        b = Math.floor(Math.random() * 9) + 1; // 1~9
      } else {
        a = Math.floor(Math.random() * 9) + 11; // 11~19
        b = Math.floor(Math.random() * 9) + 1;  // 1~9
      }
      const answer = a * b;
      const speed1 = 0.55 + (gameMode === '1p' ? score : scoreP1) / 500;
      const speed2 = 0.55 + scoreP2 / 500;

      if (gameMode === '1p') {
        spawnSingleEnemy(1, a, b, answer, speed1);
      } else {
        // 2인용: 공정하게 P1과 P2에 100% 동일 문제 동시 스폰
        spawnSingleEnemy(1, a, b, answer, speed1);
        spawnSingleEnemy(2, a, b, answer, speed2);
      }
    }

    function spawnSingleEnemy(arenaIdx, a, b, answer, speed) {
      const board = document.getElementById(`gugudan-board-${arenaIdx}`);
      if (!board) return;

      const bWidth = board.clientWidth || 450;
      const x = 15 + Math.random() * (bWidth - 110);
      const y = -45;

      const id = arenaIdx === 1 ? (gameMode === '1p' ? nextId++ : nextIdP1++) : nextIdP2++;
      const el = document.createElement('div');
      el.className = 'gugudan-enemy';
      el.innerText = `${a} × ${b}`;
      el.style.transform = `translate(${x}px, ${y}px)`;
      board.appendChild(el);

      const obj = { id, x, y, speed, answer, el };
      if (gameMode === '1p') entities[id] = obj;
      else if (arenaIdx === 1) entitiesP1[id] = obj;
      else entitiesP2[id] = obj;
    }

    /* --------------------------------------------------------------------------
       키패드 입력 및 발사 체크 (P1 / P2 독립 처리)
       -------------------------------------------------------------------------- */
    function pressDigit(digit, arenaIdx) {
      if (!isRunning) return;
      const inputEl = document.getElementById(`input-val-${arenaIdx}`);
      if (!inputEl) return;
      if (inputEl.value.length >= 4) return;
      inputEl.value += digit;
    }

    function deleteDigit(arenaIdx) {
      if (!isRunning) return;
      const inputEl = document.getElementById(`input-val-${arenaIdx}`);
      if (!inputEl) return;
      inputEl.value = inputEl.value.slice(0, -1);
    }

    function clearInput(arenaIdx) {
      const inputEl = document.getElementById(`input-val-${arenaIdx}`);
      if (inputEl) inputEl.value = '';
    }

    function fireAnswer(arenaIdx) {
      if (!isRunning) return;
      const inputEl = document.getElementById(`input-val-${arenaIdx}`);
      if (!inputEl) return;
      const val = parseInt(inputEl.value.trim(), 10);
      if (isNaN(val)) return;

      let currentEnts = (gameMode === '1p' || arenaIdx === 1) ? (gameMode === '1p' ? entities : entitiesP1) : entitiesP2;
      let targetId = null;
      let maxY = -200;

      for (let id in currentEnts) {
        if (currentEnts[id].answer === val && currentEnts[id].y > maxY) {
          maxY = currentEnts[id].y;
          targetId = id;
        }
      }

      if (targetId !== null) {
        // 💥 격파 성공
        const ent = currentEnts[targetId];
        ent.el.classList.add('destroy');

        if (gameMode === '1p') score += 10;
        else if (arenaIdx === 1) scoreP1 += 10;
        else scoreP2 += 10;

        setTimeout(() => { if (ent.el.parentNode) ent.el.remove(); }, 200);
        delete currentEnts[targetId];

        inputEl.value = '';
        updateStatsUI();
      } else {
        // 불일치 시 흔들기 피드백
        inputEl.classList.add('shake');
        setTimeout(() => inputEl.classList.remove('shake'), 300);
        inputEl.value = '';
      }
    }

    function onGlobalKeyDown(e) {
      if (!isRunning) return;
      if (e.key === 'Enter') {
        fireAnswer(1);
      } else if (e.key >= '0' && e.key <= '9') {
        pressDigit(e.key, 1);
      } else if (e.key === 'Backspace') {
        deleteDigit(1);
      } else if (e.key === 'Escape' || e.key === 'Delete') {
        clearInput(1);
      }
    }

    /* --------------------------------------------------------------------------
       통계 UI 및 게임오버 처리
       -------------------------------------------------------------------------- */
    function getLifeHearts(cnt) {
      let str = '';
      for (let i = 0; i < Math.max(0, cnt); i++) str += '❤️';
      return str || '❌';
    }

    function updateStatsUI() {
      const sVal = document.getElementById('gugu-score-val');
      const lVal = document.getElementById('gugu-life-val');
      const info1 = document.getElementById('gugu-arena-info-1');
      const info2 = document.getElementById('gugu-arena-info-2');

      if (gameMode === '1p') {
        if (sVal) sVal.textContent = `${score}점`;
        if (lVal) lVal.textContent = life;
        if (info1) info1.textContent = `점수: ${score} | 생명: ${getLifeHearts(life)}`;
      } else {
        if (info1) info1.textContent = `점수: ${scoreP1} | 생명: ${getLifeHearts(lifeP1)}`;
        if (info2) info2.textContent = `점수: ${scoreP2} | 생명: ${getLifeHearts(lifeP2)}`;
      }
    }

    function onGameOver1p() {
      showBanner(`💥 [방어 실패] 생명이 모두 소모되었습니다. 최종 점수: ${score}점`, '#f43f5e');
      setTimeout(() => {
        showRankingModal(`💥 방어 종료! 최종 고득점 정산`);
      }, 1000);
    }

    function onGameOver2p(winnerIdx) {
      if (winnerIdx === 1) {
        p1Wins++;
        showBanner(`🎉 [2인 VS 배틀 P1 승리!] 🔴 플레이어 1(P1)이 P2의 생명이 다할 때까지 완벽히 방어했습니다! (P1 승리: ${p1Wins}회 / P2 승리: ${p2Wins}회)`, '#34d399');
      } else {
        p2Wins++;
        showBanner(`🎉 [2인 VS 배틀 P2 승리!] 🔵 플레이어 2(P2)가 P1의 생명이 다할 때까지 완벽히 방어했습니다! (P1 승리: ${p1Wins}회 / P2 승리: ${p2Wins}회)`, '#34d399');
      }
    }

    function showBanner(msg, color) {
      const banner = document.getElementById('gugu-status-msg');
      if (banner) {
        banner.innerHTML = msg;
        banner.style.color = color || '#38bdf8';
      }
    }

    function manualStopAndSave() {
      if (confirm(`현재까지 달성한 점수(${gameMode === '1p' ? score : Math.max(scoreP1, scoreP2)}점)를 저장하고 명예의 전당에 등재하시겠습니까?`)) {
        showRankingModal(`🏁 조기 정산 완료!`);
      }
    }

    function showGuideModal() {
      closeModals();
      document.getElementById('gugu-guide-modal')?.classList.add('active');
    }

    function showRankingModal(reasonMsg = '') {
      closeModals();
      const modal = document.getElementById('gugu-rank-modal');
      if (modal) modal.classList.add('active');

      const titleEl = document.getElementById('gugu-rank-modal-title');
      const sumEl = document.getElementById('gugu-gameover-summary');

      if (titleEl) titleEl.textContent = reasonMsg ? '🏁 구구단 기록 정산' : '🏆 구구단 명예의 전당';

      const displayScore = gameMode === '1p' ? score : Math.max(scoreP1, scoreP2);
      if (sumEl) {
        sumEl.innerHTML = `
          <div style="font-size:1.15rem; font-weight:900; color:#f87171; margin-bottom:6px;">${reasonMsg || '명예의 전당 랭킹 조회'}</div>
          <div style="font-size:1.35rem; font-weight:900; color:#38bdf8;">최종 획득 점수: ${displayScore}점</div>
          <div style="font-size:0.98rem; color:#facc15; margin-top:4px; font-weight:800;">모드: [${levelMode === 'basic' ? '기본 2~9단' : '도전 11~19단'}] (${gameMode === '1p' ? '1인 싱글' : '2인 VS 배틀'})</div>
        `;
      }

      if (typeof loadGameLeaderboard === 'function') {
        loadGameLeaderboard('구구단', true, 'board-gugudan');
      }
    }

    function renderBottomLeaderboard() {
      if (typeof loadGameLeaderboard === 'function') {
        loadGameLeaderboard('구구단', true, 'board-gugudan-bottom');
      } else {
        try {
          let list = JSON.parse(localStorage.getItem('mathlab_lb_gugudan') || '[]');
          const bottomEl = document.getElementById('board-gugudan-bottom');
          if (bottomEl) {
            if (list.length === 0) {
              bottomEl.innerHTML = '<p style="text-align:center; color:#94a3b8; padding:12px 0;">아직 등록된 명예의 전당 기록이 없습니다. 첫 번째 구구단 마스터가 되어보세요!</p>';
            } else {
              bottomEl.innerHTML = `
                <div style="display:flex; flex-direction:column; gap:6px;">
                  ${list.slice(0, 5).map((item, idx) => `
                    <div style="display:flex; justify-content:space-between; align-items:center; background:#0f172a; padding:10px 14px; border-radius:10px; border:1px solid #334155;">
                      <span style="font-weight:800; color:${idx === 0 ? '#facc15' : '#cbd5e1'};">${idx === 0 ? '👑 1위' : `${idx + 1}위`} - ${escapeHTML(item.nickname)}</span>
                      <span style="color:#38bdf8; font-weight:900;">${item.score}점 (${item.modeSummary || '2~9단'})</span>
                    </div>
                  `).join('')}
                </div>
              `;
            }
          }
        } catch(e) {}
      }
    }

    function closeModals() {
      document.querySelectorAll('#gugudan-logic-app .modal-overlay').forEach(m => m.classList.remove('active'));
    }

    function submitRankScore() {
      const input = document.getElementById('gugu-nickname-input');
      const nickname = (input && input.value.trim()) ? input.value.trim() : '';
      if (!nickname) {
        if (typeof showToast === 'function') showToast('⚠️ 닉네임을 입력해 주세요!', true);
        else alert('⚠️ 닉네임을 입력해 주세요!');
        return;
      }

      const displayScore = gameMode === '1p' ? score : Math.max(scoreP1, scoreP2);
      const modeSummary = `${levelMode === 'basic' ? '2~9단' : '11~19단'}`;

      try {
        let list = JSON.parse(localStorage.getItem('mathlab_lb_gugudan') || '[]');
        const dateStr = new Date().toLocaleDateString('ko-KR', { month: '2-digit', day: '2-digit' });
        list.push({ nickname, score: displayScore, date: dateStr, modeSummary });
        list.sort((a, b) => b.score - a.score);
        localStorage.setItem('mathlab_lb_gugudan', JSON.stringify(list.slice(0, 20)));
      } catch (e) {}

      if (typeof window.submitRanking === 'function') {
        window.submitRanking('구구단', displayScore, true, 'gugu-nickname-input', 'board-gugudan');
      } else if (typeof window.parent?.submitRanking === 'function') {
        window.parent.submitRanking('구구단', displayScore, true, 'gugu-nickname-input', 'board-gugudan');
      } else {
        if (typeof showToast === 'function') showToast(`🎉 [명예의 전당 등재 완료] ${nickname}님 (${displayScore}점 / ${modeSummary})`, false);
        else alert(`🎉 [명예의 전당 등록 완료]\n${nickname}님의 구구단 기록(${displayScore}점)이 등재되었습니다!`);
        if (input) input.value = '';
        closeModals();
      }

      renderBottomLeaderboard();
    }

    function goHome() {
      if (reqId) { cancelAnimationFrame(reqId); reqId = null; }
      isRunning = false;
      destroy();
      if (window.LegacyBridge && typeof window.LegacyBridge.backHome === 'function') { try { window.LegacyBridge.backHome(); return; } catch(e) {} }
      if (typeof window.renderLegacyDashboardHome === 'function') { try { window.renderLegacyDashboardHome(); return; } catch(e) {} }
      if (typeof window.MathLabRenderHome === 'function') { try { window.MathLabRenderHome(); return; } catch(e) {} }

      const mathlabRoot = document.getElementById('mathlab-root');
      const legacyRoot = document.getElementById('legacy-root');
      if (mathlabRoot) mathlabRoot.classList.add('hidden');
      if (legacyRoot) legacyRoot.classList.remove('hidden');

      const dashboard = document.getElementById('dashboard-screen');
      if (dashboard) { dashboard.classList.add('active'); dashboard.style.display = ''; }
      window.scrollTo({ top: 0, left: 0, behavior: 'smooth' });
    }

    function destroy() {
      if (reqId) { cancelAnimationFrame(reqId); reqId = null; }
      isRunning = false;
      window.removeEventListener('keydown', onGlobalKeyDown);
    }

    return {
      mount,
      setPlayerMode,
      setTableMode,
      pressDigit,
      deleteDigit,
      clearInput,
      fireAnswer,
      manualStopAndSave,
      showGuideModal,
      showRankingModal,
      closeModals,
      submitRankScore,
      renderBottomLeaderboard,
      goHome,
      resetGame,
      destroy
    };
  })();

  /* 하단 안전 등록 및 레거시/Gen-3 상호 실행 브리지 */
  function registerGugudanLogic() {
    if (typeof window.MathLabGames !== 'undefined' && typeof window.MathLabGames.register === 'function') {
      if (!window.MathLabGames.get('gugudan')) {
        try {
          const gameObj = {
            id: 'gugudan',
            title: '구구단 카운트다운',
            icon: '🚀',
            sourceType: 'new',
            players: '1~2인',
            isMultiplayer: true,
            mount(container, context) { GugudanLogic.mount(container, context); },
            reset() { GugudanLogic.resetGame(false); },
            destroy() { GugudanLogic.destroy(); },
            goHome() { GugudanLogic.goHome(); }
          };
          window.MathLabGames.register(gameObj);
          if (!window.MathLabGames.get('gugudan-logic')) {
            window.MathLabGames.register({ ...gameObj, id: 'gugudan-logic' });
          }
        } catch (e) {
          console.warn('gugudan 안전 등록 방어:', e);
        }
      }
    }
  }

  registerGugudanLogic();
  window.addEventListener('DOMContentLoaded', registerGugudanLogic);
  setTimeout(registerGugudanLogic, 100);
  setTimeout(registerGugudanLogic, 500);

  window.GugudanLogic = GugudanLogic;

  window.initGugudanGame = function() {
    registerGugudanLogic();
    if (window.LegacyBridge && typeof window.LegacyBridge.hideAllLegacySections === 'function') {
      window.LegacyBridge.hideAllLegacySections();
      window.LegacyBridge.showNewRoot();
    }
    if (typeof window.MathLabGames !== 'undefined' && typeof window.MathLabGames.mount === 'function') {
      try { window.MathLabGames.mount('gugudan'); return; } catch(e) {}
    }
    const targetEl = document.getElementById('mathlab-view') || document.getElementById('new-root') || document.getElementById('game-gugudan-app');
    GugudanLogic.mount(targetEl);
  };

  window.launchGugudanGame = function() {
    window.initGugudanGame();
  };

  window.cleanupGugudanGame = function() { GugudanLogic.destroy(); };
</script>
