<!--
  Gen-3 수학 실험실 수학게임 앱: 매스 워들 마스터 (wordle)
  오로지 스타일((style))과 스크립트((script))로만 구성된 표준 템플릿
  (턴제 시간/자리/남은 기회 누적 점수 산정, 솔로 vs AI 대결 점수 명시, 학교/학년반/닉네임 완벽 표기)
-->
<style>
  /* ==========================================================================
     Gen-3 전용 스코프 스타일 (.game-wordle)
     ========================================================================== */
  .game-wordle {
    --bg-primary: #0f172a;
    --bg-surface: #1e293b;
    --bg-card: rgba(30, 41, 59, 0.92);
    --accent-color: #22c55e;
    --present-color: #eab308;
    --absent-color: #475569;
    --ai-color: #ef4444;
    --text-main: #f8fafc;
    --text-sub: #cbd5e1;
    --border-color: #3b82f6;

    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #0f172a 0%, #164e63 50%, #0f172a 100%);
    color: var(--text-main);
    min-height: 100%;
    width: 100%;
    padding: 24px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
    user-select: none;
    -webkit-user-select: none;
    border-radius: 24px;
    border: 3px solid var(--border-color);
    box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.8);
    position: relative;
  }

  .game-wordle * { box-sizing: border-box; }

  /* 상단 헤더 */
  .game-wordle .app-header {
    width: 100%;
    max-width: 900px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #0f172a;
    padding: 16px 22px;
    border-radius: 20px;
    border: 2px solid var(--border-color);
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 14px;
  }

  .game-wordle .title-area {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .game-wordle .app-title {
    font-size: clamp(1.4rem, 2.4vw, 2.0rem);
    font-weight: 900;
    margin: 0;
    color: #ffffff !important;
    text-shadow: 0 0 15px rgba(255, 255, 255, 0.7);
  }

  .game-wordle .app-badge {
    background: #1e1b4b;
    color: #38bdf8;
    font-size: 0.88rem;
    font-weight: 800;
    padding: 6px 14px;
    border-radius: 20px;
    border: 1.5px solid #3b82f6;
    box-shadow: 0 0 10px rgba(59, 130, 246, 0.25);
  }

  .game-wordle .stats-bar {
    display: flex;
    gap: 10px;
    font-weight: 800;
    font-size: 0.95rem;
    flex-wrap: wrap;
    align-items: center;
    justify-content: flex-end;
    flex: 1 1 auto;
  }

  .game-wordle .stat-badge {
    background: #0f172a;
    padding: 8px 14px;
    border-radius: 14px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    border: 2px solid #60a5fa;
    color: #ffffff;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-weight: 900;
    font-size: 0.95rem;
    white-space: nowrap;
  }
  .game-wordle .stat-badge.turn { color: #fef08a; border-color: #f59e0b; background: #271c14; }
  .game-wordle .stat-badge.timer { color: #f87171; border-color: #ef4444; background: #2b1414; }
  .game-wordle .stat-badge.score { color: #86efac; border-color: #22c55e; background: #062313; }

  /* 헤더 버튼 */
  .game-wordle .header-btn {
    padding: 9px 15px;
    border-radius: 14px;
    font-size: 0.95rem;
    font-weight: 900;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: all 0.2s;
    border: 2px solid transparent;
    white-space: nowrap;
  }
  .game-wordle .btn-howto { background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); color: #fff !important; border-color: #93c5fd; }
  .game-wordle .btn-rank { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); color: #fff !important; border-color: #fde68a; }
  .game-wordle .btn-reset { background: #1e293b; color: #fff !important; border-color: #60a5fa; }
  .game-wordle .btn-home { background: #475569; color: #fff !important; border-color: #94a3b8; }
  .game-wordle .header-btn:hover { transform: translateY(-2px); opacity: 0.95; }

  /* 메인 영역 */
  .game-wordle .main-container {
    width: 100%;
    max-width: 900px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }

  /* 모드 탭 */
  .game-wordle .mode-tabs {
    display: flex;
    gap: 12px;
    background: #090d16;
    padding: 8px;
    border-radius: 18px;
    border: 2px solid #334155;
    width: 100%;
    max-width: 620px;
  }
  .game-wordle .mode-tab-btn {
    flex: 1;
    padding: 12px 18px;
    border-radius: 14px;
    font-weight: 900;
    font-size: 1.05rem;
    background: transparent;
    color: #cbd5e1;
    border: 2px solid transparent;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
  }
  .game-wordle .mode-tab-btn.active {
    background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
    color: #ffffff;
    border-color: #86efac;
    box-shadow: 0 4px 14px rgba(34, 197, 94, 0.4);
  }
  .game-wordle .mode-tab-btn.ai-active {
    background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
    color: #ffffff;
    border-color: #fca5a5;
    box-shadow: 0 4px 14px rgba(239, 68, 68, 0.4);
  }

  /* 설정 및 옵션 바 */
  .game-wordle .config-panel {
    background: #1e293b;
    border: 2px solid #3b82f6;
    border-radius: 18px;
    padding: 14px 20px;
    width: 100%;
    max-width: 680px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .game-wordle .config-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .game-wordle .config-label {
    font-weight: 900;
    font-size: 0.95rem;
    color: #f8fafc;
    min-width: 80px;
    text-align: right;
    margin-right: 4px;
  }
  .game-wordle .opt-btn {
    padding: 7px 14px;
    border-radius: 10px;
    font-weight: 800;
    font-size: 0.88rem;
    background: #0f172a;
    color: #cbd5e1;
    border: 1.5px solid #475569;
    cursor: pointer;
    transition: all 0.2s;
  }
  .game-wordle .opt-btn.active { background: #3b82f6; color: white; border-color: #93c5fd; }
  .game-wordle .opt-btn.ai-active { background: #ef4444; color: white; border-color: #fca5a5; }

  /* 전광판 배너 */
  .game-wordle .turn-banner {
    width: 100%;
    max-width: 680px;
    background: #0f172a;
    border: 2px solid #f59e0b;
    border-radius: 16px;
    padding: 12px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-weight: 900;
    font-size: 1.05rem;
  }

  /* 보드 타일 */
  .game-wordle .board-container {
    display: grid;
    grid-template-rows: repeat(6, 1fr);
    gap: 8px;
    margin: 10px 0;
  }
  .game-wordle .board-row {
    display: grid;
    gap: 8px;
    justify-content: center;
  }
  .game-wordle .tile {
    width: 52px;
    height: 52px;
    border: 2.5px solid #475569;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
    font-weight: 900;
    background: #0f172a;
    color: #f8fafc;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  @media (max-width: 520px) {
    .game-wordle .tile { width: 42px; height: 42px; font-size: 1.25rem; border-radius: 10px; }
  }
  .game-wordle .tile.correct { background: #22c55e; border-color: #86efac; color: #ffffff; transform: scale(1.04); box-shadow: 0 0 14px rgba(34, 197, 94, 0.4); }
  .game-wordle .tile.present { background: #eab308; border-color: #fde047; color: #ffffff; transform: scale(1.02); }
  .game-wordle .tile.absent { background: #334155; border-color: #475569; color: #94a3b8; }
  .game-wordle .tile.ai-guess { border-style: dashed; border-color: #ef4444; }

  /* 키패드 */
  .game-wordle .keypad-container {
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: 100%;
    max-width: 580px;
  }
  .game-wordle .key-row {
    display: flex;
    justify-content: center;
    gap: 6px;
  }
  .game-wordle .key-btn {
    padding: 14px 10px;
    border-radius: 12px;
    border: 2px solid #475569;
    background: #1e293b;
    color: #f8fafc;
    font-weight: 900;
    font-size: 1.05rem;
    cursor: pointer;
    transition: all 0.15s;
    flex: 1;
    max-width: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .game-wordle .key-btn.wide { max-width: 86px; background: #334155; font-size: 0.95rem; }
  .game-wordle .key-btn:hover:not(:disabled) { background: #3b82f6; border-color: #93c5fd; transform: translateY(-2px); }
  .game-wordle .key-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .game-wordle .key-btn.correct { background: #22c55e; border-color: #86efac; }
  .game-wordle .key-btn.present { background: #eab308; border-color: #fde047; }
  .game-wordle .key-btn.absent { background: #0f172a; border-color: #334155; color: #64748b; }

  /* 피드백 및 상태 바 */
  .game-wordle .status-msg {
    min-height: 28px;
    font-weight: 900;
    font-size: 1.05rem;
    color: #38bdf8;
    text-align: center;
  }

  /* 명예의 전당 (화면 하단) */
  .game-wordle .lb-section {
    width: 100%;
    max-width: 760px;
    margin-top: 30px;
    border-top: 2px dashed #475569;
    padding-top: 20px;
  }
  .game-wordle .lb-title {
    font-size: 1.2rem;
    font-weight: 900;
    color: #f59e0b;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .game-wordle .lb-box {
    background: #0f172a;
    border: 2px solid #3b82f6;
    border-radius: 16px;
    padding: 16px;
    max-height: 360px;
    overflow-y: auto;
  }

  /* 독립 모달 공통 */
  .game-wordle .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.88);
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }
  .game-wordle .modal-overlay.active { opacity: 1; pointer-events: auto; }

  .game-wordle .modal-card {
    background: #0f172a;
    border: 3px solid #3b82f6;
    border-radius: 24px;
    padding: 28px;
    width: 90%;
    max-width: 580px;
    box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8);
    text-align: center;
    transform: scale(0.9);
    transition: transform 0.3s ease;
    color: #ffffff;
    max-height: 90vh;
    overflow-y: auto;
  }
  .game-wordle .modal-overlay.active .modal-card { transform: scale(1); }
  .game-wordle .modal-title { font-size: 1.6rem; font-weight: 900; margin: 0 0 16px 0; text-shadow: 0 0 15px rgba(255,255,255,0.7); }

  /* 입력 폼 그리드 (학교/학년반/닉네임) */
  .game-wordle .input-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 14px;
  }
  @media (max-width: 480px) { .game-wordle .input-grid { grid-template-columns: 1fr; } }

  .game-wordle .text-input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 12px;
    border: 2px solid #60a5fa;
    background: #1e293b;
    color: white;
    font-size: 0.95rem;
    font-weight: 800;
    text-align: center;
    outline: none;
  }
  .game-wordle .text-input:focus { border-color: #f59e0b; box-shadow: 0 0 10px rgba(245, 158, 11, 0.4); }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }
  .game-wordle .thinking-ani { animation: pulse 1s infinite; color: #ef4444; font-weight: 900; }
</style>

<script>
(function() {
  // 100% 자릿수 전수 검증 문제 은행
  const POOLS = {
    6: [
      "7+8=15", "9+6=15", "8+7=15", "5+9=14", "8+8=16", "9+9=18", 
      "6*7=42", "7*8=56", "8*9=72", "9*6=54", "8*4=32", "7*7=49", "9*8=72", "6*8=48", 
      "15/3=5", "24/4=6", "35/7=5", "42/6=7", "18/2=9", "48/8=6"
    ],
    7: [
      "12+8=20", "15+9=24", "25-8=17", "34-9=25", "14+7=21", "42-8=34", "18+7=25", "53-6=47", 
      "13*3=39", "14*2=28", "15*4=60", "12*5=60", "25*3=75", "16*4=64", 
      "80/4=20", "90/3=30", "75/5=15", "64/4=16", "84/6=14", "96/8=12"
    ],
    8: [
      "12+18=30", "25+17=42", "45-16=29", "63-28=35", "14+29=43", "82-37=45", 
      "3*4+8=20", "5*6-5=25", "7*8-6=50", "9*3+8=35", "8*4-7=25", "6*9-6=48", "4*7+8=36", "9*4-6=30", 
      "15-3*4=3", "24/4+2=8", "36/6+3=9", "48/8+1=7", "45/5-3=6", "81/9-2=7"
    ]
  };

  const state = {
    activeTab: 'classic', // 'classic' (솔로) or 'ai' (AI 대결)
    mode: 'single',       // single, classic, steal, time
    aiLevel: 'novice',    // novice(초보), expert(고수), genius(천재)
    eqLen: 7,             // 6, 7, 8
    target: "",
    guesses: [],
    guessOwners: [],      // 'P' or 'A'
    currentGuess: "",
    gameOver: false,
    turn: 1,              // 1: Player, 2: AI
    aiThinking: false,
    turnTimer: null,
    timeLeft: 30,
    turnStartTime: 0,
    totalScore: 0,        // 🌟 누적 고득점
    turnScoreLog: []
  };

  const MathWordleGame = {
    container: null,

    mount(container, context = {}) {
      let target = typeof container === 'string' ? document.querySelector(container) : container;
      if (!target || !(target instanceof HTMLElement)) {
        target = window.MathLabUtils?.getMountContainer ? window.MathLabUtils.getMountContainer(container) : document.getElementById('mathlab-view');
      }
      if (!target) target = document.getElementById('game-wordle-app') || document.getElementById('new-root') || document.getElementById('game-container');

      // 푸터 아래 밀림 방지 안전 마운트 보장
      if (!target || target === document.body) {
        let host = document.getElementById('wordle-force-host');
        if (!host) {
          host = document.createElement('div');
          host.id = 'wordle-force-host';
          host.style.cssText = 'width:100%; max-width:1040px; margin:0 auto; padding:16px; box-sizing:border-box; z-index:999; position:relative; background:#0f172a; border-radius:24px;';
          const footer = document.querySelector('footer, #footer, .app-footer, #legacy-footer, .mathlab-footer');
          if (footer && footer.parentNode) {
            footer.parentNode.insertBefore(host, footer);
          } else {
            document.body.appendChild(host);
          }
        }
        target = host;
      }
      this.container = target;

      if (this.container.style) {
        this.container.style.display = '';
        this.container.style.visibility = '';
        this.container.style.opacity = '1';
      }

      let parent = this.container.parentElement;
      while (parent && parent !== document.body && parent !== document.documentElement) {
        if (parent.style && parent.style.display === 'none') parent.style.display = '';
        if (parent.style && parent.style.visibility === 'hidden') parent.style.visibility = '';
        parent = parent.parentElement;
      }

      this.restoreGlobalNavigation();
      window.scrollTo({ top: 0, left: 0, behavior: 'smooth' });

      // 기본 학교/학년/닉네임 로컬스토리지 불러오기
      const savedSchool = localStorage.getItem('math_lab_school_name') || '';
      const savedClass = localStorage.getItem('math_lab_class_name') || '';
      const savedNick = localStorage.getItem('mathlab_last_nick_wordle') || '';

      target.innerHTML = `
        <div class="game-wordle" id="wordle-root">
          <header class="app-header">
            <div class="title-area">
              <span style="font-size: 32px;">🔤</span>
              <div>
                <h1 class="app-title">매스 워들 마스터</h1>
              </div>
              <span class="app-badge" id="mw-mode-badge">👤 솔로 7자리</span>
            </div>
            <div class="stats-bar">
              <div class="stat-badge turn">🎯 기회: <span id="mw-turn-cnt">1 / 6</span></div>
              <div class="stat-badge timer">⏱️ 턴 제한: <span id="mw-timer">30</span>초</div>
              <div class="stat-badge score">⭐ 누적 점수: <span id="mw-score">0</span>점</div>
              <button class="header-btn btn-howto" id="mw-btn-howto">❓ 탐구 안내</button>
              <button class="header-btn btn-rank" id="mw-btn-rank">🏆 명예의 전당</button>
              <button class="header-btn btn-reset" id="mw-btn-reset">🔄 새 문제</button>
              <button class="header-btn btn-home" id="mw-btn-home">🏠 홈으로</button>
            </div>
          </header>

          <main class="main-container">
            <div class="mode-tabs">
              <button class="mode-tab-btn active" id="tab-btn-classic" data-tab="classic">🟩 클래식 워들 (솔로 도전)</button>
              <button class="mode-tab-btn" id="tab-btn-ai" data-tab="ai">🤖 AI 대결 확장판</button>
            </div>

            <!-- AI 대결 옵션 설정 바 -->
            <div class="config-panel" id="mw-config-panel" style="display:none;">
              <div class="config-row">
                <span class="config-label">⚔️ 대결 룰:</span>
                <button class="opt-btn active" data-type="mode" data-val="classic">🤖 클래식 턴제</button>
                <button class="opt-btn" data-type="mode" data-val="steal">⚔️ 힌트 스틸</button>
                <button class="opt-btn" data-type="mode" data-val="time">⏱️ 타임어택</button>
              </div>
              <div class="config-row">
                <span class="config-label">🤖 AI 지능:</span>
                <button class="opt-btn ai-active" data-type="ai" data-val="novice">🌱 초보 AI</button>
                <button class="opt-btn" data-type="ai" data-val="expert">🔥 고수 AI (스마트)</button>
                <button class="opt-btn" data-type="ai" data-val="genius">👑 알파 매스 (천재)</button>
              </div>
              <div class="config-row">
                <span class="config-label">📐 수식 길이:</span>
                <button class="opt-btn" data-type="len" data-val="6">6자리 (초급)</button>
                <button class="opt-btn active" data-type="len" data-val="7">7자리 (중급)</button>
                <button class="opt-btn" data-type="len" data-val="8">8자리 (고급)</button>
              </div>
            </div>

            <!-- 턴 배너 -->
            <div class="turn-banner" id="mw-turn-banner">
              <span id="mw-turn-msg">💡 숨겨진 7자리 수학 등식을 6번 기회 안에 맞혀보세요!</span>
              <span id="mw-turn-sub" style="color:#86efac; font-size:0.9rem;">매 턴 제한시간 30초 · 초록 +15점 · 노랑 +5점</span>
            </div>

            <!-- 보드 및 키패드 -->
            <div class="board-container" id="mw-board"></div>
            <div class="status-msg" id="mw-status">수식을 입력하고 [입력]을 누르세요.</div>
            <div class="keypad-container" id="mw-keypad"></div>
          </main>

          <!-- 하단 명예의 전당 섹션 (클래식/솔로 모드 및 글로벌 시트 연동) -->
          <section class="lb-section" id="mw-lb-section">
            <div class="lb-title">
              <span>🏆 명예의 전당 (학교/학년반/닉네임 · 고득점 랭킹)</span>
              <span style="font-size:0.85rem; color:#cbd5e1;">※ 턴 시간보너스 + 자리일치 점수 + 남은 기회 보너스 누적</span>
            </div>
            <div id="board-wordle" class="lb-box">
              <p style="color:#94a3b8; text-align:center; padding:20px;">랭킹 기록을 불러오는 중...</p>
            </div>
          </section>

          <!-- 탐구 안내 모달 -->
          <div class="modal-overlay" id="mw-howto-modal">
            <div class="modal-card">
              <h2 class="modal-title">🔤 매스 워들 마스터 안내</h2>
              <div style="text-align:left; font-size:0.95rem; line-height:1.7; color:#cbd5e1; margin-bottom:20px;">
                <p>수학 등식(예: <code>12+8=20</code>)을 논리적으로 추론하여 맞히는 퍼즐 게임입니다!</p>
                <ul style="padding-left:18px;">
                  <li><strong style="color:#22c55e;">🟩 초록색(Correct):</strong> 숫자/기호와 자릿수 위치가 모두 일치 (자릿수당 +15점)</li>
                  <li><strong style="color:#eab308;">🟨 노란색(Present):</strong> 수식에 포함되지만 자릿수 위치가 다름 (자릿수당 +5점)</li>
                  <li><strong style="color:#64748b;">⬛ 회색(Absent):</strong> 수식에 전혀 포함되지 않음</li>
                </ul>
                <div style="background:#1e293b; border:2px solid #3b82f6; border-radius:14px; padding:12px; margin-top:14px;">
                  <strong style="color:#38bdf8;">🏆 다이내믹 턴제 고득점 시스템:</strong><br>
                  - 매 턴 제한시간 30초! 빨리 입력할수록 <strong>초당 +3점 타임 보너스</strong><br>
                  - 1번째 기회 명중(+300점), 2번째(+240점), 3번째(+180점) 등 <strong>남은 기회 보너스 부여!</strong><br>
                  - 시도 횟수뿐 아니라 매 턴 정확한 자리 추론과 속도를 합산해 진정한 1등을 가립니다.
                </div>
              </div>
              <button class="header-btn btn-howto" id="mw-howto-close" style="width:100%;">이해했습니다! 게임 시작</button>
            </div>
          </div>

          <!-- 명예의 전당 Top 20 모달 -->
          <div class="modal-overlay" id="mw-leaderboard-modal">
            <div class="modal-card">
              <h2 class="modal-title">🏆 매스 워들 명예의 전당 (Top 20)</h2>
              <div id="mw-lb-modal-content" style="background:#1e293b; border-radius:14px; border:2px solid #3b82f6; max-height:340px; overflow-y:auto; margin-bottom:18px; text-align:left;"></div>
              <button class="header-btn btn-reset" id="mw-lb-close" style="width:100%;">닫기</button>
            </div>
          </div>

          <!-- 완료 축하 모달 (학교/학년반/닉네임 통합 입력) -->
          <div class="modal-overlay" id="mw-complete-modal">
            <div class="modal-card">
              <div style="font-size:54px; margin-bottom:8px;" id="mw-complete-icon">🎉🟩</div>
              <h2 class="modal-title" id="mw-complete-title">퍼즐 해결 완료!</h2>
              <div style="color:#fef08a; font-size:1.1rem; font-weight:800; margin-bottom:16px;" id="mw-complete-desc"></div>

              <div style="background:#1e1b4b; border:2px solid #3b82f6; border-radius:16px; padding:16px; margin-bottom:18px;">
                <div style="font-size:0.9rem; color:#cbd5e1;">최종 누적 점수</div>
                <div style="font-size:2.5rem; font-weight:900; color:#38bdf8;" id="mw-complete-score">0점</div>
                <div style="font-size:0.85rem; color:#86efac; margin-top:4px;" id="mw-complete-tag">매스 워들 [👤 솔로 7자리]</div>
              </div>

              <div style="text-align:left; margin-bottom:16px;">
                <div style="font-size:0.9rem; font-weight:800; color:#f8fafc; margin-bottom:6px;">🏆 명예의 전당 등록 (학교/학년반/닉네임 모두 표기)</div>
                <div class="input-grid">
                  <input type="text" id="mw-input-school" class="text-input" placeholder="학교명 (예: 대한중)" value="${savedSchool}">
                  <input type="text" id="mw-input-class" class="text-input" placeholder="학년/반 (예: 3학년 2반)" value="${savedClass}">
                </div>
                <input type="text" id="mw-input-nick" class="text-input" placeholder="닉네임을 입력하세요" value="${savedNick}">
              </div>

              <button class="header-btn btn-rank" id="mw-complete-submit" style="width:100%; padding:14px; font-size:1.08rem; margin-bottom:12px;">🏆 점수 명예의 전당 등록</button>
              
              <div style="display:flex; gap:10px;">
                <button class="header-btn btn-reset" id="mw-complete-retry" style="flex:1;">🔄 새 문제 도전</button>
                <button class="header-btn btn-home" id="mw-complete-home" style="flex:1;">🏠 홈으로</button>
              </div>
            </div>
          </div>
        </div>
      `;

      this.bindEvents();
      this.initGame();
    },

    restoreGlobalNavigation() {
      const navElements = document.querySelectorAll('header, .navbar, #app-header, .top-bar, #floating-home-btn, .floating-home, [id*="home"], [class*="floating"]');
      navElements.forEach(el => { if (el && el.style && el.style.display === 'none') el.style.display = ''; });
    },

    bindEvents() {
      // 탭 전환
      document.getElementById('tab-btn-classic')?.addEventListener('click', () => this.switchTab('classic'));
      document.getElementById('tab-btn-ai')?.addEventListener('click', () => this.switchTab('ai'));

      // AI 옵션 바
      document.querySelectorAll('#mw-config-panel .opt-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const type = btn.getAttribute('data-type');
          const val = btn.getAttribute('data-val');
          btn.parentElement.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('active', 'ai-active'));
          btn.classList.add(type === 'ai' ? 'ai-active' : 'active');

          if (type === 'mode') state.mode = val;
          else if (type === 'ai') state.aiLevel = val;
          else if (type === 'len') state.eqLen = parseInt(val, 10);

          this.initGame();
        });
      });

      // 헤더 버튼
      document.getElementById('mw-btn-howto')?.addEventListener('click', () => openModal('mw-howto-modal'));
      document.getElementById('mw-howto-close')?.addEventListener('click', () => closeModal('mw-howto-modal'));
      document.getElementById('mw-btn-rank')?.addEventListener('click', () => this.showLeaderboardModal());
      document.getElementById('mw-lb-close')?.addEventListener('click', () => closeModal('mw-leaderboard-modal'));
      document.getElementById('mw-btn-reset')?.addEventListener('click', () => this.initGame());
      document.getElementById('mw-btn-home')?.addEventListener('click', () => this.goHome());

      // 완료 모달 이벤트
      document.getElementById('mw-complete-retry')?.addEventListener('click', () => { closeModal('mw-complete-modal'); this.initGame(); });
      document.getElementById('mw-complete-home')?.addEventListener('click', () => { closeModal('mw-complete-modal'); this.goHome(); });
      document.getElementById('mw-complete-submit')?.addEventListener('click', () => this.submitScore());

      document.querySelectorAll('.game-wordle .modal-overlay').forEach(modal => {
        modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('active'); });
      });
    },

    switchTab(tab) {
      state.activeTab = tab;
      const btnClassic = document.getElementById('tab-btn-classic');
      const btnAi = document.getElementById('tab-btn-ai');
      const cfgPanel = document.getElementById('mw-config-panel');

      if (btnClassic) btnClassic.className = 'mode-tab-btn' + (tab === 'classic' ? ' active' : '');
      if (btnAi) btnAi.className = 'mode-tab-btn' + (tab === 'ai' ? ' ai-active' : '');

      if (tab === 'classic') {
        state.mode = 'single';
        if (cfgPanel) cfgPanel.style.display = 'none';
      } else {
        state.mode = 'classic';
        if (cfgPanel) cfgPanel.style.display = 'flex';
      }
      this.initGame();
    },

    initGame() {
      if (state.turnTimer) clearInterval(state.turnTimer);

      const len = state.activeTab === 'classic' ? 7 : state.eqLen;
      const rawPool = POOLS[len] || POOLS[7];
      const pool = rawPool.filter(e => e.length === len);

      state.target = pool[Math.floor(Math.random() * pool.length)];
      state.guesses = [];
      state.guessOwners = [];
      state.currentGuess = "";
      state.gameOver = false;
      state.turn = 1;
      state.aiThinking = false;
      state.totalScore = 0;

      // 모드 뱃지 업데이트
      const badge = document.getElementById('mw-mode-badge');
      if (badge) {
        if (state.activeTab === 'classic') {
          badge.textContent = `👤 솔로 ${len}자리`;
          badge.style.color = '#38bdf8';
        } else {
          const aiName = state.aiLevel === 'novice' ? '초보' : (state.aiLevel === 'expert' ? '고수' : '천재');
          badge.textContent = `🤖 AI 대결 (${aiName} · ${len}자리)`;
          badge.style.color = '#ef4444';
        }
      }

      this.updateStatsUI();
      this.renderBoard();
      this.renderKeypad();
      this.startTurnTimer();

      const statusEl = document.getElementById('mw-status');
      if (statusEl) statusEl.textContent = `새로운 ${len}자리 문제가 시작되었습니다! 수식을 입력하세요.`;

      // 하단 글로벌 랭킹 로드
      const gameTitle = this.getFormattedGameTitle();
      if (typeof window.loadGameLeaderboard === 'function') {
        try { window.loadGameLeaderboard(gameTitle, true, 'board-wordle'); } catch(e) {}
      } else {
        this.renderStandaloneLeaderboard('board-wordle');
      }
    },

    getFormattedGameTitle() {
      const len = state.activeTab === 'classic' ? 7 : state.eqLen;
      if (state.activeTab === 'classic') {
        return `매스 워들 [👤 솔로 ${len}자리]`;
      } else {
        const aiName = state.aiLevel === 'novice' ? '초보' : (state.aiLevel === 'expert' ? '고수' : '천재');
        return `매스 워들 [🤖 AI 대결 (${aiName})]`;
      }
    },

    startTurnTimer() {
      if (state.turnTimer) clearInterval(state.turnTimer);
      state.timeLeft = 30;
      state.turnStartTime = Date.now();

      const timerEl = document.getElementById('mw-timer');
      if (timerEl) timerEl.textContent = state.timeLeft;

      state.turnTimer = setInterval(() => {
        if (state.gameOver || state.aiThinking) return;
        state.timeLeft--;
        if (timerEl) timerEl.textContent = state.timeLeft;

        if (state.timeLeft <= 0) {
          clearInterval(state.turnTimer);
          if (state.activeTab === 'ai' && state.turn === 1) {
            state.turn = 2;
            state.currentGuess = "";
            this.updateStatsUI();
            this.renderBoard();
            const statusEl = document.getElementById('mw-status');
            if (statusEl) statusEl.textContent = "⏱️ 시간 초과! 턴이 AI에게 넘어갑니다.";
            setTimeout(() => this.makeAITurn(), 1200);
          } else if (state.activeTab === 'classic') {
            // 솔로 모드에서 시간 초과 시 해당 턴 패스
            const len = state.activeTab === 'classic' ? 7 : state.eqLen;
            state.guesses.push("~".repeat(len));
            state.guessOwners.push('P');
            state.currentGuess = "";
            this.renderBoard();
            if (state.guesses.length >= 6) {
              this.endGame(false, '플레이어');
            } else {
              this.startTurnTimer();
            }
          }
        }
      }, 1000);
    },

    updateStatsUI() {
      const turnCnt = document.getElementById('mw-turn-cnt');
      const scoreEl = document.getElementById('mw-score');
      const bannerMsg = document.getElementById('mw-turn-msg');
      const bannerSub = document.getElementById('mw-turn-sub');

      if (turnCnt) turnCnt.textContent = `${state.guesses.length + 1} / 6`;
      if (scoreEl) scoreEl.textContent = state.totalScore;

      if (bannerMsg && bannerSub) {
        if (state.activeTab === 'classic') {
          bannerMsg.innerHTML = `💡 숨겨진 ${7}자리 수학 등식을 6번 기회 안에 맞혀보세요!`;
          bannerSub.textContent = `매 턴 제한시간 30초 · 자리 일치 +15점 · 남은 기회 보너스`;
        } else {
          if (state.turn === 1) {
            bannerMsg.innerHTML = `👤 <strong>플레이어 차례</strong> - 최적의 수식을 입력하세요!`;
            bannerSub.textContent = `제한시간 내 입력 시 시간+자리 일치 점수 획득`;
          } else {
            bannerMsg.innerHTML = `<span class="thinking-ani">🤖 AI(${state.aiLevel === 'novice' ? '초보' : (state.aiLevel === 'expert' ? '고수' : '천재')}) 추론 중...</span>`;
            bannerSub.textContent = `이전 턴의 초록/노랑 단서를 수학적으로 분석 중입니다.`;
          }
        }
      }
    },

    renderBoard() {
      const boardEl = document.getElementById('mw-board');
      if (!boardEl) return;
      boardEl.innerHTML = "";

      const len = state.activeTab === 'classic' ? 7 : state.eqLen;

      for (let r = 0; r < 6; r++) {
        const rowDiv = document.createElement('div');
        rowDiv.className = 'board-row';
        rowDiv.style.gridTemplateColumns = `repeat(${len}, 1fr)`;

        const guess = state.guesses[r] || (r === state.guesses.length ? state.currentGuess.padEnd(len, ' ') : " ".repeat(len));
        const owner = state.guessOwners[r];

        for (let c = 0; c < len; c++) {
          const tile = document.createElement('div');
          tile.className = 'tile';
          if (owner === 'A') tile.classList.add('ai-guess');

          const char = guess[c] || '';
          tile.textContent = char.replace('~', '?').trim();

          if (r < state.guesses.length && guess !== "~".repeat(len)) {
            if (char === state.target[c]) tile.classList.add('correct');
            else if (state.target.includes(char)) tile.classList.add('present');
            else tile.classList.add('absent');
          }
          rowDiv.appendChild(tile);
        }
        boardEl.appendChild(rowDiv);
      }
    },

    renderKeypad() {
      const keypadEl = document.getElementById('mw-keypad');
      if (!keypadEl) return;
      const keys = [
        ["1","2","3","4","5","6","7","8","9","0"],
        ["+","-","*","/","=","⌫","입력"]
      ];
      keypadEl.innerHTML = "";
      keys.forEach(row => {
        const rowDiv = document.createElement('div');
        rowDiv.className = 'key-row';
        row.forEach(k => {
          const btn = document.createElement('button');
          btn.className = 'key-btn' + ((k === '⌫' || k === '입력') ? ' wide' : '');
          btn.textContent = k;
          btn.addEventListener('click', () => this.handleKey(k));
          rowDiv.appendChild(btn);
        });
        keypadEl.appendChild(rowDiv);
      });
      this.updateKeypadColors();
    },

    updateKeypadColors() {
      const keypadEl = document.getElementById('mw-keypad');
      if (!keypadEl) return;
      const keyBtns = keypadEl.querySelectorAll('.key-btn');
      const len = state.activeTab === 'classic' ? 7 : state.eqLen;
      let correctChars = [], presentChars = [], absentChars = [];

      state.guesses.forEach((g, idx) => {
        if (state.activeTab === 'classic' || state.guessOwners[idx] === 'P') {
          for (let i = 0; i < len; i++) {
            const ch = g[i];
            if (state.target[i] === ch) correctChars.push(ch);
            else if (state.target.includes(ch)) presentChars.push(ch);
            else absentChars.push(ch);
          }
        }
      });

      keyBtns.forEach(btn => {
        const k = btn.textContent;
        btn.classList.remove('correct', 'present', 'absent');
        if (correctChars.includes(k)) btn.classList.add('correct');
        else if (presentChars.includes(k)) btn.classList.add('present');
        else if (absentChars.includes(k)) btn.classList.add('absent');
      });
    },

    handleKey(k) {
      if (state.gameOver || (state.activeTab === 'ai' && state.turn === 2) || state.aiThinking) return;
      const len = state.activeTab === 'classic' ? 7 : state.eqLen;

      if (k === '⌫') {
        state.currentGuess = state.currentGuess.slice(0, -1);
      } else if (k === '입력') {
        this.submitGuess();
        return;
      } else if (state.currentGuess.length < len) {
        state.currentGuess += k;
      }
      this.renderBoard();
    },

    // 🌟 다이내믹 고득점 산정 로직 포함 입력 제출
    submitGuess() {
      const len = state.activeTab === 'classic' ? 7 : state.eqLen;
      const statusEl = document.getElementById('mw-status');

      if (state.currentGuess.length !== len) {
        if (statusEl) statusEl.textContent = `⚠️ ${len}자리를 모두 입력하세요!`;
        return;
      }

      if (state.turnTimer) clearInterval(state.turnTimer);

      const guess = state.currentGuess;
      state.guesses.push(guess);
      state.guessOwners.push(state.turn === 1 ? 'P' : 'A');
      const isWin = (guess === state.target);
      state.currentGuess = "";

      // 턴 소요시간 및 점수 계산 (플레이어 턴인 경우)
      if (state.activeTab === 'classic' || state.turn === 1) {
        let turnPts = 0;
        // 1. 타임 보너스 (+1초당 3점)
        const timeTaken = Math.min(30, Math.max(1, Math.round((Date.now() - state.turnStartTime) / 1000)));
        const timeBonus = Math.max(0, (30 - timeTaken) * 3);
        turnPts += timeBonus;

        // 2. 자리 일치 부분 점수
        for (let i = 0; i < len; i++) {
          if (guess[i] === state.target[i]) turnPts += 15;
          else if (state.target.includes(guess[i])) turnPts += 5;
        }

        // 3. 정답 명중 시 남은 턴수 보너스
        if (isWin) {
          const turnsLeft = 6 - state.guesses.length;
          const turnBonuses = [30, 60, 120, 180, 240, 300];
          turnPts += (turnBonuses[turnsLeft] || 50);
        }

        state.totalScore += turnPts;
        const scoreEl = document.getElementById('mw-score');
        if (scoreEl) scoreEl.textContent = state.totalScore;
      }

      this.renderBoard();
      this.updateKeypadColors();
      this.updateStatsUI();

      if (isWin) {
        const winner = state.activeTab === 'classic' ? '플레이어' : (state.guessOwners[state.guesses.length - 1] === 'P' ? '플레이어' : 'AI');
        this.endGame(true, winner);
        return;
      }

      if (state.guesses.length >= 6) {
        this.endGame(false, '무승부 (기회 소진)');
        return;
      }

      // AI 대결 턴 교체
      if (state.activeTab === 'ai') {
        state.turn = (state.turn === 1) ? 2 : 1;
        this.updateStatsUI();
        if (state.turn === 2) {
          state.aiThinking = true;
          if (statusEl) statusEl.textContent = "🤖 AI가 이전 단서를 기반으로 최적 수식을 계산 중입니다...";
          setTimeout(() => this.makeAITurn(), 1400);
        } else {
          this.startTurnTimer();
        }
      } else {
        this.startTurnTimer();
      }
    },

    makeAITurn() {
      if (state.gameOver) return;
      const len = state.eqLen;
      const rawPool = POOLS[len] || POOLS[7];
      const pool = rawPool.filter(e => e.length === len);
      let candidates = pool.filter(e => !state.guesses.includes(e));

      if (state.aiLevel === 'expert' || state.aiLevel === 'genius') {
        let green = Array(len).fill(null);
        let yellow = [];
        let gray = [];

        state.guesses.forEach((g, idx) => {
          if (state.mode === 'steal' || state.guessOwners[idx] === 'A') {
            for (let i = 0; i < len; i++) {
              const ch = g[i];
              if (state.target[i] === ch) green[i] = ch;
              else if (state.target.includes(ch)) yellow.push({ char: ch, notAt: i });
              else gray.push(ch);
            }
          }
        });

        let filtered = candidates.filter(cand => {
          for (let i = 0; i < len; i++) if (green[i] && cand[i] !== green[i]) return false;
          for (let y of yellow) if (!cand.includes(y.char) || cand[y.notAt] === y.char) return false;
          for (let gr of gray) if (!state.target.includes(gr) && cand.includes(gr)) return false;
          return true;
        });

        if (filtered.length > 0) candidates = filtered;
      }

      state.currentGuess = candidates.length > 0 ? candidates[Math.floor(Math.random() * Math.min(candidates.length, 2))] : state.target;
      state.aiThinking = false;
      this.submitGuess();
    },

    endGame(isWin, winnerName) {
      if (state.turnTimer) clearInterval(state.turnTimer);
      state.gameOver = true;

      const titleEl = document.getElementById('mw-complete-title');
      const descEl = document.getElementById('mw-complete-desc');
      const scoreEl = document.getElementById('mw-complete-score');
      const tagEl = document.getElementById('mw-complete-tag');
      const iconEl = document.getElementById('mw-complete-icon');
      const statusEl = document.getElementById('mw-status');

      const gameTitle = this.getFormattedGameTitle();

      if (isWin) {
        if (statusEl) statusEl.textContent = `🎉 [정답 명중] 정답은 ${state.target} 입니다!`;
        if (titleEl) titleEl.textContent = `${winnerName} 승리!`;
        if (descEl) descEl.textContent = `정답 수식 [ ${state.target} ] 명중! 총 ${state.guesses.length}번 만에 해결했습니다.`;
        if (iconEl) iconEl.textContent = '🎉🏆';
      } else {
        if (statusEl) statusEl.textContent = `😢 기회를 모두 썼습니다. 정답은 ${state.target} 입니다.`;
        if (titleEl) titleEl.textContent = `도전 완료`;
        if (descEl) descEl.textContent = `아쉽게 6번의 기회를 모두 소진했습니다. 정답은 [ ${state.target} ] 입니다.`;
        if (iconEl) iconEl.textContent = '🟩📐';
      }

      if (scoreEl) scoreEl.textContent = `${state.totalScore}점`;
      if (tagEl) tagEl.textContent = gameTitle;

      openModal('mw-complete-modal');
    },

    // 🌟 학교/학년반/닉네임 100% 반영 명예의 전당 점수 등록
    submitScore() {
      const school = document.getElementById('mw-input-school')?.value.trim() || '';
      const cls = document.getElementById('mw-input-class')?.value.trim() || '';
      const nick = document.getElementById('mw-input-nick')?.value.trim() || '';

      if (!nick) {
        if (typeof window.showToast === 'function') window.showToast('닉네임을 입력해 주세요.', 'error');
        else if (typeof window.mathlabCustomConfirm === 'function') window.mathlabCustomConfirm('닉네임을 입력해 주세요.', () => {}, true);
        else alert('닉네임을 입력해 주세요.');
        return;
      }

      // 학교, 학년반 정보를 localStorage에 자동 저장 (글로벌 getLeaderboardMeta() 연동)
      localStorage.setItem('math_lab_school_name', school);
      localStorage.setItem('math_lab_class_name', cls);
      localStorage.setItem('mathlab_last_nick_wordle', nick);

      const gameTitle = this.getFormattedGameTitle();
      const dateStr = new Date().toLocaleDateString('ko-KR', { month: '2-digit', day: '2-digit' });

      // 로컬 스토리지 Top 20 랭킹 저장 (학교/class 정보 포함)
      try {
        let list = JSON.parse(localStorage.getItem('mathlab_lb_wordle') || '[]');
        list.push({
          schoolName: school,
          className: cls,
          nickname: nick,
          score: state.totalScore,
          modeTag: gameTitle,
          date: dateStr
        });
        list.sort((a, b) => b.score - a.score);
        localStorage.setItem('mathlab_lb_wordle', JSON.stringify(list.slice(0, 20)));
      } catch(e) {}

      // 글로벌 구글 시트 연동 (isDesc: true - 점수 높을수록 1등!)
      if (typeof window.submitRanking === 'function') {
        window.submitRanking(gameTitle, state.totalScore, true, 'mw-input-nick', 'board-wordle');
      } else if (typeof window.parent?.submitRanking === 'function') {
        window.parent.submitRanking(gameTitle, state.totalScore, true, 'mw-input-nick', 'board-wordle');
      } else {
        const safeSchool = (typeof window.escapeHTML === 'function') ? window.escapeHTML(school) : school;
        const safeCls = (typeof window.escapeHTML === 'function') ? window.escapeHTML(cls) : cls;
        const safeNick = (typeof window.escapeHTML === 'function') ? window.escapeHTML(nick) : nick;
        const msg = `🎉 [명예의 전당 등록 완료]<br>${safeSchool ? '['+safeSchool+'] ' : ''}${safeCls ? '['+safeCls+'] ' : ''}${safeNick}님의 기록(${state.totalScore}점)이 등록되었습니다!`;
        if (typeof window.mathlabCustomConfirm === 'function') {
          window.mathlabCustomConfirm(msg, () => {
            closeModal('mw-complete-modal');
            this.renderStandaloneLeaderboard('board-wordle');
          }, true);
        } else {
          alert(msg.replace(/<br>/g, '\n'));
          closeModal('mw-complete-modal');
          this.renderStandaloneLeaderboard('board-wordle');
        }
      }
    },

    showLeaderboardModal() {
      let list = [];
      try { list = JSON.parse(localStorage.getItem('mathlab_lb_wordle') || '[]'); } catch(e) {}

      let html = list.map((item, idx) => {
        const esc = (str) => (typeof window.escapeHTML === 'function') ? window.escapeHTML(str) : String(str||'').replace(/[&<>'"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[c] || c));
        const school = esc(item.schoolName || localStorage.getItem('math_lab_school_name') || '학교 미입력');
        const cls = esc(item.className || localStorage.getItem('math_lab_class_name') || '학년/반 미입력');
        const nick = esc(item.nickname || '익명');
        return `
        <div style="display:flex; justify-content:space-between; align-items:center; padding:10px 14px; border-bottom:1px solid #334155;">
          <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
            <span style="font-weight:900; color:#38bdf8;">${idx+1}위</span>
            <span style="font-size:0.82rem; background:#0f172a; padding:2px 6px; border-radius:6px; border:1px solid #475569; color:#94a3b8;">${school}</span>
            <span style="font-size:0.82rem; background:#0f172a; padding:2px 6px; border-radius:6px; border:1px solid #475569; color:#cbd5e1;">${cls}</span>
            <span style="font-weight:800; color:#ffffff;">${nick}</span>
          </div>
          <div style="text-align:right;">
            <div style="color:#fef08a; font-weight:900; font-size:1.05rem;">${item.score}점</div>
            <div style="font-size:0.75rem; color:#64748b;">${item.modeTag || '솔로'}</div>
          </div>
        </div>
      `}).join('');

      if (!html) html = '<div style="padding:28px; text-align:center; color:#94a3b8;">아직 등록된 랭킹이 없습니다! 첫 번째 워들 마스터 기록을 남겨보세요.</div>';

      const box = document.getElementById('mw-lb-modal-content');
      if (box) box.innerHTML = html;
      openModal('mw-leaderboard-modal');
    },

    renderStandaloneLeaderboard(boardId) {
      const board = document.getElementById(boardId);
      if (!board) return;

      let list = [];
      try { list = JSON.parse(localStorage.getItem('mathlab_lb_wordle') || '[]'); } catch(e) {}

      if (list.length === 0) {
        board.innerHTML = '<p style="color:#94a3b8; text-align:center; padding:16px;">아직 등록된 랭킹이 없습니다. 첫 수사를 완료하고 명예의 전당에 등극하세요!</p>';
        return;
      }

      const top5 = list.slice(0, 5);
      board.innerHTML = top5.map((item, idx) => {
        const esc = (str) => (typeof window.escapeHTML === 'function') ? window.escapeHTML(str) : String(str||'').replace(/[&<>'"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[c] || c));
        const school = esc(item.schoolName || localStorage.getItem('math_lab_school_name') || '학교 미입력');
        const cls = esc(item.className || localStorage.getItem('math_lab_class_name') || '학년/반 미입력');
        const nick = esc(item.nickname || '익명');
        return `
        <div style="display:flex; justify-content:space-between; align-items:center; padding:8px 12px; border-bottom:1px solid #334155; font-size:0.92rem;">
          <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
            <span style="font-weight:900; color:#f59e0b;">${idx+1}위</span>
            <span style="color:#94a3b8;">[${school}]</span>
            <span style="color:#cbd5e1;">[${cls}]</span>
            <span style="font-weight:800; color:#f8fafc;">${nick}</span>
          </div>
          <div style="font-weight:900; color:#38bdf8;">${item.score}점</div>
        </div>
      `}).join('');
    },

    resetGame() { this.initGame(); },

    goHome() {
      if (state.turnTimer) clearInterval(state.turnTimer);
      this.destroy();

      if (window.LegacyBridge && typeof window.LegacyBridge.backHome === 'function') {
        try { window.LegacyBridge.backHome(); return; } catch(e) {}
      }
      if (typeof window.renderLegacyDashboardHome === 'function') {
        try { window.renderLegacyDashboardHome(); return; } catch(e) {}
      }
      if (typeof window.MathLabRenderHome === 'function') {
        try { window.MathLabRenderHome(); return; } catch(e) {}
      }

      const mathlabRoot = document.getElementById('mathlab-root');
      const legacyRoot = document.getElementById('legacy-root');
      if (mathlabRoot) mathlabRoot.classList.add('hidden');
      if (legacyRoot) legacyRoot.classList.remove('hidden');

      const dashboard = document.getElementById('dashboard-screen') || document.getElementById('dashboard-view');
      if (dashboard) {
        dashboard.classList.add('active');
        if (dashboard.style) dashboard.style.display = '';
      }
      window.scrollTo({ top: 0, left: 0, behavior: 'smooth' });
    },

    destroy() {
      state.gameOver = true;
      if (state.turnTimer) clearInterval(state.turnTimer);
      if (this.container) this.container.innerHTML = '';
    }
  };

  function openModal(id) { document.getElementById(id)?.classList.add('active'); }
  function closeModal(id) { document.getElementById(id)?.classList.remove('active'); }

    // =================================================================
  // 🌟 Gen-3 및 Legacy(openApp) 완벽 상호 연결 브리지
  // =================================================================
  window.MathWordleGame = MathWordleGame;

  // 1. 대시보드에서 openApp('game-wordle-app') 호출 시 즉시 반응하는 브리지
  window.initWordleGame = function() {
    if (window.LegacyBridge && typeof window.LegacyBridge.hideAllLegacySections === 'function') {
      window.LegacyBridge.hideAllLegacySections();
      window.LegacyBridge.showNewRoot();
    }
    const targetEl = document.getElementById('mathlab-view') || document.body;
    MathWordleGame.mount(targetEl);
  };

  // 2. Gen-3 launchWordleGame() 호출 시에도 legacy 영역을 자동으로 켜고 실행
  window.launchWordleGame = function() {
    if (typeof window.openApp === 'function') {
      window.openApp('game-wordle-app'); // openApp 내에서 initWordleGame()이 자동 실행됨
    } else {
      MathWordleGame.mount();
    }
  };

  // 3. Gen-3 수학 실험실 레지스트리 자동 등록
  function registerWordleGame() {
    if (typeof window.MathLabGames !== 'undefined' && typeof window.MathLabGames.register === 'function') {
      window.MathLabGames.register({
        id: 'wordle',
        title: '매스 워들 마스터',
        icon: '🔤',
        category: 'game',
        sourceType: 'new',
        mount(container, context) {
          const target = container || document.getElementById('game-wordle-app') || document.getElementById('mathlab-view');
          MathWordleGame.mount(target, context);
        },
        reset() { MathWordleGame.resetGame(); },
        destroy() { MathWordleGame.destroy(); },
        goHome() { MathWordleGame.goHome(); }
      });
    }
  }

  registerWordleGame();
  window.addEventListener('DOMContentLoaded', registerWordleGame);
  setTimeout(registerWordleGame, 100);
})();
</script>
