<style>
/* Gen-3 수학 실험실 표준 테마 (Premium Light) 및 큰 수의 법칙 로직 스타일 */
#coin-container {
  background: #ffffff;
  color: #1e293b;
  padding: 24px;
  border-radius: 16px;
  max-width: 900px;
  margin: 0 auto;
  box-shadow: 0 10px 25px rgba(0,0,0,0.1);
  border: 1px solid #e2e8f0;
}
#coin-container .app-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  border-bottom: 1px solid #e2e8f0;
  padding-bottom: 15px;
}
#coin-container .app-header h1 { margin: 0; font-size: 2rem; color: #0f172a; }
#coin-container .header-btns { display: flex; gap: 10px; }

.coin-btn {
  background: #f1f5f9;
  color: #334155;
  border: 1px solid #cbd5e1;
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
  transition: all 0.2s;
}
.coin-btn:hover { background: #e2e8f0; }
.coin-btn.primary { background: #3b82f6; color: #ffffff; border-color: #2563eb; }
.coin-btn.primary:hover { background: #2563eb; }

.highlight-msg {
  background: #f0fdfa;
  color: #0f766e;
  border: 1px solid #99f6e4;
  padding: 15px;
  border-radius: 8px;
  font-size: 1.2rem;
  font-weight: bold;
  text-align: center;
  margin-bottom: 30px;
}

.chart-wrapper {
  background: #ffffff;
  border: 1px solid #e2e8f0;
  border-radius: 12px;
  padding: 15px;
  height: 350px;
  margin-bottom: 20px;
  box-shadow: 0 4px 6px rgba(0,0,0,0.02);
}

.coin-actions {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 15px;
  margin-bottom: 20px;
}

.action-btn {
  background: #3b82f6;
  color: #ffffff;
  border: 1px solid #2563eb;
  padding: 12px 24px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
  font-size: 1.1rem;
  transition: transform 0.2s, background 0.2s;
}
.action-btn:hover {
  background: #2563eb;
  transform: translateY(-2px);
}
.action-btn.mega {
  background: #10b981;
  border-color: #059669;
}
.action-btn.mega:hover {
  background: #059669;
}

.retry-btn-wrapper {
  text-align: center;
}
</style>

<script>
const ConceptCoinApp = (function() {
  let coinChart;
  let totalFlips = 0;
  let totalHeads = 0;
  let chartLabels = [];
  let chartRealData = [];
  let chartBaseData = [];

  function mount(container, context = {}) {
    let host = null;
    if (typeof container === 'string') host = document.querySelector(container);
    else if (container instanceof HTMLElement) host = container;
    if (!host) host = window.MathLabUtils?.getMountContainer ? window.MathLabUtils.getMountContainer(container) : document.getElementById('mathlab-view');
    if (!host || !(host instanceof HTMLElement)) host = document.getElementById('new-root') || document.getElementById('game-container') || document.getElementById('mathlab-view');

    if (!host || !(host instanceof HTMLElement) || host === document.body) {
      let createdHost = document.getElementById('coin-force-host');
      if (!createdHost) {
        createdHost = document.createElement('div');
        createdHost.id = 'coin-force-host';
        document.body.appendChild(createdHost);
      }
      host = createdHost;
    }

    const footerEl = document.querySelector('footer, #footer, .app-footer') || 
                     Array.from(document.querySelectorAll('div, p, span')).find(el => el.textContent && el.textContent.includes('2026 기록조율사'));
    if (footerEl && host && typeof host.compareDocumentPosition === 'function' && (host.compareDocumentPosition(footerEl) & Node.DOCUMENT_POSITION_PRECEDING)) {
      footerEl.parentNode.insertBefore(host, footerEl);
    }

    host.style.display = '';
    host.style.visibility = 'visible';
    host.style.opacity = '1';

    let parent = host.parentElement;
    while (parent && parent !== document.body && parent !== document.documentElement) {
      if (parent.style && parent.style.display === 'none') parent.style.display = 'block';
      if (parent.style && parent.style.visibility === 'hidden') parent.style.visibility = 'visible';
      parent = parent.parentElement;
    }

    document.querySelectorAll('header, .navbar, #app-header, .top-bar, #floating-home-btn, .floating-home').forEach(el => {
      if (el && el.style && el.style.display === 'none') el.style.display = '';
    });

    host.innerHTML = `
      <div id="coin-container">
        <div class="app-header">
          <h1>큰 수의 법칙 🎲</h1>
          <div class="header-btns">
            <button class="coin-btn" onclick="ConceptCoinApp.goHome()">🏠 홈으로</button>
          </div>
        </div>
        
        <p class="highlight-msg" id="coin-stats-msg">버튼을 눌러 동전을 던져 확률이 어떻게 변하는지 확인하세요!</p>
        
        <div class="chart-wrapper"><canvas id="coinChart"></canvas></div>
        
        <div class="coin-actions">
          <button class="action-btn" onclick="ConceptCoinApp.throwCoins(1)">+ 1번 던지기</button>
          <button class="action-btn" onclick="ConceptCoinApp.throwCoins(10)">+ 10번 던지기</button>
          <button class="action-btn" onclick="ConceptCoinApp.throwCoins(100)">+ 100번 던지기</button>
          <button class="action-btn mega" onclick="ConceptCoinApp.throwCoins(1000)">+ 1,000번 던지기</button>
        </div>
        <div class="retry-btn-wrapper">
          <button class="coin-btn" style="margin-top:20px;" onclick="ConceptCoinApp.initCoinApp()">🔄 초기화</button>
        </div>
      </div>
    `;

    initCoinApp();
  }

  function initCoinApp() {
    totalFlips = 0; 
    totalHeads = 0; 
    chartLabels = []; 
    chartRealData = []; 
    chartBaseData = [];
    
    document.getElementById('coin-stats-msg').innerText = "버튼을 눌러 동전을 던져보세요!";
    
    if (coinChart) coinChart.destroy();
    
    coinChart = new Chart(document.getElementById('coinChart').getContext('2d'), {
      type: 'line', 
      data: { 
        labels: chartLabels, 
        datasets: [
          { 
            label: '실제 앞면 비율', 
            data: chartRealData, 
            borderColor: '#6366f1', 
            backgroundColor: 'rgba(99, 102, 241, 0.1)', 
            borderWidth: 2, 
            pointRadius: 0, 
            fill: true,
            tension: 0.1
          }, 
          { 
            label: '수학적 확률 (0.5)', 
            data: chartBaseData, 
            borderColor: '#ef4444', 
            borderWidth: 2, 
            borderDash: [5, 5], 
            pointRadius: 0, 
            fill: false 
          }
        ] 
      },
      options: { 
        responsive: true, 
        maintainAspectRatio: false, 
        animation: { duration: 300 }, 
        plugins: {
          legend: { labels: { color: '#475569' } }
        },
        scales: { 
          y: { min: 0, max: 1, ticks: { color: '#64748b' }, grid: { color: '#e2e8f0' } }, 
          x: { display: false } 
        } 
      }
    });
  }

  function throwCoins(times) {
    for (let i = 0; i < times; i++) {
      totalFlips++; 
      if (Math.random() < 0.5) totalHeads++;
      if (times === 1 || (times <= 100 && totalFlips % 10 === 0) || totalFlips % 100 === 0 || i === times - 1) { 
        chartLabels.push(totalFlips); 
        chartRealData.push(totalHeads / totalFlips); 
        chartBaseData.push(0.5); 
      }
    }
    coinChart.update();
    document.getElementById('coin-stats-msg').innerHTML = `총 <strong>${totalFlips.toLocaleString()}번</strong> 던졌습니다. 앞면: ${totalHeads.toLocaleString()}번 (${((totalHeads / totalFlips) * 100).toFixed(2)}%)`;
  }

  function goHome() {
    if (window.LegacyBridge && typeof window.LegacyBridge.backHome === 'function') {
      window.LegacyBridge.backHome();
    }
  }

  return { mount, initCoinApp, throwCoins, goHome };
})();

/* 하단 안전 등록 및 레거시/Gen-3 상호 실행 브리지 */
function registerConceptCoinApp() {
  if (typeof window.MathLabGames !== 'undefined' && typeof window.MathLabGames.register === 'function') {
    if (!window.MathLabGames.get('coin-app')) {
      try {
        window.MathLabGames.register({
          id: 'coin-app',
          title: '큰 수의 법칙',
          icon: '🎲',
          sourceType: 'new',
          players: '1인',
          isMultiplayer: false,
          mount(container, context) { ConceptCoinApp.mount(container, context); },
          reset() { ConceptCoinApp.initCoinApp(); },
          destroy() { },
          goHome() { ConceptCoinApp.goHome(); }
        });
      } catch (e) { console.warn('coin-app 등록 방어:', e); }
    }
  }
}

registerConceptCoinApp();
window.addEventListener('DOMContentLoaded', registerConceptCoinApp);
setTimeout(registerConceptCoinApp, 100);
setTimeout(registerConceptCoinApp, 500);

window.ConceptCoinApp = ConceptCoinApp;

// 레거시 호환성 브리지
window.initCoinApp = function() {
  registerConceptCoinApp();
  if (window.LegacyBridge && typeof window.LegacyBridge.hideAllLegacySections === 'function') {
    window.LegacyBridge.hideAllLegacySections();
    window.LegacyBridge.showNewRoot();
  }
  if (typeof window.MathLabGames !== 'undefined' && typeof window.MathLabGames.mount === 'function') {
    try { window.MathLabGames.mount('coin-app'); return; } catch(e) {}
  }
  const targetEl = document.getElementById('mathlab-view') || document.getElementById('new-root');
  ConceptCoinApp.mount(targetEl);
};
</script>
