  /* 플로팅 해설 오버레이 카드 (답안 선택 후 출력) */

<script>
  /* ==========================================================================
     NetMaster 모듈 - 정육면체 전개도 마스터 완결판 (11종 마주보는 면 3D 좌표 100% 무오류 검증)
     ========================================================================== */
  const NetMaster = (function () {
    let currentDifficulty = 'easy';
    let score = 0;
    let round = 1;
    let maxRounds = 10;
    let combo = 0;
    let timerInterval = null;
    let elapsedSeconds = 0;
    let isAnswered = false;
    let currentQuestion = null;
    let toastTimer = null;

    const escapeHTML = (str) => {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, function(match) {
        const escape = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
        return escape[match];
      });
    };

    function showToast(msg, isError = false) {
      let host = document.getElementById('net-master-app');
      if (!host) return;
      let toast = host.querySelector('#net-toast');
      if (!toast) {
        toast = document.createElement('div');
        toast.id = 'net-toast';
        toast.style.cssText = 'position:absolute; top:20px; left:50%; transform:translateX(-50%); padding:12px 24px; border-radius:12px; font-weight:800; font-size:1rem; z-index:99999; box-shadow:0 10px 25px rgba(0,0,0,0.5); transition:all 0.3s; text-align:center; min-width:300px; pointer-events:none; opacity:0;';
        host.appendChild(toast);
      }
      toast.style.background = isError ? '#ef4444' : '#10b981';
      toast.style.color = isError ? '#ffffff' : '#0f172a';
      toast.textContent = msg;
      void toast.offsetWidth;
      toast.style.opacity = '1';
      toast.style.top = '20px';
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.top = '0px';
      }, 3000);
    }

    /* 수학적·3D 접기 기하학으로 100% 검증된 정육면체 올바른 전개도 11종 완결 및 무오류 facingPairs */
    const CUBE_NETS_VALID = [
      { name: '1-4-1형 (A)', grid: [[0,1,0,0],[2,3,4,5],[0,6,0,0]], facingPairs: [[1,6], [2,4], [3,5]], desc: '중앙 4칸 일자 띠 위아래로 1칸씩 대칭으로 붙은 표준 전개도' },
      { name: '1-4-1형 (B)', grid: [[1,0,0,0],[2,3,4,5],[0,0,6,0]], facingPairs: [[1,6], [2,4], [3,5]], desc: '위아래 날개가 서로 엇갈려 있는 1-4-1형 변형' },
      { name: '1-4-1형 (C)', grid: [[0,1,0,0],[2,3,4,5],[0,0,0,6]], facingPairs: [[1,6], [2,4], [3,5]], desc: '아래 날개가 오른쪽 끝에 붙은 1-4-1형' },
      { name: '1-4-1형 (D)', grid: [[1,0,0,0],[2,3,4,5],[0,0,0,6]], facingPairs: [[1,6], [2,4], [3,5]], desc: '양쪽 대각선 끝에 날개가 달린 대칭 1-4-1형' },
      { name: '1-4-1형 (E)', grid: [[1,0,0,0],[2,3,4,5],[6,0,0,0]], facingPairs: [[1,6], [2,4], [3,5]], desc: '상하 날개가 같은 열 끝에 위치한 정육면체 전개도' },
      { name: '1-4-1형 (F)', grid: [[0,0,1,0],[2,3,4,5],[0,6,0,0]], facingPairs: [[1,6], [2,4], [3,5]], desc: '상하 날개가 계단식으로 대응하는 형태' },
      { name: '2-3-1형 (A)', grid: [[1,2,0,0],[0,3,4,5],[0,0,6,0]], facingPairs: [[1,4], [2,6], [3,5]], desc: '상단 2칸이 계단식으로 어긋나 연결되고 하단 날개가 붙은 구조' },
      { name: '2-3-1형 (B)', grid: [[1,2,0,0],[0,3,4,5],[0,0,0,6]], facingPairs: [[1,4], [2,6], [3,5]], desc: '상단 2칸과 하단 끝 날개가 계단식으로 조화를 이루는 정통 구조' },
      { name: '2-3-1형 (C)', grid: [[0,0,1,2],[3,4,5,0],[0,6,0,0]], facingPairs: [[1,6], [2,4], [3,5]], desc: '우상단 2칸과 좌하단 날개가 서로 어긋나 만나는 2-3-1형' },
      { name: '2-2-2형 계단', grid: [[1,2,0,0],[0,3,4,0],[0,0,5,6]], facingPairs: [[1,4], [2,5], [3,6]], desc: '2칸씩 3계단으로 이어지는 우아한 정육면체 전개도' },
      { name: '3-3형 계단', grid: [[1,2,3,0,0],[0,0,4,5,6]], facingPairs: [[1,3], [2,5], [4,6]], desc: '3칸 2개가 딱 한 칸만 맞물려 계단식으로 접히는 전개도' }
    ];

    /* 정육면체가 될 수 없는 대표 오류 전개도 모음 */
    const CUBE_NETS_INVALID = [
      { name: '2×2 블록 오류 (가짜 2-3-1형)', grid: [[0,1,2,0],[3,4,5,0],[0,0,6,0]], desc: '4개의 정사각형이 2×2 형태로 모여 있으면 접을 때 꼭짓점에서 충돌하여 면이 서로 겹칩니다.' },
      { name: '5칸 연속 일자 오류', grid: [[1,1,1,1,1],[0,0,1,0,0]], desc: '한 줄에 5칸이 연속되면 면이 2중으로 겹치고 반대쪽 뚜껑이 빔' },
      { name: '2×2 사각형 뭉치 오류', grid: [[1,1,0,0],[1,1,1,1]], desc: '4칸이 2×2 사각형으로 뭉쳐 있으면 접을 때 반드시 충돌' },
      { name: '한쪽 날개 편중 오류', grid: [[1,0,1,0],[1,1,1,1]], desc: '4칸 띠의 같은 쪽에만 날개가 2개 있으면 바닥 면이 빔' },
      { name: 'T자 과밀 충돌 오류', grid: [[0,1,0],[1,1,1],[0,1,0],[0,1,0]], desc: '접었을 때 양 옆 면이 중복으로 겹치게 되는 불가능 구조' }
    ];

    function mount(container, context) {
      let target = null;
      if (typeof container === 'string') target = document.querySelector(container);
      else if (container instanceof HTMLElement) target = container;
      if (!target) target = document.getElementById('mathlab-view') || document.getElementById('new-root') || document.getElementById('game-container');

      if (!target || target === document.body) {
        let host = document.getElementById('net-master-force-host');
        if (!host) {
          host = document.createElement('div'); host.id = 'net-master-force-host';
          host.style.cssText = 'width:100%; max-width:1040px; margin:0 auto; padding:16px; box-sizing:border-box; z-index:999; position:relative; background:#0f172a; border-radius:20px;';
          const header = document.querySelector('header, .navbar, #app-header, .top-bar');
          if (header && header.parentNode) header.parentNode.insertBefore(host, header.nextSibling);
          else document.body.appendChild(host);
        }
        target = host;
      }
      // 🌟 스킬 표준 방어막: 과거 goHome 등으로 인라인 display:none이 남아있다면 즉시 복구 (재진입 빈 화면 방지)
      if (target) {
        target.style.display = '';
      }
      target.innerHTML = `
        <div class="game-net-master" id="net-master-app">
          <div class="stats-bar">
            <div class="title-group">
              <div class="title-icon">📦</div>
              <div>
                <div style="display:flex; align-items:center; gap:8px;">
                  <span class="title-text">정육면체 전개도 마스터</span>
                  <span class="title-badge">정육면체 심화 학습 전문</span>
                </div>
              </div>
            </div>

            <div class="header-actions">
              <button class="btn-header home" onclick="NetMaster.goHome()">
                <span>🏠 홈으로</span>
              </button>
              <button class="btn-header" onclick="NetMaster.showGuideModal()">
                <span>📖 사용방법 & 원리</span>
              </button>
              <button class="btn-header" onclick="NetMaster.showNetsDictModal()">
                <span>📦 정육면체 올바른 전개도 11종 완전 사전</span>

    function renderCompleteDictionary() {
      const cubeEl = document.getElementById('dict-cube-grid-el');
      if (cubeEl) {
        cubeEl.innerHTML = '';
        CUBE_NETS_VALID.forEach((net, idx) => {
          const card = document.createElement('div');
          card.className = 'net-dict-card';
          const svgId = `dict-cube-svg-${idx}`;
          card.innerHTML = `
            <b style="color:#38bdf8; font-size:0.92rem;">🏷️ ${net.name}</b>
            <svg id="${svgId}" class="dict-mini-svg" viewBox="0 0 160 90"></svg>
            <p style="margin:0; font-size:0.78rem; color:#cbd5e1; line-height:1.4;">${net.desc}</p>
          `;
          cubeEl.appendChild(card);

          const miniSvg = card.querySelector(`#${svgId}`);
          if (miniSvg && net.grid) {
            drawGridOnSVG(miniSvg, net.grid, 160, 90, 21, '#0ea5e9');
          }
        });
      }

      const invalidEl = document.getElementById('dict-invalid-grid-el');
      if (invalidEl) {
        invalidEl.innerHTML = '';
        CUBE_NETS_INVALID.slice(0, 4).forEach((net, idx) => {
          const card = document.createElement('div');
          card.className = 'net-dict-card';
          const svgId = `dict-invalid-svg-${idx}`;
          card.innerHTML = `
            <b style="color:#f43f5e; font-size:0.92rem;">❌ ${net.name}</b>
            <svg id="${svgId}" class="dict-mini-svg" viewBox="0 0 160 90"></svg>
            <p style="margin:0; font-size:0.78rem; color:#cbd5e1; line-height:1.4;">${net.desc}</p>
          `;
          invalidEl.appendChild(card);

          const miniSvg = card.querySelector(`#${svgId}`);
          if (miniSvg && net.grid) {
            drawGridOnSVG(miniSvg, net.grid, 160, 90, 21, '#f43f5e');
          }
        });
      }
    }

    function drawGridOnSVG(svg, grid, w, h, sz, colorHex) {
      const rows = grid.length;
      const cols = grid[0].length;
      const startX = (w - cols * sz) / 2;
      const startY = (h - rows * sz) / 2;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (grid[r][c] > 0) {
            const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
            rect.setAttribute('x', startX + c * sz);
            rect.setAttribute('y', startY + r * sz);
            rect.setAttribute('width', sz - 2);
            rect.setAttribute('height', sz - 2);
            rect.setAttribute('rx', '3');
            rect.setAttribute('fill', colorHex || '#0ea5e9');
            rect.setAttribute('stroke', '#f8fafc');
            rect.setAttribute('stroke-width', '1');
            svg.appendChild(rect);
          }
        }
      }
    }
    // 🌟 스킬 표준 안전 홈 버튼 (타이머 중단 및 표준 브리지 연동)
    function goHome() {
      stopTimer();

      // 1. 표준 브리지 최우선 호출 (상단 로고/우측 하단 홈버튼과 완벽 동일 동작)
      if (window.LegacyBridge && typeof window.LegacyBridge.backHome === 'function') {
        try { window.LegacyBridge.backHome(); return; } catch(e) {}
      }
      if (typeof window.renderLegacyDashboardHome === 'function') {
        try { window.renderLegacyDashboardHome(); return; } catch(e) {}
      }
      if (typeof window.MathLabRenderHome === 'function') {
        try { window.MathLabRenderHome(); return; } catch(e) {}
      }

      // 2. 브리지 부재 시 폴백: 수동 루트 전환 및 대시보드 활성화
      const mathlabRoot = document.getElementById('mathlab-root');
      const legacyRoot = document.getElementById('legacy-root');
      if (mathlabRoot) mathlabRoot.classList.add('hidden');
      if (legacyRoot) legacyRoot.classList.remove('hidden');

      const dashboard = document.getElementById('dashboard-screen');
      if (dashboard) {
        dashboard.classList.add('active');
        dashboard.style.display = '';
      }
      window.scrollTo({ top: 0, left: 0, behavior: 'smooth' });
    }
    function setDifficulty(diff) {
      currentDifficulty = diff;
      document.querySelectorAll('#net-master-app .mode-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById('net-btn-' + diff.toLowerCase());
      if (activeBtn) activeBtn.classList.add('active');
      resetGame();
    }

    function resetGame() {
      score = 0;
      round = 1;
      combo = 0;
      elapsedSeconds = 0;
      startTimer();
      hideFloatingCommentary();
      loadNextQuestion();
      updateStatusPanel();
    }

    function startTimer() {
      stopTimer();
      timerInterval = setInterval(() => {
        elapsedSeconds++;
        const min = String(Math.floor(elapsedSeconds / 60)).padStart(2, '0');
        const sec = String(elapsedSeconds % 60).padStart(2, '0');
        const timerEl = document.getElementById('net-timer');
        if (timerEl) timerEl.textContent = `${min}:${sec}`;
      }, 1000);
    }

    function stopTimer() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
    }

    function hideFloatingCommentary() {
      const popup = document.getElementById('net-floating-commentary');
      if (popup) popup.classList.remove('show');
    }

    function loadNextQuestion() {
      isAnswered = false;
      hideFloatingCommentary();

      const qTypeTag = document.getElementById('net-q-type-tag');
      const qDiffTag = document.getElementById('net-q-diff-tag');
      const qText = document.getElementById('net-q-text');

      if (qDiffTag) qDiffTag.textContent = `${currentDifficulty.toUpperCase()} (ROUND ${round}/${maxRounds})`;

      if (currentDifficulty === 'easy') {
        const isValid = Math.random() < 0.65;
        const targetNet = isValid
          ? CUBE_NETS_VALID[Math.floor(Math.random() * CUBE_NETS_VALID.length)]
          : CUBE_NETS_INVALID[Math.floor(Math.random() * CUBE_NETS_INVALID.length)];

        currentQuestion = {
          type: 'validity',
          tag: '유형: 정육면체 유효성 판별 OX',
          text: `다음 [${targetNet.name}] 전개도를 접었을 때 겹치거나 비는 면 없이 완벽한 정육면체가 될까요?`,
          grid: targetNet.grid,
          commentary: targetNet.desc,
          options: [
            { text: '⭕ 네, 완벽한 정육면체가 됩니다.', isCorrect: isValid },
            { text: '❌ 아니요, 겹치거나 비는 면이 생깁니다.', isCorrect: !isValid }
          ]
        };
      } else if (currentDifficulty === 'normal') {
        const netObj = CUBE_NETS_VALID[Math.floor(Math.random() * CUBE_NETS_VALID.length)];
        const chosenPair = netObj.facingPairs[Math.floor(Math.random() * netObj.facingPairs.length)];
        const specialFace = chosenPair[0];
        const correctFacing = chosenPair[1];

        const wrongFaces = [1,2,3,4,5,6].filter(f => f !== specialFace && f !== correctFacing);
        const wrongs = wrongFaces.sort(() => Math.random() - 0.5).slice(0, 3);

        const opts = [
          { text: `${correctFacing}번 면`, isCorrect: true },
          { text: `${wrongs[0]}번 면`, isCorrect: false },
          { text: `${wrongs[1]}번 면`, isCorrect: false },
          { text: `${wrongs[2]}번 면`, isCorrect: false }
        ].sort(() => Math.random() - 0.5);

        currentQuestion = {
          type: 'facing',
          tag: `유형: 마주보는 면 추론 (${netObj.name})`,
          text: `다음 정육면체 전개도에서 주황색으로 강조된 [★ ${specialFace}번 면]과 접었을 때 서로 마주보는 평행한 면은 몇 번일까요?`,
          grid: netObj.grid,
          specialFace: specialFace,
          correctFacing: correctFacing,
          commentary: `[★ ${specialFace}번 면]을 입체로 접었을 때 서로 평행하게 마주보는 면은 [${correctFacing}번 면]입니다.`,
          options: opts
        };
      } else {
        // hard: 주사위 전개도 눈금 합 7 심화 문제
        const netObj = CUBE_NETS_VALID[Math.floor(Math.random() * CUBE_NETS_VALID.length)];
        const chosenPair = netObj.facingPairs[Math.floor(Math.random() * netObj.facingPairs.length)];
        const targetFace = chosenPair[0];
        const partnerFace = chosenPair[1];

        const partnerVal = Math.floor(Math.random() * 6) + 1;
        const correctVal = 7 - partnerVal;

        const diceMap = {};
        diceMap[targetFace] = '★ ?';
        diceMap[partnerFace] = partnerVal;

        netObj.facingPairs.forEach(pair => {
          if (pair[0] !== targetFace && pair[1] !== targetFace) {
            const v = Math.floor(Math.random() * 6) + 1;
            diceMap[pair[0]] = v;
            diceMap[pair[1]] = 7 - v;
          }
        });

        const wrongVals = [1,2,3,4,5,6].filter(n => n !== correctVal).sort(() => Math.random() - 0.5).slice(0, 3);

        const opts = [
          { text: `${correctVal}`, isCorrect: true },
          { text: `${wrongVals[0]}`, isCorrect: false },
          { text: `${wrongVals[1]}`, isCorrect: false },
          { text: `${wrongVals[2]}`, isCorrect: false }
        ].sort(() => Math.random() - 0.5);

        currentQuestion = {
          type: 'dice',
          tag: `유형: 주사위 마주보는 눈금 합 7 (${netObj.name})`,
          text: `마주보는 두 면의 눈의 수의 합이 항상 7인 주사위 전개도입니다. 주황색 [★ ?] 칸에 들어갈 주사위 눈의 수는 얼마일까요?`,
          grid: netObj.grid,
          specialFace: targetFace,
          correctFacing: partnerFace,
          diceMap: diceMap,
          commentary: `[★ ? 칸]과 접었을 때 평행하게 마주보는 면의 눈금은 [${partnerVal}]입니다. 주사위 마주보는 면의 합은 7이므로 7 - ${partnerVal} = ${correctVal}입니다!`,
          options: opts
        };
      }

      if (qTypeTag) qTypeTag.textContent = currentQuestion.tag;
      if (qText) qText.textContent = currentQuestion.text;

      renderViewportSVG(currentQuestion);
      renderOptions(currentQuestion.options);
      updateStatusPanel();
    }

    function renderViewportSVG(q) {
      const svg = document.getElementById('net-svg-viewport');
      if (!svg) return;
      svg.innerHTML = '';

      if (q.grid) {
        const grid = q.grid;
        const rows = grid.length;
        const cols = grid[0].length;
        const cellSize = 44;
        const startX = (280 - cols * cellSize) / 2;
        const startY = (210 - rows * cellSize) / 2;

        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const val = grid[r][c];
            if (val > 0) {
              const x = startX + c * cellSize;
              const y = startY + r * cellSize;

              const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
              rect.setAttribute('x', x);
              rect.setAttribute('y', y);
              rect.setAttribute('width', cellSize - 2);
              rect.setAttribute('height', cellSize - 2);
              rect.setAttribute('rx', '6');
              rect.setAttribute('class', 'net-face');
              rect.setAttribute('data-val', val);

              if (q.specialFace && val === q.specialFace) {
                rect.classList.add('target');
              }

              const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
              text.setAttribute('x', x + cellSize / 2 - 1);
              text.setAttribute('y', y + cellSize / 2);
              text.setAttribute('class', 'net-label');

              if (q.type === 'facing') {
                text.textContent = val === q.specialFace ? `★ ${val}` : val;
              } else if (q.type === 'dice' && q.diceMap) {
                text.textContent = q.diceMap[val];
              } else {
                text.textContent = val;
              }

              svg.appendChild(rect);
              svg.appendChild(text);
            }
          }
        }
      }
    }

    function renderOptions(options) {
      const gridEl = document.getElementById('net-options-grid');
      if (!gridEl) return;
      gridEl.innerHTML = '';

      options.forEach((opt) => {
        const btn = document.createElement('button');
        btn.className = 'btn-option';
        btn.innerHTML = `<span>${opt.text}</span> <span style="color:#94a3b8;">▶</span>`;
        btn.onclick = () => selectAnswer(opt, btn);
        gridEl.appendChild(btn);
      });
    }

    function selectAnswer(opt, btnEl) {
      if (isAnswered) return;
      isAnswered = true;

      const titleEl = document.getElementById('commentary-title');
      const textEl = document.getElementById('commentary-text');
      const popup = document.getElementById('net-floating-commentary');

      if (opt.isCorrect) {
        btnEl.classList.add('correct');
        combo++;
        const bonus = Math.min(5, combo) * 2;
        score += 10 + bonus;
        if (titleEl) {
          titleEl.innerHTML = `<span style="color:#34d399;">🎉 정답입니다!! (+${10 + bonus}점)</span>`;
          titleEl.style.borderColor = '#34d399';
        }
        if (typeof playSound === 'function') playSound('correct');
      } else {
        btnEl.classList.add('wrong');
        combo = 0;
        if (titleEl) {
          titleEl.innerHTML = `<span style="color:#f87171;">❌ 아쉽습니다. 오답입니다.</span>`;
          titleEl.style.borderColor = '#f87171';
        }
        if (typeof playSound === 'function') playSound('wrong');
      }

      if (textEl && currentQuestion.commentary) {
        textEl.innerHTML = `<b>💡 문제 해설</b>: ${currentQuestion.commentary}`;
      }

      updateStatusPanel();

      if (popup) {
        popup.classList.add('show');
      }
    }

    function proceedToNextQuestion() {
      hideFloatingCommentary();
      if (round < maxRounds) {
        round++;
        loadNextQuestion();
      } else {
        endGame();
      }
    }

    function updateStatusPanel() {
      const roundEl = document.getElementById('net-round');
      const scoreEl = document.getElementById('net-score');
      const comboBadge = document.getElementById('net-combo-badge');
      const comboVal = document.getElementById('net-combo-val');

      if (roundEl) roundEl.textContent = `${round} / ${maxRounds}`;
      if (scoreEl) scoreEl.textContent = score;

      if (comboBadge && comboVal) {
        if (combo >= 2) {
          comboBadge.style.display = 'flex';
          comboVal.textContent = combo;
        } else {
          comboBadge.style.display = 'none';
        }
      }
    }

    function endGame() {
      stopTimer();
      const timeBonus = Math.max(0, 30 - Math.floor(elapsedSeconds / 5));
      score += timeBonus;
      updateStatusPanel();

      setTimeout(() => {
        showRankingModal();
      }, 300);
    }

    function showGuideModal() {
      document.getElementById('net-guide-modal')?.classList.add('open');
    }

    function showNetsDictModal() {
      document.getElementById('net-dict-modal')?.classList.add('open');
    }

    function showRankingModal() {
      document.getElementById('net-ranking-modal')?.classList.add('open');
      if (typeof loadGameLeaderboard === 'function') {
        loadGameLeaderboard('정육면체전개도마스터', true, 'board-net-master');
      }
    }

    function closeModals() {
      document.querySelectorAll('#net-master-app .modal-backdrop').forEach(el => el.classList.remove('open'));
    }

    function submitRankScore() {
      const input = document.getElementById('net-nickname-input');
      const nickname = input ? input.value.trim() : '';
      if (!nickname) {
        showToast('닉네임을 입력해 주세요.', true);
        return;
      }

      try {
        let list = JSON.parse(localStorage.getItem('mathlab_lb_net_master') || '[]');
        const dateStr = new Date().toLocaleDateString('ko-KR', { month: '2-digit', day: '2-digit' });
        list.push({ nickname, score, date: dateStr });
        list.sort((a, b) => b.score - a.score);
        localStorage.setItem('mathlab_lb_net_master', JSON.stringify(list.slice(0, 20)));
      } catch (e) {}

      if (typeof window.submitRanking === 'function') {
        window.submitRanking('정육면체전개도마스터', score, true, 'net-nickname-input', 'board-net-master');
      } else if (typeof window.parent?.submitRanking === 'function') {
        window.parent.submitRanking('정육면체전개도마스터', score, true, 'net-nickname-input', 'board-net-master');
      } else {
        showToast(`🎉 명예의 전당 등록 완료!`);
        if (input) input.value = '';
        closeModals();
      }
    }

    function destroy() {
      stopTimer();
    }

    return {
      mount,
      resetGame,
      destroy,
      setDifficulty,
      proceedToNextQuestion,
      goHome, // 🌟 이 줄을 추가!
      showGuideModal,
      showNetsDictModal,
      showRankingModal,
      closeModals,
      submitRankScore
    };
  })();

  window.NetMaster = NetMaster;

  // 🌟 스킬 표준 3중 자율 등록 (스크립트 로딩 순서 무관 100% 등록 보장)
  function registerNetMaster() {
    if (typeof window.MathLabGames !== 'undefined' && typeof window.MathLabGames.register === 'function') {
      if (!window.MathLabGames.get('net-master')) {
        window.MathLabGames.register({
          id: 'net-master',
          title: '정육면체 전개도 마스터',
          icon: '📦',
          sourceType: 'new',
          mount(container, context) { NetMaster.mount(container, context); },
          reset() { NetMaster.resetGame(); },
          destroy() { NetMaster.destroy(); }
        });
      }
    }
  }

  registerNetMaster();
  window.addEventListener('DOMContentLoaded', registerNetMaster);
  setTimeout(registerNetMaster, 100);
  setTimeout(registerNetMaster, 500);
</script>
