<script>
  /* ==========================================================================
     FourColorMap 모듈 - 4색 정리 맵 컬러링 완결판
     (내장 SVG 지도 & 인접 그래프 충돌 검증 엔진 & 색약 패턴 옵션 & GAS 안전 홈)
     ========================================================================== */
  const FourColorMap = (function () {
    let currentStageIndex = 0; // 0(쉬움 10구역), 1(보통 16구역 대한민국 행정구역 스타일), 2(도전 25구역 가상 대륙)
    let selectedColor = 1; // 1: 청록, 2: 노랑, 3: 초록, 4: 홍색, 0: 지우개
    let regionColors = {}; // { id: colorIndex }
    let movesCount = 0;
    let score = 100; // 이번 라운드 점수
    let cumulativeScore = 0; // 이전 라운드까지 이월된 총 누적 점수
    let stageRoundCount = 1; // 현재 연속 도전 라운드
    let timerInterval = null;
    let elapsedSeconds = 0;
    let isCompleted = false;
    let isQuizMode = false;
    let quizAnswered = false;
    let usePatterns = true; // 색약 배려 패턴 활성화 여부
    let zoomLevel = 1.0;
    let toastTimer = null;

    const escapeHTML = (str) => {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, function(match) {
        const escape = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
        return escape[match];
      });
    };

    function showToast(msg, isError = false) {
      let host = document.getElementById('four-color-map-app');
      if (!host) return;
      let toast = host.querySelector('#fcm-toast');
      if (!toast) {
        toast = document.createElement('div');
        toast.id = 'fcm-toast';
        toast.style.cssText = 'position:absolute; top:20px; left:50%; transform:translateX(-50%); padding:12px 24px; border-radius:12px; font-weight:800; font-size:1rem; z-index:99999; box-shadow:0 10px 25px rgba(0,0,0,0.5); transition:all 0.3s; text-align:center; min-width:300px; pointer-events:none; opacity:0;';
        host.appendChild(toast);
      }
      toast.style.background = isError ? '#ef4444' : '#10b981';
      toast.style.color = isError ? '#ffffff' : '#0f172a';
      toast.textContent = msg;
      void toast.offsetWidth;
      toast.style.opacity = '1';
      toast.style.top = '20px';
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.top = '0px';
      }, 3000);
    }

    // 색상 팔레트 정보
    const COLORS = {
      0: { name: '지우개', hex: '#1e293b', pattern: 'none' },
      1: { name: '1. 청록', hex: '#38bdf8', pattern: 'url(#pat-1)' },
      2: { name: '2. 노랑', hex: '#facc15', pattern: 'url(#pat-2)' },
      3: { name: '3. 초록', hex: '#34d399', pattern: 'url(#pat-3)' },
      4: { name: '4. 홍색', hex: '#f87171', pattern: 'url(#pat-4)' }
    };

    // 🌟 내장 지도 SVG 데이터 및 인접 그래프 (모든 구역이 빈틈없이 정확히 맞닿아 있는 평면 그래프 9종)
    const STAGES = [
      // ==================== [쉬움: 1~3] ====================
      {
        id: 'stage-0',
        name: '쉬움 1: 7구역 꽃잎 휠(Wheel-7) 지도 (4색 필수)',
        minColors: 4, // 중심을 홀수(5개)의 꽃잎이 둘러싸고 있어 4색이 필수
        viewBox: '0 0 460 360',
        regions: [
          { id: 'w6', d: 'M30,30 L430,30 L430,330 L30,330 L30,30 Z' }, // 외곽 테두리 배경 구역 (가장 먼저 렌더링되어 내부 꽃잎을 가리지 않음)
          { id: 'w0', d: 'M200,140 L260,140 L280,200 L230,240 L180,200 Z' }, // 중심 5각형 코어
          { id: 'w1', d: 'M180,200 L200,140 L150,70 L100,150 Z' }, // 좌상단 꽃잎
          { id: 'w2', d: 'M200,140 L260,140 L310,70 L150,70 Z' }, // 상단 꽃잎
          { id: 'w3', d: 'M260,140 L280,200 L360,150 L310,70 Z' }, // 우상단 꽃잎
          { id: 'w4', d: 'M280,200 L230,240 L310,300 L360,150 Z' }, // 우하단 꽃잎
          { id: 'w5', d: 'M230,240 L180,200 L100,150 L150,300 L310,300 Z' } // 좌하단 꽃잎
        ],
        adjacency: {
          'w0': ['w1','w2','w3','w4','w5'],
          'w1': ['w0','w2','w5','w6'],
          'w2': ['w0','w1','w3','w6'],
          'w3': ['w0','w2','w4','w6'],
          'w4': ['w0','w3','w5','w6'],
          'w5': ['w0','w1','w4','w6'],
          'w6': ['w1','w2','w3','w4','w5']
        }
      },
      {
        id: 'stage-1',
        name: '쉬움 2: 9구역 스테인드글라스 3x3 격자 (3색 가능)',
        minColors: 3,
        viewBox: '0 0 360 360',
        regions: [
          { id: 's0', d: 'M20,20 L180,20 L100,100 Z' },
          { id: 's1', d: 'M180,20 L340,20 L260,100 Z' },
          { id: 's2', d: 'M20,20 L100,100 L20,180 Z' },
          { id: 's3', d: 'M100,100 L180,20 L260,100 L180,180 Z' }, // 중앙 상단 다이아몬드
          { id: 's4', d: 'M260,100 L340,20 L340,180 Z' },
          { id: 's5', d: 'M20,180 L100,100 L180,180 L100,260 Z' }, // 중앙 좌측 다이아몬드
          { id: 's6', d: 'M180,180 L260,100 L340,180 L260,260 Z' }, // 중앙 우측 다이아몬드
          { id: 's7', d: 'M20,180 L100,260 L20,340 Z' },
          { id: 's8', d: 'M100,260 L180,180 L260,260 L340,340 L20,340 Z' } // 하단 대형 계곡
        ],
        adjacency: {
          's0': ['s1','s2','s3'],
          's1': ['s0','s3','s4'],
          's2': ['s0','s3','s5','s7'],
          's3': ['s0','s1','s2','s4','s5','s6'],
          's4': ['s1','s3','s6'],
          's5': ['s2','s3','s6','s7','s8'],
          's6': ['s3','s4','s5','s8'],
          's7': ['s2','s5','s8'],
          's8': ['s5','s6','s7']
        }
      },
      {
        id: 'stage-2',
        name: '쉬움 3: 10구역 벌집 & 모자이크 지도 (3색 가능)',
        minColors: 3,
        viewBox: '0 0 400 320',
        regions: [
          { id: 'r0', d: 'M140,40 L260,40 L310,120 L260,200 L140,200 L90,120 Z' },
          { id: 'r1', d: 'M140,40 L260,40 L280,10 L120,10 Z' },
          { id: 'r2', d: 'M260,40 L310,120 L370,110 L330,30 L280,10 Z' },
          { id: 'r3', d: 'M310,120 L260,200 L330,220 L380,160 L370,110 Z' },
          { id: 'r4', d: 'M260,200 L140,200 L140,280 L260,280 Z' },

    function mount(container, context) {
      let target = null;
      if (typeof container === 'string') target = document.querySelector(container);
      else if (container instanceof HTMLElement) target = container;
      if (!target) target = document.getElementById('mathlab-view') || document.getElementById('new-root') || document.getElementById('game-container');

      // 푸터 아래로 밀려나지 않도록 안전 마운트 보장
      if (!target || target === document.body) {
        let host = document.getElementById('four-color-map-force-host');
        if (!host) {
          host = document.createElement('div');

          host.style.cssText = 'width:100%; max-width:1040px; margin:0 auto; padding:16px; box-sizing:border-box; z-index:999; position:relative; background:#0f172a; border-radius:24px;';
          const footer = document.querySelector('footer, #footer, .app-footer');
          if (footer && footer.parentNode) {
            footer.parentNode.insertBefore(host, footer);
          } else {
            document.body.appendChild(host);
          }
        }
        target = host;

      if (typeof window.MathLabRenderHome === 'function') {

      // 3. LegacyBridge가 없을 때의 안전 폴백 (루트 가시성 수동 전환 및 대시보드 활성화)
      const mathlabRoot = document.getElementById('mathlab-root');

    function resetAllGames() {
      cumulativeScore = 0;
      stageRoundCount = 1;
      setStage(0);
    }

    function setStage(idx) {
      currentStageIndex = idx;
      document.querySelectorAll('#four-color-map-app .mode-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById('fcm-btn-' + idx);
      if (activeBtn) activeBtn.classList.add('active');
      isQuizMode = false;
      document.getElementById('fcm-quiz-panel')?.classList.remove('active');
      
      stopTimer();
      isCompleted = false;
      movesCount = 0;
      score = 100;
      elapsedSeconds = 0;
      quizAnswered = false;
      regionColors = {};

      const stage = STAGES[currentStageIndex];
      stage.regions.forEach(r => {
        regionColors[r.id] = 0;
      });

      renderSvgMap();
      startTimer();
      updateStatus();
    }

    // 누적 점수를 이월하며 다음 스테이지로 연속 도전
    function startNextRound(nextStageIdx) {
      currentStageIndex = nextStageIdx;
      stageRoundCount++;
      document.querySelectorAll('#four-color-map-app .mode-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById('fcm-btn-' + nextStageIdx);
      if (activeBtn) activeBtn.classList.add('active');
      isQuizMode = false;
      document.getElementById('fcm-quiz-panel')?.classList.remove('active');
      
      stopTimer();
      isCompleted = false;
      movesCount = 0;
      score = 100; // 새 라운드 기본 점수 지급
      elapsedSeconds = 0;
      quizAnswered = false;
      regionColors = {};

      const stage = STAGES[currentStageIndex];
      stage.regions.forEach(r => {
        regionColors[r.id] = 0;
      });

      renderSvgMap();
      startTimer();
      updateStatus();
    }

    function startTimer() {
      stopTimer();
      timerInterval = setInterval(() => {
        elapsedSeconds++;
        const min = String(Math.floor(elapsedSeconds / 60)).padStart(2, '0');
        const sec = String(elapsedSeconds % 60).padStart(2, '0');
        const timerEl = document.getElementById('fcm-timer');
        if (timerEl) timerEl.textContent = `${min}:${sec}`;
      }, 1000);
    }

    function stopTimer() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
    }

    function renderSvgMap() {
      const wrapper = document.getElementById('fcm-svg-wrapper');
      if (!wrapper) return;
      const stage = STAGES[currentStageIndex];

      let defsHtml = `
        <defs>
          <pattern id="pat-1" width="10" height="10" patternUnits="userSpaceOnUse">
            <rect width="10" height="10" fill="#38bdf8"/>
            <circle cx="5" cy="5" r="2" fill="#0284c7" opacity="0.6"/>
          </pattern>
          <pattern id="pat-2" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
            <rect width="10" height="10" fill="#facc15"/>
            <line x1="0" y1="0" x2="0" y2="10" stroke="#ca8a04" stroke-width="3" opacity="0.65"/>
          </pattern>
          <pattern id="pat-3" width="12" height="12" patternUnits="userSpaceOnUse">
            <rect width="12" height="12" fill="#34d399"/>
            <path d="M 6 0 L 6 12 M 0 6 L 12 6" stroke="#059669" stroke-width="2" opacity="0.6"/>
          </pattern>
          <pattern id="pat-4" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(20)">
            <rect width="12" height="12" fill="#f87171"/>
            <circle cx="3" cy="3" r="2.5" fill="#dc2626" opacity="0.6"/>
            <circle cx="9" cy="9" r="2.5" fill="#dc2626" opacity="0.6"/>
          </pattern>
        </defs>
      `;

      let regionsHtml = stage.regions.map(r => {
        const cIdx = regionColors[r.id] || 0;
        const fillAttr = cIdx === 0 ? '#1e293b' : (usePatterns ? COLORS[cIdx].pattern : COLORS[cIdx].hex);
        return `<path id="${r.id}" class="region" d="${r.d}" fill="${fillAttr}" onclick="FourColorMap.clickRegion('${r.id}')"/>`;
      }).join('');

      wrapper.innerHTML = `
        <svg id="fcm-svg-canvas" viewBox="${stage.viewBox}" style="transform: scale(${zoomLevel});">
          ${defsHtml}
          ${regionsHtml}
        </svg>
      `;
    }

    function selectColor(colorIdx) {
      selectedColor = colorIdx;
      document.querySelectorAll('.game-four-color-map .palette-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById('fcm-pal-' + colorIdx);
      if (activeBtn) activeBtn.classList.add('active');
    }

    function clickRegion(regionId) {
      if (isCompleted) return;
      if (regionColors[regionId] === selectedColor) return;

      regionColors[regionId] = selectedColor;
      movesCount++;

      const el = document.getElementById(regionId);
      if (el) {
        const fillAttr = selectedColor === 0 ? '#1e293b' : (usePatterns ? COLORS[selectedColor].pattern : COLORS[selectedColor].hex);
        el.setAttribute('fill', fillAttr);
        el.classList.remove('hint-glow');
      }

      checkAdjacencyConflict();
      updateStatus();
      checkVictory();
    }

    function checkAdjacencyConflict() {
      const stage = STAGES[currentStageIndex];
      const adj = stage.adjacency;
      let conflictCount = 0;

      stage.regions.forEach(r => {
        const el = document.getElementById(r.id);
        if (el) el.classList.remove('conflict');
      });

      stage.regions.forEach(r => {
        const c1 = regionColors[r.id];
        if (!c1 || c1 === 0) return;

        const neighbors = adj[r.id] || [];
        neighbors.forEach(nId => {
          const c2 = regionColors[nId];
          if (c2 && c1 === c2) {
            conflictCount++;
            const el1 = document.getElementById(r.id);
            const el2 = document.getElementById(nId);
            if (el1) el1.classList.add('conflict');
            if (el2) el2.classList.add('conflict');
          }
        });
      });

      return Math.floor(conflictCount / 2);
    }

    function updateStatus() {
      const stage = STAGES[currentStageIndex];
      const remaining = stage.regions.filter(r => !regionColors[r.id] || regionColors[r.id] === 0).length;
      const conflicts = checkAdjacencyConflict();
      const totalCombined = cumulativeScore + score;

      const remEl = document.getElementById('fcm-remaining');
      const confEl = document.getElementById('fcm-conflicts');
      const scoreEl = document.getElementById('fcm-score');
      const roundEl = document.getElementById('fcm-round');

      if (remEl) remEl.textContent = `${remaining}개`;
      if (confEl) confEl.textContent = `${conflicts}건`;
      if (scoreEl) scoreEl.textContent = `${score} / 총 ${totalCombined}점`;
      if (roundEl) roundEl.textContent = `${stageRoundCount}라운드`;
    }

    function checkVictory() {
      const stage = STAGES[currentStageIndex];
      const remaining = stage.regions.filter(r => !regionColors[r.id] || regionColors[r.id] === 0).length;
      const conflicts = checkAdjacencyConflict();

      if (remaining === 0 && conflicts === 0) {
        isCompleted = true;
        stopTimer();

        const usedColors = new Set(Object.values(regionColors));
        usedColors.delete(0);
        const usedCount = usedColors.size;
        
        // 🌟 사용하는 색이 적을수록 점수의 비중을 대폭 높이는 차등 보너스 시스템!
        let colorBonus = 0;
        let colorDesc = '';
        if (usedCount === 2) {
          colorBonus = 300; // 2색 최고 절약 달성!
          colorDesc = '🌟 [2색 채색 완벽 절약 보너스] +300점 (압도적 고득점!)';
        } else if (usedCount === 3) {
          colorBonus = 180; // 3색 고도 절약 달성!
          colorDesc = '⭐ [3색 채색 고도 절약 보너스] +180점';
        } else if (usedCount === 4) {
          colorBonus = 40;  // 4색 표준 채색
          colorDesc = '🎨 [4색 표준 채색 클리어 보너스] +40점';
        } else {
          colorBonus = 10;
          colorDesc = `🎨 [${usedCount}색 채색 클리어 보너스] +10점`;
        }

        const timeBonus = Math.max(0, 50 - Math.floor(elapsedSeconds / 4));
        score += colorBonus + timeBonus;
        const earnedThisRound = score;
        cumulativeScore += earnedThisRound; // 이번 라운드 점수를 총 누적 점수에 이월!
        updateStatus();

        setTimeout(() => {
          showToast(`🎉 클리어! +${earnedThisRound}점 (총 ${cumulativeScore}점). 다음 라운드로 이동합니다!`);
          const nextIdx = (currentStageIndex + 1) % STAGES.length;
          startNextRound(nextIdx);
        }, 350);
      }
    }

    // 🌟 게임 포기 / 도전 종료 시 누적 점수를 명예의 전당에 등록하는 함수
    function surrenderAndSubmitRank() {
      if (isCompleted && cumulativeScore > 0) {
        showRankingModal();
        return;
      }
      const totalNow = cumulativeScore + score;
      isCompleted = true;
      stopTimer();
      cumulativeScore = totalNow;
      score = 0;
      updateStatus();
      showToast('도전을 종료하고 명예의 전당에 등록합니다.');
      showRankingModal();
    }

    function startParityQuizMode() {
      isQuizMode = true;
      document.getElementById('fcm-quiz-panel')?.classList.add('active');
      const stage = STAGES[currentStageIndex];
      showToast(`🔍 퀴즈 모드 시작!`);
    }

    function submitQuizAnswer(guessColors) {
      if (quizAnswered) {
        showToast('이미 정답을 제출하셨습니다.', true);
        return;
      }
      quizAnswered = true;
      const stage = STAGES[currentStageIndex];
      if (guessColors === stage.minColors) {
        score += 15;
        updateStatus();
        showToast(`🎉 정답! (+15점)`);
      } else {
        showToast(`❌ 아쉽습니다! 최소 [${stage.minColors}색]이 필요합니다.`, true);
      }
    }

    function useHintNext() {
      if (isCompleted) return;
      const stage = STAGES[currentStageIndex];
      const adj = stage.adjacency;

      let conflictFound = false;
      stage.regions.forEach(r => {
        const c1 = regionColors[r.id];
        if (c1 && c1 !== 0) {
          (adj[r.id] || []).forEach(nId => {
            if (regionColors[nId] === c1) {
              conflictFound = true;
              document.getElementById(r.id)?.classList.add('hint-glow');
              document.getElementById(nId)?.classList.add('hint-glow');
            }
          });
        }
      });

      if (conflictFound) {
        score = Math.max(0, score - 5);
        updateStatus();
        showToast('💡 충돌 구역이 하이라이트되었습니다. (-5점)', true);
        return;
      }

      const emptyRegion = stage.regions.find(r => !regionColors[r.id] || regionColors[r.id] === 0);
      if (emptyRegion) {
        const neighbors = adj[emptyRegion.id] || [];
        const usedByNeighbors = new Set(neighbors.map(nId => regionColors[nId]).filter(c => c > 0));
        let recommendedColor = 1;
        for (let c = 1; c <= 4; c++) {
          if (!usedByNeighbors.has(c)) {
            recommendedColor = c;
            break;
          }
        }

        regionColors[emptyRegion.id] = recommendedColor;
        const el = document.getElementById(emptyRegion.id);
        if (el) {
          const fillAttr = usePatterns ? COLORS[recommendedColor].pattern : COLORS[recommendedColor].hex;
          el.setAttribute('fill', fillAttr);
          el.classList.add('hint-glow');
        }

        score = Math.max(0, score - 5);
        updateStatus();
        checkVictory();
      }
    }

    function togglePatterns() {
      usePatterns = !usePatterns;
      renderSvgMap();
    }

    function zoomMap(delta) {
      zoomLevel = Math.max(0.6, Math.min(2.0, zoomLevel + delta));
      const svg = document.getElementById('fcm-svg-canvas');
      if (svg) svg.style.transform = `scale(${zoomLevel})`;
    }

    function showGuideModal() {
      document.getElementById('fcm-guide-modal')?.classList.add('open');
    }

    function renderLocalLeaderboard() {
      const container = document.getElementById('board-four-color-map');
      if (!container) return;
      try {
        let list = JSON.parse(localStorage.getItem('mathlab_lb_four_color_map') || '[]');
        if (!Array.isArray(list) || list.length === 0) {
          container.innerHTML = `<p style="text-align:center; color:#94a3b8; padding:18px 0;">아직 등록된 명예의 전당 기록이 없습니다.<br>첫 번째 고득점 주인공이 되어보세요!</p>`;
          return;
        }
        list.sort((a, b) => b.score - a.score);
        let html = `
          <div style="background:#0f172a; border-radius:12px; overflow:hidden; border:1px solid #334155;">
            <table style="width:100%; border-collapse:collapse; font-size:0.88rem;">
              <thead>
                <tr style="background:#1e293b; color:#38bdf8; text-align:left; border-bottom:1px solid #334155;">
                  <th style="padding:10px 14px; width:60px; text-align:center;">순위</th>
                  <th style="padding:10px 14px;">닉네임</th>
                  <th style="padding:10px 14px; text-align:right;">누적 점수</th>
                  <th style="padding:10px 14px; text-align:right; color:#94a3b8;">날짜</th>
                </tr>
              </thead>
              <tbody>
        `;
        list.slice(0, 5).forEach((item, idx) => {
          const rankColors = ['#facc15', '#cbd5e1', '#d97706'];
          const rankColor = idx < 3 ? rankColors[idx] : '#94a3b8';
          const rankText = idx === 0 ? '👑 1위' : idx === 1 ? '🥈 2위' : idx === 2 ? '🥉 3위' : `${idx + 1}위`;
          html += `
            <tr style="border-bottom:1px solid rgba(51,65,85,0.4); color:#f8fafc;">
              <td style="padding:10px 14px; text-align:center; font-weight:800; color:${rankColor};">${rankText}</td>
              <td style="padding:10px 14px; font-weight:700;">${escapeHTML(item.nickname)}</td>
              <td style="padding:10px 14px; text-align:right; font-weight:800; color:#facc15;">${item.score.toLocaleString()}점</td>
              <td style="padding:10px 14px; text-align:right; font-size:0.78rem; color:#64748b;">${escapeHTML(item.date || '')}</td>
            </tr>
          `;
        });
        html += `</tbody></table></div>`;
        container.innerHTML = html;
      } catch (e) {
        container.innerHTML = `<p style="text-align:center; color:#f87171;">기록을 불러올 수 없습니다.</p>`;
      }
    }

    function showRankingModal() {
      document.getElementById('fcm-ranking-modal')?.classList.add('open');
      const container = document.getElementById('board-four-color-map');
      if (typeof window.loadGameLeaderboard === 'function') {
        window.loadGameLeaderboard('4색정리맵컬러링', true, 'board-four-color-map');
      } else if (typeof loadGameLeaderboard === 'function') {
        loadGameLeaderboard('4색정리맵컬러링', true, 'board-four-color-map');
      } else if (typeof window.parent?.loadGameLeaderboard === 'function') {
        window.parent.loadGameLeaderboard('4색정리맵컬러링', true, 'board-four-color-map');
      } else {
        renderLocalLeaderboard();
      }
      // 전역 랭킹 함수가 없거나 지연될 때를 대비해 기본 로컬 랭킹도 300ms 후 확인
      setTimeout(() => {
        if (container && (container.innerHTML.includes('불러오는 중') || !container.innerHTML.trim())) {
          renderLocalLeaderboard();
        }
      }, 350);
    }

    function closeModals() {
      document.querySelectorAll('#four-color-map-app .modal-backdrop').forEach(el => el.classList.remove('open'));
    }

    function submitRankScore() {
      const input = document.getElementById('four-color-map-nickname-input');
      const nickname = input ? input.value.trim() : '';
      if (!nickname) {
        showToast('닉네임을 입력해 주세요.', true);
        return;
      }

      const finalScore = cumulativeScore + score;
      
      // 로컬 스토리지에 영구 저장 (백업 및 독립 실행 지원)
      try {
        let list = JSON.parse(localStorage.getItem('mathlab_lb_four_color_map') || '[]');
        const dateStr = new Date().toLocaleDateString('ko-KR', { month: '2-digit', day: '2-digit' });
        list.push({ nickname, score: finalScore, date: dateStr });
        list.sort((a, b) => b.score - a.score);
        list = list.slice(0, 20);
        localStorage.setItem('mathlab_lb_four_color_map', JSON.stringify(list));
      } catch (e) {}

      if (typeof window.submitRanking === 'function') {
        window.submitRanking('4색정리맵컬러링', finalScore, true, 'four-color-map-nickname-input', 'board-four-color-map');
      } else if (typeof submitRanking === 'function') {
        submitRanking('4색정리맵컬러링', finalScore, true, 'four-color-map-nickname-input', 'board-four-color-map');
      } else if (typeof window.parent?.submitRanking === 'function') {
        window.parent.submitRanking('4색정리맵컬러링', finalScore, true, 'four-color-map-nickname-input', 'board-four-color-map');
      } else {
        showToast(`🎉 명예의 전당 등록 완료!`);
        if (input) input.value = '';
        renderLocalLeaderboard();
      }
    }

    function destroy() {
      stopTimer();
    }

    return {
      mount,
      resetAllGames,
      destroy,
      setStage,
      startNextRound,
      surrenderAndSubmitRank,
      selectColor,
      clickRegion,
      checkAdjacencyConflict,
      goHome,
      startParityQuizMode,
      submitQuizAnswer,
      useHintNext,
      togglePatterns,
      zoomMap,
      showGuideModal,
      showRankingModal,
      closeModals,
      submitRankScore
    };
  })();

  window.FourColorMap = FourColorMap;

  if (typeof window.MathLabGames !== 'undefined' && typeof window.MathLabGames.register === 'function') {
    window.MathLabGames.register({
      id: 'four-color-map',
      title: '4색 정리 맵 컬러링',
      icon: '🎨',
      sourceType: 'new',
      mount(container, context) { FourColorMap.mount(container, context); },
      reset() { FourColorMap.resetAllGames(); },
      destroy() { FourColorMap.destroy(); }
    });
  }
</script>
