    if (tex) renderMath(tex, el, isDisplay);
  });
}

function calcMatchScore() {
  var dA = Math.abs(S.A - S.tA) / Math.max(0.4, S.tA);
  var dw = Math.abs(S.w - S.tw) / Math.max(0.4, S.tw);
  var err = (dA + dw) / 2;
  return Math.max(0, 1 - err / S.tol);
}

        sol: "<b>[수학적 계산]</b><br>• 최댓값: <span class=\"math-tex\" data-tex=\"y_{\\max} = |-2| + 3 = 5\"></span><br>• 최솟값: <span class=\"math-tex\" data-tex=\"y_{\\min} = -|-2| + 3 = 1\"></span><br>• 최댓값과 최솟값의 합: <span class=\"math-tex\" data-tex=\"5 + 1 = 6\"></span>"
      },
      {
        title: "Q2. 조석 간만의 차(해수면 높이)와 삼각함수",
        q: "해수면 높이 수식이 <span class=\"math-tex\" data-tex=\"h(t) = 3 \\sin\\left(\\frac{\\pi}{6} t\\right) + 5\"></span> (m) 일 때, 물이 가장 높게 차오르는 만조 때의 높이와 주기는?",
        sol: "<b>[수학적 해설]</b><br>• 만조 때 높이: <span class=\"math-tex\" data-tex=\"3 + 5 = 8\\text{ m}\"></span><br>• 주기: <span class=\"math-tex\" data-tex=\"T = \\frac{2\\pi}{\\pi / 6} = 12\\text{시간}\"></span> (12시간 마다 만조 반복)"
      },
      {
        title: "Q3. 음파 주파수와 옥타브 관계",
        q: "소리의 주파수 <span class=\"math-tex\" data-tex=\"f\"></span>가 2배가 되면 삼각함수 그래프의 주기 <span class=\"math-tex\" data-tex=\"T\"></span>는 어떻게 변할까요?",
        sol: "<b>[수학적 분석]</b><br>• <span class=\"math-tex\" data-tex=\"T = 1/f\"></span> 이므로 주파수가 2배가 되면 주기는 <b><span class=\"math-tex\" data-tex=\"1/2\"></span> 로 절반</b>으로 줄어들며 1옥타브 높은 소리가 납니다."
      },
      {
        title: "Q4. 삼각함수의 평행이동과 대칭",
        q: "<span class=\"math-tex\" data-tex=\"y = \\sin(x)\"></span> 그래프를 x축 방향으로 <span class=\"math-tex\" data-tex=\"\\pi/2\"></span> 만큼 평행이동하면 어떤 함수 그래프와 완벽히 일치하나요?",
        sol: "<b>[정답: y = cos(x) 그래프]</b><br>• 삼각함수 변환 공식에 의해 <span class=\"math-tex\" data-tex=\"\\sin\\left(x + \\frac{\\pi}{2}\\right) = \\cos(x)\"></span> 가 성립합니다."
      }
    ];

    probs.forEach(function(item, idx) {
      h += '<div style="background:#ffffff; border:1px solid #e2e8f0; border-radius:14px; padding:16px; margin-bottom:14px;">';
      h += '  <div style="font-weight:900; font-size:1.05rem; color:#0284c7; margin-bottom:6px;">' + item.title + '</div>';
      h += '  <div style="line-height:1.6; color:#334155; margin-bottom:10px;">' + item.q + '</div>';
      h += '  <button type="button" class="btn p btn-show-sol" data-idx="' + idx + '">💡 수학적 해설 보기</button>';
      h += '  <div id="sol-' + idx + '" style="display:none; background:#f8fafc; border:1px solid #cbd5e1; border-radius:12px; padding:14px; margin-top:10px; font-size:0.92rem; line-height:1.65;">' + item.sol + '</div>';
      h += '</div>';
    });

    h += '  </div>';
    h += '  </div>';

    /* Slide Modal */
    h += '<div class="modal" id="ss-modal">';
    h += '  <div class="mbox" id="ss-modal-box"></div>';
    h += '</div>';

    h += '</div>';
    return h;
  },

  bindEvents: function() {
    var _this = this;
    var root = S.host.querySelector('#ss-app-root');

    /* Tabs */
    root.querySelectorAll('.tab-btn').forEach(function(btn) {
      btn.onclick = function() {
        root.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
        this.classList.add('active');
        S.activeTab = this.getAttribute('data-tab');

        root.querySelector('#tab-sec-sim').style.display = (S.activeTab === 'sim') ? 'block' : 'none';
        root.querySelector('#tab-sec-math').style.display = (S.activeTab === 'math') ? 'block' : 'none';
        root.querySelector('#tab-sec-prob').style.display = (S.activeTab === 'prob') ? 'block' : 'none';

        updateMathElements();
      };
    });

    /* Difficulty Buttons */
    root.querySelector('#btn-diff-easy').onclick = function() {
      S.diff = 'easy';
      this.className = 'btn p';
      root.querySelector('#btn-diff-norm').className = 'btn';
      root.querySelector('#btn-diff-hard').className = 'btn';
      _this.newTarget();
    };
    root.querySelector('#btn-diff-norm').onclick = function() {
      S.diff = 'normal';
      this.className = 'btn p';
      root.querySelector('#btn-diff-easy').className = 'btn';
      root.querySelector('#btn-diff-hard').className = 'btn';
      _this.newTarget();
    };
    root.querySelector('#btn-diff-hard').onclick = function() {
      S.diff = 'hard';
      this.className = 'btn p';
      root.querySelector('#btn-diff-easy').className = 'btn';
      root.querySelector('#btn-diff-norm').className = 'btn';
      _this.newTarget();
    };

    /* Slider Inputs (Fine 0.01 step precision + Wheel event) */
    var rngA = root.querySelector('#rng-val-A');
    var rngW = root.querySelector('#rng-val-w');

    function updateAVal(val) {
      S.A = Math.round(parseFloat(val) * 100) / 100;
      rngA.value = S.A.toFixed(2);
      _this.updateHUD();
      if (!S.running) _this.drawCanvas();
    }

    function updateWVal(val) {
      S.w = Math.round(parseFloat(val) * 100) / 100;
      rngW.value = S.w.toFixed(2);
      _this.updateHUD();
      if (!S.running) _this.drawCanvas();
    }

    rngA.oninput = function() { updateAVal(this.value); };
    rngW.oninput = function() { updateWVal(this.value); };

    /* Mouse Wheel Control for Sliders */
    rngA.onwheel = function(e) {
      e.preventDefault();
      var delta = e.deltaY < 0 ? 0.01 : -0.01;
      var nVal = Math.min(2.60, Math.max(0.40, S.A + delta));
      updateAVal(nVal);
    };

    rngW.onwheel = function(e) {
      e.preventDefault();
      var delta = e.deltaY < 0 ? 0.01 : -0.01;
      var nVal = Math.min(3.20, Math.max(0.50, S.w + delta));
      updateWVal(nVal);
    };

    /* Actions */
    root.querySelector('#btn-start-anim').onclick = function() { _this.startAnim(); };
    root.querySelector('#btn-new-target').onclick = function() { _this.newTarget(); };

    /* Quiz */
    root.querySelector('#btn-submit-quiz').onclick = function() {
      var val = (root.querySelector('#inp-quiz-ans').value || '').trim();
      var msgEl = root.querySelector('#lbl-quiz-msg');
      if (val === '4') {
        msgEl.innerHTML = '✅ <b>정답입니다!</b> y = 4 sin(3x) 의 최고 높이 진폭 A 는 4 입니다.';
        msgEl.style.color = '#059669';
      } else {
        msgEl.innerHTML = '❌ 오답입니다. (힌트: sin 함수 앞 계수인 4 입니다)';
        msgEl.style.color = '#ef4444';
      }
    };

    /* Solutions Toggle */
    root.querySelectorAll('.btn-show-sol').forEach(function(btn) {
      btn.onclick = function() {
        var idx = this.getAttribute('data-idx');
        var solEl = root.querySelector('#sol-' + idx);
        if (solEl) {
          var isShown = solEl.style.display === 'block';
          solEl.style.display = isShown ? 'none' : 'block';
          this.textContent = isShown ? '💡 수학적 해설 보기' : '🙈 해설 닫기';
          updateMathElements();
        }
      };
    });

    /* Modal Open & Render Slide */
    root.querySelector('#btn-open-guide').onclick = function() {
      S.guidePage = 0;
      _this.renderSlideGuide();
      root.querySelector('#ss-modal').classList.add('on');
    };
  },

  newTarget: function() {
    this.stopAnim();
    if (S.diff === 'easy') {
      S.tA = Math.round((0.80 + Math.random() * 1.20) * 100) / 100;
      S.tw = Math.round(S.w * 100) / 100;
      S.tol = 0.32;
    } else if (S.diff === 'hard') {
      S.tA = Math.round((0.70 + Math.random() * 1.80) * 100) / 100;
      S.tw = Math.round((0.90 + Math.random() * 2.40) * 100) / 100;
      S.tol = 0.14;
    } else {
      S.tA = Math.round((0.80 + Math.random() * 1.60) * 100) / 100;
      S.tw = Math.round((1.00 + Math.random() * 2.00) * 100) / 100;
      S.tol = 0.22;
    }

    var root = S.host.querySelector('#ss-app-root');
    if (root) {
      root.querySelector('#lbl-target-A').textContent = S.tA.toFixed(2);
      root.querySelector('#lbl-target-w').textContent = S.tw.toFixed(2);
      root.querySelector('#lbl-sim-status').innerHTML = '목표 파도(점선)에 맞춰 진폭 A 와 각주파수 ω를 조절하세요.';
    }

    this.updateHUD();
    this.drawCanvas();
  },

  updateHUD: function() {
    var root = S.host.querySelector('#ss-app-root');
    if (!root) return;

    var match = calcMatchScore();
    S.matchPct = Math.round(match * 100);

    root.querySelector('#lbl-val-A').textContent = S.A.toFixed(2);
    root.querySelector('#lbl-val-w').textContent = S.w.toFixed(2);
    root.querySelector('#lbl-match-pct').textContent = S.matchPct + '%';

    var texStr = 'y = ' + S.A.toFixed(2) + ' \\sin(' + S.w.toFixed(2) + ' t)';
    var mathEl = root.querySelector('#lbl-math-my-eq');
    if (mathEl) {
      mathEl.setAttribute('data-tex', texStr);
      renderMath(texStr, mathEl, false);
    }
  },

  drawCanvas: function() {
    var root = S.host.querySelector('#ss-app-root');
    if (!root) return;
    var cv = root.querySelector('#ss-cv');
    if (!cv) return;
    var ctx = cv.getContext('2d');

    ctx.clearRect(0, 0, CW, CH);
    var grd = ctx.createLinearGradient(0, 0, 0, CH);
    grd.addColorStop(0, '#0c4a6e');
    grd.addColorStop(1, '#082f49');
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, CW, CH);

    var mid = CH * 0.55;
    var ampScale = CH * 0.28;

    function getWaveY(ampVal, freqVal, xPos) {
      return mid - Math.sin((xPos / CW) * Math.PI * 4 * freqVal + S.t * freqVal) * ampVal * ampScale;
    }

    // Target Wave (Dashed Line)
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
    ctx.setLineDash([6, 6]);
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    for (var x = 0; x <= CW; x += 4) {
      var ty = getWaveY(S.tA / 2.5, S.tw, x);
      if (x === 0) ctx.moveTo(x, ty);
      else ctx.lineTo(x, ty);
    }
    ctx.stroke();
    ctx.setLineDash([]);

    // Current Wave (Solid Line)
    ctx.strokeStyle = (S.matchPct >= 85) ? '#34d399' : '#38bdf8';
    ctx.lineWidth = 3.5;
    ctx.beginPath();
    for (var x2 = 0; x2 <= CW; x2 += 3) {
      var my = getWaveY(S.A / 2.5, S.w, x2);
      if (x2 === 0) ctx.moveTo(x2, my);
      else ctx.lineTo(x2, my);
    }
    ctx.stroke();

    // Surfer Icon Riding Target Wave
    var surferX = CW * 0.3;
    var surferY = getWaveY(S.A / 2.5, S.w, surferX);
    ctx.font = '32px serif';
    ctx.fillText('🏄', surferX - 16, surferY - 10);

    ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
    ctx.font = 'bold 12px Pretendard';
    ctx.fillText('실선: 내 파도 (A=' + S.A.toFixed(2) + ', ω=' + S.w.toFixed(2) + ')  /  점선: 목표 파도', 14, 24);
  },

  startAnim: function() {
    var _this = this;
    S.running = true;
    if (S.raf) cancelAnimationFrame(S.raf);

    function loop() {
      if (!S.running) return;
      S.t += 0.04;
      _this.drawCanvas();

      if (S.matchPct >= 90) {
        var root = S.host.querySelector('#ss-app-root');
        if (root) {
          root.querySelector('#lbl-sim-status').innerHTML = '🎉 <b>파도 완전 합치 완수!</b> 서퍼가 삼각함수 파도 정상 라이딩에 성공했습니다!';
        }
      }

      S.raf = requestAnimationFrame(loop);
    }

    S.raf = requestAnimationFrame(loop);
  },

  stopAnim: function() {
    S.running = false;
    if (S.raf) cancelAnimationFrame(S.raf);
  },

  renderSlideGuide: function() {
    var _this = this;
    var root = S.host.querySelector('#ss-app-root');
    var mBox = root.querySelector('#ss-modal-box');
    if (!mBox) return;

    var pg = SLIDE_GUIDE[S.guidePage] || SLIDE_GUIDE[0];
    var dots = SLIDE_GUIDE.map(function(_, i) {
      return '<span class="dot' + (i === S.guidePage ? ' on' : '') + '"></span>';
    }).join('');
    var isLast = S.guidePage >= SLIDE_GUIDE.length - 1;

    var h = '';
    h += '<div style="font-size:.8rem; font-weight:800; color:#0284c7; margin-bottom:4px;">온보딩 슬라이드 탐구 ' + (S.guidePage + 1) + ' / ' + SLIDE_GUIDE.length + '</div>';
    h += '<h3 style="margin:0 0 12px; color:#0f172a; font-weight:900;">' + pg.title + '</h3>';
    h += '<div style="line-height:1.65; color:#334155; font-size:0.95rem;">' + pg.html + '</div>';
    h += '<div class="dots">' + dots + '</div>';

    h += '<div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px;">';
    h += '  <button type="button" class="btn" id="btn-slide-prev"' + (S.guidePage === 0 ? ' disabled' : '') + '>← 이전</button>';
    h += '  <button type="button" class="btn p" id="btn-slide-next">' + (isLast ? '탐구 시작하기 🚀' : '다음 →') + '</button>';
    h += '</div>';

    mBox.innerHTML = h;
    updateMathElements();

    var prevBtn = mBox.querySelector('#btn-slide-prev');
    var nextBtn = mBox.querySelector('#btn-slide-next');

    if (prevBtn) {
      prevBtn.onclick = function() {
        if (S.guidePage > 0) {
          S.guidePage--;
          _this.renderSlideGuide();
        }
      };
    }
    if (nextBtn) {
      nextBtn.onclick = function() {
        if (isLast) {
          root.querySelector('#ss-modal').classList.remove('on');
        } else {
          S.guidePage++;
          _this.renderSlideGuide();
        }
      };
    }
  },

  destroy: function() {
    this.stopAnim();
    if (S.host) S.host.innerHTML = '';
    S.host = null;
  }
};

function goHome() {
  if (S.host) S.host.innerHTML = '';
  if (typeof window.LegacyBridge !== 'undefined' && typeof window.LegacyBridge.backHome === 'function') {
    window.LegacyBridge.backHome();
  } else if (typeof window.MathLabGames !== 'undefined' && window.MathLabGames.goHome) {
    window.MathLabGames.goHome();
  } else {
    window.location.reload();
  }
}

function reg() {
  if (typeof window.MathLabGames === 'undefined' || typeof window.MathLabGames.register !== 'function') return;
  try {
    if (window.MathLabGames.get && window.MathLabGames.get(APP_ID)) return;
    window.MathLabGames.register({
      id: APP_ID,
      title: APP_TITLE,
      icon: ICON,
      sourceType: 'new',
      players: '1인',
      isMultiplayer: false,
      mount: function(c, x) { SineSurfingApp.mount(c, x); },
      reset: function() { SineSurfingApp.newTarget(); },
      destroy: function() { SineSurfingApp.destroy(); },
      goHome: function() { goHome(); }
    });
  } catch (e) {
    console.warn(APP_ID + ' reg', e);
  }
}

reg();
window.addEventListener('DOMContentLoaded', reg);
setTimeout(reg, 100);
setTimeout(reg, 500);

window.SineSurfing = {
  mount: function(c) { SineSurfingApp.mount(c); },
  resetGame: function() { SineSurfingApp.newTarget(); },
  destroy: function() { SineSurfingApp.destroy(); },
  goHome: goHome
};

window.initSineSurfing = function() {
  reg();
  try {
    if (window.LegacyBridge) {
      window.LegacyBridge.hideAllLegacySections();
      if (window.LegacyBridge.showNewRoot) window.LegacyBridge.showNewRoot();
    }
  } catch (e) {}
  if (window.MathLabGames && window.MathLabGames.mount) {
    try { window.MathLabGames.mount(APP_ID); return; } catch (e) {}
  }
  SineSurfingApp.mount(document.getElementById('mathlab-view'));
};

window.launchSineSurfing = window.initSineSurfing;
})();
</script>
