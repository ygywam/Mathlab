  .game-operator-sniper .rank-score { color: #6ee7b7; font-weight: 900; }
</style>
<script>
(function() {
  function calcSingle(a, b, op) {
    if (op === '+') return a + b;
    if (op === '−' || op === '-') return a - b;
    if (op === '×' || op === '*') return a * b;
    if (op === '÷' || op === '/') {
      if (b === 0) return null;
      if (a % b !== 0) return null; // 정수 결과 보장!
      return a / b;
    }
    return null;
  }

  // 자체 2패스 사칙연산 우선순위 파서 (eval 금지!)
  function evaluateExpression(nums, ops, parenIdx) {
    let n = [...nums];
    let o = [...ops];
    let steps = [];

    // 1단계: 괄호 계산 (존재 시 가장 먼저!)
    if (parenIdx !== null && parenIdx !== undefined && parenIdx >= 0 && parenIdx < o.length) {
      const a = n[parenIdx];
      const b = n[parenIdx + 1];
      const op = o[parenIdx];
      const res = calcSingle(a, b, op);
      if (res === null) return { val: null, steps };
      steps.push(`🎯 괄호 우선 계산: (${a} ${op} ${b}) = ${res}`);
      n.splice(parenIdx, 2, res);
      o.splice(parenIdx, 1);
    }

    // 2단계: 곱셈과 나눗셈 (×, ÷ 우선 계산!)
    let i = 0;
    while (i < o.length) {
      if (o[i] === '×' || o[i] === '÷') {
        const a = n[i];
        const b = n[i + 1];
        const op = o[i];
        const res = calcSingle(a, b, op);
        if (res === null) return { val: null, steps };
        steps.push(`⚡ 곱셈·나눗셈 우선: ${a} ${op} ${b} = ${res}`);
        n.splice(i, 2, res);
        o.splice(i, 1);
      } else {
        i++;
      }
    }

    // 3단계: 덧셈과 뺄셈 (+, −)
    i = 0;
    while (i < o.length) {
      const a = n[i];
      const b = n[i + 1];
      const op = o[i];
      const res = calcSingle(a, b, op);
      if (res === null) return { val: null, steps };
      steps.push(`➕ 덧셈·뺄셈 계산: ${a} ${op} ${b} = ${res}`);
      n.splice(i, 2, res);
      o.splice(i, 1);
    }

    return { val: n[0], steps };
  }

  const OperatorSniper = {
    id: 'operator-sniper',
    container: null,
    state: {
      difficulty: 'easy', // 'easy', 'normal', 'hard'
      roundIdx: 0,
      maxRounds: 10,
      score: 0,
      combo: 0,
      lives: 3,
      nums: [],
      userOps: [], // length is nums.length - 1
      parenIdx: null,
      targetValue: 0,
      selectedSlotIdx: 0,
      timer: 60,
      isAnswered: false,
      isGameOver: false,
      hintUsed: false,
      startTime: 0
    },
    timers: [],
    timerId: null,

    mount(container, context) {
      let target = null;
      if (typeof container === 'string') target = document.querySelector(container);
      else if (container instanceof HTMLElement) target = container;
      if (!target) target = document.getElementById('mathlab-view') || document.getElementById('new-root') || document.getElementById('game-container');

      // 💡 [자가 복구 엔진] 컨테이너가 없거나 가려져 있다면, 100% 보이는 전용 도화지 생성!
      if (!target || target === document.body) {
        let host = document.getElementById('operator-sniper-force-host');
        if (!host) {
          host = document.createElement('div'); host.id = 'operator-sniper-force-host';
          host.style.cssText = 'width:100%; max-width:960px; margin:0 auto; padding:20px 10px; box-sizing:border-box; z-index:999; position:relative; background:#090d16; min-height:650px; display:block; border-radius:24px;';
          const header = document.querySelector('header, .navbar, #app-header, .top-bar');
          if (header && header.parentNode) header.parentNode.insertBefore(host, header.nextSibling);
          else document.body.appendChild(host);
        }
        target = host;
      }

      this.container = target;
      this.container.style.display = 'block'; this.container.style.visibility = 'visible'; this.container.style.opacity = '1'; this.container.style.minHeight = '650px';

      let parent = this.container.parentElement;
      while (parent && parent !== document.body && parent !== document.documentElement) {
        if (parent.style && parent.style.display === 'none') parent.style.display = 'block';
        if (parent.style && parent.style.visibility === 'hidden') parent.style.visibility = 'visible';
        parent = parent.parentElement;
      }

      this.restoreGlobalNavigation();
      this.resetGame();
    },

    restoreGlobalNavigation() {
      const navElements = document.querySelectorAll('header, .navbar, #app-header, .top-bar, #floating-home-btn, .floating-home, [id*="home"], [class*="floating"]');
      navElements.forEach(el => { if (el && el.style && el.style.display === 'none') el.style.display = ''; });
    },

    setDifficulty(diff) {
      if (this.state.difficulty === diff && !this.state.isGameOver && this.state.roundIdx === 0) return;
      this.state.difficulty = diff;
      this.resetGame();
    },

    resetGame() {
      if (window.MathLabCleanup && typeof window.MathLabCleanup.clearTimers === 'function') {
        window.MathLabCleanup.clearTimers(this.timers);
      }
      this.timers.forEach(clearTimeout);
      this.timers = [];
      if (this.timerId) { clearInterval(this.timerId); this.timerId = null; }
      
      this.state.roundIdx = 0;
      this.state.score = 0;
      this.state.combo = 0;
      this.state.lives = 3;
      this.state.isGameOver = false;
      
      this.setupRound();
    },
    
    setupRound() {
      if (this.state.roundIdx >= this.state.maxRounds || this.state.lives <= 0) {
        this.gameOver(this.state.lives > 0);
        return;
      }

      if (this.timerId) { clearInterval(this.timerId); this.timerId = null; }

      this.state.hintUsed = false;
      this.state.isAnswered = false;
      this.state.startTime = Date.now();
      this.state.selectedSlotIdx = 0;

      // 난이도별 문제 생성 & 전수 검증
      let numCount = 3; // 연산자 2개
      let availableOps = ['+', '−', '×'];
      this.state.parenIdx = null;

      if (this.state.difficulty === 'normal') {
        numCount = Math.random() > 0.4 ? 4 : 3; // 연산자 2~3개
        availableOps = ['+', '−', '×', '÷'];
      } else if (this.state.difficulty === 'hard') {
        numCount = 4; // 연산자 3개
        availableOps = ['+', '−', '×', '÷'];
        if (Math.random() > 0.4) this.state.parenIdx = Math.floor(Math.random() * 2); // 0 또는 1번 위치 괄호
        
        // 속사 모드 타이머
        this.state.timer = 40;
        this.timerId = setInterval(() => {
          if (this.state.isAnswered || this.state.isGameOver) return;
          this.state.timer--;
          this.updateTimerUI();
          if (this.state.timer <= 0) {
            clearInterval(this.timerId); this.timerId = null;
            this.handleTimeout();
          }
        }, 1000);
      }

      // 해가 존재하는 정수 조합 찾기 (전수 탐색)
      let found = false;
      let attempt = 0;
      while (!found && attempt < 200) {
        attempt++;
        const testNums = [];
        for (let j = 0; j < numCount; j++) {
          testNums.push(Math.floor(Math.random() * 10) + 1);
        }

        // 가능한 연산자 조합 생성
        const combinations = [];
        const genCombos = (curr) => {
          if (curr.length === numCount - 1) { combinations.push(curr); return; }
          for (let op of availableOps) genCombos([...curr, op]);
        };
        genCombos([]);

        const validResults = [];
        for (let c of combinations) {
          const evalRes = evaluateExpression(testNums, c, this.state.parenIdx);
          if (evalRes.val !== null && Number.isInteger(evalRes.val) && evalRes.val >= -30 && evalRes.val <= 100) {
            validResults.push({ ops: c, val: evalRes.val });
          }
        }

        if (validResults.length > 0) {
          // 목표값 채택
          const chosen = validResults[Math.floor(Math.random() * validResults.length)];
          this.state.nums = testNums;
          this.state.targetValue = chosen.val;
          this.state.userOps = new Array(numCount - 1).fill(null);
          found = true;
        }
      }

      this.render();
    },

    updateTimerUI() {
      const el = this.container?.querySelector('.stat-badge.timer');
      const valEl = el?.querySelector('.timer-val');
      if (valEl) valEl.textContent = `${this.state.timer}초`;
    },

    handleTimeout() {
      this.state.isAnswered = true;
      this.state.combo = 0;
      this.state.lives--;
      this.state.score = Math.max(0, this.state.score - 5);

      const resArea = this.container?.querySelector('.result-area');
      if (resArea) {
        resArea.className = 'result-area show error';
        resArea.innerHTML = `⏰ <strong>속사 시간 초과! 타겟을 놓쳤습니다! (생명 -1)</strong><br>제한 시간 내에 모든 물음표를 저격해야 합니다.`;
      }
      this.updateStatsUI();

      const t = setTimeout(() => {
        if (this.state.lives <= 0) this.gameOver(false);
        else this.setupRound();
      }, 2000);
      this.timers.push(t);
    },

    selectSlot(idx) {
      if (this.state.isAnswered || this.state.isGameOver) return;
      this.state.selectedSlotIdx = idx;
      this.updateSlotsUI();
    },

    loadAmmo(op) {
      if (this.state.isAnswered || this.state.isGameOver) return;
      this.state.userOps[this.state.selectedSlotIdx] = op;
      
      // 자동으로 다음 빈 슬롯으로 조준 이동
      let nextIdx = this.state.selectedSlotIdx + 1;
      if (nextIdx >= this.state.userOps.length) {
        const firstEmpty = this.state.userOps.indexOf(null);
        if (firstEmpty !== -1) nextIdx = firstEmpty;
      }
      if (nextIdx < this.state.userOps.length) this.state.selectedSlotIdx = nextIdx;
      
      this.updateSlotsUI();
    },

    updateSlotsUI() {
      const root = this.container?.querySelector('.game-operator-sniper');
      if (!root) return;
      
      const slots = root.querySelectorAll('.op-slot');
      slots.forEach((el, idx) => {
        el.className = 'op-slot';
        if (idx === this.state.selectedSlotIdx) el.classList.add('selected');
        if (this.state.userOps[idx]) {
          el.classList.add('filled');
          el.textContent = this.state.userOps[idx];
        } else {
          el.textContent = '?';
        }
      });

      const btnFire = root.querySelector('#os-btn-fire');
      if (btnFire) {
        const allFilled = !this.state.userOps.includes(null);
        btnFire.disabled = !allFilled || this.state.isAnswered;
      }
    },

    fireSniper() {
      if (this.state.isAnswered || this.state.isGameOver) return;
      if (this.state.userOps.includes(null)) return;

      this.state.isAnswered = true;
      if (this.timerId) { clearInterval(this.timerId); this.timerId = null; }

      // 전수 검증: 사용자의 연산자 조합을 직접 계산하여 목표값과 일치하는지 판정! (복수 해 인정!)
      const res = evaluateExpression(this.state.nums, this.state.userOps, this.state.parenIdx);
      const isHit = (res.val !== null && res.val === this.state.targetValue);
      const resArea = this.container.querySelector('.result-area');
      
      if (isHit) {
        let pts = 10;
        const timeDiff = (Date.now() - this.state.startTime) / 1000;
        if (timeDiff <= 5) pts += 5; // 속사 스피드 보너스
        if (this.state.hintUsed) pts = Math.max(3, pts - 5);
        
        this.state.combo++;
        if (this.state.combo >= 3) pts += 5;
        this.state.score += pts;

        if (resArea) {
          resArea.className = 'result-area show success';
          let stepsHtml = res.steps.map(s => `<li>${s}</li>`).join('');
          resArea.innerHTML = `
            🎉 🎯 <strong>스나이퍼 명중! 등식 완성! (+${pts}점)</strong><br>
            선택하신 조합으로 사칙연산 우선순위를 적용한 결과, 목표값(<strong>${this.state.targetValue}</strong>)에 정확히 도달했습니다!
            <ul class="step-list">${stepsHtml}</ul>
          `;
        }

        const t = setTimeout(() => {
          this.state.roundIdx++;
          this.setupRound();
        }, 2200);
        this.timers.push(t);
      } else {
        this.state.combo = 0;
        this.state.lives--;
        this.state.score = Math.max(0, this.state.score - 5);
        
        if (resArea) {
          resArea.className = 'result-area show error';
          let stepsHtml = res.steps.length > 0 ? res.steps.map(s => `<li>${s}</li>`).join('') : '<li>나눗셈 불능(0으로 나누기 또는 소수 발생)</li>';
          resArea.innerHTML = `
            💥 <strong>빗나감! 등식 불일치! (생명 -1)</strong><br>
            입력하신 조합을 계산한 최종 결과는 <strong>${res.val === null ? '계산 불가' : res.val}</strong>이 되어 목표값(<strong>${this.state.targetValue}</strong>)과 다릅니다!<br>
            💡 <strong>우선순위 계산 검증 과정:</strong>
            <ul class="step-list">${stepsHtml}</ul>
          `;
        }

        const t = setTimeout(() => {
          if (this.state.lives <= 0) {
            this.gameOver(false);
          } else {
            this.state.isAnswered = false;
            this.render();
          }
        }, 3000);
        this.timers.push(t);
      }

      this.updateStatsUI();
      this.updateSlotsUI();
    },

    gameOver(cleared) {
      if (cleared && !this.state.isGameOver) {
        this.state.score += 50; // 클리어 보너스
      }
      this.state.isGameOver = true;
      if (this.timerId) { clearInterval(this.timerId); this.timerId = null; }
      this.render();
      
      if (this.state.score > 0) {
        const t = setTimeout(() => {
          this.showInlineRankingModal('board-operator-sniper', this.state.score, { cleared: cleared, difficulty: this.state.difficulty });
        }, 600);
        this.timers.push(t);
      }
    },

              <div class="card" style="padding:16px;">
                <button class="btn-secondary" style="width:100%; margin-bottom:12px; padding:12px;" id="os-btn-restart-side">🔄 처음부터 다시 작전 개시</button>
                <button class="btn-secondary" style="width:100%; padding:12px; background:#059669; color:#ffffff; border:none;" id="os-btn-home">🏠 홈으로</button>
              </div>
            </div>
          </div>
        </div>
      `;
      
      this.container.innerHTML = html;
      this.bindEvents();
      this.updateSlotsUI();
      this.loadLeaderboard();
    },

    bindEvents() {
      const root = this.container?.querySelector('.game-operator-sniper');
      if (!root) return;
      
      const btnHowToTop = root.querySelector('#os-btn-howto-top');
      if (btnHowToTop) btnHowToTop.addEventListener('click', () => this.showHowToPlayModal());

      root.querySelectorAll('.diff-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const diff = btn.getAttribute('data-diff');
          this.setDifficulty(diff);
        });
      });

      root.querySelectorAll('.op-slot').forEach(el => {
        el.addEventListener('click', () => {
          const idx = parseInt(el.getAttribute('data-idx'), 10);
          this.selectSlot(idx);
        });
      });

      root.querySelectorAll('.btn-ammo').forEach(btn => {
        btn.addEventListener('click', () => {
          const op = btn.getAttribute('data-op');
          this.loadAmmo(op);
        });
      });

      const btnFire = root.querySelector('#os-btn-fire');
      if (btnFire) btnFire.addEventListener('click', () => this.fireSniper());

      const btnHint = root.querySelector('#os-btn-hint');
      if (btnHint) btnHint.addEventListener('click', () => {
        this.state.hintUsed = true;
        
        // 전수 검증으로 가능한 올바른 연산자 조합 중 하나를 찾아 힌트 제공
        const availableOps = ['+', '−', '×', '÷'];
        const combinations = [];
        const genCombos = (curr) => {
          if (curr.length === this.state.userOps.length) { combinations.push(curr); return; }
          for (let op of availableOps) genCombos([...curr, op]);
        };
        genCombos([]);

        const validCombos = combinations.filter(c => {
          const res = evaluateExpression(this.state.nums, c, this.state.parenIdx);
          return res.val === this.state.targetValue;
        });

        if (validCombos.length > 0) {
          const sol = validCombos[0];
          // 첫 번째 또는 현재 빈 슬롯에 정답 연산자 채우기
          let targetSlot = this.state.selectedSlotIdx;
          this.state.userOps[targetSlot] = sol[targetSlot];
          this.updateSlotsUI();
        }
        
        btnHint.disabled = true;
      });
      
      const btnResetRound = root.querySelector('#os-btn-reset-round');
      if (btnResetRound) btnResetRound.addEventListener('click', () => this.setupRound());

      const btnRestartBig = root.querySelector('#os-btn-restart-big');
      if (btnRestartBig) btnRestartBig.addEventListener('click', () => this.resetGame());
      
      const btnRestartSide = root.querySelector('#os-btn-restart-side');
      if (btnRestartSide) btnRestartSide.addEventListener('click', () => this.resetGame());

      // 키보드 사칙연산 키 입력 지원 (+, -, *, /)
      const keyHandler = (e) => {
        if (!this.container || !document.body.contains(this.container)) {
          window.removeEventListener('keydown', keyHandler);
          return;
        }
        if (this.state.isAnswered || this.state.isGameOver) return;

        if (e.key === '+' || e.key === '=' ) this.loadAmmo('+');
        else if (e.key === '-' || e.key === '_') this.loadAmmo('−');
        else if (e.key === '*' || e.key === 'x' || e.key === 'X') this.loadAmmo('×');
        else if (e.key === '/' || e.key === '?') this.loadAmmo('÷');
        else if (e.key === 'Enter') {
          if (!this.state.userOps.includes(null)) this.fireSniper();
        } else if (e.key === 'ArrowRight' || e.key === 'Tab') {
          e.preventDefault();
          this.selectSlot((this.state.selectedSlotIdx + 1) % this.state.userOps.length);
        } else if (e.key === 'ArrowLeft') {
          e.preventDefault();
          this.selectSlot((this.state.selectedSlotIdx - 1 + this.state.userOps.length) % this.state.userOps.length);
        }
      };
      window.removeEventListener('keydown', this._keyHandler);
      this._keyHandler = keyHandler;
      window.addEventListener('keydown', this._keyHandler);

      const btnHome = root.querySelector('#os-btn-home');
      if (btnHome) {
        btnHome.addEventListener('click', (e) => {
          e.preventDefault();
          const topBottomHome = document.getElementById('mathlab-floating-home') || document.querySelector('#legacy-back-home-btn') || document.querySelector('.floating-home');
          if (topBottomHome) topBottomHome.click();
          else if (typeof window.MathLabRenderHome === 'function') window.MathLabRenderHome();
          else if (typeof window.goHome === 'function') window.goHome();
          else location.reload();
        });
      }
    },
    
    loadLeaderboard() {
      try {
        if (typeof window.loadGameLeaderboard === 'function') {
          window.loadGameLeaderboard('연산자 블라인드 스나이퍼', true, 'board-operator-sniper');
        } else {
          const localRanks = JSON.parse(localStorage.getItem('rank_board-operator-sniper') || '[]');
          this.renderRankList(localRanks.slice(0, 5));
        }
      } catch (e) {
        console.error('[OperatorSniper] 명예의 전당 로드 오류:', e);
        const localRanks = JSON.parse(localStorage.getItem('rank_board-operator-sniper') || '[]');
        this.renderRankList(localRanks.slice(0, 5));
      }
    },

    renderRankList(ranks) {
      const el = this.container?.querySelector('#board-operator-sniper');
      if (!el) return;

      if (!ranks || ranks.length === 0) {
        el.innerHTML = '<div style="text-align:center; color:#64748b; padding: 12px 0;">아직 등록된 랭킹이 없습니다. 첫 주인공이 되어보세요!</div>';
        return;
      }

      const escapeHTML = (str) => {
        if (!str) return '';
        return String(str).replace(/[&<>"']/g, function(match) {
          const escape = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
          return escape[match];
        });
      };
      el.innerHTML = ranks.map((r, i) => `
        <div class="rank-item">
          <div><span class="rank-num">${i + 1}위</span> ${escapeHTML(r.nickname || '익명')}</div>
          <div class="rank-score">${r.score || 0}점</div>
        </div>
      `).join('');
    },

    destroy() {
      if (window.MathLabCleanup && typeof window.MathLabCleanup.clearTimers === 'function') {
        window.MathLabCleanup.clearTimers(this.timers);
      }
      this.timers.forEach(clearTimeout);
      this.timers = [];
      if (this.timerId) { clearInterval(this.timerId); this.timerId = null; }
      if (this._keyHandler) window.removeEventListener('keydown', this._keyHandler);
      document.getElementById('mathlab-inline-ranking-modal')?.remove();
      document.getElementById('mathlab-os-howto-modal')?.remove();
      const host = document.getElementById('operator-sniper-force-host'); if (host) host.remove();
      if (this.container) this.container.innerHTML = '';
      this.container = null;
    }
  };

  if (!window.MathLabGames) {
    window.MathLabGames = {
      registry: {},
      register(app) { this.registry[app.id] = app; },
      get(id) { return this.registry[id]; },
      mount(id, container, context) {
        if (this.registry[id]) this.registry[id].mount(container, context);
      }
    };
  }
  
  if (typeof window.MathLabGames.register === 'function') {
    if (!window.MathLabGames.get?.('operator-sniper')) {
      window.MathLabGames.register(OperatorSniper);
    }
  }

  window.launchOperatorSniperGame = function() {
    if (typeof window.MathLabGames !== 'undefined' && typeof window.MathLabGames.mount === 'function') {
      try {
        window.MathLabGames.mount('operator-sniper');
        return;
      } catch(e) {
        console.warn('MathLabGames mount 실패, 직접 마운트 시도:', e);
      }
    }
    const target = document.getElementById('mathlab-view') || document.getElementById('new-root') || document.body;
    OperatorSniper.mount(target);
  };
})();
</script>
